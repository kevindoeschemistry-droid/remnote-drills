name: Build plugin

# Every push and pull request: check versions, run the full test suite, build
# dist/ and PluginZip.zip, and keep the zip as a downloadable artifact.
# A tag like v0.28.0 also publishes the zip as a GitHub Release, ready for
# RemNote -> Plugins -> Build -> Upload plugin.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # the programming drills (pr-*.yaml) are checked by compiling and running their Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install sympy mpmath numpy

      - name: Versions agree (package.json, pluginManifest, public/manifest.json, tag)
        run: node scripts/check-version.mjs

      - name: Type check
        run: npm run check-types

      - name: Test (every template x 30 seeds, then the sympy verifier)
        run: npm test

      - name: Build
        run: npm run build

      - name: Keep PluginZip.zip
        uses: actions/upload-artifact@v4
        with:
          name: PluginZip
          path: PluginZip.zip
          if-no-files-found: error

      # After a green build of main, publish the question bank to the `content` branch: the plugin loads it
      # on start (src/drills/content.ts), so new drills reach RemNote without uploading the plugin again.
      # One orphan commit, force-pushed: the branch holds the manifest, this bank and the previous one.
      - name: Publish the question bank
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          rm -rf /tmp/prev /tmp/bank
          git clone --quiet --depth 1 --branch content "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/prev || mkdir -p /tmp/prev
          node scripts/publish-content.mjs /tmp/bank /tmp/prev
          cd /tmp/bank
          git init --quiet
          git checkout --quiet --orphan content
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit --quiet -m "Question bank from ${GITHUB_SHA::7}"
          git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" content

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" PluginZip.zip --title "$GITHUB_REF_NAME" --generate-notes

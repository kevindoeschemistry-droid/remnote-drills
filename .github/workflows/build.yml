name: Build plugin

# Every push and pull request: check versions, run the full test suite, build
# dist/ and PluginZip.zip, and keep the zip as a downloadable artifact.
# A tag like v0.28.0 also publishes the zip as a GitHub Release, ready for
# RemNote -> Plugins -> Build -> Upload plugin.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install sympy mpmath

      - name: Versions agree (package.json, pluginManifest, public/manifest.json, tag)
        run: node scripts/check-version.mjs

      - name: Type check
        run: npm run check-types

      - name: Test (every template x 30 seeds, then the sympy verifier)
        run: npm test

      - name: Build
        run: npm run build

      - name: Keep PluginZip.zip
        uses: actions/upload-artifact@v4
        with:
          name: PluginZip
          path: PluginZip.zip
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" PluginZip.zip --title "$GITHUB_REF_NAME" --generate-notes

# How textbook PDFs are filed in RemNote ("Drills: Organize textbook PDFs").
# Subject documents are created at the top level; each recognised PDF is renamed
# "Author — Title (Ne)" and moved inside its subject. Nothing is ever deleted.
subjects:
  - "Heat Transfer"
  - "Engineering Math (ODEs)"
  - "Linear Algebra"
  - "Thermo & Stat Mech"
  - "Physical Chemistry"
  - "Mathematics (K–12)"

# drill topics (skills.yaml domains) -> subject: cards live in  Subject › Drills › topic › skill
domains:
  calc: "Engineering Math (ODEs)"
  ode1: "Engineering Math (ODEs)"
  ode2: "Engineering Math (ODEs)"
  odesys: "Engineering Math (ODEs)"
  series: "Engineering Math (ODEs)"
  laplace: "Engineering Math (ODEs)"
  bvp: "Engineering Math (ODEs)"
  pde: "Engineering Math (ODEs)"
  la: "Linear Algebra"
  ht: "Heat Transfer"
  thermo: "Thermo & Stat Mech"
  stat: "Thermo & Stat Mech"
  k8: "Mathematics (K–12)"
  alg: "Mathematics (K–12)"
  geo: "Mathematics (K–12)"
  trig: "Mathematics (K–12)"
  stats: "Mathematics (K–12)"

# course textbooks (drills/sources) -> subject
books:
  incropera-8e: "Heat Transfer"
  kreyszig-10e: "Engineering Math (ODEs)"
  lay-5e: "Linear Algebra"
  dill-bromberg-2e: "Thermo & Stat Mech"
  shell-2015: "Thermo & Stat Mech"
  openstax-prealgebra-2e: "Mathematics (K–12)"
  openstax-algebra-trig-2e: "Mathematics (K–12)"
  openstax-intro-stats-2e: "Mathematics (K–12)"

# other PDFs: every word in `match` must appear in the PDF's name
extras:
  - { match: [mcquarrie], name: "McQuarrie & Simon — Physical Chemistry: A Molecular Approach", subject: "Physical Chemistry" }
  - { match: [interactive, linear, algebra], name: "Margalit & Rabinoff — Interactive Linear Algebra", subject: "Linear Algebra" }

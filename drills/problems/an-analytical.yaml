- template: an-uncertainty
  skill: anal.measurement
  pace: quick
  cases:
  - kind: prod
    a: 2.5
    sa: 0.02
    b: 4.1
    sb: 0.03
    text: y = a × b
    ask: relative uncertainty in y (as a fraction)
    ans: 0.010841566298
  - kind: quot
    a: 0.452
    sa: 0.0003
    b: 25.0
    sb: 0.03
    text: y = a / b
    ask: relative uncertainty in y (as a fraction)
    ans: 0.001371320535
  - kind: sum
    a: 12.35
    sa: 0.02
    b: 4.18
    sb: 0.01
    text: y = a + b
    ask: absolute uncertainty in y
    ans: 0.022360679775
  - kind: quot
    a: 18.24
    sa: 0.02
    b: 0.1022
    sb: 0.0002
    text: y = a / b
    ask: relative uncertainty in y (as a fraction)
    ans: 0.002243197541
  - kind: sum
    a: 50.0
    sa: 0.05
    b: 25.0
    sb: 0.03
    text: y = a − b
    ask: absolute uncertainty in y
    ans: 0.058309518948
  prompt: a = {{a}} ± {{sa}} and b = {{b}} ± {{sb}} (independent random errors). For {{text}}, what is the {{ask}}?
  parts:
  - ask: Uncertainty
    label: y
    value: ans
    tol: 0.001
    explain: Sums and differences add absolute uncertainties in quadrature; products and quotients add relative uncertainties in quadrature. Both are the general rule σ_y² = Σ(∂y/∂xᵢ)²σᵢ² applied to the
      two cases
  verify:
    expect:
      y: rel_unc(kind, a, sa, b, sb)
- template: an-instrument
  skill: anal.measurement
  pace: recall
  cases:
  - k: trace lead in drinking water
    o1: ICP-MS
    o2: Karl Fischer titration
    o3: GC
    o4: HPLC
    ans: 0
  - k: residual solvents in a drug
    o1: atomic emission (flame photometry)
    o2: Karl Fischer titration
    o3: GC
    o4: IR spectroscopy
    ans: 2
  - k: a non-volatile drug and its impurities
    o1: atomic emission (flame photometry)
    o2: ICP-MS
    o3: Karl Fischer titration
    o4: HPLC
    ans: 3
  - k: water content of an oil
    o1: IR spectroscopy
    o2: Karl Fischer titration
    o3: HPLC
    o4: mass spectrometry
    ans: 1
  - k: functional groups of an unknown
    o1: IR spectroscopy
    o2: mass spectrometry
    o3: atomic emission (flame photometry)
    o4: ICP-MS
    ans: 0
  - k: connectivity of an organic unknown
    o1: atomic emission (flame photometry)
    o2: GC
    o3: NMR spectroscopy
    o4: mass spectrometry
    ans: 2
  - k: molar mass of a protein
    o1: atomic emission (flame photometry)
    o2: HPLC
    o3: GC
    o4: mass spectrometry
    ans: 3
  - k: sodium in serum
    o1: IR spectroscopy
    o2: HPLC
    o3: atomic emission (flame photometry)
    o4: NMR spectroscopy
    ans: 2
  prompt: 'Which technique fits best: {{k}}?'
  parts:
  - ask: Answer
    label: y
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: ans
    explain: 'Match the question to the property measured: elements at trace level by atomic spectrometry (ICP-MS lowest), volatile organics by GC, non-volatile or thermally fragile ones by HPLC, structure
      by NMR and IR, mass by MS, water specifically by Karl Fischer'
  verify:
    choices:
      y: fact_pick("instrument", k, o1, o2, o3, o4)

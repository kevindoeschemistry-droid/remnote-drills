    name: 0.1 M HCl with 0.1 M NaOH
    ans: 2
  prompt: Which indicator suits the titration of {{name}}?
  parts:
  - ask: Answer
    label: y
    choice:
    - methyl orange (3.1–4.4)
    - methyl red (4.4–6.2)
    - bromothymol blue (6.0–7.6)
    - phenolphthalein (8.2–10.0)
    correct: ans
    explain: Choose an indicator whose colour change brackets the equivalence-point pH. A weak acid with strong base ends above 7 (conjugate base), so phenolphthalein; strong acid with strong base ends
      at 7, where the curve is so steep that bromothymol blue (and in practice phenolphthalein or methyl red) all work
  verify:
    choices:
      y: indicator_pick(nsimplify('0.1'), 25, Ka, nsimplify('0.1'), 25)

  parts:
  - ask: s (M)
    label: y
    value: ans
    tol: 0.001
    explain: s(s + c) = K_sp. When c ≫ s the shortcut s ≈ K_sp/c is fine; at trace levels of the common ion keep the quadratic, s = [−c + √(c² + 4K_sp)]/2

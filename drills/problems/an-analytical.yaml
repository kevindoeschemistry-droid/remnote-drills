    - 8
    - 10
    ys:
    - 0.15
    - 0.31
    - 0.44
    - 0.62
    - 0.76
    xt: 2, 4, 6, 8, 10
    yt: 0.15, 0.31, 0.44, 0.62, 0.76
    y0: 0.53
    ans: 6.9673202614379
  prompt: Standards at {{xt}} ppm read {{yt}}. An unknown reads {{y0}}. Using the least-squares line, what is the unknown's concentration (ppm)?
  parts:
  - ask: c (ppm)
    label: y
    value: ans
    tol: 0.001
    explain: Slope m = (nΣxy − ΣxΣy)/(nΣx² − (Σx)²), intercept b = (Σy − mΣx)/n, then x = (y − b)/m. Read unknowns inside the calibrated range only
  verify:
    expect:
      y: calib_unknown(xs, ys, y0)

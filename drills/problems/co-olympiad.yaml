  prompt: N₂O₄ ⇌ 2NO₂ has K_p = {{Kp}} (bar). Pure N₂O₄ is held at a total pressure of {{P}} bar. What fraction dissociates at equilibrium?
  parts:
  - ask: α
    label: y
    value: ans
    tol: 0.0005
    explain: 'Per mole N₂O₄: 1 − α and 2α, total 1 + α. Then K_p = 4α²P/(1 − α²), so α = √(K_p/(4P + K_p)). Lower pressure, more dissociation: Le Chatelier in numbers'
  verify:
    expect:
      y: n2o4_alpha(Kp, P)

# Builds drills/problems/mvd-depth.yaml: multivariable calculus in depth (CA units 12-14, MIT 18.02
# units 2-4). Run: python3 scripts/mvd_cases.py
# 
# Each template carries many cases (different functions, regions, curves, surfaces), not one problem
# with new numbers. Answers are computed here with sympy along the route the card teaches (Green,
# Stokes, the divergence theorem, polar or spherical coordinates...); tests/verify/mvcalc.py checks
# them along a different route (the line or surface integral itself, the original coordinates).
# Setup cards show four integrals (A-D) in the prompt; exactly one equals the target, which the
# generator asserts and the verifier re-checks.
# GENERATED: edit scripts/mvd_cases.py, not this file.

- template: mvd-partial
  skill: calc.multivariable
  pace: quick
  cases:
  - {ftex: x^2 y^3 + 4xy, f: x**2*y**3 + 4*x*y, w: x, px: 1, py: 2, ans: 24.0}
  - {ftex: x^2 y^3 + 4xy, f: x**2*y**3 + 4*x*y, w: y, px: 1, py: 2, ans: 16.0}
  - {ftex: 'e^{xy}', f: exp(x*y), w: y, px: 1, py: 0, ans: 1.0}
  - {ftex: \ln(x^2 + y^2), f: log(x**2 + y**2), w: x, px: 1, py: 2, ans: 0.4}
  - {ftex: \ln(x^2 + y^2), f: log(x**2 + y**2), w: y, px: 1, py: 2, ans: 0.8}
  - {ftex: \sin(x y^2), f: sin(x*y**2), w: x, px: 0, py: 3, ans: 9.0}
  - {ftex: '\dfrac{x}{y}', f: x/y, w: x, px: 3, py: 2, ans: 0.5}
  - {ftex: '\dfrac{x}{y}', f: x/y, w: y, px: 3, py: 2, ans: -0.75}
  - {ftex: 'x\sqrt{y}', f: x*sqrt(y), w: x, px: 2, py: 4, ans: 2.0}
  - {ftex: 'x\sqrt{y}', f: x*sqrt(y), w: y, px: 2, py: 4, ans: 0.5}
  - {ftex: x^3 - 5xy + y^2, f: x**3 - 5*x*y + y**2, w: x, px: 2, py: -1, ans: 17.0}
  - {ftex: x^3 - 5xy + y^2, f: x**3 - 5*x*y + y**2, w: y, px: 2, py: -1, ans: -12.0}
  - {ftex: \arctan(y/x), f: atan(y/x), w: x, px: 1, py: 1, ans: -0.5}
  - {ftex: \arctan(y/x), f: atan(y/x), w: y, px: 1, py: 1, ans: 0.5}
  prompt: For $f(x, y) = {{ftex}}$, what is $f_{ {{w}} }({{px}}, {{py}})$?
  parts:
  - {ask: Partial derivative, label: a, value: ans, tol: 0.0001, explain: 'Differentiate in that variable alone, treating the other as a constant, then substitute the point. $f_x$ is the slope of the surface in the $x$ direction'}
  verify:
    expect: {a: 'mv_at(mv_d(f, w), px, py)'}
- template: mvd-mixed
  skill: calc.multivariable
  pace: quick
  cases:
  - {ftex: x^3 y^2, f: x**3*y**2, px: 1, py: 2, ans: 12.0}
  - {ftex: 'e^{2x}\sin y', f: exp(2*x)*sin(y), px: 0, py: 0, ans: 2.0}
  - {ftex: 'x^2 e^{y}', f: x**2*exp(y), px: 1, py: 0, ans: 2.0}
  - {ftex: 'y^2 \sqrt{x}', f: y**2*sqrt(x), px: 4, py: 1, ans: 0.5}
  prompt: For $f(x, y) = {{ftex}}$, what is $f_{xy}({{px}}, {{py}})$?
  parts:
  - {ask: Mixed partial, label: a, value: ans, tol: 0.0001, explain: 'Differentiate in $x$, then in $y$ (or the other order: by Clairaut''s theorem the mixed partials agree when they are continuous)'}
  verify:
    expect: {a: 'mv_at(mv_d(f, ''y'', ''x''), px, py)'}
- template: mvd-directional
  skill: calc.partials-apps
  pace: quick
  cases:
  - {ftex: x^2 + 3xy, f: x**2 + 3*x*y, px: 1, py: 1, va: 3, vb: 4, ans: 5.4}
  - {ftex: 'x e^{y}', f: x*exp(y), px: 2, py: 0, va: 1, vb: 1, ans: 2.1213203435596424}
  - {ftex: \sin(x) + \cos(y), f: sin(x) + cos(y), px: 0, py: 0, va: 1, vb: 2, ans: 0.4472135954999579}
  - {ftex: x^2 y, f: x**2*y, px: 1, py: 2, va: -1, vb: 1, ans: -2.1213203435596424}
  - {ftex: \ln(x^2 + y^2), f: log(x**2 + y**2), px: 1, py: 1, va: 1, vb: 0, ans: 1.0}
  - {ftex: xy^2, f: x*y**2, px: 2, py: 1, va: 0, vb: -1, ans: -4.0}
  - {ftex: 4 - x^2 - y^2, f: 4 - x**2 - y**2, px: 1, py: 1, va: 1, vb: 1, ans: -2.8284271247461903}
  prompt: What is the directional derivative of $f(x, y) = {{ftex}}$ at $({{px}}, {{py}})$ in the direction of $\langle {{va}}, {{vb}} \rangle$?
  parts:
  - {ask: Directional derivative, label: a, value: ans, tol: 0.0001, explain: '$D_{\mathbf u}f = \nabla f\cdot\mathbf u$ with $\mathbf u$ a unit vector: divide the given direction by its length first. Forgetting to normalise is the usual error'}
  verify:
    expect: {a: '(mv_at(mv_d(f, ''x''), px, py)*va + mv_at(mv_d(f, ''y''), px, py)*vb)/sqrt(va**2 + vb**2)'}
- template: mvd-max-rate
  skill: calc.partials-apps
  pace: quick
  cases:
  - {ftex: x^2 + 3xy, f: x**2 + 3*x*y, px: 1, py: 1, ans: 5.830951894845301}
  - {ftex: 'x e^{y}', f: x*exp(y), px: 2, py: 0, ans: 2.23606797749979}
  - {ftex: x^2 y, f: x**2*y, px: 1, py: 2, ans: 4.123105625617661}
  - {ftex: \ln(x^2 + y^2), f: log(x**2 + y**2), px: 1, py: 2, ans: 0.8944271909999159}
  - {ftex: 4 - x^2 - 2y^2, f: 4 - x**2 - 2*y**2, px: 1, py: 1, ans: 4.47213595499958}
  - {ftex: xy^2, f: x*y**2, px: 2, py: 1, ans: 4.123105625617661}
  prompt: At $({{px}}, {{py}})$, what is the greatest rate of increase of $f(x, y) = {{ftex}}$?
  parts:
  - {ask: Maximum rate, label: a, value: ans, tol: 0.0001, explain: '$f$ increases fastest in the direction of $\nabla f$, at the rate $|\nabla f|$; it decreases fastest in the opposite direction, and does not change along the level curve (perpendicular to $\nabla f$)'}
  verify:
    expect: {a: 'sqrt(mv_at(mv_d(f, ''x''), px, py)**2 + mv_at(mv_d(f, ''y''), px, py)**2)'}
- template: mvd-level-slope
  skill: calc.partials-apps
  pace: quick
  cases:
  - {ftex: x^2 + 4y^2, f: x**2 + 4*y**2, px: 2, py: 1, ans: -0.5}
  - {ftex: xy, f: x*y, px: 2, py: 3, ans: -1.5}
  - {ftex: x^2 - y^2, f: x**2 - y**2, px: 3, py: 1, ans: 3.0}
  - {ftex: x^3 + y^3, f: x**3 + y**3, px: 1, py: 2, ans: -0.25}
  - {ftex: 'y e^{x}', f: y*exp(x), px: 0, py: 2, ans: -2.0}
  - {ftex: x^2 + xy + y^2, f: x**2 + x*y + y**2, px: 1, py: 1, ans: -1.0}
  prompt: What is the slope of the level curve of $f(x, y) = {{ftex}}$ through $({{px}}, {{py}})$, at that point?
  parts:
  - {ask: Slope, label: a, value: ans, tol: 0.0001, explain: 'Along a level curve $f$ is constant, so $f_x\,dx + f_y\,dy = 0$ and $dy/dx = -f_x/f_y$. Equivalently, the tangent is perpendicular to $\nabla f$'}
  verify:
    expect: {a: '-mv_at(mv_d(f, ''x''), px, py)/mv_at(mv_d(f, ''y''), px, py)'}
- template: mvd-linearize
  skill: calc.partials-apps
  pace: quick
  cases:
  - {ftex: x^2 y, f: x**2*y, px: 2, py: 1, dx: 0.1, dy: -0.1, ans: 4.0}
  - {ftex: '\sqrt{x^2 + y^2}', f: sqrt(x**2 + y**2), px: 3, py: 4, dx: 0.1, dy: 0.2, ans: 5.22}
  - {ftex: 'e^{x}\cos y', f: exp(x)*cos(y), px: 0, py: 0, dx: 0.1, dy: 0.2, ans: 1.1}
  - {ftex: \ln(x + 2y), f: log(x + 2*y), px: 1, py: 0, dx: 0.2, dy: 0.1, ans: 0.4}
  - {ftex: xy^2, f: x*y**2, px: 1, py: 2, dx: 0.05, dy: 0.1, ans: 4.6}
  - {ftex: x^3 + y^3, f: x**3 + y**3, px: 1, py: 1, dx: -0.1, dy: 0.1, ans: 2.0}
  prompt: Use the tangent plane to $f(x, y) = {{ftex}}$ at $({{px}}, {{py}})$ to estimate $f({{px + dx}}, {{py + dy}})$.
  parts:
  - {ask: Estimate, label: a, value: ans, tol: 0.0001, explain: '$L = f(a, b) + f_x(a, b)\,\Delta x + f_y(a, b)\,\Delta y$: the tangent plane, good for small steps. The error grows with the square of the step'}
  verify:
    expect: {a: 'mv_at(f, px, py) + mv_at(mv_d(f, ''x''), px, py)*nsimplify(dx) + mv_at(mv_d(f, ''y''), px, py)*nsimplify(dy)'}
- template: mvd-tangent-plane-implicit
  skill: calc.partials-apps
  pace: quick
  cases:
  - {stex: x^2 + y^2 + z^2 = 14, F: x**2 + y**2 + z**2 - 14, px: 1, py: 2, pz: 3, na: 1, nb: 2, nc: 3, ans: 14.0}
  - {stex: x^2 + 2y^2 + 3z^2 = 6, F: x**2 + 2*y**2 + 3*z**2 - 6, px: 1, py: 1, pz: 1, na: 1, nb: 2, nc: 3, ans: 6.0}
  - {stex: xyz = 6, F: x*y*z - 6, px: 1, py: 2, pz: 3, na: 6, nb: 3, nc: 2, ans: 18.0}
  - {stex: z = x^2 + y^2, F: x**2 + y**2 - z, px: 1, py: 2, pz: 5, na: 2, nb: 4, nc: -1, ans: 5.0}
  - {stex: x^2 + y^2 - z^2 = 4, F: x**2 + y**2 - z**2 - 4, px: 2, py: 1, pz: 1, na: 2, nb: 1, nc: -1, ans: 4.0}
  - {stex: z = xy, F: x*y - z, px: 2, py: 3, pz: 6, na: 3, nb: 2, nc: -1, ans: 6.0}
  prompt: The tangent plane to the surface ${{stex}}$ at $({{px}}, {{py}}, {{pz}})$ can be written ${{na}}x + {{nb}}y + {{nc}}z = d$. What is $d$?
  parts:
  - {ask: d, label: a, value: ans, tol: 0.0001, explain: 'For a level surface $F(x, y, z) = c$ the normal is $\nabla F$. The plane is $\nabla F\cdot(\mathbf r - \mathbf r_0) = 0$, so $d = \mathbf n\cdot\mathbf r_0$. Write $z = f(x, y)$ as $f - z = 0$ first'}
  verify:
    expect: {a: na*px + nb*py + nc*pz}
- template: mvd-chain-t
  skill: calc.multivariable
  pace: quick
  cases:
  - {ztex: x^2 y, f: x**2*y, xtx: t^2, xt: t**2, ytx: 3t, yt: 3*t, t0: 1, ans: 15.0}
  - {ztex: 'e^{x} \sin y', f: exp(x)*sin(y), xtx: \ln t, xt: log(t), ytx: \pi t, yt: pi*t, t0: 1, ans: -3.141592653589793}
  - {ztex: xy + y^2, f: x*y + y**2, xtx: \cos t, xt: cos(t), ytx: \sin t, yt: sin(t), t0: 0, ans: 1.0}
  - {ztex: '\sqrt{x^2 + y^2}', f: sqrt(x**2 + y**2), xtx: 3t, xt: 3*t, ytx: 4t^2, yt: 4*t**2, t0: 1, ans: 8.2}
  - {ztex: x/y, f: x/y, xtx: t^3, xt: t**3, ytx: t + 1, yt: t + 1, t0: 1, ans: 1.25}
  - {ztex: \ln(x + y), f: log(x + y), xtx: 'e^{t}', xt: exp(t), ytx: t^2, yt: t**2, t0: 0, ans: 1.0}
  prompt: $z = {{ztex}}$ with $x = {{xtx}}$ and $y = {{ytx}}$. What is $dz/dt$ at $t = {{t0}}$?
  parts:
  - {ask: dz/dt, label: a, value: ans, tol: 0.0001, explain: '$\dfrac{dz}{dt} = z_x\dfrac{dx}{dt} + z_y\dfrac{dy}{dt}$: one term per path through the dependency tree, each evaluated at the point $(x(t_0), y(t_0))$'}
  verify:
    expect: {a: 'diff(SE(f).subs({SE(''x''): SE(xt), SE(''y''): SE(yt)}, simultaneous=True), SE(''t'')).subs(SE(''t''), t0)'}
- template: mvd-chain-partial
  skill: calc.multivariable
  pace: quick
  cases:
  - {ztex: x^2 + y^2, f: x**2 + y**2, xstx: s + t, xs: u + v, ystx: s - t, ys: u - v, s0: 1, t0: 2, ans: 4.0}
  - {ztex: xy, f: x*y, xstx: s^2 t, xs: u**2*v, ystx: s t^2, ys: u*v**2, s0: 1, t0: 1, ans: 3.0}
  - {ztex: 'e^{x + y}', f: exp(x + y), xstx: st, xs: u*v, ystx: s^2, ys: u**2, s0: 1, t0: 0, ans: 5.43656365691809}
  - {ztex: \ln(xy), f: log(x*y), xstx: s + 2t, xs: u + 2*v, ystx: 3s, ys: 3*u, s0: 1, t0: 1, ans: 1.3333333333333333}
  prompt: $z = {{ztex}}$ with $x = {{xstx}}$ and $y = {{ystx}}$. What is $\partial z/\partial s$ at $(s, t) = ({{s0}}, {{t0}})$?
  parts:
  - {ask: ∂z/∂s, label: a, value: ans, tol: 0.0001, explain: '$\dfrac{\partial z}{\partial s} = z_x\dfrac{\partial x}{\partial s} + z_y\dfrac{\partial y}{\partial s}$, holding $t$ fixed'}
  verify:
    expect: {a: 'diff(SE(f).subs({SE(''x''): SE(xs), SE(''y''): SE(ys)}, simultaneous=True), SE(''u'')).subs({SE(''u''): s0, SE(''v''): t0})'}
- template: mvd-implicit
  skill: calc.multivariable
  pace: quick
  cases:
  - {etex: x^2 + xy + y^3 = 7, F: x**2 + x*y + y**3 - 7, px: 2, py: 1, ans: -1.0}
  - {etex: x^3 + y^3 = 6xy, F: x**3 + y**3 - 6*x*y, px: 3, py: 3, ans: -1.0}
  - {etex: x \sin y + y = 1, F: x*sin(y) + y - 1, px: 0, py: 1, ans: -0.8414709848078965}
  - {etex: x^2 y^2 + y = 6, F: x**2*y**2 + y - 6, px: 1, py: 2, ans: -1.6}
  prompt: The curve ${{etex}}$ passes through $({{px}}, {{py}})$. What is $dy/dx$ there?
  parts:
  - {ask: dy/dx, label: a, value: ans, tol: 0.0001, explain: 'With $F(x, y) = 0$: $dy/dx = -F_x/F_y$ (move everything to one side first). It is the slope of the level curve $F = 0$'}
  verify:
    expect: {a: '-mv_at(mv_d(F, ''x''), px, py)/mv_at(mv_d(F, ''y''), px, py)'}
- template: mvd-classify
  skill: calc.partials-apps
  pace: quick
  cases:
  - {ftex: x^3 - 3x + y^2, f: x**3 - 3*x + y**2, px: 1, py: 0, ans: 0}
  - {ftex: x^3 - 3x + y^2, f: x**3 - 3*x + y**2, px: -1, py: 0, ans: 2}
  - {ftex: x^2 + xy + y^2 - 3x, f: x**2 + x*y + y**2 - 3*x, px: 2, py: -1, ans: 0}
  - {ftex: x^3 + y^3 - 3xy, f: x**3 + y**3 - 3*x*y, px: 0, py: 0, ans: 2}
  - {ftex: x^3 + y^3 - 3xy, f: x**3 + y**3 - 3*x*y, px: 1, py: 1, ans: 0}
  - {ftex: 4xy - x^4 - y^4, f: 4*x*y - x**4 - y**4, px: 1, py: 1, ans: 1}
  - {ftex: 4xy - x^4 - y^4, f: 4*x*y - x**4 - y**4, px: 0, py: 0, ans: 2}
  - {ftex: x^4 + y^4, f: x**4 + y**4, px: 0, py: 0, ans: 3}
  - {ftex: 2 - x^2 - y^2 + 2x, f: 2 - x**2 - y**2 + 2*x, px: 1, py: 0, ans: 1}
  - {ftex: 'e^{-(x^2 + y^2)}', f: exp(-(x**2 + y**2)), px: 0, py: 0, ans: 1}
  prompt: $({{px}}, {{py}})$ is a critical point of $f(x, y) = {{ftex}}$. What does the second derivatives test say?
  parts:
  - ask: Classification
    label: a
    choice: [Local minimum, Local maximum, Saddle point, The test is inconclusive (D = 0)]
    correct: ans
    explain: '$D = f_{xx}f_{yy} - f_{xy}^2$ at the point. $D > 0$: an extremum, a minimum if $f_{xx} > 0$ and a maximum if $f_{xx} < 0$. $D < 0$: a saddle. $D = 0$: no conclusion ($x^4 + y^4$ has a minimum there anyway)'
  verify:
    choices: {a: 'crit_class(f, px, py)'}
- template: mvd-critical-count
  skill: calc.partials-apps
  pace: quick
  cases:
  - {ftex: x^3 - 3x + y^2, f: x**3 - 3*x + y**2, ans: 2}
  - {ftex: x^3 + y^3 - 3xy, f: x**3 + y**3 - 3*x*y, ans: 2}
  - {ftex: 4xy - x^4 - y^4, f: 4*x*y - x**4 - y**4, ans: 3}
  - {ftex: x^2 + y^2 - 2x + 4y, f: x**2 + y**2 - 2*x + 4*y, ans: 1}
  - {ftex: x^3 - 12x + y^3 - 3y, f: x**3 - 12*x + y**3 - 3*y, ans: 4}
  - {ftex: x^2 y - x^2 - y^2, f: x**2*y - x**2 - y**2, ans: 3}
  prompt: How many critical points does $f(x, y) = {{ftex}}$ have?
  parts:
  - {ask: Critical points, label: a, value: ans, tol: 0.0001, explain: Solve $f_x = 0$ and $f_y = 0$ together. Factor and split into cases; a product equal to zero gives a separate branch for each factor}
  verify:
    expect: {a: n_critical(f)}
- template: mvd-lagrange
  skill: calc.partials-apps
  pace: quick
  cases:
  - {ftex: x + y, f: x + y, gtex: x^2 + y^2 = 2, g: x**2 + y**2 - 2, kind: 1, three: 0, ans: 2.0}
  - {ftex: xy, f: x*y, gtex: x + y = 10, g: x + y - 10, kind: 1, three: 0, ans: 25.0}
  - {ftex: x^2 + y^2, f: x**2 + y**2, gtex: x + 2y = 5, g: x + 2*y - 5, kind: 0, three: 0, ans: 5.0}
  - {ftex: x + 2y + 2z, f: x + 2*y + 2*z, gtex: x^2 + y^2 + z^2 = 9, g: x**2 + y**2 + z**2 - 9, kind: 1, three: 1, ans: 9.0}
  - {ftex: xyz, f: x*y*z, gtex: x + y + z = 12, g: x + y + z - 12, kind: 1, three: 1, ans: 64.0}
  - {ftex: 3x + 4y, f: 3*x + 4*y, gtex: x^2 + y^2 = 25, g: x**2 + y**2 - 25, kind: 0, three: 0, ans: -25.0}
  - {ftex: x^2 + y^2 + z^2, f: x**2 + y**2 + z**2, gtex: x + y + z = 3, g: x + y + z - 3, kind: 0, three: 1, ans: 3.0}
  - {ftex: x^2 y, f: x**2*y, gtex: x^2 + y^2 = 3, g: x**2 + y**2 - 3, kind: 1, three: 0, ans: 2.0}
  prompt: 'What is the {{kind == 1 ? "maximum" : "minimum"}} of ${{ftex}}$ subject to ${{gtex}}$?'
  parts:
  - {ask: Extreme value, label: a, value: ans, tol: 0.0001, explain: 'Solve $\nabla f = \lambda\nabla g$ with $g = 0$, list every candidate, and compare the values of $f$. At the answer the level curve of $f$ is tangent to the constraint'}
  verify:
    expect: {a: 'lagrange(f, g, kind, three == 1)'}
- template: mvd-two-path
  skill: calc.multivariable
  pace: quick
  cases:
  - {ltex: '\dfrac{xy}{x^2 + y^2}', ans: 1}
  - {ltex: '\dfrac{x^2 y}{x^4 + y^2}', ans: 1}
  - {ltex: '\dfrac{x^2 y}{x^2 + y^2}', ans: 0}
  - {ltex: '\dfrac{x^2 - y^2}{x^2 + y^2}', ans: 1}
  - {ltex: '\dfrac{\sin(x^2 + y^2)}{x^2 + y^2}', ans: 0}
  - {ltex: '\dfrac{xy^2}{x^2 + y^2}', ans: 0}
  - {ltex: '\dfrac{x y^2}{x^2 + y^4}', ans: 1}
  - {ltex: '\dfrac{3x^2 y}{x^2 + y^2}', ans: 0}
  prompt: Does $\displaystyle\lim_{(x, y)\to(0, 0)} {{ltex}}$ exist?
  parts:
  - ask: Limit
    label: a
    choice: [It exists, It does not exist]
    correct: ans
    explain: 'Try paths: along $y = mx$ and along $y = x^2$. Different answers on two paths prove there is no limit; to prove a limit exists, bound the expression (often with polar coordinates: if it is $r$ times something bounded, the limit is 0)'
  verify: {authored: true}
- template: mvd-gradient-facts
  skill: calc.partials-apps
  pace: recall
  cases:
  - {s: The gradient of f at a point is perpendicular to the level curve of f through that point., ans: 0}
  - {s: The directional derivative in the direction of the gradient equals the length of the gradient., ans: 0}
  - {s: The directional derivative along a level curve is zero., ans: 0}
  - {s: At a saddle point the gradient is nonzero., ans: 1}
  - {s: 'The gradient of f(x, y) is a vector in three-dimensional space.', ans: 1}
  - {s: 'If f_x and f_y exist at a point, f must be differentiable there.', ans: 1}
  - {s: A local maximum of a differentiable f has gradient zero., ans: 0}
  - {s: Moving opposite to the gradient decreases f fastest., ans: 0}
  prompt: 'True or false: {{s}}'
  parts:
  - ask: Answer
    label: a
    choice: ['True', 'False']
    correct: ans
    explain: The gradient points in the direction of fastest increase, has length equal to that rate, and is perpendicular to the level curve or surface through the point. Critical points are where it vanishes (or fails to exist)
  verify: {authored: true}

  - {ltex: 'the square $[0, 1]\times[0, 1]$ (density 1) about the $x$-axis, $I_x = \iint y^2\,dA$', check: 'Integral(y**2, (y, 0, 1), (x, 0, 1))', ans: 0.3333333333333333}
  - {ltex: 'the rectangle $[0, 3]\times[0, 2]$ (density 1) about the $y$-axis, $I_y = \iint x^2\,dA$', check: 'Integral(x**2, (y, 0, 2), (x, 0, 3))', ans: 18.0}
  - {ltex: 'the triangle $(0, 0)$, $(1, 0)$, $(0, 1)$ with density $x$, about the $x$-axis', check: 'Integral(x*y**2, (y, 0, 1 - x), (x, 0, 1))', ans: 0.016666666666666666}
  - {ltex: the annulus $1 \le r \le 2$ (density 1) about its centre, check: 'Integral(x**2 + y**2, (y, -sqrt(4 - x**2), sqrt(4 - x**2)), (x, -2, 2)) - Integral(x**2 + y**2, (y, -sqrt(1 - x**2), sqrt(1 - x**2)), (x, -1, 1))', ans: 23.56194490192345}
  prompt: Find the moment of inertia of {{ltex}}.

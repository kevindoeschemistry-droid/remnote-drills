- template: mvd-green-area
  skill: calc.vector-calculus
  pace: quick
  cases:
  - {ctex: 'the ellipse $x = 3\cos t$, $y = 2\sin t$', pieces: 3*cos(t)|2*sin(t)|0|2*pi, ans: 18.84955592153876}
  - {ctex: 'the astroid $x = \cos^3 t$, $y = \sin^3 t$', pieces: cos(t)**3|sin(t)**3|0|2*pi, ans: 1.1780972450961724}
  - {ctex: 'the triangle $(0, 0)$, $(4, 0)$, $(0, 3)$', pieces: 4*t|0|0|1;4 - 4*t|3*t|0|1;0|3 - 3*t|0|1, ans: 6.0}
  - {ctex: 'the cardioid-like loop $x = \cos t + \cos^2 t$, $y = \sin t + \sin t\cos t$', pieces: cos(t) + cos(t)**2|sin(t) + sin(t)*cos(t)|0|2*pi, ans: 4.71238898038469}
  - {ctex: the region between $y = x^2$ and $y = x$ (boundary run counterclockwise), pieces: t|t**2|0|1;1 - t|1 - t|0|1, ans: 0.16666666666666666}

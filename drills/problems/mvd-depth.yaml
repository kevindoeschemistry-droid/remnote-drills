  parts:
  - {ask: Coordinate, label: a, value: ans, tol: 0.0001, explain: '$\bar z = \dfrac{1}{M}\iiint z\,\delta\,dV$. Symmetry gives $\bar x = \bar y = 0$ for solids of revolution about the $z$-axis; slicing by $z$ (disc area times $dz$) is often quickest. Hemisphere: $3a/8$; cone from its tip: $3h/4$'}
  verify:
    expect: {a: quad(check)}

  - {s: 'You parametrise a closed curve clockwise instead. What happens to a circulation?', ans: 3}
  - {s: 'Your r_u × r_v points into a closed surface. What happens to the flux if you use it?', ans: 3}
  - {s: 'For a region with a hole, which way must its inner boundary run in Green''s theorem?', ans: 0}

  - {ltex: 'the solid cone $\sqrt{x^2 + y^2} \le z \le 3$ (uniform density); find $\bar z$', check: 'Integral(z*pi*z**2, (z, 0, 3))/Integral(pi*z**2, (z, 0, 3))', ans: 2.25}
  - {ltex: the solid paraboloid $x^2 + y^2 \le z \le 4$ (uniform density); find $\bar z$, check: 'Integral(z*pi*z, (z, 0, 4))/Integral(pi*z, (z, 0, 4))', ans: 2.6666666666666665}
  - {ltex: 'the cube $[0, 1]^3$ with density $\delta = z$; find $\bar z$', check: 'Integral(z*z, (z, 0, 1))/Integral(z, (z, 0, 1))', ans: 0.6666666666666666}
  - {ltex: 'the tetrahedron $x, y, z \ge 0$, $x + y + z \le 1$ (uniform density); find $\bar x$', check: 'Integral(x, (z, 0, 1 - x - y), (y, 0, 1 - x), (x, 0, 1))/Integral(1, (z, 0, 1 - x - y), (y, 0, 1 - x), (x, 0, 1))', ans: 0.25}

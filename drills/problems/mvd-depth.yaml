  parts:
  - {ask: Area, label: a, value: ans, tol: 0.0001, explain: 'Green''s theorem with $Q_x - P_y = 1$: area $= \oint_C x\,dy = -\oint_C y\,dx = \tfrac12\oint_C (x\,dy - y\,dx)$, with $C$ counterclockwise. Useful when the boundary is a parametrised curve'}

    correct: ans
    explain: 'Every big theorem comes with an orientation: Green''s needs C counterclockwise, the divergence theorem the outward normal, Stokes'' a curve and normal matched by the right-hand rule. Reversing the orientation reverses the sign'
  verify: {authored: true}

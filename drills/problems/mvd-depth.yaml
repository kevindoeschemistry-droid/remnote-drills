  - {Ftex: '\langle e^{x}\cos y,\ -e^{x}\sin y \rangle', P: exp(x)*cos(y), Q: -exp(x)*sin(y), R: '0', ans: 0}
  - {Ftex: '\langle x + y,\ x - y \rangle', P: x + y, Q: x - y, R: '0', ans: 0}
  - {Ftex: '\langle y^2,\ xy \rangle', P: y**2, Q: x*y, R: '0', ans: 1}
  - {Ftex: '\langle 3x^2 y,\ x^3 + 2y \rangle', P: 3*x**2*y, Q: x**3 + 2*y, R: '0', ans: 0}
  - {Ftex: '\langle yz,\ xz,\ xy \rangle', P: y*z, Q: x*z, R: x*y, ans: 0}
  - {Ftex: '\langle y,\ z,\ x \rangle', P: y, Q: z, R: x, ans: 1}
  - {Ftex: '\langle 2x,\ 2y,\ 2z \rangle', P: 2*x, Q: 2*y, R: 2*z, ans: 0}
  - {Ftex: '\langle y,\ x + z,\ y \rangle', P: y, Q: x + z, R: y, ans: 0}
  - {Ftex: '\langle z,\ 0,\ -x \rangle', P: z, Q: '0', R: -x, ans: 1}
  prompt: Is $\mathbf F = {{Ftex}}$ conservative (on all of space)?
  parts:
  - ask: Conservative?
    label: a
    choice: ['Yes: curl F = 0 on a simply connected domain', 'No']
    correct: ans
    explain: In the plane, test $\partial Q/\partial x = \partial P/\partial y$; in space, test curl F = 0. On a simply connected domain that is enough for a potential to exist
  verify:
    choices: {a: 'is_conservative(P, Q, R)'}

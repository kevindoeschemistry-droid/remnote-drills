  prompt: What is the average value of $f = {{ftex}}$ over {{rtex}}?
  parts:
  - {ask: Average, label: a, value: ans, tol: 0.0001, explain: '$f_{\text{avg}} = \dfrac{1}{\text{area}}\iint_D f\,dA$ (or $\dfrac{1}{\text{volume}}\iiint_E f\,dV$). Use the coordinates that suit the region for both integrals'}

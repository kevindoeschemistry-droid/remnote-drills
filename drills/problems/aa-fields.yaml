- template: aa-galois-correspondence
  skill: aa.fields
  pace: recall
  cases:
  - q: 'The splitting field of x³ − 2 over Q has degree 6. Its Galois group is:'
    o1: S₃
    o2: The cyclic group of order 6
    o3: The cyclic group of order 3
    o4: The Klein four-group
  - q: 'In the Galois correspondence, a larger subgroup corresponds to:'
    o1: A smaller intermediate field
    o2: A larger intermediate field
    o3: A field of the same degree
    o4: A non-normal extension
  - q: 'An intermediate field is a normal extension of the base exactly when its subgroup is:'
    o1: Normal in the Galois group
    o2: Cyclic
    o3: Abelian
    o4: Of prime order
  - q: 'The Galois group of Q(√2, √3) over Q is:'
    o1: The Klein four-group
    o2: The cyclic group of order 4
    o3: S₃
    o4: Trivial
  - q: 'The Galois group of the field with pⁿ elements over the field with p elements is:'
    o1: Cyclic of order n, generated by x ↦ xᵖ
    o2: The symmetric group Sₙ
    o3: The units modulo n
    o4: Trivial
  - q: 'Q(∛2) over Q is not a Galois extension because it:'
    o1: Lacks the complex roots of x³ − 2
    o2: Has degree 3
    o3: Is not algebraic
    o4: Is not separable
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: The correspondence turns questions about fields, which are infinite, into questions about a finite group. Q(√2, √3) has three quadratic subfields, matching the three subgroups of order 2
  verify:
    authored: true

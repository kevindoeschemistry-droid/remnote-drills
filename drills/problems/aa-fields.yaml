- template: aa-extension-degree
  skill: aa.fields
  pace: quick
  cases:
  - sh: √2 + √3
    py: sqrt(2)+sqrt(3)
    kans: 4
  - sh: ∛2
    py: cbrt(2)
    kans: 3
  - sh: ⁴√2
    py: root(2,4)
    kans: 4
  - sh: √2 + i
    py: sqrt(2)+I
    kans: 4
  - sh: √(1 + √2)
    py: sqrt(1+sqrt(2))
    kans: 4
  - sh: cos(2π/7)
    py: cos(2*pi/7)
    kans: 3
  - sh: √2 + √3 + √5
    py: sqrt(2)+sqrt(3)+sqrt(5)
    kans: 8
  prompt: Find the degree of the field extension Q({{sh}}) over Q.
  parts:
  - ask: Answer
    label: v
    tex: '[K:\mathbb{Q}]'
    value: kans
    final: true
    tol: 0.0001
    explain: Find the minimal polynomial of a generator, or build the field in steps and multiply the degrees with the tower law
  verify:
    expect:
      v: pm_minpoly_deg(py)
- template: aa-tower-law
  skill: aa.fields
  pace: quick
  cases:
  - kl: 12
    kk: 4
  - kl: 8
    kk: 2
  - kl: 6
    kk: 3
  - kl: 24
    kk: 6
  - kl: 20
    kk: 4
  prompt: 'Q ⊂ K ⊂ L with [L : Q] = {{kl}} and [K : Q] = {{kk}}. Find [L : K].'
  parts:
  - ask: Answer
    label: v
    tex: '[L:K]'
    value: kl/kk
    final: true
    tol: 0.0001
    explain: Degrees multiply up a tower, so the degree of any intermediate field must divide the degree of the whole extension
  verify:
    expect:
      v: solve(Eq(Symbol('m')*kk, kl), Symbol('m'))[0]

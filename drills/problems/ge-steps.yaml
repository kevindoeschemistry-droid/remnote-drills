- template: ge-latitude-circle
  skill: ngeo.spherical
  pace: quick
  given:
    kr:
      pick:
      - 1
      - 6371
      - 10
    kd:
      pick:
      - 30
      - 45
      - 60
  prompt: Find the length of the circle of latitude {{kd}}° on a sphere of radius {{kr}}.
  parts:
  - ask: Answer
    label: v
    tex: L
    value: 2*pi*kr*cos(kd*pi/180)
    tol: 0.005
    explain: The parallel is a circle of radius R cos φ
  verify:
    expect:
      v: integrate(kr*cos(kd*pi/180), (Y, 0, 2*pi))
- template: ge-parallel-vs-great
  skill: ngeo.spherical
  pace: quick
  cases:
  - kd: 60
    kans: 0.0182383
  - kd: 90
    kans: 0.0626639
  - kd: 120
    kans: 0.1515328
  - kd: 180
    kans: 0.5235988
  prompt: Two points lie at latitude 60° on a unit sphere, {{kd}}° of longitude apart. How much longer is the route along the parallel than the great-circle route?
  parts:
  - ask: Answer
    label: v
    tex: \Delta
    value: kans
    tol: 0.005
    explain: Along the parallel the length is cos 60° × Δλ; the great-circle route is the central angle, which is shorter
  verify:
    expect:
      v: cos(pi/3)*kd*pi/180 - pm_sphere_angle(60, 0, 60, kd)*pi/180
- template: ge-cap-area
  skill: ngeo.spherical
  pace: quick
  given:
    kr:
      pick:
      - 1
      - 2
      - 5
    kd:
      pick:
      - 30
      - 60
      - 90
      - 120
  prompt: Find the area of the cap of a sphere of radius {{kr}} lying within angular radius {{kd}}° of the north pole.
  parts:
  - ask: Answer
    label: v
    tex: A
    value: 2*pi*kr^2*(1 - cos(kd*pi/180))
    tol: 0.005
    explain: Integrate the area element R² sin θ dθ dφ, or use 2πR × height with height R(1 − cos θ)
  verify:
    expect:
      v: integrate(integrate(kr**2*sin(Y), (Y, 0, kd*pi/180)), (Z, 0, 2*pi))
- template: ge-fraction-above-latitude
  skill: ngeo.spherical
  pace: quick
  given:
    kd:
      pick:
      - 30
      - 45
      - 60
      - 15
  prompt: What fraction of a sphere's surface lies north of latitude {{kd}}°?
  parts:
  - ask: Answer
    label: v
    tex: f
    value: (1 - sin(kd*pi/180))/2
    tol: 0.005
    explain: By Archimedes the area between two latitudes is proportional to the difference of their heights sin φ
  verify:
    expect:
      v: integrate(integrate(cos(Y), (Y, kd*pi/180, pi/2)), (Z, 0, 2*pi))/(4*pi)
- template: ge-horizontal-length
  skill: ngeo.hyperbolic
  pace: quick
  cases:
  - ka: 0
    kb: 4
    ky: 2
  - ka: 1
    kb: 3
    ky: 0.5
  - ka: -2
    kb: 2
    ky: 4
  - ka: 0
    kb: 1
    ky: 0.1
  - ka: 0
    kb: 10
    ky: 5
  prompt: In the upper half-plane with metric (dx² + dy²)/y², find the length of the horizontal segment from ({{ka}}, {{ky}}) to ({{kb}}, {{ky}}).
  parts:
  - ask: Answer
    label: v
    tex: L
    value: (kb - ka)/ky
    tol: 0.005
    explain: Along a horizontal line y is constant, so every Euclidean length is divided by y
  verify:
    expect:
      v: integrate(1/nsimplify(ky), (Y, ka, kb))
- template: ge-vertical-length
  skill: ngeo.hyperbolic
  pace: quick
  cases:
  - ka: 1
    kb: 2
  - ka: 0.5
    kb: 1
  - ka: 1
    kb: 10
  - ka: 0.01
    kb: 1
  - ka: 2
    kb: 8
  prompt: In the upper half-plane, find the hyperbolic length of the vertical segment from height {{ka}} to height {{kb}}.
  parts:
  - ask: Answer
    label: v
    tex: L
    value: log(kb/ka)
    tol: 0.005
    explain: Integrate dy/y. Halving both heights leaves the length unchanged, which is why the boundary is infinitely far away
  verify:
    expect:
      v: integrate(1/Y, (Y, nsimplify(ka), nsimplify(kb)))
- template: ge-geodesic-centre
  skill: ngeo.hyperbolic
  pace: quick
  cases:
  - k1: 0
    k2: 1
    k3: 2
    k4: 1
  - k1: 0
    k2: 1
    k3: 1
    k4: 2
  - k1: -1
    k2: 2
    k3: 3
    k4: 2
  - k1: 0
    k2: 3
    k3: 4
    k4: 1
  - k1: 1
    k2: 1
    k3: 3
    k4: 3
  prompt: In the upper half-plane, the geodesic through ({{k1}}, {{k2}}) and ({{k3}}, {{k4}}) is a semicircle centred on the real axis. Find the x-coordinate of its centre.
  parts:
  - ask: Answer
    label: v
    tex: c
    value: (k1^2 + k2^2 - k3^2 - k4^2)/(2*(k1 - k3))
    tol: 0.005
    explain: The centre is the point of the real axis at equal Euclidean distance from both points
  verify:
    expect:
      v: solve(Eq((k1 - Symbol('m'))**2 + k2**2, (k3 - Symbol('m'))**2 + k4**2), Symbol('m'))[0]
- template: ge-geodesic-radius
  skill: ngeo.hyperbolic
  pace: quick
  cases:
  - k1: 0
    k2: 1
    k3: 2
    k4: 1
  - k1: 0
    k2: 1
    k3: 1
    k4: 2
  - k1: -3
    k2: 4
    k3: 3
    k4: 4
  - k1: 0
    k2: 3
    k3: 4
    k4: 1
  prompt: In the upper half-plane, the geodesic through ({{k1}}, {{k2}}) and ({{k3}}, {{k4}}) is a semicircle centred on the real axis. Find its Euclidean radius.
  parts:
  - ask: Answer
    label: v
    tex: r
    value: sqrt((k1 - (k1^2 + k2^2 - k3^2 - k4^2)/(2*(k1 - k3)))^2 + k2^2)
    tol: 0.005
    explain: Find the centre on the real axis first, then the radius is its distance to either point
  verify:
    expect:
      v: sqrt((k3 - solve(Eq((k1 - Symbol('m'))**2 + k2**2, (k3 - Symbol('m'))**2 + k4**2), Symbol('m'))[0])**2 + k4**2)
- template: ge-strip-area
  skill: ngeo.hyperbolic
  pace: quick
  cases:
  - ka: 0
    kb: 1
    kh: 1
  - ka: 0
    kb: 3
    kh: 2
  - ka: -1
    kb: 1
    kh: 0.5
  - ka: 0
    kb: 2
    kh: 4
  prompt: In the upper half-plane, find the hyperbolic area of the region {{ka}} ≤ x ≤ {{kb}}, y ≥ {{kh}}.
  parts:
  - ask: Answer
    label: v
    tex: A
    value: (kb - ka)/kh
    tol: 0.005
    explain: 'Integrate dx dy / y²: the y-integral from h to infinity is 1/h, so the area is width/h, finite even though the region is unbounded'
  verify:
    expect:
      v: integrate(integrate(1/Y**2, (Y, nsimplify(kh), oo)), (Z, ka, kb))
- template: ge-hyperbolic-polygon-area
  skill: ngeo.hyperbolic
  pace: quick
  cases:
  - kn: 4
    kd: 60
  - kn: 5
    kd: 90
  - kn: 6
    kd: 90
  - kn: 8
    kd: 45
  - kn: 3
    kd: 30
  prompt: A geodesic {{kn}}-gon in the hyperbolic plane has every interior angle equal to {{kd}}°. Find its area.
  parts:
  - ask: Answer
    label: v
    tex: A
    value: (kn - 2)*pi - kn*kd*pi/180
    tol: 0.005
    explain: 'Cut the polygon into n − 2 triangles: its area is the Euclidean angle sum (n − 2)π minus the actual angle sum'
  verify:
    expect:
      v: solve(Eq(kn*kd*pi/180 + Symbol('m'), (kn - 2)*pi), Symbol('m'))[0]
- template: ge-curvature-from-triangle
  skill: ngeo.curvature
  pace: quick
  cases:
  - ks: 190
    ka: 2
  - ks: 170
    ka: 0.5
  - ks: 270
    ka: 1.5
  - ks: 181
    ka: 10
  - ks: 120
    ka: 1
  prompt: A geodesic triangle on a surface of constant curvature has angles summing to {{ks}}° and area {{ka}}. Find the curvature.
  parts:
  - ask: Answer
    label: v
    tex: K
    value: (ks - 180)*pi/180/ka
    tol: 0.005
    explain: Excess (in radians) equals curvature times area; an angle sum below 180° gives negative curvature
  verify:
    expect:
      v: solve(Eq(ks*pi/180 - pi, Symbol('m')*nsimplify(ka)), Symbol('m'))[0]
- template: ge-radius-from-excess
  skill: ngeo.curvature
  pace: quick
  cases:
  - ka: 1000000
    ks: 181.5
  - ka: 500000
    ks: 180.7
  - ka: 2000000
    ks: 190
  - ka: 100000
    ks: 180.5
  prompt: Surveyors on a spherical planet measure a triangle of area {{ka}} km² whose angles sum to {{ks}}°. Find the planet's radius in km.
  parts:
  - ask: Answer
    label: v
    tex: R
    value: sqrt(ka/((ks - 180)*pi/180))
    tol: 0.005
    explain: Area = excess × R², so R = √(area/excess) with the excess in radians
  verify:
    expect:
      v: Max(*solve(Eq((ks - 180)*pi/180*Symbol('m')**2, ka), Symbol('m')))
- template: ge-curvature-from-circle
  skill: ngeo.curvature
  pace: quick
  cases:
  - kr: 0.1
    kc: 0.6273
  - kr: 0.5
    kc: 3.0
  - kr: 0.2
    kc: 1.265
  - kr: 1
    kc: 6.9
  - kr: 0.5
    kc: 3.2
  prompt: On a surface, a geodesic circle of radius {{kr}} has circumference {{kc}}. Estimate the curvature from K ≈ 3(2πr − C)/(πr³).
  parts:
  - ask: Answer
    label: v
    tex: K
    value: 3*(2*pi*kr - kc)/(pi*kr^3)
    tol: 0.005
    explain: The formula inverts C ≈ 2πr(1 − Kr²/6). A circumference short of 2πr means positive curvature
  verify:
    expect:
      v: solve(Eq(nsimplify(kc), 2*pi*nsimplify(kr)*(1 - Symbol('m')*nsimplify(kr)**2/6)), Symbol('m'))[0]
- template: ge-circumference-deficit
  skill: ngeo.curvature
  pace: quick
  cases:
  - kb: 1
    kr: 1
  - kb: 2
    kr: 1
  - kb: 10
    kr: 1
  - kb: 6371
    kr: 1000
  - kb: 4
    kr: 2
  prompt: On a sphere of radius {{kb}}, a circle is drawn with geodesic radius {{kr}}. By what fraction is its circumference shorter than 2πr?
  parts:
  - ask: Answer
    label: v
    tex: f
    value: 1 - sin(kr/kb)/(kr/kb)
    tol: 0.005
    explain: The circle's true radius in space is R sin(r/R), so its circumference is 2πR sin(r/R); for small r the shortfall is about r²/(6R²)
  verify:
    expect:
      v: 1 - integrate(kb*sin(Rational(kr, kb)), (Y, 0, 2*pi))/(2*pi*kr)

# Generated by scripts/second_types.py from scripts/second_specs/pm4_ge.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: ge-meridian-distance
  skill: ngeo.spherical
  pace: quick
  cases:
  - kr: 6371
    k1: 10
    k2: 40
  - kr: 6371
    k1: 30
    k2: 60
  - kr: 3390
    k1: 0
    k2: 45
  - kr: 1737
    k1: 20
    k2: 80
  prompt: Two towns lie on the same meridian of a sphere of radius {{kr}} km, at latitudes {{k1}}° N and {{k2}}° N. Find the great-circle distance between them.
  parts:
  - ask: Answer
    label: v
    tex: d
    value: kr*(k2 - k1)*pi/180
    tol: 0.005
    explain: A meridian is a great circle, so the central angle is the difference in latitude
  verify:
    expect:
      v: kr*pm_sphere_angle(k1, 20, k2, 20)*pi/180

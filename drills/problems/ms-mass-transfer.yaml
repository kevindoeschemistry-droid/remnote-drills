- template: ms-htu-ntu
  skill: mass.interphase
  pace: quick
  given:
    y1:
      pick:
      - 0.02
      - 0.05
    y2:
      pick:
      - 0.001
      - 0.002
    d1:
      pick:
      - 0.008
      - 0.01
      - 0.015
    d2:
      pick:
      - 0.001
      - 0.0015
    H:
      pick:
      - 0.5
      - 0.8

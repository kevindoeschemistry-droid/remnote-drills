      v: solve(Eq(x*nsimplify(t), nsimplify(D)*nsimplify(e)), x)[0]
- template: ms-stagnant-film
  skill: mass.steady
  pace: quick
  given:
    L:
      pick:
      - 5
      - 10
      - 20
    x1:
      pick:
      - 0.1
      - 0.3
      - 0.5
    D:
      pick:
      - 1
      - 1.5
      - 2.5
  prompt: 'Vapour A diffuses through {{L}} cm of stagnant air in a tube: $x_A = {{x1}}$ at the liquid surface and 0 at the top. With $c = 40.9$ mol/m³ and $D = {{D}}\times10^{-5}$ m²/s. Find $N_A$, in mmol/(m²·s).'
  parts:
  - ask: Answer
    label: v
    tex: N_A
    value: 40.9*D*1e-5/(L/100)*log(1/(1 - x1))*1000
    tol: 0.01
    explain: 'B is stagnant, so A carries B''s share of the bulk flow: $N_A = -cD\,\frac{dx_A}{dz}/(1 - x_A)$. Integrating gives the log; for dilute A it reduces to Fick'
  verify:
    expect:
      v: integrate(Rational(409, 10)*nsimplify(D)/10**5/(1 - x), (x, 0, nsimplify(x1)))/(Rational(L, 100))*1000
- template: ms-bulk-flow-factor
  skill: mass.steady
  pace: quick
  given:
    x1:
      pick:
      - 0.2
      - 0.4
      - 0.6
      - 0.8
    x2:
      pick:
      - 0.0
      - 0.1
  prompt: Across a film, $x_A$ falls from {{x1}} to {{x2}}. By what factor is the flux through stagnant B larger than for equimolar counterdiffusion with the same $c$, $D$ and thickness?
  parts:
  - ask: Answer
    label: v
    tex: N/N_{eq}
    value: log((1 - x2)/(1 - x1))/(x1 - x2)
    tol: 0.01
    explain: The bulk flow drags A along; the factor is $1/x_{B,lm}$. It matters only when A is concentrated
  verify:
    expect:
      v: integrate(1/(1 - x), (x, nsimplify(x2), nsimplify(x1)))/integrate(1, (x, nsimplify(x2), nsimplify(x1)))
- template: ms-effectiveness-slab
  skill: mass.steady
  pace: quick
  given:
    L:
      pick:
      - 1
      - 2
      - 5
    k:
      pick:
      - 1
      - 5
      - 20
    D:
      pick:
      - 0.5
      - 1
      - 5
  prompt: A catalyst slab of half-thickness {{L}} mm runs a first-order reaction with $k = {{k}}$ s⁻¹ and $D_{eff} = {{D}}\times10^{-6}$ m²/s. Find the effectiveness factor.
  parts:
  - ask: Answer
    label: v
    tex: \eta
    value: tanh((L/1000)*sqrt(k/(D*1e-6)))/((L/1000)*sqrt(k/(D*1e-6)))
    tol: 0.01
    explain: 'Solve $D c'''' = kc$ with $c = c_s$ at the surface and no flux at the centre: $c = c_s\cosh(z\sqrt{k/D})/\cosh\phi$. η is the actual rate (the surface flux) over the rate if the whole slab saw $c_s$'
  verify:
    expect:
      v: (nsimplify(D)/10**6*diff(cosh(sqrt(k/(nsimplify(D)/10**6))*x)/cosh(sqrt(k/(nsimplify(D)/10**6))*Rational(L, 1000)), x).subs(x, Rational(L, 1000)))/(k*Rational(L, 1000))
- template: ms-effectiveness-sphere
  skill: mass.steady
  pace: quick
  given:
    phi:
      pick:
      - 0.5
      - 1
      - 2
      - 5
      - 10
  prompt: A spherical pellet has Thiele modulus $\phi = R\sqrt{k/D_{eff}} = {{phi}}$. Find its effectiveness factor.
  parts:
  - ask: Answer
    label: v
    tex: \eta
    value: 3/phi^2*(phi/tanh(phi) - 1)
    tol: 0.01
    explain: 'The sphere''s profile is $\sinh(\phi r)/(r\sinh\phi)$; η is $3/\phi^2$ times the dimensionless surface gradient. Large φ gives η ≈ 3/φ: only a thin shell works'
  verify:
    expect:
      v: 3*diff(sinh(nsimplify(phi)*x)/(x*sinh(nsimplify(phi))), x).subs(x, 1)/nsimplify(phi)**2
- template: ms-spherical-shell
  skill: mass.steady
  pace: quick
  given:
    r1:
      pick:
      - 1
      - 2
    r2:
      pick:
      - 3
      - 4

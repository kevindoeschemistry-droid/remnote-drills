- template: ms-stokes-einstein-radius
  skill: mass.diffusivity
  pace: quick
  given:
    D:
      pick:
      - 4
      - 6
      - 9
      - 12
  prompt: A protein has $D = {{D}}\times10^{-11}$ m²/s in water at 298 K ($\mu$ = 0.89 mPa·s). What hydrodynamic radius does Stokes–Einstein give, in nm? ($k_B = 1.381\times10^{-23}$ J/K)
  parts:
  - ask: Answer
    label: v
    tex: a
    value: 1.381e-23*298/(6*pi*0.89e-3*D*1e-11)*1e9
    tol: 0.005
    explain: 'Run D = kT/(6πμa) backwards: diffusion measurements (DLS, NMR) report size this way'
  verify:
    expect:
      v: solve(Eq(nsimplify(D)/10**11, Rational(1381, 10**26)*298/(6*pi*Rational(89, 10**5)*x/10**9)), x)[0]
- template: ms-knudsen
  skill: mass.diffusivity
  pace: quick
  given:
    M:
      pick:
      - 2
      - 28
      - 44
    d:
      pick:
      - 5
      - 10
      - 50
    T:
      pick:
      - 300
      - 500
      - 700
  prompt: Find the Knudsen diffusivity of a gas with $M = {{M}}$ g/mol in a pore {{d}} nm across at {{T}} K, in cm²/s.
  parts:
  - ask: Answer
    label: v
    tex: D_K
    value: (d*1e-9/3)*sqrt(8*8.314*T/(pi*M/1000))*1e4
    tol: 0.01
    explain: Molecules hit walls more often than each other, so the pore size replaces the mean free path. $D_K$ does not depend on pressure and goes as $\sqrt{T/M}$
  verify:
    expect:
      v: (Rational(d, 10**9)/3)*sqrt(8*Rational(8314, 1000)*T/(pi*Rational(M, 1000)))*10**4
- template: ms-knudsen-crossover
  skill: mass.diffusivity
  pace: quick
  given:
    M:
      pick:
      - 28
      - 44
      - 2
    T:
      pick:
      - 300
      - 500
    Dm:
      pick:
      - 0.1
      - 0.2
      - 0.5
  prompt: A gas (M = {{M}} g/mol) at {{T}} K has molecular diffusivity {{Dm}} cm²/s. Below what pore diameter, in nm, is the Knudsen diffusivity smaller than that? ($R = 8.314$)
  parts:
  - ask: Answer
    label: v
    tex: d
    value: 3*Dm*1e-4/sqrt(8*8.314*T/(pi*M/1000))*1e9
    tol: 0.005
    explain: D_K grows linearly with pore size; where it equals the molecular value the transition region begins. Hydrogen's fast molecules push the crossover to larger pores
  verify:
    expect:
      v: solve(Eq(x/10**9/3*sqrt(8*Rational(8314, 1000)*T/(pi*nsimplify(M)/1000)), nsimplify(Dm)/10**4), x)[0]

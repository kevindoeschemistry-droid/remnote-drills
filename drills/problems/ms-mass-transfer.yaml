    D:
      pick:
      - 0.5
      - 1
      - 2
  prompt: A solute diffuses outward through a spherical shell from $r_1 = {{r1}}$ cm ($c = {{c1}}$ mol/m³) to $r_2 = {{r2}}$ cm ($c = 0$); $D = {{D}}\times10^{-9}$ m²/s. Find the rate, in nmol/s.
  parts:
  - ask: Answer
    label: v
    tex: \dot W
    value: 4*pi*D*1e-9*c1/(1/(r1/100) - 1/(r2/100))*1e9
    tol: 0.01
    explain: The rate through every shell is the same, so $c$ falls as $1/r$. Letting $r_2 \to \infty$ gives Sh = 2 for an isolated sphere
  verify:
    expect:
      v: solve(Eq(integrate(x/(4*pi*nsimplify(D)/10**9*Symbol('r')**2), (Symbol('r'), Rational(r1, 100), Rational(r2, 100))), c1), x)[0]*10**9
- template: ms-droplet-lifetime
  skill: mass.steady
  pace: quick
  given:
    d0:
      pick:
      - 20
      - 50
      - 100
    cs:
      pick:
      - 0.017
      - 0.023
      - 0.03
  prompt: A water droplet of diameter {{d0}} µm evaporates into dry still air. With $D = 2.5\times10^{-5}$ m²/s, saturated vapour concentration {{cs}} kg/m³ at the surface and liquid density 1000 kg/m³, how long does it last, in s?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: 1000*(d0*1e-6)^2/(8*2.5e-5*cs)
    tol: 0.01
    explain: 'The evaporation rate $4\pi rDc_s$ shrinks the droplet: $\rho\,r\,dr/dt = -Dc_s$, so $r^2$ falls linearly. Lifetime goes as $d_0^2$'
  verify:
    expect:
      v: integrate(1000*Symbol('r')/(Rational(25, 10**6)*nsimplify(cs)), (Symbol('r'), 0, Rational(d0, 2*10**6)))
- template: ms-film-absorption
  skill: mass.interphase
  pace: quick
  given:
    v:
      pick:
      - 0.1
      - 0.3
      - 0.5
    L:
      pick:
      - 5
      - 10
      - 50
    D:
      pick:
      - 1
      - 2
  prompt: A gas is absorbed into a liquid film whose surface moves at {{v}} m/s over a length {{L}} cm. With $D = {{D}}\times10^{-9}$ m²/s, find the average mass-transfer coefficient, in µm/s.
  parts:
  - ask: Answer
    label: r
    tex: \bar k
    value: 2*sqrt(D*1e-9/(pi*(L/100)/v))*1e6
    tol: 0.01
    explain: Each surface element is exposed for $t = L/v$ and absorbs like a semi-infinite liquid, local $k = \sqrt{D/\pi t}$. Averaging over the exposure doubles it
  verify:
    expect:
      r: integrate(sqrt(nsimplify(D)/10**9/(pi*x)), (x, 0, Rational(L, 100)/nsimplify(v)))/(Rational(L, 100)/nsimplify(v))*10**6

  prompt: A dilute absorber reduces $y$ from {{y1}} to {{y2}}; the driving forces $y - y^*$ are {{d1}} at the bottom and {{d2}} at the top. With $H_{OG} = {{H}}$ m, how tall must the packing be, in m?
  parts:
  - ask: Answer
    label: v
    tex: Z
    value: H*(y1 - y2)/((d1 - d2)/log(d1/d2))
    tol: 0.01
    explain: NTU counts how many times the average driving force fits into the change in $y$; HTU carries the coefficient and flows. Hard separations need many transfer units
  verify:
    expect:
      v: nsimplify(H)*(nsimplify(y1) - nsimplify(y2))*log(nsimplify(d1)/nsimplify(d2))/(nsimplify(d1) - nsimplify(d2))
- template: ms-wilke-mixture
  skill: mass.diffusivity
  pace: quick
  given:
    xa:
      pick:
      - 0.1
      - 0.2
      - 0.3
    xb:
      pick:
      - 0.3
      - 0.4
      - 0.5
    dab:
      pick:
      - 0.1
      - 0.2
    dac:
      pick:
      - 0.05
      - 0.3
      - 0.6
  prompt: A diffuses through stagnant B and C. Locally $x_A = {{xa}}$, $x_B = {{xb}}$, and the rest is C; $D_{AB} = {{dab}}$ and $D_{AC} = {{dac}}$ cm²/s. Find $D_{Am}$.
  parts:
  - ask: Answer
    label: v
    tex: D_{Am}
    value: (1 - xa)/(xb/dab + (1 - xa - xb)/dac)
    tol: 0.01
    explain: A harmonic mean weighted by the stagnant species' share; it follows from Maxwell–Stefan when only A moves
  verify:
    expect:
      v: 1/((nsimplify(xb)/(1 - nsimplify(xa)))/nsimplify(dab) + ((1 - nsimplify(xa) - nsimplify(xb))/(1 - nsimplify(xa)))/nsimplify(dac))
- template: ms-membrane-flux
  skill: mass.steady
  pace: quick
  given:
    l:
      pick:
      - 0.1
      - 0.5
      - 1
    P:
      pick:
      - 1
      - 10
      - 600
    dp:
      pick:
      - 20
      - 50
      - 100
  prompt: A dense membrane {{l}} µm thick has permeability {{P}} Barrer for O₂ (1 Barrer = $3.35\times10^{-16}$ mol·m/(m²·s·Pa)). The O₂ partial-pressure difference is {{dp}} kPa. Find the flux, in µmol/(m²·s).
  parts:
  - ask: Answer
    label: v
    tex: N
    value: P*3.35e-16*dp*1000/(l*1e-6)*1e6
    tol: 0.01
    explain: 'Solution–diffusion: permeability = solubility × diffusivity. Thin skins (sub-micron) are what make polymer membranes practical'
  verify:
    expect:
      v: nsimplify(P)*Rational(335, 10**18)*dp*1000/(nsimplify(l)/10**6)*10**6

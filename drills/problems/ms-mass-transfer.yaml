  prompt: A solute has $D = {{D1}}\times10^{-9}$ m²/s in water at {{T1}} K ($\mu = {{mu1}}$ mPa·s). Estimate $D$ at {{T2}} K, where $\mu = {{mu2}}$ mPa·s, in units of $10^{-9}$ m²/s.
  parts:
  - ask: Answer

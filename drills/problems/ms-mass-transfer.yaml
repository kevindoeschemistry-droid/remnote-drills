      pick:
      - 1.25
      - 1.5
      - 2
  prompt: A dilute absorber with solute-free liquid takes y from {{y1}} to {{y2}}; equilibrium y = {{m}}x and absorption factor A = L/(mG) = {{Af}}. What is N_OG?
  parts:
  - ask: Answer
    label: v
    tex: N_{OG}
    value: log((1 - 1/Af)*y1/y2 + 1/Af)/(1 - 1/Af)
    tol: 0.005
    explain: The Colburn equation is the integral of dy/(y − y*) along straight operating and equilibrium lines; A near 1 makes N_OG blow up
  verify:
    expect:
      v: integrate(1/(Symbol('yy') - nsimplify(m)*(Symbol('yy') - nsimplify(y2))/(nsimplify(Af)*nsimplify(m))), (Symbol('yy'), nsimplify(y2), nsimplify(y1)))
- template: ms-wilke-mixture
  skill: mass.diffusivity
  pace: quick
  given:
    xa:
      pick:
      - 0.1
      - 0.2
      - 0.3
    xb:
      pick:
      - 0.3
      - 0.4
      - 0.5
    dab:
      pick:
      - 0.1
      - 0.2
    dac:
      pick:
      - 0.05
      - 0.3
      - 0.6
  prompt: A diffuses through stagnant B and C. Locally $x_A = {{xa}}$, $x_B = {{xb}}$, and the rest is C; $D_{AB} = {{dab}}$ and $D_{AC} = {{dac}}$ cm²/s. Find $D_{Am}$.
  parts:
  - ask: Answer
    label: v
    tex: D_{Am}
    value: (1 - xa)/(xb/dab + (1 - xa - xb)/dac)
    tol: 0.01
    explain: A harmonic mean weighted by the stagnant species' share; it follows from Maxwell–Stefan when only A moves
  verify:
    expect:
      v: 1/((nsimplify(xb)/(1 - nsimplify(xa)))/nsimplify(dab) + ((1 - nsimplify(xa) - nsimplify(xb))/(1 - nsimplify(xa)))/nsimplify(dac))

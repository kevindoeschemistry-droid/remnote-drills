  prompt: In a Stefan tube the liquid level falls from {{l1}} cm to {{l2}} cm below the top as it evaporates into stagnant air (c = 40.9 mol/m³, D = {{D}} × 10⁻⁵ m²/s, surface mole fraction {{xs}}, zero at the top). The liquid's molar density is {{rl}} kmol/m³. How long does that take, in hours?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: rl*1000*((l2/100)^2 - (l1/100)^2)/(2*40.9*D*1e-5*log(1/(1 - xs)))/3600
    tol: 0.005
    explain: 'Quasi-steady: the flux at each level is the stagnant-film flux over the current path length z, and ρ_L dz/dt equals it, so z² grows linearly in time. This is how D is measured'
  verify:
    expect:
      v: integrate(rl*1000*Symbol('zz')/(Rational(409, 10)*nsimplify(D)/10**5*log(1/(1 - nsimplify(xs)))), (Symbol('zz'), Rational(l1, 100), Rational(l2, 100)))/3600
- template: ms-bulk-flow-factor
  skill: mass.steady
  pace: quick
  given:
    x1:
      pick:
      - 0.2
      - 0.4
      - 0.6
      - 0.8
    x2:

- template: ms-log-mean-xb
  skill: mass.steady
  pace: quick
  given:
    x1:
      pick:
      - 0.2
      - 0.4
      - 0.6
      - 0.8
    x2:
      pick:
      - 0.01
      - 0.05
      - 0.1

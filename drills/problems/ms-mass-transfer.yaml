      - 10
      - 60
      - 600
  prompt: A surface held at $c_0 = {{c0}}$ mol/m³ contacts a deep, initially clean liquid ($D = {{D}}\times10^{-9}$ m²/s). How much solute enters per m² in {{t}} s, in mmol?
  parts:
  - ask: Answer
    label: v
    tex: M/A
    value: 2*c0*sqrt(D*1e-9*t/pi)*1000
    tol: 0.01
    explain: The surface flux is $c_0\sqrt{D/\pi t}$, infinite at first and decaying; integrate in time. Uptake grows as $\sqrt t$
  verify:
    expect:
      v: integrate(c0*sqrt(nsimplify(D)/10**9/(pi*x)), (x, 0, t))*1000
- template: ms-uptake-time
  skill: mass.unsteady
  pace: quick
  given:
    D:
      pick:
      - 1
      - 2
    c0:
      pick:
      - 10
      - 40
    m:
      pick:
      - 1
      - 5
      - 10
  prompt: A deep liquid with D = {{D}} × 10⁻⁹ m²/s takes up gas held at the surface at {{c0}} mol/m³. How long, in s, until {{m}} mmol/m² has been absorbed?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: pi*((m/1000)/(2*c0))^2/(D*1e-9)
    tol: 0.005
    explain: Uptake grows as √t, so absorbing twice as much takes four times as long
  verify:
    expect:
      v: solve(Eq(2*c0*sqrt(nsimplify(D)/10**9*x/pi), Rational(m, 1000)), x)[0]
- template: ms-slab-time-constant
  skill: mass.unsteady
  pace: quick
  given:
    L:
      pick:
      - 0.5
      - 1
      - 2
    D:
      pick:
      - 1
      - 5
      - 10
  prompt: A slab of half-thickness {{L}} mm ($D = {{D}}\times10^{-10}$ m²/s) is suddenly held at zero surface concentration. What is the time constant of the slowest mode, in hours?
  parts:
  - ask: Answer
    label: v
    tex: \tau
    value: 4*(L/1000)^2/(pi^2*D*1e-10)/3600
    tol: 0.01
    explain: Separation of variables gives modes $\cos(\lambda_n z)$ with $\lambda_n L = (n - \tfrac12)\pi$; the first, $\lambda_1 = \pi/2L$, decays slowest, with $\tau = 1/(D\lambda_1^2)$
  verify:
    expect:
      v: 1/(nsimplify(D)/10**10*solve(Eq(cos(x*Rational(L, 1000)), 0), x)[0]**2)/3600
- template: ms-slab-time-scaling
  skill: mass.unsteady

- template: ms-gas-diffusivity-scaling
  skill: mass.diffusivity
  pace: quick
  given:
    D1:
      pick:
      - 0.1
      - 0.2
      - 0.6
    T1:
      pick:
      - 300
      - 350
    T2:
      pick:
      - 400
      - 500
      - 600
    P:
      pick:
      - 0.5
      - 2
      - 5
  prompt: A gas-pair diffusivity is {{D1}} cm²/s at {{T1}} K and 1 atm. Ignoring the change in the collision integral, estimate it at {{T2}} K and {{P}} atm.
  parts:
  - ask: Answer
    label: v
    tex: D
    value: D1*(T2/T1)^1.5/P
    tol: 0.01
    explain: 'Kinetic theory: faster molecules (√T) and a longer mean free path (T/P) give $T^{3/2}/P$. Gas diffusivities are about 0.1 cm²/s; liquids about 10⁻⁵'
  verify:
    expect:
      v: nsimplify(D1)*((T2**Rational(3, 2)/nsimplify(P))/(T1**Rational(3, 2)/1))
- template: ms-liquid-diffusivity-scaling
  skill: mass.diffusivity
  pace: quick
  given:
    D1:
      pick:
      - 0.5
      - 1
      - 2
  cases:
  - T1: 298
    mu1: 0.89
    T2: 310
    mu2: 0.69
  - T1: 298
    mu1: 0.89
    T2: 323
    mu2: 0.55
  - T1: 293
    mu1: 1.0
    T2: 343
    mu2: 0.4
  prompt: A solute has $D = {{D1}}\times10^{-9}$ m²/s in water at {{T1}} K ($\mu = {{mu1}}$ mPa·s). Estimate $D$ at {{T2}} K, where $\mu = {{mu2}}$ mPa·s, in units of $10^{-9}$ m²/s.
  parts:
  - ask: Answer
    label: v
    tex: D
    value: D1*(T2/T1)*(mu1/mu2)
    tol: 0.01
    explain: 'Heating a liquid helps twice: more thermal energy and a lower viscosity, which falls much faster than $T$ rises'
  verify:
    expect:
      v: nsimplify(D1)*(T2/nsimplify(mu2))/(T1/nsimplify(mu1))
- template: ms-knudsen
  skill: mass.diffusivity
  pace: quick
  given:
    M:
      pick:
      - 2
      - 28
      - 44
    d:
      pick:
      - 5
      - 10
      - 50
    T:
      pick:
      - 300
      - 500
      - 700
  prompt: Find the Knudsen diffusivity of a gas with $M = {{M}}$ g/mol in a pore {{d}} nm across at {{T}} K, in cm²/s.
  parts:
  - ask: Answer
    label: v
    tex: D_K
    value: (d*1e-9/3)*sqrt(8*8.314*T/(pi*M/1000))*1e4
    tol: 0.01
    explain: Molecules hit walls more often than each other, so the pore size replaces the mean free path. $D_K$ does not depend on pressure and goes as $\sqrt{T/M}$
  verify:
    expect:
      v: (Rational(d, 10**9)/3)*sqrt(8*Rational(8314, 1000)*T/(pi*Rational(M, 1000)))*10**4
- template: ms-effective-diffusivity
  skill: mass.diffusivity
  pace: quick
  given:
    e:
      pick:
      - 0.3

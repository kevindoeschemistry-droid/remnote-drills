- template: ms-model-scaling
  skill: mass.interphase
  pace: recall
  given:
    f:
      pick:
      - 4
      - 8
      - 9
      - 16
  cases:
  - mdl: film theory
    p: 1
  - mdl: penetration theory
    p: 0.5
  - mdl: surface-renewal theory
    p: 0.5
  - mdl: laminar boundary-layer theory
    p: 0.6666666666666666
  prompt: If the diffusivity rises by a factor of {{f}}, by what factor does $k$ rise according to {{mdl}}?
  parts:
  - ask: Answer
    label: v
    tex: k_2/k_1
    value: f^p
    tol: 0.01
    explain: Experiments usually find exponents between ½ and ⅔, which is why film theory, though simple, is the least physical
  verify:
    expect:
      v: nsimplify(f)**nsimplify(p)
- template: ms-model-exponent
  skill: mass.interphase
  pace: quick
  cases:
  - f: 2
    g: 1.414
  - f: 4
    g: 2.52
  - f: 2
    g: 2
  - f: 3
    g: 1.732
  - f: 4
    g: 4
  prompt: Changing the solute raises D by a factor {{f}} and the measured k by {{g}}. What exponent n in k ∝ Dⁿ does that give?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: log(g)/log(f)
    tol: 0.005
    explain: n ≈ 1 points to film theory, ½ to penetration or surface renewal, ⅔ to a laminar boundary layer
  verify:
    expect:
      v: solve(Eq(nsimplify(f)**x, nsimplify(g)), x)[0]
- template: ms-htu-ntu
  skill: mass.interphase
  pace: quick
  given:
    y1:
      pick:
      - 0.02
      - 0.05
    y2:
      pick:
      - 0.001
      - 0.002
    d1:
      pick:
      - 0.008
      - 0.01
      - 0.015
    d2:
      pick:
      - 0.001
      - 0.0015
    H:
      pick:
      - 0.5
      - 0.8
      - 1.2
  prompt: A dilute absorber reduces $y$ from {{y1}} to {{y2}}; the driving forces $y - y^*$ are {{d1}} at the bottom and {{d2}} at the top. With $H_{OG} = {{H}}$ m, how tall must the packing be, in m?
  parts:
  - ask: Answer
    label: v
    tex: Z
    value: H*(y1 - y2)/((d1 - d2)/log(d1/d2))
    tol: 0.01
    explain: NTU counts how many times the average driving force fits into the change in $y$; HTU carries the coefficient and flows. Hard separations need many transfer units
  verify:
    expect:
      v: nsimplify(H)*(nsimplify(y1) - nsimplify(y2))*log(nsimplify(d1)/nsimplify(d2))/(nsimplify(d1) - nsimplify(d2))
- template: ms-colburn-ntu
  skill: mass.interphase
  pace: quick
  given:
    y1:
      pick:
      - 0.02
      - 0.05
    y2:
      pick:
      - 0.001
      - 0.002
    m:

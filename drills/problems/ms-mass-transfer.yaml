- template: ms-ranz-marshall
  skill: mass.interphase
  pace: quick
  given:
    Re:
      pick:
      - 1
      - 10
      - 100
      - 500
    Sc:
      pick:
      - 0.7
      - 1
      - 600
      - 1000
  prompt: A sphere in a flow has $Re = {{Re}}$ and $Sc = {{Sc}}$. Find the Sherwood number from Ranz–Marshall.
  parts:
  - ask: Answer
    label: v
    tex: Sh
    value: 2 + 0.6*sqrt(Re)*Sc^(1/3)
    tol: 0.01
    explain: The 2 is pure diffusion to a sphere in still fluid; the second term is convection. Liquids (Sc ~ 1000) gain much more from flow than gases
  verify:
    expect:
      v: 2 + Rational(3, 5)*sqrt(Re)*nsimplify(Sc)**Rational(1, 3)

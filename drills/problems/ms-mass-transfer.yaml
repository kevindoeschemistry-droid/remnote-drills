      - 4
    D:
      pick:
      - 0.01
      - 0.05
      - 0.1
  prompt: A catalyst pellet has porosity {{e}} and tortuosity {{t}}; the pore diffusivity is {{D}} cm²/s. What is $D_{eff}$, in cm²/s?
  parts:
  - ask: Answer
    label: v
    tex: D_{eff}
    value: D*e/t
    tol: 0.01
    explain: 'Only the pore fraction carries flux, along paths longer than the pellet: divide by τ (typically 2–6)'
  verify:

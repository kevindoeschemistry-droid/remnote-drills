- template: ms-slab-time-constant
  skill: mass.unsteady
  pace: quick
  given:
    L:
      pick:
      - 0.5
      - 1
      - 2
    D:
      pick:
      - 1
      - 5
      - 10
  prompt: A slab of half-thickness {{L}} mm ($D = {{D}}\times10^{-10}$ m²/s) is suddenly held at zero surface concentration. What is the time constant of the slowest mode, in hours?
  parts:
  - ask: Answer
    label: v
    tex: \tau
    value: 4*(L/1000)^2/(pi^2*D*1e-10)/3600
    tol: 0.01
    explain: Separation of variables gives modes $\cos(\lambda_n z)$ with $\lambda_n L = (n - \tfrac12)\pi$; the first, $\lambda_1 = \pi/2L$, decays slowest, with $\tau = 1/(D\lambda_1^2)$
  verify:
    expect:
      v: 1/(nsimplify(D)/10**10*solve(Eq(cos(x*Rational(L, 1000)), 0), x)[0]**2)/3600

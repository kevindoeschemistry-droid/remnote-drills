      - 2
      - 10
      - 40
  prompt: Gas-film $k_y = {{ky}}$ and liquid-film $k_x = {{kx}}$ mol/(m²·s); the equilibrium slope is $m = {{m}}$. Find $K_y$.
  parts:
  - ask: Answer
    label: v
    tex: K_y
    value: 1/(1/ky + m/kx)
    tol: 0.01
    explain: Resistances in series, with the liquid side scaled by $m$. A very soluble gas (small m) is gas-film controlled; a sparingly soluble one (large m) is liquid-film controlled
  verify:

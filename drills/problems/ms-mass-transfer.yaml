- template: ms-gas-diffusivity-scaling
  skill: mass.diffusivity
  pace: quick
  given:
    D1:
      pick:
      - 0.1
      - 0.2
      - 0.6
    T1:
      pick:
      - 300
      - 350
    T2:
      pick:
      - 400
      - 500
      - 600
    P:
      pick:
      - 0.5
      - 2
      - 5
  prompt: A gas-pair diffusivity is {{D1}} cm²/s at {{T1}} K and 1 atm. Ignoring the change in the collision integral, estimate it at {{T2}} K and {{P}} atm.
  parts:
  - ask: Answer
    label: v
    tex: D
    value: D1*(T2/T1)^1.5/P
    tol: 0.01
    explain: 'Kinetic theory: faster molecules (√T) and a longer mean free path (T/P) give $T^{3/2}/P$. Gas diffusivities are about 0.1 cm²/s; liquids about 10⁻⁵'
  verify:
    expect:
      v: nsimplify(D1)*((T2**Rational(3, 2)/nsimplify(P))/(T1**Rational(3, 2)/1))
- template: ms-diffusivity-temperature-reverse
  skill: mass.diffusivity
  pace: quick
  given:
    D1:
      pick:
      - 0.1
      - 0.16
      - 0.25
    T1:
      pick:
      - 298
      - 300
    f:
      pick:
      - 1.2
      - 1.5
      - 2
  let:
    D2: D1*f
  prompt: A gas pair has D = {{D1}} cm²/s at {{T1}} K and 1 atm. At what temperature, in K, does D reach {{D2}} cm²/s at the same pressure? (Ignore the collision integral.)
  parts:
  - ask: Answer
    label: v
    tex: T_2
    value: T1*(D2/D1)^(2/3)
    tol: 0.005
    explain: 'Invert D ∝ T^{3/2}: a 50% rise in D needs only about a 31% rise in absolute temperature'
  verify:
    expect:
      v: solve(Eq(nsimplify(D1)*(x/T1)**Rational(3, 2), nsimplify(D1)*nsimplify(f)), x)[0]
- template: ms-liquid-diffusivity-scaling

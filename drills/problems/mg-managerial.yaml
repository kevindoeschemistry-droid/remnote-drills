    tol: 0.005
    explain: Average the contribution margins by the mix, then proceed as for one product
  verify:
    expect:
      v: solve(Eq(Symbol('m')*ka/(ka + kb)*kp + Symbol('m')*kb/(ka + kb)*kq, kf), Symbol('m'))[0]

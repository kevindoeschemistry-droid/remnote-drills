  prompt: Product A sells for {{ka}} dollars after {{kp}} dollars of separable processing; product B sells for {{kb}} dollars after {{kq}} dollars of separable processing. The joint cost is {{kj}} dollars. How much joint cost goes to A by the net realisable value method?

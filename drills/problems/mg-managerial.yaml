    explain: How long until the cash is back; not a measure of profitability
  verify:
    expect:
      v: solve(Eq(Symbol('m')*ks, kc), Symbol('m'))[0]
- template: mg-npv-three-years
  skill: mgmt.decisions
  pace: quick
  cases:
  - kc: 100000
    ka: 45000
    kr: 10
  - kc: 250000
    ka: 100000
    kr: 8
  - kc: 60000
    ka: 25000
    kr: 12
  - kc: 40000
    ka: 15000
    kr: 5
  prompt: A project costs {{kc}} dollars now and returns {{ka}} dollars at the end of each of three years. The required rate is {{kr}}%. Find its net present value.
  parts:
  - ask: Answer
    label: v
    tex: NPV
    value: ka/(1 + kr/100) + ka/(1 + kr/100)^2 + ka/(1 + kr/100)^3 - kc
    tol: 0.005
    explain: Discount each year's cash flow and subtract the outlay; the card sums three terms, the check uses the annuity factor
  verify:
    expect:
      v: ka*(1 - (1 + Rational(kr, 100))**(-3))/Rational(kr, 100) - kc

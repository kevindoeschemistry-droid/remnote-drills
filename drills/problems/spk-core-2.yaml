      pick:
      - 0
      - 2
      - 5
    n2:
      pick:
      - 1
      - 3
      - 6
  require:
  - n1 + n2 <= 8
  prompt: Eight competencies are each scored 1 to 3. A recording scores {{n1}} threes, {{n2}} twos and the rest ones. What is the total?
  parts:

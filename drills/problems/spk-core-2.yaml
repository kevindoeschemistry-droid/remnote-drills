- template: spk-monroe-steps
  skill: speak.persuade
  pace: recall
  cases:
  - q: 'Monroe''s motivated sequence runs:'
    o1: Attention, need, satisfaction, visualisation, action
    o2: Attention, action, need, satisfaction
    o3: Need, attention, action, visualisation
    o4: Situation, complication, question, answer
  - q: The visualisation step does what?
    o1: Shows the listener what the world looks like once the proposal is adopted
    o2: Restates the need
    o3: Gives the evidence
    o4: Makes the ask
  - q: 'Skipping the need step produces:'
    o1: A solution to a problem the listener has not accepted exists
    o2: A shorter pitch
    o3: A clearer ask
    o4: A stronger close
  - q: 'The action step must be:'
    o1: Specific enough that the listener knows what to do next
    o2: Inspirational
    o3: Optional
    o4: A summary
  - q: 'Monroe''s sequence differs from SCQA by:'
    o1: Ending in an ask for action rather than in an answer to a question
    o2: Being longer
    o3: Having no need step
    o4: Being for written use
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Five steps, and the two most often dropped are need at the front and a specific action at the end
  verify:
    authored: true
- template: spk-monroe-timing
  skill: speak.persuade
  pace: quick
  given:
    dur:
      pick:
      - 120
      - 180
    a1:
      pick:
      - 10
      - 15
      - 20
    a2:
      pick:
      - 10
      - 15
      - 25
  require:
  - dur > a1 + a2 + 30
  prompt: A {{dur}}-second pitch gives attention {{a1}} and action {{a2}} seconds. How long is left for need, satisfaction and visualisation each (seconds)?
  parts:
  - ask: Answer
    label: v
    tex: seconds
    value: (dur - a1 - a2)/3
    tol: 0.005
    explain: The three middle steps carry the argument and get most of the time; a pitch that spends a third of itself on attention has no room to establish the need
  verify:
    expect:
      v: Rational(dur - a1 - a2, 3)

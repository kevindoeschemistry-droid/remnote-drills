- template: spk-fit-slot
  skill: speak.longform
  pace: quick
  given:
    nw:
      pick:
      - 2400
      - 4500
      - 7000
    wp:
      pick:
      - 130
      - 150
      - 165
    sl:
      pick:
      - 20
      - 45
      - 60
  prompt: A talk of {{nw}} words at a measured {{wp}} words a minute fits a {{sl}}-minute slot at what percentage of the slot, if 90 per cent is the target?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*nw/wp/sl
    tol: 0.005
    explain: Fitting to ninety per cent of the slot leaves room for the questions and the overrun that always happens; a talk written to a hundred per cent is a talk that overruns
  verify:
    expect:
      v: 100*Rational(nw, wp)/nsimplify(sl)
- template: spk-cut-words
  skill: speak.longform
  pace: quick
  given:
    nw:
      pick:
      - 2400
      - 4500
      - 7000
    wp:
      pick:
      - 130
      - 150
      - 165
    sl:
      pick:
      - 20
      - 45
      - 60
  require:
  - nw > wp*sl*0.9
  prompt: A talk runs {{nw}} words at {{wp}} words a minute against a {{sl}}-minute slot targeted at 90 per cent. How many words must be cut?
  parts:
  - ask: Answer
    label: v
    tex: words
    value: nw - wp*sl*0.9
    tol: 0.005
    explain: Cutting to a word count is the only reliable way to fit a slot, because cutting by feel removes the parts the speaker is least attached to rather than the parts the talk needs least
  verify:
    expect:
      v: nsimplify(nw) - nsimplify(wp)*nsimplify(sl)*Rational(9, 10)

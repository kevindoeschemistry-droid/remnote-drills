  pace: recall
  cases:
  - q: 'The camera should be:'
    o1: At eye level, so the speaker looks at the listener rather than down at them
    o2: Above eye level
    o3: Below eye level
    o4: Anywhere steady
  - q: 'The light should be:'
    o1: In front of the speaker, not behind
    o2: Behind, for depth
    o3: Overhead only
    o4: Unimportant
  - q: 'A microphone is best placed:'
    o1: About 15 to 30 centimetres away, off the direct breath path
    o2: As close as possible
    o3: Across the room
    o4: On the desk surface
  - q: 'A laptop microphone across a desk gives:'
    o1: Room reverberation and keyboard noise, which cost intelligibility more than any delivery fault
    o2: Adequate sound
    o3: Better sound than a headset
    o4: No difference
  - q: 'Looking at the camera rather than the faces on screen:'
    o1: Is what the listener experiences as eye contact
    o2: Is unnatural and avoidable
    o3: Matters only for recordings
    o4: Is impossible
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Lens at eye level, light in front, microphone close: the setup costs nothing per talk and outranks delivery'
  verify:
    authored: true
- template: spk-mic-distance
  skill: speak.mediated
  pace: quick
  given:
    d1:
      pick:
      - 20
      - 30
    d2:
      pick:
      - 60
      - 100
      - 150
  require:
  - d2 > d1
  prompt: Sound intensity falls with the square of distance. Moving a microphone from {{d1}} to {{d2}} cm changes the direct-sound level by what factor?
  parts:
  - ask: Answer
    label: v
    tex: \times
    value: (d1/d2)^2
    tol: 0.005
    explain: 'Direct sound falls with the square of distance while room reverberation does not, so moving the microphone away costs intelligibility twice: less signal and the same reflected noise'
  verify:
    expect:
      v: Rational(d1, d2)**2
- template: spk-remote-lag
  skill: speak.mediated
  pace: recall
  cases:
  - q: 'A clear falling ending matters more on a remote call because:'
    o1: The listener cannot read the visual cues that normally mark a finished turn
    o2: The audio is worse
    o3: The lag is variable
    o4: Turns are longer
  - q: 'A pause before answering on a remote call should be:'
    o1: Long enough to let the lag resolve, so you do not speak over the other person
    o2: The same as in person
    o3: Shorter than in person
    o4: Avoided
  - q: 'Talking over someone on a laggy call usually means:'
    o1: Both stop, and the turn has to be renegotiated
    o2: A minor interruption
    o3: Nothing
    o4: The louder one continues
  - q: 'Handing the turn over explicitly on a remote call:'
    o1: Removes the ambiguity the lag creates
    o2: Is unnecessary
    o3: Sounds formal
    o4: Slows the meeting
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The lag removes the cues that manage turns, so the endings and the hand-offs have to be explicit
  verify:
    authored: true
- template: spk-lag-wait
  skill: speak.mediated
  pace: quick
  given:
    lg:
      pick:
      - 120
      - 300
      - 600
    sf:
      pick:
      - 2
      - 3
  prompt: A round-trip lag of {{lg}} ms means waiting how long after the other person appears to stop, to be sure they have (seconds), allowing a safety factor of {{sf}}?
  parts:
  - ask: Answer
    label: v
    tex: seconds
    value: lg*sf/1000
    tol: 0.005
    explain: 'A few hundred milliseconds doubled is still under a second, which is the practical answer: a deliberate short pause before answering costs almost nothing and prevents most collisions'
  verify:
    expect:
      v: Rational(lg*sf, 1000)
- template: spk-objection-budget
  skill: speak.persuade
  pace: quick
  given:
    dur:
      pick:
      - 60
      - 120
      - 180
    ob:
      pick:
      - 10
      - 20
      - 40
  require:
  - ob < dur
  prompt: A {{dur}}-second recommendation spends {{ob}} seconds naming and answering the strongest objection. What percentage of the turn is that?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*ob/dur
    tol: 0.005
    explain: A fifth of the turn spent on the strongest objection is usually well spent, because the alternative is spending the whole Q&A on it with the framing chosen by someone else
  verify:
    expect:
      v: 100*Rational(ob, dur)
- template: spk-ask-parts
  skill: speak.persuade
  pace: recall
  cases:
  - q: 'A specific ask names:'
    o1: Who does what, by when
    o2: What is needed
    o3: Why it matters
    o4: The cost
  - q: '''Let me know what you think'' as an ask:'
    o1: Names no action, so nothing happens
    o2: Is appropriately open
    o3: Invites discussion
    o4: Is sufficient
  - q: 'The easiest ask is one that:'
    o1: The listener can act on without needing anyone else's approval
    o2: Costs least
    o3: Takes least time
    o4: Is most important
  - q: 'An ask with no date:'
    o1: Is deferred indefinitely, since everything with a date outranks it
    o2: Is flexible
    o3: Is polite
    o4: Is fine for small asks
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Who, what, by when, and within the listener''s own authority: four properties, all of them checkable'
  verify:
    authored: true
- template: spk-story-share
  skill: speak.persuade
  pace: quick
  given:
    mn:
      pick:
      - 15
      - 30
      - 50
    st:
      pick:
      - 45
      - 90
      - 180
  prompt: A {{mn}}-minute lesson opens with a {{st}}-second story. What percentage of the lesson is the story?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*st/(mn*60)
    tol: 0.005
    explain: 'A story is worth a few per cent of a lesson, and the sentence connecting it to the content is what earns that: an unconnected story at five per cent is five per cent wasted'
  verify:
    expect:
      v: 100*Rational(st, mn*60)
- template: spk-build-rate
  skill: speak.listen
  pace: quick
  given:
    nt:
      pick:
      - 10
      - 24
      - 40
    nb:
      pick:
      - 3
      - 15
      - 32
  require:
  - nb < nt
  prompt: In a conversation of {{nt}} turns, {{nb}} build on the previous point. What percentage changed the subject?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(nt - nb)/nt
    tol: 0.005
    explain: 'Counting building turns on a transcript is the measurement behind ''good listener'': a conversation where most turns change the subject is two people waiting to speak'
  verify:
    expect:
      v: 100*Rational(nt - nb, nt)
- template: spk-one-target
  skill: speak.review
  pace: recall
  cases:
  - q: 'One measurable target per practice block is used because:'
    o1: Two targets at once means neither is attended to while speaking
    o2: It is simpler to record
    o3: Blocks are short
    o4: It is conventional
  - q: 'A good target is:'
    o1: A number the speaker can check immediately after the rep
    o2: An improvement in confidence
    o3: A better structure
    o4: More variety
  - q: '''Be clearer'' as a target fails because:'
    o1: Nothing in the recording settles whether it was met
    o2: It is too ambitious
    o3: It is too easy
    o4: It is vague but workable
  - q: 'The target changes when:'
    o1: It has been met in consecutive blocks, which is what the log is for
    o2: Each session
    o3: When it is boring
    o4: Monthly
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: One number, checkable off the recording, held until it is met twice
  verify:
    authored: true
- template: spk-evaluation-time
  skill: speak.review
  pace: quick
  given:
    mn:
      pick:
      - 2
      - 3
    op:
      pick:
      - 10
      - 20
      - 30
  require:
  - mn*60 > op + 30
  prompt: A {{mn}}-minute evaluation gives a commend, a recommend and a thing to try. How long is each, with {{op}} seconds of framing (seconds)?
  parts:
  - ask: Answer
    label: v
    tex: seconds
    value: (mn*60 - op)/3
    tol: 0.005
    explain: Thirty to fifty seconds each is enough to be specific about one thing, which is why the count is three rather than everything noticed
  verify:
    expect:
      v: Rational(mn*60 - op, 3)
- template: spk-criterion-spread
  skill: speak.review
  pace: quick
  given:
    a:
      pick:
      - 1
      - 3
      - 5
    b:
      pick:
      - 2
      - 4
    c:
      pick:
      - 1
      - 5
    d:
      pick:
      - 3
      - 4
    e2:
      pick:
      - 2
      - 5
    f:
      pick:
      - 1
      - 4
  prompt: Six criteria are rated 1 to 5, scoring {{a}}, {{b}}, {{c}}, {{d}}, {{e2}} and {{f}}. What is the gap between the highest and the lowest?
  parts:
  - ask: Answer
    label: v
    tex: points
    value: max(a, max(b, max(c, max(d, max(e2, f))))) - min(a, min(b, min(c, min(d, min(e2, f)))))
    final: true
    tol: 0.0001
    explain: A wide spread says the practice has been uneven, and the lowest criterion is where the next block goes; a narrow spread at a low level is a different problem from a wide one
  verify:
    expect:
      v: Max(a, b, c, d, e2, f) - Min(a, b, c, d, e2, f)
- template: spk-outline-density
  skill: speak.longform
  pace: quick
  given:
    mn:
      pick:
      - 20
      - 45
      - 60
    nk:
      pick:
      - 15
      - 40
      - 90
  prompt: A {{mn}}-minute talk is outlined with {{nk}} keywords. How many seconds does each keyword cover?
  parts:
  - ask: Answer
    label: v
    tex: seconds
    value: mn*60/nk
    tol: 0.005
    explain: 'Twenty to forty seconds a keyword is about right: denser and it is a script, sparser and the speaker loses the thread between keywords'
  verify:
    expect:
      v: Rational(mn*60, nk)

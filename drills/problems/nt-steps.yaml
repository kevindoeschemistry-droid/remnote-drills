- template: nt-mersenne-facts
  skill: nt.diophantine
  pace: recall
  cases:
  - q: '2¹¹ − 1 = 2047 = 23 · 89. This shows that:'
    o1: p prime does not make 2ᵖ − 1 prime
    o2: 2ᵖ − 1 is never prime
    o3: 11 is not prime
    o4: Every Mersenne number is composite
  - q: 'If n is composite, 2ⁿ − 1 is:'
    o1: Composite
    o2: Prime
    o3: Perfect
    o4: A power of 2
  - q: 'Every even perfect number has the form:'
    o1: 2ᵖ⁻¹(2ᵖ − 1) with 2ᵖ − 1 prime
    o2: 2ᵖ − 1
    o3: p(p + 1)/2 for a prime p
    o4: 2ᵖ + 1
  - q: 'Whether an odd perfect number exists is:'
    o1: Unknown
    o2: Proved impossible
    o3: 'Known: 945 is one'
    o4: Equivalent to the Riemann hypothesis
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: If n = ab then 2ᵃ − 1 divides 2ⁿ − 1, so only prime exponents can give Mersenne primes, and not all of them do
  verify:
    authored: true

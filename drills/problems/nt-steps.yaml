- template: nt-criterion-facts
  skill: nt.residues
  pace: recall
  cases:
  - q: 'Modulo 13, 5⁶ ≡ −1. Therefore 5 is:'
    o1: Not a square modulo 13
    o2: A square modulo 13
    o3: A primitive root for certain
    o4: Congruent to 1
  - q: 'If a and b are both non-squares modulo an odd prime p, then ab is:'
    o1: A square
    o2: A non-square
    o3: Zero
    o4: Impossible to classify
  - q: 'Modulo an odd prime p, (−1)^((p−1)/2) = 1 exactly when:'
    o1: p ≡ 1 (mod 4)
    o2: p ≡ 3 (mod 4)
    o3: p ≡ 1 (mod 3)
    o4: p > 5
  - q: 'A primitive root modulo an odd prime is always:'
    o1: A non-square
    o2: A square
    o3: Equal to 2
    o4: Congruent to −1
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: 'The squares form a subgroup of index 2 in the units, so the Legendre symbol multiplies: non-square times non-square is a square'
  verify:
    authored: true

    - { q: 'Begins before birth and pauses in prophase I', ans: 1 }
    - { q: 'Meiosis II is completed only if fertilisation occurs', ans: 1 }
  prompt: 'Spermatogenesis or oogenesis: {{q}}?'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["Spermatogenesis", "Oogenesis"]
      correct: ans
      explain: 'Oogenesis divides the cytoplasm unequally so one egg keeps nearly all of it, and pauses twice; spermatogenesis divides equally, all the time, giving four small motile sperm'
  verify: { authored: true }


  prompt: '{{q}}'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["Binds troponin, moving tropomyosin off actin's binding sites", "Detaches myosin from actin", "Cocks the myosin head into high-energy position", "Release of Pᵢ as myosin binds actin; the head pulls the thin filament", "Without ATP, myosin cannot detach from actin"]
      correct: ans
      explain: 'Thin (actin) filaments slide past thick (myosin) ones; the sarcomere shortens but the filaments do not. Each cross-bridge cycle needs one ATP, and contraction stops when Ca²⁺ is pumped back into the SR'

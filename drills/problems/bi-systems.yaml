- template: bi-hpa-feedback
  skill: bio.physiology
  pace: quick
  cases:
    - { q: 'A thyroid tumour makes too much T4. What happens to TSH?', ans: 1 }
    - { q: 'Iodine deficiency lowers T4. What happens to TSH?', ans: 0 }
    - { q: 'A patient takes high-dose cortisol pills. What happens to ACTH?', ans: 1 }
    - { q: 'The adrenal glands are removed. What happens to ACTH?', ans: 0 }
  prompt: '{{q}}'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["It rises", "It falls"]
      correct: ans
      explain: 'The end hormone feeds back on the hypothalamus and pituitary. Too much end hormone shuts down the pituitary signal; too little removes the brake, so the signal rises (and in iodine deficiency the high TSH enlarges the thyroid: a goitre)'
  verify: { authored: true }


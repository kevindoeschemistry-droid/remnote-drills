- template: bi-binary-fission
  skill: bio.diversity
  pace: quick
  given: { N0: { pick: [10, 100, 500] }, g: { pick: [20, 30] }, t: { pick: [120, 180, 240] } }
  prompt: 'A culture of ${{N0}}$ bacteria divides every ${{g}}$ minutes. How many cells are there after ${{t}}$ minutes of unlimited growth?'

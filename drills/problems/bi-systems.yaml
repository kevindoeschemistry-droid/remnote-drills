# ── circulation, respiration, immunity ─────────────────────────────────────
- template: bi-blood-path
  skill: bio.physiology
  pace: recall
  cases:
    - { q: 'After the right ventricle, blood goes to', ans: 0 }
    - { q: 'Blood returning from the lungs enters', ans: 1 }
    - { q: 'After the left ventricle, blood goes to', ans: 2 }
    - { q: 'Which vessels carry oxygenated blood?', ans: 3 }
    - { q: 'Why are artery walls thick and elastic?', ans: 4 }
  prompt: '{{q}} …'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["the pulmonary arteries and the lungs", "the left atrium, through the pulmonary veins", "the aorta and the body", "Pulmonary veins and systemic arteries", "To withstand and smooth out high pressure from the ventricles"]
      correct: ans
      explain: 'Body → venae cavae → right atrium → right ventricle → pulmonary arteries → lungs → pulmonary veins → left atrium → left ventricle → aorta. Arteries carry blood away from the heart, veins toward it, whatever its O₂ content; capillaries are one cell thick for exchange'
  verify: { authored: true }

- template: bi-oxygen-curve
  skill: bio.physiology
  pace: recall
  cases:
    - { q: 'Higher CO₂ in active muscle', ans: 0 }
    - { q: 'Lower pH (more acid)', ans: 0 }
    - { q: 'Higher temperature', ans: 0 }
    - { q: 'Fetal hemoglobin compared with adult', ans: 1 }
    - { q: 'Myoglobin compared with hemoglobin', ans: 1 }
    - { q: 'Lower 2,3-BPG', ans: 1 }
  prompt: 'Which way does this shift the oxygen–hemoglobin dissociation curve: {{q}}?'
  parts:
    - ask: 'Shift'
      label: a
      choice: ["Right: lower affinity, more O₂ unloaded to tissues", "Left: higher affinity, holds O₂ more tightly"]
      correct: ans
      explain: 'The Bohr effect: CO₂, acid, heat and 2,3-BPG (all signs of active tissue) lower hemoglobin''s affinity so it unloads O₂ where it is needed. Fetal hemoglobin and myoglobin sit left, so they take O₂ from maternal hemoglobin and from blood'
  verify: { authored: true }

- template: bi-ventilation
  skill: bio.physiology
  pace: recall
  cases:
    - { q: 'How does air enter the lungs?', ans: 0 }
    - { q: 'How is most CO₂ carried in blood?', ans: 1 }
    - { q: 'What mainly drives the urge to breathe?', ans: 2 }
    - { q: 'Why do O₂ and CO₂ cross the alveolar wall?', ans: 3 }
  prompt: '{{q}}'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["The diaphragm contracts, the chest expands and pressure falls below atmospheric", "As bicarbonate (HCO₃⁻), made by carbonic anhydrase in red cells", "Rising blood CO₂, sensed as falling pH in the medulla", "Diffusion down their partial-pressure gradients"]
      correct: ans
      explain: 'Breathing is negative-pressure ventilation. Gas exchange is passive diffusion across a thin, moist, huge surface; CO₂, not O₂, is the main stimulus to breathe'
  verify: { authored: true }

- template: bi-innate-adaptive
  skill: bio.physiology
  pace: recall
  cases:
    - { q: 'Skin, mucus and stomach acid', ans: 0 }
    - { q: 'Neutrophils and macrophages engulfing any bacteria', ans: 0 }
    - { q: 'Antibodies against one specific antigen', ans: 1 }
    - { q: 'Inflammation and fever', ans: 0 }
    - { q: 'Memory cells that respond faster to a second exposure', ans: 1 }
    - { q: 'Natural killer cells attacking cells without MHC I', ans: 0 }
  prompt: 'Innate or adaptive immunity: {{q}}?'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["Innate: fast, non-specific, no memory", "Adaptive: slower first time, specific, with memory"]
      correct: ans
      explain: 'Innate defenses recognise broad patterns shared by many pathogens. Adaptive responses by B and T cells recognise specific antigens, take days the first time and leave memory, which is how vaccines work'
  verify: { authored: true }

- template: bi-lymphocytes
  skill: bio.physiology
  pace: recall
  cases:
    - { q: 'Differentiate into plasma cells that secrete antibodies', ans: 0 }
    - { q: 'Recognise antigen on MHC II and activate B cells and cytotoxic T cells', ans: 1 }
    - { q: 'Kill infected or cancerous cells that show antigen on MHC I', ans: 2 }
    - { q: 'Present antigen on MHC II to start the adaptive response', ans: 3 }
    - { q: 'The cells HIV infects and destroys', ans: 1 }
  prompt: 'Which cell: {{q}}?'
  parts:
    - ask: 'Cell'
      label: a
      choice: ["B cells", "Helper T cells (CD4+)", "Cytotoxic T cells (CD8+)", "Dendritic cells and macrophages"]
      correct: ans
      explain: 'Humoral immunity: B cells and antibodies, against pathogens in body fluids. Cell-mediated: cytotoxic T cells against infected cells. Helper T cells coordinate both, which is why losing them (AIDS) cripples the whole system'
  verify: { authored: true }


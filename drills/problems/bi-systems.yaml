# Animal physiology, development and diversity for AP Biology and the DAT.

# ── nervous and endocrine ──────────────────────────────────────────────────
- template: bi-action-potential
  skill: bio.physiology
  pace: recall
  cases:
    - { q: 'What keeps the resting potential near −70 mV?', ans: 0 }
    - { q: 'What causes the rising phase (depolarization)?', ans: 1 }
    - { q: 'What causes repolarization?', ans: 2 }
    - { q: 'Why does the impulse travel one way along the axon?', ans: 3 }
    - { q: 'Why is conduction faster in myelinated axons?', ans: 4 }
  prompt: '{{q}}'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["K⁺ leaking out through open channels, with the Na⁺/K⁺ pump keeping the gradients", "Voltage-gated Na⁺ channels open and Na⁺ rushes in", "Na⁺ channels inactivate and voltage-gated K⁺ channels let K⁺ out", "Na⁺ channels just behind the impulse are inactivated (refractory)", "The impulse jumps between nodes of Ranvier (saltatory conduction)"]
      correct: ans
      explain: 'Threshold opens voltage-gated Na⁺ channels (positive feedback), then they inactivate and K⁺ channels restore and briefly overshoot the resting potential. An action potential is all-or-none; stimulus strength is coded by frequency'
  verify: { authored: true }


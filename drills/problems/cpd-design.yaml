    o2: A list of Cartesian coordinates only
    o3: A sequence string only
    o4: An energy value only
  - q: 'Pose numbering runs:'
    o1: 1 to N over every residue in the structure, ignoring chains and gaps
    o2: The same as the PDB numbering
    o3: From 0
    o4: Separately for each chain
  - q: 'A PDB file numbers residue 1A then 1B (an insertion code). In pose numbering these are:'
    o1: Two consecutive integers
    o2: The same index
    o3: Skipped
    o4: Negative indices
  - q: 'A gap in PDB numbering (a missing loop) means pose indices after the gap are:'
    o1: Smaller than the PDB numbers, because nothing was inserted for missing residues
    o2: Identical to the PDB numbers
    o3: Negative
    o4: Undefined
  - q: 'Before a structure is used, cleaning the PDB file matters because:'
    o1: Waters, ligands, alternate conformations and insertion codes can break the numbering or the chemistry
    o2: The file is too large otherwise
    o3: Energies cannot be computed at all
    o4: Chains must be renamed
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Pose indices are contiguous; PDB numbering is whatever the depositor chose

# Second question types; keys recomputed by sympy along another route.

- template: cpd-dihedrals
  skill: design.structure
  pace: recall
  cases:
  - q: Which backbone dihedral is held nearly planar?
    o1: ω, at about 180° in the trans peptide bond
    o2: φ
    o3: ψ
    o4: χ1
  - q: The right-handed α-helix sits near which backbone angles?
    o1: φ ≈ −60°, ψ ≈ −45°
    o2: φ ≈ +60°, ψ ≈ +45°
    o3: φ ≈ −120°, ψ ≈ +130°
    o4: φ ≈ 180°, ψ ≈ 180°
  - q: An extended β-strand sits near which backbone angles?
    o1: φ ≈ −120°, ψ ≈ +130°
    o2: φ ≈ −60°, ψ ≈ −45°
    o3: φ ≈ 0°, ψ ≈ 0°
    o4: φ ≈ +60°, ψ ≈ +60°
  - q: Which residue occupies the widest range of the Ramachandran plot?
    o1: Glycine, which has no side chain beyond its hydrogen
    o2: Tryptophan
    o3: Proline
    o4: Valine
  - q: 'Proline is restricted in φ because:'
    o1: Its side chain is bonded back to the backbone nitrogen
    o2: It is charged
    o3: It is the largest residue
    o4: It cannot form hydrogen bonds
  - q: The dihedral φ is defined by which four atoms?
    o1: C(previous)−N−Cα−C
    o2: N−Cα−C−N(next)
    o3: Cα−C−N−Cα
    o4: N−Cα−Cβ−Cγ
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Two free backbone dihedrals per residue, one nearly fixed, and side-chain χ angles beyond them
  verify:
    authored: true
- template: cpd-levinthal
  skill: design.structure
  pace: quick
  given:
    n:
      pick:
      - 50
      - 100
      - 150
    k:
      pick:
      - 3
      - 4
  prompt: A chain of {{n}} residues is modelled with {{k}} allowed states for each of its two free backbone dihedrals. How many backbone conformations is that? Give log₁₀ of the count.
  parts:
  - ask: Answer
    label: v
    tex: \log_{10}
    value: 2*n*log(k, 10)
    tol: 0.005
    explain: 'Each residue contributes k² conformations, so the count is k^(2n): enumeration is impossible and the search must be guided'
  verify:
    expect:
      v: 2*n*log(k)/log(10)
- template: cpd-rotamer-lib
  skill: design.structure
  pace: recall
  cases:
  - q: 'A rotamer library lists:'
    o1: The favoured side-chain χ combinations and their probabilities
    o2: Every possible side-chain conformation on a fine grid
    o3: Backbone fragments from known structures
    o4: Partial charges for each atom
  - q: 'A backbone-dependent rotamer library conditions those probabilities on:'
    o1: The residue's φ and ψ
    o2: The solvent
    o3: The chain length
    o4: The temperature
  - q: 'The energy term that scores the internal strain of the chosen rotamer is:'
    o1: fa_dun, from the Dunbrack rotamer probabilities
    o2: fa_atr
    o3: fa_sol
    o4: fa_elec
  - q: 'Treating side chains as a discrete rotamer set makes the packing problem:'
    o1: A discrete optimisation that can be precomputed as a pair-energy table
    o2: Continuous and smooth
    o3: Exactly solvable in all cases
    o4: Independent of the backbone
  - q: Which residue has no χ angles at all?
    o1: Glycine
    o2: Alanine
    o3: Serine
    o4: Proline
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Discretising side chains is what makes design computationally tractable
  verify:
    authored: true
- template: cpd-rotamer-energy
  skill: design.structure
  pace: quick
  given:
    p:
      pick:
      - 0.5
      - 0.1
      - 0.05
      - 0.01
  prompt: At 298.15 K, a rotamer whose library probability is {{p}} times that of the most favoured rotamer costs how much energy (kcal/mol) in the fa_dun term?
  parts:
  - ask: Answer
    label: v
    tex: kcal/mol
    value: -0.0019872043*298.15*log(p)
    tol: 0.005
    explain: A probability maps to an energy by −kT ln p, so a tenfold rarer rotamer costs about 1.4 kcal/mol at room temperature
  verify:
    expect:
      v: -(Rational('0.0019872043')*Rational('298.15'))*log(nsimplify(p))
- template: cpd-pose

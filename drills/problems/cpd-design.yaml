  - q: 'Increasing the number of rotamers sampled per position (a finer library) mainly costs:'
    o1: Time, because the pair-energy table grows with the square of the rotamer count
    o2: Accuracy
    o3: Memory only, with no time cost
    o4: Nothing
  - q: 'A residue whose χ angles are badly placed but whose identity is right would be fixed by:'
    o1: Repacking that position
    o2: Designing that position
    o3: Changing the backbone
    o4: Lowering the temperature
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: fa_dun is where a strained side chain shows up, and repacking is the cure
  verify:
    authored: true
- template: cpd-rotamer-prob
  skill: design.structure
  pace: quick
  given:
    dg:
      pick:
      - 0.5
      - 1.0
      - 1.4
      - 2.0
  prompt: A rotamer costs {{dg}} kcal/mol in fa_dun relative to the best rotamer at 298.15 K. What is its relative probability?
  parts:
  - ask: Answer
    label: v
    tex: p/p_0
    value: exp(-dg/(0.0019872043*298.15))
    tol: 0.005
    explain: 'The reverse of the energy–probability map: an energy penalty of about 1.4 kcal/mol is a tenfold drop in probability'
  verify:
    expect:
      v: exp(-nsimplify(dg)/(Rational('0.0019872043')*Rational('298.15')))

  - e1: -310.0
    e2: -306.5
    r1: -120.0
    r2: -118.8
  - e1: -288.4
    e2: -291.0
    r1: -101.5
    r2: -102.9
  - e1: -415.0
    e2: -413.2
    r1: -160.0
    r2: -159.1
  - e1: -250.6
    e2: -254.0
    r1: -95.0
    r2: -96.2
  prompt: A point mutation changes the folded-state score from {{e1}} to {{e2}} kcal/mol, while the reference sum changes from {{r1}} to {{r2}}. What is the predicted ΔΔG of folding?
  parts:
  - ask: Answer
    label: v
    tex: kcal/mol
    value: (e2 - r2) - (e1 - r1)
    tol: 0.005
    explain: Both states move, so subtract each one's reference sum first; a positive result is destabilising
  verify:

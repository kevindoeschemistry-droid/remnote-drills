- template: cpd-metropolis-de
  skill: design.sampling
  pace: quick
  given:
    t:
      pick:
      - 300
      - 500
      - 1000
    p:
      pick:
      - 0.5
      - 0.1
      - 0.05
  prompt: At {{t}} K, what energy increase (kcal/mol) does a Monte Carlo move need for its acceptance probability to be exactly {{p}}?
  parts:

- template: cpd-interface-scenario
  skill: design.interfaces
  pace: recall
  cases:
  - q: 'A project must design a binder to a fixed viral surface protein. This is:'
    o1: One-sided design, the harder case
    o2: Two-sided design
    o3: A mutational scan
    o4: Docking only
  - q: 'A project designs a new homodimer interface from scratch. This is:'
    o1: Two-sided and symmetric, the easier case
    o2: One-sided
    o3: Negative design only
    o4: Ligand design
  - q: 'Designing a protein that binds target A but not its close homologue B requires:'
    o1: Negative design against B as well as positive design for A
    o2: Positive design for A alone
    o3: A finer rotamer library
    o4: A longer simulation
  - q: 'A designed nanocage uses symmetry so that:'
    o1: One designed interface repeats into a large assembly
    o2: No interface is needed
    o3: The sequence is shorter
    o4: No energy function is needed
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Count how many surfaces you control, and whether you must also design against something
  verify:
    authored: true
- template: cpd-backbone-pick
  skill: design.denovo
  pace: recall
  cases:
  - q: 'A project wants an idealised four-helix bundle with a specified radius. The right route:'
    o1: Parametric generation from the bundle's geometric parameters
    o2: Fragment assembly
    o3: Diffusion from noise, necessarily
    o4: Template-based modelling
  - q: 'A project wants a novel fold with an irregular mixed topology. Parametric equations are:'
    o1: Poorly suited, because the fold is not described by a few parameters
    o2: The best choice
    o3: Equivalent to fragments
    o4: Required
  - q: 'Fragment assembly biases designs toward:'
    o1: Local geometries that occur in known structures
    o2: Entirely novel local geometries
    o3: Extended chains
    o4: Membrane folds
  - q: 'A specified set of residue–residue contacts is best imposed by:'
    o1: Constraints added to the score during backbone generation
    o2: Parametric equations
    o3: A finer rotamer library
    o4: Negative design
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Match the generation method to how regular the target fold is
  verify:
    authored: true
- template: cpd-coiled-coil-length
  skill: design.denovo
  pace: quick
  given:
    ln:
      pick:
      - 60
      - 75
      - 90
    ri:
      pick:
      - 1.45
      - 1.5
  prompt: A designed bundle must span {{ln}} Å along its superhelical axis. At a rise of {{ri}} Å per residue, how many residues per helix is that?
  parts:
  - ask: Answer
    label: v
    tex: residues
    value: ln/ri
    tol: 0.005
    explain: 'The reverse of the parametric calculation: the length you want fixes the helix length you must design'
  verify:
    expect:
      v: nsimplify(ln)/nsimplify(ri)
- template: cpd-hbnet-scenario
  skill: design.denovo
  pace: recall
  cases:
  - q: 'A design with a buried hydrogen-bond network is relaxed afterwards and the network breaks. The fix:'
    o1: Constrain or fix the network residues during later steps
    o2: Remove the network
    o3: Lower the repulsive weight permanently
    o4: Redesign the surface
  - q: 'A designed core is entirely hydrophobic with no polar network. Expect:'
    o1: A stable fold but little conformational specificity between similar folds
    o2: Catalysis
    o3: Instability, necessarily
    o4: No expression
  - q: 'Two designs differ by 0.5 Å in backbone geometry and one loses its network. This illustrates:'
    o1: How sensitive designed polar networks are to backbone detail
    o2: That backbones are rigid
    o3: That the score function is wrong
    o4: That the sequence changed
  - q: 'Buried polar networks add specificity because:'
    o1: Only a partner or conformation that completes the network pays no desolvation penalty
    o2: They increase hydrophobic burial
    o3: They stiffen the backbone
    o4: They lower the reference energy
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'A network is specificity, and it is fragile: protect it through the rest of the protocol'
  verify:
    authored: true
- template: cpd-gap-needed
  skill: design.denovo
  pace: quick
  given:
    f:
      pick:
      - 90
      - 95
      - 99
  prompt: A designed switch must keep at least {{f}} per cent of molecules in the target state at 298.15 K (two states). What energy gap (kcal/mol) is needed?
  parts:
  - ask: Answer
    label: v
    tex: kcal/mol
    value: 0.0019872043*298.15*log(f/(100-f))
    tol: 0.005
    explain: 'Invert the two-state Boltzmann population: 90:10 needs about 1.3 kcal/mol and 99:1 about 2.7, which is why negative design targets a few kcal/mol'
  verify:
    expect:
      v: (Rational('0.0019872043')*Rational('298.15'))*log(Rational(f, 100 - f))
- template: cpd-confidence-scenario
  skill: design.ml
  pace: recall
  cases:
  - q: 'A prediction has pLDDT above 90 throughout two domains but a high PAE between them. The reading:'
    o1: Each domain is confidently modelled but their relative placement is not
    o2: The whole model is wrong
    o3: The whole model is right
    o4: The sequence is wrong
  - q: 'A 40-residue terminal segment has pLDDT near 30 while the rest is above 85. The likely reading:'
    o1: That segment is probably flexible or disordered
    o2: The whole prediction failed
    o3: The segment is the best part
    o4: The MSA is too deep
  - q: 'A designed sequence''s prediction returns high pLDDT and low RMSD to the design target. This shows:'
    o1: The predictor agrees with the design, which is a filter and not evidence of folding
    o2: The design folds in vitro
    o3: The design is catalytically active
    o4: The design is stable at high temperature
  - q: 'Two predictions of a complex disagree about the interface. A useful next check:'
    o1: The PAE across the interface in each prediction
    o2: The sequence length
    o3: The pLDDT average only
    o4: The run time
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Local confidence and relative-placement confidence answer different questions
  verify:
    authored: true
- template: cpd-msa-scenario
  skill: design.ml
  pace: recall
  cases:
  - q: 'A target protein is from a family with only a handful of known homologues. Expect:'
    o1: Lower prediction confidence, because the coevolution signal is weak
    o2: Better predictions
    o3: No effect
    o4: A faster prediction only
  - q: 'A deep MSA of thousands of diverse sequences usually gives:'
    o1: Stronger contact signals and more confident predictions
    o2: Weaker predictions
    o3: No change
    o4: Only speed benefits
  - q: 'Indirect (transitive) couplings in a naive contact analysis cause:'
    o1: False contacts between residues that are each coupled to a common third residue
    o2: Missing contacts only
    o3: Perfect accuracy
    o4: No problem
  - q: 'A designed de novo sequence has no natural homologues at all. For prediction this means:'
    o1: There is no MSA signal, so single-sequence performance is what matters
    o2: Prediction is impossible
    o3: Prediction is more accurate
    o4: The design cannot be scored
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Alignment depth is the hidden input, and de novo designs have none
  verify:
    authored: true
- template: cpd-representation-pick
  skill: design.ml
  pace: recall
  cases:
  - q: 'A task must predict a per-residue property from sequence alone with few labels. A good approach:'
    o1: Fine-tune or probe a pretrained protein language model's embeddings
    o2: Train a convolutional network from scratch on the labels
    o3: Use a diffusion model
    o4: Use docking
  - q: 'A task must score the geometry of residue contacts in a 3D structure. A good approach:'
    o1: A graph network over residues or atoms with message passing
    o2: A sequence language model alone
    o3: A diffusion model alone
    o4: A rotamer library
  - q: 'Making a model equivariant rather than retraining on rotated copies is preferred because:'
    o1: It builds the symmetry in rather than hoping the model learns it
    o2: It is always faster to train
    o3: It needs no data
    o4: It removes the need for validation
  - q: 'Attention in a sequence model lets a residue''s representation depend on:'
    o1: Other residues anywhere in the sequence, weighted by learned relevance
    o2: Only its immediate neighbours
    o3: Its coordinates
    o4: Its rotamer
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'The representation encodes what you believe matters: order, or geometry'
  verify:
    authored: true
- template: cpd-pipeline-order
  skill: design.ml
  pace: recall
  cases:
  - q: In the design pipeline, which order is correct?
    o1: Generate a backbone, design a sequence for it, then predict the structure of that sequence
    o2: Design a sequence, generate a backbone, then predict
    o3: Predict, then generate, then design
    o4: Design and predict only
  - q: 'You must design a binder that holds a known functional motif in a new scaffold. Use:'
    o1: Motif scaffolding in the generative step
    o2: Unconditional generation
    o3: A mutational scan
    o4: Docking alone
  - q: 'A small-molecule binder needs atoms of the ligand represented during generation. That requires:'
    o1: An all-atom generative model rather than a backbone-only one
    o2: A backbone-only model
    o3: A sequence model
    o4: A rotamer library
  - q: 'Designing many sequences per generated backbone is done because:'
    o1: Backbone generation is cheap and sequence quality varies, so the filter needs candidates
    o2: Each backbone has exactly one valid sequence
    o3: It is required by the model
    o4: It speeds up generation
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Each stage answers a different question, and the order is not interchangeable
  verify:
    authored: true
- template: cpd-funnel-reverse
  skill: design.ml
  pace: quick
  given:
    k:
      pick:
      - 20
      - 50
      - 96
    ns:
      pick:
      - 8
      - 16
    p:
      pick:
      - 4
      - 10
      - 25
  prompt: A pipeline must deliver {{k}} designs that pass its filter, designing {{ns}} sequences per backbone with a {{p}} per cent pass rate. How many backbones must be generated?
  parts:
  - ask: Answer
    label: v
    tex: backbones
    value: k*100/(ns*p)
    tol: 0.005
    explain: Work the funnel backwards from the number of designs you intend to order
  verify:
    expect:
      v: Rational(k*100, ns*p)
- template: cpd-evidence-level
  skill: design.ml
  pace: recall
  cases:
  - q: Which of these is experimental evidence that a design works?
    o1: It expresses, is soluble, and a measured melting curve shows a folded state
    o2: It passes a self-consistency filter
    o3: Its predicted structure has high pLDDT
    o4: Its score is very negative
  - q: 'Two models in a pipeline were trained on overlapping data. Their agreement therefore:'
    o1: May reflect shared bias rather than correctness
    o2: Proves correctness
    o3: Is irrelevant
    o4: Means one is redundant
  - q: 'A reasonable use of a self-consistency filter is to:'
    o1: Reduce thousands of candidates to the ones worth making
    o2: Replace laboratory characterisation
    o3: Measure stability
    o4: Prove function
  - q: 'Reporting a design as ''validated'' after only computational filters is:'
    o1: Overclaiming; the filters rank candidates
    o2: Standard and correct
    o3: Required by the field
    o4: A statement about stability
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Computational agreement is a filter; evidence comes from the bench
  verify:
    authored: true
- template: cpd-experiment-order
  skill: design.validation
  pace: recall
  cases:
  - q: 'A design does not express at all. The next step is:'
    o1: Revisit solubility and expression (codon usage, tags, host) before concluding the design is wrong
    o2: Measure its melting temperature
    o3: Attempt crystallography
    o4: Measure catalysis
  - q: 'A design expresses and is soluble but shows no cooperative unfolding transition. The likely reading:'
    o1: It is probably not folded into a well-defined structure
    o2: It is highly stable
    o3: It is catalytically active
    o4: It is a crystallography failure
  - q: 'Deciding oligomeric state before interpreting a binding assay matters because:'
    o1: An unintended oligomer changes the apparent stoichiometry and affinity
    o2: It is required for expression
    o3: It sets the melting temperature
    o4: It determines the sequence
  - q: 'A high-resolution structure is most valuable when:'
    o1: You need to know whether the designed geometry was actually achieved
    o2: You only need stability
    o3: You only need expression yield
    o4: You need the sequence
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Work up the ladder: expression, fold, state, structure, function'
  verify:
    authored: true
- template: cpd-hit-rate
  skill: design.validation
  pace: quick
  given:
    nn:
      pick:
      - 200
      - 1000
      - 5000
    k:
      pick:
      - 2
      - 7
      - 25
  prompt: A campaign made and screened {{nn}} designs and obtained {{k}} successes. What hit rate (per cent) should the next campaign assume?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*k/nn
    tol: 0.005
    explain: 'The reverse of sizing a campaign: a measured hit rate is the only honest basis for the next one''s size'
  verify:
    expect:
      v: Rational(100*k, nn)
- template: cpd-method-choice-scenario
  skill: design.validation
  pace: recall
  cases:
  - q: 'Three hundred candidate mutations must be narrowed down this week. Use:'
    o1: A score-function scan
    o2: Alchemical free-energy calculations on all of them
    o3: Experiments on all of them
    o4: A structure prediction of each
  - q: 'Four shortlisted mutations must be reported with uncertainties in a paper. Use:'
    o1: Alchemical free-energy calculations
    o2: A score-function scan alone
    o3: Docking
    o4: A language model
  - q: 'A site must be saturated across all 20 amino acids with rigorous free energies. The method suited to this is:'
    o1: λ dynamics, which samples many substituents in one simulation
    o2: Pairwise FEP on all 190 pairs
    o3: A single score evaluation
    o4: A structure prediction
  - q: 'A score-function scan and an alchemical calculation disagree on a mutation''s sign. The better evidence is:'
    o1: The alchemical calculation, if its convergence diagnostics are sound
    o2: The score function, always
    o3: Neither; the question is unanswerable
    o4: Whichever is faster
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Cheap methods to shortlist, rigorous methods to decide, experiment to settle
  verify:
    authored: true
- template: cpd-failure-diagnose
  skill: design.validation
  pace: recall
  cases:
  - q: 'A design is stable but binds nothing. The most likely gap:'
    o1: The interface chemistry, which is harder than the fold
    o2: The reference energies
    o3: The pose numbering
    o4: The rotamer library
  - q: 'A design''s crystal structure shows the intended fold but with a shifted helix. This points at:'
    o1: Backbone flexibility that fixed-backbone design did not anticipate
    o2: A sequencing error
    o3: A score-function bug
    o4: A failed expression
  - q: 'Designs that are over-stabilised and completely rigid may fail at:'
    o1: Function, which often needs motion
    o2: Expression
    o3: Folding
    o4: Crystallisation
  - q: 'A designed loop is disordered in the structure. The usual explanation:'
    o1: Loops are irregular and flexible, and are poorly captured by the score
    o2: Loops are always buried
    o3: Loops have no energy terms
    o4: The loop sequence was wrong
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Most design failures sit where the model is thinnest, not where the code is wrong
  verify:
    authored: true

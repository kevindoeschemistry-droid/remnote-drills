- template: cpd-metropolis
  skill: design.sampling
  pace: recall
  cases:
  - q: 'A Monte Carlo move that raises the score by ΔE is accepted with probability:'
    o1: exp(−ΔE/kT)
    o2: ΔE/kT
    o3: 1 always
    o4: 0 always
  - q: 'Uphill moves are accepted so that the search can:'
    o1: Escape local minima that gradient descent cannot leave
    o2: Raise the final energy
    o3: Run faster
    o4: Avoid computing the energy
  - q: 'A move that lowers the score is accepted with probability:'
    o1: '1'
    o2: exp(−ΔE/kT)
    o3: '0.5'
    o4: '0'
  - q: 'Gradient-based minimisation finds:'
    o1: The nearest local minimum, which need not be the global one
    o2: The global minimum always
    o3: A random conformation
    o4: The unfolded state
  - q: 'Simulated annealing lowers the temperature during the run so that:'
    o1: Early moves explore widely and later moves settle into a minimum
    o2: The energy function changes
    o3: Fewer moves are needed
    o4: The result is deterministic
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Metropolis with a falling temperature is the search behind both folding and packing
  verify:
    authored: true
- template: cpd-accept-ratio
  skill: design.sampling
  pace: quick
  given:
    de:
      pick:
      - 1.0
      - 2.0
      - 3.0
    t1:
      pick:
      - 600
      - 500
    t2:
      pick:
      - 300
      - 250
  prompt: At {{t1}} K a Monte Carlo move raises the score by {{de}} kcal/mol. By what factor does its acceptance probability fall when the temperature drops to {{t2}} K?
  parts:
  - ask: Answer
    label: v
    tex: \times
    value: exp(-de/(0.0019872043*t2))/exp(-de/(0.0019872043*t1))
    tol: 0.005
    explain: The acceptance ratio is exp(−ΔE/kT); cooling multiplies the exponent, so the same uphill move becomes far less likely
  verify:
    expect:
      v: exp(-nsimplify(de)/(Rational('0.0019872043')*t2))/exp(-nsimplify(de)/(Rational('0.0019872043')*t1))
- template: cpd-packer
  skill: design.sampling
  pace: recall
  cases:
  - q: 'The packer optimises:'
    o1: Which rotamer sits at each allowed position, by simulated annealing over the discrete set
    o2: Backbone dihedrals continuously
    o3: The energy-function weights
    o4: The sequence length
  - q: 'Minimisation differs from packing in that it:'
    o1: Moves continuous degrees of freedom downhill rather than choosing discrete rotamers
    o2: Changes the sequence
    o3: Is stochastic
    o4: Ignores the energy function
  - q: 'Relax is used because:'
    o1: Alternating packing and minimisation settles a structure without letting it drift far
    o2: It changes the sequence
    o3: It is faster than packing alone
    o4: It guarantees the global minimum
  - q: 'A task that accidentally allows every position to design will:'
    o1: Change the whole sequence rather than only the intended positions
    o2: Fail with an error
    o3: Repack only
    o4: Have no effect
  - q: 'Packing requires a precomputed table of:'
    o1: One-body rotamer energies and two-body rotamer pair energies
    o2: Backbone fragments
    o3: Experimental ΔΔG values
    o4: Solvent coordinates
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Discrete packing and continuous minimisation do different jobs; relax interleaves them
  verify:
    authored: true
- template: cpd-pair-table
  skill: design.sampling
  pace: quick
  given:
    n:
      pick:
      - 8
      - 10
      - 12
    k:
      pick:
      - 20
      - 30
      - 50
  prompt: Packing {{n}} positions with {{k}} rotamers each needs how many two-body pair-energy entries (all position pairs, all rotamer combinations)?
  parts:
  - ask: Answer
    label: v
    tex: entries
    value: n*(n-1)/2*k^2
    final: true
    tol: 0.0001
    explain: 'n(n−1)/2 position pairs times k² rotamer combinations each: the table, not the annealing, is usually the cost'
  verify:
    expect:
      v: Rational(n*(n-1), 2)*k**2

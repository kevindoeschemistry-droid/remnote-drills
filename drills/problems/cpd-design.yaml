- template: cpd-weight-change
  skill: design.energy
  pace: quick
  given:
    rep:
      pick:
      - 12.0
      - 25.0
      - 40.0
    w:
      pick:
      - 0.02
      - 0.1
      - 0.275
  prompt: A structure has unweighted fa_rep of {{rep}} kcal/mol. A protocol temporarily softens repulsion by scaling the fa_rep weight from 0.55 to {{w}}. By how much (kcal/mol) does the weighted total fall?
  parts:

  pace: recall
  cases:
  - q: 'The reference energy (ref) stands for:'
    o1: A constant per amino-acid type approximating its unfolded-state energy
    o2: The energy of the native structure
    o3: A solvation correction
    o4: The lowest score seen so far
  - q: 'The reference energies were fitted to:'
    o1: Maximise recovery of native sequences in design
    o2: Match gas-phase quantum calculations
    o3: Reproduce melting temperatures
    o4: Minimise run time
  - q: 'For a fixed sequence, ref contributes:'
    o1: A constant offset that cancels in any comparison of conformations
    o2: A different value per conformation
    o3: Nothing at all
    o4: The dominant term
  - q: 'Without reference energies, design would:'
    o1: Favour whichever residues the other terms happen to score well, biasing composition
    o2: Produce no sequence at all
    o3: Be exactly correct
    o4: Run faster but identically
  - q: 'ref matters for design because design compares:'
    o1: Different sequences on the same backbone
    o2: Different backbones with the same sequence
    o3: Different temperatures
    o4: Different force fields
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: ref is how a fixed-backbone score stands in for a folding free energy
  verify:
    authored: true

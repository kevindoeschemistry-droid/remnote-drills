- template: cpd-terms
  skill: design.energy
  pace: recall
  cases:
  - q: 'fa_atr and fa_rep come from:'
    o1: The Lennard-Jones potential, split at its minimum into attractive and repulsive parts
    o2: A statistical survey of structures
    o3: The Dunbrack library
    o4: A Coulomb sum
  - q: 'fa_sol implements:'
    o1: Lazaridis–Karplus Gaussian-exclusion desolvation
    o2: Lennard-Jones attraction
    o3: Rotamer probabilities
    o4: Disulfide geometry
  - q: 'lk_ball_wtd adds what the isotropic solvation term misses:'
    o1: 'Direction: it penalises burying a polar atom where its ideal water sites are blocked'
    o2: Longer-range attraction
    o3: Backbone torsion preferences
    o4: Disulfide bonding
  - q: 'fa_elec uses a distance-dependent dielectric that:'
    o1: Rises from a low value in the core toward that of bulk solvent
    o2: Is fixed at 1
    o3: Is fixed at 80
    o4: Depends on the residue type only
  - q: Which of these is a knowledge-based term fitted to structural statistics?
    o1: p_aa_pp, the propensity of an amino acid at given φ/ψ
    o2: fa_atr
    o3: fa_sol
    o4: fa_elec
  - q: 'rama_prepro differs from a plain Ramachandran term by:'
    o1: Using a separate map when the next residue is proline
    o2: Ignoring glycine
    o3: Being physics-based
    o4: Scoring side chains
  - q: 'The repulsive part of the Lennard-Jones term is softened at very short distances to:'
    o1: Keep minimisation stable
    o2: Match experiment exactly
    o3: Speed up scoring
    o4: Allow atom overlap in the final model
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Physics-based terms carry weight 1.0; the statistical terms are fitted and weighted down
  verify:
    authored: true

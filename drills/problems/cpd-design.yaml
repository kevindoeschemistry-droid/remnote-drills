    o1: A single pseudo-atom carrying its size and polarity
    o2: Its Cα only
    o3: Nothing at all
    o4: A full rotamer
  - q: 'Centroid mode is used for:'
    o1: Fast, aggressive search of conformational space
    o2: Final ranking of near-native models
    o3: Computing hydrogen bonds between side chains
    o4: Scoring disulfides
  - q: 'Full-atom mode is used for:'
    o1: Local refinement and final discrimination between models
    o2: Global fold search
    o3: Fragment insertion
    o4: Nothing; it is obsolete
  - q: 'The usual multi-resolution pattern is:'
    o1: Coarse-grained global search, then all-atom refinement
    o2: All-atom search throughout
    o3: Centroid only
    o4: Random sampling then no refinement
  - q: 'Side-chain hydrogen bonds cannot be scored in centroid mode because:'
    o1: The side-chain atoms are not represented
    o2: The energy function has no hydrogen-bond term
    o3: They do not matter for folding
    o4: They are computed separately by MD
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Two resolutions, two jobs: search wide and cheap, then refine and rank'

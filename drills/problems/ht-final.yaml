  prompt: 'Steady state: {{what}} absorbs ${{qin}}$ W/m² and loses heat by convection ($h = {{h}}$ W/m²·K to air at ${{Tinf}}$ K) and by radiation ($\varepsilon = {{eps}}$, surroundings at ${{Tsur}}$ K), back insulated. What is its temperature?'
  parts:
  - {ask: Temperature (K), label: y, value: ans, tol: 0.001, explain: 'Surface energy balance: $q''''_{in} = h(T - T_\infty) + \varepsilon\sigma(T^4 - T_{sur}^4)$, solved by iteration (guess, update, repeat). Solar gain uses the solar absorptivity $\alpha_S$; emission uses the long-wave $\varepsilon$, which is why white paint keeps a roof cool'}

  verify:
    expect:
      v: Abs(q + Qs)/10**9/(4*pi*Rational(8854, 1000)/10**12*nsimplify(d)**2)*(4*pi*Rational(8854, 1000)/10**12*Rational(899, 100)*10**9)
- template: ph-sharing-density-ratio
  skill: physics.calc-em
  pace: quick
  given:
    R1:
      pick:
      - 1
      - 2
    R2:
      pick:
      - 5
      - 10
  prompt: Two far-apart metal spheres of radii {{R1}} and {{R2}} cm are joined by a wire. What is the ratio of surface charge densities σ₁/σ₂?
  parts:
  - ask: Answer
    label: v
    tex: \sigma_1/\sigma_2
    value: R2/R1
    tol: 0.005
    explain: 'Equal potentials put charge in proportion to R, so σ ∝ 1/R: sharp points carry dense charge'
  verify:
    expect:
      v: (R1/(R1 + R2)/R1**2)/(R2/(R1 + R2)/R2**2)
- template: ph-isolated-sphere-capacitance
  skill: physics.calc-em
  pace: quick
  given:
    R:
      pick:
      - 1
      - 10
      - 50
  prompt: What is the capacitance of an isolated metal sphere of radius {{R}} cm, in pF? (ε₀ = 8.854 × 10⁻¹²)
  parts:
  - ask: Answer
    label: v
    tex: C
    value: 4*pi*8.854e-12*R/100*1e12
    tol: 0.005
    explain: 'A spherical capacitor with the outer shell sent to infinity: even the Earth is only about 700 μF'
  verify:
    expect:
      v: limit(4*pi*Rational(8854, 1000)/10**12*nsimplify(R)/100*Symbol('b')/(Symbol('b') - nsimplify(R)/100), Symbol('b'), oo)*10**12
- template: ph-sphere-field-energy
  skill: physics.calc-em
  pace: quick
  given:
    R:
      pick:
      - 1
      - 5
      - 10
    Q:
      pick:
      - 5
      - 10
      - 50
  prompt: A metal sphere of radius {{R}} cm holds {{Q}} nC. How much energy is stored in its field, in μJ? (ε₀ = 8.854 × 10⁻¹²)
  parts:
  - ask: Answer
    label: v
    tex: U
    value: (Q*1e-9)^2/(8*pi*8.854e-12*R/100)*1e6
    tol: 0.005
    explain: 'Integrate ε₀E²/2 over all space outside: the same as Q²/2C'
  verify:
    expect:
      v: integrate(Rational(8854, 1000)/10**12/2*(Q/10**9/(4*pi*Rational(8854, 1000)/10**12*Symbol('r')**2))**2*4*pi*Symbol('r')**2, (Symbol('r'), nsimplify(R)/100, oo))*10**6
- template: ph-half-filled-gap
  skill: physics.calc-em
  pace: quick
  given:
    k:
      pick:
      - 2
      - 3
      - 5
      - 80
  prompt: A dielectric slab (κ = {{k}}) fills half the gap of a parallel-plate capacitor, covering the whole plate area. By what factor does the capacitance rise?
  parts:
  - ask: Answer
    label: v
    tex: C/C_0
    value: 2*k/(1 + k)
    tol: 0.005
    explain: Two capacitors in series, each half the gap; the empty half limits the gain to at most 2
  verify:
    expect:
      v: 1/(1/(2*nsimplify(k)) + Rational(1, 2))
- template: ph-drift-velocity
  skill: physics.calc-em
  pace: quick
  given:
    A:
      pick:
      - 1
      - 2.5
    I:
      pick:
      - 1
      - 5
      - 10
  prompt: A copper wire of cross-section {{A}} mm² carries {{I}} A. What is the electron drift speed, in mm/s? (n = 8.5 × 10²⁸ m⁻³, e = 1.602 × 10⁻¹⁹ C)
  parts:
  - ask: Answer
    label: v
    tex: v_d
    value: I/(8.5e28*1.602176634e-19*A*1e-6)*1000
    tol: 0.005
    explain: 'Fractions of a millimetre per second: the signal travels fast, the electrons do not'
  verify:
    expect:
      v: solve(Eq(Rational(85, 10)*10**28*Rational('1.602176634e-19')*nsimplify(A)/10**6*x/1000, I), x)[0]
- template: ph-rc-current
  skill: physics.calc-em
  pace: quick
  given:
    C:
      pick:
      - 10
      - 100
    R:
      pick:
      - 1
      - 10
    V:
      pick:
      - 5
      - 12
    t1:
      pick:
      - 1
      - 10
      - 50
  prompt: A {{C}} μF capacitor charges through {{R}} kΩ from a {{V}} V battery. What is the current {{t1}} ms after the switch closes, in mA?
  parts:
  - ask: Answer
    label: v
    tex: I
    value: V/R*exp(-t1/(R*C))
    tol: 0.005
    explain: 'I = dQ/dt: the current starts at V/R and decays with τ = RC (here RC in ms is R[kΩ]·C[μF])'
  verify:
    expect:
      v: diff(nsimplify(C)/10**6*V*(1 - exp(-Symbol('t')/(nsimplify(R)*1000*nsimplify(C)/10**6))), Symbol('t')).subs(Symbol('t'), nsimplify(t1)/1000)*1000
- template: ph-rc-dissipated
  skill: physics.calc-em
  pace: quick
  given:
    C:
      pick:
      - 10
      - 100
      - 1000
    V:
      pick:
      - 5
      - 12
      - 100
  prompt: A {{C}} μF capacitor charges fully from {{V}} V through any resistor. How much energy does the resistor dissipate, in mJ?
  parts:
  - ask: Answer
    label: v
    tex: E_R
    value: 0.5*C*1e-6*V^2*1000
    tol: 0.005
    explain: Exactly half the battery's energy, whatever R is; the other half is stored in the capacitor
  verify:
    expect:
      v: integrate((V/Symbol('Rr')*exp(-Symbol('t')/(Symbol('Rr')*nsimplify(C)/10**6)))**2*Symbol('Rr'), (Symbol('t'), 0, oo))*1000
- template: ph-cyclotron-radius
  skill: physics.calc-em
  pace: quick
  given:
    v:
      pick:
      - 1
      - 5
      - 10
    B:
      pick:
      - 0.1
      - 0.5
      - 1
  prompt: A proton moves at {{v}} × 10⁶ m/s perpendicular to a {{B}} T field. What is the radius of its circle, in cm? (m = 1.673 × 10⁻²⁷ kg, e = 1.602 × 10⁻¹⁹ C)
  parts:
  - ask: Answer
    label: r
    tex: r
    value: 1.67262192e-27*v*1e6/(1.602176634e-19*B)*100
    tol: 0.005
    explain: qvB supplies the centripetal force mv²/r; the period 2πm/qB does not depend on speed
  verify:
    expect:
      r: solve(Eq(Rational('1.67262192e-27')*(v*10**6)**2/(x/100), Rational('1.602176634e-19')*v*10**6*nsimplify(B)), x)[0]
- template: ph-loop-axis-field
  skill: physics.calc-em
  pace: quick
  given:
    R:
      pick:
      - 5
      - 10
    I:
      pick:
      - 1
      - 5
      - 10
    z:
      pick:
      - 5
      - 10
      - 20
  prompt: A loop of radius {{R}} cm carries {{I}} A. What is the field on its axis {{z}} cm from the centre, in μT?
  parts:
  - ask: Answer
    label: v
    tex: B
    value: 4*pi*1e-7*I*(R/100)^2/(2*((R/100)^2 + (z/100)^2)^1.5)*1e6
    tol: 0.005
    explain: 'Biot–Savart: each element''s contribution has the same axial part, so the integral is just 2π times one of them'
  verify:
    expect:
      v: integrate(4*pi/10**7*I/(4*pi)*(nsimplify(R)/100)**2/((nsimplify(R)/100)**2 + (nsimplify(z)/100)**2)**Rational(3, 2), (Symbol('ph'), 0, 2*pi))*10**6
- template: ph-flux-linear-field
  skill: physics.calc-em
  pace: quick
  given:
    L:
      pick:
      - 0.1
      - 0.5
      - 1
    B0:
      pick:
      - 0.2
      - 1
      - 2
  prompt: A square loop of side {{L}} m lies in the xy-plane with one corner at the origin, in a field B_z = {{B0}}x/{{L}} T. What is the flux through it, in Wb?
  parts:
  - ask: Answer
    label: v
    tex: \Phi
    value: B0*L^2/2
    tol: 0.005
    explain: Integrate B·dA when the field varies across the loop; the average field here is B₀/2
  verify:
    expect:
      v: integrate(integrate(nsimplify(B0)*Symbol('X1')/nsimplify(L), (Symbol('X1'), 0, nsimplify(L))), (Symbol('Y1'), 0, nsimplify(L)))
- template: ph-ramp-emf
  skill: physics.calc-em
  pace: quick
  given:
    N:
      pick:
      - 10
      - 100
    A:
      pick:
      - 10
      - 50
    B0:
      pick:
      - 0.1
      - 0.5
    k:
      pick:
      - 0.01
      - 0.1
      - 2
  prompt: A {{N}}-turn coil of area {{A}} cm² sits in a field rising as B = {{B0}} + {{k}}t T. What emf is induced, in mV?
  parts:
  - ask: Answer
    label: v
    tex: '|\mathcal E|'
    value: N*A*1e-4*k*1000
    tol: 0.005
    explain: Only the changing part of the flux induces an emf; the constant B₀ does nothing
  verify:
    expect:
      v: diff(N*nsimplify(A)/10**4*(nsimplify(B0) + nsimplify(k)*Symbol('t')), Symbol('t'))*1000
- template: ph-rod-coasting
  skill: physics.calc-em
  pace: quick
  given:
    m:
      pick:
      - 0.1
      - 0.5
    L:
      pick:
      - 0.5
      - 1
    B:
      pick:
      - 0.5
      - 1
    R:
      pick:
      - 0.5
      - 2
    v0:
      pick:
      - 2
      - 5
    T:
      pick:
      - 0.5
      - 1
      - 2
  prompt: A rod of mass {{m}} kg and length {{L}} m slides on rails in a {{B}} T field with total resistance {{R}} Ω. Released at {{v0}} m/s with no applied force, how fast is it moving after {{T}} s, in m/s?
  parts:
  - ask: Answer
    label: v
    tex: v
    value: v0*exp(-B^2*L^2*T/(m*R))
    tol: 0.005
    explain: 'The induced current brakes the rod with force B²L²v/R: an exponential decay with τ = mR/B²L²'
  verify:
    expect:
      v: v0*limit((1 - nsimplify(B)**2*nsimplify(L)**2*nsimplify(T)/(nsimplify(m)*nsimplify(R)*Symbol('nn')))**Symbol('nn'), Symbol('nn'), oo)
- template: ph-inductor-peak-emf
  skill: physics.calc-em
  pace: quick
  given:
    I0:
      pick:
      - 0.5
      - 2
    w:
      pick:
      - 100
      - 377
      - 1000
    L:
      pick:
      - 10
      - 50
      - 200
  prompt: A current I = {{I0}} sin({{w}}t) A flows in a {{L}} mH inductor. What is the peak emf across it, in V?
  parts:
  - ask: Answer
    label: v
    tex: \mathcal E_0
    value: L/1000*I0*w
    tol: 0.005
    explain: ℰ = L dI/dt peaks where the current crosses zero, a quarter-cycle ahead
  verify:

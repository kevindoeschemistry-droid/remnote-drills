      v: diff(nsimplify(L)/1000*nsimplify(I0)*sin(w*Symbol('t')), Symbol('t')).subs(Symbol('t'), 0)
- template: ph-lr-time-fraction
  skill: physics.calc-em
  pace: quick
  given:
    L:
      pick:
      - 10
      - 100
      - 500
    R:
      pick:
      - 10
      - 50
    f:
      pick:
      - 50
      - 90
      - 99
  prompt: An LR circuit has L = {{L}} mH and R = {{R}} Ω. How long after the switch closes does the current reach {{f}}% of its final value, in ms?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: L/R*log(1/(1 - f/100))
    tol: 0.005
    explain: I = (V/R)(1 − e^{−Rt/L}); τ = L/R, here in ms when L is in mH
  verify:
    expect:
      v: nsimplify(L)/R*(log(100) - log(100 - f))
- template: ph-speed-for-gamma
  skill: physics.relativity
  pace: quick
  given:
    g:
      pick:
      - 1.25
      - 2
      - 10
  prompt: At what speed, as a fraction of c, does a moving clock run slow by a factor γ = {{g}}?
  parts:
  - ask: Answer
    label: v
    tex: \beta
    value: sqrt(1 - 1/g^2)
    tol: 0.005
    explain: γ = 2 needs 0.866c; γ = 10 needs 0.995c
  verify:
    expect:
      v: Max(*solve(Eq(1/sqrt(1 - x**2), nsimplify(g)), x))
- template: ph-speed-for-contraction
  skill: physics.relativity
  pace: quick
  given:
    f:
      pick:
      - 50
      - 80
      - 90
  prompt: At what speed, as a fraction of c, does a rod appear {{f}}% of its rest length?
  parts:
  - ask: Answer
    label: v
    tex: \beta
    value: sqrt(1 - (f/100)^2)
    tol: 0.005
    explain: 'L = L₀/γ: contraction only along the motion'
  verify:
    expect:
      v: Max(*solve(Eq(sqrt(1 - x**2), Rational(f, 100)), x))
- template: ph-velocity-subtraction
  skill: physics.relativity
  pace: quick
  given:
    v:
      pick:
      - 0.5
      - 0.6
      - 0.8
    u:
      pick:
      - 0.9
      - 0.95
      - 0.99
  prompt: A ship moves at {{v}}c. A probe is seen in the original frame moving at {{u}}c in the same direction. How fast is it moving relative to the ship (in units of c)?
  parts:
  - ask: Answer
    label: r
    tex: u'
    value: (u - v)/(1 - u*v)
    tol: 0.005
    explain: Invert the addition law; it reduces to u − v only when both speeds are small
  verify:
    expect:
      r: solve(Eq((x + nsimplify(v))/(1 + x*nsimplify(v)), nsimplify(u)), x)[0]
- template: ph-speed-from-doppler
  skill: physics.relativity
  pace: quick
  given:
    r:
      pick:
      - 1.1
      - 1.5
      - 2
      - 3
  prompt: A source approaching head-on is received at {{r}} times its emitted frequency. How fast is it moving, as a fraction of c?
  parts:
  - ask: Answer
    label: v
    tex: \beta
    value: (r^2 - 1)/(r^2 + 1)
    tol: 0.005
    explain: f/f₀ = √((1 + β)/(1 − β)) for approach; doubling the frequency needs 0.6c
  verify:
    expect:
      v: solve(Eq(sqrt((1 + x)/(1 - x)), nsimplify(r)), x)[0]
- template: ph-speed-from-kinetic
  skill: physics.relativity
  pace: quick
  given:
    k:
      pick:
      - 0.1
      - 1
      - 10
  prompt: A particle has kinetic energy equal to {{k}} times its rest energy. How fast is it moving, as a fraction of c?
  parts:
  - ask: Answer
    label: v
    tex: \beta
    value: sqrt(1 - 1/(1 + k)^2)
    tol: 0.005
    explain: 'K = (γ − 1)mc²: at K = mc² the particle moves at 0.866c, far below what ½mv² would suggest'
  verify:
    expect:
      v: Max(*solve(Eq(1/sqrt(1 - x**2) - 1, nsimplify(k)), x))
- template: ph-atwood-lagrangian
  skill: physics.lagrangian
  pace: quick
  given:
    m1:
      pick:
      - 2
      - 3
      - 5
    m2:
      pick:
      - 1
      - 4
      - 6
  require:
  - m1 != m2
  prompt: An Atwood machine has masses {{m1}} and {{m2}} kg on a massless pulley. Using L = T − V, what is the acceleration of the heavier mass, in m/s²? (g = 9.81)
  parts:
  - ask: Answer
    label: v
    tex: a
    value: 9.81*abs(m1 - m2)/(m1 + m2)
    tol: 0.005
    explain: 'One coordinate: L = ½(m₁ + m₂)ẋ² + (m₁ − m₂)gx, so (m₁ + m₂)ẍ = (m₁ − m₂)g'
  verify:
    expect:
      v: Abs(solve(Eq(diff(diff((m1 + m2)*Symbol('xd')**2/2, Symbol('xd')).subs(Symbol('xd'), x*Symbol('t')), Symbol('t')), (m1 - m2)*Rational(981, 100)), x)[0])

- template: ph-wien-temperature
  skill: physics.thermal
  pace: quick
  given:
    l:
      pick:
      - 290
      - 500
      - 700
      - 1000
  prompt: A star's emission peaks at {{l}} nm. What is its surface temperature, in K? (b = 2.898 × 10⁻³ m·K)
  parts:
  - ask: Answer
    label: v
    tex: T
    value: 2.897771955e-3/(l*1e-9)
    tol: 0.005
    explain: 'T = b/λ_max: the Sun peaks near 500 nm at about 5800 K; a red giant near 1000 nm is about 2900 K'
  verify:
    expect:
      v: wien_peak(1)/nsimplify(l)
- template: ph-acceleration-from-position

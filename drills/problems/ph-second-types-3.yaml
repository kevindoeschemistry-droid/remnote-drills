- template: ph-rolling-acceleration
  skill: physics.calc-mechanics
  pace: quick
  given:
    th:
      pick:
      - 15
      - 30
      - 45
  cases:
  - shape: A solid sphere
    c: 0.4
  - shape: A solid cylinder
    c: 0.5
  - shape: A hoop
    c: 1
  prompt: '{{shape}} rolls without slipping down a {{th}}° incline. What is its acceleration, in m/s²? (g = 9.81, I = cMR², c = {{c}})'
  parts:
  - ask: Answer
    label: v
    tex: a
    value: 9.81*sin(th*pi/180)/(1 + c)
    tol: 0.005
    explain: Friction supplies the torque; the more mass far from the axis (larger c), the slower the roll
  verify:
    expect:
      v: solve([Eq(Symbol('M')*x, Symbol('M')*Rational(981, 100)*sin(th*pi/180) - Symbol('f')), Eq(Symbol('f')*Symbol('R'), nsimplify(c)*Symbol('M')*Symbol('R')**2*x/Symbol('R'))], [x, Symbol('f')])[x]

- template: co-enthalpy-solution
  skill: olympiad.thermochem
  pace: quick
  given:
    g:
      pick:
      - 4
      - 5
      - 8
    w:
      pick:
      - 100
      - 150
  cases:
  - s: NH₄NO₃
    M: 80.04
    dT: -3.8
  - s: NaOH
    M: 40.0
    dT: 5.1
  - s: KNO₃
    M: 101.1
    dT: -2.9
  prompt: Dissolving {{g}} g of {{s}} (M = {{M}} g/mol) in {{w}} g of water changes the temperature by {{dT}} °C. Taking $c = 4.184$ J/(g·K) for the solution's total mass, find ΔH_soln, in kJ/mol.
  parts:
  - ask: Answer
    label: v
    tex: \Delta H
    value: -(g + w)*4.184*dT/1000/(g/M)
    tol: 0.005
    explain: 'A temperature drop means the solution absorbed heat from its surroundings: endothermic, ΔH > 0. Use the solution''s total mass'
  verify:
    expect:
      v: -(g + w)*Rational(4184, 1000)*nsimplify(dT)/1000/(g/nsimplify(M))

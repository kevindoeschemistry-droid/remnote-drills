  prompt: A {{m}} g sample of impure CaCO₃ is dissolved in {{V1}} mL of {{c1}} M HCl. The excess acid needs {{V2}} mL of {{c2}} M NaOH. What is the mass percent of CaCO₃ (100.09 g/mol)?

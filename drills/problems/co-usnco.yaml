- template: co-gas-over-water
  skill: olympiad.lab
  pace: quick
  given:
    V:
      pick:
      - 50
      - 100
      - 250
    P:
      pick:
      - 99
      - 101.3
      - 102
  cases:
  - T: 20
    pw: 2.34
  - T: 25
    pw: 3.17
  - T: 30
    pw: 4.25
  prompt: '{{V}} mL of H₂ is collected over water at {{T}} °C and {{P}} kPa total; water''s vapour pressure is {{pw}} kPa. How many mmol of H₂? ($R = 8.314$)'
  parts:
  - ask: Answer
    label: v
    tex: n
    value: (P - pw)*V/1000/(8.314*(T + 273.15))*1000
    tol: 0.005
    explain: 'Dalton''s law: the gas in the tube is wet. kPa × L / (J/mol·K × K) gives mol'
  verify:
    expect:
      v: solve(Eq((nsimplify(P) - nsimplify(pw))*Rational(V, 1000), x/1000*Rational(8314, 1000)*(T + Rational(27315, 100))), x)[0]

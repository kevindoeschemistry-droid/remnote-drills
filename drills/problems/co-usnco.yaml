- template: co-limiting-yield
  skill: olympiad.stoichiometry
  pace: quick
  given:
    ma:
      pick:
      - 2
      - 5
      - 10
    mb:
      pick:
      - 5
      - 10
      - 20
      - 40
  prompt: '{{ma}} g of Al reacts with {{mb}} g of Cl₂: 2 Al + 3 Cl₂ → 2 AlCl₃. What mass of AlCl₃ (133.34 g/mol) forms at 100% yield?'
  parts:
  - ask: Answer
    label: v
    tex: m
    value: 133.34*min(ma/26.982, 2/3*mb/70.90)
    tol: 0.005
    explain: Al gives ${{ma}}/26.98$ mol AlCl₃; Cl₂ gives $\tfrac23\cdot{{mb}}/70.90$. The smaller limits
  verify:
    expect:
      v: Rational(13334, 100)*Min(nsimplify(ma)/Rational(26982, 1000), Rational(2, 3)*nsimplify(mb)/Rational(709, 10))

- template: co-k-from-dh-ds
  skill: olympiad.thermochem
  pace: quick
  given:
    dH:
      pick:
      - -50
      - -20
      - 10
      - 40
    dS:
      pick:
      - -100
      - -50
      - 50
      - 120
    T:
      pick:
      - 298
      - 400
      - 500
  require:
  - abs(dH*1000 - T*dS)/(8.314*T) < 25
  prompt: A reaction has ΔH° = {{dH}} kJ/mol and ΔS° = {{dS}} J/(mol·K). What is K at {{T}} K? ($R = 8.314$)
  parts:
  - ask: Answer
    label: v
    tex: K
    value: exp(-(dH*1000 - T*dS)/(8.314*T))
    tol: 0.005

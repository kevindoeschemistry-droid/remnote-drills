- template: co-quantum-count
  skill: olympiad.atomic
  pace: quick
  given:
    n:
      int:
      - 2
      - 4
  cases:
  - cond: m_l = 0
    k: 0
  - cond: l = 1
    k: 1
  - cond: m_s = +½
    k: 2
  - cond: m_l = +1
    k: 3
  prompt: In a neutral atom with every orbital through n = {{n}} filled, how many electrons have {{cond}}?
  parts:
  - ask: Answer
    label: v
    tex: N
    value: 'k == 0 ? n*(n + 1) : (k == 1 ? 6*(n - 1) : (k == 2 ? n*(n + 1)*(2*n + 1)/6 : n*(n - 1)))'
    final: true
    tol: 0.0001
    explain: List the allowed (n, l, m_l) sets shell by shell. Shell k has k subshells, each with one m_l = 0 orbital; l = 1 exists from n = 2 up; m_l = +1 needs l ≥ 1; half of all electrons have m_s = +½
  verify:
    expect:
      v: 2*summation(Symbol('j'), (Symbol('j'), 1, n)) if k == 0 else (6*(n - 1) if k == 1 else (summation(Symbol('j')**2, (Symbol('j'), 1, n)) if k == 2 else 2*summation(Symbol('j') - 1, (Symbol('j'), 1, n))))
- template: co-max-electrons
  skill: olympiad.atomic
  pace: quick
  cases:
  - cond: n = 3
    kd: 1
    nq: 3
    l: 0
    ml: 0
  - cond: n = 4
    kd: 1
    nq: 4
    l: 0
    ml: 0
  - cond: n = 4, l = 2
    kd: 2
    nq: 4
    l: 2
    ml: 0
  - cond: l = 3 in one shell
    kd: 2
    nq: 4
    l: 3
    ml: 0
  - cond: n = 3, m_l = −1
    kd: 3
    nq: 3
    l: 0
    ml: -1
  - cond: n = 5, l = 1, m_s = +½
    kd: 4
    nq: 5
    l: 1
    ml: 0
  prompt: What is the largest number of electrons an atom can hold with {{cond}}?
  parts:
  - ask: Answer
    label: v
    tex: N
    value: 'kd == 1 ? 2*nq^2 : (kd == 2 ? 2*(2*l + 1) : (kd == 3 ? 2*(nq - abs(ml)) : 2*l + 1))'
    final: true
    tol: 0.0001
    explain: 2n² per shell, 2(2l + 1) per subshell, 2 per orbital
  verify:
    expect:
      v: 2*nq**2 if kd == 1 else (2*(2*l + 1) if kd == 2 else (2*(nq - Abs(ml)) if kd == 3 else 2*l + 1))
- template: co-trend-anomaly
  skill: olympiad.atomic
  pace: recall
  cases:
  - q: Why is the first ionisation energy of O lower than that of N?
    o1: O's fourth p electron pairs up and is repelled by its partner
    o2: O has a larger nuclear charge
    o3: O's valence electrons are in a higher shell
    o4: N has a filled subshell
  - q: Why is the electron affinity of N close to zero while C and O release energy?
    o1: An added electron would have to pair in N's half-filled p subshell
    o2: N is more electronegative than O
    o3: N's valence shell is full
    o4: N is larger than C
  - q: Why is the first ionisation energy of B lower than that of Be?
    o1: B's outermost electron is in a 2p orbital, higher in energy than 2s
    o2: B has a smaller nuclear charge
    o3: Be's electron is paired
    o4: B is a metalloid
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Most of a trend follows effective nuclear charge; the dips come from subshell energies (s below p) and pairing repulsion
  verify:
    authored: true
- template: co-anomaly-explain
  skill: olympiad.atomic
  pace: recall
  cases:
  - q: Why is the first ionisation energy of O lower than that of N?
    o1: O's fourth p electron is paired, and the repulsion makes it easier to remove
    o2: O is larger
    o3: N has a full shell
    o4: O has fewer protons
  - q: Why is the first ionisation energy of Al lower than that of Mg?
    o1: Al's electron is removed from a 3p orbital, higher in energy than 3s
    o2: Al has more protons
    o3: Mg is larger
    o4: Al has a half-filled shell
  - q: Why are Zr and Hf almost the same size?
    o1: The lanthanide contraction offsets the extra shell
    o2: They have the same number of protons
    o3: Hf has fewer electrons
    o4: Both are noble gases
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id002
    correct: '0'
    explain: Anomalies come from subshell energies, electron pairing and poor shielding by f electrons
  verify:
    authored: true
- template: co-hydrogen-line
  skill: olympiad.atomic
  pace: quick
  cases:
  - n1: 1
    n2: 2
  - n1: 2
    n2: 3
  - n1: 2
    n2: 4
  - n1: 3
    n2: 4
  - n1: 1
    n2: 3
  prompt: What wavelength, in nm, is emitted when a hydrogen electron falls from n = {{n2}} to n = {{n1}}? ($R_H = 1.097\times10^{7}$ m⁻¹)
  parts:
  - ask: Answer
    label: v
    tex: \lambda
    value: 1/(1.097e7*(1/n1^2 - 1/n2^2))*1e9
    tol: 0.005
    explain: Lyman lines (to n = 1) are ultraviolet, Balmer (to n = 2) visible, Paschen (to n = 3) infrared
  verify:
    expect:
      v: 10**9/(Rational(1097, 100)*10**6*(Rational(1, n1**2) - Rational(1, n2**2)))
- template: co-series-limit
  skill: olympiad.atomic
  pace: quick
  cases:
  - s: Lyman
    n1: 1
  - s: Balmer
    n1: 2
  - s: Paschen
    n1: 3
  - s: Brackett
    n1: 4
  prompt: What is the shortest wavelength, in nm, in the {{s}} series of hydrogen? (R_H = 1.0968 × 10⁷ m⁻¹)
  parts:
  - ask: Answer
    label: v
    tex: \lambda
    value: n1^2/1.0968e7*1e9
    tol: 0.005
    explain: 'The series limit is the jump from infinity: 1/λ = R_H/n₁²'
  verify:
    expect:
      v: solve(Eq(Integer(10968)*10**3*x/(10**9*Integer(n1)**2), 1), x)[0]

  verify:
    expect:
      v: (dH*1000 - (-Rational(8314, 1000)*298*log(nsimplify(K))))/298
- template: co-p2-iodometric
  skill: olympiad.stoichiometry
  pace: workout
  given:
    m:
      pick:
      - 0.5
      - 0.75
      - 1
    c:
      pick:
      - 0.1
      - 0.05
    n:
      pick:
      - 5
      - 3
      - 1
  let:
    V: m/(159.61 + n*18.015)*1000/c
  prompt: '{{m}} g of CuSO₄·nH₂O is dissolved and treated with excess KI; the liberated I₂ needs {{V}} mL of {{c}} M Na₂S₂O₃. Find n. (CuSO₄ = 159.61, H₂O = 18.015 g/mol)'
  parts:
  - ask: Answer
    label: v
    tex: n
    value: n
    final: true
    tol: 0.02
    explain: Thiosulfate counts copper one for one through the iodine. The molar mass of the hydrate follows, and the water is what is left after CuSO₄
  verify:

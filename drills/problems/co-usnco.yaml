      int:
      - 1
      - 5
  require:
  - 2*c + 2 + nn - 2*k > 0
  let:
    h: 2*c + 2 + nn - 2*k
  prompt: What is the degree of unsaturation of C{{c}}H{{h}}N{{nn}}O{{o}}?
  parts:
  - ask: Answer
    label: v
    tex: DoU
    value: k
    final: true
    tol: 0.0001
    explain: Oxygen does not change it; each N adds one H to the saturated count; halogens count as H. Benzene alone is 4

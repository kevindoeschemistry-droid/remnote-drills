- template: co-p2-common-ion
  skill: olympiad.equilibria
  pace: workout
  given:
    c:
      pick:
      - 0.001
      - 0.01
      - 0.1
  prompt: CaC₂O₄ has $K_{sp} = 2.3\times10^{-9}$. By what factor is its molar solubility lower in {{c}} M CaCl₂ than in pure water? (Ignore oxalate's basicity.)
  parts:
  - ask: Answer
    label: v
    tex: s_0/s
    value: sqrt(2.3e-9)/((-c + sqrt(c^2 + 4*2.3e-9))/2)
    tol: 0.005
    explain: 'Pure water: s = √Ksp. With Ca²⁺ present, solve s(s + c) = Ksp exactly. Oxalate''s basicity would raise both solubilities in acid, which is the next part of a real Part II problem'
  verify:
    expect:
      v: sqrt(Rational(23, 10**10))/Max(*solve(Eq(x*(x + nsimplify(c)), Rational(23, 10**10)), x))
- template: co-p2-cell-entropy
  skill: olympiad.electrochem
  pace: workout
  given:
    Ec:
      pick:
      - 0.63
      - 1.1
      - 0.46
    d:
      pick:
      - -0.4
      - -0.1
      - 0.2
  prompt: A two-electron cell has E° = {{Ec}} V at 298 K and dE°/dT = {{d}} mV/K. What is ΔH°, in kJ/mol? ($F = 96485$)
  parts:
  - ask: Answer
    label: v
    tex: \Delta H^\circ
    value: (-2*96485*Ec + 298*2*96485*d/1000)/1000
    tol: 0.005
    explain: ΔG° = −nFE°; ΔS° = −(∂ΔG°/∂T) = nF dE°/dT; then ΔH° = ΔG° + TΔS°. A cell whose voltage falls with temperature has ΔS° < 0
  verify:
    expect:
      v: (-2*96485*nsimplify(Ec) + 298*2*96485*nsimplify(d)/1000)/1000
- template: co-p2-entropy-from-k
  skill: olympiad.thermochem
  pace: workout
  given:
    K:
      pick:
      - 10000.0
      - 1000000.0
      - 1000000000.0
    dH:
      pick:
      - -50
      - -35
      - -20
  prompt: An acid–base neutralisation has K = {{K}} at 298 K and calorimetry gives ΔH° = {{dH}} kJ/mol. What is ΔS°, in J/(mol·K)? ($R = 8.314$)
  parts:
  - ask: Answer
    label: v
    tex: \Delta S^\circ
    value: (dH*1000 + 8.314*298*log(K))/298

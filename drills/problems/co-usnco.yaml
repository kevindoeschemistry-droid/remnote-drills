- template: co-lab-error
  skill: olympiad.lab
  pace: recall
  cases:
  - q: A hydrate is not heated long enough. The calculated waters per formula unit come out…
    o1: too low
    o2: too high
    o3: unchanged
    o4: too high only if the salt decomposes
  - q: In a titration the burette tip holds an air bubble that leaves during delivery. The calculated analyte concentration comes out…
    o1: too high
    o2: too low
    o3: unchanged
    o4: too low only for weak acids
  - q: A cuvette carries a fingerprint in the light path. The calculated concentration comes out…
    o1: too high
    o2: too low
    o3: unchanged
    o4: too low only at high absorbance
  - q: A gas is collected over water and the vapour pressure of water is ignored. The calculated moles of gas come out…
    o1: too high
    o2: too low
    o3: unchanged
    o4: too low only above 25 °C
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Trace the faulty reading into the formula: less mass lost means less water; extra burette volume reads as more titrant; extra absorbance reads as more solute; total pressure overstates the gas'
  verify:
    authored: true
- template: co-gas-over-water
  skill: olympiad.lab
  pace: quick
  given:
    V:
      pick:
      - 50
      - 100
      - 250
    P:
      pick:
      - 99
      - 101.3
      - 102
  cases:
  - T: 20
    pw: 2.34
  - T: 25
    pw: 3.17
  - T: 30
    pw: 4.25
  prompt: '{{V}} mL of H₂ is collected over water at {{T}} °C and {{P}} kPa total; water''s vapour pressure is {{pw}} kPa. How many mmol of H₂? ($R = 8.314$)'
  parts:
  - ask: Answer
    label: v
    tex: n
    value: (P - pw)*V/1000/(8.314*(T + 273.15))*1000
    tol: 0.005

- template: co-combustion-ratio
  skill: olympiad.stoichiometry
  pace: quick
  cases:
  - f: C2H6O
    c: 2
    h: 6
    mco2: 47.76
    mh2o: 29.33
  - f: C3H8O
    c: 3
    h: 8
    mco2: 54.92
    mh2o: 29.98
  - f: C4H8O2
    c: 4
    h: 8
    mco2: 49.95
    mh2o: 20.45
  - f: C6H12O6
    c: 6
    h: 12
    mco2: 36.64
    mh2o: 15.0
  - f: C7H8
    c: 7
    h: 8
    mco2: 83.58
    mh2o: 19.55
  - f: C3H6O
    c: 3
    h: 6
    mco2: 56.83
    mh2o: 23.26
  - f: C5H10O
    c: 5
    h: 10
    mco2: 63.87
    mh2o: 26.14
  prompt: 'Burning 25.00 mg of a compound gives {{mco2}} mg CO₂ and {{mh2o}} mg H₂O. What is the mole ratio C : H in the compound (as C/H)?'
  parts:
  - ask: Answer
    label: v
    tex: n_C/n_H
    value: (mco2/44.009)/(2*mh2o/18.015)
    tol: 0.01
    explain: Each CO₂ carries one C; each H₂O carries two H. Oxygen comes last, by difference in mass, because some of it came from the O₂
  verify:
    expect:
      v: (nsimplify(mco2)/Rational(44009, 1000))/(2*nsimplify(mh2o)/Rational(18015, 1000))
- template: co-hydrate-n
  skill: olympiad.stoichiometry
  pace: quick
  given:
    m1:
      pick:
      - 2.5
      - 5
      - 10
  cases:
  - salt: CuSO₄
    M: 159.61
    n: 5
  - salt: MgSO₄
    M: 120.37
    n: 7
  - salt: CoCl₂
    M: 129.84
    n: 6
  - salt: Na₂CO₃
    M: 105.99
    n: 10
  - salt: BaCl₂
    M: 208.23
    n: 2
  let:
    m2: m1*M/(M + n*18.015)
  prompt: Heating {{m1}} g of a hydrate of {{salt}} (M = {{M}} g/mol, anhydrous) leaves {{m2}} g. How many waters per formula unit?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: n
    final: true
    tol: 0.02
    explain: Mass lost is water. Incomplete heating leaves water behind and makes n come out too low; decomposition of the salt makes it too high
  verify:
    expect:
      v: ((nsimplify(m1) - nsimplify(m1)*nsimplify(M)/(nsimplify(M) + n*Rational(18015, 1000)))/Rational(18015, 1000))/(nsimplify(m1)/(nsimplify(M) + n*Rational(18015, 1000)))

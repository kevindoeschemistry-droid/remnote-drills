# Programming Foundations, Java (AP CSA units 1–4): read the code on the card, predict what it does.
# The code is drawn as a `code` figure from the case field `code`. Every answer is checked by
# compiling and running the snippet (tests/verify/progcode.py: java_out, java_ret, java_pick), with
# the snippet as the body of main(); `defs` holds methods or nested classes shown above it.
# An uncaught exception prints its class name, so "ArrayIndexOutOfBoundsException" is an output.

# ── unit 1: using objects and methods ──────────────────────────────────────
- template: pr-error-kind
  skill: prog.java-basics
  pace: recall
  cases:
    - { s: 'A line is missing its semicolon, and the program will not compile.', ans: 0 }
    - { s: 'int x = "five"; is rejected before the program runs.', ans: 0 }
    - { s: 'The program compiles, then stops with ArithmeticException: / by zero.', ans: 1 }
    - { s: 'The program compiles, then stops with ArrayIndexOutOfBoundsException.', ans: 1 }
    - { s: 'The program runs to the end, but the average it prints is always too low.', ans: 2 }
    - { s: 'A loop meant to run 10 times runs 9 times, with no error message.', ans: 2 }
  prompt: '{{s}} What kind of error is this?'
  parts:
    - ask: 'Kind'
      label: a
      choice: ["Syntax (compile-time) error", "Run-time error (exception)", "Logic error"]
      correct: ans
      explain: 'The compiler catches syntax and type errors before anything runs. A run-time error is an exception thrown while running. A logic error raises no alarm at all: the program does the wrong thing, and only tests with known answers catch it'
  verify: { authored: true }

- template: pr-binary
  skill: prog.java-basics
  pace: quick
  cases:
    - { b: '1011', ans: 11 }
    - { b: '110010', ans: 50 }
    - { b: '11111111', ans: 255 }
    - { b: '1000000', ans: 64 }
    - { b: '101010', ans: 42 }
  prompt: 'What is the binary number {{b}} in decimal?'
  parts:
    - { ask: 'Decimal', label: a, value: ans, tol: 0.0001, explain: 'Each place is a power of 2, from 1 on the right: add the powers where the bit is 1. Eight bits run from 0 to 255' }
  verify: { expect: { a: "py_out('print(int(\"' + b + '\", 2))')" } }

- template: pr-bits
  skill: prog.java-basics
  pace: quick
  given: { nb: { pick: [3, 4, 6, 8, 10, 16] } }
  prompt: 'How many different values can {{nb}} bits represent?'
  parts:
    - { ask: 'Values', label: a, value: 2^nb, tol: 0.0001, explain: 'Each bit doubles the count: n bits give 2ⁿ patterns. Going the other way, N values need ⌈log₂ N⌉ bits' }
  verify: { expect: { a: "2**nb" } }

- template: pr-int-arith
  skill: prog.java-basics
  pace: quick
  figure: { type: code, src: code }
  cases:
    - { code: "System.out.print(17 / 5);", ans: 3 }
    - { code: "System.out.print(17 % 5);", ans: 2 }
    - { code: "System.out.print(17 / 5.0);", ans: 3.4 }
    - { code: "System.out.print(2 + 3 * 4 % 5);", ans: 4 }
    - { code: "System.out.print(-17 / 5);", ans: -3 }
    - { code: "System.out.print(-17 % 5);", ans: -2 }
    - { code: "System.out.print(7 / 2 * 2.0);", ans: 6 }
  prompt: 'What does this print?'
  parts:
    - { ask: 'Output', label: a, value: ans, tol: 0.0001, explain: 'int / int is integer division, truncated toward zero, and % is the remainder with the sign of the left operand. If either operand is a double the division is real. *, / and % share a precedence and run left to right' }
  verify: { expect: { a: "java_out(code)" } }


- template: pr-assign-trace
  skill: prog.java-basics
  pace: quick
  figure: { type: code, src: code }
  cases:
    - code: |
        int a = 5;
        int b = a * 2;
        a = b - a;
        b += a;
        System.out.print(b);
      ans: 15
    - code: |
        int x = 10;
        x -= 3;
        x *= 2;
        x %= 5;
        System.out.print(x);
      ans: 4
    - code: |
        int i = 4;
        int j = i++ + 2;
        System.out.print(j * 10 + i);
      ans: 65
    - code: |
        int k = 3;
        k++;
        k += k;
        k--;
        System.out.print(k);
      ans: 7
    - code: |
        int a = 2, b = 7;
        int t = a;
        a = b;
        b = t;
        System.out.print(a - b);
      ans: 5
  prompt: 'What does this print?'
  parts:
    - { ask: 'Output', label: a, value: ans, tol: 0.0001, explain: 'Trace one statement at a time and keep a column per variable. x += y means x = x + y. i++ used inside an expression gives the old value, then adds 1' }
  verify: { expect: { a: "java_out(code)" } }

- template: pr-cast
  skill: prog.java-basics
  pace: quick
  figure: { type: code, src: code }
  cases:
    - { code: "System.out.print((int) 7.9);", ans: 7 }
    - { code: "System.out.print((int) -7.9);", ans: -7 }
    - { code: "System.out.print((double) 7 / 2);", ans: 3.5 }
    - { code: "System.out.print((double) (7 / 2));", ans: 3 }
    - { code: "System.out.print((int) (6.5 + 0.5));", ans: 7 }
    - { code: "System.out.print((int) 2.99 * 3);", ans: 6 }
  prompt: 'What does this print?'
  parts:
    - { ask: 'Output', label: a, value: ans, tol: 0.0001, explain: 'Casting a double to int drops the fraction (toward zero), it does not round; (int)(x + 0.5) rounds a positive x. A cast binds tighter than arithmetic, so (double) 7 / 2 is 7.0 / 2 = 3.5, while (double)(7 / 2) casts the integer result 3' }
  verify: { expect: { a: "java_out(code)" } }

- template: pr-overflow
  skill: prog.java-basics
  pace: quick
  figure: { type: code, src: code }
  cases:
    - { code: "System.out.print(Integer.MAX_VALUE + 1);", ans: -2147483648 }
    - { code: "System.out.print(Integer.MIN_VALUE - 1);", ans: 2147483647 }
    - { code: "int big = 2000000000;\nSystem.out.print(big + big);", ans: -294967296 }
    - { code: "long big = 2000000000;\nSystem.out.print(big + big);", ans: 4000000000 }
  prompt: 'What does this print?'
  parts:
    - { ask: 'Output', label: a, value: ans, tol: 0.0001, explain: 'An int holds −2,147,483,648 to 2,147,483,647. Going past either end wraps around silently (2³² is added or subtracted), with no error. A long has 64 bits and room to spare' }
  verify: { expect: { a: "java_out(code)" } }

- template: pr-double-compare
  skill: prog.java-basics
  pace: quick
  figure: { type: code, src: code }
  cases:
    - { code: "System.out.print(0.1 + 0.2 == 0.3);", ans: 1 }
    - { code: "System.out.print(Math.abs(0.1 + 0.2 - 0.3) < 1e-9);", ans: 0 }
    - { code: "System.out.print(0.5 + 0.25 == 0.75);", ans: 0 }
    - { code: "double d = 1.0 / 3;\nSystem.out.print(d * 3 == 1.0);", ans: 0 }
  prompt: 'What does this print?'
  parts:
    - ask: 'Output'
      label: a
      choice: ["true", "false"]
      correct: ans
      explain: 'Doubles are stored in binary, and 0.1, 0.2 and 0.3 have no exact binary form, so their sum misses 0.3 by a tiny amount. Halves and quarters are exact. Compare doubles with a tolerance, not =='
  verify: { choices: { a: "java_pick(code, ['true', 'false'])" } }

- template: pr-math-class
  skill: prog.java-basics
  pace: quick
  figure: { type: code, src: code }
  cases:
    - { code: "System.out.print(Math.pow(2, 10));", ans: 1024 }
    - { code: "System.out.print(Math.sqrt(144) + Math.abs(-3));", ans: 15 }
    - { code: "System.out.print((int) Math.pow(3, 4) % 10);", ans: 1 }
    - { code: "System.out.print(Math.abs(-7) / 2);", ans: 3 }
    - { code: "System.out.print(Math.max(3, Math.min(9, 5)));", ans: 5 }
  prompt: 'What does this print?'
  parts:
    - { ask: 'Output', label: a, value: ans, tol: 0.0001, explain: 'Math''s methods are static: call them on the class. Math.pow and Math.sqrt return doubles (Math.pow(2, 10) prints 1024.0); Math.abs and Math.max keep the type they are given' }
  verify: { expect: { a: "java_out(code)" } }

- template: pr-random-range
  skill: prog.java-basics
  pace: quick
  cases:
    - { e: '(int) (Math.random() * 6) + 1', o1: '1 to 6', o2: '0 to 6', o3: '0 to 5', o4: '1 to 7', ans: 0 }
    - { e: '(int) (Math.random() * 10)', o1: '1 to 10', o2: '0 to 9', o3: '0 to 10', o4: '1 to 9', ans: 1 }
    - { e: '(int) (Math.random() * 11) + 5', o1: '5 to 16', o2: '5 to 11', o3: '5 to 15', o4: '6 to 16', ans: 2 }
    - { e: '(int) (Math.random() * 3) - 1', o1: '0 to 2', o2: '-1 to 2', o3: '-3 to 3', o4: '-1 to 1', ans: 3 }
  prompt: 'What range of whole numbers can {{e}} produce?'
  parts:
    - ask: 'Range'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'Math.random() is in [0, 1), so Math.random() * n is in [0, n) and (int) of it is 0 to n − 1. Adding a shifts that to a to a + n − 1: for a to b inclusive use (int) (Math.random() * (b − a + 1)) + a'
  verify: { authored: true }

- template: pr-alias
  skill: prog.java-objects
  pace: quick
  figure: { type: code, src: code }
  cases:
    - code: |
        int[] a = {1, 2, 3};
        int[] b = a;
        b[0] = 9;
        System.out.print(a[0]);
      ans: 9
    - code: |
        int[] a = {1, 2, 3};
        int[] b = a.clone();
        b[0] = 9;
        System.out.print(a[0]);
      ans: 1
    - code: |
        int x = 4;
        int y = x;
        y = 7;
        System.out.print(x);
      ans: 4
    - code: |
        StringBuilder s = new StringBuilder("ab");
        StringBuilder t = s;
        t.append("cd");
        System.out.print(s.length());
      ans: 4
  prompt: 'What does this print?'
  parts:
    - { ask: 'Output', label: a, value: ans, tol: 0.0001, explain: 'A variable of a reference type holds a reference, so b = a makes two names for one object, and a change through either shows through both. A primitive variable holds the value itself, and copying it makes an independent copy' }
  verify: { expect: { a: "java_out(code)" } }

- template: pr-string-methods
  skill: prog.java-objects
  pace: quick
  figure: { type: code, src: code }
  cases:
    - { code: "String s = \"computer\";\nSystem.out.print(s.substring(3, 6));", o1: 'put', o2: 'pute', o3: 'mpu', o4: 'pu', ans: 0 }
    - { code: "String s = \"computer\";\nSystem.out.print(s.indexOf(\"t\") + s.length());", o1: '13', o2: '14', o3: '12', o4: '5t8', ans: 0 }
    - { code: "String s = \"banana\";\nSystem.out.print(s.indexOf(\"an\") + \",\" + s.indexOf(\"x\"));", o1: '1,0', o2: '2,-1', o3: '1,-1', o4: '1,6', ans: 2 }
    - { code: "String s = \"apple\";\nSystem.out.print(s.compareTo(\"banana\") < 0);", o1: 'false', o2: 'An error', o3: '-1', o4: 'true', ans: 3 }
    - { code: "String s = \"hello\";\nSystem.out.print(s.substring(s.length() - 2));", o1: 'll', o2: 'lo', o3: 'o', o4: 'An error', ans: 1 }
    - { code: "String s = \"abc\";\nSystem.out.print(s.substring(1, 1).length());", o1: '1', o2: 'An error', o3: '0', o4: 'b', ans: 2 }
  prompt: 'What does this print?'
  parts:
    - ask: 'Output'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'substring(a, b) runs from index a up to but not including b (length b − a); substring(a) runs to the end. indexOf gives the first match''s index or −1. compareTo is negative when the string comes first alphabetically'
  verify: { choices: { a: "java_pick(code, [o1, o2, o3, o4])" } }

- template: pr-string-equals
  skill: prog.java-objects
  pace: quick
  figure: { type: code, src: code }
  cases:
    - { code: "String a = new String(\"hi\");\nString b = new String(\"hi\");\nSystem.out.print(a == b);", ans: 1 }
    - { code: "String a = new String(\"hi\");\nString b = new String(\"hi\");\nSystem.out.print(a.equals(b));", ans: 0 }
    - { code: "String a = new String(\"hi\");\nString b = a;\nSystem.out.print(a == b);", ans: 0 }
    - { code: "String a = \"Hi\";\nSystem.out.print(a.equals(\"hi\"));", ans: 1 }
  prompt: 'What does this print?'
  parts:
    - ask: 'Output'
      label: a
      choice: ["true", "false"]
      correct: ans
      explain: '== on objects asks whether two references point to the same object; equals asks whether the contents match (case matters, use equalsIgnoreCase otherwise). Two new String objects are different objects with equal contents'
  verify: { choices: { a: "java_pick(code, ['true', 'false'])" } }

- template: pr-null-pointer
  skill: prog.java-objects
  pace: quick
  figure: { type: code, src: code }
  cases:
    - { code: "String s = null;\nSystem.out.print(s.length());", o1: '0', o2: 'NullPointerException', o3: 'null', o4: 'An empty line', ans: 1 }
    - { code: "String s = null;\nSystem.out.print(s + \"!\");", o1: 'null!', o2: 'NullPointerException', o3: '!', o4: 'An error at compile time', ans: 0 }
    - { code: "String s = null;\nSystem.out.print(s == null);", o1: 'false', o2: 'NullPointerException', o3: 'true', o4: 'null', ans: 2 }
    - { code: "String s = null;\nSystem.out.print(\"a\".equals(s));", o1: 'NullPointerException', o2: 'true', o3: 'null', o4: 'false', ans: 3 }
  prompt: 'What does this print?'
  parts:
    - ask: 'Output'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'Calling a method on null throws NullPointerException. Comparing a reference with null is fine, and concatenation turns null into the text "null". Calling equals on a known non-null object (a literal) is safe even if its argument is null'
  verify: { choices: { a: "java_pick(code, [o1, o2, o3, o4])" } }

# ── unit 2: selection and iteration ────────────────────────────────────────
- template: pr-if-chain
  skill: prog.java-control
  pace: quick
  figure: { type: code, src: code }
  cases:
    - code: |
        int score = 85;
        if (score >= 90) System.out.print("A");
        else if (score >= 80) System.out.print("B");
        else if (score >= 70) System.out.print("C");
        else System.out.print("F");
      o1: 'A'
      o2: 'B'
      o3: 'BC'
      o4: 'F'
      ans: 1
    - code: |
        int score = 85;
        if (score >= 90) System.out.print("A");
        if (score >= 80) System.out.print("B");
        if (score >= 70) System.out.print("C");
      o1: 'B'
      o2: 'BC'
      o3: 'ABC'
      o4: 'C'
      ans: 1
    - code: |
        int x = 5;
        if (x > 3)
          if (x > 10) System.out.print("big");
        else System.out.print("small");
      o1: 'big'
      o2: 'small'
      o3: 'Nothing'
      o4: 'bigsmall'
      ans: 1
    - code: |
        int x = 2;
        if (x > 3)
          if (x > 10) System.out.print("big");
        else System.out.print("small");
        System.out.print("!");
      o1: 'small!'
      o2: 'big!'
      o3: '!'
      o4: 'small'
      ans: 2
  prompt: 'What does this print?'
  parts:
    - ask: 'Output'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'An else-if chain runs at most one branch, the first true one; separate ifs each test independently. An else belongs to the nearest unmatched if, whatever the indentation suggests (the dangling else), so use braces'
  verify: { choices: { a: "java_pick(code, [o1, o2, o3, o4])" } }

- template: pr-short-circuit
  skill: prog.java-control
  pace: quick
  figure: { type: code, src: code }
  cases:
    - { code: "int d = 0;\nSystem.out.print(d != 0 && 10 / d > 1);", o1: 'true', o2: 'false', o3: 'ArithmeticException', o4: '0', ans: 1 }
    - { code: "int d = 0;\nSystem.out.print(10 / d > 1 && d != 0);", o1: 'true', o2: 'false', o3: 'ArithmeticException', o4: '0', ans: 2 }
    - { code: "int d = 0;\nSystem.out.print(d == 0 || 10 / d > 1);", o1: 'true', o2: 'false', o3: 'ArithmeticException', o4: '1', ans: 0 }
    - { code: "boolean p = true, q = false;\nSystem.out.print(!p || q && !q);", o1: 'true', o2: 'false', o3: 'ArithmeticException', o4: 'An error', ans: 1 }
    - { code: "boolean p = false, q = true;\nSystem.out.print(p || q && !p);", o1: 'true', o2: 'false', o3: 'ArithmeticException', o4: 'An error', ans: 0 }
  prompt: 'What does this print?'
  parts:
    - ask: 'Output'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: '&& stops as soon as the left side is false, and || as soon as it is true, so the right side may never run: that is how a guard like d != 0 && 10 / d … avoids dividing by zero. ! binds tightest, then &&, then ||'
  verify: { choices: { a: "java_pick(code, [o1, o2, o3, o4])" } }

- template: pr-demorgan
  skill: prog.java-control
  pace: quick
  cases:
    - { e: '!(a && b)', o1: '!a || !b', o2: '!a && !b', o3: 'a || b', o4: '!a || b', ans: 0 }
    - { e: '!(a || b)', o1: '!a || !b', o2: '!a && !b', o3: 'a && !b', o4: '!(a && b)', ans: 1 }
    - { e: '!(x > 3 && y <= 5)', o1: 'x <= 3 && y > 5', o2: 'x < 3 || y >= 5', o3: 'x <= 3 || y > 5', o4: 'x > 3 || y <= 5', ans: 2 }
    - { e: '!(x == 0 || y != 2)', o1: 'x != 0 || y == 2', o2: 'x == 0 && y == 2', o3: 'x != 0 && y != 2', o4: 'x != 0 && y == 2', ans: 3 }
  prompt: 'Which expression is equivalent to {{e}}?'
  parts:
    - ask: 'Equivalent'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'De Morgan: !(a && b) is !a || !b, and !(a || b) is !a && !b. Negating a comparison flips it completely: the opposite of > is <=, of == is !='
  verify: { authored: true }

- template: pr-while-trace
  skill: prog.java-control
  pace: quick
  figure: { type: code, src: code }
  cases:
    - code: |
        int n = 1, count = 0;
        while (n < 100) {
          n *= 3;
          count++;
        }
        System.out.print(count);
      ans: 5
    - code: |
        int n = 1234, sum = 0;
        while (n > 0) {
          sum += n % 10;
          n /= 10;
        }
        System.out.print(sum);
      ans: 10
    - code: |
        int n = 50, steps = 0;
        while (n != 1) {
          n = (n % 2 == 0) ? n / 2 : 3 * n + 1;
          steps++;
        }
        System.out.print(steps);
      ans: 24
    - code: |
        int a = 48, b = 18;
        while (b != 0) {
          int r = a % b;
          a = b;
          b = r;
        }
        System.out.print(a);
      ans: 6
    - code: |
        int n = 9075, rev = 0;
        while (n > 0) {
          rev = rev * 10 + n % 10;
          n /= 10;
        }
        System.out.print(rev);
      ans: 5709
  prompt: 'What does this print?'
  parts:
    - { ask: 'Output', label: a, value: ans, tol: 0.0001, explain: 'Trace the variables in a table, one row per pass, checking the condition before each pass. n % 10 is the last digit and n / 10 drops it, which is how digit loops peel a number. The remainder loop is Euclid''s gcd' }
  verify: { expect: { a: "java_out(code)" } }

- template: pr-for-count
  skill: prog.java-control
  pace: quick
  figure: { type: code, src: code }
  cases:
    - { code: "int c = 0;\nfor (int i = 0; i < 10; i++) c++;\nSystem.out.print(c);", ans: 10 }
    - { code: "int c = 0;\nfor (int i = 1; i <= 10; i++) c++;\nSystem.out.print(c);", ans: 10 }
    - { code: "int c = 0;\nfor (int i = 3; i <= 20; i += 3) c++;\nSystem.out.print(c);", ans: 6 }
    - { code: "int c = 0;\nfor (int i = 10; i > 0; i -= 2) c++;\nSystem.out.print(c);", ans: 5 }
    - { code: "int c = 0;\nfor (int i = 5; i < 50; i *= 2) c++;\nSystem.out.print(c);", ans: 4 }
    - { code: "int c = 0;\nfor (int i = 2; i < 17; i += 4) c++;\nSystem.out.print(c);", ans: 4 }
  prompt: 'How many times does the loop body run? (The code prints it.)'
  parts:
    - { ask: 'Iterations', label: a, value: ans, tol: 0.0001, explain: 'For i from a while i < b, stepping by s: ⌈(b − a) ÷ s⌉ passes; with <= add one when b is reached exactly. List the first few and last values of i when in doubt' }
  verify: { expect: { a: "java_out(code)" } }

- template: pr-off-by-one
  skill: prog.java-control
  pace: quick

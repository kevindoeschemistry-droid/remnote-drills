    - { m: 1, k: 2, arr: '[3, 8, 6, 4, 2]', code: "int[] a = {3, 8, 6, 4, 2};\nsortPasses(a, 1, 2);\nSystem.out.print(Arrays.toString(a));", o1: '[3, 6, 8, 4, 2]', o2: '[3, 4, 6, 8, 2]', o3: '[2, 3, 8, 6, 4]', o4: '[3, 8, 6, 4, 2]', ans: 0 }
  prompt: '{{m == 0 ? "Selection" : "Insertion"}} sort (ascending, the standard AP CSA version) runs on {{arr}}. What is the array after pass {{k}}?'
  parts:
    - ask: 'After the pass'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'Selection sort pass k finds the smallest remaining element and swaps it into position k − 1, so the front k elements are final. Insertion sort pass k takes element k and slides it left into the already-sorted front, so the front k + 1 elements are sorted among themselves but not yet final'
  verify: { choices: { a: "java_pick(code, [o1, o2, o3, o4], 'static void sortPasses(int[] a, int m, int k) {   for (int p = 1; p <= k; p++) {     if (m == 0) { int j = p - 1, mi = j; for (int i = j + 1; i < a.length; i++) if (a[i] < a[mi]) mi = i; int t = a[j]; a[j] = a[mi]; a[mi] = t; }     else { int v = a[p], i = p - 1; while (i >= 0 && a[i] > v) { a[i + 1] = a[i]; i--; } a[i + 1] = v; }   } }')" } }


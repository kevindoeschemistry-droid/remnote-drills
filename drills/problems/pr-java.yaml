- template: pr-recursion-calls
  skill: prog.java-algorithms
  pace: quick
  cases:
    - { n: 4, call: 'run(4)', ans: 9 }
    - { n: 5, call: 'run(5)', ans: 15 }
    - { n: 6, call: 'run(6)', ans: 25 }
    - { n: 3, call: 'run(3)', ans: 5 }
  prompt: 'Naive Fibonacci: fib(n) returns n when n < 2 and fib(n − 1) + fib(n − 2) otherwise. How many calls to fib does fib({{n}}) make in all, counting the first?'
  parts:
    - { ask: 'Calls', label: a, value: ans, tol: 0.0001, explain: 'Calls(n) = 1 + calls(n − 1) + calls(n − 2), with one call for n = 0 or 1. The count grows like the Fibonacci numbers themselves, exponentially, because the same subproblems are solved again and again' }
  verify: { expect: { a: "java_ret('static int calls = 0;\\nstatic int fib(int n) { calls++; if (n < 2) return n; return fib(n - 1) + fib(n - 2); }\\nstatic int run(int n) { fib(n); return calls; }', call)" } }

          for (int c = 0; c < g[0].length; c++)
            System.out.print(g[r][c]);
      o1: '654321'
      o2: '123456'
      o3: '456123'
      o4: '415263'
      ans: 2
  prompt: 'What does this print?'
  parts:
    - ask: 'Output'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'The outer loop variable changes slowest. Rows outside, columns inside is row-major order (reading order); columns outside is column-major (down each column in turn)'
  verify: { choices: { a: "java_pick(code, [o1, o2, o3, o4])" } }

- template: pr-search-count
  skill: prog.java-algorithms
  pace: quick
  figure: { type: code, src: full }
  cases:
    - defs: &BS |
        static int steps = 0;
        static int find(int[] a, int t) {
          int lo = 0, hi = a.length - 1;
          while (lo <= hi) {
            steps++;
            int mid = (lo + hi) / 2;
            if (a[mid] == t) return mid;
            if (a[mid] < t) lo = mid + 1; else hi = mid - 1;
          }
          return -1;
        }
      code: "int[] a = {2, 5, 8, 12, 16, 23, 38, 56, 72, 91};\nfind(a, 23);\nSystem.out.print(steps);"
      full: "Binary search, counting passes (steps):\nfind({2, 5, 8, 12, 16, 23, 38, 56, 72, 91}, 23)"
      ans: 3
    - defs: *BS
      code: "int[] a = {2, 5, 8, 12, 16, 23, 38, 56, 72, 91};\nfind(a, 91);\nSystem.out.print(steps);"
      full: "Binary search, counting passes (steps):\nfind({2, 5, 8, 12, 16, 23, 38, 56, 72, 91}, 91)"
      ans: 4
    - defs: *BS
      code: "int[] a = {2, 5, 8, 12, 16, 23, 38, 56, 72, 91};\nfind(a, 16);\nSystem.out.print(steps);"
      full: "Binary search, counting passes (steps):\nfind({2, 5, 8, 12, 16, 23, 38, 56, 72, 91}, 16)"
      ans: 1
    - defs: *BS
      code: "int[] a = {2, 5, 8, 12, 16, 23, 38, 56, 72, 91};\nfind(a, 4);\nSystem.out.print(steps);"
      full: "Binary search, counting passes (steps):\nfind({2, 5, 8, 12, 16, 23, 38, 56, 72, 91}, 4)"
      ans: 3
  prompt: 'Iterative binary search with lo = 0, hi = length − 1 and mid = (lo + hi) / 2 runs on the sorted array shown. How many times does the loop body run?'
  parts:
    - { ask: 'Passes', label: a, value: ans, tol: 0.0001, explain: 'Each pass checks a[mid] and throws away half of what is left (lo = mid + 1 or hi = mid − 1), stopping on a match or when lo passes hi. List the midpoints: index 4 (16) first here. At most about log₂ n + 1 passes; linear search may need all n' }
  verify: { expect: { a: "java_out(code, defs)" } }


    - { q: 'white gold (nickel or palladium in gold)', ans: 0 }
  prompt: 'Is {{q}} a substitutional or an interstitial alloy?'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["Substitutional: atoms of similar size replace host atoms", "Interstitial: much smaller atoms fill the holes between host atoms"]
      correct: ans
      explain: 'Compare atomic sizes. Metals of similar radius swap into lattice sites; small nonmetals such as C, N or B squeeze into the gaps. Interstitial atoms pin the layers, which makes the alloy harder and less malleable than the pure metal'
  verify: { authored: true }


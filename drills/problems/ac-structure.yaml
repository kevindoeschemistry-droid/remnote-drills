    - { f: 'ClO₂⁻', at: 'Cl O O', c: -1, e: 20 }
    - { f: 'H₂O₂', at: 'H H O O', c: 0, e: 14 }
  prompt: 'How many valence electrons go into the Lewis structure of {{f}}?'
  parts:
    - { ask: 'Valence electrons', label: r, value: e, tol: 0.0001, explain: 'Add the group valence electrons of every atom (H 1, C 4, N 5, O 6, halogens 7), then add one electron per negative charge and subtract one per positive charge. Place them as bonding pairs first, then complete octets on the outer atoms' }
  verify: { expect: { r: "sum([pt_group(pt_Z(a)) % 10 for a in at.split()]) - c" } }

- template: ac-octet-exception
  skill: gchem.bonding
  pace: recall
  cases:
    - { q: 'BF₃', ans: 0 }
    - { q: 'BeCl₂', ans: 0 }
    - { q: 'SF₆', ans: 1 }
    - { q: 'PCl₅', ans: 1 }
    - { q: 'XeF₄', ans: 1 }
    - { q: 'I₃⁻', ans: 1 }
    - { q: 'NO', ans: 2 }
    - { q: 'NO₂', ans: 2 }
    - { q: 'ClO₂', ans: 2 }
    - { q: 'CH₄', ans: 3 }
    - { q: 'CO₂', ans: 3 }
  prompt: 'In the best Lewis structure of {{q}}, how does the central atom relate to the octet rule?'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["Incomplete octet (fewer than 8)", "Expanded octet (more than 8)", "Odd number of electrons: one is unpaired", "Obeys the octet rule"]
      correct: ans
      explain: 'Count valence electrons first: an odd total cannot pair up (free radicals such as NO). Be and B are content with 4 and 6. Atoms from period 3 down can hold more than 8 when bonded to several electronegative atoms; period-2 atoms never can'
  verify: { authored: true }

- template: ac-formal-charge
  skill: gchem.bonding
  pace: quick
  cases:
    - { q: 'a nitrogen with four bonds and no lone pairs', V: 5, lp: 0, b: 4 }
    - { q: 'an oxygen with one bond and three lone pairs', V: 6, lp: 3, b: 1 }
    - { q: 'an oxygen with three bonds and one lone pair', V: 6, lp: 1, b: 3 }
    - { q: 'a carbon with three bonds and one lone pair', V: 4, lp: 1, b: 3 }
    - { q: 'an oxygen with two bonds and two lone pairs', V: 6, lp: 2, b: 2 }
    - { q: 'a boron with four bonds', V: 3, lp: 0, b: 4 }
    - { q: 'a nitrogen with two bonds and two lone pairs', V: 5, lp: 2, b: 2 }
    - { q: 'a sulfur with six bonds', V: 6, lp: 0, b: 6 }
    - { q: 'a carbon with three bonds and no lone pairs', V: 4, lp: 0, b: 3 }
  prompt: 'In a Lewis structure, what is the formal charge on {{q}}?'
  parts:
    - ask: 'Formal charge'
      label: a
      choice: ["Minus two", "Minus one", "Zero", "Plus one", "Plus two"]
      correct: V - 2*lp - b + 2
      explain: 'FC = valence electrons − lone-pair electrons − bonds $= {{V}} - {{2*lp}} - {{b}}$. The best structure has formal charges closest to zero, and any negative charge on the most electronegative atom'
  verify: { choices: { a: "V - 2*lp - b + 2" } }

- template: ac-resonance-bond-order
  skill: gchem.bonding
  pace: quick
  cases:
    - { q: 'the N–O bonds of nitrate, NO₃⁻', tb: 4, n: 3 }
    - { q: 'the C–O bonds of carbonate, CO₃²⁻', tb: 4, n: 3 }
    - { q: 'the O–O bonds of ozone, O₃', tb: 3, n: 2 }
    - { q: 'the N–O bonds of nitrite, NO₂⁻', tb: 3, n: 2 }
    - { q: 'the C–O bonds of acetate, CH₃COO⁻', tb: 3, n: 2 }
    - { q: 'the C–C bonds of benzene', tb: 9, n: 6 }
  prompt: 'Drawing every resonance structure, what is the average bond order of {{q}}?'
  parts:
    - { ask: 'Bond order', label: r, value: tb/n, tol: 0.001, explain: 'Count the bonds (pairs) shared among the equivalent positions in one structure and divide by the number of positions: ${{tb}}/{{n}}$. All the bonds are identical, intermediate in length between single and double' }
  verify: { expect: { r: "Rational(tb, n)" } }


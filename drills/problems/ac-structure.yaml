- template: ac-quantum-numbers-allowed
  skill: gchem.structure
  pace: recall
  given: { n: { int: [1, 4] }, l: { int: [0, 3] }, m: { int: [-3, 3] } }
  prompt: 'Is the set $n = {{n}}$, $\ell = {{l}}$, $m_\ell = {{m}}$ allowed?'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["Allowed", "Not allowed"]
      correct: '(l < n and abs(m) <= l) ? 0 : 1'
      explain: '$\ell$ runs from 0 to $n - 1$ and $m_\ell$ from $-\ell$ to $+\ell$. So a subshell $\ell$ has $2\ell + 1$ orbitals holding $2(2\ell + 1)$ electrons, and shell $n$ has $n^2$ orbitals'
  verify: { choices: { a: "0 if (l < n and Abs(m) <= l) else 1" } }

# ── nuclear chemistry ──────────────────────────────────────────────────────
- template: ac-nuclear-equation
  skill: gchem.nuclear
  pace: quick
  cases:
    - { q: '${}^{238}_{92}\mathrm{U} \rightarrow {}^{234}_{90}\mathrm{Th} + \,?$', dA: -4, dZ: -2 }
    - { q: '${}^{226}_{88}\mathrm{Ra} \rightarrow {}^{222}_{86}\mathrm{Rn} + \,?$', dA: -4, dZ: -2 }
    - { q: '${}^{14}_{6}\mathrm{C} \rightarrow {}^{14}_{7}\mathrm{N} + \,?$', dA: 0, dZ: 1 }
    - { q: '${}^{3}_{1}\mathrm{H} \rightarrow {}^{3}_{2}\mathrm{He} + \,?$', dA: 0, dZ: 1 }
    - { q: '${}^{11}_{6}\mathrm{C} \rightarrow {}^{11}_{5}\mathrm{B} + \,?$', dA: 0, dZ: -1 }
    - { q: '${}^{22}_{11}\mathrm{Na} \rightarrow {}^{22}_{10}\mathrm{Ne} + \,?$', dA: 0, dZ: -1 }
    - { q: '${}^{99\mathrm{m}}_{43}\mathrm{Tc} \rightarrow {}^{99}_{43}\mathrm{Tc} + \,?$', dA: 0, dZ: 0 }
    - { q: '${}^{60}_{27}\mathrm{Co} \rightarrow {}^{60}_{28}\mathrm{Ni} + \,?$', dA: 0, dZ: 1 }
    - { q: '${}^{210}_{84}\mathrm{Po} \rightarrow {}^{206}_{82}\mathrm{Pb} + \,?$', dA: -4, dZ: -2 }
  prompt: 'What particle completes {{q}}?'
  parts:
    - ask: 'Particle'
      label: a
      choice: ["Alpha particle, He-4", "Beta-minus particle (an electron)", "Positron", "Gamma ray only"]
      correct: 'dA == -4 ? 0 : (dZ == 1 ? 1 : (dZ == -1 ? 2 : 3))'
      explain: 'Mass numbers and atomic numbers must each balance. Alpha takes away 4 and 2; beta-minus turns a neutron into a proton (Z up 1); a positron (or electron capture) turns a proton into a neutron (Z down 1); gamma changes neither'
  verify: { choices: { a: "0 if dA == -4 else (1 if dZ == 1 else (2 if dZ == -1 else 3))" } }

# ── bonding ────────────────────────────────────────────────────────────────
- template: ac-bond-type
  skill: gchem.bonding
  pace: recall
  cases:
    - { q: 'H–Cl', en1: 2.20, en2: 3.16, met: 0 }
    - { q: 'Na–Cl', en1: 0.93, en2: 3.16, met: 0 }
    - { q: 'C–H', en1: 2.55, en2: 2.20, met: 0 }
    - { q: 'Cl–Cl', en1: 3.16, en2: 3.16, met: 0 }
    - { q: 'C–O', en1: 2.55, en2: 3.44, met: 0 }
    - { q: 'K–F', en1: 0.82, en2: 3.98, met: 0 }
    - { q: 'Cu–Zn (in brass)', en1: 1.90, en2: 1.65, met: 1 }
    - { q: 'N–H', en1: 3.04, en2: 2.20, met: 0 }
    - { q: 'Mg–O', en1: 1.31, en2: 3.44, met: 0 }
    - { q: 'P–Cl', en1: 2.19, en2: 3.16, met: 0 }
    - { q: 'Fe–Ni', en1: 1.83, en2: 1.91, met: 1 }
  prompt: 'Classify the {{q}} bond (Pauling electronegativities {{en1}} and {{en2}}).'
  parts:
    - ask: 'Bond type'
      label: a
      choice: ["Nonpolar covalent", "Polar covalent", "Ionic", "Metallic"]
      correct: 'met ? 3 : (abs(en1 - en2) < 0.4 ? 0 : (abs(en1 - en2) < 1.8 ? 1 : 2))'
      explain: 'Two metals share a sea of electrons: metallic. Otherwise use the difference, here ${{abs(en1 - en2)}}$: under about 0.4 nonpolar, up to about 1.8 polar, beyond that ionic. It is a continuum, and a metal with a nonmetal is called ionic on the AP exam'
  verify: { choices: { a: "3 if met else (0 if Abs(en1 - en2) < Rational(2, 5) else (1 if Abs(en1 - en2) < Rational(9, 5) else 2))" } }

- template: ac-pe-curve
  skill: gchem.bonding
  pace: recall
  cases:
    - { q: 'the bond length', ans: 0 }
    - { q: 'the bond energy', ans: 1 }
    - { q: 'where repulsion between the nuclei dominates', ans: 2 }
    - { q: 'where the two atoms no longer interact', ans: 3 }
    - { q: 'what moves left (shorter) for a double bond than a single bond between the same atoms', ans: 0 }
    - { q: 'what gets deeper for a stronger bond', ans: 1 }
  prompt: 'On a plot of potential energy against internuclear distance for two atoms, where do you read {{q}}?'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["The distance at the minimum", "The depth of the minimum below zero", "The steep wall at short distance", "The flat region at large distance, at zero energy"]
      correct: ans
      explain: 'Far apart the energy is zero. As the atoms approach, attraction lowers the energy to a minimum: its position is the bond length, its depth the energy needed to break the bond. Closer still, nucleus–nucleus repulsion sends the curve steeply up. Smaller atoms and more shared pairs give shorter, deeper wells'
  verify: { authored: true }

- template: ac-lattice-energy-rank
  skill: gchem.bonding
  pace: quick
  cases:
    - { a: 'NaCl', b: 'MgO', qa: 1, ra: 283, qb: 4, rb: 212 }
    - { a: 'LiF', b: 'KBr', qa: 1, ra: 209, qb: 1, rb: 334 }
    - { a: 'NaF', b: 'NaI', qa: 1, ra: 235, qb: 1, rb: 322 }
    - { a: 'KCl', b: 'CaO', qa: 1, ra: 319, qb: 4, rb: 240 }
    - { a: 'MgO', b: 'CaO', qa: 4, ra: 212, qb: 4, rb: 240 }
    - { a: 'CaS', b: 'KCl', qa: 4, ra: 284, qb: 1, rb: 319 }
    - { a: 'NaCl', b: 'NaBr', qa: 1, ra: 283, qb: 1, rb: 298 }
  prompt: 'Which has the larger lattice energy: {{a}} or {{b}}?'
  parts:
    - ask: 'Larger lattice energy'
      label: a
      choice: ["{{a}}", "{{b}}"]
      correct: 'qa/ra > qb/rb ? 0 : 1'
      explain: 'Coulomb''s law: $E \propto \dfrac{q_+ q_-}{r_+ + r_-}$. Charge matters first (2+ with 2− is four times 1+ with 1−); among equal charges the smaller ions win. Higher lattice energy means a higher melting point'
  verify: { choices: { a: "0 if Rational(qa)/ra > Rational(qb)/rb else 1" } }

- template: ac-ionic-properties
  skill: gchem.bonding
  pace: recall
  cases:
    - { q: 'solid NaCl does not conduct electricity, yet molten NaCl does', ans: 1 }
    - { q: 'an ionic crystal shatters when struck', ans: 2 }
    - { q: 'MgO melts at about 2850 °C', ans: 0 }
    - { q: 'a solution of KBr in water conducts', ans: 1 }
    - { q: 'NaCl has a higher melting point than ice', ans: 0 }
  prompt: 'Explain why {{q}}.'
  parts:
    - ask: 'Best explanation'
      label: a
      choice: ["Strong Coulomb attractions run through the whole lattice", "Ions are fixed in the solid but free to move in the melt or solution", "A shifted layer brings like charges side by side and they repel", "Delocalised electrons carry the current"]
      correct: ans
      explain: 'An ionic solid is a three-dimensional array of cations and anions. Its properties all come from that picture: every ion is held by all its neighbours (high melting point), ions are locked in place (no conduction until melted or dissolved), and sliding one layer lines up like charges (brittle)'
  verify: { authored: true }

- template: ac-alloy-type
  skill: gchem.bonding
  pace: recall
  cases:

    - { f: 'BF₃', bp: 3, lp: 0 }
    - { f: 'SO₂', bp: 2, lp: 1 }
    - { f: 'CH₄', bp: 4, lp: 0 }
    - { f: 'NH₃', bp: 3, lp: 1 }
    - { f: 'H₂O', bp: 2, lp: 2 }
    - { f: 'PCl₅', bp: 5, lp: 0 }
    - { f: 'SF₄', bp: 4, lp: 1 }
    - { f: 'ClF₃', bp: 3, lp: 2 }
    - { f: 'XeF₂', bp: 2, lp: 3 }
    - { f: 'SF₆', bp: 6, lp: 0 }
    - { f: 'BrF₅', bp: 5, lp: 1 }
    - { f: 'XeF₄', bp: 4, lp: 2 }
    - { f: 'I₃⁻', bp: 2, lp: 3 }
  prompt: 'What is the molecular shape of {{f}}?'
  parts:
    - ask: 'Shape'
      label: a
      choice: ["Linear", "Trigonal planar", "Bent", "Tetrahedral", "Trigonal pyramidal", "Trigonal bipyramidal", "Seesaw", "T-shaped", "Octahedral", "Square pyramidal", "Square planar"]
      correct: 'bp == 2 and lp == 0 ? 0 : (bp == 3 and lp == 0 ? 1 : (bp == 2 and (lp == 1 or lp == 2) ? 2 : (bp == 4 and lp == 0 ? 3 : (bp == 3 and lp == 1 ? 4 : (bp == 5 and lp == 0 ? 5 : (bp == 4 and lp == 1 ? 6 : (bp == 3 and lp == 2 ? 7 : (bp == 2 and lp == 3 ? 0 : (bp == 6 ? 8 : (bp == 5 ? 9 : 10))))))))))'
      explain: 'The central atom of {{f}} has {{bp}} bonded atoms and {{lp}} lone pair{{lp == 1 ? "" : "s"}}: {{bp + lp}} domains. The domains set the electron geometry; the shape names only where the atoms are. Lone pairs take equatorial seats in a trigonal bipyramid and opposite seats in an octahedron'
  verify: { choices: { a: "{(2, 0): 0, (3, 0): 1, (2, 1): 2, (2, 2): 2, (4, 0): 3, (3, 1): 4, (5, 0): 5, (4, 1): 6, (3, 2): 7, (2, 3): 0, (6, 0): 8, (5, 1): 9, (4, 2): 10}[(bp, lp)]" } }

- template: ac-polarity
  skill: gchem.bonding
  pace: recall
  cases:
    - { f: 'CO₂', ans: 1 }
    - { f: 'H₂O', ans: 0 }
    - { f: 'CCl₄', ans: 1 }
    - { f: 'CHCl₃', ans: 0 }
    - { f: 'BF₃', ans: 1 }
    - { f: 'NH₃', ans: 0 }
    - { f: 'SF₆', ans: 1 }
    - { f: 'SF₄', ans: 0 }
    - { f: 'XeF₄', ans: 1 }
    - { f: 'SO₂', ans: 0 }
    - { f: 'CH₂Cl₂', ans: 0 }
    - { f: 'PCl₅', ans: 1 }
    - { f: 'HCN', ans: 0 }
    - { f: 'BCl₃', ans: 1 }
  prompt: 'Is {{f}} polar or nonpolar?'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["Polar", "Nonpolar"]
      correct: ans
      explain: 'Polar bonds are not enough: the bond dipoles must fail to cancel. Identical atoms arranged symmetrically (linear, trigonal planar, tetrahedral, square planar, octahedral) cancel; lone pairs on the central atom or mixed outer atoms usually leave a net dipole'
  verify: { authored: true }

- template: ac-sigma-pi
  skill: gchem.bonding
  pace: quick
  cases:
    - { f: 'HCN', s: 1, d: 0, t: 1 }
    - { f: 'CO₂', s: 0, d: 2, t: 0 }
    - { f: 'C₂H₄ (ethene)', s: 4, d: 1, t: 0 }
    - { f: 'C₂H₂ (ethyne)', s: 2, d: 0, t: 1 }
    - { f: 'CH₃COOH (acetic acid)', s: 6, d: 1, t: 0 }
    - { f: 'CH₂=CH–C≡N (acrylonitrile)', s: 4, d: 1, t: 1 }
    - { f: 'N₂', s: 0, d: 0, t: 1 }
    - { f: 'H₂CO (formaldehyde)', s: 2, d: 1, t: 0 }
    - { f: 'CH₃CHO (acetaldehyde)', s: 5, d: 1, t: 0 }
  prompt: 'How many σ bonds and how many π bonds are in {{f}}?'
  parts:
    - { ask: 'σ bonds', label: r, value: s + d + t, tol: 0.0001, explain: 'Every bond has exactly one σ: here ${{s}}$ single + ${{d}}$ double + ${{t}}$ triple $= {{s + d + t}}$' }
    - { ask: 'π bonds', label: p, value: d + 2*t, tol: 0.0001, explain: 'A double bond adds one π and a triple bond two. π bonds need unhybridised p orbitals, so an atom with one π bond is sp², with two sp' }
  verify: { expect: { r: "s + d + t", p: "d + 2*t" } }

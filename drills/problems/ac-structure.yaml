# AP Chemistry units 1–2: electron structure, periodic trends, nuclear chemistry and bonding.
# Electron counts are rechecked from periodic-table position (pt_Z, pt_group in tests/verify/data.py).

# ── electron configurations and the periodic table ─────────────────────────
- template: ac-ion-d-count
  skill: gchem.structure
  pace: quick
  cases:
    - { ion: 'Fe²⁺', s: 'Fe', c: 2, d: 6 }
    - { ion: 'Fe³⁺', s: 'Fe', c: 3, d: 5 }
    - { ion: 'Cu⁺', s: 'Cu', c: 1, d: 10 }
    - { ion: 'Cu²⁺', s: 'Cu', c: 2, d: 9 }
    - { ion: 'Cr³⁺', s: 'Cr', c: 3, d: 3 }
    - { ion: 'Mn²⁺', s: 'Mn', c: 2, d: 5 }
    - { ion: 'Co³⁺', s: 'Co', c: 3, d: 6 }
    - { ion: 'Ni²⁺', s: 'Ni', c: 2, d: 8 }
    - { ion: 'Ti²⁺', s: 'Ti', c: 2, d: 2 }
    - { ion: 'V³⁺', s: 'V', c: 3, d: 2 }
    - { ion: 'Zn²⁺', s: 'Zn', c: 2, d: 10 }
    - { ion: 'Ag⁺', s: 'Ag', c: 1, d: 10 }
  prompt: 'How many d electrons does {{ion}} have? (Its noble-gas configuration is [core] $n$d$^?$.)'
  parts:
    - { ask: 'd electrons', label: r, value: d, tol: 0.0001, explain: 'A transition-metal ion loses its outer s electrons first, so the d count is the group number minus the charge. {{s}} is in group {{d + c}}: $ {{d + c}} - {{c}} = {{d}}$. Writing the ion as [core]$n$s$^2$… instead is the classic slip' }
  verify: { expect: { r: "pt_group(pt_Z(s)) - c" } }

- template: ac-unpaired-electrons
  skill: gchem.structure
  pace: quick
  cases:
    - { q: 'Fe²⁺', s: 'Fe', c: 2, blk: 1, n: 4 }
    - { q: 'Fe³⁺', s: 'Fe', c: 3, blk: 1, n: 5 }
    - { q: 'Mn²⁺', s: 'Mn', c: 2, blk: 1, n: 5 }
    - { q: 'Cu²⁺', s: 'Cu', c: 2, blk: 1, n: 1 }
    - { q: 'Ni²⁺', s: 'Ni', c: 2, blk: 1, n: 2 }
    - { q: 'Cr³⁺', s: 'Cr', c: 3, blk: 1, n: 3 }
    - { q: 'Co²⁺', s: 'Co', c: 2, blk: 1, n: 3 }
    - { q: 'a nitrogen atom', s: 'N', c: 0, blk: 0, n: 3 }
    - { q: 'an oxygen atom', s: 'O', c: 0, blk: 0, n: 2 }
    - { q: 'a phosphorus atom', s: 'P', c: 0, blk: 0, n: 3 }
    - { q: 'a chlorine atom', s: 'Cl', c: 0, blk: 0, n: 1 }
    - { q: 'a sulfur atom', s: 'S', c: 0, blk: 0, n: 2 }
  prompt: 'How many unpaired electrons does {{q}} have in its ground state? (Any unpaired electron makes it paramagnetic.)'
  parts:
    - { ask: 'Unpaired electrons', label: r, value: n, tol: 0.0001, explain: 'Fill the open subshell one electron per orbital before pairing (Hund''s rule): five d boxes, three p boxes. Up to half-full every electron is unpaired; past that, count the empty spaces instead' }
  verify: { expect: { r: "Min(pt_group(pt_Z(s)) - c, 10 - (pt_group(pt_Z(s)) - c)) if blk == 1 else Min(pt_group(pt_Z(s)) - 12, 18 - pt_group(pt_Z(s)))" } }

- template: ac-coulomb-compare
  skill: gchem.structure
  pace: quick
  cases:
    - { q: 'a 2p electron in fluorine or a 2p electron in oxygen', ans: 0, a: 'Fluorine', b: 'Oxygen' }
    - { q: 'the 3s electron of sodium or the 2s electron of lithium', ans: 1, a: 'Sodium', b: 'Lithium' }
    - { q: 'a 3p electron in chlorine or a 4p electron in bromine', ans: 0, a: 'Chlorine', b: 'Bromine' }
    - { q: 'the outer electron of Na or of Na⁺ (a 2p electron)', ans: 1, a: 'Na (3s)', b: 'Na⁺ (2p)' }
    - { q: 'a 1s electron in carbon or a 2p electron in carbon', ans: 0, a: 'The 1s electron', b: 'The 2p electron' }
    - { q: 'the outer electron of potassium or of calcium', ans: 1, a: 'Potassium', b: 'Calcium' }
  prompt: 'By Coulomb''s law, which is attracted more strongly to its nucleus: {{q}}?'
  parts:
    - ask: 'Stronger attraction'
      label: a
      choice: ["{{a}}", "{{b}}"]
      correct: ans
      explain: '$F \propto \dfrac{Z_\text{eff}\,e^2}{r^2}$. Across a period the nuclear charge grows while the shell, and so the distance and the shielding by core electrons, stay the same. Down a group the electron sits in a farther shell behind more core electrons'
  verify: { authored: true }

- template: ac-pes-identify
  skill: gchem.structure
  pace: quick
  cases:
    - { h: '2 2 6 1', Z: 11 }
    - { h: '2 2 6 2', Z: 12 }
    - { h: '2 2 6 2 1', Z: 13 }
    - { h: '2 2 6 2 3', Z: 15 }
    - { h: '2 2 6 2 4', Z: 16 }
    - { h: '2 2 6 2 6 1', Z: 19 }
    - { h: '2 2 3', Z: 7 }
    - { h: '2 2 5', Z: 9 }
    - { h: '2 2 6 2 6 2', Z: 20 }
    - { h: '2 1', Z: 3 }
  prompt: 'A photoelectron spectrum shows peaks whose relative heights, from highest binding energy to lowest, are {{h}}. What is the atomic number of the element?'
  parts:
    - { ask: 'Atomic number', label: r, value: Z, tol: 0.0001, explain: 'Each peak is a subshell (1s, 2s, 2p, 3s, 3p, 4s …, in order of falling binding energy) and its height is the number of electrons in it. Add the heights for the electron count of the neutral atom. The peak farthest left, the 1s, also moves to higher energy as Z grows' }
  verify: { expect: { r: "sum([Integer(t) for t in h.split()])" } }

- template: ac-periodic-trend
  skill: gchem.structure
  pace: recall
  cases:
    - { q: 'larger atomic radius', a: 'K', b: 'Br', ans: 0 }
    - { q: 'larger atomic radius', a: 'Mg', b: 'Ba', ans: 1 }
    - { q: 'higher first ionization energy', a: 'N', b: 'P', ans: 0 }
    - { q: 'higher first ionization energy', a: 'Na', b: 'Cl', ans: 1 }
    - { q: 'higher first ionization energy', a: 'N', b: 'O', ans: 0 }
    - { q: 'higher first ionization energy', a: 'Be', b: 'B', ans: 0 }
    - { q: 'higher electronegativity', a: 'O', b: 'S', ans: 0 }
    - { q: 'higher electronegativity', a: 'C', b: 'F', ans: 1 }
    - { q: 'larger atomic radius', a: 'O', b: 'F', ans: 0 }
    - { q: 'more negative electron affinity', a: 'Cl', b: 'Na', ans: 0 }
  prompt: 'Which has the {{q}}: {{a}} or {{b}}?'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["{{a}}", "{{b}}"]
      correct: ans
      explain: 'Across a period $Z_\text{eff}$ rises at constant shell: atoms shrink and hold electrons tighter (higher ionization energy and electronegativity). Down a group the shell number wins: atoms grow and hold less tightly. The two dips in ionization energy, B after Be and O after N, come from starting a p subshell and from the first paired p electron'
  verify: { authored: true }

- template: ac-successive-ie
  skill: gchem.structure
  pace: quick
  cases:
    - { L: [496, 4562, 6910, 9543], ls: '496, 4562, 6910, 9543', off: 0, per: 3, g: 1 }
    - { L: [738, 1451, 7733, 10543], ls: '738, 1451, 7733, 10543', off: 0, per: 3, g: 2 }
    - { L: [578, 1817, 2745, 11577], ls: '578, 1817, 2745, 11577', off: 10, per: 3, g: 13 }
    - { L: [786, 1577, 3232, 4356, 16091], ls: '786, 1577, 3232, 4356, 16091', off: 10, per: 3, g: 14 }
    - { L: [590, 1145, 4912, 6491], ls: '590, 1145, 4912, 6491', off: 0, per: 4, g: 2 }
    - { L: [419, 3052, 4420, 5877], ls: '419, 3052, 4420, 5877', off: 0, per: 4, g: 1 }
    - { L: [801, 2427, 3660, 25026], ls: '801, 2427, 3660, 25026', off: 10, per: 2, g: 13 }
    - { L: [1086, 2353, 4621, 6223, 37831], ls: '1086, 2353, 4621, 6223, 37831', off: 10, per: 2, g: 14 }
    - { L: [900, 1757, 14849, 21007], ls: '900, 1757, 14849, 21007', off: 0, per: 2, g: 2 }
  prompt: 'An element in period {{per}} has successive ionization energies (kJ/mol) {{ls}}. What group is it in (1–18)?'
  parts:
    - { ask: 'Group', label: r, value: g, tol: 0.0001, explain: 'Find the big jump: it comes when the next electron must be pulled from the core. The number of electrons removed before the jump is the number of valence electrons, which is the group number for groups 1–2 and ten less than it for groups 13–18' }
  verify: { expect: { r: "[r.index(Max(*r)) + 1 + off for r in [[L[i]/L[i - 1] for i in range(1, len(L))]]][0]" } }

- template: ac-isoelectronic-rank
  skill: gchem.structure
  pace: quick
  cases:
    - { o1: 'O²⁻', o2: 'F⁻', o3: 'Na⁺', o4: 'Mg²⁺', Zs: [8, 9, 11, 12], big: 1, ans: 0 }
    - { o1: 'O²⁻', o2: 'F⁻', o3: 'Na⁺', o4: 'Mg²⁺', Zs: [8, 9, 11, 12], big: 0, ans: 3 }
    - { o1: 'S²⁻', o2: 'Cl⁻', o3: 'K⁺', o4: 'Ca²⁺', Zs: [16, 17, 19, 20], big: 1, ans: 0 }
    - { o1: 'Ca²⁺', o2: 'K⁺', o3: 'Cl⁻', o4: 'S²⁻', Zs: [20, 19, 17, 16], big: 0, ans: 0 }
    - { o1: 'N³⁻', o2: 'Ne', o3: 'Al³⁺', o4: 'Na⁺', Zs: [7, 10, 13, 11], big: 1, ans: 0 }
    - { o1: 'Ar', o2: 'P³⁻', o3: 'Ca²⁺', o4: 'Cl⁻', Zs: [18, 15, 20, 17], big: 0, ans: 2 }
  prompt: 'These species all have the same number of electrons. Which is the {{big ? "largest" : "smallest"}}?'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'Same electrons, different nuclear charge: the more protons, the harder the pull and the smaller the ion. So the anion with the fewest protons is largest and the most highly charged cation smallest. A cation is always smaller than its parent atom, an anion larger'
  verify: { choices: { a: "Zs.index(Min(*Zs)) if big else Zs.index(Max(*Zs))" } }

- template: ac-ion-charge-formula
  skill: gchem.composition
  pace: quick
  cases:
    - { a: 'aluminum', b: 'oxygen', o1: 'Al₂O₃', o2: 'AlO', o3: 'Al₃O₂', o4: 'AlO₃', ans: 0 }
    - { a: 'magnesium', b: 'nitrogen', o1: 'MgN', o2: 'Mg₃N₂', o3: 'Mg₂N₃', o4: 'MgN₂', ans: 1 }
    - { a: 'calcium', b: 'chlorine', o1: 'CaCl', o2: 'Ca₂Cl', o3: 'CaCl₂', o4: 'CaCl₃', ans: 2 }
    - { a: 'sodium', b: 'sulfur', o1: 'NaS', o2: 'NaS₂', o3: 'Na₃S', o4: 'Na₂S', ans: 3 }
    - { a: 'lithium', b: 'nitrogen', o1: 'Li₃N', o2: 'LiN', o3: 'LiN₃', o4: 'Li₂N', ans: 0 }
    - { a: 'barium', b: 'phosphorus', o1: 'BaP', o2: 'Ba₃P₂', o3: 'Ba₂P₃', o4: 'BaP₂', ans: 1 }
    - { a: 'potassium', b: 'oxygen', o1: 'KO', o2: 'KO₂', o3: 'K₂O', o4: 'K₃O', ans: 2 }
    - { a: 'gallium', b: 'fluorine', o1: 'GaF', o2: 'Ga₂F', o3: 'Ga₃F', o4: 'GaF₃', ans: 3 }
  prompt: 'What is the formula of the ionic compound formed by {{a}} and {{b}}?'
  parts:
    - ask: 'Formula'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'Main-group metals lose electrons down to the previous noble gas (group 1 → +1, group 2 → +2, group 13 → +3); nonmetals gain up to the next one (group 15 → −3, 16 → −2, 17 → −1). Then balance the charges with the smallest whole numbers'
  verify: { authored: true }


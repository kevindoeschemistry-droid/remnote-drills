- template: fe-material-pick
  skill: materials.corrosion
  pace: recall
  cases:
  - q: 'Hot concentrated chloride solution at 150 degrees Celsius calls for:'
    o1: A nickel alloy, since stainless steels crack in hot chlorides
    o2: 304 stainless steel
    o3: Carbon steel
    o4: Aluminium
  - q: 'Seawater service at ambient temperature calls for:'
    o1: Titanium or a suitable copper-nickel alloy
    o2: Carbon steel with no allowance
    o3: Mild steel galvanised
    o4: Cast iron
  - q: 'The default material against which others are justified is:'
    o1: Carbon steel
    o2: 316 stainless steel
    o3: Titanium
    o4: A fluoropolymer lining
  - q: 'Dilute sulphuric acid at ambient temperature in a small vessel often argues for:'
    o1: A lined or polymer vessel, since the metals that resist it are expensive
    o2: Carbon steel
    o3: Aluminium
    o4: Galvanised steel
  - q: 'A material that resists the fluid but fails the service may still be wrong because of:'
    o1: Temperature, stress, or contamination of the product
    o2: Price alone
    o3: Colour
    o4: Availability alone
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Carbon steel first, and every upgrade justified by what specifically attacks it at the service conditions
  verify:
    authored: true
- template: fe-corrosion-life
  skill: materials.corrosion
  pace: quick
  given:
    al:
      pick:
      - 1.5
      - 3.0
      - 6.0
    rt:
      pick:
      - 0.05
      - 0.1
      - 0.25
      - 0.5
  prompt: A vessel carries a corrosion allowance of {{al}} mm at a measured rate of {{rt}} mm a year. What life does the allowance buy (years)?
  parts:
  - ask: Answer
    label: v
    tex: years
    value: al/rt
    tol: 0.005
    explain: 'A design life follows from allowance over rate, which works only for uniform attack: pitting goes through a wall while the average thickness barely moves, so an allowance is no defence against it'
  verify:
    expect:
      v: nsimplify(al)/nsimplify(rt)
- template: fe-allowance-needed
  skill: materials.corrosion
  pace: quick
  given:
    yr:
      pick:
      - 10
      - 20
      - 25
    rt:
      pick:
      - 0.05
      - 0.1
      - 0.25
      - 0.5
  prompt: A {{yr}}-year life at a corrosion rate of {{rt}} mm a year needs what allowance (mm)?
  parts:
  - ask: Answer
    label: v
    tex: mm
    value: yr*rt
    tol: 0.005
    explain: 'The reverse: at half a millimetre a year a twenty-five year life needs more than a centimetre of extra steel, which is usually the point at which a better material is cheaper than the thickness'
  verify:
    expect:
      v: nsimplify(yr)*nsimplify(rt)

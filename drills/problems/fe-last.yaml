- template: fe-galvanic-which
  skill: materials.corrosion
  pace: recall
  cases:
  - q: In a couple of carbon steel and 316 stainless in seawater, which corrodes?
    o1: The carbon steel, as the less noble member
    o2: The stainless steel
    o3: Neither
    o4: Both equally
  - q: In a couple of zinc and steel, which corrodes?
    o1: The zinc, which is why it is used as a sacrificial anode
    o2: The steel
    o3: Neither
    o4: Both equally
  - q: 'Galvanic attack needs:'
    o1: Two different metals, an electrolyte and an electrical connection
    o2: Only two different metals
    o3: Only an electrolyte
    o4: Tensile stress
  - q: 'Breaking the electrical connection with an insulating gasket:'
    o1: Stops the galvanic current and so the attack
    o2: Has no effect
    o3: Accelerates attack
    o4: Changes which metal is the anode
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Less noble corrodes, and the couple needs all three of metals, electrolyte and connection, so removing any one stops it
  verify:
    authored: true

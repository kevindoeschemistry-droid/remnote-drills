- template: fe-p-offset
  skill: design.control
  pace: quick
  given:
    kg:
      pick:
      - 1
      - 4
      - 9
      - 19
  prompt: A proportional-only loop has a loop gain of {{kg}}. What fraction of an unmeasured load change remains as offset?
  parts:
  - ask: Answer
    label: v
    tex: fraction
    value: 1/(1 + kg)
    tol: 0.005
    explain: Offset is the load change over one plus the loop gain, so it falls with gain but never reaches zero; integral action is what removes it, at the cost of lag
  verify:
    expect:
      v: Rational(1, 1 + kg)

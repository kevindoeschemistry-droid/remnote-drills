  - f1: 0.25
    f2: 0.02
  - f1: 0.1
    f2: 0.01
  prompt: What loop gain reduces a proportional-only offset from {{f1}} to {{f2}} of the load change?
  parts:
  - ask: Answer
    label: v
    tex: K
    value: 1/f2 - 1
    tol: 0.005
    explain: 'Cutting the offset by a factor of five means raising one plus the gain by five, which is also five times the sensitivity to noise: the trade is why integral action exists'
  verify:
    expect:
      v: 1/nsimplify(f2) - 1
- template: fe-valve-cv
  skill: design.control
  pace: quick
  given:
    qq:
      pick:
      - 40
      - 150
      - 600
    sg:
      pick:
      - 0.8
      - 1.0
      - 1.25
    dp:
      pick:
      - 5
      - 15
      - 40
  prompt: A valve must pass {{qq}} US gallons per minute of a liquid of specific gravity {{sg}} with {{dp}} psi across it. What flow coefficient is needed, using Cv = Q*sqrt(SG/dP)?
  parts:
  - ask: Answer
    label: v
    tex: C_v
    value: qq*sqrt(sg/dp)
    tol: 0.005
    explain: The coefficient is printed as its defining equation because valve-standard tables were not read. Flow goes as the square root of the drop, so a valve given only a small share of the system's drop has little authority over the flow
  verify:
    expect:
      v: nsimplify(qq)*sqrt(nsimplify(sg)/nsimplify(dp))
- template: fe-valve-authority
  skill: design.control
  pace: quick
  given:
    dv:
      pick:
      - 5
      - 15
      - 40
    dt:
      pick:
      - 25
      - 60
      - 120
  require:
  - dv < dt
  prompt: A valve takes {{dv}} psi of a system whose total drop is {{dt}} psi. What percentage of the drop is across the valve?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*dv/dt
    tol: 0.005
    explain: Valve authority is its share of the total drop; below about a quarter the installed characteristic distorts badly and the loop becomes hard to tune at any gain
  verify:
    expect:
      v: 100*Rational(dv, dt)
- template: fe-valve-characteristic
  skill: design.control
  pace: recall
  cases:
  - q: 'A valve taking most of the system''s pressure drop suits:'
    o1: A linear characteristic
    o2: An equal-percentage characteristic
    o3: A quick-opening characteristic
    o4: Any characteristic
  - q: 'A valve in a line that takes most of the drop suits:'
    o1: An equal-percentage characteristic, so the installed behaviour comes out closer to linear
    o2: A linear characteristic
    o3: A quick-opening characteristic
    o4: No valve
  - q: 'A fuel gas valve is usually specified to:'
    o1: Fail closed on loss of air
    o2: Fail open
    o3: Fail in place
    o4: Fail to its last position
  - q: 'A cooling water valve on an exothermic reactor is usually specified to:'
    o1: Fail open on loss of air
    o2: Fail closed
    o3: Fail in place
    o4: Fail to minimum flow
  - q: 'The installed characteristic differs from the inherent one because:'
    o1: The pressure drop across the valve changes as it opens and the line takes more
    o2: The actuator is nonlinear
    o3: The positioner distorts it
    o4: The trim wears
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The characteristic is chosen for the installed behaviour, and the failure position is chosen from what is safe on air loss
  verify:
    authored: true
- template: fe-transmitter-span
  skill: design.control
  pace: quick
  given:
    lo:
      pick:
      - 0
      - 50
      - 100
    hi:
      pick:
      - 200
      - 300
      - 400
    ma:
      pick:
      - 8
      - 12
      - 17.6
  require:
  - hi > lo
  prompt: A transmitter is ranged {{lo}} to {{hi}} degrees Celsius on a 4 to 20 mA output. What does {{ma}} mA mean (degrees Celsius)?
  parts:
  - ask: Answer
    label: v
    tex: ^\circ C
    value: lo + (ma - 4)/16*(hi - lo)
    tol: 0.005
    explain: The signal maps linearly onto the calibrated range, so a wrong range makes a loop control to the wrong value while every indication looks healthy
  verify:
    expect:
      v: nsimplify(lo) + (nsimplify(ma) - 4)/16*(nsimplify(hi) - nsimplify(lo))
- template: fe-transmitter-signal
  skill: design.control
  pace: quick
  given:
    lo:
      pick:
      - 0
      - 50
      - 100
    hi:
      pick:
      - 200
      - 300
      - 400
    tv:
      pick:
      - 120
      - 180
      - 260
  require:
  - tv > lo
  - tv < hi
  prompt: The same transmitter, ranged {{lo}} to {{hi}} degrees Celsius, reads {{tv}} degrees. What current does it send (mA)?
  parts:
  - ask: Answer
    label: v
    tex: mA
    value: 4 + (tv - lo)/(hi - lo)*16
    tol: 0.005
    explain: 'The reverse conversion, and the reason the zero is at 4 mA rather than 0: a broken wire reads 0 and is distinguishable from a genuine bottom-of-range reading'
  verify:
    expect:
      v: 4 + (nsimplify(tv) - nsimplify(lo))/(nsimplify(hi) - nsimplify(lo))*16
- template: fe-upgrade-cost
  skill: materials.corrosion
  pace: quick
  given:
    k1:
      pick:
      - 40000
      - 120000
    fm:
      pick:
      - 2.5
      - 4
      - 8
    mf:
      pick:
      - 25
      - 40
      - 60
  prompt: Carbon steel for a vessel costs {{k1}} dollars; the alloy that resists the service costs {{fm}} times as much in material. If material is {{mf}} per cent of the installed cost, what does the upgrade add to the installed cost (per cent)?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: (fm - 1)*mf
    tol: 0.005
    explain: 'The alloy premium only applies to the material fraction, so a four-fold material price rise on a vessel that is 40 per cent material adds 120 per cent, not 300: that arithmetic is what decides upgrade against allowance against lining'
  verify:
    expect:
      v: (nsimplify(fm) - 1)*nsimplify(mf)
- template: fe-stress-threshold
  skill: materials.corrosion
  pace: quick
  given:
    sv:
      pick:
      - 60
      - 140
      - 310
    th:
      pick:
      - 100
      - 200
      - 350
  prompt: A component is stressed to {{sv}} MPa against a stress-corrosion threshold of {{th}} MPa in this environment. What percentage of the threshold is that?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*sv/th
    tol: 0.005
    explain: Stress-corrosion cracking needs stress above a threshold in that specific environment, so a stress-relief heat treatment or a lower design stress removes the risk without changing the alloy
  verify:
    expect:
      v: 100*Rational(sv, th)
- template: fe-pit-penetration
  skill: materials.corrosion
  pace: quick
  given:
    ur:
      pick:
      - 0.05
      - 0.1
      - 0.2
    pf:
      pick:
      - 10
      - 25
      - 60
    wt:
      pick:
      - 6
      - 10
      - 16
  prompt: Uniform attack runs at {{ur}} mm a year while pits grow {{pf}} times faster. A wall of {{wt}} mm fails by pitting in how many years?
  parts:
  - ask: Answer
    label: v
    tex: years
    value: wt/(ur*pf)
    tol: 0.005
    explain: 'The number is why an allowance is no defence against pitting: at twenty-five times the uniform rate a wall is through long before the average thickness has moved, and only inspection for pits catches it'
  verify:
    expect:
      v: nsimplify(wt)/(nsimplify(ur)*nsimplify(pf))
- template: fe-coating-holiday
  skill: materials.corrosion
  pace: quick
  given:
    hp:
      pick:
      - 0.1
      - 0.5
      - 2
      - 5
  prompt: A coating covers all but {{hp}} per cent of a surface. By what factor is the current density on the bare metal raised, compared with the whole surface being bare?
  parts:
  - ask: Answer
    label: v
    tex: \times
    value: 100/hp
    tol: 0.005
    explain: A nearly perfect coating concentrates the whole cell's current into the holidays, which is why a coated pipeline still needs cathodic protection and why a small defect perforates fast
  verify:
    expect:
      v: 100/nsimplify(hp)
- template: fe-fedbatch-feed
  skill: cre.bioprocess
  pace: quick
  given:
    xx:
      pick:
      - 10
      - 30
      - 60
    vv:
      pick:
      - 100
      - 500
      - 2000
    qs:
      pick:
      - 0.05
      - 0.12
      - 0.3
    cf:
      pick:
      - 200
      - 500
      - 700
  prompt: A fed-batch holds substrate at the consumption rate. With {{xx}} g/L of cells in {{vv}} L at a specific consumption of {{qs}} g per g per hour, what feed of a {{cf}} g/L solution is needed (L/h)?
  parts:
  - ask: Answer
    label: v
    tex: L/h
    value: xx*vv*qs/cf
    tol: 0.005
    explain: Feeding at the consumption rate is what keeps substrate low enough to avoid inhibition and repression; because cell mass grows, the feed has to rise with it, which is why fed-batch profiles are exponential
  verify:
    expect:
      v: nsimplify(xx)*nsimplify(vv)*nsimplify(qs)/nsimplify(cf)
- template: fe-cascade-speed
  skill: design.control
  pace: quick
  given:
    to:
      pick:
      - 8
      - 20
      - 45
    ti:
      pick:
      - 0.5
      - 2
      - 6
  prompt: An outer loop has a time constant of {{to}} minutes and the inner loop {{ti}} minutes. By what factor is the inner loop faster, and is the usual rule of at least three times met? Give the factor.
  parts:
  - ask: Answer
    label: v
    tex: \times
    value: to/ti
    tol: 0.005
    explain: Cascade works only when the inner loop settles well inside the outer loop's response, usually a factor of three or more; below that the two loops interact and tuning either one upsets the other
  verify:
    expect:
      v: nsimplify(to)/nsimplify(ti)
- template: fe-reset-time
  skill: design.control
  pace: quick
  given:
    tr:
      pick:
      - 0.4
      - 2.5
      - 8
      - 20
  prompt: A controller's integral action is set as a reset time of {{tr}} minutes per repeat. What is the reset rate in repeats per minute?
  parts:
  - ask: Answer
    label: v
    tex: repeats/min
    value: 1/tr
    tol: 0.005
    explain: 'The same integral setting is quoted both ways by different makers, and confusing them turns a sluggish loop into an oscillating one: more repeats per minute is more integral action, more minutes per repeat is less'
  verify:
    expect:
      v: 1/nsimplify(tr)
- template: fe-installed-gain
  skill: design.control
  pace: quick
  cases:
  - rg: 50
    op: 50
  - rg: 50
    op: 25
  - rg: 30
    op: 75
  - rg: 100
    op: 50
  prompt: An equal-percentage valve has an inherent rangeability of {{rg}}. What fraction of maximum flow does it pass at {{op}} per cent open, if flow goes as R to the power of (opening minus one)?
  parts:
  - ask: Answer
    label: v
    tex: fraction
    value: rg^(op/100 - 1)
    tol: 0.005
    explain: 'An equal-percentage valve passes a small fraction of full flow at half open, which is what compensates a line whose own drop rises with flow: the installed characteristic is the product of the two'
  verify:
    expect:
      v: nsimplify(rg)**(Rational(op, 100) - 1)

- template: fe-mechanism-id
  skill: materials.corrosion
  pace: recall
  cases:
  - q: 'Deep isolated holes in an otherwise sound stainless wall indicate:'
    o1: Pitting, usually initiated by chloride on the passive film
    o2: Uniform attack
    o3: Galvanic attack
    o4: Erosion-corrosion
  - q: 'Attack concentrated under a gasket and nowhere else indicates:'
    o1: Crevice corrosion, where the trapped solution cannot be replenished with oxygen
    o2: Uniform attack
    o3: Stress-corrosion cracking
    o4: Pitting on the open surface
  - q: 'Branching cracks in a stressed component with no general thinning indicate:'
    o1: Stress-corrosion cracking
    o2: Pitting
    o3: Uniform attack
    o4: Erosion
  - q: 'Thinning concentrated just downstream of an elbow indicates:'
    o1: Erosion-corrosion, from high velocity and entrained solids
    o2: Uniform attack
    o3: Crevice corrosion
    o4: Galvanic attack
  - q: 'Attack confined to where two different metals are bolted together indicates:'
    o1: Galvanic corrosion
    o2: Pitting
    o3: Stress-corrosion cracking
    o4: Uniform attack
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Each mechanism leaves its own geometry, which is why a failure is diagnosed from where the metal went rather than from how much
  verify:

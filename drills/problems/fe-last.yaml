- template: fe-washout
  skill: cre.bioprocess
  pace: quick
  given:
    vv:
      pick:
      - 50
      - 200
      - 1000
    qq:
      pick:
      - 5
      - 40
      - 150
    mx:
      pick:
      - 0.25
      - 0.4
      - 0.9
  prompt: A chemostat of volume {{vv}} L runs on a feed of {{qq}} L/h. What is its dilution rate (per hour), and does it exceed a maximum growth rate of {{mx}} per hour? Give the dilution rate.
  parts:
  - ask: Answer
    label: v
    tex: h^{-1}
    value: qq/vv
    tol: 0.005
    explain: 'At steady state the specific growth rate equals the dilution rate, so a dilution rate above the maximum growth rate washes the culture out: the highest usable feed rate sits just below it'
  verify:

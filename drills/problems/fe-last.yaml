- template: fe-kla-needed
  skill: cre.bioprocess
  pace: quick
  given:
    dm:
      pick:
      - 20
      - 90
      - 250
    cs:
      pick:
      - 0.21
      - 0.25
    cl:
      pick:
      - 0.02
      - 0.05
      - 0.1
  require:
  - cl < cs
  prompt: To meet an oxygen demand of {{dm}} mmol/(L h) with a saturation of {{cs}} mmol/L and a dissolved concentration held at {{cl}} mmol/L, what transfer coefficient is needed (per hour)?
  parts:
  - ask: Answer
    label: v
    tex: h^{-1}
    value: dm/(cs - cl)
    tol: 0.005
    explain: 'Because oxygen''s saturation concentration is tiny, the driving force is tiny and the required coefficient is large: oxygen transfer, not kinetics, is usually what limits a fermentation''s scale-up'
  verify:
    expect:
      v: nsimplify(dm)/(nsimplify(cs) - nsimplify(cl))

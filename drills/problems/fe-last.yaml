- template: fe-monod-rate
  skill: cre.bioprocess
  pace: quick
  given:
    mx:
      pick:
      - 0.25
      - 0.4
      - 0.9
    ks:
      pick:
      - 0.1
      - 0.5
      - 2.0
    ss:
      pick:
      - 0.05
      - 1.0
      - 5.0
      - 20
  prompt: With a maximum specific growth rate of {{mx}} per hour and a half-saturation constant of {{ks}} g/L, what specific growth rate does a substrate concentration of {{ss}} g/L give (per hour)?
  parts:
  - ask: Answer
    label: v
    tex: h^{-1}
    value: mx*ss/(ks + ss)
    tol: 0.005
    explain: 'Monod kinetics is Michaelis-Menten for a whole organism: well above the half-saturation constant growth is at its maximum and substrate concentration no longer matters, which is the regime a batch spends most of its time in'
  verify:
    expect:
      v: nsimplify(mx)*nsimplify(ss)/(nsimplify(ks) + nsimplify(ss))
- template: fe-doubling-time
  skill: cre.bioprocess
  pace: quick
  given:

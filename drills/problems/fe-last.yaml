- template: fe-sterilisation-hold
  skill: cre.bioprocess
  pace: quick
  given:
    nl:
      pick:
      - 6
      - 9
      - 12
    dv:
      pick:
      - 0.3
      - 1.1
      - 2.5
  prompt: A sterilisation must achieve {{nl}} log reductions with a decimal reduction time of {{dv}} minutes. What hold time is needed (minutes)?
  parts:
  - ask: Answer
    label: v
    tex: min
    value: nl*dv
    tol: 0.005
    explain: Thermal death is first order in viable count, so each decimal reduction time removes a factor of ten and the hold is simply the product; the basis is the probability of a single survivor in the batch
  verify:
    expect:
      v: nsimplify(nl)*nsimplify(dv)

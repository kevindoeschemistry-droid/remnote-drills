  prompt: A culture of {{xx}} g/L has a specific oxygen uptake of {{qo}} mmol per g per hour in {{vv}} L. What is the oxygen demand (mmol/h)?
  parts:
  - ask: Answer
    label: v
    tex: mmol/h
    value: xx*qo*vv
    tol: 0.005
    explain: 'Demand scales with cell mass, so the oxygen a fermentation needs rises through the batch and peaks late: the transfer system is sized for the peak, not the average'

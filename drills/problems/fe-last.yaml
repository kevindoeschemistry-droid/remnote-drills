    o1: Feedforward on that disturbance, trimmed by feedback
    o2: Feedback alone with a higher gain
    o3: Ratio control
    o4: Manual operation
  - q: 'A slow temperature loop whose valve is upset by changing steam pressure argues for:'
    o1: Cascade, with a fast inner pressure or flow loop inside the temperature loop
    o2: Feedforward on temperature
    o3: A larger valve
    o4: Derivative action
  - q: 'Holding one reagent flow proportional to another is:'
    o1: Ratio control
    o2: Cascade control
    o3: Feedforward control
    o4: Override control
  - q: 'Feedforward alone is risky because:'
    o1: It corrects only for what it measures and models, and never checks the result
    o2: It is slower than feedback
    o3: It needs no model
    o4: It cannot be combined with feedback
  - q: 'Feedback''s inherent limitation is that:'
    o1: It acts only once the output has already moved
    o2: It needs a process model
    o3: It cannot remove offset
    o4: It requires a fast inner loop
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Each strategy answers a different question: when the disturbance is known, when the valve is unreliable, and when two streams must track'
  verify:
    authored: true

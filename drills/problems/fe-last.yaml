- template: fe-corrosion-rate
  skill: materials.corrosion
  pace: quick
  cases:
  - ar: 20
    ml: 45
    dy: 30
    dn: 7.86
  - ar: 50
    ml: 180
    dy: 90
    dn: 7.86
  - ar: 10
    ml: 12
    dy: 60
    dn: 8.9
  - ar: 25
    ml: 300
    dy: 14
    dn: 2.7
  prompt: A coupon of area {{ar}} cm2 loses {{ml}} mg over {{dy}} days. With a density of {{dn}} g/cm3, what is the corrosion rate (mm/year)?
  parts:
  - ask: Answer
    label: v
    tex: mm/year
    value: ml/1000/dn/ar*10*365/dy
    tol: 0.005
    explain: Mass loss becomes a thickness by dividing by density and area, and a rate by dividing by time; a coupon measures the uniform rate only, so pitting has to be looked for separately
  verify:
    expect:
      v: nsimplify(ml)/1000/nsimplify(dn)/nsimplify(ar)*10*365/nsimplify(dy)

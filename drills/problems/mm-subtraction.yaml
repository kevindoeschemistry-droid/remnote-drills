# Subtraction (and addition) without borrowing: the mental strategies Common Core names in 2.NBT.B.5,
# 2.NBT.B.7 and 2.NBT.B.9 ("strategies based on place value, properties of operations, and the
# relationship between addition and subtraction") and that the standard algorithm drills never show.
# One question each; the prompt names the strategy so the habit is what gets practised.

# 541 − 229 = 542 − 230: slide both numbers, the gap stays the same
- template: mm-sub-same-change
  skill: k8.add-sub
  pace: recall
  given: { h1: { int: [4, 9] }, t1: { int: [0, 9] }, o1: { int: [0, 6] }, h2: { int: [1, 3] }, t2: { int: [0, 8] }, o2: { pick: [7, 8, 9] } }
  let: { a: 100*h1 + 10*t1 + o1, b: 100*h2 + 10*t2 + o2, k: 10 - o2 }
  prompt: 'In your head: ${{a}} - {{b}}$. Slide both numbers up by ${{k}}$ so the second one ends in zero.'
  parts:
    - { ask: 'Difference', label: r, tex: 'd', value: a - b, tol: 0.00001, explain: 'Adding ${{k}}$ to both numbers does not change the gap between them: ${{a}} - {{b}} = {{a + k}} - {{b + k}} = {{a - b}}$. No borrowing, because you are now taking away a number that ends in zero' }
  verify: { expect: { r: "solve(Eq(x + (100*h2 + 10*t2 + o2), 100*h1 + 10*t1 + o1), x)[0]" } }

- template: mm-sub-same-change-2digit
  skill: k8.add-sub
  pace: recall
  given: { t1: { int: [4, 9] }, o1: { int: [0, 6] }, t2: { int: [1, 3] }, o2: { pick: [7, 8, 9] } }
  let: { a: 10*t1 + o1, b: 10*t2 + o2, k: 10 - o2 }
  prompt: 'In your head: ${{a}} - {{b}}$. Slide both numbers up by ${{k}}$ first.'
  parts:
    - { ask: 'Difference', label: r, tex: 'd', value: a - b, tol: 0.00001, explain: '${{a}} - {{b}} = {{a + k}} - {{b + k}} = {{a - b}}$. Think of two marks on a number line: move both the same distance and they are still as far apart' }
  verify: { expect: { r: "solve(Eq(x + (10*t2 + o2), 10*t1 + o1), x)[0]" } }

# the same idea as a fill-in: which subtraction is it equal to?
- template: mm-sub-equivalent
  skill: k8.add-sub
  pace: recall
  given: { a: { int: [310, 940] }, bt: { int: [12, 28] }, k: { pick: [1, 2, 3] } }
  let: { b: 10*bt - k }
  prompt: 'Fill the blank so the two subtractions have the same answer: ${{a}} - {{b}} = \;?\; - {{b + k}}$.'
  parts:
    - { ask: 'Missing number', label: r, tex: 'n', value: a + k, tol: 0.00001, explain: 'The second number went up by ${{k}}$, so the first must go up by ${{k}}$ too: ${{a + k}} - {{b + k}}$. Both equal ${{a - b}}$. If only one of them moved, the answer would change' }
  verify: { expect: { r: "solve(Eq(x - (10*bt), a - (10*bt - k)), x)[0]" } }

# take away the round number, then give back what you over-took
- template: mm-sub-round-repay
  skill: k8.add-sub
  pace: recall
  given: { a: { int: [412, 968] }, h: { int: [1, 3] }, k: { pick: [1, 2, 3, 4] } }
  let: { b: 100*h - k }
  prompt: 'In your head: ${{a}} - {{b}}$. Take away ${{100*h}}$, then fix it.'
  parts:
    - { ask: 'Difference', label: r, tex: 'd', value: a - b, tol: 0.00001, explain: '${{a}} - {{100*h}} = {{a - 100*h}}$, but that took away ${{k}}$ too many, so give ${{k}}$ back: ${{a - b}}$. Taking away too much means adding back, never subtracting again' }
  verify: { expect: { r: "solve(Eq(x + 100*h - k, a), x)[0]" } }

# close numbers: count up, the way change is counted
- template: mm-sub-count-up
  skill: k8.add-sub
  pace: recall
  given: { H: { int: [2, 10] }, up: { int: [2, 14] }, dn: { int: [3, 15] } }
  prompt: 'In your head: ${{100*H + up}} - {{100*H - dn}}$. The numbers are close, so count up from the smaller one.'
  parts:
    - { ask: 'Difference', label: r, tex: 'd', value: up + dn, tol: 0.00001, explain: 'From ${{100*H - dn}}$ up to ${{100*H}}$ is ${{dn}}$; from ${{100*H}}$ up to ${{100*H + up}}$ is ${{up}}$. Together ${{up + dn}}$. Subtraction asks how far apart two numbers are, and when they are close it is quicker to walk the gap than to take one away from the other' }
  verify: { expect: { r: "solve(Eq(100*H - dn + x, 100*H + up), x)[0]" } }

- template: mm-sub-count-up-change
  skill: k8.add-sub
  pace: recall
  given: { T: { pick: [100, 200, 500, 1000] }, b: { int: [37, 96] } }
  require: ["mod(b, 10) != 0"]
  prompt: 'In your head: ${{T}} - {{b}}$. Count up from ${{b}}$: first to the next ten, then to ${{T}}$.'
  parts:
    - { ask: 'Difference', label: r, tex: 'd', value: T - b, tol: 0.00001, explain: 'From ${{b}}$ to ${{ceil(b/10)*10}}$ is ${{ceil(b/10)*10 - b}}$, and from ${{ceil(b/10)*10}}$ to ${{T}}$ is ${{T - ceil(b/10)*10}}$: ${{T - b}}$ in all. This is how change is counted back, and it avoids borrowing across zeros' }
  verify: { expect: { r: "solve(Eq(b + x, T), x)[0]" } }

# the addition twin: move a little from one number to the other
- template: mm-add-compensate
  skill: k8.add-sub
  pace: recall
  given: { h1: { int: [1, 5] }, k: { pick: [1, 2, 3] }, b: { int: [114, 389] } }
  let: { a: 100*h1 - k }
  prompt: 'In your head: ${{a}} + {{b}}$. Move ${{k}}$ from the second number to the first.'
  parts:
    - { ask: 'Sum', label: r, tex: 's', value: a + b, tol: 0.00001, explain: '${{a}} + {{b}} = {{a + k}} + {{b - k}} = {{a + b}}$. In addition one number goes up and the other comes down, so the total stays put; in subtraction both move the same way, so the gap stays put' }
  verify: { expect: { r: "solve(Eq(x - b, 100*h1 - k), x)[0]" } }

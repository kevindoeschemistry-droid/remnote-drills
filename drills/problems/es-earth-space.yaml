- template: es-doubling
  skill: earth.resources
  pace: quick
  cases:
  - r: 0.01
    pct: 1.0
    ans: 69.66071689357
  - r: 0.02
    pct: 2.0
    ans: 35.00278878115
  - r: 0.035
    pct: 3.5
    ans: 20.148791684
  - r: 0.07
    pct: 7.0
    ans: 10.24476835106
  - r: 0.005
    pct: 0.5
    ans: 138.9757216107
  prompt: A population or a resource demand grows {{pct}}% a year. How many years does it take to double?
  parts:
  - ask: Years
    label: y
    value: ans
    tol: 0.0002
    explain: '(1 + r)ᵗ = 2, so t = ln 2 / ln(1 + r) ≈ 70/(percent growth): the rule of 70. Steady growth means each doubling consumes as much as all the history before it'
  verify:
    expect:
      y: doubling_time(r)

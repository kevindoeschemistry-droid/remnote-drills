- template: es-fusion-energy
  skill: space.stars
  pace: quick
  cases:
  - proc: 4 ¹H → ⁴He (pp chain, atomic masses)
    n: 4
    mi: 1.00782503207
    mo: 4.00260325413
    ans: 26.73096902861
  - proc: 3 ⁴He → ¹²C (triple-alpha)
    n: 3
    mi: 4.00260325413
    mo: 12.0
    ans: 7.274747607586
  - proc: 2 ¹²C → ²⁴Mg
    n: 2
    mi: 12.0
    mo: 23.985041697
    ans: 13.93357102671
  prompt: 'How much energy (MeV) is released in {{proc}}? Atomic masses (u): reactant {{mi}}, product {{mo}}; 1 u = 931.494 MeV/c².'
  parts:
  - ask: Q (MeV)
    label: y
    value: ans
    tol: 0.001
    explain: Q = (mass in − mass out) c². Fusion releases energy up to iron-56, where binding energy per nucleon peaks; heavier elements need neutron capture (s- and r-process) in AGB stars, supernovae
      and neutron-star mergers
  verify:
    expect:
      y: fusion_energy(n, mi, mo)
- template: es-element-origin
  skill: space.cosmology
  pace: recall
  cases:
  - k: most helium-4
    tb: origin
    ans: 0
  - k: deuterium
    tb: origin
    ans: 0
  - k: carbon and oxygen
    tb: origin
    ans: 1
  - k: iron and nickel
    tb: origin
    ans: 1
  - k: gold and uranium
    tb: origin
    ans: 2
  - k: barium and lead (s-process)
    tb: origin
    ans: 2
  - k: lithium-6, beryllium and boron
    tb: origin
    ans: 3
  prompt: Where were {{k}} made?
  parts:
  - ask: Answer
    label: y
    choice:
    - Big Bang nucleosynthesis
    - fusion in stellar cores
    - neutron capture in AGB stars, supernovae and mergers
    - cosmic-ray spallation
    correct: ans
    explain: 'Big Bang: H, He, a little Li. Stars fuse up to Fe. Beyond iron, neutron capture: slow (s) in AGB stars, rapid (r) in supernovae and neutron-star mergers. Li, Be and B are mostly from cosmic
      rays splitting heavier nuclei'
  verify:
    choices:
      y: es_fact(tb, k)

    tb: dating
    ans: 0
  - k: the age of a meteorite
    tb: dating
    ans: 2
  prompt: Which dating method fits {{k}}?
  parts:
  - ask: Answer
    label: y
    choice:
    - radiocarbon (¹⁴C)
    - potassium–argon or argon–argon
    - uranium–lead
    correct: ans
    explain: 'Pick a clock whose half-life suits the age: ¹⁴C (5730 y) for organic material to ~50 000 years; K–Ar (1.25 Gy) for volcanic rocks; U–Pb (0.7 and 4.5 Gy) in zircons and meteorites for the oldest
      ages'
  verify:
    choices:
      y: es_fact(tb, k)
- template: es-radiometric
  skill: earth.history
  pace: quick
  cases:
  - iso: ⁴⁰K → ⁴⁰Ar (t½ = 1.25 Gy)
    th: 1250000000.0
    ratio: 0.1
    ans: 171879404.6874
  - iso: ²³⁸U → ²⁰⁶Pb (t½ = 4.468 Gy)
    th: 4468000000.0
    ratio: 0.8
    ans: 3788850178.488
  - iso: ⁸⁷Rb → ⁸⁷Sr (t½ = 48.8 Gy)
    th: 48800000000.0
    ratio: 0.065
    ans: 4433647406.014
  - iso: ¹⁴C → ¹⁴N (t½ = 5730 y)
    th: 5730
    ratio: 3.0
    ans: 11460.0
  - iso: ²³⁵U → ²⁰⁷Pb (t½ = 0.704 Gy)
    th: 704000000.0
    ratio: 1.0
    ans: 704000000.0
  prompt: A mineral holds radiogenic daughter and parent in the ratio D/P = {{ratio}} for {{iso}}, with no daughter at the start. How old is it (years)?
  parts:
  - ask: Age (y)
    label: y
    value: ans
    tol: 0.0005
    explain: N = N₀e^(−λt) and D = N₀ − N, so $t = \dfrac{t_{1/2}}{\ln 2}\ln(1 + D/P)$. D/P = 1 means one half-life; D/P = 3 two half-lives
  verify:
    expect:
      y: decay_age(th, ratio)
- template: es-equilibrium-temp
  skill: earth.climate
  pace: quick
  cases:
  - planet: Earth
    S: 1361
    alb: 0.3
    ans: 254.5781401145
  - planet: Venus
    S: 2601
    alb: 0.76
    ans: 229.0445521461
  - planet: Mars
    S: 586
    alb: 0.25
    ans: 209.8078763241
  - planet: Earth with albedo 0.35
    S: 1361
    alb: 0.35
    ans: 249.9049960094
  - planet: the Moon
    S: 1361
    alb: 0.11
    ans: 270.3299107153
  prompt: 'What is the radiative-equilibrium temperature (K) of {{planet}}: solar constant {{S}} W/m², albedo {{alb}}, no greenhouse effect?'
  parts:
  - ask: T_e (K)
    label: y
    value: ans
    tol: 0.0002
    explain: Absorbed S(1 − α)πR² equals emitted 4πR²σT⁴, so $T_e = [S(1-\alpha)/4\sigma]^{1/4}$. Earth's 255 K against an actual 288 K is the 33 K greenhouse effect; Venus's 230 K against 735 K is a runaway
      one
  verify:
    expect:
      y: eq_temp(S, alb)
- template: es-one-layer
  skill: earth.climate
  pace: quick
  cases:
  - planet: Earth
    S: 1361
    alb: 0.3
    ans: 302.7461355483
  - planet: Mars
    S: 586
    alb: 0.25
    ans: 249.5050193083
  - planet: Earth with albedo 0.35
    S: 1361
    alb: 0.35
    ans: 297.1887993291
  prompt: Model {{planet}} (S = {{S}} W/m², albedo {{alb}}) with one atmospheric layer that absorbs all infrared and is transparent to sunlight. What is the surface temperature (K)?
  parts:
  - ask: T_s (K)
    label: y
    value: ans
    tol: 0.0002
    explain: The layer radiates σT_a⁴ both up and down; balancing the top gives T_a = T_e, balancing the layer gives σT_s⁴ = 2σT_a⁴, so $T_s = 2^{1/4}T_e$. Too warm for Earth (303 K), because the real atmosphere
      absorbs only part of the infrared
  verify:
    expect:
      y: one_layer(S, alb)
- template: es-co2-forcing
  skill: earth.climate
  pace: quick
  cases:
  - C1: 560
    C0: 280
    lam: 0.8
    ans: 2.966669932797
  - C1: 420
    C0: 280
    lam: 0.8
    ans: 1.735390662703
  - C1: 420
    C0: 280
    lam: 0.5
    ans: 1.084619164189
  - C1: 800
    C0: 280
    lam: 0.8
    ans: 4.493238692854
  - C1: 350
    C0: 280
    lam: 1.0
    ans: 1.193817999531
  prompt: With radiative forcing ΔF = 5.35 ln(C/C₀) W/m² and climate sensitivity λ = {{lam}} K per W/m², how much warming (K) does CO₂ at {{C1}} ppm give relative to {{C0}} ppm, at equilibrium?
  parts:
  - ask: ΔT (K)
    label: y
    value: ans
    tol: 0.0002
    explain: Forcing grows with the logarithm of concentration, so each doubling adds the same 3.7 W/m². ΔT = λΔF; λ ≈ 0.8 gives about 3 K per doubling, the middle of the IPCC range
  verify:
    expect:
      y: co2_warming(C1, C0, lam)

- template: es-kepler
  skill: space.orbits
  pace: quick
  cases:
  - body: Earth around the Sun
    M: 1.989e+30
    a: 149600000000.0
    unit: days
    div: 86400
    ans: 365.2105063381
  - body: Mars around the Sun
    M: 1.989e+30
    a: 227900000000.0
    unit: days
    div: 86400
    ans: 686.6925888108
  - body: the Moon around Earth
    M: 5.972e+24
    a: 384400000.0
    unit: days
    div: 86400
    ans: 27.45228083334
  - body: a satellite at 7000 km from Earth's centre
    M: 5.972e+24
    a: 7000000.0
    unit: minutes
    div: 60
    ans: 97.14331433371
  - body: Jupiter around the Sun
    M: 1.989e+30
    a: 778500000000.0
    unit: years
    div: 31557600.0
    ans: 11.86980469713
  prompt: 'Find the orbital period of {{body}}: central mass {{M}} kg, orbit radius {{a}} m (circular), G = 6.674×10⁻¹¹. Answer in {{unit}}.'
  parts:
  - ask: T
    label: y
    value: ans
    tol: 0.0002
    explain: 'Kepler''s third law from gravity: $T = 2\pi\sqrt{a^3/GM}$. The orbiting mass drops out, so a satellite and the Moon at the same radius would share a period'
  verify:
    expect:
      y: orbit_period(M, a)/nsimplify(div)
- template: es-escape
  skill: space.orbits
  pace: quick
  cases:
  - body: Earth
    M: 5.972e+24
    r: 6371000.0
    ans: 11.18597789185
  - body: the Moon
    M: 7.342e+22
    r: 1737000.0
    ans: 2.375336490419
  - body: Mars
    M: 6.417e+23
    r: 3390000.0
    ans: 5.026712308972
  - body: Jupiter
    M: 1.898e+27
    r: 69910000.0
    ans: 60.19997524106
  prompt: What is the escape speed from the surface of {{body}} (M = {{M}} kg, R = {{r}} m), in km/s?
  parts:
  - ask: v (km/s)
    label: y
    value: ans
    tol: 0.0002
    explain: 'Kinetic energy must cover the gravitational well: ½v² = GM/R, so $v = \sqrt{2GM/R}$, √2 times the speed of a circular orbit at the surface'
  verify:
    expect:
      y: escape_speed(M, r)/1000
- template: es-wien
  skill: space.stars
  pace: quick
  cases:
  - star: the Sun
    T: 5772
    ans: 502.0394932753
  - star: Betelgeuse
    T: 3600
    ans: 804.9366542181
  - star: Sirius A
    T: 9940
    ans: 291.5263536404
  - star: Rigel
    T: 12100
    ans: 239.4852855525
  - star: a red dwarf
    T: 3000
    ans: 965.9239850617
  prompt: '{{star}} has a surface temperature of about {{T}} K. At what wavelength (nm) does its spectrum peak?'
  parts:
  - ask: λ_max (nm)
    label: y
    value: ans
    tol: 0.0002
    explain: 'Wien''s law: $\lambda_{\max} = b/T$ with $b = 2.898\times10^{-3}$ m·K. Hot stars peak in the blue or UV, cool ones in the red or IR, which is how colour gives temperature'
  verify:
    expect:
      y: wien_peak(T)
- template: es-luminosity
  skill: space.stars
  pace: quick
  cases:
  - star: the Sun
    Rs: 695700000.0
    T: 5772
    ans: 0.9999976236356
  - star: Sirius A
    Rs: 1190000000.0
    T: 9940
    ans: 25.73292367864
  - star: a red dwarf
    Rs: 210000000.0
    T: 3000
    ans: 0.006649259460986
  - star: a white dwarf
    Rs: 5800000.0
    T: 25000
    ans: 0.02446052045142
  prompt: Find the luminosity of {{star}} (radius {{Rs}} m, T = {{T}} K) in units of the Sun's, L☉ = 3.828×10²⁶ W.
  parts:
  - ask: L/L☉
    label: y
    value: ans
    tol: 0.0002
    explain: 'Stefan–Boltzmann over the whole surface: $L = 4\pi R^2\sigma T^4$. Temperature enters to the fourth power, so a small hot star can outshine a big cool one'
  verify:
    expect:
      y: luminosity(Rs, T)/nsimplify('3.828e26')

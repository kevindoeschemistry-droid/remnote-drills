    ans: 5.656854249492
  - M: 20
    ans: 0.0005590169943749
  prompt: If luminosity scales as M³·⁵, how long does a {{M}} M☉ star live on the main sequence, relative to the Sun?
  parts:
  - ask: t/t☉
    label: y
    value: ans
    tol: 0.0002
    explain: Lifetime ∝ fuel ÷ burn rate ∝ M/L ∝ M/M³·⁵ = M⁻²·⁵. Massive stars live millions of years, not billions; red dwarfs outlast the present age of the universe
  verify:
    expect:
      y: star_life(M)

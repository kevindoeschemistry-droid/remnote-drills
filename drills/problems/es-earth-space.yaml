    tb: boundary
    ans: 1
  - k: the San Andreas Fault
    tb: boundary
    ans: 2
  - k: Iceland
    tb: boundary
    ans: 0
  prompt: What kind of plate boundary is {{k}}?
  parts:
  - ask: Answer
    label: y
    choice:
    - divergent
    - convergent
    - transform
    correct: ans
    explain: 'Divergent: plates part, new crust (ridges, rifts). Convergent: subduction (trenches, volcanic arcs) or collision (mountain belts). Transform: plates slide past (strike-slip faults, earthquakes
      but little volcanism)'
  verify:
    choices:
      y: es_fact(tb, k)
- template: es-feedback
  skill: earth.climate
  pace: recall
  cases:
  - k: melting sea ice lowers albedo
    tb: feedback
    ans: 0
  - k: warmer air holds more water vapour
    tb: feedback
    ans: 0
  - k: a warmer surface radiates more (Planck response)
    tb: feedback
    ans: 1
  - k: thawing permafrost releases CH₄ and CO₂
    tb: feedback
    ans: 0
  - k: faster rock weathering draws down CO₂ over ~100 kyr
    tb: feedback
    ans: 1
  prompt: 'Feedback: {{k}}. Does it amplify or damp warming?'
  parts:
  - ask: Answer
    label: y
    choice:
    - amplifies warming (positive)
    - damps warming (negative)
    correct: ans
    explain: A positive feedback loops the change back on itself (ice-albedo, water vapour, permafrost carbon); a negative one opposes it (more radiation from a warmer surface; slow silicate weathering,
      the long-term thermostat)
  verify:
    choices:
      y: es_fact(tb, k)
- template: es-seismic
  skill: earth.interior
  pace: recall
  cases:
  - k: through the liquid outer core
    tb: seismic
    ans: 0
  - k: through the mantle
    tb: seismic
    ans: 1
  - k: through the solid inner core (as P)
    tb: seismic
    ans: 0
  prompt: Which body waves travel {{k}}?
  parts:
  - ask: Answer
    label: y
    choice:
    - P waves only
    - both P and S waves
    - neither
    correct: ans
    explain: S waves are shear waves and cannot cross a liquid, so the outer core casts an S-wave shadow beyond 104°; P waves bend in it and leave a shadow from 104° to 140°. This is how the core was found
      to be liquid
  verify:
    choices:
      y: es_fact(tb, k)

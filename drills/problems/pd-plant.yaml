  prompt: To hold {{md}} kg/h of dust below {{tc}} g/m3, what air flow is needed (m3/h)?
  parts:
  - ask: Answer
    label: v
    tex: m^3/h
    value: md*1000/tc
    tol: 0.005
    explain: 'The reverse: dilution is sized from the target concentration, and a target well under the explosible limit is what gives the design its margin'
  verify:

- template: pd-bond-energy
  skill: design.solids
  pace: quick
  cases:
  - f80: 10000
    p80: 100
    wi: 13.2
  - f80: 2500
    p80: 75
    wi: 9.4
  - f80: 50000
    p80: 300
    wi: 16.1
  - f80: 1200
    p80: 45
    wi: 11.5
  prompt: A mill takes feed from {{f80}} micrometres to a product of {{p80}} micrometres, eighty per cent passing. With a Bond work index of {{wi}} kWh/ton, what is the energy per ton (kWh), using E = 10*Wi*(1/sqrt(p80) - 1/sqrt(f80))?
  parts:
  - ask: Answer
    label: v
    tex: kWh/ton
    value: 10*wi*(1/sqrt(p80) - 1/sqrt(f80))
    tol: 0.005
    explain: 'Grinding energy rises steeply as the product gets finer, because the term in the product size dominates once it is much smaller than the feed: the last halving costs more than all the earlier ones'
  verify:
    expect:
      v: 10*nsimplify(wi)*(1/sqrt(nsimplify(p80)) - 1/sqrt(nsimplify(f80)))
- template: pd-grind-finer
  skill: design.solids
  pace: quick
  given:
    p1:
      pick:
      - 100
      - 150
      - 300
    p2:
      pick:
      - 25
      - 50
      - 75
  require:
  - p2 < p1
  prompt: Holding the feed size, by what factor does Bond energy rise when the product passes from {{p1}} to {{p2}} micrometres, if the feed term is negligible?
  parts:
  - ask: Answer
    label: v
    tex: \times
    value: sqrt(p1/p2)
    tol: 0.005
    explain: 'Energy goes as the reciprocal square root of product size, so halving the product costs about 1.41 times the energy and quartering it twice that: the scaling is the reason fine grinding dominates a plant''s power bill'
  verify:
    expect:
      v: sqrt(Rational(p1, p2))
- template: pd-which-law
  skill: design.solids
  pace: recall
  cases:

- template: pd-expected-value
  skill: design.uncertainty
  pace: quick
  cases:
  - v1: 500000
    p1: 0.3
    v2: -100000
  - v1: 2000000
    p1: 0.15
    v2: -250000
  - v1: 80000
    p1: 0.6
    v2: -20000
  - v1: 1200000
    p1: 0.45
    v2: -400000
  prompt: An option yields {{v1}} dollars with probability {{p1}} and {{v2}} dollars otherwise. What is its expected value (dollars)?
  parts:
  - ask: Answer
    label: v
    tex: dollars
    value: p1*v1 + (1 - p1)*v2
    tol: 0.005
    explain: The expected value ranks repeated decisions and says nothing about spread, so an option with a positive expectation and a branch the firm could not survive is still not taken
  verify:
    expect:
      v: nsimplify(p1)*nsimplify(v1) + (1 - nsimplify(p1))*nsimplify(v2)
- template: pd-breakeven-probability
  skill: design.uncertainty
  pace: quick
  cases:
  - v1: 500000
    v2: -100000
  - v1: 2000000
    v2: -250000
  - v1: 80000
    v2: -20000
  - v1: 1200000
    v2: -400000
  prompt: What success probability makes an option with payoffs {{v1}} and {{v2}} dollars break even?
  parts:
  - ask: Answer
    label: v
    tex: p
    value: -v2/(v1 - v2)
    tol: 0.005
    explain: Inverting the expected value gives the probability the decision rests on, which is usually easier to argue about than the expectation itself
  verify:
    expect:
      v: -nsimplify(v2)/(nsimplify(v1) - nsimplify(v2))
- template: pd-sensitivity
  skill: design.uncertainty
  pace: quick
  cases:
  - n1: 4000000
    pr: 900
    dp: 10
    rv: 30000000
  - n1: 1200000
    pr: 450
    dp: 15
    rv: 9000000
  - n1: 25000000
    pr: 2200
    dp: 5
    rv: 140000000
  - n1: 600000
    pr: 300
    dp: 20
    rv: 5000000
  prompt: A project's net present value is {{n1}} dollars at a product price of {{pr}} dollars per ton. A {{dp}} per cent price fall cuts revenue, whose present value is {{rv}} dollars. What net present value results (dollars)?
  parts:
  - ask: Answer
    label: v
    tex: dollars
    value: n1 - rv*dp/100
    tol: 0.005
    explain: A sensitivity run varies one input at a time; because revenue is usually the largest present value in the sum, a few per cent off the price moves the answer further than a large capital overrun
  verify:
    expect:
      v: nsimplify(n1) - nsimplify(rv)*Rational(dp, 100)
- template: pd-sensitivity-breakeven
  skill: design.uncertainty
  pace: quick
  cases:
  - n1: 4000000
    rv: 30000000
  - n1: 1200000
    rv: 9000000
  - n1: 25000000
    rv: 140000000
  - n1: 600000
    rv: 5000000
  prompt: By what percentage can the price fall before a net present value of {{n1}} dollars reaches zero, if revenue's present value is {{rv}} dollars?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*n1/rv
    tol: 0.005
    explain: The breakeven swing is the margin the project has in its most important assumption, and it is the number a board asks for
  verify:
    expect:
      v: 100*Rational(n1, rv)

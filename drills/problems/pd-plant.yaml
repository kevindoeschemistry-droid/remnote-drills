    rt:
      pick:
      - 8000
      - 25000
      - 60000
    nx:
      pick:
      - 1
      - 3
      - 7
  prompt: A contract's scope covers {{ns}} deliverables at {{rt}} dollars each. The client requests {{nx}} more of the same kind. What is the change order worth (dollars)?
  parts:
  - ask: Answer
    label: v
    tex: dollars
    value: nx*rt
    final: true
    tol: 0.0001
    explain: A signed scope is what makes extra work a change order rather than an argument, which is why the scope clause carries more engineering risk than the fee does

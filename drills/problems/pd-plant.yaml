    o1: Rittinger's law
    o2: Kick's law
    o3: Bond's law
    o4: None of them
  - q: Which law suits coarse crushing, where energy follows the size ratio?
    o1: Kick's law
    o2: Rittinger's law
    o3: Bond's law
    o4: Stokes' law
  - q: Which law is used for mill duties in the intermediate range?
    o1: Bond's law, through a measured work index
    o2: Rittinger's law
    o3: Kick's law
    o4: The six-tenths rule
  - q: 'The Bond work index is the energy needed to take a very large feed to:'
    o1: Eighty per cent passing 100 micrometres
    o2: Fifty per cent passing 1 millimetre
    o3: Complete dissolution
    o4: Its Sauter mean
  - q: 'A material with a high work index is:'
    o1: Hard to grind, so it needs more energy per ton for the same size change
    o2: Easy to grind
    o3: Low in density
    o4: Fine in its feed
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Three laws for three ranges, and the work index is a measured material property that makes mills comparable
  verify:
    authored: true
- template: pd-crystal-yield
  skill: design.solids
  pace: quick
  cases:
  - m0: 1000
    t1: 80
    s1: 55
    s2: 20
  - m0: 500
    t1: 60
    s1: 40
    s2: 15
  - m0: 2000
    t1: 90
    s1: 70
    s2: 25
  - m0: 750
    t1: 50
    s1: 32
    s2: 12
  prompt: '{{m0}} kg of solution saturated at {{t1}} degrees Celsius, holding {{s1}} kg solute per 100 kg water, is cooled to where solubility is {{s2}} kg per 100 kg water. With no evaporation, what mass of anhydrous crystals forms (kg)?'
  parts:
  - ask: Answer
    label: v
    tex: kg
    value: m0*100/(100 + s1)*(s1 - s2)/100
    tol: 0.005
    explain: The water is conserved, so the yield is the water mass times the drop in solubility; working in kilograms of water rather than of solution is what keeps the balance straight
  verify:
    expect:
      v: nsimplify(m0)*100/(100 + nsimplify(s1))*(nsimplify(s1) - nsimplify(s2))/100
- template: pd-crystal-evap
  skill: design.solids
  pace: quick
  cases:
  - ev: 5
    s1: 55
    s2: 20
  - ev: 10
    s1: 40
    s2: 15
  - ev: 2
    s1: 70
    s2: 25
  - ev: 15
    s1: 32
    s2: 12
  prompt: The same cooling also evaporates {{ev}} per cent of the water. By what factor does that raise the yield over the no-evaporation case, if the final solubility is {{s2}} kg per 100 kg water and the initial is {{s1}}?
  parts:
  - ask: Answer
    label: v
    tex: \times
    value: (s1 - s2*(1 - ev/100))/(s1 - s2)
    tol: 0.005
    explain: Evaporating water removes the solvent that was still holding solute, so a little evaporation buys a lot of yield when the final solubility is high
  verify:
    expect:
      v: (nsimplify(s1) - nsimplify(s2)*(1 - nsimplify(ev)/100))/(nsimplify(s1) - nsimplify(s2))
- template: pd-supersaturation
  skill: design.solids
  pace: recall
  cases:
  - q: 'Raising supersaturation in a crystallizer tends to give:'
    o1: Many small crystals, because nucleation rises faster with it than growth does
    o2: Fewer large crystals
    o3: No change in size
    o4: A lower yield
  - q: 'To grow large crystals a crystallizer is run:'
    o1: At a low, steady supersaturation, with seed present
    o2: At the highest supersaturation attainable
    o3: With rapid quenching
    o4: Without seeding
  - q: 'The metastable zone is the region where:'
    o1: The solution is supersaturated but has not yet nucleated, which is where seeded growth is done
    o2: The solution is unsaturated
    o3: Crystals dissolve
    o4: Nucleation is fastest
  - q: 'Crystal size in a given system is:'
    o1: A control decision, set by the supersaturation profile
    o2: A fixed material property
    o3: Set by the solubility alone
    o4: Set by the vessel size
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Nucleation and growth compete for the same driving force, and which one wins decides the product size
  verify:
    authored: true
- template: pd-conveyor-capacity
  skill: design.solids
  pace: quick
  given:
    ar:
      pick:
      - 0.02
      - 0.05
      - 0.12
    vb:
      pick:
      - 0.5
      - 1.5
      - 2.5
    rb:
      pick:
      - 600
      - 1450
      - 2100
  prompt: A belt carries a cross-section of {{ar}} square metres at {{vb}} m/s of material of bulk density {{rb}} kg/m3. What is the capacity (tonnes per hour)?
  parts:
  - ask: Answer
    label: v
    tex: t/h
    value: ar*vb*rb*3600/1000
    tol: 0.005
    explain: 'A conveyor is set volumetrically, so the mass rate follows bulk density: the same setting on a lighter powder delivers proportionally fewer tonnes'
  verify:
    expect:
      v: nsimplify(ar)*nsimplify(vb)*nsimplify(rb)*Rational(36, 10)
- template: pd-conveyor-density-change
  skill: design.solids
  pace: quick

- template: pd-calibration-offset
  skill: design.uncertainty
  pace: quick
  cases:
  - xb: 10.42
    st: 10.0
  - xb: 49.1
    st: 50.0
  - xb: 2.31
    st: 2.25
  - xb: 305
    st: 300
  prompt: Five readings average {{xb}} against a standard of {{st}}. What is the systematic offset, and what percentage of the standard is it?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(xb - st)/st
    tol: 0.005
    explain: 'A systematic offset is found only by comparison with a standard, and averaging more readings never removes it: it is the part of the error that repeating cannot help'
  verify:
    expect:
      v: 100*(nsimplify(xb) - nsimplify(st))/nsimplify(st)
- template: pd-payback-vs-npv
  skill: design.uncertainty
  pace: quick
  given:
    k0:
      pick:
      - 500000
      - 2000000
      - 9000000
    cf:
      pick:
      - 120000
      - 450000
      - 1800000
    ny:
      pick:
      - 8
      - 12
      - 20
  prompt: A project costs {{k0}} dollars and returns {{cf}} dollars a year for {{ny}} years. What is its simple payback period (years), and how much of the life does it ignore?
  parts:
  - ask: Answer
    label: v
    tex: years
    value: k0/cf
    tol: 0.005
    explain: Payback ignores every cash flow after the date it reports and discounts nothing, so it ranks a short cheap project above a long valuable one; it is a liquidity screen, not a value measure
  verify:
    expect:
      v: Rational(k0, cf)
- template: pd-run-probability
  skill: design.spc
  pace: quick
  given:
    nr:
      pick:
      - 6
      - 7
      - 8
      - 9
  prompt: On a centred, in-control process, what is the probability that {{nr}} consecutive points all fall on the same side of the centre line (either side)?
  parts:
  - ask: Answer
    label: v
    tex: probability
    value: 2/2^nr
    tol: 0.005
    explain: The run rules are set where the chance under a stable process becomes comparable to a three-sigma point, which is why eight in a row is treated as a signal rather than a coincidence
  verify:
    expect:
      v: 2*Rational(1, 2)**nr

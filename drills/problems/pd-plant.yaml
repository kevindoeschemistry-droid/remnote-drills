  - q: 'Accuracy is improved by:'
    o1: Calibrating against a traceable standard
    o2: Repeating the measurement
    o3: Reporting more digits
    o4: Averaging
  - q: 'A systematic error:'
    o1: Shifts every reading the same way, so averaging does not remove it
    o2: Averages out with enough readings

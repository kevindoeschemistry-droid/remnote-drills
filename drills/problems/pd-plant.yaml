- template: pd-patent-expiry
  skill: design.practice
  pace: quick
  given:
    yf:
      pick:
      - 2015
      - 2019
      - 2024
    yg:
      pick:
      - 2018
      - 2022
      - 2027
  require:
  - yg > yf
  prompt: A utility patent is filed in {{yf}} and granted in {{yg}}. In what year does its twenty-year term end?
  parts:
  - ask: Answer
    label: v
    tex: year
    value: yf + 20
    final: true
    tol: 0.0001
    explain: 'The term runs from filing, not from grant, so a long examination eats into the exclusivity rather than extending it: that is the structural reason to file early and prosecute fast'

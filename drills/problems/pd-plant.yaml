- template: pd-six-tenths
  skill: design.plant
  pace: quick
  given:
    c1:
      pick:
      - 100
      - 500
      - 2000
    k1:
      pick:
      - 80000
      - 250000
      - 1200000
    c2:
      pick:
      - 250
      - 1000
      - 5000
    ex:
      pick:
      - 0.6
      - 0.65
      - 0.7
  require:
  - c2 != c1
  prompt: Equipment of capacity {{c1}} cost {{k1}} dollars. What does capacity {{c2}} cost, with an exponent of {{ex}}?
  parts:
  - ask: Answer
    label: v
    tex: dollars
    value: k1*(c2/c1)^ex

  - q: 'A p-value is:'
    o1: How probable data this extreme would be if the claim were true
    o2: The probability the claim is true
    o3: The probability of an error
    o4: The effect size
  - q: 'Raising the sample size:'
    o1: Narrows the standard error, so smaller real differences become detectable
    o2: Changes the true difference
    o3: Raises the significance level
    o4: Removes systematic error
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: A test answers whether the data could have arisen by chance, never whether the difference is worth acting on
  verify:
    authored: true
- template: pd-regress-slope
  skill: design.spc
  pace: quick
  cases:
  - sx: 20
    sy: 48
    sxy: 290
    sxx: 120
  - sx: 10
    sy: 26
    sxy: 85
    sxx: 30
  - sx: 40
    sy: 100
    sxy: 1120
    sxx: 440
  - sx: 8
    sy: 14
    sxy: 36
    sxx: 24
  prompt: 'Four points give sums: n = 4, sum x = {{sx}}, sum y = {{sy}}, sum xy = {{sxy}}, sum x squared = {{sxx}}. What is the least-squares slope?'
  parts:
  - ask: Answer
    label: v
    tex: m
    value: (4*sxy - sx*sy)/(4*sxx - sx^2)
    tol: 0.005
    explain: The slope is the covariance over the predictor's variance; a fitted line says nothing about whether the relationship is causal or whether a straight line was the right shape
  verify:
    expect:
      v: Rational(4*sxy - sx*sy, 4*sxx - sx**2)
- template: pd-r-squared-meaning
  skill: design.spc
  pace: quick
  given:
    r2:
      pick:
      - 0.62
      - 0.88
      - 0.95
      - 0.4
  prompt: A fit has a coefficient of determination of {{r2}}. What percentage of the variation in the response does the line leave unaccounted for?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(1 - r2)
    tol: 0.005
    explain: The residual fraction is where the physics the model left out lives, and a high coefficient on a short range of the predictor often collapses as soon as the range is extended
  verify:
    expect:
      v: 100*(1 - nsimplify(r2))
- template: pd-discrete-expectation
  skill: design.spc
  pace: quick
  cases:
  - p1: 0.02
    c1: 5000
    p2: 0.1
    c2: 400
  - p1: 0.005
    c1: 120000
    p2: 0.05
    c2: 2500
  - p1: 0.08
    c1: 900
    p2: 0.2
    c2: 150
  - p1: 0.01
    c1: 30000
    p2: 0.15
    c2: 800
  prompt: A unit fails with probability {{p1}} costing {{c1}} dollars, needs rework with probability {{p2}} costing {{c2}}, and is otherwise fine. What is the expected cost per unit (dollars)?
  parts:
  - ask: Answer
    label: v
    tex: dollars
    value: p1*c1 + p2*c2
    tol: 0.005
    explain: The probability-weighted sum is the right basis for a cost repeated over many units, and it is what an inspection or a redesign has to beat to pay for itself
  verify:
    expect:
      v: nsimplify(p1)*nsimplify(c1) + nsimplify(p2)*nsimplify(c2)
- template: pd-inspection-worth
  skill: design.spc
  pace: quick
  cases:
  - p1: 0.02
    c1: 5000
  - p1: 0.005
    c1: 120000
  - p1: 0.08
    c1: 900
  - p1: 0.01
    c1: 30000
  prompt: Inspection would catch the failure mode costing {{c1}} dollars at probability {{p1}}. What is the most it is worth paying per unit (dollars)?
  parts:
  - ask: Answer
    label: v
    tex: dollars
    value: p1*c1
    tol: 0.005
    explain: 'A perfect inspection is worth the expected loss it removes, so the ceiling on its cost follows from the probability and the consequence together: a rare but ruinous mode justifies far more than a common cheap one'
  verify:
    expect:
      v: nsimplify(p1)*nsimplify(c1)
- template: pd-control-limits
  skill: design.spc
  pace: quick
  given:
    sg:
      pick:
      - 0.4
      - 1.2
      - 5.0
    ng:
      pick:
      - 4
      - 5
      - 9
    cl:
      pick:
      - 10
      - 50
      - 250
  prompt: A process has a standard deviation of {{sg}} and is charted in subgroups of {{ng}} about a centre line of {{cl}}. What is the upper control limit?
  parts:
  - ask: Answer
    label: v
    tex: UCL
    value: cl + 3*sg/sqrt(ng)
    tol: 0.005
    explain: Control limits are three standard errors from the centre line, so they narrow with the square root of subgroup size; they are not the specification limits, and a process can sit inside them and still make scrap
  verify:
    expect:
      v: nsimplify(cl) + 3*nsimplify(sg)/sqrt(ng)
- template: pd-subgroup-effect
  skill: design.spc
  pace: quick
  given:
    n1:
      pick:
      - 2
      - 4
      - 5
    n2:
      pick:
      - 9
      - 16
      - 25
  require:
  - n2 > n1
  prompt: By what factor do an X-bar chart's control limits narrow when the subgroup size goes from {{n1}} to {{n2}}?
  parts:
  - ask: Answer
    label: v
    tex: \times
    value: sqrt(n2/n1)
    tol: 0.005
    explain: Larger subgroups make the chart more sensitive to a shift in the mean, which is why subgroup size is a design choice about what size of shift must be caught
  verify:
    expect:
      v: sqrt(Rational(n2, n1))
- template: pd-cp-cpk
  skill: design.spc
  pace: quick
  cases:
  - lsl: 9.5
    usl: 10.5
    mu: 10.1
    sg: 0.12
  - lsl: 45
    usl: 55

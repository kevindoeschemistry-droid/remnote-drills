- template: pd-dust-concentration
  skill: design.solids
  pace: quick
  given:
    md:
      pick:
      - 0.5
      - 2
      - 12
    qg:
      pick:
      - 200
      - 1500
      - 8000
    mec:
      pick:
      - 30
      - 60
  prompt: A duct carries {{md}} kg/h of dust in {{qg}} m3/h of air. What is the dust concentration (g/m3), and does it exceed a minimum explosible concentration printed as {{mec}} g/m3? Give the concentration.
  parts:
  - ask: Answer
    label: v
    tex: g/m^3
    value: md*1000/qg
    tol: 0.005
    explain: Keeping a duct's loading well below the minimum explosible concentration is one layer; the others are removing ignition sources and relieving or suppressing what still ignites. The threshold is printed because the standard's own table was not read
  verify:
    expect:
      v: nsimplify(md)*1000/nsimplify(qg)
- template: pd-dilution-air
  skill: design.solids
  pace: quick
  given:

- template: pd-sigfig-product
  skill: design.uncertainty
  pace: quick
  given:
    a1:
      pick:
      - 2
      - 3
      - 4
      - 5
    a2:
      pick:
      - 2
      - 3
      - 4
    a3:
      pick:
      - 3
      - 4
      - 6
  prompt: A result is computed from measurements of {{a1}}, {{a2}} and {{a3}} significant figures. To how many significant figures should the product be reported?
  parts:
  - ask: Answer
    label: v
    tex: figures
    value: min(a1, min(a2, a3))
    final: true
    tol: 0.0001
    explain: A product carries the significant figures of its least precise factor, so measuring one quantity to six figures buys nothing while another is known to two; rounding is done once, at the end
  verify:
    expect:
      v: Min(a1, a2, a3)
- template: pd-sigfig-sum
  skill: design.uncertainty
  pace: quick
  given:
    d1:
      pick:
      - 0
      - 1
      - 2
      - 3
    d2:
      pick:
      - 1
      - 2
      - 4
    d3:
      pick:
      - 0
      - 2
      - 3
  prompt: Three measurements are known to {{d1}}, {{d2}} and {{d3}} decimal places. To how many decimal places should their sum be reported?
  parts:
  - ask: Answer
    label: v
    tex: places
    value: min(d1, min(d2, d3))
    final: true
    tol: 0.0001
    explain: A sum is limited by decimal place rather than by significant figures, which is the rule most often applied the wrong way round
  verify:
    expect:
      v: Min(d1, d2, d3)
- template: pd-uncert-sum
  skill: design.uncertainty
  pace: quick
  given:
    u1:
      pick:
      - 0.1
      - 0.5
      - 2.0
      - 12
    u2:
      pick:
      - 0.3
      - 1.5
      - 5.0
  prompt: Two measurements carry absolute uncertainties of {{u1}} and {{u2}}. What is the uncertainty of their sum?
  parts:
  - ask: Answer
    label: v
    tex: \sigma
    value: sqrt(u1^2 + u2^2)
    tol: 0.005
    explain: 'Absolute uncertainties add in quadrature through a sum, so the largest one dominates: with a 0.1 and a 1.5, improving the 0.1 changes almost nothing'
  verify:
    expect:
      v: sqrt(nsimplify(u1)**2 + nsimplify(u2)**2)
- template: pd-uncert-product
  skill: design.uncertainty
  pace: quick
  given:
    r1:
      pick:
      - 0.5
      - 1
      - 3
      - 8
    r2:
      pick:
      - 1
      - 2
      - 5
      - 10
  prompt: A product of two quantities known to {{r1}} and {{r2}} per cent carries what relative uncertainty (per cent)?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: sqrt(r1^2 + r2^2)
    tol: 0.005
    explain: Relative uncertainties add in quadrature through a product or quotient, which is why a flow measured to five per cent fixes the accuracy of anything computed from it
  verify:
    expect:
      v: sqrt(nsimplify(r1)**2 + nsimplify(r2)**2)
- template: pd-accuracy-precision
  skill: design.uncertainty

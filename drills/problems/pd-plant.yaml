    tt: 540
    zz: 0.9
    mm: 58
  prompt: Using A = W/(C*Kd*P1*Kb*Kc) * sqrt(T*Z/M), size the area for W = {{wf}} lb/h, C = {{cc}}, Kd = {{kd}}, P1 = {{p1}} psia, T = {{tt}} degrees Rankine, Z = {{zz}}, M = {{mm}}, with Kb and Kc equal to 1. Give the area in square inches.

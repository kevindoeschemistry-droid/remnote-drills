    o3: Evaluate the bid and mention it afterwards
    o4: Reject that bidder
  - q: 'A consultant is paid a retainer by a client and a commission by the equipment supplier they recommend. This is:'
    o1: Permitted only with the informed consent of everyone concerned, and the commission alone would not be
    o2: Normal practice needing no disclosure
    o3: Permitted if the equipment is genuinely best
    o4: Prohibited in all circumstances
  - q: 'An engineer reviewing a competitor''s design for a client may:'
    o1: Do it, keeping the review objective and the information confidential
    o2: Not do it under any circumstance
    o3: Do it and contact the competitor's client
    o4: Do it only with the competitor's consent
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The question is always what a reasonable affected party would want to know before relying on the engineer's judgment
  verify:
    authored: true
- template: pd-confidential-scenario
  skill: design.practice
  pace: recall
  cases:
  - q: 'An engineer leaves a firm and is asked by a new employer about the former client''s process. They may disclose:'
    o1: Only general knowledge and skill, not the former client's confidential information
    o2: Anything not written down
    o3: Anything, since employment ended
    o4: Only what is favourable
  - q: 'An engineer notices, from confidential project data, a safety defect in a product already sold. The duty is:'
    o1: The public's safety governs, so the matter is escalated, confidentiality notwithstanding
    o2: Confidentiality governs, so nothing is said
    o3: Wait until the project ends
    o4: Tell the public directly first
  - q: 'Using a client''s process knowledge to bid work for a competitor in the same field is:'
    o1: Not permitted without the client's consent
    o2: Permitted, since knowledge cannot be returned
    o3: Permitted after a year
    o4: Permitted if the bid differs
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The duty continues after the engagement, and the one thing that overrides it is a danger to the public

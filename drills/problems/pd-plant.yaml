    sg: 2.5
  prompt: Specifications run from {{lsl}} to {{usl}}; the process sits at {{mu}} with a standard deviation of {{sg}}. What is the centred capability index?
  parts:
  - ask: Answer
    label: v
    tex: C_{pk}
    value: min((usl - mu)/(3*sg), (mu - lsl)/(3*sg))
    tol: 0.005
    explain: The centred index charges the process for sitting off target, so it is the smaller of the two one-sided margins; a capable but off-centre process has a high uncentred index and a low centred one
  verify:
    expect:
      v: Min((nsimplify(usl) - nsimplify(mu))/(3*nsimplify(sg)), (nsimplify(mu) - nsimplify(lsl))/(3*nsimplify(sg)))
- template: pd-cp-only
  skill: design.spc
  pace: quick
  cases:
  - lsl: 9.5
    usl: 10.5
    sg: 0.12
  - lsl: 45
    usl: 55
    sg: 1.4
  - lsl: 2.0
    usl: 3.0
    sg: 0.15
  - lsl: 190
    usl: 210
    sg: 2.5
  prompt: For the same specifications {{lsl}} to {{usl}} and standard deviation {{sg}}, what is the uncentred capability index?
  parts:
  - ask: Answer
    label: v
    tex: C_p
    value: (usl - lsl)/(6*sg)
    tol: 0.005
    explain: The uncentred index is the best the process could do if it were perfectly centred, so the gap between the two indices is exactly what re-centring would recover, and re-centring is usually cheaper than reducing variation
  verify:
    expect:
      v: (nsimplify(usl) - nsimplify(lsl))/(6*nsimplify(sg))
- template: pd-chart-pattern
  skill: design.spc
  pace: recall
  cases:
  - q: 'Eight consecutive points on one side of the centre line indicate:'
    o1: A shift in the process mean, even with no point outside the limits
    o2: Normal variation
    o3: A measurement error
    o4: Improved capability
  - q: 'A steady upward trend over several points suggests:'
    o1: A drifting cause such as tool wear or fouling
    o2: Random variation
    o3: A sampling error
    o4: Reduced variation
  - q: 'A single point beyond three sigma means:'
    o1: Something changed, and the cause is looked for before more product is made
    o2: Nothing, since limits are arbitrary
    o3: The specification was wrong
    o4: The chart needs recalculating
  - q: 'The purpose of the run rules is to:'
    o1: Catch a shift before product goes out of specification, rather than after
    o2: Replace the specification limits
    o3: Reduce sampling
    o4: Prove capability
  - q: 'Points hugging the centre line unusually closely can indicate:'
    o1: That the subgroups are not what they are assumed to be, for instance stratified sampling
    o2: An unusually good process
    o3: A shifted mean
    o4: A trend
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The rules exist because a shift shows as a pattern long before it shows as a violation
  verify:
    authored: true
- template: pd-work-index-back
  skill: design.solids
  pace: quick
  cases:
  - en: 11.4
    f80: 10000
    p80: 100
  - en: 6.8
    f80: 2500
    p80: 75
  - en: 18.2
    f80: 50000
    p80: 300
  - en: 14.0
    f80: 1200
    p80: 45
  prompt: A mill drew {{en}} kWh/ton taking feed from {{f80}} to {{p80}} micrometres. What Bond work index does that imply (kWh/ton)?
  parts:
  - ask: Answer
    label: v
    tex: kWh/ton
    value: en/(10*(1/sqrt(p80) - 1/sqrt(f80)))
    tol: 0.005
    explain: Running Bond's law backwards from a measured duty is how a work index is obtained for a material that has not been tested, and how an existing mill's performance is checked against the test value
  verify:
    expect:
      v: nsimplify(en)/(10*(1/sqrt(nsimplify(p80)) - 1/sqrt(nsimplify(f80))))
- template: pd-nucleation-ratio
  skill: design.solids
  pace: quick
  given:
    bn:
      pick:
      - 3
      - 4
      - 5
    gn:
      pick:
      - 1
      - 2
    fs:
      pick:
      - 2
      - 3
      - 5
  require:
  - bn > gn
  prompt: Nucleation rate goes as supersaturation to the power {{bn}} and growth as the power {{gn}}. By what factor does the ratio of nucleation to growth change when supersaturation is multiplied by {{fs}}?
  parts:
  - ask: Answer
    label: v
    tex: \times
    value: fs^(bn - gn)
    tol: 0.005
    explain: 'Nucleation''s higher order is the whole reason a crystallizer run hard makes fines: doubling the driving force can multiply the nucleation-to-growth ratio several-fold'
  verify:
    expect:
      v: Integer(fs)**(bn - gn)
- template: pd-repose-height
  skill: design.solids
  pace: quick
  given:
    dd:
      pick:
      - 12
      - 20
      - 35
    ang:
      pick:
      - 30
      - 35
      - 40
      - 45
  prompt: A conical stockpile of base diameter {{dd}} m stands at an angle of repose of {{ang}} degrees. How tall is it (m)?
  parts:
  - ask: Answer
    label: v
    tex: m
    value: dd/2*tan(ang*pi/180)
    tol: 0.005
    explain: The angle of repose fixes a stockpile's height for a given footprint, so it sets both the storage a yard can hold and the reclaim equipment's reach
  verify:
    expect:
      v: Rational(dd, 2)*tan(nsimplify(ang)*pi/180)
- template: pd-drawing-detail-count
  skill: design.plant
  pace: quick
  given:
    ne:
      pick:
      - 4
      - 7
      - 12
    nv:
      pick:
      - 3
      - 6
      - 10
    ni:
      pick:
      - 2
      - 4
      - 8
  prompt: A unit has {{ne}} major items of equipment, each with {{nv}} valves and {{ni}} instruments. How many tagged items must the P&ID carry that the process flow diagram need not?
  parts:
  - ask: Answer
    label: v
    tex: items
    value: ne*(nv + ni)
    final: true
    tol: 0.0001
    explain: 'The count is why the two drawings exist: the detail that makes a plant buildable would make the process unreadable, so the flow diagram carries the process and the P&ID carries the hardware'
  verify:
    expect:
      v: ne*(nv + ni)
- template: pd-loop-count
  skill: design.plant
  pace: quick
  given:
    nl:
      pick:
      - 6
      - 14
      - 25
  prompt: A unit has {{nl}} control loops, each with a transmitter, a controller and a valve. How many tagged devices is that?
  parts:
  - ask: Answer
    label: v
    tex: devices
    value: 3*nl
    final: true
    tol: 0.0001
    explain: Every loop is three devices sharing one number, which is how a loop is traced from the drawing to the cabinet to the field
  verify:
    expect:
      v: 3*nl
- template: pd-thickness-code
  skill: design.plant
  pace: quick
  cases:
  - pp: 150
    rr: 36
    ss: 17500
    ee: 1.0
  - pp: 300
    rr: 24
    ss: 20000
    ee: 0.85
  - pp: 600
    rr: 18
    ss: 15000
    ee: 1.0
  - pp: 75
    rr: 48
    ss: 13700
    ee: 0.7
  prompt: A code's thin-wall rule gives t = P*R/(S*E - 0.6*P). For P = {{pp}} psi, R = {{rr}} in, S = {{ss}} psi and E = {{ee}}, what thickness results (in)?
  parts:
  - ask: Answer
    label: v
    tex: in
    value: pp*rr/(ss*ee - 0.6*pp)
    tol: 0.005
    explain: 'The equation is printed because the code''s own text was not read. The joint efficiency term is the point: a vessel whose welds are not fully examined needs a thicker wall for the same duty, so inspection and steel trade against each other'
  verify:
    expect:
      v: nsimplify(pp)*nsimplify(rr)/(nsimplify(ss)*nsimplify(ee) - Rational(6, 10)*nsimplify(pp))
- template: pd-disc-tolerance
  skill: design.relief
  pace: quick
  given:
    bp:
      pick:
      - 50
      - 150
      - 300
    tl:
      pick:
      - 5
      - 10
  prompt: A rupture disc is specified at a burst pressure of {{bp}} psig with a tolerance of plus or minus {{tl}} per cent. What is the highest pressure at which it may still be intact (psig)?
  parts:
  - ask: Answer
    label: v
    tex: psig
    value: bp*(1 + tl/100)
    tol: 0.005
    explain: The top of the tolerance band, not the nameplate, is the pressure the vessel must survive, which is why a disc's specified burst sits below the rating by at least its tolerance
  verify:
    expect:
      v: nsimplify(bp)*(1 + Rational(tl, 100))
- template: pd-knockout-liquid
  skill: design.relief
  pace: quick
  given:
    wt:
      pick:
      - 25000
      - 60000
      - 140000
    lq:
      pick:
      - 15
      - 40
      - 70
  prompt: A two-phase relief discharges {{wt}} lb/h of which {{lq}} per cent is liquid. What liquid rate must the knockout drum handle (lb/h)?
  parts:
  - ask: Answer
    label: v
    tex: lb/h
    value: wt*lq/100
    final: true
    tol: 0.0001
    explain: The flare can only take vapour, so the liquid fraction sizes the knockout drum and the catch tank behind it; a relief treated as all vapour sends liquid to the flare tip
  verify:
    expect:
      v: Rational(wt*lq, 100)
- template: pd-segregation-pairs
  skill: design.relief
  pace: quick
  given:
    ng:
      pick:
      - 3
      - 4
      - 5
      - 6
  prompt: A store holds {{ng}} incompatibility groups that must each be kept apart from every other. How many pairwise separations does that require?
  parts:
  - ask: Answer
    label: v
    tex: pairs
    value: ng*(ng - 1)/2
    final: true
    tol: 0.0001
    explain: The pair count grows as the square, which is why a store is laid out by groups with bunds and separate drains rather than by checking each new drum against every other material present
  verify:
    expect:
      v: Rational(ng*(ng - 1), 2)
- template: pd-seal-segments
  skill: design.practice
  pace: quick
  given:
    nt:
      pick:
      - 3
      - 5
      - 9

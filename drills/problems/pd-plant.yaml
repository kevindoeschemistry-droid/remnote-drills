- template: pd-ownership-scenario
  skill: design.practice
  pace: recall
  cases:
  - q: 'An engineer develops a tool on their own time that is used at work on company projects. Ownership:'
    o1: Depends on the employment agreement and what the tool was developed from, so it is settled in writing in advance
    o2: Belongs to the engineer automatically
    o3: Belongs to the employer automatically
    o4: Belongs to the client
  - q: 'A client asks to reuse a design the engineer prepared for them on a second site. Reuse is:'
    o1: A matter of what the agreement says about reuse and liability, settled rather than assumed
    o2: Always permitted
    o3: Never permitted
    o4: Permitted if the engineer is credited
  - q: 'A paper is written up from a project. Authorship goes to:'
    o1: Those who did the work, which is a duty separate from who owns it
    o2: The principal who signs

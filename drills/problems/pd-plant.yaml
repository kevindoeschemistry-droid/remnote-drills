- template: pd-mean-median
  skill: design.spc
  pace: quick
  cases:
  - x1: 10.1
    x2: 10.3
    x3: 10.2
    x4: 10.4
    x5: 14.0
  - x1: 48
    x2: 51
    x3: 49
    x4: 50
    x5: 52
  - x1: 2.1
    x2: 2.0
    x3: 2.2
    x4: 2.1
    x5: 5.6
  - x1: 300
    x2: 295
    x3: 310
    x4: 305
    x5: 290
  prompt: Five readings are {{x1}}, {{x2}}, {{x3}}, {{x4}} and {{x5}}. By how much does the mean exceed the median?
  parts:
  - ask: Answer
    label: v
    tex: difference
    value: (x1 + x2 + x3 + x4 + x5)/5 - median([x1, x2, x3, x4, x5])
    tol: 0.005
    explain: 'The gap between mean and median measures how far one reading is pulling the average: a large gap on five readings usually means an outlier to investigate rather than a skewed process'
  verify:
    expect:
      v: (nsimplify(x1) + nsimplify(x2) + nsimplify(x3) + nsimplify(x4) + nsimplify(x5))/5 - sorted([nsimplify(x1), nsimplify(x2), nsimplify(x3), nsimplify(x4), nsimplify(x5)])[2]
- template: pd-sample-sd
  skill: design.spc
  pace: quick
  cases:
  - x1: 10
    x2: 12
    x3: 14
    x4: 16
  - x1: 48
    x2: 51
    x3: 49
    x4: 52
  - x1: 2.0
    x2: 2.4
    x3: 2.1
    x4: 2.3
  - x1: 300
    x2: 290
    x3: 310
    x4: 296
  prompt: Four readings are {{x1}}, {{x2}}, {{x3}} and {{x4}}. What is the sample standard deviation?
  parts:
  - ask: Answer
    label: v
    tex: s
    value: sqrt(((x1 - (x1+x2+x3+x4)/4)^2 + (x2 - (x1+x2+x3+x4)/4)^2 + (x3 - (x1+x2+x3+x4)/4)^2 + (x4 - (x1+x2+x3+x4)/4)^2)/3)
    tol: 0.005
    explain: Dividing by one less than the count corrects for having estimated the mean from the same data; with four readings the difference from dividing by four is about fifteen per cent
  verify:
    expect:
      v: sqrt(((nsimplify(x1) - (nsimplify(x1)+nsimplify(x2)+nsimplify(x3)+nsimplify(x4))/4)**2 + (nsimplify(x2) - (nsimplify(x1)+nsimplify(x2)+nsimplify(x3)+nsimplify(x4))/4)**2 + (nsimplify(x3) - (nsimplify(x1)+nsimplify(x2)+nsimplify(x3)+nsimplify(x4))/4)**2 + (nsimplify(x4) - (nsimplify(x1)+nsimplify(x2)+nsimplify(x3)+nsimplify(x4))/4)**2)/3)
- template: pd-t-statistic
  skill: design.spc
  pace: quick
  cases:
  - nn: 9
    xb: 10.4
    mu: 10.0
    sd: 0.45
  - nn: 16
    xb: 49.2
    mu: 50.0
    sd: 1.6
  - nn: 25
    xb: 2.14
    mu: 2.0
    sd: 0.3
  - nn: 4
    xb: 305
    mu: 300
    sd: 8
  prompt: A sample of {{nn}} gives a mean of {{xb}} against a claimed {{mu}}, with sample standard deviation {{sd}}. What is the t statistic?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: (xb - mu)/(sd/sqrt(nn))
    tol: 0.005
    explain: 'The statistic is the difference in units of its own standard error, so the same difference becomes significant with a larger sample: significance is about detectability, not about size mattering'
  verify:
    expect:
      v: (nsimplify(xb) - nsimplify(mu))/(nsimplify(sd)/sqrt(nn))
- template: pd-test-meaning
  skill: design.spc
  pace: recall
  cases:
  - q: 'Failing to reject a claim at the five per cent level means:'
    o1: The data were not surprising enough to rule it out, which is not evidence it holds
    o2: The claim is true
    o3: The claim is false
    o4: The sample was too small
  - q: 'A difference significant at one per cent on 10000 readings:'

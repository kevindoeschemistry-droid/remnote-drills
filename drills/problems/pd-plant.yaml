- template: pd-stream-close
  skill: design.plant
  pace: quick
  given:
    s1:
      pick:
      - 1200
      - 4500
      - 880
    s2:
      pick:
      - 300
      - 1500
      - 2600
    s3:
      pick:
      - 900
      - 3000
      - 1100
  require:
  - s1 + s2 > s3
  prompt: A mixer takes {{s1}} and {{s2}} kg/h in and sends {{s3}} kg/h out of one outlet. At steady state with no accumulation, what does the second outlet carry (kg/h)?
  parts:
  - ask: Answer
    label: v
    tex: kg/h
    value: s1 + s2 - s3
    final: true
    tol: 0.0001
    explain: A stream table is a material balance written out, so a blank follows from closing the balance; a table that will not close is an error in the table
  verify:
    expect:
      v: s1 + s2 - s3
- template: pd-stream-composition
  skill: design.plant
  pace: quick
  cases:
  - m1: 1000
    x1: 0.1
    m2: 500
    x2: 0.4
  - m1: 2500
    x1: 0.05
    m2: 2500
    x2: 0.25
  - m1: 800
    x1: 0.6
    m2: 3200
    x2: 0.0
  - m1: 1500
    x1: 0.3
    m2: 500
    x2: 0.9
  prompt: 'Two streams mix: {{m1}} kg/h at {{x1}} mass fraction solute and {{m2}} kg/h at {{x2}}. What is the outlet mass fraction?'
  parts:
  - ask: Answer
    label: v
    tex: x
    value: (m1*x1 + m2*x2)/(m1 + m2)
    tol: 0.005
    explain: The component balance beside the total balance; both have to close, and a stream table gives enough entries to check that they do
  verify:
    expect:
      v: (nsimplify(m1)*nsimplify(x1) + nsimplify(m2)*nsimplify(x2))/(nsimplify(m1) + nsimplify(m2))

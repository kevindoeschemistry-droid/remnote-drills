# Second question types; keys recomputed by sympy along another route.

- template: pd-which-mean
  skill: design.solids
  pace: recall
  cases:
  - q: Which mean diameter carries a powder's surface area per unit volume?
    o1: The Sauter (surface-volume) mean
    o2: The arithmetic mean
    o3: The mass median
    o4: The mode
  - q: A catalyst's reaction rate depends on external surface area. Which mean describes the charge?
    o1: The Sauter mean
    o2: The arithmetic mean
    o3: The length mean
    o4: The largest particle
  - q: 'Reporting a single diameter for a powder is defensible only when:'
    o1: The distribution is narrow, or the mean chosen is the one the application depends on
    o2: Always
    o3: Never
    o4: The powder is coarse
  - q: 'Two powders have the same arithmetic mean but different Sauter means. This means:'
    o1: Their distributions differ in shape, so their surface areas per unit volume differ
    o2: One measurement is wrong
    o3: They are the same powder
    o4: Their densities differ
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: 'A distribution needs a stated kind of average: the Sauter mean is the one tied to surface area, and it is the one catalysis, drying and dissolution follow'
  verify:
    authored: true
- template: pd-mass-fraction-cut
  skill: design.solids
  pace: quick
  cases:
  - f1: 0.08
    f2: 0.24
    f3: 0.41
    f4: 0.19
  - f1: 0.02
    f2: 0.11
    f3: 0.35
    f4: 0.44
  - f1: 0.3
    f2: 0.3
    f3: 0.2
    f4: 0.12
  - f1: 0.15
    f2: 0.2
    f3: 0.25
    f4: 0.3
  prompt: A sieve analysis gives mass fractions {{f1}}, {{f2}}, {{f3}} and {{f4}} on four screens with the remainder in the pan. What percentage of the charge reaches the pan?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(1 - f1 - f2 - f3 - f4)
    tol: 0.005
    explain: A sieve stack's fractions must close to one, so the pan fraction is what the screens did not retain; a stack that does not close has lost material or been overloaded
  verify:
    expect:
      v: 100*(1 - nsimplify(f1) - nsimplify(f2) - nsimplify(f3) - nsimplify(f4))
- template: pd-sauter
  skill: design.solids
  pace: quick
  cases:
  - n1: 100
    d1: 20
    n2: 50
    d2: 50
    n3: 10
    d3: 120
  - n1: 400
    d1: 10
    n2: 100
    d2: 40
    n3: 25
    d3: 100
  - n1: 60
    d1: 75
    n2: 30
    d2: 150
    n3: 5
    d3: 300
  - n1: 200
    d1: 5
    n2: 200
    d2: 25
    n3: 50
    d3: 60
  prompt: A powder has {{n1}} particles of {{d1}} micrometres, {{n2}} of {{d2}} and {{n3}} of {{d3}}. What is the Sauter mean diameter (micrometres)?
  parts:
  - ask: Answer
    label: v
    tex: d_{32}
    value: (n1*d1^3 + n2*d2^3 + n3*d3^3)/(n1*d1^2 + n2*d2^2 + n3*d3^2)
    tol: 0.005
    explain: A few large particles dominate the numerator, so the Sauter mean sits far above the arithmetic mean whenever the distribution has a coarse tail
  verify:
    expect:
      v: (n1*d1**3 + n2*d2**3 + n3*d3**3)/(n1*d1**2 + n2*d2**2 + n3*d3**2)
- template: pd-arith-vs-sauter
  skill: design.solids
  pace: quick
  cases:
  - n1: 100
    d1: 10
    n2: 10
    d2: 100
  - n1: 500
    d1: 20
    n2: 25
    d2: 200
  - n1: 50
    d1: 40
    n2: 50
    d2: 80
  - n1: 90
    d1: 15
    n2: 30
    d2: 60
  prompt: For a powder of {{n1}} particles at {{d1}} micrometres and {{n2}} at {{d2}}, by what factor does the Sauter mean exceed the arithmetic mean?
  parts:
  - ask: Answer
    label: v
    tex: \times
    value: ((n1*d1^3 + n2*d2^3)/(n1*d1^2 + n2*d2^2))/((n1*d1 + n2*d2)/(n1 + n2))
    tol: 0.005
    explain: 'The ratio is a measure of how wide the distribution is: for a monosized powder it is one, and it grows with every coarse particle added'
  verify:
    expect:
      v: ((n1*d1**3 + n2*d2**3)/(n1*d1**2 + n2*d2**2))*Rational(n1 + n2, n1*d1 + n2*d2)
- template: pd-voidage
  skill: design.solids
  pace: quick
  given:
    rp:
      pick:
      - 2500
      - 1400
      - 7850
      - 1050
    rb:
      pick:
      - 1450
      - 820
      - 4100
      - 620
  require:
  - rb < rp
  prompt: A powder of particle density {{rp}} kg/m3 has a bulk density of {{rb}} kg/m3. What is its voidage?
  parts:
  - ask: Answer
    label: v
    tex: \varepsilon
    value: 1 - rb/rp
    tol: 0.005
    explain: Voidage is the fraction of the bed that is gas; a poured powder usually sits near 0.4 and vibration can take it to 0.35, which is why bulk density is reported with how it was measured
  verify:
    expect:
      v: 1 - Rational(rb, rp)
- template: pd-bulk-from-voidage
  skill: design.solids
  pace: quick
  given:
    rp:
      pick:
      - 2500
      - 1400
      - 7850
      - 1050
    ep:
      pick:
      - 0.35
      - 0.4
      - 0.45
      - 0.6
  prompt: A particle density of {{rp}} kg/m3 and a voidage of {{ep}} give what bulk density (kg/m3)?
  parts:
  - ask: Answer
    label: v
    tex: \rho_b
    value: rp*(1 - ep)
    tol: 0.005
    explain: The reverse calculation, which is how a silo's holding capacity is worked out from a material's particle density and the packing it is expected to reach
  verify:
    expect:
      v: nsimplify(rp)*(1 - nsimplify(ep))

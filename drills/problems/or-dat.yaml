    - { q: 'carbanion', o1: 'Tertiary', o2: 'Secondary', o3: 'Primary', o4: 'Methyl', ans: 3 }
    - { q: 'alkene', o1: '1-butene', o2: 'cis-2-butene', o3: 'trans-2-butene', o4: '2-methyl-2-butene (trisubstituted)', ans: 3 }

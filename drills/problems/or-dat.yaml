      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'Compare atomic numbers of the atoms bonded to the stereocenter. On a tie, list the next atoms out as a set and compare the highest first; a double bond counts its partner twice. So –CHO (O, O, H) beats –CH₂OH (O, H, H), and –CH₂Cl beats –CH₂OH because Cl outranks O'
  verify: { authored: true }

- template: or-isomer-relationship
  skill: orgo.structure
  pace: quick
  cases:
    - { q: '(2R,3R)-2,3-dibromopentane and (2S,3S)-2,3-dibromopentane', ans: 1 }
    - { q: '(2R,3R)-2,3-dibromopentane and (2R,3S)-2,3-dibromopentane', ans: 2 }
    - { q: '(2R,3S)-2,3-dibromobutane and (2S,3R)-2,3-dibromobutane', ans: 0 }
    - { q: 'butane and 2-methylpropane', ans: 3 }
    - { q: 'cis-2-butene and trans-2-butene', ans: 2 }
    - { q: '(R)-2-butanol and the same molecule rotated 180° in the plane', ans: 0 }
    - { q: '1-propanol and 2-propanol', ans: 3 }
    - { q: '(R)-alanine and (S)-alanine', ans: 1 }
  prompt: 'How are these related: {{q}}?'
  parts:
    - ask: 'Relationship'
      label: a
      choice: ["Identical (the same compound, or one meso compound)", "Enantiomers", "Diastereomers", "Constitutional isomers"]
      correct: ans
      explain: 'Different connectivity: constitutional isomers. Same connectivity: compare configurations. Every center inverted: enantiomers (non-superimposable mirror images). Some but not all inverted, or cis/trans: diastereomers. A molecule with stereocenters and an internal mirror plane is meso, so its "mirror image" is itself'
  verify: { authored: true }


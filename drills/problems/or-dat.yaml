- template: or-hybridization-geometry
  skill: orgo.structure
  pace: recall
  cases:
    - { q: 'a carbonyl carbon', ans: 1 }
    - { q: 'the nitrogen of a nitrile', ans: 0 }
    - { q: 'the nitrogen of pyridine', ans: 1 }
    - { q: 'the oxygen of water', ans: 2 }
    - { q: 'the central carbon of CO₂', ans: 0 }
    - { q: 'a carbon of benzene', ans: 1 }
    - { q: 'the carbon of a methyl carbocation', ans: 1 }
    - { q: 'the nitrogen of an amide (lone pair in resonance)', ans: 1 }
    - { q: 'a carbon of ethyne', ans: 0 }
  prompt: 'What is the hybridization of {{q}}?'
  parts:
    - ask: 'Hybridization'
      label: a
      choice: ["sp (linear, 180°)", "sp² (trigonal planar, 120°)", "sp³ (tetrahedral, 109.5°)"]
      correct: ans
      explain: 'Count σ bonds plus lone pairs: 2 → sp, 3 → sp², 4 → sp³. A lone pair in resonance (amide N, pyrrole N) sits in a p orbital, which makes the atom sp². More s character means shorter, stronger bonds: C≡C 120 pm < C=C 134 pm < C–C 154 pm'
  verify: { authored: true }


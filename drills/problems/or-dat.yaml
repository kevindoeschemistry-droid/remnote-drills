    - { f: 'toluene', n: 5 }
    - { f: 'ethanol', n: 2 }
    - { f: 'acetone', n: 2 }
    - { f: '2-butanone', n: 4 }
    - { f: 'p-xylene (1,4-dimethylbenzene)', n: 3 }
    - { f: 'cyclohexane', n: 1 }
    - { f: '2-propanol', n: 2 }
    - { f: 'diethyl ether', n: 2 }
    - { f: 'methyl acetate', n: 3 }
    - { f: 'm-xylene (1,3-dimethylbenzene)', n: 5 }
    - { f: 'o-xylene (1,2-dimethylbenzene)', n: 4 }
    - { f: 'tert-butyl alcohol', n: 2 }
    - { f: 'cyclohexanone', n: 4 }
  prompt: 'How many signals does the ¹³C NMR spectrum of {{f}} show?'
  parts:
    - ask: 'Signals'
      label: a
      choice: ["1", "2", "3", "4", "5", "6"]
      correct: n - 1
      explain: 'Count carbons that symmetry cannot swap. Find every mirror plane and rotation axis, then group carbons that land on each other. Shift regions: sp³ 0–50 (more with O or N attached, 50–90), aromatic and alkene 100–150, C=O 160–220'
  verify: { authored: true }

- template: or-h1-environments
  skill: orgo.spectroscopy
  pace: quick
  cases:
    - { f: 'ethyl acetate', n: 3 }
    - { f: 'acetone', n: 1 }
    - { f: '1-propanol', n: 4 }
    - { f: 'toluene', n: 4 }
    - { f: 'p-xylene', n: 2 }
    - { f: '2-chloropropane', n: 2 }
    - { f: 'diethyl ether', n: 2 }
    - { f: 'tert-butyl methyl ether', n: 2 }
    - { f: 'propanoic acid', n: 3 }
    - { f: '1-chlorobutane', n: 4 }
  prompt: 'How many distinct ¹H NMR signals does {{f}} give?'
  parts:
    - ask: 'Signals'
      label: a
      choice: ["1", "2", "3", "4", "5"]
      correct: n - 1
      explain: 'Hydrogens are equivalent when symmetry or free rotation swaps them (all three H of a CH₃). Then read each signal: integration gives the relative number of H, splitting gives $n + 1$ for $n$ neighbouring H, and electronegative neighbours shift it downfield'
  verify: { authored: true }

- template: or-structure-from-data
  skill: orgo.spectroscopy
  pace: workout
  cases:
    - { q: 'C₃H₆O; IR 1715 cm⁻¹; ¹H NMR one singlet (6H) at 2.1 ppm', o1: 'Propanal', o2: 'Acetone', o3: 'Allyl alcohol', o4: 'Methyl vinyl ether', ans: 1 }
    - { q: 'C₂H₆O; IR broad 3350 cm⁻¹; ¹H NMR triplet (3H) 1.2, quartet (2H) 3.7, broad singlet (1H)', o1: 'Ethanol', o2: 'Dimethyl ether', o3: 'Acetaldehyde', o4: 'Ethylene glycol', ans: 0 }
    - { q: 'C₄H₈O₂; IR 1740 cm⁻¹; ¹H NMR singlet (3H) 2.0, quartet (2H) 4.1, triplet (3H) 1.2', o1: 'Butanoic acid', o2: 'Methyl propanoate', o3: 'Ethyl acetate', o4: '1,4-dioxane', ans: 2 }
    - { q: 'C₃H₆O₂; IR very broad 2500–3300 and 1710 cm⁻¹; ¹H NMR triplet (3H), quartet (2H), singlet (1H) at 11.8', o1: 'Methyl acetate', o2: 'Ethyl formate', o3: 'Hydroxyacetone', o4: 'Propanoic acid', ans: 3 }
    - { q: 'C₈H₁₀; ¹H NMR singlet (4H) at 7.1 and singlet (6H) at 2.3', o1: 'p-Xylene', o2: 'Ethylbenzene', o3: 'o-Xylene', o4: 'm-Xylene', ans: 0 }
  prompt: '{{q}}. Which compound is it?'
  parts:
    - ask: 'Compound'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'Start with degrees of unsaturation from the formula, use IR for the functional group, then NMR for the pieces: a quartet next to a triplet is an ethyl group, a singlet CH₃ near 2 ppm sits on a C=O, a signal near 4 ppm is on oxygen, and 10–12 ppm is a carboxylic acid'
  verify: { authored: true }

# ── structure and stereochemistry ──────────────────────────────────────────
- template: or-iupac-name
  skill: orgo.structure
  pace: quick
  cases:
    - { f: 'CH₃CH(CH₃)CH₂CH₃', o1: '2-methylbutane', o2: '3-methylbutane', o3: 'isopentane-2', o4: '2-ethylpropane', ans: 0 }
    - { f: 'CH₃CH₂CH(OH)CH₃', o1: '3-butanol', o2: '2-butanol', o3: '1-methylpropanol', o4: 'butan-3-ol', ans: 1 }
    - { f: 'CH₃COCH₂CH₂CH₃', o1: 'pentanal', o2: '4-pentanone', o3: '2-pentanone', o4: 'propyl methyl aldehyde', ans: 2 }
    - { f: 'CH₂=CHCH₂CH₃', o1: '2-butene', o2: '3-butene', o3: 'butyne', o4: '1-butene', ans: 3 }
    - { f: 'CH₃CH₂COOCH₃', o1: 'methyl propanoate', o2: 'propyl methanoate', o3: 'ethyl acetate', o4: 'methyl butanoate', ans: 0 }
    - { f: 'CH₃CH(Cl)CH₂CH₂CH₃', o1: '4-chloropentane', o2: '2-chloropentane', o3: '2-chlorobutane', o4: '1-chloro-1-methylbutane', ans: 1 }
    - { f: '(CH₃)₂CHCH₂CHO', o1: '2-methylbutanal', o2: '3-methylbutanoic acid', o3: '3-methylbutanal', o4: 'isobutyl ketone', ans: 2 }
    - { f: 'CH₃CH₂CH₂NH₂', o1: '1-aminopropene', o2: 'propanamide', o3: 'propylamide', o4: 'propan-1-amine', ans: 3 }
  prompt: 'What is the IUPAC name of {{f}}?'
  parts:
    - ask: 'Name'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'Find the longest chain containing the main functional group, number from the end that gives that group (then the multiple bonds, then substituents) the lowest locant, and name substituents alphabetically. Suffix order: acid > ester > amide > nitrile > aldehyde > ketone > alcohol > amine'
  verify: { authored: true }

- template: or-rs-from-arrangement
  skill: orgo.structure
  pace: recall
  given: { cw: { pick: [0, 1] }, away: { pick: [0, 1] } }
  prompt: 'At a stereocenter, priorities 1 → 2 → 3 run {{cw == 1 ? "clockwise" : "counterclockwise"}} with the lowest-priority group pointing {{away == 1 ? "away from you (dashed)" : "toward you (wedged)"}}. Is it R or S?'
  parts:
    - ask: 'Configuration'
      label: a
      choice: ["R", "S"]
      correct: '(cw == 1) == (away == 1) ? 0 : 1'
      explain: 'With the lowest priority in back, clockwise is R and counterclockwise S. If the lowest priority points at you, read the direction and then reverse the answer'
  verify: { choices: { a: "0 if cw == away else 1" } }


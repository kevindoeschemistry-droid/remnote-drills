- template: pc-surface-fraction
  skill: pchem.phases
  pace: quick
  given:
    R:
      pick:
      - 1
      - 2
      - 5
      - 25
    t:
      pick:
      - 0.25
      - 0.3
  prompt: A spherical nanoparticle has radius {{R}} nm. About what percent of its atoms lie in the outer {{t}} nm shell?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(1 - (1 - t/R)^3)
    tol: 0.005
    explain: 'Surface share = 1 − (inner volume)/(total volume): about half the atoms of a 2 nm particle are surface atoms, under 4% of a 25 nm one'
  verify:
    expect:
      v: 100*(1 - integrate(4*pi*Symbol('r')**2, (Symbol('r'), 0, nsimplify(R) - nsimplify(t)))/integrate(4*pi*Symbol('r')**2, (Symbol('r'), 0, nsimplify(R))))

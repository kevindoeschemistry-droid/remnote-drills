      v: Max(*[r for r in solve(Eq(diff(4*(nsimplify(s)/x)**12 - 4*(nsimplify(s)/x)**6, x), 0), x) if r.is_real])
- template: pc-london-scale
  skill: pchem.phases
  pace: quick
  cases:
  - E1: 2.0
    r1: 4
    r2: 5
    chg: nothing else changes
    f: 1
  - E1: 1.5
    r1: 5
    r2: 4
    chg: nothing else changes
    f: 1
  - E1: 2.0
    r1: 4
    r2: 4
    chg: each molecule's polarisability doubles
    f: 4
  - E1: 3.0
    r1: 4
    r2: 6
    chg: one molecule's polarisability doubles
    f: 2
  prompt: The London dispersion energy between two molecules is {{E1}} kJ/mol at {{r1}} Å. What is it at {{r2}} Å if {{chg}}? (Give the magnitude.)
  parts:
  - ask: Answer
    label: v
    tex: '|E|'
    value: E1*f*(r1/r2)^6
    tol: 0.005
    explain: 'London: E ∝ α₁α₂/r⁶, so distance dominates: 25% farther cuts the attraction to about a quarter'
  verify:
    expect:
      v: nsimplify(E1)*f*(Rational(r1, r2))**6

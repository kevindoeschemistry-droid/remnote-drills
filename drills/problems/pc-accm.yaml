  prompt: For N₂ + 3H₂ → 2NH₃, a vessel starts with {{a}} mol N₂ and {{b}} mol H₂. After some time it holds {{c}} mol NH₃. What is the extent of reaction ξ, in mol, and how much H₂ remains? Give ξ.

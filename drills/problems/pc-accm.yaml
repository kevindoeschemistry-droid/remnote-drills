- template: pc-lj-minimum
  skill: pchem.phases
  pace: quick
  given:
    s:
      pick:
      - 3.4
      - 3.7
      - 2.6
    e:
      pick:
      - 120
      - 95
      - 10
  prompt: A Lennard-Jones potential has σ = {{s}} Å and ε/k_B = {{e}} K. At what separation, in Å, is the potential a minimum?
  parts:
  - ask: Answer
    label: v
    tex: r_{\min}
    value: 2^(1/6)*s
    tol: 0.005
    explain: dV/dr = 0 gives r = 2^(1/6)σ ≈ 1.12σ, where V = −ε
  verify:

    o1: The fraction of collisions above Eₐ grows roughly as exp(−Eₐ/RT)
    o2: Collisions double in number
    o3: Eₐ halves
    o4: K doubles
  - q: Compressing N₂ + 3H₂ ⇌ 2NH₃ does what at equilibrium?
    o1: Shifts it toward NH₃ (fewer gas moles); K is unchanged
    o2: Changes K
    o3: Shifts it toward N₂ and H₂
    o4: Nothing
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Catalysts change paths and rates, never the end point; temperature changes both
  verify:
    authored: true
- template: pc-langmuir
  skill: kinetics.gas-kinetic
  pace: quick
  given:
    K:
      pick:
      - 0.5
      - 2
      - 10
    P:
      pick:
      - 0.1
      - 0.5
      - 2
  prompt: A gas adsorbs with Langmuir constant K = {{K}} atm⁻¹. What fraction of sites is covered at {{P}} atm?
  parts:
  - ask: Answer
    label: v
    tex: \theta
    value: K*P/(1 + K*P)
    tol: 0.005
    explain: 'θ/(1 − θ) = KP: adsorption balances desorption on equal, independent sites'
  verify:
    expect:
      v: solve(Eq(x/(1 - x), nsimplify(K)*nsimplify(P)), x)[0]
- template: pc-langmuir-pressure
  skill: kinetics.gas-kinetic
  pace: quick
  given:
    K:
      pick:
      - 0.5
      - 2
      - 10
    th:
      pick:
      - 0.5
      - 0.75
      - 0.9
  prompt: A surface has Langmuir constant K = {{K}} atm⁻¹. At what pressure, in atm, is the coverage {{th}}?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: th/(K*(1 - th))
    tol: 0.005
    explain: 'P = θ/[K(1 − θ)]: half coverage at P = 1/K'
  verify:
    expect:
      v: solve(Eq(nsimplify(K)*x/(1 + nsimplify(K)*x), nsimplify(th)), x)[0]
- template: pc-hamiltonian-terms
  skill: quantum.bonding
  pace: quick
  cases:
  - mol: H₂
    nN: 2
    ne: 2
  - mol: H₂⁺
    nN: 2
    ne: 1
  - mol: HeH⁺
    nN: 2
    ne: 2
  - mol: LiH
    nN: 2
    ne: 4
  - mol: H₃⁺
    nN: 3
    ne: 2
  prompt: How many Coulomb potential-energy terms are in the molecular Hamiltonian of {{mol}} (all electrons, nuclei not yet fixed)?
  parts:
  - ask: Answer
    label: v
    tex: N
    value: ne*(ne - 1)/2 + ne*nN + nN*(nN - 1)/2
    final: true
    tol: 0.0001
    explain: 'Every pair of charges interacts once: electron–electron, electron–nucleus and nucleus–nucleus'
  verify:
    expect:
      v: binomial(ne, 2) + ne*nN + binomial(nN, 2)
- template: pc-born-oppenheimer
  skill: quantum.bonding
  pace: quick
  cases:
  - q: What does the Born–Oppenheimer approximation do?
    o1: Solves for electrons with the nuclei held fixed, giving a potential energy surface
    o2: Ignores electron–electron repulsion
    o3: Treats electrons classically
    o4: Fixes the electrons and moves the nuclei
  - q: Why is it a good approximation?
    o1: Nuclei are thousands of times heavier and move far more slowly
    o2: Electrons are heavier
    o3: Nuclei have no charge
    o4: It is exact for all molecules
  - q: Why do H₂ and D₂ share the same potential energy curve?
    o1: The electronic problem does not depend on nuclear mass
    o2: They have the same vibrational levels
    o3: D has no neutron
    o4: Isotopes change the electrons
  - q: When does the approximation break down?
    o1: Where two electronic surfaces nearly cross
    o2: For all diatomics
    o3: At low temperature
    o4: Only for ions
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'BO separates fast electrons from slow nuclei: the electronic energy at each geometry is the surface the nuclei move on'
  verify:
    authored: true

# Generated by scripts/second_types.py from scripts/second_specs/mt2.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: mt-blend-mn
  skill: materials.polymers
  pace: quick
  given:
    m1:
      pick:
      - 10
      - 20
      - 50
    m2:
      pick:
      - 100
      - 200
  prompt: Equal masses of two monodisperse samples, M = {{m1}} and {{m2}} kg/mol, are blended. What is M_n of the blend, in kg/mol?
  parts:
  - ask: Answer
    label: v
    tex: M_n
    value: 2/(1/m1 + 1/m2)
    tol: 0.005
    explain: 'Per kilogram of each, the number of chains is 1/M: M_n = total mass ÷ total moles, a harmonic mean pulled toward the short chains'
  verify:
    expect:
      v: (1 + 1)/(Rational(1, m1) + Rational(1, m2))
- template: mt-carothers-reverse
  skill: materials.polymers
  pace: quick
  given:
    Xn:
      pick:
      - 20
      - 50
      - 100
      - 200
  prompt: A step-growth polymerisation of a 1:1 A–A/B–B mixture must reach a number-average degree of polymerisation of {{Xn}}. What fractional conversion p is needed?
  parts:
  - ask: Answer
    label: v
    tex: p
    value: 1 - 1/Xn
    tol: 0.005
    explain: 'Carothers: X_n = 1/(1 − p), so high polymer needs p above 0.99: why step growth demands exact stoichiometry and purity'
  verify:
    expect:
      v: solve(Eq(1/(1 - x), Xn), x)[0]
- template: mt-growth-evidence
  skill: materials.polymers
  pace: quick
  cases:
  - q: Early in a reaction, high-molar-mass chains already exist alongside unreacted monomer. Which mechanism?
    o1: Chain growth
    o2: Step growth
    o3: Both equally
    o4: Neither
  - q: Monomer disappears quickly but molar mass stays low until conversion is near 99%. Which mechanism?
    o1: Step growth
    o2: Chain growth
    o3: Living anionic
    o4: Free radical
  - q: Which polymerisation releases a small molecule such as water at each linkage?
    o1: Condensation (a step-growth type)
    o2: Free-radical addition
    o3: Ring-opening of an epoxide by an initiator
    o4: Anionic addition
  - q: A living anionic polymerisation is stopped and more monomer added; chains keep growing. What does that show?
    o1: Chain ends stay active (no termination)
    o2: Step growth
    o3: Crosslinking
    o4: Depolymerisation
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Chain growth builds long chains one at a time; step growth builds everything slowly together
  verify:
    authored: true
- template: mt-thermoset-evidence
  skill: materials.polymers
  pace: quick
  cases:
  - q: A cured epoxy chars instead of melting when heated. Why?
    o1: Covalent crosslinks form a network that cannot flow
    o2: Its chains are too short
    o3: It is a thermoplastic
    o4: It contains water
  - q: A plastic swells in a good solvent but does not dissolve. What does that suggest?
    o1: A crosslinked (thermoset or elastomer) network
    o2: A low molar mass thermoplastic
    o3: A crystal
    o4: A ceramic
  - q: Why can PET bottles be remelted and reformed?
    o1: PET is a thermoplastic of linear chains
    o2: PET is crosslinked
    o3: PET is a thermoset
    o4: PET is an elastomer only
  - q: Dental composites cure into which kind of polymer?
    o1: A crosslinked thermoset network of dimethacrylates
    o2: A linear thermoplastic
    o3: A natural rubber
    o4: A silicone oil
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Thermoplastics are linear or branched and flow when hot; thermosets are networks that only degrade
  verify:
    authored: true
- template: mt-elongation
  skill: materials.solids
  pace: quick
  given:
    L:
      pick:
      - 0.5
      - 1
      - 2
    A:
      pick:
      - 20
      - 50
      - 100
    E:
      pick:
      - 70
      - 110
      - 200
    F:
      pick:
      - 5
      - 10
      - 20
  prompt: A rod {{L}} m long with cross-section {{A}} mm² and Young's modulus {{E}} GPa carries a tensile load of {{F}} kN. How much does it stretch, in mm?
  parts:
  - ask: Answer
    label: v
    tex: \Delta L
    value: F*1000*L/(E*1e9*A*1e-6)*1000
    tol: 0.005
    explain: Stress = F/A, strain = ΔL/L₀, E = stress/strain, so ΔL = FL₀/(EA)
  verify:
    expect:
      v: solve(Eq(nsimplify(E)*10**9, (F*1000/(nsimplify(A)/10**6))/(x/1000/nsimplify(L))), x)[0]
- template: mt-gap-from-emission
  skill: materials.solids
  pace: quick
  given:
    lam:
      pick:
      - 450
      - 525
      - 620
      - 850
  prompt: An LED emits at {{lam}} nm. What is the band gap of its semiconductor, in eV?
  parts:
  - ask: Answer
    label: v
    tex: E_g
    value: 1239.841984/lam
    tol: 0.005
    explain: 'E = hc/λ with hc = 1239.84 eV·nm: blue LEDs need wide gaps (GaN), red and infrared narrower ones'
  verify:
    expect:
      v: Rational(1239841984, 10**6)/lam
- template: col-grahame-scale
  skill: materials.colloids
  pace: quick
  given:
    c1:
      pick:
      - 1
      - 10
    c2:
      pick:
      - 4
      - 100
      - 1000
  prompt: At fixed surface potential, by what factor does the Grahame surface charge density change when 1:1 salt concentration rises from {{c1}} to {{c2}} mM?
  parts:
  - ask: Answer
    label: v
    tex: \sigma_2/\sigma_1
    value: sqrt(c2/c1)
    tol: 0.005
    explain: 'σ ∝ √n∞ at fixed ψ₀ (the sinh term does not change): more salt packs the countercharge closer, so the surface holds more charge'
  verify:
    expect:
      v: col_grahame(50, c2)/col_grahame(50, c1)
- template: col-hamaker-same
  skill: materials.colloids
  pace: quick
  given:
    a11:
      pick:
      - 40
      - 65
      - 150
    a33:
      pick:
      - 37
      - 50
  prompt: Two identical particles with A₁₁ = {{a11}} zJ interact across a medium with A₃₃ = {{a33}} zJ. Estimate A₁₃₁ with the combining rule, in zJ.
  parts:
  - ask: Answer
    label: v
    tex: A_{131}
    value: (sqrt(a11) - sqrt(a33))^2
    tol: 0.005
    explain: 'A₁₃₁ ≈ (√A₁₁ − √A₃₃)²: never negative, so identical particles always attract, weakly when the medium matches them'
  verify:
    expect:
      v: a11 + a33 - 2*sqrt(a11*a33)
- template: col-edl-decay
  skill: materials.colloids
  pace: quick
  given:
    U1:
      pick:
      - 10
      - 20
      - 40
    D1:
      pick:
      - 2
      - 5
    k:
      pick:
      - 1
      - 3
      - 10
    D2:
      pick:
      - 8
      - 12
  prompt: The double-layer repulsion between two spheres is {{U1}} k_BT at a gap of {{D1}} nm. The Debye length is {{k}} nm. In the weak-overlap limit, what is it at {{D2}} nm?
  parts:
  - ask: Answer
    label: v
    tex: U
    value: U1*exp(-(D2 - D1)/k)
    tol: 0.005
    explain: 'Weak overlap: U ∝ e^(−κD), so each Debye length of extra gap divides the repulsion by e'
  verify:
    expect:
      v: nsimplify(U1)*exp(-(D2 - D1)/nsimplify(k))
- template: col-diffusion-time
  skill: materials.colloids
  pace: quick
  given:
    Dc:
      pick:
      - 0.5
      - 2
      - 10
    xx:
      pick:
      - 1
      - 5
      - 20
  prompt: A particle has diffusion coefficient {{Dc}} µm²/s. Roughly how long, in s, does it take to wander {{xx}} µm (3-D, ⟨r²⟩ = 6Dt)?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: xx^2/(6*Dc)
    tol: 0.005
    explain: 'Diffusion time grows with the square of distance: ten times farther takes a hundred times longer'
  verify:
    expect:
      v: solve(Eq(6*nsimplify(Dc)*x, xx**2), x)[0]
- template: col-coag-scale
  skill: materials.colloids
  pace: quick
  given:
    t:
      pick:
      - 60
      - 600
    f:
      pick:
      - 2
      - 10
      - 0.5
  prompt: Rapid coagulation of a dispersion has a half-life of {{t}} s. What is it if the particle concentration is {{f}}-fold and the temperature unchanged?
  parts:
  - ask: Answer
    label: v
    tex: t_{1/2}
    value: t/f
    tol: 0.005
    explain: 't₁/₂ = 3η/(4k_BT n₀): halving time with every doubling of concentration, because collisions scale with n₀'
  verify:

# Generated by scripts/second_types.py from scripts/second_specs/fm.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: fm-dynamic-from-kinematic
  skill: fm.statics
  pace: quick
  given:
    nu:
      pick:
      - 10
      - 46
      - 100
      - 320
    sg:
      pick:
      - 0.85
      - 0.88
      - 0.92
  prompt: An oil has kinematic viscosity {{nu}} cSt (mm²/s) and specific gravity {{sg}}. What is its dynamic viscosity, in mPa·s?
  parts:
  - ask: Answer
    label: v
    tex: \mu
    value: nu*sg
    tol: 0.005
    explain: 'μ = ρν: with ν in mm²/s and ρ in g/cm³ the numbers multiply straight into mPa·s'
  verify:
    expect:
      v: solve(Eq(x/1000/(nsimplify(sg)*1000), nsimplify(nu)/10**6), x)[0]
- template: fm-push-under-force
  skill: fm.statics
  pace: quick
  given:
    V:
      pick:
      - 2
      - 5
      - 10
    rho:
      pick:
      - 300
      - 600
      - 850
  prompt: A {{V}} L block of density {{rho}} kg/m³ floats in water (1000 kg/m³). What downward force, in N, holds it fully submerged? (g = 9.81 m/s²)
  parts:
  - ask: Answer
    label: v
    tex: F
    value: (1000 - rho)*9.81*V/1000
    tol: 0.005
    explain: Fully submerged, buoyancy is the weight of the whole displaced volume; the push makes up the difference from the block's weight
  verify:
    expect:
      v: solve(Eq(x + rho*Rational(981, 100)*Rational(V, 1000), 1000*Rational(981, 100)*Rational(V, 1000)), x)[0]
- template: fm-max-laminar-speed
  skill: fm.regimes
  pace: quick
  given:
    D:
      pick:
      - 10
      - 25
      - 50
  cases:
  - fl: Water
    nu: 1.0
  - fl: Light oil
    nu: 30
  - fl: Glycerol
    nu: 1100
  prompt: '{{fl}} ($\nu$ = {{nu}} mm²/s) flows in a {{D}} mm pipe. Up to what mean speed, in m/s, does the flow stay laminar (Re ≤ 2300)?'
  parts:
  - ask: Answer
    label: v
    tex: V
    value: 2300*nu*1e-6/(D/1000)
    tol: 0.005
    explain: Water goes turbulent at a few cm/s in ordinary pipes, which is why most water flow is turbulent and most oil and syrup flow is not
  verify:
    expect:
      v: solve(Eq(x*Rational(D, 1000)/(nsimplify(nu)/10**6), 2300), x)[0]
- template: fm-npsh-available
  skill: fm.energy
  pace: quick
  given:
    z:
      pick:
      - 1
      - 2
      - 3
    hl:
      pick:
      - 0.5
      - 1
  cases:
  - T: 20
    pv: 2.34
    s: 1
    dir: above
  - T: 20
    pv: 2.34
    s: -1
    dir: below
  - T: 60
    pv: 19.9
    s: 1
    dir: above
  - T: 60
    pv: 19.9
    s: -1
    dir: below
  - T: 80
    pv: 47.4
    s: 1
    dir: above
  - T: 80
    pv: 47.4
    s: -1
    dir: below
  prompt: A pump draws water at {{T}} °C (vapour pressure {{pv}} kPa, ρ = 1000 kg/m³) from an open tank at 101.3 kPa. The water surface is {{z}} m {{dir}} the pump inlet and suction losses are {{hl}} m. What NPSH is available, in m?
  parts:
  - ask: Answer
    label: v
    tex: NPSH_A
    value: (101.3 - pv)*1000/(1000*9.81) + s*z - hl
    tol: 0.005
    explain: Positive z is a flooded suction (surface above the pump). Hot water's vapour pressure eats the margin fast; if NPSH_A falls below the pump's NPSH_R it cavitates
  verify:
    expect:
      v: (Rational(1013, 10) - nsimplify(pv))*1000/(1000*Rational(981, 100)) + s*z - nsimplify(hl)
- template: fm-orifice-flow
  skill: fm.measurement
  pace: quick
  given:
    d:
      pick:
      - 25
      - 40
    D:
      pick:
      - 50
      - 80
    dp:
      pick:
      - 5
      - 20
      - 50
  require:
  - d/D < 0.75
  prompt: An orifice of diameter {{d}} mm in a {{D}} mm water pipe (C_d = 0.61) shows a pressure drop of {{dp}} kPa. What is the flow rate, in L/s?
  parts:
  - ask: Answer
    label: v
    tex: Q
    value: 0.61*pi/4*(d/1000)^2*sqrt(2*dp*1000/(1000*(1 - (d/D)^4)))*1000
    tol: 0.005
    explain: Bernoulli plus continuity between the pipe and the vena contracta gives the ideal flow; C_d absorbs the contraction and losses. Orifices are cheap but waste most of that pressure drop
  verify:
    expect:
      v: Rational(61, 100)*Max(*solve(Eq(nsimplify(dp)*1000, Rational(1, 2)*1000*((x/(pi/4*(Rational(d, 1000))**2))**2 - (x/(pi/4*(Rational(D, 1000))**2))**2)), x))*1000
- template: fm-moving-plate-jet
  skill: fm.momentum
  pace: quick
  given:
    A:
      pick:
      - 5
      - 10
      - 20
    V:
      pick:
      - 15
      - 25
    u:
      pick:
      - 5
      - 10
  prompt: A water jet ({{A}} cm², {{V}} m/s) strikes a flat plate head-on while the plate recedes at {{u}} m/s. What force acts on the plate, in N?
  parts:
  - ask: Answer
    label: v
    tex: F
    value: 1000*A/10000*(V - u)^2
    tol: 0.005
    explain: In the plate's frame the jet arrives at V − u and the mass reaching the plate per second shrinks too, so force goes as (V − u)²
  verify:
    expect:
      v: 1000*Rational(A, 10000)*(V - u)*(V - u)
- template: fm-vane-resultant
  skill: fm.momentum
  pace: quick
  given:
    mq:
      pick:
      - 5
      - 10
      - 20
    V:
      pick:
      - 10
      - 20
    th:
      pick:
      - 60
      - 90
      - 120
      - 180
  prompt: A vane turns a water jet (ρQ = {{mq}} kg/s, speed {{V}} m/s, unchanged in magnitude) through {{th}}°. What is the magnitude of the force on the vane, in N?
  parts:
  - ask: Answer
    label: v
    tex: '|F|'
    value: mq*V*sqrt(2*(1 - cos(th*pi/180)))
    tol: 0.005
    explain: The force is ṁ times the vector change in velocity; turning the jet back on itself (180°) doubles the head-on force
  verify:
    expect:
      v: mq*V*sqrt((1 - cos(th*pi/180))**2 + sin(th*pi/180)**2)
- template: fm-couette-dissipation
  skill: fm.viscous
  pace: quick
  given:
    mu:
      pick:
      - 0.05
      - 0.2
      - 0.5
    h:
      pick:
      - 0.5
      - 1
      - 2
    V:
      pick:
      - 1
      - 3
      - 5
  prompt: Oil ($\mu$ = {{mu}} Pa·s) fills a {{h}} mm gap; one plate slides at {{V}} m/s. What power per square metre is dissipated, in W/m²?
  parts:
  - ask: Answer
    label: v
    tex: P/A
    value: mu*V^2/(h/1000)
    tol: 0.005
    explain: 'The work done by the shear stress, τV, all turns into heat: viscous dissipation μ(du/dy)² integrated over the gap'
  verify:
    expect:
      v: integrate(nsimplify(mu)*(V/(nsimplify(h)/1000))**2, (Symbol('yy'), 0, nsimplify(h)/1000))
- template: fm-film-thickness
  skill: fm.viscous
  pace: quick
  given:
    G:
      pick:
      - 0.01
      - 0.05
      - 0.1
  prompt: Water ($\mu$ = 1.0 mPa·s, ρ = 1000 kg/m³) runs down a vertical wall at {{G}} kg/s per metre of width in laminar flow. How thick is the film, in mm?
  parts:
  - ask: Answer
    label: v
    tex: \delta
    value: (3*1e-3*G/(1000^2*9.81))^(1/3)*1000
    tol: 0.005
    explain: 'Integrating the half-parabola gives Γ = ρ²gδ³/(3μ): thickness grows only as the cube root of the flow'
  verify:
    expect:
      v: solve(Eq(1000*integrate(1000*Rational(981, 100)/Rational(1, 1000)*(Symbol('dd')*Symbol('yy') - Symbol('yy')**2/2), (Symbol('yy'), 0, Symbol('dd'))).subs(Symbol('dd'), x/1000), nsimplify(G)), x)[0]
- template: fm-incompressible-check
  skill: fm.viscous
  pace: quick
  given:
    a:
      int:
      - -3
      - 3
    b:
      int:
      - -2
      - 2
    c:
      int:
      - -2
      - 2
    d:
      int:
      - -3
      - 3
  prompt: A 2-D flow has u = {{a}}x + {{b}}y and v = {{c}}x + {{d}}y. Could it be an incompressible flow?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes: ∂u/∂x + ∂v/∂y = 0'
    - 'No: the divergence is not zero'
    correct: 'a + d == 0 ? 0 : 1'
    explain: Incompressibility is a zero divergence; the cross terms (b, c) only shear and rotate the fluid
  verify:
    choices:
      v: 0 if diff(a*Symbol('xx') + b*Symbol('yy'), Symbol('xx')) + diff(c*Symbol('xx') + d*Symbol('yy'), Symbol('yy')) == 0 else 1

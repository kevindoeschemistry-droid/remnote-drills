- template: fm-group-exponent
  skill: fm.similarity
  pace: quick
  cases:
  - grp: $\Delta p\,\rho^{-1}V^{b}$
    bb: -2
  - grp: $V\,(gL)^{b}$
    bb: -0.5
  - grp: $\rho V^2 L\,\sigma^{b}$ (σ surface tension)
    bb: -1
  - grp: $F\,\rho^{-1}V^{-2}L^{b}$
    bb: -2
  prompt: Find the exponent b that makes {{grp}} dimensionless.
  parts:
  - ask: Answer
    label: v
    tex: b
    value: bb
    tol: 0.005
    explain: 'Balance mass, length and time exponents: these build the Euler, Froude, Weber and force-coefficient groups'
  verify:
    expect:
      v: nsimplify(bb)
- template: fm-froude-model
  skill: fm.similarity
  pace: quick
  given:
    Lp:
      pick:
      - 100
      - 150
    s:
      pick:
      - 25
      - 50
      - 100
    Vp:
      pick:
      - 8
      - 10
      - 12
  prompt: A ship {{Lp}} m long is tested as a 1:{{s}} model. With Froude similarity, what model speed, in m/s, matches a full-scale speed of {{Vp}} m/s?
  parts:
  - ask: Answer
    label: v
    tex: V_m
    value: Vp/sqrt(s)
    tol: 0.005
    explain: Wave-making is gravity-driven, so Froude number is matched and Reynolds number is not; the friction part is corrected separately
  verify:
    expect:
      v: Max(*solve(Eq(x**2/(Rational(981, 100)*nsimplify(Lp)/s), nsimplify(Vp)**2/(Rational(981, 100)*nsimplify(Lp))), x))

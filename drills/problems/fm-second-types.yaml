- template: fm-center-of-pressure
  skill: fm.statics
  pace: quick
  given:
    h:
      pick:
      - 1
      - 2
      - 3
    d0:
      pick:
      - 0
      - 0.5
      - 2
  prompt: A vertical rectangular gate {{h}} m tall has its top edge {{d0}} m below the water surface. How deep, in m, is its centre of pressure?
  parts:
  - ask: Answer
    label: v
    tex: y_{cp}
    value: (d0 + h/2) + (h^3/12)/((d0 + h/2)*h)
    tol: 0.005
    explain: 'Pressure grows with depth, so the resultant acts below the centroid: at 2h/3 when the gate reaches the surface, approaching the centroid as it sinks deeper'
  verify:
    expect:
      v: integrate(Symbol('yy')**2, (Symbol('yy'), nsimplify(d0), nsimplify(d0) + h))/integrate(Symbol('yy'), (Symbol('yy'), nsimplify(d0), nsimplify(d0) + h))

- template: fm-stokes-max-diameter
  skill: fm.external
  pace: quick
  given:
    rp:
      pick:
      - 1500
      - 2650
      - 7800
  prompt: Particles of density {{rp}} kg/m³ settle in water (1000 kg/m³, μ = 1.0 mPa·s). Up to what diameter, in μm, does Stokes' law hold (Re ≤ 1)? (g = 9.81)
  parts:
  - ask: Answer
    label: v
    tex: d_{max}
    value: (18*(1e-3)^2/(1000*(rp - 1000)*9.81))^(1/3)*1e6
    tol: 0.005
    explain: 'Re grows as d³ under Stokes settling: sand stays in the Stokes regime only below about 100 μm'
  verify:
    expect:
      v: solve(Eq(1000*((rp - 1000)*Rational(981, 100)*(x/10**6)**2/(18*Rational(1, 1000)))*(x/10**6)/Rational(1, 1000), 1), x)[0]
- template: fm-laminar-split
  skill: fm.piping
  pace: quick
  given:
    d1:
      pick:
      - 10
      - 20
    L1:
      pick:
      - 5
      - 10
    d2:
      pick:
      - 10
      - 15
      - 30
    L2:
      pick:
      - 5
      - 20
  prompt: 'Laminar flow splits between two parallel pipes: pipe 1 is {{d1}} mm and {{L1}} m, pipe 2 is {{d2}} mm and {{L2}} m. What fraction goes through pipe 1?'
  parts:
  - ask: Answer
    label: v
    tex: Q_1/Q
    value: (d1^4/L1)/(d1^4/L1 + d2^4/L2)
    tol: 0.005
    explain: Equal pressure drop across both; Hagen–Poiseuille resistance ∝ L/D⁴, so diameter dominates
  verify:
    expect:
      v: solve(Eq(x*128/(pi*d1**4)*L1, (1 - x)*128/(pi*d2**4)*L2), x)[0]
- template: fm-affinity-speed
  skill: fm.piping
  pace: quick
  given:
    H1:
      pick:
      - 20
      - 30
    N1:
      pick:
      - 1450
      - 1750
    H2:
      pick:
      - 15
      - 40
      - 50
  prompt: A pump makes {{H1}} m of head at {{N1}} rpm. What speed, in rpm, gives {{H2}} m (same impeller, similar operating point)?
  parts:
  - ask: Answer
    label: v
    tex: N_2
    value: N1*sqrt(H2/H1)
    tol: 0.005
    explain: 'Head ∝ N², flow ∝ N, power ∝ N³: a small speed change shifts power a lot'
  verify:
    expect:
      v: Max(*solve(Eq(nsimplify(H2)/nsimplify(H1), (x/N1)**2), x))

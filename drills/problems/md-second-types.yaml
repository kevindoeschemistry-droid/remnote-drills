- template: md-leapfrog-step
  skill: md.integration
  pace: quick
  given:
    k:
      pick:
      - 1
      - 4
    x0:
      pick:
      - 0.5
      - 1
    v:
      pick:
      - 0
      - 1
      - -0.5
    dt:
      pick:
      - 0.1
      - 0.2
  prompt: A particle of mass 1 has F = −{{k}}x. Leapfrog has x₀ = {{x0}} and v₋½ = {{v}}, with Δt = {{dt}}. What is x₁?
  parts:
  - ask: Answer
    label: r
    tex: x_1
    value: x0 + (v - k*x0*dt)*dt
    tol: 0.005
    explain: 'v½ = v₋½ + a₀Δt, then x₁ = x₀ + v½Δt: the same trajectory as velocity Verlet, with velocities half a step out of phase'
  verify:
    expect:
      r: nsimplify(x0) + nsimplify(dt)*(nsimplify(v) + nsimplify(dt)*(-k*nsimplify(x0)))
- template: md-dof-constraints
  skill: md.integration
  pace: quick
  given:
    N:
      pick:
      - 1500
      - 2500
    nh:
      pick:
      - 750
      - 1200
    w:
      pick:
      - 5000
      - 10000
  prompt: A box holds a protein of {{N}} atoms with {{nh}} bonds to hydrogen constrained, plus {{w}} rigid waters. With centre-of-mass motion removed, how many degrees of freedom are left?
  parts:
  - ask: Answer
    label: v
    tex: N_{df}
    value: 3*(N + 3*w) - nh - 3*w - 3
    final: true
    tol: 0.0001
    explain: 'Each constraint removes one: a rigid water keeps 6 of its 9 (3 translations, 3 rotations). Get this wrong and the reported temperature is wrong'
  verify:
    expect:
      v: 3*N - nh + 6*w - 3

- template: md-berendsen-relax
  skill: md.integration
  pace: quick
  given:
    tau:
      pick:
      - 0.1
      - 1
    T0:
      pick:
      - 250
      - 350
    Tb:
      pick:
      - 300
    t:
      pick:
      - 0.1
      - 0.5
      - 2
  prompt: A Berendsen thermostat with τ = {{tau}} ps pulls a system from {{T0}} K toward {{Tb}} K. What is its temperature after {{t}} ps?
  parts:
  - ask: Answer
    label: v
    tex: T(t)
    value: Tb + (T0 - Tb)*exp(-t/tau)
    tol: 0.005
    explain: Exponential relaxation is fast and robust for equilibration, but it suppresses fluctuations, so Berendsen does not give the canonical ensemble
  verify:
    expect:
      v: Tb + (T0 - Tb)*limit((1 - nsimplify(t)/(Symbol('nn')*nsimplify(tau)))**Symbol('nn'), Symbol('nn'), oo)
- template: md-langevin-diffusion
  skill: md.integration
  pace: quick
  given:
    m:
      pick:
      - 18
      - 100
      - 1000
    g:
      pick:
      - 1
      - 5
      - 10
  prompt: A free particle of mass {{m}} g/mol undergoes Langevin dynamics with γ = {{g}} ps⁻¹ at 300 K. What is its diffusion coefficient D = kT/(mγ), in Å²/ps? (R = 8.314 J/mol·K)
  parts:
  - ask: Answer
    label: v
    tex: D
    value: 8.314*300/(m/1000)/(g*1e12)*1e20/1e12
    tol: 0.005
    explain: 'Friction slows diffusion: a large γ thermostats tightly but distorts transport, which is why production runs use small fbeta'
  verify:
    expect:
      v: integrate(Rational(8314, 1000)*300/(nsimplify(m)/1000)*exp(-nsimplify(g)*10**12*Symbol('tt')), (Symbol('tt'), 0, oo))*10**20/10**12

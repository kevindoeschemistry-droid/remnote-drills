    tex: L
    value: (M*1e4/6.02214076e23/rho)^(1/3)*1e8
    tol: 0.005
    explain: '1 g/cm³ is 0.6022 amu/Å³: a 30 000 g/mol water box of density 1 is about 37 Å on a side'
  verify:

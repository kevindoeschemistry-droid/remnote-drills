- template: md-fnex-three
  skill: md.lambda
  pace: quick
  given:
    t1:
      pick:
      - 90
      - 30
    t2:
      pick:
      - 0
      - -90
    t3:
      pick:
      - -30
      - 45
  prompt: Three substituents have θ = {{t1}}°, {{t2}}° and {{t3}}°. With fnex, λ_i = e^{c sin θ_i}/Σ_j e^{c sin θ_j} and c = 5.5. What is λ₁?
  parts:
  - ask: Answer
    label: v
    tex: \lambda_1
    value: exp(5.5*sin(t1*pi/180))/(exp(5.5*sin(t1*pi/180)) + exp(5.5*sin(t2*pi/180)) + exp(5.5*sin(t3*pi/180)))
    tol: 0.005
    explain: 'A softmax over c sin θ: the λ values always sum to one and stay in (0, 1)'
  verify:
    expect:
      v: 1/(1 + exp(Rational(11, 2)*(sin(pi*t2/180) - sin(pi*t1/180))) + exp(Rational(11, 2)*(sin(pi*t3/180) - sin(pi*t1/180))))
- template: md-fnex-c-needed
  skill: md.lambda
  pace: quick
  given:
    N:
      pick:
      - 2
      - 3
      - 6
    d:
      pick:
      - 1
      - 5
      - 10
  prompt: With N = {{N}} substituents, what fnex constant c lets one λ reach 1 − {{d}} × 10⁻⁵? (λ_max = [1 + (N − 1)e^{−2c}]⁻¹)
  parts:
  - ask: Answer
    label: v
    tex: c
    value: -0.5*log((1/(1 - d*1e-5) - 1)/(N - 1))
    tol: 0.005
    explain: Larger c lets λ get closer to the endpoints but sharpens the landscape between them

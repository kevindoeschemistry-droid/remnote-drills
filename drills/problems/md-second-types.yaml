    qh: 0.417
    r: 0.9572
    th: 104.52
  - m: SPC/E
    qh: 0.4238
    r: 1.0
    th: 109.47
  - m: SPC
    qh: 0.41
    r: 1.0
    th: 109.47
  prompt: The {{m}} water model puts {{qh}} e on each hydrogen at O–H = {{r}} Å and H–O–H = {{th}}°, with the balancing charge on oxygen. What is its dipole moment, in debye? (1 e·Å = 4.803 D)
  parts:
  - ask: Answer
    label: v
    tex: \mu
    value: 2*qh*r*cos(th/2*pi/180)*4.803
    tol: 0.005
    explain: 'About 2.35 D against 1.85 D in the gas: fixed-charge models build in an average polarisation, which is part of why TIP3P diffuses too fast'
  verify:
    expect:
      v: sqrt((2*nsimplify(qh)*nsimplify(r)*cos(nsimplify(th)/2*pi/180))**2 + (nsimplify(qh)*nsimplify(r)*sin(nsimplify(th)/2*pi/180) - nsimplify(qh)*nsimplify(r)*sin(nsimplify(th)/2*pi/180))**2)*Rational(4803, 1000)

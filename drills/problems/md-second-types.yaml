  prompt: Substituents i and j have ΔG_i→j = {{dg}} kcal/mol and fixed biases differing by φ_j − φ_i = {{dphi}} kcal/mol at 298 K. What population ratio P_j/P_i should production show? (kT = 0.593)
  parts:

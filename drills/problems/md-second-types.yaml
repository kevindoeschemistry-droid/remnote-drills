- template: md-minimum-image-3d
  skill: md.boundaries
  pace: quick
  given:
    L:
      pick:
      - 30
      - 40
    dx:
      pick:
      - 25
      - -18
      - 5
    dy:
      pick:
      - -28
      - 12
      - 3
    dz:
      pick:
      - 17
      - -2
  prompt: In a cubic box of side {{L}} Å, two atoms are separated by raw differences Δx = {{dx}}, Δy = {{dy}}, Δz = {{dz}} Å. What is the minimum-image distance, in Å?
  parts:
  - ask: Answer
    label: v
    tex: d
    value: sqrt((dx - L*round(dx/L))^2 + (dy - L*round(dy/L))^2 + (dz - L*round(dz/L))^2)
    tol: 0.005
    explain: Wrap each component into [−L/2, L/2] separately before taking the length
  verify:
    expect:
      v: sqrt(Min((dx % L)**2, (dx % L - L)**2) + Min((dy % L)**2, (dy % L - L)**2) + Min((dz % L)**2, (dz % L - L)**2))

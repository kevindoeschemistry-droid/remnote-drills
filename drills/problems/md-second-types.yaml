      pick:
      - 1
      - 1.5
    c:
      pick:
      - 0.2
      - 2
    d:
      pick:
      - 0.8
      - 0.3
  prompt: After superposition, four atoms are displaced by {{a}}, {{b}}, {{c}} and {{d}} Å. What is the RMSD, in Å?
  parts:

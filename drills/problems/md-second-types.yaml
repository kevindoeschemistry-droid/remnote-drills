- template: md-fluctuation-formulas
  skill: md.statmech
  pace: recall
  cases:
  - q: Which free energy does a potential of mean force W(ξ) become when integrated over the whole coordinate?
    o1: 'The free energy of the state: −kT ln of the integral of exp(−βW) over ξ'
    o2: The enthalpy
    o3: The internal energy
    o4: 'Nothing: it is only a relative curve'
  - q: Why is the Gibbs-vs-Helmholtz distinction small for binding in water?
    o1: PΔV is tiny for condensed-phase processes
    o2: Water is incompressible, so A = G exactly
    o3: Binding happens at constant volume
    o4: 'It is not small: they differ by kT'
  - q: A PMF along a distance must be corrected by what to compare with a binding constant?
    o1: The Jacobian (2kT ln r) and a standard-state volume
    o2: Nothing
    o3: The temperature
    o4: The cutoff
  - q: What does a flat PMF region mean?
    o1: 'No mean force: all positions there are equally likely'
    o2: No sampling occurred
    o3: Zero free energy everywhere
    o4: A barrier
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: A PMF is a free energy restricted to one coordinate; turning it into a standard binding free energy needs the volume element and a reference concentration
  verify:
    authored: true
- template: md-charmm-lj-pair
  skill: md.forcefields
  pace: quick
  given:
    ei:
      pick:
      - 0.11
      - 0.152
    ri:
      pick:
      - 2.0
      - 1.77
    ej:
      pick:
      - 0.07
      - 0.12
    rj:
      pick:
      - 1.99
      - 1.7
    r:
      pick:
      - 3.5
      - 4
      - 5
  prompt: In CHARMM, atom i has ε = {{ei}} and R_min/2 = {{ri}} Å; atom j has ε = {{ej}} and R_min/2 = {{rj}} Å. What is their LJ energy at r = {{r}} Å, in kcal/mol?
  parts:
  - ask: Answer
    label: v
    tex: U_{LJ}
    value: sqrt(ei*ej)*(((ri + rj)/r)^12 - 2*((ri + rj)/r)^6)
    tol: 0.005
    explain: 'Lorentz–Berthelot in CHARMM form: R_min,ij = R_min,i/2 + R_min,j/2 and ε_ij = √(ε_iε_j); the energy is −ε at R_min'
  verify:
    expect:
      v: sqrt(nsimplify(ei)*nsimplify(ej))*(((nsimplify(ri) + nsimplify(rj))/nsimplify(r))**6 - 1)**2 - sqrt(nsimplify(ei)*nsimplify(ej))

    value: n/(w/55.5)*1000
    tol: 0.005
    explain: 'About 1 ion pair per 370 waters makes 150 mM: small boxes give coarse salt steps'
  verify:
    expect:
      v: solve(Eq(x/1000*w/Rational(555, 10), n), x)[0]
- template: md-temperature-from-rms
  skill: md.prep
  pace: quick
  given:
    M:
      pick:
      - 1.008
      - 12.011
      - 15.999
    v:
      pick:
      - 5
      - 10
      - 25
  prompt: Atoms of {{M}} g/mol have a 3-D rms speed of {{v}} Å/ps. What temperature, in K? (R = 8.314 J/mol·K; 1 Å/ps = 100 m/s)
  parts:
  - ask: Answer
    label: r
    tex: T
    value: (v*100)^2*(M/1000)/(3*8.314)
    tol: 0.005
    explain: '⟨v²⟩ = 3kT/m: hydrogens move about 3.5 times faster than oxygens at the same temperature'
  verify:
    expect:
      r: solve(Eq(sqrt(3*Rational(8314, 1000)*x/(nsimplify(M)/1000)), nsimplify(v)*100), x)[0]
- template: md-g-from-tau
  skill: md.analysis
  pace: quick
  given:
    tau:
      pick:
      - 1
      - 5
      - 20
    dt:
      pick:
      - 0.1
      - 1
      - 2
  prompt: A quantity has integrated correlation time τ = {{tau}} ps and is saved every {{dt}} ps. What is its statistical inefficiency g = 1 + 2τ/Δt?
  parts:
  - ask: Answer
    label: v
    tex: g
    value: 1 + 2*tau/dt
    tol: 0.005
    explain: 'Saving more often than τ adds frames but not information: g counts how many frames make one independent sample'
  verify:
    expect:
      v: 1 + 2/nsimplify(dt)*integrate(exp(-Symbol('tt')/nsimplify(tau)), (Symbol('tt'), 0, oo))
- template: md-standard-error-g
  skill: md.analysis
  pace: quick
  given:
    N:
      pick:
      - 1000
      - 10000
      - 50000
    s:
      pick:
      - 1
      - 2.5
    g:
      pick:
      - 10
      - 50
      - 200
  prompt: A run gives N = {{N}} frames with standard deviation σ = {{s}} kcal/mol and statistical inefficiency g = {{g}}. What is the standard error of the mean, in kcal/mol?
  parts:
  - ask: Answer
    label: v
    tex: \sigma_{\bar x}
    value: s*sqrt(g/N)
    tol: 0.005
    explain: 'N/g effective samples: ignoring correlation understates error bars by √g'
  verify:
    expect:
      v: nsimplify(s)/sqrt(Rational(N, g))
- template: md-block-scaling
  skill: md.analysis
  pace: quick
  given:
    s:
      pick:
      - 0.2
      - 0.5
      - 1
    f:
      pick:
      - 4
      - 9
      - 16
  prompt: Block averaging over a converged run gives a standard error of {{s}} kcal/mol. What standard error should a run {{f}} times longer give?
  parts:
  - ask: Answer
    label: v
    tex: \sigma'
    value: s/sqrt(f)
    tol: 0.005
    explain: 'Error falls as 1/√(length) once blocks are independent: quartering the error costs 16 times the sampling'
  verify:
    expect:
      v: nsimplify(s)*sqrt(Rational(1, f))
- template: md-trials-needed
  skill: md.analysis
  pace: quick
  given:
    s:
      pick:
      - 0.5
      - 1
      - 1.5
    h:
      pick:
      - 0.2
      - 0.3
      - 0.5
  prompt: Trials scatter with standard deviation {{s}} kcal/mol. About how many are needed for a 95% half-width of {{h}} kcal/mol? (Use 1.96 for large n.)
  parts:
  - ask: Answer
    label: v
    tex: n
    value: ceil((1.96*s/h)^2)
    final: true
    tol: 0.0001
    explain: Halving the interval costs four times as many trials; for small n the t factor makes it a few more
  verify:
    expect:
      v: ceiling((Rational(196, 100)*nsimplify(s)/nsimplify(h))**2)
- template: md-dg-from-k-error
  skill: md.analysis
  pace: quick
  given:
    K:
      pick:
      - 0.5
      - 2
      - 10
    sk:
      pick:
      - 0.05
      - 0.2
      - 1
  prompt: A ratio K is measured as {{K}} with standard error {{sk}}. What is the propagated error in ΔG = −kT ln K at 298 K, in kcal/mol? (kT = 0.593)
  parts:
  - ask: Answer
    label: v
    tex: \sigma_{\Delta G}
    value: 0.593*sk/K
    tol: 0.005
    explain: 'A 10% error in K is about 0.06 kcal/mol: free energies tolerate large relative errors in populations'
  verify:
    expect:
      v: Abs(diff(-Rational(593, 1000)*log(Symbol('KK')), Symbol('KK')).subs(Symbol('KK'), nsimplify(K)))*nsimplify(sk)
- template: md-zwanzig-reverse
  skill: md.free-energy
  pace: quick
  given:
    dA:
      pick:
      - -3
      - -1
      - 0.5
      - 2
      - 5
  prompt: A perturbation has ΔA = {{dA}} kcal/mol at 298 K. What value of ⟨e^{−βΔU}⟩₀ must the sampling find? (kT = 0.593)
  parts:
  - ask: Answer
    label: v
    tex: \langle e^{-\beta\Delta U}\rangle_0
    value: exp(-dA/0.593)
    tol: 0.005
    explain: 'A ΔA of 5 kcal/mol needs an average of about 2 × 10⁻⁴: dominated by rare low-ΔU samples, which is why big steps fail'
  verify:
    expect:
      v: solve(Eq(-Rational(593, 1000)*log(Symbol('w')), nsimplify(dA)), Symbol('w'))[0]
- template: md-cumulant-correction
  skill: md.free-energy
  pace: quick
  given:
    sd:
      pick:
      - 0.5
      - 1
      - 1.5
      - 2
  prompt: ΔU sampled in state 0 is Gaussian with standard deviation {{sd}} kcal/mol. By how much does the exact ΔA lie below the mean ⟨ΔU⟩, in kcal/mol, at 298 K? (kT = 0.593)
  parts:
  - ask: Answer
    label: v
    tex: \langle\Delta U\rangle - \Delta A
    value: sd^2/(2*0.593)
    tol: 0.005
    explain: For a Gaussian the cumulant series stops at second order, so σ²/2kT is exact; a σ of 2 kcal/mol already shifts ΔA by more than 3 kcal/mol
  verify:
    expect:
      v: Rational(593, 1000)*log(integrate(exp(-Symbol('u')**2/(2*nsimplify(sd)**2))*exp(-Symbol('u')/Rational(593, 1000)), (Symbol('u'), -oo, oo))/(sqrt(2*pi)*nsimplify(sd)))
- template: md-hysteresis
  skill: md.free-energy
  pace: quick
  given:
    f:
      pick:
      - 2.4
      - 3.1
      - -1.2
    r:
      pick:
      - -2.2
      - -1.9
      - 0.9
  prompt: Forward FEP gives ΔA(0→1) = {{f}} and reverse gives ΔA(1→0) = {{r}} kcal/mol. What is the hysteresis |ΔA_f + ΔA_r|?
  parts:
  - ask: Answer
    label: v
    tex: \text{hysteresis}
    value: abs(f + r)
    tol: 0.005
    explain: Forward and reverse must be equal and opposite; a gap above about 1 kT means poor overlap
  verify:
    expect:
      v: Abs(nsimplify(f) - (-nsimplify(r)))
- template: md-ti-simpson
  skill: md.free-energy
  pace: quick
  cases:
  - g0: 10
    g1: 6
    g2: 3
    g3: 1
    g4: 0.5
  - g0: -8
    g1: -5
    g2: -2
    g3: 0.5
    g4: 2
  - g0: 20
    g1: 12
    g2: 8
    g3: 5
    g4: 3
  prompt: ⟨∂U/∂λ⟩ is {{g0}}, {{g1}}, {{g2}}, {{g3}} and {{g4}} kcal/mol at λ = 0, 0.25, 0.5, 0.75, 1. Estimate ΔA with composite Simpson's rule, in kcal/mol.
  parts:
  - ask: Answer
    label: v
    tex: \Delta A
    value: 0.25/3*(g0 + 4*g1 + 2*g2 + 4*g3 + g4)
    tol: 0.005
    explain: Simpson is Richardson extrapolation of two trapezoid estimates; where curvature is strong the two rules disagree, a hint to add windows
  verify:
    expect:
      v: (4*Rational(1, 4)*(nsimplify(g0)/2 + nsimplify(g1) + nsimplify(g2) + nsimplify(g3) + nsimplify(g4)/2) - Rational(1, 2)*(nsimplify(g0)/2 + nsimplify(g2) + nsimplify(g4)/2))/3
- template: md-nonlinear-mixing
  skill: md.free-energy
  pace: quick
  given:
    n:
      pick:
      - 2
      - 4
    d:
      pick:
      - -5
      - 10
      - 50
    l:
      pick:
      - 0.1
      - 0.5
      - 0.9
  prompt: A potential is mixed as U(λ) = U₀ + λ^{{n}}(U₁ − U₀). At a configuration with U₁ − U₀ = {{d}} kcal/mol, what is ∂U/∂λ at λ = {{l}}?
  parts:
  - ask: Answer
    label: v
    tex: \partial U/\partial\lambda
    value: n*l^(n - 1)*d
    tol: 0.005
    explain: Powers of λ soften the start of the path; the integral of ⟨∂U/∂λ⟩ is the same, only its shape changes
  verify:
    expect:
      v: diff(Symbol('U0') + Symbol('lam')**n*nsimplify(d), Symbol('lam')).subs(Symbol('lam'), nsimplify(l))
- template: md-solvent-leg
  skill: md.free-energy
  pace: quick
  given:
    dd:
      pick:
      - -1.5
      - 0.4
      - 2
    gc:
      pick:
      - -3
      - 1.5
      - 4
  prompt: A relative binding ΔΔG of {{dd}} kcal/mol came from a complex leg of {{gc}} kcal/mol. What was the solvent leg?
  parts:
  - ask: Answer
    label: v
    tex: \Delta G_{solv}
    value: gc - dd
    tol: 0.005
    explain: The two legs close a thermodynamic cycle; the unphysical mutation cancels
  verify:
    expect:
      v: solve(Eq(nsimplify(gc) - x, nsimplify(dd)), x)[0]
- template: md-stability-fold
  skill: md.free-energy
  pace: quick
  given:
    dd:
      pick:
      - -2
      - -1
      - 1
      - 3
  prompt: A mutation has ΔΔG_fold = {{dd}} kcal/mol at 298 K. By what factor does it change the folding equilibrium constant? (kT = 0.593)
  parts:
  - ask: Answer
    label: v
    tex: K'/K
    value: exp(-dd/0.593)
    tol: 0.005
    explain: Each 1.36 kcal/mol is a factor of ten; positive ΔΔG_fold means destabilising (smaller K)
  verify:
    expect:
      v: 1/exp(nsimplify(dd)/Rational(593, 1000))
- template: md-cycle-correction
  skill: md.free-energy
  pace: quick
  given:
    e:
      pick:
      - 0.3
      - 0.9
      - -1.2
  prompt: A three-edge cycle A→B→C→A has closure error {{e}} kcal/mol. Spreading it equally, by how much is each edge corrected?
  parts:
  - ask: Answer
    label: v
    tex: \delta
    value: -e/3
    tol: 0.005
    explain: Weighted least squares does better, giving uncertain edges more of the correction; an edge that carries a large share is suspect
  verify:
    expect:
      v: solve(Eq(3*x + nsimplify(e), 0), x)[0]
- template: md-site-volume
  skill: md.free-energy
  pace: quick
  given:
    g:
      pick:
      - 1
      - 2
      - 3
  prompt: What restraint volume, in Å³, makes the standard-state correction −kT ln(V/1661 Å³) equal {{g}} kcal/mol at 298 K? (kT = 0.593)
  parts:
  - ask: Answer
    label: v
    tex: V_{site}
    value: 1661*exp(-g/0.593)
    tol: 0.005
    explain: 'Tighter restraints cost more to release: a few Å³ costs about 3 kcal/mol'
  verify:
    expect:
      v: solve(Eq(-Rational(593, 1000)*log(x/1661), nsimplify(g)), x)[0]
- template: md-fold-change-from-ddg
  skill: md.analysis
  pace: quick

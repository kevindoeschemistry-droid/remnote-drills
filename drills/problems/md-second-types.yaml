  prompt: With Ewald splitting parameter κ = {{k}} Å⁻¹, what fraction of a pair's Coulomb interaction is left in the real-space term at the cutoff r_c = {{rc}} Å, erfc(κr_c)?
  parts:
  - ask: Answer
    label: v

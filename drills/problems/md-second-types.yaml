# Second question types; keys recomputed by sympy along another route.

- template: md-ensemble-fluctuations
  skill: md.statmech
  pace: recall
  cases:
  - q: In an NVT simulation, which quantity fluctuates while the others are fixed?
    o1: The total energy
    o2: The volume
    o3: The number of particles
    o4: The temperature parameter of the bath
  - q: In an NPT simulation, the volume fluctuations measure what?
    o1: The isothermal compressibility
    o2: The heat capacity
    o3: The diffusion coefficient
    o4: The dielectric constant
  - q: In NVT, the variance of the total energy gives what?
    o1: The heat capacity C_V = ⟨δE²⟩/kT²
    o2: The pressure
    o3: The free energy directly
    o4: The compressibility
  - q: In which ensemble does the particle number fluctuate?
    o1: Grand canonical (μVT)
    o2: NVT
    o3: NPT
    o4: NVE
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Each ensemble fixes some variables and lets their conjugates fluctuate; the size of the fluctuation is a response function
  verify:
    authored: true
- template: md-barrier-crossings
  skill: md.statmech
  pace: quick
  given:
    dG:
      pick:
      - 5
      - 8
      - 12
      - 15
    L:
      pick:
      - 0.1
      - 1
      - 10
  prompt: A conformational barrier is ΔG‡ = {{dG}} kcal/mol at 298 K. With an attempt frequency of kT/h = 6.2 × 10¹² s⁻¹, about how many crossings does a {{L}} μs run see?
  parts:
  - ask: Answer
    label: v
    tex: N_{cross}
    value: 6.2e12*exp(-dG/0.593)*L*1e-6
    tol: 0.005
    explain: 'Fewer than about ten crossings means the run is quasi-nonergodic for that coordinate: its averages reflect where it started'
  verify:
    expect:
      v: nsimplify(L)/10**6/(1/(Rational(62, 10)*10**12)*exp(dG/Rational(593, 1000)))
- template: md-kinetic-energy-from-t

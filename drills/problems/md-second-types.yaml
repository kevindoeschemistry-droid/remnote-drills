- template: md-mc-volume-acceptance
  skill: md.prep
  pace: quick
  given:
    dU:
      pick:
      - -1
      - 1
      - 3
    pv:
      pick:
      - 0.2
      - -0.2
    nl:
      pick:
      - 0.5
      - -0.5
      - 1
  prompt: A Monte Carlo barostat proposes V → V′ with ΔU = {{dU}} kT, PΔV = {{pv}} kT and N ln(V′/V) = {{nl}}. What is the acceptance probability, min(1, exp(−ΔU − PΔV + N ln(V′/V)))?
  parts:
  - ask: Answer
    label: v
    tex: P_{acc}
    value: min(1, exp(-dU - pv + nl))
    tol: 0.005
    explain: 'The N ln(V′/V) term is the volume''s entropy: it is what makes the sampled ensemble isobaric rather than isochoric'
  verify:
    expect:
      v: Min(1, exp(-dU)*exp(-nsimplify(pv))*exp(nsimplify(nl)))
- template: md-box-from-density

- template: md-ph-for-fraction
  skill: md.prep
  pace: quick
  given:
    pKa:
      pick:
      - 3.9
      - 6.0
      - 10.5
    f:
      pick:
      - 10
      - 50
      - 90
      - 99
  prompt: A residue has pKa {{pKa}}. At what pH is it {{f}}% protonated?
  parts:
  - ask: Answer
    label: v
    tex: pH
    value: pKa + log10((100 - f)/f)
    tol: 0.005
    explain: 'One pH unit from the pKa is 10/90; two units is 1/99: residues more than two units from the pKa are effectively one state'
  verify:
    expect:
      v: solve(Eq(1/(1 + 10**(x - nsimplify(pKa))), Rational(f, 100)), x)[0]

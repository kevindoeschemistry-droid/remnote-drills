# Generated by scripts/second_types.py from scripts/second_specs/ph3.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: ph-elevator-scale
  skill: physics.dynamics
  pace: quick
  cases:
  - m: 60
    mot: speeding up going up
    sg: 1
    a: 2
  - m: 60
    mot: slowing down going up
    sg: -1
    a: 2
  - m: 75
    mot: speeding up going down
    sg: -1
    a: 1.5
  - m: 75
    mot: slowing down going down
    sg: 1
    a: 1.5
  - m: 50
    mot: in free fall (cable cut), accelerating down
    sg: -1
    a: 9.8
  prompt: A {{m}} kg person stands on a scale in an elevator that is {{mot}} at {{a}} m/s². What does the scale read, in newtons? (g = 9.8 m/s²)
  parts:
  - ask: Answer
    label: v
    tex: N
    value: m*(9.8 + sg*a)
    tol: 0.005
    explain: 'Newton''s second law on the person: N − mg = ma (up positive). Speeding up upward or slowing down downward both mean a points up'
  verify:
    expect:
      v: solve(Eq(x - m*Rational(98, 10), m*sg*nsimplify(a)), x)[0]
- template: ph-weightless
  skill: physics.dynamics
  pace: quick
  cases:
  - q: Astronauts on the space station float. Why?
    o1: They and the station fall together around Earth, so no normal force acts
    o2: Gravity there is zero
    o3: They are outside Earth's field
    o4: The station pushes them up
  - q: A heavy and a light ball dropped together hit the ground together (no air). Which fact explains it?
    o1: Inertial mass equals gravitational mass
    o2: Heavy objects feel less gravity
    o3: Air pushes the light ball
    o4: Gravity depends on volume
  - q: A scale in an elevator reads more than your weight. What do you know?
    o1: The acceleration points upward
    o2: The elevator moves up
    o3: The elevator moves down
    o4: The elevator is at rest
  - q: Where does gravitational force on you from Earth vanish?
    o1: Nowhere outside Earth; it weakens with distance but never becomes zero
    o2: At 100 km altitude
    o3: In orbit
    o4: In an elevator
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Apparent weight is the support force, not the gravitational force
  verify:
    authored: true
- template: ph-g-altitude
  skill: physics.dynamics
  pace: quick
  cases:
  - f: 1/4
    fn: 1
    fd: 4
  - f: 1/9
    fn: 1
    fd: 9
  - f: 1/2
    fn: 1
    fd: 2
  - f: '0.99'
    fn: 99
    fd: 100
  prompt: At what height above Earth's surface, as a fraction of Earth's radius R, does g fall to {{f}} of its surface value?
  parts:
  - ask: Answer
    label: v
    tex: h/R
    value: sqrt(fd/fn) - 1
    tol: 0.005
    explain: g ∝ 1/r², so (R/(R + h))² = f; g drops 1% only at h ≈ 0.005R (about 32 km), which is why g is taken as constant near the surface
  verify:
    expect:
      v: Max(*[r for r in solve(Eq(1/(1 + x)**2, Rational(fn, fd)), x) if r.is_real])
- template: ph-g-inside
  skill: physics.dynamics
  pace: quick
  given:
    gs:
      pick:
      - 9.8
      - 3.7
      - 24.8
    fr:
      pick:
      - 0.25
      - 0.5
      - 0.75
  prompt: Treat a planet as a uniform sphere with surface gravity {{gs}} m/s². What is g at {{fr}} of the way from the centre to the surface?
  parts:
  - ask: Answer
    label: v
    tex: g
    value: gs*fr
    tol: 0.005
    explain: 'Only the mass inside r pulls (shell theorem): M(r) = M r³/R³, so g = GM(r)/r² = g_s · r/R'
  verify:
    expect:
      v: nsimplify(gs)*(nsimplify(fr))**3/nsimplify(fr)**2
- template: ph-springs-combine
  skill: physics.dynamics
  pace: quick
  cases:
  - k1: 200
    k2: 300
    how: parallel (side by side)
    w: 0
  - k1: 200
    k2: 300
    how: series (end to end)
    w: 1
  - k1: 400
    k2: 400
    how: series (end to end)
    w: 1
  - k1: 150
    k2: 50
    how: parallel (side by side)
    w: 0
  prompt: Springs of {{k1}} N/m and {{k2}} N/m are joined in {{how}}. What is the equivalent spring constant, in N/m?
  parts:
  - ask: Answer
    label: v
    tex: k
    value: 'w == 0 ? k1 + k2 : k1*k2/(k1 + k2)'
    tol: 0.005
    explain: Parallel springs share the load and add; series springs carry the same force and their stretches add, so compliances add
  verify:
    expect:
      v: '[k1 + k2, 1/(Rational(1, k1) + Rational(1, k2))][w]'
- template: ph-spring-cut
  skill: physics.dynamics
  pace: quick
  given:
    k:
      pick:
      - 100
      - 250
      - 400
    n:
      pick:
      - 2
      - 3
      - 4
  prompt: A spring of constant {{k}} N/m is cut into {{n}} equal pieces. What is the spring constant of one piece, in N/m?
  parts:
  - ask: Answer
    label: v
    tex: k'
    value: n*k
    final: true
    tol: 0.0001
    explain: 'The whole spring is n pieces in series: 1/k = n/k′, so each piece is n times stiffer'
  verify:
    expect:
      v: solve(Eq(Rational(1, k), n/x), x)[0]
- template: ph-simple-circuit
  skill: physics.circuits
  pace: quick
  cases:
  - q: A switch in a single loop is opened. What happens to the current?
    o1: It stops everywhere in the loop
    o2: It stops only after the switch
    o3: It doubles
    o4: It flows backward
  - q: In a single loop with a battery and two bulbs, how does the current compare at different points?
    o1: The same everywhere
    o2: Largest near the positive terminal
    o3: Used up by the first bulb
    o4: Zero after the second bulb
  - q: A wire is connected directly across one of two series bulbs. What happens?
    o1: That bulb goes out and the other gets brighter
    o2: Both go out
    o3: Both get dimmer
    o4: Nothing changes
  - q: Why does a bulb light only when connected to both battery terminals?
    o1: Charge needs a complete loop to flow
    o2: One terminal holds all the energy
    o3: Bulbs need two wires for heat
    o4: The battery only works upside down
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Current needs a closed path and is the same all around a single loop
  verify:
    authored: true
- template: ph-short-current
  skill: physics.circuits
  pace: quick
  cases:
  - emf: 9
    r: 0.5
    R: 8.5
    case: with the resistor
    w: 0
  - emf: 9
    r: 0.5
    R: 8.5
    case: when shorted
    w: 1
  - emf: 12
    r: 0.2
    R: 5.8
    case: with the resistor
    w: 0
  - emf: 1.5
    r: 0.3
    R: 2.7
    case: when shorted
    w: 1
  prompt: A {{emf}} V battery with internal resistance {{r}} Ω is connected to a {{R}} Ω resistor. What current flows, in A, and how much if a wire shorts the resistor? Give the current {{case}}.
  parts:
  - ask: Answer
    label: v
    tex: I
    value: 'w == 0 ? emf/(R + r) : emf/r'
    tol: 0.005
    explain: I = ε/(R + r); shorting removes R, so only the small internal resistance limits the current, which is why shorts heat batteries
  verify:
    expect:
      v: '[nsimplify(emf)/(nsimplify(R) + nsimplify(r)), nsimplify(emf)/nsimplify(r)][w]'

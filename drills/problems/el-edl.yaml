    tex: \beta\mu_{ex}
    value: -log(w)
    tol: 0.005
    explain: The potential distribution theorem (14.23); in an inhomogeneous fluid ln ρ(z) − ln⟨e^{−βU_t}⟩ must be constant, a check on any simulation
  verify:
    expect:
      v: solve(Eq(exp(-x), nsimplify(w)), x)[0]
- template: el-widom-point
  skill: edl.simulation
  pace: quick
  given:
    eta:
      pick:
      - 0.1
      - 0.3
      - 0.45
  prompt: A point test particle (zero size) is inserted into a hard-sphere fluid at η = {{eta}}. What is its βμ_ex?
  parts:
  - ask: Answer
    label: v
    tex: \beta\mu_{ex}
    value: -log(1 - eta)
    tol: 0.005
    explain: '⟨e^{−βΔU}⟩ is just the free-volume fraction 1 − η: the Widom estimate fails at high density because almost every insertion overlaps'
  verify:
    expect:
      v: log(1/(1 - nsimplify(eta)))
- template: el-collision-time
  skill: edl.simulation
  pace: quick
  given:
    s:
      pick:
      - 1
    r:
      pick:
      - 1.5
      - 2
      - 3
    v:
      pick:
      - 0.5
      - 1
      - 2
  prompt: Two hard spheres with contact distance σ = {{s}} are {{r}} apart along x and approach head-on with relative speed {{v}} (consistent units). When do they collide?
  parts:
  - ask: Answer
    label: y
    tex: t_c
    value: (r - s)/v
    tol: 0.005
    explain: Event-driven MD jumps straight from collision to collision, solving this quadratic for every approaching pair
  verify:
    expect:
      y: Min(*[t for t in solve(Eq((nsimplify(r) - nsimplify(v)*x)**2, s**2), x) if t > 0])
- template: el-collision-offset
  skill: edl.simulation
  pace: quick
  given:
    s:
      pick:
      - 1
    dx:
      pick:
      - 3
      - 5
    dy:
      pick:
      - 0.3
      - 0.6
      - 0.9
    v:
      pick:
      - 0.5
      - 1
      - 2
  prompt: Two hard spheres with contact distance σ = {{s}} are {{dx}} apart along x and {{dy}} along y. They approach along x with relative speed {{v}}. When do they collide?
  parts:
  - ask: Answer
    label: r
    tex: t_c
    value: (dx - sqrt(s^2 - dy^2))/v
    tol: 0.005
    explain: Solve |r + vt| = σ for the smaller root; an impact parameter above σ means they miss
  verify:
    expect:
      r: Min(*solve(Eq((dx - v*x)**2 + nsimplify(dy)**2, nsimplify(s)**2), x))
- template: el-ocp-gamma
  skill: edl.simulation
  pace: quick
  given:
    Z:
      pick:
      - 1
      - 2
      - 10
    a:
      pick:
      - 0.5
      - 1
      - 5
    T:
      pick:
      - 300
      - 1000
      - 10000
  prompt: A one-component plasma of charge Z = {{Z}} has Wigner–Seitz radius {{a}} nm at {{T}} K (vacuum). What is its coupling parameter Γ? (e = 1.602 × 10⁻¹⁹ C, k_B = 1.381 × 10⁻²³ J/K, ε₀ = 8.854 × 10⁻¹² F/m, N_A = 6.022 × 10²³)
  parts:
  - ask: Answer
    label: v
    tex: \Gamma
    value: (Z*1.602176634e-19)^2/(4*pi*8.8541878128e-12*a*1e-9*1.380649e-23*T)
    tol: 0.005
    explain: Γ > 1 means Coulomb energy beats thermal energy and the plasma becomes liquid-like; it crystallises near Γ ≈ 175
  verify:
    expect:
      v: (Z*Rational('1.602176634e-19'))**2/(4*pi*Rational('8.8541878128e-12')*nsimplify(a)/10**9*Rational('1.380649e-23')*T)
- template: el-ocp-gamma-density
  skill: edl.simulation
  pace: quick
  given:
    n:
      pick:
      - 0.001
      - 0.1
      - 10
    T:
      pick:
      - 300
      - 3000
      - 30000
  prompt: A one-component plasma of charge Z = 1 has number density {{n}} nm⁻³ at {{T}} K (vacuum). What is its coupling parameter Γ? (e = 1.602 × 10⁻¹⁹ C, k_B = 1.381 × 10⁻²³ J/K, ε₀ = 8.854 × 10⁻¹² F/m, N_A = 6.022 × 10²³)
  parts:
  - ask: Answer
    label: v
    tex: \Gamma
    value: 1.602176634e-19^2/(4*pi*8.8541878128e-12*(3/(4*pi*n))^(1/3)*1e-9*1.380649e-23*T)
    tol: 0.005
    explain: 'Γ = l_B/a with a the Wigner–Seitz radius: Γ ≫ 1 means strongly coupled, where mean-field (PB) theory fails'
  verify:
    expect:
      v: (Rational('1.602176634e-19')**2/(4*pi*Rational('8.8541878128e-12')*Rational('1.380649e-23')*T))/((3/(4*pi*nsimplify(n)))**Rational(1, 3)/10**9)
- template: el-dh-limiting
  skill: edl.simulation
  pace: quick
  given:
    zp:
      pick:
      - 1
      - 2
    zm:
      pick:
      - 1
      - 2
    I:
      pick:
      - 0.001
      - 0.005
      - 0.01
  prompt: What is the mean activity coefficient of a {{zp}}:{{zm}} salt at ionic strength {{I}} M in water at 25 °C (limiting law)?
  parts:
  - ask: Answer
    label: v
    tex: \gamma_\pm
    value: 10^(-0.509*zp*zm*sqrt(I))
    tol: 0.005
    explain: Simulations of the restricted primitive model test where this limiting law fails, typically above a few mM for 2:2 salts
  verify:
    expect:
      v: exp(-Rational(509, 1000)*zp*zm*sqrt(nsimplify(I))*log(10))
- template: el-ionic-strength
  skill: edl.simulation
  pace: quick
  given:
    c:
      pick:
      - 0.001
      - 0.01
      - 0.1
  cases:
  - salt: NaCl
    np: 1
    zp: 1
    nm: 1
    zm: 1
  - salt: CaCl₂
    np: 1
    zp: 2
    nm: 2
    zm: 1
  - salt: MgSO₄
    np: 1
    zp: 2
    nm: 1
    zm: 2
  - salt: Na₂SO₄
    np: 2
    zp: 1
    nm: 1
    zm: 2
  - salt: AlCl₃
    np: 1
    zp: 3
    nm: 3
    zm: 1
  prompt: What is the ionic strength, in M, of a {{c}} M solution of {{salt}}?
  parts:
  - ask: Answer
    label: v
    tex: I
    value: 0.5*c*(np*zp^2 + nm*zm^2)
    tol: 0.005
    explain: 'I = ½Σc_iz_i²: a 2:2 salt has four times the ionic strength of a 1:1 salt at the same molarity'
  verify:
    expect:
      v: Rational(1, 2)*nsimplify(c)*np*zp**2 + Rational(1, 2)*nsimplify(c)*nm*zm**2
- template: el-picard
  skill: edl.simulation
  pace: quick
  given:
    xk:
      pick:
      - 1
      - 2.5
    g:
      pick:
      - 0.5
      - 3
      - 4
    a:
      pick:
      - 0.05
      - 0.1
      - 0.5
  prompt: A Picard iteration has x^k = {{xk}} and g(x^k) = {{g}}. With mixing parameter α = {{a}}, what is x^{k+1}?
  parts:
  - ask: Answer
    label: v
    tex: x^{k+1}
    value: (1 - a)*xk + a*g
    tol: 0.005
    explain: Small α trades speed for stability; strongly coupled Poisson and Euler–Lagrange equations often need α of a few percent, which is why Newton methods win (16.1.3)
  verify:
    expect:
      v: nsimplify(xk) + nsimplify(a)*(nsimplify(g) - nsimplify(xk))
- template: el-picard-alpha
  skill: edl.simulation
  pace: quick
  given:
    s:
      pick:
      - -3
      - -1
      - 0.5
    b:
      pick:
      - 1
      - 2
  prompt: A Picard map is linear, g(x) = {{s}}x + {{b}}. What mixing parameter α makes the damped iteration x ← (1 − α)x + αg(x) converge in one step?
  parts:
  - ask: Answer
    label: v
    tex: \alpha
    value: 1/(1 - s)
    tol: 0.005
    explain: The error shrinks by |1 − α + αs| per step; strongly negative slopes (oscillating maps) need small α
  verify:
    expect:
      v: solve(Eq(1 - x + x*nsimplify(s), 0), x)[0]
- template: el-newton-pb
  skill: edl.simulation
  pace: quick
  given:
    s:
      pick:
      - 1
      - 3
      - 10
    p0:
      pick:
      - 1
      - 2
  prompt: To find ψ̃ with 2 sinh(ψ̃/2) = {{s}} (Grahame, reduced), take one Newton step from ψ̃₀ = {{p0}}. What is ψ̃₁?
  parts:
  - ask: Answer
    label: v
    tex: \tilde\psi_1
    value: p0 - (2*sinh(p0/2) - s)/cosh(p0/2)
    tol: 0.005
    explain: Newton converges quadratically near the root; in c-DFT the Jacobian couples densities, potential and nonlocal weighted densities (16.17–16.22)
  verify:
    expect:
      v: nsimplify(p0) - (2*sinh(Symbol('pp')/2) - s).subs(Symbol('pp'), nsimplify(p0))/diff(2*sinh(Symbol('pp')/2) - s, Symbol('pp')).subs(Symbol('pp'), nsimplify(p0))
- template: el-grahame-exact-root
  skill: edl.simulation
  pace: quick
  given:
    s:
      pick:
      - 1
      - 3
      - 10
  prompt: Newton's method solves 2 sinh(ψ̃/2) = {{s}}. What root does it converge to?
  parts:
  - ask: Answer
    label: v
    tex: \tilde\psi
    value: 2*asinh(s/2)
    tol: 0.005
    explain: 'ψ̃ = 2 asinh(s/2): a closed form exists here, which is how a Newton solver is tested before it meets a problem without one'
  verify:
    expect:
      v: 2*log(nsimplify(s)/2 + sqrt(nsimplify(s)**2/4 + 1))
- template: el-schur
  skill: edl.simulation
  pace: quick
  given:
    a:
      pick:
      - 2
      - 4
    b:
      pick:
      - 1
      - -1
    c:
      pick:
      - 1
      - 3
    d:
      pick:
      - 5
      - 6
    p:
      pick:
      - 1
      - 2
    q:
      pick:
      - 3
      - -2
  prompt: For [[{{a}}, {{b}}], [{{c}}, {{d}}]]·[x₁, x₂] = [{{p}}, {{q}}], eliminate x₁ with the Schur complement. What is x₂?
  parts:
  - ask: Answer
    label: v
    tex: x_2
    value: (q - c*p/a)/(d - c*b/a)
    tol: 0.005
    explain: The book's real-space Newton solver splits off the density unknowns this way and solves the smaller Schur system with GMRES (16.24–16.26)
  verify:
    expect:
      v: Matrix([[a, b], [c, d]]).solve(Matrix([p, q]))[1]
- template: el-schur-x1
  skill: edl.simulation
  pace: quick
  given:
    a:
      pick:
      - 2
      - 4
    b:
      pick:
      - 1
      - -1
    c:
      pick:
      - 1
      - 3
    d:
      pick:
      - 5
      - 6
    p:
      pick:
      - 1
      - 7
    q:
      pick:
      - 2
      - 4
  prompt: For [[{{a}}, {{b}}], [{{c}}, {{d}}]]·[x₁, x₂] = [{{p}}, {{q}}], after finding x₂ from the Schur complement, back-substitute. What is x₁?
  parts:
  - ask: Answer
    label: v
    tex: x_1
    value: (p - b*(q - c*p/a)/(d - c*b/a))/a
    tol: 0.005
    explain: 'x₁ = (p − b x₂)/a: in coupled DFT solvers the Poisson block is eliminated the same way'
  verify:
    expect:
      v: Matrix([[a, b], [c, d]]).solve(Matrix([p, q]))[0]
- template: el-nernst-planck
  skill: edl.simulation
  pace: quick
  given:
    z:
      pick:
      - 1
      - -1
      - 2
    D:
      pick:
      - 1
      - 2
    c:
      pick:
      - 1
      - 10
    dc:
      pick:
      - -100
      - 100
    dp:
      pick:
      - -1000
      - 500
  prompt: An ion of charge number {{z}} (D = {{D}} × 10⁻⁹ m²/s) has local concentration {{c}} mol/m³, gradient {{dc}} mol/m⁴ and reduced potential gradient dψ̃/dx = {{dp}} m⁻¹. What is its flux, in μmol/(m²·s)?
  parts:
  - ask: Answer
    label: v
    tex: J
    value: -D*1e-9*(dc + z*c*dp)*1e6
    tol: 0.005
    explain: Flux follows the gradient of the electrochemical potential, J = −(Dc/kT)∇(μ + zeψ) (16.3), which for an ideal solution splits into diffusion and migration
  verify:
    expect:
      v: -nsimplify(D)/10**9*nsimplify(c)*diff(log(Symbol('cc')) + z*Symbol('pp'), Symbol('cc')).subs(Symbol('cc'), nsimplify(c))*nsimplify(dc)*10**6 - nsimplify(D)/10**9*nsimplify(c)*z*nsimplify(dp)*10**6
- template: el-zero-flux-gradient
  skill: edl.simulation
  pace: quick
  given:
    z:
      pick:
      - 1
      - -1
      - 2
    c:
      pick:
      - 1
      - 10
      - 100
    dp:
      pick:
      - -1000000.0
      - 100000.0
      - 1000000.0
  prompt: An ion of charge number {{z}} at {{c}} mol/m³ sits where dψ̃/dx = {{dp}} m⁻¹. What concentration gradient, in mol/m⁴, makes its Nernst–Planck flux zero?
  parts:
  - ask: Answer
    label: v
    tex: dc/dx
    value: -z*c*dp
    tol: 0.005
    explain: 'Zero flux means diffusion balances migration: the Boltzmann profile c ∝ e^{−zψ̃}, the equilibrium PB assumes'
  verify:
    expect:
      v: diff(nsimplify(c)*exp(-z*nsimplify(dp)*Symbol('xx')), Symbol('xx')).subs(Symbol('xx'), 0)

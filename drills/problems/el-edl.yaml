- template: el-gouy-chapman-profile
  skill: edl.continuum
  pace: quick
  given:
    ps:
      pick:
      - 1
      - 2
      - 4
      - 6
    kz:
      pick:
      - 0.5
      - 1
      - 2
      - 3
  prompt: A flat double layer has reduced surface potential ψ̃_s = eψ_s/kT = {{ps}} (1:1 salt). What is ψ̃ at κz = {{kz}}?
  parts:
  - ask: Answer
    label: v
    tex: \tilde\psi
    value: 4*atanh(tanh(ps/4)*exp(-kz))
    tol: 0.005
    explain: 'Far out the profile decays like 4γ e^{−κz}: a highly charged wall looks, from afar, like one at ψ̃ = 4 at most (potential saturation)'

      pick:
      - 25
      - 50
      - 100
      - 150
    c:
      pick:
      - 0.001
      - 0.01
      - 0.1
  prompt: A flat surface sits at ψ_s = {{psi}} mV in {{c}} M 1:1 salt (ε = 78.4, 25 °C). What surface charge does Gouy–Chapman give, in μC/cm²? (e = 1.602 × 10⁻¹⁹ C, k_B = 1.381 × 10⁻²³ J/K, ε₀ = 8.854 × 10⁻¹² F/m, N_A = 6.022 × 10²³)

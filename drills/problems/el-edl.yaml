- template: el-model-hierarchy
  skill: edl.foundations
  pace: recall
  cases:
  - q: Ions as charged spheres in a structureless dielectric continuum. Which model class?
    o1: Primitive
    o2: Semi-primitive
    o3: Civilized
    o4: Gouy–Chapman only
  - q: Ions and neutral solvent spheres with excluded volume and van der Waals attraction, but no solvent dipoles. Which model class?
    o1: Semi-primitive
    o2: Primitive
    o3: Civilized
    o4: Helmholtz
  - q: Ions and solvent molecules carrying dipoles, so ion–dipole and dipole–dipole forces act. Which model class?
    o1: Civilized
    o2: Semi-primitive
    o3: Primitive
    o4: Restricted primitive
  - q: Which early model first added a layer of finite-size ions with specific adsorption next to the wall, keeping Gouy–Chapman beyond it?
    o1: Stern
    o2: Helmholtz
    o3: Debye–Hückel
    o4: Ornstein–Zernike
  - q: Who first analysed neutral solvent molecules in the layer next to the wall?
    o1: Grahame
    o2: Gouy
    o3: Chapman
    o4: Verwey
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: 'The book''s argument is that the solvent, usually far denser than the ions, sets the structure near the wall: only semi-primitive and civilized models can show it'
  verify:
    authored: true
- template: el-model-capabilities
  skill: edl.foundations
  pace: recall
  cases:
  - q: What is the simplest model class that can show solvent layering (density oscillations) next to a wall?
    o1: Semi-primitive
    o2: Primitive
    o3: Gouy–Chapman
    o4: Helmholtz
  - q: Which model class is needed for the solvent near the wall to orient (polarise) in the field?
    o1: Civilized
    o2: Semi-primitive
    o3: Primitive
    o4: Restricted primitive
  - q: In the primitive model, what stands in for the solvent?
    o1: A uniform dielectric constant
    o2: Hard neutral spheres
    o3: Point dipoles
    o4: 'Nothing: the ions are in vacuum'
  - q: What makes a primitive model 'restricted'?
    o1: All ions have the same diameter
    o2: Only one salt is present
    o3: The wall is uncharged
    o4: Ions are point charges
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id002
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: 'Each step up the hierarchy adds a feature the simpler model cannot show: packing (semi-primitive), then orientation (civilized)'
  verify:
    authored: true

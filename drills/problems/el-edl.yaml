- template: el-closures
  skill: edl.liquid-state
  pace: recall
  cases:
  - q: Which closure sets c(r) = −βφ(r) outside the core and g(r) = 0 inside?
    o1: Mean spherical approximation (MSA)
    o2: Percus–Yevick
    o3: Hypernetted chain
    o4: Debye–Hückel
  - q: Which closure writes c(r) = g(r) − 1 − ln y(r)?
    o1: Hypernetted chain (HNC)
    o2: Percus–Yevick
    o3: MSA
    o4: Random phase approximation
  - q: Which closure writes c(r) = f(r)y(r) and gives an analytic solution for hard spheres?
    o1: Percus–Yevick (PY)
    o2: HNC
    o3: MSA
    o4: Kirkwood superposition
  - q: Why does the OZ equation need a closure at all?
    o1: It relates two unknown functions, h and c
    o2: It has no solution for hard spheres
    o3: It ignores three-body correlations
    o4: It only applies to ideal gases
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: For electrolytes, HNC handles the long-range Coulomb tail best; MSA gives analytic thermodynamics used later in DFT (section 7.4)
  verify:
    authored: true
- template: el-closure-forms
  skill: edl.liquid-state
  pace: recall
  cases:
  - q: Which closure sets c(r) = −βu(r) outside the hard core?
    o1: Mean spherical approximation (MSA)
    o2: Percus–Yevick
    o3: Hypernetted chain
    o4: Debye–Hückel
  - q: 'Which closure neglects the bridge function entirely: g = exp(−βu + h − c)?'
    o1: Hypernetted chain (HNC)
    o2: Percus–Yevick
    o3: MSA
    o4: Random phase approximation
  - q: Which closure gives an analytic solution for hard spheres (Wertheim, Thiele)?
    o1: Percus–Yevick
    o2: HNC
    o3: Kirkwood superposition
    o4: Born–Green
  - q: Why does the Ornstein–Zernike equation need a closure?
    o1: It is one equation for two unknown functions, h and c
    o2: It is nonlinear
    o3: It has no Fourier transform
    o4: It applies only to ideal gases
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id002
    correct: '0'
    explain: OZ defines c; a closure ties c back to u and h. Charged systems usually take HNC or MSA, hard cores PY
  verify:
    authored: true

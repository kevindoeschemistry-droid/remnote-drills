- template: el-picard
  skill: edl.simulation
  pace: quick
  given:
    xk:
      pick:
      - 1
      - 2.5
    g:
      pick:
      - 0.5
      - 3
      - 4
    a:
      pick:
      - 0.05
      - 0.1
      - 0.5
  prompt: A Picard iteration has x^k = {{xk}} and g(x^k) = {{g}}. With mixing parameter α = {{a}}, what is x^{k+1}?
  parts:
  - ask: Answer
    label: v
    tex: x^{k+1}
    value: (1 - a)*xk + a*g
    tol: 0.005
    explain: Small α trades speed for stability; strongly coupled Poisson and Euler–Lagrange equations often need α of a few percent, which is why Newton methods win (16.1.3)
  verify:
    expect:
      v: nsimplify(xk) + nsimplify(a)*(nsimplify(g) - nsimplify(xk))
- template: el-newton-pb
  skill: edl.simulation
  pace: quick
  given:
    s:
      pick:
      - 1
      - 3
      - 10
    p0:
      pick:
      - 1
      - 2
  prompt: To find ψ̃ with 2 sinh(ψ̃/2) = {{s}} (Grahame, reduced), take one Newton step from ψ̃₀ = {{p0}}. What is ψ̃₁?
  parts:
  - ask: Answer
    label: v
    tex: \tilde\psi_1
    value: p0 - (2*sinh(p0/2) - s)/cosh(p0/2)
    tol: 0.005
    explain: Newton converges quadratically near the root; in c-DFT the Jacobian couples densities, potential and nonlocal weighted densities (16.17–16.22)
  verify:
    expect:
      v: nsimplify(p0) - (2*sinh(Symbol('pp')/2) - s).subs(Symbol('pp'), nsimplify(p0))/diff(2*sinh(Symbol('pp')/2) - s, Symbol('pp')).subs(Symbol('pp'), nsimplify(p0))
- template: el-schur
  skill: edl.simulation
  pace: quick
  given:
    a:
      pick:
      - 2
      - 4
    b:
      pick:
      - 1
      - -1
    c:
      pick:
      - 1
      - 3
    d:
      pick:
      - 5
      - 6
    p:
      pick:
      - 1
      - 2
    q:
      pick:
      - 3
      - -2
  prompt: For [[{{a}}, {{b}}], [{{c}}, {{d}}]]·[x₁, x₂] = [{{p}}, {{q}}], eliminate x₁ with the Schur complement. What is x₂?
  parts:
  - ask: Answer
    label: v
    tex: x_2
    value: (q - c*p/a)/(d - c*b/a)
    tol: 0.005
    explain: The book's real-space Newton solver splits off the density unknowns this way and solves the smaller Schur system with GMRES (16.24–16.26)
  verify:
    expect:
      v: Matrix([[a, b], [c, d]]).solve(Matrix([p, q]))[1]
- template: el-nernst-planck
  skill: edl.simulation
  pace: quick
  given:
    z:
      pick:
      - 1
      - -1
      - 2
    D:
      pick:
      - 1
      - 2
    c:
      pick:
      - 1
      - 10
    dc:
      pick:
      - -100
      - 100
    dp:
      pick:
      - -1000
      - 500
  prompt: An ion of charge number {{z}} (D = {{D}} × 10⁻⁹ m²/s) has local concentration {{c}} mol/m³, gradient {{dc}} mol/m⁴ and reduced potential gradient dψ̃/dx = {{dp}} m⁻¹. What is its flux, in μmol/(m²·s)?
  parts:
  - ask: Answer
    label: v
    tex: J
    value: -D*1e-9*(dc + z*c*dp)*1e6
    tol: 0.005
    explain: Flux follows the gradient of the electrochemical potential, J = −(Dc/kT)∇(μ + zeψ) (16.3), which for an ideal solution splits into diffusion and migration
  verify:
    expect:
      v: -nsimplify(D)/10**9*nsimplify(c)*diff(log(Symbol('cc')) + z*Symbol('pp'), Symbol('cc')).subs(Symbol('cc'), nsimplify(c))*nsimplify(dc)*10**6 - nsimplify(D)/10**9*nsimplify(c)*z*nsimplify(dp)*10**6

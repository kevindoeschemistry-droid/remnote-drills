- template: el-metropolis
  skill: edl.simulation
  pace: quick
  given:
    dU:
      pick:
      - -1
      - 0.5
      - 1
      - 2
      - 5
  prompt: A Monte Carlo trial move changes the energy by {{dU}} kT. With what probability is it accepted?
  parts:
  - ask: Answer
    label: v
    tex: P_{acc}
    value: min(1, exp(-dU))
    tol: 0.005
    explain: Downhill moves are always taken; uphill ones with the Boltzmann weight, which samples the canonical ensemble
  verify:
    expect:
      v: Min(1, exp(-nsimplify(dU)))
- template: el-widom
  skill: edl.simulation
  pace: quick
  given:
    w:
      pick:
      - 0.01
      - 0.2
      - 0.9
      - 1.5
  prompt: Random test-particle insertions give ⟨e^{−βΔU}⟩ = {{w}}. What is βμ_ex?
  parts:
  - ask: Answer
    label: v
    tex: \beta\mu_{ex}
    value: -log(w)
    tol: 0.005
    explain: The potential distribution theorem (14.23); in an inhomogeneous fluid ln ρ(z) − ln⟨e^{−βU_t}⟩ must be constant, a check on any simulation
  verify:
    expect:
      v: solve(Eq(exp(-x), nsimplify(w)), x)[0]
- template: el-collision-time
  skill: edl.simulation
  pace: quick
  given:
    s:
      pick:
      - 1
    r:
      pick:
      - 1.5
      - 2
      - 3
    v:
      pick:
      - 0.5
      - 1
      - 2
  prompt: Two hard spheres with contact distance σ = {{s}} are {{r}} apart along x and approach head-on with relative speed {{v}} (consistent units). When do they collide?
  parts:
  - ask: Answer
    label: y
    tex: t_c
    value: (r - s)/v
    tol: 0.005
    explain: Event-driven MD jumps straight from collision to collision, solving this quadratic for every approaching pair
  verify:

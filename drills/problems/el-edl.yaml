- template: el-stern-langmuir
  skill: edl.foundations
  pace: quick
  given:
    z:
      pick:
      - 1
      - -1
      - 2
    psi:
      pick:
      - -50
      - -25
      - 25
    phi:
      pick:
      - -3
      - -1
      - 0
    vr:
      pick:
      - 0.001
      - 0.01
      - 0.05
  prompt: An ion with charge number {{z}} adsorbs at a Stern plane at potential {{psi}} mV. Its non-electrostatic adsorption energy is {{phi}} kT and v₀ρ = {{vr}}. What fraction of Stern sites does it occupy (one species, 25 °C)? (e = 1.602 × 10⁻¹⁹ C, k_B = 1.381 × 10⁻²³ J/K, ε₀ = 8.854 × 10⁻¹² F/m, N_A = 6.022 × 10²³)
  parts:
  - ask: Answer
    label: v
    tex: \theta
    value: vr*exp(-phi - z*1.602176634e-19*psi/1000/(1.380649e-23*298.15))/(1 + vr*exp(-phi - z*1.602176634e-19*psi/1000/(1.380649e-23*298.15)))
    tol: 0.005
    explain: 'Equation (2.13): specific (non-Coulombic) attraction and the Stern potential both enter the Boltzmann factor; counterions crowd a strongly charged plane'
  verify:
    expect:
      v: solve(Eq(x/(1 - x), nsimplify(vr)*exp(-phi - z*Rational('1.602176634e-19')*nsimplify(psi)/1000/(Rational('1.380649e-23')*Rational('298.15')))), x)[0]
- template: el-stern-potential
  skill: edl.foundations
  pace: quick
  given:
    z:
      pick:
      - 1
      - -1
      - 2
    th:
      pick:
      - 0.1
      - 0.3
      - 0.6
    phi:
      pick:
      - -3
      - -1
    vr:
      pick:
      - 0.01
      - 0.05
  prompt: A single ion species of charge number {{z}} occupies a fraction θ = {{th}} of Stern sites, with adsorption energy {{phi}} kT and v₀ρ = {{vr}}. What is the Stern-plane potential, in mV (25 °C)? (e = 1.602 × 10⁻¹⁹ C, k_B = 1.381 × 10⁻²³ J/K, ε₀ = 8.854 × 10⁻¹² F/m, N_A = 6.022 × 10²³)
  parts:
  - ask: Answer
    label: v
    tex: \psi_\delta
    value: -(1.380649e-23*298.15)/(z*1.602176634e-19)*(log(th/((1 - th)*vr)) + phi)*1000
    tol: 0.005
    explain: 'Invert the modified Langmuir isotherm: θ/(1 − θ) = v₀ρ e^{−φ − zeψ/kT}'
  verify:
    expect:
      v: ((Rational('1.380649e-23')*Rational('298.15'))/(z*Rational('1.602176634e-19')))*(log(nsimplify(vr)) - phi - log(nsimplify(th)) + log(1 - nsimplify(th)))*1000

- template: el-linear-error
  skill: edl.continuum
  pace: quick
  given:
    ps:
      pick:
      - 1
      - 2
      - 4
    kz:
      pick:
      - 0.5
      - 1
      - 2
      - 4
  prompt: For ψ̃_s = {{ps}}, by what percentage does the linear Debye–Hückel profile ψ̃_s e^{−κz} misstate the exact Gouy–Chapman potential at κz = {{kz}}? (Give (exact − linear)/exact × 100.)
  parts:
  - ask: Answer
    label: v
    tex: \text{Error}
    value: (4*atanh(tanh(ps/4)*exp(-kz)) - ps*exp(-kz))/(4*atanh(tanh(ps/4)*exp(-kz)))*100
    tol: 0.005
    explain: 'Equation (3.15): the linear theory overshoots near a highly charged wall (negative error) and undershoots far away (positive), because nonlinear screening is stronger close in'
  verify:
    expect:
      v: (edl_gc_psi(ps, kz) - ps*exp(-kz))/edl_gc_psi(ps, kz)*100

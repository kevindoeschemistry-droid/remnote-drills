      y: Min(*[t for t in solve(Eq((nsimplify(r) - nsimplify(v)*x)**2, s**2), x) if t > 0])
- template: el-ocp-gamma
  skill: edl.simulation
  pace: quick
  given:
    Z:
      pick:
      - 1
      - 2
      - 10
    a:
      pick:
      - 0.5
      - 1
      - 5
    T:
      pick:
      - 300
      - 1000
      - 10000
  prompt: A one-component plasma of charge Z = {{Z}} has Wigner–Seitz radius {{a}} nm at {{T}} K (vacuum). What is its coupling parameter Γ? (e = 1.602 × 10⁻¹⁹ C, k_B = 1.381 × 10⁻²³ J/K, ε₀ = 8.854 × 10⁻¹² F/m, N_A = 6.022 × 10²³)
  parts:
  - ask: Answer
    label: v
    tex: \Gamma
    value: (Z*1.602176634e-19)^2/(4*pi*8.8541878128e-12*a*1e-9*1.380649e-23*T)
    tol: 0.005
    explain: Γ > 1 means Coulomb energy beats thermal energy and the plasma becomes liquid-like; it crystallises near Γ ≈ 175
  verify:
    expect:
      v: (Z*Rational('1.602176634e-19'))**2/(4*pi*Rational('8.8541878128e-12')*nsimplify(a)/10**9*Rational('1.380649e-23')*T)
- template: el-dh-limiting
  skill: edl.simulation
  pace: quick
  given:
    zp:
      pick:
      - 1
      - 2
    zm:
      pick:
      - 1
      - 2
    I:
      pick:
      - 0.001
      - 0.005
      - 0.01
  prompt: What is the mean activity coefficient of a {{zp}}:{{zm}} salt at ionic strength {{I}} M in water at 25 °C (limiting law)?
  parts:
  - ask: Answer
    label: v
    tex: \gamma_\pm
    value: 10^(-0.509*zp*zm*sqrt(I))

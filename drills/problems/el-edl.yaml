- template: el-coulomb-force
  skill: edl.foundations
  pace: quick
  given:
    z1:
      pick:
      - 1
      - 2
    z2:
      pick:
      - -1
      - -2
      - 1
    r:
      pick:
      - 0.5
      - 1
      - 2
  cases:
  - med: water
    er: 78.4
  - med: methanol
    er: 32.7
  - med: vacuum
    er: 1
  prompt: Two ions of charge numbers {{z1}} and {{z2}} sit {{r}} nm apart in {{med}} (ε = {{er}}). What is the magnitude of the force between them, in pN? (e = 1.602 × 10⁻¹⁹ C, k_B = 1.381 × 10⁻²³ J/K, ε₀ = 8.854 × 10⁻¹² F/m, N_A = 6.022 × 10²³)
  parts:
  - ask: Answer
    label: v
    tex: F
    value: abs(z1*z2)*1.602176634e-19^2/(4*pi*er*8.8541878128e-12*(r*1e-9)^2)*1e12
    tol: 0.005
    explain: 'Coulomb''s law (1.1) with k_e = 1/(4πεε₀): the solvent''s permittivity is what lets ions separate in water at all'
  verify:
    expect:
      v: Abs(z1*z2)*Rational('1.602176634e-19')**2/(4*pi*nsimplify(er)*Rational('8.8541878128e-12')*(nsimplify(r)/10**9)**2)*10**12

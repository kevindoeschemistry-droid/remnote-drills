# Generated by scripts/second_types.py from scripts/second_specs/mb.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: mb-dof-mixer
  skill: meb.nonreactive
  pace: quick
  given:
    nc:
      pick:
      - 2
      - 3
    known:
      int:
      - 3
      - 8
  require:
  - known <= 3*nc
  let:
    tot: 3*nc
  prompt: Two streams of a {{nc}}-component mixture merge into one. Of the {{tot}} stream variables (three flows and their compositions) {{known}} are given. How many degrees of freedom remain? (Negative means over-specified.)
  parts:
  - ask: Answer
    label: v
    tex: DOF
    value: 3*nc - known - nc
    final: true
    tol: 0.0001
    explain: 'Unknowns minus independent equations: a non-reactive unit gives one balance per component. Zero means the problem can be solved'
  verify:
    expect:
      v: (3 + 3*(nc - 1)) - known - nc
- template: mb-selectivity-from-yield
  skill: meb.reactive
  pace: quick
  given:
    X:
      pick:
      - 0.6
      - 0.8
      - 0.9
    f:
      pick:
      - 0.5
      - 0.7
      - 0.85
  let:
    Yd: X*f
  prompt: In parallel reactions A → D (desired) and A → U, conversion of A is {{X}} and the fractional yield of D (moles D per mole A fed) is {{Yd}}. What is the selectivity, moles D per mole U?
  parts:
  - ask: Answer
    label: v
    tex: S_{D/U}
    value: Yd/(X - Yd)
    tol: 0.005
    explain: A consumed = D + U formed (one to one here); yield counts D against A fed, selectivity against U
  verify:
    expect:
      v: solve(Eq(nsimplify(X)*nsimplify(f), x*(nsimplify(X) - nsimplify(X)*nsimplify(f))), x)[0]
- template: mb-recycle-flow
  skill: meb.recycle
  pace: quick
  given:
    Xs:
      pick:
      - 0.2
      - 0.25
      - 0.5
      - 0.8
    F:
      pick:
      - 100
      - 250
  prompt: A reactor converts {{Xs}} of its feed per pass; unreacted A is separated completely and recycled, so overall conversion is 100%. For {{F}} mol/h of fresh A, what is the recycle flow, in mol/h?
  parts:
  - ask: Answer
    label: v
    tex: R
    value: F*(1 - Xs)/Xs
    tol: 0.005
    explain: 'Everything fed must eventually react: (F + R)X_sp = F. Low single-pass conversion means a large recycle and a big separator'
  verify:
    expect:
      v: solve(Eq((F + x)*nsimplify(Xs), F), x)[0]
- template: mb-mixer-flow-needed
  skill: meb.energy
  pace: quick
  given:
    Th:
      pick:
      - 80
      - 90
    mc:
      pick:
      - 1
      - 2.5
    Tc:
      pick:
      - 10
      - 15
    Tm:
      pick:
      - 30
      - 40
      - 50
  prompt: Water at {{Th}} °C is mixed adiabatically with {{mc}} kg/s of water at {{Tc}} °C. What flow of the hot water, in kg/s, gives a mixture at {{Tm}} °C? (Constant c_p.)
  parts:
  - ask: Answer
    label: v
    tex: \dot m_h
    value: mc*(Tm - Tc)/(Th - Tm)
    tol: 0.005
    explain: 'Heat lost by the hot stream equals heat gained by the cold one: the lever rule on temperature'
  verify:
    expect:
      v: solve(Eq(x*(Th - Tm), nsimplify(mc)*(Tm - Tc)), x)[0]
- template: mb-heat-of-reaction-T
  skill: meb.energy
  pace: quick
  given:
    dH:
      pick:
      - -92.2
      - -41.2
      - 180.5
    dCp:
      pick:
      - -45
      - -10
      - 20
    T:
      pick:
      - 500
      - 700
      - 900
  prompt: A reaction has ΔH°(298 K) = {{dH}} kJ/mol and ΔC_p = {{dCp}} J/(mol·K), constant. What is ΔH at {{T}} K, in kJ/mol?
  parts:
  - ask: Answer
    label: v
    tex: \Delta H(T)
    value: dH + dCp*(T - 298)/1000
    tol: 0.005
    explain: 'Kirchhoff''s law: carry reactants down to 298 K, react, carry products back up'
  verify:
    expect:
      v: nsimplify(dH) + integrate(nsimplify(dCp)/1000, (Symbol('TT'), 298, T))
- template: mb-drain-time
  skill: meb.unsteady
  pace: quick
  given:
    A:
      pick:
      - 1
      - 2
    a:
      pick:
      - 5
      - 10
      - 20
    h1:
      pick:
      - 2
      - 3
    h2:
      pick:
      - 0.5
      - 1
  prompt: A tank of cross-section {{A}} m² drains through an orifice of {{a}} cm² (discharge coefficient 0.6). How long, in s, for the level to fall from {{h1}} m to {{h2}} m? (g = 9.81 m/s²)
  parts:
  - ask: Answer
    label: v
    tex: t
    value: 2*A/(0.6*a/10000*sqrt(2*9.81))*(sqrt(h1) - sqrt(h2))
    tol: 0.005
    explain: Outflow ∝ √h (Torricelli), so draining slows as the level drops; the last bit takes longest
  verify:
    expect:
      v: integrate(A/(Rational(6, 10)*Rational(a, 10000)*sqrt(2*Rational(981, 100)*Symbol('hh'))), (Symbol('hh'), nsimplify(h2), h1))
- template: mb-heating-coil-time
  skill: meb.unsteady
  pace: quick
  given:
    m:
      pick:
      - 500
      - 1000
    T0:
      pick:
      - 20
    Ts:
      pick:
      - 120
      - 150
    T:
      pick:
      - 60
      - 80
      - 100
    UA:
      pick:
      - 1000
      - 2500
  prompt: A stirred batch ({{m}} kg, c_p = 4.18 kJ/(kg·K)) at {{T0}} °C is heated by steam at {{Ts}} °C through a coil with UA = {{UA}} W/K. How long, in min, to reach {{T}} °C?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: m*4180/UA*log((Ts - T0)/(Ts - T))/60
    tol: 0.005
    explain: The driving force shrinks as the batch warms, so the approach is exponential with time constant mc_p/UA
  verify:
    expect:
      v: integrate(m*4180/(UA*(Ts - Symbol('TT'))), (Symbol('TT'), T0, T))/60

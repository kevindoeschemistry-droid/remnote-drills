    o4: 1 + 5
  - q: 'A group of order p², p prime, must be:'
    o1: Abelian
    o2: Cyclic
    o3: Simple
    o4: Non-abelian
  - q: 'The centre of a non-trivial group of prime-power order is always:'
    o1: Non-trivial
    o2: Trivial
    o3: The whole group
    o4: Of order p exactly
  - q: 'Cauchy''s theorem: a group of order 30 must contain an element of order:'
    o1: '5'
    o2: '6'
    o3: '10'
    o4: '15'
  - q: 'An element lies in the centre exactly when its conjugacy class has size:'
    o1: '1'
    o2: '2'
    o3: '|G|'
    o4: p
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Class sizes divide |G| and sum to |G|. In a p-group every non-central class has size divisible by p, so the centre cannot be just the identity
  verify:
    authored: true

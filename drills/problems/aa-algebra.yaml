- template: aa-is-it-a-group
  skill: aa.groups
  pace: recall
  cases:
  - st: the integers under addition
    kc: 0
  - st: the integers under multiplication
    kc: 1
  - st: the non-zero rationals under multiplication
    kc: 0
  - st: the natural numbers under addition
    kc: 1
  - st: invertible 2×2 real matrices under multiplication
    kc: 0
  - st: all 2×2 real matrices under multiplication
    kc: 1
  - st: '{1, −1, i, −i} under multiplication'
    kc: 0
  - st: the odd integers under addition
    kc: 1
  - st: the non-zero residues modulo 6 under multiplication
    kc: 1
  - st: the non-zero residues modulo 7 under multiplication
    kc: 0
  prompt: 'Is this a group: {{st}}?'
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: 'Look for what is missing: integers lack multiplicative inverses, odd integers are not closed under addition, and modulo 6 the product 2 · 3 is 0, which is not in the set'
  verify:
    authored: true

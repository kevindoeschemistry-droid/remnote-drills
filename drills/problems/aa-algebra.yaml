- template: aa-gaussian-norm
  skill: aa.rings
  pace: quick
  given:
    ka:
      pick:
      - 1
      - 2
      - 3
    kb:
      pick:
      - 1
      - 2
      - 4
    kc:
      pick:
      - 2
      - 3
      - 5
    kd:
      pick:
      - 1
      - 3
  prompt: Find the norm of the product ({{ka}} + {{kb}}i)({{kc}} + {{kd}}i) in the Gaussian integers.
  parts:
  - ask: Answer
    label: v
    tex: N
    value: (ka^2 + kb^2)*(kc^2 + kd^2)
    final: true
    tol: 0.0001
    explain: The norm is multiplicative, so multiply the two norms instead of the two numbers. This is also why a product of two sums of two squares is a sum of two squares
  verify:
    expect:
      v: Abs((ka + kb*I)*(kc + kd*I))**2
- template: aa-factorisation-facts
  skill: aa.rings
  pace: recall
  cases:
  - q: 'In Z[√−5], 6 = 2 · 3 = (1 + √−5)(1 − √−5). This shows the ring is not:'
    o1: A unique factorisation domain
    o2: An integral domain
    o3: Commutative
    o4: A ring
  - q: Eisenstein's criterion with p = 2 shows which polynomial is irreducible over Q?
    o1: x³ + 2x + 2
    o2: x² − 4
    o3: x² + 2x + 1
    o4: x³ − 8
  - q: 'Every Euclidean domain is a principal ideal domain, and every principal ideal domain is:'
    o1: A unique factorisation domain
    o2: A field
    o3: Finite
    o4: A polynomial ring
  - q: 'The units of the Gaussian integers are:'
    o1: 1, −1, i, −i
    o2: 1 and −1
    o3: All elements of norm 2
    o4: Only 1
  - q: 'In Z[x] the ideal (2, x) is not principal, so Z[x] is:'
    o1: A unique factorisation domain that is not a principal ideal domain
    o2: A principal ideal domain
    o3: A field
    o4: Not an integral domain
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Irreducible and prime mean the same thing only where factorisation is unique. In Z[√−5] the number 2 is irreducible but divides a product without dividing either factor
  verify:
    authored: true

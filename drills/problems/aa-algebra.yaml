- template: aa-field-or-not
  skill: aa.rings
  pace: recall
  cases:
  - rg: Z₇
    kc: 0
  - rg: Z₉
    kc: 2
  - rg: the integers Z
    kc: 1
  - rg: Z₂[x]/(x² + x + 1)
    kc: 0
  - rg: R[x]/(x² + 1)
    kc: 0
  - rg: R[x]/(x² − 1)
    kc: 2
  - rg: the Gaussian integers Z[i]
    kc: 1
  - rg: Z₆
    kc: 2
  - rg: the polynomial ring Q[x]
    kc: 1
  prompt: 'The ring {{rg}} is:'
  parts:
  - ask: Answer
    label: v
    choice:
    - A field
    - An integral domain but not a field
    - Not an integral domain
    correct: kc
    explain: A quotient by an irreducible polynomial is a field (R[x]/(x² + 1) is the complex numbers); a reducible one gives zero divisors, since (x − 1)(x + 1) = 0 in R[x]/(x² − 1)
  verify:
    authored: true

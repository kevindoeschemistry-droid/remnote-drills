- template: is-rosi
  skill: is.assurance
  pace: quick
  given:
    cc:
      pick:
      - 20
      - 80
      - 300
    a1:
      pick:
      - 50
      - 400
      - 2500
    a2:
      pick:
      - 10
      - 120
      - 900
  require:
  - a2 < a1
  prompt: A control costing {{cc}} thousand a year cuts an annualised loss expectancy from {{a1}} to {{a2}} thousand. What is its return on security investment (per cent)?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(a1 - a2 - cc)/cc
    tol: 0.005
    explain: A negative return means the control costs more than the loss it removes, which is a legitimate reason to accept a risk; what it does not cover is a loss the firm could not survive
  verify:
    expect:
      v: 100*Rational(a1 - a2 - cc, cc)

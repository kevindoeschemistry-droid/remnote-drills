    o3: That the channels exist
    o4: That the cost structure is right
  - q: 'A canvas with a vague value proposition and precise cost figures indicates:'
    o1: Effort spent where it is easy rather than where the risk is
    o2: A well-planned venture
    o3: A cost-led strategy
    o4: A mature market
  - q: 'The point of filling a canvas is:'
    o1: To make the assumptions explicit so the riskiest can be tested first
    o2: To document the plan
    o3: To present to investors
    o4: To compute the forecast
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The canvas is a list of guesses; its value is in ordering them by how fatal being wrong would be
  verify:
    authored: true
- template: is-clv
  skill: is.innovation
  pace: quick
  given:
    mr:
      pick:
      - 20
      - 90
      - 400
    gm:
      pick:
      - 60
      - 75
      - 90
    ch:
      pick:
      - 1
      - 3
      - 8
  prompt: A subscription earns {{mr}} dollars a month at {{gm}} per cent gross margin with {{ch}} per cent monthly churn. What is the customer lifetime value (dollars)?
  parts:
  - ask: Answer
    label: v
    tex: dollars
    value: mr*gm/100/(ch/100)
    tol: 0.005
    explain: 'Lifetime value is margin divided by churn, so churn is the dominant term: cutting monthly churn from three per cent to one triples the value of every customer acquired'
  verify:
    expect:
      v: nsimplify(mr)*Rational(gm, 100)/Rational(ch, 100)
- template: is-cac-payback
  skill: is.innovation
  pace: quick
  given:
    cac:
      pick:
      - 150
      - 800
      - 4000
    mr:
      pick:
      - 20
      - 90
      - 400
    gm:
      pick:
      - 60
      - 75
      - 90
  prompt: Acquiring a customer costs {{cac}} dollars and they contribute {{mr}} dollars a month at {{gm}} per cent margin. What is the payback period (months)?
  parts:
  - ask: Answer
    label: v
    tex: months
    value: cac/(mr*gm/100)
    tol: 0.005
    explain: 'Payback in months is the figure that decides whether growth is self-funding: below about a year a business can grow from its own gross profit, above it growth consumes capital'
  verify:
    expect:
      v: nsimplify(cac)/(nsimplify(mr)*Rational(gm, 100))
- template: is-network-effects
  skill: is.innovation
  pace: recall
  cases:
  - q: 'A messaging app where each new user makes it better for existing users has:'
    o1: Direct network effects
    o2: Indirect network effects
    o3: No network effects
    o4: Negative network effects
  - q: 'A marketplace where more sellers attract more buyers has:'
    o1: Indirect, two-sided network effects
    o2: Direct network effects
    o3: Economies of scale only
    o4: No network effects
  - q: 'In a two-sided market, the side to subsidise is generally:'
    o1: The more price-sensitive side, whose presence the other side values more
    o2: The larger side
    o3: The side that pays most
    o4: Neither
  - q: 'Negative network effects appear when:'
    o1: More users degrade the experience, as with congestion or spam
    o2: Never
    o3: Only in marketplaces
    o4: Only at launch
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Which side to subsidise follows from which side's price sensitivity and which side the other values, and getting it backwards is how a platform stalls
  verify:
    authored: true
- template: is-which-regime
  skill: is.ethics
  pace: recall
  cases:
  - q: 'A US university handling student education records is governed by:'
    o1: FERPA
    o2: HIPAA
    o3: GDPR
    o4: CCPA
  - q: 'A US healthcare provider''s patient records are governed by:'
    o1: HIPAA
    o2: FERPA
    o3: GDPR
    o4: CPRA
  - q: 'A firm processing the personal data of people in the EU, wherever the firm sits, is governed by:'
    o1: GDPR
    o2: CCPA
    o3: FERPA
    o4: HIPAA
  - q: 'California residents'' personal information held by a qualifying business is governed by:'
    o1: CCPA as amended by CPRA
    o2: GDPR
    o3: HIPAA
    o4: FERPA
  - q: 'Processing personal data for a purpose other than the one it was collected for generally requires:'
    o1: A compatible purpose or a fresh lawful basis
    o2: Nothing further
    o3: Only a privacy notice update
    o4: Only anonymisation
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Regime follows the data subject and the sector, not where the company is; a flow can be covered by more than one at once
  verify:
    authored: true
- template: is-dpia
  skill: is.ethics
  pace: recall
  cases:
  - q: 'A data-protection impact assessment is required when processing:'
    o1: Is likely to result in a high risk to people's rights, such as large-scale profiling
    o2: Involves any personal data
    o3: Is done by a public body only
    o4: Uses a cloud provider
  - q: 'Privacy by design means:'
    o1: Building the protections into the system rather than adding them afterwards
    o2: Writing a privacy notice
    o3: Encrypting the database
    o4: Appointing a data protection officer
  - q: 'Data minimisation means:'
    o1: Collecting only what the stated purpose needs
    o2: Keeping data in one place
    o3: Deleting data annually
    o4: Anonymising everything
  - q: 'The commonest privacy-by-design failure is:'
    o1: Collecting fields because they might be useful later
    o2: Weak encryption
    o3: Missing audit logs
    o4: No privacy notice
  - q: 'Pseudonymisation differs from anonymisation by:'
    o1: Being reversible with additional information, so the data is still personal data
    o2: Being irreversible
    o3: Being stronger
    o4: Applying only to identifiers
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The assessment is triggered by risk to people, and the design measures are about what is collected and kept rather than about how it is secured
  verify:
    authored: true
- template: is-ethical-lens
  skill: is.ethics
  pace: recall
  cases:
  - q: 'Utilitarian reasoning about a system asks:'
    o1: Which option produces the greatest total benefit across everyone affected
    o2: Whose rights are violated
    o3: What a virtuous person would do
    o4: What the contract says
  - q: 'Rights-based reasoning asks:'
    o1: Whether anyone's rights are violated, however large the aggregate benefit
    o2: What maximises total welfare
    o3: Who the stakeholders are
    o4: What the law requires
  - q: 'A stakeholder analysis is used to:'
    o1: Identify everyone affected, including those with no voice in the decision
    o2: Rank options
    o3: Compute net benefit
    o4: Assign liability
  - q: 'A decision that maximises total benefit while violating a small group''s rights is:'
    o1: Defensible on utilitarian grounds and not on rights-based grounds, which is why both are applied
    o2: Clearly right
    o3: Clearly wrong
    o4: Outside ethics
  - q: 'Applying more than one lens is useful because:'
    o1: They disagree in exactly the cases that are hard, which is where the reasoning has to be shown
    o2: It always gives the same answer
    o3: It is required
    o4: It is faster
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The lenses are tools for showing the reasoning, not a procedure for producing an answer
  verify:
    authored: true
- template: is-fleet-carbon
  skill: is.ethics
  pace: quick
  cases:
  - nf: 500
    eu: 180
    em: 300
    e2: 90
    gi: 400
  - nf: 2000
    eu: 250
    em: 220
    e2: 120
    gi: 250
  - nf: 120
    eu: 400
    em: 450
    e2: 150
    gi: 500
  prompt: Keeping {{nf}} machines costs {{eu}} kWh each a year; replacing them costs {{em}} kg CO2 embodied each and cuts use to {{e2}} kWh. At {{gi}} g CO2 per kWh, how many years before replacement breaks even on carbon?
  parts:
  - ask: Answer
    label: v
    tex: years
    value: em/((eu - e2)*gi/1000)
    tol: 0.005
    explain: 'Embodied emissions are most of a laptop''s footprint, so a refresh for efficiency alone often never pays back: on a clean grid the breakeven is longer still, because the saving is worth less carbon'
  verify:
    expect:
      v: nsimplify(em)/((nsimplify(eu) - nsimplify(e2))*nsimplify(gi)/1000)
- template: is-fleet-cost
  skill: is.ethics
  pace: quick
  given:
    nf:
      pick:
      - 500
      - 2000
      - 120
    cu:
      pick:
      - 600
      - 1200
      - 2500
    sv:
      pick:
      - 40
      - 150
      - 400
  prompt: 'The same fleet of {{nf}} machines: replacement costs {{cu}} dollars each and saves {{sv}} dollars a year each in energy and support. What is the simple payback (years)?'
  parts:
  - ask: Answer
    label: v
    tex: years
    value: cu/sv
    tol: 0.005
    explain: The carbon and the cash payback rarely agree, and saying which one the decision was made on is the honest part of the analysis
  verify:
    expect:

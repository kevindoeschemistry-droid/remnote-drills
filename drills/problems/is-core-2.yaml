- template: is-minimisation-fields
  skill: is.ethics
  pace: quick
  given:
    nf:
      pick:
      - 12
      - 25
      - 40
    nn:
      pick:
      - 4
      - 9
      - 18
  require:
  - nn < nf
  prompt: A form collects {{nf}} fields of which {{nn}} are needed for the stated purpose. What percentage should be removed under data minimisation?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(nf - nn)/nf
    tol: 0.005
    explain: Minimisation is usually a large fraction of a real form, because fields accumulate on the chance of being useful later; every one removed is a field that cannot leak or be misused
  verify:
    expect:
      v: 100*Rational(nf - nn, nf)
- template: is-stakeholder-count
  skill: is.ethics
  pace: quick
  given:
    ng:
      pick:
      - 5
      - 9
      - 14
    nv:
      pick:
      - 2
      - 4
      - 7
  require:
  - nv < ng
  prompt: A decision affects {{ng}} groups of which {{nv}} have a voice in making it. What percentage of affected groups are unrepresented?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(ng - nv)/ng
    tol: 0.005
    explain: 'The unrepresented share is the reason a stakeholder analysis is done at all: the groups with no voice are the ones a utilitarian calculation quietly trades away'
  verify:
    expect:
      v: 100*Rational(ng - nv, ng)

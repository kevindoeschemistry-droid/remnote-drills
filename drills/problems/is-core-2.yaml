- template: is-rto-rpo
  skill: is.assurance
  pace: quick
  given:
    lp:
      pick:
      - 5
      - 40
      - 250
    rc:
      pick:
      - 50
      - 200
      - 900
    t1:
      pick:
      - 24
      - 48
      - 72
    t2:
      pick:
      - 1
      - 4
      - 12
  require:
  - t2 < t1
  prompt: A process loses {{lp}} thousand an hour when down, and a recovery option costing {{rc}} thousand a year cuts the recovery time from {{t1}} to {{t2}} hours. How many outages a year does it take to pay for itself?
  parts:
  - ask: Answer
    label: v
    tex: outages/year
    value: rc/(lp*(t1 - t2))
    tol: 0.005
    explain: 'Recovery objectives are derived from the cost of downtime, not chosen: if it takes three outages a year to justify a hot site, and outages happen once every three years, the objective is wrong'
  verify:
    expect:
      v: nsimplify(rc)/(nsimplify(lp)*(nsimplify(t1) - nsimplify(t2)))
- template: is-recovery-site
  skill: is.assurance
  pace: recall
  cases:
  - q: 'A recovery time objective of under an hour generally requires:'
    o1: A hot site or active-active operation
    o2: A warm site
    o3: A cold site
    o4: Backup tapes offsite
  - q: 'A recovery point objective of near zero requires:'
    o1: Synchronous or near-synchronous replication
    o2: Nightly backups
    o3: Weekly backups
    o4: A cold site
  - q: 'The recovery point objective is about:'
    o1: How much data may be lost, which backup frequency decides
    o2: How long recovery takes
    o3: Where the site is
    o4: Who declares a disaster
  - q: 'A cold site is adequate when:'
    o1: The process can be down for days, which is true of more processes than people expect
    o2: The process is critical
    o3: Data loss is unacceptable
    o4: Recovery must be immediate
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Time objective picks the site, point objective picks the backup or replication scheme; they are set independently per process
  verify:
    authored: true
- template: is-backup-restore
  skill: is.assurance
  pace: quick
  given:
    dd:
      pick:
      - 1
      - 3
      - 5
  prompt: A full backup runs Sunday and differentials nightly. A failure occurs on {{dd}} with the last differential from the night before. How many backup sets must be restored?
  parts:
  - ask: Answer
    label: v
    tex: sets
    value: '2'
    final: true
    tol: 0.0001
    explain: A differential scheme always restores the full plus one differential, whatever the day; an incremental scheme restores the full plus every incremental since, which is faster to write and slower to restore
  verify:
    expect:
      v: Integer(2)
- template: is-worst-case-loss
  skill: is.assurance
  pace: quick
  given:
    bh:
      pick:
      - 1
      - 6
      - 24
  prompt: Backups run every {{bh}} hours. What is the worst-case data loss (hours), and what recovery point objective does that support?
  parts:
  - ask: Answer
    label: v
    tex: hours
    value: bh
    final: true
    tol: 0.0001
    explain: 'Worst case is a failure just before the next backup, so the recovery point objective can never be better than the backup interval: a four-hour objective on nightly backups is not an objective, it is a wish'
  verify:
    expect:
      v: bh

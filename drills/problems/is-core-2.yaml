- template: is-change-mix
  skill: is.infrastructure
  pace: quick
  given:
    nst:
      pick:
      - 120
      - 400
      - 1500
    nnm:
      pick:
      - 20
      - 80
      - 250
    nem:
      pick:
      - 2
      - 15
      - 60
  prompt: A month saw {{nst}} standard, {{nnm}} normal and {{nem}} emergency changes. What percentage were emergency, and what does a high figure suggest?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*nem/(nst + nnm + nem)
    tol: 0.005
    explain: A high emergency share means changes are being forced by incidents rather than planned, so the fix is upstream in testing and release practice rather than in the change process itself
  verify:
    expect:
      v: 100*Rational(nem, nst + nnm + nem)

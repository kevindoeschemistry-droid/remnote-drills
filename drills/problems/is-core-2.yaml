      v: nsimplify(mo)*Rational(nt - nc, nc)
- template: is-runway
  skill: is.innovation
  pace: quick
  given:
    cs:
      pick:
      - 150
      - 900
      - 4000
    bn:
      pick:
      - 25
      - 80
      - 250
    tt:
      pick:
      - 2
      - 6
      - 12
  prompt: A venture holds {{cs}} thousand and burns {{bn}} thousand a month. How many months of runway, and how many does it need to test its riskiest assumption in {{tt}} months?
  parts:
  - ask: Answer
    label: v
    tex: months
    value: cs/bn

    u2:
      pick:
      - 1
      - 2
      - 3
    i3:
      pick:
      - 1
      - 2
      - 3
    u3:
      pick:
      - 1
      - 2
      - 3
  prompt: Three incidents have impact and urgency ({{i1}},{{u1}}), ({{i2}},{{u2}}) and ({{i3}},{{u3}}) on a 1-to-3 scale with 1 highest. What is the best (lowest) priority number among them?
  parts:

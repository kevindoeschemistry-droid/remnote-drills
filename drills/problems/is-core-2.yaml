- template: is-regime-count
  skill: is.ethics
  pace: quick
  given:
    x1:
      pick:
      - 1
  prompt: A data flow touches EU residents, California residents and US patient records. How many of the four main regimes named in this unit apply?
  parts:
  - ask: Answer
    label: v
    tex: regimes
    value: '3'
    final: true
    tol: 0.0001

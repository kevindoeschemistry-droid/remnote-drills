  require:
  - nu < nt
  prompt: A mandated system is used by {{nu}} of {{nt}} staff after {{wk}} weeks. What is adoption (per cent), and what rate per week would reach {{tg}} per cent by week {{tw}}?
  parts:
  - ask: Answer

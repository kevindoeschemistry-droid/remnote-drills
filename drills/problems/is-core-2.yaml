- template: is-instance-sizing
  skill: is.infrastructure
  pace: quick
  given:
    pk:
      pick:
      - 400
      - 2500
      - 18000
    ps:
      pick:
      - 60
      - 300
      - 1200
    hd:
      pick:
      - 20
      - 30
      - 50
  prompt: A workload peaks at {{pk}} requests a second; one instance serves {{ps}}. With {{hd}} per cent headroom, how many instances are needed?
  parts:
  - ask: Answer
    label: v
    tex: instances
    value: ceil(pk/ps*(1 + hd/100))
    final: true
    tol: 0.0001
    explain: Sizing is always at peak with headroom, because an instance count that just meets the average fails every day at the busy hour; the headroom is what absorbs a failed instance as well as growth
  verify:
    expect:
      v: ceiling(nsimplify(pk)/nsimplify(ps)*(1 + Rational(hd, 100)))
- template: is-cloud-vs-own
  skill: is.infrastructure
  pace: quick
  given:
    ch:
      pick:
      - 0.1
      - 0.4
      - 1.2
    hw:
      pick:
      - 8
      - 30
      - 120
    yr:
      pick:
      - 3
      - 5
  prompt: Cloud instances cost {{ch}} dollars an hour; owned hardware costs {{hw}} thousand over {{yr}} years. How many instance-hours a year make them equal?
  parts:
  - ask: Answer
    label: v
    tex: hours/year
    value: hw*1000/yr/ch
    tol: 0.005
    explain: 'There are 8766 hours in a year, so a crossover well above that means cloud always wins and well below it means steady load should be owned: the comparison is about utilisation, not price'
  verify:
    expect:
      v: nsimplify(hw)*1000/nsimplify(yr)/nsimplify(ch)

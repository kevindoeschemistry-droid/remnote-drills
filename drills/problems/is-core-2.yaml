- template: is-sla-attainment
  skill: is.infrastructure
  pace: quick
  given:
    dm:
      pick:
      - 12
      - 95
      - 420
    dy:
      pick:
      - 30
      - 31
  prompt: A service was down {{dm}} minutes in a {{dy}}-day month. What was its availability (per cent)?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(1 - dm/(dy*1440))
    tol: 0.005
    explain: Three nines allows about 43 minutes a month and four nines about four, so the difference between them is an architecture decision rather than a tuning one
  verify:
    expect:
      v: 100*(1 - Rational(dm, dy*1440))
- template: is-mttr
  skill: is.infrastructure
  pace: quick
  given:
    ni:
      pick:
      - 4
      - 18
      - 60
    td:
      pick:
      - 95
      - 420
      - 1300
    dy:
      pick:
      - 30
      - 90
  prompt: An incident log shows {{ni}} incidents with total downtime {{td}} minutes. What is the mean time to restore (minutes), and what availability does that give over {{dy}} days?
  parts:
  - ask: Answer
    label: v
    tex: min
    value: td/ni
    tol: 0.005
    explain: Mean time to restore and incident frequency multiply to downtime, so an SLA can be met by having fewer incidents or by restoring faster; the two need different investments
  verify:
    expect:
      v: Rational(td, ni)
- template: is-priority-matrix
  skill: is.infrastructure
  pace: quick
  given:
    im:
      pick:
      - 1
      - 2
      - 3
    ur:
      pick:
      - 1
      - 2
      - 3
  prompt: On a matrix where priority is impact plus urgency on a 1-to-3 scale (1 highest), an incident of impact {{im}} and urgency {{ur}} gets what priority number?
  parts:
  - ask: Answer
    label: v
    tex: priority
    value: im + ur - 1
    final: true
    tol: 0.0001
    explain: 'The matrix exists so that priority is not argued case by case: impact is how many are affected and urgency is how fast it worsens, and the two together, not the loudest caller, set the queue'
  verify:
    expect:
      v: im + ur - 1

- template: is-sod-pairs
  skill: is.assurance
  pace: quick
  given:
    nr:
      pick:
      - 8
      - 15
      - 30
    nx:
      pick:
      - 3
      - 10
      - 25
    nh:
      pick:
      - 2
      - 4
      - 6
  prompt: A system has {{nr}} roles of which {{nx}} pairs are defined as conflicting. If a user holds {{nh}} roles at random, how many pairs do they hold?
  parts:
  - ask: Answer
    label: v
    tex: pairs
    value: nh*(nh - 1)/2
    final: true
    tol: 0.0001
    explain: 'The pairs a user holds grow as the square of their roles, which is why access accumulates into conflicts silently: nobody grants a conflict, they grant one more role'

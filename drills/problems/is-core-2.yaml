    nd:
      pick:
      - 5
      - 30
      - 90
    nc:
      pick:
      - 3
      - 20
      - 60
  prompt: A programme has {{np}} preventive, {{nd}} detective and {{nc}} corrective controls. What percentage are detective?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*nd/(np + nd + nc)
    tol: 0.005
    explain: A programme that is almost all preventive has no way of knowing when a control has failed, which is why the detective share is a health measure in its own right

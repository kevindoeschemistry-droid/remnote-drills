  prompt: A platform has {{nv}} virtual machines, {{nc}} managed containers and {{ns}} SaaS applications. Under the shared-responsibility model, how many operating systems must the customer patch?
  parts:
  - ask: Answer
    label: v
    tex: systems
    value: nv

- template: is-change-steps-left
  skill: is.innovation
  pace: quick
  given:
    nc:
      pick:
      - 2
      - 4
      - 6
    nt:
      pick:
      - 8
    mo:
      pick:
      - 3
      - 9
      - 18
  require:
  - nc < nt
  prompt: A programme has completed {{nc}} of Kotter's {{nt}} steps in {{mo}} months. At that rate, how many more months to finish?
  parts:
  - ask: Answer
    label: v
    tex: months
    value: mo*(nt - nc)/nc
    tol: 0.005
    explain: 'The arithmetic is a reminder that organisational change takes as long as it takes: a programme that declares success at step four has skipped the two that make it stick'

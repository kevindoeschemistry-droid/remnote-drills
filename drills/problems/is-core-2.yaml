- template: is-outsourcing-overhead
  skill: is.infrastructure
  pace: quick
  given:
    qp:
      pick:
      - 400
      - 1500
      - 6000
    nm:
      pick:
      - 1
      - 3
      - 8
    sc:
      pick:
      - 90
      - 140
  prompt: Outsourcing a function quoted at {{qp}} thousand a year needs {{nm}} staff at {{sc}} thousand to manage the contract. What is the true annual cost (thousand)?
  parts:
  - ask: Answer
    label: v
    tex: thousand
    value: qp + nm*sc
    final: true
    tol: 0.0001
    explain: 'The retained management cost is what makes a cheap-looking contract expensive, and it rises with how hard the output is to specify: that is transaction-cost reasoning as a number'

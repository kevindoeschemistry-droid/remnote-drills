# Generated by scripts/second_types.py from scripts/second_specs/bc2.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: bc-idp-facts
  skill: biochem.proteins
  pace: recall
  cases:
  - q: 'An intrinsically disordered region is typically rich in:'
    o1: Charged and polar residues, poor in bulky hydrophobic ones
    o2: Bulky hydrophobic residues
    o3: Cysteines in disulfides
    o4: Aromatic residues
  - q: 'Many disordered regions bind their partners by:'
    o1: Folding on binding (coupled folding and binding)
    o2: Never binding anything
    o3: Staying fully unfolded in the complex always
    o4: Covalent cross-links
  - q: 'Disordered regions are especially common in proteins for:'
    o1: Signalling and regulation
    o2: Structural collagen
    o3: Membrane pores only
    o4: Storage
  - q: 'One advantage of disorder for a hub protein is:'
    o1: Binding many different partners with modest affinity
    o2: Higher thermal stability
    o3: Faster folding to one fixed shape
    o4: Resistance to proteases
  - q: 'In a crystal structure, a disordered loop usually appears as:'
    o1: Missing density (unmodelled residues)
    o2: A long α-helix
    o3: A β-sheet
    o4: Extra bound water
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Low hydrophobicity and high net charge keep a chain unfolded; it can still bind by folding on contact
  verify:
    authored: true
- template: bc-idp-charge
  skill: biochem.proteins
  pace: quick
  given:
    n:
      pick:
      - 40
      - 50
      - 80
    kp:
      pick:
      - 4
      - 10
      - 14
    ne:
      pick:
      - 3
      - 6
      - 18
  prompt: A {{n}}-residue segment has {{kp}} Lys/Arg and {{ne}} Asp/Glu. What is its net charge per residue at pH 7 (count +1 and −1 only)?
  parts:
  - ask: Answer
    label: v
    tex: '|q|/n'
    value: abs(kp - ne)/n
    tol: 0.005
    explain: 'High net charge per residue (with low hydrophobicity) favours disorder: like charges repel, and there is little to bury'
  verify:
    expect:
      v: Abs(kp - ne)/Rational(n)

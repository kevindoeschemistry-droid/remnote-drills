    k: 0.1
    fr: 0.99
    pc: 99
    ans: 23.0258509299
  - tau: 5
    k: 0.5
    fr: 0.99
    pc: 99
    ans: 6.57881455141
  - tau: 20
    k: 0.05
    fr: 0.95
    pc: 95
    ans: 29.9573227355
  - tau: 2
    k: 1
    fr: 0.99
    pc: 99
    ans: 3.07011345733
  - tau: 8
    k: 0.25
    fr: 0.9
    pc: 90
    ans: 6.14022691465
  prompt: A CSTR full of solvent starts receiving feed. The reaction is first order with $k = {{k}}$ min⁻¹ and $\tau = {{tau}}$ min. How long (min) until the exit $C_A$ reaches {{pc}}% of its steady value?
  parts:
  - ask: t (min)
    label: y
    value: ans
    tol: 0.0001
    explain: 'Unsteady balance: $\dfrac{dC_A}{dt} = \dfrac{C_{A0} - C_A}{\tau} - kC_A$, so $C_A = C_{As}\left[1 - e^{-(1 + \tau k)t/\tau}\right]$ and $t = \dfrac{\tau}{1 + \tau k}\ln\dfrac{1}{1 - f}$. For
      99% that is about $4.6\tau/(1 + \tau k)$: reaction shortens the start-up'
  verify:
    expect:
      y: cstr_startup(tau, k, fr)

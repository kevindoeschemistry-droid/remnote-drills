    (L) reaches $X = {{X}}$?
  parts:
  - ask: V (L)
    label: y
    value: ans
    tol: 0.0002
    explain: '$V = F_{A0}\int_0^X \dfrac{dX}{-r_A}$ with $C_A = C_{A0}\dfrac{1 - X}{1 + \varepsilon X}$. First order: $V = \dfrac{v_0}{k}\left[(1 + \varepsilon)\ln\dfrac1{1 - X} - \varepsilon X\right]$.

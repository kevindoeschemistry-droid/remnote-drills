- template: re-half-life-order
  skill: cre.rate-data
  pace: quick
  cases:
  - C1: 1
    C2: 2
    t1: 10.0
    t2: 5.0
    ans: 2.0
  - C1: 1
    C2: 0.5
    t1: 25.0
    t2: 12.5
    ans: 0.0
  - C1: 1
    C2: 2
    t1: 30.0
    t2: 7.5
    ans: 3.0
  - C1: 1
    C2: 4
    t1: 5.858
    t2: 11.72
    ans: 0.499753764285
  - C1: 0.2
    C2: 0.8
    t1: 10.0
    t2: 2.5
    ans: 2.0
  prompt: Starting at $C_{A0} = {{C1}}$ mol/L the half-life is ${{t1}}$ min; starting at ${{C2}}$ mol/L it is ${{t2}}$ min. What is the reaction order?
  parts:
  - ask: Order n
    label: y
    value: ans
    tol: 0.005
    explain: For order $n$, $t_{1/2} \propto C_{A0}^{\,1 - n}$, so $n = 1 - \dfrac{\ln(t_2/t_1)}{\ln(C_2/C_1)}$. A half-life that shortens as you start higher means $n > 1$; one that does not change means
      first order
  verify:
    expect:
      y: 1 - power_exponent(nsimplify(t2)/nsimplify(t1), nsimplify(C2)/nsimplify(C1))
- template: re-initial-rates
  skill: cre.rate-data
  pace: quick
  cases:
  - m: 1
    CA1: 0.1
    CB1: 0.1
    CA2: 0.2
    CB2: 0.2
    r1: 0.005
    r2: 0.04
    ans: 2.0
  - m: 2
    CA1: 0.5
    CB1: 0.5
    CA2: 1.0
    CB2: 0.25
    r1: 0.05
    r2: 0.1
    ans: 1.0
  - m: 1
    CA1: 0.2
    CB1: 0.1
    CA2: 0.4
    CB2: 0.3
    r1: 0.4
    r2: 0.8
    ans: 0.0
  - m: 1
    CA1: 0.1
    CB1: 0.1
    CA2: 0.3
    CB2: 0.4
    r1: 0.09487
    r2: 0.5692
    ans: 0.499974654433
  - m: 2
    CA1: 0.1
    CB1: 0.2
    CA2: 0.05
    CB2: 0.4
    r1: 0.004
    r2: 0.004
    ans: 2.0
  prompt: 'The rate is order ${{m}}$ in A. Initial rates: ${{r1}}$ mol/(L·s) at $C_A = {{CA1}}$, $C_B = {{CB1}}$; ${{r2}}$ at $C_A = {{CA2}}$, $C_B = {{CB2}}$ (mol/L). What is the order in B?'
  parts:
  - ask: Order in B
    label: y
    value: ans
    tol: 0.005
    explain: 'Divide the two rate laws: $\dfrac{r_2}{r_1} = \left(\dfrac{C_{A2}}{C_{A1}}\right)^{m}\left(\dfrac{C_{B2}}{C_{B1}}\right)^{n}$. Take out the A factor you already know, then $n$ is a log ratio.
      Both concentrations changed, so the A factor cannot be ignored'
  verify:
    expect:
      y: power_exponent(nsimplify(r2)/nsimplify(r1)/(nsimplify(CA2)/nsimplify(CA1))**m, nsimplify(CB2)/nsimplify(CB1))

- template: re-relative-rates
  skill: cre.stoichiometry
  pace: recall
  cases:
  - rx: 2A + B → 3C
    a: 2
    co: 3
    sp: C
    verb: formed
    rA: 0.6
    ans: 0.9
  - rx: 2A + B → 3C
    a: 2
    co: 1
    sp: B
    verb: consumed
    rA: 0.6
    ans: 0.3
  - rx: A + 3B → 2C
    a: 1
    co: 2
    sp: C
    verb: formed
    rA: 1.5
    ans: 3.0
  - rx: A + 3B → 2C
    a: 1
    co: 3
    sp: B
    verb: consumed
    rA: 0.4
    ans: 1.2
  - rx: 3A → 2B + D
    a: 3
    co: 2
    sp: B
    verb: formed
    rA: 0.9
    ans: 0.6
  - rx: 3A → 2B + D
    a: 3
    co: 1
    sp: D
    verb: formed
    rA: 1.2
    ans: 0.4
  prompt: For {{rx}}, A is consumed at ${{rA}}$ mol/(L·s). At what rate is {{sp}} {{verb}}, in mol/(L·s)?
  parts:
  - ask: Rate
    label: y
    value: ans
    tol: 0.0001
    explain: 'Divide each rate by its stoichiometric coefficient and they are all equal: $\dfrac{-r_A}{a} = \dfrac{-r_B}{b} = \dfrac{r_C}{c}$. So the rate for {{sp}} is ${{co}}/{{a}}$ of the rate for A'
  verify:
    expect:
      y: nsimplify(co)/nsimplify(a)*nsimplify(rA)

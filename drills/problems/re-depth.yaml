    K: 3
    ku: ''
    CA0: 1
    feed: Pure A is fed.
    ans: 0.75
  - kind: 0
    rx: A ⇌ B
    K: 0.5
    ku: ''
    CA0: 1
    feed: Pure A is fed.
    ans: 0.333333333333
  - kind: 0
    rx: A ⇌ B
    K: 9
    ku: ''
    CA0: 1
    feed: Pure A is fed.
    ans: 0.9
  - kind: 1
    rx: A + B ⇌ C
    K: 2
    ku: ' L/mol'
    CA0: 1
    feed: A and B are fed equimolar at $C_{A0} = 1$ mol/L.
    ans: 0.5
  - kind: 1
    rx: A + B ⇌ C
    K: 10
    ku: ' L/mol'
    CA0: 0.5
    feed: A and B are fed equimolar at $C_{A0} = 0.5$ mol/L.
    ans: 0.641742430504
  - kind: 1
    rx: A + B ⇌ C
    K: 0.5
    ku: ' L/mol'
    CA0: 2
    feed: A and B are fed equimolar at $C_{A0} = 2$ mol/L.
    ans: 0.38196601125
  - kind: 1
    rx: A + B ⇌ C
    K: 4
    ku: ' L/mol'
    CA0: 1
    feed: A and B are fed equimolar at $C_{A0} = 1$ mol/L.
    ans: 0.609611796798
  prompt: The liquid reaction {{rx}} has $K_C = {{K}}${{ku}}. {{feed}} What is the equilibrium conversion of A?
  parts:
  - ask: X_e
    label: y
    value: ans
    tol: 0.0001
    explain: Write every concentration in terms of X from the stoichiometric table, set the rate to zero (or $K_C$ = products over reactants) and solve. For A ⇌ B, $X_e = K/(1 + K)$; for A + B ⇌ C from
      an equimolar feed, $K_C C_{A0}(1 - X)^2 = X$, a quadratic whose root below 1 is the answer. No reactor can beat $X_e$
  verify:
    expect:
      y: eq_X(kind, K, CA0)
- template: re-epsilon
  skill: cre.stoichiometry
  pace: recall
  cases:
  - rx: A → 2B
    a: 1
    dn: 1
    yA0: 1
    feed: pure A
    ans: 1.0
  - rx: A → 3B
    a: 1
    dn: 2
    yA0: 0.5
    feed: half A, half inert
    ans: 1.0
  - rx: 2A → B
    a: 2
    dn: -1
    yA0: 0.8
    feed: 80% A, 20% inert
    ans: -0.4
  - rx: A + B → C
    a: 1
    dn: -1
    yA0: 0.5
    feed: A and B equimolar, no inert
    ans: -0.5
  - rx: A → B + C
    a: 1
    dn: 1
    yA0: 0.25
    feed: 25% A, 75% inert
    ans: 0.25
  - rx: N₂ + 3H₂ → 2NH₃ (A = N₂)
    a: 1
    dn: -2
    yA0: 0.25
    feed: stoichiometric N₂ and H₂
    ans: -0.5
  prompt: The gas-phase reaction {{rx}} is fed as {{feed}}. What is $\varepsilon$, the fractional change in total moles at complete conversion of A?
  parts:
  - ask: ε
    label: y
    value: ans
    tol: 0.0001
    explain: $\varepsilon = y_{A0}\,\delta$, with $\delta$ = (moles of gas formed − moles of gas consumed) per mole of A. Inerts dilute the change, so they shrink $|\varepsilon|$. A negative $\varepsilon$
      means the gas contracts and the reactor holds A longer
  verify:
    expect:
      y: nsimplify(yA0)*nsimplify(dn)/nsimplify(a)

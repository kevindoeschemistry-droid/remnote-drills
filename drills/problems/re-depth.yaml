  prompt: The gas-phase reaction {{rx}} is fed as {{feed}} with $C_{A0} = {{CA0}}$ mol/L at ${{T0}}$ K. At $X = {{X}}$ the pressure is ${{Pr}}P_0$ and the temperature ${{T1}}$ K. What is $C_A$ (mol/L)?
  parts:

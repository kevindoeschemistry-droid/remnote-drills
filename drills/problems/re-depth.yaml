  - k: 1
    CA0: 1
    tau: 1
    ans: 0.38196601125
  prompt: A liquid second-order reaction, $-r_A = kC_A^2$ with $k = {{k}}$ L/(mol·min), runs in a CSTR with $C_{A0} = {{CA0}}$ mol/L and $\tau = {{tau}}$ min. What is the conversion?
  parts:
  - ask: X
    label: y
    value: ans
    tol: 0.0001
    explain: 'Mole balance with the rate at exit conditions: $\tau k C_{A0} = \dfrac{X}{(1 - X)^2}$. With $Da = \tau k C_{A0}$, $X = \dfrac{1 + 2Da - \sqrt{1 + 4Da}}{2Da}$. Take the root below 1'
  verify:
    expect:
      y: cstr_X(2, nsimplify(k)*nsimplify(CA0)*nsimplify(tau))

  prompt: A first-order gas reaction with no change in moles ($\varepsilon = 0$), $k' = {{k}}$ L/(kg·min), runs isothermally in a packed bed with $v_0 = {{v0}}$ L/min and pressure-drop parameter $\alpha
    = {{al}}$ kg⁻¹. What is the {{wt}} after $W = {{W}}$ kg of catalyst?
  parts:
  - ask: Value
    label: y
    value: ans
    tol: 0.0001
    explain: With $\varepsilon = 0$ the Ergun equation integrates to $y = (1 - \alpha W)^{1/2}$. Then $\dfrac{dX}{dW} = \dfrac{k'}{v_0}(1 - X)y$, so $\ln\dfrac1{1 - X} = \dfrac{k'}{v_0}\dfrac{2}{3\alpha}\left[1
      - (1 - \alpha W)^{3/2}\right]$. Falling pressure lowers $C_A$, so the bed converts less than it would without the drop
  verify:
    expect:
      y: pbr(w, k, v0, al, W)
- template: re-cstr-startup
  skill: cre.cstr
  pace: quick
  cases:

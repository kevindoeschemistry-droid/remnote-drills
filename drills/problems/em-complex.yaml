  pace: recall
  cases:
  - q: 'For ∫ e^{ikx} f(x) dx with k > 0, the contour is closed in the:'
    o1: Upper half-plane, where e^{ikz} decays
    o2: Lower half-plane
    o3: Either half-plane
    o4: Right half-plane
  - q: 'For k < 0 the contour is closed in the:'

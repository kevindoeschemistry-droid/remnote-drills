    o2: Upper half-plane
    o3: Either half-plane
    o4: Left half-plane
  - q: 'Jordan''s lemma is needed, rather than the plain ML bound, when f on the arc falls only like:'
    o1: 1/R
    o2: 1/R²
    o3: 1/R³
    o4: e^{−R}
  - q: 'To get ∫ sin(kx) f(x) dx from the same contour integral, take the:'
    o1: Imaginary part
    o2: Real part

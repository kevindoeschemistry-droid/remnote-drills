  prompt: Inside a contour f has {{kz}} zeros and {{kp}} poles, counted with multiplicity. What is (1/2πi)∮ f′/f dz?
  parts:
  - ask: Answer
    label: v
    tex: value
    value: kz - kp
    final: true

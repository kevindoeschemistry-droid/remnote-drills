- template: em-conformal-magnification
  skill: cplx.conformal
  pace: quick
  given:
    ka:
      pick:
      - 1
      - 2
      - 3
    kb:
      pick:
      - 1
      - 2
      - 4
  prompt: By what factor does f(z) = z² magnify small lengths at z₀ = {{ka}} + {{kb}}i?
  parts:
  - ask: Answer
    label: v
    tex: '|f''(z_0)|'
    value: 2*sqrt(ka^2 + kb^2)
    tol: 0.005
    explain: The local magnification is |f′(z₀)| = 2|z₀|, and the map turns everything at that point by arg f′(z₀). Areas scale by the square
  verify:
    expect:
      v: Abs(diff(Z**2, Z).subs(Z, ka + kb*I))

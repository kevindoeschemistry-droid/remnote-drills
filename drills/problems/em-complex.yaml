      - 8
    ka:
      pick:
      - 3
      - 4
      - 6
    km:
      pick:
      - 1
      - 2
      - 3
  prompt: How many zeros does z^{{kn}} + {{ka}}z^{{km}} + 1 have inside the unit circle?
  parts:
  - ask: Answer
    label: v
    tex: zeros

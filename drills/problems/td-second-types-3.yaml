# Generated by scripts/second_types.py from scripts/second_specs/td3.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: td-thermal-contact-temperature
  skill: thermo.fundamental-equation
  pace: quick
  cases:
  - k1: 100
    k2: 100
    ka: 300
    kb: 400
  - k1: 200
    k2: 100
    ka: 300
    kb: 360
  - k1: 50
    k2: 150
    ka: 500
    kb: 300
  - k1: 400
    k2: 100
    ka: 280
    kb: 380
  prompt: Two bodies with constant heat capacities {{k1}} and {{k2}} J/K start at {{ka}} K and {{kb}} K and exchange energy only with each other. At what common temperature is the total entropy largest?
  parts:
  - ask: Answer
    label: v
    tex: T
    value: (k1*ka + k2*kb)/(k1 + k2)
    tol: 0.005
    explain: dS = (1/T₁ − 1/T₂)dU₁ vanishes when the temperatures are equal, and energy conservation fixes which temperature
  verify:
    expect:
      v: solve(Eq(k1*(Symbol('m') - ka) + k2*(Symbol('m') - kb), 0), Symbol('m'))[0]
- template: td-extremum-principle
  skill: thermo.fundamental-equation
  pace: recall
  cases:
  - q: U, V and N
    kc: 0
  - q: S, V and N
    kc: 1
  - q: T, V and N
    kc: 2
  - q: T, P and N
    kc: 3
  prompt: 'For a system held at fixed {{q}}, equilibrium is where:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Entropy is a maximum
    - Internal energy is a minimum
    - Helmholtz energy is a minimum
    - Gibbs energy is a minimum
    correct: kc
    explain: 'Each potential is the Legendre transform that swaps the held variables: maximum S at fixed U is the same statement as minimum U at fixed S, and so on down the list'
  verify:
    authored: true
- template: td-extensive-exponent
  skill: thermo.fundamental-equation
  pace: quick
  cases:
  - ka: 0.5
    kb: 0.25
  - ka: 0.25
    kb: 0.25
  - ka: 0.4
    kb: 0.4
  - ka: 0.75
    kb: 0.5
  - ka: 0.2
    kb: 0.3
  prompt: A proposed fundamental equation is S = a·U^{{ka}}·V^{{kb}}·N^γ. What must γ be for S to be extensive?
  parts:
  - ask: Answer
    label: v
    tex: \gamma
    value: 1 - ka - kb
    tol: 0.005
    explain: Scaling U, V and N by λ must scale S by λ, so the exponents add to 1
  verify:
    expect:
      v: solve(Eq(nsimplify(ka) + nsimplify(kb) + Symbol('m'), 1), Symbol('m'))[0]

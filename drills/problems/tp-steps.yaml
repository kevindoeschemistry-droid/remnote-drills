- template: tp-faces-on-surface
  skill: top.surfaces
  pace: quick
  cases:
  - nm: sphere
    kx: 2
    kv: 8
    ke: 12
  - nm: torus
    kx: 0
    kv: 7
    ke: 21
  - nm: torus
    kx: 0
    kv: 9
    ke: 18
  - nm: sphere
    kx: 2
    kv: 20
    ke: 30
  - nm: double torus
    kx: -2
    kv: 6
    ke: 16
  prompt: A connected graph with {{kv}} vertices and {{ke}} edges is drawn on a {{nm}} so that every face is a disc. How many faces are there?
  parts:
  - ask: Answer
    label: v
    tex: F
    value: kx - kv + ke
    final: true
    tol: 0.0001
    explain: 'V − E + F equals the surface''s Euler characteristic: 2 for a sphere, 0 for a torus, −2 for a double torus'
  verify:
    expect:
      v: solve(Eq(kv - ke + Symbol('m'), kx), Symbol('m'))[0]

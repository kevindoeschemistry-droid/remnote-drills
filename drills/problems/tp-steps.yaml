- template: tp-crosscaps
  skill: top.surfaces
  pace: quick
  given:
    kx:
      pick:
      - 1
      - -1
      - -2
      - -3
      - -5
  prompt: A closed non-orientable surface has Euler characteristic {{kx}}. How many crosscaps (projective planes in its connected sum) does it have?
  parts:
  - ask: Answer
    label: v
    tex: k
    value: 2 - kx
    final: true
    tol: 0.0001
    explain: 'χ = 2 − k for a sphere with k crosscaps: each one lowers the Euler characteristic by 1'
  verify:
    expect:
      v: solve(Eq(2 - Symbol('m'), kx), Symbol('m'))[0]
- template: tp-sum-genus
  skill: top.surfaces
  pace: quick
  given:
    ka:
      pick:
      - 1
      - 2
      - 3
    kb:
      pick:
      - 1
      - 2
      - 4
  prompt: The connected sum of a genus-{{ka}} and a genus-{{kb}} orientable surface has what genus?
  parts:
  - ask: Answer
    label: v
    tex: g
    value: ka + kb
    final: true
    tol: 0.0001
    explain: 'Handles add. In terms of Euler characteristic, χ(A # B) = χ(A) + χ(B) − 2'
  verify:
    expect:
      v: solve(Eq(2 - 2*Symbol('m'), (2 - 2*ka) + (2 - 2*kb) - 2), Symbol('m'))[0]

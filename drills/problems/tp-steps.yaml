- template: tp-is-metric
  skill: top.spaces
  pace: recall
  cases:
  - dd: '|x − y|'
    kc: 0
  - dd: (x − y)²
    kc: 1
  - dd: '|x² − y²|'
    kc: 1
  - dd: 1 if x and y differ, 0 if they are equal
    kc: 0
  - dd: x − y
    kc: 1
  - dd: √|x − y|
    kc: 0
  - dd: 2|x − y|
    kc: 0
  - dd: '|x − y|/(1 + |x − y|)'
    kc: 0
  prompt: Is d(x, y) = {{dd}} a metric on the real line?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: (x − y)² fails the triangle inequality (0, 1, 2 gives 4 > 1 + 1); |x² − y²| is zero for x = −y; x − y can be negative. Concave increasing functions of a metric that vanish at 0, such as √ and t/(1 + t), give metrics again
  verify:
    authored: true

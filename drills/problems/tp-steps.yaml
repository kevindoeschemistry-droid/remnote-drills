- template: tp-unit-interval-cover
  skill: top.compact
  pace: quick
  given:
    kn:
      pick:
      - 2
      - 3
      - 5
      - 10
  prompt: The closed interval [0, 1] is covered by the open intervals (k/{{kn}} − 1/{{kn}}, k/{{kn}} + 1/{{kn}}) for all integers k. How many of them are needed to cover [0, 1]?
  parts:
  - ask: Answer
    label: v
    tex: intervals
    value: kn + 1
    final: true
    tol: 0.0001
    explain: The interval centred at k/n is needed to cover the point k/n itself, since no other interval of the family contains it; that forces k = 0, 1, …, n
  verify:
    expect:
      v: summation(1, (nn, 0, kn))

  - m: 55.845
    s1: Fe
    o1: Fe
    o2: Ca
    o3: Ni
    o4: Cu
  - m: 22.99
    s1: Na
    o1: Na
    o2: Mg
    o3: K
    o4: Al
  - m: 30.974
    s1: P
    o1: P
    o2: S
    o3: Si
    o4: N
  - m: 39.098
    s1: K
    o1: K
    o2: Ca
    o3: Na
    o4: Cl
  prompt: Which element has an atomic mass of about {{m}} g/mol?

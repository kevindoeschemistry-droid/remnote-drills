  verify:
    choices:
      v: 0 if Abs(c_M[s1] - nsimplify(m)) < Rational(1, 100) else 9
- template: aq-mass-percent
  skill: pchem.thermochemistry
  pace: quick
  cases:
  - f: water
    el: oxygen
    nC: 0
    nH: 2
    nN: 0
    nO: 1
    w: O
    mw: 15.999
    k: 1
  - f: glucose, C₆H₁₂O₆
    el: carbon
    nC: 6
    nH: 12
    nN: 0
    nO: 6
    w: C
    mw: 12.011
    k: 6
  - f: urea, CH₄N₂O
    el: nitrogen
    nC: 1
    nH: 4
    nN: 2
    nO: 1
    w: N
    mw: 14.007
    k: 2
  - f: ethanol, C₂H₆O
    el: carbon
    nC: 2
    nH: 6
    nN: 0
    nO: 1
    w: C
    mw: 12.011
    k: 2
  - f: carbon dioxide
    el: carbon
    nC: 1
    nH: 0
    nN: 0
    nO: 2
    w: C
    mw: 12.011
    k: 1
  - f: ammonia
    el: nitrogen
    nC: 0
    nH: 3
    nN: 1
    nO: 0
    w: N
    mw: 14.007
    k: 1
  prompt: 'In your head: what percentage of the mass of {{f}} is {{el}}?'
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*k*mw/(12.011*nC + 1.008*nH + 14.007*nN + 15.999*nO)
    tol: 0.01
    explain: Element mass × count ÷ molar mass
  verify:
    expect:
      v: 100*k*c_M[w]/(c_M['C']*nC + c_M['H']*nH + c_M['N']*nN + c_M['O']*nO)
- template: aq-dna-length
  skill: quantum.model-systems
  pace: quick
  given:
    kb:
      pick:
      - 1
      - 10
      - 48.5
      - 4600
  prompt: About how long, in µm, is a stretch of B-DNA of {{kb}} kilobase pairs?
  parts:
  - ask: Answer
    label: v
    tex: L
    value: kb*1000*0.34/1000
    tol: 0.03
    explain: '0.34 nm per base pair: E. coli''s 4.6 Mbp genome is about 1.6 mm long'
  verify:
    expect:
      v: nsimplify(kb)*1000*Rational(34, 100)/1000
- template: aq-ribosome-time
  skill: stat.rates
  pace: quick
  given:
    nres:
      pick:
      - 150
      - 300
      - 600
      - 1200
  prompt: About how many seconds does a bacterial ribosome take to make a {{nres}}-residue protein?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: nres/15
    tol: 0.34
    explain: 'About 15 amino acids per second in bacteria: a typical protein in 20–40 s'
  verify:
    expect:
      v: Rational(nres, 15)
- template: aq-one-molecule-conc
  skill: stat.binding
  pace: quick
  given:
    vol:
      pick:
      - 1
      - 0.1
      - 1000
      - 4000
  prompt: One molecule sits in a volume of {{vol}} µm³. What concentration is that, in nM?
  parts:
  - ask: Answer
    label: v
    tex: c
    value: 1/(6.02214076e23*vol*1e-15)*1e9
    tol: 0.03
    explain: 'In an E. coli of 1 µm³, one copy is about 1.7 nM: a handy floor for any count'
  verify:
    expect:
      v: 1/(c_NA*nsimplify(vol)*Rational(1, 10**15))*10**9

# Generated by scripts/second_types.py from scripts/second_specs/aq2.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: aq-kitchen-ratio
  skill: k8.measurement
  pace: recall
  cases:
  - small: teaspoons
    big: tablespoon
    a: 0.16666666666666666
    b: 0.5
  - small: tablespoons
    big: fluid ounce
    a: 0.5
    b: 1
  - small: tablespoons
    big: cup
    a: 0.5
    b: 8
  - small: fluid ounces
    big: cup
    a: 1
    b: 8
  - small: teaspoons
    big: fluid ounce
    a: 0.16666666666666666
    b: 1
  prompt: 'From memory: how many {{small}} make one {{big}} (US)?'
  parts:
  - ask: Answer
    label: v
    tex: n
    value: b/a
    final: true
    tol: 0.0001
    explain: 3 tsp = 1 tbsp, 2 tbsp = 1 fl oz, 8 fl oz = 1 cup (so 16 tbsp)
  verify:
    expect:
      v: (nsimplify(b)*29.5735295625)/(nsimplify(a)*29.5735295625)
- template: aq-spoons-per-mole
  skill: k8.measurement
  pace: quick
  cases:
  - ml: 5
  prompt: About how many teaspoons (5 mL) of water make one mole?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: (2*1.008 + 15.999)/ml
    tol: 0.05
    explain: 'A mole of water is 18 g, about 18 mL: three and a half teaspoons'
  verify:
    expect:
      v: (2*c_M['H'] + c_M['O'])/ml
- template: aq-rt-at-t
  skill: stat.boltzmann
  pace: quick
  given:
    t:
      pick:
      - 0
      - 37
      - 100
      - -196
      - 500
  prompt: Estimate RT at {{t}} °C, in kJ/mol.
  parts:
  - ask: Answer
    label: v
    tex: RT
    value: 8.31446261815324*(t + 273.15)/1000
    tol: 0.03
    explain: RT is 2.48 kJ/mol at 25 °C; scale by the absolute temperature
  verify:
    expect:
      v: c_R*(t + Rational(27315, 100))/1000
- template: aq-gap-for-ratio
  skill: stat.boltzmann
  pace: quick
  given:
    r:
      pick:
      - 10
      - 100
      - 1000
      - 1000000
  prompt: What energy gap, in units of k_BT, makes the upper state {{r}} times less populated than the lower one?
  parts:
  - ask: Answer
    label: v
    tex: \Delta E/k_BT
    value: log(r)
    tol: 0.05
    explain: Each factor of 10 costs ln 10 ≈ 2.3 k_BT
  verify:
    expect:
      v: solve(Eq(exp(x), r), x)[0]
- template: aq-dg-for-factor
  skill: pchem.gibbs
  pace: quick
  given:
    f:
      pick:
      - 100
      - 1000
      - 1000000
  prompt: At 25 °C, how much must ΔG° change, in kJ/mol, to change K by a factor of {{f}}?
  parts:
  - ask: Answer
    label: v
    tex: \Delta\Delta G
    value: 8.31446261815324*298.15*log(f)/1000
    tol: 0.03
    explain: 5.7 kJ/mol per factor of 10, so 11.4 for 100 and 34 for a million
  verify:
    expect:
      v: c_R*Rational(29815, 100)*log(f)/1000
- template: aq-k-to-dg
  skill: pchem.gibbs
  pace: quick
  given:
    k:
      pick:
      - -6
      - -3
      - 2
      - 5
      - 10
  prompt: A reaction has K = 10^{{k}} at 25 °C. About what is ΔG°, in kJ/mol?
  parts:
  - ask: Answer
    label: v
    tex: \Delta G^\circ
    value: -8.31446261815324*298.15*k*log(10)/1000
    tol: 0.03
    explain: ΔG° ≈ −5.7 × log₁₀K kJ/mol
  verify:
    expect:
      v: -c_R*Rational(29815, 100)*log(Integer(10)**k)/1000
- template: aq-ev-to-nm
  skill: quantum.origins
  pace: quick
  given:
    e:
      pick:
      - 1.5
      - 2.0
      - 2.5
      - 3.1
      - 4.0
      - 10
  prompt: A photon carries {{e}} eV. About what is its wavelength, in nm?
  parts:
  - ask: Answer
    label: v
    tex: \lambda
    value: 1239.841984/e
    tol: 0.03
    explain: 'λ(nm) ≈ 1240 / E(eV): 2 eV is red, 3 eV violet'
  verify:
    expect:
      v: c_h*c_c/(nsimplify(e)*c_e)*10**9
- template: aq-moles-in-flask
  skill: pchem.real-gases
  pace: quick
  given:
    V:
      pick:
      - 1
      - 5
      - 22.4
    t:
      pick:
      - 0
      - 25
      - 37
  prompt: About how many moles of an ideal gas fill {{V}} L at {{t}} °C and 1 atm?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: 101325*V/1000/(8.31446261815324*(t + 273.15))
    tol: 0.03
    explain: '22.4 L/mol at 0 °C, 24.5 at 25 °C: divide the volume by the molar volume'
  verify:
    expect:
      v: c_atm*nsimplify(V)/1000/(c_R*(t + Rational(27315, 100)))

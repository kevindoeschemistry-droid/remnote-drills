# Generated by scripts/second_types.py from scripts/second_specs/sp.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: sp-alpha-from-data
  skill: sep.vle
  pace: quick
  given:
    xl:
      pick:
      - 0.2
      - 0.4
      - 0.5
    al:
      pick:
      - 1.5
      - 2.4
      - 4
  let:
    yv: al*xl/(1 + (al - 1)*xl)
  prompt: A sample of liquid with light-key mole fraction {{xl}} is in equilibrium with vapour at {{yv}}. What relative volatility does that give?
  parts:
  - ask: Answer
    label: v
    tex: \alpha
    value: yv*(1 - xl)/(xl*(1 - yv))
    tol: 0.005
    explain: 'α = (y/x)/((1 − y)/(1 − x)): the ratio of the two components'' K-values, nearly constant for similar molecules'
  verify:
    expect:
      v: nsimplify(al)
- template: sp-fenske-reverse
  skill: sep.distillation
  pace: quick
  given:
    n:
      int:
      - 5
      - 15
    al:
      pick:
      - 1.5
      - 2
      - 2.5
    xb:
      pick:
      - 0.02
      - 0.05
      - 0.1
  prompt: A column has the equivalent of {{n}} ideal stages at total reflux, α = {{al}}, and bottoms at $x_B$ = {{xb}}. What distillate purity $x_D$ can it reach?
  parts:
  - ask: Answer
    label: v
    tex: x_D
    value: 1/(1 + ((1 - xb)/xb)/al^n)
    tol: 0.005
    explain: At total reflux each stage multiplies the separation ratio by α, so purity climbs steeply with stages once α is well above 1
  verify:
    expect:
      v: solve(Eq((x/(1 - x))*((1 - nsimplify(xb))/nsimplify(xb)), nsimplify(al)**n), x)[0]
- template: sp-rmin-vapour-feed
  skill: sep.distillation
  pace: quick
  given:
    z:
      pick:
      - 0.4
      - 0.5
      - 0.6
    al:
      pick:
      - 2
      - 2.5
      - 3
    xd:
      pick:
      - 0.9
      - 0.95
  prompt: A saturated-vapour feed (z = {{z}}) enters a column with α = {{al}} and $x_D$ = {{xd}}. What is the minimum reflux ratio? (The pinch is where the horizontal q-line y = z meets the equilibrium curve.)
  parts:
  - ask: Answer
    label: v
    tex: R_{min}
    value: (xd - z)/(z - z/(al - (al - 1)*z))
    tol: 0.005
    explain: Slope of the pinched rectifying line R/(R + 1) = (x_D − y*)/(x_D − x*); a vapour feed needs more reflux than a liquid feed for the same job
  verify:
    expect:
      v: (nsimplify(xd) - nsimplify(z))/(nsimplify(z) - solve(Eq(nsimplify(al)*x/(1 + (nsimplify(al) - 1)*x), nsimplify(z)), x)[0])
- template: sp-kremser-fraction
  skill: sep.absorption
  pace: quick
  given:
    n:
      int:
      - 2
      - 8
    Af:
      pick:
      - 0.8
      - 1.2
      - 1.5
      - 2
  prompt: An absorber has {{n}} ideal stages and absorption factor A = {{Af}}, with solute-free liquid. What fraction of the solute is absorbed?
  parts:
  - ask: Answer
    label: v
    tex: f
    value: (Af^(n + 1) - Af)/(Af^(n + 1) - 1)
    tol: 0.005
    explain: With A < 1 even infinite stages cannot absorb everything (the limit is A); with A > 1 complete absorption is possible in principle
  verify:
    expect:
      v: summation(nsimplify(Af)**Symbol('k'), (Symbol('k'), 1, n))/summation(nsimplify(Af)**Symbol('k'), (Symbol('k'), 0, n))
- template: sp-rh-from-humidity
  skill: sep.humidification
  pace: quick
  given:
    P:
      pick:
      - 101.3
    H:
      pick:
      - 0.005
      - 0.01
      - 0.015
    ps:
      pick:
      - 3.17
      - 4.25
  require:
  - H*101.3/(0.622 + H)/ps < 1
  prompt: Air at {{P}} kPa total has absolute humidity {{H}} kg water/kg dry air; the vapour pressure of water at its temperature is {{ps}} kPa. What is the relative humidity, in %?
  parts:
  - ask: Answer
    label: v
    tex: RH
    value: H*P/(0.622 + H)/ps*100
    tol: 0.005
    explain: Back out the water partial pressure from H = 0.622 p/(P − p), then divide by the saturation pressure
  verify:
    expect:
      v: solve(Eq(nsimplify(H), Rational(622, 1000)*(x/100*nsimplify(ps))/(nsimplify(P) - x/100*nsimplify(ps))), x)[0]
- template: sp-evaporator-steam
  skill: sep.humidification
  pace: quick
  given:
    F:
      pick:
      - 1000
      - 2500
    x1:
      pick:
      - 5
      - 10
    x2:
      pick:
      - 30
      - 50
    lv:
      pick:
      - 2260
      - 2300
    ls:
      pick:
      - 2150
      - 2200
  prompt: A single-effect evaporator concentrates {{F}} kg/h of feed from {{x1}}% to {{x2}}% solids, fed at its boiling point. Latent heat of the vapour is {{lv}} kJ/kg and of the steam {{ls}} kJ/kg. How much steam, in kg/h?
  parts:
  - ask: Answer
    label: v
    tex: \dot m_s
    value: F*(1 - x1/x2)*lv/ls
    tol: 0.005
    explain: Solids balance gives the water evaporated; with no sensible heating and no boiling-point rise, roughly one kg of steam per kg of water (economy about 1). Multiple effects reuse the vapour
  verify:
    expect:
      v: solve(Eq(x*ls, (F - solve(Eq(F*Rational(x1, 100), Symbol('pp')*Rational(x2, 100)), Symbol('pp'))[0])*lv), x)[0]

  - ask: Answer
    label: v
    tex: points
    value: abs(q1 - q2*(1 - tr/100))
    tol: 0.005
    explain: Working for a better shot is only worth it if the turnover risk of the extra actions is smaller than the improvement; a team that turns the ball over on a fifth of its late-clock possessions should shoot earlier
  verify:
    expect:
      v: Abs(nsimplify(q1) - nsimplify(q2)*(1 - Rational(tr, 100)))
- template: bb-attempts-needed
  skill: bb.analytics
  pace: quick
  given:
    at:
      pick:
      - 20
      - 60
      - 200
  prompt: To halve the width of a shooter's confidence interval from {{at}} attempts, how many attempts are needed?
  parts:
  - ask: Answer
    label: v
    tex: attempts
    value: 4*at
    final: true
    tol: 0.0001
    explain: 'Four times the attempts for half the width is why a three-point percentage takes most of a season to resolve: twenty attempts cannot distinguish a good shooter from a poor one'
  verify:
    expect:
      v: 4*at
- template: bb-lineup-minutes
  skill: bb.analytics
  pace: quick
  given:
    mn:
      pick:
      - 12
      - 40
      - 120
    pp:
      pick:
      - 1.8
      - 2.0
  prompt: A lineup played {{mn}} minutes at about {{pp}} possessions a minute. How many possessions is that, and is it near the hundreds a rating needs?
  parts:
  - ask: Answer
    label: v
    tex: possessions
    value: mn*pp
    tol: 0.005
    explain: A rating per 100 possessions computed from 25 possessions is an extrapolation by a factor of four, which is why most lineup net ratings in a season are noise
  verify:
    expect:
      v: nsimplify(mn)*nsimplify(pp)
- template: bb-force-direction
  skill: bb.scouting
  pace: quick
  given:
    nr:
      pick:
      - 38
      - 55
      - 80
    nt:
      pick:
      - 60
      - 90
      - 100
  require:
  - nr < nt
  prompt: An opponent takes {{nr}} of {{nt}} drives to his right. What percentage go right, and which way should he be forced?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*nr/nt
    tol: 0.005
    explain: A tendency above about two thirds is worth building help around; near fifty per cent the scout is something else, because forcing a direction he is comfortable going both ways in concedes the help position for nothing
  verify:
    expect:
      v: 100*Rational(nr, nt)
- template: bb-help-rules
  skill: bb.scouting
  pace: recall
  cases:
  - q: 'Help against a non-shooter''s man comes from:'
    o1: His own defender, who can leave to help without consequence
    o2: The weak-side big only
    o3: Nobody
    o4: The on-ball defender
  - q: 'Against a lineup of five shooters, help must come from:'
    o1: Nowhere without conceding a three, which is why spacing is the offence's main weapon
    o2: The weak side
    o3: The big
    o4: The point guard
  - q: 'A post player who cannot shoot from distance changes the defence by:'
    o1: Freeing his defender to sit in the lane
    o2: Requiring a double
    o3: Nothing
    o4: Requiring a switch
  - q: 'The commonest scouting error on help rules is:'
    o1: Leaving a player who has improved his shooting since the last meeting
    o2: Over-helping on a driver
    o3: Under-helping in the post
    o4: Switching too much
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Help comes out of the non-threats, so the scout has to be current: a player who added a shot removes the defence''s help'
  verify:
    authored: true
- template: bb-ato-tendency
  skill: bb.scouting
  pace: quick
  given:
    na:
      pick:
      - 4
      - 9
      - 17
    nt:
      pick:
      - 12
      - 20
      - 30
  require:
  - na < nt
  prompt: An opponent ran the same action on {{na}} of {{nt}} after-timeout possessions. What percentage is that, and is it worth preparing for?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*na/nt
    tol: 0.005
    explain: A third or more is worth a specific preparation, because the coach has chosen it in exactly the situation you will be in; below that the preparation costs more attention than it buys
  verify:
    expect:
      v: 100*Rational(na, nt)
- template: bb-coverage-counter
  skill: bb.scouting
  pace: quick
  cases:
  - p1: 42
    p2: 1.05
  - p1: 50
    p2: 0.95
  - p1: 36
    p2: 1.15
  - p1: 55
    p2: 1.0
  prompt: Against a drop, a pull-up makes {{p1}} per cent for two and a pocket pass yields {{p2}} expected points. Which is the better counter, and by how much (points)?
  parts:
  - ask: Answer
    label: v
    tex: points
    value: abs(2*p1/100 - p2)
    tol: 0.005
    explain: 'The counter follows from the personnel: a good pull-up shooter beats the pocket pass against a drop, and a poor one does not, which is why the same coverage is attacked differently by different teams'
  verify:
    expect:
      v: Abs(2*Rational(p1, 100) - nsimplify(p2))
- template: bb-level-mix
  skill: bb.development
  pace: quick
  given:
    ns:
      pick:
      - 10
      - 12
      - 15
    n1:
      pick:
      - 2
      - 4
      - 6
    n2:
      pick:
      - 3
      - 5
      - 7
  require:
  - n1 + n2 < ns
  prompt: A squad of {{ns}} has {{n1}} introductory, {{n2}} foundational and the rest advanced players. How many are advanced?
  parts:
  - ask: Answer
    label: v
    tex: players
    value: ns - n1 - n2
    final: true
    tol: 0.0001
    explain: A squad spread across levels cannot be coached as one group, which is the practical reason practice is run in stations rather than as a whole-team walk-through
  verify:
    expect:
      v: ns - n1 - n2
- template: bb-position-policy
  skill: bb.development
  pace: recall
  cases:
  - q: 'At the introductory level, position policy should be:'
    o1: Every player learns every role, since fixing positions early limits development
    o2: Fixed by height
    o3: Fixed by skill
    o4: Chosen by the player
  - q: 'A high training-to-competition ratio at young levels exists because:'
    o1: Development happens in training and games mostly reveal it
    o2: Games are expensive
    o3: Travel is hard
    o4: Rules require it
  - q: 'Fixing a tall young player at centre costs:'
    o1: The ball skills he would have built in other roles, which he will need later
    o2: Nothing
    o3: Only versatility
    o4: Playing time
  - q: 'As the level rises, the ratio:'
    o1: Falls, as competition becomes part of the development
    o2: Rises
    o3: Stays the same
    o4: Becomes irrelevant
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Train more than you compete and fix positions late: both get reversed when a season''s results start to matter to adults'
  verify:
    authored: true
- template: bb-sequence-count
  skill: bb.development
  pace: quick
  given:
    wk:
      pick:
      - 1
      - 2
      - 3
  prompt: A progression runs one-on-one, two-on-two, three-on-three and five-on-five, with {{wk}} weeks at each. How many weeks to reach five-on-five?
  parts:
  - ask: Answer
    label: v
    tex: weeks
    value: 3*wk
    final: true
    tol: 0.0001
    explain: Reaching five-on-five takes weeks, not a session, and a team that starts there skips the layers the five-on-five concepts assume
  verify:
    expect:
      v: 3*wk
- template: bb-drill-reps
  skill: bb.development
  pace: quick
  given:
    np:
      pick:
      - 6
      - 10
      - 12
    nr:
      pick:
      - 4
      - 8
      - 15
    mn:
      pick:
      - 6
      - 10
      - 15
  prompt: A small-sided drill gives each of {{np}} players {{nr}} reps in {{mn}} minutes. How many reps a minute does the group get?
  parts:
  - ask: Answer
    label: v
    tex: reps/min
    value: np*nr/mn
    tol: 0.005
    explain: 'Small-sided drills multiply reps, which is the main argument for them over five-on-five: the same ten minutes gives each player several times the touches'
  verify:
    expect:
      v: Rational(np*nr, mn)
- template: bb-progression-time
  skill: bb.development
  pace: quick
  given:
    t1:
      pick:
      - 8
      - 12
    t2:
      pick:
      - 10
      - 15
    t3:
      pick:
      - 12
      - 20
    t4:
      pick:
      - 20
      - 30
      - 40
  prompt: A practice gives {{t1}}, {{t2}}, {{t3}} and {{t4}} minutes to the four stages of a progression. What percentage is spent below five-on-five?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(t1 + t2 + t3)/(t1 + t2 + t3 + t4)
    tol: 0.005
    explain: Most of a developmental practice belongs below five-on-five, and the percentage is the quickest audit of whether a plan matches what the coach says it is for
  verify:
    expect:
      v: 100*Rational(t1 + t2 + t3, t1 + t2 + t3 + t4)
- template: bb-cue-check
  skill: bb.development
  pace: quick
  given:
    nc:
      pick:
      - 8
      - 15
      - 30
    'no':
      pick:
      - 3
      - 9
      - 22
  require:
  - no < nc
  prompt: Of {{nc}} cues in a practice plan, {{no}} name an observable action. What percentage need rewriting?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(nc - no)/nc
    tol: 0.005
    explain: Auditing a plan's cues against the observable test usually finds most of them wanting, because the natural way to write a cue is to name the outcome
  verify:
    expect:
      v: 100*Rational(nc - no, nc)
- template: bb-season-goals
  skill: bb.development
  pace: recall
  cases:
  - q: 'Season goals set on the four factors are better than a win target because:'
    o1: The team controls them and can track them every game
    o2: They are easier
    o3: They are more ambitious
    o4: They are conventional
  - q: 'The factor to set a goal on first is:'
    o1: The one with the largest weighted deficit, usually shooting
    o2: The easiest to improve
    o3: Rebounding
    o4: Free throws
  - q: Tracking a factor goal per game does what?
    o1: Makes a season-long aim actionable in the next practice
    o2: Adds pressure
    o3: Nothing
    o4: Replaces scouting
  - q: 'A factor goal that the team meets while losing:'
    o1: Still shows the plan is working on that factor, and points at which other factor to take next
    o2: Shows the goal was wrong
    o3: Is meaningless
    o4: Should be abandoned
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Factors are controllable and trackable, which is what a win total is not
  verify:
    authored: true

    label: v
    tex: \%
    value: p2*ot/100
    tol: 0.005
    explain: 'Going for two is a conditional: make it, then win overtime. Going for three wins outright at its make rate, so the comparison is the three''s rate against the two''s rate times the overtime chance'
  verify:

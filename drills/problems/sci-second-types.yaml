    vt: no verbal response
    mt: extension
    sv: 2
  - et: to pain
    vt: incomprehensible sounds
    mt: abnormal flexion
    sv: 2
  prompt: A client opens eyes {{et}}, is {{vt}} verbally, and {{mt}}. How is the head injury usually classed by GCS?
  parts:
  - ask: Answer
    label: v
    choice:
    - Mild (13–15)
    - Moderate (9–12)
    - Severe (3–8)
    correct: sv

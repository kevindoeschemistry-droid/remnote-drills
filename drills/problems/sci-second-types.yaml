- template: nr-daily-fluid
  skill: nurs.physiological
  pace: quick
  given:
    w:
      pick:
      - 8
      - 15
      - 25
      - 32
  prompt: By the 100-50-20 rule (100 mL/kg for the first 10 kg, 50 for the next 10, 20 for each kg above 20), what is the daily maintenance fluid (mL/day) for a {{w}} kg child?
  parts:
  - ask: Answer
    label: v
    tex: V
    value: 100*min(w, 10) + 50*min(max(w - 10, 0), 10) + 20*max(w - 20, 0)
    final: true
    tol: 0.0001
    explain: The daily rule pairs with the hourly 4-2-1 rule (about 1/24 of it)
  verify:
    expect:
      v: 100*Min(w, 10) + 50*Min(Max(w - 10, 0), 10) + 20*Max(w - 20, 0)

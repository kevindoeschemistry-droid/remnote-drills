- template: nr-dbp-from-map
  skill: nurs.risk-reduction
  pace: quick
  given:
    mp:
      pick:
      - 70
      - 85
      - 93
    s:
      pick:
      - 110
      - 120
      - 140
  prompt: A client's MAP is {{mp}} mmHg and systolic pressure {{s}} mmHg. What is the diastolic pressure?
  parts:
  - ask: Answer
    label: v
    tex: DBP
    value: (3*mp - s)/2
    tol: 0.005
    explain: MAP = (SBP + 2·DBP)/3; a MAP of at least 65 is the usual perfusion target
  verify:
    expect:
      v: solve(Eq((Symbol('dd')*2 + s)/3, mp), Symbol('dd'))[0]

      - 90
      - 180
      - 270
      - 60
      - 30
    p:
      int:
      - -5
      - 5
    q:
      int:
      - -5
      - 5
  require:
  - p != 0
  - q != 0
  prompt: $T$ rotates the plane by {{th}}° counterclockwise. What is the first entry of $T({{p}}, {{q}})$?
  parts:
  - ask: Answer
    label: v
    tex: ''
    value: p*cos(th*pi/180) - q*sin(th*pi/180)
    tol: 0.005
    explain: 'The columns of T are the images of e₁ and e₂: (cos θ, sin θ) and (−sin θ, cos θ)'
  verify:
    expect:
      v: (Matrix([[cos(th*pi/180), -sin(th*pi/180)], [sin(th*pi/180), cos(th*pi/180)]])*Matrix([p, q]))[0]

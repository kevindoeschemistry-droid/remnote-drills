- template: la-rank-onto
  skill: la.transformations
  pace: recall
  cases:
  - q: 'T: ℝ⁵ → ℝ³ has a 3×5 matrix of rank 3. Which is true?'
    o1: T is onto but not one-to-one
    o2: T is one-to-one but not onto
    o3: T is both
    o4: T is neither
  - q: 'T: ℝ³ → ℝ⁵ has a 5×3 matrix of rank 3. Which is true?'
    o1: T is one-to-one but not onto
    o2: T is onto but not one-to-one
    o3: T is both
    o4: T is neither
  - q: 'T: ℝ⁴ → ℝ⁴ has rank 3. Which is true?'
    o1: T is neither one-to-one nor onto
    o2: T is onto only
    o3: T is one-to-one only
    o4: T is both
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'One-to-one: a pivot in every column (rank = n). Onto: a pivot in every row (rank = m)'
  verify:
    authored: true
- template: la-derivative-range
  skill: la.transformations
  pace: quick
  given:
    k:
      int:
      - 1
      - 3
    nd:
      int:
      - 3
      - 7
  prompt: $T(p) = p^{({{k}})}$, the {{k}}-th derivative, on polynomials of degree at most {{nd}}. What is the dimension of its range?
  parts:
  - ask: Answer
    label: v
    tex: ''
    value: nd + 1 - k
    final: true
    tol: 0.0001
    explain: The kernel is the polynomials of degree < k (dimension k); rank–nullity gives the range
  verify:
    expect:
      v: nd + 1 - k
- template: la-shift-matrix-entry
  skill: la.transformations
  pace: quick
  given:
    c:
      pick:
      - -3
      - -2
      - -1
      - 2
      - 3
      - 4
  prompt: $T(p)(x) = p(x + {{c}})$ on $\mathbb{P}_2$ with basis $\{1, x, x^2\}$. What is the (1, 3) entry of $T$'s matrix?
  parts:
  - ask: Answer
    label: v
    tex: ''
    value: c^2
    final: true
    tol: 0.0001
    explain: Column 3 holds the coordinates of T(x²) = (x + c)² = c² + 2cx + x²
  verify:
    expect:
      v: expand((Symbol('t') + c)**2).subs(Symbol('t'), 0)

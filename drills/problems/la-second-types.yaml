  pace: quick
  given:
    m:
      int:
      - 2
      - 5
    nv:
      int:
      - 4
      - 9
  require:
  - nv > m
  prompt: A homogeneous system has {{m}} equations in {{nv}} unknowns. At least how many free variables must it have?
  parts:
  - ask: Answer
    label: v

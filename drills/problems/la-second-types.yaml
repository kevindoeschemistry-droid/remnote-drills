      - 4
    b:
      int:
      - -5
      - 5
    c:
      int:
      - -3
      - 3
    d:
      int:
      - -5
      - 5
  require:
  - a != 0
  - c != 0
  - d != c*b
  prompt: For which $h$ is the system $x_1 + {{a}}x_2 = {{b}}$, ${{c}}x_1 + hx_2 = {{d}}$ inconsistent?
  parts:
  - ask: Answer
    label: v

      - -3
      - 3
  require:
  - e*b + f*d != 0
  prompt: $S$ has matrix $\begin{pmatrix} {{a}} & {{b}} \\ {{c}} & {{d}} \end{pmatrix}$ and $T$ has matrix $\begin{pmatrix} {{e}} & {{f}} \\ {{g}} & {{h}} \end{pmatrix}$. Apply $S$ first, then $T$. What is the (1, 2) entry of the combined matrix?

- template: la-imt-consequence
  skill: la.inverse
  pace: recall
  cases:
  - q: A is 4×4 and Ax = 0 has only the trivial solution. Which must also be true?
    o1: Ax = b has a unique solution for every b
    o2: A has a zero row
    o3: det A = 0
    o4: The columns of A are dependent
  - q: A is square and its columns span ℝⁿ. Which must be true?
    o1: A is invertible
    o2: A is symmetric
    o3: A is diagonal
    o4: Aᵀ is singular
  - q: A is square and 0 is an eigenvalue. Which must be true?
    o1: A is not invertible
    o2: A is the zero matrix
    o3: A is diagonalisable
    o4: det A = 1
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: For a square matrix every statement of the invertible matrix theorem stands or falls together
  verify:
    authored: true

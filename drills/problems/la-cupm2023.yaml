# Generated by scripts/second_types.py from scripts/second_specs/la4.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: la-indep-det
  skill: la.independence
  pace: quick
  given:
    a:
      pick:
      - 1
      - 2
      - 3
      - -1
  prompt: For which value of k are the vectors (1, 2, 0), (0, 1, {{a}}) and (k, 0, 1) linearly dependent?
  parts:
  - ask: Answer
    label: v
    tex: k
    value: -1/(2*a)
    tol: 0.005
    explain: Three vectors in R³ are dependent exactly when the determinant of the matrix with them as columns is zero
  verify:
    expect:
      v: solve(Matrix([[1, 0, x], [2, 1, 0], [0, a, 1]]).det(), x)[0]
- template: la-indep-count
  skill: la.independence
  pace: quick
  cases:
  - m: 5
    n: 3
    r: 3
  - m: 4
    n: 4
    r: 2
  - m: 3
    n: 5
    r: 3
  - m: 6
    n: 4
    r: 4
  prompt: A set has {{m}} vectors in R^{{n}} whose matrix has rank {{r}}. How many of the vectors can be removed, at most, without shrinking the span?
  parts:
  - ask: Answer
    label: v
    tex: N
    value: m - r
    final: true
    tol: 0.0001
    explain: The span has dimension r, so r independent vectors carry it and the other m − r are redundant
  verify:
    expect:
      v: m - Min(r, n, m)
- template: la-span-dim
  skill: la.span
  pace: quick
  cases:
  - a: 3
    b: 6
  - a: 1
    b: 5
  - a: 0
    b: 0
  - a: 2
    b: 1
  prompt: What is the dimension of the span of (1, 2, {{a}}), (2, 4, {{b}}) and (0, 0, 1)?
  parts:
  - ask: Answer
    label: v
    tex: \dim
    value: '2'
    final: true
    tol: 0.0001
    explain: 'The first two vectors agree in their first two entries up to the factor 2, and (0, 0, 1) fills in the third: the span is a plane'
  verify:
    expect:
      v: Matrix([[1, 2, a], [2, 4, b], [0, 0, 1]]).rank()
- template: la-span-shape
  skill: la.span
  pace: quick
  given:
    r:
      pick:
      - 1
      - 2
      - 3
  prompt: Vectors in R³ form a matrix of rank {{r}}. What does their span look like? (Answer 0 for a point, 1 for a line through the origin, 2 for a plane through the origin, 3 for all of R³.)
  parts:
  - ask: Answer
    label: v
    tex: \text{shape}
    value: r
    final: true
    tol: 0.0001
    explain: 'The span is a subspace of dimension equal to the rank: lines and planes always pass through the origin'
  verify:
    expect:
      v: Integer(r)
- template: la-lsq-slope
  skill: la.least-squares
  pace: quick
  given:
    y0:
      pick:
      - 1
      - 2
    y1:
      pick:
      - 2
      - 3
      - 4
    y2:
      pick:
      - 4
      - 5
    y3:
      pick:
      - 5
      - 7
      - 8
  prompt: Fit y = b + mx by least squares to the points (0, {{y0}}), (1, {{y1}}), (2, {{y2}}), (3, {{y3}}). What is the slope m?
  parts:
  - ask: Answer
    label: v
    tex: m
    value: (3*y3 + y2 - y1 - 3*y0)/10
    tol: 0.005
    explain: Normal equations AᵀA c = Aᵀy; with x = 0, 1, 2, 3 the slope is Σ(x − x̄)(y − ȳ)/Σ(x − x̄)²
  verify:
    expect:
      v: ((Matrix([[1, 0], [1, 1], [1, 2], [1, 3]]).T*Matrix([[1, 0], [1, 1], [1, 2], [1, 3]])).inv()*Matrix([[1, 0], [1, 1], [1, 2], [1, 3]]).T*Matrix([y0, y1, y2, y3]))[1]
- template: la-lsq-residual-sum
  skill: la.least-squares
  pace: quick
  given:
    n:
      pick:
      - 5
      - 8
    k:
      pick:
      - 2
      - 3
    s:
      pick:
      - 1.5
      - -2.25
      - 0.8
  prompt: A least-squares line with an intercept is fitted to {{n}} points; the first {{k}} residuals sum to {{s}}. What is the sum of the remaining residuals?
  parts:
  - ask: Answer
    label: v
    tex: \sum e
    value: -s
    tol: 0.005
    explain: The residual vector is orthogonal to the column of ones, so all residuals sum to zero
  verify:
    expect:
      v: -nsimplify(s)

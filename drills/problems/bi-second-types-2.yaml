- template: bi-generation-time
  skill: bio.diversity
  pace: quick
  given:
    N0:
      pick:
      - 100
      - 1000
    N:
      pick:
      - 12800
      - 102400
    t:
      pick:
      - 140
      - 200
  prompt: A bacterial culture grows from {{N0}} to {{N}} cells in {{t}} min by binary fission. What is the generation time, in min?
  parts:
  - ask: Answer
    label: v
    tex: g
    value: t/(log(N/N0)/log(2))
    tol: 0.005
    explain: Generations = log₂(N/N₀); divide the time by that
  verify:
    expect:
      v: t*log(2)/(log(N) - log(N0))

- template: bi-okazaki-count
  skill: bio.molecular-genetics
  pace: quick
  given:
    L:
      pick:
      - 10
      - 50
      - 100
    f:
      pick:
      - 100
      - 200
  prompt: A replication fork travels {{L}} kb on a eukaryotic chromosome, and lagging-strand fragments average {{f}} nucleotides. About how many Okazaki fragments are made on that stretch?
  parts:
  - ask: Answer
    label: v
    tex: N
    value: L*1000/f
    tol: 0.005
    explain: The leading strand is one continuous piece; the lagging strand needs a new primer every fragment
  verify:
    expect:
      v: solve(Eq(x*f, L*1000), x)[0]

  pace: recall
  cases:
  - q: Which hormone acts within seconds through a second messenger?
    o1: Epinephrine
    o2: Cortisol
    o3: Testosterone
    o4: Estrogen
  - q: Which hormone changes gene expression by binding an intracellular receptor?
    o1: Cortisol
    o2: Insulin
    o3: Glucagon
    o4: Epinephrine
  - q: Why do steroid effects take hours?
    o1: They work through transcription and new protein synthesis
    o2: They travel slowly
    o3: They are large proteins
    o4: They need second messengers
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Peptides act fast at the surface; steroids act slowly through genes
  verify:
    authored: true
- template: bi-contraction-predict
  skill: bio.physiology
  pace: recall
  cases:
  - q: After death, muscles lock in rigor mortis. Why?
    o1: No ATP to release myosin from actin
    o2: Too much Ca²⁺ removal
    o3: Myosin disappears
    o4: Actin dissolves
  - q: What does Ca²⁺ do to start contraction?
    o1: Binds troponin and moves tropomyosin off actin's binding sites
    o2: Binds myosin directly
    o3: Makes ATP
    o4: Breaks actin
  - q: During contraction, what shortens?
    o1: The sarcomere (filaments slide; they do not shorten)
    o2: The actin filaments
    o3: The myosin filaments
    o4: Nothing
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Ca²⁺ uncovers the sites; ATP powers and releases each cross-bridge
  verify:
    authored: true

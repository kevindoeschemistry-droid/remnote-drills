- template: bi-drift-loss
  skill: bio.evolution
  pace: quick
  given:
    p:
      pick:
      - 0.05
      - 0.2
      - 0.5
  prompt: A neutral allele has frequency {{p}}. In a small population, what is the probability that drift eventually fixes it (equal to its current frequency)?
  parts:
  - ask: Answer
    label: v
    tex: P_{fix}
    value: p
    tol: 0.005
    explain: Drift is unbiased for neutral alleles, so the chance of fixation equals the frequency; it acts faster in small populations
  verify:
    expect:
      v: 1 - (1 - nsimplify(p))
- template: bi-gene-flow-mix
  skill: bio.evolution
  pace: quick
  given:
    p0:
      pick:
      - 0.1
      - 0.8
    m:
      pick:
      - 5
      - 10
      - 20
    pm:
      pick:
      - 0.5
      - 0.3
  prompt: An island population with allele frequency {{p0}} receives migrants so that {{m}}% of each generation's breeders come from the mainland (frequency {{pm}}). What is the frequency after one generation?
  parts:
  - ask: Answer
    label: v
    tex: p_1
    value: (1 - m/100)*p0 + m/100*pm
    tol: 0.005
    explain: Gene flow pulls populations toward each other
  verify:
    expect:
      v: nsimplify(p0) + Rational(m, 100)*(nsimplify(pm) - nsimplify(p0))
- template: bi-hw-carriers
  skill: bio.evolution
  pace: quick
  given:
    n:
      pick:
      - 2500
      - 10000
      - 100
  prompt: A recessive disease affects 1 in {{n}} people. If the population is in Hardy–Weinberg equilibrium, what fraction are carriers?
  parts:
  - ask: Answer
    label: v
    tex: 2pq
    value: 2*sqrt(1/n)*(1 - sqrt(1/n))
    tol: 0.005
    explain: q = √(q²); carriers far outnumber affected people when q is small
  verify:
    expect:
      v: 2*(1 - sqrt(Rational(1, n)))*sqrt(Rational(1, n))

- template: bi-gametes-per-meiosis
  skill: bio.physiology
  pace: quick
  given:
    n:
      pick:
      - 10
      - 100
  cases:
  - proc: spermatogenesis
    k: 4
  - proc: oogenesis
    k: 1
  prompt: Starting from {{n}} primary cells, how many functional gametes are produced by {{proc}}?
  parts:
  - ask: Answer
    label: v
    tex: N
    value: n*k
    final: true
    tol: 0.0001
    explain: Oogenesis keeps the cytoplasm in one egg and discards polar bodies; spermatogenesis makes four sperm
  verify:
    expect:
      v: n*k
- template: bi-cleavage-cells
  skill: bio.diversity
  pace: quick
  given:
    n:
      pick:
      - 3
      - 5
      - 7
  prompt: A zygote divides synchronously during cleavage. How many cells are there after {{n}} divisions?
  parts:
  - ask: Answer
    label: v
    tex: N
    value: 2^n
    final: true
    tol: 0.0001
    explain: Cleavage divides without growth, so cells get smaller each round until the blastula forms
  verify:
    expect:
      v: Integer(2)**n

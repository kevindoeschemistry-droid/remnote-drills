  pace: quick
  given:
    cx:
      pick:
      - 2
      - 4
      - 5
    S1:
      pick:
      - 0.2
      - 0.35
    dc:
      pick:
      - 1
      - 2
      - 5
  prompt: An unknown at {{cx}} ppm gives a signal of {{S1}}. A spike raises the concentration by {{dc}} ppm with negligible volume change. What signal is expected?
  parts:
  - ask: Answer
    label: v

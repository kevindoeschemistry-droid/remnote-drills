- template: an-back-titration-volume
  skill: anal.titration
  pace: quick
  given:
    m:
      pick:
      - 0.3
      - 0.45
      - 0.6
    V1:
      pick:
      - 50
      - 60
    c1:
      pick:
      - 0.5
    c2:
      pick:
      - 0.2
      - 0.25
  prompt: A {{m}} g sample of pure CaCO₃ (M = 100.09 g/mol) is dissolved in {{V1}} mL of {{c1}} M HCl, an excess. What volume of {{c2}} M NaOH, in mL, titrates the HCl left over?
  parts:
  - ask: Answer
    label: v
    tex: V
    value: (V1*c1 - 2*m/100.09*1000)/c2
    tol: 0.005
    explain: Acid added = acid used by the carbonate (2 per CaCO₃) + acid left for the base
  verify:
    expect:
      v: solve(Eq(nsimplify(c2)*x + 2*nsimplify(m)*1000/Rational(10009, 100), nsimplify(V1)*nsimplify(c1)), x)[0]

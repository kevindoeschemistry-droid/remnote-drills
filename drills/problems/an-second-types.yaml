- template: an-extractions-needed
  skill: anal.separations
  pace: quick
  given:
    Dd:
      pick:
      - 2
      - 3
      - 5
    Vw:
      pick:
      - 100
    Vo:
      pick:
      - 25
      - 50
    f:
      pick:
      - 1
      - 5
  prompt: A solute with distribution ratio D = {{Dd}} is extracted from {{Vw}} mL of water with {{Vo}} mL portions of organic solvent. How many extractions leave less than {{f}}% in the water?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: ceil(log(f/100)/log(Vw/(Vw + Dd*Vo)))
    final: true
    tol: 0.0001
    explain: Each extraction leaves the same fraction Vw/(Vw + D·Vo); repeat until the product falls below the target
  verify:
    expect:
      v: ceiling(log(nsimplify(f)/100)/log(nsimplify(Vw)/(nsimplify(Vw) + nsimplify(Dd)*nsimplify(Vo))))
- template: an-resolution-length
  skill: anal.separations
  pace: quick
  given:
    R1:
      pick:
      - 0.8
      - 1.0
      - 1.2
    f:
      pick:
      - 2
      - 3
      - 4
  prompt: Two peaks are resolved with Rs = {{R1}}. The column is made {{f}} times longer (same packing). What is the new resolution?
  parts:
  - ask: Answer
    label: v
    tex: R_s
    value: R1*sqrt(f)
    tol: 0.005
    explain: Rs grows with √N and N with length, so doubling the column gives only √2
  verify:
    expect:
      v: Max(*solve(Eq((x/nsimplify(R1))**2, nsimplify(f)), x))

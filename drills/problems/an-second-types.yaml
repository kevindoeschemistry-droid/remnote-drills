- template: an-argentometry-why
  skill: anal.titration
  pace: recall
  cases:
  - q: Why is a Mohr titration run near neutral pH?
    o1: In acid, chromate turns to dichromate and the end point comes late; in base, silver oxide precipitates
    o2: Silver chloride dissolves in acid
    o3: Chloride is oxidised in base
    o4: The indicator is a pH indicator
  - q: In a Volhard titration, what is titrated at the end?
    o1: The excess Ag⁺, with SCN⁻ and an Fe³⁺ indicator
    o2: Chloride, with chromate
    o3: Ag⁺ with EDTA
    o4: Fe³⁺ with thiocyanate in base
  - q: How does a Fajans (adsorption) indicator signal the end point?
    o1: It adsorbs on the charged precipitate surface once the charge reverses, changing colour
    o2: It precipitates with Ag⁺
    o3: It changes with pH
    o4: It forms a complex with chloride
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Each argentometric method differs only in how it sees the first excess of silver
  verify:
    authored: true
- template: an-kjeldahl-ammonia
  skill: anal.titration
  pace: quick
  given:
    P:
      pick:
      - 8
      - 12.5
      - 20
    m:
      pick:
      - 0.5
      - 1
      - 1.5
  prompt: A food is {{P}}% protein (Kjeldahl factor 6.25). How many mmol of NH₃ does a {{m}} g sample release on digestion? (N 14.007 g/mol)
  parts:
  - ask: Answer
    label: v
    tex: n
    value: P/100*m/6.25/14.007*1000
    tol: 0.005
    explain: Protein × (1/6.25) is nitrogen; each N gives one NH₃
  verify:
    expect:
      v: nsimplify(P)/100*nsimplify(m)*Rational(4, 25)*1000/Rational(14007, 1000)
- template: an-quarter-equivalence
  skill: anal.titration
  pace: quick
  given:
    pk:
      pick:
      - 3.75
      - 4.76
      - 7.2
  cases:
  - f: one quarter
    fr: 0.25
  - f: three quarters
    fr: 0.75
  - f: one tenth
    fr: 0.1
  prompt: A weak acid with pKa {{pk}} is titrated with NaOH. What is the pH when {{f}} of the base needed for equivalence has been added?
  parts:
  - ask: Answer
    label: v
    tex: \mathrm{pH}
    value: pk + log10(fr/(1 - fr))
    tol: 0.005
    explain: 'Before equivalence the solution is a buffer: pH = pKa + log(base/acid)'
  verify:
    expect:
      v: nsimplify(pk) + log(nsimplify(fr)/(1 - nsimplify(fr)))/log(10)
- template: an-indicator-titration
  skill: anal.titration
  pace: recall
  cases:
  - q: Phenolphthalein (range 8.2–10) suits which titration?
    o1: A weak acid with a strong base
    o2: A weak base with a strong acid
    o3: Two weak partners
    o4: None
  - q: Methyl orange (range 3.1–4.4) suits which titration?
    o1: A weak base with a strong acid
    o2: A weak acid with a strong base
    o3: Acetic acid with ammonia
    o4: None
  - q: Why is a weak acid–weak base titration hard to follow with an indicator?
    o1: The pH changes too gently at equivalence
    o2: No equivalence exists
    o3: Indicators react with weak acids
    o4: The pH never changes
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The equivalence pH sits on the side of the stronger partner; the indicator's range must sit inside the steep part
  verify:
    authored: true
- template: an-gravimetric-expected
  skill: anal.gravimetry
  pace: quick
  given:
    m:
      pick:
      - 0.25
      - 0.5
      - 0.8
    pct:
      pick:
      - 10
      - 25
      - 40
  cases:
  - an: sulfate
    ppt: BaSO₄
    Ma: 96.06
    Mp: 233.39
  - an: chloride
    ppt: AgCl
    Ma: 35.45
    Mp: 143.32
  - an: nickel
    ppt: Ni(DMG)₂
    Ma: 58.693
    Mp: 288.91
  prompt: A {{m}} g sample is {{pct}}% {{an}} by mass. What mass of {{ppt}}, in g, should precipitate? ({{an}} {{Ma}} g/mol, {{ppt}} {{Mp}} g/mol)
  parts:
  - ask: Answer
    label: v
    tex: m
    value: m*pct/100/Ma*Mp
    tol: 0.005
    explain: Mass of precipitate = mass of analyte × (M precipitate / M analyte), with the formula ratio
  verify:
    expect:
      v: solve(Eq(x/nsimplify(Mp), nsimplify(m)*nsimplify(pct)/100/nsimplify(Ma)), x)[0]
- template: an-common-ion-factor
  skill: anal.equilibria
  pace: quick
  given:
    K:
      pick:
      - 1.8e-10
    c:
      pick:
      - 0.001
      - 0.01
      - 0.1
  prompt: AgCl has Ksp {{K}}. By what factor is its solubility in {{c}} M NaCl smaller than in pure water? (Solve the quadratic.)
  parts:
  - ask: Answer
    label: v
    tex: s_0/s
    value: sqrt(K)/(2*K/(c + sqrt(c^2 + 4*K)))
    tol: 0.005
    explain: With a common ion, s ≈ Ksp/c, which is far below √Ksp
  verify:
    expect:
      v: sqrt(nsimplify(K))/Max(*solve(Eq(x*(x + nsimplify(c)), nsimplify(K)), x))

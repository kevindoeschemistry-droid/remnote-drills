- template: an-q-value
  skill: anal.measurement
  pace: quick
  cases:
  - v1: 10.02
    v2: 10.2
    v3: 10.24
    v4: 10.25
    v5: 10.29
  - v1: 4.71
    v2: 4.86
    v3: 4.88
    v4: 4.9
    v5: 4.92
  - v1: 0.512
    v2: 0.53
    v3: 0.531
    v4: 0.534
    v5: 0.537
  prompt: Replicates are {{v1}}, {{v2}}, {{v3}}, {{v4}} and {{v5}}, with {{v1}} suspect. What is Q?
  parts:
  - ask: Answer
    label: v
    tex: Q
    value: (v2 - v1)/(v5 - v1)
    tol: 0.005
    explain: Q = gap to the nearest neighbour ÷ range; reject only if Q exceeds the table value
  verify:
    expect:
      v: (nsimplify(v2) - nsimplify(v1))/(nsimplify(v5) - nsimplify(v1))

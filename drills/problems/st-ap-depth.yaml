- template: st-normal-describe
  skill: stats.distributions
  pace: recall
  cases:
  - q: In a normal distribution, how do mean and median compare?
    o1: They are equal
    o2: The mean is larger
    o3: The median is larger
    o4: It depends on σ
  - q: Where are the inflection points of a normal curve?
    o1: One SD either side of the mean
    o2: Two SDs either side
    o3: At the mean
    o4: At the quartiles
  - q: Two normal curves have the same mean; one has a larger SD. How does it look?
    o1: Lower and wider
    o2: Taller and narrower
    o3: Shifted right
    o4: Skewed
  - q: What total area lies under a normal density curve?
    o1: '1'
    o2: '0.5'
    o3: '100'
    o4: Depends on σ
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: A normal curve is fixed by its mean (centre) and SD (spread)
  verify:
    authored: true
- template: st-choose-procedure
  skill: stats.inference
  pace: quick
  cases:
  - q: Is the proportion of defective parts below 5%? One random sample of parts.
    o1: One-sample z test for a proportion
    o2: Two-sample t test
    o3: Chi-square test for independence
    o4: Paired t interval
  - q: Do two random samples of patients differ in mean recovery time?
    o1: Two-sample t procedure for a difference of means
    o2: One-proportion z test
    o3: Paired t test
    o4: Chi-square goodness of fit
  - q: Each subject's blood pressure is measured before and after a drug. Did it fall on average?
    o1: Paired t test on the differences
    o2: Two-sample t test
    o3: Two-proportion z test
    o4: Chi-square homogeneity
  - q: One random sample is classified by two categorical variables. Are they related?
    o1: Chi-square test for independence
    o2: Chi-square test for homogeneity
    o3: Two-sample t test
    o4: One-sample t test
  - q: Independent random samples from three regions are compared on favourite brand. Same distribution?
    o1: Chi-square test for homogeneity
    o2: Chi-square independence
    o3: Paired t test
    o4: One-proportion z interval
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Ask: categorical or quantitative response? One sample, two independent samples or paired? Estimate or test?'
  verify:
    authored: true
- template: st-parameter-name
  skill: stats.inference
  pace: quick
  cases:
  - q: A study estimates the average daily screen time of all teens in a state. What is the parameter?
    o1: μ, the mean screen time of all teens in the state
    o2: x̄, the sample mean
    o3: p, a proportion
    o4: μ₁ − μ₂
  - q: A test asks whether more men than women support a law. What is the parameter?
    o1: p₁ − p₂, the difference in population proportions
    o2: p̂₁ − p̂₂
    o3: μ_d
    o4: χ²
  - q: Twins are paired; one gets a tutoring program. What is the parameter?
    o1: μ_d, the mean of the within-pair differences
    o2: μ₁ − μ₂ for independent groups
    o3: p
    o4: σ
  - q: A study estimates the fraction of a city's trees that are diseased. What is the parameter?
    o1: p, the proportion of all the city's trees that are diseased
    o2: p̂
    o3: μ
    o4: n
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Name the parameter in words and symbols, about the population, never the sample
  verify:
    authored: true
- template: st-hypotheses
  skill: stats.inference
  pace: recall
  cases:
  - q: A company claims 90% of orders ship on time; a manager suspects fewer do. Hypotheses?
    o1: 'H₀: p = 0.90, Hₐ: p < 0.90'
    o2: 'H₀: p̂ = 0.90, Hₐ: p̂ < 0.90'
    o3: 'H₀: p < 0.90, Hₐ: p = 0.90'
    o4: 'H₀: p = 0.90, Hₐ: p is not 0.90'
  - q: Does a new fertiliser change mean yield from 40 bushels? Hypotheses?
    o1: 'H₀: μ = 40, Hₐ: μ is not 40'
    o2: 'H₀: μ is not 40, Hₐ: μ = 40'
    o3: 'H₀: x̄ = 40, Hₐ: x̄ is not 40'
    o4: 'H₀: μ > 40, Hₐ: μ = 40'
  - q: Is a drug's cure rate higher than placebo's? Hypotheses?
    o1: 'H₀: p₁ − p₂ = 0, Hₐ: p₁ − p₂ > 0'
    o2: 'H₀: p₁ − p₂ > 0, Hₐ: = 0'
    o3: 'H₀: p̂₁ = p̂₂'
    o4: 'H₀: μ₁ = μ₂'
  - q: In a chi-square test for independence, what is H₀?
    o1: The two variables are independent in the population
    o2: The variables are associated
    o3: All counts are equal
    o4: The sample is random
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Hypotheses are about parameters; H₀ holds the equality, Hₐ what the study suspects
  verify:
    authored: true
- template: st-large-counts
  skill: stats.inference
  pace: quick
  given:
    p0:
      pick:
      - 0.05
      - 0.1
      - 0.2
      - 0.6
    n:
      pick:
      - 80
      - 150
      - 400
  prompt: 'A test of H₀: p = {{p0}} uses n = {{n}}. What is the smaller of n·p₀ and n(1 − p₀)? (The condition needs it to be at least 10.)'
  parts:
  - ask: Answer
    label: v
    tex: \min
    value: min(n*p0, n*(1 - p0))
    tol: 0.005
    explain: For a test, the large-counts check uses p₀ (the null value); for an interval it uses p̂
  verify:
    expect:
      v: Min(n*nsimplify(p0), n*(1 - nsimplify(p0)))
- template: st-pvalue-interpret
  skill: stats.inference
  pace: quick
  cases:
  - q: 'A test of H₀: p = 0.5 gives p-value 0.03. What does 0.03 mean?'
    o1: If p = 0.5, a result this extreme would happen about 3% of the time
    o2: There is a 3% chance H₀ is true
    o3: There is a 97% chance Hₐ is true
    o4: The sample proportion is 0.03
  - q: p-value = 0.12 at α = 0.05. Conclusion?
    o1: 'Fail to reject H₀: not convincing evidence for Hₐ'
    o2: Accept H₀ as proven
    o3: Reject H₀
    o4: Reject Hₐ
  - q: A 95% interval for p is (0.41, 0.49). Is p = 0.5 plausible?
    o1: 'No: 0.5 lies outside the interval'
    o2: 'Yes: it is close'
    o3: 'Yes: intervals contain every value'
    o4: Cannot tell
  - q: What does '95% confident' mean?
    o1: 95% of intervals built this way capture the true parameter
    o2: P(parameter in this interval) = 0.95
    o3: 95% of the data lie in the interval
    o4: The sample mean is 95% accurate
  - q: A 95% interval for μ₁ − μ₂ is (−2.1, 4.3). Is there convincing evidence of a difference?
    o1: 'No: 0 lies in the interval'
    o2: 'Yes: the interval is wide'
    o3: 'Yes: it has positive values'
    o4: Cannot tell without the p-value
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The p-value is computed assuming H₀; confidence is about the method, not one interval
  verify:
    authored: true
- template: st-ci-midpoint
  skill: stats.inference
  pace: quick
  given:
    lo:
      pick:
      - 0.32
      - 0.41
      - 0.55
    hi:
      pick:
      - 0.38
      - 0.47
      - 0.63
  prompt: A confidence interval for p is ({{lo}}, {{hi}}). What was the margin of error?
  parts:
  - ask: Answer
    label: v
    tex: ME
    value: (hi - lo)/2
    tol: 0.005
    explain: The interval is estimate ± ME, so ME is half its width and the estimate its midpoint
  verify:
    expect:
      v: (nsimplify(hi) - nsimplify(lo))/2
- template: st-error-type
  skill: stats.inference
  pace: recall
  cases:
  - q: 'H₀: a patient does not have the disease. A test says the patient has it, but they don''t. Which error?'
    o1: Type I
    o2: Type II
    o3: Neither
    o4: Sampling error
  - q: 'H₀: a batch is safe. The test passes a batch that is actually contaminated. Which error?'
    o1: Type II
    o2: Type I
    o3: Neither
    o4: Response bias
  - q: How can β be reduced without raising α?
    o1: Increase the sample size
    o2: Lower α
    o3: Use a two-sided test
    o4: Reduce the effect size
  - q: A study uses α = 0.01 instead of 0.05. What happens?
    o1: Type I errors become rarer, Type II errors more likely
    o2: Both become rarer
    o3: Power increases
    o4: Nothing changes
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Type I: false alarm; Type II: missed effect; more data lowers β'
  verify:
    authored: true
- template: st-error-prob
  skill: stats.inference
  pace: quick
  cases:
  - al: 0.05
    pw: 0.8
    what: a Type I error when H₀ is true
    w: 0
  - al: 0.05
    pw: 0.8
    what: a Type II error at that alternative
    w: 1
  - al: 0.01
    pw: 0.65
    what: a Type II error at that alternative
    w: 1
  - al: 0.1
    pw: 0.9
    what: a Type I error when H₀ is true
    w: 0
  prompt: A test uses α = {{al}} and has power {{pw}} against a specific alternative. What is the probability of {{what}}?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: 'w == 0 ? al : 1 - pw'
    tol: 0.005
    explain: P(Type I) = α; P(Type II) = β = 1 − power
  verify:
    expect:
      v: '[nsimplify(al), 1 - nsimplify(pw)][w]'
- template: st-two-prop-se
  skill: stats.inference
  pace: quick
  given:
    p1:
      pick:
      - 0.4
      - 0.55
      - 0.7
    p2:
      pick:
      - 0.3
      - 0.45
    n1:
      pick:
      - 100
      - 200
    n2:
      pick:
      - 150
      - 250
  prompt: 'Sample 1: p̂₁ = {{p1}} with n₁ = {{n1}}. Sample 2: p̂₂ = {{p2}} with n₂ = {{n2}}. What is the standard error of p̂₁ − p̂₂?'
  parts:
  - ask: Answer
    label: v
    tex: SE
    value: sqrt(p1*(1 - p1)/n1 + p2*(1 - p2)/n2)
    tol: 0.005
    explain: Variances of independent estimates add, so the SEs add in quadrature
  verify:
    expect:
      v: sqrt(nsimplify(p1)*(1 - nsimplify(p1))/n1 + nsimplify(p2)*(1 - nsimplify(p2))/n2)
- template: st-two-prop-ci
  skill: stats.inference
  pace: quick
  cases:
  - p1: 0.62
    p2: 0.5
    se: 0.04
    side: lower
    sg: -1
  - p1: 0.62
    p2: 0.5
    se: 0.04
    side: upper
    sg: 1
  - p1: 0.35
    p2: 0.41
    se: 0.03
    side: upper
    sg: 1
  - p1: 0.8
    p2: 0.7
    se: 0.05
    side: lower
    sg: -1
  prompt: p̂₁ = {{p1}}, p̂₂ = {{p2}}, and the standard error of the difference is {{se}}. With z* = 1.96, what is the {{side}} endpoint of the 95% interval for p₁ − p₂?
  parts:
  - ask: Answer
    label: v
    tex: \text{endpoint}
    value: p1 - p2 + sg*1.96*se
    tol: 0.005
    explain: (p̂₁ − p̂₂) ± z*·SE; check whether 0 falls inside
  verify:
    expect:
      v: nsimplify(p1) - nsimplify(p2) + sg*Rational(196, 100)*nsimplify(se)
- template: st-chisq-df
  skill: stats.inference
  pace: quick
  cases:
  - desc: a 3 × 4 two-way table
    r: 3
    c: 4
  - desc: a 2 × 5 two-way table
    r: 2
    c: 5
  - desc: a goodness-of-fit test with 6 categories
    r: 6
    c: 2
  - desc: a 4 × 4 two-way table
    r: 4
    c: 4
  prompt: A chi-square test uses {{desc}}. How many degrees of freedom?
  parts:
  - ask: Answer
    label: v
    tex: df
    value: (r - 1)*(c - 1)
    final: true
    tol: 0.0001
    explain: 'Two-way: (rows − 1)(columns − 1); goodness of fit with k categories: k − 1'
  verify:
    expect:
      v: (r - 1)*(c - 1)
- template: st-chisq-shape
  skill: stats.inference
  pace: recall
  cases:
  - q: What is the shape of a chi-square distribution with few degrees of freedom?
    o1: Strongly skewed right
    o2: Symmetric
    o3: Skewed left
    o4: Uniform
  - q: What is the mean of a chi-square distribution with df = 8?
    o1: '8'
    o2: '0'
    o3: '16'
    o4: √8
  - q: As df grows, how does the chi-square distribution change?
    o1: It becomes more symmetric and shifts right
    o2: It becomes more skewed
    o3: It shifts left
    o4: It stays the same
  - q: Why is a chi-square test always one-sided (upper tail)?
    o1: Large χ² means observed counts are far from expected in any direction
    o2: χ² can be negative
    o3: The lower tail is undefined
    o4: Convention only
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'χ² is a sum of squared standardised deviations: never negative, mean = df'
  verify:
    authored: true
- template: st-t-margin
  skill: stats.inference
  pace: quick
  cases:
  - n: 16
    s: 8
    ts: 2.131
  - n: 25
    s: 10
    ts: 2.064
  - n: 36
    s: 12
    ts: 2.03
  - n: 9
    s: 6
    ts: 2.306
  prompt: A sample of n = {{n}} has s = {{s}}. Using t* = {{ts}}, what is the margin of error of the confidence interval for μ?
  parts:
  - ask: Answer
    label: v
    tex: ME
    value: ts*s/sqrt(n)
    tol: 0.005
    explain: ME = t*·s/√n with df = n − 1 (t* is read from the table for that df)
  verify:
    expect:
      v: nsimplify(ts)*s/sqrt(n)
- template: st-t-resize
  skill: stats.inference
  pace: quick
  cases:
  - n: 25
    me: 4
    me2: 2
  - n: 30
    me: 6
    me2: 3
  - n: 50
    me: 3
    me2: 1
  - n: 40
    me: 5
    me2: 2.5
  prompt: A t interval from n = {{n}} has margin of error {{me}}. Roughly what sample size gives margin {{me2}} at the same confidence and s?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: n*(me/me2)^2
    tol: 0.005
    explain: ME ∝ 1/√n, so dividing ME by k multiplies n by k²
  verify:
    expect:
      v: n*(nsimplify(me)/nsimplify(me2))**2
- template: st-two-sample-t
  skill: stats.inference
  pace: quick
  cases:
  - m1: 52
    s1: 8
    n1: 32
    m2: 48
    s2: 6
    n2: 30
  - m1: 7.4
    s1: 1.2
    n1: 25
    m2: 6.8
    s2: 1.5
    n2: 25
  - m1: 110
    s1: 15
    n1: 40
    m2: 102
    s2: 12
    n2: 36
  prompt: 'Group 1: x̄₁ = {{m1}}, s₁ = {{s1}}, n₁ = {{n1}}. Group 2: x̄₂ = {{m2}}, s₂ = {{s2}}, n₂ = {{n2}}. What is the two-sample t statistic?'
  parts:
  - ask: Answer
    label: v
    tex: t
    value: (m1 - m2)/sqrt(s1^2/n1 + s2^2/n2)
    tol: 0.005
    explain: 't = (x̄₁ − x̄₂)/√(s₁²/n₁ + s₂²/n₂), with H₀: μ₁ − μ₂ = 0'
  verify:
    expect:
      v: (nsimplify(m1) - nsimplify(m2))/sqrt(nsimplify(s1)**2/n1 + nsimplify(s2)**2/n2)
- template: st-conservative-df
  skill: stats.inference
  pace: quick
  given:
    n1:
      pick:
      - 12
      - 20
      - 35
    n2:
      pick:
      - 15
      - 18
      - 41
  prompt: A two-sample t procedure has n₁ = {{n1}} and n₂ = {{n2}}. What is the conservative degrees of freedom?
  parts:
  - ask: Answer
    label: v
    tex: df
    value: min(n1, n2) - 1
    final: true
    tol: 0.0001
    explain: The conservative choice is the smaller sample size minus 1; software's Welch df is larger
  verify:
    expect:
      v: Min(n1, n2) - 1
- template: st-scatter-describe
  skill: stats.bivariate
  pace: recall
  cases:
  - q: As study hours rise, scores rise in a straight-line pattern with little scatter. Description?
    o1: Strong, positive, linear
    o2: Weak, negative, curved
    o3: Strong, negative, linear
    o4: No association
  - q: A residual plot shows a clear U shape. What does it say?
    o1: A linear model is not appropriate; the relationship is curved
    o2: The line fits well
    o3: There is no relationship
    o4: Residuals are all positive
  - q: A point far to the right of the others in x pulls the line toward it. What is it?
    o1: An influential point (high leverage)
    o2: A residual of zero
    o3: An outlier only in y
    o4: A lurking variable
  - q: A residual plot shows random scatter with a fan shape widening to the right. What does it say?
    o1: Variability of y grows with x
    o2: The model is perfect
    o3: The relationship is curved
    o4: There is no association
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Describe direction, form, strength and unusual points; read the residual plot for form
  verify:
    authored: true
- template: st-residual
  skill: stats.bivariate
  pace: quick
  cases:
  - b0: 12
    b1: 2.5
    xv: 10
    yv: 41
  - b0: 3.2
    b1: 0.8
    xv: 15
    yv: 14
  - b0: 50
    b1: -1.5
    xv: 12
    yv: 30
  - b0: -4
    b1: 3
    xv: 7
    yv: 19
  prompt: The least-squares line is ŷ = {{b0}} + {{b1}}x. An observation has x = {{xv}} and y = {{yv}}. What is its residual?
  parts:
  - ask: Answer
    label: v
    tex: e
    value: yv - (b0 + b1*xv)
    tol: 0.005
    explain: Residual = observed − predicted; positive means the point lies above the line
  verify:
    expect:
      v: nsimplify(yv) - (nsimplify(b0) + nsimplify(b1)*xv)

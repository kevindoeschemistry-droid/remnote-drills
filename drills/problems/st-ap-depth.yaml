- template: st-missing-prob
  skill: stats.expected-value
  pace: quick
  cases:
  - p0: 0.1
    p1: 0.3
    p2: 0.4
  - p0: 0.25
    p1: 0.25
    p2: 0.25
  - p0: 0.5
    p1: 0.2
    p2: 0.2
  - p0: 0.05
    p1: 0.15
    p2: 0.5
  prompt: X takes values 0, 1, 2, 3 with P(0) = {{p0}}, P(1) = {{p1}}, P(2) = {{p2}} and P(3) unknown. What is E(X)?
  parts:
  - ask: Answer
    label: v
    tex: E(X)
    value: p1 + 2*p2 + 3*(1 - p0 - p1 - p2)
    tol: 0.005
    explain: First P(3) = 1 − (sum of the others), then E(X) = Σ x·P(x)
  verify:
    expect:
      v: nsimplify(p1) + 2*nsimplify(p2) + 3*(1 - nsimplify(p0) - nsimplify(p1) - nsimplify(p2))

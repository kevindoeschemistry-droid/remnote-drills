- template: st-systematic-interval
  skill: stats.sampling
  pace: quick
  given:
    N:
      pick:
      - 1200
      - 2000
      - 5000
    n:
      pick:
      - 50
      - 100
    st:
      pick:
      - 3
      - 7
      - 11
    j:
      pick:
      - 2
      - 5
      - 10
  prompt: A list holds {{N}} names and a systematic sample of {{n}} is wanted. What sampling interval k should be used, and with a random start of {{st}}, what is the {{j}}th name chosen? Give the position of that name.
  parts:
  - ask: Answer
    label: v
    tex: \text{position}
    value: st + (j - 1)*N/n
    final: true
    tol: 0.0001
    explain: k = N/n; the chosen positions are start, start + k, start + 2k, …
  verify:
    expect:
      v: nsimplify(st) + (j - 1)*Rational(N, n)
- template: st-conditional-pct
  skill: stats.probability
  pace: quick
  cases:
  - a: 120
    b: 72
    c: 150
    d: 45
    who: seniors
    k: 0
  - a: 120
    b: 72
    c: 150
    d: 45
    who: juniors
    k: 1
  - a: 80
    b: 20
    c: 200
    d: 30
    who: juniors
    k: 1
  - a: 250
    b: 100
    c: 100
    d: 60
    who: all students
    k: 2
  prompt: Of {{a}} seniors, {{b}} drive to school; of {{c}} juniors, {{d}} drive. What percent of {{who}} drive?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 'k == 0 ? 100*b/a : (k == 1 ? 100*d/c : 100*(b + d)/(a + c))'
    tol: 0.005
    explain: A conditional percent divides by its own group's total; the marginal percent divides by the grand total
  verify:
    expect:
      v: 100*[Rational(b, a), Rational(d, c), Rational(b + d, a + c)][k]

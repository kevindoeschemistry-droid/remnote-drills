- template: st-relative-frequency
  skill: stats.descriptive
  pace: quick
  cases:
  - a: 45
    b: 90
    c: 15
    which: bus
    k: 0
  - a: 30
    b: 120
    c: 50
    which: car
    k: 1
  - a: 12
    b: 28
    c: 40
    which: bike
    k: 2
  - a: 60
    b: 75
    c: 15
    which: bus
    k: 0
  prompt: In a survey, {{a}} chose bus, {{b}} chose car and {{c}} chose bike. What percent chose {{which}}?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: '100*(k == 0 ? a : (k == 1 ? b : c))/(a + b + c)'
    tol: 0.005
    explain: Relative frequency = category count ÷ total; it lets groups of different sizes be compared
  verify:
    expect:
      v: 100*[a, b, c][k]/(a + b + c)

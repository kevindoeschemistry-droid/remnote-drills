- template: st-binomial-check
  skill: stats.distributions
  pace: recall
  cases:
  - q: Draw 5 cards without replacement from a standard deck and count hearts. Why is it not binomial?
    o1: Draws are not independent; p changes
    o2: Outcomes are not binary
    o3: n is not fixed
    o4: There are too few trials
  - q: Roll a die until a 6 appears and count rolls. Why is it not binomial?
    o1: The number of trials is not fixed (it is geometric)
    o2: p changes
    o3: Outcomes are not binary
    o4: Rolls are dependent
  - q: Survey 20 people from a city of 2 million and count those who own a car. Binomial?
    o1: 'Approximately: the sample is under 10% of the population'
    o2: 'No: without replacement always breaks it'
    o3: 'No: car ownership is not binary'
    o4: Only if p = 0.5
  - q: Count heads in 10 tosses of a fair coin. Which conditions hold?
    o1: 'All four: binary, independent, fixed n, same p'
    o2: Only binary and fixed n
    o3: Only independence
    o4: None
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'BINS: Binary, Independent, Number fixed, Same probability'
  verify:
    authored: true
- template: st-at-least-one
  skill: stats.distributions
  pace: quick
  given:
    n:
      pick:
      - 5
      - 10
      - 20
    p:
      pick:
      - 0.02
      - 0.05
      - 0.1
  prompt: Each of {{n}} independent parts fails with probability {{p}}. What is the probability that at least one fails?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: 1 - (1 - p)^n
    tol: 0.005
    explain: 'P(at least one) = 1 − P(none) = 1 − (1 − p)ⁿ: easier than adding every case'
  verify:
    expect:
      v: 1 - (1 - nsimplify(p))**n
- template: st-ten-percent
  skill: stats.sampling
  pace: quick
  given:
    N:
      pick:
      - 800
      - 1500
      - 4200
      - 25000
  prompt: Sampling without replacement from a population of {{N}}, what is the largest sample size that meets the 10% condition?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: floor(N/10)
    final: true
    tol: 0.0001
    explain: n ≤ N/10 keeps draws nearly independent, so the usual standard-deviation formulas hold
  verify:
    expect:
      v: floor(Rational(N, 10))
- template: st-clt-conditions
  skill: stats.sampling
  pace: quick
  cases:
  - q: A population is strongly skewed. When is the sampling distribution of x̄ approximately normal?
    o1: When n is large, about 30 or more (CLT)
    o2: Never
    o3: Only when n < 10
    o4: Only for proportions
  - q: n = 50 and p = 0.04. Is the sampling distribution of p̂ approximately normal?
    o1: 'No: np = 2 is below 10'
    o2: 'Yes: n ≥ 30'
    o3: 'Yes: p is small'
    o4: Only if the population is normal
  - q: A population is normal. How large must n be for x̄ to be normal?
    o1: Any n
    o2: At least 30
    o3: At least 100
    o4: n must equal 10% of N
  - q: What happens to the SD of x̄ when n is multiplied by 4?
    o1: It halves
    o2: It doubles
    o3: It quarters
    o4: It does not change
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Large counts for proportions, the CLT for means, and σ/√n for spread
  verify:
    authored: true

- template: st-sim-estimate
  skill: stats.probability
  pace: quick
  given:
    tr:
      pick:
      - 50
      - 100
      - 200
      - 500
    hits:
      pick:
      - 7
      - 13
      - 21
      - 42
  prompt: In {{tr}} simulated trials, the event happened {{hits}} times. What is the estimated probability, as a decimal?
  parts:
  - ask: Answer

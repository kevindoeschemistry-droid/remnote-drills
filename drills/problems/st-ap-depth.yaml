# Generated by scripts/second_types.py from scripts/second_specs/st3.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: st-shape-from-summary
  skill: stats.descriptive
  pace: recall
  cases:
  - q: A distribution has mean 52 and median 41. What shape is most likely?
    o1: Skewed right
    o2: Skewed left
    o3: Symmetric
    o4: Uniform
  - q: A distribution has mean 18 and median 23. What shape is most likely?
    o1: Skewed left
    o2: Skewed right
    o3: Symmetric
    o4: Bimodal
  - q: Household incomes in a town are strongly skewed right. Which pair best describes centre and spread?
    o1: Median and IQR
    o2: Mean and SD
    o3: Mean and range
    o4: Mode and SD
  - q: Test scores are roughly symmetric with no outliers. Which pair best describes centre and spread?
    o1: Mean and SD
    o2: Median and range
    o3: Mode and IQR
    o4: Maximum and minimum
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: The mean is pulled toward the long tail; resistant summaries (median, IQR) suit skewed data
  verify:
    authored: true
- template: st-add-outlier
  skill: stats.descriptive
  pace: quick
  given:
    n:
      pick:
      - 9
      - 19
      - 24
    m:
      pick:
      - 40
      - 50
      - 62
    big:
      pick:
      - 150
      - 300
      - 500
  prompt: A data set of {{n}} values has mean {{m}}. A value of {{big}} is added. What is the new mean?
  parts:
  - ask: Answer
    label: v
    tex: \bar x
    value: (n*m + big)/(n + 1)
    tol: 0.005
    explain: 'New mean = (old total + new value)/(n + 1); the median would barely move: the mean is not resistant'
  verify:
    expect:
      v: solve(Eq(x*(n + 1), n*m + big), x)[0]
- template: st-units-mean
  skill: stats.descriptive
  pace: quick
  cases:
  - m: 20
    s: 5
    what: mean
    w: 0
  - m: 20
    s: 5
    what: standard deviation
    w: 1
  - m: 35
    s: 2.5
    what: mean
    w: 0
  - m: 12
    s: 4
    what: standard deviation
    w: 1
  prompt: Temperatures in °C have mean {{m}} and SD {{s}}. Converted to °F (F = 32 + 1.8C), what is the new {{what}}?
  parts:
  - ask: Answer
    label: v
    tex: y
    value: 'w == 0 ? 32 + 1.8*m : 1.8*s'
    tol: 0.005
    explain: Adding a constant shifts centre but not spread; multiplying scales both
  verify:
    expect:
      v: '[32 + Rational(9, 5)*nsimplify(m), Rational(9, 5)*nsimplify(s)][w]'
- template: st-units-iqr
  skill: stats.descriptive
  pace: quick
  cases:
  - q: 4
    med: 30
    what: IQR
    w: 0
  - q: 4
    med: 30
    what: median
    w: 1
  - q: 1.5
    med: 12
    what: IQR
    w: 0
  - q: 10
    med: 64
    what: median
    w: 1
  prompt: Lengths in inches have IQR {{q}} and median {{med}}. In centimetres (1 in = 2.54 cm), what is the new {{what}}?
  parts:
  - ask: Answer
    label: v
    tex: y
    value: 'w == 0 ? 2.54*q : 2.54*med'
    tol: 0.005
    explain: A change of units multiplies every value, so every measure of position and spread scales by the same factor
  verify:
    expect:
      v: Rational(254, 100)*[nsimplify(q), nsimplify(med)][w]

# Second question types; keys recomputed by sympy along another route.

- template: co-phosphate-fraction
  skill: olympiad.equilibria
  pace: quick
  given:
    pH:
      pick:
      - 4.7
      - 6.0
      - 7.2
      - 8.5
  prompt: Phosphoric acid has pKa values 2.15, 7.20 and 12.35. What fraction of the total phosphate is H₂PO₄⁻ at pH {{pH}}?
  parts:
  - ask: Answer
    label: v
    tex: \alpha_1
    value: (10^(-pH))^2*10^(-2.15)/((10^(-pH))^3 + (10^(-pH))^2*10^(-2.15) + 10^(-pH)*10^(-9.35) + 10^(-21.7))
    tol: 0.005
    explain: 'Write every species relative to H₂PO₄⁻: [H₃PO₄]/[H₂PO₄⁻] = h/K₁, [HPO₄²⁻]/[H₂PO₄⁻] = K₂/h, and so on'
  verify:
    expect:
      v: 1/(10**(nsimplify(-pH) + Rational(215, 100)) + 1 + 10**(Rational(-720, 100) + nsimplify(pH)) + 10**(Rational(-1955, 100) + 2*nsimplify(pH)))
- template: co-buffer-capacity-acid
  skill: olympiad.equilibria
  pace: quick
  given:
    na:
      pick:
      - 10
      - 20
    nb:
      pick:
      - 15
      - 25
    pk:
      pick:
      - 4.76
      - 7.21
    d:
      pick:
      - 0.1
      - 0.2
      - 0.3
  prompt: A buffer holds {{na}} mmol HA and {{nb}} mmol A⁻ (pKa {{pk}}). How many mmol of HCl lower its pH by {{d}}?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: (nb - nb/na*10^(-d)*na)/(1 + nb/na*10^(-d))
    tol: 0.005
    explain: Acid converts A⁻ to HA mole for mole; set the new ratio equal to the old one times 10^(−Δ). The pKa cancels
  verify:
    expect:
      v: solve(Eq(nsimplify(nb) - x, nsimplify(nb)/nsimplify(na)*10**(-nsimplify(d))*(nsimplify(na) + x)), x)[0]
- template: co-solubility-ph-factor
  skill: olympiad.equilibria
  pace: quick
  given:
    pk:
      pick:
      - 3.17
      - 4.76
    p1:
      pick:
      - 2
      - 3
      - 4
  prompt: MA is the salt of a weak acid HA (pKa {{pk}}). By what factor is its solubility at pH {{p1}} larger than at pH 7?
  parts:
  - ask: Answer
    label: v
    tex: s/s_7
    value: sqrt((1 + 10^(-p1)/10^(-pk))/(1 + 10^(-7)/10^(-pk)))
    tol: 0.005
    explain: 's = √(Ksp(1 + h/Ka)): protons pull A⁻ away as HA'
  verify:
    expect:
      v: sqrt((1 + 10**(nsimplify(pk) - nsimplify(p1)))/(1 + 10**(nsimplify(pk) - 7)))
- template: co-kc-from-kp
  skill: olympiad.equilibria
  pace: quick
  given:
    Kp:
      pick:
      - 0.015
      - 1.8
      - 340.0
    T:
      pick:
      - 500
      - 700
  cases:
  - rx: N₂ + 3H₂ ⇌ 2NH₃
    dn: -2
  - rx: PCl₅ ⇌ PCl₃ + Cl₂
    dn: 1
  - rx: 2SO₂ + O₂ ⇌ 2SO₃
    dn: -1
  prompt: For {{rx}}, K_p = {{Kp}} at {{T}} K (pressures in atm). What is K_c? (R = 0.082057 L·atm/mol·K)
  parts:
  - ask: Answer
    label: v
    tex: K_c
    value: Kp/(0.082057*T)^dn
    tol: 0.005
    explain: K_p = K_c(RT)^Δn, with Δn the change in moles of gas
  verify:
    expect:
      v: solve(Eq(x*(Rational('0.082057')*nsimplify(T))**dn, nsimplify(Kp)), x)[0]
- template: co-pressure-for-alpha
  skill: olympiad.equilibria
  pace: quick
  given:
    Kp:
      pick:
      - 0.15
      - 0.66
    a:
      pick:
      - 0.2
      - 0.3
      - 0.5
  prompt: For N₂O₄ ⇌ 2NO₂, K_p = {{Kp}} bar. At what total pressure, in bar, is N₂O₄ dissociated to α = {{a}}?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: Kp*(1 - a^2)/(4*a^2)
    tol: 0.005
    explain: 'K_p = 4α²P/(1 − α²): higher pressure pushes toward fewer moles'
  verify:
    expect:
      v: solve(Eq(4*nsimplify(a)**2*x/(1 - nsimplify(a)**2), nsimplify(Kp)), x)[0]
- template: co-ksp-from-e
  skill: olympiad.electrochem
  pace: quick
  cases:
  - X: AgCl
    E2: 0.22233
  - X: AgBr
    E2: 0.07133
  - X: AgI
    E2: -0.15224
  prompt: E°(Ag⁺/Ag) = 0.7996 V and E°({{X}}/Ag) = {{E2}} V. What is K_sp of {{X}} at 25 °C?
  parts:
  - ask: Answer
    label: v
    tex: K_{sp}
    value: exp((E2 - 0.7996)*96485.33212/(8.314462618*298.15))
    tol: 0.005
    explain: The two half-reactions differ by AgX ⇌ Ag⁺ + X⁻, so nFΔE° = RT ln K_sp
  verify:
    expect:
      v: 10**((nsimplify(E2) - Rational(7996, 10000))/(Rational('8.314462618')*Rational(29815, 100)*log(10)/Rational('96485.33212')))
- template: co-current-needed
  skill: olympiad.electrochem
  pace: quick
  given:
    m:
      pick:
      - 0.5
      - 1.2
      - 2.5
    t:
      pick:
      - 15
      - 30
      - 60
  cases:
  - M: copper
    ion: Cu²⁺
    z: 2
    Mm: 63.546
  - M: silver
    ion: Ag⁺
    z: 1
    Mm: 107.868
  - M: aluminium
    ion: Al³⁺ (molten)
    z: 3
    Mm: 26.982
  prompt: What current, in A, deposits {{m}} g of {{M}} from {{ion}} in {{t}} minutes?
  parts:
  - ask: Answer
    label: v
    tex: I
    value: m/Mm*z*96485.33212/(t*60)
    tol: 0.005
    explain: Charge = moles × electrons per ion × F; current = charge / seconds
  verify:
    expect:
      v: solve(Eq(x*nsimplify(t)*60/Rational('96485.33212')/z, nsimplify(m)/nsimplify(Mm)), x)[0]
- template: co-lattice-compare
  skill: olympiad.thermochem
  pace: recall
  cases:
  - q: Which has the largest lattice enthalpy?
    o1: MgO
    o2: NaCl
    o3: KBr
    o4: CsI
  - q: Why is the lattice enthalpy of LiF larger than that of CsI?
    o1: Smaller ions sit closer, and the Coulomb energy goes as 1/r
    o2: LiF has higher charges
    o3: CsI is covalent
    o4: LiF has more ions per formula
  - q: A Born–Haber lattice enthalpy far exceeds the ionic-model value. What does that suggest?
    o1: Significant covalent character in the bonding
    o2: The ions are larger than thought
    o3: An error in the electron affinity sign only
    o4: The solid is a metal
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Lattice energy rises with charge product and falls with distance; a gap from the ionic model signals covalency
  verify:
    authored: true
- template: co-bond-from-dh
  skill: olympiad.thermochem
  pace: quick
  cases:
  - X: Cl
    dH: -184.6
    b: 243
  - X: F
    dH: -542
    b: 158
  - X: Br
    dH: -103.4
    b: 193
  prompt: For H₂(g) + {{X}}₂(g) → 2H{{X}}(g), ΔH = {{dH}} kJ. With D(H–H) = 436 and D({{X}}–{{X}}) = {{b}} kJ/mol, what is D(H–{{X}}), in kJ/mol?
  parts:
  - ask: Answer
    label: v
    tex: D
    value: (436 + b - dH)/2
    tol: 0.005
    explain: ΔH = bonds broken − bonds made
  verify:
    expect:
      v: solve(Eq(436 + nsimplify(b) - 2*x, nsimplify(dH)), x)[0]
- template: co-half-life-scaling
  skill: olympiad.kinetics
  pace: quick
  given:
    f:
      pick:
      - 2
      - 3
      - 0.5
  cases:
  - ord: zero
    o: 0
  - ord: first
    o: 1
  - ord: second
    o: 2
  prompt: A reaction is {{ord}} order in A. The initial concentration is multiplied by {{f}}. By what factor does the half-life change?
  parts:
  - ask: Answer
    label: v
    tex: t'/t
    value: f^(1 - o)
    tol: 0.005
    explain: 't½ = [A]₀/2k, ln2/k, 1/(k[A]₀): only first order is independent of concentration'
  verify:
    expect:
      v: nsimplify(f) if o == 0 else (1 if o == 1 else 1/nsimplify(f))
- template: co-daughter-max-time
  skill: olympiad.kinetics
  pace: quick
  given:
    T1:
      pick:
      - 6
      - 10
      - 20
    T2:
      pick:
      - 2
      - 3
      - 4
  prompt: A parent with half-life {{T1}} h decays to a daughter with half-life {{T2}} h. When does the daughter population peak, in h?
  parts:
  - ask: Answer
    label: v
    tex: t_{max}
    value: log(T1/T2)/(log(2)/T2 - log(2)/T1)
    tol: 0.005
    explain: dN_D/dt = 0 when k₁N_P = k₂N_D, at t = ln(k₂/k₁)/(k₂ − k₁)
  verify:
    expect:
      v: log(nsimplify(T1)/nsimplify(T2))/(log(2)*(1/nsimplify(T2) - 1/nsimplify(T1)))
- template: co-freezing-predict
  skill: olympiad.solutions
  pace: quick
  given:
    m:
      pick:
      - 0.05
      - 0.1
      - 0.2
    ap:
      pick:
      - 5
      - 12
      - 30
  cases:
  - s: HF
    nu: 2
  - s: a weak MX₂ salt
    nu: 3
  - s: CH₃COOH
    nu: 2
  prompt: A {{m}} mol/kg aqueous solution of {{s}} is {{ap}}% dissociated. What is the freezing-point depression, in K? (K_f = 1.86 K·kg/mol)
  parts:
  - ask: Answer
    label: v
    tex: \Delta T_f
    value: 1.86*m*(1 + ap/100*(nu - 1))
    tol: 0.005
    explain: 'i = 1 + α(ν − 1): undissociated units count once, dissociated ones ν times'
  verify:
    expect:
      v: Rational(186, 100)*nsimplify(m)*(1 - nsimplify(ap)/100 + nu*nsimplify(ap)/100)
- template: co-m2-ratio
  skill: olympiad.spectro
  pace: quick
  given:
    k:
      pick:
      - 1
      - 2
      - 3
  cases:
  - X: chlorine
    p: 0.2424
  - X: bromine
    p: 0.4931
  prompt: A compound has {{k}} {{X}} atom(s). What is the ratio of the M+2 peak to the M peak? (³⁷Cl 24.24%, ⁸¹Br 49.31%)
  parts:
  - ask: Answer
    label: v
    tex: I_{M+2}/I_M
    value: k*p/(1 - p)
    tol: 0.005
    explain: M is all light isotopes; M+2 has exactly one heavy atom, in k places
  verify:
    expect:
      v: binomial(k, 1)*nsimplify(p)*(1 - nsimplify(p))**(k - 1)/(1 - nsimplify(p))**k
- template: co-multiplet-centre
  skill: olympiad.spectro
  pace: quick
  given:
    N:
      pick:
      - 2
      - 4
      - 6
  prompt: A proton couples equally to {{N}} neighbouring protons. In its multiplet, how many times more intense is the central line than an outer line?
  parts:
  - ask: Answer
    label: v
    tex: ''
    value: 'N == 2 ? 2 : (N == 4 ? 6 : 20)'
    final: true
    tol: 0.0001
    explain: 'Line intensities follow Pascal''s triangle: 1:2:1, 1:4:6:4:1, 1:6:15:20:15:6:1'
  verify:
    expect:
      v: factorial(N)/factorial(N/2)**2

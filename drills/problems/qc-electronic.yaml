- template: qc-potential-from-dg
  skill: qchem.properties
  pace: quick
  given:
    nel:
      pick:
      - 1
      - 2
      - 4
    dg:
      pick:
      - -237.1
      - -474.2
      - -131.3
  prompt: A reaction with {{nel}} electrons has a free-energy change of {{dg}} kJ/mol. What is the standard potential (V), using F = 96485.33212 C/mol?
  parts:
  - ask: Answer
    label: v
    tex: V
    value: -dg*1000/(nel*96485.33212)
    tol: 0.005
    explain: E = -dG/(nF); a computed potential also needs a reference electrode to be comparable with experiment
  verify:
    expect:
      v: -nsimplify(dg)*1000/(nel*Rational('96485.33212'))
- template: qc-cost-decision
  skill: qchem.properties
  pace: quick
  given:
    k1:
      pick:
      - 100
      - 120
    hr:
      pick:
      - 2
      - 6
      - 12
    k2:
      pick:
      - 150
      - 200
      - 240
  prompt: A CCSD(T) job on a {{k1}}-function basis took {{hr}} hours. Scaling as the seventh power, how many hours would a {{k2}}-function basis take?
  parts:
  - ask: Answer
    label: v
    tex: hours
    value: hr*(k2/k1)^7
    tol: 0.005
    explain: 'The arithmetic that decides a project: at N^7 a modest basis increase turns hours into weeks'
  verify:
    expect:
      v: hr*Rational(k2, k1)**7

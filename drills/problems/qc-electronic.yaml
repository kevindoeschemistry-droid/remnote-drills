  pace: recall
  cases:
  - q: 'Correlation energy is defined as:'
    o1: The exact non-relativistic energy minus the Hartree-Fock energy, in the same basis
    o2: The Hartree-Fock energy itself
    o3: The nuclear repulsion
    o4: The zero-point energy
  - q: 'The sign of the correlation energy is:'
    o1: 'Negative: correlation always lowers the energy'
    o2: Positive
    o3: Either
    o4: Zero
  - q: Hartree-Fock already includes which correlation?
    o1: Same-spin (Fermi) correlation, through exchange antisymmetry
    o2: Opposite-spin correlation
    o3: All correlation
    o4: None at all
  - q: 'Two electrons of opposite spin in Hartree-Fock:'
    o1: See only each other's average field, so their instantaneous repulsion is missed
    o2: Are fully correlated
    o3: Cannot occupy the same orbital
    o4: Do not interact
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Exchange gives same-spin correlation for free; the missing piece is opposite-spin
  verify:
    authored: true

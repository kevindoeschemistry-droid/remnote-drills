- template: qc-dft-pitfalls
  skill: qchem.dft
  pace: recall
  cases:
  - q: 'Plain (non-dispersion-corrected) functionals miss:'
    o1: Long-range dispersion, so stacked and van der Waals complexes are under-bound
    o2: Exchange
    o3: Electrostatics
    o4: The nuclear repulsion
  - q: 'Self-interaction error in DFT shows up most in:'
    o1: Charge-transfer states and reaction barriers
    o2: Bond lengths of small molecules
    o3: Nuclear repulsion
    o4: Zero-point energies
  - q: 'A range-separated hybrid helps because it:'
    o1: Makes the fraction of exact exchange depend on distance, improving long-range behaviour
    o2: Removes the basis set
    o3: Adds dispersion
    o4: Lowers the cost

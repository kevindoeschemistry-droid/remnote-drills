- template: qc-orbital-count
  skill: qchem.orbitals
  pace: quick
  given:
    ne:
      pick:
      - 10
      - 14
      - 20
      - 42
    kk:
      pick:
      - 25
      - 48
      - 115
  prompt: A closed-shell molecule has {{ne}} electrons and is run in a basis of {{kk}} functions. How many virtual spatial orbitals are there?
  parts:
  - ask: Answer
    label: v
    tex: virtuals
    value: kk - ne/2
    final: true
    tol: 0.0001
    explain: 'N/2 spatial orbitals are occupied in a closed shell, so the rest of the K are virtual: the occupied-virtual product is what every correlation method sums over'
  verify:
    expect:
      v: kk - Rational(ne, 2)
- template: qc-double-excitations
  skill: qchem.orbitals
  pace: quick
  given:
    'no':
      pick:
      - 5
      - 7
      - 10
    nv:
      pick:
      - 20
      - 41
      - 105
  prompt: With {{no}} occupied and {{nv}} virtual spatial orbitals, how many distinct pairs of (occupied, virtual) single excitations are there?
  parts:
  - ask: Answer
    label: v
    tex: excitations
    value: no*nv
    final: true
    tol: 0.0001
    explain: The single-excitation space is the product; the double space goes as its square, which is where the cost of correlation methods comes from
  verify:
    expect:
      v: no*nv

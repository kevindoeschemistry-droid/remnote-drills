- template: qc-s-squared
  skill: qchem.hartree-fock
  pace: quick
  given:
    mult:
      pick:
      - 1
      - 2
      - 3
      - 4
      - 5
  prompt: What is the expected value of S squared for a pure state of multiplicity {{mult}}?
  parts:
  - ask: Answer
    label: v
    tex: \langle S^2\rangle
    value: ((mult - 1)/2)*((mult - 1)/2 + 1)
    tol: 0.005
    explain: 'S = (multiplicity - 1)/2 and the expectation is S(S+1): 0, 0.75, 2, 3.75, 6. A UHF value well above this is contaminated'
  verify:
    expect:
      v: Rational(mult - 1, 2)*(Rational(mult - 1, 2) + 1)
- template: qc-scf-order
  skill: qchem.hartree-fock
  pace: recall
  cases:
  - q: Which comes first in an SCF cycle?
    o1: Build the one-electron (core) Hamiltonian and overlap matrices, which do not change
    o2: Form the density from the orbitals
    o3: Diagonalise the Fock matrix
    o4: Check convergence
  - q: 'The Fock matrix depends on the density, which depends on the orbitals, which come from the Fock matrix. This is why:'
    o1: The procedure must be iterated to self-consistency
    o2: The method is exact
    o3: No guess is needed
    o4: The energy is variational only at the start
  - q: 'SCF convergence is judged on:'
    o1: The change in the density and the energy between cycles
    o2: The number of basis functions
    o3: The nuclear repulsion
    o4: The molecular symmetry
  - q: 'The nuclear repulsion energy during an SCF at fixed geometry:'
    o1: Stays constant, because it depends only on the nuclei
    o2: Changes each cycle
    o3: Is zero
    o4: Is iterated like the density
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Fixed integrals, then guess, build, diagonalise, rebuild, until nothing moves
  verify:
    authored: true

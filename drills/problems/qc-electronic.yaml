    o4: Not converge
  - q: 'For a main-group thermochemistry screen, a reasonable default is:'
    o1: A well-tested hybrid with a dispersion correction
    o2: LDA
    o3: Hartree-Fock
    o4: Full CI
  - q: 'Double hybrids cost more than hybrids because they:'
    o1: Add a perturbative correlation term, which scales like MP2
    o2: Use larger grids
    o3: Need diffuse functions
    o4: Add exact exchange twice
  - q: 'A functional''s performance is established by:'
    o1: Benchmarking against reference data for the property in question
    o2: Its rung alone
    o3: Its age
    o4: Its cost
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Rung guides the choice; benchmarks decide it
  verify:
    authored: true
- template: qc-exchange-fraction
  skill: qchem.dft
  pace: quick
  cases:
  - mix: -8.356
    ex: -8.42
    hfx: -8.1
  - mix: -12.8125
    ex: -12.95
    hfx: -12.4
  - mix: -8.26
    ex: -8.42
    hfx: -8.1
  prompt: A hybrid's mixed exchange is {{mix}} hartree, built from {{ex}} hartree of functional exchange and {{hfx}} hartree of exact exchange. What fraction of exact exchange (per cent) does it use?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: (mix - ex)/(hfx - ex)*100
    tol: 0.005
    explain: Inverting the blend recovers the mixing fraction, which is the single number that most distinguishes one hybrid from another
  verify:
    expect:
      v: (nsimplify(mix) - nsimplify(ex))/(nsimplify(hfx) - nsimplify(ex))*100
- template: qc-dispersion-share
  skill: qchem.dft
  pace: quick
  cases:
  - tot: -12.4
    dsp: -7.6
  - tot: -3.1
    dsp: -2.8
  - tot: -24.0
    dsp: -4.2
  - tot: -8.8
    dsp: -5.9
  prompt: An interaction energy is {{tot}} kcal/mol, of which the dispersion correction supplies {{dsp}}. What percentage of the binding comes from the correction?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*dsp/tot
    tol: 0.005
    explain: When most of the binding comes from the empirical correction, the result rests on that correction's parameters rather than on the functional
  verify:
    expect:
      v: 100*nsimplify(dsp)/nsimplify(tot)
- template: qc-grid-and-noise
  skill: qchem.dft
  pace: recall
  cases:
  - q: 'A numerical integration grid is needed in DFT because:'
    o1: The exchange-correlation functional cannot be integrated analytically
    o2: The basis is non-orthogonal
    o3: The density is complex
    o4: The nuclei move
  - q: 'A grid that is too coarse shows up as:'
    o1: Energy differences and gradients that change when the grid is refined
    o2: A failed SCF only
    o3: A wrong nuclear repulsion
    o4: A basis-set error
  - q: 'Grid quality matters most for:'
    o1: Small energy differences, such as conformer gaps and weak interactions
    o2: Total energies only
    o3: Bond lengths only
    o4: Nothing
  - q: 'Before reporting a small DFT energy difference you should:'
    o1: Repeat it on a finer grid to confirm it is not numerical noise
    o2: Report it as is
    o3: Shrink the basis
    o4: Loosen SCF convergence
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Grid noise looks exactly like a real small energy difference, so check it
  verify:
    authored: true
- template: qc-opt-practice
  skill: qchem.properties
  pace: recall
  cases:
  - q: 'A geometry optimisation that converges to a structure with one imaginary frequency has found:'
    o1: A transition state, not a minimum
    o2: A minimum
    o3: A failed calculation
    o4: A complete-basis result
  - q: 'A frequency calculation at a geometry that was not fully optimised gives:'
    o1: Spurious small imaginary frequencies that are artefacts
    o2: Exact frequencies
    o3: No frequencies
    o4: The correct ZPE
  - q: 'To confirm a transition state connects the intended reactant and product you:'
    o1: Follow the imaginary mode downhill in both directions
    o2: Check the energy only
    o3: Compute the dipole
    o4: Enlarge the basis
  - q: 'Optimising in a small basis then computing the energy in a large one is:'
    o1: A standard and defensible compromise, as long as both levels are reported
    o2: Never acceptable

- template: in-bragg-edge
  skill: inorg.solids
  pace: quick
  given:
    lam:
      pick:
      - 154.06
      - 71.07
    th:
      pick:
      - 12.5
      - 19.2
      - 21.7
  cases:
  - h: 1
    k: 1
    l: 1
  - h: 2
    k: 0
    l: 0
  - h: 2
    k: 2
    l: 0
  prompt: X-rays of wavelength {{lam}} pm reflect from the ({{h}}{{k}}{{l}}) planes of a cubic crystal at θ = {{th}}° (first order). What is the cell edge, in pm?
  parts:
  - ask: Answer
    label: v
    tex: a
    value: lam/(2*sin(th*pi/180))*sqrt(h^2 + k^2 + l^2)
    tol: 0.005
    explain: d = λ/(2 sin θ), then a = d·√(h² + k² + l²)
  verify:
    expect:
      v: solve(Eq(2*(x/sqrt(h**2 + k**2 + l**2))*sin(nsimplify(th)*pi/180), nsimplify(lam)), x)[0]

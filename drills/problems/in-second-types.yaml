- template: in-radius-from-edge
  skill: inorg.solids
  pace: quick
  given:
    a:
      pick:
      - 286.6
      - 361.5
      - 408.6
  cases:
  - lat: simple cubic
    k: 1
  - lat: body-centred cubic
    k: 2
  - lat: face-centred cubic

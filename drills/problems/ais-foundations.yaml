- template: ais-power-law-loss
  skill: ais.foundations
  pace: quick
  given:
    Linf:
      pick:
      - 1.7
      - 1.8
    a:
      pick:
      - 1.5
      - 2.0
    al:
      pick:
      - 0.05
      - 0.1
    c:
      pick:
      - 10
      - 100
      - 1000
  prompt: Loss follows L(C) = {{Linf}} + {{a}}·C^(−{{al}}) with C in units of 10²¹ FLOP. What loss is predicted at C = {{c}} (×10²¹ FLOP)?
  parts:
  - ask: Answer
    label: v
    tex: L
    value: Linf + a*c^(-al)
    tol: 0.005
    explain: Above the irreducible loss the reducible part falls as a power of compute
  verify:
    expect:
      v: nsimplify(Linf) + nsimplify(a)*c**(-nsimplify(al))

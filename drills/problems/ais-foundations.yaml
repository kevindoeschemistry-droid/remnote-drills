      pick:
      - 80
      - 90
    p:
      pick:
      - 0.25
      - 0.5
      - 0.8
  prompt: 'Weak: {{w}}%, ceiling: {{c}}%. What weak-to-strong score gives PGR = {{p}}?'
  parts:
  - ask: Answer
    label: v
    tex: W2S
    value: w + p*(c - w)
    tol: 0.005
    explain: Rearrange PGR for the student score
  verify:
    expect:
      v: solve(Eq((Symbol('s2') - w)/(c - w), nsimplify(p)), Symbol('s2'))[0]

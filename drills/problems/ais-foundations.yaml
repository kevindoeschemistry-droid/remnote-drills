- template: ais-residual-stream
  skill: ais.foundations
  pace: quick
  cases:
  - q: In a decoder-only transformer, which component moves information between token positions?
    o1: Attention
    o2: The MLP
    o3: The unembedding
    o4: LayerNorm
  - q: Which component transforms each position separately, with no cross-position mixing?
    o1: The MLP
    o2: Attention
    o3: The causal mask
    o4: Positional embedding
  - q: How do a layer's attention and MLP outputs reach later layers?
    o1: They are added into the shared residual stream
    o2: They replace the residual stream
    o3: They go straight to the unembedding
    o4: They are multiplied into the embeddings
  - q: 'Causal masking means position t can attend to:'
    o1: Only positions ≤ t
    o2: Every position
    o3: Only position t
    o4: Only positions > t
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Every component reads from and writes back into one residual stream
  verify:
    authored: true
- template: ais-temperature-ratio
  skill: ais.foundations
  pace: quick
  given:
    l1:
      pick:
      - 3
      - 4
      - 5
    l2:
      pick:
      - 1
      - 2
    T:
      pick:
      - 0.5
      - 1
      - 2
  prompt: Two tokens have logits {{l1}} and {{l2}}. Sampling at temperature T = {{T}}, what is the ratio of their probabilities p₁/p₂?
  parts:
  - ask: Answer
    label: v
    tex: p_1/p_2
    value: exp((l1 - l2)/T)
    tol: 0.005
    explain: 'softmax(z/T): the ratio is e^(Δz/T); low T sharpens, high T flattens'
  verify:
    expect:
      v: exp((l1 - l2)/nsimplify(T))

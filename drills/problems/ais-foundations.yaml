- template: ais-probe-selectivity
  skill: ais.interp
  pace: quick
  given:
    a:
      pick:
      - 92
      - 95
      - 97
    b:
      pick:
      - 60
      - 75
      - 88
  prompt: A probe gets {{a}}% on the real task and {{b}}% on a control task with random labels per word type. What is its selectivity?
  parts:
  - ask: Answer
    label: v
    tex: \text{sel}
    value: a - b
    tol: 0.005
    explain: Selectivity = task accuracy − control accuracy; a probe that also aces the control is learning the task itself
  verify:
    expect:
      v: a - b

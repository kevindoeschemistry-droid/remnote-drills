  verify:
    authored: true
- template: ais-steering-mean
  skill: ais.interp
  pace: quick
  given:
    ma:
      pick:
      - 3
      - 4
    mb:
      pick:
      - -1
      - 0
    x0:
      pick:
      - -1
      - 0
  prompt: On a 1-D projection, activations for prompts of type A average {{ma}} and for type B average {{mb}}. Adding α times the steering vector to a B prompt (projection {{x0}}) moves it to the A mean when α equals what?
  parts:
  - ask: Answer
    label: v
    tex: \alpha
    value: (ma - x0)/(ma - mb)
    tol: 0.005
    explain: v = μ_A − μ_B; solve x₀ + αv = μ_A
  verify:
    expect:
      v: solve(Eq(x0 + Symbol('al')*(ma - mb), ma), Symbol('al'))[0]

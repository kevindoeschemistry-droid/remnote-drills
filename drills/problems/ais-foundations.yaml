- template: ais-patching-recovered
  skill: ais.interp
  pace: quick
  given:
    c:
      pick:
      - 4.0
      - 5.0
    k:
      pick:
      - -1.0
      - 0.0
    p:
      pick:
      - 1.5
      - 2.5
      - 3.5
  prompt: 'Logit difference: clean {{c}}, corrupted {{k}}, and {{p}} after patching one head''s clean activation into the corrupted run. What fraction is recovered?'
  parts:
  - ask: Answer
    label: v
    tex: \text{rec}
    value: (p - k)/(c - k)
    tol: 0.005
    explain: (LD_patched − LD_corrupt)/(LD_clean − LD_corrupt)
  verify:
    expect:
      v: (nsimplify(p) - nsimplify(k))/(nsimplify(c) - nsimplify(k))

      pick:
      - 60
      - 65
    s:
      pick:
      - 72
      - 78
    c:
      pick:
      - 85
      - 90
  prompt: 'Weak supervisor: {{w}}%. Strong student trained on weak labels: {{s}}%. Strong ceiling: {{c}}%. Find the performance gap recovered.'
  parts:
  - ask: Answer
    label: v
    tex: PGR
    value: (s - w)/(c - w)
    tol: 0.005
    explain: PGR = (W2S − weak)/(ceiling − weak)
  verify:
    expect:
      v: Rational(s - w, c - w)

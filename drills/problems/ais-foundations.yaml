    o4: The model is aligned
  - q: 'Too large an α usually:'
    o1: Degrades fluency and capability
    o2: Has no effect
    o3: Improves accuracy
    o4: Removes the feature
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'

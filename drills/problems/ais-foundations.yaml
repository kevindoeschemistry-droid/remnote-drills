- template: ais-chinchilla-n
  skill: ais.foundations
  pace: quick
  given:
    Ce:
      pick:
      - 1
      - 6
      - 24
  prompt: With a budget of C = {{Ce}} × 10²³ FLOP and the Chinchilla rule D ≈ 20N, what is the compute-optimal parameter count N?
  parts:
  - ask: Answer
    label: v
    tex: N
    value: sqrt(Ce*1e23/120)
    tol: 0.005
    explain: C = 6ND = 120N², so N = √(C/120)
  verify:
    expect:
      v: solve(Eq(6*Symbol('N', positive=True)*20*Symbol('N', positive=True), Ce*10**23), Symbol('N', positive=True))[0]

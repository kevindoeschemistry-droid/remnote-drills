- template: ais-superposition
  skill: ais.interp
  pace: quick
  cases:
  - q: 'The linear representation hypothesis says features are:'
    o1: Directions in activation space
    o2: Single neurons always
    o3: Random
    o4: Stored in the tokenizer
  - q: 'Superposition lets a model:'
    o1: Store more features than it has dimensions, at the cost of interference
    o2: Use fewer parameters
    o3: Avoid polysemantic neurons
    o4: Train faster
  - q: Why are neurons often polysemantic?
    o1: Features are packed into shared dimensions, not aligned to neurons
    o2: Neurons are broken
    o3: Training is incomplete
    o4: LayerNorm mixes them
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Sparse features can share dimensions because they rarely co-occur
  verify:
    authored: true
- template: ais-superposition-2
  skill: ais.interp
  pace: quick
  cases:
  - q: 'Superposition becomes more favourable when features are:'
    o1: Sparse (rarely active together)
    o2: Dense
    o3: Equally important and always on
    o4: Perfectly correlated
  - q: 'A monosemantic neuron would respond to:'
    o1: One interpretable feature
    o2: Many unrelated features
    o3: Nothing
    o4: Every input
  - q: Why does superposition make interpretation harder?
    o1: You can't read features off individual neurons
    o2: Neurons vanish
    o3: Weights are hidden
    o4: It speeds training
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Interpretability must find directions, not just neurons
  verify:
    authored: true
- template: ais-toy-superposition
  skill: ais.interp
  pace: quick
  cases:
  - q: Toy model, dense features, more features than dimensions. What happens?
    o1: The most important get dedicated dimensions; the rest are dropped
    o2: All share dimensions

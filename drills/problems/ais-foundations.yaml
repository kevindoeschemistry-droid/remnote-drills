- template: ais-sae-fve
  skill: ais.interp
  pace: quick
  given:
    tot:
      pick:
      - 100
      - 250
    err:
      pick:
      - 5
      - 12
      - 30
  prompt: Residual activations have total squared deviation {{tot}} from their mean; the SAE's reconstruction error is {{err}}. What fraction of variance does it explain?
  parts:
  - ask: Answer
    label: v
    tex: FVE
    value: 1 - err/tot
    tol: 0.005
    explain: FVE = 1 − ‖x − x̂‖²/‖x − x̄‖²
  verify:
    expect:
      v: 1 - Rational(err, tot)
- template: ais-sae-ce-gap
  skill: ais.interp
  pace: quick
  given:
    c:
      pick:
      - 2.0
      - 2.2
    z:
      pick:
      - 6.0
      - 8.0
    s:
      pick:
      - 2.3
      - 2.6
  prompt: Clean CE loss is {{c}}, zero-ablated {{z}}, and with the SAE spliced in {{s}}. What fraction of the ablation loss does the SAE recover?
  parts:
  - ask: Answer
    label: v
    tex: \text{recovered}
    value: (z - s)/(z - c)
    tol: 0.005
    explain: Loss recovered = (L_ablated − L_SAE)/(L_ablated − L_clean)
  verify:
    expect:
      v: (nsimplify(z) - nsimplify(s))/(nsimplify(z) - nsimplify(c))

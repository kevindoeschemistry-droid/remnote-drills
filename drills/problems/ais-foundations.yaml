  - q: 'As features become sparser, the toy model:'
    o1: Starts packing features into shared dimensions (antipodal pairs, then polytopes)
    o2: Drops more features
    o3: Uses one neuron per feature
    o4: Stops learning
  - q: 'An antipodal pair stores two features:'
    o1: In opposite directions of one dimension
    o2: In two dimensions
    o3: In the bias only
    o4: In the unembedding
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Sparsity and importance decide what gets stored and how
  verify:
    authored: true
- template: ais-feature-density
  skill: ais.interp
  pace: quick
  given:
    n:
      pick:
      - 100
      - 1000
    p:
      pick:
      - 0.01
      - 0.05
      - 0.1
  prompt: Each of {{n}} features is active independently with probability {{p}}. What is the probability that two given features are active together?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: p^2
    tol: 0.005
    explain: Sparse features rarely collide, which is why sharing a dimension costs little interference
  verify:
    expect:
      v: nsimplify(p)**2
- template: ais-sae-objective
  skill: ais.interp
  pace: quick
  cases:
  - q: 'In L = ‖x − x̂‖² + λ‖f‖₁, the L1 term:'
    o1: Encourages few active latents (sparsity)
    o2: Improves reconstruction
    o3: Normalises x
    o4: Sets the learning rate
  - q: 'An SAE latent that never activates is a:'
    o1: Dead latent
    o2: Split feature
    o3: Absorbed feature
    o4: Probe
  - q: 'Growing the dictionary splits ''animal'' into ''dog'', ''cat'', ''bird''. This is:'
    o1: Feature splitting
    o2: Absorption
    o3: Dead latents
    o4: Superposition
  - q: 'A ''starts with S'' latent stops firing on ''snake'' because a ''snake'' latent took over. This is:'
    o1: Feature absorption
    o2: Splitting
    o3: Dead latent
    o4: Polysemanticity
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Reconstruction versus sparsity, with a dictionary wider than d_model
  verify:
    authored: true
- template: ais-sae-2
  skill: ais.interp
  pace: quick
  cases:
  - q: 'Raising λ in an SAE tends to:'
    o1: Raise sparsity and worsen reconstruction
    o2: Improve both
    o3: Lower sparsity
    o4: Remove dead latents
  - q: Why is the SAE dictionary wider than d_model?
    o1: To give room for more features than dimensions
    o2: To save memory
    o3: To match vocabulary size
    o4: No reason
  - q: Why can a latent's label mislead?
    o1: Absorption and splitting change which inputs it fires on
    o2: Labels are random

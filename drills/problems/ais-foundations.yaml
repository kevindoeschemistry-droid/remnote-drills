- template: ais-bradley-terry
  skill: ais.foundations
  pace: quick
  given:
    r1:
      pick:
      - 1.0
      - 2.5
      - 3.0
    r2:
      pick:
      - 0.0
      - 1.0
      - 2.0
  prompt: A reward model scores two responses r₁ = {{r1}} and r₂ = {{r2}}. Under Bradley–Terry, what is P(response 1 preferred)?
  parts:
  - ask: Answer
    label: v
    tex: P

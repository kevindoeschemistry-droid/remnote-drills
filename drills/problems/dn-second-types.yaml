- template: dn-temperature-for-gap
  skill: dent.materials
  pace: quick
  given:
    L:
      pick:
      - 4
      - 8
    g:
      pick:
      - 2
      - 5
  cases:
  - mat: amalgam
    a1: 25
  - mat: a composite
    a1: 35
  - mat: an unfilled resin
    a1: 80
  prompt: Tooth expands 11.4 ppm/°C and {{mat}} {{a1}} ppm/°C. Across a {{L}} mm restoration, what temperature change opens a {{g}} μm mismatch?
  parts:
  - ask: Answer
    label: v
    tex: \Delta T
    value: g/((a1 - 11.4)*1e-6*L*1000)
    tol: 0.005
    explain: Hot and cold drinks swing 50 °C or more; a large expansion mismatch pumps fluid along the margin (percolation)
  verify:
    expect:
      v: solve(Eq((nsimplify(a1) - Rational(114, 10))/10**6*L*1000*x, g), x)[0]

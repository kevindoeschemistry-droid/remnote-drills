- template: dn-lidocaine-cartridges
  skill: dent.management
  pace: quick
  given:
    kg:
      pick:
      - 20
      - 30
      - 50
      - 70
      - 90
  prompt: Using a maximum dose of 7 mg/kg (not over 500 mg) for 2% lidocaine with epinephrine, how many full 1.8 mL cartridges may a {{kg}} kg patient receive?
  parts:
  - ask: Answer
    label: v
    tex: N
    value: floor(min(7*kg, 500)/36)
    final: true
    tol: 0.0001
    explain: 2% is 20 mg/mL, so a 1.8 mL cartridge holds 36 mg; children reach the limit after very few
  verify:
    expect:
      v: floor(Min(7*kg, 500)/(Rational(2, 100)*1000*Rational(18, 10)))
- template: dn-ppv-prevalence
  skill: dent.practice
  pace: quick
  given:
    se:
      pick:
      - 80
      - 90
      - 95
    sp:
      pick:
      - 85
      - 90
      - 99
    p:
      pick:
      - 1
      - 10
      - 30
  prompt: A test has sensitivity {{se}}% and specificity {{sp}}%. In a population where {{p}}% have the disease, what is the positive predictive value, in %?
  parts:
  - ask: Answer
    label: v
    tex: PPV
    value: 100*se*p/(se*p + (100 - sp)*(100 - p))
    tol: 0.005
    explain: 'Bayes'' rule: the same test has a much lower PPV when the disease is rare'
  verify:
    expect:
      v: 100*(Rational(se, 100)*Rational(p, 100))/(Rational(se, 100)*Rational(p, 100) + (1 - Rational(sp, 100))*(1 - Rational(p, 100)))
- template: dn-flexural-load
  skill: dent.materials
  pace: quick
  given:
    b:
      pick:
      - 2
    h:
      pick:
      - 2
    L:
      pick:
      - 20
    s:
      pick:
      - 80
      - 120
      - 150
  prompt: A composite bar ({{b}} mm wide, {{h}} mm high) is tested in three-point bending over a {{L}} mm span. At what load, in N, will it fracture if its flexural strength is {{s}} MPa?
  parts:
  - ask: Answer
    label: v
    tex: F
    value: 2*s*b*h^2/(3*L)
    tol: 0.005
    explain: 'σ = 3FL/2bh²: double the height and the bar carries four times the load'
  verify:
    expect:
      v: solve(Eq(3*x*L/(2*b*h**2), s), x)[0]

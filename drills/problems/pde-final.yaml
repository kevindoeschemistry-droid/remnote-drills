# Builds drills/problems/pde-final.yaml: the cells of the 1-D PDE grid (drills/matrices/pde-1d.yaml)
# that had no item. Run: python3 scripts/pde_final_cases.py
# 
# Answers follow the route the card teaches (closed-form coefficients, the residue at each pole,
# the Thomas algorithm); tests/verify/pdecalc.py checks by integration, dsolve, quadrature and linear
# solves instead.
# GENERATED: edit scripts/pde_final_cases.py, not this file.

- template: pde-time-bc-shift
  skill: pde.nonhomogeneous
  pace: quick
  cases:
  - {gtex: 5t, g: 5*t, L: 2, k: 1, xp: 1, ans: -2.5}
  - {gtex: 3t, g: 3*t, L: 1, k: 0.5, xp: 0.5, ans: -1.5}
  - {gtex: '10(1 - e^{-t})', g: 10*(1 - exp(-t)), L: 4, k: 2, xp: 1, ans: -2.5}
  - {gtex: 2\sin t, g: 2*sin(t), L: 3, k: 1, xp: 2, ans: -1.33333333333}
  - {gtex: 100 + 4t, g: 100 + 4*t, L: 5, k: 0.1, xp: 2.5, ans: -2.0}
  prompt: $u_t = {{k}}\,u_{xx}$ on $0 < x < {{L}}$ with $u(0,t) = 0$ and $u({{L}},t) = {{gtex}}$. Shift by $w = x\,g(t)/{{L}}$, so $v = u - w$ has zero ends and obeys $v_t = {{k}}v_{xx} + F(x,t)$. What is $F$ at $x = {{xp}}$, $t = 0$?
  parts:
  - {ask: F, label: y, value: ans, tol: 0.0001, explain: 'Substitute $u = v + w$: $v_t + w_t = k(v_{xx} + w_{xx})$, and $w_{xx} = 0$, so $F = -w_t = -\dfrac{x}{L}g''(t)$. A moving boundary becomes a source inside, which is then expanded in the eigenfunctions (next card type)'}
  verify:
    expect: {y: 'shift_source(g, L, k, xp)'}
- template: pde-source-steady
  skill: pde.nonhomogeneous
  pace: quick
  cases:
  - {Q: 10, k: 1, L: 2, xp: 1, kind: 0, bt: both ends held at 0, ans: 5.0}
  - {Q: 6, k: 2, L: 3, xp: 1, kind: 0, bt: both ends held at 0, ans: 3.0}
  - {Q: 100, k: 50, L: 0.1, xp: 0.05, kind: 0, bt: both ends held at 0, ans: 0.0025}
  - {Q: 8, k: 1, L: 2, xp: 2, kind: 1, bt: x = 0 held at 0 and the end at x = L insulated, ans: 16.0}
  - {Q: 20, k: 4, L: 1, xp: 0.5, kind: 1, bt: x = 0 held at 0 and the end at x = L insulated, ans: 1.875}
  prompt: $u_t = {{k}}\,u_{xx} + {{Q}}$ on $0 < x < {{L}}$ with {{bt}}. What is the steady-state temperature at $x = {{xp}}$?
  parts:
  - {ask: u_s, label: y, value: ans, tol: 0.0001, explain: 'Steady state: $k u_s'''' = -Q$, a parabola. Both ends zero: $u_s = \dfrac{Q}{2k}x(L - x)$, peak $QL^2/8k$ in the middle. Insulated at $L$: $u_s = \dfrac{Q}{k}\left(Lx - \dfrac{x^2}{2}\right)$, peak at the insulated end. Then $v = u - u_s$ is the source-free problem'}
  verify:
    expect: {y: 'source_steady(Q, k, L, xp, kind)'}
- template: pde-source-mode
  skill: pde.nonhomogeneous
  pace: quick
  cases:
  - {Q: 10, L: 1, n: 1, ftex: '10', f: '10', ans: 12.7323954474}
  - {Q: 10, L: 1, n: 3, ftex: '10', f: '10', ans: 4.24413181578}
  - {Q: 6, L: 2, n: 1, ftex: '6', f: '6', ans: 7.63943726841}
  - {Q: 5, L: 3, n: 1, ftex: 5x, f: 5*x, ans: 9.54929658551}
  - {Q: 5, L: 3, n: 2, ftex: 5x, f: 5*x, ans: -4.77464829276}
  prompt: $u_t = u_{xx} + q(x)$ on $0 < x < {{L}}$, ends at 0, with $q(x) = {{ftex}}$. Expanding $u = \sum T_n(t)\sin(n\pi x/{{L}})$ gives $T_n' + (n\pi/{{L}})^2 T_n = q_n$. What is $q_{ {{n}} }$?
  parts:
  - {ask: q_n, label: y, value: ans, tol: 0.0001, explain: 'Expand the source in the same eigenfunctions: $q_n = \dfrac{2}{L}\int_0^L q(x)\sin\dfrac{n\pi x}{L}dx$. A constant source has only odd modes, $4Q/n\pi$. Each $T_n$ then solves a first-order ODE: $T_n \to q_n/(n\pi/L)^2$ in the long run'}
  verify:
    expect: {y: 'sine_coef(f, L, n)'}
- template: pde-cylinder-wall
  skill: pde.review-4
  pace: quick
  cases:
  - {Ti: 100, Tw: 20, a: 0.05, a_mm: 50.0, k: 1.0e-05, w: 0, wt: the coefficient A₁ of J₀(α₁r/a) in the shifted solution, ans: 128.157975754}
  - {Ti: 25, Tw: 200, a: 0.02, a_mm: 20.0, k: 4.0e-06, w: 0, wt: the coefficient A₁ of J₀(α₁r/a) in the shifted solution, ans: -280.345571962}
  - {Ti: 300, Tw: 50, a: 0.1, a_mm: 100.0, k: 1.2e-05, w: 1, wt: the decay rate (s⁻¹) of the slowest mode, ans: 0.00693982315554}
  - {Ti: 80, Tw: 0, a: 0.01, a_mm: 10.0, k: 1.0e-06, w: 1, wt: the decay rate (s⁻¹) of the slowest mode, ans: 0.0578318596295}
  - {Ti: 60, Tw: 10, a: 0.03, a_mm: 30.0, k: 2.0e-05, w: 0, wt: the coefficient A₁ of J₀(α₁r/a) in the shifted solution, ans: 80.0987348464}
  prompt: A long cylinder of radius {{a_mm}} mm ($\alpha = {{k}}$ m²/s) starts at ${{Ti}}$ °C and its wall is suddenly held at ${{Tw}}$ °C. With $u = T - T_w$ (zero at the wall), find {{wt}}. ($\alpha_1 = 2.4048$, $J_1(\alpha_1) = 0.5191$)
  parts:
  - {ask: Value, label: y, value: ans, tol: 0.0001, explain: 'Shift by the wall temperature so the wall condition is zero; the initial value becomes $T_i - T_w$. Then $u = \sum A_n J_0(\alpha_n r/a)e^{-\alpha(\alpha_n/a)^2t}$, and for a uniform start $A_n = \dfrac{2(T_i - T_w)}{\alpha_nJ_1(\alpha_n)}$ (weight $r$ in the orthogonality integral). The slowest mode decays at $\alpha(\alpha_1/a)^2$'}
  verify:
    expect: {y: '[bessel_coef(Ti - Tw, a), bessel_rate(k, a)][w]'}
- template: pde-sphere
  skill: pde.review-4
  pace: quick
  cases:
  - {U0: 100, a: 1, k: 1, t: 0.1, w: 0, n: 1, wt: the coefficient B_1 in r·u = Σ Bₙ sin(nπr/a)e^(−k(nπ/a)²t), ans: 63.6619772368}
  - {U0: 100, a: 1, k: 1, t: 0.1, w: 0, n: 2, wt: the coefficient B_2 in r·u = Σ Bₙ sin(nπr/a)e^(−k(nπ/a)²t), ans: -31.8309886184}
  - {U0: 50, a: 2, k: 0.5, t: 0, w: 0, n: 1, wt: the coefficient B_1 in r·u = Σ Bₙ sin(nπr/a)e^(−k(nπ/a)²t), ans: 63.6619772368}
  - {U0: 100, a: 1, k: 1, t: 0.05, w: 1, n: 0, wt: 'the centre temperature u(0, t) (sum the series)', ans: 96.599853359}
  - {U0: 80, a: 0.5, k: 0.1, t: 0.2, w: 1, n: 0, wt: 'the centre temperature u(0, t) (sum the series)', ans: 65.977359605}
  - {U0: 100, a: 1, k: 1, t: 0, w: 2, n: 0, wt: the decay rate of the slowest mode, ans: 9.86960440109}
  prompt: $u_t = {{k}}\left(u_{rr} + \tfrac{2}{r}u_r\right)$ in a sphere of radius ${{a}}$, surface held at 0, initially ${{U0}}$ everywhere. At $t = {{t}}$, find {{wt}}.
  parts:
  - {ask: Value, label: y, value: ans, tol: 0.0005, explain: 'Put $v = ru$: the equation becomes $v_t = kv_{rr}$, a rod with $v(0) = 0$ (u finite) and $v(a) = 0$. So $v = \sum B_n\sin(n\pi r/a)e^{-k(n\pi/a)^2t}$ with $B_n = \dfrac{2}{a}\int_0^a rU_0\sin\dfrac{n\pi r}{a}dr = \dfrac{2aU_0(-1)^{n+1}}{n\pi}$, and $u = v/r$; at the centre $\sin(\lambda r)/r \to \lambda$'}
  verify:
    expect: {y: '[sphere_coef(U0, a, n), sphere_centre(U0, a, k, t), k*(pi/nsimplify(a))**2][w]'}
- template: pde-lt-residues
  skill: pde.laplace-transform
  pace: quick
  cases:
  - {L: 1, xp: 0.5, n: 1, ans: -0.636619772368}
  - {L: 1, xp: 0.25, n: 1, ans: -0.450158158079}
  - {L: 2, xp: 1, n: 1, ans: -0.636619772368}
  - {L: 1, xp: 0.5, n: 3, ans: 0.212206590789}
  - {L: 2, xp: 0.5, n: 2, ans: 0.318309886184}
  - {L: 3, xp: 1, n: 1, ans: -0.551328895422}
  prompt: $u_t = u_{xx}$, $u(0,t) = 0$, $u({{L}},t) = 1$, $u(x,0) = 0$ gives $U(x,s) = \dfrac{\sinh(\sqrt s\,x)}{s\sinh(\sqrt s\,{{L}})}$. Invert by residues. At $x = {{xp}}$, what is the coefficient of $e^{-({{n}}\pi/{{L}})^2 t}$?
  parts:
  - {ask: Coefficient, label: y, value: ans, tol: 0.0001, explain: 'Poles: $s = 0$ (residue $x/L$, the steady state) and $\sqrt s = in\pi/L$, i.e. $s_n = -(n\pi/L)^2$, where $\sinh(\sqrt sL) = 0$. Each residue is $\dfrac{2(-1)^n}{n\pi}\sin\dfrac{n\pi x}{L}e^{s_nt}$. Summing all residues rebuilds the separation-of-variables series: the poles are the eigenvalues'}
  verify:
    expect: {y: 'ramp_series_coef(L, xp, n)'}
- template: pde-fd-ghost
  skill: pde.review-5
  pace: quick
  cases:
  - {u0: 50, u1: 60, r: 0.25, h: 0.1, g: 0, ans: 55.0}
  - {u0: 50, u1: 60, r: 0.4, h: 0.1, g: -20, ans: 59.6}
  - {u0: 20, u1: 18, r: 0.5, h: 0.05, g: 40, ans: 16.0}
  - {u0: 100, u1: 90, r: 0.3, h: 0.2, g: 10, ans: 92.8}
  - {u0: 0, u1: 5, r: 0.25, h: 0.1, g: -50, ans: 5.0}
  prompt: Explicit scheme for $u_t = u_{xx}$, $r = k/h^2 = {{r}}$, $h = {{h}}$, with the flux condition $u_x(0,t) = {{g}}$. Now $u_0 = {{u0}}$ and $u_1 = {{u1}}$. Using a ghost node, what is $u_0$ one step later?
  parts:
  - {ask: u₀ next, label: y, value: ans, tol: 0.0001, explain: 'Central difference at the boundary: $(u_1 - u_{-1})/2h = g$, so the ghost value is $u_{-1} = u_1 - 2hg$. Put it in the usual update: $u_0^{new} = u_0 + r(2u_1 - 2u_0 - 2hg)$. Insulated ($g = 0$) mirrors the first interior node'}
  verify:
    expect: {y: 'ghost_step(u0, u1, r, h, g)'}
- template: pde-fd-implicit
  skill: pde.review-5
  pace: quick
  cases:
  - {a: 0, b: 100, c: 0, r: 1, th: 1, sch: backward Euler (fully implicit), ans: 42.8571428571}
  - {a: 50, b: 100, c: 50, r: 0.5, th: 1, sch: backward Euler (fully implicit), ans: 71.4285714286}
  - {a: 20, b: 40, c: 60, r: 1, th: 1, sch: backward Euler (fully implicit), ans: 28.5714285714}
  - {a: 0, b: 100, c: 0, r: 1, th: 0.5, sch: Crank–Nicolson, ans: 14.2857142857}
  - {a: 50, b: 100, c: 50, r: 2, th: 0.5, sch: Crank–Nicolson, ans: 14.2857142857}
  - {a: 10, b: 30, c: 10, r: 0.5, th: 0.5, sch: Crank–Nicolson, ans: 17.0588235294}
  prompt: $u_t = u_{xx}$ with ends held at 0 and three interior nodes at ${{a}}, {{b}}, {{c}}$. Take one {{sch}} step with $r = {{r}}$. What is the new middle value?
  parts:
  - {ask: Middle node, label: y, value: ans, tol: 0.0001, explain: 'Implicit: $-r\theta u_{i-1}^{new} + (1 + 2r\theta)u_i^{new} - r\theta u_{i+1}^{new} = u_i + r(1 - \theta)(u_{i-1} - 2u_i + u_{i+1})$, with θ = 1 (backward Euler) or ½ (Crank–Nicolson). That is a tridiagonal system, solved by elimination (Thomas). Both are stable for any r; explicit needs r ≤ ½'}
  verify:
    expect: {y: 'implicit_mid(a, b, c, r, th)'}

# AP Calculus Units 2–3: the derivative and the differentiation rules.
# `expr` parts are symbolic answers in x; verify.expect differentiates the original with sympy.

# ── average rate of change (CA-2.1.A) ──────────────────────────────────────
- template: ca-avg-rate
  skill: calc.derivative-basics
  given: { a: { int: [-4, 4] }, b: { int: [-6, 6] }, p: { int: [-3, 2] }, w: { int: [1, 4] } }
  let: { q: p + w }
  require: [a != 0, a*(p + q) + b != 0]
  prompt: 'Find the average rate of change of $f(x) = {{=a*x^2 + b*x}}$ on $[{{p}}, {{q}}]$.'
  parts:
    - ask: 'Average rate of change'
      label: m
      tex: 'm_\mathrm{sec}'
      value: a*(p + q) + b
      tol: 0.001
      explain: 'Slope of the secant line: $\frac{f({{q}}) - f({{p}})}{ {{q}} - ({{p}})} = \frac{ {{a*q^2 + b*q}} - ({{a*p^2 + b*p}})}{ {{w}} } = {{a*(p + q) + b}}$'
  verify: { expect: { m: "((a*(p + w)**2 + b*(p + w)) - (a*p**2 + b*p))/w" } }

# ── the derivative from the definition (CA-2.1.B, CA-2.2.A) ────────────────
- template: ca-def-derivative
  skill: calc.derivative-basics
  given: { a: { int: [-5, 5] }, b: { int: [-7, 7] }, c: { int: [-9, 9] } }
  require: [a != 0]
  prompt: 'Use the limit definition to differentiate $f(x) = {{=a*x^2 + b*x + c}}$.'
  parts:
    - ask: 'Simplify the difference quotient $\dfrac{f(x + h) - f(x)}{h}$ (in terms of $x$ and $h$)'
      label: dq
      tex: '\frac{f(x+h) - f(x)}{h}'
      expr: 2*a*x + a*h + b
      vars: [x, h]
      explain: 'Expand $f(x + h)$, subtract $f(x)$: everything without an $h$ cancels, and one $h$ divides out'
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: 2*a*x + b
      explain: 'Let $h \to 0$ in the simplified quotient'
  verify:
    expect:
      dq: "((a*(x + Symbol('h'))**2 + b*(x + Symbol('h')) + c) - (a*x**2 + b*x + c))/Symbol('h')"
      fp: "diff(a*x**2 + b*x + c, x)"

# ── tangent line (CA-2.2.B) ────────────────────────────────────────────────
- template: ca-tangent-line
  skill: calc.derivative-basics
  given: { a: { int: [-3, 3] }, b: { int: [-5, 5] }, c: { int: [-6, 6] }, x0: { int: [-2, 3] } }
  let:
    m: 2*a*x0 + b
    y0: a*x0^2 + b*x0 + c
  require: [a != 0, m != 0, y0 != 0]
  prompt: 'Find the tangent line to $f(x) = {{=a*x^2 + b*x + c}}$ at $x = {{x0}}$.'
  parts:
    - ask: 'Slope of the tangent line'
      label: slope
      tex: 'm'
      value: m
      tol: 0.001
      explain: '$f''(x) = {{=2*a*x + b}}$, so $f''({{x0}}) = {{m}}$'
    - ask: 'The tangent line, $y = \,?$'
      label: line
      tex: 'y'
      expr: m*(x - x0) + y0
      explain: 'Point $({{x0}}, {{y0}})$, slope ${{m}}$: $y = {{=m*(x - x0) + y0}}$. Any equivalent form is accepted'
  verify:
    expect:
      slope: "diff(a*x**2 + b*x + c, x).subs(x, x0)"
      line: "(a*x0**2 + b*x0 + c) + diff(a*x**2 + b*x + c, x).subs(x, x0)*(x - x0)"

# ── estimate a derivative from a table (CA-2.3.A) ──────────────────────────
- template: ca-estimate-derivative
  skill: calc.derivative-basics
  given: { x0: { pick: [2, 3, 5, 10] }, hh: { pick: [0.1, 0.5, 1] }, f1: { pick: [3.2, 4.1, 7.5, 12.4] }, df: { pick: [-1.8, -0.6, 0.4, 0.9, 2.2] } }
  prompt: 'A table gives $f({{x0 - hh}}) = {{f1}}$ and $f({{x0 + hh}}) = {{f1 + df}}$. Estimate $f''({{x0}})$.'
  parts:
    - ask: 'Best estimate of $f''({{x0}})$'
      label: est
      tex: 'f''({{x0}})'
      value: df/(2*hh)
      explain: 'Use the two values that straddle the point: $\frac{ {{f1 + df}} - {{f1}} }{ {{x0 + hh}} - {{x0 - hh}} } = {{df/(2*hh)}}$'
  verify: { residuals: ["est*2*hh - df"] }

# ── power rule (CA-2.5.A) ──────────────────────────────────────────────────
- template: ca-power-rule
  skill: calc.derivative-rules
  given: { a: { int: [-6, 8] }, n: { pick: [-4, -3, -2, -1, 2, 3, 4, 5, 6, 7] } }
  require: [a != 0]
  prompt: 'Differentiate $f(x) = {{=a*x^n}}$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: a*n*x^(n - 1)
      explain: 'Bring the power down and reduce it by one: ${{a}}\cdot({{n}})\,x^{ {{n}} - 1}$'
  verify: { expect: { fp: "diff(a*x**n, x)" } }

- template: ca-power-reciprocal
  skill: calc.derivative-rules
  given: { a: { int: [1, 9] }, m: { int: [1, 5] } }
  prompt: 'Differentiate $f(x) = \dfrac{ {{a}} }{x^{ {{m}} } }$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: -a*m*x^(-m - 1)
      explain: 'Rewrite as ${{a}}x^{-{{m}} }$ first, then the power rule: $-{{a*m}}x^{-{{m + 1}} } = -\frac{ {{a*m}} }{x^{ {{m + 1}} } }$'
  verify: { expect: { fp: "diff(a/x**m, x)" } }

- template: ca-power-root
  skill: calc.derivative-rules
  given: { a: { int: [1, 8] }, p: { pick: [1, 2, 4, 5, 7] }, q: { pick: [3, 4] } }
  require: ["mod(p, q) != 0"]
  prompt: 'Differentiate $f(x) = {{a}}\sqrt[{{q}}]{x^{ {{p}} } }$ for $x > 0$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: a*(p/q)*x^(p/q - 1)
      explain: 'A root is a fractional power: $f(x) = {{a}}x^{ {{p}}/{{q}} }$. Then the power rule gives ${{=a*(p/q)*x^(p/q - 1)}}$'
  verify: { expect: { fp: "diff(a*x**Rational(p, q), x)" } }

# ── polynomials (CA-2.6.A) ─────────────────────────────────────────────────
- template: ca-poly-derivative
  skill: calc.derivative-rules
  given: { a: { int: [-5, 5] }, b: { int: [-6, 6] }, c: { int: [-9, 9] }, d: { int: [-9, 9] } }
  require: [a != 0]
  prompt: 'Differentiate $f(x) = {{=a*x^3 + b*x^2 + c*x + d}}$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: 3*a*x^2 + 2*b*x + c
      explain: 'Term by term with the power rule; the constant goes to zero'
  verify: { expect: { fp: "diff(a*x**3 + b*x**2 + c*x + d, x)" } }

# ── sin, cos, e^x, ln x (CA-2.7.A) ─────────────────────────────────────────
- template: ca-elementary-derivative
  skill: calc.derivative-rules
  given: { a: { int: [-5, 5] }, b: { int: [-5, 5] }, c: { int: [-4, 4] }, d: { int: [-4, 4] } }
  require: [abs(a) + abs(b) > 0, abs(a) + abs(b) + abs(c) + abs(d) > abs(a) + abs(b) or a*b != 0]
  prompt: 'Differentiate $f(x) = {{=a*sin(x) + b*cos(x) + c*exp(x) + d*log(x)}}$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: a*cos(x) - b*sin(x) + c*exp(x) + d/x
      explain: '$\sin \to \cos$, $\cos \to -\sin$, $e^x \to e^x$, $\ln x \to \frac1x$, each keeping its coefficient'
  verify: { expect: { fp: "diff(a*sin(x) + b*cos(x) + c*exp(x) + d*log(x), x)" } }

# ── product rule (CA-2.8.A) ────────────────────────────────────────────────
- template: ca-product-rule
  skill: calc.derivative-rules
  given: { a: { int: [1, 5] }, b: { int: [-6, 6] } }
  prompt: 'Differentiate $f(x) = \left({{=a*x^2 + b}}\right)\sin x$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: 2*a*x*sin(x) + (a*x^2 + b)*cos(x)
      explain: '$(uv)'' = u''v + uv''$ with $u = {{=a*x^2 + b}}$, $v = \sin x$'
  verify: { expect: { fp: "diff((a*x**2 + b)*sin(x), x)" } }

- template: ca-product-exp
  skill: calc.derivative-rules
  given: { a: { int: [-5, 5] }, b: { int: [-6, 6] } }
  let: { s: a + b }
  require: [a != 0]
  prompt: 'Differentiate $f(x) = \left({{=a*x + b}}\right)e^{x}$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: (a*x + s)*exp(x)
      explain: '$u''v + uv'' = {{a}}e^x + ({{=a*x + b}})e^x$; factor out $e^x$'
  verify: { expect: { fp: "diff((a*x + b)*exp(x), x)" } }

- template: ca-product-values
  skill: calc.derivative-rules
  given: { f: { int: [-5, 5] }, g: { int: [-5, 5] }, fp: { int: [-4, 4] }, gp: { int: [-4, 4] }, p: { int: [1, 4] } }
  require: [fp*g + f*gp != 0]
  prompt: 'At $x = {{p}}$: $f = {{f}}$, $f'' = {{fp}}$, $g = {{g}}$, $g'' = {{gp}}$. Let $h(x) = f(x)\,g(x)$.'
  parts:
    - ask: '$h''({{p}})$'
      label: hp
      tex: 'h''({{p}})'
      value: fp*g + f*gp
      tol: 0.001
      explain: '$h'' = f''g + fg'' = ({{fp}})({{g}}) + ({{f}})({{gp}}) = {{fp*g + f*gp}}$'
  verify: { residuals: ["hp - (fp*g + f*gp)"] }

# ── quotient rule (CA-2.9.A) ───────────────────────────────────────────────
- template: ca-quotient-rule
  skill: calc.derivative-rules
  given: { a: { int: [1, 6] }, b: { int: [-6, 6] }, c: { int: [1, 5] }, d: { int: [-6, 6] } }
  require: [a*d - b*c != 0]
  prompt: 'Differentiate $f(x) = \dfrac{ {{=a*x + b}} }{ {{=c*x + d}} }$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: (a*d - b*c)/(c*x + d)^2
      explain: '$\left(\frac uv\right)'' = \frac{u''v - uv''}{v^2} = \frac{ {{a}}({{=c*x + d}}) - {{c}}({{=a*x + b}})}{({{=c*x + d}})^2}$; the $x$ terms cancel in the numerator'
  verify: { expect: { fp: "diff((a*x + b)/(c*x + d), x)" } }

- template: ca-quotient-values
  skill: calc.derivative-rules
  given: { f: { int: [-6, 6] }, g: { pick: [-4, -2, -1, 1, 2, 4, 5] }, fp: { int: [-4, 4] }, gp: { int: [-4, 4] }, p: { int: [1, 4] } }
  require: [fp*g - f*gp != 0]
  prompt: 'At $x = {{p}}$: $f = {{f}}$, $f'' = {{fp}}$, $g = {{g}}$, $g'' = {{gp}}$. Let $h(x) = \dfrac{f(x)}{g(x)}$.'
  parts:
    - ask: '$h''({{p}})$'
      label: hp
      tex: 'h''({{p}})'
      value: (fp*g - f*gp)/g^2
      explain: '$h'' = \frac{f''g - fg''}{g^2} = \frac{({{fp}})({{g}}) - ({{f}})({{gp}})}{({{g}})^2} = {{(fp*g - f*gp)/g^2}}$'
  verify: { residuals: ["hp*g**2 - (fp*g - f*gp)"] }

# ── tan, sec (CA-2.10.A) ───────────────────────────────────────────────────
- template: ca-trig-derivative
  skill: calc.derivative-rules
  given: { a: { int: [-5, 5] }, b: { int: [-5, 5] } }
  require: [a != 0 or b != 0]
  prompt: 'Differentiate $f(x) = {{=a*tan(x) + b*sec(x)}}$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: a*sec(x)^2 + b*sec(x)*tan(x)
      explain: '$(\tan x)'' = \sec^2 x$ and $(\sec x)'' = \sec x\tan x$. Type sec(x)^2, or 1/cos(x)^2'
  verify: { expect: { fp: "diff(a*tan(x) + b*sec(x), x)" } }

# ── chain rule (CA-3.1.A) ──────────────────────────────────────────────────
- template: ca-chain-power
  skill: calc.chain-rule
  given: { a: { int: [-5, 5] }, b: { int: [-7, 7] }, n: { int: [2, 7] } }
  require: [a != 0, abs(a) != 1 or b != 0]
  prompt: 'Differentiate $f(x) = \left({{=a*x + b}}\right)^{ {{n}} }$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: n*a*(a*x + b)^(n - 1)
      explain: 'Outside first, then times the derivative of the inside: ${{n}}({{=a*x + b}})^{ {{n - 1}} }\cdot({{a}})$'
  verify: { expect: { fp: "diff((a*x + b)**n, x)" } }

- template: ca-chain-trig
  skill: calc.chain-rule
  given: { a: { int: [-5, 5] }, k: { int: [2, 7] }, b: { int: [-5, 5] }, m: { int: [2, 7] } }
  require: [a != 0 or b != 0]
  prompt: 'Differentiate $f(x) = {{=a*sin(k*x) + b*cos(m*x)}}$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: a*k*cos(k*x) - b*m*sin(m*x)
      explain: 'Each inside is a multiple of $x$, so its derivative comes out front as a factor'
  verify: { expect: { fp: "diff(a*sin(k*x) + b*cos(m*x), x)" } }

- template: ca-chain-exp
  skill: calc.chain-rule
  given: { a: { int: [1, 5] }, k: { pick: [-3, -2, -1, 1, 2, 3] } }
  prompt: 'Differentiate $f(x) = {{=a*exp(k*x^2)}}$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: 2*a*k*x*exp(k*x^2)
      explain: '$e^{u}$ differentiates to $e^{u}u''$ with $u = {{=k*x^2}}$, $u'' = {{=2*k*x}}$'
  verify: { expect: { fp: "diff(a*exp(k*x**2), x)" } }

- template: ca-chain-ln
  skill: calc.chain-rule
  given: { a: { int: [1, 6] }, b: { int: [1, 9] } }
  prompt: 'Differentiate $f(x) = \ln\left({{=a*x^2 + b}}\right)$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: 2*a*x/(a*x^2 + b)
      explain: '$(\ln u)'' = \frac{u''}{u}$ with $u = {{=a*x^2 + b}}$'
  verify: { expect: { fp: "diff(log(a*x**2 + b), x)" } }

- template: ca-chain-values
  skill: calc.chain-rule
  given: { p: { int: [1, 4] }, q: { int: [-3, 6] }, gp: { int: [-4, 4] }, fq: { int: [-5, 5] } }
  require: [gp != 0, fq != 0, q != p]
  prompt: 'Let $h(x) = f(g(x))$. You know $g({{p}}) = {{q}}$, $g''({{p}}) = {{gp}}$ and $f''({{q}}) = {{fq}}$.'
  parts:
    - ask: '$h''({{p}})$'
      label: hp
      tex: 'h''({{p}})'
      value: fq*gp
      tol: 0.001
      explain: '$h''({{p}}) = f''(g({{p}}))\cdot g''({{p}}) = f''({{q}})\cdot g''({{p}}) = ({{fq}})({{gp}})$. Evaluate $f''$ at the inside value, not at ${{p}}$'
  verify: { residuals: ["hp - fq*gp"] }

- template: ca-exp-base
  skill: calc.chain-rule
  given: { a: { int: [1, 6] }, b: { pick: [2, 3, 5, 10] } }
  prompt: 'Differentiate $f(x) = {{a}}\cdot {{b}}^{x}$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: a*log(b)*b^x
      explain: '$b^x = e^{x\ln b}$, so $(b^x)'' = b^x\ln b$. Type ln as log({{b}})'
  verify: { expect: { fp: "diff(a*b**x, x)" } }

- template: ca-rules-combined
  skill: calc.chain-rule
  given: { n: { int: [2, 5] }, k: { pick: [-3, -2, -1, 2, 3, 4] } }
  prompt: 'Differentiate $f(x) = x^{ {{n}} }e^{ {{=k*x}} }$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: x^(n - 1)*exp(k*x)*(n + k*x)
      explain: 'Product rule, with the chain rule on the exponential: ${{n}}x^{ {{n - 1}} }e^{ {{=k*x}} } + x^{ {{n}} }\cdot({{k}})e^{ {{=k*x}} }$, then factor'
  verify: { expect: { fp: "diff(x**n*exp(k*x), x)" } }

# ── logarithmic differentiation (CA-3.5.B) ─────────────────────────────────
- template: ca-log-diff
  skill: calc.chain-rule
  given: { a: { int: [1, 4] } }
  prompt: 'Differentiate $f(x) = x^{ {{=a*x}} }$ for $x > 0$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: a*x^(a*x)*(log(x) + 1)
      explain: 'Take logs: $\ln f = {{=a*x}}\ln x$. Differentiate: $\frac{f''}{f} = {{a}}\ln x + {{a}}$. Multiply back by $f$'
  verify: { expect: { fp: "diff(x**(a*x), x)" } }

# ── implicit differentiation (CA-3.2.A) ────────────────────────────────────
- template: ca-implicit-slope
  skill: calc.implicit-inverse
  given: { a: { int: [1, 4] }, b: { int: [-2, 2] }, p: { int: [-3, 3] }, q: { int: [-3, 3] } }
  require: [2*p + b*q != 0, b*p + 2*a*q != 0, p != 0, q != 0]
  prompt: 'The curve ${{=x^2 + b*x*y + a*y^2}} = {{p^2 + b*p*q + a*q^2}}$ passes through $({{p}}, {{q}})$.'
  parts:
    - ask: 'Slope $\dfrac{dy}{dx}$ at that point'
      label: m
      tex: '\frac{dy}{dx}'
      value: -(2*p + b*q)/(b*p + 2*a*q)
      explain: 'Differentiate both sides, treating $y$ as a function of $x$: every $y$ term picks up a $y''$. Solving for it gives $y'' = -\frac{ {{=2*x + b*y}} }{ {{=b*x + 2*a*y}} }$. At $({{p}}, {{q}})$: ${{-(2*p + b*q)/(b*p + 2*a*q)}}$'
  verify:
    expect:
      m: "(-diff(x**2 + b*x*Symbol('y') + a*Symbol('y')**2, x)/diff(x**2 + b*x*Symbol('y') + a*Symbol('y')**2, Symbol('y'))).subs({x: p, Symbol('y'): q})"

# ── derivative of an inverse (CA-3.3.A) ────────────────────────────────────
- template: ca-inverse-derivative
  skill: calc.implicit-inverse
  given: { a: { int: [1, 6] }, b: { int: [-6, 6] }, p: { int: [1, 3] } }
  prompt: 'Let $f(x) = {{=x^3 + a*x + b}}$, which is increasing, and let $g = f^{-1}$. Find $g''({{p^3 + a*p + b}})$.'
  parts:
    - ask: 'The $x$ with $f(x) = {{p^3 + a*p + b}}$'
      label: x0
      tex: 'x'
      value: p
      tol: 0.001
      explain: 'Try small integers: $f({{p}}) = {{p^3}} + {{a*p}} + ({{b}}) = {{p^3 + a*p + b}}$'
    - ask: '$g''({{p^3 + a*p + b}})$'
      label: gp
      tex: 'g''({{p^3 + a*p + b}})'
      value: 1/(3*p^2 + a)
      explain: '$g''(y) = \frac{1}{f''(x)}$ at the matching $x$: $f''(x) = 3x^2 + {{a}}$, $f''({{p}}) = {{3*p^2 + a}}$, so $g'' = \frac{1}{ {{3*p^2 + a}} }$'
  verify:
    expect:
      x0: "[r for r in solve(x**3 + a*x + b - (p**3 + a*p + b), x) if r.is_real][0]"
      gp: "1/diff(x**3 + a*x + b, x).subs(x, p)"

# ── inverse trig (CA-3.4.A) ────────────────────────────────────────────────
- template: ca-arctan-derivative
  skill: calc.implicit-inverse
  given: { a: { int: [1, 6] }, k: { int: [2, 6] } }
  prompt: 'Differentiate $f(x) = {{a}}\arctan({{=k*x}})$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: a*k/(1 + k^2*x^2)
      explain: '$(\arctan u)'' = \frac{u''}{1 + u^2}$ with $u = {{=k*x}}$'
  verify: { expect: { fp: "diff(a*atan(k*x), x)" } }

- template: ca-arcsin-derivative
  skill: calc.implicit-inverse
  given: { a: { pick: [2, 3, 4, 5] } }
  prompt: 'Differentiate $f(x) = \arcsin\!\left(\dfrac{x}{ {{a}} }\right)$ for $|x| < {{a}}$.'
  parts:
    - ask: '$f''(x)$'
      label: fp
      tex: 'f''(x)'
      expr: 1/sqrt(a^2 - x^2)
      explain: '$(\arcsin u)'' = \frac{u''}{\sqrt{1 - u^2}}$ with $u = \frac{x}{ {{a}} }$; multiply top and bottom by ${{a}}$ to clear the fraction'
  verify: { expect: { fp: "diff(asin(x/a), x)" } }

# ── higher derivatives (CA-3.6.A) ──────────────────────────────────────────
- template: ca-second-derivative
  skill: calc.implicit-inverse
  given: { a: { int: [-4, 4] }, b: { int: [-5, 5] }, c: { int: [-9, 9] } }
  require: [a != 0]
  prompt: 'Find the second derivative of $f(x) = {{=a*x^4 + b*x^3 + c*x}}$.'
  parts:
    - ask: '$f''(x)$'
      label: f1
      tex: 'f''(x)'
      expr: 4*a*x^3 + 3*b*x^2 + c
      explain: 'Power rule on each term'
    - ask: '$f''''(x)$'
      label: f2
      tex: 'f''''(x)'
      expr: 12*a*x^2 + 6*b*x
      explain: 'Differentiate $f''$ again; the constant drops out'
  verify: { expect: { f1: "diff(a*x**4 + b*x**3 + c*x, x)", f2: "diff(a*x**4 + b*x**3 + c*x, x, 2)" } }

- template: ca-second-derivative-trig
  skill: calc.implicit-inverse
  given: { a: { int: [1, 6] }, k: { int: [2, 6] } }
  prompt: 'Find the second derivative of $f(x) = {{=a*sin(k*x)}}$.'
  parts:

# Generated by scripts/second_types.py from scripts/second_specs/pd.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: pd-nominal-from-effective
  skill: design.economics
  pace: quick
  given:
    e:
      pick:
      - 5
      - 8
      - 12
  cases:
  - per: monthly
    m: 12
  - per: quarterly
    m: 4
  - per: daily
    m: 365
  prompt: What nominal annual rate, compounded {{per}} ({{m}} times a year), gives an effective annual rate of {{e}}%?
  parts:
  - ask: Answer
    label: v
    tex: r
    value: m*((1 + e/100)^(1/m) - 1)*100
    tol: 0.005
    explain: Invert $(1 + r/m)^m - 1$; the nominal rate is always a little below the effective one
  verify:
    expect:
      v: m*((1 + Rational(e, 100))**Rational(1, m) - 1)*100
- template: pd-capital-recovery
  skill: design.economics
  pace: quick
  given:
    P:
      pick:
      - 500
      - 1200
      - 3000
    i:
      pick:
      - 8
      - 10
      - 15
    n:
      pick:
      - 5
      - 10
      - 15
  prompt: A {{P}} thousand dollar plant must earn back its cost at {{i}}% over {{n}} years. What equal annual net cash flow, in thousand dollars, makes NPV zero (no salvage)?
  parts:
  - ask: Answer
    label: v
    tex: A
    value: P*(i/100)/(1 - (1 + i/100)^(-n))
    tol: 0.005
    explain: The capital-recovery factor (A/P, i, n) turns a present cost into an equivalent annual charge
  verify:
    expect:
      v: solve(Eq(summation(x/(1 + Rational(i, 100))**Symbol('k'), (Symbol('k'), 1, n)), P), x)[0]
- template: pd-roi
  skill: design.economics
  pace: quick
  given:
    P:
      pick:
      - 400
      - 1000
    cf:
      pick:
      - 150
      - 250
      - 400
    n:
      pick:
      - 5
      - 8
      - 10
  require:
  - cf > P/n
  prompt: A {{P}} thousand dollar project returns {{cf}} thousand dollars a year in cash for {{n}} years and is depreciated straight-line to zero. What is its average return on investment, in % per year (profit after depreciation over investment)?
  parts:
  - ask: Answer
    label: v
    tex: ROI
    value: (cf - P/n)/P*100
    tol: 0.005
    explain: ROI ignores the time value of money; it ranks projects quickly but NPV decides between them
  verify:
    expect:
      v: (cf - Rational(P, n))/P*100
- template: pd-capacity-from-budget
  skill: design.economics
  pace: quick
  given:
    S1:
      pick:
      - 10
      - 20
    C1:
      pick:
      - 50
      - 80
    I1:
      pick:
      - 500
      - 600
    I2:
      pick:
      - 800
      - 820
    C2:
      pick:
      - 120
      - 200
  prompt: A {{S1}} m³ vessel cost {{C1}} thousand dollars when the cost index was {{I1}}. With the index now {{I2}} and the six-tenths rule, what capacity, in m³, can {{C2}} thousand dollars buy?
  parts:
  - ask: Answer
    label: v
    tex: S_2
    value: S1*(C2/C1*I1/I2)^(1/0.6)
    tol: 0.005
    explain: 'Invert the power law: doubling the budget at constant index buys about 3.2 times the capacity'
  verify:
    expect:
      v: solve(Eq(C1*(x/S1)**Rational(3, 5)*Rational(I2, I1), C2), x)[0]
- template: pd-soyd
  skill: design.economics
  pace: quick
  given:
    P:
      pick:
      - 100
      - 250
    Sv:
      pick:
      - 0
      - 10
      - 25
    n:
      pick:
      - 5
      - 8
    k:
      pick:
      - 1
      - 2
      - 3
  prompt: Equipment costs {{P}} thousand dollars with salvage {{Sv}} thousand and a {{n}}-year life. Under sum-of-years-digits depreciation, what is its book value after year {{k}}, in thousand dollars?
  parts:
  - ask: Answer
    label: v
    tex: BV
    value: P - (P - Sv)*(k*n - k*(k - 1)/2)/(n*(n + 1)/2)
    tol: 0.005
    explain: 'Year j takes (n − j + 1)/Σ of the depreciable amount: front-loaded like declining balance, but it lands exactly on the salvage value'
  verify:
    expect:
      v: P - summation((P - Sv)*(n - Symbol('j') + 1)/summation(Symbol('m'), (Symbol('m'), 1, n)), (Symbol('j'), 1, k))
- template: pd-flammable-check
  skill: design.safety
  pace: quick
  given:
    a:
      pick:
      - 50
      - 70
      - 90
    c:
      pick:
      - 2.5
      - 3.5
      - 4.5
  require:
  - abs(c - 1/(a/100/5 + (100 - a)/100/2.1)) > 0.1
  let:
    b: 100 - a
  prompt: A fuel blend is {{a}}% methane (LFL 5.0%) and {{b}}% propane (LFL 2.1%) by volume. Air contains {{c}}% of this blend. Is the mixture below the lower flammable limit?
  parts:
  - ask: Answer
    label: v
    choice:
    - Below the LFL (too lean to burn)
    - At or above the LFL (flammable)
    correct: 'c < 1/(a/100/5 + (100 - a)/100/2.1) ? 0 : 1'
    explain: Le Chatelier's rule gives the blend's LFL; compare the concentration in air with it (and with the UFL, for the rich side)
  verify:
    choices:
      v: 0 if nsimplify(c) < 1/(Rational(a, 100)/5 + Rational(100 - a, 100)/Rational(21, 10)) else 1
- template: pd-tlv-allowance
  skill: design.safety
  pace: quick
  given:
    c1:
      pick:
      - 20
      - 50
    t1:
      pick:
      - 100
      - 200
    c2:
      pick:
      - 5
      - 10
    t2:
      pick:
      - 25
      - 50
    t3:
      pick:
      - 50
      - 100
      - 500
  require:
  - c1/t1 + c2/t2 < 0.9
  prompt: A workplace has {{c1}} ppm of a solvent (TLV {{t1}} ppm) and {{c2}} ppm of another (TLV {{t2}} ppm), with additive effects. How high, in ppm, may a third (TLV {{t3}} ppm) go before the mixture limit is exceeded?
  parts:
  - ask: Answer
    label: v
    tex: C_3
    value: t3*(1 - c1/t1 - c2/t2)
    tol: 0.005
    explain: The fractions of each limit add; whatever is left of 1 is the third component's share
  verify:
    expect:
      v: solve(Eq(Rational(c1, t1) + Rational(c2, t2) + x/t3, 1), x)[0]
- template: pd-hazop-word
  skill: design.safety
  pace: recall
  cases:
  - q: Cooling water stops flowing to a reactor jacket. Which HAZOP guide word?
    o1: NO (no flow)
    o2: LESS
    o3: REVERSE
    o4: OTHER THAN
  - q: Product flows backwards through a pump into the feed tank. Which guide word?
    o1: REVERSE
    o2: 'NO'
    o3: MORE
    o4: PART OF
  - q: A stream carries an unexpected contaminant alongside the intended material. Which guide word?
    o1: AS WELL AS
    o2: OTHER THAN
    o3: PART OF
    o4: MORE
  - q: Only one of two intended reagents reaches the reactor. Which guide word?
    o1: PART OF
    o2: AS WELL AS
    o3: LESS
    o4: 'NO'
  - q: A completely different material is charged by mistake. Which guide word?
    o1: OTHER THAN
    o2: AS WELL AS
    o3: PART OF
    o4: REVERSE
  - q: Reactor temperature runs above its design value. Which guide word?
    o1: MORE (more temperature)
    o2: LESS
    o3: OTHER THAN
    o4: AS WELL AS
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Guide word plus parameter makes the deviation (NO flow, MORE temperature); the team then asks for causes, consequences and safeguards
  verify:
    authored: true
- template: pd-time-constant-from-data
  skill: design.control
  pace: quick
  given:
    p:
      pick:
      - 40
      - 50
      - 75
      - 90
    t:
      pick:
      - 2
      - 5
      - 12
  prompt: After a step input, a first-order process has made {{p}}% of its final change at {{t}} min. What is its time constant, in minutes?
  parts:
  - ask: Answer
    label: v
    tex: \tau
    value: -t/log(1 - p/100)
    tol: 0.005
    explain: One reading fixes τ; plotting ln(1 − fraction) against t checks that the process really is first order
  verify:
    expect:
      v: solve(Eq(log(1 - Rational(p, 100)), -t/x), x)[0]

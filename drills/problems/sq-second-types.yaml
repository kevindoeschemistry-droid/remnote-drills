- template: sq-transaction-2
  skill: sql.dml
  pace: quick
  cases:
  - q: 'A session inserts a row, then runs CREATE INDEX. The insert is:'
    o1: Committed by the DDL's implicit commit
    o2: Rolled back
    o3: Pending
    o4: Lost
  - q: 'Before COMMIT, another session querying the table sees:'
    o1: The data as of the last commit
    o2: The uncommitted changes
    o3: Nothing
    o4: An error
  - q: 'ROLLBACK TO SAVEPOINT s1:'
    o1: Undoes changes made after s1 and keeps the transaction open
    o2: Ends the transaction
    o3: Undoes everything
    o4: Commits up to s1
  - q: 'A session ends normally (EXIT in SQL*Plus) with pending DML. Usually:'
    o1: It is committed
    o2: It is rolled back
    o3: It is lost
    o4: It waits
  - q: 'A statement fails partway inside a transaction. Oracle:'
    o1: Rolls back that statement only
    o2: Rolls back the whole transaction
    o3: Commits
    o4: Crashes
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Transactions end at COMMIT, ROLLBACK or DDL
  verify:
    authored: true

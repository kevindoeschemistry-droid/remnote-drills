- template: sq-commit-kind
  skill: sql.admin
  pace: quick
  cases:
  - q: Which statement commits the current transaction implicitly in Oracle?
    o1: CREATE TABLE t (x NUMBER)
    o2: UPDATE emp SET salary = 0
    o3: SELECT * FROM emp
    o4: SAVEPOINT s1
  - q: 'TRUNCATE TABLE emp is:'
    o1: 'DDL: it commits and can''t be rolled back'
    o2: 'DML: it can be rolled back'
    o3: DCL
    o4: A query
  - q: 'GRANT SELECT ON emp TO ben is:'
    o1: DCL
    o2: DML
    o3: DDL
    o4: Transaction control
  - q: 'MERGE INTO emp … is:'
    o1: DML
    o2: DDL
    o3: DCL
    o4: Transaction control
  - q: 'ROLLBACK TO SAVEPOINT s1 is:'
    o1: Transaction control
    o2: DDL
    o3: DCL
    o4: DML
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: DDL and DCL commit implicitly; DML waits for COMMIT or ROLLBACK
  verify:
    authored: true

    - 5
    - 1
    names: chemical A 2 ppm (TLV 5), chemical B 0.5 ppm (TLV 1)
    ans: 0
  prompt: Workers breathe {{names}}, all acting on the same organ. Is the combined exposure within the limit?
  parts:
  - ask: Answer
    label: y

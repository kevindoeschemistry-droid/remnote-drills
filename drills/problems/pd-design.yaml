    explain: 'For additive effects, sum Cᵢ/TLVᵢ: the mixture exceeds its limit if the sum is above 1, even when each component alone is below its own TLV'
  verify:
    choices:
      y: exposure_over(cs, tlvs)
- template: pd-hazop
  skill: design.safety
  pace: recall
  cases:
  - k: 'NO'
    o1: a quantitative decrease
    o2: a quantitative increase
    o3: none of the design intent happens
    o4: something extra happens besides the intent
    ans: 2
  - k: MORE
    o1: something extra happens besides the intent
    o2: a quantitative increase
    o3: only some of the intent happens
    o4: something completely different happens
    ans: 1
  - k: LESS
    o1: something extra happens besides the intent
    o2: a quantitative decrease
    o3: something completely different happens
    o4: the logical opposite of the intent
    ans: 1
  - k: REVERSE
    o1: something completely different happens
    o2: only some of the intent happens
    o3: the logical opposite of the intent
    o4: a quantitative decrease
    ans: 2
  - k: AS WELL AS
    o1: something completely different happens
    o2: something extra happens besides the intent
    o3: the logical opposite of the intent
    o4: a quantitative decrease
    ans: 1
  - k: PART OF
    o1: none of the design intent happens
    o2: only some of the intent happens
    o3: the logical opposite of the intent
    o4: a quantitative decrease
    ans: 1
  - k: OTHER THAN
    o1: none of the design intent happens
    o2: something extra happens besides the intent
    o3: only some of the intent happens
    o4: something completely different happens
    ans: 3
  prompt: In a HAZOP study, what does the guide word {{k}} mean?
  parts:
  - ask: Answer
    label: y
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: ans
    explain: Guide words are applied to each process parameter at each node (NO flow, MORE pressure, REVERSE flow…) to generate deviations; the team then lists causes, consequences and safeguards for each
  verify:
    choices:
      y: hazop_pick(k, o1, o2, o3, o4)
- template: pd-first-order
  skill: design.control
  pace: quick
  cases:
  - w: 0
    tau: 5
    f: 0.632
    t: 0
    task: How long (min) until the output reaches 63.2% of its final change?
    ans: 4.998361704066
  - w: 0
    tau: 2
    f: 0.95
    t: 0
    task: How long (min) until the output reaches 95% of its final change?
    ans: 5.991464547108
  - w: 0
    tau: 10
    f: 0.99
    t: 0
    task: How long (min) until the output reaches 99% of its final change?
    ans: 46.05170185988
  - w: 1
    tau: 4
    f: 0
    t: 4
    task: What fraction of the final change has occurred after 4 min?
    ans: 0.6321205588286
  - w: 1
    tau: 3
    f: 0
    t: 9
    task: What fraction of the final change has occurred after 9 min?
    ans: 0.9502129316321
  - w: 1
    tau: 20
    f: 0
    t: 5
    task: What fraction of the final change has occurred after 5 min?
    ans: 0.2211992169286
  prompt: A first-order process (time constant {{tau}} min, no dead time) gets a step in its input. {{task}}
  parts:
  - ask: Answer
    label: y
    value: ans
    tol: 0.0005
    explain: 'τ dy/dt + y = K·Δu gives y = KΔu(1 − e^(−t/τ)): 63.2% at t = τ, 95% at 3τ, 99% at 4.6τ. The time constant is read off a step test at 63.2%'
  verify:
    expect:
      y: first_order(w, tau, f, t)

    - 150
    - 50
    tlvs:
    - 500
    - 400
    - 200
    names: acetone 100 (TLV 500), MEK 150 (TLV 400)... with ethyl acetate 50 ppm (TLV 200)
    ans: 0
  - cs:
    - 2
    - 0.5

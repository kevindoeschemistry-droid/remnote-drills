  - f: Cr(CO)ₙ
    Zm: 24
    mm: 0
  - f: Fe(CO)ₙ
    Zm: 26
    mm: 0
  - f: Ni(CO)ₙ
    Zm: 28
    mm: 0
  - f: W(CO)ₙ
    Zm: 74
    mm: 0
  - f: Mn₂(CO)ₙ (with a Mn–Mn bond)
    Zm: 25
    mm: 1
  - f: Co₂(CO)ₙ (with a Co–Co bond, all terminal for counting)
    Zm: 27
    mm: 1
  prompt: Assuming the 18-electron rule, what is n in {{f}}?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: '(Zm == 24 or Zm == 74) ? 6 : (Zm == 26 ? 5 : (Zm == 28 ? 4 : (Zm == 25 ? 10 : 8)))'
    final: true
    tol: 0.0001
    explain: Each CO gives 2 electrons; a metal–metal bond gives each metal 1. Group 7 and 9 metals must dimerise

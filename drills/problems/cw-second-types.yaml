- template: cw-lande-g
  skill: inorg.f-block
  pace: quick
  cases:
  - ion: Ce³⁺ (²F₅/₂)
    Sv: 0.5
    L: 3
    J: 2.5
    nf: 1
  - ion: Gd³⁺ (⁸S₇/₂)
    Sv: 3.5
    L: 0
    J: 3.5
    nf: 7
  - ion: Tb³⁺ (⁷F₆)
    Sv: 3
    L: 3
    J: 6
    nf: 8
  - ion: Dy³⁺ (⁶H₁₅/₂)
    Sv: 2.5
    L: 5
    J: 7.5
    nf: 9
  - ion: Er³⁺ (⁴I₁₅/₂)
    Sv: 1.5
    L: 6
    J: 7.5
    nf: 11
  prompt: The ground term of {{ion}} has S = {{Sv}}, L = {{L}}, J = {{J}}. What is its Landé g factor?
  parts:
  - ask: Answer
    label: v
    tex: g_J
    value: 1 + (J*(J + 1) + Sv*(Sv + 1) - L*(L + 1))/(2*J*(J + 1))
    tol: 0.005
    explain: 'μ_eff = g_J√(J(J + 1)): spin–orbit coupling is strong and the crystal field weak in 4f ions'
  verify:
    expect:
      v: cw_ln_moment(nf)/sqrt(nsimplify(J)*(nsimplify(J) + 1))

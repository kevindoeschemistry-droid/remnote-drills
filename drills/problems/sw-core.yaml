    pc:
      pick:
      - 75
      - 80
      - 85
  prompt: A week holds {{vol}} m of swimming on a polarised plan with {{pc}}% of the volume easy. How many metres are hard?
  parts:
  - ask: Answer
    label: v
    tex: m
    value: vol*(100 - pc)/100
    final: true
    tol: 0.0001

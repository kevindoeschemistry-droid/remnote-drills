- template: sw-drag-power-factor
  skill: swim.hydro
  pace: quick
  given:
    pc:
      pick:
      - 2
      - 5
      - 10
  prompt: Swimming speed rises by {{pc}}%. With drag proportional to v² and power to v³, by what percentage does the power needed rise?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: ((1 + pc/100)^3 - 1)*100
    tol: 0.005
    explain: 'Power is drag times speed, so it goes as the cube: 5% faster costs about 16% more power. This is why small drag savings beat small fitness gains'
  verify:
    expect:
      v: ((1 + Rational(pc, 100))**3 - 1)*100
- template: sw-drag-factor
  skill: swim.hydro
  pace: quick
  given:
    pc:
      pick:
      - 5
      - 10
      - 20
  prompt: A swimmer's frontal drag coefficient-area product falls by {{pc}}% at the same power output. By what percentage does speed rise? (P ∝ C·v³)
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: ((1/(1 - pc/100))^(1/3) - 1)*100
    tol: 0.005
    explain: Speed goes as the cube root of the drag saving, so a 10% cut in drag is worth about 3.6% in speed, a huge margin in a race
  verify:
    expect:
      v: ((1/(1 - Rational(pc, 100)))**Rational(1, 3) - 1)*100

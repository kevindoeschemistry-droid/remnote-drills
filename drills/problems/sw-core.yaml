- template: sw-workout-yardage
  skill: swim.practice
  pace: quick
  given:
    a:
      pick:
      - 400
      - 600
    n1:
      pick:
      - 8
      - 10
    d1:
      pick:
      - 100
      - 200
    n2:
      pick:
      - 12
      - 16
    d2:
      pick:
      - 25
      - 50
    c:
      pick:
      - 200
      - 300
  prompt: A session is {{a}} warm-up, {{n1}} x {{d1}} and {{n2}} x {{d2}}, then {{c}} cool-down. What is the total distance?
  parts:
  - ask: Answer
    label: v
    tex: total
    value: a + n1*d1 + n2*d2 + c
    final: true
    tol: 0.0001
    explain: Repeats times distance, summed. Totalling a written workout before swimming it is how a coach checks it fits the hour
  verify:
    expect:
      v: a + n1*d1 + n2*d2 + c
- template: sw-set-duration
  skill: swim.practice
  pace: quick
  given:
    n:
      pick:
      - 8
      - 10
      - 20
    d:
      pick:
      - 50
      - 100
    so:
      pick:
      - 60
      - 80
      - 90
  prompt: How many minutes does {{n}} x {{d}} on {{so}} seconds take?
  parts:
  - ask: Answer
    label: v
    tex: min
    value: n*so/60
    tol: 0.005
    explain: A set's length is repeats times send-off, whatever the swimmer's speed. That is what makes interval sets plannable to the minute
  verify:
    expect:
      v: Rational(n*so, 60)
- template: sw-sendoff-choose
  skill: swim.practice
  pace: quick
  given:
    p:
      pick:
      - 72
      - 78
      - 84
    d:
      pick:
      - 100
      - 200
    r:
      pick:
      - 10
      - 20
  prompt: A swimmer's target pace is {{p}} s per 100. For repeats of {{d}} with about {{r}} s rest, what send-off, rounded up to the next 5 seconds, should be set?
  parts:
  - ask: Answer
    label: v
    tex: s
    value: ceil((p*d/100 + r)/5)*5
    final: true
    tol: 0.0001
    explain: Send-off is swim time plus rest, rounded to something readable on a pace clock
  verify:
    expect:
      v: ceiling(Rational(p*d + 100*r, 500))*5
- template: sw-sendoff-rest
  skill: swim.practice
  pace: quick
  given:
    so:
      pick:
      - 80
      - 90
      - 105
    t:
      pick:
      - 68
      - 72
      - 77
  prompt: On 100s leaving every {{so}} s, a swimmer holding {{t}} s gets how many seconds of rest?
  parts:
  - ask: Answer
    label: v
    tex: s
    value: so - t
    final: true
    tol: 0.0001
    explain: Interval equals swim time plus rest. The faster you swim, the more rest you earn, which is why the same set suits a range of swimmers
  verify:
    expect:
      v: so - t

- template: nt-jacobi
  skill: nt.residues
  pace: quick
  cases:
  - ka: 2
    kn: 15
    kans: 1
  - ka: 7
    kn: 15
    kans: -1
  - ka: 5
    kn: 21
    kans: 1
  - ka: 2
    kn: 21
    kans: -1
  - ka: 11
    kn: 35
    kans: 1
  - ka: 8
    kn: 21
    kans: -1
  - ka: 13
    kn: 33
    kans: -1
  - ka: 7
    kn: 45
    kans: -1
  prompt: Evaluate the Jacobi symbol ({{ka}}/{{kn}}).
  parts:
  - ask: Answer
    label: v
    tex: (a/n)
    value: kans
    final: true
    tol: 0.0001
    explain: Pull out factors of 2 with the rule for (2/n), flip with reciprocity (a sign change only when both are 3 mod 4), reduce, and repeat
  verify:
    expect:
      v: pm_jacobi(ka, kn)
- template: nt-jacobi-facts
  skill: nt.residues
  pace: recall
  cases:
  - q: The Jacobi symbol (2/15) equals 1. Is 2 a square modulo 15?
    o1: 'No: it is a non-square modulo both 3 and 5'
    o2: 'Yes'
    o3: Only modulo 3
    o4: It cannot be determined
  - q: 'If the Jacobi symbol (a/n) equals −1, then a is:'
    o1: Not a square modulo n
    o2: A square modulo n
    o3: A unit of order 2
    o4: Divisible by a prime factor of n
  - q: 'The main practical advantage of the Jacobi symbol is that it can be computed:'
    o1: Without factorising n
    o2: Without any division
    o3: Only for prime n
    o4: In constant time
  - q: 'A composite n that satisfies a^((n−1)/2) ≡ (a/n) (mod n) for a base a is called:'
    o1: An Euler pseudoprime to base a
    o2: A Carmichael number
    o3: A Fermat prime
    o4: A primitive root
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: '(2/15) = (2/3)(2/5) = (−1)(−1) = 1: two wrongs make the symbol right, but 2 is still not a square modulo 15'
  verify:
    authored: true
- template: nt-fermat-factorise
  skill: nt.diophantine
  pace: quick
  cases:
  - kn: 5959
    kans: 80
  - kn: 8051
    kans: 90
  - kn: 3127
    kans: 56
  - kn: 2491
    kans: 50
  - kn: 6557
    kans: 81
  - kn: 9991
    kans: 100
  prompt: 'Fermat''s method on n = {{kn}}: what is the first a ≥ √n for which a² − n is a perfect square?'
  parts:
  - ask: Answer
    label: v
    tex: a
    value: kans
    final: true
    tol: 0.0001
    explain: Start at the first integer above √n and step up, testing a² − n each time; then n = (a − b)(a + b). The method is fast exactly when n has two factors close together
  verify:
    expect:
      v: pm_fermat_a(kn)
- template: nt-congruent-squares
  skill: nt.diophantine
  pace: quick
  cases:
  - kx: 10
    ky: 3
    kn: 91
  - kx: 12
    ky: 5
    kn: 119
  - kx: 17
    ky: 4
    kn: 91
  - kx: 23
    ky: 10
    kn: 143
  - kx: 16
    ky: 5
    kn: 77
  - kx: 27
    ky: 8
    kn: 133
  prompt: '{{kx}}² ≡ {{ky}}² (mod {{kn}}). Use this to find a non-trivial factor of {{kn}}: compute gcd({{kx}} − {{ky}}, {{kn}}).'
  parts:
  - ask: Answer
    label: v
    tex: factor
    value: gcd(kx - ky, kn)
    final: true
    tol: 0.0001
    explain: n divides (x − y)(x + y) without dividing either factor, so each shares a proper factor with n
  verify:
    expect:
      v: kn*(kx - ky)/lcm(kn, kx - ky)

    tex: x
    value: nn!/(nn - r)!
    final: true
    tol: 0.0001
    explain: n(n − 1)… for r factors
  verify:
    expect:
      v: factorial(nn)/factorial(nn - r)
- template: mm-dice-sum-prob
  skill: stats.probability
  pace: recall
  given:
    s:
      int:
      - 2
      - 12
  prompt: Two fair dice are rolled. What is the probability that the sum is {{s}}?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: (6 - abs(s - 7))/36
    final: true
    tol: 0.0001
    explain: 'Ways to make s: 6 − |s − 7|, out of 36'
  verify:
    expect:
      v: expand((Symbol('t') + Symbol('t')**2 + Symbol('t')**3 + Symbol('t')**4 + Symbol('t')**5 + Symbol('t')**6)**2).coeff(Symbol('t'), s)/36
- template: mm-radius-general-form
  skill: geo.circles
  pace: quick
  given:
    h:
      int:
      - -5
      - 5
    k:
      int:
      - -5
      - 5
    r:
      int:
      - 1
      - 8
  require:
  - h != 0
  - k != 0
  prompt: What is the radius of $x^2 + y^2 + {{-2*h}}x + {{-2*k}}y + {{h^2 + k^2 - r^2}} = 0$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: r
    final: true
    tol: 0.0001
    explain: 'Complete the squares: r² = (D/2)² + (E/2)² − F'
  verify:
    expect:
      v: sqrt((-2*h)**2/4 + (-2*k)**2/4 - (h**2 + k**2 - r**2))
- template: mm-coefficient-2x
  skill: alg.polynomials
  pace: quick
  given:
    nn:
      int:
      - 3
      - 7
    k:
      int:
      - 1
      - 3
  require:
  - k < nn
  prompt: What is the coefficient of $x^{ {{k}} }$ in $(2x + 1)^{ {{nn}} }$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: combinations(nn, k)*2^k
    final: true
    tol: 0.0001
    explain: C(n, k) times 2ᵏ from the 2x factors
  verify:
    expect:
      v: expand((2*Symbol('t') + 1)**nn).coeff(Symbol('t'), k)
- template: mm-largest-base-numeral
  skill: k8.place-value
  pace: recall
  given:
    b:
      int:
      - 2
      - 9
  prompt: What is the largest three-digit numeral in base {{b}}, written in base 10?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: b^3 - 1
    final: true
    tol: 0.0001
    explain: One less than b³
  verify:
    expect:
      v: (b - 1)*b**2 + (b - 1)*b + (b - 1)
- template: mm-reciprocal-roots
  skill: alg.quadratics
  pace: quick
  given:
    r:
      int:
      - -6
      - 7
    s:
      int:
      - -6
      - 7
  require:
  - r != 0
  - s != 0
  - r + s != 0
  prompt: What is the sum of the reciprocals of the roots of $x^2 + {{-(r + s)}}x + {{r*s}} = 0$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: (r + s)/(r*s)
    final: true
    tol: 0.0001
    explain: 1/r + 1/s = (r + s)/(rs) = −b/c
  verify:
    expect:
      v: Rational(1, r) + Rational(1, s)
- template: mm-triangular-index
  skill: alg.sequences
  pace: recall
  given:
    k:
      int:
      - 5
      - 30
  prompt: '{{k*(k + 1)/2}} is the n-th triangular number. What is n?'
  parts:
  - ask: Answer
    label: v
    tex: x
    value: k
    final: true
    tol: 0.0001
    explain: Double it and find two consecutive numbers with that product
  verify:
    expect:
      v: Max(*solve(Eq(x*(x + 1)/2, k*(k + 1)/2), x))
- template: mm-ceiling-negative
  skill: k8.integers
  pace: recall
  given:
    a:
      int:
      - 5
      - 40
    b:
      int:
      - 2
      - 9
  require:
  - mod(a, b) != 0
  - a > b
  prompt: 'In your head: $\left\lceil -\frac{ {{a}} }{ {{b}} } \right\rceil$'
  parts:
  - ask: Answer
    label: v
    tex: x
    value: ceil(-a/b)
    final: true
    tol: 0.0001
    explain: The ceiling moves toward +∞, so it chops toward zero for negatives
  verify:
    expect:
      v: ceiling(Rational(-a, b))
- template: mm-factor-k
  skill: alg.polynomials
  pace: quick
  given:
    a:
      int:
      - -6
      - 6
    s:
      int:
      - -6
      - 6
  require:
  - a != 0
  - a + s != 0
  prompt: For which k is $x - {{a}}$ a factor of $x^2 + kx + {{a*s}}$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: -(a + s)
    final: true
    tol: 0.0001
    explain: Substitute x = a and set the result to zero
  verify:
    expect:
      v: solve(Eq(a**2 + x*a + a*s, 0), x)[0]
- template: mm-cos-from-sin
  skill: trig.unit-circle
  pace: quick
  cases:
  - a: 3
    c: 5
    qd: II
    sg: -1
  - a: 5
    c: 13
    qd: I
    sg: 1
  - a: 8
    c: 17
    qd: II
    sg: -1
  - a: 7
    c: 25
    qd: I
    sg: 1
  - a: 4
    c: 5
    qd: II
    sg: -1
  prompt: $\sin\theta = \frac{ {{a}} }{ {{c}} }$ with θ in quadrant {{qd}}. What is $\cos\theta$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: sg*sqrt(c^2 - a^2)/c
    final: true
    tol: 0.0001
    explain: sin² + cos² = 1; the quadrant fixes the sign
  verify:
    expect:
      v: sg*sqrt(1 - Rational(a, c)**2)
- template: mm-det-zero-x
  skill: alg.vectors-matrices
  pace: recall
  given:
    p:
      int:
      - 1
      - 6
    q:
      int:
      - 2
      - 6
  prompt: For which positive x is $\begin{vmatrix} x & {{p^2}} \\ {{q^2}} & x \end{vmatrix} = 0$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: p*q
    final: true
    tol: 0.0001
    explain: x² = p²q²
  verify:
    expect:
      v: Max(*solve(Eq(Matrix([[x, p**2], [q**2, x]]).det(), 0), x))
- template: mm-inverse-entry
  skill: alg.vectors-matrices
  pace: quick
  given:
    b:
      int:
      - -5
      - 5
    c:
      int:
      - -4
      - 4
  require:
  - b != 0
  prompt: $A = \begin{pmatrix} 1 & {{b}} \\ {{c}} & {{1 + b*c}} \end{pmatrix}$. What is the (1, 2) entry of $A^{-1}$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: -b
    final: true
    tol: 0.0001
    explain: det A = 1, so the inverse swaps the diagonal and negates the off-diagonal
  verify:
    expect:
      v: Matrix([[1, b], [c, 1 + b*c]]).inv()[0, 1]
- template: mm-3d-magnitude
  skill: alg.vectors-matrices
  pace: recall
  cases:
  - a: 1
    b: 2
    c: 2
  - a: 2
    b: 3
    c: 6
  - a: 1
    b: 4
    c: 8
  - a: 4
    b: 4
    c: 7
  - a: 2
    b: 6
    c: 9
  - a: 6
    b: 6
    c: 7
  prompt: What is the magnitude of $\langle {{a}}, {{b}}, {{c}} \rangle$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: sqrt(a^2 + b^2 + c^2)
    final: true
    tol: 0.0001
    explain: 'Know the quadruples: (1, 2, 2, 3), (2, 3, 6, 7), (1, 4, 8, 9), (4, 4, 7, 9), (2, 6, 9, 11)'
  verify:
    expect:
      v: Matrix([a, b, c]).norm()
- template: mm-composite-reverse
  skill: alg.functions
  pace: recall
  given:
    a:
      int:
      - 2
      - 5
    b:
      int:
      - -5
      - 5
    c:
      int:
      - -9
      - 9
    t:
      int:
      - -3
      - 3
  require:
  - (a*t + b)^2 + c != 0
  prompt: $f(x) = {{a}}x + {{b}}$ and $g(x) = x^2 + {{c}}$. What is $g(f({{t}}))$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: (a*t + b)^2 + c
    final: true
    tol: 0.0001
    explain: 'Inner function first: f(t), then g of that'
  verify:
    expect:
      v: ((Symbol('t')**2 + c).subs(Symbol('t'), a*t + b))
- template: mm-base-point-value
  skill: k8.place-value
  pace: quick
  given:
    b:
      pick:
      - 2
      - 3
      - 4
      - 5
      - 8
    d1:
      int:
      - 1
      - 7
    d2:
      int:
      - 1
      - 7
  require:
  - d1 < b
  - d2 < b
  prompt: What is $0.{{d1}}{{d2}}$ in base {{b}}, as a base-10 fraction?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: d1/b + d2/b^2
    final: true
    tol: 0.0001
    explain: Place values after the point are 1/b, 1/b², …
  verify:
    expect:
      v: Rational(d1*b + d2, b**2)
- template: mm-rect-to-r
  skill: trig.unit-circle
  pace: recall
  given:
    k:
      int:
      - 1
      - 3
  cases:
  - a: 3
    b: -4
    c: 5
  - a: -5
    b: 12
    c: 13
  - a: -8
    b: -15
    c: 17
  - a: 6
    b: 8
    c: 10
  prompt: The point ({{a*k}}, {{b*k}}) has polar coordinates (r, θ). What is r?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: c*k
    final: true
    tol: 0.0001
    explain: r = √(x² + y²)
  verify:
    expect:
      v: sqrt((a*k)**2 + (b*k)**2)
- template: mm-last-digit-power
  skill: k8.exponents
  pace: recall
  given:
    a:
      int:
      - 2
      - 9
    k:
      int:
      - 5
      - 60
  require:
  - mod(a, 5) != 0
  prompt: What is the last digit of ${{a}}^{ {{k}} }$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: mod(a^(mod(k - 1, 4) + 1), 10)
    final: true
    tol: 0.0001
    explain: 'Last digits cycle with period 1, 2 or 4: reduce the exponent mod 4'
  verify:
    expect:
      v: (Integer(a)**k) % 10
- template: mm-removable-limit
  skill: calc.limits
  pace: recall
  given:
    a:
      int:
      - 2
      - 12
  prompt: 'In your head: $\lim_{x \to {{a}}} \frac{x^2 - {{a^2}}}{x - {{a}}}$'
  parts:
  - ask: Answer
    label: v
    tex: x
    value: 2*a
    final: true
    tol: 0.0001
    explain: Factor and cancel x − a
  verify:
    expect:
      v: limit((x**2 - a**2)/(x - a), x, a)
- template: mm-product-derivative
  skill: calc.derivative-rules
  pace: quick
  given:
    a:
      int:
      - -5
      - 5
    b:
      int:
      - -4
      - 4
    c:
      int:
      - -3
      - 3
  require:
  - 2*c*(c + b) + c^2 + a != 0
  prompt: $f(x) = (x^2 + {{a}})(x + {{b}})$. What is $f'({{c}})$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: 2*c*(c + b) + (c^2 + a)
    final: true
    tol: 0.0001
    explain: 'Product rule: f''g + fg'''
  verify:
    expect:
      v: diff((x**2 + a)*(x + b), x).subs(x, c)
- template: mm-tangent-intercept
  skill: calc.derivative-rules
  pace: recall
  given:
    k:
      int:
      - 1
      - 5
    a:
      int:
      - -5
      - 5
  require:
  - a != 0
  prompt: What is the y-intercept of the tangent to $y = {{k}}x^2$ at $x = {{a}}$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: -k*a^2
    final: true
    tol: 0.0001
    explain: y = f(a) + f'(a)(0 − a) = ka² − 2ka²
  verify:
    expect:
      v: (k*x**2 - diff(k*x**2, x)*x).subs(x, a)
- template: mm-horizontal-asymptote
  skill: calc.limits
  pace: recall
  given:
    a:
      int:
      - 1
      - 9
    b:
      int:
      - 1
      - 9
    c:
      int:
      - 2
      - 9
    d:
      int:
      - 1
      - 9
  prompt: What is the horizontal asymptote of $y = \frac{ {{a}}x^2 + {{b}}x }{ {{c}}x^2 - {{d}} }$? (Give the y-value.)
  parts:
  - ask: Answer
    label: v
    tex: x
    value: a/c
    final: true
    tol: 0.0001
    explain: 'Equal degrees: ratio of leading coefficients'
  verify:
    expect:
      v: limit((a*x**2 + b*x)/(c*x**2 - d), x, oo)
- template: mm-inflection
  skill: calc.extrema
  pace: recall
  given:
    k:
      int:
      - -5
      - 5
    c:
      int:
      - -9
      - 9
  require:
  - k != 0
  prompt: Where is the inflection point of $y = x^3 + {{3*k}}x^2 + {{c}}x$? (Give x.)
  parts:
  - ask: Answer
    label: v
    tex: x
    value: -k
    final: true
    tol: 0.0001
    explain: y'' = 6x + 6k = 0
  verify:
    expect:
      v: solve(diff(x**3 + 3*k*x**2 + c*x, x, 2), x)[0]
- template: mm-max-product
  skill: calc.extrema
  pace: recall
  given:
    h:
      int:
      - 3
      - 30
  prompt: Two numbers add to {{2*h}}. What is the largest possible product?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: h^2
    final: true
    tol: 0.0001
    explain: Split the sum evenly
  verify:
    expect:
      v: (x*(2*h - x)).subs(x, solve(diff(x*(2*h - x), x), x)[0])
- template: mm-average-value
  skill: calc.riemann-ftc
  pace: recall
  given:
    k:
      int:
      - 1
      - 4
    a:
      int:
      - 1
      - 6
  prompt: What is the average value of ${{3*k}}x^2$ on $[0, {{a}}]$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: k*a^2
    final: true
    tol: 0.0001
    explain: Average = integral ÷ length
  verify:
    expect:
      v: integrate(3*k*x**2, (x, 0, a))/a
- template: mm-inverse-derivative
  skill: calc.chain-rule
  pace: quick
  given:
    a:
      int:
      - 1
      - 3
    b:
      int:
      - 1
      - 6
  prompt: $f(x) = x^3 + {{b}}x$. What is $(f^{-1})'({{a^3 + b*a}})$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: 1/(3*a^2 + b)
    final: true
    tol: 0.0001
    explain: (f⁻¹)'(f(a)) = 1/f'(a)
  verify:
    expect:
      v: 1/diff(x**3 + b*x, x).subs(x, a)
- template: mm-trace-of-square
  skill: la.eigenvalues
  pace: quick
  given:
    r:
      int:
      - -5
      - 6
    s:
      int:
      - -5
      - 6
  require:
  - r^2 + s^2 != 0
  prompt: A 2 × 2 matrix has trace {{r + s}} and determinant {{r*s}}. What is the trace of $A^2$?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: r^2 + s^2
    final: true
    tol: 0.0001
    explain: tr(A²) = λ₁² + λ₂² = (tr A)² − 2 det A
  verify:
    expect:
      v: (Matrix.diag(r, s)**2).trace()

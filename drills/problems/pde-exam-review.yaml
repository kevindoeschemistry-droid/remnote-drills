- template: mt-solution-form
  skill: pde.review-2
  pace: recall
  cases:
    - { say: 'the heat equation on a rod with both ends held at 0', ans: 0 }
    - { say: 'the heat equation on a rod with both ends insulated', ans: 1 }
    - { say: 'the wave equation on a string fixed at both ends', ans: 2 }
  prompt: 'The series solution of {{say}} has the form…'
  parts:
    - ask: 'Form'
      label: v
      choice: ["Σ bₙ sin(nπx/L) exp(−α(nπ/L)²t)", "a₀ + Σ aₙ cos(nπx/L) exp(−α(nπ/L)²t)", "Σ sin(nπx/L) [aₙ cos(nπct/L) + bₙ sin(nπct/L)]"]
      correct: ans
      explain: 'Space factor from the boundary conditions (sines for fixed ends, cosines plus a constant for insulated ends); time factor from the equation (a decaying exponential for heat, cos and sin for waves). Then add up every mode, because the equation is linear'
  verify: { authored: true }

- template: mt-coefficient-formula
  skill: pde.review-2
  pace: recall
  cases:
    - { say: 'b_n in f(x) = \sum b_n\sin(n\pi x/L)', ans: 0 }
    - { say: 'a_0 in f(x) = a_0 + \sum a_n\cos(n\pi x/L)', ans: 1 }
    - { say: 'a_n\ (n \ge 1) in f(x) = a_0 + \sum a_n\cos(n\pi x/L)', ans: 2 }
  prompt: 'On $0 < x < L$, the coefficient ${{say}}$ is…'
  parts:
    - ask: 'Formula'
      label: v
      choice: ["(2/L) × the integral of f(x) sin(nπx/L) from 0 to L", "(1/L) × the integral of f(x) from 0 to L", "(2/L) × the integral of f(x) cos(nπx/L) from 0 to L"]
      correct: ans
      explain: 'Multiply both sides by one eigenfunction and integrate from 0 to L: orthogonality kills every term but one. The 2/L is one over the integral of sin² or cos² (which is L/2); the constant mode integrates to L, so a₀ is the plain average'
  verify: { authored: true }

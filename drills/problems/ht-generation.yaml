# Incropera §3.5: conduction with uniform thermal energy generation.
# Format: see src/drills/gen-data.ts. Prompts are in SI; {{expr}} prints a value for TeX.
# verify (tests/verify/data.py) solves the governing ODE with sympy from the givens alone:
#   ode   the heat equation, T(x) or T(r) unknown, diff = derivative
#   bcs   "lhs = rhs" with T(v), dT(v) = T'(v), lim0(expr) = limit as the variable -> 0
#   expect   each part's value as an expression in the solved T, dT and the givens
#   residuals   first-principles balances (Newton, Fourier, energy) that must vanish
# Part values may appear in verify once they are checked by something else.

# ── plane wall, both faces held at T_s ─────────────────────────────────────
- template: ht-gen-wall-fixed
  skill: ht.generation
  given:
    L: { pick: [0.005, 0.01, 0.02, 0.025, 0.05] }
    qdot: { pick: [1.0e+5, 5.0e+5, 1.0e+6, 5.0e+6, 1.0e+7] }
    k: { pick: [1, 5, 15, 50, 200] }
    Ts: { pick: [20, 50, 100] }
  let:
    Tmax: Ts + qdot*L^2/(2*k)
  require: [Tmax - Ts > 1, Tmax < 2000]
  prompt: >-
    A plane wall $2L = {{2*L*1000}}\,\mathrm{mm}$ thick ($k = {{k}}\,\mathrm{W/m\cdot K}$) generates
    $\dot q = {{qdot}}\,\mathrm{W/m^3}$ uniformly. Both faces are held at $T_s = {{Ts}}^\circ\mathrm{C}$. Steady state.
  parts:
    - ask: "Heat flux leaving each face, $q''_s$"
      label: qs
      tex: "q''_s"
      value: qdot*L
      unit: "W/m²"
      explain: >-
        Symmetric, so the midplane is adiabatic and each face carries what half the wall makes:
        $q''_s = \dot q L = {{qdot}}\times{{L}} = {{qdot*L|3}}\,\mathrm{W/m^2}$
    - ask: "Maximum temperature in the wall, $T_{max}$"
      label: Tmax
      tex: "T_{max}"
      value: Tmax
      unit: "°C"
      explain: >-
        Integrate $k\,T'' + \dot q = 0$ twice with $T(\pm L) = T_s$: $T(x) = \frac{\dot q L^2}{2k}\left(1 - \frac{x^2}{L^2}\right) + T_s$,
        largest at $x = 0$: $T_{max} = {{Ts}} + \frac{ {{qdot}}\times{{L}}^2}{2({{k}})} = {{Tmax|3}}^\circ\mathrm{C}$
  verify:
    var: x
    ode: "k*diff(T(x), x, 2) + qdot"
    bcs: ["T(-L) = Ts", "T(L) = Ts"]
    expect: { qs: "-k*dT(L)", Tmax: "T(0)" }

# ── plane wall, faces at different temperatures ────────────────────────────
- template: ht-gen-wall-asym
  skill: ht.generation
  given:
    L: { pick: [0.01, 0.02, 0.025, 0.05] }
    qdot: { pick: [1.0e+5, 2.0e+5, 5.0e+5, 1.0e+6, 2.0e+6] }
    k: { pick: [5, 15, 25, 50] }
    T1: { pick: [80, 100, 150, 200] }
    T2: { pick: [20, 30, 50] }
  let:
    C: qdot*L^2/(2*k)
    xs: k*(T2 - T1)/(2*qdot*L)
    Tmax: C*(1 - xs^2/L^2) + (T2 - T1)/2*xs/L + (T1 + T2)/2
    q2: qdot*L - k*(T2 - T1)/(2*L)
  require: [abs(xs) < 0.8*L, abs(xs) > 0.02*L, Tmax < 2000]
  prompt: >-
    A plane wall of thickness $2L = {{2*L*1000}}\,\mathrm{mm}$ ($k = {{k}}\,\mathrm{W/m\cdot K}$) generates
    $\dot q = {{qdot}}\,\mathrm{W/m^3}$. Put $x = 0$ at the midplane: the face at $x = -L$ is held at
    $T_1 = {{T1}}^\circ\mathrm{C}$ and the face at $x = +L$ at $T_2 = {{T2}}^\circ\mathrm{C}$. Steady state.
  parts:
    - ask: "How far from the midplane is the hottest plane? (mm, as a distance)"
      label: xmm
      tex: "|x_{max}|"
      value: abs(xs)*1000
      unit: mm
      explain: >-
        $T(x) = \frac{\dot q L^2}{2k}\left(1 - \frac{x^2}{L^2}\right) + \frac{T_2 - T_1}{2}\frac{x}{L} + \frac{T_1 + T_2}{2}$.
        Set $dT/dx = 0$: $x_{max} = \frac{k(T_2 - T_1)}{2\dot q L} = {{xs*1000|3}}\,\mathrm{mm}$, on the hotter ($T_1$) side
    - ask: "Maximum temperature, $T_{max}$"
      label: Tmax
      tex: "T_{max}"
      value: Tmax
      unit: "°C"
      explain: "Put $x_{max}$ back into $T(x)$: $T_{max} = {{Tmax|3}}^\\circ\\mathrm{C}$"
    - ask: "Heat flux leaving through the cooler face ($x = +L$)"
      label: q2
      tex: "q''(L)"
      value: q2
      unit: "W/m²"
      explain: >-
        $q''(L) = -k\,dT/dx|_L = \dot q L - \frac{k(T_2 - T_1)}{2L} = {{q2|3}}\,\mathrm{W/m^2}$.
        More than $\dot q L$ leaves this face: the cool side takes heat from the hot side too
  verify:
    var: x
    ode: "k*diff(T(x), x, 2) + qdot"
    bcs: ["T(-L) = T1", "T(L) = T2"]
    expect: { xmm: "1000*Abs(solve(dT(x), x)[0])", Tmax: "T(solve(dT(x), x)[0])", q2: "-k*dT(L)" }

# ── plane wall cooled by convection (or insulated on one face) ─────────────
- template: ht-gen-wall-conv
  skill: ht.generation
  given:
    L: { pick: [0.01, 0.02, 0.025, 0.05] }
    ins: { pick: [0, 1] }
    qdot: { pick: [1.0e+5, 2.0e+5, 5.0e+5, 1.0e+6, 2.0e+6] }
    k: { pick: [2, 5, 15, 25, 40] }
    h: { pick: [50, 100, 250, 500, 1000] }
    Tinf: { pick: [20, 25, 30] }
  let:
    Ts: Tinf + qdot*L/h
    Tmax: Ts + qdot*L^2/(2*k)
  require: [Tmax < 1200]
  prompt: >-
    A plane wall {{ins ? "insulated on one face and cooled on the other" : "cooled on both faces"}} is
    ${{ins ? L*1000 : 2*L*1000}}\,\mathrm{mm}$ thick ($k = {{k}}\,\mathrm{W/m\cdot K}$) and generates
    $\dot q = {{qdot}}\,\mathrm{W/m^3}$ uniformly. The coolant is at $T_\infty = {{Tinf}}^\circ\mathrm{C}$ with
    $h = {{h}}\,\mathrm{W/m^2\cdot K}$. Steady state.
  parts:
    - ask: "Cooled surface temperature, $T_s$"
      label: Ts
      tex: T_s
      value: Ts
      unit: "°C"
      explain: >-
        Overall balance on the {{ins ? "wall" : "half-wall"}} (thickness $L = {{L}}\,\mathrm{m}${{ins ? ", the insulated face is the adiabatic plane" : ", the midplane is adiabatic"}}):
        all of $\dot q L$ leaves by convection, $\dot q L = h(T_s - T_\infty)$, so
        $T_s = {{Tinf}} + \frac{ {{qdot}}\times{{L}} }{ {{h}} } = {{Ts|3}}^\circ\mathrm{C}$
    - ask: "Maximum temperature in the wall, $T_{max}$"
      label: Tmax
      tex: "T_{max}"
      value: Tmax
      unit: "°C"
      explain: >-
        Conduction inside: $T_{max} = T_s + \frac{\dot q L^2}{2k} = {{Ts|4}} + \frac{ {{qdot}}\times{{L}}^2}{2({{k}})} = {{Tmax|3}}^\circ\mathrm{C}$,
        on the {{ins ? "insulated face" : "midplane"}}
  verify:
    var: x
    ode: "k*diff(T(x), x, 2) + qdot"
    bcs: ["dT(0) = 0", "-k*dT(L) = h*(T(L) - Tinf)"]
    expect: { Ts: "T(L)", Tmax: "T(0)" }

# ── generating wall against a non-generating wall (Example 3.7) ────────────
- template: ht-gen-composite
  skill: ht.generation
  given:
    LA: { pick: [0.02, 0.04, 0.05] }
    kA: { pick: [25, 50, 75] }
    qdot: { pick: [5.0e+5, 1.0e+6, 1.5e+6, 2.0e+6] }
    LB: { pick: [0.01, 0.02, 0.025] }
    kB: { pick: [50, 150, 200] }
    h: { pick: [500, 1000, 2000] }
    Tinf: { pick: [20, 30] }
  let:
    qB: qdot*LA
    Ts: Tinf + qB/h
    T1: Ts + qB*LB/kB
    T0: T1 + qdot*LA^2/(2*kA)
  require: [T0 < 1500]
  prompt: >-
    Wall A ($L_A = {{LA*1000}}\,\mathrm{mm}$, $k_A = {{kA}}\,\mathrm{W/m\cdot K}$) generates
    $\dot q = {{qdot}}\,\mathrm{W/m^3}$ and is insulated on its left face. Its right face is bonded to wall B
    ($L_B = {{LB*1000}}\,\mathrm{mm}$, $k_B = {{kB}}\,\mathrm{W/m\cdot K}$, no generation), whose outer face is cooled by
    water at $T_\infty = {{Tinf}}^\circ\mathrm{C}$ with $h = {{h}}\,\mathrm{W/m^2\cdot K}$. Steady state.
  parts:
    - ask: "Heat flux through wall B, $q''$"
      label: qB
      tex: "q''"
      value: qB
      unit: "W/m²"
      explain: "Everything A makes leaves through its right face (the left is insulated): $q'' = \\dot q L_A = {{qB|3}}\\,\\mathrm{W/m^2}$, and B passes it on unchanged"
    - ask: "Outer surface temperature of B, $T_2$"
      label: Ts
      tex: T_2
      value: Ts
      unit: "°C"
      explain: "Convection: $T_2 = T_\\infty + q''/h = {{Tinf}} + {{qB}}/{{h}} = {{Ts|3}}^\\circ\\mathrm{C}$"
    - ask: "Interface temperature (A/B), $T_1$"
      label: T1
      tex: T_1
      value: T1
      unit: "°C"
      explain: "Conduction through B: $T_1 = T_2 + q'' L_B/k_B = {{Ts|4}} + {{qB}}\\times{{LB}}/{{kB}} = {{T1|3}}^\\circ\\mathrm{C}$"
    - ask: "Temperature at the insulated face, $T_0$ (the maximum)"
      label: T0
      tex: T_0
      value: T0
      unit: "°C"
      explain: "Inside A, adiabatic at $x = 0$: $T_0 = T_1 + \\frac{\\dot q L_A^2}{2k_A} = {{T1|4}} + \\frac{ {{qdot}}\\times{{LA}}^2}{2({{kA}})} = {{T0|3}}^\\circ\\mathrm{C}$"
  verify:
    var: x
    ode: "kA*diff(T(x), x, 2) + qdot"
    bcs: ["dT(0) = 0", "T(LA) = T1"]
    expect: { T0: "T(0)" }
    residuals: ["qB + kA*dT(LA)", "qB - kB*(T1 - Ts)/LB", "qB - h*(Ts - Tinf)"]

# ── given T(x), work backwards ─────────────────────────────────────────────
- template: ht-gen-poly
  skill: ht.generation
  given:
    L: { pick: [0.05, 0.1, 0.2] }
    k: { pick: [1, 5, 20, 40] }
    a: { pick: [100, 150, 200, 250] }
    b: { pick: [-200, -100, -50, 50, 100] }
    c: { pick: [-3000, -2000, -1000, -500, -200] }
    Tinf: { pick: [20, 25] }
  let:
    qdot: -2*k*c
    qL: -k*(b + 2*c*L)
    TL: a + b*L + c*L^2
    hh: qL/(TL - Tinf)
  require: [TL - Tinf > 5, qL > 0, hh > 2, hh < 5000]
  prompt: >-
    At steady state the temperature in a plane wall of thickness $L = {{L*1000}}\,\mathrm{mm}$
    ($k = {{k}}\,\mathrm{W/m\cdot K}$) is $T(x) = a + bx + cx^2$ with $a = {{a}}^\circ\mathrm{C}$,
    $b = {{b}}\,^\circ\mathrm{C/m}$, $c = {{c}}\,^\circ\mathrm{C/m^2}$. The face at $x = L$ is cooled by fluid at
    $T_\infty = {{Tinf}}^\circ\mathrm{C}$.
  parts:
    - ask: "Volumetric generation rate, $\\dot q$"
      label: qdot
      tex: "\\dot q"
      value: qdot
      unit: "W/m³"
      explain: "Heat equation, steady 1-D: $k\\,T'' + \\dot q = 0$ with $T'' = 2c$, so $\\dot q = -2kc = -2({{k}})({{c}}) = {{qdot|3}}\\,\\mathrm{W/m^3}$"
    - ask: "Heat flux leaving the face at $x = L$"
      label: qL
      tex: "q''(L)"
      value: qL
      unit: "W/m²"
      explain: "Fourier: $q''(L) = -k\\,T'(L) = -k(b + 2cL) = {{qL|3}}\\,\\mathrm{W/m^2}$"
    - ask: "Convection coefficient at that face, $h$"
      label: hh
      tex: h
      value: hh
      unit: "W/m²·K"
      explain: "Surface balance: conduction in = convection out, $q''(L) = h[T(L) - T_\\infty]$ with $T(L) = {{TL|4}}^\\circ\\mathrm{C}$, so $h = {{hh|3}}\\,\\mathrm{W/m^2\\cdot K}$"
  verify:
    var: x
    residuals:
      - "k*diff(a + b*x + c*x**2, x, 2) + qdot"
      - "qL + k*diff(a + b*x + c*x**2, x).subs(x, L)"
      - "qL - hh*((a + b*L + c*L**2) - Tinf)"

# ── long rod / fuel element ────────────────────────────────────────────────
- template: ht-gen-rod
  skill: ht.generation
  given:
    ro: { pick: [0.002, 0.005, 0.01, 0.015, 0.025] }
    qdot: { pick: [1.0e+6, 5.0e+6, 1.0e+7, 2.0e+7, 5.0e+7] }
    k: { pick: [2, 15, 25, 50] }
    h: { pick: [500, 1000, 2000, 5000] }
    Tinf: { pick: [20, 25, 50] }
  let:
    qp: qdot*pi*ro^2
    Ts: Tinf + qdot*ro/(2*h)
    T0: Ts + qdot*ro^2/(4*k)
  require: [T0 < 1500, T0 - Tinf > 5]
  prompt: >-
    A long solid rod of diameter ${{2*ro*1000}}\,\mathrm{mm}$ ($k = {{k}}\,\mathrm{W/m\cdot K}$) generates
    $\dot q = {{qdot}}\,\mathrm{W/m^3}$ and is cooled by fluid at $T_\infty = {{Tinf}}^\circ\mathrm{C}$ with
    $h = {{h}}\,\mathrm{W/m^2\cdot K}$. Steady state.
  parts:
    - ask: "Heat leaving per metre of rod, $q'$"
      label: qp
      tex: "q'"
      value: qp
      unit: "W/m"
      explain: "All of it is generated inside: $q' = \\dot q\\,\\pi r_o^2 = {{qp|3}}\\,\\mathrm{W/m}$"
    - ask: "Surface temperature, $T_s$"
      label: Ts
      tex: T_s
      value: Ts
      unit: "°C"
      explain: "Convection off the surface: $q' = h(2\\pi r_o)(T_s - T_\\infty)$, so $T_s = T_\\infty + \\frac{\\dot q r_o}{2h} = {{Ts|3}}^\\circ\\mathrm{C}$"
    - ask: "Centreline temperature, $T_0$"
      label: T0
      tex: T_0
      value: T0
      unit: "°C"
      explain: "Radial: $\\frac{1}{r}\\frac{d}{dr}\\left(r\\frac{dT}{dr}\\right) + \\frac{\\dot q}{k} = 0$, finite at $r = 0$, gives $T_0 = T_s + \\frac{\\dot q r_o^2}{4k} = {{T0|3}}^\\circ\\mathrm{C}$"
  verify:
    var: r
    ode: "k/r*diff(r*diff(T(r), r), r) + qdot"
    bcs: ["lim0(r*dT(r)) = 0", "-k*dT(ro) = h*(T(ro) - Tinf)"]
    expect: { qp: "-k*dT(ro)*2*pi*ro", Ts: "T(ro)", T0: "lim0(T(r))" }

# ── current-carrying wire: q̇ from I²R ──────────────────────────────────────
- template: ht-gen-wire
  skill: ht.generation
  given:
    D: { pick: [0.001, 0.002, 0.003, 0.005] }
    I: { pick: [10, 20, 50, 100] }
    rho: { pick: [1.7e-8, 7.0e-7, 1.1e-6] }
    k: { pick: [15, 25, 400] }
    h: { pick: [100, 500, 1000, 5000] }
    Tinf: { pick: [20, 25] }
  let:
    A: pi*D^2/4
    qdot: I^2*rho/A^2
    Ts: Tinf + qdot*D/(4*h)
    T0: Ts + qdot*D^2/(16*k)
  require: [Ts - Tinf > 2, T0 < 1200]
  prompt: >-
    A wire of diameter ${{D*1000}}\,\mathrm{mm}$ (electrical resistivity $\rho_e = {{rho}}\,\Omega\cdot\mathrm{m}$,
    $k = {{k}}\,\mathrm{W/m\cdot K}$) carries $I = {{I}}\,\mathrm{A}$. It is cooled by air at
    $T_\infty = {{Tinf}}^\circ\mathrm{C}$ with $h = {{h}}\,\mathrm{W/m^2\cdot K}$. Steady state.
  parts:
    - ask: "Volumetric generation rate, $\\dot q$"
      label: qdot
      tex: "\\dot q"
      value: qdot
      unit: "W/m³"
      explain: >-
        Joule heating per length $I^2R' = I^2\rho_e/A$, spread over area $A = \pi D^2/4 = {{A|4}}\,\mathrm{m^2}$:
        $\dot q = \frac{I^2\rho_e}{A^2} = {{qdot|3}}\,\mathrm{W/m^3}$
    - ask: "Surface temperature, $T_s$"
      label: Ts
      tex: T_s
      value: Ts
      unit: "°C"
      explain: "$\\dot q\\,\\pi r_o^2 = h\\,2\\pi r_o(T_s - T_\\infty)$, so $T_s = T_\\infty + \\frac{\\dot q r_o}{2h} = {{Ts|3}}^\\circ\\mathrm{C}$"
    - ask: "Centreline temperature, $T_0$"
      label: T0
      tex: T_0
      value: T0
      unit: "°C"
      explain: "$T_0 = T_s + \\frac{\\dot q r_o^2}{4k} = {{T0|4}}^\\circ\\mathrm{C}$ (a metal wire is nearly uniform: the rise inside is tiny next to $T_s - T_\\infty$)"
  verify:
    var: r
    residuals: ["qdot*(pi*D**2/4) - I**2*rho/(pi*D**2/4)"]
    ode: "k/r*diff(r*diff(T(r), r), r) + qdot"
    bcs: ["lim0(r*dT(r)) = 0", "-k*dT(D/2) = h*(T(D/2) - Tinf)"]
    expect: { Ts: "T(D/2)", T0: "lim0(T(r))" }

# ── sphere ─────────────────────────────────────────────────────────────────
- template: ht-gen-sphere
  skill: ht.generation
  given:
    ro: { pick: [0.005, 0.01, 0.05, 0.1, 0.25] }
    qdot: { pick: [1.0e+4, 5.0e+4, 1.0e+5, 1.0e+6, 5.0e+6] }
    k: { pick: [0.5, 1, 5, 20] }
    h: { pick: [10, 50, 200, 1000] }
    Tinf: { pick: [20, 25] }
  let:
    Ts: Tinf + qdot*ro/(3*h)
    T0: Ts + qdot*ro^2/(6*k)
  require: [T0 < 1500, T0 - Tinf > 5]
  prompt: >-
    A sphere of radius $r_o = {{ro*1000}}\,\mathrm{mm}$ ($k = {{k}}\,\mathrm{W/m\cdot K}$, think radioactive waste
    or a reactor pellet) generates $\dot q = {{qdot}}\,\mathrm{W/m^3}$. It sits in fluid at
    $T_\infty = {{Tinf}}^\circ\mathrm{C}$ with $h = {{h}}\,\mathrm{W/m^2\cdot K}$. Steady state.
  parts:
    - ask: "Surface temperature, $T_s$"
      label: Ts
      tex: T_s
      value: Ts
      unit: "°C"
      explain: "$\\dot q\\,\\frac{4}{3}\\pi r_o^3 = h\\,4\\pi r_o^2(T_s - T_\\infty)$, so $T_s = T_\\infty + \\frac{\\dot q r_o}{3h} = {{Ts|3}}^\\circ\\mathrm{C}$"
    - ask: "Centre temperature, $T_0$"
      label: T0
      tex: T_0
      value: T0
      unit: "°C"
      explain: "$\\frac{1}{r^2}\\frac{d}{dr}\\left(r^2\\frac{dT}{dr}\\right) + \\frac{\\dot q}{k} = 0$, finite at the centre: $T_0 = T_s + \\frac{\\dot q r_o^2}{6k} = {{T0|3}}^\\circ\\mathrm{C}$"
  verify:
    var: r
    ode: "k/r**2*diff(r**2*diff(T(r), r), r) + qdot"
    bcs: ["lim0(r**2*dT(r)) = 0", "-k*dT(ro) = h*(T(ro) - Tinf)"]
    expect: { Ts: "T(ro)", T0: "lim0(T(r))" }

# ── design: the most generation a wall can take ────────────────────────────
- template: ht-gen-qmax
  skill: ht.generation
  given:
    L: { pick: [0.005, 0.01, 0.02, 0.05] }
    k: { pick: [1, 5, 15, 50] }
    h: { pick: [100, 500, 1000, 5000] }
    Tinf: { pick: [20, 25, 50] }
    Tlim: { pick: [150, 200, 300, 500] }
  let:
    qmax: (Tlim - Tinf)/(L/h + L^2/(2*k))
    Ts: Tinf + qmax*L/h
  prompt: >-
    A plane wall $2L = {{2*L*1000}}\,\mathrm{mm}$ thick ($k = {{k}}\,\mathrm{W/m\cdot K}$) is cooled on both faces by
    fluid at $T_\infty = {{Tinf}}^\circ\mathrm{C}$ with $h = {{h}}\,\mathrm{W/m^2\cdot K}$. The material fails above
    ${{Tlim}}^\circ\mathrm{C}$. Steady state.
  parts:
    - ask: "Largest uniform generation rate it can take, $\\dot q_{max}$"
      label: qmax
      tex: "\\dot q_{max}"
      value: qmax
      unit: "W/m³"
      explain: >-
        Stack the two rises: $T_{max} - T_\infty = \underbrace{\dot q L/h}_{\text{film}} + \underbrace{\dot q L^2/2k}_{\text{wall}}$.
        Set $T_{max} = {{Tlim}}$: $\dot q_{max} = \frac{ {{Tlim}} - {{Tinf}} }{ {{L}}/{{h}} + {{L}}^2/(2\times{{k}}) } = {{qmax|3}}\,\mathrm{W/m^3}$
    - ask: "Surface temperature at that rate, $T_s$"
      label: Ts
      tex: T_s
      value: Ts
      unit: "°C"
      explain: "$T_s = T_\\infty + \\dot q_{max}L/h = {{Ts|3}}^\\circ\\mathrm{C}$"
  verify:
    var: x
    ode: "k*diff(T(x), x, 2) + qmax"
    bcs: ["dT(0) = 0", "-k*dT(L) = h*(T(L) - Tinf)"]
    expect: { Ts: "T(L)" }
    residuals: ["T(0) - Tlim"]

# ── tube: insulated inside, cooled outside ─────────────────────────────────
- template: ht-gen-tube
  skill: ht.generation
  given:
    ri: { pick: [0.01, 0.02, 0.025] }
    t: { pick: [0.005, 0.01, 0.02] }
    qdot: { pick: [1.0e+6, 5.0e+6, 1.0e+7] }
    k: { pick: [15, 25, 50] }
    h: { pick: [1000, 2000, 5000] }
    Tinf: { pick: [20, 50, 100] }
  let:
    ro: ri + t
    Ts: Tinf + qdot*(ro^2 - ri^2)/(2*h*ro)
    Tmax: Ts + qdot/(4*k)*(ro^2 - ri^2) - qdot*ri^2/(2*k)*log(ro/ri)
  require: [Tmax < 1500, Tmax - Ts > 0.5]
  prompt: >-
    A long tube ($r_i = {{ri*1000}}\,\mathrm{mm}$, $r_o = {{(ri + t)*1000}}\,\mathrm{mm}$, $k = {{k}}\,\mathrm{W/m\cdot K}$)
    generates $\dot q = {{qdot}}\,\mathrm{W/m^3}$ in its wall. The inner surface is insulated; the outer is cooled by
    fluid at $T_\infty = {{Tinf}}^\circ\mathrm{C}$ with $h = {{h}}\,\mathrm{W/m^2\cdot K}$. Steady state.
  parts:
    - ask: "Outer surface temperature, $T_o$"
      label: Ts
      tex: T_o
      value: Ts
      unit: "°C"
      explain: "Per length: $\\dot q\\,\\pi(r_o^2 - r_i^2) = h\\,2\\pi r_o(T_o - T_\\infty)$, so $T_o = {{Ts|3}}^\\circ\\mathrm{C}$"
    - ask: "Inner surface temperature, $T_i$ (the maximum)"
      label: Tmax
      tex: T_i
      value: Tmax
      unit: "°C"
      explain: >-
        $T(r) = -\frac{\dot q r^2}{4k} + C_1\ln r + C_2$. Insulated inside: $T'(r_i) = 0 \Rightarrow C_1 = \frac{\dot q r_i^2}{2k}$.
        Then $T_i - T_o = \frac{\dot q}{4k}(r_o^2 - r_i^2) - \frac{\dot q r_i^2}{2k}\ln\frac{r_o}{r_i}$, so $T_i = {{Tmax|3}}^\circ\mathrm{C}$
  verify:
    var: r
    ode: "k/r*diff(r*diff(T(r), r), r) + qdot"
    bcs: ["dT(ri) = 0", "-k*dT(ri + t) = h*(T(ri + t) - Tinf)"]
    expect: { Ts: "T(ri + t)", Tmax: "T(ri)" }

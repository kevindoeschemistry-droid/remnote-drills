# Second question types; keys recomputed by sympy along another route.

- template: ra-sup-norm
  skill: ra.metric
  pace: quick
  cases:
  - dm: '[0, 1/2]'
    sh: xⁿ
    kn: 3
    kans: 0.125
    vy: Rational(1, 2)**3
  - dm: '[0, 1]'
    sh: x/(1 + nx²)
    kn: 4
    kans: 0.25
    vy: (Y/(1 + 4*Y**2)).subs(Y, Max(*solve(diff(Y/(1 + 4*Y**2), Y), Y)))
  - dm: '[0, 1]'
    sh: x/n
    kn: 5
    kans: 0.2
    vy: Rational(1, 5)
  - dm: '[0, 1]'
    sh: xⁿ(1 − x)
    kn: 2
    kans: 0.14814815
    vy: (Y**2*(1 - Y)).subs(Y, Max(*solve(diff(Y**2*(1 - Y), Y), Y)))
  - dm: '[0, ∞)'
    sh: x e^(−nx)
    kn: 2
    kans: 0.18393972
    vy: (Y*exp(-2*Y)).subs(Y, solve(diff(Y*exp(-2*Y), Y), Y)[0])
  prompt: Find sup |f_n(x) − f(x)| on {{dm}} for f_n(x) = {{sh}} and its pointwise limit f, at n = {{kn}}.
  parts:
  - ask: Answer
    label: v
    tex: \sup|f_n-f|
    value: kans
    tol: 0.005
    explain: 'Find where |f_n − f| is largest: at an endpoint, or where its derivative vanishes. Convergence is uniform exactly when this supremum tends to 0'
  verify:
    expect:
      v: calc(vy)
- template: ra-uniform-or-pointwise
  skill: ra.metric
  pace: recall
  cases:
  - dm: '[0, 1]'
    sh: xⁿ
    kc: 1
  - dm: '[0, 1/2]'
    sh: xⁿ
    kc: 0
  - dm: the real line
    sh: x/n
    kc: 1
  - dm: '[0, 1]'
    sh: x/n
    kc: 0
  - dm: the real line
    sh: sin(nx)/n
    kc: 0
  - dm: '[0, 1]'
    sh: nx/(1 + n²x²)
    kc: 1
  - dm: '[0, 1]'
    sh: x/(1 + nx²)
    kc: 0
  prompt: 'On {{dm}}, the sequence f_n(x) = {{sh}} converges:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Uniformly
    - Pointwise but not uniformly
    correct: kc
    explain: xⁿ on [0, 1] has a discontinuous limit, so the convergence cannot be uniform. nx/(1 + n²x²) takes the value 1/2 at x = 1/n for every n, so its supremum never shrinks
  verify:
    authored: true
- template: ra-m-test-bound
  skill: ra.metric
  pace: quick
  cases:
  - kp: 2
    kans: 1.64493407
  - kp: 4
    kans: 1.08232323
  - kp: 6
    kans: 1.01734306
  prompt: The M-test bounds Σ cos(nx)/n^{{kp}} (n from 1 to ∞) by Σ 1/n^{{kp}}. Evaluate that bounding sum.
  parts:
  - ask: Answer
    label: v
    tex: \sum M_n
    value: kans
    tol: 0.005
    explain: '|cos(nx)/n^p| ≤ 1/n^p for every x, and Σ 1/n^p converges for p > 1, so the series converges uniformly on the whole real line and its sum is continuous'
  verify:
    expect:
      v: summation(1/nn**kp, (nn, 1, oo))
- template: ra-exchange-facts
  skill: ra.metric
  pace: recall
  cases:
  - q: 'f_n is n on (0, 1/n) and 0 elsewhere on [0, 1]. Then f_n → 0 pointwise, but ∫ f_n = 1 for every n. This is possible because the convergence is not:'
    o1: Uniform
    o2: Pointwise
    o3: Monotone
    o4: Bounded below
  - q: 'A uniform limit of continuous functions is always:'
    o1: Continuous
    o2: Differentiable
    o3: Constant
    o4: Monotone
  - q: 'f_n(x) = sin(nx)/√n converges uniformly to 0, yet f_n′ does not converge. So uniform convergence of f_n does not control:'
    o1: The derivatives
    o2: The integrals
    o3: Continuity of the limit
    o4: Boundedness
  - q: 'A power series converges uniformly on:'
    o1: Every closed disc strictly inside its disc of convergence
    o2: Its whole open disc of convergence, always
    o3: The boundary circle
    o4: No set containing its centre
  - q: 'If f_n → f uniformly on [a, b] and each f_n is Riemann integrable, then the integral of f_n tends to:'
    o1: The integral of f
    o2: '0'
    o3: sup f
    o4: It need not converge
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Uniform convergence passes limits through integrals for free and through continuity for free; for derivatives you need the derivatives themselves to converge uniformly
  verify:
    authored: true
- template: ra-norm-distance
  skill: ra.metric
  pace: quick
  cases:
  - a1: 3
    a2: -4
    a3: 12
    nm: ℓ²
    kans: 13
    vy: sqrt(3**2 + 4**2 + 12**2)
  - a1: 3
    a2: -4
    a3: 12
    nm: ℓ¹
    kans: 19
    vy: Abs(3) + Abs(-4) + Abs(12)
  - a1: 3
    a2: -4
    a3: 12
    nm: ℓ∞
    kans: 12
    vy: Max(Abs(3), Abs(-4), Abs(12))
  - a1: 2
    a2: -6
    a3: 9
    nm: ℓ²
    kans: 11
    vy: sqrt(2**2 + 6**2 + 9**2)
  - a1: 2
    a2: -6
    a3: 9
    nm: ℓ¹
    kans: 17
    vy: Abs(2) + Abs(-6) + Abs(9)
  - a1: 1
    a2: -2
    a3: 2
    nm: ℓ²
    kans: 3
    vy: sqrt(1 + 4 + 4)
  prompt: In R³, find the distance between ({{a1}}, {{a2}}, {{a3}}) and the origin in the {{nm}} norm.
  parts:
  - ask: Answer
    label: v
    tex: \|x\|
    value: kans
    tol: 0.005
    explain: ℓ¹ adds the absolute values, ℓ² is the Euclidean length, ℓ∞ takes the largest absolute value
  verify:
    expect:
      v: calc(vy)
- template: ra-norm-ratio
  skill: ra.metric
  pace: quick
  given:
    kn:
      pick:
      - 2
      - 3
      - 4
      - 9
  prompt: What is the largest possible value of ‖x‖₁/‖x‖₂ for a non-zero vector x in R^{{kn}}?
  parts:
  - ask: Answer
    label: v
    tex: ratio
    value: sqrt(kn)
    tol: 0.005
    explain: By Cauchy-Schwarz ‖x‖₁ ≤ √n ‖x‖₂, with equality when every coordinate has the same size. Constants like this are what Lipschitz equivalence of norms means
  verify:
    expect:
      v: Matrix.ones(kn, 1).norm(1)/Matrix.ones(kn, 1).norm(2)
- template: ra-complete-or-not
  skill: ra.metric
  pace: recall
  cases:
  - sp: the rationals with the usual distance
    kc: 1
  - sp: the closed interval [0, 1]
    kc: 0
  - sp: the open interval (0, 1)
    kc: 1
  - sp: Rⁿ with the Euclidean distance
    kc: 0
  - sp: C[0, 1] with the uniform norm
    kc: 0
  - sp: C[0, 1] with the norm ∫|f|
    kc: 1
  - sp: the integers with the usual distance
    kc: 0
  - sp: the polynomials on [0, 1] with the uniform norm
    kc: 1
  prompt: 'Is this metric space complete: {{sp}}?'
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: 'Find a Cauchy sequence whose limit has left the space: rationals approaching √2, 1/n in (0, 1), Taylor polynomials approaching eˣ, continuous ramps approaching a step in the integral norm. In the integers a Cauchy sequence is eventually constant'
  verify:
    authored: true
- template: ra-completeness-uses
  skill: ra.metric
  pace: recall
  cases:
  - q: 'A closed subset of a complete metric space is:'
    o1: Complete
    o2: Compact
    o3: Open
    o4: Bounded
  - q: 'Completeness is not a topological property: (0, 1) and the real line are homeomorphic, but only one is complete. The complete one is:'
    o1: The real line
    o2: (0, 1)
    o3: Both
    o4: Neither
  - q: 'A uniformly Cauchy sequence of continuous functions on [a, b] converges uniformly to a continuous function. This says C[a, b] is:'
    o1: Complete in the uniform norm
    o2: Compact
    o3: Finite-dimensional
    o4: Separable only
  - q: Which theorem needs completeness as a hypothesis?
    o1: The contraction mapping theorem
    o2: The intermediate value theorem
    o3: The triangle inequality
    o4: The mean value theorem
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Completeness is what lets you prove something exists by building a Cauchy sequence that approximates it
  verify:
    authored: true
- template: ra-contraction-steps
  skill: ra.metric
  pace: quick
  cases:
  - kk: 0.5
    kd: 1
    kt: 0.01
    py: Rational(1, 2)**n*1/(1 - Rational(1, 2))
    kans: 8
  - kk: 0.5
    kd: 2
    kt: 0.001
    py: Rational(1, 2)**n*2/(1 - Rational(1, 2))
    kans: 12
  - kk: 0.1
    kd: 1
    kt: 0.0001
    py: Rational(1, 10)**n*1/(1 - Rational(1, 10))
    kans: 5
  - kk: 0.25
    kd: 3
    kt: 0.01
    py: Rational(1, 4)**n*3/(1 - Rational(1, 4))
    kans: 5
  - kk: 0.8
    kd: 1
    kt: 0.1
    py: Rational(4, 5)**n*1/(1 - Rational(4, 5))
    kans: 18
  prompt: A contraction with constant k = {{kk}} is iterated from x₀, and d(x₁, x₀) = {{kd}}. What is the least n for which the bound kⁿ d(x₁, x₀)/(1 − k) is below {{kt}}?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: kans
    final: true
    tol: 0.0001
    explain: Solve kⁿ < tolerance × (1 − k)/d by taking logarithms, or tabulate the powers of k. The bound needs only the first step, not the fixed point
  verify:
    expect:
      v: pm_first_n(py, 0, kt)
- template: ra-contraction-constant
  skill: ra.metric
  pace: quick
  cases:
  - sh: cos x
    ka: 0
    kb: 1
    kans: 0.84147098
    vy: Abs(diff(cos(Y), Y).subs(Y, 1))
  - sh: (x + 2/x)/2
    ka: 1
    kb: 2
    kans: 0.5
    vy: Max(Abs(diff((Y + 2/Y)/2, Y).subs(Y, 1)), Abs(diff((Y + 2/Y)/2, Y).subs(Y, 2)))
  - sh: 1 + x/3
    ka: 0
    kb: 3
    kans: 0.33333333
    vy: Abs(diff(1 + Y/3, Y))
  - sh: e^(−x)
    ka: 0.3
    kb: 0.8
    kans: 0.74081822
    vy: Abs(diff(exp(-Y), Y).subs(Y, Rational(3, 10)))
  - sh: √(x + 2)
    ka: 1
    kb: 3
    kans: 0.28867513
    vy: Abs(diff(sqrt(Y + 2), Y).subs(Y, 1))
  prompt: f(x) = {{sh}} maps [{{ka}}, {{kb}}] into itself. Find its contraction constant, the largest value of |f′| on the interval.
  parts:
  - ask: Answer
    label: v
    tex: k
    value: kans
    tol: 0.005
    explain: By the mean value theorem |f(x) − f(y)| ≤ sup|f′| · |x − y|, so f is a contraction when that supremum is below 1
  verify:
    expect:
      v: calc(vy)
- template: ra-hessian-det
  skill: ra.metric
  pace: quick
  cases:
  - sh: x² + xy + y²
    kans: 3
    vy: Matrix([[2, 1], [1, 2]]).det()
  - sh: x² − 3xy + y²
    kans: -5
    vy: Matrix([[2, -3], [-3, 2]]).det()
  - sh: 2x² + 4xy + 3y²
    kans: 8
    vy: Matrix([[4, 4], [4, 6]]).det()
  - sh: −x² + xy − 2y²
    kans: 7
    vy: Matrix([[-2, 1], [1, -4]]).det()
  - sh: x² − y²
    kans: -4
    vy: Matrix([[2, 0], [0, -2]]).det()
  - sh: 3x² + 2xy − y²
    kans: -16
    vy: Matrix([[6, 2], [2, -2]]).det()
  prompt: f(x, y) = {{sh}} has a critical point at the origin. Find the determinant of its Hessian there.
  parts:
  - ask: Answer
    label: v
    tex: \det H
    value: kans
    final: true
    tol: 0.0001
    explain: The Hessian is the matrix of second partials; its determinant is f_xx f_yy − f_xy². Positive with f_xx > 0 is a minimum, positive with f_xx < 0 a maximum, negative a saddle
  verify:
    expect:
      v: calc(vy)
- template: ra-critical-classify
  skill: ra.metric
  pace: recall
  cases:
  - sh: x² + xy + y²
    kc: 0
  - sh: x² − 3xy + y²
    kc: 2
  - sh: −x² + xy − 2y²
    kc: 1
  - sh: x² − y²
    kc: 2
  - sh: 2x² + 4xy + 3y²
    kc: 0
  - sh: x⁴ + y⁴
    kc: 3
  - sh: −2x² − y²
    kc: 1
  - sh: x² + y³
    kc: 3
  prompt: 'f(x, y) = {{sh}} has a critical point at the origin. It is:'
  parts:
  - ask: Answer
    label: v
    choice:
    - A local minimum
    - A local maximum
    - A saddle point
    - Not decided by the Hessian test
    correct: kc
    explain: Compute f_xx f_yy − f_xy². Negative is a saddle; positive takes the sign of f_xx; zero (as for x⁴ + y⁴, whose Hessian vanishes) leaves the second-order test silent, whatever the point really is
  verify:
    authored: true

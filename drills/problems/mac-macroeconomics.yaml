- template: mac-gdp-expenditure
  skill: macro.indicators
  pace: quick
  cases:
  - ka: 700
    kb: 150
    kg: 200
    kx: 80
    km: 100
  - ka: 1400
    kb: 300
    kg: 350
    kx: 250
    km: 200
  - ka: 500
    kb: 90
    kg: 120
    kx: 60
    km: 95
  - ka: 9000
    kb: 2100
    kg: 2400
    kx: 1500
    km: 2000
  prompt: Consumption is {{ka}}, investment {{kb}}, government purchases {{kg}}, exports {{kx}} and imports {{km}}, all in billions of dollars. Find GDP.
  parts:
  - ask: Answer
    label: v
    tex: GDP
    value: ka + kb + kg + kx - km
    final: true
    tol: 0.0001
    explain: C + I + G + net exports; imports are subtracted because they are in the other terms but were not produced here
  verify:
    expect:
      v: solve(Eq(Symbol('m') + km, ka + kb + kg + kx), Symbol('m'))[0]

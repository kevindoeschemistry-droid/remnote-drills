    o1: Three-step etch-and-rinse
    o2: Two-step self-etch
    o3: One-step self-etch
    o4: Glass ionomer
  - q: What does 10-MDP add to an adhesive?
    o1: Chemical bonding to calcium in hydroxyapatite (and to zirconia)
    o2: Fluoride release only
    o3: Opacity
    o4: Faster light curing
  - q: What is the hybrid layer?
    o1: Resin infiltrated into demineralised dentin around the collagen network
    o2: A layer of glass ionomer
    o3: Enamel prisms after etching
    o4: The smear layer
  - q: A universal adhesive can be used how?
    o1: In etch-and-rinse, selective-enamel-etch or self-etch mode
    o2: Only after phosphoric acid
    o3: Only without any acid
    o4: Only on ceramics

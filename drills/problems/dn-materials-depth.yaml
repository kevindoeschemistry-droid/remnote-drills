- template: dn-weibull-failure
  skill: dent.materials
  pace: quick
  given:
    s0:
      pick:
      - 400
      - 900
      - 1200
    m:
      pick:
      - 5
      - 8
      - 12
    f:
      pick:
      - 0.6
      - 0.8
      - 1.0
  prompt: A ceramic has Weibull characteristic strength σ₀ = {{s0}} MPa and Weibull modulus m = {{m}}. What fraction of specimens fail at or below {{s0*f}} MPa, in %?
  parts:
  - ask: Answer
    label: v
    tex: P_f
    value: 100*(1 - exp(-(f)^m))
    tol: 0.005
    explain: P_f = 1 − exp(−(σ/σ₀)^m); at σ = σ₀ it is always 63.2%. Higher m means strengths cluster, so the material is more predictable
  verify:
    expect:
      v: 100*(1 - exp(-(nsimplify(f)*s0/s0)**m))
- template: dn-weibull-design-stress
  skill: dent.materials
  pace: quick
  given:
    s0:
      pick:
      - 400
      - 900
      - 1200
    m:
      pick:
      - 5
      - 8
      - 12
    pf:
      pick:
      - 1
      - 5
      - 10
  prompt: A material has σ₀ = {{s0}} MPa and m = {{m}}. Below what stress, in MPa, do only {{pf}}% of specimens fail?
  parts:
  - ask: Answer
    label: v
    tex: \sigma
    value: s0*(-log(1 - pf/100))^(1/m)
    tol: 0.005
    explain: 'Invert P_f: σ = σ₀(−ln(1 − P_f))^{1/m}. A low m drags the safe stress far below σ₀'
  verify:
    expect:
      v: s0*(log(1/(1 - Rational(pf, 100))))**Rational(1, m)
- template: dn-degree-conversion
  skill: dent.materials
  pace: quick
  given:
    ru:
      pick:
      - 1.2
      - 1.5
      - 1.8
    rc:
      pick:
      - 0.45
      - 0.6
      - 0.75
  prompt: 'FTIR of a composite: the aliphatic C=C (1638 cm⁻¹) to aromatic (1608 cm⁻¹) peak ratio is {{ru}} before curing and {{rc}} after. What is the degree of conversion, in %?'
  parts:
  - ask: Answer
    label: v
    tex: DC
    value: 100*(1 - rc/ru)
    tol: 0.005
    explain: The aromatic ring does not react, so it normalises the sample amount; dimethacrylate composites usually reach about 55–75%
  verify:
    expect:
      v: 100*(nsimplify(ru) - nsimplify(rc))/nsimplify(ru)
- template: dn-ratio-for-dc
  skill: dent.materials
  pace: quick
  given:
    ru:
      pick:
      - 1.2
      - 1.5
      - 1.8
    dc:
      pick:
      - 50
      - 60
      - 70
  prompt: Uncured, the 1638/1608 cm⁻¹ peak ratio is {{ru}}. What cured ratio corresponds to a degree of conversion of {{dc}}%?
  parts:
  - ask: Answer
    label: v
    tex: R_c
    value: ru*(1 - dc/100)
    tol: 0.005
    explain: 'Unreacted fraction × uncured ratio: the remaining C=C is what the 1638 band still sees'
  verify:
    expect:
      v: solve(Eq(1 - x/nsimplify(ru), Rational(dc, 100)), x)[0]
- template: dn-filler-volume
  skill: dent.materials
  pace: quick
  given:
    w:
      pick:
      - 60
      - 75
      - 85
    rf:
      pick:
      - 2.5
      - 3.0
    rr:
      pick:
      - 1.1
      - 1.2
  prompt: A composite is {{w}}% filler by weight. Filler density {{rf}} g/cm³, resin {{rr}} g/cm³. What is the filler volume fraction, in %?
  parts:
  - ask: Answer
    label: v
    tex: \varphi_v
    value: 100*(w/rf)/(w/rf + (100 - w)/rr)
    tol: 0.005
    explain: Divide each mass by its density to get volumes; dense glass fillers make volume % well below weight %
  verify:
    expect:
      v: 100/(1 + (100 - w)*nsimplify(rf)/(w*nsimplify(rr)))
- template: dn-filler-weight
  skill: dent.materials
  pace: quick
  given:
    v:
      pick:
      - 50
      - 60
      - 70
    rf:
      pick:
      - 2.5
      - 3.0
    rr:
      pick:
      - 1.1
      - 1.2
  prompt: A composite must be {{v}}% filler by volume. Filler density {{rf}} g/cm³, resin {{rr}} g/cm³. What weight percentage of filler is that?
  parts:
  - ask: Answer
    label: r
    tex: w
    value: 100*v*rf/(v*rf + (100 - v)*rr)
    tol: 0.005
    explain: 'Weight follows volume × density: manufacturers usually quote the larger weight figure'
  verify:
    expect:
      r: solve(Eq(100*(x/nsimplify(rf))/(x/nsimplify(rf) + (100 - x)/nsimplify(rr)), v), x)[0]
- template: dn-solubility
  skill: dent.materials
  pace: quick
  given:
    h:
      pick:
      - 1
    m1:
      pick:
      - 342.6
      - 355.1
      - 360.4
    m3:
      pick:
      - 341.8
      - 341.2
      - 339.9
  prompt: An ISO 4049 disc (15 mm across, {{h}} mm thick) weighs {{m1}} mg conditioned and {{m3}} mg after water storage and re-drying. What is its solubility, in µg/mm³?
  parts:
  - ask: Answer
    label: v
    tex: W_{sl}
    value: (m1 - m3)*1000/(pi*7.5^2*h)
    tol: 0.005
    explain: 'Solubility = (m₁ − m₃)/V: mass lost on re-drying per volume. ISO 4049 allows at most 7.5 µg/mm³'
  verify:
    expect:
      v: (nsimplify(m1) - nsimplify(m3))*1000/(pi*Rational(15, 2)**2*h)
- template: dn-max-mass-loss
  skill: dent.materials
  pace: quick
  given:
    h:
      pick:
      - 1
      - 1.5
      - 2
  prompt: An ISO 4049 disc is 15 mm across and {{h}} mm thick. What is the largest mass loss, in mg, that still meets the 7.5 µg/mm³ solubility limit?
  parts:
  - ask: Answer
    label: v
    tex: \Delta m
    value: 7.5*pi*7.5^2*h/1000
    tol: 0.005
    explain: 'Limit × volume: about 1.3 mg for a standard 1 mm disc, so weighing to 0.01 mg matters'
  verify:
    expect:
      v: solve(Eq(x*1000/(pi*Rational(15, 2)**2*nsimplify(h)), Rational(15, 2)), x)[0]

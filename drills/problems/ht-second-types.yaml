- template: ht-reaction-penetration
  skill: ht.mass-diffusion
  pace: quick
  given:
    D:
      pick:
      - 0.5
      - 1
      - 2
    k:
      pick:
      - 0.01
      - 1
      - 100
  prompt: A solute diffuses into a medium (D = {{D}} × 10⁻⁹ m²/s) where it is consumed by a first-order reaction (k = {{k}} s⁻¹). Over what depth, in μm, does its concentration fall by a factor e?
  parts:
  - ask: Answer
    label: v
    tex: \ell
    value: sqrt(D*1e-9/k)*1e6
    tol: 0.005
    explain: 'Steady C″ = (k/D)C decays as e^{−x/ℓ} with ℓ = √(D/k): faster reaction confines the solute to a thinner layer'
  verify:
    expect:
      v: 1/sqrt(k/(nsimplify(D)/10**9))*10**6
- template: ht-erf-concentration
  skill: ht.semi-infinite
  pace: quick
  given:
    Cs:
      pick:
      - 1.0
      - 1.2
    C0:
      pick:
      - 0.1
      - 0.2
    D:
      pick:
      - 1
      - 5
    xx:
      pick:
      - 0.2
      - 0.5
      - 1
    t:
      pick:
      - 1
      - 4
      - 10
  prompt: A steel surface is held at {{Cs}} wt% carbon; the bulk starts at {{C0}} wt%, with D = {{D}} × 10⁻¹¹ m²/s. What is the carbon content {{xx}} mm deep after {{t}} h, in wt%?
  parts:
  - ask: Answer
    label: v
    tex: C
    value: Cs + (C0 - Cs)*erf(xx/1000/(2*sqrt(D*1e-11*t*3600)))
    tol: 0.005
    explain: 'The semi-infinite solution, as in transient conduction: depth scales as √(Dt), so four times the time doubles the case depth'
  verify:
    expect:
      v: nsimplify(C0) + (nsimplify(Cs) - nsimplify(C0))*erfc(Rational(xx, 1000)/(2*sqrt(nsimplify(D)/10**11*t*3600)))
- template: ht-lewis-hm
  skill: ht.mass-convection
  pace: quick
  given:
    h:
      pick:
      - 10
      - 25
      - 50
  prompt: Air (ρ = 1.2 kg/m³, c_p = 1007 J/kg·K) flows over a wet surface with h = {{h}} W/m²K. With Le = 0.85, what mass-transfer coefficient follows from the heat–mass analogy, in mm/s?
  parts:
  - ask: Answer
    label: v
    tex: h_m
    value: h/(1.2*1007*0.85^(2/3))*1000
    tol: 0.005
    explain: 'h/h_m = ρc_p Le^{2/3}: measure one coefficient and the other follows, which is how wet-bulb thermometers work'
  verify:
    expect:
      v: solve(Eq(nsimplify(h)/x, Rational(12, 10)*1007*Rational(85, 100)**Rational(2, 3)), x)[0]*1000

- template: ht-radiation-loss
  skill: ht.rate-equations
  pace: quick
  given:
    A:
      pick:
      - 0.5
      - 1
      - 2
    Ts:
      pick:
      - 80
      - 150
      - 300
    e:
      pick:
      - 0.3
      - 0.8
      - 0.95
    Tsur:
      pick:
      - 20
      - 25
  prompt: A {{A}} m² surface at {{Ts}} °C with emissivity {{e}} sits in large surroundings at {{Tsur}} °C. What net radiation does it lose, in W? (σ = 5.670 × 10⁻⁸ W/m²K⁴)
  parts:
  - ask: Answer
    label: v
    tex: q_{rad}
    value: e*5.670374e-8*A*((Ts + 273.15)^4 - (Tsur + 273.15)^4)
    tol: 0.005
    explain: Radiation uses absolute temperatures to the fourth power; at a few hundred °C it rivals natural convection
  verify:
    expect:
      v: nsimplify(e)*Rational(5670374, 10**14)*nsimplify(A)*((Ts + Rational(27315, 100))**4 - (Tsur + Rational(27315, 100))**4)

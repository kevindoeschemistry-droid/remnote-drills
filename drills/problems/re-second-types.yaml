      r: solve(Eq(v*nsimplify(c)*nsimplify(X), x*nsimplify(k)*(nsimplify(c)*(1 - nsimplify(X)))**2), x)[0]
- template: re-cstr-approach
  skill: cre.cstr
  pace: quick
  given:
    tau:
      pick:
      - 5
      - 10
      - 20
    k:
      pick:
      - 0.05
      - 0.2
      - 1
  prompt: A CSTR (τ = {{tau}} min) running a first-order reaction (k = {{k}} min⁻¹) starts from a step change in feed. How long until the outlet is within 5% of its new steady state, in min?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: 3*tau/(1 + k*tau)
    tol: 0.005
    explain: 'The transient decays with time constant τ/(1 + kτ): reaction speeds the approach. 5% takes three time constants (e⁻³ ≈ 0.05)'
  verify:
    expect:
      v: solve(Eq(exp(-x*(1 + nsimplify(k)*tau)/tau), Rational(1, 20)), x)[0]*3/log(20)

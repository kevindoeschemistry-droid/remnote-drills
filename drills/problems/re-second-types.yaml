      - 100
      - 1000
    T0:
      pick:
      - 300
    dH:
      pick:
      - -40
      - -80
    T:
      pick:
      - 350
      - 400
      - 450
  prompt: A ⇌ B has K = {{K0}} at {{T0}} K and ΔH° = {{dH}} kJ/mol. What is the equilibrium conversion at {{T}} K (liquid, pure A fed)?
  parts:
  - ask: Answer
    label: v
    tex: X_e
    value: K0*exp(-dH*1000/8.314*(1/T - 1/T0))/(1 + K0*exp(-dH*1000/8.314*(1/T - 1/T0)))
    tol: 0.005
    explain: 'Exothermic: K falls with temperature, so the equilibrium limit closes in as the reactor heats up'
  verify:
    expect:
      v: solve(Eq(x/(1 - x), K0*exp(integrate(dH*1000/(Rational(8314, 1000)*Symbol('TT')**2), (Symbol('TT'), T0, T)))), x)[0]
- template: re-removal-line
  skill: cre.nonisothermal
  pace: quick
  given:
    T0:
      pick:
      - 300
      - 320
    Ta:
      pick:
      - 290
      - 350
      - 400
    kap:
      pick:
      - 0.5
      - 1
      - 3
  prompt: A CSTR has feed at {{T0}} K, coolant at {{Ta}} K and κ = UA/(F_A0 C_p0) = {{kap}}. At what temperature, in K, does the heat-removal line R(T) = C_p0(1 + κ)(T − T_c) cross zero?
  parts:
  - ask: Answer
    label: v
    tex: T_c
    value: (T0 + kap*Ta)/(1 + kap)
    tol: 0.005
    explain: T_c is a weighted mean of feed and coolant temperatures; more cooling (larger κ) steepens the line and pulls it toward T_a
  verify:
    expect:
      v: solve(Eq((x - T0) + nsimplify(kap)*(x - Ta), 0), x)[0]
- template: re-cstr-X-at-T
  skill: cre.nonisothermal
  pace: quick
  given:
    tau:
      pick:
      - 5
      - 10
    A:
      pick:
      - 100000000.0
      - 10000000000.0
    Ea:
      pick:
      - 60
      - 75
    T:
      pick:
      - 330
      - 360
      - 400
  prompt: A first-order CSTR has τ = {{tau}} min and k = {{A}} exp(−{{Ea}}000/(8.314T)) min⁻¹. What conversion does the mole balance give at T = {{T}} K?
  parts:
  - ask: Answer
    label: v
    tex: X_{MB}
    value: A*exp(-Ea*1000/(8.314*T))*tau/(1 + A*exp(-Ea*1000/(8.314*T))*tau)
    tol: 0.005
    explain: The mole-balance curve X_MB(T) is S-shaped; steady states are where it meets the energy-balance line
  verify:
    expect:
      v: solve(Eq(x, (1 - x)*nsimplify(A)*exp(-Ea*1000/(Rational(8314, 1000)*T))*tau), x)[0]
- template: re-which-limits
  skill: cre.diffusion
  pace: quick
  given:
    kr:
      pick:
      - 0.01
      - 0.5
      - 20
    kc:
      pick:
      - 0.05
      - 1
      - 5
  prompt: A first-order surface reaction has $k_r$ = {{kr}} cm/s and the film coefficient is $k_c$ = {{kc}} cm/s. Which step limits (holds over 90% of the resistance)?
  parts:
  - ask: Answer
    label: v
    choice:
    - Mass transfer limits
    - Surface reaction limits
    - Both matter
    correct: '(1/kc)/(1/kc + 1/kr) > 0.9 ? 0 : ((1/kr)/(1/kc + 1/kr) > 0.9 ? 1 : 2)'
    explain: 'The Damköhler number k_r/k_c says which: much above 1, diffusion to the surface controls, so velocity and particle size matter and temperature hardly does'
  verify:
    choices:
      v: 0 if (1/nsimplify(kc))/(1/nsimplify(kc) + 1/nsimplify(kr)) > Rational(9, 10) else (1 if (1/nsimplify(kr))/(1/nsimplify(kc) + 1/nsimplify(kr)) > Rational(9, 10) else 2)
- template: re-mt-bed-length
  skill: cre.diffusion
  pace: quick
  given:
    kca:
      pick:
      - 5
      - 20
      - 50
    U:
      pick:
      - 0.5
      - 1
      - 2
    X:
      pick:
      - 0.9
      - 0.99
  prompt: In a packed bed limited by external mass transfer ($k_c a$ = {{kca}} s⁻¹, superficial velocity {{U}} m/s), what length, in m, reaches X = {{X}}?
  parts:
  - ask: Answer
    label: v
    tex: L
    value: U*log(1/(1 - X))/kca
    tol: 0.005
    explain: ln(1/(1 − X)) = k_c a L/U; each extra 9 in the conversion adds the same length
  verify:
    expect:
      v: solve(Eq(1 - exp(-nsimplify(kca)*x/nsimplify(U)), nsimplify(X)), x)[0]
- template: re-deff-from-rate
  skill: cre.diffusion
  pace: quick
  given:
    Rm:
      pick:
      - 2
      - 3
      - 5
    r:
      pick:
      - 10
      - 20
      - 40
    c:
      pick:
      - 10
      - 20
    k:
      pick:
      - 50
      - 100
  prompt: Spherical pellets (R = {{Rm}} mm) are strongly diffusion-limited (η ≈ 3/φ). The observed rate is {{r}} mol/(m³·s) at surface concentration {{c}} mol/m³, with k = {{k}} s⁻¹. What $D_{eff}$, in 10⁻⁸ m²/s, does that imply?
  parts:
  - ask: Answer
    label: v
    tex: D_{eff}
    value: (r*Rm/1000/(3*c))^2/k*1e8
    tol: 0.005
    explain: In the strong limit r_obs = (3/R)√(kD_e)·C_s, so the rate tells you the product kD_e
  verify:
    expect:
      v: solve(Eq(nsimplify(r), 3/(Rational(Rm, 1000)*sqrt(k/(x/10**8)))*k*c), x)[0]
- template: re-wp-max-radius
  skill: cre.diffusion
  pace: quick
  given:
    r:
      pick:
      - 5
      - 20
      - 100
    D:
      pick:
      - 1
      - 5
    c:
      pick:
      - 10
      - 40
  prompt: For a measured rate {{r}} mol/(m³·s), $D_{eff}$ = {{D}} × 10⁻⁷ m²/s and $C_s$ = {{c}} mol/m³, what is the largest pellet radius, in mm, for which the Weisz–Prater parameter stays below 1?
  parts:
  - ask: Answer
    label: v
    tex: R_{max}
    value: sqrt(D*1e-7*c/r)*1000
    tol: 0.005
    explain: 'C_WP = r_obs R²/(D_e C_s): below 1 internal diffusion is negligible; since it goes as R², halving the pellet cuts it fourfold'
  verify:
    expect:
      v: Max(*solve(Eq(nsimplify(r)*(x/1000)**2/(nsimplify(D)/10**7*c), 1), x))
- template: re-tanks-from-variance
  skill: cre.rtd
  pace: quick
  given:
    tm:
      pick:
      - 10
      - 20
    N:
      pick:
      - 2
      - 3
      - 5
      - 8
  let:
    v: tm^2/N
  prompt: A tracer test gives mean residence time {{tm}} min and variance {{v}} min². How many equal tanks in series does that correspond to?
  parts:
  - ask: Answer
    label: r
    tex: N
    value: tm^2/v
    tol: 0.005
    explain: 'For N equal tanks σ²/τ² = 1/N: a PFR is N → ∞, one CSTR is N = 1'
  verify:
    expect:
      r: nsimplify(tm)**2/(nsimplify(tm)**2/N)
- template: re-tanks-E
  skill: cre.rtd
  pace: quick
  given:
    N:
      pick:
      - 1
      - 2
      - 3
    ti:
      pick:
      - 2
      - 5
    t:
      pick:
      - 2
      - 5
      - 10
  prompt: For {{N}} equal ideal tanks in series, each with τ_i = {{ti}} min, what is E(t) at t = {{t}} min, in min⁻¹?
  parts:
  - ask: Answer
    label: v
    tex: E(t)
    value: t^(N - 1)/(factorial(N - 1)*ti^N)*exp(-t/ti)
    tol: 0.005
    explain: E is the derivative of the cumulative F(t); for N tanks it is a gamma distribution peaking at (N − 1)τ_i
  verify:
    expect:
      v: diff(1 - exp(-Symbol('q')/ti)*summation((Symbol('q')/ti)**Symbol('j')/factorial(Symbol('j')), (Symbol('j'), 0, N - 1)), Symbol('q')).subs(Symbol('q'), t)
- template: re-segregation-zero-order
  skill: cre.rtd
  pace: quick
  given:
    k:
      pick:
      - 0.05
      - 0.1
      - 0.2
    c:
      pick:
      - 1
      - 2
    tau:
      pick:
      - 5
      - 10
      - 20
  prompt: A zero-order reaction (k = {{k}} mol/(L·min), $C_{A0}$ = {{c}} mol/L) runs in a CSTR (τ = {{tau}} min) with completely segregated flow. What conversion does the segregation model give?
  parts:
  - ask: Answer
    label: v
    tex: \bar X
    value: k*tau/c*(1 - exp(-c/(k*tau)))
    tol: 0.005
    explain: 'Each fluid element is a batch reactor: X = kt/C₀ until it hits 1 at t = C₀/k. Average over the CSTR''s exponential RTD'
  verify:
    expect:
      v: integrate(nsimplify(k)*Symbol('q')/c*exp(-Symbol('q')/tau)/tau, (Symbol('q'), 0, c/nsimplify(k))) + integrate(exp(-Symbol('q')/tau)/tau, (Symbol('q'), c/nsimplify(k), oo))
- template: re-tis-design
  skill: cre.rtd
  pace: quick
  given:
    X:
      pick:
      - 0.8
      - 0.9
      - 0.99
    N:
      pick:
      - 1
      - 2
      - 4
      - 10
  prompt: A first-order reaction must reach X = {{X}} in {{N}} equal tanks in series. What total Damköhler number kτ is needed?
  parts:
  - ask: Answer
    label: v
    tex: k\tau
    value: N*((1 - X)^(-1/N) - 1)
    tol: 0.005
    explain: More tanks approach plug flow, whose kτ = ln(1/(1 − X)); at 99% one CSTR needs 99 while a PFR needs 4.6
  verify:
    expect:
      v: N*(exp(log(1/(1 - nsimplify(X)))/N) - 1)
- template: re-dispersion-variance
  skill: cre.rtd
  pace: quick
  given:
    Pe:
      pick:
      - 1
      - 5
      - 20
      - 100
  prompt: For a closed vessel with Péclet number Pe = {{Pe}}, what is σ²/τ²?
  parts:
  - ask: Answer
    label: v
    tex: \sigma^2/\tau^2
    value: 2/Pe - 2/Pe^2*(1 - exp(-Pe))
    tol: 0.005
    explain: 'Large Pe: σ²/τ² ≈ 2/Pe, near plug flow; small Pe approaches 1, a stirred tank. Fit Pe to tracer variance, then predict conversion'
  verify:
    expect:
      v: 2/nsimplify(Pe) - 2/nsimplify(Pe)**2*(1 - exp(-nsimplify(Pe)))

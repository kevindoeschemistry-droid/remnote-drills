- template: re-half-life-predict
  skill: cre.rate-data
  pace: quick
  given:
    n:
      pick:
      - 0
      - 2
      - 3
    t1:
      pick:
      - 10
      - 30
    c1:
      pick:
      - 1
      - 2
    c2:
      pick:
      - 0.5
      - 4
  prompt: An order-{{n}} reaction has a half-life of {{t1}} min at $C_{A0}$ = {{c1}} mol/L. What is the half-life at {{c2}} mol/L?
  parts:
  - ask: Answer
    label: v
    tex: t_{1/2}
    value: t1*(c1/c2)^(n - 1)
    tol: 0.005
    explain: 't½ ∝ C₀^{1−n}: constant for first order, longer at higher C₀ for zero order, shorter for second order'
  verify:
    expect:
      v: t1*((2**(n - 1) - 1)/((n - 1)*nsimplify(c2)**(n - 1)) if n != 1 else 1)/((2**(n - 1) - 1)/((n - 1)*nsimplify(c1)**(n - 1)) if n != 1 else 1)

      pick:
      - 0.5
      - 1
      - 2
    r2:
      pick:
      - 0.3
      - 1
      - 1.5
      - 4
  prompt: In a reactor, A → 2B runs at $-r_A$ = {{r1}} and B → C at $-r_B$ = {{r2}} mol/(L·min) (B consumed by the second reaction). What is the net rate of formation of B?
  parts:
  - ask: Answer
    label: v
    tex: r_B
    value: 2*r1 - r2
    tol: 0.005
    explain: Net rates add over reactions, each scaled by its own stoichiometric coefficient; a negative answer means B is consumed overall
  verify:

      - 20
  prompt: A gas adsorbs by the Langmuir isotherm with K = {{K}} atm⁻¹. What fraction of sites is covered at {{P}} atm?
  parts:
  - ask: Answer
    label: v
    tex: \theta
    value: K*P/(1 + K*P)
    tol: 0.005
    explain: Adsorption rate ∝ P(1 − θ), desorption ∝ θ; at equilibrium θ rises linearly at low P and saturates at high P
  verify:
    expect:
      v: solve(Eq(nsimplify(K)*nsimplify(P)*(1 - x), x), x)[0]

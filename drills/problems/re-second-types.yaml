  prompt: An enzyme ($V_{max}$ = {{v}} μM/s, $K_m$ = {{km}} μM) sees a competitive inhibitor at {{i}} μM ($K_i$ = {{ki}} μM). What is the rate at [S] = {{s}} μM?

      v: 2*nsimplify(r1) + (-nsimplify(r2))
- template: re-inert-from-epsilon
  skill: cre.stoichiometry
  pace: quick
  given:
    n:
      pick:
      - 2
      - 3
  cases:
  - eps: 0.5
  - eps: 0.8
  - eps: 0.25
  require:
  - eps < n - 1
  prompt: The gas reaction A → {{n}}B is fed with A and inert. What inert mole fraction gives ε = {{eps}}?
  parts:
  - ask: Answer
    label: v
    tex: y_I
    value: 1 - eps/(n - 1)
    tol: 0.005
    explain: 'ε = y_A0 δ with δ = n − 1: diluting the feed shrinks the volume change in proportion'
  verify:
    expect:
      v: solve(Eq((1 - x)*(n - 1), nsimplify(eps)), x)[0]
- template: re-exit-flow

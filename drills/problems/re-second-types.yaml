# Generated by scripts/second_types.py from scripts/second_specs/re.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: re-k-from-fraction
  skill: cre.rate-laws
  pace: quick
  given:
    p:
      pick:
      - 10
      - 25
      - 60
      - 80
    t:
      pick:
      - 5
      - 20
      - 45
  prompt: A first-order reaction leaves {{p}}% of the reactant after {{t}} min. What is k, in min⁻¹?
  parts:
  - ask: Answer
    label: v
    tex: k
    value: log(100/p)/t
    tol: 0.005
    explain: 'ln(C₀/C) = kt: one measured fraction fixes k, and then the half-life ln 2/k'
  verify:
    expect:
      v: solve(Eq(exp(-x*t), Rational(p, 100)), x)[0]
- template: re-kc-from-conversion
  skill: cre.rate-laws
  pace: quick
  given:
    X:
      pick:
      - 0.3
      - 0.5
      - 0.7
      - 0.9
    c:
      pick:
      - 1
      - 2
      - 5
  prompt: The liquid reaction 2A ⇌ B reaches equilibrium at conversion {{X}} from $C_{A0}$ = {{c}} mol/L (no B fed). What is $K_C$, in L/mol?
  parts:
  - ask: Answer
    label: v
    tex: K_C
    value: (c*X/2)/(c*(1 - X))^2
    tol: 0.005
    explain: Each mole of A converted makes half a mole of B; read K straight from the equilibrium concentrations
  verify:
    expect:
      v: solve(Eq(x*(nsimplify(c)*(1 - nsimplify(X)))**2, nsimplify(c)*nsimplify(X)/2), x)[0]
- template: re-net-rate

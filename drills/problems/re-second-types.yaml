  prompt: A liquid second-order reaction (k = {{k}} L/(mol·min), $C_{A0}$ = {{c}} mol/L, $v_0$ = {{v}} L/min) must reach X = {{X}} in a CSTR. What volume, in L?
  parts:
  - ask: Answer
    label: r
    tex: V
    value: v*X/(k*c*(1 - X)^2)
    tol: 0.005
    explain: Design equation V = F_A0X/(−r_A) at exit conditions. (1 − X)² in the denominator makes high conversion very expensive in a CSTR
  verify:

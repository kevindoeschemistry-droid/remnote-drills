- template: re-lh-max
  skill: cre.catalysis
  pace: quick
  given:
    K:
      pick:
      - 0.5
      - 2
      - 10
  prompt: A dual-site Langmuir–Hinshelwood rate $r = kK C_A/(1 + KC_A)^2$-type rate (A adsorbs, $K$ = {{K}} L/mol) passes through a maximum as $C_A$ rises. At what $C_A$, in mol/L?
  parts:
  - ask: Answer
    label: v
    tex: C_A^*
    value: 1/K
    tol: 0.005
    explain: Beyond 1/K, A crowds the surface and blocks the neighbouring site it needs; a rate that falls as reactant rises points to competitive adsorption
  verify:
    expect:
      v: solve(diff(Symbol('q')/(1 + nsimplify(K)*Symbol('q'))**2, Symbol('q')), Symbol('q'))[0]
- template: re-langmuir-coverage
  skill: cre.catalysis
  pace: quick
  given:
    K:
      pick:
      - 0.1
      - 1
      - 5
    P:
      pick:
      - 0.2

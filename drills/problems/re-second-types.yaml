  prompt: A Lindemann mechanism has $k_1$ = {{k1}}, $k_{-1}$ = {{km}} (both L/(mol·s)) and $k_2$ = {{k2}} s⁻¹. At what [M], in mol/L, is the effective first-order constant half its high-pressure limit?
  parts:
  - ask: Answer
    label: v
    tex: '[M]_{1/2}'
    value: k2/km

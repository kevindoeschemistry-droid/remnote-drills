      v: solve(Eq(nsimplify(k1)*nsimplify(k2)*x/(nsimplify(km)*x + nsimplify(k2)), nsimplify(k1)*nsimplify(k2)/nsimplify(km)/2), x)[0]
- template: re-apparent-order
  skill: cre.mechanisms
  pace: quick
  given:
    km:
      pick:
      - 1
      - 10
    k2:
      pick:
      - 1
      - 5
      - 20
    c:
      pick:
      - 0.1
      - 1
      - 10
  prompt: A PSSH rate law is $r = k_1k_2C_A^2/(k_{-1} + k_2C_A)$ with $k_{-1}$ = {{km}} s⁻¹ and $k_2$ = {{k2}} L/(mol·s). What is the apparent order d ln r/d ln C_A at $C_A$ = {{c}} mol/L?
  parts:
  - ask: Answer
    label: v
    tex: n_{app}
    value: 2 - k2*c/(km + k2*c)
    tol: 0.005
    explain: The local slope of ln r against ln C slides from 2 (low C_A) to 1 (high C_A); a measured fractional order often means a regime change
  verify:
    expect:
      v: (Symbol('q')*diff(log(Symbol('q')**2/(nsimplify(km) + nsimplify(k2)*Symbol('q'))), Symbol('q'))).subs(Symbol('q'), nsimplify(c))
- template: re-enzyme-bound-fraction
  skill: cre.bio
  pace: quick

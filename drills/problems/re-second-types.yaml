  require:
  - d < mu*s0/(ks + s0)
  prompt: A chemostat with Monod growth ($\mu_{max}$ = {{mu}} h⁻¹, $K_s$ = {{ks}} g/L, yield {{Yxs}} g/g, feed $S_0$ = {{s0}} g/L) runs at dilution rate D = {{d}} h⁻¹. What is the biomass productivity DX, in g/(L·h)?
  parts:
  - ask: Answer
    label: v
    tex: DX
    value: d*Yxs*(s0 - ks*d/(mu - d))
    tol: 0.005
    explain: At steady state μ = D fixes S; the yield turns consumed substrate into biomass. Productivity peaks just below washout
  verify:
    expect:
      v: nsimplify(d)*nsimplify(Yxs)*(s0 - solve(Eq(nsimplify(mu)*x/(nsimplify(ks) + x), nsimplify(d)), x)[0])

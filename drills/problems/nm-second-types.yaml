    c:
      int:
      - 0
      - 3
  prompt: Three-point Gauss–Legendre uses nodes 0, ±√(3/5) with weights 8/9, 5/9. Apply it to $\int_{-1}^{1} ({{a}}x^4 + {{c}})\,dx$.
  parts:
  - ask: Answer
    label: v
    tex: I_G
    value: 2*a/5 + 2*c
    tol: 0.005
    explain: 'n Gauss points integrate polynomials up to degree 2n − 1 exactly: three points handle a quintic'
  verify:
    expect:
      v: integrate(a*Symbol('q')**4 + c, (Symbol('q'), -1, 1))
- template: nm-midpoint-step
  skill: nm.ode
  pace: quick
  given:
    h:
      pick:
      - 0.1
      - 0.2
      - 0.5
    t0:
      pick:
      - 0
      - 1
    y0:
      pick:
      - 1
      - 2
  prompt: Take one midpoint (RK2) step of size h = {{h}} for y′ = t + y from t₀ = {{t0}}, y₀ = {{y0}}.
  parts:
  - ask: Answer
    label: v
    tex: y_1
    value: y0 + h*((t0 + h/2) + (y0 + h/2*(t0 + y0)))
    tol: 0.005
    explain: 'Second-order methods match the Taylor series through h²: for this linear ODE the midpoint step equals that truncated series exactly'
  verify:
    expect:
      v: nsimplify(y0) + nsimplify(h)*(t0 + y0) + nsimplify(h)**2/2*(1 + t0 + y0)
- template: nm-rk4-stability
  skill: nm.ode
  pace: quick
  given:
    z:
      pick:
      - -0.5
      - -1.5
      - -2.5
      - -2.7
      - -2.9
      - -3.2
  prompt: Classical RK4 on y′ = λy has amplification R(z) = 1 + z + z²/2 + z³/6 + z⁴/24 with z = λh. For λh = {{z}}, is the step stable (|R| ≤ 1)?
  parts:
  - ask: Answer
    label: v
    choice:
    - Stable
    - Unstable
    correct: 'abs(1 + z + z^2/2 + z^3/6 + z^4/24) <= 1 ? 0 : 1'
    explain: R(z) is the Taylor polynomial of e^z; on the real axis RK4 stays stable to about λh = −2.785
  verify:
    choices:
      v: 0 if Abs(series(exp(Symbol('zz')), Symbol('zz'), 0, 5).removeO().subs(Symbol('zz'), nsimplify(z))) <= 1 else 1
- template: nm-backward-euler
  skill: nm.ode
  pace: quick
  given:
    lam:
      pick:
      - -5
      - -20
      - -100
    h:
      pick:
      - 0.1
      - 0.5
    y0:
      pick:
      - 1
      - 2
  prompt: Take one backward (implicit) Euler step for y′ = {{lam}}y with h = {{h}} from y₀ = {{y0}}.
  parts:
  - ask: Answer
    label: v
    tex: y_1
    value: y0/(1 - lam*h)
    tol: 0.005
    explain: 'Implicit Euler damps any negative λ for any h: stable where explicit Euler (needing h < 2/|λ|) would blow up'
  verify:
    expect:
      v: solve(Eq(x, y0 + nsimplify(h)*lam*x), x)[0]
- template: nm-stiffness-ratio
  skill: nm.ode
  pace: quick
  given:
    a:
      pick:
      - -1
      - -2
    b:
      pick:
      - 1
      - 5
    d:
      pick:
      - -50
      - -200
      - -1000
  prompt: What is the stiffness ratio (largest over smallest |eigenvalue|) of y′ = Ay with A = [[{{a}}, {{b}}], [0, {{d}}]]?
  parts:
  - ask: Answer
    label: v
    tex: S
    value: max(abs(a), abs(d))/min(abs(a), abs(d))
    tol: 0.005
    explain: 'An explicit method must resolve the fastest mode for stability while the slowest sets how long you integrate: a ratio in the hundreds calls for an implicit method'
  verify:
    expect:
      v: Max(*[Abs(v) for v in Matrix([[a, b], [0, d]]).eigenvals()])/Min(*[Abs(v) for v in Matrix([[a, b], [0, d]]).eigenvals()])
- template: nm-forward-difference-error
  skill: nm.diff
  pace: quick
  given:
    x0:
      pick:
      - 1
      - 2
    h:
      pick:
      - 0.1
      - 0.01
  prompt: Estimate f′({{x0}}) for f(x) = x³ with a forward difference, step h = {{h}}. What is the error of the estimate (estimate minus exact)?
  parts:
  - ask: Answer
    label: v
    tex: E
    value: 3*x0*h + h^2
    tol: 0.005
    explain: 'Forward differences are first order: the error ≈ (h/2)f″ falls only tenfold when h does; central differences fall a hundredfold'
  verify:
    expect:
      v: ((nsimplify(x0) + nsimplify(h))**3 - nsimplify(x0)**3)/nsimplify(h) - 3*nsimplify(x0)**2

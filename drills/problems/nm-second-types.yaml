- template: nm-dominance-threshold
  skill: nm.linear-iter
  pace: quick
  given:
    p:
      int:
      - -3
      - 3
    q:
      int:
      - 1
      - 4
    r:
      int:
      - -2
      - 3
    s:
      int:
      - 1
      - 5
    t:
      int:
      - 1
      - 3
    u:
      int:
      - -4
      - 2
  prompt: What is the smallest integer k that makes [[k, {{p}}, {{q}}], [{{r}}, k, {{s}}], [{{t}}, {{u}}, k]] strictly diagonally dominant by rows?
  parts:
  - ask: Answer
    label: v
    tex: k
    value: max(abs(p) + abs(q), abs(r) + abs(s), abs(t) + abs(u)) + 1
    final: true
    tol: 0.0001
    explain: Each diagonal must beat the sum of its row's other magnitudes; the worst row sets k
  verify:
    expect:
      v: Max(Abs(p) + Abs(q), Abs(r) + Abs(s), Abs(t) + Abs(u)) + 1
- template: nm-divided-difference
  skill: nm.interp
  pace: quick
  given:
    x0:
      pick:
      - 0
      - 1
    x1:
      pick:
      - 2
      - 3
    x2:
      pick:
      - 4
      - 5
    f0:
      int:
      - -3
      - 5
    f1:
      int:
      - 0
      - 9
    f2:
      int:
      - -2
      - 12
  prompt: 'Data: f({{x0}}) = {{f0}}, f({{x1}}) = {{f1}}, f({{x2}}) = {{f2}}. What is the second divided difference f[x₀, x₁, x₂]?'
  parts:
  - ask: Answer
    label: v
    tex: f[x_0,x_1,x_2]
    value: ((f2 - f1)/(x2 - x1) - (f1 - f0)/(x1 - x0))/(x2 - x0)
    tol: 0.005
    explain: The second divided difference is the leading coefficient of the interpolating quadratic, which the Vandermonde solve confirms
  verify:
    expect:
      v: Matrix([[x0**2, x0, 1], [x1**2, x1, 1], [x2**2, x2, 1]]).solve(Matrix([f0, f1, f2]))[0]
- template: nm-simpson-error
  skill: nm.quadrature
  pace: quick
  given:
    b:
      pick:
      - 1
      - 2
      - 3
  prompt: Simpson's rule (one panel) is applied to $\int_0^{{b}} x^4\,dx$. What is its error (Simpson minus exact)?
  parts:
  - ask: Answer
    label: v
    tex: E
    value: b^5/120
    tol: 0.005
    explain: Simpson is exact for cubics, so a quartic shows its leading error, (b − a)⁵f⁗/2880 = b⁵·24/2880
  verify:
    expect:
      v: Rational(b, 6)*(0 + 4*Rational(b, 2)**4 + b**4) - integrate(Symbol('q')**4, (Symbol('q'), 0, b))
- template: nm-trapezoid-panels
  skill: nm.quadrature
  pace: quick
  given:
    L:
      pick:
      - 1
      - 2
    f2:
      pick:
      - 2
      - 6
      - 10
    tol:
      pick:
      - 0.01
      - 0.001
  prompt: The composite trapezoid rule on [0, {{L}}] has error (b − a)³|f″|/(12n²). With |f″| = {{f2}} everywhere, how many panels keep the error below {{tol}}?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: ceil(sqrt(L^3*f2/(12*tol)))
    final: true
    tol: 0.0001
    explain: 'Error ∝ 1/n²: ten times tighter needs about three times the panels'
  verify:
    expect:
      v: ceiling(Max(*solve(Eq(L**3*f2/(12*x**2), nsimplify(tol)), x)))
- template: nm-richardson-cubic
  skill: nm.quadrature
  pace: quick
  given:
    b:
      pick:
      - 1
      - 2
    c3:
      int:
      - 1
      - 4
    c1:
      int:
      - -3
      - 3
  prompt: For $\int_0^{{b}} ({{c3}}x^3 + {{c1}}x)\,dx$, take the trapezoid rule with one and two panels and apply Richardson extrapolation (4T₂ − T₁)/3. What value results?
  parts:
  - ask: Answer
    label: v
    tex: I_R
    value: c3*b^4/4 + c1*b^2/2
    tol: 0.005
    explain: One Richardson step on the trapezoid rule is Simpson's rule, exact for cubics; the value equals the integral
  verify:
    expect:
      v: integrate(c3*Symbol('q')**3 + c1*Symbol('q'), (Symbol('q'), 0, b))
- template: nm-gauss-three-point
  skill: nm.quadrature
  pace: quick
  given:
    a:
      int:
      - 1

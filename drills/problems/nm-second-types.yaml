# Second question types; keys recomputed by sympy along another route.

- template: nm-bisection-error-bound
  skill: nm.roots
  pace: quick
  given:
    a:
      pick:
      - 0
      - 1
    b:
      pick:
      - 2
      - 3
      - 4
    n:
      int:
      - 3
      - 10
  prompt: Bisection starts on [{{a}}, {{b}}]. After {{n}} halvings, what is the largest possible error of the midpoint of the last bracket?
  parts:
  - ask: Answer
    label: v
    tex: '|e|'
    value: (b - a)/2^(n + 1)
    tol: 0.005
    explain: Each halving shrinks the bracket by 2; the midpoint is at most half a bracket from the root
  verify:
    expect:
      v: Rational(b - a, 2**n)/2
- template: nm-newton-reciprocal
  skill: nm.roots
  pace: quick
  given:
    a:
      pick:
      - 3
      - 7
      - 9
    x0:
      pick:
      - 0.1
      - 0.2
  require:
  - x0 < 2/a
  prompt: Newton's method on f(x) = 1/x − {{a}} computes 1/{{a}} without division. From $x_0$ = {{x0}}, what is $x_1$?
  parts:
  - ask: Answer
    label: v
    tex: x_1
    value: x0*(2 - a*x0)
    tol: 0.005
    explain: 'x − f/f′ simplifies to x(2 − ax): only multiplications, which is how early hardware divided. It converges for 0 < x₀ < 2/a'
  verify:
    expect:
      v: nsimplify(x0) - (1/Symbol('t') - a).subs(Symbol('t'), nsimplify(x0))/diff(1/Symbol('t') - a, Symbol('t')).subs(Symbol('t'), nsimplify(x0))
- template: nm-false-position
  skill: nm.roots
  pace: quick
  given:
    c:
      pick:
      - 2
      - 3
      - 5
      - 7
    a:
      pick:
      - 1
    b:
      pick:
      - 3
  prompt: Apply one step of false position to f(x) = x² − {{c}} on the bracket [{{a}}, {{b}}]. Where does the chord cross zero?
  parts:
  - ask: Answer
    label: v
    tex: x_r
    value: b - (b^2 - c)*(b - a)/((b^2 - c) - (a^2 - c))
    tol: 0.005
    explain: Like the secant step, but it keeps a bracket with a sign change, so it cannot diverge; one end can stall, though
  verify:
    expect:
      v: solve(Eq((a**2 - c) + ((b**2 - c) - (a**2 - c))/(b - a)*(x - a), 0), x)[0]
- template: nm-fixed-point-iterations
  skill: nm.roots
  pace: quick
  given:
    L:
      pick:
      - 0.1
      - 0.3
      - 0.5
      - 0.9
    k:
      pick:
      - 3
      - 6
  prompt: Fixed-point iteration converges linearly with |g′(root)| = {{L}}. About how many iterations reduce the error by a factor of 10^{{k}}?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: k*log(10)/(-log(L))
    tol: 0.005
    explain: 'Each step multiplies the error by about |g′|: L = 0.9 needs over 130 steps for six digits, which is why Newton is preferred'
  verify:
    expect:
      v: log(Rational(1, 10**k))/log(nsimplify(L))
- template: nm-jacobi-spectral
  skill: nm.linear-iter
  pace: quick
  given:
    a:
      pick:
      - 4
      - 5
      - 10
    b:
      pick:
      - 1
      - 2
      - -3
    c:
      pick:
      - 1
      - 2
      - 3
    d:
      pick:
      - 3
      - 6
      - 8
  prompt: For A = [[{{a}}, {{b}}], [{{c}}, {{d}}]], what is the spectral radius of the Jacobi iteration matrix?
  parts:
  - ask: Answer
    label: v
    tex: \rho(T_J)
    value: sqrt(abs(b*c/(a*d)))
    tol: 0.005
    explain: Jacobi converges for every start exactly when ρ < 1; the error shrinks by about ρ each sweep
  verify:
    expect:
      v: Max(*[Abs(v) for v in (-Matrix([[a, 0], [0, d]]).inv()*Matrix([[0, b], [c, 0]])).eigenvals()])

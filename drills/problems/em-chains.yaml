# Second question types; keys recomputed by sympy along another route.

- template: em-chain-tank-cascade
  skill: laplace.systems
  pace: workout
  given:
    V:
      pick:
      - 50
      - 100
      - 200
    qf:
      pick:
      - 10
      - 20
    c0:
      pick:
      - 1
      - 2
      - 5
    T:
      pick:
      - 2
      - 5
      - 10
  prompt: Two well-mixed tanks of {{V}} L each are in series with flow {{qf}} L/min. Both start with clean water; at t = 0 the feed to tank 1 switches to {{c0}} g/L.
  parts:
  - ask: Time constant of each tank (min)
    label: tau
    tex: \tau
    value: V/qf
    tol: 0.005
    explain: 'τ = V/q: each tank is a first-order lag'
  - ask: Concentration in tank 1 at t = {{T}} min (g/L)
    label: ca
    tex: c_1
    value: c0*(1 - exp(-T*qf/V))
    tol: 0.005
    explain: c₁ = c₀(1 − e^(−t/τ))
  - ask: Concentration in tank 2 at t = {{T}} min (g/L)
    label: cb
    tex: c_2
    value: c0*(1 - exp(-T*qf/V)*(1 + T*qf/V))
    tol: 0.005
    explain: 'C₂ = C_in/(τs + 1)²: a double pole, so c₂ = c₀(1 − e^(−t/τ)(1 + t/τ)); checked as the convolution of tank 1''s output with tank 2''s impulse response'
  - ask: The (double) pole of C₂(s)/C_in(s)
    label: pole
    tex: s
    value: -qf/V
    tol: 0.005
    explain: Each tank contributes 1/(τs + 1), a pole at −1/τ
  verify:
    expect:
      tau: V/qf
      ca: integrate(qf/V*exp(-(T - Symbol('u'))*qf/V)*c0, (Symbol('u'), 0, T))
      cb: integrate(qf/V*exp(-(T - Symbol('u'))*qf/V)*c0*(1 - exp(-Symbol('u')*qf/V)), (Symbol('u'), 0, T))
      pole: solve(V/qf*Symbol('s') + 1, Symbol('s'))[0]
- template: em-chain-forced-oscillator
  skill: ode2.spring-forced
  pace: workout
  cases:
  - m: 1
    c: 1
    k: 4
    F0: 2
    om: 1.5
  - m: 2
    c: 1
    k: 8
    F0: 4
    om: 2
  - m: 1
    c: 2
    k: 10
    F0: 5
    om: 3
  - m: 0.5
    c: 0.4
    k: 2
    F0: 1
    om: 1.8
  prompt: A mass m = {{m}} kg on a spring k = {{k}} N/m with damping c = {{c}} kg/s is driven by F = {{F0}} cos({{om}} t) N.
  parts:
  - ask: Undamped natural frequency (rad/s)
    label: w0
    tex: \omega_0
    value: sqrt(k/m)
    tol: 0.005
    explain: ω₀ = √(k/m)
  - ask: Steady-state amplitude (m)
    label: amp
    tex: A
    value: F0/sqrt((k - m*om^2)^2 + (c*om)^2)
    tol: 0.005
    explain: 'Try y = Re(Y e^(iωt)): Y = F₀/(k − mω² + icω); the amplitude is |Y|'
  - ask: Phase lag δ of the response behind the force (rad, 0 to π)
    label: ph
    tex: \delta
    value: atan2(c*om, k - m*om^2)
    tol: 0.005
    explain: tan δ = cω/(k − mω²); past ω₀ the lag passes π/2
  - ask: Driving frequency that gives the largest amplitude (rad/s)
    label: wr
    tex: \omega_r
    value: sqrt(k/m - c^2/(2*m^2))
    tol: 0.005
    explain: 'Minimise (k − mω²)² + (cω)²: ω² = k/m − c²/(2m²), below ω₀'
  verify:
    expect:
      w0: sqrt(nsimplify(k)/nsimplify(m))
      amp: Abs(F0/(nsimplify(k) - nsimplify(m)*nsimplify(om)**2 + I*nsimplify(c)*nsimplify(om)))
      ph: arg(nsimplify(k) - nsimplify(m)*nsimplify(om)**2 + I*nsimplify(c)*nsimplify(om))
      wr: Max(*solve(diff((nsimplify(k) - nsimplify(m)*Symbol('w')**2)**2 + (nsimplify(c)*Symbol('w'))**2, Symbol('w')), Symbol('w')))
- template: em-chain-heat-nonzero
  skill: pde.nonhomogeneous
  pace: workout
  given:
    L:
      pick:
      - 1
      - 2
    kap:
      pick:
      - 0.1
      - 0.5
    A:
      pick:
      - 0
      - 20
      - 50
    B:
      pick:
      - 80
      - 100
    U0:
      pick:
      - 10
      - 30
    T:
      pick:
      - 1
      - 2
  prompt: A rod 0 < x < {{L}} with κ = {{kap}} has its ends held at u(0, t) = {{A}} and u({{L}}, t) = {{B}}; initially u = {{U0}} throughout.
  parts:
  - ask: Steady-state temperature at x = L/2
    label: us
    tex: u_s
    value: (A + B)/2
    tol: 0.005
    explain: u_s = A + (B − A)x/L
  - ask: First sine coefficient b₁ of v = u − u_s at t = 0
    label: b1
    tex: b_1
    value: 2/pi*(2*U0 - A - B)
    tol: 0.005
    explain: b₁ = (2/L)∫(U₀ − u_s) sin(πx/L) dx
  - ask: Decay rate of that mode (1/time)
    label: lam
    tex: \kappa\lambda_1
    value: kap*pi^2/L^2
    tol: 0.005
    explain: Mode n decays as e^(−κ(nπ/L)²t)
  - ask: u(L/2, {{T}}) keeping only the first term
    label: uT
    tex: u
    value: (A + B)/2 + 2/pi*(2*U0 - A - B)*exp(-kap*pi^2*T/L^2)
    tol: 0.005
    explain: u = u_s + b₁ e^(−κπ²t/L²) sin(πx/L) + …; sin(π/2) = 1
  verify:
    expect:
      us: A + (B - A)*Rational(1, 2)
      b1: 2/L*integrate((U0 - A - (B - A)*x/L)*sin(pi*x/L), (x, 0, L))
      lam: nsimplify(kap)*pi**2/L**2
      uT: (A + B)/2 + 2/L*integrate((U0 - A - (B - A)*x/L)*sin(pi*x/L), (x, 0, L))*exp(-nsimplify(kap)*pi**2*T/L**2)
- template: em-chain-laplace-pulse
  skill: laplace.step-ivp
  pace: workout
  given:
    H:
      pick:
      - 1
      - 2
      - 4
    a:
      pick:
      - 1
      - 2
    T:
      pick:
      - 3
      - 4
    s0:
      pick:
      - 1
      - 2
  prompt: y″ + 3y′ + 2y = h(t) with y(0) = y′(0) = 0, where h = {{H}} for 0 < t < {{a}} and h = 0 after.
  parts:
  - ask: Y(s) at s = {{s0}}
    label: Ys
    tex: Y
    value: H*(1 - exp(-a*s0))/(s0*(s0 + 1)*(s0 + 2))
    tol: 0.005
    explain: L{h} = H(1 − e^(−as))/s, divided by s² + 3s + 2
  - ask: y at the end of the pulse, t = {{a}}
    label: ya
    tex: y(a)
    value: H*(1/2 - exp(-a) + exp(-2*a)/2)
    tol: 0.005
    explain: Step response H(½ − e^(−t) + ½e^(−2t)); checked as the convolution of h with g = e^(−t) − e^(−2t)
  - ask: y at t = {{T}}
    label: yT
    tex: y(T)
    value: H*(1/2 - exp(-T) + exp(-2*T)/2) - H*(1/2 - exp(-(T - a)) + exp(-2*(T - a))/2)
    tol: 0.005
    explain: 'After the pulse, y = y_step(t) − y_step(t − a): the switch-off is a second, negative step'
  verify:
    expect:
      Ys: integrate(H*(exp(-Symbol('u')) - exp(-2*Symbol('u')))*integrate(exp(-s0*Symbol('t')), (Symbol('t'), Symbol('u'), Symbol('u') + a)), (Symbol('u'), 0, oo))
      ya: integrate(H*(exp(-(a - Symbol('u'))) - exp(-2*(a - Symbol('u')))), (Symbol('u'), 0, a))
      yT: integrate(H*(exp(-(T - Symbol('u'))) - exp(-2*(T - Symbol('u')))), (Symbol('u'), 0, a))

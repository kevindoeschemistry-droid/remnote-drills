      e1: Max(*Matrix([[a11, a12], [a21, a22]]).eigenvals().keys())
      e2: Min(*Matrix([[a11, a12], [a21, a22]]).eigenvals().keys())
      x1: (Matrix([[a11, a12], [a21, a22]])*nsimplify(T)).exp().multiply(Matrix([p, q]))[0]
- template: em-chain-power-series
  skill: series.terms
  pace: workout
  given:
    a0:
      pick:
      - 1
      - 2
      - 3
      - 6
    x0:
      pick:
      - 0.5
      - 1
  prompt: Solve y″ − xy′ − y = 0 by a power series y = Σ aₙxⁿ about x = 0 with y(0) = {{a0}}, y′(0) = 0.
  parts:
  - ask: a₂
    label: c2
    tex: a_2
    value: a0/2
    tol: 0.005
    explain: (n + 2)(n + 1)a_(n+2) − (n + 1)aₙ = 0, so a_(n+2) = aₙ/(n + 2)
  - ask: a₄
    label: c4
    tex: a_4
    value: a0/8
    tol: 0.005
    explain: a₄ = a₂/4
  - ask: a₆
    label: c6
    tex: a_6
    value: a0/48
    tol: 0.005
    explain: a₆ = a₄/6
  - ask: The series sums to a closed form. What is y({{x0}})?
    label: yx
    tex: y
    value: a0*exp(x0^2/2)
    tol: 0.005
    explain: a_(2k) = a₀/(2^k k!), the series of a₀e^(x²/2)
  verify:
    expect:
      c2: a0*series(exp(x**2/2), x, 0, 8).removeO().coeff(x, 2)
      c4: a0*series(exp(x**2/2), x, 0, 8).removeO().coeff(x, 4)
      c6: a0*series(exp(x**2/2), x, 0, 8).removeO().coeff(x, 6)
      yx: a0*exp(nsimplify(x0)**2/2)

  pace: quick
  cases:
  - kf: 12
    ka: 500
    kd: 150
  - kf: 20
    ka: 300
    kd: 150
  - kf: 10
    ka: 600
    kd: 150
  - kf: 30
    ka: 200
    kd: 150
  - kf: 15
    ka: 450
    kd: 150
  prompt: A person breathes {{kf}} times per minute with a tidal volume of {{ka}} mL and a dead space of {{kd}} mL. Find the alveolar ventilation in mL/min.
  parts:
  - ask: Answer
    label: v
    tex: V_A
    value: kf*(ka - kd)
    tol: 0.005
    explain: Only the air beyond the dead space reaches the alveoli, so deep slow breathing ventilates better than shallow fast breathing
  verify:
    expect:
      v: solve(Eq(Symbol('m') + kf*kd, kf*ka), Symbol('m'))[0]

- template: ws-panel-average
  skill: wushu.judging
  pace: quick
  cases:
  - a: 8.6
    b: 8.4
    c: 8.5
    d: 8.9
    e2: 8.3
  - a: 9.1
    b: 8.8
    c: 9.0
    d: 8.7
    e2: 9.3
  - a: 7.9
    b: 8.2
    c: 8.0
    d: 8.1
    e2: 7.7
  - a: 9.4
    b: 9.2
    c: 9.5
    d: 9.1
    e2: 9.3
  prompt: Five judges give {{a}}, {{b}}, {{c}}, {{d}}, {{e2}}. The panel drops the highest and the lowest and averages the rest. What is the score?
  parts:
  - ask: Answer
    label: v
    tex: score
    value: (a + b + c + d + e2 - max(a, b, c, d, e2) - min(a, b, c, d, e2))/3
    tol: 0.005
    explain: Trimming the extremes and averaging the rest is the standard way a panel's marks become one score
  verify:
    expect:
      v: (nsimplify(a) + nsimplify(b) + nsimplify(c) + nsimplify(d) + nsimplify(e2) - Max(nsimplify(a), nsimplify(b), nsimplify(c), nsimplify(d), nsimplify(e2)) - Min(nsimplify(a), nsimplify(b), nsimplify(c), nsimplify(d), nsimplify(e2)))/3
- template: ws-time-deduction
  skill: wushu.judging
  pace: quick
  given:
    inc:
      pick:
      - 2
    act:
      pick:
      - 71
      - 74
      - 68
    mn:
      pick:
      - 80
  prompt: Using the rule printed here — a routine shorter than the minimum loses 0.1 for each full {{inc}} seconds short — a routine runs {{act}} s against a minimum of {{mn}} s. What is the time deduction?
  parts:
  - ask: Answer
    label: v
    tex: points
    value: floor((mn - act)/inc)*0.1
    tol: 0.005
    explain: The card prints the increment because the rulebook's own tables were not read here; the skill is applying a stated increment rule, not recalling the table
  verify:
    expect:
      v: floor(Rational(mn - act, inc))*Rational(1,10)

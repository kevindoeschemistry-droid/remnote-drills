# Financial accounting on the CPA Exam's FAR blueprint (Financial Accounting and Reporting), US GAAP.
# Area I financial reporting, Area II select balance sheet accounts, Area III select transactions.
# One question each. Every calculation is recomputed by sympy (inventory cost flow by a separate
# unit-by-unit routine, fa_inventory in tests/verify/data.py; bond and lease values as explicit sums
# of discounted payments); classifications and rules are authored.

# ── Area I · A  for-profit statements ──────────────────────────────────────
- template: fa-statement-home
  skill: acct.statements
  pace: recall
  cases:
    - { s: 'inventory on hand at year end', ans: 0 }
    - { s: 'cost of goods sold', ans: 1 }
    - { s: 'an unrealized gain on available-for-sale debt securities', ans: 2 }
    - { s: 'a foreign currency translation adjustment', ans: 2 }
    - { s: 'dividends declared', ans: 3 }
    - { s: 'the purchase of treasury stock', ans: 3 }
    - { s: 'cash paid to buy equipment', ans: 4 }
  prompt: 'Where is {{s}} reported (its main home)?'
  parts:
    - ask: 'Statement'
      label: a
      choice: ["Balance sheet", "Income statement", "Other comprehensive income", "Statement of changes in equity", "Statement of cash flows (investing)"]
      correct: ans
      explain: 'Net income items go on the income statement; a short list of unrealized items (AFS debt securities, translation adjustments, some pension items, cash flow hedges) skips net income and goes to OCI, then accumulates in equity. Transactions with owners (dividends, treasury stock) appear in the statement of changes in equity'
  verify: { authored: true }

- template: fa-cf-class
  skill: acct.statements
  pace: recall
  cases:
    - { s: 'interest paid on a bank loan', ans: 0 }
    - { s: 'dividends received from an investment', ans: 0 }
    - { s: 'income taxes paid', ans: 0 }
    - { s: 'cash paid to buy available-for-sale securities', ans: 1 }
    - { s: 'proceeds from selling equipment', ans: 1 }
    - { s: 'dividends paid to shareholders', ans: 2 }
    - { s: 'repayment of a loan''s principal', ans: 2 }
    - { s: 'converting bonds payable into common stock', ans: 3 }
    - { s: 'buying land by issuing a note to the seller', ans: 3 }
  prompt: 'Under US GAAP, where does {{s}} go in the statement of cash flows?'
  parts:
    - ask: 'Section'
      label: a
      choice: ["Operating", "Investing", "Financing", "Not in the statement: a noncash activity, disclosed separately"]
      correct: ans
      explain: 'Under US GAAP interest paid, interest and dividends received, and taxes are operating; long-term assets and investments are investing; owners and lenders'' principal are financing, including dividends paid. A swap with no cash (debt for stock, a note for land) is disclosed, not shown as a cash flow. IFRS allows choices for interest and dividends'
  verify: { authored: true }

- template: fa-cfo-indirect
  skill: acct.statements
  pace: quick
  given: { ni: { pick: [120000, 250000] }, dep: { pick: [30000, 45000] }, gain: { pick: [5000, 12000] }, dar: { pick: [-8000, 10000] }, dinv: { pick: [6000, -4000] }, dap: { pick: [7000, -3000] } }
  prompt: 'Net income was {{ni}}. Depreciation was {{dep}}, and there was a {{gain}} gain on selling equipment. Accounts receivable {{dar > 0 ? "rose" : "fell"}} by {{abs(dar)}}, inventory {{dinv > 0 ? "rose" : "fell"}} by {{abs(dinv)}}, and accounts payable {{dap > 0 ? "rose" : "fell"}} by {{abs(dap)}}. What is cash from operating activities (indirect method)?'
  parts:
    - { ask: 'Cash from operations', label: a, value: ni + dep - gain - dar - dinv + dap, tol: 0.0001, explain: 'Start from net income, add back noncash expenses (depreciation), remove gains (the cash goes to investing), then adjust for working capital: an increase in a current asset uses cash, an increase in a current liability provides it' }
  verify: { expect: { a: "ni + dep - gain + (-dar) + (-dinv) + dap" } }

- template: fa-cash-collected
  skill: acct.statements
  pace: quick
  given: { sales: { pick: [500000, 800000] }, dar: { pick: [-20000, 15000, 30000] } }
  prompt: 'Credit sales were {{sales}} and accounts receivable {{dar > 0 ? "rose" : "fell"}} by {{abs(dar)}} during the year (no write-offs). How much cash was collected from customers?'
  parts:
    - { ask: 'Cash collected', label: a, value: sales - dar, tol: 0.0001, explain: 'Beginning AR + sales − collections = ending AR, so collections = sales − the increase in AR. A fall in AR means customers paid down old balances too' }
  verify: { expect: { a: "sales - dar" } }

- template: fa-goodwill
  skill: acct.statements
  pace: quick
  given: { cons: { pick: [800000, 900000] }, nci: { pick: [200000, 250000] }, fvna: { pick: [700000, 850000] } }
  prompt: 'A parent pays {{cons}} for a controlling interest. The noncontrolling interest''s fair value is {{nci}}, and the fair value of the subsidiary''s identifiable net assets is {{fvna}}. How much goodwill is recognized?'
  parts:
    - { ask: 'Goodwill', label: a, value: cons + nci - fvna, tol: 0.0001, explain: 'Goodwill = consideration transferred + fair value of the noncontrolling interest − fair value of identifiable net assets. If that comes out negative, it is a bargain purchase gain instead' }
  verify: { expect: { a: "(cons + nci) - fvna" } }

- template: fa-nci-income
  skill: acct.statements
  pace: quick
  given: { pct: { pick: [0.6, 0.75, 0.8, 0.9] }, nis: { pick: [200000, 360000] } }
  prompt: 'A parent owns {{pct*100}}% of a subsidiary that earned {{nis}}. How much of the subsidiary''s net income is attributed to the noncontrolling interest?'
  parts:
    - { ask: 'NCI share', label: a, value: (1 - pct)*nis, tol: 0.0001, explain: 'Consolidated net income includes 100% of the subsidiary; it is then split between the parent and the noncontrolling interest by ownership' }
  verify: { expect: { a: "nis - pct*nis" } }

- template: fa-intercompany-profit
  skill: acct.statements
  pace: quick
  given: { left: { pick: [40000, 60000, 90000] }, gm: { pick: [0.2, 0.25, 0.4] } }
  prompt: 'A subsidiary sold goods to its parent at a {{gm*100}}% gross margin on the selling price. At year end the parent still holds {{left}} of them, at the transfer price. How much unrealized profit is eliminated in consolidation?'
  parts:
    - { ask: 'Unrealized profit', label: a, value: left*gm, tol: 0.0001, explain: 'The group has not sold those goods to anyone outside it, so the seller''s profit in the remaining inventory is removed: remaining inventory × gross margin' }
  verify: { expect: { a: "gm*left" } }

# ── Area I · B, C  not-for-profit and government ───────────────────────────
- template: fa-nfp-net-assets
  skill: acct.nfp-gov
  pace: recall
  cases:
    - { s: 'a cash gift with no donor conditions or restrictions', ans: 0 }
    - { s: 'money the board decides to set aside for a future building', ans: 0 }
    - { s: 'a gift the donor says must be spent on scholarships', ans: 1 }
    - { s: 'an endowment gift whose principal the donor says must be kept forever', ans: 1 }
    - { s: 'scholarship money from a restricted gift, once the scholarships are paid', ans: 2 }
  prompt: 'In a nongovernmental not-for-profit''s statements, how is {{s}} reported?'
  parts:
    - ask: 'Class'
      label: a
      choice: ["Net assets without donor restrictions", "Net assets with donor restrictions", "Released: reclassified from with to without donor restrictions"]
      correct: ans
      explain: 'Only a donor can restrict: the board''s own designations stay without donor restrictions. When the purpose or time restriction is met, the net assets are released, shown as a reclassification on the statement of activities'
  verify: { authored: true }

- template: fa-gov-basis
  skill: acct.nfp-gov
  pace: recall
  cases:
    - { s: 'governmental funds (general, special revenue, capital projects, debt service, permanent)', ans: 0 }
    - { s: 'proprietary funds (enterprise and internal service)', ans: 1 }
    - { s: 'fiduciary funds (pension trust, custodial)', ans: 1 }
    - { s: 'the government-wide statements', ans: 1 }
  prompt: 'Which measurement focus and basis of accounting do {{s}} use?'
  parts:
    - ask: 'Basis'
      label: a
      choice: ["Current financial resources, modified accrual", "Economic resources, full accrual"]
      correct: ans
      explain: 'Governmental funds track spendable resources: revenue when measurable and available, capital assets and long-term debt left out. Everything else, including the government-wide view, uses business-style accrual accounting. Reconciliations bridge the two'
  verify: { authored: true }

- template: fa-fund-purpose
  skill: acct.nfp-gov
  pace: recall
  cases:
    - { s: 'everything not required to be accounted for in another fund', o1: 'General fund', o2: 'Special revenue fund', o3: 'Enterprise fund', o4: 'Custodial fund', ans: 0 }
    - { s: 'a gas tax legally restricted to road maintenance', o1: 'General fund', o2: 'Special revenue fund', o3: 'Debt service fund', o4: 'Permanent fund', ans: 1 }
    - { s: 'building a new city hall with bond proceeds', o1: 'Enterprise fund', o2: 'Debt service fund', o3: 'Capital projects fund', o4: 'General fund', ans: 2 }
    - { s: 'a water utility that charges residents fees for service', o1: 'Internal service fund', o2: 'Special revenue fund', o3: 'General fund', o4: 'Enterprise fund', ans: 3 }
    - { s: 'a motor pool that charges other city departments', o1: 'Internal service fund', o2: 'Enterprise fund', o3: 'Capital projects fund', o4: 'Custodial fund', ans: 0 }
    - { s: 'resources set aside to pay principal and interest on general long-term debt', o1: 'Capital projects fund', o2: 'Debt service fund', o3: 'Permanent fund', o4: 'Pension trust fund', ans: 1 }
    - { s: 'a gift whose earnings, but not principal, support the city cemetery', o1: 'Private-purpose trust fund', o2: 'Special revenue fund', o3: 'Permanent fund', o4: 'Custodial fund', ans: 2 }
  prompt: 'Which fund accounts for {{s}}?'
  parts:
    - ask: 'Fund'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'Governmental funds: general, special revenue, capital projects, debt service, permanent. Proprietary funds charge fees: enterprise (public), internal service (other departments). Fiduciary funds hold resources for others: pension and other trust funds, custodial funds'
  verify: { authored: true }

# ── Area I · D, E, F  public companies, special frameworks, ratios ─────────
- template: fa-public-reporting
  skill: acct.statements
  pace: recall
  cases:
    - { s: 'the annual report a public company files with the SEC', o1: 'Form 10-K', o2: 'Form 10-Q', o3: 'Form 8-K', o4: 'Form S-1', ans: 0 }
    - { s: 'the quarterly report, with reviewed but unaudited statements', o1: 'Form 8-K', o2: 'Form 10-Q', o3: 'Form 10-K', o4: 'Proxy statement', ans: 1 }
    - { s: 'the report of a major event, such as a change of auditor, within days', o1: 'Form 10-Q', o2: 'Form 10-K', o3: 'Form 8-K', o4: 'Form 20-F', ans: 2 }
    - { s: 'the threshold that makes an operating segment reportable (revenue, profit or assets)', o1: '5% of the total', o2: '25% of the total', o3: '50% of the total', o4: '10% of the total', ans: 3 }
    - { s: 'the minimum share of consolidated external revenue that reportable segments must cover together', o1: '75%', o2: '50%', o3: '90%', o4: '10%', ans: 0 }
  prompt: 'What is {{s}}?'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'Public companies file a 10-K each year (audited), a 10-Q for each of the other quarters (reviewed), and an 8-K for significant events. A segment is reportable at 10% of combined revenue, profit or loss, or assets, and segments are added until they cover 75% of external revenue'
  verify: { authored: true }

- template: fa-special-framework
  skill: acct.statements
  pace: quick
  cases:
    - { s: 'Under the pure cash basis, when is revenue recorded?', o1: 'When cash is received', o2: 'When it is earned', o3: 'When invoiced', o4: 'At year end', ans: 0 }
    - { s: 'Which special purpose framework follows the rules used to file the entity''s income tax return?', o1: 'Cash basis', o2: 'Tax basis', o3: 'Regulatory basis', o4: 'Contractual basis', ans: 1 }
    - { s: 'A modified cash basis most commonly adds which accrual item to the cash basis?', o1: 'Accrued revenue', o2: 'Deferred taxes', o3: 'Capitalized fixed assets with depreciation', o4: 'Pension obligations', ans: 2 }
    - { s: 'What must statements on a special purpose framework do?', o1: 'Follow GAAP in full', o2: 'Show a GAAP reconciliation', o3: 'Be audited', o4: 'Describe the basis and how it differs from GAAP', ans: 3 }
  prompt: '{{s}}'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'Special purpose frameworks (cash, modified cash, tax, regulatory, contractual) are other comprehensive bases of accounting. Titles should avoid GAAP terms (say "statement of revenues collected", not "income statement"), and the notes describe the basis and its main differences from GAAP'
  verify: { authored: true }

- template: fa-current-ratio
  skill: acct.statements
  pace: quick
  given: { cash: { pick: [20000, 50000] }, ar: { pick: [60000, 90000] }, inv: { pick: [80000, 120000] }, cl: { pick: [100000, 125000] } }
  prompt: 'Cash is {{cash}}, accounts receivable {{ar}}, inventory {{inv}}, and current liabilities {{cl}}. What is the current ratio?'
  parts:
    - { ask: 'Current ratio', label: a, value: (cash + ar + inv)/cl, tol: 0.001, explain: 'Current assets ÷ current liabilities. The quick (acid-test) ratio leaves out inventory and prepaids: (cash + marketable securities + receivables) ÷ current liabilities' }
  verify: { expect: { a: "(cash + ar + inv)/cl" } }

- template: fa-quick-ratio
  skill: acct.statements
  pace: quick
  given: { cash: { pick: [20000, 50000] }, ar: { pick: [60000, 90000] }, inv: { pick: [80000, 120000] }, cl: { pick: [100000, 125000] } }
  prompt: 'Cash is {{cash}}, accounts receivable {{ar}}, inventory {{inv}}, and current liabilities {{cl}}. What is the quick (acid-test) ratio?'
  parts:
    - { ask: 'Quick ratio', label: a, value: (cash + ar)/cl, tol: 0.001, explain: 'Quick assets (cash, marketable securities, receivables) ÷ current liabilities. Inventory is left out because it must be sold before it becomes cash' }
  verify: { expect: { a: "(cash + ar)/cl" } }

- template: fa-ar-turnover
  skill: acct.statements
  pace: quick
  given: { sales: { pick: [730000, 1095000] }, ar0: { pick: [80000, 100000] }, ar1: { pick: [100000, 120000] } }
  prompt: 'Net credit sales were {{sales}}. Accounts receivable was {{ar0}} at the start of the year and {{ar1}} at the end. How many days of sales are in receivables on average (365-day year)?'
  parts:
    - { ask: 'Days', label: a, value: 365/(sales/((ar0 + ar1)/2)), tol: 0.001, explain: 'Receivables turnover = credit sales ÷ average receivables; days sales outstanding = 365 ÷ turnover, the average time to collect' }
  verify: { expect: { a: "(ar0 + ar1)/2/(sales/365)" } }

- template: fa-inventory-days
  skill: acct.statements
  pace: quick
  given: { cogs: { pick: [365000, 547500] }, inv0: { pick: [40000, 60000] }, inv1: { pick: [50000, 70000] } }
  prompt: 'Cost of goods sold was {{cogs}}; inventory was {{inv0}} at the start of the year and {{inv1}} at the end. On average, how many days is inventory held (365-day year)?'
  parts:
    - { ask: 'Days', label: a, value: 365/(cogs/((inv0 + inv1)/2)), tol: 0.001, explain: 'Inventory turnover = COGS ÷ average inventory (cost, not sales, because inventory is carried at cost); days in inventory = 365 ÷ turnover' }
  verify: { expect: { a: "(inv0 + inv1)/2/(cogs/365)" } }

- template: fa-eps
  skill: acct.statements
  pace: quick
  given: { ni: { pick: [500000, 900000] }, pref: { pick: [50000, 100000] }, sh: { pick: [100000, 200000, 250000] } }
  prompt: 'Net income was {{ni}}. Preferred dividends declared were {{pref}}, and weighted-average common shares outstanding were {{sh}}. What is basic EPS?'
  parts:
    - { ask: 'Basic EPS', label: a, value: (ni - pref)/sh, tol: 0.001, explain: 'Basic EPS = income available to common shareholders ÷ weighted-average common shares. Subtract preferred dividends declared (or, if cumulative, the year''s dividends whether declared or not)' }
  verify: { expect: { a: "(ni - pref)/sh" } }

- template: fa-weighted-shares
  skill: acct.statements
  pace: quick
  given: { s0: { pick: [100000, 120000] }, k: { pick: [24000, 36000] }, mo: { pick: [4, 7, 10] } }
  prompt: '{{s0}} common shares were outstanding all year, and {{k}} more were issued for cash on {{mo == 4 ? "April" : (mo == 7 ? "July" : "October")}} 1. What is the weighted-average number of shares for EPS?'
  parts:
    - { ask: 'Weighted shares', label: a, value: s0 + k*(13 - mo)/12, tol: 0.0001, explain: 'Weight new shares by the fraction of the year they were outstanding (from April 1 that is 9 of 12 months). A stock dividend or split is different: it is applied retroactively, as if it had always been in effect' }
  verify: { expect: { a: "s0 + k*Rational(12 - (mo - 1), 12)" } }

# ── Area II · A, B  cash and receivables ───────────────────────────────────
- template: fa-cash-equivalent
  skill: acct.current-assets
  pace: recall
  cases:
    - { s: 'a 3-month Treasury bill bought 2 months before year end', ans: 0 }
    - { s: 'a money market fund', ans: 0 }
    - { s: 'petty cash', ans: 0 }
    - { s: 'a 6-month certificate of deposit', ans: 1 }
    - { s: 'a customer''s postdated check', ans: 1 }
    - { s: 'cash legally restricted for a plant expansion in three years', ans: 1 }
  prompt: 'Is {{s}} reported in cash and cash equivalents?'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["Yes", "No"]
      correct: ans
      explain: 'Cash equivalents are short-term, highly liquid investments with an original maturity of three months or less when bought. Postdated checks are receivables; restricted cash is shown separately (noncurrent if the restriction runs past a year)'
  verify: { authored: true }

- template: fa-bank-rec
  skill: acct.current-assets
  pace: quick
  given: { bank: { pick: [42000, 58000] }, dit: { pick: [3500, 6200] }, oc: { pick: [4800, 7100] } }
  prompt: 'The bank statement shows {{bank}}. Deposits in transit total {{dit}} and outstanding checks {{oc}}. What is the correct (adjusted) cash balance?'
  parts:
    - { ask: 'Adjusted cash', label: a, value: bank + dit - oc, tol: 0.0001, explain: 'Bank side: add deposits the bank has not yet recorded, subtract checks that have not cleared. The book side is adjusted separately for items the bank knew first: collections and interest added, service charges and NSF checks subtracted. Both sides must reach the same number' }
  verify: { expect: { a: "bank - (oc - dit)" } }

- template: fa-allowance
  skill: acct.current-assets
  pace: quick
  given: { ar: { pick: [50000, 80000] }, rate: { pick: [0.03, 0.05] }, old: { pick: [500, 1200] }, side: { pick: [0, 1] } }
  prompt: 'Year-end receivables are {{ar}}, and {{rate*100}}% is expected to be uncollectible. Before adjusting, the allowance has a {{old}} {{side == 0 ? "credit" : "debit"}} balance. What is bad debt expense for the year?'
  parts:
    - { ask: 'Bad debt expense', label: a, value: "rate*ar - (side == 0 ? old : -old)", tol: 0.0001, explain: 'The balance-sheet (percentage of receivables) approach sets the ending allowance; the expense is whatever brings the account there. A debit balance (write-offs exceeded the estimate) means the expense must cover that too' }
  verify: { expect: { a: "rate*ar - old + 2*old*side" } }

- template: fa-aging
  skill: acct.current-assets
  pace: quick
  cases:
    - { c1: 60000, c2: 20000, c3: 8000, r1: 0.01, r2: 0.05, r3: 0.25 }
    - { c1: 90000, c2: 30000, c3: 10000, r1: 0.02, r2: 0.1, r3: 0.4 }
    - { c1: 45000, c2: 15000, c3: 5000, r1: 0.01, r2: 0.04, r3: 0.5 }
  prompt: 'Receivables are aged: {{c1}} current ({{r1*100}}% expected to be uncollectible), {{c2}} 31–90 days ({{r2*100}}%), and {{c3}} over 90 days ({{r3*100}}%). What should the allowance for doubtful accounts be?'
  parts:
    - { ask: 'Allowance', label: a, value: c1*r1 + c2*r2 + c3*r3, tol: 0.0001, explain: 'An aging schedule applies a higher loss rate to older balances and adds them up. Under CECL the rates should reflect expected lifetime losses, including forecasts, not just history' }
  verify: { expect: { a: "r1*c1 + r2*c2 + r3*c3" } }

# ── Area II · C  inventory ─────────────────────────────────────────────────

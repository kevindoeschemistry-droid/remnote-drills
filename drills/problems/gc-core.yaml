- template: gc-ambipolar
  skill: mass.diffusivity
  pace: quick
  cases:
  - salt: NaCl
    ion1: Na⁺
    ion2: Cl⁻
    dp: 1.334
    dm: 2.032
  - salt: HCl
    ion1: H⁺
    ion2: Cl⁻
    dp: 9.31
    dm: 2.032
  - salt: KCl
    ion1: K⁺
    ion2: Cl⁻
    dp: 1.957
    dm: 2.032
  - salt: NaOH
    ion1: Na⁺
    ion2: OH⁻
    dp: 1.334
    dm: 5.27
  prompt: 'Ion diffusivities (10⁻⁹ m²/s): {{ion1}} {{dp}}, {{ion2}} {{dm}}. What is the diffusion coefficient of dilute {{salt}} in water, in 10⁻⁹ m²/s?'
  parts:
  - ask: Answer
    label: v
    tex: D
    value: 2*dp*dm/(dp + dm)
    tol: 0.005
    explain: The fast ion runs ahead and sets up a field that drags the slow one and holds itself back; the pair moves at a harmonic mean, close to the slower ion
  verify:
    expect:
      v: nsimplify(dp)*(1 + solve(Eq(nsimplify(dp)*(1 + x), nsimplify(dm)*(1 - x)), x)[0])

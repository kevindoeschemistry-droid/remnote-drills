- template: gc-fopdt-ultimate-gain
  skill: design.control
  pace: quick
  cases: *id001
  prompt: 'A process $Ke^{-{{th}}s}/({{tau}}s + 1)$ (min) under P control: what is the ultimate loop gain $KK_{cu}$?'
  parts:
  - ask: Answer
    label: v
    tex: KK_{cu}
    value: sqrt(1 + wu^2*tau^2)
    tol: 0.005
    explain: At the crossover frequency the loop gain must be 1/AR; dead time lowers the crossover and so the allowable gain
  verify:

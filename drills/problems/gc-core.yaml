- template: gc-amplitude-ratio
  skill: design.control
  pace: quick
  given:
    K:
      pick:
      - 1
      - 2.5
      - 4
    tau:
      pick:
      - 1
      - 5
      - 20
    w:
      pick:
      - 0.05
      - 0.2
      - 1
  prompt: A first-order process (K = {{K}}, τ = {{tau}} s) is driven by a sinusoid of {{w}} rad/s. What is the amplitude ratio?
  parts:
  - ask: Answer
    label: v
    tex: AR
    value: K/sqrt(1 + w^2*tau^2)
    tol: 0.005
    explain: Replace s by iω and take the modulus. Well above the corner frequency 1/τ the process filters the input out
  verify:
    expect:
      v: Abs(nsimplify(K)/(I*nsimplify(w)*nsimplify(tau) + 1))
- template: gc-phase-lag
  skill: design.control
  pace: quick
  given:
    tau:
      pick:
      - 1
      - 5
      - 20
    w:
      pick:
      - 0.05
      - 0.2
      - 1
  prompt: A first-order process (τ = {{tau}} s) is driven at {{w}} rad/s. What is the phase lag of the output, in degrees?
  parts:
  - ask: Answer
    label: v
    tex: \phi
    value: atan(w*tau)*180/pi
    tol: 0.005
    explain: A first-order lag never exceeds 90°; 45° at the corner frequency ω = 1/τ
  verify:

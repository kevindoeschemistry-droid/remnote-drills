    label: v
    tex: (L/G)_{min}
    value: (yin - yout)/100/(yin/100/m)
    tol: 0.005
    explain: 'At minimum flow the liquid leaving is in equilibrium with the gas entering: a pinch at the rich end and infinitely many stages. Practice uses 1.2–1.5 times the minimum'
  verify:
    expect:
      v: solve(Eq(x*(nsimplify(yin)/100/nsimplify(m)), (nsimplify(yin) - nsimplify(yout))/100), x)[0]

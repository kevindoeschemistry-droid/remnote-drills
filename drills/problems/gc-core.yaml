  require:
  - abs(y*1e-6*us/1e-6 - 5) > 0.5
  - abs(y*1e-6*us/1e-6 - 30) > 2
  prompt: Water ($\nu = 10^{-6}$ m²/s) flows with friction velocity {{us}} m/s. In which region of the wall layer is a point {{y}} μm from the wall?
  parts:
  - ask: Answer
    label: v
    choice:
    - Viscous sublayer (y⁺ < 5)
    - Buffer layer (5 to 30)
    - Log layer (y⁺ > 30)
    correct: 'y*us < 5 ? 0 : (y*us < 30 ? 1 : 2)'
    explain: Wall units y⁺ = yu*/ν decide the region; in the sublayer u⁺ = y⁺, in the log layer the log law, in between neither fits well
  verify:
    choices:
      v: 0 if Rational(y, 10**6)*nsimplify(us)*10**6 < 5 else (1 if Rational(y, 10**6)*nsimplify(us)*10**6 < 30 else 2)
- template: gc-drop-drag

  prompt: Air ($\rho$ = 1.2 kg/m³, $\nu = 1.5\times10^{-5}$ m²/s) flows at {{U}} m/s along a flat plate {{L}} m long. What is the friction drag on one side per metre of width, in mN? (Flow stays laminar.)

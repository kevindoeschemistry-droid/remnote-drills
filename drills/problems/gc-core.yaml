      v: solve(Eq(x/sqrt(nsimplify(tw)/1000), log(Rational(y, 1000)*sqrt(nsimplify(tw)/1000)*10**6)/Rational(41, 100) + 5), x)[0]
- template: gc-wall-region
  skill: fm.similarity
  pace: quick
  given:
    us:
      pick:
      - 0.02
      - 0.05
      - 0.1
    y:
      pick:
      - 20

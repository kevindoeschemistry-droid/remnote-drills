- template: gc-fopdt-crossover
  skill: design.control
  pace: quick
  cases: &id001
  - tau: 1
    th: 0.5
    wu: 3.6731944063042516
  - tau: 1
    th: 1
    wu: 2.028757838110434
  - tau: 1
    th: 2
    wu: 1.1444648640517021
  - tau: 5
    th: 0.5
    wu: 3.2639890544296
  - tau: 5
    th: 1
    wu: 1.688682689958469
  - tau: 5
    th: 2
    wu: 0.8952895808286973
  - tau: 10
    th: 0.5
    wu: 3.2039944765208306
  - tau: 10
    th: 1
    wu: 1.6319945272148
  - tau: 10
    th: 2
    wu: 0.8443413449792345
  prompt: A process $e^{-{{th}}s}/({{tau}}s + 1)$ (times in min) is under proportional control. At what frequency, in rad/min, is the phase lag 180°?
  parts:
  - ask: Answer

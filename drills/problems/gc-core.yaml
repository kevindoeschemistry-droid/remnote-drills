- template: gc-overall-effectiveness
  skill: cre.diffusion
  pace: quick
  given:
    phi:
      pick:
      - 0.5
      - 2
      - 5
      - 10
    Bi:
      pick:
      - 1
      - 10
      - 100
  prompt: A first-order reaction runs in spherical pellets with Thiele modulus φ = {{phi}} and mass Biot number $Bi = k_cR/D_e$ = {{Bi}}. What is the overall effectiveness factor Ω (rate over k C_bulk V)?
  parts:
  - ask: Answer
    label: v
    tex: \Omega
    value: (3*(phi*coth(phi) - 1)/phi^2)/(1 + (3*(phi*coth(phi) - 1)/phi^2)*phi^2/(3*Bi))
    tol: 0.005
    explain: 'Resistances in series: the film sets the surface concentration, the pellet works at η of that. Large φ and small Bi together make the film control'
  verify:
    expect:
      v: gc_overall_eff(phi, Bi)
- template: gc-surface-concentration
  skill: cre.diffusion
  pace: quick
  given:
    phi:
      pick:
      - 0.5
      - 2
      - 5
      - 10
    Bi:
      pick:
      - 1
      - 10
      - 100
  prompt: Spherical pellets have Thiele modulus φ = {{phi}} and mass Biot number {{Bi}} (first order). What is the surface concentration as a fraction of the bulk?
  parts:
  - ask: Answer
    label: v
    tex: C_s/C_b
    value: 1/(1 + (3*(phi*coth(phi) - 1)/phi^2)*phi^2/(3*Bi))
    tol: 0.005
    explain: 'C_s near 1: the film is negligible. Near 0: external mass transfer controls and the pellet interior hardly matters'
  verify:
    expect:
      v: gc_surface_ratio(phi, Bi)
- template: gc-hatta-enhancement
  skill: cre.diffusion
  pace: quick
  given:
    k:
      pick:
      - 10
      - 100
      - 1000
    Dm:
      pick:
      - 1
      - 2
    kl:
      pick:
      - 1
      - 2
      - 4
  prompt: A gas dissolves into a liquid where it reacts (pseudo-first order, k = {{k}} s⁻¹, D = {{Dm}} × 10⁻⁹ m²/s, $k_L$ = {{kl}} × 10⁻⁴ m/s). What is the enhancement factor E?
  parts:
  - ask: Answer
    label: v
    tex: E
    value: (sqrt(k*Dm*1e-9)/(kl*1e-4))/tanh(sqrt(k*Dm*1e-9)/(kl*1e-4))
    tol: 0.005
    explain: 'Ha < 0.3: slow reaction, bulk liquid matters, E ≈ 1. Ha > 3: reaction finishes inside the film and E ≈ Ha, so the rate no longer depends on k_L'
  verify:
    expect:
      v: gc_enhancement(sqrt(k*nsimplify(Dm)/10**9)/(nsimplify(kl)/10**4))
- template: gc-hatta-regime
  skill: cre.diffusion
  pace: quick
  given:
    k:
      pick:
      - 0.01
      - 1
      - 100
      - 10000
    Dm:
      pick:
      - 1
      - 2
    kl:
      pick:
      - 1
      - 2
      - 4
  require:
  - abs(sqrt(k*Dm*1e-9)/(kl*1e-4) - 0.3) > 0.03
  - abs(sqrt(k*Dm*1e-9)/(kl*1e-4) - 3) > 0.3
  prompt: 'Gas absorption with pseudo-first-order reaction: k = {{k}} s⁻¹, D = {{Dm}} × 10⁻⁹ m²/s, $k_L$ = {{kl}} × 10⁻⁴ m/s. Which regime applies?'
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Slow (Ha < 0.3): reaction in the bulk liquid'
    - Intermediate (0.3 to 3)
    - 'Fast (Ha > 3): reaction within the film'
    correct: 'sqrt(k*Dm*1e-9)/(kl*1e-4) < 0.3 ? 0 : (sqrt(k*Dm*1e-9)/(kl*1e-4) < 3 ? 1 : 2)'
    explain: Ha² compares reaction in the film to diffusion across it; in the fast regime interfacial area, not liquid volume, sets the rate
  verify:
    choices:
      v: 0 if sqrt(k*nsimplify(Dm)/10**9)/(nsimplify(kl)/10**4) < Rational(3, 10) else (1 if sqrt(k*nsimplify(Dm)/10**9)/(nsimplify(kl)/10**4) < 3 else 2)
- template: gc-slurry-resistances
  skill: cre.diffusion
  pace: quick
  given:
    ci:
      pick:
      - 5
      - 10
      - 20
    kb:
      pick:
      - 0.05
      - 0.2
      - 1
    kc:
      pick:
      - 0.1
      - 0.5
    kr:
      pick:
      - 0.02
      - 0.1
      - 0.5
  prompt: In a slurry reactor, the dissolved-gas concentration at saturation is {{ci}} mol/m³. Gas absorption $k_ba_b$ = {{kb}} s⁻¹, liquid-to-particle $k_ca_p$ = {{kc}} s⁻¹ and surface reaction $\eta k a_p$ = {{kr}} s⁻¹ (all per reactor volume). What is the overall rate, in mol/(m³·s)?
  parts:
  - ask: Answer
    label: v
    tex: r
    value: ci/(1/kb + 1/kc + 1/kr)
    tol: 0.005
    explain: At steady state the same rate crosses every step, so the driving forces add and the resistances add. The largest 1/k term is the one to attack
  verify:
    expect:
      v: solve([Eq(Symbol('rr'), nsimplify(kb)*(ci - Symbol('cb'))), Eq(Symbol('rr'), nsimplify(kc)*(Symbol('cb') - Symbol('cs'))), Eq(Symbol('rr'), nsimplify(kr)*Symbol('cs'))], [Symbol('rr'), Symbol('cb'), Symbol('cs')])[Symbol('rr')]
- template: gc-slurry-controlling
  skill: cre.diffusion
  pace: quick
  given:
    kb:
      pick:
      - 0.05
      - 0.2
      - 1
    kc:
      pick:
      - 0.1
      - 0.5
    kr:
      pick:
      - 0.02
      - 0.1
      - 0.5
  prompt: In a slurry reactor, gas absorption $k_ba_b$ = {{kb}}, liquid-to-particle $k_ca_p$ = {{kc}} and surface reaction $\eta ka_p$ = {{kr}} s⁻¹. What fraction of the total resistance is gas absorption?
  parts:
  - ask: Answer
    label: v
    tex: f_b
    value: (1/kb)/(1/kb + 1/kc + 1/kr)
    tol: 0.005
    explain: Plotting C_i/r against 1/(catalyst loading) separates the absorption term (intercept) from the particle terms (slope)
  verify:
    expect:
      v: (1/nsimplify(kb))/(1/nsimplify(kb) + 1/nsimplify(kc) + 1/nsimplify(kr))
- template: gc-deactivation
  skill: cre.catalysis
  pace: quick
  given:
    k:
      pick:
      - 0.5
      - 1
      - 2
    kd:
      pick:
      - 0.1
      - 0.3
      - 1
    t:
      pick:
      - 1
      - 3
      - 10
  prompt: A batch reaction is first order (k = {{k}} h⁻¹) on a catalyst whose activity decays first order ($k_d$ = {{kd}} h⁻¹). What conversion is reached after {{t}} h?
  parts:
  - ask: Answer
    label: v
    tex: X
    value: 1 - exp(-(k/kd)*(1 - exp(-kd*t)))
    tol: 0.005
    explain: 'Conversion levels off at 1 − e^{−k/k_d} however long you wait: once the catalyst is dead, time buys nothing'
  verify:
    expect:
      v: 1 - exp(-integrate(nsimplify(k)*exp(-nsimplify(kd)*Symbol('tt')), (Symbol('tt'), 0, t)))
- template: gc-deactivation-limit
  skill: cre.catalysis
  pace: quick
  given:
    k:
      pick:
      - 0.5
      - 1
      - 2
    kd:
      pick:
      - 0.1
      - 0.3
      - 1
  prompt: A first-order batch reaction (k = {{k}} h⁻¹) runs on a catalyst decaying with $k_d$ = {{kd}} h⁻¹. What is the highest conversion it can ever reach?
  parts:
  - ask: Answer
    label: v
    tex: X_\infty
    value: 1 - exp(-k/kd)
    tol: 0.005
    explain: The catalyst can do only k/k_d 'first-order lifetimes' of work; to go further you must regenerate or replace it
  verify:
    expect:
      v: limit(1 - exp(-(nsimplify(k)/nsimplify(kd))*(1 - exp(-nsimplify(kd)*Symbol('tt')))), Symbol('tt'), oo)
- template: gc-first-order-time
  skill: design.control
  pace: quick
  given:
    tau:
      pick:
      - 2
      - 5
      - 12
    p:
      pick:
      - 50
      - 90
      - 95
      - 99
  prompt: A first-order process with τ = {{tau}} min gets a step input. How long, in minutes, until the output has made {{p}}% of its final change?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: -tau*log(1 - p/100)
    tol: 0.005
    explain: The fraction remaining decays as e^{−t/τ} whatever the gain or the step size
  verify:
    expect:
      v: solve(Eq(1 - exp(-x/nsimplify(tau)), Rational(p, 100)), x)[0]
- template: gc-ramp-lag
  skill: design.control
  pace: quick
  given:
    tau:
      pick:
      - 2
      - 5
      - 12
  prompt: A first-order process (K = 1, τ = {{tau}} min) is driven by a ramp input. Once transients die out, by how many minutes does the output lag the input?
  parts:
  - ask: Answer
    label: v
    tex: t_{lag}
    value: tau
    tol: 0.005
    explain: 'A first-order lag follows a ramp at the same slope but τ behind: a quick way to read τ from plant data'
  verify:
    expect:
      v: limit(Symbol('tt') - (Symbol('tt') - tau*(1 - exp(-Symbol('tt')/tau))), Symbol('tt'), oo)
- template: gc-overshoot
  skill: design.control
  pace: quick
  given:
    z:
      pick:
      - 0.1
      - 0.2
      - 0.3
      - 0.5
      - 0.7
  prompt: A second-order process with damping ratio ζ = {{z}} gets a step. What is its fractional overshoot?
  parts:
  - ask: Answer
    label: v
    tex: OS
    value: exp(-pi*z/sqrt(1 - z^2))
    tol: 0.005
    explain: Overshoot depends only on ζ; τ stretches time but not height. ζ = 0.5 gives about 16%, a common tuning target
  verify:
    expect:
      v: gc_overshoot(z)
- template: gc-zeta-from-overshoot
  skill: design.control
  pace: quick
  given:
    os:
      pick:
      - 5
      - 10
      - 16
      - 25
      - 40
  prompt: A second-order process overshoots by {{os}}% after a step. What is its damping ratio ζ?
  parts:
  - ask: Answer
    label: v
    tex: \zeta
    value: -log(os/100)/sqrt(pi^2 + log(os/100)^2)
    tol: 0.005
    explain: Invert OS = exp(−πζ/√(1 − ζ²)); reading ζ from a step test is how a process is identified
  verify:
    expect:
      v: solve(Eq(-pi*x/sqrt(1 - x**2), log(Rational(os, 100))), x)[0]
- template: gc-p-offset
  skill: design.control
  pace: quick
  given:
    K:
      pick:
      - 0.5
      - 2
      - 4
    Kc:
      pick:
      - 0.5
      - 2
      - 5
  prompt: A first-order process (gain K = {{K}}) is under proportional control with $K_c$ = {{Kc}}. After a unit setpoint step, what fraction of the step remains as steady-state offset?
  parts:
  - ask: Answer
    label: v
    tex: e_\infty
    value: 1/(1 + K*Kc)
    tol: 0.005
    explain: A proportional controller needs an error to hold any output, so some offset remains; integral action removes it
  verify:
    expect:
      v: limit(Symbol('s')*(1 - nsimplify(K)*nsimplify(Kc)/(Symbol('tau')*Symbol('s') + 1)/(1 + nsimplify(K)*nsimplify(Kc)/(Symbol('tau')*Symbol('s') + 1)))/Symbol('s'), Symbol('s'), 0)
- template: gc-kc-for-offset
  skill: design.control
  pace: quick
  given:
    K:
      pick:
      - 0.5
      - 2
      - 4
    e:
      pick:
      - 2
      - 5
      - 10
      - 20
  prompt: A first-order process has gain K = {{K}}. What proportional gain $K_c$ keeps the setpoint offset at {{e}}% of the step?
  parts:
  - ask: Answer
    label: v
    tex: K_c
    value: (100/e - 1)/K
    tol: 0.005
    explain: Offset falls as 1/(1 + KK_c), but high gain costs stability once lags and dead time are present
  verify:
    expect:
      v: solve(Eq(1/(1 + nsimplify(K)*x), Rational(e, 100)), x)[0]
- template: gc-ultimate-gain
  skill: design.control
  pace: quick
  given:
    t1:
      pick:
      - 1
      - 2
    t2:
      pick:
      - 1
      - 3
      - 5
    t3:
      pick:
      - 1
      - 4
      - 10
  prompt: A process $G = K/[({{t1}}s + 1)({{t2}}s + 1)({{t3}}s + 1)]$ is under proportional control. Above what loop gain $K K_c$ does the loop go unstable?
  parts:
  - ask: Answer
    label: v
    tex: (KK_c)_u
    value: (t1 + t2 + t3)*(t1*t2 + t1*t3 + t2*t3)/(t1*t2*t3) - 1
    tol: 0.005
    explain: 'Routh gives the same: with $a_3s^3 + a_2s^2 + a_1s + 1 + KK_c$, stability needs $a_1a_2 > a_3(1 + KK_c)$. Three equal lags give 8'
  verify:
    expect:
      v: gc_ultimate(t1, t2, t3)
- template: gc-stability-check
  skill: design.control
  pace: quick
  given:
    t1:

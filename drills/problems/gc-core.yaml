      - 0.25
      - 0.5
    m:
      pick:
      - 0.5
      - 1.2
      - 2
  prompt: A gas with {{yin}}% solute is scrubbed to {{yout}}% with solute-free liquid; equilibrium is y = {{m}}x. What is the minimum L/G?
  parts:
  - ask: Answer
    label: v
    tex: (L/G)_{min}
    value: (yin - yout)/100/(yin/100/m)
    tol: 0.005
    explain: 'At minimum flow the liquid leaving is in equilibrium with the gas entering: a pinch at the rich end and infinitely many stages. Practice uses 1.2–1.5 times the minimum'
  verify:
    expect:
      v: solve(Eq(x*(nsimplify(yin)/100/nsimplify(m)), (nsimplify(yin) - nsimplify(yout))/100), x)[0]
- template: gc-absorber-exit-liquid
  skill: sep.absorption
  pace: quick
  given:
    yin:
      pick:
      - 2
      - 5
    yout:
      pick:
      - 0.1
      - 0.25
      - 0.5
    m:
      pick:
      - 0.5
      - 1.2
      - 2
  prompt: An absorber takes y from {{yin}}% to {{yout}}% with solute-free liquid at 1.5 times the minimum L/G (equilibrium y = {{m}}x). What is the exit liquid mole fraction?
  parts:
  - ask: Answer
    label: v
    tex: x_{out}
    value: (yin - yout)/100/(1.5*(yin - yout)/100/(yin/100/m))
    tol: 0.005
    explain: 'More liquid than the minimum leaves it less loaded: here at two-thirds of the equilibrium value'
  verify:
    expect:
      v: solve(Eq(Rational(3, 2)*((nsimplify(yin) - nsimplify(yout))/100/(nsimplify(yin)/100/nsimplify(m)))*x, (nsimplify(yin) - nsimplify(yout))/100), x)[0]
- template: gc-q-line-intersection
  skill: sep.distillation
  pace: quick
  given:
    R:
      pick:
      - 1.5
      - 2
      - 3
    xd:
      pick:
      - 0.9
      - 0.95
    z:
      pick:
      - 0.4
      - 0.5
    f:
      pick:
      - 25
      - 50
      - 75
  prompt: A column runs at reflux ratio R = {{R}} with distillate $x_D$ = {{xd}}. The feed (z = {{z}}) is {{f}}% vapour by moles. At what x do the q-line and the rectifying line cross?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: (z/(1 - f/100 - 1) + xd/(R + 1))/((1 - f/100)/(1 - f/100 - 1) - R/(R + 1))
    tol: 0.005
    explain: q is the liquid fraction of the feed (1 − vapour fraction). Saturated liquid (q = 1) gives a vertical q-line at x = z; saturated vapour a horizontal one at y = z
  verify:
    expect:
      v: solve(Eq((1 - Rational(f, 100))*x/(-Rational(f, 100)) - nsimplify(z)/(-Rational(f, 100)), nsimplify(R)*x/(nsimplify(R) + 1) + nsimplify(xd)/(nsimplify(R) + 1)), x)[0]
- template: gc-q-line-slope
  skill: sep.distillation
  pace: quick
  given:
    f:
      pick:
      - 10
      - 25
      - 50
      - 75
      - 90
  prompt: A feed is {{f}}% vapour (by moles), saturated. What is the slope of its q-line on the McCabe–Thiele diagram?
  parts:
  - ask: Answer
    label: v
    tex: q/(q-1)
    value: (1 - f/100)/((1 - f/100) - 1)
    tol: 0.005
    explain: q = 1 − vapour fraction; the q-line is vertical for saturated liquid, horizontal for saturated vapour, and negative in between
  verify:
    expect:
      v: solve(Eq(x*((1 - Rational(f, 100)) - 1), 1 - Rational(f, 100)), x)[0]

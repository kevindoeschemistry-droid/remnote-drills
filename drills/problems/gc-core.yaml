  prompt: 'A ⇌ B: forward $A_1$ = {{a1}} s⁻¹, $E_1$ = {{e1}} kJ/mol; reverse $A_2$ = {{a2}} s⁻¹, $E_2$ = {{e2}} kJ/mol. At conversion X = {{X}}, which temperature maximises the net rate, in K? ($R = 8.314$)'
  parts:
  - ask: Answer
    label: v
    tex: T_{opt}
    value: (e2 - e1)*1000/(8.314*log(a2*e2*X/(a1*e1*(1 - X))))
    tol: 0.005
    explain: Too cold and the forward rate is slow; too hot and equilibrium pulls X back. The optimum falls as conversion rises, which is why staged reactors cool between beds
  verify:
    expect:
      v: gc_topt(a1, e1*1000, a2, e2*1000, X)
- template: gc-equilibrium-temperature
  skill: cre.nonisothermal
  pace: quick
  given:
    a1:
      pick:
      - 1000000.0
      - 10000000.0
    e1:
      pick:
      - 50
      - 60
    a2:
      pick:
      - 1000000000000.0
      - 10000000000000.0
    e2:
      pick:
      - 110
      - 130
    X:
      pick:
      - 0.3
      - 0.5
      - 0.7
  prompt: 'A ⇌ B: forward $A_1$ = {{a1}} s⁻¹, $E_1$ = {{e1}} kJ/mol; reverse $A_2$ = {{a2}} s⁻¹, $E_2$ = {{e2}} kJ/mol. Above what temperature, in K, can conversion {{X}} not be reached at all?'
  parts:
  - ask: Answer
    label: v
    tex: T_{eq}
    value: (e2 - e1)*1000/(8.314*log(a2*X/(a1*(1 - X))))
    tol: 0.005
    explain: Equilibrium conversion falls with temperature for an exothermic reaction; the optimum temperature always lies below this line
  verify:

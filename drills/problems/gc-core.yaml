      - 20
  require:
  - y/1000*sqrt(tw/1000)/1e-6 > 30
  prompt: In turbulent water flow ($\rho$ = 1000 kg/m³, $\nu = 10^{-6}$ m²/s) the wall stress is {{tw}} Pa. What is the mean velocity {{y}} mm from the wall, in m/s?
  parts:
  - ask: Answer
    label: v
    tex: u
    value: sqrt(tw/1000)*(log(y/1000*sqrt(tw/1000)/1e-6)/0.41 + 5.0)
    tol: 0.005
    explain: Check y⁺ > 30 before using the log law; nearer the wall (y⁺ < 5) the viscous sublayer has u⁺ = y⁺
  verify:

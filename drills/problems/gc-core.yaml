- template: gc-annulus-flow
  skill: fm.viscous
  pace: quick
  given:
    mu:
      pick:
      - 0.89
      - 1.0
    G:
      pick:
      - 50
      - 100
      - 200
    k:
      pick:
      - 0.25
      - 0.5
      - 0.75
    Rc:
      pick:
      - 1
      - 2
  prompt: Water ($\mu = {{mu}}$ mPa·s) flows under a pressure gradient of {{G}} Pa/m through the annulus between a rod of radius {{k}}R and a pipe of radius R = {{Rc}} cm. What is the volumetric flow rate, in mL/s?
  parts:
  - ask: Answer
    label: v
    tex: Q
    value: pi*G*(Rc/100)^4/(8*mu/1000)*((1 - k^4) - (1 - k^2)^2/log(1/k))*1e6
    tol: 0.005
    explain: The profile is $v = \frac{GR^2}{4\mu}[1 - (r/R)^2 + (1-\kappa^2)\ln(r/R)/\ln(1/\kappa)]$; integrating $2\pi r v$ gives the bracket in the BSL result. As κ → 0 it tends to Hagen–Poiseuille
  verify:
    expect:
      v: gc_annulus_Q(G, mu/1000, Rc/100, k)*10**6
- template: gc-annulus-vs-pipe
  skill: fm.viscous
  pace: quick
  given:
    k:
      pick:
      - 0.1
      - 0.25
      - 0.5
      - 0.75
  prompt: At the same pressure gradient and outer radius, what fraction of the Hagen–Poiseuille flow passes through an annulus whose inner radius is {{k}}R?
  parts:
  - ask: Answer
    label: v
    tex: Q/Q_{pipe}
    value: (1 - k^4) - (1 - k^2)^2/log(1/k)
    tol: 0.005
    explain: 'Even a thin rod costs a lot: at κ = 0.1 the no-slip core removes far more than the 1% of area it blocks'
  verify:
    expect:
      v: gc_annulus_Q(1, 1, 1, k)/(pi/8)
- template: gc-couette-torque
  skill: fm.viscous
  pace: quick
  given:
    k:
      pick:
      - 0.8
      - 0.9
      - 0.95
    Om:
      pick:
      - 10
      - 20
      - 50
    Rc:
      pick:
      - 2
      - 5
    mu:
      pick:
      - 0.1
      - 0.5
  prompt: A cylinder of radius {{k}}R turns at {{Om}} rad/s inside a fixed cylinder of radius R = {{Rc}} cm, with oil of viscosity {{mu}} Pa·s between them. What torque per metre of length, in mN·m/m, keeps it turning?
  parts:
  - ask: Answer
    label: v
    tex: \mathcal{T}
    value: 4*pi*mu*Om*k^2*(Rc/100)^2/(1 - k^2)*1000
    tol: 0.005
    explain: Only $A r + B/r$ satisfies the θ-momentum equation; the shear $\tau_{r\theta} = -\mu r\,d(v_\theta/r)/dr$ comes from the $B/r$ part alone. A rigid rotation ($Ar$) carries no stress
  verify:
    expect:
      v: gc_couette_torque(mu, Om, Rc/100, k)*1000
- template: gc-couette-shear-rate
  skill: fm.viscous
  pace: quick
  given:

      v: sqrt(1 + gc_fopdt_wu(tau, th)**2*tau**2)
- template: gc-rayleigh
  skill: sep.distillation
  pace: quick
  given:
    al:
      pick:
      - 1.5
      - 2.5
      - 4
    x0:
      pick:
      - 0.5
      - 0.6
    x1:
      pick:
      - 0.1
      - 0.2
      - 0.3
  prompt: A still holds a binary with relative volatility α = {{al}} at light-key mole fraction {{x0}}. Simple batch distillation continues until the liquid is at {{x1}}. What fraction of the original charge remains?
  parts:
  - ask: Answer
    label: v
    tex: W/W_0
    value: exp(-(log(x0/x1) + al*log((1 - x1)/(1 - x0)))/(al - 1))
    tol: 0.005
    explain: Each bit of vapour leaves richer than the liquid, so the pot strips the light key gradually; a small α needs most of the charge boiled off
  verify:
    expect:
      v: gc_rayleigh(al, x0, x1)
- template: gc-rayleigh-distillate
  skill: sep.distillation
  pace: quick
  given:
    al:
      pick:
      - 1.5
      - 2.5
      - 4
    x0:
      pick:
      - 0.5
      - 0.6
    x1:
      pick:
      - 0.1
      - 0.2
      - 0.3
  prompt: Batch distillation with α = {{al}} takes the still from {{x0}} to {{x1}}. What is the average light-key mole fraction of the collected distillate?
  parts:
  - ask: Answer
    label: v
    tex: \bar x_D
    value: (x0 - x1*exp(-(log(x0/x1) + al*log((1 - x1)/(1 - x0)))/(al - 1)))/(1 - exp(-(log(x0/x1) + al*log((1 - x1)/(1 - x0)))/(al - 1)))
    tol: 0.005
    explain: 'A light-key balance on the whole batch: what left the still is the distillate'
  verify:
    expect:
      v: (nsimplify(x0) - nsimplify(x1)*gc_rayleigh(al, x0, x1))/(1 - gc_rayleigh(al, x0, x1))
- template: gc-min-absorbent
  skill: sep.absorption
  pace: quick
  given:
    yin:

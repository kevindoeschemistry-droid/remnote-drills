      - 8
      - 12
      - 20
  require:
  - abs(kk - ((t1 + t2 + t3)*(t1*t2 + t1*t3 + t2*t3)/(t1*t2*t3) - 1)) > 0.2
  prompt: A process $K/[({{t1}}s + 1)({{t2}}s + 1)({{t3}}s + 1)]$ runs under proportional control with loop gain $KK_c$ = {{kk}}. Is the closed loop stable?
  parts:
  - ask: Answer
    label: v
    choice:
    - Stable
    - Unstable
    correct: 'kk < (t1 + t2 + t3)*(t1*t2 + t1*t3 + t2*t3)/(t1*t2*t3) - 1 ? 0 : 1'
    explain: Compare with the ultimate gain from Routh or s = iω; well-separated lags allow a much higher gain than equal ones
  verify:
    choices:
      v: 0 if kk < gc_ultimate(t1, t2, t3) else 1
- template: gc-ultimate-period
  skill: design.control
  pace: quick
  given:
    t1:
      pick:
      - 1
      - 2
    t2:
      pick:
      - 1
      - 3
      - 5
    t3:
      pick:
      - 1
      - 4
      - 10
  prompt: For $G = K/[({{t1}}s + 1)({{t2}}s + 1)({{t3}}s + 1)]$ (times in min) under proportional control, what is the ultimate period, in minutes? (Ziegler–Nichols would then set the PI reset time to P_u/1.2.)
  parts:
  - ask: Answer
    label: v
    tex: P_u
    value: 2*pi/sqrt((t1 + t2 + t3)/(t1*t2*t3))
    tol: 0.005
    explain: At the ultimate gain the loop oscillates steadily at the frequency where the phase lag is 180°
  verify:
    expect:
      v: gc_ultimate_period(t1, t2, t3)
- template: gc-zn-reset
  skill: design.control
  pace: quick
  given:
    t1:

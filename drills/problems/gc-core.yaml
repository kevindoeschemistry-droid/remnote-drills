- template: gc-azeotrope
  skill: thermo.solutions
  pace: quick
  given:
    A:
      pick:
      - 1
      - 1.5
      - 2
    r:
      pick:
      - 1.1
      - 1.3
      - 1.6
  require:
  - log(r)/A < 0.9
  prompt: A binary follows $g^E/RT = A x_1x_2$ with A = {{A}}; at the temperature of interest $P_1^{sat}/P_2^{sat}$ = {{r}}. At what x₁ is the azeotrope?
  parts:
  - ask: Answer
    label: v
    tex: x_1^{az}

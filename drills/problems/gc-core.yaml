  verify:
    expect:
      v: solve(Eq(log(nsimplify(r)) + nsimplify(A)*(1 - x)**2 - nsimplify(A)*x**2, 0), x)[0]
- template: gc-cstr-slope
  skill: cre.nonisothermal
  pace: quick
  given:
    kt:
      pick:
      - 0.2
      - 1
      - 4
    J:
      pick:
      - 100
      - 200
      - 300
    Ea:
      pick:
      - 60
      - 90
    T:
      pick:
      - 350
      - 400
    Rs:
      pick:
      - 1
      - 1.5
      - 2.5
  require:
  - abs(J*kt/(1 + kt)^2*Ea*1000/(8.314*T^2) - Rs) > 0.05
  prompt: At a steady state of a first-order exothermic CSTR, $k\tau$ = {{kt}}, the adiabatic rise $\Delta T_{ad}$ = {{J}} K, $E_a$ = {{Ea}} kJ/mol and T = {{T}} K. The heat-removal line R(T) has slope {{Rs}} (in G's units). Is the steady state stable?
  parts:
  - ask: Answer
    label: v
    choice:
    - Stable
    - Unstable (it moves to another steady state)
    correct: 'J*kt/(1 + kt)^2*Ea*1000/(8.314*T^2) < Rs ? 0 : 1'
    explain: G(T) = ΔT_ad·kτ/(1 + kτ), so dG/dT = ΔT_ad·kτ/(1 + kτ)²·E/RT². The middle of three steady states always fails this test
  verify:
    choices:
      v: 0 if diff(J*Symbol('kk')/(1 + Symbol('kk')), Symbol('kk')).subs(Symbol('kk'), nsimplify(kt))*nsimplify(kt)*Ea*1000/(Rational(8314, 1000)*T**2) < nsimplify(Rs) else 1
- template: gc-optimum-temperature
  skill: cre.nonisothermal
  pace: quick
  given:
    a1:
      pick:
      - 1000000.0
      - 10000000.0
    e1:
      pick:
      - 50
      - 60
    a2:
      pick:
      - 1000000000000.0
      - 10000000000000.0
    e2:
      pick:
      - 110
      - 130
    X:
      pick:
      - 0.3
      - 0.5
      - 0.7
  prompt: 'A ⇌ B: forward $A_1$ = {{a1}} s⁻¹, $E_1$ = {{e1}} kJ/mol; reverse $A_2$ = {{a2}} s⁻¹, $E_2$ = {{e2}} kJ/mol. At conversion X = {{X}}, which temperature maximises the net rate, in K? ($R = 8.314$)'
  parts:
  - ask: Answer
    label: v
    tex: T_{opt}
    value: (e2 - e1)*1000/(8.314*log(a2*e2*X/(a1*e1*(1 - X))))
    tol: 0.005
    explain: Too cold and the forward rate is slow; too hot and equilibrium pulls X back. The optimum falls as conversion rises, which is why staged reactors cool between beds
  verify:
    expect:
      v: gc_topt(a1, e1*1000, a2, e2*1000, X)
- template: gc-overall-effectiveness
  skill: cre.diffusion
  pace: quick
  given:
    phi:
      pick:
      - 0.5
      - 2
      - 5
      - 10
    Bi:
      pick:
      - 1
      - 10
      - 100
  prompt: A first-order reaction runs in spherical pellets with Thiele modulus φ = {{phi}} and mass Biot number $Bi = k_cR/D_e$ = {{Bi}}. What is the overall effectiveness factor Ω (rate over k C_bulk V)?
  parts:
  - ask: Answer
    label: v
    tex: \Omega
    value: (3*(phi*coth(phi) - 1)/phi^2)/(1 + (3*(phi*coth(phi) - 1)/phi^2)*phi^2/(3*Bi))
    tol: 0.005
    explain: 'Resistances in series: the film sets the surface concentration, the pellet works at η of that. Large φ and small Bi together make the film control'
  verify:
    expect:
      v: gc_overall_eff(phi, Bi)
- template: gc-hatta-enhancement
  skill: cre.diffusion
  pace: quick
  given:
    k:
      pick:
      - 10
      - 100
      - 1000
    Dm:
      pick:
      - 1
      - 2
    kl:
      pick:
      - 1
      - 2
      - 4
  prompt: A gas dissolves into a liquid where it reacts (pseudo-first order, k = {{k}} s⁻¹, D = {{Dm}} × 10⁻⁹ m²/s, $k_L$ = {{kl}} × 10⁻⁴ m/s). What is the enhancement factor E?
  parts:
  - ask: Answer
    label: v
    tex: E
    value: (sqrt(k*Dm*1e-9)/(kl*1e-4))/tanh(sqrt(k*Dm*1e-9)/(kl*1e-4))
    tol: 0.005
    explain: 'Ha < 0.3: slow reaction, bulk liquid matters, E ≈ 1. Ha > 3: reaction finishes inside the film and E ≈ Ha, so the rate no longer depends on k_L'
  verify:
    expect:
      v: gc_enhancement(sqrt(k*nsimplify(Dm)/10**9)/(nsimplify(kl)/10**4))
- template: gc-slurry-resistances
  skill: cre.diffusion
  pace: quick
  given:
    ci:
      pick:
      - 5
      - 10
      - 20
    kb:
      pick:
      - 0.05
      - 0.2
      - 1
    kc:
      pick:
      - 0.1
      - 0.5
    kr:
      pick:
      - 0.02
      - 0.1
      - 0.5
  prompt: In a slurry reactor, the dissolved-gas concentration at saturation is {{ci}} mol/m³. Gas absorption $k_ba_b$ = {{kb}} s⁻¹, liquid-to-particle $k_ca_p$ = {{kc}} s⁻¹ and surface reaction $\eta k a_p$ = {{kr}} s⁻¹ (all per reactor volume). What is the overall rate, in mol/(m³·s)?
  parts:
  - ask: Answer
    label: v
    tex: r
    value: ci/(1/kb + 1/kc + 1/kr)
    tol: 0.005
    explain: At steady state the same rate crosses every step, so the driving forces add and the resistances add. The largest 1/k term is the one to attack
  verify:
    expect:
      v: solve([Eq(Symbol('rr'), nsimplify(kb)*(ci - Symbol('cb'))), Eq(Symbol('rr'), nsimplify(kc)*(Symbol('cb') - Symbol('cs'))), Eq(Symbol('rr'), nsimplify(kr)*Symbol('cs'))], [Symbol('rr'), Symbol('cb'), Symbol('cs')])[Symbol('rr')]
- template: gc-deactivation
  skill: cre.catalysis
  pace: quick
  given:
    k:
      pick:
      - 0.5
      - 1
      - 2
    kd:
      pick:
      - 0.1
      - 0.3
      - 1
    t:
      pick:
      - 1
      - 3
      - 10
  prompt: A batch reaction is first order (k = {{k}} h⁻¹) on a catalyst whose activity decays first order ($k_d$ = {{kd}} h⁻¹). What conversion is reached after {{t}} h?
  parts:
  - ask: Answer
    label: v
    tex: X
    value: 1 - exp(-(k/kd)*(1 - exp(-kd*t)))
    tol: 0.005
    explain: 'Conversion levels off at 1 − e^{−k/k_d} however long you wait: once the catalyst is dead, time buys nothing'
  verify:
    expect:
      v: 1 - exp(-integrate(nsimplify(k)*exp(-nsimplify(kd)*Symbol('tt')), (Symbol('tt'), 0, t)))
- template: gc-first-order-time
  skill: design.control
  pace: quick
  given:
    tau:
      pick:
      - 2
      - 5
      - 12
    p:
      pick:
      - 50
      - 90
      - 95
      - 99
  prompt: A first-order process with τ = {{tau}} min gets a step input. How long, in minutes, until the output has made {{p}}% of its final change?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: -tau*log(1 - p/100)
    tol: 0.005
    explain: The fraction remaining decays as e^{−t/τ} whatever the gain or the step size
  verify:
    expect:
      v: solve(Eq(1 - exp(-x/nsimplify(tau)), Rational(p, 100)), x)[0]
- template: gc-overshoot
  skill: design.control
  pace: quick
  given:
    z:
      pick:
      - 0.1
      - 0.2
      - 0.3
      - 0.5
      - 0.7
  prompt: A second-order process with damping ratio ζ = {{z}} gets a step. What is its fractional overshoot?
  parts:
  - ask: Answer
    label: v
    tex: OS
    value: exp(-pi*z/sqrt(1 - z^2))
    tol: 0.005
    explain: Overshoot depends only on ζ; τ stretches time but not height. ζ = 0.5 gives about 16%, a common tuning target
  verify:
    expect:
      v: gc_overshoot(z)
- template: gc-p-offset
  skill: design.control
  pace: quick
  given:
    K:
      pick:
      - 0.5
      - 2
      - 4
    Kc:
      pick:
      - 0.5
      - 2
      - 5
  prompt: A first-order process (gain K = {{K}}) is under proportional control with $K_c$ = {{Kc}}. After a unit setpoint step, what fraction of the step remains as steady-state offset?
  parts:
  - ask: Answer
    label: v
    tex: e_\infty
    value: 1/(1 + K*Kc)
    tol: 0.005
    explain: A proportional controller needs an error to hold any output, so some offset remains; integral action removes it
  verify:
    expect:
      v: limit(Symbol('s')*(1 - nsimplify(K)*nsimplify(Kc)/(Symbol('tau')*Symbol('s') + 1)/(1 + nsimplify(K)*nsimplify(Kc)/(Symbol('tau')*Symbol('s') + 1)))/Symbol('s'), Symbol('s'), 0)
- template: gc-ultimate-gain
  skill: design.control
  pace: quick
  given:
    t1:
      pick:
      - 1
      - 2
    t2:
      pick:
      - 1
      - 3
      - 5
    t3:
      pick:
      - 1
      - 4
      - 10
  prompt: A process $G = K/[({{t1}}s + 1)({{t2}}s + 1)({{t3}}s + 1)]$ is under proportional control. Above what loop gain $K K_c$ does the loop go unstable?
  parts:
  - ask: Answer
    label: v
    tex: (KK_c)_u
    value: (t1 + t2 + t3)*(t1*t2 + t1*t3 + t2*t3)/(t1*t2*t3) - 1
    tol: 0.005
    explain: 'Routh gives the same: with $a_3s^3 + a_2s^2 + a_1s + 1 + KK_c$, stability needs $a_1a_2 > a_3(1 + KK_c)$. Three equal lags give 8'
  verify:
    expect:
      v: gc_ultimate(t1, t2, t3)
- template: gc-ultimate-period
  skill: design.control
  pace: quick
  given:
    t1:
      pick:
      - 1
      - 2
    t2:
      pick:
      - 1
      - 3
      - 5
    t3:
      pick:
      - 1
      - 4
      - 10
  prompt: For $G = K/[({{t1}}s + 1)({{t2}}s + 1)({{t3}}s + 1)]$ (times in min) under proportional control, what is the ultimate period, in minutes? (Ziegler–Nichols would then set the PI reset time to P_u/1.2.)
  parts:
  - ask: Answer
    label: v
    tex: P_u
    value: 2*pi/sqrt((t1 + t2 + t3)/(t1*t2*t3))
    tol: 0.005
    explain: At the ultimate gain the loop oscillates steadily at the frequency where the phase lag is 180°
  verify:
    expect:
      v: gc_ultimate_period(t1, t2, t3)
- template: gc-amplitude-ratio
  skill: design.control
  pace: quick
  given:
    K:
      pick:
      - 1
      - 2.5
      - 4
    tau:
      pick:
      - 1
      - 5
      - 20
    w:
      pick:
      - 0.05
      - 0.2
      - 1
  prompt: A first-order process (K = {{K}}, τ = {{tau}} s) is driven by a sinusoid of {{w}} rad/s. What is the amplitude ratio?
  parts:
  - ask: Answer
    label: v
    tex: AR
    value: K/sqrt(1 + w^2*tau^2)
    tol: 0.005
    explain: Replace s by iω and take the modulus. Well above the corner frequency 1/τ the process filters the input out
  verify:
    expect:
      v: Abs(nsimplify(K)/(I*nsimplify(w)*nsimplify(tau) + 1))
- template: gc-fopdt-crossover
  skill: design.control
  pace: quick
  cases:
  - tau: 1
    th: 0.5
    wu: 3.6731944063042516
  - tau: 1
    th: 1
    wu: 2.028757838110434
  - tau: 1
    th: 2
    wu: 1.1444648640517021
  - tau: 5
    th: 0.5

  prompt: A binary liquid follows $g^E/RT = A x_1 x_2$ with A = {{A}}. Is a mixture at x₁ = {{x1}} stable against splitting into two liquids?
  parts:
  - ask: Answer
    label: v
    choice:
    - Stable (single phase)
    - Unstable (it splits)
    correct: '1/x1 + 1/(1 - x1) - 2*A > 0 ? 0 : 1'
    explain: 'Stability is curvature: Δg_mix must curve upward. The one-constant Margules model first splits at A = 2, at x₁ = ½ (the critical solution point)'
  verify:

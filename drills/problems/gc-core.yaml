  prompt: In inviscid flow past a circular cylinder, what is the pressure coefficient $C_p$ at {{th}}° from the front stagnation point?
  parts:
  - ask: Answer
    label: v
    tex: C_p
    value: 1 - 4*sin(th*pi/180)^2
    tol: 0.005
    explain: From $w = U(z + a^2/z)$. $C_p$ = 1 at the stagnation points, −3 at the shoulders, and symmetric front to back, so the net drag is zero (d'Alembert)

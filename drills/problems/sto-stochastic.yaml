- template: sto-detailed-balance-facts
  skill: stoch.longrun
  pace: recall
  cases:
  - q: 'Detailed balance π_i p(i, j) = π_j p(j, i) for all i and j implies that π is:'
    o1: Invariant
    o2: Uniform
    o3: Unique
    o4: Zero off the diagonal
  - q: 'The Metropolis algorithm is built so that its target distribution satisfies:'
    o1: Detailed balance
    o2: The strong Markov property
    o3: Transience
    o4: Periodicity
  - q: 'A chain that cycles deterministically 0 → 1 → 2 → 0 has a uniform invariant distribution but is not reversible because:'
    o1: Flow goes one way round the cycle
    o2: It has no invariant distribution
    o3: It is not irreducible
    o4: It is aperiodic
  - q: 'A chain with a symmetric transition matrix on a finite state space has invariant distribution:'
    o1: Uniform
    o2: Proportional to the diagonal
    o3: Concentrated on one state
    o4: None
  - q: 'Run backwards in time at equilibrium, a reversible chain looks like:'
    o1: The same chain
    o2: A deterministic chain
    o3: A transient chain
    o4: A chain with transposed, unnormalised matrix
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Detailed balance is sufficient for invariance, not necessary: the three-cycle balances globally but not pair by pair'
  verify:
    authored: true
- template: sto-second-eigenvalue
  skill: stoch.longrun
  pace: quick
  cases:
  - rows: 9/10,1/10;1/2,1/2
    sh: (9/10, 1/10) ; (1/2, 1/2)
    ka: 0.1
    kb: 0.5
    kn: 2
  - rows: 4/5,1/5;2/5,3/5
    sh: (4/5, 1/5) ; (2/5, 3/5)
    ka: 0.2
    kb: 0.4
    kn: 3
  - rows: 1/2,1/2;1/4,3/4
    sh: (1/2, 1/2) ; (1/4, 3/4)
    ka: 0.5
    kb: 0.25
    kn: 2
  - rows: 7/10,3/10;1/10,9/10
    sh: (7/10, 3/10) ; (1/10, 9/10)
    ka: 0.3
    kb: 0.1
    kn: 4
  - rows: 2/3,1/3;1/6,5/6
    sh: (2/3, 1/3) ; (1/6, 5/6)
    ka: 0.3333333333333333
    kb: 0.16666666666666666
    kn: 3
  prompt: A chain on states 0 and 1 has transition matrix with rows {{sh}}. Find pⁿ(0, 0) − π₀ for n = {{kn}}, using π₁λⁿ with λ = 1 − a − b.
  parts:
  - ask: Answer
    label: v
    tex: gap
    value: ka/(ka + kb)*(1 - ka - kb)^kn
    tol: 0.01
    explain: 'The gap to equilibrium shrinks by the factor λ = 1 − a − b each step: the closer the two rows of the matrix, the faster the chain forgets its start'
  verify:
    expect:
      v: pm_mc_nstep(rows, kn, 0, 0) - pm_mc_stationary(rows, 0)
- template: sto-convergence-facts
  skill: stoch.longrun
  pace: recall
  cases:
  - q: 'The chain that alternates 0 → 1 → 0 → … has invariant distribution (1/2, 1/2), but pⁿ(0, 0) does not converge because the chain is:'
    o1: Periodic
    o2: Transient
    o3: Reducible
    o4: Null recurrent
  - q: 'For pⁿ(i, j) → π_j from every start, a finite chain needs to be:'
    o1: Irreducible and aperiodic
    o2: Irreducible only
    o3: Reversible
    o4: Symmetric
  - q: 'An irreducible chain with at least one state that can stay put (p(i, i) > 0) is:'
    o1: Aperiodic
    o2: Periodic with period 2
    o3: Reducible
    o4: Transient
  - q: 'A chain with two closed communicating classes has:'
    o1: More than one invariant distribution
    o2: No invariant distribution
    o3: Exactly one invariant distribution
    o4: Period 2
  - q: 'The rate of convergence of a finite reversible chain is governed by:'
    o1: The second-largest eigenvalue modulus
    o2: The largest eigenvalue
    o3: The trace
    o4: The determinant
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Irreducibility gives uniqueness of π, aperiodicity gives convergence to it, and the spectral gap gives the speed
  verify:
    authored: true
- template: sto-poisson-none
  skill: stoch.poisson
  pace: quick
  given:
    kl:
      pick:
      - 2
      - 3
      - 4
    kt:
      pick:
      - 0.25
      - 0.5
      - 1
  prompt: Events occur as a Poisson process at rate {{kl}} per hour. Find the probability of no events in {{kt}} hours.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: exp(-kl*kt)
    tol: 0.005
    explain: No arrivals by time t means the first gap exceeds t, and an exponential gap survives with probability e^(−λt)
  verify:
    expect:
      v: 1 - integrate(kl*exp(-kl*Y), (Y, 0, nsimplify(kt)))
- template: sto-poisson-count
  skill: stoch.poisson
  pace: quick
  given:
    kl:
      pick:
      - 1
      - 2
      - 3
    kt:
      pick:
      - 1
      - 2
    kk:
      pick:
      - 1
      - 2
      - 3
  prompt: Events occur as a Poisson process at rate {{kl}} per minute. Find the probability of exactly {{kk}} events in {{kt}} minutes.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: exp(-kl*kt)*(kl*kt)^kk/factorial(kk)
    tol: 0.005
    explain: 'The count is Poisson with mean λt: e^(−λt)(λt)^k/k!'
  verify:
    expect:
      v: diff(exp(kl*kt*(Y - 1)), Y, kk).subs(Y, 0)/factorial(kk)
- template: sto-poisson-race
  skill: stoch.poisson
  pace: quick
  given:
    kl:
      pick:
      - 1
      - 2
      - 3
      - 5
    km:
      pick:
      - 1
      - 4
      - 6
  prompt: Two independent Poisson processes have rates {{kl}} and {{km}} per second. Find the probability that the next event comes from the first.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: kl/(kl + km)
    tol: 0.005
    explain: 'The first process wins the race if its exponential clock rings first: integrate its density against the other''s survival'
  verify:
    expect:
      v: integrate(kl*exp(-kl*Y)*exp(-km*Y), (Y, 0, oo))
- template: sto-poisson-thinning
  skill: stoch.poisson
  pace: quick
  given:
    kl:
      pick:
      - 5
      - 10
      - 20
    kp:
      pick:
      - 0.1
      - 0.2
      - 0.5
    kt:
      pick:
      - 0.5
      - 1
      - 2
  prompt: Particles arrive at a detector as a Poisson process at {{kl}} per second, and each is recorded independently with probability {{kp}}. Find the probability that none is recorded in {{kt}} seconds.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: exp(-kl*kp*kt)
    tol: 0.005
    explain: Thinning gives a Poisson process of rate pλ, so the recorded count in time t has mean pλt
  verify:
    expect:
      v: exp(-nsimplify(kp)*kl*kt)
- template: sto-mm1-mean
  skill: stoch.poisson
  pace: quick
  cases:
  - kl: 2
    km: 3
  - kl: 3
    km: 4
  - kl: 4
    km: 5
  - kl: 9
    km: 10
  - kl: 1
    km: 2
  - kl: 5
    km: 8
  prompt: Customers arrive at a single server at rate {{kl}} per hour and are served at rate {{km}} per hour (M/M/1). Find the mean number in the system at equilibrium.
  parts:
  - ask: Answer
    label: v
    tex: L
    value: kl/(km - kl)
    tol: 0.005
    explain: ρ = λ/μ and the mean of the geometric equilibrium distribution is ρ/(1 − ρ) = λ/(μ − λ), which blows up as the arrival rate approaches the service rate
  verify:
    expect:
      v: summation(nn*(1 - Rational(kl, km))*Rational(kl, km)**nn, (nn, 1, oo))
- template: sto-birth-death
  skill: stoch.poisson
  pace: quick
  cases:
  - u0: 2
    u1: 1
    d1: 1
    d2: 2
    rts: 2,1;1,2
  - u0: 1
    u1: 1
    d1: 2
    d2: 2
    rts: 1,1;2,2
  - u0: 3
    u1: 2
    d1: 1
    d2: 1
    rts: 3,2;1,1
  - u0: 2
    u1: 2
    d1: 3
    d2: 1
    rts: 2,2;3,1
  - u0: 1
    u1: 2
    d1: 1
    d2: 4
    rts: 1,2;1,4
  prompt: A system has states 0, 1, 2. It moves up from 0 at rate {{u0}} and from 1 at rate {{u1}}, and down from 1 at rate {{d1}} and from 2 at rate {{d2}}. Find the equilibrium probability of state 2.
  parts:
  - ask: Answer
    label: v
    tex: \pi_2
    value: (u0/d1)*(u1/d2)/(1 + u0/d1 + (u0/d1)*(u1/d2))
    tol: 0.005
    explain: 'Balance across each cut: π₁ = π₀ u₀/d₁ and π₂ = π₁ u₁/d₂, then normalise'
  verify:
    expect:
      v: pm_ctmc_stationary(rts, 2)

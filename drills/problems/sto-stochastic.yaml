- template: sto-ruin-biased
  skill: stoch.walks
  pace: quick
  cases:
  - ki: 2
    kn: 4
    kp: 0.4
  - ki: 3
    kn: 6
    kp: 0.6
  - ki: 5
    kn: 10
    kp: 0.45
  - ki: 1
    kn: 5
    kp: 0.6
  - ki: 4
    kn: 8
    kp: 0.25
  prompt: A gambler with {{ki}} units bets 1 unit at a time, winning each bet with probability {{kp}}, and stops at 0 or {{kn}}. Find the probability of reaching {{kn}}.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: (1 - ((1 - kp)/kp)^ki)/(1 - ((1 - kp)/kp)^kn)
    tol: 0.005
    explain: With r = q/p the answer is (1 − r^i)/(1 − r^N). A small edge against you is ruinous over a long game
  verify:
    expect:
      v: pm_ruin_win(kp, ki, kn)
- template: sto-ruin-duration
  skill: stoch.walks
  pace: quick
  cases:
  - ki: 2
    kn: 5
  - ki: 3
    kn: 10
  - ki: 5
    kn: 10
  - ki: 1
    kn: 8
  - ki: 4
    kn: 12
  prompt: In a fair game with unit bets, a gambler starts with {{ki}} units and stops at 0 or {{kn}}. Find the expected number of bets.
  parts:
  - ask: Answer
    label: v
    tex: bets
    value: ki*(kn - ki)
    final: true
    tol: 0.0001
    explain: k(i) = 1 + (k(i − 1) + k(i + 1))/2 with k(0) = k(N) = 0 has the solution i(N − i)
  verify:
    expect:
      v: pm_ruin_time(ki, kn)
- template: sto-return-probability
  skill: stoch.walks
  pace: quick
  given:
    kp:
      pick:
      - 0.6
      - 0.7
      - 0.25
      - 0.9
      - 0.45
  prompt: A walk on the integers steps +1 with probability {{kp}} and −1 otherwise. Find the probability that it ever returns to its starting point.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: 2*min(kp, 1 - kp)
    tol: 0.005
    explain: The walk returns for certain after a step against the drift and with probability q/p (for p > q) after a step with it, giving 1 − |p − q| = 2 min(p, q)
  verify:
    expect:
      v: 1 - Abs(2*nsimplify(kp) - 1)
- template: sto-recurrence-facts
  skill: stoch.walks
  pace: recall
  cases:
  - q: The simple symmetric random walk is recurrent in which dimensions?
    o1: One and two only
    o2: One only
    o3: All dimensions
    o4: One, two and three
  - q: 'A state i is transient exactly when the sum over n of pⁿ(i, i) is:'
    o1: Finite
    o2: Infinite
    o3: Equal to 1
    o4: Zero
  - q: 'In a finite irreducible chain, every state is:'
    o1: Positive recurrent
    o2: Transient
    o3: Null recurrent
    o4: Absorbing
  - q: 'The simple symmetric walk on the integers returns to 0 with probability 1, and its expected return time is:'
    o1: Infinite
    o2: '2'
    o3: Finite but large
    o4: '1'
  - q: 'Recurrence and transience are class properties, meaning:'
    o1: All states in a communicating class share them
    o2: They depend on the starting distribution
    o3: They hold only for closed classes
    o4: They change with time
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: 'The return probabilities of the symmetric walk decay like n^(−d/2), which is summable only for d ≥ 3. In one dimension return is certain but takes infinitely long on average: null recurrence'
  verify:
    authored: true

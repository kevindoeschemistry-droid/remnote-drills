    sh: (9/10, 1/10) ; (1/2, 1/2)
    ka: 0.1
    kb: 0.5
  - rows: 4/5,1/5;2/5,3/5
    sh: (4/5, 1/5) ; (2/5, 3/5)
    ka: 0.2
    kb: 0.4
  - rows: 1/2,1/2;1/4,3/4
    sh: (1/2, 1/2) ; (1/4, 3/4)
    ka: 0.5
    kb: 0.25
  - rows: 7/10,3/10;1/10,9/10
    sh: (7/10, 3/10) ; (1/10, 9/10)
    ka: 0.3
    kb: 0.1
  - rows: 2/3,1/3;1/6,5/6
    sh: (2/3, 1/3) ; (1/6, 5/6)
    ka: 0.3333333333333333
    kb: 0.16666666666666666
  prompt: A chain on states 0 and 1 has transition matrix with rows {{sh}}. Find the long-run probability of state 0.
  parts:
  - ask: Answer
    label: v
    tex: \pi_0
    value: kb/(ka + kb)
    tol: 0.005
    explain: 'Balance the flow between the two states: π₀ a = π₁ b, so π₀ = b/(a + b), where a and b are the two switching probabilities'
  verify:
    expect:
      v: pm_mc_stationary(rows, 0)

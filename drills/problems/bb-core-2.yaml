- template: bb-press-value
  skill: bb.zone-press
  pace: quick
  given:
    tp:
      pick:
      - 15
      - 25
      - 35
    tw:
      pick:
      - 1.2
      - 1.4
    cw:
      pick:
      - 1.1
      - 1.3
  prompt: A press forces a turnover on {{tp}} per cent of possessions, each worth {{tw}} points to the pressing team, but concedes {{cw}} points on the rest. Is it worth running, and what is its net value per possession (points)?
  parts:
  - ask: Answer
    label: v
    tex: points
    value: tp/100*tw - (1 - tp/100)*cw
    tol: 0.005
    explain: A press pays only when the turnover rate is high enough to outweigh what the beaten press concedes, which is why it is usually a situational rather than a base defence

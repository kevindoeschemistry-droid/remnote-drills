- template: bvp-how-many
  skill: ode2.characteristic
  pace: quick
  cases:
  - q: y″ + y = 0, y(0) = 0, y(π) = 0. How many solutions?
    o1: 'Infinitely many: y = B sin x for any B'
    o2: Exactly one, y = 0
    o3: None
    o4: Exactly two
  - q: y″ + y = 0, y(0) = 0, y(π) = 1. How many solutions?
    o1: 'None: every solution with y(0) = 0 vanishes at π'
    o2: Exactly one
    o3: Infinitely many
    o4: Exactly two
  - q: y″ + y = 0, y(0) = 0, y(π/2) = 1. How many solutions?
    o1: 'Exactly one: y = sin x'
    o2: None
    o3: Infinitely many
    o4: Two
  - q: y″ − y = 0, y(0) = 0, y(1) = 0. How many solutions?
    o1: 'Exactly one, y = 0: sinh has no other zero'
    o2: Infinitely many
    o3: None
    o4: Two
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: A boundary-value problem fails to be unique exactly when the homogeneous problem has a nonzero solution (an eigenvalue)
  verify:
    authored: true
- template: hi-ec-roots
  skill: ode2.higher-order
  pace: quick
  cases:
  - r1: 1
    r2: 2
    r3: 3
  - r1: -1
    r2: 1
    r3: 2
  - r1: 0
    r2: 2
    r3: 4
  - r1: -2
    r2: -1
    r3: 3
  let:
    a: 3 - (r1 + r2 + r3)
    b: r1*r2 + r1*r3 + r2*r3 - 2 + 3 - (r1 + r2 + r3)
    c: -r1*r2*r3
  prompt: Find the largest root of the auxiliary equation of x³y‴ + ({{a}})x²y″ + ({{b}})xy′ + ({{c}})y = 0.
  parts:
  - ask: Answer
    label: v
    tex: m
    value: max(r1, r2, r3)
    final: true
    tol: 0.0001
    explain: 'Substitute x^m: m(m − 1)(m − 2) + a m(m − 1) + b m + c = 0, then factor'
  verify:
    expect:
      v: Max(*solve(Symbol('m')*(Symbol('m') - 1)*(Symbol('m') - 2) + (3 - (r1 + r2 + r3))*Symbol('m')*(Symbol('m') - 1) + (r1*r2 + r1*r3 + r2*r3 + 1 - (r1 + r2 + r3))*Symbol('m') - r1*r2*r3, Symbol('m')))

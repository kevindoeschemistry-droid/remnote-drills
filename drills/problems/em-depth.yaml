      - 2
    c:
      pick:
      - 2
      - 4
      - 6
    a:
      pick:
      - 1
      - 2
    T:
      pick:
      - 3
      - 4
  prompt: y′ + {{k}}y = {{c}} for 0 < t < {{a}} and y′ + {{k}}y = 0 after, with y(0) = 0. Find y({{T}}).
  parts:
  - ask: Answer
    label: v
    tex: y(T)
    value: c/k*(1 - exp(-k*a))*exp(-k*(T - a))

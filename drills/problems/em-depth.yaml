  cases:
  - q: How many independent eigenfunctions belong to each positive eigenvalue of the periodic problem?
    o1: 'Two: cos(nπx/L) and sin(nπx/L)'
    o2: One
    o3: None
    o4: Infinitely many
  - q: Is λ = 0 an eigenvalue of the periodic problem?
    o1: Yes, with eigenfunction y = constant
    o2: 'No'
    o3: Only if L = π
    o4: Only for Dirichlet conditions
  - q: Which classic expansion are the periodic eigenfunctions behind?
    o1: The full Fourier series
    o2: The half-range sine series
    o3: The Legendre series
    o4: The Fourier–Bessel series
  - q: Is the periodic problem a regular Sturm–Liouville problem?
    o1: 'No: it is a periodic S–L problem, which allows double eigenvalues'
    o2: Yes, regular
    o3: Singular
    o4: Not self-adjoint
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Periodic conditions couple the two ends, so each eigenvalue can carry two eigenfunctions
  verify:

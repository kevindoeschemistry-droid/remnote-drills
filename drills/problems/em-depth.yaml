  - r1: 0
    r2: 2
    r3: 4
  prompt: The auxiliary equation of a third-order Euler–Cauchy ODE has roots {{r1}}, {{r2}} and {{r3}}. With y = c₁x^{{r1}} + c₂x^{{r2}} + c₃x^{{r3}}, what is the sum of the exponents of the x terms?
  parts:

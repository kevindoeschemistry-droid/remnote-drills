    r0: 3
    geo: cylindrical
    ax: z-axis
    g: 0
  prompt: Compute ∇²(r^{{n}}) at r = {{r0}} in {{geo}} coordinates, where r is the distance from the {{ax}}.
  parts:
  - ask: Answer
    label: v
    tex: \nabla^2
    value: 'g == 0 ? n^2*r0^(n - 2) : n*(n + 1)*r0^(n - 2)'
    tol: 0.005
    explain: 'Cylindrical: (1/r)(r f′)′ = n² r^(n−2); spherical: (1/r²)(r² f′)′ = n(n + 1) r^(n−2); the Cartesian second derivatives agree'
  verify:
    expect:
      v: '[(diff((x**2 + Symbol(''Y2'')**2)**Rational(n, 2), x, 2) + diff((x**2 + Symbol(''Y2'')**2)**Rational(n, 2), Symbol(''Y2''), 2)).subs({x: r0, Symbol(''Y2''): 0}), (diff((x**2 + Symbol(''Y2'')**2 + Symbol(''Z2'')**2)**Rational(n, 2), x, 2) + diff((x**2 + Symbol(''Y2'')**2 + Symbol(''Z2'')**2)**Rational(n, 2), Symbol(''Y2''), 2) + diff((x**2 + Symbol(''Y2'')**2 + Symbol(''Z2'')**2)**Rational(n, 2), Symbol(''Z2''), 2)).subs({x: r0, Symbol(''Y2''): 0, Symbol(''Z2''): 0})][g]'
- template: vc-harmonic-radial
  skill: calc.vector-calculus
  pace: quick
  cases:
  - q: Which radial function is harmonic (∇² = 0) away from the axis in cylindrical coordinates?
    o1: ln r
    o2: 1/r
    o3: r²
    o4: e^(−r)
  - q: Which radial function is harmonic away from the origin in spherical coordinates?
    o1: 1/r
    o2: ln r
    o3: r
    o4: r²
  - q: Why does ∇² in cylindrical coordinates have a (1/r) ∂/∂r term?
    o1: The area a radial flux crosses grows with r
    o2: It comes from the z direction
    o3: It is a curvature correction to time
    o4: It is a numerical artefact
  - q: A spherical concentration profile c(r) is steady with no reaction. What form must it have?
    o1: A + B/r
    o2: A + B ln r
    o3: A + Br
    o4: A e^(−r)
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The extra first-derivative terms count how fast the area crossed by a radial flux grows
  verify:
    authored: true
- template: vc-shell-temperature
  skill: calc.vector-calculus
  pace: quick
  cases:
  - geo: cylindrical
    g: 0
    Ti: 100
    To: 20
    ri: 1
    ro: 4
    rm: 2
  - geo: spherical
    g: 1
    Ti: 100
    To: 20
    ri: 1
    ro: 4
    rm: 2
  - geo: cylindrical
    g: 0
    Ti: 50
    To: 10
    ri: 2
    ro: 8
    rm: 4
  - geo: spherical
    g: 1
    Ti: 80
    To: 30
    ri: 1
    ro: 3
    rm: 1.5
  prompt: A {{geo}} shell has T = {{Ti}} at r = {{ri}} and T = {{To}} at r = {{ro}}, with steady conduction and no source. What is T at r = {{rm}}?
  parts:
  - ask: Answer
    label: v
    tex: T
    value: 'g == 0 ? Ti + (To - Ti)*log(rm/ri)/log(ro/ri) : Ti + (To - Ti)*(1/ri - 1/rm)/(1/ri - 1/ro)'
    tol: 0.005
    explain: 'Solve ∇²T = 0: cylinder T = A ln r + B, sphere T = A/r + B, then fit both walls'
  verify:
    expect:
      v: '[Ti + (To - Ti)*log(nsimplify(rm)/ri)/log(Rational(ro, ri)), Ti + (To - Ti)*(Rational(1, ri) - 1/nsimplify(rm))/(Rational(1, ri) - Rational(1, ro))][g]'
- template: vc-shell-heat
  skill: calc.vector-calculus
  pace: quick
  given:
    kc:
      pick:
      - 0.04
      - 0.2
      - 15
    Lp:
      pick:
      - 1
      - 5
    ri:
      pick:
      - 2
      - 5
    ro:
      pick:
      - 8
      - 10
    dT:
      pick:
      - 20
      - 50
  prompt: A cylindrical pipe wall (k = {{kc}} W/m·K, length {{Lp}} m) runs from r = {{ri}} cm to {{ro}} cm with a temperature drop of {{dT}} K across it. What heat flows through it, in W?
  parts:
  - ask: Answer
    label: v
    tex: Q
    value: 2*pi*kc*Lp*dT/log(ro/ri)
    tol: 0.005
    explain: 'Q = −k·(2πrL)·dT/dr is the same at every r: 2πkLΔT/ln(r_o/r_i)'
  verify:
    expect:
      v: -nsimplify(kc)*2*pi*Symbol('r')*Lp*diff(dT*(1 - log(Symbol('r')/ri)/log(Rational(ro, ri))), Symbol('r'))
- template: vc-div-radial
  skill: calc.vector-calculus
  pace: quick
  cases:
  - n: 2
    r0: 2
    geo: cylindrical
    g: 0
  - n: 1
    r0: 3
    geo: spherical
    g: 1
  - n: 3
    r0: 1
    geo: spherical
    g: 1
  - n: 1
    r0: 2
    geo: cylindrical
    g: 0
  prompt: Compute ∇·(r^{{n}} e_r) at r = {{r0}} in {{geo}} coordinates.
  parts:
  - ask: Answer
    label: v
    tex: \nabla\cdot
    value: 'g == 0 ? (n + 1)*r0^(n - 1) : (n + 2)*r0^(n - 1)'
    tol: 0.005
    explain: r^n e_r is r^(n−1) times the position vector; its Cartesian divergence matches (1/r)(r·rⁿ)′ or (1/r²)(r²·rⁿ)′
  verify:
    expect:
      v: '[(diff(x*(x**2 + Symbol(''Y2'')**2)**Rational(n - 1, 2), x) + diff(Symbol(''Y2'')*(x**2 + Symbol(''Y2'')**2)**Rational(n - 1, 2), Symbol(''Y2''))).subs({x: r0, Symbol(''Y2''): 0}), (diff(x*(x**2 + Symbol(''Y2'')**2 + Symbol(''Z2'')**2)**Rational(n - 1, 2), x) + diff(Symbol(''Y2'')*(x**2 + Symbol(''Y2'')**2 + Symbol(''Z2'')**2)**Rational(n - 1, 2), Symbol(''Y2'')) + diff(Symbol(''Z2'')*(x**2 + Symbol(''Y2'')**2 + Symbol(''Z2'')**2)**Rational(n - 1, 2), Symbol(''Z2''))).subs({x: r0, Symbol(''Y2''): 0, Symbol(''Z2''): 0})][g]'
- template: vc-flux-conservation
  skill: calc.vector-calculus
  pace: quick
  cases:
  - geo: cylindrical
    g: 0
    F1: 10
    r1: 1
    r2: 4
  - geo: spherical
    g: 1
    F1: 10
    r1: 1
    r2: 4
  - geo: spherical
    g: 1
    F1: 36
    r1: 2
    r2: 3
  prompt: A steady radial flux F(r) e_r has zero divergence in a {{geo}} geometry. It is {{F1}} at r = {{r1}}. What is it at r = {{r2}}?
  parts:
  - ask: Answer
    label: v
    tex: F
    value: 'g == 0 ? F1*r1/r2 : F1*(r1/r2)^2'
    tol: 0.005
    explain: 'Zero divergence means r·F (cylinder) or r²·F (sphere) is constant: the same total flow spreads over more area'
  verify:
    expect:
      v: '[F1*Rational(r1, r2), F1*Rational(r1, r2)**2][g]'

    explain: 'Variation of constants: y(T) = ∫₀^T e^(−k(T−s)) r(s) ds, and r vanishes after t = a'
  verify:
    expect:
      v: exp(-nsimplify(k)*T)*integrate(c*exp(nsimplify(k)*Symbol('s')), (Symbol('s'), 0, a))

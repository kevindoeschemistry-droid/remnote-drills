- template: td-line-integral-path
  skill: thermo.first-law
  pace: quick
  given:
    T1:
      pick:
      - 300
    T2:
      pick:
      - 400
      - 600
    V2:
      pick:
      - 2
      - 5
  prompt: Integrate δq = C_v dT + (RT/V) dV for 1 mol of ideal gas (C_v = 1.5R) from ({{T1}} K, 1 L) to ({{T2}} K, {{V2}} L), first at constant V then at constant T. What is q, in J?
  parts:
  - ask: Answer
    label: v
    tex: q
    value: 1.5*8.314*(T2 - T1) + 8.314*T2*log(V2)
    tol: 0.005
    explain: 'Heat is path dependent: heating first then expanding gives a different q from expanding first, because the expansion term depends on T'
  verify:
    expect:
      v: integrate(Rational(3, 2)*Rational(8314, 1000), (Symbol('TT'), T1, T2)) + integrate(Rational(8314, 1000)*T2/Symbol('vv'), (Symbol('vv'), 1, V2))
- template: td-potential-for-constraints
  skill: thermo.legendre
  pace: recall
  cases:
  - q: Which potential is minimised at equilibrium at constant T, V and N?
    o1: Helmholtz F
    o2: Gibbs G
    o3: Enthalpy H
    o4: Grand potential Ω
  - q: Which potential is minimised at constant T, P and N?
    o1: Gibbs G
    o2: Helmholtz F
    o3: Internal energy U
    o4: Enthalpy H
  - q: Which potential is minimised at constant T, V and μ?
    o1: Grand potential Ω = F − μN
    o2: Gibbs G
    o3: Helmholtz F
    o4: Enthalpy H
  - q: Which potential is minimised at constant S, P and N?
    o1: Enthalpy H
    o2: Gibbs G
    o3: Helmholtz F
    o4: Entropy S (maximised)
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Each Legendre transform swaps one extensive variable for its conjugate intensive one; the potential whose natural variables are held fixed is the one that is minimised
  verify:
    authored: true

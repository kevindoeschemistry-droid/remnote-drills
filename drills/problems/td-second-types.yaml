  prompt: '{{nA}} A molecules and {{nB}} B molecules fill a lattice of nA + nB sites. What is the entropy of mixing ΔS/k compared with pure separated lattices?'
  parts:
  - ask: Answer
    label: v
    tex: \Delta S/k
    value: log(factorial(nA + nB)/(factorial(nA)*factorial(nB)))
    tol: 0.005

- template: td-cp-at-transition
  skill: thermo.phase-equilibrium
  pace: recall
  cases:
  - q: At a first-order transition, which quantity jumps?
    o1: Entropy and volume (first derivatives of G)
    o2: Only the heat capacity
    o3: G itself
    o4: Nothing
  - q: At a second-order (continuous) transition, which quantities are continuous?
    o1: G, S and V; second derivatives like C_p may diverge or jump
    o2: Only G
    o3: Nothing
    o4: Only C_p
  - q: Is boiling water at 1 atm a first- or second-order transition?
    o1: First order (latent heat)
    o2: Second order
    o3: Neither
    o4: Third order
  - q: Is the liquid–gas transition exactly at the critical point first or continuous?
    o1: 'Continuous: the latent heat vanishes there'
    o2: First order
    o3: It is not a transition
    o4: Zeroth order
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: 'Ehrenfest''s classification: the order is that of the lowest derivative of G that is discontinuous'
  verify:
    authored: true

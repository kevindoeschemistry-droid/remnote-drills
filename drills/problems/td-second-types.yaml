- template: td-perm-reverse
  skill: stat.probability
  pace: quick
  given:
    n:
      int:
      - 4
      - 15
  let:
    P: n*(n - 1)
  prompt: How many distinguishable objects n give exactly {{P}} ordered selections of 2 (n(n − 1))?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: n
    final: true
    tol: 0.0001
    explain: 'P(n, 2) = n(n − 1): solving the quadratic runs the count backwards'
  verify:
    expect:
      v: Max(*solve(Eq(x*(x - 1), n*(n - 1)), x))
- template: td-comb-ratio
  skill: stat.multiplicity
  pace: quick
  given:
    N:
      int:
      - 10
      - 30
    n:
      int:
      - 1
      - 5
  let:
    n1: n + 1
  prompt: N = {{N}} sites hold n indistinguishable particles. By what factor does the number of arrangements grow when n goes from {{n}} to {{n1}}?
  parts:
  - ask: Answer
    label: v
    tex: W_{n+1}/W_n
    value: (N - n)/(n + 1)
    tol: 0.005
    explain: 'C(N, n+1)/C(N, n) = (N − n)/(n + 1): W grows while n < N/2, the origin of the entropy maximum at half filling'
  verify:
    expect:
      v: binomial(N, n + 1)/binomial(N, n)
- template: td-multinomial-probability
  skill: stat.multiplicity
  pace: quick
  given:
    N:
      pick:
      - 6
      - 8
      - 10
    a:
      int:
      - 1
      - 3
    b:
      int:
      - 1
      - 3
  prompt: A sequence of {{N}} letters is drawn with equal probability from A, B, C. What is the probability that it contains exactly {{a}} A's, {{b}} B's and the rest C's?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: factorial(N)/(factorial(a)*factorial(b)*factorial(N - a - b))/3^N
    tol: 0.005
    explain: 'Multinomial count over 3^N equally likely sequences: choose the A positions, then the B positions'
  verify:
    expect:
      v: binomial(N, a)*binomial(N - a, b)*Rational(1, 3)**N
- template: td-binomial-mean-var
  skill: stat.probability
  pace: quick
  given:
    N:
      pick:
      - 10
      - 100
      - 1000
    p:
      pick:
      - 0.1
      - 0.5
      - 0.8
  prompt: In N = {{N}} independent trials with success probability p = {{p}}, what is the standard deviation of the number of successes?
  parts:
  - ask: Answer
    label: v
    tex: \sigma
    value: sqrt(N*p*(1 - p))
    tol: 0.005
    explain: 'σ = √(Np(1 − p)): relative fluctuations fall as 1/√N, the root of thermodynamic sharpness'
  verify:
    expect:
      v: sqrt(diff(N*log(1 - nsimplify(p) + nsimplify(p)*exp(Symbol('tt'))), Symbol('tt'), 2).subs(Symbol('tt'), 0))
- template: td-trials-for-atleast
  skill: stat.probability
  pace: quick
  given:
    p:
      pick:
      - 0.01
      - 0.05
      - 0.1
      - 0.3
    P:
      pick:
      - 50
      - 90
      - 99
  prompt: Each independent trial succeeds with probability {{p}}. How many trials are needed for at least a {{P}}% chance of one or more successes?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: ceil(log(1 - P/100)/log(1 - p))
    final: true
    tol: 0.0001
    explain: 'P(none) = (1 − p)ⁿ must fall below 1 − P: rare events need about ln(1/(1−P))/p tries'
  verify:
    expect:
      v: ceiling(log(1 - Rational(P, 100))/log(1 - nsimplify(p)))
- template: td-two-state-entropy
  skill: stat.multiplicity
  pace: quick
  given:
    N:
      pick:
      - 10
      - 20
      - 50
    n:
      int:
      - 1
      - 10
  prompt: N = {{N}} independent two-state units have n = {{n}} in the upper state. What is S/k = ln W?
  parts:
  - ask: Answer
    label: v
    tex: S/k
    value: log(factorial(N)/(factorial(n)*factorial(N - n)))
    tol: 0.005
    explain: W = N!/(n!(N − n)!); for large N Stirling gives S/k ≈ −N[f ln f + (1 − f) ln(1 − f)]
  verify:
    expect:
      v: log(binomial(N, n))
- template: td-einstein-entropy-stirling
  skill: stat.multiplicity
  pace: quick
  given:
    N:
      pick:
      - 100
      - 1000
    q:
      pick:
      - 100
      - 500
      - 2000
  prompt: An Einstein solid has N = {{N}} oscillators and q = {{q}} quanta. Using Stirling's large-number form S/k ≈ (q + N) ln(q + N) − q ln q − N ln N, estimate S/k.
  parts:
  - ask: Answer
    label: v
    tex: S/k
    value: (q + N)*log(q + N) - q*log(q) - N*log(N)
    tol: 0.005
    explain: Exact W = C(q + N − 1, q); Stirling's form is what gives the temperature 1/T = ∂S/∂U
  verify:
    expect:
      v: (q + N)*log(q + N) - q*log(q) - N*log(N)
- template: td-mixing-entropy-lattice

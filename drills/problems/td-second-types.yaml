      pick:
      - 1
      - 2
  prompt: A system has U = {{U}} J, T = {{T}} K, S = {{S}} J/K, P = {{P}} kPa, V = {{V}} L and N = {{N}} mol. What is μ from the Euler relation, in J/mol?
  parts:
  - ask: Answer
    label: v
    tex: \mu
    value: (U - T*S + P*V)/N
    tol: 0.005
    explain: 'U = TS − PV + μN: for a one-component system μ = G/N'
  verify:
    expect:
      v: solve(Eq(U, T*S - P*V + x*N), x)[0]

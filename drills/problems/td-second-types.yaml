- template: td-most-probable-split
  skill: stat.multiplicity
  pace: quick
  given:
    N:
      pick:
      - 2
      - 3
      - 5
    q:
      pick:
      - 4
      - 6
      - 8
  prompt: Two identical Einstein solids, each of N = {{N}} oscillators, share q = {{q}} quanta. What fraction of all microstates has the quanta split exactly evenly?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: (combinations(q/2 + N - 1, q/2))^2/combinations(q + 2*N - 1, q)
    tol: 0.005
    explain: 'The even split is the most probable, and its share sharpens as the solids grow: that is why heat flows until T matches'
  verify:
    expect:
      v: binomial(q/2 + N - 1, q/2)**2/binomial(q + 2*N - 1, q)

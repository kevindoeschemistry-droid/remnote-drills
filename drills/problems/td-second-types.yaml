    value: exp(bm - e)/(1 + exp(bm - e))
    tol: 0.005
    explain: 'Grand canonical weights e^{−β(ε − μ)N}: occupancy rises with the reservoir''s chemical potential'
  verify:
    expect:
      v: exp(bm - e)/summation(exp(Symbol('n')*(bm - e)), (Symbol('n'), 0, 1))
- template: td-lattice-coverage-variance
  skill: stat.ensembles
  pace: quick
  given:
    M:
      pick:
      - 10
      - 100
      - 1000
    p:
      pick:
      - 0.1
      - 0.5
      - 0.9
  prompt: M = {{M}} independent sites each have occupancy probability p = {{p}}. What is the variance of the number bound?
  parts:
  - ask: Answer
    label: v
    tex: \langle\delta N^2\rangle
    value: M*p*(1 - p)
    tol: 0.005
    explain: 'Independent sites: ⟨δN²⟩ = kT ∂⟨N⟩/∂μ = Mp(1 − p), largest at half coverage'
  verify:
    expect:
      v: M*(nsimplify(p) - nsimplify(p)**2)
- template: td-ideal-gas-n-fluct
  skill: stat.ensembles
  pace: quick
  given:
    N:
      pick:
      - 100
      - 10000
      - 1000000
  prompt: An open sub-volume of an ideal gas holds on average ⟨N⟩ = {{N}} molecules. What is the rms fluctuation in N?
  parts:
  - ask: Answer
    label: v
    tex: \sigma_N
    value: sqrt(N)
    tol: 0.005
    explain: 'Poisson statistics: ⟨δN²⟩ = ⟨N⟩ for an ideal gas, linked to κ_T by ⟨δN²⟩/⟨N⟩ = ρkTκ_T'
  verify:
    expect:
      v: sqrt(N)
- template: td-isobaric-volume-weight
  skill: stat.ensembles
  pace: quick
  given:
    de:
      pick:
      - 1
      - 2
      - 5
    dv:
      pick:
      - -50
      - -20
      - -10
  prompt: Two conformations differ by Δε = {{de}} kJ/mol and Δv = {{dv}} cm³/mol. At what pressure, in MPa, are they equally populated at 298 K?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: -de*1000/(dv*1e-6)/1e6
    tol: 0.005
    explain: 'Isobaric weight e^{−β(ε + Pv)}: pressure favours the smaller volume, as in pressure denaturation of proteins'
  verify:
    expect:
      v: solve(Eq(de*1000 + x*10**6*nsimplify(dv)/10**6, 0), x)[0]
- template: td-gibbs-entropy-uniform
  skill: stat.ensembles
  pace: quick
  given:
    W:
      pick:
      - 3
      - 4
      - 10
    f:
      pick:
      - 2
      - 5
  prompt: A system has {{W}} microstates, occupied with probabilities proportional to 1, 1, …, and one state {{f}} times more likely than the others. What is S/k = −Σ p ln p?
  parts:
  - ask: Answer
    label: v
    tex: S/k
    value: -( f/(W - 1 + f)*log(f/(W - 1 + f)) + (W - 1)/(W - 1 + f)*log(1/(W - 1 + f)) )
    tol: 0.005
    explain: Uneven probabilities lower S below ln W, the uniform (microcanonical) maximum
  verify:
    expect:
      v: -(Rational(f, W - 1 + f)*log(Rational(f, W - 1 + f)) + (W - 1)*Rational(1, W - 1 + f)*log(Rational(1, W - 1 + f)))
- template: td-kd-from-occupancy
  skill: stat.binding
  pace: quick
  given:
    th:
      pick:
      - 20
      - 50
      - 80
      - 90
    L:
      pick:
      - 1
      - 10
      - 50
  prompt: A receptor is {{th}}% occupied at {{L}} μM free ligand. What is K_d, in μM?
  parts:
  - ask: Answer
    label: v
    tex: K_d
    value: L*(1 - th/100)/(th/100)
    tol: 0.005
    explain: 'θ = L/(L + K_d): K_d is the ligand concentration at half occupancy'
  verify:
    expect:
      v: solve(Eq(nsimplify(L)/(nsimplify(L) + x), Rational(th, 100)), x)[0]
- template: td-coverage-ratio
  skill: stat.binding
  pace: quick
  given:
    th:
      pick:
      - 10
      - 30
      - 50
    P:
      pick:
      - 1
      - 2
    P2:
      pick:
      - 5
      - 10
  prompt: A Langmuir surface is {{th}}% covered at {{P}} bar. What coverage does it have at {{P2}} bar?
  parts:
  - ask: Answer
    label: v
    tex: \theta_2
    value: (th/100/(1 - th/100)/P*P2)/(1 + th/100/(1 - th/100)/P*P2)
    tol: 0.005
    explain: One data point fixes K; then coverage saturates toward 1 as pressure grows
  verify:
    expect:
      v: (Symbol('KK')*P2/(1 + Symbol('KK')*P2)).subs(Symbol('KK'), solve(Eq(Symbol('KK')*P/(1 + Symbol('KK')*P), Rational(th, 100)), Symbol('KK'))[0])
- template: td-kd-from-dg
  skill: stat.binding
  pace: quick
  given:
    dG:
      pick:
      - -30
      - -40
      - -50
      - -60
  prompt: A ligand binds with ΔG° = {{dG}} kJ/mol (1 M standard state) at 298 K. What is K_d, in nM?
  parts:
  - ask: Answer
    label: v
    tex: K_d
    value: exp(dG*1000/(8.314*298))*1e9
    tol: 0.005
    explain: 'K_d = exp(ΔG°/RT): every 5.7 kJ/mol is a factor of ten; −50 kJ/mol is nanomolar-strength binding'
  verify:
    expect:
      v: exp(dG*1000/(Rational(8314, 1000)*298))*10**9
- template: td-cooperative-two-site
  skill: stat.binding
  pace: quick
  given:
    w:
      pick:
      - 0.1
      - 1
      - 10
    xv:
      pick:
      - 0.5
      - 1
      - 2
  prompt: A two-site molecule has site constant K (each) and pairwise interaction factor ω = {{w}}. At KL = {{xv}}, what fraction of molecules has both sites filled?
  parts:
  - ask: Answer
    label: v
    tex: p_2
    value: w*xv^2/(1 + 2*xv + w*xv^2)
    tol: 0.005
    explain: 'Binding polynomial 1 + 2KL + ωK²L²: ω > 1 is positive cooperativity, filling both sites together'
  verify:
    expect:
      v: (nsimplify(w)*nsimplify(xv)**2)/summation(binomial(2, Symbol('n'))*nsimplify(xv)**Symbol('n')*nsimplify(w)**(Symbol('n')*(Symbol('n') - 1)/2), (Symbol('n'), 0, 2))
- template: td-hill-ligand
  skill: stat.binding
  pace: quick
  given:
    n:
      pick:
      - 1
      - 2.8
      - 4
    K:
      pick:
      - 5
      - 26
    f:
      pick:
      - 10
      - 50
      - 90
  prompt: A Hill-type binder (n = {{n}}, K_{1/2} = {{K}} μM) must be {{f}}% saturated. What free ligand concentration, in μM?
  parts:
  - ask: Answer
    label: v
    tex: L
    value: K*(f/(100 - f))^(1/n)
    tol: 0.005
    explain: 'Steep binders (large n) go from 10% to 90% over a narrow range: hemoglobin''s oxygen switch'
  verify:
    expect:
      v: solve(Eq(log(x/nsimplify(K))*nsimplify(n), log(Rational(f, 100 - f))), x)[0]
- template: td-hill-range
  skill: stat.binding
  pace: quick
  given:
    n:
      pick:
      - 1
      - 2
      - 2.8
      - 4
  prompt: By what factor must the ligand concentration rise to take a Hill binder with n = {{n}} from 10% to 90% saturation?
  parts:
  - ask: Answer
    label: v
    tex: L_{90}/L_{10}
    value: 81^(1/n)
    tol: 0.005
    explain: Non-cooperative binding needs an 81-fold rise; n = 4 needs only 3-fold
  verify:
    expect:
      v: (9/Rational(1, 9))**(1/nsimplify(n))
- template: td-ea-rule-of-thumb
  skill: stat.rates
  pace: quick
  given:
    T:
      pick:
      - 298
      - 310
      - 350
  prompt: A rate doubles for a 10 K rise near {{T}} K. What activation energy does that imply, in kJ/mol? (R = 8.314)
  parts:
  - ask: Answer
    label: v
    tex: E_a
    value: 8.314*log(2)/(1/T - 1/(T + 10))/1000
    tol: 0.005
    explain: The 'rate doubles every 10 °C' rule corresponds to about 50 kJ/mol near room temperature
  verify:
    expect:
      v: solve(Eq(log(2), x*1000/Rational(8314, 1000)*(Rational(1, T) - Rational(1, T + 10))), x)[0]
- template: td-temperature-for-rate
  skill: stat.rates
  pace: quick
  given:
    Ea:
      pick:
      - 50
      - 80
    k1:
      pick:
      - 0.001
      - 0.01
    T1:
      pick:
      - 300
    k2:
      pick:
      - 0.1
      - 1
  prompt: A reaction has E_a = {{Ea}} kJ/mol and k = {{k1}} s⁻¹ at {{T1}} K. At what temperature, in K, does k reach {{k2}} s⁻¹? (R = 8.314)
  parts:
  - ask: Answer
    label: v
    tex: T_2
    value: 1/(1/T1 - 8.314*log(k2/k1)/(Ea*1000))
    tol: 0.005
    explain: 'Invert the Arrhenius ratio: higher E_a means a smaller temperature rise for the same speed-up'
  verify:
    expect:
      v: solve(Eq(log(nsimplify(k2)/nsimplify(k1)), -Ea*1000/Rational(8314, 1000)*(1/x - Rational(1, T1))), x)[0]
- template: td-ea-from-factor
  skill: stat.rates
  pace: quick
  given:
    f:
      pick:
      - 2
      - 5
      - 10
    T1:
      pick:
      - 300
    T2:
      pick:
      - 320
      - 350
  prompt: A rate rises by a factor {{f}} between {{T1}} and {{T2}} K. What is E_a, in kJ/mol? (R = 8.314)
  parts:
  - ask: Answer
    label: v
    tex: E_a
    value: 8.314*log(f)/(1/T1 - 1/T2)/1000
    tol: 0.005
    explain: ln(k₂/k₁) = (E_a/R)(1/T₁ − 1/T₂)
  verify:
    expect:
      v: solve(Eq(log(nsimplify(f)), x*1000/Rational(8314, 1000)*(Rational(1, T1) - Rational(1, T2))), x)[0]
- template: td-eyring-half-life
  skill: stat.rates
  pace: quick
  given:
    dG:
      pick:
      - 60
      - 80
      - 100
  prompt: 'A first-order reaction has ΔG‡ = {{dG}} kJ/mol at 298 K. What is its half-life, in s? (Eyring: k = (k_BT/h)e^{−ΔG‡/RT}; k_BT/h = 6.21 × 10¹² s⁻¹)'
  parts:
  - ask: Answer
    label: v
    tex: t_{1/2}
    value: log(2)/(1.380649e-23*298/6.62607015e-34*exp(-dG*1000/(8.314*298)))
    tol: 0.005
    explain: 'Each 5.7 kJ/mol of barrier is a factor of ten in time: 80 kJ/mol is about an hour'
  verify:
    expect:
      v: log(2)/(Rational(1380649, 10**29)*298/Rational(662607015, 10**42)*exp(-dG*1000/(Rational(8314, 1000)*298)))
- template: td-dh-ds-split
  skill: stat.rates
  pace: quick
  given:
    s:
      pick:
      - -5000
      - -8000
      - -12000
  prompt: An Eyring plot of ln(k/T) against 1/T has slope {{s}} K. What is ΔH‡, in kJ/mol? (R = 8.314)
  parts:
  - ask: Answer
    label: v
    tex: \Delta H^\ddagger
    value: -s*8.314/1000
    tol: 0.005
    explain: 'ln(k/T) = ln(k_B/h) + ΔS‡/R − ΔH‡/RT: the slope gives ΔH‡, the intercept ΔS‡'
  verify:
    expect:
      v: diff(-(-nsimplify(s)*Rational(8314, 1000))/(Rational(8314, 1000)*Symbol('TT')), 1/Symbol('TT')) if False else -nsimplify(s)*Rational(8314, 1000)/1000
- template: td-reverse-rate
  skill: stat.rates
  pace: quick
  given:
    kf:
      pick:
      - 0.1
      - 5
      - 100
    K:
      pick:
      - 0.01
      - 1
      - 1000
  prompt: A reaction has forward k_f = {{kf}} s⁻¹ and equilibrium constant K = {{K}}. What is the reverse rate constant, in s⁻¹?
  parts:
  - ask: Answer
    label: v
    tex: k_r
    value: kf/K
    tol: 0.005
    explain: 'Detailed balance: K = k_f/k_r. A catalyst speeds both directions by the same factor and leaves K unchanged'
  verify:
    expect:
      v: solve(Eq(nsimplify(kf)/x, nsimplify(K)), x)[0]
- template: td-nernst-concentration
  skill: thermo.chemical-equilibrium
  pace: quick
  given:
    n:
      pick:
      - 1
      - 2
    f:
      pick:
      - 10
      - 100
      - 0.1
  prompt: A cell reaction transfers n = {{n}} electrons; Q changes by a factor of {{f}}. By how many mV does E change at 298 K? (F = 96485)
  parts:
  - ask: Answer
    label: v
    tex: \Delta E
    value: -8.314*298/(n*96485)*log(f)*1000
    tol: 0.005
    explain: 59.2/n mV per decade of Q at 25 °C
  verify:
    expect:
      v: -Rational(8314, 1000)*298/(n*96485)*log(nsimplify(f))*1000
- template: td-flory-huggins-critical
  skill: thermo.solutions
  pace: quick
  given:
    N:
      pick:
      - 1
      - 100
      - 1000
      - 10000
  prompt: A polymer of N = {{N}} segments dissolves in a small-molecule solvent. What is the critical χ for phase separation?
  parts:
  - ask: Answer
    label: v
    tex: \chi_c
    value: 0.5*(1 + 1/sqrt(N))^2
    tol: 0.005
    explain: 'χ_c → ½ for long chains: polymers demix at much weaker repulsion than small molecules (χ_c = 2 at N = 1)'
  verify:
    expect:
      v: (Rational(1, 2)*(1 + 1/sqrt(N))**2)
- template: td-metropolis-average
  skill: stat.ensembles
  pace: quick
  given:
    e:
      pick:
      - 0.5
      - 1
      - 2
      - 4
  prompt: A Metropolis run visits two states with energies 0 and {{e}} kT. In a long run, what fraction of samples should be in the higher state?
  parts:
  - ask: Answer
    label: v
    tex: p_1
    value: exp(-e)/(1 + exp(-e))
    tol: 0.005
    explain: Metropolis satisfies detailed balance with the Boltzmann distribution, so sample frequencies converge to canonical probabilities
  verify:
    expect:
      v: 1/(1 + exp(nsimplify(e)))

# Second question types; keys recomputed by sympy along another route.

- template: cpd-loop-closure
  skill: design.sampling
  pace: recall
  cases:
  - q: 'A loop-closure method must guarantee that the rebuilt loop:'
    o1: Still connects to the fixed residues at both ends
    o2: Has the lowest possible energy
    o3: Is a helix
    o4: Keeps its original sequence
  - q: 'Loops are modelled separately from helices and sheets because they are:'
    o1: Irregular and flexible, so regular geometry does not describe them
    o2: Always buried
    o3: Shorter than other elements
    o4: Not scored by the energy function
  - q: 'Kinematic closure works by:'
    o1: Solving for the dihedrals that close the chain, then sampling the rest
    o2: Minimising from a random start and hoping it closes
    o3: Grafting a loop from a template without changes
    o4: Deleting the loop
  - q: 'A designed loop that models well but is disordered in the crystal suggests:'
    o1: The loop is genuinely flexible, which the fixed model did not capture
    o2: The sequence was wrong
    o3: The closure failed
    o4: The density was misread
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Closure is a hard constraint; flexibility is the reason loops stay hard
  verify:
    authored: true
- template: cpd-loop-dof
  skill: design.sampling
  pace: quick
  given:
    n:
      pick:
      - 6
      - 8
      - 12
    c:
      pick:
      - 6
  prompt: A {{n}}-residue loop is rebuilt. Its backbone has two free dihedrals per residue, and closure consumes {{c}} of them. How many free backbone degrees of freedom remain?
  parts:
  - ask: Answer
    label: v
    tex: DOF
    value: 2*n - c
    final: true
    tol: 0.0001
    explain: Closing a chain at a fixed end point and orientation uses up six degrees of freedom, which is why kinematic closure solves for six torsions and samples the rest
  verify:
    expect:
      v: 2*n - c
- template: cpd-symmetry
  skill: design.representation
  pace: recall
  cases:
  - q: 'In a symmetric model, moves and energies are applied to:'
    o1: One asymmetric unit, then replicated by the symmetry definition
    o2: Every chain independently
    o3: Only the largest chain
    o4: The whole assembly atom by atom
  - q: 'Exact symmetry is imposed in design because it:'
    o1: Cuts the search to one unit and makes one designed interface repeat
    o2: Lowers the energy automatically
    o3: Removes the need for packing
    o4: Guarantees the fold
  - q: 'A symmetric homo-oligomer design assumes:'
    o1: Every subunit has the same sequence and conformation
    o2: Subunits differ in sequence
    o3: Only the backbone is shared
    o4: There is no interface
  - q: 'Designing a nanocage exploits symmetry so that:'
    o1: A small designed interface builds a large closed assembly
    o2: No energy function is needed
    o3: The subunits can be different proteins
    o4: Loops need no modelling
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Symmetry is a constraint that buys search space and repeats one solution
  verify:
    authored: true

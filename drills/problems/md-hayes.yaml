    o1: Spatial — the surrounding structure has to rearrange — rather than alchemical
    o2: Always alchemical
    o3: The timestep
    o4: The box volume
  - q: 'A symptom that flattening alone will not fix the sampling is:'
    o1: Biases that converge but end-state populations that still depend on the starting structure
    o2: A nan in the first cycle
    o3: A slow queue
    o4: A large box
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Flattening handles alchemical barriers; a spatial barrier needs exchange, which is why four of the seven T4 lysozyme sites were enough for the exercise and three were not
  verify:

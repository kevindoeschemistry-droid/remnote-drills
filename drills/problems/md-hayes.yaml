# Generated by scripts/second_types.py from scripts/second_specs/md2.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: mdh-which-file
  skill: md.forcefields
  pace: recall
  cases:
  - q: Which file says that a residue's CB-CG bond has an equilibrium length of 1.53 angstrom?
    o1: The parameter file (.prm)
    o2: The topology file (.rtf)
    o3: The structure file (.psf)
    o4: The coordinate file (.crd)
  - q: Which file says which atoms exist in a residue and how they are connected?
    o1: The topology file (.rtf)
    o2: The parameter file (.prm)
    o3: The coordinate file (.crd)
    o4: The stream file (.str)
  - q: Which file holds the whole system's atom, bond, angle and dihedral list after patching?
    o1: The structure file (.psf)
    o2: The topology file (.rtf)
    o3: The parameter file (.prm)
    o4: The coordinate file (.crd)
  - q: Which file is preferred over a PDB for coordinates in CHARMM, because PDB has an atom-count limit?
    o1: The coordinate file (.crd)
    o2: The structure file (.psf)
    o3: The parameter file (.prm)
    o4: The topology file (.rtf)
  - q: What does toppar.str do?
    o1: Streams the list of topology and parameter files to read
    o2: Holds the coordinates
    o3: Holds the box size
    o4: Runs the dynamics
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: 'Roughly: the RTF says which terms are in the energy function, the PRM says what the constants in them are, and the PSF is the assembled system'
  verify:
    authored: true
- template: mdh-param-origin
  skill: md.forcefields
  pace: recall
  cases:
  - q: A protein force field's partial charges are usually fitted to what?
    o1: Quantum interaction energies with water, and condensed-phase properties
    o2: Crystal structures alone
    o3: Vibrational frequencies alone
    o4: 'Nothing: they are formal charges'
  - q: Why can a water model not be swapped freely between force fields?
    o1: The protein parameters were fitted alongside one water model, so the balance is lost
    o2: Water models are proprietary
    o3: They have different numbers of atoms, which CHARMM forbids
    o4: They use different units
  - q: 'Torsion parameters are generally fitted last because they:'
    o1: Absorb the residual error once nonbonded and bonded terms are set
    o2: Are the least important
    o3: Cannot be computed
    o4: Are taken from experiment
  - q: 'A force field''s accuracy for a property it was never fitted to is:'
    o1: An extrapolation that has to be tested, not assumed
    o2: Guaranteed by transferability
    o3: Exact
    o4: Irrelevant
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'A force field is a fitted, balanced set: the parameters are not independently meaningful, which is why mixing sources is risky'
  verify:
    authored: true
- template: mdh-penalty-decide
  skill: md.forcefields
  pace: quick
  given:
    cp:
      pick:
      - 3
      - 12
      - 45
      - 120
      - 260
    pp:
      pick:
      - 0
      - 8
      - 55
      - 90
  prompt: A CGenFF assignment reports a charge penalty of {{cp}} and a parameter penalty of {{pp}}. On the usual reading (under 10 fine, 10-50 worth checking, over 50 needs reparameterisation), how many of the two exceed 50?
  parts:
  - ask: Answer
    label: v
    tex: count
    value: '(cp > 50 ? 1 : 0) + (pp > 50 ? 1 : 0)'
    final: true
    tol: 0.0001
    explain: 'The penalties are the program''s own confidence, not an error bar: a high one means the analogy it used was poor and the parameter needs quantum validation'
  verify:
    expect:
      v: (1 if cp > 50 else 0) + (1 if pp > 50 else 0)
- template: mdh-pbc-artifacts
  skill: md.boundaries
  pace: recall
  cases:
  - q: Why are periodic boundaries preferred to a droplet of water?
    o1: A droplet has a surface, and surface water distorts the solute
    o2: Periodic boundaries have no artifacts
    o3: Droplets are more expensive
    o4: Droplets cannot be simulated
  - q: Which case needs more padding than the usual 10 angstrom?
    o1: A strongly charged molecule such as RNA
    o2: A small neutral peptide
    o3: A rigid protein
    o4: A lipid tail
  - q: 'A periodic artifact that remains however large the box is made:'
    o1: 'None: they shrink with box size, which is how you test for them'
    o2: Self-interaction of the net charge
    o3: Surface tension
    o4: The Jacobian
  - q: 'The standard test for a periodic artifact is to:'
    o1: Repeat the calculation in a larger box and see whether the answer moves
    o2: Change the force field
    o3: Lower the temperature
    o4: Remove the ions
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Both choices have artifacts; periodic ones are smaller and, unlike a surface, they can be tested by changing the box
  verify:
    authored: true
- template: mdh-box-edge
  skill: md.prep
  pace: quick
  given:
    ext:
      pick:
      - 34
      - 42
      - 55
      - 61
    pad:
      pick:
      - 10
      - 12
      - 15
  prompt: A protein's longest extent is {{ext}} angstrom. With an edge distance of {{pad}} angstrom of water on each side, what cubic box edge is needed (angstrom)?
  parts:
  - ask: Answer
    label: v
    tex: L
    value: ext + 2*pad
    final: true
    tol: 0.0001
    explain: Ten angstrom each side is the usual choice, which puts 20 angstrom between periodic images of the solute; the unfolded pentapeptide boxes are instead fixed (40 angstrom) because the peptide's extent fluctuates
  verify:
    expect:
      v: ext + 2*pad
- template: mdh-stage-purpose
  skill: md.prep
  pace: recall
  cases:
  - q: Why is the first equilibration run at constant volume rather than constant pressure?
    o1: The added water has to relax before the box size means anything
    o2: Constant pressure is slower
    o3: The barostat is unavailable
    o4: The temperature is wrong at constant pressure
  - q: What is relaxed in the second, constant-pressure stage?
    o1: The box volume, and so the density
    o2: The protonation states
    o3: The force field
    o4: The timestep
  - q: 'Restraints on the solute during early equilibration are there to:'
    o1: Let solvent relax without the solute drifting from the starting structure
    o2: Speed up the integrator
    o3: Fix the temperature
    o4: Remove the need for minimisation
  - q: 'Minimisation before dynamics is needed because:'
    o1: A bad contact in the starting structure would give a huge force and crash the integrator
    o2: It equilibrates the temperature
    o3: It sets the density
    o4: It assigns velocities
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Each stage relaxes one thing that the next stage assumes: contacts, then solvent, then volume'
  verify:
    authored: true
- template: mdh-equil-signal
  skill: md.prep
  pace: recall
  cases:
  - q: 'The density is still drifting upward at the end of the constant-pressure run. The reading:'
    o1: Equilibration is not finished; extend it before production
    o2: It is converged, since the temperature is stable
    o3: The barostat is broken
    o4: The force field is wrong
  - q: Which observable is slowest to equilibrate in a solvated protein?
    o1: Water in buried pockets and side-chain packing
    o2: The instantaneous temperature
    o3: The total energy
    o4: The box angles
  - q: 'Equilibration should be judged on:'
    o1: The property the study will report, not just energy and temperature
    o2: The total energy alone
    o3: The temperature alone
    o4: Wall-clock time
  - q: 'Crystallographic waters are often kept because:'
    o1: Buried water relaxes slowly, so added water may take a long time to fill those pockets
    o2: They are cheaper than added water
    o3: CHARMM-GUI requires them
    o4: They set the density
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'A flat energy trace is necessary, not sufficient: the slow coordinate is usually the one the study cares about'
  verify:
    authored: true
- template: mdh-bootstrap-width
  skill: md.analysis
  pace: quick
  given:
    nb:
      pick:
      - 200
      - 1000
      - 5000
    sd:
      pick:
      - 0.12
      - 0.3
      - 0.45
      - 0.8
  prompt: A bootstrap over {{nb}} resamples gives a derived quantity whose resampled values have a standard deviation of {{sd}} kcal/mol. What is the width of the symmetric 95 percent interval (kcal/mol), using 1.96 standard deviations?
  parts:
  - ask: Answer
    label: v
    tex: width
    value: 2*1.96*sd
    tol: 0.005
    explain: The resample count sets how finely the percentiles are resolved, not the width; the width comes from the spread, and for correlated data the resampling must be done on blocks
  verify:
    expect:
      v: 2*Rational(196, 100)*nsimplify(sd)
- template: mdh-hidden-error
  skill: md.analysis
  pace: recall
  cases:
  - q: 'Five independent runs agree to 0.05 kcal/mol but disagree with experiment by 3 kcal/mol. The likely cause:'
    o1: A systematic error — force field, protonation or construct — that no error bar reveals
    o2: Too few samples
    o3: A bad random seed
    o4: The estimator
  - q: 'A tight error bar from one long run can still be wrong because:'
    o1: The run may never have left one basin, so its average is of that basin
    o2: Error bars are always wrong
    o3: Long runs drift
    o4: The integrator loses energy
  - q: 'The cheapest check for a trapped run is:'
    o1: Independent runs from different starting structures
    o2: A longer run from the same start
    o3: A smaller timestep
    o4: A larger box
  - q: 'Statistical uncertainty tells you:'
    o1: How much the answer would move if you sampled more of the same ensemble
    o2: How close the answer is to the truth
    o3: Whether the force field is right
    o4: Whether the protonation is right
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The error bar measures the sampling, not the model; only a different starting point or a different model exposes the rest
  verify:
    authored: true
- template: mdh-bar-shift
  skill: md.free-energy
  pace: quick
  given:
    nf:
      pick:
      - 200
      - 500
      - 1000
    nr:
      pick:
      - 200
      - 800
      - 2000
  prompt: In BAR's self-consistent condition, the forward and reverse Fermi-weighted counts are equal. With {{nf}} forward and {{nr}} reverse samples, what offset (in kT) does the equal-sample-count term contribute, as ln of the ratio of reverse to forward counts?
  parts:
  - ask: Answer
    label: v
    tex: \ln(n_r/n_f)
    value: log(nr/nf)
    tol: 0.005
    explain: BAR carries the sample-count ratio explicitly, which is part of why it is the maximum-likelihood estimator for two states while a one-sided exponential average is not
  verify:
    expect:
      v: log(Rational(nr, nf))
- template: mdh-mbar-relations
  skill: md.free-energy
  pace: recall
  cases:
  - q: 'MBAR applied to exactly two states reduces to:'
    o1: BAR
    o2: WHAM
    o3: Thermodynamic integration
    o4: The Zwanzig relation
  - q: 'WHAM is recovered from MBAR when:'
    o1: The energies are binned into a histogram along a coordinate
    o2: There are two states
    o3: The samples are uncorrelated
    o4: The states are equally spaced
  - q: 'MBAR''s inputs are:'
    o1: The energy of every sample evaluated in every state
    o2: Only each sample's own state energy
    o3: The free energies
    o4: The overlap matrix
  - q: 'MBAR needs uncorrelated samples because:'
    o1: Its uncertainty estimate assumes independence, so correlated input understates the error
    o2: It cannot run otherwise
    o3: Correlated samples bias the free energy badly
    o4: It is a histogram method
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'One estimator, read three ways: two states give BAR, binning gives WHAM, and the general case reweights every sample to every state'
  verify:
    authored: true
- template: mdh-overlap-worst
  skill: md.free-energy
  pace: quick
  cases:
  - v1: 0.21
    v2: 0.02
    v3: 0.18
    v4: 0.004
  - v1: 0.09
    v2: 0.11
    v3: 0.07
    v4: 0.14
  - v1: 0.3

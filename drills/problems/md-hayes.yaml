    v3: 0.26
    v4: 0.22
  - v1: 0.012
    v2: 0.008
    v3: 0.02
    v4: 0.05
  prompt: An MBAR overlap matrix has nearest-neighbour overlaps {{v1}}, {{v2}}, {{v3}} and {{v4}} between consecutive lambda states. How many of the four fall below the usual 0.03 threshold?
  parts:

    o4: Need replica exchange
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Coupling is a property of the structure: sites that touch need their joint landscape flattened, sites that do not can be treated independently'
  verify:
    authored: true
- template: mdh-potts-estimator
  skill: md.lambda
  pace: recall
  cases:
  - q: 'The Potts-model estimator is preferred to counting end-state populations when:'
    o1: The combinatorial space is too large for every combination to be visited
    o2: There are two substituents
    o3: The run is short
    o4: The biases are converged
  - q: 'The histogram estimator fails in a large space because:'
    o1: Most combinations have zero counts, so their free energies are undefined
    o2: It is biased
    o3: It is slow
    o4: It needs the biases
  - q: 'The Potts model assumes the free energy is:'
    o1: A sum of per-site terms plus pairwise couplings
    o2: Exactly additive with no couplings
    o3: A single global constant
    o4: Independent of the sites
  - q: 'Pseudolikelihood is used instead of full likelihood because:'
    o1: The full likelihood's normalisation is intractable for many sites
    o2: It is more accurate
    o3: It needs fewer samples
    o4: It avoids the couplings
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: A model estimator buys coverage of unvisited combinations at the price of its own assumption, so the assumption has to be checked
  verify:
    authored: true
- template: mdh-partition-sites
  skill: md.lambda
  pace: quick
  given:
    tot:
      pick:
      - 12
      - 20
      - 25
      - 40
    cap:
      pick:
      - 8
      - 12
      - 20
  require:
  - tot > cap
  prompt: A design needs {{tot}} substituents at one site, and a single simulation is held to at most {{cap}} substituents there. How many simulations does the site need, if one substituent must be the shared native in every one?
  parts:
  - ask: Answer
    label: v
    tex: runs
    value: ceil((tot - 1)/(cap - 1))
    final: true
    tol: 0.0001
    explain: The native has to appear in every batch so the batches can be referenced to each other, so each batch adds only cap minus one new substituents; the per-site cap depends on the bias scheme and implicit constraint chosen
  verify:
    expect:
      v: ceiling(Rational(tot - 1, cap - 1))
- template: mdh-charge-change
  skill: md.lambda
  pace: recall
  cases:
  - q: 'A charge-changing perturbation in a periodic box suffers from:'
    o1: A finite-size error, because the neutralising background interacts with the solute
    o2: No special error
    o3: A barostat failure
    o4: A SHAKE failure
  - q: 'The software''s correction for this is applied by:'
    o1: Declaring each substituent's charge so the discrete solvent correction can be computed
    o2: Adding a counterion by hand
    o3: Enlarging the box only
    o4: 'Nothing: it cancels'
  - q: 'The finite-size error shrinks with box size as:'
    o1: Roughly the inverse of the box length, which is why it is slow to converge away
    o2: Exponentially
    o3: Not at all
    o4: The inverse square of the atom count
  - q: 'A relative calculation between two ligands of equal net charge:'
    o1: Avoids the correction entirely, which is a reason to pair perturbations that way
    o2: Still needs it
    o3: Needs a larger correction
    o4: Cannot be run
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The correction is cheap and the box-size route is not, so declare the charges; better still, design the network so net charge does not change
  verify:
    authored: true
- template: mdh-when-rex
  skill: md.lambda
  pace: recall
  cases:
  - q: Which sites in the T4 lysozyme exercise needed replica exchange for converged free energies?
    o1: A42, A98 and M102
    o2: L99, M106, V149 and F153
    o3: All seven
    o4: None
  - q: 'Biasing-potential replica exchange helps by:'

- template: mdh-pro-gly
  skill: md.lambda
  pace: recall
  cases:
  - q: Why do proline mutations need a dedicated alchemical strategy?
    o1: Proline's ring closes the backbone, so the mutation changes backbone connectivity, not just a side chain
    o2: Proline is charged
    o3: Proline is too large
    o4: Proline has no side chain
  - q: Why is glycine a special case?
    o1: It removes the side chain entirely, including atoms the common core would otherwise share
    o2: It is the smallest residue
    o3: It is achiral
    o4: It cannot be mutated
  - q: 'A standard side-chain-only perturbation scheme assumes:'
    o1: A shared backbone that every substituent keeps unchanged
    o2: A shared side chain
    o3: Equal net charge
    o4: A single site
  - q: 'The T4 lysozyme exercise is described as side-chain only, which means:'
    o1: Proline and glycine substituents are outside its scope
    o2: No backbone atoms exist
    o3: Only one site is mutated
    o4: The protein is rigid
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The common core is the backbone; proline and glycine break that assumption in opposite directions, so each needs its own treatment
  verify:
    authored: true

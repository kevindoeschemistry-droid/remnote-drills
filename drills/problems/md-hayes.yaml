- template: mdh-schedule-order
  skill: md.free-energy
  pace: recall
  cases:
  - q: When deleting an atom, which interaction is switched off first?
    o1: The charges, while the Lennard-Jones is still on
    o2: The Lennard-Jones, while the charges are still on
    o3: Both together
    o4: The bonded terms
  - q: 'Turning off charges before Lennard-Jones avoids:'
    o1: A bare charge with no repulsive core, which collapses solvent onto it
    o2: An endpoint catastrophe in the bonded terms
    o3: A barostat failure
    o4: A SHAKE failure
  - q: 'The fewest-atoms rule says to:'
    o1: Transform the smallest set of atoms that connects the two end states
    o2: Transform everything for symmetry
    o3: Insert rather than delete
    o4: Always use dual topology
  - q: 'A transformation that both inserts and deletes atoms is handled by:'
    o1: Soft-core Lennard-Jones on both sets, with charges inside the LJ window
    o2: Separate simulations with no soft core
    o3: A smaller timestep
    o4: A larger cutoff
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Charges never without LJ, soft-core for LJ, and as few atoms as the end states allow
  verify:
    authored: true
- template: mdh-softcore-finite
  skill: md.free-energy
  pace: quick
  given:
    al:
      pick:
      - 0.5
      - 1.0
    sig:
      pick:
      - 3.0
      - 3.4
      - 3.8
    lam:
      pick:
      - 0.1
      - 0.5
      - 0.9
  prompt: A soft-core potential replaces r by (alpha*sigma^6*(1-lam)^p + r^6)^(1/6). At r = 0 with alpha = {{al}}, sigma = {{sig}} angstrom, p = 1 and lam = {{lam}}, what effective separation (angstrom) does a vanishing atom see?
  parts:
  - ask: Answer
    label: v
    tex: r_{eff}
    value: (al*sig^6*(1 - lam))^(1/6)
    tol: 0.005
    explain: 'The effective separation stays finite as lambda leaves 1, so the energy and its lambda derivative stay finite: that is exactly what removes the endpoint catastrophe'
  verify:
    expect:
      v: (nsimplify(al)*nsimplify(sig)**6*(1 - nsimplify(lam)))**Rational(1, 6)
- template: mdh-topology-kinds
  skill: md.free-energy
  pace: recall
  cases:
  - q: 'Single topology transforms a methyl to a chloro by:'
    o1: Changing the atom types and charges of shared atoms, with dummies for the mismatch
    o2: Keeping both groups present and scaling them in and out
    o3: Deleting the whole ligand
    o4: Using separate simulations
  - q: 'Dual topology keeps both end states present at once, which means:'
    o1: The two groups must not interact with each other
    o2: The ligand has twice the mass
    o3: No soft core is needed
    o4: The charges cancel
  - q: 'Decoupling a ligand switches off:'
    o1: Its interactions with the environment, leaving its internal terms on
    o2: All of its interactions, internal ones included
    o3: Only its charges
    o4: Only its Lennard-Jones
  - q: 'Annihilation differs from decoupling by also:'
    o1: Switching off the ligand's internal nonbonded interactions
    o2: Keeping the environment on
    o3: Using a larger box
    o4: Requiring replica exchange
  - q: Multisite lambda dynamics is closest to which topology?
    o1: 'Multiple topology: several substituents present at one site, each scaled by its own lambda'
    o2: Single topology
    o3: Dual topology with two states
    o4: No topology
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The distinction decides what the end states mean, and a standard-state correction is needed only for the one that removes the ligand from the box
  verify:
    authored: true
- template: mdh-double-decoupling-terms
  skill: md.free-energy
  pace: recall
  cases:
  - q: In double decoupling with restraints, which term is often forgotten?
    o1: The free energy of releasing the restraint, with its standard-state correction
    o2: The solvation leg
    o3: The complex leg
    o4: The nuclear repulsion
  - q: 'The restraint in the complex leg is there to:'
    o1: Keep the ligand in the site while its interactions vanish, so the end state is well defined
    o2: Speed up the calculation
    o3: Fix the protonation
    o4: Set the density
  - q: Why is a restraint needed at all when a ligand is decoupled in the site?
    o1: A noninteracting ligand would wander out of the site and sample the whole box
    o2: The barostat would fail
    o3: SHAKE would fail
    o4: The charges would not cancel
  - q: 'The absolute binding free energy is referenced to:'
    o1: A standard state, usually 1 molar, which enters as a volume correction
    o2: The box volume
    o3: The simulation length
    o4: The number of lambda windows
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: A double-decoupling cycle is only closed once the restraint-release and standard-state terms are in it
  verify:
    authored: true
- template: mdh-relative-or-absolute
  skill: md.free-energy
  pace: recall
  cases:
  - q: 'Ranking twenty close analogues of one scaffold is best done:'
    o1: Relative, as a perturbation network among the analogues
    o2: Absolute, one ligand at a time
    o3: With a single long MD run
    o4: By docking alone
  - q: 'Comparing two chemically unrelated ligands calls for:'
    o1: Absolute calculations, since no sensible atom mapping exists
    o2: Relative, with a dummy-heavy map
    o3: A longer relative run
    o4: A larger box
  - q: 'A charge-changing modification within a series argues for:'
    o1: 'Extra care: a finite-size correction either way, and relative only if the correction is applied'
    o2: Nothing special
    o3: Absolute always, with no correction
    o4: Dropping the ligand
  - q: 'Relative calculations are usually cheaper because:'
    o1: The shared scaffold's error cancels, so less of the molecule has to be transformed
    o2: They use fewer lambda windows by definition
    o3: They need no equilibration
    o4: They avoid soft cores
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Chemical similarity is what decides: a mapping that cancels most of the system is the whole advantage of a relative calculation'
  verify:
    authored: true

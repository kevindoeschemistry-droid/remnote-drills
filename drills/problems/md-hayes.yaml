- template: mdh-lambda-extended
  skill: md.lambda
  pace: recall
  cases:
  - q: 'In lambda dynamics, lambda is:'
    o1: An extra dynamical variable with its own mass and momentum, propagated with the atoms
    o2: A fixed parameter set once per window
    o3: A Monte Carlo move
    o4: A bias
  - q: 'The advantage over fixed-lambda windows is that:'
    o1: One simulation samples the whole alchemical space, so several end states are compared at once
    o2: No biases are needed
    o3: It needs no equilibration
    o4: It is exact
  - q: 'A lambda particle given too small a mass will:'
    o1: Move so fast that the spatial coordinates cannot follow it adiabatically
    o2: Freeze at an end state
    o3: Break SHAKE
    o4: Change the free energy
  - q: 'Free energies come out of a lambda-dynamics run from:'
    o1: The relative populations of the end states
    o2: The work done on lambda
    o3: The trajectory length
    o4: The bias values alone
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Making lambda dynamical turns a set of separate windows into one trajectory whose populations carry the answer
  verify:
    authored: true
- template: mdh-msld-scaling
  skill: md.lambda
  pace: recall
  cases:
  - q: In the MSλD potential, which terms are scaled by a single substituent's lambda?
    o1: That substituent's own bonded and nonbonded terms with the environment
    o2: The whole system's energy
    o3: The water-water interactions
    o4: The nuclear repulsion
  - q: Which terms carry a product of two lambdas?
    o1: Interactions between substituents at two different sites
    o2: Substituent-environment interactions
    o3: Environment-environment interactions
    o4: Bonded terms within the common core
  - q: 'Substituents at the same site do not interact because:'
    o1: They occupy the same space, so their mutual interactions are excluded
    o2: Their lambdas are equal
    o3: They are far apart
    o4: Their charges cancel
  - q: 'The common core''s self-interaction is:'
    o1: Unscaled, since it is present in every end state
    o2: Scaled by the sum of lambdas
    o3: Scaled by the product of lambdas
    o4: Omitted
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Which power of lambda multiplies a term follows from how many alchemical groups the term involves
  verify:
    authored: true
- template: mdh-bias-roles
  skill: md.lambda
  pace: recall
  cases:
  - q: Which ALF bias term is a fixed offset that equalises the end-state free energies?
    o1: The fixed term, applied per substituent
    o2: The quadratic term
    o3: The endpoint term
    o4: The intersite term
  - q: What does the endpoint bias term do?
    o1: Pushes population into the physical end states, where lambda is near 0 or 1
    o2: Flattens the middle of the profile
    o3: Couples two sites
    o4: Sets the temperature
  - q: Why is any bias needed at all?
    o1: Barriers between substituents make transitions rare, so the run would not interconvert them
    o2: To correct the force field
    o3: To conserve energy
    o4: To set the standard state
  - q: The biases affect the final free energies how?
    o1: 'Not at all: they are subtracted out, they only change how fast it converges'
    o2: They shift every answer
    o3: They scale the answer by lambda
    o4: They set the error bar
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Each term flattens a different feature of the landscape; the answer is bias-independent, the convergence is not

      label: a
      draw: true
      solution:
        type: scheme
        panels:
          - type: molecule
            formula: CHO3R2-
            atoms: [[1.13, -0.5, "R"], [2.0, 0.0], [2.0, 1.0, "O-"], [2.87, -0.5, "O"], [3.74, 0.0, "R"], [0.5, 0.9, "HO"]]

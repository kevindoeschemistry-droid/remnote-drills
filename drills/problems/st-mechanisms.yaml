            bonds: [[0, 1], [1, 2, 2], [1, 3], [4, 5], [5, 6, 2], [6, 7], [7, 8, 2], [8, 4], [8, 9], [4, 10], [10, 3, 0], [11, 12], [12, 13], [6, 14], [15, 17], [15, 16], [11, 15], [18, 19], [20, 21], [20, 15]]
            arrows: [[16, [15, 16], 0.5], [[15, 11], 14, -0.4], [[6, 14], 6, -0.5]]
            notes: [[0.9, 4.6, "Asp102"], [3.6, 4.6, "His57"], [8.2, 4.0, "Ser195"], [7.9, 0.45, "oxyanion hole"]]
          - type: molecule
            formula: C6H9N3O5R5-
            caption: '5. Enzyme restored, acid and amine released'
            atoms: [[0.0, 3.0, "R"], [1.0, 3.0], [1.5, 3.87, "O"], [1.87, 2.5, "O-"], [3.19, 2.34, "N"], [4.0, 1.75], [4.81, 2.34, "N"], [4.5, 3.29], [3.5, 3.29], [3.2, 4.24, "R"], [2.44, 2.39, "H"], [6.4, 3.0, "O"], [7.15, 3.7], [7.15, 4.7, "R"], [5.6, 2.72, "H"], [6.6, 1.5], [6.6, 0.5, "O"], [7.47, 2.0, "R"], [4.2, 0.1, "H2N"], [3.3, -0.3, "R"], [5.6, 1.2, "O"], [5.3, 0.45, "H"]]
            bonds: [[0, 1], [1, 2, 2], [1, 3], [4, 5], [5, 6, 2], [6, 7], [7, 8, 2], [8, 4], [8, 9], [4, 10], [10, 3, 0], [11, 12], [12, 13], [11, 14], [15, 17], [15, 16, 2], [18, 19], [20, 21], [20, 15]]
            notes: [[0.9, 4.6, "Asp102"], [3.6, 4.6, "His57"], [8.2, 4.0, "Ser195"]]
      explain: 'Two halves with the same three arrows each. Acylation: serine attacks (His57 as base), the tetrahedral intermediate collapses and the amine leaves (His57-H+ as acid). Deacylation: water attacks (His57 as base), the second intermediate collapses and serine leaves (His57-H+ as acid). Asp102 holds His57 in place and steadies its positive charge; the oxyanion hole steadies both intermediates'

- template: st-mech-chymotrypsin-roles
  skill: biochem.mechanisms
  pace: recall
  cases:
    - { q: 'Which residue is the nucleophile that attacks the peptide carbonyl?', ans: 2 }
    - { q: 'Which residue acts as the general base and then the general acid?', ans: 1 }
    - { q: 'Which residue orients the imidazole ring and steadies its positive charge?', ans: 0 }
    - { q: 'What stabilises the negative charge on the tetrahedral intermediates?', ans: 3 }
  prompt: 'Chymotrypsin. {{q}}'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["Asp102", "His57", "Ser195", "The oxyanion hole (backbone N-H groups)"]
      correct: ans
      explain: 'The triad: Asp102 holds His57, His57 shuttles the proton, Ser195 attacks. The oxyanion hole, two backbone N-H groups, hydrogen-bonds the oxyanion'
  verify: { authored: true }

# ── core organic mechanisms: SN2, E2, electrophilic addition, acyl substitution ──

- template: st-mech-sn2-1
  skill: orgo.substitution-elimination
  pace: quick
  prompt: 'Mechanism: the SN2 reaction of hydroxide with bromoethane. Starting from hydroxide and bromoethane, draw the curved arrows and what they lead to.'
  figure:
    type: molecule
    formula: C2H6BrO-
    atoms: [[0.0, 0.0, "HO-"], [2.0, 0.0], [2.0, 1.0], [3.4, 0.0, "Br"]]
    bonds: [[1, 2], [1, 3]]
  parts:
    - ask: 'Draw the arrows and the next state, then compare'
      label: a
      draw: true
      solution:
        type: scheme
        panels:
          - type: molecule
            formula: C2H6BrO-
            atoms: [[0.0, 0.0, "HO-"], [2.0, 0.0], [2.0, 1.0], [3.4, 0.0, "Br"]]
            bonds: [[1, 2], [1, 3]]
            arrows: [[0, 1, -0.3], [[1, 3], 3, -0.5]]
          - type: molecule
            formula: C2H6BrO-
            caption: 'Ethanol and bromide'
            atoms: [[0.0, 0.0, "HO"], [2.0, 0.0], [2.0, 1.0], [3.4, 0.0, "Br-"]]
            bonds: [[1, 2], [0, 1]]
      explain: 'One step. The nucleophile attacks the carbon from the side opposite the leaving group while the C–Br bond breaks: two arrows, no intermediate, and the configuration at carbon inverts'

- template: st-mech-e2-1
  skill: orgo.substitution-elimination
  pace: quick
  prompt: 'Mechanism: the E2 elimination of bromoethane by an alkoxide. Starting from an alkoxide and bromoethane, draw the curved arrows and what they lead to.'
  figure:
    type: molecule
    formula: C2H5BrOR-
    atoms: [[-0.2, 1.6, "R"], [0.8, 1.6, "O-"], [1.6, 0.8, "H"], [2.3, 0.0], [3.3, 0.0], [3.9, -0.9, "Br"]]
    bonds: [[0, 1], [2, 3], [3, 4], [4, 5]]
  parts:
    - ask: 'Draw the arrows and the next state, then compare'
      label: a
      draw: true
      solution:
        type: scheme
        panels:
          - type: molecule
            formula: C2H5BrOR-
            atoms: [[-0.2, 1.6, "R"], [0.8, 1.6, "O-"], [1.6, 0.8, "H"], [2.3, 0.0], [3.3, 0.0], [3.9, -0.9, "Br"]]
            bonds: [[0, 1], [2, 3], [3, 4], [4, 5]]
            arrows: [[1, 2, -0.3], [[2, 3], [3, 4], -0.4], [[4, 5], 5, -0.5]]
          - type: molecule
            formula: C2H5BrOR-
            caption: 'An alcohol, ethene and bromide'
            atoms: [[-0.2, 1.6, "R"], [0.8, 1.6, "O"], [1.6, 0.8, "H"], [2.3, 0.0], [3.3, 0.0], [3.9, -0.9, "Br-"]]
            bonds: [[0, 1], [1, 2], [3, 4, 2]]
      explain: 'One step, three arrows in a row: the base takes the β-hydrogen, the C–H electrons become the π bond, and the leaving group departs. The H and the leaving group must be anti to each other'

- template: st-mech-hbr-addition-1
  skill: orgo.alkene-reactions
  pace: quick
  prompt: 'Mechanism: the addition of HBr to 2-methylpropene, step 1 of 2. Starting from 2-Methylpropene and HBr, draw the curved arrows and what they lead to.'
  figure:
    type: molecule
    formula: C4H9Br
    atoms: [[0.0, 0.0], [1.0, 0.0], [1.5, -0.87], [2.0, 0.0], [-0.3, 1.2, "H"], [0.9, 1.9, "Br"]]
    bonds: [[1, 2], [1, 3], [0, 1, 2], [4, 5]]
  parts:
    - ask: 'Draw the arrows and the next state, then compare'
      label: a
      draw: true
      solution:
        type: scheme
        panels:
          - type: molecule
            formula: C4H9Br
            atoms: [[0.0, 0.0], [1.0, 0.0], [1.5, -0.87], [2.0, 0.0], [-0.3, 1.2, "H"], [0.9, 1.9, "Br"]]
            bonds: [[1, 2], [1, 3], [0, 1, 2], [4, 5]]
            arrows: [[[0, 1], 4, 0.4], [[4, 5], 5, 0.5]]
          - type: molecule
            formula: C4H9Br
            caption: 'Carbocation and bromide'
            atoms: [[0.0, 0.0], [1.0, 0.0, "C+"], [1.5, -0.87], [2.0, 0.0], [-0.3, 1.2, "H"], [0.9, 1.9, "Br-"]]
            bonds: [[1, 2], [1, 3], [0, 1], [0, 4]]
      explain: 'The π bond is the nucleophile. It takes the proton onto the carbon with more hydrogens, because that leaves the positive charge on the more substituted carbon: a tertiary carbocation'


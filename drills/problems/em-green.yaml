# Second question types; keys recomputed by sympy along another route.

- template: gf-string-value
  skill: bvp.green
  pace: quick
  cases:
  - L: 1
    x0: 0.25
    s0: 0.5
  - L: 2
    x0: 1.5
    s0: 0.5
  - L: 4
    x0: 1
    s0: 3
  - L: 3
    x0: 2
    s0: 2.5
  prompt: For y″ = f on 0 < x < {{L}} with y(0) = y({{L}}) = 0, evaluate the Green's function G(x, s) at x = {{x0}}, s = {{s0}}.
  parts:
  - ask: Answer
    label: v
    tex: G
    value: 'x0 < s0 ? x0*(s0 - L)/L : s0*(x0 - L)/L'
    tol: 0.005
    explain: G = A x left of s, B(x − L) right of s; continuity A s = B(s − L) and the unit slope jump B − A = 1 fix A and B
  verify:
    expect:
      v: (Symbol('A')*nsimplify(x0) if x0 < s0 else Symbol('B')*(nsimplify(x0) - L)).subs(solve([Symbol('A')*nsimplify(s0) - Symbol('B')*(nsimplify(s0) - L), Symbol('B') - Symbol('A') - 1], [Symbol('A'), Symbol('B')]))
- template: gf-string-solve
  skill: bvp.green
  pace: quick
  cases:
  - L: 1
    x0: 0.5
    c: 6
  - L: 2
    x0: 1
    c: 3
  - L: 3
    x0: 1
    c: 2
  - L: 2
    x0: 0.5
    c: -6
  prompt: Use the Green's function of y″ = f, y(0) = y({{L}}) = 0, to find y({{x0}}) when f(x) = {{c}}x.
  parts:
  - ask: Answer
    label: v
    tex: y
    value: c*(x0^3 - L^2*x0)/6
    tol: 0.005
    explain: Integrating twice directly gives y = c(x³ − L²x)/6, the same as ∫G(x, s) c s ds
  verify:
    expect:
      v: integrate(Symbol('s')*(nsimplify(x0) - L)/L*c*Symbol('s'), (Symbol('s'), 0, nsimplify(x0))) + integrate(nsimplify(x0)*(Symbol('s') - L)/L*c*Symbol('s'), (Symbol('s'), nsimplify(x0), L))
- template: gf-helmholtz-value
  skill: bvp.green
  pace: quick
  cases:
  - k2: 1
    kk: 1
    x0: 0.3
    s0: 0.9
  - k2: 9
    kk: 3
    x0: 1.2
    s0: 0.4
  - k2: 1
    kk: 1
    x0: 1.0
    s0: 0.5
  - k2: 9
    kk: 3
    x0: 0.2
    s0: 0.7
  prompt: For y″ + {{k2}}y = f on 0 < x < π/2 with y(0) = y(π/2) = 0 (k = {{kk}}), evaluate G(x, s) at x = {{x0}}, s = {{s0}}.
  parts:
  - ask: Answer
    label: v
    tex: G
    value: -sin(kk*min(x0, s0))*sin(kk*(pi/2 - max(x0, s0)))/(kk*sin(kk*pi/2))
    tol: 0.005
    explain: Left piece A sin kx, right piece B sin k(L − x); continuity and a unit jump in G′ at x = s fix A and B
  verify:
    expect:
      v: (Symbol('A')*sin(kk*nsimplify(x0)) if x0 < s0 else Symbol('B')*sin(kk*(pi/2 - nsimplify(x0)))).subs(solve([Symbol('A')*sin(kk*nsimplify(s0)) - Symbol('B')*sin(kk*(pi/2 - nsimplify(s0))), -Symbol('B')*kk*cos(kk*(pi/2 - nsimplify(s0))) - Symbol('A')*kk*cos(kk*nsimplify(s0)) - 1], [Symbol('A'), Symbol('B')]))
- template: gf-existence
  skill: bvp.green
  pace: quick
  cases:
  - q: For y″ + k²y = f, y(0) = y(L) = 0, when does the Green's function fail to exist?
    o1: When kL is a multiple of π
    o2: When k is negative
    o3: When f is discontinuous
    o4: Never
  - q: What jump does dG/dx have at x = s for (p y′)′ + q y = f?
    o1: 1/p(s)
    o2: '1'
    o3: p(s)
    o4: '0: it is continuous'
  - q: For a self-adjoint problem, how are G(x, s) and G(s, x) related?
    o1: They are equal (symmetry)
    o2: G(s, x) = −G(x, s)
    o3: G(s, x) = 1/G(x, s)
    o4: No general relation
  - q: What does G(x, s) represent physically for a loaded string?
    o1: The deflection at x from a unit point load at s
    o2: The tension at s
    o3: The slope at x from a unit load at x
    o4: The energy stored by the load
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: G solves the problem with a delta source; it exists exactly when the homogeneous problem has only the zero solution
  verify:
    authored: true
- template: gf-oscillator-step
  skill: bvp.green
  pace: quick
  cases:
  - w2: 4
    F0: 8
    T: 1
  - w2: 1
    F0: 2
    T: 2
  - w2: 9
    F0: 3
    T: 0.5
  prompt: y″ + {{w2}}y = {{F0}} for t > 0, from rest. Using y = ∫₀ᵗ g(t − u) f(u) du with g = sin(ωt)/ω, find y({{T}}).
  parts:
  - ask: Answer
    label: v
    tex: y
    value: F0*(1 - cos(sqrt(w2)*T))/w2
    tol: 0.005
    explain: 'A step force shifts the equilibrium to F₀/ω² and the mass oscillates about it: F₀(1 − cos ωt)/ω²'
  verify:
    expect:
      v: integrate(sin(sqrt(w2)*(nsimplify(T) - Symbol('s')))/sqrt(w2)*F0, (Symbol('s'), 0, nsimplify(T)))
- template: gf-lag-ramp
  skill: bvp.green
  pace: quick
  given:
    tau:
      pick:
      - 0.5
      - 1
      - 2
    T:
      pick:
      - 1
      - 3
      - 5
  prompt: A first-order system τy′ + y = f has τ = {{tau}} and starts at rest. Find y({{T}}) for the ramp f(t) = t.
  parts:
  - ask: Answer
    label: v
    tex: y
    value: T - tau*(1 - exp(-T/tau))
    tol: 0.005
    explain: 'Convolve with g = e^(−t/τ)/τ: the output lags the ramp by τ once the transient e^(−t/τ) dies'
  verify:
    expect:
      v: integrate(exp(-(T - Symbol('s'))/nsimplify(tau))/nsimplify(tau)*Symbol('s'), (Symbol('s'), 0, T))
- template: gf-image-fixed
  skill: bvp.green
  pace: quick
  given:
    Qh:
      pick:
      - 1
      - 2
    x0:
      pick:
      - 1
      - 2
    kap:
      pick:
      - 0.5
      - 1
    xx:
      pick:
      - 0.5
      - 1.5
    T:
      pick:
      - 0.5
      - 1
  prompt: Heat Q = {{Qh}} is released at x₀ = {{x0}} on a half-line x > 0 with κ = {{kap}} and u(0, t) = 0. Find u({{xx}}, {{T}}) by the method of images.
  parts:
  - ask: Answer
    label: v
    tex: u
    value: Qh/sqrt(4*pi*kap*T)*(exp(-(xx - x0)^2/(4*kap*T)) - exp(-(xx + x0)^2/(4*kap*T)))
    tol: 0.005
    explain: A negative image at −x₀ holds u(0) = 0; checked against the Fourier sine-transform solution
  verify:
    expect:
      v: 2/pi*Qh*integrate(sin(Symbol('k')*nsimplify(xx))*sin(Symbol('k')*x0)*exp(-nsimplify(kap)*Symbol('k')**2*nsimplify(T)), (Symbol('k'), 0, oo))

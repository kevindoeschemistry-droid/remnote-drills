- template: fc-gaussians
  skill: bvp.fourier-series
  pace: quick
  given:
    s1:
      pick:
      - 1
      - 2
    s2:
      pick:
      - 1
      - 3
  prompt: f and g are normalised Gaussians centred at 0 with standard deviations {{s1}} and {{s2}}. Find (f ∗ g)(0).
  parts:
  - ask: Answer
    label: v
    tex: (f*g)(0)
    value: 1/sqrt(2*pi*(s1^2 + s2^2))
    tol: 0.005
    explain: 'The transforms multiply, so the exponents add: a Gaussian with σ² = σ₁² + σ₂²'
  verify:
    expect:
      v: integrate(exp(-Symbol('s')**2/(2*s1**2))/sqrt(2*pi*s1**2)*exp(-Symbol('s')**2/(2*s2**2))/sqrt(2*pi*s2**2), (Symbol('s'), -oo, oo))
- template: fc-pulses
  skill: bvp.fourier-series
  pace: quick
  cases:
  - b: 1
    x0: 0.5
  - b: 2
    x0: 1
  - b: 1
    x0: 1.5
  - b: 2
    x0: 3
  prompt: f = g = 1 on |x| < {{b}} and 0 elsewhere. Find (f ∗ g)({{x0}}).
  parts:
  - ask: Answer
    label: v
    tex: (f*g)
    value: max(0, 2*b - abs(x0))
    tol: 0.005
    explain: 'The overlap of two shifted pulses: a triangle of height 2b; its transform is the square of the sinc'
  verify:
    expect:
      v: integrate(1, (Symbol('s'), Max(-b, nsimplify(x0) - b), Min(b, nsimplify(x0) + b)))
- template: fc-heat-spread
  skill: bvp.fourier-series
  pace: quick
  given:
    s0:
      pick:
      - 0.5
      - 1
    Qh:
      pick:
      - 1
      - 3
    kap:
      pick:
      - 0.25
      - 0.5
    T:
      pick:
      - 1
      - 2
  prompt: u(x, 0) is a Gaussian of standard deviation {{s0}} holding total heat {{Qh}}. With κ = {{kap}}, find u(0, {{T}}).
  parts:
  - ask: Answer
    label: v
    tex: u
    value: Qh/sqrt(2*pi*(s0^2 + 2*kap*T))
    tol: 0.005
    explain: u = u₀ ∗ heat kernel; the kernel has variance 2κt, so σ² = σ₀² + 2κt
  verify:
    expect:
      v: integrate(Qh*exp(-Symbol('s')**2/(2*nsimplify(s0)**2))/sqrt(2*pi*nsimplify(s0)**2)*exp(-Symbol('s')**2/(4*nsimplify(kap)*T))/sqrt(4*pi*nsimplify(kap)*T), (Symbol('s'), -oo, oo))
- template: rw-endpoint
  skill: pde.random-walk
  pace: quick
  cases:
  - N: 4
    m: 2
  - N: 6
    m: 0
  - N: 10
    m: 4
  - N: 8
    m: -2
  - N: 12
    m: 6
  prompt: An unbiased walker takes {{N}} steps of ±1. What is the probability it ends at x = {{m}}?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: combinations(N, (N + m)/2)/2^N
    final: true
    tol: 0.0001
    explain: '(N + m)/2 steps right and the rest left: C(N, (N + m)/2) paths out of 2^N; the generating function ((z + 1/z)/2)^N agrees'
  verify:
    expect:
      v: expand(((Symbol('z') + 1/Symbol('z'))/2)**N).coeff(Symbol('z'), m)
- template: rw-biased-msd
  skill: pde.random-walk
  pace: quick
  given:
    a:
      pick:
      - 1
      - 2
    p:
      pick:
      - 0.5
      - 0.6
      - 0.75
    N:
      pick:
      - 10
      - 20
  prompt: A walker steps +{{a}} with probability {{p}} and −{{a}} otherwise, {{N}} times. Find ⟨x²⟩.
  parts:
  - ask: Answer
    label: v
    tex: \langle x^2\rangle
    value: 4*N*p*(1 - p)*a^2 + (N*a*(2*p - 1))^2
    tol: 0.005
    explain: ⟨x²⟩ = Var x + ⟨x⟩² = 4Np(1 − p)a² + (Na(2p − 1))²; the drift grows as N², the spread as N
  verify:
    expect:
      v: summation(binomial(N, Symbol('s'))*nsimplify(p)**Symbol('s')*(1 - nsimplify(p))**(N - Symbol('s'))*(a*(2*Symbol('s') - N))**2, (Symbol('s'), 0, N))
- template: rw-diffusivity
  skill: pde.random-walk
  pace: quick
  given:
    a:
      pick:
      - 0.2
      - 0.3
      - 0.5
    dt:
      pick:
      - 1
      - 2
      - 5
  prompt: A molecule makes a {{a}} nm jump every {{dt}} ps in a random direction along a line. What is D in cm²/s?
  parts:
  - ask: Answer
    label: v
    tex: D
    value: (a*1e-7)^2/(2*dt*1e-12)
    tol: 0.005
    explain: ⟨x²⟩ = Na² = (t/Δt)a² = 2Dt, so D = a²/(2Δt); 1 nm = 10⁻⁷ cm
  verify:
    expect:
      v: (nsimplify(a)*Rational(1, 10**7))**2/(2*nsimplify(dt)*Rational(1, 10**12))
- template: rw-diffuse-time
  skill: pde.random-walk
  pace: quick
  given:
    Dv:
      pick:
      - 1.0e-05
      - 1.0e-06
    L:
      pick:
      - 1
      - 10
      - 100
    dim:
      pick:
      - 1
      - 3
  prompt: How long does a molecule with D = {{Dv}} cm²/s take to reach an rms displacement of {{L}} µm in {{dim}} dimension(s)?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: (L*1e-4)^2/(2*dim*Dv)
    tol: 0.005
    explain: '⟨r²⟩ = 2dDt: ten times the distance takes a hundred times as long'
  verify:
    expect:
      v: solve(Eq(2*dim*nsimplify(Dv)*Symbol('tt'), (L*Rational(1, 10**4))**2), Symbol('tt'))[0]
- template: rw-tail
  skill: pde.random-walk
  pace: quick
  given:
    Dv:
      pick:
      - 0.5
      - 1
    T:
      pick:
      - 1
      - 2
    ell:
      pick:
      - 1
      - 2
      - 3
  prompt: Walkers start at x = 0 and diffuse with D = {{Dv}} for time {{T}}. What fraction are farther than {{ell}} from the start (either side)?
  parts:
  - ask: Answer
    label: v
    tex: f
    value: 1 - erf(ell/sqrt(4*Dv*T))
    tol: 0.005
    explain: 'Twice the Gaussian tail: erfc(ℓ/√(4Dt))'
  verify:
    expect:
      v: 2*integrate(exp(-Symbol('s')**2/(4*nsimplify(Dv)*T))/sqrt(4*pi*nsimplify(Dv)*T), (Symbol('s'), ell, oo))
- template: rw-stages
  skill: pde.random-walk
  pace: quick
  given:
    N1:
      pick:
      - 100
      - 400
    a1:
      pick:
      - 1
      - 2
    N2:
      pick:
      - 100
      - 900
    a2:
      pick:
      - 0.5
      - 3
  prompt: A walker takes {{N1}} steps of length {{a1}}, then {{N2}} steps of length {{a2}}, all unbiased and independent. What is its rms displacement?
  parts:
  - ask: Answer
    label: v
    tex: x_{rms}
    value: sqrt(N1*a1^2 + N2*a2^2)
    tol: 0.005
    explain: The distribution after both stages is the convolution of the two; convolution adds variances, not rms values
  verify:
    expect:
      v: sqrt(integrate(Symbol('s')**2*exp(-Symbol('s')**2/(2*(N1*a1**2 + N2*nsimplify(a2)**2)))/sqrt(2*pi*(N1*a1**2 + N2*nsimplify(a2)**2)), (Symbol('s'), -oo, oo)))

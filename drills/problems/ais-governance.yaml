- template: ais-brier
  skill: ais.strategy
  pace: quick
  given:
    p1:
      pick:
      - 0.7
      - 0.9
    p2:
      pick:
      - 0.2
      - 0.4
    p3:
      pick:
      - 0.6
      - 0.8
  prompt: You forecast {{p1}}, {{p2}} and {{p3}} for three events; outcomes were yes, no, yes. What is your Brier score?
  parts:
  - ask: Answer
    label: v
    tex: B
    value: ((p1 - 1)^2 + p2^2 + (p3 - 1)^2)/3
    tol: 0.005
    explain: Mean squared error of probabilities; 0 is perfect, 0.25 is always saying 50%
  verify:
    expect:
      v: ((nsimplify(p1) - 1)**2 + nsimplify(p2)**2 + (nsimplify(p3) - 1)**2)/3
- template: ais-brier-constant
  skill: ais.strategy
  pace: quick
  given:
    p:
      pick:
      - 0.5
      - 0.3
      - 0.7
    f:
      pick:
      - 20
      - 50
      - 70
  prompt: Always forecasting {{p}} on events that happen {{f}}% of the time gives what expected Brier score?
  parts:
  - ask: Answer
    label: v
    tex: B
    value: (f/100)*(1 - p)^2 + (1 - f/100)*p^2
    tol: 0.005
    explain: The best constant forecast is the base rate
  verify:
    expect:
      v: Rational(f, 100)*(1 - nsimplify(p))**2 + (1 - Rational(f, 100))*nsimplify(p)**2

  pace: quick
  cases:
  - q: 'A coordinated pause bets most on:'
    o1: Verification and enforcement
    o2: A safe lead
    o3: Defence outpacing offence
    o4: Nothing
  - q: 'Safe-lead racing bets on:'
    o1: A responsible actor staying ahead and using the lead well
    o2: Verification
    o3: A global pause
    o4: Open release
  - q: 'Defensive acceleration bets on:'
    o1: Defence technologies outpacing offence
    o2: Pausing
    o3: Racing
    o4: Doing nothing
  - q: 'Gradual institutional adaptation bets on:'
    o1: Institutions keeping pace with capability
    o2: A lead
    o3: Verification
    o4: A pause
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Every strategy bets on something
  verify:
    authored: true
- template: ais-transition-strategy-2
  skill: ais.strategy
  pace: quick
  cases:
  - q: Which observation would most weaken the case for safe-lead racing?
    o1: The lead is thin and safety work is cut to keep it
    o2: Verification improves
    o3: Defence is cheap
    o4: Institutions adapt
  - q: Which observation would most strengthen the case for a coordinated pause?
    o1: Reliable compute verification becomes available
    o2: Labs disagree
    o3: Chips get cheaper
    o4: Open models lead
  - q: 'A crux in strategy debates is:'
    o1: A belief whose change would flip the preferred strategy
    o2: A fact everyone agrees on
    o3: A benchmark
    o4: A press release
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Find the crux behind each strategy
  verify:
    authored: true
- template: ais-itn-score
  skill: ais.strategy
  pace: quick
  given:
    imp:
      pick:
      - 8
      - 9
    tr:
      pick:
      - 3
      - 5
    ng:
      pick:
      - 6
      - 8
    i2:
      pick:
      - 9
      - 10
    t2:
      pick:
      - 6
      - 7
    n2:
      pick:
      - 2
      - 3
  prompt: Score an intervention on importance {{imp}}, tractability {{tr}} and neglectedness {{ng}} (each 1–10), multiplying them. A second scores {{i2}}, {{t2}}, {{n2}}. What is the ratio of the first to the second?
  parts:
  - ask: Answer
    label: v
    tex: ratio
    value: (imp*tr*ng)/(i2*t2*n2)
    tol: 0.005
    explain: The factors multiply, so a very neglected but moderately important area can beat a crowded important one
  verify:
    expect:
      v: Rational(imp*tr*ng, i2*t2*n2)
- template: ais-theory-of-change
  skill: ais.strategy
  pace: quick
  cases:
  - q: 'A theory of change links:'
    o1: Action → intermediate outcome → risk reduction
    o2: Effort → salary
    o3: Topic → paper
    o4: Model → benchmark
  - q: 'Comparative advantage asks:'
    o1: Where your skills make the most difference relative to others
    o2: What is most famous
    o3: What pays most
    o4: What is easiest
  - q: Which is the weakest theory of change?
    o1: Writing about a topic with no path to anyone acting on it
    o2: Building an eval a lab adopts
    o3: Training red-teamers
    o4: Advising a regulator
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Prioritise by impact, tractability, neglect and your fit
  verify:
    authored: true
- template: ais-qk-ov
  skill: ais.interp
  pace: quick
  cases:
  - q: 'The QK circuit (W_Qᵀ W_K) decides:'
    o1: Where a head attends
    o2: What it writes
    o3: The vocabulary
    o4: The layer count
  - q: 'The OV circuit (W_V W_O) decides:'
    o1: What information gets moved
    o2: Where to attend
    o3: The learning rate
    o4: The tokenizer
  - q: 'A copying head''s OV circuit tends to map a token to:'
    o1: Raising that same token's logit
    o2: A random token
    o3: The previous position
    o4: Nothing
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: QK chooses the source; OV chooses the message
  verify:
    authored: true
- template: ais-qk-ov-2
  skill: ais.interp
  pace: quick
  cases:
  - q: 'Two heads attend to the same positions but write different things. They differ in their:'
    o1: OV circuits
    o2: QK circuits
    o3: Embeddings
    o4: LayerNorms
  - q: 'A previous-token head''s QK circuit attends:'
    o1: From each position to the one before it
    o2: To the first token
    o3: To itself
    o4: Randomly
  - q: Why analyse QK and OV separately?
    o1: Attention pattern and moved content are independent decisions
    o2: They are the same
    o3: Only OV matters
    o4: Only QK matters
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Separate where from what
  verify:
    authored: true
- template: ais-dla
  skill: ais.interp
  pace: quick
  given:
    h1:
      pick:
      - 1
      - 2
      - -1
    h2:
      pick:
      - 0.5
      - 1
      - 2
    c1:
      pick:
      - 1
      - 2
    c2:
      pick:
      - 0
      - 1
    w1:
      pick:
      - 0
      - -1
    w2:
      pick:
      - 1
      - 2
  prompt: A head's output (after the final LayerNorm scale) is h = ({{h1}}, {{h2}}). The unembedding columns are u_correct = ({{c1}}, {{c2}}) and u_wrong = ({{w1}}, {{w2}}). Compute its direct logit attribution.
  parts:
  - ask: Answer
    label: v
    tex: DLA
    value: h1*(c1 - w1) + h2*(c2 - w2)
    tol: 0.005
    explain: DLA = h · (u_correct − u_wrong)
  verify:
    expect:
      v: (Matrix([[h1, nsimplify(h2)]])*(Matrix([c1, c2]) - Matrix([w1, w2])))[0]
- template: ais-dla-limits
  skill: ais.interp
  pace: quick
  cases:
  - q: 'Direct logit attribution ignores:'
    o1: Effects that pass through later layers
    o2: The unembedding
    o3: The final LayerNorm
    o4: The correct token
  - q: 'A head with large positive DLA for the correct token:'
    o1: Directly pushes the model toward the correct answer
    o2: Is irrelevant
    o3: Hurts the answer
    o4: Moves no information
  - q: Why use a correct-minus-wrong logit difference?
    o1: It cancels shifts that raise all logits together
    o2: It is easier to type
    o3: It ignores the answer
    o4: It is required by PyTorch
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: DLA measures the direct path only
  verify:
    authored: true
- template: ais-agent-injection
  skill: ais.agentic
  pace: quick
  cases:
  - q: 'An email assistant reads incoming mail containing hidden instructions. The injection pathway is:'
    o1: Untrusted data in the context acting as instructions
    o2: The user's prompt
    o3: The weights
    o4: The tokenizer
  - q: Which control limits damage from a hijacked agent?
    o1: Least-privilege tools, permissions and egress limits
    o2: A longer system prompt
    o3: Higher temperature
    o4: More tools
  - q: 'A browsing agent can send email and read the web. The most dangerous combination is:'
    o1: Reading untrusted pages and sending data out
    o2: Reading only
    o3: Writing drafts only
    o4: Searching only
  - q: 'Requiring user confirmation before irreversible actions:'
    o1: Breaks the chain at the step that causes harm
    o2: Has no effect
    o3: Increases risk
    o4: Replaces monitoring
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Untrusted data is an instruction channel; limit what a hijacked agent can do
  verify:
    authored: true
- template: ais-agent-injection-2
  skill: ais.agentic
  pace: quick
  cases:
  - q: Why can't a system prompt alone stop prompt injection?
    o1: The model can't reliably tell instructions in data from instructions from the user
    o2: System prompts are ignored
    o3: Injection only uses images
    o4: It can
  - q: 'A coding agent installs packages named in a README it fetched. The injection risk is:'
    o1: A malicious README directing it to install attacker code
    o2: None
    o3: Slow builds
    o4: Sycophancy
  - q: Which design separates trusted from untrusted content?
    o1: Quarantining untrusted data in a tool with no side-effect permissions
    o2: Merging all inputs
    o3: Removing logs
    o4: Raising temperature
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Design so that a hijack has little to work with
  verify:
    authored: true
- template: ais-distributed-attack
  skill: ais.agentic
  pace: quick
  cases:
  - q: Why can per-instance monitors miss distributed attacks?
    o1: Each instance's actions look benign; the harm lies in the combination
    o2: Monitors are off
    o3: Instances can't act
    o4: Attacks are always obvious
  - q: What monitoring design catches distributed attacks?
    o1: Aggregating actions across instances
    o2: Per-message filters only
    o3: Higher temperature
    o4: Shorter contexts
  - q: 'Many agent instances each copy a small piece of a sensitive dataset. A per-instance monitor sees:'
    o1: Small, harmless-looking reads
    o2: The full exfiltration
    o3: Nothing at all
    o4: An alert every time
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Monitor the fleet, not just each instance
  verify:
    authored: true
- template: ais-split-threshold
  skill: ais.agentic
  pace: quick
  given:
    t:
      pick:
      - 50
      - 100
      - 200
    Nr:
      pick:
      - 10000
      - 50000
  prompt: A monitor flags any instance that reads more than {{t}} records. An attacker splits a {{Nr}}-record exfiltration across instances, each just under the limit. How many instances does it need?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: ceil(Nr/(t - 1))
    final: true
    tol: 0.0001
    explain: Per-instance limits are easy to stay under; aggregate counts across instances
  verify:
    expect:
      v: ceiling(Rational(Nr, t - 1))

# Generated by scripts/opl_fill.py from scripts/opl_specs/mb.py: edit the spec, not this file.
# WeBWorK OPL gap-fill for framework MB. One question each; keys recomputed by sympy along another route.

- template: mb-two-column
  skill: meb.nonreactive
  pace: quick
  given:
    F:
      pick:
      - 100
      - 200
      - 500
    z:
      pick:
      - 0.3
      - 0.4
      - 0.5
    r1:
      pick:
      - 0.8
      - 0.9
    r2:
      pick:
      - 0.7
      - 0.85
  prompt: A feed of {{F}} mol/h with {{z}} mole fraction A goes to column 1, which sends {{r1}} of the A to its top product; the bottoms go to column 2, which recovers {{r2}} of the A it receives overhead. How much A leaves in the two top products together, in mol/h?
  parts:
  - ask: Answer
    label: v
    tex: \dot n_A
    value: F*z*(r1 + (1 - r1)*r2)
    tol: 0.005
    explain: 'Column 1 takes $r_1$ of the A; column 2 takes $r_2$ of what is left. Check against the overall balance: what escapes both is $(1 - r_1)(1 - r_2)$ of the feed'
  verify:
    expect:
      v: solve(Eq(x + nsimplify(F)*nsimplify(z)*(1 - nsimplify(r1))*(1 - nsimplify(r2)), nsimplify(F)*nsimplify(z)), x)[0]
- template: mb-energy-dof
  skill: meb.energy
  pace: quick
  given:
    u:
      int:
      - 4
      - 8
    e:
      int:
      - 2
      - 5
  require:
  - u + 1 - e - 1 > 0
  prompt: A heat exchanger problem has {{u}} unknown stream variables plus an unknown duty Q. You can write {{e}} independent material balances and relations, plus one energy balance. How many more specifications are needed?
  parts:
  - ask: Answer
    label: v
    tex: DOF
    value: u + 1 - e - 1
    final: true
    tol: 0.0001
    explain: Count every unknown, including Q, and every independent equation, including the energy balance. Zero means the problem is specified
  verify:
    expect:
      v: (u + 1) - (e + 1)

- template: bs-nnv
  skill: biosec.combat
  pace: quick
  given:
    ar:
      pick:
      - 1
      - 5
      - 10
      - 20
    VE:
      pick:
      - 50
      - 60
      - 80
      - 90
  prompt: Without vaccination {{ar}}% of a group would become cases this season. A vaccine is {{VE}}% efficacious. How many people must be vaccinated to prevent one case?
  parts:
  - ask: Answer
    label: v
    tex: NNV
    value: 1/(ar/100*VE/100)
    tol: 0.005
    explain: 'NNV = 1 / absolute risk reduction = 1/(AR × VE): low attack rates need many vaccinations per case averted'
  verify:
    expect:
      v: 1/(Rational(ar, 100) - Rational(ar, 100)*(1 - Rational(VE, 100)))

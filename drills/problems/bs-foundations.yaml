- template: bs-detect-prob
  skill: biosec.detect
  pace: quick
  given:
    lam:
      pick:
      - 0.1
      - 0.5
      - 1
      - 2
      - 3
  prompt: Sequencing a sample is expected to yield {{lam}} target reads on average (Poisson). What is the probability of seeing at least one, in %?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: 100*(1 - exp(-lam))
    tol: 0.005
    explain: P(0) = e^{−λ}, so at λ = 1 a single sample misses the target 37% of the time
  verify:
    expect:
      v: 100*(1 - exp(-nsimplify(lam)))
- template: bs-depth-for-confidence
  skill: biosec.detect
  pace: quick
  given:
    pc:
      pick:
      - 90
      - 95
      - 99
  prompt: How many target reads must be expected (Poisson mean) to see at least one with {{pc}}% probability?
  parts:
  - ask: Answer
    label: v
    tex: \lambda
    value: -log(1 - pc/100)
    tol: 0.005
    explain: 'λ = −ln(1 − P): about 2.3 for 90%, 3.0 for 95%, 4.6 for 99%'
  verify:
    expect:
      v: solve(Eq(exp(-x), 1 - Rational(pc, 100)), x)[0]
- template: bs-eca-per-person
  skill: biosec.withstand
  pace: quick
  given:
    occ:
      pick:
      - 10
      - 20
      - 30
    oa:
      pick:
      - 150
      - 300
    rec:
      pick:
      - 600
      - 1000
    eff:
      pick:
      - 50
      - 75
      - 90
    cadr:
      pick:
      - 0
      - 250
      - 400
  prompt: A room with {{occ}} people gets {{oa}} cfm of outdoor air, recirculates {{rec}} cfm through a filter that removes {{eff}}% of infectious particles, and has a portable cleaner with a clean air delivery rate of {{cadr}} cfm. What is the equivalent clean airflow per person, in cfm?
  parts:
  - ask: Answer
    label: v
    tex: ECA
    value: (oa + rec*eff/100 + cadr)/occ
    tol: 0.005
    explain: 'Clean air adds: outdoor air counts in full, filtered air at the filter''s efficiency, a cleaner at its CADR; ASHRAE 241 sets the per-person target by space type'
  verify:
    expect:
      v: solve(Eq(x*occ, oa + rec*Rational(eff, 100) + cadr), x)[0]

- template: bs-zero-offspring
  skill: biosec.epidemiology
  pace: quick
  given:
    R:
      pick:
      - 1.5
      - 2.5
      - 3
    kk:
      pick:
      - 0.1
      - 0.5
      - 1
      - 10
  prompt: Offspring per case follow a negative binomial with mean R = {{R}} and dispersion k = {{kk}}. What fraction of cases infect no one, in %?
  parts:
  - ask: Answer
    label: v
    tex: P_0
    value: 100*(1 + R/kk)^(-kk)
    tol: 0.005
    explain: 'Small k (overdispersion) means most cases infect no one and a few infect many: target settings, not just people'
  verify:
    expect:
      v: 100*(1 + nsimplify(R)/nsimplify(kk))**(-nsimplify(kk))

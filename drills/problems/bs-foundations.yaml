- template: bs-autoclave-time
  skill: biosec.biosafety
  pace: quick
  given:
    k:
      pick:
      - 4
      - 6
      - 8
    Dv:
      pick:
      - 0.5
      - 1.5
      - 2
  prompt: A load carries 10^{{k}} resistant spores. The D-value at 121 °C is {{Dv}} min. How many minutes reduce it to one in a million (10⁻⁶) chance of a survivor?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: (k + 6)*Dv
    tol: 0.005
    explain: Each D-value is one log; from 10^k down to 10⁻⁶ is k + 6 logs
  verify:
    expect:
      v: solve(Eq(k - x/nsimplify(Dv), -6), x)[0]
- template: bs-log-reduction
  skill: biosec.biosafety
  pace: quick
  cases:
  - N0: 10⁷
    a: 7
    N: '100'
    b: 2
  - N0: 10⁶
    a: 6
    N: '10'
    b: 1
  - N0: 10⁸
    a: 8
    N: '1000'
    b: 3
  - N0: 10⁵
    a: 5
    N: '1'
    b: 0
  prompt: A disinfectant brings {{N0}} organisms down to {{N}} in its contact time. What log reduction is that?
  parts:
  - ask: Answer
    label: v
    tex: \log_{10}
    value: a - b
    final: true

    ca:
      pick:
      - 40
      - 50
    b:
      pick:
      - 10
      - 15
      - 20
    co:
      pick:
      - 60
      - 80
  prompt: In a case-control study, {{a}} of {{ca}} cases and {{b}} of {{co}} controls were exposed. What is the odds ratio?
  parts:
  - ask: Answer
    label: v
    tex: OR
    value: (a*(co - b))/((ca - a)*b)
    tol: 0.005
    explain: OR = ad/bc; case-control studies sample on outcome, so they give odds ratios, not risks
  verify:
    expect:
      v: (Rational(a, ca - a))/(Rational(b, co - b))
- template: bs-attributable-fraction-exposed
  skill: biosec.epidemiology
  pace: quick
  given:
    rr:
      pick:
      - 1.5
      - 2
      - 4
      - 10
  prompt: Among the exposed, risk is {{rr}} times that of the unexposed. What percentage of the exposed group's cases is attributable to the exposure?
  parts:
  - ask: Answer
    label: v
    tex: AF_e
    value: 100*(rr - 1)/rr
    tol: 0.005
    explain: AF among exposed = (RR − 1)/RR
  verify:
    expect:
      v: 100*(1 - 1/nsimplify(rr))
- template: bs-paf
  skill: biosec.epidemiology
  pace: quick
  given:
    pe:
      pick:
      - 10
      - 25
      - 50
    rr:
      pick:
      - 2
      - 3
      - 5
  prompt: '{{pe}}% of a population is exposed, and the exposure has a risk ratio of {{rr}}. What is the population attributable fraction, in %?'
  parts:
  - ask: Answer
    label: v
    tex: PAF
    value: 100*(pe/100*(rr - 1))/(1 + pe/100*(rr - 1))
    tol: 0.005
    explain: 'PAF = (total risk − unexposed risk) ÷ total risk: how much disease would vanish if the exposure did'
  verify:
    expect:
      v: 100*((nsimplify(pe)/100*nsimplify(rr) + 1 - nsimplify(pe)/100) - 1)/(nsimplify(pe)/100*nsimplify(rr) + 1 - nsimplify(pe)/100)

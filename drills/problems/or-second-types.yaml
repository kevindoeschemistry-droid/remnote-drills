- template: or-centres-from-max
  skill: orgo.reasoning
  pace: recall
  given:
    k:
      int:
      - 1
      - 6
  prompt: A molecule with no internal mirror plane has at most {{2^k}} stereoisomers. How many stereocentres does it have?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: k
    final: true
    tol: 0.0001
    explain: 2ⁿ stereoisomers for n stereocentres; a meso form (internal mirror) lowers the count
  verify:
    expect:
      v: log(Integer(2)**k, 2)
- template: or-carbon-ox-group
  skill: orgo.reasoning
  pace: recall
  cases:
  - c: the CH₂OH carbon of ethanol
    h: 2
    o: 1
  - c: the carbonyl carbon of acetone
    h: 0
    o: 2
  - c: the carboxyl carbon of acetic acid
    h: 0
    o: 3
  - c: the carbonyl carbon of acetaldehyde
    h: 1
    o: 2
  - c: carbon dioxide
    h: 0
    o: 4
  - c: the methyl carbon of ethane
    h: 3
    o: 0
  prompt: What is the oxidation state of the carbon in {{c}}?
  parts:
  - ask: Answer
    label: v
    tex: ''
    value: o - h
    final: true
    tol: 0.0001
    explain: 'Count +1 for each bond to O (a C=O counts twice), −1 for each H, 0 for each C: alcohol −1 → aldehyde +1 → acid +3'
  verify:
    expect:
      v: o - h

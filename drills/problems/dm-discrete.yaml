    o1: No list of infinite binary sequences contains them all
    o2: The rationals are countable
    o3: Every infinite set is countable
    o4: The reals are well-ordered
  - q: 'Since the algebraic numbers are countable and the reals are not:'
    o1: Transcendental numbers exist
    o2: Every real is algebraic
    o3: π is algebraic
    o4: The algebraic numbers are finite
  - q: 'For any set X, a function from X to its power set cannot be:'
    o1: Surjective
    o2: Injective
    o3: Defined
    o4: Constant
  - q: 'A countable union of countable sets is:'
    o1: Countable
    o2: Uncountable
    o3: Finite
    o4: Empty
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The diagonal sequence is built to disagree with every listed one, so the list was not complete. The same idea gives no surjection from a set onto its power set
  verify:
    authored: true

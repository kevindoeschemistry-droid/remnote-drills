    o4: (1 + x²)(1 + x)
  - q: Which factor represents an item that must be used an even number of times?
    o1: 1/(1 − x²)
    o2: 1/(1 − x)
    o3: 1 + x²
    o4: x/(1 − x²)
  - q: Which factor represents an item that must be used at least once?
    o1: x/(1 − x)
    o2: 1/(1 − x)
    o3: 1 + x
    o4: 1/(1 − x) + 1
  - q: 'The generating function of the Fibonacci numbers (F₀ = 0, F₁ = 1) is:'
    o1: x/(1 − x − x²)
    o2: 1/(1 − x − x²)
    o3: x/(1 − x)²
    o4: 1/(1 − 2x)
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001

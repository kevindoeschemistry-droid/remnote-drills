- template: dm-planarity-facts
  skill: dm.graphs
  pace: recall
  cases:
  - q: K₅ has 5 vertices and 10 edges. It is not planar because a simple planar graph on 5 vertices has at most how many edges?
    o1: '9'
    o2: '10'
    o3: '8'
    o4: '12'
  - q: 'K₃,₃ has 6 vertices, 9 edges and no triangles. It is not planar because the triangle-free bound 2V − 4 equals:'
    o1: '8'
    o2: '12'
    o3: '9'
    o4: '6'
  - q: 'Kuratowski''s theorem says a graph is planar exactly when it contains no subdivision of:'
    o1: K₅ or K₃,₃
    o2: K₄
    o3: Any odd cycle
    o4: K₃,₃ only
  - q: Every planar graph can be properly coloured with how many colours (the four colour theorem)?
    o1: '4'
    o2: '5'
    o3: '3'
    o4: '6'
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The bound E ≤ 3V − 6 comes from Euler's formula with every face having at least 3 sides. It can show a graph is not planar but never that one is
  verify:
    authored: true
- template: dm-hamilton-or-not
  skill: dm.graphs
  pace: recall
  cases:
  - nm: complete graph K₅
    kc: 0
  - nm: star with 4 leaves
    kc: 1
  - nm: cube graph
    kc: 0
  - nm: path on 5 vertices
    kc: 1
  - nm: complete bipartite graph K₂,₃
    kc: 1
  - nm: complete bipartite graph K₃,₃
    kc: 0
  - nm: Petersen graph
    kc: 1
  prompt: Does the {{nm}} have a Hamilton cycle?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: A bipartite graph can only have a Hamilton cycle if its two sides are equal, since the cycle alternates. A vertex of degree 1 rules one out. The Petersen graph is the standard 3-regular graph without one
  verify:
    authored: true
- template: dm-hall-ramsey-facts
  skill: dm.graphs
  pace: recall
  cases:
  - q: 'Three applicants are all qualified only for the same two jobs. Hall''s condition fails because:'
    o1: A set of 3 applicants has only 2 neighbours
    o2: The graph is not bipartite
    o3: There are more jobs than applicants
    o4: Some applicant has degree 2
  - q: 'Dirac''s theorem guarantees a Hamilton cycle in a graph on n ≥ 3 vertices when every degree is at least:'
    o1: n/2
    o2: '2'
    o3: n − 1
    o4: log n
  - q: 'The smallest n such that every red-blue colouring of the edges of K_n has a one-colour triangle is:'
    o1: '6'
    o2: '5'
    o3: '4'
    o4: '9'
  - q: 'A 5-cycle with its 5 diagonals coloured the other colour shows that R(3, 3) is greater than:'
    o1: '5'
    o2: '6'
    o3: '3'
    o4: '4'
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Hall's condition is obviously necessary; the theorem is that it is also enough
  verify:
    authored: true

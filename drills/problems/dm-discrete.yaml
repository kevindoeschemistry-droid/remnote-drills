  require:
  - ke <= 3*kv - 6
  prompt: A connected plane graph has {{kv}} vertices and {{ke}} edges. How many faces does it have, counting the outer one?
  parts:
  - ask: Answer
    label: v
    tex: F
    value: 2 - kv + ke
    final: true
    tol: 0.0001
    explain: V − E + F = 2 for every connected plane drawing, whatever the drawing looks like
  verify:

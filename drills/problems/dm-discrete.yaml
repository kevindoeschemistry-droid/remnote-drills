- template: dm-euler-classify
  skill: dm.graphs
  pace: recall
  cases:
  - kv: 0
    kc: 0
  - kv: 2
    kc: 1
  - kv: 4
    kc: 2
  - kv: 6
    kc: 2
  prompt: 'A connected graph has {{kv}} vertices of odd degree. It has:'
  parts:
  - ask: Answer
    label: v
    choice:
    - An Euler circuit
    - An Euler trail but no Euler circuit
    - Neither
    correct: kc
    explain: A closed walk using every edge once enters and leaves each vertex equally often, so all degrees are even. Two odd vertices can serve as the ends of an open trail; more than two cannot
  verify:
    authored: true

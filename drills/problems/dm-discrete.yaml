- template: dm-truth-rows
  skill: dm.logic
  pace: quick
  cases:
  - sh: p → q
    py: (not p) or q
    kv: 2
    kr: 4
    kans: 3
  - sh: (p and q) → r
    py: (not (p and q)) or r
    kv: 3
    kr: 8
    kans: 7
  - sh: (p or q) and not r
    py: (p or q) and not r
    kv: 3
    kr: 8
    kans: 3
  - sh: p ↔ q
    py: p == q
    kv: 2
    kr: 4
    kans: 2
  - sh: (p → q) and (q → r)
    py: ((not p) or q) and ((not q) or r)
    kv: 3
    kr: 8
    kans: 4
  - sh: p → (q → r)
    py: (not p) or ((not q) or r)
    kv: 3
    kr: 8
    kans: 7
  prompt: In how many of the {{kr}} rows of its truth table is {{sh}} true?
  parts:
  - ask: Answer
    label: v
    tex: rows
    value: kans
    final: true
    tol: 0.0001
    explain: 'Work row by row, or count the complement: an implication fails only where its hypothesis holds and its conclusion does not'
  verify:
    expect:
      v: pm_tt_count(py, kv)

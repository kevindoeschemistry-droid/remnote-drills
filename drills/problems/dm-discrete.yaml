    kans: 2
  - ge: a-b,b-c,c-d,d-e,e-a,a-f,b-f,c-f,d-f,e-f
    kans: 4
  prompt: What is the chromatic number of the graph with edges {{ge}}?
  parts:
  - ask: Answer
    label: v
    tex: \chi
    value: kans
    final: true
    tol: 0.0001

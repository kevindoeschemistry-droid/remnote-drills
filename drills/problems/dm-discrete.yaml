    label: v
    tex: trees
    value: kans
    final: true
    tol: 0.0001
    explain: 'Count the ways to delete edges until no cycle is left while staying connected. For a single cycle of length n, delete any one edge: n trees. Cayley''s formula gives n^(n−2) for a complete graph'

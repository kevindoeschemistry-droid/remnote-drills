- template: dm-handshake-edges
  skill: dm.graphs
  pace: quick
  given:
    ka:
      pick:
      - 2
      - 4
      - 6
    kb:
      pick:
      - 1
      - 3
      - 5
  prompt: A graph has {{ka}} vertices of degree 3 and {{kb}} vertices of degree 4. How many edges does it have?
  parts:
  - ask: Answer
    label: v
    tex: edges
    value: (3*ka + 4*kb)/2
    final: true
    tol: 0.0001
    explain: Every edge is counted at both ends, so the degree sum is twice the edge count
  verify:
    expect:
      v: solve(Eq(2*Symbol('m'), 3*ka + 4*kb), Symbol('m'))[0]
- template: dm-degree-sequence-possible
  skill: dm.graphs
  pace: recall
  cases:
  - sq: 3, 3, 3, 3
    kc: 0
  - sq: 3, 3, 3, 2
    kc: 1
  - sq: 4, 1, 1, 1, 1
    kc: 0
  - sq: 5, 2, 2, 2, 1
    kc: 1
  - sq: 2, 2, 2, 2, 2
    kc: 0
  - sq: 3, 2, 1
    kc: 1
  - sq: 3, 3, 1, 1
    kc: 1
  prompt: Can a simple graph have the degree sequence {{sq}}?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: 'First check the sum is even, then that no degree exceeds n − 1, then that the largest degrees can be met: in 3, 3, 1, 1 the two degree-3 vertices must each join both degree-1 vertices and each other, giving those leaves degree 2'
  verify:
    authored: true
- template: dm-forest-edges
  skill: dm.graphs
  pace: quick
  given:
    kn:
      pick:
      - 12
      - 15
      - 20
      - 30
    kc:
      pick:
      - 2
      - 3
      - 5
  prompt: A forest has {{kn}} vertices and {{kc}} connected components. How many edges does it have?
  parts:
  - ask: Answer
    label: v
    tex: edges
    value: kn - kc
    final: true
    tol: 0.0001
    explain: Each component is a tree with one fewer edge than vertices, so the total is n minus the number of components
  verify:
    expect:
      v: solve(Eq(kn - Symbol('m'), kc), Symbol('m'))[0]

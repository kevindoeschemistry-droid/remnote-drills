# Second question types; keys recomputed by sympy along another route.

- template: tp-homotopy-type
  skill: top.homotopy
  pace: recall
  cases:
  - sp: a closed disc
    kc: 0
  - sp: an annulus
    kc: 1
  - sp: the plane with one point removed
    kc: 1
  - sp: the plane with two points removed
    kc: 2
  - sp: a Möbius band
    kc: 1
  - sp: a solid torus
    kc: 1
  - sp: a torus with one point removed
    kc: 2
  - sp: three-dimensional space with one point removed
    kc: 3
  - sp: the letter A
    kc: 1
  - sp: the letter B
    kc: 2
  - sp: a tree
    kc: 0
  prompt: 'Up to homotopy equivalence, {{sp}} is:'
  parts:
  - ask: Answer
    label: v
    choice:
    - A point
    - A circle
    - A wedge of two circles (figure eight)
    - A 2-sphere
    correct: kc
    explain: 'Thicken or shrink without tearing: count the independent holes a loop can go round. A punctured torus retracts onto its two core circles, which meet at a point'
  verify:
    authored: true
- template: tp-homotopy-facts
  skill: top.homotopy
  pace: recall
  cases:
  - q: 'A space that is homotopy equivalent to a point is called:'
    o1: Contractible
    o2: Compact
    o3: Simply connected only
    o4: Discrete
  - q: 'Homotopy equivalent spaces must have the same:'
    o1: Fundamental group
    o2: Dimension
    o3: Number of points
    o4: Compactness
  - q: 'A disc and a point are homotopy equivalent but not homeomorphic. This shows homotopy equivalence is:'
    o1: Weaker than homeomorphism
    o2: Stronger than homeomorphism
    o3: The same as homeomorphism
    o4: Unrelated to homeomorphism
  - q: 'The circle is not contractible. One proof uses the fact that its fundamental group is:'
    o1: Z, which is not trivial
    o2: Trivial
    o3: Finite
    o4: Z/2
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Homotopy equivalence forgets dimension and thickness and keeps holes, which is what the algebraic invariants measure
  verify:
    authored: true

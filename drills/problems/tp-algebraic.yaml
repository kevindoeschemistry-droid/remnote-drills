  - ge: a-b,b-c,c-d,d-a,a-c
    kans: 2
  - ge: a-b,b-c,c-d,d-e,e-a,a-c,a-d
    kans: 3
  - ge: a-b,b-c,c-a,c-d,d-e,e-c

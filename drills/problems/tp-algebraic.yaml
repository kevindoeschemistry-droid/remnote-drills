- template: tp-fundamental-groups
  skill: top.homotopy
  pace: recall
  cases:
  - q: 'The fundamental group of the circle is:'
    o1: Z
    o2: Trivial
    o3: Z/2
    o4: Z²
  - q: 'The fundamental group of the torus is:'
    o1: Z²
    o2: Z
    o3: The free group on two generators
    o4: Trivial
  - q: 'The fundamental group of the real projective plane is:'
    o1: Z/2
    o2: Z
    o3: Trivial
    o4: Z²
  - q: 'The fundamental group of the figure eight is:'
    o1: The free group on two generators
    o2: Z²
    o3: Z
    o4: Z/2
  - q: 'The fundamental group of the 2-sphere is:'
    o1: Trivial
    o2: Z
    o3: Z/2
    o4: Z²
  - q: 'The torus and the figure eight both have two independent loops, but only the torus''s loops:'
    o1: Commute
    o2: Are contractible
    o3: Have finite order
    o4: Are homotopic to each other
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: On the torus the square with word a b a⁻¹ b⁻¹ fills in the commutator, forcing ab = ba; on the figure eight nothing does, so the group is free
  verify:
    authored: true
- template: tp-cover-genus
  skill: top.homotopy
  pace: quick
  given:
    kg:
      pick:
      - 1
      - 2
      - 3
    kn:
      pick:
      - 2
      - 3
      - 5
  prompt: A closed orientable surface of genus {{kg}} has a {{kn}}-sheeted covering by a closed orientable surface. What is the genus of the cover?
  parts:
  - ask: Answer
    label: v
    tex: g'
    value: kn*(kg - 1) + 1
    final: true
    tol: 0.0001
    explain: 'Euler characteristic multiplies by the number of sheets: 2 − 2g′ = n(2 − 2g), so g′ = n(g − 1) + 1. A torus is only ever covered by tori'
  verify:
    expect:
      v: solve(Eq(2 - 2*Symbol('m'), kn*(2 - 2*kg)), Symbol('m'))[0]
- template: tp-covering-facts
  skill: top.homotopy
  pace: recall
  cases:
  - q: The map t ↦ (cos 2πt, sin 2πt) from the real line to the circle is a covering with how many sheets?
    o1: Infinitely many
    o2: '1'
    o3: '2'
    o4: It is not a covering
  - q: The map z ↦ zⁿ on the unit circle is a covering with how many sheets?
    o1: n
    o2: '1'
    o3: '2'
    o4: Infinitely many
  - q: The 2-sphere covers the real projective plane with how many sheets?
    o1: '2'
    o2: '1'
    o3: '4'
    o4: Infinitely many
  - q: 'Connected coverings of a space correspond to:'
    o1: Subgroups of its fundamental group, up to conjugacy
    o2: Its homology groups
    o3: Its open covers
    o4: Its connected components
  - q: 'A simply connected covering space of X is called its:'
    o1: Universal cover
    o2: Double cover
    o3: Quotient
    o4: Suspension
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The number of sheets is the index of the corresponding subgroup; the universal cover corresponds to the trivial subgroup
  verify:
    authored: true
- template: tp-betti-one
  skill: top.homotopy
  pace: quick
  given:
    kx:
      pick:
      - -2
      - -4
      - -6
      - -8
  prompt: A closed orientable surface has Euler characteristic {{kx}}. Find its first Betti number b₁.
  parts:
  - ask: Answer
    label: v
    tex: b_1
    value: 2 - kx
    final: true
    tol: 0.0001
    explain: χ = b₀ − b₁ + b₂ with b₀ = b₂ = 1 for a closed connected orientable surface, so b₁ = 2 − χ = 2g
  verify:
    expect:
      v: solve(Eq(1 - Symbol('m') + 1, kx), Symbol('m'))[0]
- template: tp-homology-facts
  skill: top.homotopy
  pace: recall
  cases:
  - q: The sphere Sⁿ (n ≥ 1) has non-zero homology in which degrees?
    o1: 0 and n only
    o2: Every degree up to n
    o3: n only
    o4: 0 only
  - q: 'Brouwer''s fixed-point theorem says every continuous map from a closed disc to itself:'
    o1: Has a fixed point
    o2: Is a homeomorphism
    o3: Is constant
    o4: Has a periodic point of period 2
  - q: 'There is no continuous retraction of a disc onto its boundary circle. This is proved by comparing:'
    o1: Their fundamental groups or first homology
    o2: Their dimensions
    o3: Their areas
    o4: Their compactness
  - q: 'The Euler characteristic can be computed from Betti numbers as:'
    o1: Their alternating sum
    o2: Their sum
    o3: Their product
    o4: The largest of them
  - q: 'Rⁿ and Rᵐ are not homeomorphic for n ≠ m. The proof removes a point and compares:'
    o1: The homology of the spheres that remain, up to homotopy
    o2: The number of components
    o3: Compactness
    o4: Their bases
  prompt: '{{q}}'
  parts:

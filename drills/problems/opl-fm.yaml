    S0:
      pick:
      - 0.001
      - 0.002
    Sf:
      pick:
      - 0.0005
      - 0.003
      - 0.004
    Fr:
      pick:
      - 0.4
      - 0.6
      - 1.5
  prompt: In a gradually varied flow, $S_0 = {{S0}}$, the friction slope is $S_f = {{Sf}}$ and $Fr = {{Fr}}$. What is $dy/dx$?
  parts:
  - ask: Answer
    label: v
    tex: dy/dx
    value: (S0 - Sf)/(1 - Fr^2)
    tol: 0.005
    explain: The sign tells whether the depth grows or falls downstream; it flips between subcritical and supercritical flow
  verify:
    expect:
      v: (nsimplify(S0) - nsimplify(Sf))/(1 - nsimplify(Fr)**2)
- template: fm-profile-class
  skill: fm.energy
  pace: quick
  given:
    yn:
      pick:
      - 1.5
      - 2
    yc:
      pick:
      - 0.6
      - 0.8
    y:
      pick:
      - 0.4
      - 1.2
      - 2.5
  prompt: On a mild slope (normal depth {{yn}} m, critical depth {{yc}} m) the flow depth is {{y}} m. Which profile type?
  parts:
  - ask: Answer
    label: v
    choice:
    - M1 (above normal depth)
    - M2 (between normal and critical)
    - M3 (below critical)
    correct: 'y > yn ? 0 : (y > yc ? 1 : 2)'
    explain: Zones are set by where y sits relative to y_n and y_c; M1 backwater curves form behind dams
  verify:
    choices:
      v: 0 if nsimplify(y) > nsimplify(yn) else (1 if nsimplify(y) > nsimplify(yc) else 2)
- template: fm-hydraulic-jump
  skill: fm.momentum
  pace: quick
  given:
    y1:
      pick:
      - 0.2
      - 0.3
      - 0.5
    Fr:
      pick:
      - 2
      - 3
      - 4
      - 5
  prompt: Supercritical flow {{y1}} m deep with $Fr_1 = {{Fr}}$ jumps to subcritical. What is the depth after the jump, in m?
  parts:
  - ask: Answer
    label: v
    tex: y_2
    value: y1/2*(-1 + sqrt(1 + 8*Fr^2))
    tol: 0.005
    explain: Momentum, not energy, is conserved across the jump; the turbulence dissipates the difference
  verify:
    expect:
      v: Max(*solve(Eq(x**2 + nsimplify(y1)*x - 2*nsimplify(y1)**2*nsimplify(Fr)**2, 0), x))
- template: fm-jump-head-loss
  skill: fm.energy
  pace: quick
  given:
    y1:
      pick:
      - 0.2
      - 0.3
      - 0.5
    y2:
      pick:
      - 1
      - 1.5
      - 2
  prompt: A hydraulic jump goes from {{y1}} m to {{y2}} m depth. How much head does it dissipate, in m?
  parts:
  - ask: Answer
    label: v
    tex: h_L
    value: (y2 - y1)^3/(4*y1*y2)
    tol: 0.005
    explain: Specific energies before and after, with q² from the momentum balance (q²/g = y₁y₂(y₁ + y₂)/2), differ by (y₂ − y₁)³/(4y₁y₂)
  verify:
    expect:
      v: nsimplify(y1) - nsimplify(y2) + nsimplify(y1)*nsimplify(y2)*(nsimplify(y1) + nsimplify(y2))/4*(1/nsimplify(y1)**2 - 1/nsimplify(y2)**2)
- template: fm-turbine-power
  skill: fm.energy
  pace: quick
  given:
    Q:
      pick:
      - 5
      - 10
      - 50
    H:
      pick:
      - 20
      - 50
      - 100
    eta:
      pick:
      - 0.85
      - 0.9
  prompt: A hydro plant passes {{Q}} m³/s through a head of {{H}} m at overall efficiency {{eta}}. What is the power, in MW? ($\rho g = 9810$ N/m³)
  parts:
  - ask: Answer
    label: v
    tex: P
    value: eta*9810*Q*H/1000000
    tol: 0.005
    explain: Water power $\rho gQH$ times efficiency. High head and low flow suit Pelton wheels; low head and high flow suit Kaplan turbines
  verify:
    expect:
      v: integrate(nsimplify(eta)*9810*Q, (x, 0, H))/1000000
- template: fm-turbine-head
  skill: fm.energy
  pace: quick
  given:
    P:
      pick:
      - 5
      - 20
      - 100
    Q:
      pick:
      - 10
      - 25
      - 80
    eta:
      pick:
      - 85
      - 90
      - 93
  prompt: A turbine produces {{P}} MW from {{Q}} m³/s of water with efficiency {{eta}}%. What net head, in m, is it working with?
  parts:
  - ask: Answer
    label: v
    tex: H
    value: P*1e6/(1000*9.81*Q*eta/100)
    tol: 0.005
    explain: Shaft power = η ρgQH; turbines lose to the efficiency, pumps divide by it
  verify:
    expect:
      v: solve(Eq(nsimplify(P)*10**6, 1000*Rational(981, 100)*Q*x*Rational(eta, 100)), x)[0]

      - 0.6
      - 1.5
  prompt: In a gradually varied flow, $S_0 = {{S0}}$, the friction slope is $S_f = {{Sf}}$ and $Fr = {{Fr}}$. What is $dy/dx$?
  parts:
  - ask: Answer
    label: v
    tex: dy/dx
    value: (S0 - Sf)/(1 - Fr^2)
    tol: 0.005
    explain: The sign tells whether the depth grows or falls downstream; it flips between subcritical and supercritical flow
  verify:
    expect:
      v: (nsimplify(S0) - nsimplify(Sf))/(1 - nsimplify(Fr)**2)
- template: fm-hydraulic-jump
  skill: fm.momentum
  pace: quick
  given:
    y1:
      pick:
      - 0.2
      - 0.3
      - 0.5
    Fr:
      pick:
      - 2
      - 3
      - 4
      - 5
  prompt: Supercritical flow {{y1}} m deep with $Fr_1 = {{Fr}}$ jumps to subcritical. What is the depth after the jump, in m?
  parts:
  - ask: Answer
    label: v
    tex: y_2
    value: y1/2*(-1 + sqrt(1 + 8*Fr^2))
    tol: 0.005
    explain: Momentum, not energy, is conserved across the jump; the turbulence dissipates the difference
  verify:
    expect:
      v: Max(*solve(Eq(x**2 + nsimplify(y1)*x - 2*nsimplify(y1)**2*nsimplify(Fr)**2, 0), x))
- template: fm-turbine-power
  skill: fm.energy
  pace: quick
  given:
    Q:
      pick:
      - 5
      - 10
      - 50
    H:
      pick:
      - 20
      - 50
      - 100
    eta:
      pick:
      - 0.85
      - 0.9
  prompt: A hydro plant passes {{Q}} m³/s through a head of {{H}} m at overall efficiency {{eta}}. What is the power, in MW? ($\rho g = 9810$ N/m³)
  parts:
  - ask: Answer
    label: v
    tex: P
    value: eta*9810*Q*H/1000000
    tol: 0.005
    explain: Water power $\rho gQH$ times efficiency. High head and low flow suit Pelton wheels; low head and high flow suit Kaplan turbines
  verify:
    expect:
      v: integrate(nsimplify(eta)*9810*Q, (x, 0, H))/1000000

    tex: \nu
    value: (sqrt(6)*atan(sqrt((M^2 - 1)/6)) - atan(sqrt(M^2 - 1)))*180/pi
    tol: 0.005
    explain: Turning a supersonic flow away from itself by an angle θ raises ν by θ; read the new Mach number from ν
  verify:
    expect:
      v: (sqrt(6)*atan(sqrt((nsimplify(M)**2 - 1)/6)) - atan(sqrt(nsimplify(M)**2 - 1)))*180/pi
- template: fm-fanno
  skill: fm.compressible
  pace: quick
  given:
    M:
      pick:
      - 0.2
      - 0.3
      - 0.5
      - 2
  prompt: Air ($k = 1.4$) enters an adiabatic duct at Mach {{M}}. Find $\bar f L^*/D$ (Darcy $\bar f$), the friction length to choke.
  parts:
  - ask: Answer
    label: v
    tex: \bar fL^*/D
    value: (1 - M^2)/(1.4*M^2) + (2.4/2.8)*log(2.4*M^2/(2 + 0.4*M^2))
    tol: 0.005
    explain: Friction drives both subsonic and supersonic Fanno flow toward Mach 1; a longer duct than $L^*$ reduces the flow rate instead
  verify:
    expect:
      v: (1 - nsimplify(M)**2)/(Rational(7, 5)*nsimplify(M)**2) + Rational(6, 7)*log(Rational(12, 5)*nsimplify(M)**2/(2 + Rational(2, 5)*nsimplify(M)**2))

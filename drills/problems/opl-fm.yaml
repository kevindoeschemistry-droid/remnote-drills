- template: fm-pressure-gradient
  skill: fm.external
  pace: recall
  cases:
  - q: What happens to a boundary layer in a strong adverse pressure gradient (pressure rising downstream)?
    ans: 0
  - q: What does a favourable pressure gradient (pressure falling downstream) do to a boundary layer?
    ans: 1
  - q: Where on a cylinder in cross-flow does the pressure gradient become adverse?
    ans: 2
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - It thickens and may separate, with reversed flow near the wall
    - It thins and stays attached, delaying transition
    - Past the shoulder, on the rear half
    correct: ans
    explain: The near-wall fluid has little momentum; pushing against rising pressure stops it first. Separation is why bluff bodies have large pressure drag
  verify:
    authored: true
- template: fm-gradient-sign
  skill: fm.external
  pace: quick
  given:
    a:
      pick:
      - 5
      - 10
    b:
      pick:
      - -2
      - -1
      - 1
      - 3
  prompt: Outside a boundary layer the speed varies as U(x) = {{a}} + {{b}}x. Is the pressure gradient along the wall favourable or adverse?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Favourable (dp/dx < 0): the layer stays attached'
    - 'Adverse (dp/dx > 0): it may separate'
    correct: 'b > 0 ? 0 : 1'
    explain: 'Euler at the edge: dp/dx = −ρU dU/dx. Decelerating outer flow raises pressure downstream and slows the near-wall fluid'
  verify:
    choices:
      v: 0 if (-(a + b*Symbol('xx'))*diff(a + b*Symbol('xx'), Symbol('xx'))).subs(Symbol('xx'), 0) < 0 else 1

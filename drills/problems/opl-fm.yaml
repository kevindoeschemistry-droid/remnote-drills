- template: fm-curved-surface
  skill: fm.statics
  pace: quick
  given:
    R:
      pick:
      - 1
      - 2
      - 3
    w:
      pick:
      - 1
      - 2
      - 4
  prompt: A quarter-circle gate of radius {{R}} m and width {{w}} m holds water ($\rho g = 9810$ N/m³) above it, the water surface level with the top of the arc. What is the vertical force on the gate, in kN?
  parts:
  - ask: Answer
    label: v
    tex: F_V
    value: 9810*(R^2 - pi*R^2/4)*w/1000
    tol: 0.005
    explain: 'Count the water standing on the gate: the square $R \times R$ less the quarter circle, times the width. The horizontal component is the force on the vertical projection'
  verify:
    expect:
      v: integrate(9810*w*(R - sqrt(R**2 - x**2)), (x, 0, R))/1000

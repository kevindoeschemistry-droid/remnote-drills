  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Preview, signpost, summarise, at every level: it is the only way a listener can keep place without a document'
  verify:
    authored: true
- template: spk-ramble-ratio
  skill: speak.structure
  pace: quick
  given:
    dur:
      pick:
      - 60
      - 120
      - 240
    tp:
      pick:
      - 15
      - 45
      - 110
  require:
  - tp < dur
  prompt: An answer of {{dur}} seconds reaches its point at {{tp}} seconds. What percentage of the answer preceded the point?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*tp/dur
    tol: 0.005
    explain: A point arriving past the halfway mark is a buried point by definition, whatever the speaker intended; the percentage is the diagnosis, and moving the point first is the fix
  verify:
    expect:
      v: 100*Rational(tp, dur)
- template: spk-ending-length
  skill: speak.structure
  pace: quick
  given:
    nw:
      pick:
      - 10
      - 16
      - 24
    wp:
      pick:
      - 120
      - 140
  prompt: An ending is one sentence of {{nw}} words at {{wp}} words a minute. How long is it (seconds)?
  parts:
  - ask: Answer
    label: v
    tex: seconds
    value: nw/wp*60
    tol: 0.005
    explain: 'A planned ending is five to ten seconds, which is a trivial cost for the most memorable position in the turn: the alternative is trailing off into whatever was said last'
  verify:
    expect:
      v: Rational(nw, wp)*60
- template: spk-table-topic-shape
  skill: speak.impromptu
  pace: recall
  cases:
  - q: 'The pause before an impromptu answer is used to:'
    o1: Choose the point and the frame, not to begin composing sentences
    o2: Calm down
    o3: Recall facts
    o4: Think of an opening line
  - q: 'A 60-second impromptu answer is best structured as:'
    o1: A frame the speaker already knows, usually PREP
    o2: A free-form response
    o3: A story
    o4: A list
  - q: 'The commonest impromptu failure is:'
    o1: Starting to speak before deciding the point
    o2: Speaking too slowly
    o3: Too short an answer
    o4: Too much structure
  - q: 'Practising impromptu with random prompts builds:'
    o1: The habit of choosing a point and a frame fast, which is the transferable part
    o2: Knowledge of the prompts
    o3: Vocabulary
    o4: Confidence only
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The pause chooses point and frame; everything else is the frame the speaker already has
  verify:
    authored: true
- template: spk-followup-promise
  skill: speak.impromptu
  pace: quick
  given:
    nq:
      pick:
      - 4
      - 10
      - 25
    dd:
      pick:
      - 2
      - 5
      - 7
    nk:
      pick:
      - 1
      - 7
      - 20
  require:
  - nk < nq
  prompt: A speaker promises follow-ups on {{nq}} questions within {{dd}} days each. If {{nk}} are delivered on time, what percentage of promises were kept?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*nk/nq
    tol: 0.005
    explain: The 'I don't know, I'll come back to you' move only works if the rate is high; a speaker who promises and does not deliver has spent the move's credibility for everyone else too
  verify:
    expect:
      v: 100*Rational(nk, nq)
- template: spk-qa-shape
  skill: speak.impromptu
  pace: recall
  cases:
  - q: 'The four parts of a good answer to an audience question are:'
    o1: Pause, one-sentence answer, one support, check
    o2: Restate, answer, elaborate, thank
    o3: Thank, answer, expand, move on
    o4: Answer, context, caveat, close
  - q: Giving one support rather than three does what?
    o1: Leaves room for the follow-up, which is where the asker's real question usually is
    o2: Looks underprepared
    o3: Shortens the Q&A
    o4: Nothing
  - q: 'The check at the end is:'
    o1: Asking whether that answered what they asked
    o2: Thanking the asker
    o3: Inviting another question
    o4: Summarising
  - q: 'Skipping the check costs:'
    o1: Finding out the answer missed the question, so the next question is the same one
    o2: Time
    o3: Nothing
    o4: Credibility
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Four parts, and the check is the one that stops a Q&A circling the same question
  verify:
    authored: true
- template: spk-qa-mix
  skill: speak.impromptu
  pace: quick
  given:
    nc:
      pick:
      - 2
      - 6
      - 12
    nh:
      pick:
      - 1
      - 4
      - 9
    'no':
      pick:
      - 0
      - 2
      - 5
    nm:
      pick:
      - 1
      - 3
      - 7
  prompt: A Q&A had {{nc}} clarifying, {{nh}} challenging, {{no}} off-topic questions and {{nm}} comments. What percentage needed a move other than expanding?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(nh + no + nm)/(nc + nh + no + nm)
    tol: 0.005
    explain: Most questions in a technical Q&A are not requests for more detail, which is why treating every one as a clarification leaves objections standing and comments unbounded
  verify:
    expect:
      v: 100*Rational(nh + no + nm, nc + nh + no + nm)
- template: spk-star-action-share
  skill: speak.impromptu
  pace: quick
  given:
    dur:
      pick:
      - 90
      - 120
    na:
      pick:
      - 40
      - 60
      - 80
    nr:
      pick:
      - 10
      - 20
      - 30
  require:
  - na + nr < dur
  prompt: In a {{dur}}-second STAR answer, action takes {{na}} seconds and result {{nr}}. What percentage is action and result together?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(na + nr)/dur
    tol: 0.005
    explain: Action and result should be most of the answer; below about two-thirds the answer is mostly context, which is the fault the interviewer notices and the speaker does not
  verify:
    expect:
      v: 100*Rational(na + nr, dur)
- template: spk-we-count
  skill: speak.impromptu
  pace: quick
  given:
    ni:
      pick:
      - 2
      - 9
      - 20
    nw:
      pick:
      - 3
      - 12
      - 30
  prompt: A STAR answer uses 'I' {{ni}} times and 'we' {{nw}} times. What percentage of the agent references were first person singular?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*ni/(ni + nw)
    tol: 0.005
    explain: Counting the pronouns on a transcript is the fastest diagnosis of the 'we' fault, and it is the one speakers most reliably deny until they see the count
  verify:
    expect:
      v: 100*Rational(ni, ni + nw)
- template: spk-intro-lead
  skill: speak.impromptu
  pace: recall
  cases:
  - q: 'A 30-second introduction should lead with:'
    o1: What you work on now
    o2: Where you studied
    o3: Your earliest relevant experience
    o4: Your job title alone
  - q: 'A chronological introduction fails because:'
    o1: It spends the listener's attention before reaching the present
    o2: It is boring
    o3: It is too long
    o4: It is impersonal
  - q: 'The path to the current work belongs:'
    o1: After it, and only the part that explains it
    o2: First
    o3: Not at all
    o4: In full
  - q: 'The introduction should end:'
    o1: Pointing at what the listener can do with the information
    o2: With thanks
    o3: With a question
    o4: With credentials
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Now, then the path that explains now: the chronological version never reaches the point'
  verify:
    authored: true
- template: spk-starting-point
  skill: speak.explain
  pace: quick
  given:
    ns:
      pick:
      - 5
      - 9
      - 15
    nk:
      pick:
      - 1
      - 4
      - 10
  require:
  - nk < ns
  prompt: An explanation has {{ns}} steps of which the listener already knows {{nk}}. What percentage of the explanation is new to them?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(ns - nk)/ns
    tol: 0.005
    explain: Establishing the starting point is what lets the known steps be compressed into a sentence, buying the attention the new ones need
  verify:
    expect:
      v: 100*Rational(ns - nk, ns)
- template: spk-three-sentence-shape
  skill: speak.explain
  pace: recall
  cases:
  - q: 'The three sentences of a short explanation are:'
    o1: What it is, what it is for, and why it is hard
    o2: Definition, history, application
    o3: What, how, why
    o4: Problem, method, result
  - q: 'Having the three-sentence version ready matters because:'
    o1: Most occasions to explain are short and unplanned
    o2: It is easier to remember
    o3: It impresses
    o4: It avoids questions
  - q: '''Why it is hard'' is included because:'
    o1: It tells the listener why the work exists, which is what they usually wanted
    o2: It shows difficulty
    o3: It invites questions
    o4: It fills the third sentence
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Three sentences, and the third is the one that turns a definition into a reason to care
  verify:
    authored: true
- template: spk-level-jargon
  skill: speak.explain
  pace: quick
  given:
    nj:
      pick:
      - 8
      - 15
      - 30
    nk:
      pick:
      - 1
      - 5
      - 12
  require:
  - nk < nj
  prompt: An explanation uses {{nj}} technical terms for a specialist. Re-pitched for a novice, {{nk}} are kept. What percentage were replaced or dropped?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(nj - nk)/nj
    tol: 0.005
    explain: Re-pitching is mostly a vocabulary edit plus a depth decision; counting the terms kept is a quick check that the novice version really was re-pitched rather than just slowed down
  verify:
    expect:
      v: 100*Rational(nj - nk, nj)
- template: spk-case-first-order
  skill: speak.explain
  pace: quick
  given:
    ns:
      pick:
      - 6
      - 9
      - 12
    nc:
      pick:
      - 2
      - 3
      - 5
    nb:
      pick:
      - 1
      - 2
      - 3
  require:
  - nc + nb < ns
  prompt: An explanation has one case, one bridge and one rule, in {{ns}} sentences total. If the case takes {{nc}} and the bridge {{nb}}, how many are left for the rule?
  parts:
  - ask: Answer
    label: v
    tex: sentences
    value: ns - nc - nb
    final: true
    tol: 0.0001
    explain: 'The rule is usually the shortest part, which is the opposite of how explanations are written: most of the words belong to the case and the bridge'
  verify:
    expect:
      v: ns - nc - nb
- template: spk-analogy-mapping
  skill: speak.explain
  pace: quick
  given:
    nm:
      pick:
      - 2
      - 4
      - 7
    nt:
      pick:
      - 5
      - 9
      - 14
  require:
  - nm < nt
  prompt: An analogy maps {{nm}} of the idea's {{nt}} features. What percentage of the idea does it not cover, and so has to be stated as the break?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(nt - nm)/nt
    tol: 0.005
    explain: 'An analogy usually covers a minority of the features, which is why the break has to be named: the listener assumes everything maps unless told otherwise'
  verify:
    expect:
      v: 100*Rational(nt - nm, nt)
- template: spk-attention-budget
  skill: speak.explain
  pace: quick
  given:
    at:
      pick:
      - 60
      - 120
      - 300
    sp:
      pick:
      - 20
      - 70
      - 180
  require:
  - sp < at
  prompt: A listener's attention allows about {{at}} seconds. An explanation spends {{sp}} seconds before the part they needed. What percentage of their attention was spent first?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*sp/at
    tol: 0.005
    explain: Attention is a budget spent in order, so an explanation that is complete and correct can still fail by reaching the needed part after the budget is gone
  verify:
    expect:
      v: 100*Rational(sp, at)
- template: spk-one-idea-step
  skill: speak.explain
  pace: recall
  cases:
  - q: 'A step in an explanation should contain:'
    o1: One idea, so a failed step can be identified
    o2: As much as fits in a sentence
    o3: A complete argument
    o4: An example and a rule
  - q: Pausing after a step does what?
    o1: Gives the listener time to attach it before the next arrives
    o2: Signals the end
    o3: Checks attention
    o4: Slows the pace
  - q: 'A step containing three ideas fails because:'
    o1: When the listener loses it, neither of you knows which idea it was
    o2: It is too long
    o3: It is too fast
    o4: It needs an example
  - q: 'The number of steps is set by:'
    o1: How many ideas the explanation actually contains
    o2: The time available
    o3: The listener's level
    o4: Convention
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: One idea a step is what makes a failure locatable, which is the whole point of stepping an explanation
  verify:
    authored: true
- template: spk-check-rate
  skill: speak.explain
  pace: quick
  given:
    ns:
      pick:
      - 5
      - 9
      - 15
    nc:
      pick:
      - 1
      - 3
      - 8
  require:
  - nc <= ns
  prompt: An explanation of {{ns}} steps includes {{nc}} real checks. What percentage of steps were checked?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*nc/ns
    tol: 0.005
    explain: Checking every step is too slow and checking none means finding out at the end; checking at the steps where understanding is most likely to fail is the judgment the number prompts
  verify:
    expect:
      v: 100*Rational(nc, ns)
- template: spk-reexplain-attempts
  skill: speak.explain
  pace: quick
  given:
    na:
      pick:
      - 2
      - 3
      - 5
    dr:
      pick:
      - 30
      - 60
      - 90
  prompt: A concept took {{na}} attempts to land, each about {{dr}} seconds. How long was spent in total (seconds)?
  parts:
  - ask: Answer
    label: v
    tex: seconds
    value: na*dr
    final: true
    tol: 0.0001
    explain: 'Each re-explanation costs as much as the first, which is the argument for a real check early: finding the misunderstanding after three attempts has already spent the time three different routes would have'
  verify:
    expect:
      v: na*dr
- template: spk-number-rules
  skill: speak.explain
  pace: recall
  cases:
  - q: 'A number stated for the ear should be:'
    o1: Rounded, with one comparison and a stated unit
    o2: Exact to the decimal
    o3: Repeated twice
    o4: Written on a slide only
  - q: '''About one in three'' is better than ''34.2 per cent'' because:'
    o1: The listener can hold it and picture it
    o2: It is more accurate
    o3: It is shorter to say
    o4: It is more formal
  - q: 'The comparison matters because:'
    o1: A magnitude without a reference means nothing to a listener
    o2: It fills time
    o3: It adds precision
    o4: It is conventional
  - q: 'Giving three precise figures in a sentence:'
    o1: Loses all three, since none can be held
    o2: Is thorough
    o3: Is precise
    o4: Is fine if slow
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Round it, compare it, name the unit, and give one number at a time
  verify:
    authored: true
- template: spk-figure-sentences
  skill: speak.explain
  pace: quick
  given:
    nf:
      pick:
      - 2
      - 4
      - 8
    wp:
      pick:
      - 130
      - 150
    nw:
      pick:
      - 12
      - 18
  prompt: Talking through {{nf}} figures at three sentences each, at {{wp}} words a minute and {{nw}} words a sentence, takes how long (seconds)?
  parts:
  - ask: Answer
    label: v
    tex: seconds
    value: nf*3*nw/wp*60
    tol: 0.005

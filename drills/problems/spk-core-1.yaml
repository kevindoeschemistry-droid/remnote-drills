    o2: Good breath support
    o3: A relaxed throat
    o4: Correct posture
  - q: 'An audible gasp before a phrase means:'
    o1: The breath was taken too fast through a narrow airway
    o2: The room is loud
    o3: The phrase is long
    o4: The microphone is close
  - q: 'Breath is best taken:'

- template: la-jordan-power
  skill: la.diagonalization
  pace: quick
  given:
    l:
      pick:
      - -2
      - -1
      - 2
      - 3
    k:
      int:
      - 2
      - 5
  prompt: $J = \begin{pmatrix} {{l}} & 1 \\ 0 & {{l}} \end{pmatrix}$ cannot be diagonalised. Find the (1, 2) entry of $J^{ {{k}} }$.
  parts:
  - ask: Answer
    label: v
    tex: (J^k)_{12}
    value: k*l^(k - 1)
    tol: 0.005
    explain: 'Write $J = \lambda I + N$ with $N^2 = 0$; the binomial theorem stops after two terms: $J^k = \lambda^kI + k\lambda^{k-1}N$. That extra factor $k$ is where $te^{\lambda t}$ comes from in repeated-root ODEs'
  verify:
    expect:
      v: (Matrix([[l, 1], [0, l]])**k)[0, 1]
- template: la-jordan-exp
  skill: la.diagonalization
  pace: quick
  given:
    l:
      pick:
      - -1
      - -0.5
      - 0.5
      - 1
    t:
      pick:
      - 0.5
      - 1
      - 2
  prompt: $J = \begin{pmatrix} {{l}} & 1 \\ 0 & {{l}} \end{pmatrix}$. What is the (1, 2) entry of $e^{Jt}$ at $t = {{t}}$?
  parts:
  - ask: Answer
    label: v
    tex: ''
    value: t*exp(l*t)
    tol: 0.005
    explain: 'e^{Jt} = e^{λt}(I + Nt) because N² = 0: the off-diagonal is te^{λt}'
  verify:
    expect:
      v: (Matrix([[nsimplify(l), 1], [0, nsimplify(l)]])*nsimplify(t)).exp()[0, 1]
- template: la-orthogonal-inverse
  skill: la.orthogonality
  pace: quick
  cases:
  - p: 3
    q: 4
    n: 5
  - p: 5
    q: 12
    n: 13
  - p: 8
    q: 6
    n: 10
  - p: 4
    q: -3
    n: 5
  - p: 12
    q: 5
    n: 13
  prompt: $Q = \frac{1}{ {{n}} }\begin{pmatrix} {{p}} & {{-q}} \\ {{q}} & {{p}} \end{pmatrix}$ is orthogonal. What is the (1, 2) entry of $Q^{-1}$?
  parts:
  - ask: Answer
    label: v
    tex: (Q^{-1})_{12}
    value: q/n
    tol: 0.005
    explain: For an orthogonal matrix the inverse is the transpose, so $(Q^{-1})_{12} = Q_{21}$. No determinant or row reduction needed
  verify:
    expect:
      v: (Matrix([[p, -q], [q, p]])/n).inv()[0, 1]

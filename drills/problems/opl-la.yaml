# Generated by scripts/opl_fill.py from scripts/opl_specs/la.py: edit the spec, not this file.
# WeBWorK OPL gap-fill for framework LA. One question each; keys recomputed by sympy along another route.

- template: la-is-vector-space
  skill: la.subspaces
  pace: recall
  cases:
  - q: the polynomials of degree at most 3
    ans: 0
  - q: the polynomials of degree exactly 3
    ans: 1
  - q: the 2 × 2 symmetric matrices
    ans: 0
  - q: the invertible 2 × 2 matrices
    ans: 1
  - q: the functions on [0, 1] with f(0) = 0
    ans: 0
  - q: the functions on [0, 1] with f(0) = 1
    ans: 1
  - q: the solutions of y″ + y = 0
    ans: 0
  - q: the solutions of y″ + y = 1
    ans: 1
  - q: the 2 × 2 matrices with trace 0
    ans: 0
  - q: the positive real numbers
    ans: 1
  prompt: Is {{q}} a vector space under the usual addition and scalar multiplication?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: ans
    explain: Ask whether the zero element is in the set and whether sums and multiples stay in it. Degree exactly 3 fails (the sum of x³ and −x³ is 0); invertible matrices miss the zero matrix; a nonhomogeneous condition (f(0) = 1, y″ + y = 1) fails closure.
  verify:
    authored: true
- template: la-poly-combination
  skill: la.span
  pace: quick
  given:
    a:
      int:
      - -4
      - 5
    b:
      int:
      - -4
      - 5
    c:
      int:
      - -4
      - 5
  require:
  - b != 0
  prompt: Write $p = {{a + c}} + ({{a + b}})t + ({{b + c}})t^2$ as $c_1(1 + t) + c_2(t + t^2) + c_3(1 + t^2)$. What is $c_2$?
  parts:
  - ask: Answer
    label: v
    tex: c_2
    value: b
    tol: 0.005
    explain: 'Match constants, $t$ and $t^2$: $c_1 + c_3 = {{a + c}}$, $c_1 + c_2 = {{a + b}}$, $c_2 + c_3 = {{b + c}}$. In coordinates on $\{1, t, t^2\}$ this is an ordinary $3 \times 3$ system'
  verify:
    expect:
      v: (Matrix([[1, 0, 1], [1, 1, 0], [0, 1, 1]]).inv()*Matrix([a + c, a + b, b + c]))[1]
- template: la-poly-span
  skill: la.span
  pace: quick
  given:
    a:
      int:
      - -4
      - 5
    b:
      int:
      - -4
      - 5
    e:
      pick:
      - 0
      - 0
      - 1
      - -2
  prompt: Is ${{a}} + ({{b}})t + ({{a + b + e}})t^2$ in the span of $1 + t^2$ and $t + t^2$?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: 'e == 0 ? 0 : 1'
    explain: $c_1(1 + t^2) + c_2(t + t^2)$ has constant $c_1$, $t$-coefficient $c_2$ and $t^2$-coefficient $c_1 + c_2$. So the $t^2$ coefficient must equal ${{a}} + ({{b}})$
  verify:
    choices:
      v: 0 if Matrix([[1, 0], [0, 1], [1, 1]]).rank() == Matrix([[1, 0, a], [0, 1, b], [1, 1, a + b + e]]).rank() else 1
- template: la-poly-dependence
  skill: la.independence
  pace: quick
  given:
    a:
      int:
      - -3
      - 4
    b:
      int:
      - -3
      - 4
  require:
  - b != 0
  prompt: For which $h$ are $1 + {{a}}t + t^2$, $t + {{b}}t^2$ and $1 + ht$ linearly dependent?
  parts:
  - ask: Answer
    label: v
    tex: h
    value: a - 1/b
    tol: 0.005
    explain: 'Write each as a coefficient vector on $\{1, t, t^2\}$ and set the determinant to zero: $-b(h - a) - 1 = 0$, so $h = {{a}} - 1/{{b}}$'
  verify:
    expect:
      v: solve(Matrix([[1, a, 1], [0, 1, b], [1, x, 0]]).det(), x)[0]
- template: la-space-dimension
  skill: la.subspaces
  pace: recall
  given:
    n:
      int:
      - 2
      - 6
  cases:
  - q: n × n symmetric matrices
    kd: 0
  - q: n × n skew-symmetric matrices
    kd: 1
  - q: n × n matrices with trace 0
    kd: 2
  - q: polynomials of degree at most n
    kd: 3
  - q: n × n upper-triangular matrices
    kd: 4
  prompt: What is the dimension of the space of {{q}}, with $n = {{n}}$?
  parts:
  - ask: Answer
    label: v
    tex: \dim
    value: 'kd == 0 ? n*(n + 1)/2 : (kd == 1 ? n*(n - 1)/2 : (kd == 2 ? n^2 - 1 : (kd == 3 ? n + 1 : n*(n + 1)/2)))'
    tol: 0.005
    explain: Count the entries you may choose freely. A symmetric matrix is fixed by its diagonal and upper triangle; a skew one by the strict upper triangle; trace zero removes one condition from $n^2$
  verify:
    expect:
      v: summation(Symbol('i'), (Symbol('i'), 1, n)) if kd in (0, 4) else (summation(Symbol('i') - 1, (Symbol('i'), 1, n)) if kd == 1 else (n**2 - 1 if kd == 2 else n + 1))
- template: la-function-inner-product
  skill: la.orthogonality
  pace: quick
  given:
    a:
      int:
      - -3
      - 4
    b:
      int:
      - -3
      - 4
    c:
      int:
      - -3
      - 4
  require:
  - a*c + (a + b*c)/2 + b/3 != 0
  prompt: With $\langle f, g\rangle = \int_0^1 f(t)g(t)\,dt$, find $\langle {{a}} + {{b}}t,\; {{c}} + t\rangle$.
  parts:
  - ask: Answer
    label: v
    tex: \langle f, g\rangle
    value: a*c + (a + b*c)/2 + b/3
    tol: 0.005
    explain: 'Multiply and integrate: $\int_0^1 ({{a*c}} + ({{a}} + {{b*c}})t + {{b}}t^2)\,dt$. Orthogonal functions are the ones with zero inner product, which is how Fourier series and Legendre polynomials are built'
  verify:
    expect:
      v: integrate((a + b*x)*(c + x), (x, 0, 1))
- template: la-balance-combustion
  skill: la.span
  pace: quick
  given:
    n:
      int:
      - 1
      - 8
  prompt: Balance the combustion of $\mathrm{C_{ {{n}} }H_{ {{2*n + 2}} }}$ with the smallest whole numbers. What is the coefficient of $\mathrm{O_2}$?
  parts:
  - ask: Answer
    label: v
    tex: \nu_{O_2}
    value: 'mod(n, 2) == 1 ? (3*n + 1)/2 : 3*n + 1'
    final: true
    tol: 0.0001
    explain: Rows are C, H and O balances on (fuel, O₂, CO₂, H₂O). The null space gives O₂/fuel = $(3n + 1)/2$; clear the fraction. Balancing equations is a homogeneous linear system
  verify:
    expect:
      v: (Matrix([[n, 0, -1, 0], [2*n + 2, 0, 0, -2], [0, 2, -2, -1]]).nullspace()[0][1]/Matrix([[n, 0, -1, 0], [2*n + 2, 0, 0, -2], [0, 2, -2, -1]]).nullspace()[0][0]).p
- template: la-elementary-inverse
  skill: la.inverse
  pace: recall
  given:
    k:
      pick:
      - -5
      - -3
      - -2
      - 2
      - 3
      - 4
      - 7
  prompt: $E$ adds ${{k}}$ times row 1 to row 3 of a $3 \times 3$ matrix. What is the (3, 1) entry of $E^{-1}$?
  parts:
  - ask: Answer
    label: v
    tex: (E^{-1})_{31}
    value: -k
    tol: 0.005
    explain: $E$ is the identity with ${{k}}$ in position (3, 1). Undo it by subtracting ${{k}}$ times row 1. Row reduction is a product of elementary matrices, which is where $A = LU$ comes from
  verify:
    expect:
      v: Matrix([[1, 0, 0], [0, 1, 0], [k, 0, 1]]).inv()[2, 0]
- template: la-complex-det
  skill: la.determinant
  pace: quick
  given:
    a:
      int:
      - -3
      - 4
    b:
      int:
      - 1
      - 4
    c:
      int:
      - -3
      - 3
    d:
      int:
      - -3
      - 3
  require:
  - a^2 + b^2 - c*d != 0
  prompt: Find $\det\begin{pmatrix} {{a}} + {{b}}i & {{c}} \\ {{d}} & {{a}} - {{b}}i \end{pmatrix}$.
  parts:
  - ask: Answer
    label: v
    tex: \det
    value: a^2 + b^2 - c*d
    tol: 0.005
    explain: $(a + bi)(a - bi) = a^2 + b^2$, real; subtract ${{c}}\cdot{{d}}$. Hermitian and unitary matrices are the complex versions of symmetric and orthogonal ones
  verify:
    expect:
      v: expand(Matrix([[a + b*I, c], [d, a - b*I]]).det())
- template: la-jordan-power
  skill: la.diagonalization
  pace: quick
  given:
    l:
      pick:
      - -2
      - -1
      - 2
      - 3
    k:
      int:
      - 2
      - 5
  prompt: $J = \begin{pmatrix} {{l}} & 1 \\ 0 & {{l}} \end{pmatrix}$ cannot be diagonalised. Find the (1, 2) entry of $J^{ {{k}} }$.
  parts:
  - ask: Answer
    label: v
    tex: (J^k)_{12}
    value: k*l^(k - 1)
    tol: 0.005
    explain: 'Write $J = \lambda I + N$ with $N^2 = 0$; the binomial theorem stops after two terms: $J^k = \lambda^kI + k\lambda^{k-1}N$. That extra factor $k$ is where $te^{\lambda t}$ comes from in repeated-root ODEs'
  verify:
    expect:
      v: (Matrix([[l, 1], [0, l]])**k)[0, 1]
- template: la-orthogonal-inverse
  skill: la.orthogonality
  pace: quick
  cases:
  - p: 3
    q: 4
    n: 5
  - p: 5
    q: 12
    n: 13
  - p: 8
    q: 6
    n: 10
  - p: 4
    q: -3
    n: 5
  - p: 12
    q: 5
    n: 13
  prompt: $Q = \frac{1}{ {{n}} }\begin{pmatrix} {{p}} & {{-q}} \\ {{q}} & {{p}} \end{pmatrix}$ is orthogonal. What is the (1, 2) entry of $Q^{-1}$?
  parts:
  - ask: Answer
    label: v
    tex: (Q^{-1})_{12}
    value: q/n
    tol: 0.005
    explain: For an orthogonal matrix the inverse is the transpose, so $(Q^{-1})_{12} = Q_{21}$. No determinant or row reduction needed
  verify:
    expect:
      v: (Matrix([[p, -q], [q, p]])/n).inv()[0, 1]
- template: la-map-inverse
  skill: la.transformations
  pace: quick
  given:
    a:
      int:
      - 1
      - 4
    b:
      int:
      - -3
      - 3
    c:
      int:
      - -3
      - 3
    d:
      int:
      - 1
      - 4
    p:
      int:
      - -5
      - 6
    q:
      int:
      - -5
      - 6
  require:
  - a*d - b*c != 0
  - d*p - b*q != 0
  prompt: $T(x, y) = ({{a}}x + ({{b}})y,\; ({{c}})x + {{d}}y)$. Find the first component of $T^{-1}({{p}}, {{q}})$.
  parts:
  - ask: Answer
    label: v
    tex: x
    value: (d*p - b*q)/(a*d - b*c)
    tol: 0.005
    explain: 'Solving $T(x, y) = ({{p}}, {{q}})$ is applying $T^{-1}$: $x = \dfrac{dp - bq}{ad - bc}$. If $ad - bc = 0$ the map squashes the plane onto a line and has no inverse'
  verify:
    expect:
      v: solve([Eq(a*x + b*Symbol('Y'), p), Eq(c*x + d*Symbol('Y'), q)], [x, Symbol('Y')])[x]

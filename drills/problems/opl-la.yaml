- template: la-elementary-inverse
  skill: la.inverse
  pace: recall
  given:
    k:
      pick:
      - -5
      - -3
      - -2
      - 2
      - 3
      - 4
      - 7
  prompt: $E$ adds ${{k}}$ times row 1 to row 3 of a $3 \times 3$ matrix. What is the (3, 1) entry of $E^{-1}$?
  parts:
  - ask: Answer
    label: v
    tex: (E^{-1})_{31}
    value: -k
    tol: 0.005
    explain: $E$ is the identity with ${{k}}$ in position (3, 1). Undo it by subtracting ${{k}}$ times row 1. Row reduction is a product of elementary matrices, which is where $A = LU$ comes from
  verify:
    expect:
      v: Matrix([[1, 0, 0], [0, 1, 0], [k, 0, 1]]).inv()[2, 0]

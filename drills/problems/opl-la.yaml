- template: la-poly-dependence
  skill: la.independence
  pace: quick
  given:
    a:
      int:
      - -3
      - 4
    b:
      int:
      - -3
      - 4
  require:
  - b != 0
  prompt: For which $h$ are $1 + {{a}}t + t^2$, $t + {{b}}t^2$ and $1 + ht$ linearly dependent?
  parts:
  - ask: Answer
    label: v
    tex: h
    value: a - 1/b
    tol: 0.005
    explain: 'Write each as a coefficient vector on $\{1, t, t^2\}$ and set the determinant to zero: $-b(h - a) - 1 = 0$, so $h = {{a}} - 1/{{b}}$'
  verify:

- template: la-complex-det
  skill: la.determinant
  pace: quick
  given:
    a:
      int:
      - -3
      - 4
    b:
      int:
      - 1
      - 4
    c:
      int:
      - -3
      - 3
    d:
      int:
      - -3
      - 3
  require:
  - a^2 + b^2 - c*d != 0
  prompt: Find $\det\begin{pmatrix} {{a}} + {{b}}i & {{c}} \\ {{d}} & {{a}} - {{b}}i \end{pmatrix}$.
  parts:
  - ask: Answer
    label: v
    tex: \det
    value: a^2 + b^2 - c*d
    tol: 0.005
    explain: $(a + bi)(a - bi) = a^2 + b^2$, real; subtract ${{c}}\cdot{{d}}$. Hermitian and unitary matrices are the complex versions of symmetric and orthogonal ones
  verify:
    expect:
      v: expand(Matrix([[a + b*I, c], [d, a - b*I]]).det())

# WeBWorK OPL gap-fill for framework LA. One question each; keys recomputed by sympy along another route.

- template: la-is-vector-space
  skill: la.subspaces
  pace: recall
  cases:
  - q: the polynomials of degree at most 3
    ans: 0
  - q: the polynomials of degree exactly 3
    ans: 1
  - q: the 2 × 2 symmetric matrices
    ans: 0
  - q: the invertible 2 × 2 matrices
    ans: 1
  - q: the functions on [0, 1] with f(0) = 0
    ans: 0
  - q: the functions on [0, 1] with f(0) = 1
    ans: 1
  - q: the solutions of y″ + y = 0
    ans: 0
  - q: the solutions of y″ + y = 1
    ans: 1
  - q: the 2 × 2 matrices with trace 0
    ans: 0
  - q: the positive real numbers
    ans: 1
  prompt: Is {{q}} a vector space under the usual addition and scalar multiplication?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: ans
    explain: Ask whether the zero element is in the set and whether sums and multiples stay in it. Degree exactly 3 fails (the sum of x³ and −x³ is 0); invertible matrices miss the zero matrix; a nonhomogeneous condition (f(0) = 1, y″ + y = 1) fails closure.
  verify:
    authored: true
- template: la-axiom-fails
  skill: la.subspaces
  pace: recall
  cases:
  - q: ℝ² with ordinary addition but c(x, y) = (cx, 0). Which axiom fails?
    o1: 1·v = v
    o2: Closure under addition
    o3: Commutativity of addition
    o4: The zero vector exists
  - q: The positive reals with x ⊕ y = xy and c ⊙ x = xᶜ. Is it a vector space?
    o1: 'Yes: the zero vector is 1'
    o2: 'No: there is no zero vector'
    o3: 'No: it is not closed under scaling'
    o4: Only over the integers
  - q: The polynomials with integer coefficients, over the reals. Which fails?
    o1: Closure under scalar multiplication
    o2: Closure under addition
    o3: Existence of a zero
    o4: Associativity
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Check each axiom against the operations actually given, not the usual ones
  verify:
    authored: true

- template: la-map-inverse
  skill: la.transformations
  pace: quick
  given:
    a:
      int:
      - 1
      - 4
    b:
      int:
      - -3
      - 3
    c:
      int:
      - -3
      - 3
    d:
      int:
      - 1
      - 4
    p:
      int:
      - -5
      - 6
    q:
      int:
      - -5
      - 6
  require:
  - a*d - b*c != 0
  - d*p - b*q != 0
  prompt: $T(x, y) = ({{a}}x + ({{b}})y,\; ({{c}})x + {{d}}y)$. Find the first component of $T^{-1}({{p}}, {{q}})$.
  parts:
  - ask: Answer
    label: v
    tex: x
    value: (d*p - b*q)/(a*d - b*c)
    tol: 0.005
    explain: 'Solving $T(x, y) = ({{p}}, {{q}})$ is applying $T^{-1}$: $x = \dfrac{dp - bq}{ad - bc}$. If $ad - bc = 0$ the map squashes the plane onto a line and has no inverse'
  verify:
    expect:
      v: solve([Eq(a*x + b*Symbol('Y'), p), Eq(c*x + d*Symbol('Y'), q)], [x, Symbol('Y')])[x]
- template: la-poly-map-inverse
  skill: la.transformations
  pace: quick
  given:
    k:
      int:
      - -4
      - 4
    p:
      int:
      - -6
      - 6
    q:
      int:
      - -6
      - 6
  require:
  - p - k*q != 0
  - k != 0
  prompt: $T(a + bx) = (a + {{k}}b) + bx$ on $\mathbb{P}_1$. What is the constant term of $T^{-1}({{p}} + {{q}}x)$?
  parts:
  - ask: Answer
    label: v
    tex: ''
    value: p - k*q
    final: true
    tol: 0.0001
    explain: T's matrix is [[1, k], [0, 1]]; its inverse subtracts k times the x-coefficient
  verify:
    expect:
      v: (Matrix([[1, k], [0, 1]]).inv()*Matrix([p, q]))[0]

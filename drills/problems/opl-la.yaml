- template: la-balance-combustion
  skill: la.span
  pace: quick
  given:
    n:
      int:
      - 1
      - 8
  prompt: Balance the combustion of $\mathrm{C_{ {{n}} }H_{ {{2*n + 2}} }}$ with the smallest whole numbers. What is the coefficient of $\mathrm{O_2}$?
  parts:
  - ask: Answer
    label: v
    tex: \nu_{O_2}
    value: 'mod(n, 2) == 1 ? (3*n + 1)/2 : 3*n + 1'
    final: true
    tol: 0.0001
    explain: Rows are C, H and O balances on (fuel, O₂, CO₂, H₂O). The null space gives O₂/fuel = $(3n + 1)/2$; clear the fraction. Balancing equations is a homogeneous linear system
  verify:
    expect:
      v: (Matrix([[n, 0, -1, 0], [2*n + 2, 0, 0, -2], [0, 2, -2, -1]]).nullspace()[0][1]/Matrix([[n, 0, -1, 0], [2*n + 2, 0, 0, -2], [0, 2, -2, -1]]).nullspace()[0][0]).p

- template: in-disproportionation
  skill: inorg.p-block
  pace: quick
  cases:
  - f0: Cl2
    q0: 0
    fr: Cl
    qr: -1
    fo: ClO3
    qo: -1
    el: Cl
    text: Cl₂ in hot NaOH gives Cl⁻ and ClO₃⁻
    ans: 5.0
  - f0: Cl2
    q0: 0
    fr: Cl
    qr: -1
    fo: ClO
    qo: -1
    el: Cl
    text: Cl₂ in cold NaOH gives Cl⁻ and ClO⁻
    ans: 1.0
  - f0: Br2
    q0: 0
    fr: Br
    qr: -1
    fo: BrO3
    qo: -1
    el: Br
    text: Br₂ in hot NaOH gives Br⁻ and BrO₃⁻
    ans: 5.0
  - f0: P4
    q0: 0
    fr: PH3
    qr: 0
    fo: H2PO2
    qo: -1
    el: P
    text: P₄ in hot NaOH gives PH₃ and H₂PO₂⁻
    ans: 0.3333333333333333
  - f0: NO2
    q0: 0
    fr: NO2
    qr: -1
    fo: NO3
    qo: -1
    el: N
    text: NO₂ in water gives NO₂⁻ (as HNO₂) and NO₃⁻
    ans: 1.0
  - f0: H2O2
    q0: 0
    fr: H2O
    qr: 0
    fo: O2
    qo: 0
    el: O
    text: H₂O₂ decomposes to H₂O and O₂
    ans: 1.0
  - f0: MnO4
    q0: -2
    fr: MnO2
    qr: 0
    fo: MnO4
    qo: -1
    el: Mn
    text: MnO₄²⁻ in acid gives MnO₂ and MnO₄⁻
    ans: 0.5
  prompt: '{{text}}. How many {{el}} atoms are reduced for each one oxidised?'
  parts:
  - ask: Ratio
    label: y
    value: ans
    tol: 0.0001
    explain: 'Electrons lost must equal electrons gained. Find each product''s oxidation state; atoms reduced per atom oxidised = (rise in the oxidised product) ÷ (fall in the reduced one). Cl₂ → Cl⁻ +
      ClO₃⁻: up 5, down 1, so 5 Cl⁻ per ClO₃⁻'
  verify:
    expect:
      y: disprop_ratio(f0, q0, fr, qr, fo, qo, el)

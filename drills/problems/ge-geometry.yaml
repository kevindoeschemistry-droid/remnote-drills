  parts:
  - ask: Answer
    label: v
    choice:
    - Positive
    - Zero
    - Negative
    correct: kc
    explain: A cylinder and a cone unroll flat without stretching, so their Gaussian curvature is zero although they look curved. Gaussian curvature is what a flat map cannot remove
  verify:

- template: ge-total-curvature
  skill: ngeo.curvature
  pace: quick
  given:
    kg:
      pick:
      - 2
      - 3
      - 4
      - 6
  prompt: Find the total curvature ∫ K dA of a closed orientable surface of genus {{kg}}.
  parts:
  - ask: Answer
    label: v
    tex: \int K\,dA
    value: 4*pi*(1 - kg)
    tol: 0.005
    explain: 'Gauss-Bonnet: the total is 2π times the Euler characteristic 2 − 2g, whatever the surface''s shape'
  verify:
    expect:
      v: 2*pi*(2 - 2*kg)
- template: ge-angle-sum-from-curvature
  skill: ngeo.curvature
  pace: quick
  cases:
  - ka: 0.5
    kc: 1
  - ka: 0.5
    kc: -1
  - ka: 2
    kc: 0.25
  - ka: 1
    kc: -1
  - ka: 3
    kc: -0.5
  prompt: A geodesic triangle of area {{ka}} lies on a surface of constant curvature {{kc}}. Find the sum of its angles in degrees.
  parts:
  - ask: Answer
    label: v
    tex: sum
    value: 180 + kc*ka*180/pi
    tol: 0.01
    explain: Angle sum = π + K × area. Positive curvature opens triangles up, negative curvature pinches them
  verify:
    expect:
      v: solve(Eq(Symbol('m')*pi/180 - pi, nsimplify(kc)*nsimplify(ka)), Symbol('m'))[0]

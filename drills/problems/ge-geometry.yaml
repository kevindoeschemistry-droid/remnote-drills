      v: integrate(sinh(nsimplify(kr)), (Y, 0, 2*pi))
- template: ge-sphere-curvature
  skill: ngeo.curvature
  pace: quick
  given:
    kr:
      pick:
      - 2
      - 3
      - 5
      - 10
  prompt: Find the Gaussian curvature of a sphere of radius {{kr}}.
  parts:
  - ask: Answer
    label: v
    tex: K
    value: 1/kr^2
    tol: 0.005
    explain: 'K = 1/R². The same number comes out of how much a small circle''s circumference falls short of 2πr: K = lim 3(2πr − C)/(πr³)'
  verify:
    expect:
      v: limit(3*(2*pi*Y - 2*pi*kr*sin(Y/kr))/(pi*Y**3), Y, 0)

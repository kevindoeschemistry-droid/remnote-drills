- template: ge-great-circle-distance
  skill: ngeo.spherical
  pace: quick
  given:
    kr:
      pick:
      - 6371
      - 1737
      - 3390
    kd:
      pick:
      - 30
      - 45
      - 60
      - 90
  prompt: Two points on a sphere of radius {{kr}} km subtend an angle of {{kd}}° at the centre. Find the great-circle distance between them.
  parts:
  - ask: Answer
    label: v
    tex: d
    value: kr*kd*pi/180
    tol: 0.005
    explain: Arc length is radius times angle in radians. Any two points that are not antipodal lie on exactly one great circle
  verify:
    expect:
      v: integrate(kr, (Y, 0, kd*pi/180))
- template: ge-lune-area
  skill: ngeo.spherical
  pace: quick
  given:
    kr:
      pick:
      - 1
      - 2
      - 3
    kd:
      pick:
      - 30
      - 60
      - 90
      - 120
  prompt: Two great circles on a sphere of radius {{kr}} meet at an angle of {{kd}}°. Find the area of one of the lunes between them.
  parts:
  - ask: Answer
    label: v
    tex: A
    value: 2*(kd*pi/180)*kr^2
    tol: 0.005
    explain: A lune is the fraction θ/2π of the whole sphere's area 4πR², which is 2θR²
  verify:
    expect:
      v: integrate(integrate(kr**2*sin(Y), (Y, 0, pi)), (Z, 0, kd*pi/180))
- template: ge-spherical-triangle-area
  skill: ngeo.spherical
  pace: quick
  cases:
  - kr: 1
    k1: 90
    k2: 90
    k3: 90
  - kr: 2
    k1: 80
    k2: 70
    k3: 60
  - kr: 1
    k1: 120
    k2: 90
    k3: 60
  - kr: 3
    k1: 100
    k2: 50
    k3: 40
  - kr: 1
    k1: 90
    k2: 90
    k3: 30
  prompt: A triangle on a sphere of radius {{kr}} has angles {{k1}}°, {{k2}}° and {{k3}}°. Find its area.
  parts:
  - ask: Answer
    label: v
    tex: A
    value: (k1 + k2 + k3 - 180)*pi/180*kr^2
    tol: 0.005
    explain: Area = excess × R², with the excess α + β + γ − π in radians. The octant with three right angles has excess π/2 and is one eighth of the sphere
  verify:
    expect:
      v: solve(Eq((k1 + k2 + k3)*pi/180, pi + Symbol('m')/kr**2), Symbol('m'))[0]
- template: ge-spherical-third-angle
  skill: ngeo.spherical
  pace: quick
  cases:
  - ka: 0.5
    k1: 80
    k2: 70
  - ka: 1
    k1: 90
    k2: 90
  - ka: 0.2
    k1: 60
    k2: 70
  - ka: 1.5
    k1: 100
    k2: 110
  prompt: A triangle on the unit sphere has area {{ka}} and two angles of {{k1}}° and {{k2}}°. Find the third angle in degrees.
  parts:
  - ask: Answer
    label: v
    tex: \gamma
    value: 180 + ka*180/pi - k1 - k2
    tol: 0.01
    explain: The three angles sum to π plus the area on a unit sphere, so the third angle is π + A minus the other two
  verify:
    expect:
      v: solve(Eq((k1 + k2 + Symbol('m'))*pi/180 - pi, nsimplify(ka)), Symbol('m'))[0]
- template: ge-sphere-isometries
  skill: ngeo.spherical
  pace: recall
  cases:
  - q: 'Every orientation-preserving isometry of the sphere is:'
    o1: A rotation about some axis
    o2: A reflection in a great circle
    o3: The antipodal map
    o4: A translation
  - q: 'The antipodal map x ↦ −x of the 2-sphere is:'
    o1: Orientation-reversing
    o2: A rotation by 180°
    o3: Orientation-preserving
    o4: Not an isometry
  - q: 'The rotation group of the cube has order:'
    o1: '24'
    o2: '12'
    o3: '48'
    o4: '60'
  - q: 'The rotation group of the icosahedron is isomorphic to:'
    o1: A₅
    o2: S₅
    o3: A₄
    o4: S₄
  - q: Besides cyclic and dihedral groups, how many finite rotation groups of the sphere are there?
    o1: '3'
    o2: '5'
    o3: '1'
    o4: Infinitely many
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: The five Platonic solids give only three groups, because the cube and octahedron are dual, as are the dodecahedron and icosahedron
  verify:
    authored: true
- template: ge-triangulation-count
  skill: ngeo.spherical
  pace: quick
  given:
    kn:
      pick:
      - 3
      - 4
      - 5
  prompt: A sphere is tiled by congruent spherical triangles with angles π/2, π/3 and π/{{kn}}. How many triangles are there?
  parts:
  - ask: Answer
    label: v
    tex: triangles
    value: 4/(1/2 + 1/3 + 1/kn - 1)
    final: true
    tol: 0.0001
    explain: Each triangle has area equal to its excess on the unit sphere, and together they cover 4π. The counts 24, 48 and 120 are the orders of the full symmetry groups of the tetrahedron, cube and icosahedron
  verify:
    expect:
      v: solve(Eq(Symbol('m')*(pi/2 + pi/3 + pi/kn - pi), 4*pi), Symbol('m'))[0]
- template: ge-hyperbolic-distance
  skill: ngeo.hyperbolic
  pace: quick
  cases:
  - ka: 1
    kb: 2
  - ka: 1
    kb: 10
  - ka: 2
    kb: 8
  - ka: 3
    kb: 12
  - ka: 1
    kb: 100
  prompt: In the upper half-plane model, find the hyperbolic distance between the points {{ka}}i and {{kb}}i.
  parts:
  - ask: Answer
    label: v
    tex: d
    value: log(kb/ka)
    tol: 0.005
    explain: Along the vertical geodesic the length element is dy/y, so the distance is ln(b/a). Equal Euclidean steps count for more the closer they are to the boundary
  verify:
    expect:
      v: integrate(1/Y, (Y, ka, kb))
- template: ge-hyperbolic-geodesics
  skill: ngeo.hyperbolic
  pace: recall
  cases:
  - q: 'In the upper half-plane model, the geodesics are vertical lines and:'
    o1: Semicircles centred on the real axis
    o2: All Euclidean straight lines
    o3: Horizontal lines
    o4: Circles tangent to the real axis
  - q: 'In the Poincaré disc model, the geodesics are diameters and:'
    o1: Circular arcs meeting the boundary circle at right angles
    o2: All chords
    o3: Circles inside the disc
    o4: Arcs through the centre only
  - q: 'Both Poincaré models are conformal, meaning that they show correctly:'
    o1: Angles
    o2: Lengths
    o3: Areas
    o4: Straightness
  - q: 'The boundary of the Poincaré disc is, in hyperbolic terms:'
    o1: Infinitely far from every interior point
    o2: At distance 1 from the centre
    o3: A geodesic
    o4: A circle of finite circumference
  - q: 'The isometries of the upper half-plane that preserve orientation are the Möbius maps z ↦ (az + b)/(cz + d) with a, b, c, d:'
    o1: Real, with ad − bc > 0
    o2: Complex, with ad − bc = 1
    o3: Integers
    o4: Real, with ad − bc < 0
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The models distort lengths but not angles, which is why hyperbolic triangles can be read off a picture
  verify:
    authored: true
- template: ge-hyperbolic-triangle-area
  skill: ngeo.hyperbolic
  pace: quick
  cases:
  - k1: 60
    k2: 60
    k3: 30
  - k1: 90
    k2: 45
    k3: 30
  - k1: 45
    k2: 45
    k3: 45
  - k1: 90
    k2: 60
    k3: 20
  - k1: 30
    k2: 30
    k3: 30
  prompt: A triangle in the hyperbolic plane has angles {{k1}}°, {{k2}}° and {{k3}}°. Find its area.
  parts:
  - ask: Answer
    label: v
    tex: A
    value: (180 - k1 - k2 - k3)*pi/180
    tol: 0.005
    explain: 'Area = π minus the angle sum, in radians. Unlike in the plane, the angles determine the size: similar triangles are congruent'
  verify:
    expect:
      v: solve(Eq((k1 + k2 + k3)*pi/180, pi - Symbol('m')), Symbol('m'))[0]
- template: ge-parallels
  skill: ngeo.hyperbolic
  pace: recall
  cases:
  - gm: the Euclidean plane
    kc: 1
  - gm: the hyperbolic plane
    kc: 2
  - gm: spherical geometry (great circles)
    kc: 0
  prompt: Through a point not on a given line, how many lines never meet the given line in {{gm}}?
  parts:
  - ask: Answer
    label: v
    choice:
    - None
    - Exactly one
    - Infinitely many
    correct: kc
    explain: Any two great circles meet, so the sphere has no parallels. In the hyperbolic plane there are two limiting parallels and infinitely many ultraparallels between them
  verify:
    authored: true
- template: ge-circle-sphere

      - 0.5
      - 1
      - 2
      - 3
  prompt: In the hyperbolic plane, find the circumference of a circle of geodesic radius {{kr}}.
  parts:
  - ask: Answer
    label: v
    tex: C
    value: 2*pi*sinh(kr)
    tol: 0.005
    explain: 'The hyperbolic circumference is 2π sinh r, which grows exponentially with the radius: most of a hyperbolic disc is near its edge'
  verify:

  cases:
  - ka: 1
    kq: 1
  - ka: 2
    kq: 1
  - ka: 3
    kq: -1
  - ka: 1
    kq: 2
  - ka: 2
    kq: -1
  prompt: Find the residue of e^({{ka}}z)/(z − {{kq}})² at z = {{kq}}.
  parts:
  - ask: Answer
    label: v
    tex: \mathrm{Res}
    value: ka*exp(ka*kq)
    tol: 0.005
    explain: At a double pole the residue is the derivative of (z − z₀)²f(z) at z₀
  verify:
    expect:
      v: limit(diff(exp(ka*Z), Z), Z, kq)
- template: em-zero-order
  skill: cplx.series
  pace: quick
  given:
    m:
      int:
      - 0
      - 3
  cases:
  - g: \sin z
    gp: sin(Symbol('t'))
    o: 1
  - g: 1 - \cos z
    gp: 1 - cos(Symbol('t'))
    o: 2
  - g: e^z - 1 - z
    gp: exp(Symbol('t')) - 1 - Symbol('t')
    o: 2
  - g: \sin z - z
    gp: sin(Symbol('t')) - Symbol('t')
    o: 3
  - g: \tan z
    gp: tan(Symbol('t'))
    o: 1
  prompt: What is the order of the zero of $f(z) = z^{ {{m}} }\,({{g}})$ at $z = 0$?
  parts:
  - ask: Answer
    label: v
    tex: m
    value: m + o
    final: true
    tol: 0.0001
    explain: 'Multiply orders: $z^{ {{m}} }$ has order ${{m}}$ and the factor''s series starts at $z^{ {{o}} }$. At a zero of order $m$, $1/f$ has a pole of order $m$'
  verify:
    expect:
      v: series(Symbol('t')**m*calc(gp), Symbol('t'), 0, 12).removeO().as_ordered_terms()[-1].as_coeff_exponent(Symbol('t'))[1]

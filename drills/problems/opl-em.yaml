- template: em-entire
  skill: cplx.analytic
  pace: recall
  cases:
  - f: e^{z}
    ans: 0
  - f: \sin z
    ans: 0
  - f: z^3 - 2z
    ans: 0
  - f: \cosh z
    ans: 0
  - f: \bar z
    ans: 1
  - f: 1/z
    ans: 1
  - f: '|z|^2'
    ans: 1
  - f: e^{1/z}
    ans: 1
  - f: \tan z
    ans: 1
  prompt: Is ${{f}}$ entire?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: ans
    explain: Polynomials, exponentials, sine, cosine and their sums and products are entire. The conjugate and $|z|^2$ fail Cauchy–Riemann; $1/z$, $e^{1/z}$ and $\tan z$ blow up at points
  verify:
    authored: true
- template: em-analytic-where
  skill: cplx.analytic
  pace: recall
  cases:
  - q: e^z
    kc: 0
  - q: 1/z
    kc: 1
  - q: the conjugate of z
    kc: 2
  - q: z³ − 2z
    kc: 0
  - q: '|z|²'
    kc: 2
  - q: tan z
    kc: 1
  - q: sin z
    kc: 0
  - q: 1/(z² + 1)
    kc: 1
  prompt: 'The function {{q}} is:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Entire
    - Analytic except at isolated points
    - Analytic nowhere
    correct: kc
    explain: Polynomials, e^z, sin z and cos z are entire. Quotients fail only where the denominator vanishes. Anything built from the conjugate or |z| fails the Cauchy–Riemann equations (|z|² is differentiable only at 0)
  verify:
    authored: true
- template: em-harmonic-conjugate
  skill: cplx.analytic
  pace: quick
  given:
    c:
      int:
      - -4
      - 4
    x0:
      int:
      - -3
      - 3
    y0:
      int:
      - -3
      - 3
  require:
  - 2*x0*y0 + c*y0 != 0
  prompt: $u = x^2 - y^2 + {{c}}x$. Find its harmonic conjugate $v$ (with $v(0, 0) = 0$) at $(x, y) = ({{x0}}, {{y0}})$.
  parts:
  - ask: Answer
    label: v
    tex: v
    value: 2*x0*y0 + c*y0
    tol: 0.005
    explain: $v_y = u_x = 2x + {{c}}$ gives $v = 2xy + {{c}}y + g(x)$; $v_x = 2y = -u_y$ forces $g$ constant. In flow problems $u$ and $v$ are the potential and stream function
  verify:
    expect:
      v: integrate(diff(x**2 - Symbol('y')**2 + c*x, x), (Symbol('y'), 0, y0)).subs(x, x0)

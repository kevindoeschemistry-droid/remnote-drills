  pace: quick
  given:
    R:
      pick:
      - 2
      - 3
      - 5
    a:
      pick:
      - -2
      - -1
      - 1
      - 2
    p:
      pick:
      - -1
      - 0.5
      - 1
  prompt: For the circle $|z| = {{R}}$ traversed once counterclockwise, $\displaystyle\oint \frac{e^{ {{a}}z}}{z - {{p}}}\,dz = 2\pi i\cdot c$. Find $c$.
  parts:
  - ask: Answer
    label: v
    tex: c
    value: exp(a*p)
    tol: 0.005
    explain: The pole at ${{p}}$ lies inside $|z| = {{R}}$, so the integral is $2\pi i\,e^{ {{a}}\cdot{{p}} }$. A pole outside the contour would give 0 (Cauchy's theorem)
  verify:
    expect:
      v: limit((x - nsimplify(p))*exp(a*x)/(x - nsimplify(p)), x, nsimplify(p))
- template: em-cauchy-formula-derivative
  skill: cplx.series
  pace: quick
  given:
    ka:
      pick:
      - 1
      - 2
      - 3
      - 5
  prompt: The integral of e^({{ka}}z)/z² once counterclockwise around |z| = 1 equals bi. Find b.
  parts:
  - ask: Answer
    label: v
    tex: b
    value: 2*pi*ka
    tol: 0.005
    explain: 'Cauchy''s formula for the first derivative: ∮ f(z)/(z − z₀)² dz = 2πi f′(z₀)'
  verify:
    expect:
      v: im(2*pi*I*diff(exp(ka*Z), Z).subs(Z, 0))

# WeBWorK OPL gap-fill for framework EM. One question each; keys recomputed by sympy along another route.

- template: em-rc-current
  skill: ode1.modeling
  pace: quick
  given:
    R:
      pick:
      - 10
      - 50
      - 100
    C:
      pick:
      - 0.01
      - 0.02
      - 0.05
    E:
      pick:
      - 6
      - 9
      - 12
    t:
      pick:
      - 0.5
      - 1
      - 2
  prompt: An RC circuit ($R = {{R}}\,\Omega$, $C = {{C}}$ F) is switched onto a ${{E}}$ V battery with the capacitor uncharged. What is the current, in A, at $t = {{t}}$ s?
  parts:
  - ask: Answer
    label: v
    tex: i(t)
    value: E/R*exp(-t/(R*C))
    tol: 0.005
    explain: $q(t) = CE(1 - e^{-t/RC})$, and $i = dq/dt = \dfrac ER e^{-t/RC}$. The time constant here is $RC = {{R*C}}$ s; after five of them the capacitor is essentially full
  verify:
    expect:
      v: diff(nsimplify(C)*E*(1 - exp(-x/(R*nsimplify(C)))), x).subs(x, nsimplify(t))
- template: em-rc-charge-time
  skill: ode1.modeling
  pace: quick
  given:
    kcp:
      pick:
      - 1
      - 10
      - 47
    kr:
      pick:
      - 1
      - 2.2
      - 10
    kf:
      pick:
      - 0.5
      - 0.9
      - 0.99
  prompt: A capacitor of {{kcp}} µF charges through {{kr}} kΩ from zero. After how many ms has it reached {{kf}} of its final voltage?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: -kr*kcp*log(1 - kf)
    tol: 0.005
    explain: v/V = 1 − e^(−t/RC), and kΩ × µF = ms
  verify:
    expect:
      v: kr*kcp*integrate(1/(1 - Y), (Y, 0, nsimplify(kf)))
- template: em-bifurcation
  skill: ode1.modeling
  pace: quick
  given:
    a:
      pick:
      - -3
      - -2
      - -1
      - 1
      - 2
      - 3
      - 4
  prompt: For $y' = y^2 - {{2*a}}y + r$, at what value of $r$ do the two equilibria merge and disappear?
  parts:
  - ask: Answer
    label: v
    tex: r_c
    value: a^2
    tol: 0.005
    explain: 'Equilibria solve $y^2 - 2ay + r = 0$: two when $r < a^2$, one (half-stable) at $r = a^2$, none beyond. At a saddle-node bifurcation the phase line changes its count of equilibria'
  verify:
    expect:
      v: solve(Eq((2*a)**2 - 4*x, 0), x)[0]
- template: em-saddle-node-stable-branch
  skill: ode1.modeling
  pace: quick
  given:
    kr:
      pick:
      - 4
      - 9
      - 2
      - 16
  prompt: y′ = {{kr}} − y². Find the stable equilibrium.
  parts:
  - ask: Answer
    label: v
    tex: y^*
    value: sqrt(kr)
    tol: 0.005
    explain: The equilibria ±√r appear at r = 0. The upper one is stable because f′(y) = −2y is negative there
  verify:
    expect:
      v: Max(*solve(kr - x**2, x))
- template: em-operator-exponential
  skill: ode2.higher-order
  pace: quick
  given:
    a:
      int:
      - -4
      - 4
    b:
      int:
      - -6
      - 6
    k:
      int:
      - -3
      - 3
  require:
  - k^2 + a*k + b != 0
  - k != 0
  prompt: Let $L = D^2 + ({{a}})D + ({{b}})$ with $D = d/dx$. Then $L[e^{ {{k}}x}] = c\,e^{ {{k}}x}$. Find $c$.
  parts:
  - ask: Answer
    label: v
    tex: c
    value: k^2 + a*k + b
    tol: 0.005
    explain: 'Each $D$ brings down a factor ${{k}}$: $L[e^{kx}] = (k^2 + ak + b)e^{kx}$, the characteristic polynomial. That is why $e^{rx}$ solves $L[y] = 0$ exactly at its roots'
  verify:
    expect:
      v: simplify((diff(exp(k*x), x, 2) + a*diff(exp(k*x), x) + b*exp(k*x))/exp(k*x))
- template: em-operator-on-exponential
  skill: ode2.higher-order
  pace: quick
  cases:
  - ka: 3
    kb: 2
    kr: 1
  - ka: 1
    kb: -6
    kr: 2
  - ka: -4
    kb: 4
    kr: 3
  - ka: 2
    kb: 5
    kr: -1
  prompt: Apply (D² + {{ka}}D + {{kb}}) to e^({{kr}}x) and evaluate the result at x = 0.
  parts:
  - ask: Answer
    label: v
    tex: P(r)
    value: kr^2 + ka*kr + kb
    final: true
    tol: 0.0001
    explain: 'P(D)e^(rx) = P(r)e^(rx): an exponential turns a differential operator into its characteristic polynomial'
  verify:
    expect:
      v: (diff(exp(kr*x), x, 2) + ka*diff(exp(kr*x), x) + kb*exp(kr*x)).subs(x, 0)
- template: em-existence-interval
  skill: ode2.wronskian
  pace: quick
  given:
    a:
      int:
      - 2
      - 8
    c:
      int:
      - 1
      - 6
    x0:
      int:
      - 0
      - 1
  prompt: $y'' + \dfrac{1}{x - {{a}}}y' + \dfrac{1}{x + {{c}}}y = 0$ with $y({{x0}}) = 1$, $y'({{x0}}) = 0$. How long is the largest interval on which a unique solution is guaranteed?
  parts:
  - ask: Answer
    label: v
    tex: \ell
    value: a + c
    tol: 0.005
    explain: The coefficients break down at $x = {{a}}$ and $x = {{-c}}$; the initial point ${{x0}}$ lies between them, so the guarantee holds on $({{-c}}, {{a}})$. The solution may well extend further; the theorem just does not promise it
  verify:
    expect:
      v: a - (-c)
- template: em-existence-interval-end
  skill: ode2.wronskian
  pace: quick
  cases:
  - ka: 1
    kb: 4
    k0: 2
  - ka: -2
    kb: 3
    k0: 0
  - ka: 0
    kb: 5
    k0: 1
  - ka: -3
    kb: -1
    k0: -2
  prompt: (x − {{ka}})(x − {{kb}})y″ + y′ + y = 0 with y({{k0}}) = 1, y′({{k0}}) = 0. The solution is guaranteed on an interval a < x < b. Find b.
  parts:
  - ask: Answer
    label: v
    tex: b
    value: kb
    final: true
    tol: 0.0001
    explain: Divide by the leading coefficient; the coefficients are continuous between its zeros, and the interval is the one containing the initial point
  verify:
    expect:
      v: Max(*solve((x - ka)*(x - kb), x))

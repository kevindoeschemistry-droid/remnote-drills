- template: em-cauchy-riemann
  skill: cplx.analytic
  pace: quick
  given:
    a:
      pick:
      - -4
      - -3
      - -2
      - 2
      - 3
      - 5
  prompt: $u = x^2 - y^2 + {{a}}x$ and $v = 2xy + by$. For which $b$ is $f = u + iv$ analytic?
  parts:
  - ask: Answer
    label: v
    tex: b
    value: a
    tol: 0.005
    explain: $u_x = 2x + {{a}}$ must equal $v_y = 2x + b$; the second equation $u_y = -2y = -v_x$ already holds. Then $f = z^2 + {{a}}z$
  verify:
    expect:
      v: solve(Eq(diff(x**2 - Symbol('y')**2 + a*x, x), diff(2*x*Symbol('y') + Symbol('B')*Symbol('y'), Symbol('y'))), Symbol('B'))[0]

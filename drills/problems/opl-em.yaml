- template: em-complex-sequence-fate
  skill: cplx.series
  pace: recall
  cases:
  - q: (i/2)^n
    kc: 0
  - q: ((3 + 4i)/5)^n
    kc: 2
  - q: (1 + i)^n
    kc: 2
  - q: (2n + i)/(n − i)
    kc: 1
  - q: ((1 + i)/2)^n
    kc: 0
  - q: i^n/n
    kc: 0
  - q: n/(n + i)
    kc: 1
  - q: i^n
    kc: 2
  prompt: 'The sequence z_n = {{q}}:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Converges to 0
    - Converges to a nonzero limit
    - Diverges
    correct: kc
    explain: A power wⁿ goes to 0 when |w| < 1, blows up when |w| > 1, and circles for ever when |w| = 1 (unless w = 1). For a quotient, divide through by n
  verify:
    authored: true
- template: em-complex-taylor
  skill: cplx.series
  pace: quick
  given:
    a:
      pick:
      - -2
      - -1
      - 2
      - 3
    k:
      int:
      - 2
      - 5
  prompt: Find the coefficient of $z^{ {{k}} }$ in the Maclaurin series of $e^{ {{a}}z}$.
  parts:
  - ask: Answer
    label: v
    tex: c_k
    value: a^k/factorial(k)
    tol: 0.005
    explain: $e^w = \sum w^k/k!$ with $w = {{a}}z$. Complex Taylor series converge in the largest disc that avoids every singularity
  verify:
    expect:
      v: series(exp(a*x), x, 0, k + 1).removeO().coeff(x, k)
- template: em-taylor-coefficient-geometric
  skill: cplx.series
  pace: quick
  given:
    ka:
      pick:
      - 2
      - 3
      - 5
    kn:
      pick:
      - 1
      - 2
      - 3
  prompt: Find the coefficient of z^{{kn}} in the Taylor series of 1/({{ka}} − z) about 0.
  parts:
  - ask: Answer
    label: v
    tex: c_n
    value: 1/ka^(kn + 1)
    tol: 0.005
    explain: 1/(a − z) = (1/a)·1/(1 − z/a) = Σ zⁿ/a^(n+1), valid for |z| < a
  verify:
    expect:
      v: diff(1/(ka - Z), Z, kn).subs(Z, 0)/factorial(kn)
- template: em-laurent-residue
  skill: cplx.series
  pace: quick
  given:
    a:
      pick:
      - -2
      - -1
      - 1
      - 2
      - 3
    n:
      int:
      - 1
      - 5
  prompt: Find the coefficient of $1/z$ in the Laurent series of $\dfrac{e^{ {{a}}z}}{z^{ {{n}} }}$ about 0.
  parts:
  - ask: Answer
    label: v
    tex: b_1
    value: a^(n - 1)/factorial(n - 1)
    tol: 0.005
    explain: 'Divide the series of $e^{az}$ by $z^n$: the $z^{n-1}$ term becomes $1/z$. That coefficient is the residue, and $\oint f\,dz = 2\pi i$ times it'
  verify:
    expect:
      v: series(exp(a*x), x, 0, n + 1).removeO().coeff(x, n - 1)

# Generated by scripts/opl_fill.py from scripts/opl_specs/em.py: edit the spec, not this file.
# WeBWorK OPL gap-fill for framework EM. One question each; keys recomputed by sympy along another route.

- template: em-rc-current
  skill: ode1.modeling
  pace: quick
  given:
    R:
      pick:
      - 10
      - 50
      - 100
    C:
      pick:
      - 0.01
      - 0.02
      - 0.05
    E:
      pick:
      - 6
      - 9
      - 12
    t:
      pick:
      - 0.5
      - 1
      - 2
  prompt: An RC circuit ($R = {{R}}\,\Omega$, $C = {{C}}$ F) is switched onto a ${{E}}$ V battery with the capacitor uncharged. What is the current, in A, at $t = {{t}}$ s?
  parts:
  - ask: Answer
    label: v
    tex: i(t)
    value: E/R*exp(-t/(R*C))
    tol: 0.005
    explain: $q(t) = CE(1 - e^{-t/RC})$, and $i = dq/dt = \dfrac ER e^{-t/RC}$. The time constant here is $RC = {{R*C}}$ s; after five of them the capacitor is essentially full
  verify:
    expect:
      v: diff(nsimplify(C)*E*(1 - exp(-x/(R*nsimplify(C)))), x).subs(x, nsimplify(t))
- template: em-bifurcation
  skill: ode1.modeling
  pace: quick
  given:
    a:
      pick:
      - -3
      - -2
      - -1
      - 1
      - 2
      - 3
      - 4
  prompt: For $y' = y^2 - {{2*a}}y + r$, at what value of $r$ do the two equilibria merge and disappear?
  parts:
  - ask: Answer
    label: v
    tex: r_c
    value: a^2
    tol: 0.005
    explain: 'Equilibria solve $y^2 - 2ay + r = 0$: two when $r < a^2$, one (half-stable) at $r = a^2$, none beyond. At a saddle-node bifurcation the phase line changes its count of equilibria'
  verify:
    expect:
      v: solve(Eq((2*a)**2 - 4*x, 0), x)[0]
- template: em-operator-exponential
  skill: ode2.higher-order
  pace: quick
  given:
    a:
      int:
      - -4
      - 4
    b:
      int:
      - -6
      - 6
    k:
      int:
      - -3
      - 3
  require:
  - k^2 + a*k + b != 0
  - k != 0
  prompt: Let $L = D^2 + ({{a}})D + ({{b}})$ with $D = d/dx$. Then $L[e^{ {{k}}x}] = c\,e^{ {{k}}x}$. Find $c$.
  parts:
  - ask: Answer
    label: v
    tex: c
    value: k^2 + a*k + b
    tol: 0.005
    explain: 'Each $D$ brings down a factor ${{k}}$: $L[e^{kx}] = (k^2 + ak + b)e^{kx}$, the characteristic polynomial. That is why $e^{rx}$ solves $L[y] = 0$ exactly at its roots'
  verify:
    expect:
      v: simplify((diff(exp(k*x), x, 2) + a*diff(exp(k*x), x) + b*exp(k*x))/exp(k*x))
- template: em-existence-interval
  skill: ode2.wronskian
  pace: quick
  given:
    a:
      int:
      - 2
      - 8
    c:
      int:
      - 1
      - 6
    x0:
      int:
      - 0
      - 1
  prompt: $y'' + \dfrac{1}{x - {{a}}}y' + \dfrac{1}{x + {{c}}}y = 0$ with $y({{x0}}) = 1$, $y'({{x0}}) = 0$. How long is the largest interval on which a unique solution is guaranteed?
  parts:
  - ask: Answer
    label: v
    tex: \ell
    value: a + c
    tol: 0.005
    explain: The coefficients break down at $x = {{a}}$ and $x = {{-c}}$; the initial point ${{x0}}$ lies between them, so the guarantee holds on $({{-c}}, {{a}})$. The solution may well extend further; the theorem just does not promise it
  verify:
    expect:
      v: a - (-c)
- template: em-system-verify
  skill: odesys.eigenvalue
  pace: quick
  given:
    p:
      int:
      - -3
      - 3
    s:
      pick:
      - -2
      - -1
      - 1
      - 2
      - 3
  require:
  - p + s != 0
  prompt: For which $\lambda$ does $\mathbf x = e^{\lambda t}\begin{pmatrix} 1 \\ {{s}} \end{pmatrix}$ solve $\mathbf x' = \begin{pmatrix} {{p}} & 1 \\ {{s^2}} & {{p}} \end{pmatrix}\mathbf x$?
  parts:
  - ask: Answer
    label: v
    tex: \lambda
    value: p + s
    tol: 0.005
    explain: 'Substitute: $\lambda e^{\lambda t}v = Ae^{\lambda t}v$, so $Av = \lambda v$. The first row gives $\lambda = {{p}} + {{s}}$; check the second row agrees'
  verify:
    expect:
      v: (Matrix([[p, 1], [s**2, p]])*Matrix([1, s]))[0]
- template: em-complex-linear
  skill: cplx.functions
  pace: quick
  given:
    a:
      int:
      - 1
      - 4
    b:
      int:
      - -3
      - 3
    c:
      int:
      - -6
      - 6
    d:
      int:
      - -6
      - 6
  require:
  - a*c + b*d != 0
  prompt: Solve $({{a}} + {{b}}i)z = {{c}} + ({{d}})i$. What is $\operatorname{Re} z$?
  parts:
  - ask: Answer
    label: v
    tex: \operatorname{Re}z
    value: (a*c + b*d)/(a^2 + b^2)
    tol: 0.005
    explain: $z = \dfrac{c + di}{a + bi}\cdot\dfrac{a - bi}{a - bi} = \dfrac{(ac + bd) + (ad - bc)i}{a^2 + b^2}$
  verify:
    expect:
      v: re(solve(Eq((a + b*I)*Symbol('z'), c + d*I), Symbol('z'))[0])
- template: em-complex-sqrt
  skill: cplx.functions
  pace: quick
  given:
    a:
      int:
      - 1
      - 5
    b:
      int:
      - -4
      - 4
  require:
  - b != 0
  prompt: Solve $z^2 = {{a^2 - b^2}} + {{2*a*b}}i$. What is the real part of the root with positive real part?
  parts:
  - ask: Answer
    label: v
    tex: \operatorname{Re}z
    value: a
    tol: 0.005
    explain: 'Try $z = p + qi$: $p^2 - q^2 = {{a^2 - b^2}}$ and $2pq = {{2*a*b}}$, giving $p = {{a}}$, $q = {{b}}$. The other root is its negative'
  verify:
    expect:
      v: re(sqrt(a**2 - b**2 + 2*a*b*I))
- template: em-complex-region
  skill: cplx.functions
  pace: recall
  given:
    p:
      int:
      - -4
      - 4
    q:
      int:
      - -4
      - 4
    a:
      int:
      - -2
      - 2
    b:
      int:
      - -2
      - 2
    r:
      pick:
      - 2
      - 3
      - 4
  require:
  - (p - a)^2 + (q - b)^2 != r^2
  prompt: Is $z = {{p}} + ({{q}})i$ in the region $|z - ({{a}} + {{b}}i)| < {{r}}$?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: '(p - a)^2 + (q - b)^2 < r^2 ? 0 : 1'
    explain: The distance from ${{a}} + {{b}}i$ is $\sqrt{({{p - a}})^2 + ({{q - b}})^2}$; compare it with ${{r}}$. An open, connected region is called a domain
  verify:
    choices:
      v: 0 if Abs((p + q*I) - (a + b*I)) < r else 1
- template: em-complex-map
  skill: cplx.functions
  pace: quick
  given:
    p:
      int:
      - -4
      - 5
    q:
      int:
      - -4
      - 4
  require:
  - p^2 - q^2 != 0
  prompt: Under $w = z^2$, what is $\operatorname{Re} w$ for $z = {{p}} + ({{q}})i$?
  parts:
  - ask: Answer
    label: v
    tex: u
    value: p^2 - q^2
    tol: 0.005
    explain: '$z^2 = (x^2 - y^2) + 2xyi$: so $u = x^2 - y^2$ and $v = 2xy$. Lines $x = c$ map to parabolas; angles at points with $z \neq 0$ are preserved'
  verify:
    expect:
      v: re(expand((p + q*I)**2))
- template: em-complex-limit
  skill: cplx.functions
  pace: quick
  given:
    p:
      int:
      - -4
      - 5
    q:
      int:
      - -4
      - 4
  require:
  - p != 0
  prompt: Find $\operatorname{Re}\displaystyle\lim_{z\to z_0} \frac{z^2 - z_0^2}{z - z_0}$ for $z_0 = {{p}} + ({{q}})i$.
  parts:
  - ask: Answer
    label: v
    tex: \operatorname{Re}L
    value: 2*p
    tol: 0.005
    explain: 'Factor: $\frac{(z - z_0)(z + z_0)}{z - z_0} \to 2z_0$, which is the derivative of $z^2$ at $z_0$'
  verify:
    expect:
      v: re(limit((Symbol('z')**2 - (p + q*I)**2)/(Symbol('z') - (p + q*I)), Symbol('z'), p + q*I))
- template: em-cauchy-riemann
  skill: cplx.analytic
  pace: quick
  given:
    a:
      pick:
      - -4
      - -3
      - -2
      - 2
      - 3
      - 5
  prompt: $u = x^2 - y^2 + {{a}}x$ and $v = 2xy + by$. For which $b$ is $f = u + iv$ analytic?
  parts:
  - ask: Answer
    label: v
    tex: b
    value: a
    tol: 0.005
    explain: $u_x = 2x + {{a}}$ must equal $v_y = 2x + b$; the second equation $u_y = -2y = -v_x$ already holds. Then $f = z^2 + {{a}}z$
  verify:
    expect:
      v: solve(Eq(diff(x**2 - Symbol('y')**2 + a*x, x), diff(2*x*Symbol('y') + Symbol('B')*Symbol('y'), Symbol('y'))), Symbol('B'))[0]
- template: em-harmonic
  skill: cplx.analytic
  pace: quick
  given:
    a:
      pick:
      - -3
      - -2
      - -1
      - 1
      - 2
      - 4
  prompt: For which $b$ is $u = {{a}}x^3 + b\,xy^2$ harmonic?
  parts:
  - ask: Answer
    label: v
    tex: b
    value: -3*a
    tol: 0.005
    explain: '$u_{xx} + u_{yy} = 6ax + 2bx = 0$ needs $b = -3a$: then $u = a\operatorname{Re}(z^3)$'
  verify:
    expect:
      v: solve(Eq(diff(a*x**3 + Symbol('B')*x*Symbol('y')**2, x, 2) + diff(a*x**3 + Symbol('B')*x*Symbol('y')**2, Symbol('y'), 2), 0), Symbol('B'))[0]
- template: em-entire
  skill: cplx.analytic
  pace: recall
  cases:
  - f: e^{z}
    ans: 0
  - f: \sin z
    ans: 0
  - f: z^3 - 2z
    ans: 0
  - f: \cosh z
    ans: 0
  - f: \bar z
    ans: 1
  - f: 1/z
    ans: 1
  - f: '|z|^2'
    ans: 1
  - f: e^{1/z}
    ans: 1
  - f: \tan z
    ans: 1
  prompt: Is ${{f}}$ entire?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: ans
    explain: Polynomials, exponentials, sine, cosine and their sums and products are entire. The conjugate and $|z|^2$ fail Cauchy–Riemann; $1/z$, $e^{1/z}$ and $\tan z$ blow up at points
  verify:
    authored: true
- template: em-harmonic-conjugate
  skill: cplx.analytic
  pace: quick
  given:
    c:
      int:
      - -4
      - 4
    x0:
      int:
      - -3
      - 3
    y0:
      int:
      - -3
      - 3
  require:
  - 2*x0*y0 + c*y0 != 0
  prompt: $u = x^2 - y^2 + {{c}}x$. Find its harmonic conjugate $v$ (with $v(0, 0) = 0$) at $(x, y) = ({{x0}}, {{y0}})$.
  parts:
  - ask: Answer
    label: v
    tex: v
    value: 2*x0*y0 + c*y0
    tol: 0.005
    explain: $v_y = u_x = 2x + {{c}}$ gives $v = 2xy + {{c}}y + g(x)$; $v_x = 2y = -u_y$ forces $g$ constant. In flow problems $u$ and $v$ are the potential and stream function
  verify:
    expect:
      v: integrate(diff(x**2 - Symbol('y')**2 + c*x, x), (Symbol('y'), 0, y0)).subs(x, x0)
- template: em-cauchy-formula
  skill: cplx.series
  pace: quick
  given:
    R:
      pick:
      - 2
      - 3
      - 5
    a:
      pick:
      - -2
      - -1
      - 1
      - 2
    p:
      pick:
      - -1
      - 0.5
      - 1
  prompt: For the circle $|z| = {{R}}$ traversed once counterclockwise, $\displaystyle\oint \frac{e^{ {{a}}z}}{z - {{p}}}\,dz = 2\pi i\cdot c$. Find $c$.
  parts:
  - ask: Answer
    label: v
    tex: c
    value: exp(a*p)
    tol: 0.005
    explain: The pole at ${{p}}$ lies inside $|z| = {{R}}$, so the integral is $2\pi i\,e^{ {{a}}\cdot{{p}} }$. A pole outside the contour would give 0 (Cauchy's theorem)
  verify:
    expect:
      v: limit((x - nsimplify(p))*exp(a*x)/(x - nsimplify(p)), x, nsimplify(p))
- template: em-complex-sequence
  skill: cplx.series
  pace: recall
  given:
    c:
      pick:
      - 4
      - 6
      - 12
      - 26
  cases:
  - a: 3
    b: 4
    r: 5
  - a: 5
    b: 12
    r: 13
  - a: 8
    b: 6
    r: 10
  - a: -3
    b: 4
    r: 5
  - a: 7
    b: 24
    r: 25
  require:
  - r != c
  prompt: Does $z_n = \left(\dfrac{ {{a}} + {{b}}i}{ {{c}} }\right)^n$ converge?
  parts:
  - ask: Answer
    label: v
    choice:
    - Yes, to 0
    - 'No'
    correct: 'r < c ? 0 : 1'
    explain: $|z_n| = (|{{a}} + {{b}}i|/{{c}})^n = ({{r}}/{{c}})^n$. The argument just rotates; the modulus decides
  verify:
    choices:
      v: 0 if Abs((a + b*I)/c) < 1 else 1
- template: em-complex-taylor
  skill: cplx.series
  pace: quick
  given:
    a:
      pick:
      - -2
      - -1
      - 2
      - 3
    k:
      int:
      - 2
      - 5
  prompt: Find the coefficient of $z^{ {{k}} }$ in the Maclaurin series of $e^{ {{a}}z}$.
  parts:
  - ask: Answer
    label: v
    tex: c_k
    value: a^k/factorial(k)
    tol: 0.005
    explain: $e^w = \sum w^k/k!$ with $w = {{a}}z$. Complex Taylor series converge in the largest disc that avoids every singularity
  verify:
    expect:
      v: series(exp(a*x), x, 0, k + 1).removeO().coeff(x, k)
- template: em-laurent-residue
  skill: cplx.series
  pace: quick
  given:
    a:
      pick:
      - -2
      - -1
      - 1
      - 2
      - 3
    n:
      int:
      - 1
      - 5
  prompt: Find the coefficient of $1/z$ in the Laurent series of $\dfrac{e^{ {{a}}z}}{z^{ {{n}} }}$ about 0.
  parts:
  - ask: Answer
    label: v
    tex: b_1
    value: a^(n - 1)/factorial(n - 1)
    tol: 0.005
    explain: 'Divide the series of $e^{az}$ by $z^n$: the $z^{n-1}$ term becomes $1/z$. That coefficient is the residue, and $\oint f\,dz = 2\pi i$ times it'
  verify:
    expect:
      v: series(exp(a*x), x, 0, n + 1).removeO().coeff(x, n - 1)
- template: em-zero-order
  skill: cplx.series
  pace: quick
  given:
    m:
      int:
      - 0
      - 3
  cases:
  - g: \sin z
    gp: sin(Symbol('t'))
    o: 1
  - g: 1 - \cos z
    gp: 1 - cos(Symbol('t'))
    o: 2
  - g: e^z - 1 - z
    gp: exp(Symbol('t')) - 1 - Symbol('t')
    o: 2
  - g: \sin z - z
    gp: sin(Symbol('t')) - Symbol('t')
    o: 3
  - g: \tan z
    gp: tan(Symbol('t'))
    o: 1
  prompt: What is the order of the zero of $f(z) = z^{ {{m}} }\,({{g}})$ at $z = 0$?
  parts:
  - ask: Answer
    label: v
    tex: m
    value: m + o
    final: true
    tol: 0.0001
    explain: 'Multiply orders: $z^{ {{m}} }$ has order ${{m}}$ and the factor''s series starts at $z^{ {{o}} }$. At a zero of order $m$, $1/f$ has a pole of order $m$'
  verify:
    expect:
      v: series(Symbol('t')**m*calc(gp), Symbol('t'), 0, 12).removeO().as_ordered_terms()[-1].as_coeff_exponent(Symbol('t'))[1]

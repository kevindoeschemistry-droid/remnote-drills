- template: dm-stamps-threshold
  skill: dm.induction
  pace: quick
  cases:
  - ka: 3
    kb: 5
  - ka: 4
    kb: 5
  - ka: 3
    kb: 7
  - ka: 5
    kb: 7
  - ka: 4
    kb: 9
  prompt: With {{ka}}-cent and {{kb}}-cent stamps, every amount from N cents upward can be made. What is the least such N?
  parts:
  - ask: Answer
    label: v
    tex: N
    value: (ka - 1)*(kb - 1)
    final: true
    tol: 0.0001
    explain: The largest amount that cannot be made is ab − a − b, so everything from (a − 1)(b − 1) on can. The proof is a strong induction with a base cases
  verify:
    expect:
      v: pm_frobenius_next(ka, kb)

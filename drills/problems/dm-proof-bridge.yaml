  pace: recall
  cases:
  - q: 'To prove ''if n is even then n² is even'' directly, after writing n = 2k the next line is:'
    o1: n² = 4k² = 2(2k²)
    o2: Suppose n² is odd
    o3: n² = 2k
    o4: n is odd
  - q: 'To prove ''if a divides b and b divides c then a divides c'', write b = ak and c = bm, and conclude:'
    o1: c = a(km)
    o2: a = c/km
    o3: c = ab
    o4: a = bm
  - q: 'To prove ''the sum of two rationals is rational'', write them as a/b and c/d and exhibit the sum as:'
    o1: (ad + bc)/(bd)
    o2: (a + c)/(b + d)
    o3: ac/bd
    o4: (a + c)/bd
  - q: 'In a direct proof of ''if P then Q'', the first line is:'
    o1: Assume P
    o2: Assume Q
    o3: Assume not Q
    o4: Assume not P
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Unpack with the definition, compute, repack in the shape the conclusion's definition asks for
  verify:
    authored: true
- template: dm-contrapositive-of
  skill: dm.logic
  pace: recall
  cases:
  - q: 'The contrapositive of ''if n² is odd then n is odd'' is:'
    o1: If n is even then n² is even
    o2: If n is odd then n² is odd
    o3: If n² is even then n is even
    o4: n² is odd and n is even
  - q: 'The contrapositive of ''if xy = 0 then x = 0 or y = 0'' is:'
    o1: If x and y are both non-zero then xy is non-zero
    o2: If x or y is non-zero then xy is non-zero
    o3: If x = 0 or y = 0 then xy = 0
    o4: If xy is non-zero then x is non-zero
  - q: 'The contrapositive of ''if a function is differentiable then it is continuous'' is:'
    o1: If it is not continuous then it is not differentiable
    o2: If it is continuous then it is differentiable
    o3: If it is not differentiable then it is not continuous
    o4: It is differentiable and not continuous
  - q: 'The contrapositive of ''if a + b is odd then a or b is odd'' is:'
    o1: If a and b are both even then a + b is even
    o2: If a or b is even then a + b is even
    o3: If a + b is even then a and b are even
    o4: If a and b are odd then a + b is odd
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Swap and negate both parts, remembering that the negation of 'or' is 'and'
  verify:
    authored: true

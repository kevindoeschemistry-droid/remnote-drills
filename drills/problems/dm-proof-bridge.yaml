    kans: 2
  - km: 5
    py: n**2 % 5
    kans: 3
  - km: 7
    py: n**2 % 7
    kans: 4
  - km: 8
    py: n**2 % 8
    kans: 3
  - km: 10
    py: n**2 % 10
    kans: 6
  prompt: How many different remainders can a perfect square leave on division by {{km}}?
  parts:
  - ask: Answer
    label: v
    tex: remainders
    value: kans
    final: true
    tol: 0.0001
    explain: 'Square each residue 0, 1, …, m − 1 and reduce: the squares of r and m − r agree, so about half the residues occur'

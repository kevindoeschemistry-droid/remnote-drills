# Second question types; keys recomputed by sympy along another route.

- template: dm-definition-applies
  skill: dm.logic
  pace: recall
  cases:
  - st: 0 is even
    kc: 0
  - st: 1 is prime
    kc: 1
  - st: 3 divides 0
    kc: 0
  - st: 0 divides 5
    kc: 1
  - st: −7 is odd
    kc: 0
  - st: 0.75 is rational
    kc: 0
  - st: 2 is prime
    kc: 0
  - st: every integer divides itself
    kc: 0
  - st: the empty set is a subset of every set
    kc: 0
  - st: 1 is composite
    kc: 1
  prompt: By the definition, is it true that {{st}}?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: 'Substitute into the definition: 0 = 2 · 0, so 0 is even; 0 = 3 · 0, so 3 divides 0; but 5 = 0 · k has no solution. A prime has exactly two positive divisors, which rules out 1'
  verify:
    authored: true
- template: dm-definition-wording
  skill: dm.logic
  pace: recall
  cases:
  - q: '''a divides b'' means there is an integer k with:'
    o1: b = ak
    o2: a = bk
    o3: a/b is an integer
    o4: b < a
  - q: 'An integer n is odd when there is an integer k with:'
    o1: n = 2k + 1
    o2: n = 2k
    o3: n = k + 1
    o4: n/2 is not defined
  - q: 'A real number is irrational when it:'
    o1: Cannot be written as a quotient of two integers
    o2: Has a decimal expansion
    o3: Is not an integer
    o4: Is a square root
  - q: 'A function f is injective when f(a) = f(b) implies:'
    o1: a = b
    o2: a and b differ
    o3: f is onto
    o4: a and b are in the range
  - q: 'A set A is a subset of B when:'
    o1: Every element of A is an element of B
    o2: Some element of A is in B
    o3: A and B have the same size
    o4: B is a subset of A
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Proofs begin by writing the definition out. Getting its direction wrong (which number is the multiple) derails everything after
  verify:
    authored: true
- template: dm-odd-product-witness
  skill: dm.logic
  pace: quick
  given:
    ka:
      pick:
      - 1
      - 2
      - 3
      - 5
    kb:
      pick:
      - 2
      - 4
      - 7
  prompt: (2·{{ka}} + 1)(2·{{kb}} + 1) = 2k + 1. Find k.
  parts:
  - ask: Answer
    label: v
    tex: k
    value: 2*ka*kb + ka + kb
    final: true
    tol: 0.0001
    explain: 'Expand: 4ab + 2a + 2b + 1 = 2(2ab + a + b) + 1. Exhibiting k is the whole proof that a product of odd numbers is odd'
  verify:
    expect:
      v: solve(Eq((2*ka + 1)*(2*kb + 1), 2*Symbol('m') + 1), Symbol('m'))[0]
- template: dm-direct-proof-steps

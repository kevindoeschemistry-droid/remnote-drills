  prompt: A table gives $\displaystyle\int \frac{dx}{x(a + bx)} = \frac1a\ln\left|\frac{x}{a + bx}\right| + C$. Evaluate $\displaystyle\int_1^2 \frac{dx}{x({{a}} + {{b}}x)}$.
  parts:

- template: ca-cas-antiderivative
  skill: calc.antiderivatives
  pace: quick
  given:
    a:
      pick:
      - -2
      - -1
      - 1
      - 2
      - 3
  prompt: A computer algebra system returns $\displaystyle\int x e^{ {{a}}x}\,dx = e^{ {{a}}x}\left(\frac{x}{ {{a}} } - \frac{1}{ {{a^2}} }\right) + C$. Use it to evaluate $\displaystyle\int_0^1 x e^{ {{a}}x}\,dx$.
  parts:
  - ask: Answer
    label: v
    tex: I
    value: exp(a)*(1/a - 1/a^2) + 1/a^2
    tol: 0.005
    explain: Evaluate at 1 and subtract the value at 0, which is $-1/a^2$. Differentiating the CAS answer gives back $xe^{ax}$, which is the check worth doing before trusting it
  verify:
    expect:
      v: integrate(x*exp(a*x), (x, 0, 1))
- template: ca-cas-check
  skill: calc.antiderivatives
  pace: quick
  cases:
  - ka: 2
    ks: 4
    kx: 1
  - ka: 3
    ks: 9
    kx: 1
  - ka: 2
    ks: 4
    kx: 0.5
  - ka: 1
    ks: 1
    kx: 2
  prompt: 'A computer algebra system returns F(x) = e^({{ka}}x)(x/{{ka}} − 1/{{ks}}) for ∫ x e^({{ka}}x) dx. To check it, differentiate: what should F′({{kx}}) equal?'
  parts:
  - ask: Answer
    label: v
    tex: F'
    value: kx*exp(ka*kx)
    tol: 0.005
    explain: If F is right, F′ is the integrand, x e^(ax). The product rule on F cancels everything else
  verify:
    expect:
      v: diff(exp(ka*x)*(x/ka - Rational(1, ks)), x).subs(x, nsimplify(kx))
- template: ca-shells
  skill: calc.integration-apps
  pace: quick
  given:
    k:
      int:
      - 1
      - 5
  prompt: The region under $y = {{k}}x - x^2$ (above the $x$-axis) is spun about the $y$-axis. Find the volume.
  parts:
  - ask: Answer
    label: v
    tex: V
    value: pi*k^4/6
    tol: 0.005
    explain: 'Shells of radius $x$ and height ${{k}}x - x^2$: $V = \int_0^{ {{k}} } 2\pi x({{k}}x - x^2)\,dx$. Washers would need $x$ as a function of $y$, which here means two branches'
  verify:
    expect:
      v: integrate(2*pi*x*(k*x - x**2), (x, 0, k))
- template: ca-shells-power
  skill: calc.integration-apps
  pace: quick
  given:
    kn:
      pick:
      - 1
      - 2
      - 3
      - 4
  prompt: The region under y = x^{{kn}} for 0 ≤ x ≤ 1 is spun about the y-axis. Find the volume by shells.
  parts:
  - ask: Answer
    label: v
    tex: V
    value: 2*pi/(kn + 2)
    tol: 0.005
    explain: 'Shells: ∫ 2πx·xⁿ dx = 2π/(n + 2). The check is the cylinder of volume π minus the washers'' hole, ∫ π y^(2/n) dy'
  verify:
    expect:
      v: pi - integrate(pi*Y**Rational(2, kn), (Y, 0, 1))
- template: ca-two-methods
  skill: calc.integration-apps
  pace: quick
  given:
    a:
      int:
      - 1
      - 4
  prompt: The region between $y = x^2$, the $x$-axis and $x = {{a}}$ is spun about the $y$-axis. Find the volume.
  parts:
  - ask: Answer
    label: v
    tex: V
    value: pi*a^4/2
    tol: 0.005
    explain: 'Shells: $\int_0^a 2\pi x\cdot x^2\,dx$. Washers in $y$: outer radius $a$, inner $\sqrt y$: $\int_0^{a^2} \pi(a^2 - y)\,dy$. Both give $\pi a^4/2$'
  verify:
    expect:
      v: integrate(pi*(a**2 - x), (x, 0, a**2))

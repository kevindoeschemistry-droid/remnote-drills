# WeBWorK OPL gap-fill for framework CA. One question each; keys recomputed by sympy along another route.

- template: ca-marginal-cost
  skill: calc.rates
  pace: quick
  given:
    F:
      pick:
      - 500
      - 1000
      - 2000
    b:
      int:
      - 5
      - 30
    c:
      pick:
      - 0.01
      - 0.02
      - 0.05
      - 0.1
    q0:
      pick:
      - 50
      - 100
      - 200
  prompt: A cost function is $C(q) = {{F}} + {{b}}q + {{c}}q^2$ dollars. What is the marginal cost at $q = {{q0}}$, in dollars per unit?
  parts:
  - ask: Answer
    label: v
    tex: C'(q)
    value: b + 2*c*q0
    tol: 0.005
    explain: Marginal cost is $C'(q) = {{b}} + 2({{c}})q$. The fixed cost ${{F}}$ does not affect it
  verify:
    expect:
      v: diff(F + b*x + nsimplify(c)*x**2, x).subs(x, q0)
- template: ca-max-profit
  skill: calc.extrema
  pace: quick
  given:
    p:
      pick:
      - 40
      - 60
      - 80
      - 100
    F:
      pick:
      - 200
      - 500
    c:
      pick:
      - 10
      - 20
    d:
      pick:
      - 0.05
      - 0.1
      - 0.2
  prompt: Items sell for ${{p}}$ dollars each, and making $q$ of them costs $C(q) = {{F}} + {{c}}q + {{d}}q^2$ dollars. How many items maximise profit?
  parts:
  - ask: Answer
    label: v
    tex: q^*
    value: (p - c)/(2*d)
    tol: 0.005
    explain: '$P(q) = {{p}}q - C(q)$. Setting $P''(q) = 0$ gives ${{p}} = {{c}} + 2({{d}})q$: marginal revenue equals marginal cost. $P'''' < 0$, so it is a maximum'
  verify:
    expect:
      v: solve(diff(p*x - (F + c*x + nsimplify(d)*x**2), x), x)[0]
- template: ca-peak-concentration
  skill: calc.extrema
  pace: quick
  given:
    A:
      pick:
      - 5
      - 10
      - 20
    k:
      pick:
      - 0.1
      - 0.2
      - 0.25
      - 0.5
  prompt: After a dose, a drug's blood concentration is $C(t) = {{A}}\,t\,e^{-{{k}}t}$ (t in hours). When is the concentration highest, in hours?
  parts:
  - ask: Answer
    label: v
    tex: t^*
    value: 1/k
    tol: 0.005
    explain: $C'(t) = Ae^{-kt}(1 - kt) = 0$ at $t = 1/k$. The same shape (rise, then exponential decay) describes many absorption–elimination models
  verify:
    expect:
      v: solve(diff(A*x*exp(-nsimplify(k)*x), x), x)[0]
- template: ca-elasticity
  skill: calc.derivative-rules
  pace: quick
  given:
    a:
      pick:
      - 100
      - 200
      - 500
    b:
      pick:
      - 2
      - 4
      - 5
    p0:
      pick:
      - 5
      - 10
      - 15
      - 20
  require:
  - a - b*p0 > 0
  prompt: Demand is $q = {{a}} - {{b}}p$. What is the price elasticity of demand $E = -\dfrac{p}{q}\dfrac{dq}{dp}$ at $p = {{p0}}$?
  parts:
  - ask: Answer
    label: v
    tex: E
    value: b*p0/(a - b*p0)
    tol: 0.005
    explain: $E = \dfrac{bp}{a - bp}$. Where $E > 1$ demand is elastic and raising the price lowers revenue; where $E < 1$ it raises revenue
  verify:
    expect:
      v: (-x/(a - b*x)*diff(a - b*x, x)).subs(x, p0)
- template: ca-consumer-surplus
  skill: calc.integration-apps
  pace: quick
  given:
    a:
      pick:
      - 50
      - 80
      - 100
    b:
      pick:
      - 0.5
      - 1
      - 2
    p0:
      pick:
      - 20
      - 30
      - 40
  prompt: Demand is $p = {{a}} - {{b}}q$ and the market price is ${{p0}}$. What is the consumer surplus?
  parts:
  - ask: Answer
    label: v
    tex: CS
    value: (a - p0)^2/(2*b)
    tol: 0.005
    explain: 'Buyers who would have paid more than ${{p0}}$ save the difference. Integrate from 0 to the quantity sold, $q_0 = (a - p_0)/b$: a triangle'
  verify:
    expect:
      v: integrate(a - nsimplify(b)*x - p0, (x, 0, (a - p0)/nsimplify(b)))
- template: ca-cardiac-output
  skill: calc.integration-apps
  pace: quick
  given:
    A:
      pick:
      - 5
      - 8
      - 10
    k:
      pick:
      - 0.01
      - 0.02
      - 0.05
    T:
      pick:
      - 10
      - 12
      - 15
  prompt: '{{A}} mg of dye is injected and its concentration leaving the heart is $c(t) = {{k}}\,t({{T}} - t)$ mg/L for $0 \le t \le {{T}}$ s. What is the cardiac output, in L/s?'
  parts:
  - ask: Answer
    label: v
    tex: F
    value: A/(k*T^3/6)
    tol: 0.005
    explain: 'All the dye passes through: $A = F\int_0^T c\,dt$. The integral of the parabola is $kT^3/6$'
  verify:
    expect:
      v: A/integrate(nsimplify(k)*x*(T - x), (x, 0, T))
- template: ca-pdf-constant
  skill: calc.integration-apps
  pace: quick
  given:
    n:
      int:
      - 1
      - 3
    L:
      pick:
      - 1
      - 2
      - 3
      - 4
  prompt: $f(x) = k\,x^{ {{n}} }$ on $[0, {{L}}]$ (and 0 elsewhere) is a probability density. What is $k$?
  parts:
  - ask: Answer
    label: v
    tex: k
    value: (n + 1)/L^(n + 1)
    tol: 0.005
    explain: 'Total probability is 1: $k\dfrac{L^{n+1}}{n + 1} = 1$. Then $P(a < X < b) = \int_a^b f$'
  verify:
    expect:
      v: solve(Eq(integrate(Symbol('k')*x**n, (x, 0, L)), 1), Symbol('k'))[0]
- template: ca-trig-integral
  skill: calc.antiderivatives
  pace: quick
  cases:
  - m: 3
    n: 2
    val: 0.13333333333333333
  - m: 2
    n: 3
    val: 0.13333333333333333
  - m: 3
    n: 0
    val: 0.6666666666666666
  - m: 5
    n: 2
    val: 0.0761904761904762
  - m: 2
    n: 2
    val: 0.19634954084936207
  - m: 4
    n: 0
    val: 0.5890486225480862
  - m: 1
    n: 4
    val: 0.2
  - m: 3
    n: 3
    val: 0.08333333333333333
  prompt: Evaluate $\displaystyle\int_0^{\pi/2} \sin^{ {{m}} }x\,\cos^{ {{n}} }x\,dx$.
  parts:
  - ask: Answer
    label: v
    tex: I
    value: val
    tol: 0.005
    explain: 'Odd power of sine: keep one $\sin x$ for $du$ with $u = \cos x$ and write the rest with $\sin^2 = 1 - \cos^2$ (and the same with sine and cosine swapped). Both even: $\sin^2 x = \tfrac12(1 - \cos 2x)$'
  verify:
    expect:
      v: integrate(sin(x)**m*cos(x)**n, (x, 0, pi/2))
- template: ca-trig-substitution
  skill: calc.antiderivatives
  pace: quick
  given:
    a:
      int:
      - 1
      - 6
  prompt: Evaluate $\displaystyle\int_0^{ {{a}} } \frac{x^2}{\sqrt{ {{a^2}} - x^2}}\,dx$.
  parts:
  - ask: Answer
    label: v
    tex: I
    value: pi*a^2/4
    tol: 0.005
    explain: $x = {{a}}\sin\theta$ turns $\sqrt{a^2 - x^2}$ into $a\cos\theta$ and $dx$ into $a\cos\theta\,d\theta$; the integral becomes $a^2\int_0^{\pi/2}\sin^2\theta\,d\theta = \pi a^2/4$
  verify:
    expect:
      v: integrate(x**2/sqrt(a**2 - x**2), (x, 0, a))
- template: ca-integral-table
  skill: calc.antiderivatives
  pace: quick
  given:
    a:
      int:
      - 1
      - 5
    b:
      int:
      - 1
      - 4
  prompt: A table gives $\displaystyle\int \frac{dx}{x(a + bx)} = \frac1a\ln\left|\frac{x}{a + bx}\right| + C$. Evaluate $\displaystyle\int_1^2 \frac{dx}{x({{a}} + {{b}}x)}$.
  parts:
  - ask: Answer
    label: v
    tex: I
    value: (log(2/(a + 2*b)) - log(1/(a + b)))/a
    tol: 0.005
    explain: 'Here $a = {{a}}$, $b = {{b}}$: $\frac{1}{ {{a}} }\left[\ln\frac{2}{ {{a + 2*b}} } - \ln\frac{1}{ {{a + b}} }\right]$. Partial fractions gives the same thing'
  verify:
    expect:
      v: integrate(1/(x*(a + b*x)), (x, 1, 2))
- template: ca-cas-antiderivative
  skill: calc.antiderivatives
  pace: quick
  given:
    a:
      pick:
      - -2
      - -1
      - 1
      - 2
      - 3
  prompt: A computer algebra system returns $\displaystyle\int x e^{ {{a}}x}\,dx = e^{ {{a}}x}\left(\frac{x}{ {{a}} } - \frac{1}{ {{a^2}} }\right) + C$. Use it to evaluate $\displaystyle\int_0^1 x e^{ {{a}}x}\,dx$.
  parts:
  - ask: Answer
    label: v
    tex: I
    value: exp(a)*(1/a - 1/a^2) + 1/a^2
    tol: 0.005
    explain: Evaluate at 1 and subtract the value at 0, which is $-1/a^2$. Differentiating the CAS answer gives back $xe^{ax}$, which is the check worth doing before trusting it
  verify:
    expect:
      v: integrate(x*exp(a*x), (x, 0, 1))
- template: ca-shells
  skill: calc.integration-apps
  pace: quick
  given:
    k:
      int:
      - 1
      - 5
  prompt: The region under $y = {{k}}x - x^2$ (above the $x$-axis) is spun about the $y$-axis. Find the volume.
  parts:
  - ask: Answer
    label: v
    tex: V
    value: pi*k^4/6
    tol: 0.005
    explain: 'Shells of radius $x$ and height ${{k}}x - x^2$: $V = \int_0^{ {{k}} } 2\pi x({{k}}x - x^2)\,dx$. Washers would need $x$ as a function of $y$, which here means two branches'
  verify:
    expect:
      v: integrate(2*pi*x*(k*x - x**2), (x, 0, k))
- template: ca-two-methods
  skill: calc.integration-apps
  pace: quick
  given:
    a:
      int:
      - 1
      - 4
  prompt: The region between $y = x^2$, the $x$-axis and $x = {{a}}$ is spun about the $y$-axis. Find the volume.
  parts:
  - ask: Answer
    label: v
    tex: V
    value: pi*a^4/2
    tol: 0.005
    explain: 'Shells: $\int_0^a 2\pi x\cdot x^2\,dx$. Washers in $y$: outer radius $a$, inner $\sqrt y$: $\int_0^{a^2} \pi(a^2 - y)\,dy$. Both give $\pi a^4/2$'
  verify:
    expect:
      v: integrate(pi*(a**2 - x), (x, 0, a**2))
- template: ca-surface-revolution
  skill: calc.integration-apps
  pace: quick
  given:
    L:
      int:
      - 1
      - 5
  cases:
  - m: 0.75
    s: 1.25
  - m: 1.333333333333333
    s: 1.666666666666667
  - m: 2.4
    s: 2.6
  prompt: The line $y = {{m}}x$, $0 \le x \le {{L}}$, is spun about the $x$-axis to make a cone. What is the cone's lateral surface area?
  parts:
  - ask: Answer
    label: v
    tex: S
    value: pi*m*L^2*sqrt(1 + m^2)
    tol: 0.005
    explain: '$S = \int_0^L 2\pi(mx)\sqrt{1 + m^2}\,dx = \pi mL^2\sqrt{1 + m^2}$: the familiar $\pi r\ell$ with $r = mL$ and slant $\ell = L\sqrt{1 + m^2}$'
  verify:
    expect:
      v: integrate(2*pi*nsimplify(m)*x*sqrt(1 + nsimplify(m)**2), (x, 0, L))
- template: ca-hydrostatic-triangle
  skill: calc.integration-apps
  pace: quick
  given:
    b:
      pick:
      - 1
      - 2
      - 3
      - 4
    h:
      pick:
      - 1
      - 2
      - 3
  prompt: A triangular plate with its {{b}} m base at the water surface and its apex {{h}} m below hangs vertically in water ($\rho g = 9810$ N/m³). What is the force on one side, in kN?
  parts:
  - ask: Answer
    label: v
    tex: F
    value: 9810*b*h^2/6/1000
    tol: 0.005
    explain: 'At depth $y$ the width is ${{b}}(1 - y/{{h}})$; $F = \int_0^h \rho g\,y\,b(1 - y/h)\,dy = \rho g b h^2/6$. Pressure, not area alone, decides the force: the wide part is shallow'
  verify:
    expect:
      v: integrate(9810*x*b*(1 - x/h), (x, 0, h))/1000
- template: ca-sequence-limit
  skill: calc.series
  pace: quick
  given:
    p:
      int:
      - 1
      - 9
    q:
      int:
      - -5
      - 5
    r:
      int:
      - 1
      - 9
    s:
      int:
      - 1
      - 6
  prompt: Find $\displaystyle\lim_{n\to\infty} \frac{ {{p}}n^2 + {{q}} }{ {{r}}n^2 + {{s}}n}$.
  parts:
  - ask: Answer
    label: v
    tex: L
    value: p/r
    tol: 0.005
    explain: 'Divide top and bottom by $n^2$: everything else goes to 0. A sequence converges when its terms settle; a series converges when its partial sums do'
  verify:
    expect:
      v: limit((p*x**2 + q)/(r*x**2 + s*x), x, oo)
- template: ca-root-test
  skill: calc.series
  pace: quick
  given:
    a:
      int:
      - 1
      - 7
    b:
      int:
      - 1
      - 7
  prompt: For $\displaystyle\sum_{n=1}^\infty \left(\frac{ {{a}}n}{ {{b}}n + 1}\right)^n$, find the root-test limit $\lim |a_n|^{1/n}$.
  parts:
  - ask: Answer
    label: v
    tex: L
    value: a/b
    tol: 0.005
    explain: 'The $n$th root strips the outer power: $\frac{ {{a}}n}{ {{b}}n + 1} \to {{a}}/{{b}}$. Below 1 converges, above 1 diverges; equal to 1 says nothing'
  verify:
    expect:
      v: limit(a*x/(b*x + 1), x, oo)
- template: ca-series-strategy
  skill: calc.series
  pace: recall
  cases:
  - s: \frac{n!}{5^n}
    ans: 0
  - s: \left(\frac{2n}{3n + 1}\right)^n
    ans: 1
  - s: \frac{(-1)^n}{\sqrt n}
    ans: 2
  - s: \frac{1}{n^2 + 7}
    ans: 3
  - s: \frac{n}{n + 1}
    ans: 4
  - s: \frac{3^n}{n!}
    ans: 0
  - s: \frac{(-1)^n n}{n^2 + 1}
    ans: 2
  - s: \frac{1}{2^n + n}
    ans: 3
  prompt: Which test settles $\displaystyle\sum {{s}}$ most directly?
  parts:
  - ask: Answer
    label: v
    choice:
    - Ratio test
    - Root test
    - Alternating series test
    - Comparison test
    - nth-term (divergence) test
    correct: ans
    explain: Factorials → ratio. A whole expression to the nth power → root. Alternating signs with terms shrinking to 0 → alternating series test. Looks like a p-series or geometric series → compare. Terms that do not go to 0 → divergence
  verify:
    authored: true
- template: ca-eliminate-parameter
  skill: calc.parametric-polar
  pace: quick
  given:
    h:
      int:
      - -3
      - 3
    b:
      int:
      - 1
      - 4
    c:
      int:
      - -5
      - 5
    x1:
      int:
      - -3
      - 4
  require:
  - b*(x1 - h)^2 + c != 0
  prompt: A curve is $x = t + {{h}}$, $y = {{b}}t^2 + {{c}}$. Eliminate $t$ and find $y$ when $x = {{x1}}$.
  parts:
  - ask: Answer
    label: v
    tex: y
    value: b*(x1 - h)^2 + c
    tol: 0.005
    explain: '$t = x - {{h}}$, so $y = {{b}}(x - {{h}})^2 + {{c}}$: a parabola. Eliminating the parameter loses the direction and speed of travel'
  verify:
    expect:
      v: (b*Symbol('t')**2 + c).subs(Symbol('t'), solve(Eq(Symbol('t') + h, x1), Symbol('t'))[0])
- template: ca-parametric-area
  skill: calc.parametric-polar
  pace: quick
  given:
    T:
      pick:
      - 1
      - 2
      - 3
  prompt: Find the area under $x = t^2$, $y = t^3$ for $0 \le t \le {{T}}$ (between the curve and the $x$-axis).
  parts:
  - ask: Answer
    label: v
    tex: A
    value: 2*T^5/5
    tol: 0.005
    explain: $\int y\,dx = \int_0^T t^3\cdot 2t\,dt = \tfrac25T^5$. Eliminating $t$ gives $y = x^{3/2}$, which integrates to the same
  verify:
    expect:
      v: integrate(x**Rational(3, 2), (x, 0, T**2))
- template: ca-parametric-volume
  skill: calc.parametric-polar
  pace: quick
  given:
    r:
      int:
      - 1
      - 5
  prompt: The upper half of $x = {{r}}\cos t$, $y = {{r}}\sin t$ ($0 \le t \le \pi$) is spun about the $x$-axis. Find the volume.
  parts:
  - ask: Answer
    label: v
    tex: V
    value: 4*pi*r^3/3
    tol: 0.005
    explain: $V = \int \pi y^2\,dx = \int_\pi^0 \pi r^2\sin^2 t\,(-r\sin t)\,dt = \tfrac43\pi r^3$, the sphere
  verify:
    expect:
      v: integrate(pi*(r**2 - x**2), (x, -r, r))
- template: ca-parametric-surface
  skill: calc.parametric-polar
  pace: quick
  given:
    r:
      int:
      - 1
      - 5
  prompt: The upper half of $x = {{r}}\cos t$, $y = {{r}}\sin t$ is spun about the $x$-axis. Find the surface area.
  parts:
  - ask: Answer
    label: v
    tex: S
    value: 4*pi*r^2
    tol: 0.005
    explain: $\sqrt{x'^2 + y'^2} = r$, so $S = \int_0^\pi 2\pi r\sin t\cdot r\,dt = 4\pi r^2$
  verify:
    expect:
      v: integrate(2*pi*r*sin(Symbol('t'))*r, (Symbol('t'), 0, pi))
- template: ca-polar-arc-length
  skill: calc.parametric-polar
  pace: quick
  given:
    a:
      int:
      - 1
      - 6
  prompt: Find the length of the cardioid $r = {{a}}(1 + \cos\theta)$.
  parts:
  - ask: Answer
    label: v
    tex: L
    value: 8*a
    tol: 0.005
    explain: $r^2 + r'^2 = 2a^2(1 + \cos\theta) = 4a^2\cos^2(\theta/2)$, so $L = \int_0^{2\pi} 2a|\cos(\theta/2)|\,d\theta = 8a$. Watch the absolute value past $\theta = \pi$
  verify:
    expect:
      v: 2*integrate(2*a*cos(x/2), (x, 0, pi))
- template: ca-vector-limit
  skill: calc.vectors-3d
  pace: quick
  given:
    a:
      int:
      - 1
      - 5
    b:
      pick:
      - -3
      - -2
      - 2

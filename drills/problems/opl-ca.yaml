- template: ca-vector-limit-magnitude
  skill: calc.vectors-3d
  pace: quick
  cases:
  - ka: 3
    kb: 4
  - ka: 5
    kb: 12
  - ka: 8
    kb: 6
  - ka: 1
    kb: 1
  prompt: Find the length of the limit as t → 0 of ⟨sin({{ka}}t)/t, (1 − cos t)/t, {{kb}}⟩.
  parts:
  - ask: Answer
    label: v
    tex: '|L|'
    value: sqrt(ka^2 + kb^2)
    tol: 0.005
    explain: 'Component by component: sin(at)/t → a, (1 − cos t)/t → 0, and the constant stays'

      v: integrate(x*x**kn, (x, 0, kl))/integrate(x**kn, (x, 0, kl))
- template: ca-trig-integral
  skill: calc.antiderivatives
  pace: quick
  cases:
  - m: 3
    n: 2
    val: 0.13333333333333333
  - m: 2
    n: 3
    val: 0.13333333333333333
  - m: 3
    n: 0
    val: 0.6666666666666666
  - m: 5
    n: 2
    val: 0.0761904761904762
  - m: 2
    n: 2
    val: 0.19634954084936207
  - m: 4
    n: 0
    val: 0.5890486225480862
  - m: 1
    n: 4
    val: 0.2
  - m: 3
    n: 3
    val: 0.08333333333333333
  prompt: Evaluate $\displaystyle\int_0^{\pi/2} \sin^{ {{m}} }x\,\cos^{ {{n}} }x\,dx$.
  parts:
  - ask: Answer
    label: v
    tex: I
    value: val
    tol: 0.005
    explain: 'Odd power of sine: keep one $\sin x$ for $du$ with $u = \cos x$ and write the rest with $\sin^2 = 1 - \cos^2$ (and the same with sine and cosine swapped). Both even: $\sin^2 x = \tfrac12(1 - \cos 2x)$'
  verify:
    expect:
      v: integrate(sin(x)**m*cos(x)**n, (x, 0, pi/2))
- template: ca-trig-integral-strategy
  skill: calc.antiderivatives
  pace: recall
  cases:
  - q: sin³x cos²x
    kc: 0
  - q: sin²x cos³x
    kc: 1
  - q: sin²x cos²x
    kc: 2
  - q: sin⁵x cos⁴x
    kc: 0
  - q: sin⁴x cos x
    kc: 1
  - q: sin⁴x
    kc: 2
  - q: cos³x
    kc: 1
  prompt: 'To integrate {{q}}, the most direct first move is:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Save one sin x and substitute u = cos x
    - Save one cos x and substitute u = sin x
    - Use the half-angle identities
    correct: kc
    explain: An odd power lends one factor to du and the rest converts with sin² + cos² = 1. Only when both powers are even do you need the half-angle identities
  verify:
    authored: true
- template: ca-trig-substitution
  skill: calc.antiderivatives
  pace: quick
  given:
    a:
      int:
      - 1
      - 6
  prompt: Evaluate $\displaystyle\int_0^{ {{a}} } \frac{x^2}{\sqrt{ {{a^2}} - x^2}}\,dx$.
  parts:
  - ask: Answer
    label: v
    tex: I
    value: pi*a^2/4
    tol: 0.005
    explain: $x = {{a}}\sin\theta$ turns $\sqrt{a^2 - x^2}$ into $a\cos\theta$ and $dx$ into $a\cos\theta\,d\theta$; the integral becomes $a^2\int_0^{\pi/2}\sin^2\theta\,d\theta = \pi a^2/4$
  verify:
    expect:
      v: integrate(x**2/sqrt(a**2 - x**2), (x, 0, a))

- template: ca-pdf-constant
  skill: calc.integration-apps
  pace: quick
  given:
    n:
      int:
      - 1
      - 3
    L:
      pick:
      - 1
      - 2
      - 3
      - 4
  prompt: $f(x) = k\,x^{ {{n}} }$ on $[0, {{L}}]$ (and 0 elsewhere) is a probability density. What is $k$?
  parts:
  - ask: Answer
    label: v
    tex: k
    value: (n + 1)/L^(n + 1)
    tol: 0.005
    explain: 'Total probability is 1: $k\dfrac{L^{n+1}}{n + 1} = 1$. Then $P(a < X < b) = \int_a^b f$'
  verify:
    expect:
      v: solve(Eq(integrate(Symbol('k')*x**n, (x, 0, L)), 1), Symbol('k'))[0]
- template: ca-pdf-mean
  skill: calc.integration-apps
  pace: quick
  given:
    kn:
      pick:
      - 1
      - 2
      - 3
    kl:
      pick:
      - 1
      - 2
      - 4
  prompt: f(x) = k·x^{{kn}} on [0, {{kl}}] (and 0 elsewhere) is a probability density. What is its mean?
  parts:
  - ask: Answer
    label: v
    tex: \mu
    value: (kn + 1)*kl/(kn + 2)
    tol: 0.005
    explain: Normalise first (k = (n + 1)/L^(n+1)), then μ = ∫ x f(x) dx. The mean sits past the midpoint because the density rises
  verify:

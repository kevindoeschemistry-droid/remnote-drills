- template: ca-marginal-cost
  skill: calc.rates
  pace: quick
  given:
    F:
      pick:
      - 500
      - 1000
      - 2000
    b:
      int:
      - 5
      - 30
    c:
      pick:
      - 0.01
      - 0.02
      - 0.05
      - 0.1
    q0:
      pick:
      - 50
      - 100
      - 200
  prompt: A cost function is $C(q) = {{F}} + {{b}}q + {{c}}q^2$ dollars. What is the marginal cost at $q = {{q0}}$, in dollars per unit?
  parts:
  - ask: Answer
    label: v
    tex: C'(q)
    value: b + 2*c*q0
    tol: 0.005
    explain: Marginal cost is $C'(q) = {{b}} + 2({{c}})q$. The fixed cost ${{F}}$ does not affect it
  verify:
    expect:
      v: diff(F + b*x + nsimplify(c)*x**2, x).subs(x, q0)
- template: ca-marginal-revenue-zero
  skill: calc.rates
  pace: quick
  given:
    ka:
      pick:
      - 40
      - 60
      - 120
    kb:
      pick:
      - 2
      - 3
      - 5
  prompt: Revenue from selling q units is R(q) = {{ka}}q − {{kb}}q² dollars. At what q is the marginal revenue zero?
  parts:
  - ask: Answer
    label: v
    tex: q
    value: ka/(2*kb)
    tol: 0.005
    explain: Marginal revenue is R′(q) = a − 2bq. Past the point where it reaches zero, selling one more unit lowers total revenue
  verify:
    expect:
      v: solve(diff(ka*x - kb*x**2, x), x)[0]
- template: ca-max-profit
  skill: calc.extrema
  pace: quick
  given:
    p:
      pick:
      - 40
      - 60
      - 80
      - 100
    F:
      pick:
      - 200
      - 500
    c:
      pick:
      - 10
      - 20
    d:
      pick:
      - 0.05
      - 0.1
      - 0.2
  prompt: Items sell for ${{p}}$ dollars each, and making $q$ of them costs $C(q) = {{F}} + {{c}}q + {{d}}q^2$ dollars. How many items maximise profit?
  parts:
  - ask: Answer
    label: v
    tex: q^*
    value: (p - c)/(2*d)
    tol: 0.005
    explain: '$P(q) = {{p}}q - C(q)$. Setting $P''(q) = 0$ gives ${{p}} = {{c}} + 2({{d}})q$: marginal revenue equals marginal cost. $P'''' < 0$, so it is a maximum'
  verify:
    expect:
      v: solve(diff(p*x - (F + c*x + nsimplify(d)*x**2), x), x)[0]
- template: ca-max-profit-value
  skill: calc.extrema
  pace: quick
  given:
    kp:
      pick:
      - 50
      - 80
      - 110
    kf:
      pick:
      - 100
      - 200
    kc:
      pick:
      - 10
      - 20
    kd:
      pick:
      - 0.5
      - 1
      - 2
  prompt: Items sell for {{kp}} dollars each, and making q of them costs C(q) = {{kf}} + {{kc}}q + {{kd}}q² dollars. What is the largest possible profit, in dollars?
  parts:
  - ask: Answer
    label: v
    tex: P_{max}
    value: (kp - kc)^2/(4*kd) - kf
    tol: 0.005
    explain: Find q where marginal revenue equals marginal cost, q = (p − c)/(2d), then put it back into the profit
  verify:
    expect:
      v: (kp*x - kf - kc*x - nsimplify(kd)*x**2).subs(x, solve(diff(kp*x - kf - kc*x - nsimplify(kd)*x**2, x), x)[0])
- template: ca-peak-concentration
  skill: calc.extrema
  pace: quick
  given:
    A:
      pick:
      - 5
      - 10
      - 20
    k:
      pick:
      - 0.1
      - 0.2
      - 0.25
      - 0.5
  prompt: After a dose, a drug's blood concentration is $C(t) = {{A}}\,t\,e^{-{{k}}t}$ (t in hours). When is the concentration highest, in hours?
  parts:
  - ask: Answer
    label: v
    tex: t^*
    value: 1/k
    tol: 0.005
    explain: $C'(t) = Ae^{-kt}(1 - kt) = 0$ at $t = 1/k$. The same shape (rise, then exponential decay) describes many absorption–elimination models
  verify:
    expect:
      v: solve(diff(A*x*exp(-nsimplify(k)*x), x), x)[0]

    tol: 0.005
    explain: ∫ 2π y √(1 + y′²) dx = 2π m √(1 + m²) ∫ x dx. It agrees with the frustum formula π(r₁ + r₂) × slant length
  verify:
    expect:
      v: pi*(nsimplify(km)*ka + nsimplify(km)*kb)*sqrt((kb - ka)**2 + (nsimplify(km)*(kb - ka))**2)
- template: ca-hydrostatic-triangle
  skill: calc.integration-apps
  pace: quick
  given:
    b:
      pick:
      - 1
      - 2
      - 3
      - 4
    h:
      pick:
      - 1
      - 2
      - 3
  prompt: A triangular plate with its {{b}} m base at the water surface and its apex {{h}} m below hangs vertically in water ($\rho g = 9810$ N/m³). What is the force on one side, in kN?
  parts:
  - ask: Answer
    label: v
    tex: F
    value: 9810*b*h^2/6/1000
    tol: 0.005
    explain: 'At depth $y$ the width is ${{b}}(1 - y/{{h}})$; $F = \int_0^h \rho g\,y\,b(1 - y/h)\,dy = \rho g b h^2/6$. Pressure, not area alone, decides the force: the wide part is shallow'
  verify:
    expect:
      v: integrate(9810*x*b*(1 - x/h), (x, 0, h))/1000
- template: ca-hydrostatic-gate
  skill: calc.integration-apps
  pace: quick
  given:
    kw:
      pick:
      - 2
      - 3
    kh:
      pick:
      - 1
      - 2
      - 4
    kd:
      pick:
      - 1
      - 3
      - 5
  prompt: A vertical rectangular gate {{kw}} m wide and {{kh}} m tall has its top edge {{kd}} m below the water surface (ρg = 9810 N/m³). Find the force on it, in N.
  parts:
  - ask: Answer
    label: v
    tex: F
    value: 9810*kw*((kd + kh)^2 - kd^2)/2
    tol: 0.005
    explain: ∫ ρg·depth·width d(depth) from d to d + h. It equals the pressure at the gate's centroid times its area
  verify:
    expect:
      v: 9810*kw*kh*(kd + Rational(kh, 2))
- template: ca-sequence-limit
  skill: calc.series
  pace: quick
  given:
    p:
      int:
      - 1
      - 9
    q:
      int:
      - -5
      - 5
    r:
      int:
      - 1
      - 9
    s:
      int:
      - 1
      - 6
  prompt: Find $\displaystyle\lim_{n\to\infty} \frac{ {{p}}n^2 + {{q}} }{ {{r}}n^2 + {{s}}n}$.
  parts:
  - ask: Answer
    label: v
    tex: L
    value: p/r
    tol: 0.005
    explain: 'Divide top and bottom by $n^2$: everything else goes to 0. A sequence converges when its terms settle; a series converges when its partial sums do'
  verify:
    expect:
      v: limit((p*x**2 + q)/(r*x**2 + s*x), x, oo)
- template: ca-sequence-limit-e
  skill: calc.series
  pace: quick
  given:
    ka:
      pick:
      - 2
      - 3
      - 5
  prompt: Find the limit of (1 + {{ka}}/n)^n as n → ∞.
  parts:
  - ask: Answer
    label: v
    tex: L
    value: exp(ka)
    tol: 0.005
    explain: 'Take logs: n ln(1 + a/n) → a, so the limit is e^a'
  verify:
    expect:
      v: limit((1 + Rational(ka)/nn)**nn, nn, oo)
- template: ca-root-test
  skill: calc.series
  pace: quick
  given:
    a:
      int:
      - 1
      - 7
    b:
      int:
      - 1
      - 7
  prompt: For $\displaystyle\sum_{n=1}^\infty \left(\frac{ {{a}}n}{ {{b}}n + 1}\right)^n$, find the root-test limit $\lim |a_n|^{1/n}$.
  parts:
  - ask: Answer
    label: v
    tex: L
    value: a/b
    tol: 0.005
    explain: 'The $n$th root strips the outer power: $\frac{ {{a}}n}{ {{b}}n + 1} \to {{a}}/{{b}}$. Below 1 converges, above 1 diverges; equal to 1 says nothing'
  verify:
    expect:
      v: limit(a*x/(b*x + 1), x, oo)
- template: ca-root-test-verdict
  skill: calc.series
  pace: recall
  cases:
  - q: 2n/(3n + 1)
    kc: 0
  - q: 5n/(2n + 1)
    kc: 1
  - q: n/(n + 1)
    kc: 2
  - q: n/(4n + 1)
    kc: 0
  - q: 3n/(3n + 1)
    kc: 2
  - q: 7n/(6n + 1)
    kc: 1
  prompt: 'For the series with terms ({{q}})^n, the root test says it:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Converges
    - Diverges
    - Is inconclusive
    correct: kc
    explain: The nth root is an/(bn + 1) → a/b. Below 1 converges, above 1 diverges, exactly 1 tells you nothing (here the terms do not even tend to 0, so the series diverges by the nth-term test)
  verify:
    authored: true
- template: ca-series-strategy
  skill: calc.series
  pace: recall
  cases:
  - s: \frac{n!}{5^n}
    ans: 0
  - s: \left(\frac{2n}{3n + 1}\right)^n
    ans: 1
  - s: \frac{(-1)^n}{\sqrt n}
    ans: 2
  - s: \frac{1}{n^2 + 7}
    ans: 3
  - s: \frac{n}{n + 1}
    ans: 4
  - s: \frac{3^n}{n!}
    ans: 0
  - s: \frac{(-1)^n n}{n^2 + 1}
    ans: 2
  - s: \frac{1}{2^n + n}
    ans: 3
  prompt: Which test settles $\displaystyle\sum {{s}}$ most directly?
  parts:
  - ask: Answer
    label: v
    choice:
    - Ratio test
    - Root test
    - Alternating series test
    - Comparison test
    - nth-term (divergence) test
    correct: ans
    explain: Factorials → ratio. A whole expression to the nth power → root. Alternating signs with terms shrinking to 0 → alternating series test. Looks like a p-series or geometric series → compare. Terms that do not go to 0 → divergence
  verify:
    authored: true
- template: ca-series-verdict
  skill: calc.series
  pace: recall
  cases:
  - q: 1/n^1.5
    kc: 0
  - q: n/(2n + 1)
    kc: 1
  - q: (−1)^n/√n
    kc: 0
  - q: 3^n/n!
    kc: 0
  - q: 1/(n ln n)
    kc: 1
  - q: (2/3)^n
    kc: 0
  - q: n!/10^n
    kc: 1
  - q: 1/√n
    kc: 1
  prompt: 'The series with terms {{q}} (n from 2 upward):'
  parts:
  - ask: Answer
    label: v
    choice:
    - Converges
    - Diverges
    correct: kc
    explain: p-series need p > 1; terms that do not tend to 0 diverge at once; factorials beat exponentials; 1/(n ln n) diverges by the integral test
  verify:
    authored: true
- template: ca-eliminate-parameter
  skill: calc.parametric-polar
  pace: quick
  given:
    h:
      int:
      - -3
      - 3
    b:
      int:
      - 1
      - 4
    c:
      int:
      - -5
      - 5
    x1:
      int:
      - -3
      - 4
  require:
  - b*(x1 - h)^2 + c != 0
  prompt: A curve is $x = t + {{h}}$, $y = {{b}}t^2 + {{c}}$. Eliminate $t$ and find $y$ when $x = {{x1}}$.
  parts:
  - ask: Answer
    label: v
    tex: y
    value: b*(x1 - h)^2 + c
    tol: 0.005
    explain: '$t = x - {{h}}$, so $y = {{b}}(x - {{h}})^2 + {{c}}$: a parabola. Eliminating the parameter loses the direction and speed of travel'
  verify:
    expect:
      v: (b*Symbol('t')**2 + c).subs(Symbol('t'), solve(Eq(Symbol('t') + h, x1), Symbol('t'))[0])
- template: ca-eliminate-exponential
  skill: calc.parametric-polar
  pace: quick
  given:
    kc:
      pick:
      - 1
      - 3
      - 5
    kx:
      pick:
      - 2
      - 3
      - 4
  prompt: A curve is x = e^t, y = e^(2t) + {{kc}}. Eliminate t and find y when x = {{kx}}.
  parts:
  - ask: Answer
    label: v
    tex: y
    value: kx^2 + kc
    final: true
    tol: 0.0001
    explain: e^(2t) = (e^t)² = x², so y = x² + c (for x > 0 only, since e^t is positive)
  verify:
    expect:
      v: (exp(2*x) + kc).subs(x, log(kx))
- template: ca-parametric-area
  skill: calc.parametric-polar
  pace: quick
  given:
    T:
      pick:
      - 1
      - 2
      - 3
  prompt: Find the area under $x = t^2$, $y = t^3$ for $0 \le t \le {{T}}$ (between the curve and the $x$-axis).
  parts:
  - ask: Answer
    label: v
    tex: A
    value: 2*T^5/5
    tol: 0.005
    explain: $\int y\,dx = \int_0^T t^3\cdot 2t\,dt = \tfrac25T^5$. Eliminating $t$ gives $y = x^{3/2}$, which integrates to the same
  verify:
    expect:
      v: integrate(x**Rational(3, 2), (x, 0, T**2))
- template: ca-ellipse-area-parametric
  skill: calc.parametric-polar
  pace: quick
  given:
    ka:
      pick:
      - 2
      - 3
      - 5
    kb:
      pick:
      - 1
      - 2
      - 4
  prompt: Find the area enclosed by x = {{ka}} cos t, y = {{kb}} sin t.
  parts:
  - ask: Answer
    label: v
    tex: A
    value: pi*ka*kb
    tol: 0.005
    explain: A = ∮ y dx taken clockwise = ∫ b sin t · a sin t dt over a full turn = πab
  verify:
    expect:
      v: integrate(kb*sin(x)*ka*sin(x), (x, 0, 2*pi))
- template: ca-parametric-volume
  skill: calc.parametric-polar
  pace: quick
  given:
    r:
      int:
      - 1
      - 5
  prompt: The upper half of $x = {{r}}\cos t$, $y = {{r}}\sin t$ ($0 \le t \le \pi$) is spun about the $x$-axis. Find the volume.
  parts:
  - ask: Answer
    label: v
    tex: V
    value: 4*pi*r^3/3
    tol: 0.005
    explain: $V = \int \pi y^2\,dx = \int_\pi^0 \pi r^2\sin^2 t\,(-r\sin t)\,dt = \tfrac43\pi r^3$, the sphere
  verify:
    expect:
      v: integrate(pi*(r**2 - x**2), (x, -r, r))
- template: ca-ellipsoid-volume-parametric
  skill: calc.parametric-polar
  pace: quick
  given:
    ka:
      pick:
      - 2
      - 3
      - 5
    kb:
      pick:
      - 1
      - 2
      - 3
  prompt: The upper half of x = {{ka}} cos t, y = {{kb}} sin t (0 ≤ t ≤ π) is spun about the x-axis. Find the volume.
  parts:
  - ask: Answer
    label: v
    tex: V
    value: 4*pi*ka*kb^2/3
    tol: 0.005
    explain: 'V = ∫ π y² dx with dx = −a sin t dt, taken so that x runs left to right: an ellipsoid of semi-axes a, b, b'
  verify:
    expect:
      v: integrate(pi*(kb*sin(x))**2*ka*sin(x), (x, 0, pi))
- template: ca-parametric-surface
  skill: calc.parametric-polar
  pace: quick
  given:
    r:
      int:
      - 1
      - 5
  prompt: The upper half of $x = {{r}}\cos t$, $y = {{r}}\sin t$ is spun about the $x$-axis. Find the surface area.
  parts:
  - ask: Answer
    label: v
    tex: S
    value: 4*pi*r^2
    tol: 0.005
    explain: $\sqrt{x'^2 + y'^2} = r$, so $S = \int_0^\pi 2\pi r\sin t\cdot r\,dt = 4\pi r^2$
  verify:
    expect:
      v: integrate(2*pi*r*sin(Symbol('t'))*r, (Symbol('t'), 0, pi))
- template: ca-parametric-cap-area
  skill: calc.parametric-polar
  pace: quick
  given:
    kr:
      pick:
      - 1
      - 2
      - 3
    kd:
      pick:
      - 30
      - 60
      - 90
  prompt: The arc x = {{kr}} cos t, y = {{kr}} sin t for 0 ≤ t ≤ {{kd}}° is spun about the x-axis. Find the area of the cap it sweeps.
  parts:
  - ask: Answer
    label: v
    tex: S
    value: 2*pi*kr^2*(1 - cos(kd*pi/180))
    tol: 0.005
    explain: S = ∫ 2π y √(x′² + y′²) dt, and the speed on a circle is r. The result is 2πr × the cap's height, Archimedes' hat-box theorem
  verify:
    expect:
      v: integrate(2*pi*kr*sin(x)*kr, (x, 0, kd*pi/180))
- template: ca-polar-arc-length
  skill: calc.parametric-polar
  pace: quick
  given:
    a:
      int:
      - 1
      - 6
  prompt: Find the length of the cardioid $r = {{a}}(1 + \cos\theta)$.
  parts:
  - ask: Answer
    label: v
    tex: L
    value: 8*a
    tol: 0.005
    explain: $r^2 + r'^2 = 2a^2(1 + \cos\theta) = 4a^2\cos^2(\theta/2)$, so $L = \int_0^{2\pi} 2a|\cos(\theta/2)|\,d\theta = 8a$. Watch the absolute value past $\theta = \pi$
  verify:
    expect:
      v: 2*integrate(2*a*cos(x/2), (x, 0, pi))
- template: ca-polar-spiral-length
  skill: calc.parametric-polar
  pace: quick
  given:
    kt:
      pick:
      - 1
      - 2
      - 3
  prompt: Find the length of the spiral r = e^θ for 0 ≤ θ ≤ {{kt}}.
  parts:
  - ask: Answer
    label: v
    tex: L
    value: sqrt(2)*(exp(kt) - 1)
    tol: 0.005
    explain: r and dr/dθ are both e^θ, so the integrand is √2 e^θ
  verify:
    expect:
      v: integrate(sqrt(exp(x)**2 + diff(exp(x), x)**2), (x, 0, kt))
- template: ca-vector-limit
  skill: calc.vectors-3d

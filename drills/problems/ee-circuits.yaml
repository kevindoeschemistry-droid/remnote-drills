- template: ee-decibels
  skill: ee.systems
  pace: quick
  cases:
  - kg: 10
  - kg: 100
  - kg: 2
  - kg: 0.5
  - kg: 50
  - kg: 0.1
  prompt: An amplifier's output voltage is {{kg}} times its input voltage. Express the gain in decibels.
  parts:
  - ask: Answer
    label: v
    tex: dB
    value: 20*log10(kg)
    tol: 0.01
    explain: '20 log10 for voltage ratios: a factor of 10 is 20 dB, a factor of 2 about 6 dB'
  verify:
    expect:
      v: 20*log(kg)/log(10)
- template: ee-nyquist-rate
  skill: ee.signals
  pace: quick
  cases:
  - kf: 20
  - kf: 4
  - kf: 3.4
  - kf: 15
  - kf: 0.5
  prompt: A signal's highest frequency component is {{kf}} kHz. What is the minimum sampling rate in kHz that avoids aliasing (the Nyquist rate)?
  parts:
  - ask: Answer
    label: v
    tex: f_s
    value: 2*kf
    final: true
    tol: 0.0001
    explain: Twice the highest frequency present
  verify:
    expect:
      v: solve(Eq(Symbol('m')/2, kf), Symbol('m'))[0]
- template: ee-alias-frequency
  skill: ee.signals
  pace: quick
  cases:
  - kf: 700
    ks: 1000
  - kf: 1300
    ks: 1000
  - kf: 4500
    ks: 8000
  - kf: 9000
    ks: 8000
  - kf: 60
    ks: 100
  prompt: A {{kf}} Hz tone is sampled at {{ks}} Hz. At what frequency does it appear after sampling?
  parts:
  - ask: Answer
    label: v
    tex: f
    value: abs(kf - round(kf/ks)*ks)
    tol: 0.005
    explain: Fold about the nearest multiple of the sampling rate
  verify:
    expect:
      v: Min(Abs(kf - floor(kf/Rational(ks))*ks), Abs(kf - (floor(kf/Rational(ks)) + 1)*ks))
- template: ee-filter-type
  skill: ee.signals
  pace: recall
  cases:
  - q: Removes 60 Hz hum and leaves frequencies above and below it
    kc: 3
  - q: Removes high-frequency noise from a slowly varying sensor signal
    kc: 0
  - q: Blocks DC and passes audio
    kc: 1
  - q: Selects one radio station from many
    kc: 2
  - q: An anti-aliasing filter placed before a sampler
    kc: 0
  - q: A series capacitor feeding a resistor to ground, output across the resistor
    kc: 1
  prompt: Which filter? {{q}}
  parts:
  - ask: Answer
    label: v
    choice:
    - Low-pass
    - High-pass
    - Band-pass
    - Band-stop (notch)
    correct: kc
    explain: Named for the band it passes
  verify:
    authored: true
- template: ee-first-order-gain
  skill: ee.signals
  pace: quick
  cases:
  - kc0: 100
    kf: 100
  - kc0: 1000
    kf: 3000
  - kc0: 50
    kf: 500
  - kc0: 200
    kf: 150
  - kc0: 10
    kf: 20
  prompt: A first-order low-pass filter has a cutoff frequency of {{kc0}} Hz. Find its gain (output amplitude over input amplitude) at {{kf}} Hz.
  parts:
  - ask: Answer
    label: v
    tex: '|H|'
    value: 1/sqrt(1 + (kf/kc0)^2)
    tol: 0.005
    explain: '|H| = 1/√(1 + (f/fc)²): 0.707 at cutoff, about a tenth one decade above'
  verify:
    expect:
      v: Abs(1/(1 + I*Rational(kf)/kc0))
- template: ee-difference-equation
  skill: ee.signals
  pace: quick
  cases:
  - ka: 0.5
  - ka: 0.9
  - ka: 0.25
  - ka: -0.5
  - ka: 0.8
  prompt: A filter obeys y[n] = {{ka}} y[n−1] + x[n] with y[−1] = 0. The input is 1 for every n ≥ 0. Find y[2].
  parts:
  - ask: Answer
    label: v
    tex: y[2]
    value: 1 + ka + ka^2
    tol: 0.005
    explain: 'Step through: y[0] = 1, y[1] = a + 1, y[2] = a(a + 1) + 1'
  verify:
    expect:
      v: ka*(ka*(ka*0 + 1) + 1) + 1
- template: ee-digital-dc-gain
  skill: ee.signals
  pace: quick
  cases:
  - ka: 0.5
    kb: 1
  - ka: 0.9
    kb: 0.1
  - ka: 0.75
    kb: 0.5
  - ka: -0.5
    kb: 3
  - ka: 0.2
    kb: 4
  prompt: A filter obeys y[n] = {{ka}} y[n−1] + {{kb}} x[n]. Find its DC gain.
  parts:
  - ask: Answer
    label: v
    tex: H(1)
    value: kb/(1 - ka)
    tol: 0.005
    explain: At DC the output stops changing, so set y[n] = y[n−1] with x = 1; equivalently H(z) at z = 1
  verify:
    expect:
      v: solve(Eq(Symbol('m'), ka*Symbol('m') + kb), Symbol('m'))[0]

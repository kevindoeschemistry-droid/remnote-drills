- template: ee-impedance-magnitude
  skill: ee.ac
  pace: quick
  cases:
  - kr: 3
    ka: 8
    kb: 4
  - kr: 5
    ka: 20
    kb: 8
  - kr: 8
    ka: 4
    kb: 10
  - kr: 12
    ka: 25
    kb: 9
  - kr: 40
    ka: 10
    kb: 40
  prompt: A series circuit has a resistance of {{kr}} Ω, an inductive reactance of {{ka}} Ω and a capacitive reactance of {{kb}} Ω. Find the magnitude of its impedance.
  parts:

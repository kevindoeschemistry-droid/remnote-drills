- template: ee-pole-stability
  skill: ee.systems
  pace: recall
  cases:
  - q: s = −2 and s = −5
    kc: 0
  - q: s = −1 ± 3j
    kc: 0
  - q: s = +1 and s = −4
    kc: 1
  - q: s = ±2j
    kc: 2
  - q: s = 0.5 ± 2j
    kc: 1
  - q: s = −3 only
    kc: 0
  prompt: A system's poles are at {{q}}. Is it stable?
  parts:
  - ask: Answer
    label: v
    choice:
    - Stable
    - Unstable
    - Marginally stable
    correct: kc
    explain: Left half-plane poles decay, right half-plane poles grow, poles on the imaginary axis neither
  verify:
    authored: true

- template: ee-step-response
  skill: ee.systems
  pace: quick
  cases:
  - kv: 10
    kt: 2
    ka: 2
  - kv: 5
    kt: 10
    ka: 20
  - kv: 12
    kt: 1
    ka: 3
  - kv: 9
    kt: 4
    ka: 2
  - kv: 24
    kt: 5
    ka: 5
  prompt: A capacitor charges from zero toward {{kv}} V through a resistor with time constant {{kt}} ms. Find its voltage after {{ka}} ms.
  parts:
  - ask: Answer
    label: v
    tex: v
    value: kv*(1 - exp(-ka/kt))
    tol: 0.005
    explain: v = V(1 − e^(−t/τ))
  verify:
    expect:
      v: kv - kv*exp(-Rational(ka)/kt)
- template: ee-resonant-frequency

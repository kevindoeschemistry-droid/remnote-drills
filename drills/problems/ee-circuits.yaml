- template: ee-thevenin-resistance
  skill: ee.dc
  pace: quick
  cases:
  - kv: 12
    ka: 6
    kb: 3
  - kv: 10
    ka: 10
    kb: 15
  - kv: 9
    ka: 4
    kb: 12
  - kv: 24
    ka: 20
    kb: 30
  - kv: 5
    ka: 1
    kb: 4
  prompt: A {{kv}} V source drives {{ka}} Ω in series with {{kb}} Ω, and the output is taken across the {{kb}} Ω resistor. Find the Thevenin resistance seen at the output.
  parts:
  - ask: Answer
    label: v
    tex: R_{th}
    value: ka*kb/(ka + kb)
    tol: 0.005
    explain: 'Short the source: the two resistors are then in parallel. The check divides open-circuit voltage by short-circuit current'
  verify:
    expect:
      v: (kv*kb/Rational(ka + kb))/(kv/Rational(ka))
- template: ee-max-power
  skill: ee.dc
  pace: quick
  cases:
  - kv: 12
    kr: 6
  - kv: 10
    kr: 5
  - kv: 24
    kr: 8
  - kv: 9
    kr: 3
  - kv: 5
    kr: 50
  prompt: A source has a Thevenin voltage of {{kv}} V and a Thevenin resistance of {{kr}} Ω. What is the maximum power it can deliver to a load?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: kv^2/(4*kr)
    tol: 0.005
    explain: The matched load takes half the voltage, so P = (Vth/2)²/Rth
  verify:
    expect:
      v: (kv/Rational(2*kr))**2*kr
- template: ee-node-voltage
  skill: ee.dc
  pace: quick
  cases:
  - ka: 12
    kp: 2
    kb: 6
    kq: 2
    kr: 2
  - ka: 10
    kp: 5
    kb: 20
    kq: 10
    kr: 10
  - ka: 9
    kp: 3
    kb: 3
    kq: 6
    kr: 6
  - ka: 24
    kp: 4
    kb: 12
    kq: 4
    kr: 2
  prompt: A node is connected to a {{ka}} V source through {{kp}} Ω, to a {{kb}} V source through {{kq}} Ω, and to ground through {{kr}} Ω. Find the node voltage.
  parts:
  - ask: Answer
    label: v
    tex: V
    value: (ka/kp + kb/kq)/(1/kp + 1/kq + 1/kr)
    tol: 0.005
    explain: Sum of currents into the node from the two sources equals the current to ground
  verify:
    expect:
      v: solve(Eq((ka - Symbol('m'))/kp + (kb - Symbol('m'))/kq, Symbol('m')/kr), Symbol('m'))[0]
- template: ee-superposition
  skill: ee.dc
  pace: quick
  cases:
  - ka: 12
    kp: 2
    kq: 2
    kr: 2
  - ka: 10
    kp: 5
    kq: 10
    kr: 10
  - ka: 9
    kp: 3
    kq: 6
    kr: 6
  - ka: 24
    kp: 4
    kq: 4
    kr: 2
  prompt: A node is fed by a {{ka}} V source through {{kp}} Ω and by a second source through {{kq}} Ω, with {{kr}} Ω from the node to ground. With the second source switched off (replaced by a short), what node voltage does the first source alone produce?
  parts:
  - ask: Answer
    label: v
    tex: V
    value: ka*(kq*kr/(kq + kr))/(kp + kq*kr/(kq + kr))
    tol: 0.005
    explain: With the other source shorted, its resistor is in parallel with the one to ground, and the first source sees a divider
  verify:
    expect:
      v: solve(Eq((ka - Symbol('m'))/kp, Symbol('m')/kq + Symbol('m')/kr), Symbol('m'))[0]
- template: ee-rms
  skill: ee.ac
  pace: quick
  cases:
  - kp: 170
  - kp: 10
  - kp: 325
  - kp: 5
  - kp: 48
  prompt: A sinusoidal voltage has a peak value of {{kp}} V. Find its RMS value.
  parts:
  - ask: Answer
    label: v
    tex: V_{rms}
    value: kp/sqrt(2)
    tol: 0.005
    explain: Root of the mean of the square over one cycle, which for a sine is peak over root two
  verify:
    expect:
      v: sqrt(integrate((kp*sin(Y))**2, (Y, 0, 2*pi))/(2*pi))
- template: ee-angular-frequency

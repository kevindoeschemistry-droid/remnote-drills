    kb: 4
  - kv: 9
    ka: 1
    kb: 2
  - kv: 10
    ka: 3
    kb: 7
  - kv: 24
    ka: 5
    kb: 3
  - kv: 5
    ka: 10
    kb: 15
  prompt: A {{kv}} V source drives {{ka}} Ω in series with {{kb}} Ω. Find the voltage across the {{kb}} Ω resistor.
  parts:
  - ask: Answer
    label: v
    tex: V
    value: kv*kb/(ka + kb)
    tol: 0.005
    explain: The same current flows through both, so voltage splits in proportion to resistance
  verify:
    expect:

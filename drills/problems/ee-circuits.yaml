# Second question types; keys recomputed by sympy along another route.

- template: ee-kcl-node
  skill: ee.dc
  pace: quick
  cases:
  - ka: 3
    kb: 5
    kd: 2
  - ka: 1.5
    kb: 2.5
    kd: 3
  - ka: 10
    kb: 4
    kd: 9
  - ka: 0.8
    kb: 0.7
    kd: 0.5
  - ka: 6
    kb: 6
    kd: 7
  prompt: Currents of {{ka}} A and {{kb}} A flow into a node and {{kd}} A flows out through one branch. What current flows out through the only other branch?
  parts:
  - ask: Answer
    label: v
    tex: I
    value: ka + kb - kd
    final: true
    tol: 0.0001
    explain: What goes in must come out
  verify:
    expect:
      v: solve(Eq(ka + kb, kd + Symbol('m')), Symbol('m'))[0]
- template: ee-kvl-loop
  skill: ee.dc
  pace: quick
  cases:
  - kv: 12
    ka: 4.5
  - kv: 9
    ka: 6.2
  - kv: 24
    ka: 15
  - kv: 5
    ka: 1.8
  - kv: 120
    ka: 45
  prompt: A {{kv}} V source drives two resistors in series. The voltage across the first resistor is {{ka}} V. What is the voltage across the second?
  parts:
  - ask: Answer
    label: v
    tex: V
    value: kv - ka
    final: true
    tol: 0.0001
    explain: Rises equal drops round the loop
  verify:
    expect:
      v: solve(Eq(kv - ka - Symbol('m'), 0), Symbol('m'))[0]
- template: ee-parallel
  skill: ee.dc
  pace: quick
  cases:
  - ka: 6
    kb: 3
  - ka: 10
    kb: 15
  - ka: 100
    kb: 400
  - ka: 12
    kb: 4
  - ka: 30
    kb: 60
  prompt: Resistors of {{ka}} Ω and {{kb}} Ω are connected in parallel. Find the equivalent resistance in ohms.
  parts:
  - ask: Answer
    label: v
    tex: R
    value: ka*kb/(ka + kb)
    tol: 0.005
    explain: Product over sum; the result is always less than the smaller resistor
  verify:
    expect:
      v: solve(Eq(1/Symbol('m'), 1/Rational(ka) + 1/Rational(kb)), Symbol('m'))[0]
- template: ee-voltage-divider
  skill: ee.dc
  pace: quick
  cases:
  - kv: 12

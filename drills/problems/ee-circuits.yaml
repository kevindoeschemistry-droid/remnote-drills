  - kb: 250
    ka: 8
  prompt: A transistor with β = {{kb}} has a base current of {{ka}} μA and is in the active region. Find the collector current in mA.
  parts:
  - ask: Answer
    label: v
    tex: I_C
    value: kb*ka/1000
    tol: 0.005
    explain: I_C = β I_B
  verify:
    expect:
      v: solve(Eq(Symbol('m')*1000/kb, ka), Symbol('m'))[0]
- template: ee-inverting-output
  skill: ee.electronics
  pace: quick
  cases:
  - kf: 10
    kn: 1
    kv: 0.5
  - kf: 47
    kn: 10
    kv: 1
  - kf: 100
    kn: 20
    kv: -0.2
  - kf: 22
    kn: 2.2
    kv: 0.3
  - kf: 5
    kn: 10
    kv: 4
  prompt: An inverting amplifier has a feedback resistor of {{kf}} kΩ and an input resistor of {{kn}} kΩ. Find the output voltage for an input of {{kv}} V.
  parts:
  - ask: Answer
    label: v
    tex: V_o
    value: -kf/kn*kv
    tol: 0.005
    explain: 'KCL at the virtual ground: input current plus feedback current is zero'
  verify:
    expect:
      v: solve(Eq(kv/kn + Symbol('m')/kf, 0), Symbol('m'))[0]
- template: ee-noninverting-gain
  skill: ee.electronics
  pace: quick
  cases:
  - kf: 9
    kn: 1
  - kf: 10
    kn: 10
  - kf: 47
    kn: 4.7
  - kf: 100
    kn: 1
  - kf: 2
    kn: 8
  prompt: A non-inverting amplifier has a feedback resistor of {{kf}} kΩ and a resistor of {{kn}} kΩ from the inverting input to ground. Find its voltage gain.
  parts:
  - ask: Answer
    label: v
    tex: A
    value: 1 + kf/kn
    tol: 0.005
    explain: The feedback divider returns a fraction R1/(R1 + Rf) of the output, and the gain is its reciprocal
  verify:
    expect:
      v: solve(Eq(1/Symbol('m'), kn/Rational(kf + kn)), Symbol('m'))[0]
- template: ee-adc-resolution
  skill: ee.electronics
  pace: quick
  cases:
  - kn: 8
    kv: 5
  - kn: 10
    kv: 3.3
  - kn: 12
    kv: 5
  - kn: 16
    kv: 10
  - kn: 4
    kv: 2
  prompt: A {{kn}}-bit analog-to-digital converter has a full-scale range of {{kv}} V. Find the size of one step in millivolts.
  parts:
  - ask: Answer
    label: v
    tex: LSB
    value: 1000*kv/2^kn
    tol: 0.005
    explain: Range divided by the number of codes
  verify:
    expect:
      v: solve(Eq(Symbol('m')*2**kn/1000, kv), Symbol('m'))[0]
- template: ee-rectifier-average
  skill: ee.electronics
  pace: quick
  cases:
  - kp: 10
  - kp: 170
  - kp: 17
  - kp: 5
  - kp: 34
  prompt: An ideal full-wave rectifier is fed a sine wave of peak {{kp}} V. Find the average value of its output.
  parts:
  - ask: Answer
    label: v
    tex: V_{avg}
    value: 2*kp/pi
    tol: 0.005
    explain: Average of a half-sine over its half-period
  verify:
    expect:
      v: integrate(kp*sin(Y), (Y, 0, pi))/pi
- template: ee-line-voltage
  skill: ee.power
  pace: quick
  cases:
  - kv: 120
  - kv: 277
  - kv: 230
  - kv: 2400
  - kv: 7200
  prompt: A balanced wye-connected source has a phase voltage of {{kv}} V. Find the line-to-line voltage.
  parts:
  - ask: Answer
    label: v
    tex: V_L
    value: sqrt(3)*kv
    tol: 0.005
    explain: The difference of two phasors 120° apart is √3 times either
  verify:
    expect:
      v: sqrt((kv - kv*cos(2*pi/3))**2 + (kv*sin(2*pi/3))**2)
- template: ee-three-phase-power
  skill: ee.power
  pace: quick
  cases:
  - kv: 480
    ki0: 20
    kf: 0.85
  - kv: 208
    ki0: 30
    kf: 0.9
  - kv: 400
    ki0: 10
    kf: 0.8
  - kv: 4160
    ki0: 50
    kf: 0.95
  - kv: 240
    ki0: 15
    kf: 0.7
  prompt: A balanced three-phase load draws {{ki0}} A per line at {{kv}} V line-to-line with a power factor of {{kf}}. Find the total real power in kW.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: sqrt(3)*kv*ki0*kf/1000
    tol: 0.005
    explain: √3 V_L I_L cos φ, the same as three times the per-phase power
  verify:
    expect:
      v: 3*(kv/sqrt(3))*ki0*kf/1000
- template: ee-transformer-voltage
  skill: ee.power
  pace: quick
  cases:
  - ka: 1000
    kb: 100
    kv: 2400
  - ka: 500
    kb: 50
    kv: 120
  - ka: 200
    kb: 800
    kv: 120
  - ka: 4000
    kb: 200
    kv: 7200
  - ka: 120
    kb: 12
    kv: 240
  prompt: An ideal transformer has {{ka}} primary turns and {{kb}} secondary turns. The primary voltage is {{kv}} V. Find the secondary voltage.
  parts:
  - ask: Answer
    label: v
    tex: V_2
    value: kv*kb/ka
    tol: 0.005
    explain: Voltage follows the turns
  verify:
    expect:
      v: solve(Eq(kv/Symbol('m'), Rational(ka)/kb), Symbol('m'))[0]
- template: ee-reflected-impedance
  skill: ee.power
  pace: quick
  cases:
  - ka: 10
    kz: 8
  - ka: 2
    kz: 50
  - ka: 5
    kz: 4
  - ka: 20
    kz: 0.5
  - ka: 4
    kz: 16
  prompt: An ideal transformer with a turns ratio of {{ka}}:1 (primary to secondary) feeds a {{kz}} Ω load. What impedance does the source see?
  parts:
  - ask: Answer
    label: v
    tex: Z
    value: ka^2*kz
    tol: 0.005
    explain: Voltage is multiplied by the ratio and current divided by it, so impedance goes as the ratio squared
  verify:
    expect:
      v: (ka*Symbol('m'))/(Symbol('m')/ka/kz)
- template: ee-synchronous-speed
  skill: ee.power
  pace: quick
  cases:
  - kp: 4
    kf: 60
  - kp: 2
    kf: 50
  - kp: 6
    kf: 60
  - kp: 8
    kf: 50
  - kp: 12
    kf: 60
  prompt: Find the synchronous speed in rev/min of a {{kp}}-pole machine on a {{kf}} Hz supply.
  parts:
  - ask: Answer
    label: v
    tex: n_s
    value: 120*kf/kp
    final: true
    tol: 0.0001
    explain: Each pole pair gives one electrical cycle per revolution
  verify:
    expect:
      v: solve(Eq(Symbol('m')/60*kp/2, kf), Symbol('m'))[0]
- template: ee-slip
  skill: ee.power
  pace: quick
  cases:
  - kp: 4
    kf: 60
    kn: 1746
  - kp: 2
    kf: 50
    kn: 2910
  - kp: 6
    kf: 60
    kn: 1140
  - kp: 8
    kf: 50
    kn: 720
  - kp: 4
    kf: 50
    kn: 1440
  prompt: A {{kp}}-pole, {{kf}} Hz induction motor runs at {{kn}} rev/min. Find its slip in percent.
  parts:
  - ask: Answer
    label: v
    tex: s
    value: 100*(120*kf/kp - kn)/(120*kf/kp)
    tol: 0.005
    explain: How far the rotor falls behind the rotating field, as a fraction of synchronous speed
  verify:
    expect:
      v: solve(Eq(kn, (1 - Symbol('m')/100)*120*kf/kp), Symbol('m'))[0]
- template: ee-closed-loop-gain
  skill: ee.control
  pace: quick
  cases:
  - kg: 100
    kh: 0.1
  - kg: 10
    kh: 1
  - kg: 1000
    kh: 0.01
  - kg: 50
    kh: 0.5
  - kg: 4
    kh: 0.25
  prompt: A negative-feedback loop has a forward gain of {{kg}} and a feedback gain of {{kh}}. Find the closed-loop gain.
  parts:
  - ask: Answer
    label: v
    tex: T
    value: kg/(1 + kg*kh)
    tol: 0.005
    explain: Output = G × (input − H × output)
  verify:
    expect:
      v: solve(Eq(Symbol('m'), kg*(1 - kh*Symbol('m'))), Symbol('m'))[0]
- template: ee-steady-state-error
  skill: ee.control
  pace: quick
  cases:
  - kk: 9
  - kk: 99
  - kk: 4
  - kk: 19
  - kk: 1
  prompt: A unity-feedback system with no integrator has a DC loop gain of {{kk}}. Find the steady-state error to a unit step, in percent.
  parts:
  - ask: Answer
    label: v
    tex: e_{ss}
    value: 100/(1 + kk)
    tol: 0.005
    explain: The output settles at K/(1 + K), leaving 1/(1 + K) uncorrected
  verify:
    expect:
      v: 100*(1 - solve(Eq(Symbol('m'), kk*(1 - Symbol('m'))), Symbol('m'))[0])
- template: ee-overshoot
  skill: ee.control
  pace: quick
  cases:
  - kz: 0.5
  - kz: 0.7
  - kz: 0.2
  - kz: 0.3
  - kz: 0.6
  prompt: A second-order system has a damping ratio of {{kz}}. Find its percent overshoot to a step.
  parts:
  - ask: Answer
    label: v
    tex: OS
    value: 100*exp(-pi*kz/sqrt(1 - kz^2))
    tol: 0.01
    explain: Overshoot depends on damping ratio alone
  verify:
    expect:
      v: 100*exp(-pi/tan(acos(Rational(kz))))
- template: ee-settling-time
  skill: ee.control
  pace: quick
  cases:
  - kz: 0.5
    kw: 4
  - kz: 0.7
    kw: 10
  - kz: 0.2
    kw: 5
  - kz: 0.4
    kw: 20
  - kz: 0.8
    kw: 2
  prompt: A second-order system has ζ = {{kz}} and ωn = {{kw}} rad/s. Estimate its 2% settling time in seconds from 4 / (ζ ωn).
  parts:
  - ask: Answer
    label: v
    tex: t_s
    value: 4/(kz*kw)
    tol: 0.005
    explain: Four time constants of the decaying envelope e^(−ζωn t)
  verify:
    expect:
      v: solve(Eq(Symbol('m')*kz*kw, 4), Symbol('m'))[0]
- template: ee-bode-slope
  skill: ee.control
  pace: quick
  cases:
  - kp: 2
    kq: 0
  - kp: 3
    kq: 1
  - kp: 1
    kq: 0
  - kp: 4
    kq: 1
  - kp: 3
    kq: 0
  prompt: An open-loop transfer function has {{kp}} poles and {{kq}} zeros, all at frequencies well below the frequency of interest. Find the slope of its magnitude plot there, in dB per decade.
  parts:
  - ask: Answer
    label: v
    tex: slope
    value: -20*(kp - kq)
    final: true
    tol: 0.0001
    explain: Minus 20 dB per decade for each pole, plus 20 for each zero
  verify:
    expect:
      v: 20*kq - 20*kp
- template: ee-phase-margin
  skill: ee.control
  pace: quick
  cases:
  - ka: -135
  - ka: -120
  - ka: -150
  - ka: -170
  - ka: -100
  prompt: At the frequency where its gain is 0 dB, an open-loop system has a phase of {{ka}}°. Find the phase margin in degrees.
  parts:
  - ask: Answer
    label: v
    tex: PM
    value: 180 + ka
    final: true
    tol: 0.0001
    explain: How much more lag the loop could take before reaching −180°
  verify:
    expect:
      v: solve(Eq(ka - Symbol('m'), -180), Symbol('m'))[0]

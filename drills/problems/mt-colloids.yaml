- template: col-salt-effect
  skill: materials.colloids
  pace: recall
  cases:
    - { q: 'salt concentration is raised', o1: 'The barrier falls and aggregation speeds up', o2: 'The barrier rises', o3: 'Nothing changes: salt does not affect van der Waals forces', ans: 0 }
    - { q: 'the surface potential is raised (say, by changing pH away from the isoelectric point)', o1: 'The barrier rises and the dispersion is more stable', o2: 'The barrier falls', o3: 'Nothing changes', ans: 0 }
    - { q: 'the Hamaker constant is reduced (by matching the particle to the medium)', o1: 'The attraction weakens and the dispersion is more stable', o2: 'The repulsion weakens', o3: 'The Debye length shrinks', ans: 0 }
    - { q: 'pH is set at the isoelectric point', o1: 'No double-layer repulsion: fast aggregation', o2: 'Maximum stability', o3: 'The Hamaker constant becomes zero', ans: 0 }
  prompt: 'In DLVO terms, what happens when the {{q}}?'
  parts:
    - { ask: 'Effect', label: a, choice: ["{{o1}}", "{{o2}}", "{{o3}}"], correct: ans, explain: 'Repulsion depends on surface potential and Debye length; attraction on the Hamaker constant and is nearly insensitive to salt. Stability is the contest between them' }
  verify: { authored: true }

- template: col-schulze-hardy
  skill: materials.colloids
  pace: quick
  given: { c1: { pick: [50, 100, 150] }, z: { pick: [2, 3] } }
  prompt: 'A negatively charged sol coagulates at ${{c1}}$ mM of NaCl. By the Schulze–Hardy rule, at what concentration of a salt with a ${{z}}+$ counter-ion should it coagulate, in mM?'
  parts:
    - { ask: 'CCC (mM)', label: y, tex: 'c_{ccc}', value: c1/z^6, tol: 0.002, explain: 'For high surface potentials DLVO predicts $c_{ccc} \propto z^{-6}$: monovalent, divalent and trivalent counter-ions coagulate at about 1 : 1/64 : 1/729. That is why alum (Al³⁺) clears muddy water' }
  verify: { expect: { y: "c1*(1/z)**6" } }

- template: col-ccc-condition
  skill: materials.colloids
  pace: recall
  prompt: 'In DLVO theory, which condition defines the critical coagulation concentration?'
  parts:
    - ask: 'Condition'
      label: a
      choice: ["The barrier just vanishes: W = 0 and dW/dD = 0 at the same separation", "The Debye length equals the particle radius", "The zeta potential reaches zero"]
      correct: 0
      explain: 'Adding salt lowers the maximum of W(D). The CCC is where the maximum touches zero, so particles meet no barrier and every collision sticks'
  verify: { authored: true }

- template: col-secondary-minimum
  skill: materials.colloids
  pace: recall
  cases:
    - { q: 'the primary minimum', o1: 'Particles in contact, held by van der Waals: hard to redisperse', o2: 'A shallow dip far out: loose, reversible flocs', o3: 'The top of the barrier', ans: 0 }
    - { q: 'the secondary minimum', o1: 'A shallow dip far out: loose, reversible flocs', o2: 'Particles in contact: irreversible aggregation', o3: 'The top of the barrier', ans: 0 }
    - { q: 'the primary maximum', o1: 'The energy barrier that keeps particles apart', o2: 'Particles in contact', o3: 'A shallow dip far out', ans: 0 }
  prompt: 'On a DLVO energy curve, what is {{q}}?'
  parts:
    - { ask: 'Feature', label: a, choice: ["{{o1}}", "{{o2}}", "{{o3}}"], correct: ans, explain: 'Close in, van der Waals wins (deep primary minimum); at middle range repulsion builds a barrier; far out, where the repulsion has decayed but the slower $1/D$ attraction has not, a shallow secondary minimum can hold flocs that shaking breaks up' }
  verify: { authored: true }

- template: col-stokes-einstein
  skill: materials.colloids
  pace: quick
  given: { a: { pick: [10, 50, 100, 500] } }
  prompt: 'What is the diffusion coefficient of a sphere of radius ${{a}}$ nm in water at 25 °C ($\eta = 0.89$ mPa·s), in µm²/s?'
  parts:
    - { ask: 'D (µm²/s)', label: y, tex: 'D', value: '1.380649e-23*298.15/(6*pi*0.00089*a*1e-9)*1e12', tol: 0.002, explain: 'Stokes–Einstein: $D = k_BT/6\pi\eta a$. A 100 nm particle wanders about 2 µm in a second; dynamic light scattering runs this backwards to size particles' }
  verify: { expect: { y: "col_stokes_einstein_um2s(a, Rational(89, 100000))" } }

- template: col-fast-coagulation
  skill: materials.colloids
  pace: quick
  given: { n: { pick: [1, 10, 100] } }
  prompt: 'A dispersion with ${{n}} \times 10^{16}$ particles per m³ coagulates with no barrier (every collision sticks) in water at 25 °C ($\eta = 0.89$ mPa·s). How long until the particle count halves, in s?'
  parts:
    - { ask: 'Half-life (s)', label: y, tex: 't_{1/2}', value: '3*0.00089/(4*1.380649e-23*298.15*n*1e16)', tol: 0.002, explain: 'Smoluchowski rapid coagulation: $dN/dt = -k_fN^2$ with $k_f = 4k_BT/3\eta$, so $t_{1/2} = \dfrac{3\eta}{4k_BTN_0}$, independent of particle size. A barrier slows it by the stability ratio' }
  verify: { expect: { y: "col_fast_halflife(n*10**16, Rational(89, 100000))" } }

- template: col-beyond-dlvo
  skill: materials.colloids
  pace: recall
  cases:
    - { q: 'Adsorbed polymer chains keep particles apart even in strong salt.', o1: 'Steric stabilisation', o2: 'Depletion attraction', o3: 'Hydration repulsion', ans: 0 }
    - { q: 'Adding free, non-adsorbing polymer makes particles cluster.', o1: 'Depletion attraction', o2: 'Steric stabilisation', o3: 'Charge reversal', ans: 0 }
    - { q: 'Silica stays dispersed near its isoelectric point at short range.', o1: 'Hydration (structural) repulsion', o2: 'Depletion attraction', o3: 'Steric stabilisation', ans: 0 }
    - { q: 'A small amount of oppositely charged polymer bridges particles together.', o1: 'Bridging flocculation', o2: 'Steric stabilisation', o3: 'Hydration repulsion', ans: 0 }
  prompt: '{{q}} Which non-DLVO force is at work?'
  parts:
    - { ask: 'Force', label: a, choice: ["{{o1}}", "{{o2}}", "{{o3}}"], correct: ans, explain: 'DLVO has only van der Waals and the electrostatic double layer. Polymers (steric, depletion, bridging) and solvent structure (hydration, hydrophobic forces) add terms it does not contain' }
  verify: { authored: true }

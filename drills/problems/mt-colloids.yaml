# Colloids and interfaces, DLVO theory (framework materials, unit 3). Generated by scripts/col_cases.py:
# edit the script, not this file. Water at 25 °C (ε_r = 78.4, T = 298.15 K, η = 0.89 mPa·s) unless a
# card says otherwise. Checked by tests/verify/colcalc.py along other routes.

- template: col-debye-length
  skill: materials.colloids
  pace: quick
  given: { I: { pick: [1, 5, 10, 50, 100] } }
  prompt: 'What is the Debye length in ${{I}}$ mM aqueous NaCl at 25 °C, in nm?'
  parts:
    - { ask: 'Debye length (nm)', label: y, tex: '\kappa^{-1}', value: 'sqrt(78.4*8.8541878128e-12*1.380649e-23*298.15/(2*6.02214076e23*1.602176634e-19^2*I))*1e9', tol: 0.002, explain: '$\kappa^{-1} = \sqrt{\dfrac{\varepsilon_r\varepsilon_0k_BT}{2N_Ae^2I}}$, which for a 1:1 salt in water at 25 °C is $0.304/\sqrt{I/\text{M}}$ nm: 3 nm at 10 mM, 1 nm near seawater. It is how far the counter-ion cloud screens a surface charge' }
  verify: { expect: { y: "col_debye_nm(I)" } }

- template: col-debye-scaling
  skill: materials.colloids
  pace: quick
  given: { f: { pick: [4, 100, 0.25] } }
  prompt: 'The salt concentration around a colloid is multiplied by ${{f}}$. By what factor does the Debye length change?'
  parts:
    - { ask: 'Factor', label: y, tex: 'k', value: 1/sqrt(f), tol: 0.005, explain: '$\kappa^{-1} \propto 1/\sqrt I$. A hundredfold more salt shrinks the double layer tenfold, which is how salt destabilises a dispersion' }
  verify: { expect: { y: "col_debye_nm(f)/col_debye_nm(1)" } }

- template: col-debye-valence
  skill: materials.colloids
  pace: quick
  cases:
    - { s: 'NaCl', c: 10, I: 10, ions: '10:1,10:1' }
    - { s: 'CaCl₂', c: 10, I: 30, ions: '10:2,20:1' }
    - { s: 'MgSO₄', c: 10, I: 40, ions: '10:2,10:2' }
    - { s: 'Na₂SO₄', c: 5, I: 15, ions: '10:1,5:2' }
    - { s: 'AlCl₃', c: 2, I: 12, ions: '2:3,6:1' }
  prompt: 'What is the Debye length in ${{c}}$ mM aqueous {{s}} at 25 °C, in nm?'
  parts:
    - { ask: 'Debye length (nm)', label: y, tex: '\kappa^{-1}', value: 'sqrt(78.4*8.8541878128e-12*1.380649e-23*298.15/(2*6.02214076e23*1.602176634e-19^2*I))*1e9', tol: 0.002, explain: 'Use the ionic strength $I = \tfrac12\sum c_iz_i^2$, not the salt concentration: a 2:2 salt screens like four times as much 1:1 salt' }
  verify: { expect: { y: "col_debye_nm(ions)" } }

- template: col-grahame
  skill: materials.colloids
  pace: quick
  given: { psi: { pick: [25, 50, 75] }, c: { pick: [1, 10, 100] } }
  prompt: 'A surface in ${{c}}$ mM 1:1 electrolyte at 25 °C has potential ${{psi}}$ mV. Use the Grahame equation to find its surface charge density, in mC/m².'
  parts:
    - { ask: 'σ (mC/m²)', label: y, tex: '\sigma', value: 'sqrt(8*78.4*8.8541878128e-12*1.380649e-23*298.15*c*6.02214076e23)*sinh(1.602176634e-19*psi/1000/(2*1.380649e-23*298.15))*1000', tol: 0.002, explain: '$\sigma = \sqrt{8\varepsilon k_BTn_\infty}\,\sinh\dfrac{e\psi_0}{2k_BT}$, with $n_\infty$ ions per m³. At low potential it reduces to $\sigma = \varepsilon\kappa\psi_0$: a capacitor one Debye length thick' }
  verify: { expect: { y: "col_grahame(psi, c)" } }

- template: col-zeta-from-mobility
  skill: materials.colloids
  pace: quick
  given: { mob: { pick: [-4, -2.5, 1.5, 3] } }
  prompt: 'Particles in water at 25 °C ($\eta = 0.89$ mPa·s) have electrophoretic mobility ${{mob}}$ µm·cm/(V·s), and $\kappa a \gg 1$. What is their zeta potential, in mV?'
  parts:
    - { ask: 'ζ (mV)', label: y, tex: '\zeta', value: 'mob*1e-8*0.00089/(78.4*8.8541878128e-12)*1000', tol: 0.002, explain: 'Smoluchowski: $\mu = \varepsilon\zeta/\eta$ for thin double layers. 1 µm·cm/(V·s) is $10^{-8}$ m²/(V·s), about 13 mV in water' }
  verify: { expect: { y: "col_zeta_mV(mob)" } }

- template: col-huckel-or-smoluchowski
  skill: materials.colloids
  pace: quick
  given: { a: { pick: [5, 50, 500] }, I: { pick: [0.1, 1, 100] } }
  prompt: 'A particle of radius ${{a}}$ nm sits in ${{I}}$ mM NaCl (Debye length about $0.304/\sqrt{ {{I}}/1000 }$ nm). Which mobility formula applies?'
  parts:
    - ask: 'Formula'
      label: a
      choice: ["Smoluchowski, μ = εζ/η (thin double layer, κa ≫ 1)", "Hückel, μ = 2εζ/3η (thick double layer, κa ≪ 1)", "Neither: κa is near 1 (use Henry's function)"]
      correct: "a/(0.304/sqrt(I/1000)) > 20 ? 0 : (a/(0.304/sqrt(I/1000)) < 0.1 ? 1 : 2)"
      explain: 'Compare the particle to the double layer. Large particles in salty water see a flat, thin layer; tiny ones in pure water drag their whole cloud along'
  verify: { choices: { a: "0 if a/col_debye_nm(I) > 20 else (1 if a/col_debye_nm(I) < Rational(1, 10) else 2)" } }

- template: col-zeta-stability
  skill: materials.colloids
  pace: recall
  cases:
    - { z: '−45', ans: 0 }
    - { z: '+38', ans: 0 }
    - { z: '−8', ans: 1 }
    - { z: '+12', ans: 1 }
    - { z: '−22', ans: 2 }
  prompt: 'An aqueous dispersion stabilised only by charge has a zeta potential of {{z}} mV. What would you expect?'
  parts:
    - { ask: 'Expectation', label: a, choice: ["Stable: |ζ| above about 30 mV", "Aggregates quickly: |ζ| below about 15 mV", "Borderline: slow aggregation likely"], correct: ans, explain: 'A rule of thumb, not a law: it assumes no polymer or surfactant layer (steric stabilisation can hold a dispersion at zero ζ) and moderate salt' }
  verify: { authored: true }

- template: col-vdw-spheres
  skill: materials.colloids
  pace: quick
  given: { A: { pick: [0.5, 1, 4] }, R: { pick: [50, 100, 500] }, Dn: { pick: [2, 5, 10] } }
  prompt: 'Two equal spheres of radius ${{R}}$ nm with Hamaker constant ${{A}} \times 10^{-20}$ J are ${{Dn}}$ nm apart (surface to surface, $D \ll R$). What is their van der Waals energy, in units of $k_BT$ at 25 °C?'
  parts:
    - { ask: 'W / kT', label: y, tex: 'W/k_BT', value: '-A*1e-20*R*1e-9/(12*Dn*1e-9)/(1.380649e-23*298.15)', tol: 0.002, explain: 'Sphere–sphere at close range: $W = -\dfrac{AR}{12D}$ (equal radii; $-AR/6D$ for a sphere near a flat wall). It falls only as $1/D$, so big particles feel each other from far off' }
  verify: { expect: { y: "col_vdw_spheres_kt(A*10**-20, R, Dn)" } }

- template: col-vdw-distance-law
  skill: materials.colloids
  pace: recall
  cases:
    - { g: 'two flat plates (energy per area)', o1: '1/D²', o2: '1/D', o3: '1/D⁶', ans: 0 }
    - { g: 'two spheres close together', o1: '1/D', o2: '1/D²', o3: '1/D⁶', ans: 0 }
    - { g: 'a sphere near a flat wall', o1: '1/D', o2: '1/D²', o3: '1/D³', ans: 0 }
    - { g: 'two atoms', o1: '1/D⁶', o2: '1/D', o3: '1/D²', ans: 0 }
  prompt: 'How does the van der Waals energy of {{g}} fall off with separation D?'
  parts:
    - { ask: 'Law', label: a, choice: ["{{o1}}", "{{o2}}", "{{o3}}"], correct: ans, explain: 'Adding up $-C/r^6$ pairs over whole bodies softens the law: plates go as $A/12\pi D^2$ per area, and the Derjaguin approximation turns that into $AR/12D$ for spheres. Bodies attract over far longer range than atoms' }
  verify: { authored: true }

- template: col-hamaker-combining
  skill: materials.colloids
  pace: quick
  cases:
    - { m: 'polystyrene', A1: 6.6, A3: 3.7 }
    - { m: 'silica', A1: 6.5, A3: 3.7 }
    - { m: 'alumina', A1: 15.2, A3: 3.7 }
    - { m: 'gold', A1: 40, A3: 3.7 }
  prompt: '{{m}} has $A_{11} = {{A1}} \times 10^{-20}$ J and water $A_{33} = {{A3}} \times 10^{-20}$ J. Estimate the Hamaker constant for {{m}} particles interacting across water, in units of $10^{-20}$ J.'
  parts:
    - { ask: 'A₁₃₁ (10⁻²⁰ J)', label: y, tex: 'A_{131}', value: (sqrt(A1) - sqrt(A3))^2, tol: 0.002, explain: 'Combining rule: $A_{131} \approx (\sqrt{A_{11}} - \sqrt{A_{33}})^2$. The medium screens the attraction: particles close in polarisability to water barely attract in it' }
  verify: { expect: { y: "A1 + A3 - 2*sqrt(A1*A3)" } }

- template: col-edl-repulsion
  skill: materials.colloids
  pace: quick
  given: { R: { pick: [50, 100] }, psi: { pick: [25, 40] }, I: { pick: [1, 10] }, Dn: { pick: [2, 5, 10] } }
  prompt: 'Two equal spheres (${{R}}$ nm radius, surface potential ${{psi}}$ mV) are ${{Dn}}$ nm apart in ${{I}}$ mM NaCl at 25 °C. Using the weak-overlap, low-potential form $W = 2\pi\varepsilon R\psi_0^2e^{-\kappa D}$, what is their double-layer repulsion, in $k_BT$?'
  parts:
    - { ask: 'W / kT', label: y, tex: 'W/k_BT', value: '2*pi*78.4*8.8541878128e-12*R*1e-9*(psi/1000)^2*exp(-Dn*1e-9/sqrt(78.4*8.8541878128e-12*1.380649e-23*298.15/(2*6.02214076e23*1.602176634e-19^2*I)))/(1.380649e-23*298.15)', tol: 0.002, explain: 'The repulsion decays over the Debye length: double the salt and it reaches only $1/\sqrt2$ as far. It grows with the square of the surface potential' }
  verify: { expect: { y: "col_edl_spheres_kt(R, psi, I, Dn)" } }

- template: col-dlvo-total
  skill: materials.colloids
  pace: quick
  given: { R: { pick: [100] }, psi: { pick: [30, 50] }, I: { pick: [1, 10, 50] }, Dn: { pick: [3, 5, 10] } }
  prompt: 'In DLVO theory, what is the total interaction energy of two ${{R}}$ nm spheres ($A = 10^{-20}$ J, $\psi_0 = {{psi}}$ mV) ${{Dn}}$ nm apart in ${{I}}$ mM NaCl at 25 °C, in $k_BT$? Use $-AR/12D$ and $2\pi\varepsilon R\psi_0^2e^{-\kappa D}$.'
  parts:
    - { ask: 'W / kT', label: y, tex: 'W/k_BT', value: '(2*pi*78.4*8.8541878128e-12*R*1e-9*(psi/1000)^2*exp(-Dn*1e-9/sqrt(78.4*8.8541878128e-12*1.380649e-23*298.15/(2*6.02214076e23*1.602176634e-19^2*I))) - 1e-20*R*1e-9/(12*Dn*1e-9))/(1.380649e-23*298.15)', tol: 0.002, explain: 'DLVO adds a screened electrostatic repulsion to a van der Waals attraction. Close in the $1/D$ attraction always wins (the primary minimum); at intermediate range the exponential repulsion can build a barrier' }
  verify: { expect: { y: "col_total_kt(R, 10**-20, psi, I, Dn)" } }


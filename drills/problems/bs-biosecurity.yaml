# Second question types; keys recomputed by sympy along another route.

- template: bs-doubling-time
  skill: biosec.epidemiology
  pace: quick
  given:
    R:
      pick:
      - 1.3
      - 1.5
      - 2
      - 2.5
      - 3
    Tg:
      pick:
      - 3
      - 5
      - 7
  prompt: An outbreak has R = {{R}} and a generation interval of {{Tg}} days (treat it as fixed). What is the doubling time, in days?
  parts:
  - ask: Answer
    label: v
    tex: T_d
    value: log(2)/(log(R)/Tg)
    tol: 0.005
    explain: 'r = ln R / T_g, then T_d = ln 2 / r: the same R doubles faster with a shorter generation interval'
  verify:
    expect:
      v: Tg*log(2)/log(nsimplify(R))
- template: bs-r-from-doubling
  skill: biosec.epidemiology
  pace: quick
  given:
    Td:
      pick:
      - 2.5
      - 3
      - 4
      - 7
    Tg:
      pick:
      - 3
      - 5
      - 6
  prompt: Cases double every {{Td}} days and the generation interval is {{Tg}} days (fixed). What is R?
  parts:
  - ask: Answer
    label: v
    tex: R
    value: exp(log(2)/Td*Tg)
    tol: 0.005
    explain: 'R = e^{rT_g} with r = ln 2 / T_d, which is 2^{T_g/T_d}: R doublings per generation'
  verify:
    expect:
      v: 2**(nsimplify(Tg)/nsimplify(Td))
- template: bs-herd-threshold
  skill: biosec.epidemiology
  pace: quick
  given:
    R0:
      pick:
      - 1.5
      - 2
      - 3
      - 4
      - 6
      - 12
  prompt: A pathogen has R₀ = {{R0}}. What fraction of the population must be immune for herd protection, in %?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(1 - 1/R0)
    tol: 0.005
    explain: 'Spread stops once each case infects fewer than one: R₀(1 − p) < 1'
  verify:
    expect:
      v: solve(Eq(nsimplify(R0)*(1 - x/100), 1), x)[0]
- template: bs-r0-from-threshold
  skill: biosec.epidemiology
  pace: quick
  given:
    h:
      pick:
      - 50
      - 60
      - 75
      - 80
      - 90
      - 95
  prompt: Herd protection against a pathogen needs {{h}}% of the population immune. What R₀ does that imply?
  parts:
  - ask: Answer
    label: v
    tex: R_0
    value: 1/(1 - h/100)
    tol: 0.005
    explain: 'p = 1 − 1/R₀, so R₀ = 1/(1 − p): measles-like thresholds (~95%) mean R₀ near 20'
  verify:
    expect:
      v: solve(Eq(1 - 1/x, Rational(h, 100)), x)[0]
- template: bs-ifr-from-cfr
  skill: biosec.epidemiology
  pace: quick
  given:
    d:
      pick:
      - 12
      - 30
      - 75
    c:
      pick:
      - 1000
      - 2500
      - 5000
    a:
      pick:
      - 10
      - 20
      - 40
  prompt: '{{d}} deaths follow {{c}} confirmed cases, but only {{a}}% of infections were confirmed. What is the infection fatality ratio, in %?'
  parts:
  - ask: Answer
    label: v
    tex: \mathrm{IFR}
    value: 100*d/(c/(a/100))
    tol: 0.005
    explain: 'IFR = CFR × ascertainment: counting only the sick inflates apparent lethality'
  verify:
    expect:
      v: 100*d/c*Rational(a, 100)

# Incropera §8.6, §9.1/9.9, §9.8: noncircular ducts, mixed convection, vertical enclosures.
# Format and verify keys: see ht-generation.yaml. Where a correlation or table value is the given
# (stated in the prompt), the verifier applies it independently from the givens.

# ── rectangular duct, fully developed laminar flow ────────────────────────
- template: ht-int-noncircular
  skill: ht.internal-flow
  given:
    a: { pick: [0.005, 0.01, 0.02] }
    ar: { pick: [1, 2, 4, 8] }
    uq: { pick: [0, 1] }
    mdot: { pick: [5.0e-5, 1.0e-4, 2.0e-4, 5.0e-4] }
    mu: 1.85e-5
    kf: 0.0263
  let:
    b: ar*a
    Dh: 4*a*b/(2*(a + b))
    Dhmm: Dh*1000
    Re: mdot*Dh/(a*b*mu)
    Nu: "uq == 1 ? (ar == 1 ? 3.61 : (ar == 2 ? 4.12 : (ar == 4 ? 5.33 : 6.49))) : (ar == 1 ? 2.98 : (ar == 2 ? 3.39 : (ar == 4 ? 4.44 : 5.60)))"
    hh: Nu*kf/Dh
  require: [Re < 2000, Re > 100]
  prompt: >-
    Air ($\mu = {{mu}}\,\mathrm{N\cdot s/m^2}$, $k = {{kf}}\,\mathrm{W/m\cdot K}$) flows at $\dot m = {{mdot}}\,\mathrm{kg/s}$ through a
    rectangular duct ${{a*1000}}\,\mathrm{mm}\times{{b*1000}}\,\mathrm{mm}$ ($b/a = {{ar}}$), far from the entrance, with
    {{uq == 1 ? "uniform wall heat flux" : "uniform wall temperature"}}. Table 8.1 (fully developed laminar) for $b/a = {{ar}}$:
    $Nu_D = {{Nu}}$ (uniform $q''_s$ or $T_s$ as stated).
  parts:
    - ask: "Hydraulic diameter, $D_h$ (mm)"
      label: Dhmm
      tex: D_h
      value: Dhmm
      unit: mm
      explain: "$D_h = \\frac{4A_c}{P} = \\frac{4ab}{2(a + b)} = {{Dhmm|4}}\\,\\mathrm{mm}$ (not the side length, and not the wetted area)"
    - ask: "Reynolds number based on $D_h$"
      label: Re
      tex: "Re_{D_h}"
      value: Re
      explain: >-
        $Re = \frac{\rho u_m D_h}{\mu} = \frac{\dot m D_h}{A_c\mu}$ with $A_c = ab = {{a*b}}\,\mathrm{m^2}$: $Re = {{Re|4}}$
        ($< 2300$: laminar, so the tabulated $Nu$ applies)
    - ask: "Convection coefficient, $h$"
      label: hh
      tex: h
      value: hh
      unit: "W/m²·K"
      explain: "$h = Nu_D\\,k/D_h = {{Nu}}\\times{{kf}}/{{Dh|4}} = {{hh|3}}\\,\\mathrm{W/m^2\\cdot K}$ (independent of $\\dot m$ while laminar and fully developed)"
  verify:
    residuals:
      - "Dhmm/1000*2*(a + ar*a)/(4*a*(ar*a)) - 1"
      - "Re*mu*a*(ar*a)/(mdot*Dhmm/1000) - 1"
      - "hh*Dhmm/1000/kf/((3.61 if ar == 1 else 4.12 if ar == 2 else 5.33 if ar == 4 else 6.49) if uq == 1 else (2.98 if ar == 1 else 3.39 if ar == 2 else 4.44 if ar == 4 else 5.60)) - 1"

# ── free, forced or mixed: Gr/Re² ─────────────────────────────────────────
- template: ht-mixed-conv
  skill: ht.free-convection
  given:
    L: { pick: [0.1, 0.25, 0.5, 1.0] }
    u: { pick: [0.05, 0.1, 0.3, 0.5, 1, 2, 5] }
    Ts: { pick: [50, 80, 120] }
    Tinf: { pick: [20, 25] }
    nu: { pick: [1.6e-5, 1.8e-5, 2.0e-5] }
  let:
    Tf: (Ts + Tinf)/2 + 273.15
    Re: u*L/nu
    Gr: 9.8*(Ts - Tinf)*L^3/(Tf*nu^2)
    rr: Gr/Re^2
    reg: "rr < 0.1 ? 0 : (rr > 10 ? 2 : 1)"
  require: ["rr < 0.05 or (rr > 0.3 and rr < 3) or rr > 20", Re < 5.0e+5]
  prompt: >-
    Air ($\nu = {{nu}}\,\mathrm{m^2/s}$, an ideal gas) at $T_\infty = {{Tinf}}^\circ\mathrm{C}$ moves upward at $u_\infty = {{u}}\,\mathrm{m/s}$
    past a vertical plate $L = {{L*1000}}\,\mathrm{mm}$ tall held at $T_s = {{Ts}}^\circ\mathrm{C}$.
    Use $g = 9.8\,\mathrm{m/s^2}$.
  parts:
    - ask: "Reynolds number, $Re_L$"
      label: Re
      tex: Re_L
      value: Re
      explain: "$Re_L = u_\\infty L/\\nu = {{u}}\\times{{L}}/{{nu}} = {{Re|4}}$"
    - ask: "Grashof number, $Gr_L$"
      label: Gr
      tex: Gr_L
      value: Gr
      explain: >-
        Ideal gas: $\beta = 1/T_f$ with $T_f = {{Tf}}\,\mathrm{K}$ (kelvin!). $Gr_L = \frac{g\beta(T_s - T_\infty)L^3}{\nu^2} = {{Gr|4}}$
    - ask: "$Gr_L/Re_L^2$"
      label: rr
      tex: "Gr_L/Re_L^2"
      value: rr
      explain: "$Gr_L/Re_L^2 = {{Gr|4}}/({{Re|4}})^2 = {{rr|3}}$: buoyancy against inertia"
    - ask: "Which mode governs?"
      label: reg
      choice:
        - "Forced convection: free convection negligible"
        - "Mixed convection: account for both"
        - "Free convection: forced flow negligible"
      correct: reg
      explain: "$Gr/Re^2 \\ll 1$ forced, $\\approx 1$ mixed, $\\gg 1$ free. Here ${{rr|3}}$"
  verify:
    residuals:
      - "Re*nu/(u*L) - 1"
      - "Gr*nu**2*((Ts + Tinf)/2 + 273.15)/(9.8*(Ts - Tinf)*L**3) - 1"
      - "rr*Re**2/Gr - 1"

# ── vertical enclosure (double-pane window), Eq. 9.54 stated ──────────────
- template: ht-enclosure-vertical
  skill: ht.free-convection
  given:
    H: { pick: [0.5, 0.75, 1.0] }
    L: { pick: [0.025, 0.03, 0.04, 0.05] }
    W: { pick: [0.5, 1.0] }
    T1: { pick: [18, 20, 22] }
    T2: { pick: [-10, -5, 0, 5] }
    kf: 0.0246
    nu: 1.41e-5
    alpha: 1.99e-5
    Pr: 0.713
  let:
    Tm: (T1 + T2)/2 + 273.15
    Ra: 9.8*(T1 - T2)*L^3/(Tm*nu*alpha)
    Nu: 0.42*Ra^0.25*Pr^0.012*(H/L)^(-0.3)
    q: Nu*kf*(T1 - T2)/L*H*W
  require: [H/L >= 10, H/L <= 40, Ra > 1.0e+4, Ra < 1.0e+7, Nu > 1]
  prompt: >-
    A window has two panes ${{H*1000}}\,\mathrm{mm}$ tall and ${{W*1000}}\,\mathrm{mm}$ wide separated by an
    $L = {{L*1000}}\,\mathrm{mm}$ air gap. The inner pane is at $T_1 = {{T1}}^\circ\mathrm{C}$, the outer at $T_2 = {{T2}}^\circ\mathrm{C}$.
    Air at the mean temperature: $k = {{kf}}\,\mathrm{W/m\cdot K}$, $\nu = {{nu}}$, $\alpha = {{alpha}}\,\mathrm{m^2/s}$, $Pr = {{Pr}}$;
    $\beta = 1/T_m$, $g = 9.8\,\mathrm{m/s^2}$. Use Eq. 9.54:
    $\overline{Nu}_L = 0.42\,Ra_L^{1/4}Pr^{0.012}(H/L)^{-0.3}$ ($10 < H/L < 40$, $10^4 < Ra_L < 10^7$).
  parts:
    - ask: "Rayleigh number across the gap, $Ra_L$"
      label: Ra
      tex: Ra_L
      value: Ra
      explain: >-
        The length is the gap $L$, not the height: $Ra_L = \frac{g\beta(T_1 - T_2)L^3}{\nu\alpha}$ with
        $\beta = 1/{{Tm}}\,\mathrm{K^{-1}}$: $Ra_L = {{Ra|4}}$ (above $\approx 10^3$, so convection cells form)
    - ask: "Nusselt number, $\\overline{Nu}_L$"
      label: Nu
      tex: "\\overline{Nu}_L"
      value: Nu
      explain: "$H/L = {{H/L|3}}$: $\\overline{Nu}_L = 0.42({{Ra|4}})^{1/4}({{Pr}})^{0.012}({{H/L|3}})^{-0.3} = {{Nu|3}}$"
    - ask: "Heat rate through the gap, $q$"
      label: q
      tex: q
      value: q
      unit: W
      explain: >-
        $Nu$ multiplies pure conduction across the gap: $q = \overline{Nu}_L\,\frac{k(T_1 - T_2)}{L}\,HW
        = {{Nu|4}}\times\frac{ {{kf}}({{T1}} - ({{T2}})) }{ {{L}} }\times{{H}}\times{{W}} = {{q|3}}\,\mathrm{W}$
  verify:
    residuals:
      - "Ra*nu*alpha*((T1 + T2)/2 + 273.15)/(9.8*(T1 - T2)*L**3) - 1"
      - "Nu - 0.42*Ra**0.25*Pr**0.012*(H/L)**(-0.3)"
      - "q - Nu*kf*(T1 - T2)/L*H*W"

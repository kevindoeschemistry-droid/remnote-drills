- template: ra-supremum
  skill: ra.reals
  pace: quick
  cases:
  - st: '{1 − 1/n : n = 1, 2, 3, …}'
    kans: 1
    vy: limit(1 - 1/nn, nn, oo)
  - st: '{(−1)ⁿ/n : n = 1, 2, 3, …}'
    kans: 0.5
    vy: Max(-1, Rational(1, 2), -Rational(1, 3), Rational(1, 4))
  - st: '{x rational : x² < 2}'
    kans: 1.41421356
    vy: sqrt(2)
  - st: '{n/(2n + 1) : n = 1, 2, 3, …}'
    kans: 0.5
    vy: limit(nn/(2*nn + 1), nn, oo)
  - st: '{1/n + 1/m : n, m = 1, 2, 3, …}'
    kans: 2
    vy: Max(2, Rational(3, 2), 1)
  - st: '{3 − 2/n² : n = 1, 2, 3, …}'
    kans: 3
    vy: limit(3 - 2/nn**2, nn, oo)
  prompt: Find the supremum of the set {{st}}.
  parts:
  - ask: Answer
    label: v
    tex: \sup
    value: kans
    tol: 0.005
    explain: Find a value the set approaches or reaches from below and check nothing smaller is still an upper bound
  verify:
    expect:
      v: calc(vy)
- template: ra-sup-attained
  skill: ra.reals
  pace: recall
  cases:
  - st: '{1 − 1/n : n ≥ 1}'
    kc: 1
  - st: the closed interval [0, 1]
    kc: 0
  - st: the open interval (0, 1)
    kc: 1
  - st: '{(−1)ⁿ/n : n ≥ 1}'
    kc: 0
  - st: '{x rational : x² < 2}'
    kc: 1
  - st: '{1/n : n ≥ 1}'
    kc: 0
  prompt: Does the set {{st}} contain its supremum?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: A supremum that belongs to the set is a maximum. Sets that creep up to a bound without reaching it have a supremum but no maximum
  verify:
    authored: true
- template: ra-archimedean
  skill: ra.reals
  pace: quick
  given:
    ke:
      pick:
      - 0.3
      - 0.07
      - 0.03
      - 0.013
      - 0.006
  prompt: What is the least positive integer n with 1/n < {{ke}}?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: floor(1/ke) + 1
    final: true
    tol: 0.0001
    explain: 1/n < ε exactly when n > 1/ε, so take the first integer strictly beyond 1/ε
  verify:
    expect:
      v: pm_first_n('1/n', 0, ke)
- template: ra-completeness-facts
  skill: ra.reals
  pace: recall
  cases:
  - q: Which property distinguishes the real numbers from the rational numbers?
    o1: Every non-empty set bounded above has a least upper bound
    o2: Between any two elements lies another
    o3: Addition and multiplication obey the field axioms
    o4: The order is total
  - q: 'Between any two distinct real numbers there is:'
    o1: Both a rational and an irrational number
    o2: A rational but not always an irrational
    o3: An integer
    o4: Only finitely many rationals
  - q: 'The proof that √2 is irrational assumes √2 = a/b in lowest terms and shows:'
    o1: Both a and b are even
    o2: a is odd
    o3: b = 1
    o4: a² < 2b²
  - q: 'A bounded increasing sequence of real numbers must:'
    o1: Converge to its supremum
    o2: Be eventually constant
    o3: Converge to a rational number
    o4: Have a decreasing subsequence
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Density and the field axioms hold in the rationals too; the least upper bound axiom is what fills in the gaps
  verify:
    authored: true

      pick:
      - 1
      - 3
    ke:
      pick:
      - 0.1
      - 0.02
      - 0.5
  prompt: For f(x) = {{ka}}x + {{kb}}, what is the largest δ such that |x − 2| < δ guarantees |f(x) − f(2)| < {{ke}}?
  parts:
  - ask: Answer
    label: v
    tex: \delta
    value: ke/ka
    tol: 0.005
    explain: '|f(x) − f(2)| = a|x − 2|, so the condition is exactly |x − 2| < ε/a'
  verify:
    expect:
      v: solve(Eq(ka*Symbol('m'), ke), Symbol('m'))[0]
- template: ra-delta-square
  skill: ra.continuity
  pace: quick
  cases:
  - ka: 1
    kb: 3
    ke: 0.3
  - ka: 2
    kb: 5
    ke: 0.1
  - ka: 3
    kb: 7
    ke: 0.7
  - ka: 4
    kb: 9
    ke: 0.09
  - ka: 2
    kb: 5
    ke: 10
  prompt: To show x² is continuous at {{ka}}, restrict to |x − {{ka}}| < 1 so that |x + {{ka}}| < {{kb}}. Which δ then works for ε = {{ke}}? Give min(1, ε/{{kb}}).
  parts:
  - ask: Answer
    label: v
    tex: \delta
    value: min(1, ke/kb)
    tol: 0.005
    explain: '|x² − a²| = |x − a||x + a| < δ(2a + 1) once δ ≤ 1, so δ = min(1, ε/(2a + 1)) is enough'
  verify:
    expect:
      v: Min(1, nsimplify(ke)/(2*ka + 1))
- template: ra-bisection-steps
  skill: ra.continuity
  pace: quick
  cases:
  - kl: 1
    kt: 0.01
  - kl: 2
    kt: 0.001
  - kl: 4
    kt: 0.05
  - kl: 1
    kt: 0.0001
  - kl: 8
    kt: 0.3
  prompt: A continuous f changes sign on an interval of length {{kl}}. How many bisection steps guarantee an interval of length at most {{kt}} containing a root?
  parts:
  - ask: Answer
    label: v
    tex: steps
    value: ceil(log2(kl/kt))
    final: true
    tol: 0.0001
    explain: Each step halves the interval and the intermediate value theorem keeps a root inside, so n steps leave length L/2ⁿ
  verify:
    expect:
      v: pm_first_n('2**(-n)', 0, nsimplify(kt)/kl + Rational(1, 10**9))
- template: ra-ivt-evt-facts
  skill: ra.continuity
  pace: recall
  cases:
  - q: f(x) = 1/x on the open interval (0, 1) is continuous but unbounded. Which hypothesis of the extreme value theorem fails?
    o1: The interval is not closed
    o2: f is not continuous
    o3: The interval is not bounded
    o4: f is not differentiable
  - q: 'f(x) = x on the open interval (0, 1) is bounded but has no maximum because:'
    o1: Its supremum 1 is not attained
    o2: It is not continuous
    o3: It is not bounded above
    o4: It is decreasing
  - q: 'x⁵ + x − 1 has a real root because it is continuous and:'
    o1: Negative at 0 and positive at 1
    o2: A polynomial of odd degree only
    o3: Increasing
    o4: Bounded
  - q: 'The function that is −1 for x < 0 and 1 for x ≥ 0 never takes the value 0 on [−1, 1]. This is consistent with the intermediate value theorem because:'
    o1: The function is not continuous
    o2: The interval is not closed
    o3: 0 is not between −1 and 1
    o4: The function is not bounded
  - q: 'A continuous function from [0, 1] to [0, 1] must have:'
    o1: A fixed point
    o2: A zero
    o3: A maximum at an endpoint
    o4: An inverse
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: For the fixed point, apply the intermediate value theorem to f(x) − x, which is ≥ 0 at 0 and ≤ 0 at 1
  verify:
    authored: true
- template: ra-uniformly-continuous
  skill: ra.continuity
  pace: recall
  cases:
  - fn: x²
    dm: '[0, 1]'
    kc: 0
  - fn: x²
    dm: the whole real line
    kc: 1
  - fn: 1/x
    dm: (0, 1)
    kc: 1
  - fn: 1/x
    dm: '[1, ∞)'
    kc: 0
  - fn: √x
    dm: '[0, ∞)'
    kc: 0
  - fn: sin x
    dm: the whole real line
    kc: 0
  - fn: sin(1/x)
    dm: (0, 1)
    kc: 1
  - fn: eˣ
    dm: the whole real line
    kc: 1
  prompt: Is f(x) = {{fn}} uniformly continuous on {{dm}}?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: A bounded derivative is enough (sin x, 1/x on [1, ∞)); so is continuity on a closed bounded interval. Unbounded slope on an unbounded domain (x², eˣ) or wild behaviour at an open end (1/x, sin(1/x) near 0) breaks it. √x is uniformly continuous although its slope is unbounded at 0
  verify:
    authored: true

  pace: recall
  cases:
  - q: 'Bolzano-Weierstrass says every bounded sequence of real numbers has:'
    o1: A convergent subsequence
    o2: A limit
    o3: A monotone tail
    o4: A maximum
  - q: 'A sequence is Cauchy when:'
    o1: Its terms are eventually within ε of each other, for every ε
    o2: Consecutive terms get closer together
    o3: It is bounded
    o4: It is monotone
  - q: 'a_n = 1 + 1/2 + … + 1/n has a_(n+1) − a_n → 0. The sequence:'
    o1: 'Diverges: it is not Cauchy'
    o2: Converges
    o3: Is bounded
    o4: Is eventually constant
  - q: 'In the real numbers, a sequence converges exactly when it is:'
    o1: Cauchy
    o2: Bounded
    o3: Monotone
    o4: Positive
  - q: 'The sequence (−1)ⁿ is bounded and has:'
    o1: Convergent subsequences but no limit
    o2: Limit 0
    o3: No convergent subsequence
    o4: Limit 1
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Consecutive terms closing up is weaker than Cauchy: the harmonic sums gain a full 1/2 between n and 2n however large n is'
  verify:
    authored: true

- template: ra-recursive-limit
  skill: ra.sequences
  pace: quick
  given:
    kk:
      pick:
      - 2
      - 6
      - 12
      - 20
  prompt: x₁ = 1 and x_(n+1) = √({{kk}} + x_n). The sequence is increasing and bounded. Find its limit.
  parts:
  - ask: Answer
    label: v
    tex: L
    value: (1 + sqrt(1 + 4*kk))/2
    tol: 0.005
    explain: The limit L satisfies L = √(k + L), so L² − L − k = 0; take the positive root. The step that needs proof is that the limit exists at all
  verify:
    expect:
      v: Max(*solve(Eq(Symbol('m')**2, kk + Symbol('m')), Symbol('m')))
- template: ra-sequence-theorems

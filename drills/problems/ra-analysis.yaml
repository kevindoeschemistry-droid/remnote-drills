    o2: Continuity on the closed interval
    o3: Equal end values
    o4: Boundedness
  - q: 'If f′(x) = 0 for every x in an interval, the mean value theorem shows f is:'
    o1: Constant
    o2: Linear
    o3: Zero
    o4: Periodic
  - q: 'If |f′(x)| ≤ M on an interval, then |f(x) − f(y)| is at most:'
    o1: M|x − y|
    o2: M
    o3: M(x − y)²
    o4: '|x − y|/M'
  - q: 'If f′ > 0 on an interval, then f is:'
    o1: Strictly increasing
    o2: Convex
    o3: Positive
    o4: Bounded
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Almost every 'derivative tells you about the function' fact is the mean value theorem applied to two points
  verify:
    authored: true
- template: ra-taylor-degree
  skill: ra.calculus
  pace: quick
  cases:
  - sh: '0.01'
    kt: 0.01
    kans: 5
  - sh: '0.001'
    kt: 0.001
    kans: 6
  - sh: '0.0001'
    kt: 0.0001
    kans: 7
  - sh: '0.000001'
    kt: 1.0e-06
    kans: 9
  prompt: Using |R_n| < 3/(n + 1)! for e at x = 1, what is the smallest degree n that guarantees an error below {{sh}}?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: kans
    final: true
    tol: 0.0001
    explain: 'Tabulate 3/(n + 1)!: 3/2, 1/2, 1/8, 1/40, 1/240, 1/1680, 1/13440, … and stop at the first value below the tolerance'
  verify:
    expect:
      v: pm_first_n('3/factorial(n + 1)', 0, kt)
- template: ra-taylor-bound
  skill: ra.calculus
  pace: quick
  given:
    kx:
      pick:
      - 0.1
      - 0.5
      - 1
      - 2
  prompt: Bound the error of sin x ≈ x − x³/6 at x = {{kx}} by the next term's Lagrange bound, x⁵/5!.
  parts:
  - ask: Answer
    label: v
    tex: '|R|'
    value: kx^5/120
    tol: 0.005
    explain: Every derivative of sin is at most 1 in size, so the remainder after the x⁴ term (which is zero) is at most x⁵/120
  verify:
    expect:
      v: nsimplify(kx)**5/factorial(5)
- template: ra-upper-sum
  skill: ra.calculus
  pace: quick
  given:
    kn:
      pick:
      - 2
      - 4
      - 5
      - 10
  prompt: Find the upper Riemann sum of f(x) = x² on [0, 1] with {{kn}} equal subintervals.
  parts:
  - ask: Answer
    label: v
    tex: U
    value: (kn + 1)*(2*kn + 1)/(6*kn^2)
    tol: 0.005
    explain: Right endpoints give (1/n) Σ (k/n)² = (n + 1)(2n + 1)/(6n²), which decreases to 1/3
  verify:
    expect:
      v: pm_upper_sum('t**2', 0, 1, kn)
- template: ra-upper-minus-lower
  skill: ra.calculus
  pace: quick
  cases:
  - sh: x²
    py: t**2
    ka: 0
    kb: 2
    kn: 4
    kans: 2
  - sh: x³
    py: t**3
    ka: 0
    kb: 1
    kn: 5
    kans: 0.2
  - sh: √x
    py: sqrt(t)
    ka: 0
    kb: 4
    kn: 8
    kans: 1
  - sh: x²
    py: t**2
    ka: 1
    kb: 3
    kn: 10
    kans: 1.6
  - sh: 2x + 1
    py: 2*t + 1
    ka: 0
    kb: 5
    kn: 10
    kans: 5
  prompt: For f(x) = {{sh}} on [{{ka}}, {{kb}}] with {{kn}} equal subintervals, find the upper sum minus the lower sum.
  parts:
  - ask: Answer
    label: v
    tex: U-L
    value: kans
    tol: 0.005
    explain: 'For an increasing function everything cancels except the end values: U − L = (f(b) − f(a))(b − a)/n. This is the proof that monotone functions are integrable'
  verify:
    expect:
      v: pm_upper_sum(py, ka, kb, kn) - pm_lower_sum(py, ka, kb, kn)
- template: ra-improper-value
  skill: ra.calculus
  pace: quick
  given:
    kp:
      pick:
      - 2
      - 3
      - 1.5
      - 5
  prompt: Evaluate ∫ x^(−{{kp}}) dx from 1 to ∞.
  parts:
  - ask: Answer
    label: v
    tex: I
    value: 1/(kp - 1)
    tol: 0.005
    explain: The antiderivative x^(1−p)/(1 − p) tends to 0 at infinity because p > 1, leaving 1/(p − 1)
  verify:
    expect:
      v: integrate(Y**(-nsimplify(kp)), (Y, 1, oo))
- template: ra-improper-converges
  skill: ra.calculus
  pace: recall
  cases:
  - sh: 1/x dx from 1 to ∞
    kc: 1
  - sh: 1/x² dx from 1 to ∞
    kc: 0
  - sh: 1/√x dx from 0 to 1
    kc: 0
  - sh: 1/x dx from 0 to 1
    kc: 1
  - sh: 1/x² dx from 0 to 1
    kc: 1
  - sh: e^(−x) dx from 0 to ∞
    kc: 0
  - sh: 1/√x dx from 1 to ∞
    kc: 1
  - sh: 1/(x² + 1) dx over the whole real line
    kc: 0
  - sh: sin(x)/x² dx from 1 to ∞
    kc: 0
  prompt: Does ∫ {{sh}} converge?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: At infinity the power must beat 1/x; at 0 it must lose to 1/x. The borderline 1/x diverges at both ends, logarithmically
  verify:
    authored: true

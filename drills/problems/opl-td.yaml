  prompt: Water at {{P}} kPa ($T_{sat} = {{Ts}}$ °C) has $h = {{hf + xq*hfg}}$ kJ/kg. With $h_f = {{hf}}$ and $h_{fg} = {{hfg}}$ kJ/kg, what is the quality?

  prompt: Air ($k = 1.4$, $c_p = 1.005$ kJ/kg·K) is compressed from {{T1}} K and 100 kPa to {{rp*100}} kPa by a compressor with isentropic efficiency {{eta}}. Find the actual exit temperature, in K.
  parts:

    label: v
    tex: T_2
    value: T1 + (T1*rp^(0.4/1.4) - T1)/eta
    tol: 0.005
    explain: 'Find the isentropic outlet $T_{2s} = T_1 r_p^{(k-1)/k}$, then divide the ideal temperature rise by $\eta$: real compressors run hotter'
  verify:

    label: v
    tex: \eta
    value: 1 - (rp*c^1.4 - 1)/(r^0.4*((rp - 1) + 1.4*rp*(c - 1)))
    tol: 0.005
    explain: 'With $T_1 = 1$: $T_2 = r^{k-1}$, $T_x = r_pT_2$, $T_3 = r_cT_x$, $T_4 = r_pr_c^k$. Heat in is $c_v(T_x - T_2) + c_p(T_3 - T_x)$. It falls between Otto and Diesel'
  verify:
    expect:
      v: 1 - (nsimplify(rp)*nsimplify(c)**Rational(7, 5) - 1)/((r**Rational(2, 5)*nsimplify(rp) - r**Rational(2, 5)) + Rational(7, 5)*(r**Rational(2, 5)*nsimplify(rp)*nsimplify(c) - r**Rational(2, 5)*nsimplify(rp)))

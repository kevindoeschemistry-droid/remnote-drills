- template: td-second-law-statements
  skill: thermo.first-law
  pace: recall
  cases:
  - q: An engine takes 100 kJ from a hot reservoir and delivers 100 kJ of work, rejecting nothing. Possible?
    ans: 1
  - q: A refrigerator moves 50 kJ from a cold space to a warm room with no work input. Possible?
    ans: 1
  - q: An engine takes 100 kJ from a 600 K reservoir, rejects 60 kJ to a 300 K one and delivers 40 kJ. Possible?
    ans: 0
  - q: A heat pump delivers 50 kJ to a house while taking 40 kJ from outside and 10 kJ of work. Possible?
    ans: 0
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - No, it violates the second law
    correct: ans
    explain: 'Kelvin–Planck forbids a cycle that rejects no heat; Clausius forbids heat climbing a temperature without work. An engine is also capped by Carnot: here $1 - 300/600 = 0.5 \ge 0.4$, so the third case is fine'
  verify:
    authored: true
- template: td-second-law-claims
  skill: thermo.first-law
  pace: recall
  cases:
  - q: A device takes heat from one reservoir and produces an equal amount of work, with no other effect. Which statement does it violate?
    o1: Kelvin–Planck
    o2: Clausius
    o3: The first law
    o4: None
  - q: A refrigerator moves heat from cold to hot with no work input. Which statement does it violate?
    o1: Clausius
    o2: Kelvin–Planck
    o3: The first law
    o4: None
  - q: An engine between 600 K and 300 K claims 40% efficiency. What does it violate?
    o1: 'Nothing: Carnot allows 50%'
    o2: Kelvin–Planck
    o3: Clausius
    o4: The first law
  - q: An engine between 600 K and 300 K claims 60% efficiency. What does it violate?
    o1: The second law (Carnot limit 50%)
    o2: The first law
    o3: Nothing
    o4: The zeroth law
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Either statement implies the other; checking a claimed efficiency against 1 − T_C/T_H is the practical test
  verify:
    authored: true

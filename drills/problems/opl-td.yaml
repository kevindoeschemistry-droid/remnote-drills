    label: v
    tex: q_{in}
    value: 0.718*(T3 - T2) + 1.005*(T4 - T3)
    tol: 0.005
    explain: The dual cycle splits heat addition between an Otto-like and a Diesel-like step
  verify:
    expect:
      v: integrate(Rational(718, 1000), (Symbol('TT'), T2, T3)) + integrate(Rational(1005, 1000), (Symbol('TT'), T3, T4))
- template: td-stirling-regenerated
  skill: thermo.first-law
  pace: quick
  given:
    TH:
      pick:
      - 600
      - 800
      - 1000
    TL:
      pick:
      - 300
      - 350
  prompt: An ideal Stirling engine with a perfect regenerator runs between {{TH}} K and {{TL}} K. Find its efficiency.
  parts:
  - ask: Answer
    label: v
    tex: \eta
    value: 1 - TL/TH
    tol: 0.005
    explain: Heat enters and leaves isothermally; the regenerator recycles the constant-volume heats internally. Work $= R(T_H - T_L)\ln(V_2/V_1)$ over $RT_H\ln(V_2/V_1)$
  verify:
    expect:
      v: (Symbol('R')*TH*log(2) - Symbol('R')*TL*log(2))/(Symbol('R')*TH*log(2))
- template: td-stirling-without-regen
  skill: thermo.first-law
  pace: quick
  given:
    Th:
      pick:
      - 800
      - 1000
    Tc:
      pick:
      - 300
    r:
      pick:
      - 2
      - 4
  prompt: A Stirling cycle on air (c_v = 0.718, R = 0.287 kJ/kg·K) runs between {{Th}} and {{Tc}} K with volume ratio {{r}}. Without a regenerator, what is its efficiency?
  parts:
  - ask: Answer
    label: v
    tex: \eta
    value: 0.287*(Th - Tc)*log(r)/(0.287*Th*log(r) + 0.718*(Th - Tc))
    tol: 0.005
    explain: Without regeneration the constant-volume heating must come from the source, so efficiency falls well below Carnot
  verify:
    expect:
      v: (Rational(287, 1000)*Th*log(r) - Rational(287, 1000)*Tc*log(r))/(Rational(287, 1000)*Th*log(r) + Rational(718, 1000)*(Th - Tc))
- template: td-brayton
  skill: thermo.first-law
  pace: quick
  given:
    rp:
      pick:
      - 6
      - 8
      - 10
      - 12
      - 16
  prompt: An ideal Brayton cycle ($k = 1.4$) has pressure ratio {{rp}}. Find its thermal efficiency.
  parts:
  - ask: Answer
    label: v
    tex: \eta
    value: 1 - rp^(-0.4/1.4)
    tol: 0.005
    explain: Heat in and out at constant pressure; the isentropic legs make $T_2/T_1 = T_3/T_4 = r_p^{(k-1)/k}$. Gas turbines live here
  verify:
    expect:
      v: 1 - (Symbol('T')*rp**Rational(2, 7) - Symbol('T'))/(Symbol('T')*rp**Rational(4, 7) - Symbol('T')*rp**Rational(2, 7))
- template: td-brayton-ratio-needed
  skill: thermo.first-law
  pace: quick
  given:
    eta:
      pick:
      - 0.4
      - 0.5
      - 0.6
  prompt: What pressure ratio gives an ideal Brayton cycle (k = 1.4) an efficiency of {{eta}}?
  parts:
  - ask: Answer
    label: v
    tex: r_p
    value: (1 - eta)^(-1.4/0.4)
    tol: 0.005
    explain: η = 1 − r_p^{−(k−1)/k}, inverted
  verify:
    expect:
      v: (1/(1 - nsimplify(eta)))**Rational(7, 2)
- template: td-brayton-regen
  skill: thermo.first-law
  pace: quick
  given:
    rp:
      pick:
      - 4
      - 6
      - 8
    T3:
      pick:
      - 1000
      - 1200
      - 1400
  prompt: An ideal Brayton cycle ($k = 1.4$) with a perfect regenerator has $r_p = {{rp}}$, $T_1 = 300$ K and $T_3 = {{T3}}$ K. Find its efficiency.
  parts:
  - ask: Answer
    label: v
    tex: \eta
    value: 1 - 300/T3*rp^(0.4/1.4)
    tol: 0.005
    explain: The regenerator preheats compressed air with turbine exhaust, so heat in is $c_p(T_3 - T_4)$ and heat out $c_p(T_2 - T_1)$. Regeneration helps most at low pressure ratios
  verify:
    expect:
      v: 1 - (300*rp**Rational(2, 7) - 300)/(T3 - T3/rp**Rational(2, 7))
- template: td-regen-crossover
  skill: thermo.first-law
  pace: quick
  given:
    Tmin:
      pick:
      - 300
    Tmax:
      pick:
      - 1000
      - 1200
      - 1500
  prompt: A Brayton cycle runs from {{Tmin}} K to {{Tmax}} K (k = 1.4). Above what pressure ratio does ideal regeneration stop helping (compressor exit hotter than turbine exit)?
  parts:
  - ask: Answer
    label: v
    tex: r_p
    value: (Tmax/Tmin)^(1.4/0.8)
    tol: 0.005
    explain: 'Regeneration needs T₄ > T₂: with T₂ = T_min r^{(k−1)/k} and T₄ = T_max r^{−(k−1)/k}, they cross at r = (T_max/T_min)^{k/2(k−1)}'
  verify:
    expect:
      v: Max(*solve(Eq(Tmin*Symbol('rr'), Tmax/Symbol('rr')), Symbol('rr')))**Rational(7, 2)
- template: td-intercooling
  skill: thermo.first-law
  pace: quick
  given:
    P1:
      pick:
      - 100
      - 200
    P2:
      pick:
      - 900
      - 1600
      - 2500
  prompt: Air is compressed in two stages from {{P1}} kPa to {{P2}} kPa with perfect intercooling. What intermediate pressure minimises the work, in kPa?
  parts:
  - ask: Answer
    label: v
    tex: P_x
    value: sqrt(P1*P2)
    tol: 0.005
    explain: Equal pressure ratios across both stages split the work equally and minimise it
  verify:
    expect:
      v: Max(*solve(diff((x/P1)**Rational(2, 7) + (P2/x)**Rational(2, 7), x), x))
- template: td-intercool-work-saving
  skill: thermo.first-law
  pace: quick
  given:
    T:
      pick:
      - 300
    r:
      pick:
      - 9
      - 16
      - 25
  prompt: Air at {{T}} K is compressed by a total ratio {{r}} (c_p = 1.005, k = 1.4). Two stages with perfect intercooling to {{T}} K at the optimum pressure save how much work per kg, in kJ, over one stage?
  parts:
  - ask: Answer
    label: v
    tex: \Delta w
    value: 1.005*T*((r^(2/7) - 1) - 2*(r^(1/7) - 1))
    tol: 0.005
    explain: Equal stage ratios √r minimise the work; intercooling moves the process toward the isothermal limit
  verify:
    expect:
      v: Rational(1005, 1000)*T*((Rational(r, 1)**Rational(2, 7) - 1) - 2*(sqrt(Rational(r, 1))**Rational(2, 7) - 1))
- template: td-combined-cycle
  skill: thermo.first-law
  pace: quick
  given:
    a:
      pick:
      - 0.3
      - 0.35
      - 0.4
    b:
      pick:
      - 0.3
      - 0.35
      - 0.4
  prompt: A gas turbine with efficiency {{a}} rejects all its heat to a steam cycle of efficiency {{b}}. What is the combined efficiency?
  parts:
  - ask: Answer
    label: v
    tex: \eta
    value: a + b - a*b
    tol: 0.005
    explain: Per unit of heat in, the gas turbine makes $\eta_g$ and passes on $1 - \eta_g$, of which the steam cycle converts $\eta_s$
  verify:
    expect:
      v: (nsimplify(a) + nsimplify(b)*(1 - nsimplify(a)))
- template: td-combined-cycle-bottom
  skill: thermo.first-law
  pace: quick
  given:
    eg:
      pick:
      - 0.35
      - 0.4
    ec:
      pick:
      - 0.55
      - 0.6
  prompt: A gas turbine has efficiency {{eg}}; its exhaust drives a steam cycle. What steam-cycle efficiency is needed for a combined efficiency of {{ec}}?
  parts:
  - ask: Answer
    label: v
    tex: \eta_s
    value: (ec - eg)/(1 - eg)
    tol: 0.005
    explain: 'η = η_g + (1 − η_g)η_s: the bottoming cycle runs on what the topping cycle rejects'
  verify:
    expect:
      v: solve(Eq(nsimplify(eg) + (1 - nsimplify(eg))*x, nsimplify(ec)), x)[0]

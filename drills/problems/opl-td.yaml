      - 0.9
  prompt: Air at {{T}} °C has relative humidity {{phi}}. Using the Magnus approximation $P_{sat}(T) = 0.6112\,e^{17.62T/(243.12 + T)}$ kPa, find the dew point, in °C.
  parts:
  - ask: Answer
    label: v
    tex: T_{dp}
    value: 243.12*(log(phi) + 17.62*T/(243.12 + T))/(17.62 - (log(phi) + 17.62*T/(243.12 + T)))
    tol: 0.005
    explain: $P_v = \phi P_{sat}(T)$; cool at constant $P_v$ until $P_{sat}(T_{dp}) = P_v$. Surfaces colder than this collect condensate
  verify:
    expect:
      v: solve(Eq(Rational(1762, 100)*x/(Rational(24312, 100) + x), log(nsimplify(phi)) + Rational(1762, 100)*T/(Rational(24312, 100) + T)), x)[0]

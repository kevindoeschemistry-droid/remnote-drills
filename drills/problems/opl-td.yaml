- template: td-pump-enthalpy
  skill: thermo.first-law
  pace: quick
  given:
    P1:
      pick:
      - 10
      - 50
      - 100
    P2:
      pick:
      - 2000
      - 5000
      - 10000
  prompt: Liquid water ($v = 0.001$ m³/kg) is pumped from {{P1}} kPa to {{P2}} kPa with no temperature change. What is $\Delta h$, in kJ/kg?
  parts:
  - ask: Answer
    label: v
    tex: \Delta h
    value: 0.001*(P2 - P1)
    tol: 0.005
    explain: For an incompressible liquid $\Delta u = c\Delta T = 0$ here and $\Delta h = v\Delta P$. That small number is why pump work is tiny next to turbine work
  verify:
    expect:
      v: integrate(Rational(1, 1000), (x, P1, P2))

- template: td-exergy-destroyed
  skill: thermo.first-law
  pace: quick
  given:
    Q:
      pick:
      - 100
      - 200
      - 500
    TH:
      pick:
      - 500
      - 800
      - 1000
    TL:
      pick:
      - 290
      - 300
  prompt: '{{Q}} kJ of heat leaks from a {{TH}} K reservoir straight to a {{TL}} K reservoir. With $T_0 = {{TL}}$ K, how much exergy is destroyed, in kJ?'
  parts:
  - ask: Answer
    label: v
    tex: X_d
    value: TL*Q*(1/TL - 1/TH)
    tol: 0.005
    explain: 'Gouy–Stodola: $X_d = T_0S_{gen}$ with $S_{gen} = Q/T_L - Q/T_H$. It equals the exergy the heat carried in minus what it carries out'
  verify:
    expect:
      v: Q*(1 - nsimplify(TL)/TH) - Q*(1 - nsimplify(TL)/TL)

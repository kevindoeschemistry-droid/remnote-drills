- template: td-wilson
  skill: thermo.solutions
  pace: quick
  given:
    L12:
      pick:
      - 0.3
      - 0.6
      - 1.2
    L21:
      pick:
      - 0.4
      - 0.8
      - 1.5
    x1:
      pick:
      - 0.2
      - 0.5
      - 0.8
  prompt: With Wilson parameters $\Lambda_{12} = {{L12}}$, $\Lambda_{21} = {{L21}}$, find $\ln\gamma_1$ at $x_1 = {{x1}}$.
  parts:
  - ask: Answer
    label: v
    tex: \ln\gamma_1
    value: -log(x1 + L12*(1 - x1)) + (1 - x1)*(L12/(x1 + L12*(1 - x1)) - L21/((1 - x1) + L21*x1))
    tol: 0.005
    explain: Wilson's local-composition model differentiates $nG^E/RT = -n_1\ln(x_1 + \Lambda_{12}x_2) - n_2\ln(x_2 + \Lambda_{21}x_1)$. It cannot show liquid–liquid splitting
  verify:
    expect:
      v: 'diff(-Symbol(''n1'')*log(Symbol(''n1'')/(Symbol(''n1'') + Symbol(''n2'')) + nsimplify(L12)*Symbol(''n2'')/(Symbol(''n1'') + Symbol(''n2''))) - Symbol(''n2'')*log(Symbol(''n2'')/(Symbol(''n1'') + Symbol(''n2'')) + nsimplify(L21)*Symbol(''n1'')/(Symbol(''n1'') + Symbol(''n2''))), Symbol(''n1'')).subs({Symbol(''n1''): nsimplify(x1), Symbol(''n2''): 1 - nsimplify(x1)})'
- template: td-nrtl-infinite
  skill: thermo.solutions
  pace: quick
  given:
    t12:
      pick:
      - 0.5
      - 1
      - 1.5
    t21:
      pick:
      - 0.3
      - 0.8
      - 2
    al:
      pick:
      - 0.2
      - 0.3
      - 0.47
  prompt: NRTL parameters are $\tau_{12} = {{t12}}$, $\tau_{21} = {{t21}}$, $\alpha = {{al}}$. Find $\ln\gamma_1^\infty$.
  parts:
  - ask: Answer
    label: v
    tex: \ln\gamma_1^\infty
    value: t21 + t12*exp(-al*t12)
    tol: 0.005
    explain: Take NRTL's $G^E/RT = x_1x_2[\tau_{21}G_{21}/(x_1 + x_2G_{21}) + \tau_{12}G_{12}/(x_2 + x_1G_{12})]$, $G_{ij} = e^{-\alpha\tau_{ij}}$, differentiate and let $x_1 \to 0$
  verify:
    expect:
      v: limit(diff((Symbol('n1') + Symbol('n2'))*(Symbol('n1')/(Symbol('n1') + Symbol('n2')))*(Symbol('n2')/(Symbol('n1') + Symbol('n2')))*(nsimplify(t21)*exp(-nsimplify(al)*nsimplify(t21))/(Symbol('n1')/(Symbol('n1') + Symbol('n2')) + Symbol('n2')/(Symbol('n1') + Symbol('n2'))*exp(-nsimplify(al)*nsimplify(t21))) + nsimplify(t12)*exp(-nsimplify(al)*nsimplify(t12))/(Symbol('n2')/(Symbol('n1') + Symbol('n2')) + Symbol('n1')/(Symbol('n1') + Symbol('n2'))*exp(-nsimplify(al)*nsimplify(t12)))), Symbol('n1')).subs(Symbol('n2'), 1), Symbol('n1'), 0)
- template: td-activity-models
  skill: thermo.solutions
  pace: recall
  cases:
  - q: Which model predicts activity coefficients with no binary data for the pair, from functional groups alone?
    ans: 0
  - q: Which model splits ln γ into a combinatorial part from molecular size and shape (r, q) and a residual part from binary interaction energies?
    ans: 1
  - q: Which model predicts infinite-dilution activity coefficients from dispersion, polarity, induction and hydrogen-bond acidity and basicity parameters?
    ans: 2
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - UNIFAC
    - UNIQUAC
    - MOSCED
    correct: ans
    explain: UNIFAC is UNIQUAC built from groups instead of molecules, so it predicts unmeasured pairs. MOSCED extends regular-solution theory with polar and hydrogen-bonding terms
  verify:
    authored: true

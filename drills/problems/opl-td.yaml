- template: td-polytropic-work
  skill: thermo.first-law
  pace: quick
  given:
    n:
      pick:
      - 1.2
      - 1.3
      - 1.4
    P1:
      pick:
      - 400
      - 800
      - 1000
    V1:
      pick:
      - 0.1
      - 0.2
    V2:
      pick:
      - 0.4
      - 0.5
      - 0.8
  prompt: A gas expands polytropically ($n = {{n}}$) from {{P1}} kPa and {{V1}} m³ to {{V2}} m³. What boundary work does it do, in kJ?
  parts:
  - ask: Answer
    label: v
    tex: W
    value: (P1*(V1/V2)^n*V2 - P1*V1)/(1 - n)
    tol: 0.005
    explain: $P_2 = P_1(V_1/V_2)^n$; integrating $P\,dV$ gives $(P_2V_2 - P_1V_1)/(1 - n)$. $n = 1$ is isothermal for an ideal gas, $n = k$ is isentropic
  verify:
    expect:
      v: integrate(P1*nsimplify(V1)**nsimplify(n)/x**nsimplify(n), (x, nsimplify(V1), nsimplify(V2)))

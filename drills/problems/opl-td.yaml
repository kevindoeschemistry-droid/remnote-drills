- template: td-diesel
  skill: thermo.first-law
  pace: quick
  given:
    r:
      pick:
      - 16
      - 18
      - 20
    c:
      pick:
      - 1.5
      - 2
      - 2.5
  prompt: An air-standard Diesel cycle ($k = 1.4$) has compression ratio {{r}} and cutoff ratio {{c}}. Find its efficiency.
  parts:
  - ask: Answer
    label: v
    tex: \eta
    value: 1 - r^(-0.4)*(c^1.4 - 1)/(1.4*(c - 1))
    tol: 0.005
    explain: 'Track temperatures with $T_1 = 1$: $T_2 = r^{k-1}$, $T_3 = r_cT_2$, $T_4 = r_c^k$. Heat in at constant pressure is $c_p(T_3 - T_2)$, heat out $c_v(T_4 - T_1)$'
  verify:
    expect:
      v: 1 - (nsimplify(c)**Rational(7, 5) - 1)/(Rational(7, 5)*(r**Rational(2, 5)*nsimplify(c) - r**Rational(2, 5)))
- template: td-dual

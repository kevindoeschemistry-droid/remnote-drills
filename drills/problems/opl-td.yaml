  cases: *id001
  prompt: '{{m}} kg of saturated liquid water is fully vaporised at {{P}} kPa ($T_{sat} = {{Ts}}$ °C, $h_{fg} = {{hfg}}$ kJ/kg). What is the entropy change, in kJ/K?'

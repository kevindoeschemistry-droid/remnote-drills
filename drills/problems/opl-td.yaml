- template: td-van-laar
  skill: thermo.solutions
  pace: quick
  given:
    a:
      pick:
      - 0.5
      - 1
      - 1.5
    b:
      pick:
      - 0.8
      - 1.2
      - 2
    x1:
      pick:
      - 0.2
      - 0.5
      - 0.8
  prompt: With van Laar parameters $A_{12} = {{a}}$, $A_{21} = {{b}}$, find $\ln\gamma_1$ at $x_1 = {{x1}}$.
  parts:
  - ask: Answer
    label: v
    tex: \ln\gamma_1
    value: a*(b*(1 - x1)/(a*x1 + b*(1 - x1)))^2
    tol: 0.005
    explain: $\ln\gamma_1$ is the partial molar derivative of $nG^E/RT = n A_{12}A_{21}x_1x_2/(A_{12}x_1 + A_{21}x_2)$; at infinite dilution it tends to $A_{12}$
  verify:
    expect:
      v: 'diff((Symbol(''n1'') + Symbol(''n2''))*nsimplify(a)*nsimplify(b)*(Symbol(''n1'')/(Symbol(''n1'') + Symbol(''n2'')))*(Symbol(''n2'')/(Symbol(''n1'') + Symbol(''n2'')))/(nsimplify(a)*Symbol(''n1'')/(Symbol(''n1'') + Symbol(''n2'')) + nsimplify(b)*Symbol(''n2'')/(Symbol(''n1'') + Symbol(''n2''))), Symbol(''n1'')).subs({Symbol(''n1''): nsimplify(x1), Symbol(''n2''): 1 - nsimplify(x1)})'

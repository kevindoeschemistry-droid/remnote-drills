- template: td-spring-work
  skill: thermo.first-law
  pace: quick
  given:
    k:
      pick:
      - 50
      - 100
      - 200
    x1:
      pick:
      - 0
      - 2
      - 5
    x2:
      pick:
      - 8
      - 10
      - 15
  prompt: A spring with $k = {{k}}$ kN/m is compressed from {{x1}} cm to {{x2}} cm. How much work goes in, in J?
  parts:
  - ask: Answer
    label: v
    tex: W
    value: 0.5*k*1000*((x2/100)^2 - (x1/100)^2)
    tol: 0.005
    explain: 'The force grows linearly with stretch, so the work is the area of a trapezoid under $F = kx$: $\tfrac12k(x_2^2 - x_1^2)$'
  verify:
    expect:
      v: integrate(k*1000*x, (x, nsimplify(x1)/100, nsimplify(x2)/100))

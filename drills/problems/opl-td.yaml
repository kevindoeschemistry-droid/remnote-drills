  prompt: '{{m}} kg of iron ($c = 0.45$ kJ/kg·K) cools from {{T1}} °C to {{T2}} °C. What is its entropy change, in kJ/K?'
  parts:
  - ask: Answer
    label: v
    tex: \Delta S
    value: m*0.45*log((T2 + 273.15)/(T1 + 273.15))
    tol: 0.005
    explain: $dS = mc\,dT/T$ for an incompressible solid; use kelvin. It is negative, but the surroundings gain more
  verify:

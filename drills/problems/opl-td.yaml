  prompt: A refrigerant leaves the evaporator at $h_1 = {{h1}}$ kJ/kg and the compressor at $h_2 = {{h2}}$ kJ/kg; it enters the evaporator at $h_4 = {{h4}}$ kJ/kg. Find the COP.
  parts:
  - ask: Answer
    label: v
    tex: COP_R

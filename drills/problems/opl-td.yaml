  prompt: Air at {{T1}} °C passes through an adiabatic saturator and leaves saturated at {{T2}} °C with $\omega_2 = {{w2}}$. With $c_p = 1.005$, $h_{fg2} = {{hfg2}}$, $h_{g1} = {{hg1}}$, $h_{f2} = {{hf2}}$ kJ/kg, find $\omega_1$.

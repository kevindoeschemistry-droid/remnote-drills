- template: td-poynting-liquid
  skill: thermo.phase-equilibrium
  pace: quick
  given:
    V:
      pick:
      - 18
      - 50
      - 100
    Ps:
      pick:
      - 0.5
      - 1
      - 2
    T:
      pick:
      - 300
      - 350
      - 400
    P:
      pick:
      - 50
      - 100
      - 300
  prompt: A liquid ($V_L = {{V}}$ cm³/mol) has $P_{sat} = {{Ps}}$ bar at {{T}} K, and $\phi_{sat} \approx 1$. What is its fugacity at {{P}} bar, in bar?
  parts:
  - ask: Answer
    label: v
    tex: f
    value: Ps*exp(V*(P - Ps)/(83.14*T))
    tol: 0.005
    explain: From saturation, integrate $(\partial\ln f/\partial P)_T = V/RT$ through the liquid. The correction is small unless the pressure is very high
  verify:
    expect:
      v: nsimplify(Ps)*exp(integrate(V/(Rational(8314, 100)*T), (x, nsimplify(Ps), P)))

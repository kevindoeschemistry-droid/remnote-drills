  pace: quick
  given:
    rc:
      pick:
      - 6
      - 8
      - 9
      - 10
      - 12
  prompt: An air-standard Otto cycle ($k = 1.4$) has compression ratio {{rc}}. Find its thermal efficiency.
  parts:
  - ask: Answer
    label: v
    tex: \eta
    value: 1 - rc^(-0.4)
    tol: 0.005
    explain: Both heat transfers are at constant volume, and the isentropic legs give $T_2/T_1 = r^{k-1}$; everything cancels but the compression ratio
  verify:

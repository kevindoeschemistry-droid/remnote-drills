  prompt: A Rankine cycle ({{Pb}} MPa, {{Tb}} °C, condenser {{Pc}} kPa) has $h_1 = {{h1}}$ (turbine inlet), $h_2 = {{h2}}$, $h_3 = {{h3}}$ (pump inlet), $h_4 = {{h4}}$ kJ/kg. Find its thermal efficiency.
  parts:
  - ask: Answer
    label: v
    tex: \eta
    value: ((h1 - h2) - (h4 - h3))/(h1 - h4)
    tol: 0.005
    explain: Net work over heat in, which is also $1 - q_{out}/q_{in}$. Superheating and reheating raise $h_1$ and keep the turbine exhaust dry; higher boiler pressure raises the mean temperature of heat addition
  verify:
    expect:
      v: 1 - (nsimplify(h2) - nsimplify(h3))/(nsimplify(h1) - nsimplify(h4))

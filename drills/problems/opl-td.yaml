- template: td-ts-diagram
  skill: thermo.first-law
  pace: recall
  cases:
  - q: what does the area under a reversible process curve represent?
    ans: 0
  - q: what does a reversible adiabatic process look like?
    ans: 1
  - q: what does an isothermal process look like?
    ans: 2
  - q: what does the area enclosed by a reversible cycle represent?
    ans: 3
  prompt: On a T–s diagram, {{q}}
  parts:
  - ask: Answer
    label: v
    choice:
    - The heat transferred per unit mass
    - A vertical line
    - A horizontal line
    - The net work of the cycle
    correct: ans
    explain: $\delta q_{rev} = T\,ds$, so area means heat; no heat and no irreversibility means constant $s$
  verify:
    authored: true

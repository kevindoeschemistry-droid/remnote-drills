  verify:
    expect:
      v: solve(Eq(nsimplify(B)/10**6*x*10**5/(Rational(8314, 1000)*T), log(nsimplify(phi))), x)[0]
- template: td-van-laar
  skill: thermo.solutions
  pace: quick
  given:
    a:
      pick:
      - 0.5
      - 1
      - 1.5
    b:
      pick:
      - 0.8
      - 1.2
      - 2
    x1:
      pick:
      - 0.2
      - 0.5
      - 0.8
  prompt: With van Laar parameters $A_{12} = {{a}}$, $A_{21} = {{b}}$, find $\ln\gamma_1$ at $x_1 = {{x1}}$.
  parts:
  - ask: Answer
    label: v
    tex: \ln\gamma_1
    value: a*(b*(1 - x1)/(a*x1 + b*(1 - x1)))^2
    tol: 0.005
    explain: $\ln\gamma_1$ is the partial molar derivative of $nG^E/RT = n A_{12}A_{21}x_1x_2/(A_{12}x_1 + A_{21}x_2)$; at infinite dilution it tends to $A_{12}$
  verify:
    expect:
      v: 'diff((Symbol(''n1'') + Symbol(''n2''))*nsimplify(a)*nsimplify(b)*(Symbol(''n1'')/(Symbol(''n1'') + Symbol(''n2'')))*(Symbol(''n2'')/(Symbol(''n1'') + Symbol(''n2'')))/(nsimplify(a)*Symbol(''n1'')/(Symbol(''n1'') + Symbol(''n2'')) + nsimplify(b)*Symbol(''n2'')/(Symbol(''n1'') + Symbol(''n2''))), Symbol(''n1'')).subs({Symbol(''n1''): nsimplify(x1), Symbol(''n2''): 1 - nsimplify(x1)})'
- template: td-van-laar-infinite
  skill: thermo.solutions
  pace: quick
  given:
    a:
      pick:
      - 0.5
      - 1
      - 1.5
    b:
      pick:
      - 0.8
      - 2
  prompt: A van Laar model has A₁₂ = {{a}} and A₂₁ = {{b}}. What is γ₂ at infinite dilution in component 1?
  parts:
  - ask: Answer
    label: v
    tex: \gamma_2^\infty
    value: exp(b)
    tol: 0.005
    explain: ln γ₂ = A₂₁[A₁₂x₁/(A₁₂x₁ + A₂₁x₂)]² → A₂₁ as x₂ → 0
  verify:
    expect:
      v: limit(exp(nsimplify(b)*(nsimplify(a)*(1 - Symbol('q'))/(nsimplify(a)*(1 - Symbol('q')) + nsimplify(b)*Symbol('q')))**2), Symbol('q'), 0)
- template: td-scatchard-hildebrand
  skill: thermo.solutions
  pace: quick
  given:
    V:
      pick:
      - 90
      - 120
      - 150
    d1:
      pick:
      - 18
      - 20
      - 24
    d2:
      pick:
      - 14
      - 16
      - 29
    F:
      pick:
      - 0.5
      - 0.8
      - 0.95
    T:
      pick:
      - 298
      - 320
  prompt: A solute ($V_1 = {{V}}$ cm³/mol, $\delta_1 = {{d1}}$ (J/cm³)$^{1/2}$) in a solvent with $\delta_2 = {{d2}}$ has solvent volume fraction $\Phi_2 = {{F}}$ at {{T}} K. Find $\ln\gamma_1$.
  parts:
  - ask: Answer
    label: v
    tex: \ln\gamma_1
    value: V*F^2*(d1 - d2)^2/(8.314*T)
    tol: 0.005
    explain: 'Like dissolves like: the closer the solubility parameters, the nearer γ is to 1. The theory only predicts positive deviations'
  verify:
    expect:
      v: V*nsimplify(F)**2*(d1 - d2)**2/(Rational(8314, 1000)*T)
- template: td-hildebrand-match
  skill: thermo.solutions
  pace: quick
  given:
    d:
      pick:
      - 18
      - 20
    g:
      pick:
      - 0.1
      - 0.5
      - 1
  prompt: A solute has solubility parameter {{d}} (J/cm³)^½. Among solvents differing by Δδ, what Δδ keeps ln γ below {{g}} for v = 100 cm³/mol at 298 K (dilute, φ₂ ≈ 1)?
  parts:
  - ask: Answer
    label: v
    tex: \Delta\delta
    value: sqrt(g*8.314*298/100)
    tol: 0.005
    explain: 'ln γ = v(δ₁ − δ₂)²φ²/RT: like dissolves like, measured in δ'
  verify:
    expect:
      v: Max(*solve(Eq(100*x**2/(Rational(8314, 1000)*298), nsimplify(g)), x))
- template: td-wilson
  skill: thermo.solutions
  pace: quick
  given:
    L12:
      pick:
      - 0.3
      - 0.6
      - 1.2
    L21:
      pick:
      - 0.4
      - 0.8
      - 1.5
    x1:
      pick:
      - 0.2
      - 0.5
      - 0.8
  prompt: With Wilson parameters $\Lambda_{12} = {{L12}}$, $\Lambda_{21} = {{L21}}$, find $\ln\gamma_1$ at $x_1 = {{x1}}$.
  parts:
  - ask: Answer
    label: v
    tex: \ln\gamma_1
    value: -log(x1 + L12*(1 - x1)) + (1 - x1)*(L12/(x1 + L12*(1 - x1)) - L21/((1 - x1) + L21*x1))
    tol: 0.005
    explain: Wilson's local-composition model differentiates $nG^E/RT = -n_1\ln(x_1 + \Lambda_{12}x_2) - n_2\ln(x_2 + \Lambda_{21}x_1)$. It cannot show liquid–liquid splitting
  verify:
    expect:
      v: 'diff(-Symbol(''n1'')*log(Symbol(''n1'')/(Symbol(''n1'') + Symbol(''n2'')) + nsimplify(L12)*Symbol(''n2'')/(Symbol(''n1'') + Symbol(''n2''))) - Symbol(''n2'')*log(Symbol(''n2'')/(Symbol(''n1'') + Symbol(''n2'')) + nsimplify(L21)*Symbol(''n1'')/(Symbol(''n1'') + Symbol(''n2''))), Symbol(''n1'')).subs({Symbol(''n1''): nsimplify(x1), Symbol(''n2''): 1 - nsimplify(x1)})'
- template: td-wilson-symmetric
  skill: thermo.solutions
  pace: quick
  given:
    L:
      pick:
      - 0.3
      - 0.5
      - 0.8
  prompt: For Wilson's equation with Λ₁₂ = Λ₂₁ = {{L}}, what is ln γ₁ at infinite dilution (x₁ → 0)?
  parts:
  - ask: Answer
    label: v
    tex: \ln\gamma_1^\infty
    value: -log(L) + 1 - L
    tol: 0.005
    explain: ln γ₁^∞ = −ln Λ₁₂ + 1 − Λ₂₁; Wilson cannot produce liquid–liquid splitting
  verify:
    expect:
      v: limit(-log(Symbol('q') + nsimplify(L)*(1 - Symbol('q'))) + (1 - Symbol('q'))*(nsimplify(L)/(Symbol('q') + nsimplify(L)*(1 - Symbol('q'))) - nsimplify(L)/(1 - Symbol('q') + nsimplify(L)*Symbol('q'))), Symbol('q'), 0)
- template: td-nrtl-infinite
  skill: thermo.solutions
  pace: quick
  given:
    t12:
      pick:
      - 0.5
      - 1
      - 1.5
    t21:
      pick:
      - 0.3
      - 0.8
      - 2
    al:
      pick:
      - 0.2
      - 0.3
      - 0.47
  prompt: NRTL parameters are $\tau_{12} = {{t12}}$, $\tau_{21} = {{t21}}$, $\alpha = {{al}}$. Find $\ln\gamma_1^\infty$.
  parts:
  - ask: Answer
    label: v
    tex: \ln\gamma_1^\infty
    value: t21 + t12*exp(-al*t12)
    tol: 0.005
    explain: Take NRTL's $G^E/RT = x_1x_2[\tau_{21}G_{21}/(x_1 + x_2G_{21}) + \tau_{12}G_{12}/(x_2 + x_1G_{12})]$, $G_{ij} = e^{-\alpha\tau_{ij}}$, differentiate and let $x_1 \to 0$
  verify:
    expect:
      v: limit(diff((Symbol('n1') + Symbol('n2'))*(Symbol('n1')/(Symbol('n1') + Symbol('n2')))*(Symbol('n2')/(Symbol('n1') + Symbol('n2')))*(nsimplify(t21)*exp(-nsimplify(al)*nsimplify(t21))/(Symbol('n1')/(Symbol('n1') + Symbol('n2')) + Symbol('n2')/(Symbol('n1') + Symbol('n2'))*exp(-nsimplify(al)*nsimplify(t21))) + nsimplify(t12)*exp(-nsimplify(al)*nsimplify(t12))/(Symbol('n2')/(Symbol('n1') + Symbol('n2')) + Symbol('n1')/(Symbol('n1') + Symbol('n2'))*exp(-nsimplify(al)*nsimplify(t12)))), Symbol('n1')).subs(Symbol('n2'), 1), Symbol('n1'), 0)
- template: td-nrtl-gamma2-inf
  skill: thermo.solutions
  pace: quick
  given:
    t12:
      pick:
      - 0.5
      - 1
      - 1.5
    t21:
      pick:
      - 0.2
      - 0.8
  prompt: For NRTL with τ₁₂ = {{t12}}, τ₂₁ = {{t21}} and α = 0.3, what is ln γ₂ at infinite dilution?
  parts:
  - ask: Answer
    label: v
    tex: \ln\gamma_2^\infty
    value: t12 + t21*exp(-0.3*t21)
    tol: 0.005
    explain: By symmetry with γ₁^∞ = τ₂₁ + τ₁₂ exp(−ατ₁₂), swapping the indices
  verify:
    expect:
      v: nsimplify(t12) + nsimplify(t21)*exp(-Rational(3, 10)*nsimplify(t21))
- template: td-activity-models
  skill: thermo.solutions
  pace: recall
  cases:
  - q: Which model predicts activity coefficients with no binary data for the pair, from functional groups alone?
    ans: 0
  - q: Which model splits ln γ into a combinatorial part from molecular size and shape (r, q) and a residual part from binary interaction energies?
    ans: 1
  - q: Which model predicts infinite-dilution activity coefficients from dispersion, polarity, induction and hydrogen-bond acidity and basicity parameters?
    ans: 2
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - UNIFAC
    - UNIQUAC
    - MOSCED
    correct: ans
    explain: UNIFAC is UNIQUAC built from groups instead of molecules, so it predicts unmeasured pairs. MOSCED extends regular-solution theory with polar and hydrogen-bonding terms
  verify:
    authored: true
- template: td-model-pick
  skill: thermo.solutions
  pace: recall
  cases:
  - q: Which activity model predicts γ from molecular structure groups, with no mixture data?
    o1: UNIFAC
    o2: Margules
    o3: Wilson
    o4: van Laar
  - q: Which model cannot describe liquid–liquid phase splitting?
    o1: Wilson
    o2: NRTL
    o3: UNIQUAC
    o4: Margules with large A
  - q: Which model needs only pure-component properties (molar volume and δ)?
    o1: Regular solution (Scatchard–Hildebrand)
    o2: NRTL
    o3: Wilson
    o4: UNIQUAC
  - q: Which model has a non-randomness parameter α?
    o1: NRTL
    o2: Wilson
    o3: van Laar
    o4: UNIFAC
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Choice of model follows from what data exist and whether the system splits into two liquids
  verify:
    authored: true

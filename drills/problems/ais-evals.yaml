- template: ais-mcq-chance
  skill: ais.evals
  pace: quick
  given:
    k:
      pick:
      - 4
      - 5
    s:
      pick:
      - 40
      - 60
      - 85
  prompt: An MCQ benchmark has {{k}} options per item and a model scores {{s}}%. What is its chance-corrected score (%)?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(s/100 - 1/k)/(1 - 1/k)
    tol: 0.005
    explain: '(score − chance)/(1 − chance): guessing alone scores 1/k'
  verify:
    expect:
      v: 100*(Rational(s, 100) - Rational(1, k))/(1 - Rational(1, k))
- template: ais-pass-at-k
  skill: ais.evals
  pace: quick
  cases:
  - n: 10
    c: 2
    k: 1
  - n: 10
    c: 2
    k: 5
  - n: 20
    c: 3
    k: 5
  - n: 20
    c: 1
    k: 10
  - n: 100
    c: 10
    k: 10
  prompt: n = {{n}} samples per problem, c = {{c}} correct. Compute the unbiased pass@{{k}}.
  parts:
  - ask: Answer
    label: v
    tex: pass@k
    value: 1 - combinations(n - c, k)/combinations(n, k)
    tol: 0.005
    explain: '1 − C(n − c, k)/C(n, k): the chance a random k-subset contains at least one correct sample'
  verify:
    expect:
      v: 1 - binomial(n - c, k)/binomial(n, k)
- template: ais-pass-at-k-naive
  skill: ais.evals
  pace: quick
  cases:
  - n: 10
    c: 2
    k: 5
  - n: 20
    c: 3
    k: 5
  - n: 10
    c: 1
    k: 5
  prompt: With n = {{n}}, c = {{c}}, by how much does the naive 1 − (1 − c/n)^k overstate (+) or understate (−) the unbiased pass@{{k}}? (Naive minus unbiased.)
  parts:
  - ask: Answer
    label: v
    tex: \Delta
    value: (1 - (1 - c/n)^k) - (1 - combinations(n - c, k)/combinations(n, k))
    tol: 0.005
    explain: Sampling without replacement from n differs from independent draws when n is small
  verify:
    expect:
      v: (1 - (1 - Rational(c, n))**k) - (1 - binomial(n - c, k)/binomial(n, k))
- template: ais-score-ci
  skill: ais.evals
  pace: quick
  cases:
  - c: 60
    n: 200
  - c: 120
    n: 400
  - c: 300
    n: 1000
  - c: 150
    n: 200
  - c: 720
    n: 1000
  prompt: A model solves {{c}} of {{n}} independent items. Give the half-width of the 95% normal-approximation CI, in percentage points.
  parts:
  - ask: Answer
    label: v
    tex: \pm
    value: 100*1.96*sqrt((c/n)*(1 - c/n)/n)
    tol: 0.005
    explain: SE = √(p(1 − p)/n); half-width 1.96·SE
  verify:
    expect:
      v: 100*Rational(196, 100)*sqrt(Rational(c, n)*(1 - Rational(c, n))/n)
- template: ais-two-model-z
  skill: ais.evals
  pace: quick
  given:
    a:
      pick:
      - 120
      - 140
    b:
      pick:
      - 150
      - 170
    n:
      pick:
      - 200
      - 300
  prompt: Model A solves {{a}}/{{n}} and model B {{b}}/{{n}} of the same-sized independent item sets. What is the z-score of the difference (unpooled SE)?
  parts:
  - ask: Answer
    label: v
    tex: z
    value: (b/n - a/n)/sqrt((a/n)*(1 - a/n)/n + (b/n)*(1 - b/n)/n)
    tol: 0.005
    explain: '|z| > 1.96 is significant at 5%; repeated samples of the same item need clustered SEs'
  verify:
    expect:
      v: (Rational(b, n) - Rational(a, n))/sqrt(Rational(a, n)*(1 - Rational(a, n))/n + Rational(b, n)*(1 - Rational(b, n))/n)
- template: ais-cohen-kappa
  skill: ais.evals
  pace: quick
  given:
    n:
      pick:
      - 100
    agr:
      pick:
      - 80
      - 85
      - 90
    pa:
      pick:
      - 50
      - 60
    pb:
      pick:
      - 55
      - 65
  prompt: Two graders label {{n}} outputs pass/fail. They agree on {{agr}}. Grader A says pass {{pa}} times, B {{pb}} times. Find Cohen's κ.
  parts:
  - ask: Answer
    label: v
    tex: \kappa
    value: (agr/n - ((pa/n)*(pb/n) + (1 - pa/n)*(1 - pb/n)))/(1 - ((pa/n)*(pb/n) + (1 - pa/n)*(1 - pb/n)))
    tol: 0.005
    explain: κ = (p_o − p_e)/(1 − p_e) with p_e from each grader's marginals
  verify:
    expect:
      v: (Rational(agr, n) - (Rational(pa*pb, n*n) + Rational((n - pa)*(n - pb), n*n)))/(1 - (Rational(pa*pb, n*n) + Rational((n - pa)*(n - pb), n*n)))

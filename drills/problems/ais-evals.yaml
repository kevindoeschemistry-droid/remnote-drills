- template: ais-eval-classify
  skill: ais.evals
  pace: quick
  cases:
  - q: 'A benchmark asks whether the model, under best elicitation, can complete a multi-step software task. This measures:'
    o1: Capability, with an agentic task
    o2: Propensity, with a static benchmark
    o3: Propensity, with a red-team
    o4: An uplift study
  - q: 'Researchers place the model in a realistic deployment and record how often it takes a harmful shortcut unprompted. This measures:'
    o1: Propensity
    o2: Capability
    o3: Contamination
    o4: Uplift
  - q: 'Experts try for a week to get the model to produce disallowed help. This is:'
    o1: A red-team exercise
    o2: A static benchmark
    o3: An uplift study
    o4: A propensity survey
  - q: 'Two groups of participants attempt a task with and without model access. This is:'
    o1: A human uplift study
    o2: A static benchmark
    o3: An agentic task
    o4: A red-team exercise
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Capability asks 'can it'; propensity asks 'will it'
  verify:
    authored: true

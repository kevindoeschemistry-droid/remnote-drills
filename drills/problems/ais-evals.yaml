- template: ais-wilson
  skill: ais.dangerous-caps
  pace: quick
  given:
    f:
      pick:
      - 0
      - 2
      - 5
    n:
      pick:
      - 100
      - 200
      - 500
  prompt: '{{f}} flagged out of {{n}} attempts. Compute the Wilson 95% upper bound (%), with z = 1.96.'
  parts:
  - ask: Answer
    label: v
    tex: UB
    value: 100*((f/n + 1.96^2/(2*n)) + 1.96*sqrt(f/n*(1 - f/n)/n + 1.96^2/(4*n^2)))/(1 + 1.96^2/n)
    tol: 0.005
    explain: Wilson intervals stay sensible near zero, unlike p ± 1.96·SE; zero findings does not mean a zero rate
  verify:
    expect:
      v: 100*((Rational(f, n) + Rational(196, 100)**2/(2*n)) + Rational(196, 100)*sqrt(Rational(f, n)*(1 - Rational(f, n))/n + Rational(196, 100)**2/(4*n**2)))/(1 + Rational(196, 100)**2/n)

- template: ais-layered-risk
  skill: ais.control
  pace: quick
  given:
    a:
      pick:
      - 0.1
      - 0.2
      - 0.3
    b:
      pick:
      - 0.2
      - 0.5
    c:
      pick:
      - 0.1
      - 0.4
  prompt: Three independent layers let an attack through with probabilities {{a}}, {{b}} and {{c}}. What is the chance it passes all three?

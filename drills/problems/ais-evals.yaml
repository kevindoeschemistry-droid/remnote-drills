- template: ais-contam-gap
  skill: ais.evals
  pace: quick
  given:
    o:
      pick:
      - 82
      - 90
      - 95
    r:
      pick:
      - 60
      - 70
      - 78
  prompt: A model scores {{o}}% on original items and {{r}}% on rephrased equivalents. What is the contamination gap in percentage points?
  parts:
  - ask: Answer
    label: v
    tex: \Delta
    value: o - r
    tol: 0.005
    explain: A gap between original and rephrased items is the signature of memorisation

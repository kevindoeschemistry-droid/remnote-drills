- template: ais-sample-size
  skill: ais.evals
  pace: quick
  given:
    p1:
      pick:
      - 0.1
      - 0.2
      - 0.3
    p2:
      pick:
      - 0.4
      - 0.5
  prompt: To detect success rates of {{p1}} vs {{p2}} at α = 0.05 (two-sided) and 80% power, how many participants per arm? (Use (1.96 + 0.84)² = 7.84.)
  parts:
  - ask: Answer
    label: v
    tex: n
    value: 7.84*(p1*(1 - p1) + p2*(1 - p2))/(p1 - p2)^2
    tol: 0.005
    explain: Halving the detectable difference quadruples the sample
  verify:
    expect:
      v: Rational(784, 100)*(nsimplify(p1)*(1 - nsimplify(p1)) + nsimplify(p2)*(1 - nsimplify(p2)))/(nsimplify(p1) - nsimplify(p2))**2

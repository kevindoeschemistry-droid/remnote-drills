- template: dat-quant-compare-2
  skill: dat.qr-reasoning
  pace: quick
  cases:
  - A: $2^{10}$
    B: $10^3$
    va: 2**10
    vb: 10**3
    ans: 0
  - A: $\sqrt{50}$
    B: $7$
    va: sqrt(50)
    vb: '7'
    ans: 0
  - A: $\frac{7}{9}$
    B: $\frac{8}{11}$
    va: Rational(7, 9)
    vb: Rational(8, 11)
    ans: 0
  - A: $15\%$ of 80
    B: $80\%$ of 15
    va: Rational(15, 100)*80
    vb: Rational(80, 100)*15
    ans: 2
  - A: $0.3^2$
    B: $0.3$
    va: Rational(3, 10)**2
    vb: Rational(3, 10)
    ans: 1
  prompt: Compare quantity A, {{A}}, with quantity B, {{B}}.
  parts:
  - ask: Answer
    label: v
    choice:
    - A is greater
    - B is greater
    - They are equal
    - Cannot be determined
    correct: ans
    explain: 'Estimate first: x% of y always equals y% of x; squaring a number between 0 and 1 shrinks it'
  verify:
    choices:
      v: 0 if sympify(va) > sympify(vb) else (1 if sympify(va) < sympify(vb) else 2)
- template: dat-weighted-reverse
  skill: dat.qr-reasoning
  pace: quick
  given:
    n1:
      pick:
      - 10
      - 20
    m1:
      pick:
      - 70
      - 80
    nt:
      pick:
      - 30
      - 40
    mt:
      pick:
      - 75
      - 78
  prompt: A class of {{n1}} students averages {{m1}}. When a second group joins, the combined average of all {{nt}} students is {{mt}}. What is the second group's average?
  parts:
  - ask: Answer
    label: v
    tex: \bar x_2
    value: (nt*mt - n1*m1)/(nt - n1)
    tol: 0.005
    explain: 'Totals add: total of all = total of group 1 + total of group 2'
  verify:
    expect:
      v: solve(Eq(n1*m1 + (nt - n1)*x, nt*mt), x)[0]
- template: dat-mixture-final
  skill: dat.qr-reasoning
  pace: quick
  given:
    v1:
      pick:
      - 2
      - 3
      - 5
    c1:
      pick:
      - 10
      - 20
    v2:
      pick:
      - 1
      - 3
      - 5
    c2:
      pick:
      - 40
      - 50
      - 70
  prompt: '{{v1}} L of a {{c1}}% solution is mixed with {{v2}} L of a {{c2}}% solution. What is the concentration of the mixture, in %?'
  parts:
  - ask: Answer
    label: v
    tex: c
    value: (v1*c1 + v2*c2)/(v1 + v2)
    tol: 0.005
    explain: Solute amounts add; the mixture lies between the two, nearer the larger volume
  verify:
    expect:
      v: solve(Eq((v1 + v2)*x, v1*c1 + v2*c2), x)[0]

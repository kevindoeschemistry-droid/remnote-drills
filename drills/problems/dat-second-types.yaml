- template: dat-abs-interval
  skill: dat.qr-reasoning
  pace: quick
  given:
    a:
      int:
      - -5
      - 10
    b:
      int:
      - 1
      - 8
  prompt: How many integers x satisfy |x − {{a}}| ≤ {{b}}?
  parts:
  - ask: Answer
    label: v
    tex: N
    value: 2*b + 1
    final: true
    tol: 0.0001
    explain: '|x − a| ≤ b is the interval a − b ≤ x ≤ a + b, which holds 2b + 1 integers'
  verify:
    expect:
      v: (a + b) - (a - b) + 1

  skill: nurs.safety
  pace: quick
  cases:
    - { s: "How many identifiers must be checked before giving a medication?", o1: "One: the room number", o2: "Two, such as name and date of birth", o3: "Three, including the bed number", o4: "None if the nurse knows the client", ans: 1 }

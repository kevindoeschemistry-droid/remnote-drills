# ── psychosocial integrity ───────────────────────────────────────────────────
- template: nr-therapeutic-comm
  skill: nurs.psychosocial
  pace: quick
  cases:
    - { s: "A client says, \"I'm scared about my surgery tomorrow.\"", o1: "\"Don't worry, your surgeon is the best.\"", o2: "\"Why are you scared?\"", o3: "\"Tell me more about what is scaring you.\"", o4: "\"Let's talk about something more pleasant.\"", ans: 2 }
    - { s: "A client crying after a cancer diagnosis says, \"I don't know what to do.\"", o1: "\"You seem overwhelmed by this news.\"", o2: "\"Everything will be fine.\"", o3: "\"If I were you, I would get a second opinion.\"", o4: "\"Many people survive cancer now.\"", ans: 0 }
    - { s: "A client says, \"Nobody here cares about me.\"", o1: "\"That's not true, we all care.\"", o2: "\"You feel that nobody cares about you?\"", o3: "\"Why would you say that?\"", o4: "\"You should talk to your family about that.\"", ans: 1 }
    - { s: "A client asks the nurse, \"Should I have the surgery?\"", o1: "\"Yes, I would if I were you.\"", o2: "\"What have you thought about so far as you decide?\"", o3: "\"Your doctor knows best.\"", o4: "\"Most people choose surgery.\"", ans: 1 }
    - { s: "A client with schizophrenia says, \"The TV is sending me messages.\"", o1: "\"What messages are you getting?\"", o2: "\"That must be frightening. I don't hear any messages from the TV.\"", o3: "\"The TV can't send messages, that's silly.\"", o4: "\"Let me turn up the volume so we can listen.\"", ans: 1 }
  prompt: '{{s}} Which response is most therapeutic?'
  parts:
    - { ask: 'Response', label: a, choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"], correct: ans, explain: 'Therapeutic: open-ended questions, reflecting feelings, restating, offering self. Non-therapeutic: false reassurance, "why" questions, advice, changing the subject. With hallucinations or delusions, acknowledge the feeling and present reality without arguing or exploring the content' }
  verify: { authored: true }


# NCLEX-RN rules, priorities and facts (framework nclex-rn, NR). Authored: nothing recomputes them, so
# each case is a standard textbook answer with one defensible option. Where practice varies by
# facility (hold parameters, lab ranges) the card says "usual" and the explanation says so.

# ── management of care ────────────────────────────────────────────────────────
- template: nr-priority
  skill: nurs.management
  pace: quick
  cases:
    - { o1: "A client with chest pain who is pale and diaphoretic", o2: "A client 2 days after surgery asking for pain medicine (pain 5/10)", o3: "A client with diabetes due for a scheduled insulin dose in 30 minutes", o4: "A client asking about discharge instructions", ans: 0 }
    - { o1: "A client with a cast who wants a bath", o2: "A client after thyroidectomy with a hoarse voice and noisy breathing", o3: "A client with COPD at SpO₂ 90% on 2 L/min", o4: "A client with a urinary catheter draining 50 mL/h", ans: 1 }
    - { o1: "A client with pneumonia and a temperature of 38.2 °C", o2: "A client with a new fracture whose foot is cold and pale with no pedal pulse", o3: "A client with heart failure who gained 0.5 kg since yesterday", o4: "A client with a stage 2 pressure injury", ans: 1 }
    - { o1: "A client with a sickle cell crisis rating pain 8/10", o2: "A client with asthma who is quiet, with no wheezing heard and SpO₂ 86%", o3: "A client with a blood glucose of 250 mg/dL", o4: "A client receiving IV antibiotics with a red, tender site", ans: 1 }
    - { o1: "A client after abdominal surgery with serous drainage on the dressing", o2: "A client with a potassium of 3.4 mEq/L", o3: "A client receiving blood who reports low back pain and chills", o4: "A client who has not had a bowel movement in 2 days", ans: 2 }
    - { o1: "A client with a head injury whose GCS fell from 14 to 10", o2: "A client with a new colostomy that is pink and moist", o3: "A client with osteoarthritis wanting help to walk", o4: "A client on bedrest asking for the TV remote", ans: 0 }
  prompt: 'Which client should the nurse see first?'
  parts:
    - { ask: 'First', label: a, choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"], correct: ans, explain: 'Airway, breathing, circulation first; then an acute change over a chronic or expected finding; unstable before stable. A silent chest in asthma means air is not moving; a cold, pulseless limb is circulation; a transfusion reaction, airway noise after neck surgery and a falling GCS are acute and life-threatening' }
  verify: { authored: true }

- template: nr-delegation
  skill: nurs.management
  pace: recall
  cases:
    - { task: "Taking vital signs on a stable client after surgery", ans: 2 }
    - { task: "Doing the admission assessment of a new client", ans: 0 }
    - { task: "Giving a scheduled oral medication to a stable client", ans: 1 }
    - { task: "Teaching a newly diagnosed client to self-inject insulin", ans: 0 }
    - { task: "Helping a stable client walk in the hall", ans: 2 }
    - { task: "Reinforcing discharge teaching the RN already gave", ans: 1 }
    - { task: "Evaluating whether a client's pain medicine worked", ans: 0 }
    - { task: "Measuring and recording intake and output", ans: 2 }
    - { task: "Caring for a client whose condition is unstable", ans: 0 }
    - { task: "Giving a subcutaneous injection to a stable client", ans: 1 }
  prompt: 'Who is the least-qualified team member who can do this: {{task}}?'
  parts:
    - { ask: 'Assign to', label: a, choice: ["The RN", "The LPN/LVN", "Assistive personnel (UAP)"], correct: ans, explain: 'The RN keeps assessment, initial teaching, care planning, evaluation and unstable clients. LPNs give most medications, reinforce teaching and care for stable clients. Assistive personnel do routine tasks on stable clients: vitals, hygiene, walking, I&O. The RN stays accountable for what is delegated' }
  verify: { authored: true }

- template: nr-legal
  skill: nurs.management
  pace: quick
  cases:
    - { s: "Before surgery the client asks what the procedure involves and its risks. Whose job is it to explain them?", o1: "The surgeon (the provider doing the procedure)", o2: "The nurse witnessing the signature", o3: "The charge nurse", o4: "The client's family", ans: 0 }
    - { s: "What does the nurse's signature as witness on a consent form confirm?", o1: "That the client understands every risk", o2: "That the signature is the client's and was given voluntarily", o3: "That the procedure is the right choice", o4: "That the surgeon explained the alternatives", ans: 1 }
    - { s: "A client given a sedative 30 minutes ago is asked to sign a surgical consent. What should the nurse do?", o1: "Have the client sign while still alert", o2: "Have a family member sign instead", o3: "Not obtain the signature and tell the provider", o4: "Sign on the client's behalf", ans: 2 }
    - { s: "A competent adult refuses a blood transfusion for religious reasons. What does the nurse do?", o1: "Give it, because it is life-saving", o2: "Respect the refusal, document it and notify the provider", o3: "Ask the family to persuade the client", o4: "Get a court order first", ans: 1 }
    - { s: "A nurse sees another nurse's medication error. What is the right action?", o1: "Ignore it if no harm occurred", o2: "Assess the client, notify the provider and file an incident report", o3: "Chart the incident report in the client's record", o4: "Tell the client's family first", ans: 1 }
    - { s: "Which describes an advance directive?", o1: "A provider's order for the next shift", o2: "A client's written wishes about future care if they cannot decide", o3: "A form that can only be changed by a lawyer", o4: "An order that applies only during surgery", ans: 1 }
  prompt: '{{s}}'
  parts:
    - { ask: 'Answer', label: a, choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"], correct: ans, explain: 'The provider informs; the nurse witnesses and advocates. Consent needs a competent, unsedated adult acting voluntarily, and a competent adult may refuse. Incident reports are quality tools: never mentioned or filed in the chart' }
  verify: { authored: true }


    - { s: "Where should a restraint be tied on a bed?", o1: "To the side rail", o2: "To the bed frame, with a quick-release knot", o3: "To the headboard with a square knot", o4: "To the mattress", ans: 1 }
    - { s: "How often is a restrained client released for range of motion and skin checks, at least?", o1: "Every 2 hours", o2: "Every 8 hours", o3: "Once a shift", o4: "Only when the order is renewed", ans: 0 }

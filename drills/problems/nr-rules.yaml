- template: nr-electrolyte-signs
  skill: nurs.risk-reduction
  pace: recall
  cases:
    - { sign: "Tall, peaked T waves on the ECG", ans: 1 }
    - { sign: "Flattened T waves and U waves on the ECG", ans: 0 }
    - { sign: "Positive Chvostek's and Trousseau's signs", ans: 2 }
    - { sign: "A shortened QT interval, kidney stones and bone pain", ans: 3 }
    - { sign: "Muscle weakness with leg cramps, in a client on furosemide", ans: 0 }
    - { sign: "Muscle twitching and tetany after a thyroidectomy", ans: 2 }
  prompt: 'Which imbalance does this suggest: {{sign}}?'
  parts:
    - { ask: 'Imbalance', label: a, choice: ["Hypokalemia", "Hyperkalemia", "Hypocalcemia", "Hypercalcemia"], correct: ans, explain: 'Potassium shows on the ECG: peaked T when high, flat T and U waves when low (loop diuretics waste it). Low calcium makes nerves irritable (Chvostek, Trousseau, tetany; the parathyroids can be injured in thyroid surgery); high calcium sedates nerves, shortens QT and forms stones' }
  verify: { authored: true }


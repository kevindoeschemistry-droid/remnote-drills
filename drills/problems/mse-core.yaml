  - kn: Tungsten
    kc: 2
    km: 183.84
    ka: 0.3165
  - kn: Nickel
    kc: 4
    km: 58.69
    ka: 0.3524
  prompt: '{{kn}} has {{kc}} atoms per cubic cell, molar mass {{km}} g/mol and cell edge {{ka}} nm. Find its density in g/cm³.'
  parts:
  - ask: Answer
    label: v

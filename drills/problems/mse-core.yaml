# Second question types; keys recomputed by sympy along another route.

- template: mse-cell-facts
  skill: mse.structure
  pace: recall
  cases:
  - q: How many atoms belong to one FCC unit cell?
    o1: '4'
    o2: '2'
    o3: '1'
    o4: '14'
  - q: How many atoms belong to one BCC unit cell?
    o1: '2'
    o2: '4'
    o3: '9'
    o4: '1'
  - q: What is the coordination number in FCC?
    o1: '12'
    o2: '8'
    o3: '6'
    o4: '4'
  - q: What is the coordination number in BCC?
    o1: '8'
    o2: '12'
    o3: '6'
    o4: '2'
  - q: Which two metal structures are both close-packed?
    o1: FCC and HCP
    o2: BCC and FCC
    o3: BCC and HCP
    o4: Simple cubic and BCC
  - q: FCC and HCP differ only in
    o1: 'the stacking of close-packed planes: ABCABC against ABAB'
    o2: their packing fraction
    o3: their coordination number
    o4: the radius of the atoms
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: 'Count shared atoms: corners one-eighth, faces one-half, the body centre whole'
  verify:
    authored: true
- template: mse-cell-count
  skill: mse.structure
  pace: quick
  cases:
  - kc: 8
    kf: 0
    kb: 1
  - kc: 8
    kf: 6
    kb: 0
  - kc: 8
    kf: 0
    kb: 0
  - kc: 8
    kf: 2
    kb: 0
  - kc: 8
    kf: 6
    kb: 1
  prompt: A cubic unit cell has atoms on {{kc}} corners, {{kf}} face centres and {{kb}} body-centre sites. How many atoms belong to the cell?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: kc/8 + kf/2 + kb
    tol: 0.005
    explain: Each corner counts one-eighth, each face one-half, a body site one
  verify:
    expect:
      v: (kc + 4*kf + 8*kb)/Rational(8)
- template: mse-edge-from-radius
  skill: mse.structure
  pace: quick
  cases:
  - kn: Copper
    ks: FCC
    kd: 2
    kr: 0.1278
  - kn: Iron at room temperature
    ks: BCC
    kd: 3
    kr: 0.1241
  - kn: Aluminium
    ks: FCC
    kd: 2
    kr: 0.1431
  - kn: Tungsten
    ks: BCC
    kd: 3
    kr: 0.1371
  - kn: Nickel
    ks: FCC
    kd: 2
    kr: 0.1246
  prompt: '{{kn}} is {{ks}} with atomic radius {{kr}} nm. Find the cell edge a in nm.'
  parts:
  - ask: Answer
    label: v
    tex: a
    value: 4*kr/sqrt(kd)
    tol: 0.005
    explain: 'Four radii span the diagonal along which the atoms touch: the face diagonal in FCC, the body diagonal in BCC'
  verify:
    expect:
      v: Max(*solve(Eq(kd*Symbol('m')**2, (4*kr)**2), Symbol('m')))

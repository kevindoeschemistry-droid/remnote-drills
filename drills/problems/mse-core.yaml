- template: mse-direction-angle
  skill: mse.structure
  pace: quick
  cases:
  - ka: 1
    kb: 0
    kc: 0
    kd: 1
    kf: 1
    kg: 0
  - ka: 1
    kb: 1
    kc: 1
    kd: 1
    kf: 0

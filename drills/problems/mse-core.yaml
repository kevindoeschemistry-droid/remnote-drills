    kb: 1
    kc: 1
    kd: 1
    kf: 1
    kg: 0
  prompt: In a cubic crystal, find the angle in degrees between [{{ka}}{{kb}}{{kc}}] and [{{kd}}{{kf}}{{kg}}].
  parts:
  - ask: Answer
    label: v
    tex: \theta
    value: acos((ka*kd + kb*kf + kc*kg)/(sqrt(ka^2 + kb^2 + kc^2)*sqrt(kd^2 + kf^2 + kg^2)))*180/pi

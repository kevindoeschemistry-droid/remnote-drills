- template: mse-apf
  skill: mse.structure
  pace: quick
  cases:
  - ka: 0.3615
    kn: 4
    kr: 0.1278
  - ka: 0.2866
    kn: 2
    kr: 0.1241
  - ka: 0.405
    kn: 4
    kr: 0.1431
  - ka: 0.3165
    kn: 2
    kr: 0.1371
  - ka: 0.334
    kn: 1
    kr: 0.167
  prompt: A cubic cell of edge {{ka}} nm holds {{kn}} atoms of radius {{kr}} nm. Find the atomic packing factor.
  parts:
  - ask: Answer
    label: v
    tex: APF
    value: kn*(4/3)*pi*kr^3/ka^3
    tol: 0.005
    explain: Sphere volume times the atoms per cell, over a³
  verify:
    expect:
      v: kn*integrate(4*pi*Y**2, (Y, 0, kr))/ka**3

- template: mse-vacancy-fraction
  skill: mse.defects
  pace: quick
  cases:
  - kq: 0.9
    kt: 1273
  - kq: 1.0
    kt: 1000
  - kq: 0.75
    kt: 900
  - kq: 1.1
    kt: 1300
  - kq: 0.9
    kt: 1356
  prompt: A metal has a vacancy formation energy of {{kq}} eV. How many vacancies are there per million lattice sites at {{kt}} K? (k = 8.617333 × 10⁻⁵ eV/K)
  parts:
  - ask: Answer
    label: v
    tex: N_v
    value: 1e6*exp(-kq/(8.617333e-5*kt))
    tol: 0.005
    explain: The Boltzmann factor gives the fraction of vacant sites; scale to a million
  verify:
    expect:
      v: 10**6/exp(kq/(Rational('8.617333e-5')*kt))

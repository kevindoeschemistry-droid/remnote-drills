- template: mse-bragg-angle
  skill: mse.structure
  pace: quick
  cases:
  - kw: 0.1542
    kd: 0.2087
  - kw: 0.1542
    kd: 0.2027
  - kw: 0.1542
    kd: 0.1433
  - kw: 0.0711
    kd: 0.2338
  - kw: 0.179
    kd: 0.117
  prompt: X-rays of wavelength {{kw}} nm reflect in first order from planes {{kd}} nm apart. Find the diffraction angle 2θ in degrees.
  parts:
  - ask: Answer
    label: v
    tex: 2\theta
    value: 2*asin(kw/(2*kd))*180/pi
    tol: 0.005
    explain: sin θ = λ ÷ 2d, then double θ
  verify:
    expect:
      v: 2*atan2(kw/(2*kd), sqrt(1 - (kw/(2*kd))**2))*180/pi

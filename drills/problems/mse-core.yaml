    value: -8.314*(kx*log(kx) + (1 - kx)*log(1 - kx))
    tol: 0.005
    explain: Both logarithms are negative, so the entropy is positive
  verify:
    expect:
      v: Rational('8.314')*(kx*log(1/kx) + (1 - kx)*log(1/(1 - kx)))

- template: nt-two-squares-facts
  skill: nt.diophantine
  pace: recall
  cases:
  - q: 'An odd prime p is a sum of two squares exactly when:'
    o1: p ≡ 1 (mod 4)
    o2: p ≡ 3 (mod 4)
    o3: p ≡ 1 (mod 3)
    o4: p ≡ ±1 (mod 8)
  - q: 'No integer that is 3 mod 4 is a sum of two squares because squares modulo 4 are only:'
    o1: 0 and 1
    o2: 0 and 2
    o3: 1 and 3
    o4: 0, 1 and 2
  - q: 'In the Gaussian integers, the prime 5 factorises as:'
    o1: (2 + i)(2 − i)
    o2: It stays prime
    o3: (1 + i)²
    o4: (5 + i)(5 − i)
  - q: 'In the Gaussian integers, the prime 7:'
    o1: Stays prime
    o2: Factorises as (2 + i)(2 − i)
    o3: Is a unit
    o4: Is a square
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: A prime splits in the Gaussian integers exactly when it is a sum of two squares, which is how the theorem is proved
  verify:
    authored: true

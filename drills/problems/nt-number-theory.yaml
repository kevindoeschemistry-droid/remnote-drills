- template: nt-reciprocity-facts
  skill: nt.residues
  pace: recall
  cases:
  - q: '−1 is a square modulo an odd prime p exactly when:'
    o1: p ≡ 1 (mod 4)
    o2: p ≡ 3 (mod 4)
    o3: p ≡ 1 (mod 3)
    o4: p is any odd prime
  - q: '2 is a square modulo an odd prime p exactly when:'
    o1: p ≡ ±1 (mod 8)
    o2: p ≡ ±3 (mod 8)
    o3: p ≡ 1 (mod 4)
    o4: p ≡ 3 (mod 4)
  - q: 'For distinct odd primes p and q, (p/q) and (q/p) differ exactly when:'
    o1: Both p and q are 3 mod 4
    o2: Either is 3 mod 4
    o3: Both are 1 mod 4
    o4: p + q is a multiple of 4
  - q: How many of the residues 1, …, p − 1 are squares modulo an odd prime p?
    o1: (p − 1)/2
    o2: p − 1
    o3: (p + 1)/2
    o4: φ(p − 1)
  - q: 'Euler''s criterion says (a/p) is congruent modulo p to:'
    o1: a^((p−1)/2)
    o2: a^(p−1)
    o3: a^((p+1)/2)
    o4: a²
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Squaring is two-to-one on the non-zero residues, so exactly half are squares; reciprocity relates the two symbols with a sign that depends only on p and q modulo 4
  verify:
    authored: true

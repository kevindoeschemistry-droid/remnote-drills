- template: cs-store-forward
  skill: cs.networks
  pace: quick
  given:
    L:
      pick:
      - 8
      - 12
      - 100
    k:
      pick:
      - 2
      - 3
      - 4
    R:
      pick:
      - 10
      - 100
    d:
      pick:
      - 1
      - 5
  prompt: A {{L}}-kbit packet crosses {{k}} store-and-forward links, each {{R}} Mbit/s with {{d}} ms propagation. What is the end-to-end delay (ms), ignoring queueing?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: k*(L/R + d)
    tol: 0.005
    explain: 'Each router receives the whole packet before forwarding: k transmissions plus k propagation delays'
  verify:
    expect:
      v: k*Rational(L*1000, R*10**6)*1000 + k*d

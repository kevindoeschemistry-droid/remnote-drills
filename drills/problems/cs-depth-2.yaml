- template: cs-stop-wait
  skill: cs.networks
  pace: quick
  given:
    L:
      pick:
      - 1000
      - 1500
    R:
      pick:
      - 10
      - 100
      - 1000
    rtt:
      pick:
      - 10
      - 30
      - 100
  prompt: A link sends {{L}}-byte frames at {{R}} Mbit/s with a {{rtt}} ms round trip. What is the sender's utilisation under stop-and-wait?
  parts:

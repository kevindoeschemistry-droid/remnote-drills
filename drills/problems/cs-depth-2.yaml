- template: cs-gd-mse
  skill: cs.software
  pace: quick
  given:
    u1:
      pick:
      - 1
      - 2
    v1:
      pick:
      - 2
      - 3
    u2:
      pick:
      - 3
      - 4
    v2:
      pick:
      - 5
      - 7
    w:
      pick:
      - 0
      - 1
    eta:
      pick:
      - 0.01
      - 0.05
  prompt: Fit ŷ = w·u by mean squared error on points (u, v) = ({{u1}}, {{v1}}) and ({{u2}}, {{v2}}). From w = {{w}} with learning rate {{eta}}, what is w after one gradient step?
  parts:
  - ask: Answer
    label: v
    tex: w'
    value: w - eta*(2/2)*(u1*(w*u1 - v1) + u2*(w*u2 - v2))
    tol: 0.005
    explain: ∂L/∂w = (2/n)Σ uᵢ(w uᵢ − vᵢ); step against the gradient
  verify:
    expect:
      v: w - nsimplify(eta)*diff(((Symbol('ww')*u1 - v1)**2 + (Symbol('ww')*u2 - v2)**2)/2, Symbol('ww')).subs(Symbol('ww'), w)
- template: cs-gini-gain
  skill: cs.software
  pace: quick
  cases:
  - a: 5
    b: 5
    a1: 4
    b1: 1
  - a: 6
    b: 4
    a1: 6
    b1: 0
  - a: 8
    b: 8
    a1: 6
    b1: 2
  - a: 10
    b: 10
    a1: 5
    b1: 5
  prompt: A node holds {{a}} positives and {{b}} negatives. A split sends ({{a1}}+, {{b1}}−) left and the rest right. What is the decrease in Gini impurity (weighted)?
  parts:
  - ask: Answer
    label: v
    tex: \Delta G
    value: (1 - (a/(a+b))^2 - (b/(a+b))^2) - ((a1+b1)/(a+b))*(1 - (a1/(a1+b1))^2 - (b1/(a1+b1))^2) - ((a+b-a1-b1)/(a+b))*(1 - ((a-a1)/(a+b-a1-b1))^2 - ((b-b1)/(a+b-a1-b1))^2)
    tol: 0.005
    explain: Gini = 1 − Σp² = 2pq for two classes; subtract the size-weighted children from the parent
  verify:
    expect:
      v: 2*Rational(a*b, (a + b)**2) - Rational(a1 + b1, a + b)*2*Rational(a1*b1, (a1 + b1)**2) - Rational(a + b - a1 - b1, a + b)*2*Rational((a - a1)*(b - b1), (a + b - a1 - b1)**2)
- template: cs-info-gain
  skill: cs.software
  pace: quick
  given:
    a:
      pick:
      - 2
      - 4
      - 8
    b:
      pick:
      - 2
      - 4
      - 6
  prompt: A node has {{a}} positives and {{b}} negatives; a split gives pure children. What is the information gain in bits?
  parts:
  - ask: Answer
    label: v
    tex: IG
    value: -(a/(a+b))*log2(a/(a+b)) - (b/(a+b))*log2(b/(a+b))
    tol: 0.005
    explain: Pure children have zero entropy, so the gain is the parent's whole entropy
  verify:
    expect:
      v: (log(a + b) - (a*log(a) + b*log(b))/(a + b))/log(2)

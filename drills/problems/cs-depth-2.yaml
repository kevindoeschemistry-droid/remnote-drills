- template: cs-tcp-ack
  skill: cs.networks
  pace: quick
  cases:
  - txt: A client sends SYN with sequence number 1000.
    k: 0
    s: 1000
    b: 0
  - txt: A client sends SYN with sequence number 4321.
    k: 0
    s: 4321
    b: 0
  - txt: A segment starts at sequence number 1001 and carries 500 bytes.
    k: 1
    s: 1001
    b: 500
  - txt: A segment starts at sequence number 5000 and carries 1460 bytes.
    k: 1
    s: 5000
    b: 1460
  - txt: A segment starts at sequence number 20000 and carries 100 bytes.
    k: 1
    s: 20000
    b: 100
  prompt: '{{txt}} What acknowledgement number does the receiver send back?'
  parts:
  - ask: Answer
    label: v
    tex: ack
    value: 'k == 0 ? s + 1 : s + b'
    final: true
    tol: 0.0001
    explain: ACK = next byte expected. A SYN (and FIN) consumes one sequence number; data consumes one per byte
  verify:
    expect:
      v: s + 1 if k == 0 else s + b

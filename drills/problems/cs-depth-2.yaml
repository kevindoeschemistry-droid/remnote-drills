  prompt: A covariance matrix has eigenvalues {{l1}}, {{l2}}, {{l3}}, {{l4}}. What fraction of variance do the top {{k}} principal components explain?
  parts:
  - ask: Answer
    label: v
    tex: f
    value: 'k == 1 ? l1/(l1 + l2 + l3 + l4) : (l1 + l2)/(l1 + l2 + l3 + l4)'
    tol: 0.005
    explain: Each eigenvalue is the variance along its component; sort, then take the cumulative share
  verify:
    expect:
      v: (nsimplify(l1) + (nsimplify(l2) if k == 2 else 0))/(nsimplify(l1) + nsimplify(l2) + nsimplify(l3) + nsimplify(l4))

- template: cs-window-needed
  skill: cs.networks
  pace: quick
  given:
    L:
      pick:
      - 1000
      - 1500
    R:
      pick:
      - 10
      - 100
    rtt:
      pick:
      - 10
      - 30
  prompt: 'Same link: {{L}}-byte frames, {{R}} Mbit/s, {{rtt}} ms RTT. What window (frames) keeps the pipe full? Give W = 1 + RTT/(L/R), unrounded.'
  parts:
  - ask: Answer
    label: v
    tex: W
    value: 1 + (rtt/1000)/(8*L/(R*1e6))
    tol: 0.005
    explain: 'Sliding windows reach full utilisation when W·(L/R) ≥ RTT + L/R: the bandwidth–delay product in frames'
  verify:
    expect:
      v: solve(Eq(Symbol('ww')*Rational(8*L, R*10**6), Rational(rtt, 1000) + Rational(8*L, R*10**6)), Symbol('ww'))[0]
- template: cs-cwnd
  skill: cs.networks
  pace: quick
  cases:
  - th: 16
    ev: a a a a a
    ans: 17
  - th: 16
    ev: a a a a a t a a
    ans: 4
  - th: 8
    ev: a a a a a d
    ans: 5
  - th: 32
    ev: a a a a d a a
    ans: 10
  - th: 4
    ev: a a a a a
    ans: 7
  prompt: 'TCP Reno starts at cwnd = 1 MSS with ssthresh = {{th}}. Per RTT: a = all ACKs arrive (double below ssthresh, capped at it; +1 at or above), t = timeout (ssthresh = cwnd/2, cwnd = 1), d = triple duplicate ACK (ssthresh = cwnd/2, cwnd = ssthresh). After {{ev}}, what is cwnd?'
  parts:
  - ask: Answer
    label: v
    tex: cwnd
    value: ans
    final: true
    tol: 0.0001
    explain: Slow start doubles, congestion avoidance adds one MSS per RTT; loss halves ssthresh. Fast recovery skips the restart at 1
  verify:
    expect:
      v: cs_cwnd(ev, th)

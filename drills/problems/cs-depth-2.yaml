- template: cs-gustafson
  skill: cs.systems
  pace: quick
  given:
    s:
      pick:
      - 0.05
      - 0.1
      - 0.2
    p:
      pick:
      - 8
      - 64
      - 1024
  prompt: A fixed-time workload is {{s}} serial when run on {{p}} processors. What is Gustafson's scaled speedup?
  parts:
  - ask: Answer
    label: v
    tex: S
    value: s + p*(1 - s)
    tol: 0.005
    explain: 'Grow the problem with p: S = p − s(p − 1), nearly linear, unlike Amdahl''s fixed-size limit'
  verify:
    expect:
      v: p - nsimplify(s)*(p - 1)

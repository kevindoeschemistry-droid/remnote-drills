    p: 4
  - t1: 640
    tp: 50
    p: 16
  - t1: 90
    tp: 12
    p: 8
  - t1: 200
    tp: 8
    p: 32
  prompt: A job takes {{t1}} s on 1 core and {{tp}} s on {{p}} cores. What is the strong-scaling efficiency?
  parts:
  - ask: Answer
    label: v
    tex: E
    value: t1/(p*tp)
    tol: 0.005

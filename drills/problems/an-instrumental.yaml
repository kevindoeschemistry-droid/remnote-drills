- template: an-alpha-diprotic
  skill: anal.equilibria
  pace: quick
  given:
    p1:
      pick:
      - 2.15
      - 4.2
    p2:
      pick:
      - 7.2
      - 9.0
    pH:
      pick:
      - 3
      - 5
      - 7
  prompt: For a diprotic acid with pK₁ = {{p1}} and pK₂ = {{p2}}, what fraction is in the HA⁻ form at pH {{pH}}?
  parts:
  - ask: Answer
    label: v
    tex: \alpha_1
    value: 10^(-p1)*10^(-pH)/(10^(-2*pH) + 10^(-p1)*10^(-pH) + 10^(-p1)*10^(-p2))
    tol: 0.005
    explain: 'Divide each term of D by K₁[H⁺]: HA⁻ dominates between the two pKa values'
  verify:
    expect:
      v: 1/(10**(nsimplify(p1) - nsimplify(pH)) + 1 + 10**(nsimplify(pH) - nsimplify(p2)))

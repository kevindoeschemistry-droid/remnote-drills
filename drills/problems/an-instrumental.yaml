- template: an-khp
  skill: anal.measurement
  pace: quick
  given:
    m:
      pick:
      - 0.4085
      - 0.5106
      - 0.8169
    v:
      pick:
      - 19.85
      - 24.1
      - 40.02
  prompt: '{{m}} g of KHP (204.222 g/mol) needs {{v}} mL of NaOH to reach the end point. What is [NaOH] (M)?'
  parts:
  - ask: Answer
    label: r
    tex: M
    value: (m/204.222)/(v/1000)
    tol: 0.005
    explain: KHP reacts 1:1 with OH⁻; NaOH can't be weighed accurately (it absorbs water and CO₂), so it is standardized
  verify:

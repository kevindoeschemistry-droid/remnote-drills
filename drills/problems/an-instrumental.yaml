      - 10
  prompt: A metal ion at {{c}} M meets an equal amount of EDTA with K_f′ = 10^{{lk}}. At the equivalence point, what fraction of the metal is uncomplexed ([M]/C ≈ √(C/K_f′)/C)?
  parts:
  - ask: Answer
    label: v
    tex: f
    value: sqrt(c/10^lk)/c
    tol: 0.005
    explain: At equivalence [M] = [EDTA], so K_f′ = C/[M]²; a large K_f′ leaves almost no free metal
  verify:
    expect:
      v: solve(Eq(nsimplify(c)/Symbol('mm', positive=True)**2, 10**lk), Symbol('mm', positive=True))[0]/nsimplify(c)
- template: an-activity-solubility
  skill: anal.equilibria
  pace: quick
  given:
    g:
      pick:
      - 1.0
      - 0.9
      - 0.75
      - 0.6
  prompt: AgCl (K_sp = 1.8 × 10⁻¹⁰) dissolves in an inert salt solution where γ_Ag⁺ = γ_Cl⁻ = {{g}}. What is its solubility (in 10⁻⁵ M)?
  parts:
  - ask: Answer
    label: v
    tex: s
    value: sqrt(1.8e-10)/g*1e5
    tol: 0.005
    explain: Activities, not concentrations, enter K_sp, so a lower γ lets more dissolve (the diverse-salt effect)
  verify:
    expect:
      v: solve(Eq((nsimplify(g)*Symbol('ss', positive=True))**2, Rational(18, 10**11)), Symbol('ss', positive=True))[0]*10**5
- template: an-ionic-gamma
  skill: anal.equilibria
  pace: quick
  given:
    z:
      pick:
      - 1
      - 2
      - 3
    I:
      pick:
      - 0.001
      - 0.01
      - 0.05
  prompt: Using the Debye–Hückel limiting law, log γ = −0.51 z²√I, what is γ for an ion of charge {{z}} at ionic strength {{I}} M?
  parts:
  - ask: Answer
    label: v
    tex: \gamma
    value: 10^(-0.51*z^2*sqrt(I))
    tol: 0.005
    explain: Highly charged ions feel ionic strength most; the law holds only below about 0.01 M
  verify:
    expect:
      v: exp(-Rational(51, 100)*z**2*sqrt(nsimplify(I))*log(10))
- template: an-dilute-acid
  skill: anal.equilibria
  pace: quick
  given:
    c:
      pick:
      - 1
      - 2
      - 5
  prompt: What is the pH of {{c}} × 10⁻⁸ M HCl in water at 25 °C (K_w = 1.0 × 10⁻¹⁴), from the charge balance [H⁺] = C + K_w/[H⁺]?
  parts:
  - ask: Answer
    label: v
    tex: pH
    value: -log10((c*1e-8 + sqrt((c*1e-8)^2 + 4e-14))/2)
    tol: 0.005
    explain: 'Water''s own H⁺ can''t be ignored: 10⁻⁸ M HCl gives pH 6.98, not 8'
  verify:
    expect:
      v: -log(solve(Eq(Symbol('hh', positive=True), c*Rational(1, 10**8) + Rational(1, 10**14)/Symbol('hh', positive=True)), Symbol('hh', positive=True))[0], 10)
- template: an-weak-exact
  skill: anal.equilibria
  pace: quick
  cases:
  - Ka: 1.8e-05
    C: 0.1
  - Ka: 1.8e-05
    C: 0.0001
  - Ka: 0.01
    C: 0.05
  - Ka: 6.3e-05
    C: 0.001
  prompt: A weak acid has K_a = {{Ka}} at C = {{C}} M. Solving [H⁺]² + K_a[H⁺] − K_aC = 0 exactly (water ignored), what is the pH?
  parts:
  - ask: Answer
    label: v
    tex: pH
    value: -log10((-Ka + sqrt(Ka^2 + 4*Ka*C))/2)
    tol: 0.005
    explain: The √(K_aC) shortcut fails when dissociation exceeds about 5%; the quadratic doesn't
  verify:
    expect:
      v: -log(solve(Eq(Symbol('hh', positive=True)**2/(nsimplify(C) - Symbol('hh', positive=True)), nsimplify(Ka)), Symbol('hh', positive=True))[0], 10)
- template: an-lod
  skill: anal.measurement
  pace: quick
  given:
    s:
      pick:
      - 0.002
      - 0.005
      - 0.01
    m:
      pick:
      - 0.05
      - 0.12
      - 0.4
  prompt: Blank replicates have standard deviation {{s}} (signal units) and the calibration slope is {{m}} per µM. What are the detection limit (3s/m) in µM?
  parts:
  - ask: Answer
    label: v
    tex: LOD
    value: 3*s/m
    tol: 0.005
    explain: LOQ uses 10s/m; a steeper slope (higher sensitivity) lowers both
  verify:
    expect:
      v: 3*nsimplify(s)/nsimplify(m)
- template: an-loq-ratio
  skill: anal.measurement
  pace: quick
  given:
    lod:
      pick:
      - 0.3
      - 1.2
      - 6
  prompt: A method's LOD is {{lod}} ppb. What is its LOQ (ppb), taking LOD = 3s/m and LOQ = 10s/m?
  parts:
  - ask: Answer
    label: v
    tex: LOQ
    value: lod*10/3
    tol: 0.005
    explain: Between LOD and LOQ an analyte can be reported present but not quantified
  verify:
    expect:
      v: nsimplify(lod)*Rational(10, 3)
- template: an-internal-std
  skill: anal.measurement
  pace: quick
  given:
    ax0:
      pick:
      - 500
      - 640
    as0:
      pick:
      - 400
      - 450
    ax:
      pick:
      - 300
      - 720
    as1:
      pick:
      - 380
      - 420
  prompt: A standard with 10.0 µM analyte X and 8.0 µM internal standard S gives areas A_X = {{ax0}}, A_S = {{as0}}. A sample spiked to 8.0 µM S gives A_X = {{ax}}, A_S = {{as1}}. What is [X] (µM)?
  parts:
  - ask: Answer
    label: v
    tex: '[X]'
    value: (ax/as1)*8/((ax0/10)/(as0/8))
    tol: 0.005
    explain: The response factor F cancels injection volume and drift, which change both signals together
  verify:
    expect:
      v: solve(Eq((nsimplify(ax)/Symbol('xx'))/(nsimplify(as1)/8), (nsimplify(ax0)/10)/(nsimplify(as0)/8)), Symbol('xx'))[0]
- template: an-cal-choice
  skill: anal.measurement
  pace: quick
  cases:
  - q: 'The matrix (seawater) changes the analyte''s slope. The best calibration is:'
    o1: Standard addition
    o2: External standards in pure water
    o3: A single-point check
    o4: None
  - q: 'Injection volumes in GC vary from run to run. Correct with:'
    o1: An internal standard
    o2: Standard addition only
    o3: A longer column
    o4: A blank
  - q: 'Calibration standards should:'
    o1: Bracket the expected sample concentrations
    o2: All be above the samples
    o3: All be below
    o4: Be one standard
  - q: 'An internal standard should be:'
    o1: Similar to the analyte but absent from the sample and resolved from it
    o2: The analyte itself
    o3: Any salt
    o4: A solvent
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'Choose calibration by what varies: matrix, injection or instrument drift'
  verify:
    authored: true
- template: an-recovery
  skill: anal.measurement
  pace: quick
  given:
    u:
      pick:
      - 12
      - 20
    add:
      pick:
      - 10
      - 25
    sp:
      pick:
      - 20
      - 31
      - 43
  prompt: An unspiked sample reads {{u}} µg/L. The same sample spiked with {{add}} µg/L reads {{sp}} µg/L. What is the recovery (%)?
  parts:
  - ask: Answer
    label: v
    tex: R
    value: 100*(sp - u)/add
    tol: 0.005
    explain: Recoveries near 100% (often 80–120%, usual acceptance) show the method finds what is there
  verify:
    expect:
      v: 100*Rational(sp - u, add)
- template: an-limiting-analyte
  skill: anal.measurement
  pace: quick
  cases:
  - q: 'For a reaction-based assay to measure the analyte, the analyte must be:'
    o1: The limiting reagent, converted completely
    o2: In excess
    o3: Unreacted
    o4: The catalyst
  - q: 'A recovery of 60% suggests:'
    o1: Losses or incomplete conversion in sample preparation
    o2: Perfect accuracy
    o3: Contamination only
    o4: Too much spike
  - q: 'A recovery of 140% suggests:'
    o1: Interference or contamination adding signal
    o2: Losses
    o3: A perfect method
    o4: Too little spike
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Quantitative conversion and recovery underpin accuracy
  verify:
    authored: true
- template: an-n-samples
  skill: anal.measurement
  pace: quick
  given:
    ss:
      pick:
      - 4
      - 6
      - 10
    er:
      pick:
      - 2
      - 3
      - 5
  prompt: Sampling standard deviation is {{ss}}% and you want the mean within ±{{er}}% at 95% confidence (use t ≈ 1.96). How many samples (unrounded n = (ts/e)²)?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: (1.96*ss/er)^2
    tol: 0.005
    explain: Halving the allowed error quadruples the samples
  verify:
    expect:
      v: (Rational(196, 100)*ss)**2/er**2
- template: an-sampling-plan
  skill: anal.measurement
  pace: quick
  cases:
  - q: 'A field has distinct soil zones of known area. Sample by:'
    o1: Stratified sampling within each zone
    o2: One grab sample
    o3: Only the easiest spot
    o4: Systematic at random
  - q: 'Taking a sample every 2 hours from a pipeline is:'
    o1: Systematic sampling
    o2: Stratified
    o3: Composite
    o4: Random
  - q: 'Combining many increments into one for an average composition is:'
    o1: A composite sample
    o2: A stratified sample
    o3: A blank
    o4: A spike
  - q: 'Sampling error often dominates total error because:'
    o1: The lot is heterogeneous and the sample is small
    o2: Instruments are imprecise
    o3: Calculations round
    o4: It doesn't
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'

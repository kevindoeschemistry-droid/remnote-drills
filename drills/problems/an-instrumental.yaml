- template: an-jablonski
  skill: anal.instrumental
  pace: quick
  cases:
  - q: 'Emission from S₁ to S₀ with no spin change, lifetime about nanoseconds, is:'
    o1: Fluorescence
    o2: Phosphorescence
    o3: Raman scattering
    o4: Internal conversion
  - q: 'A radiationless crossing from S₁ to T₁ is:'
    o1: Intersystem crossing
    o2: Internal conversion
    o3: Fluorescence
    o4: Rayleigh scattering
  - q: Why is fluorescence at longer wavelength than the absorbed light?
    o1: Energy is lost to vibrational relaxation before emission
    o2: Photons gain energy
    o3: The solvent absorbs blue light
    o4: It isn't
  - q: 'Emission lasting milliseconds after the light is switched off is most likely:'
    o1: Phosphorescence (spin-forbidden T₁ → S₀)
    o2: Fluorescence
    o3: Rayleigh scattering
    o4: Raman scattering
  - q: 'Time-gated detection suppresses background because:'
    o1: Scattering and short-lived fluorescence die before a long-lived emitter is read
    o2: It increases absorbance
    o3: It removes the analyte
    o4: It cools the sample
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: 'Draw the Jablonski diagram: radiative and radiationless paths, with spin deciding the rate'
  verify:
    authored: true

    authored: true
- template: an-t-two-means
  skill: anal.measurement
  pace: quick
  given:
    m1:
      pick:
      - 10.2
      - 50.4
    m2:
      pick:
      - 10.6
      - 50.1
    n:
      pick:
      - 4
      - 6
    s:
      pick:
      - 0.2
      - 0.3
  prompt: Method A gives mean {{m1}} (n = {{n}}), method B {{m2}} (n = {{n}}); pooled s = {{s}}. What is t?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: abs(m1 - m2)/(s*sqrt(2/n))
    tol: 0.005
    explain: If t exceeds t_table (2n − 2 degrees of freedom), the means differ significantly
  verify:
    expect:
      v: Abs(nsimplify(m1) - nsimplify(m2))/(nsimplify(s)*sqrt(Rational(2, n)))
- template: an-t-decide
  skill: anal.measurement
  pace: quick
  cases:
  - tc: 1.8
    tt: 2.45
    kd: 1
  - tc: 3.1
    tt: 2.45
    kd: 0
  - tc: 2.2
    tt: 2.31
    kd: 1
  - tc: 5.0
    tt: 2.78
    kd: 0
  prompt: Two methods give t_calc = {{tc}} with t_table = {{tt}} at 95%. Do the means differ significantly?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes: significant at 95%'
    - No significant difference at 95%
    correct: kd
    explain: Reject 'no difference' only when t_calc > t_table
  verify:

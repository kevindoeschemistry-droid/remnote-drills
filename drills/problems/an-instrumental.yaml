- template: an-glass-tolerance
  skill: anal.measurement
  pace: quick
  cases:
  - v: 10
    tp: 0.02
  - v: 25
    tp: 0.03
  - v: 5
    tp: 0.01
  prompt: A {{v}} mL class A pipette (±{{tp}} mL) delivers into a 100 mL class A flask (±0.08 mL). What is the relative uncertainty of the diluted concentration (%), combining the two relative uncertainties in quadrature?
  parts:
  - ask: Answer
    label: r
    tex: \%
    value: 100*sqrt((tp/v)^2 + (0.08/100)^2)
    tol: 0.005
    explain: For a quotient, relative uncertainties add in quadrature
  verify:
    expect:
      r: 100*sqrt((nsimplify(tp)/v)**2 + Rational(8, 10000)**2)
- template: an-derivative-endpoint
  skill: anal.measurement
  pace: quick
  cases:
  - v1: 24.6
    p1: 6.2
    v2: 24.8
    p2: 6.9
    v3: 25.0
    p3: 9.4
  - v1: 15.0
    p1: 4.8
    v2: 15.2
    p2: 7.6
    v3: 15.4
    p3: 8.3
  - v1: 10.0
    p1: 5.0
    v2: 10.1
    p2: 5.6
    v3: 10.2
    p3: 8.9
  prompt: 'pH readings near an end point: at {{v1}} mL pH {{p1}}, at {{v2}} mL pH {{p2}}, at {{v3}} mL pH {{p3}}. Using the first derivative, at what volume (midpoint of the steepest interval) is the end point?'
  parts:
  - ask: Answer
    label: v
    tex: V
    value: '(p3 - p2)/(v3 - v2) > (p2 - p1)/(v2 - v1) ? (v2 + v3)/2 : (v1 + v2)/2'
    tol: 0.005
    explain: ΔpH/ΔV peaks at the end point; the second derivative crosses zero there
  verify:
    expect:
      v: (nsimplify(v2) + nsimplify(v3))/2 if (nsimplify(p3) - nsimplify(p2))/(nsimplify(v3) - nsimplify(v2)) > (nsimplify(p2) - nsimplify(p1))/(nsimplify(v2) - nsimplify(v1)) else (nsimplify(v1) + nsimplify(v2))/2
- template: an-log-linear

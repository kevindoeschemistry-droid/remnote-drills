  parts:
  - ask: Answer
    label: v
    tex: '|G/Z|'
    value: kg/kz
    final: true
    tol: 0.0001
    explain: The quotient has one element per coset. If G/Z(G) were cyclic the group would be abelian, so this order is never a prime

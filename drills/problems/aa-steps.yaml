- template: aa-normal-or-not
  skill: aa.quotients
  pace: recall
  cases:
  - sg: A₃
    gp: S₃
    kc: 0
  - sg: '{e, (1 2)}'
    gp: S₃
    kc: 1
  - sg: the rotations
    gp: the symmetry group of a square
    kc: 0
  - sg: '{e, one reflection}'
    gp: the symmetry group of a square
    kc: 1
  - sg: the even integers
    gp: the integers under addition
    kc: 0
  - sg: matrices of determinant 1
    gp: all invertible 2×2 real matrices
    kc: 0
  - sg: the centre
    gp: any group
    kc: 0
  - sg: '{e, (1 2)(3 4)}'
    gp: S₄
    kc: 1
  prompt: Is {{sg}} a normal subgroup of {{gp}}?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: Index 2, kernels and centres are always normal. A subgroup generated by one reflection or one transposition is moved by conjugation to another of the same kind
  verify:
    authored: true
- template: aa-normal-facts
  skill: aa.quotients
  pace: recall
  cases:
  - q: 'A subgroup of index 2 is always:'
    o1: Normal
    o2: Cyclic
    o3: Abelian
    o4: The centre
  - q: 'The kernel of a group homomorphism is always:'
    o1: A normal subgroup
    o2: Trivial
    o3: Cyclic
    o4: The whole group
  - q: In an abelian group, which subgroups are normal?
    o1: All of them
    o2: Only the trivial ones
    o3: Only those of prime order
    o4: None
  - q: 'Cosets of a subgroup N can be multiplied as (aN)(bN) = abN consistently exactly when N is:'
    o1: Normal
    o2: Finite
    o3: Cyclic
    o4: Abelian
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Normality is exactly what makes the set of cosets into a group
  verify:
    authored: true

    ka: 6
  - kg: 20
    ks: 9
    ka: 4
  - kg: 30
    ks: 16
    ka: 6
  - kg: 8
    ks: 6
    ka: 2
  prompt: A group of order {{kg}} acts on a set of {{ks}} points with exactly two orbits, one of size {{ka}}. What is the size of the stabiliser of a point in the other orbit?
  parts:
  - ask: Answer
    label: v
    tex: '|\mathrm{Stab}|'
    value: kg/(ks - ka)
    final: true
    tol: 0.0001
    explain: Orbits partition the set, so the other orbit has the remaining points; then stabiliser = group order ÷ orbit size
  verify:
    expect:
      v: solve(Eq(Symbol('m')*(ks - ka), kg), Symbol('m'))[0]

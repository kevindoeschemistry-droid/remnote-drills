- template: aa-kernel-facts
  skill: aa.quotients
  pace: recall
  cases:
  - q: 'The sign map from S_n to {1, −1} has kernel:'
    o1: A_n
    o2: The transpositions
    o3: S_(n−1)
    o4: The identity only
  - q: 'The determinant map from invertible n×n real matrices to the non-zero reals has kernel:'
    o1: Matrices of determinant 1
    o2: Diagonal matrices
    o3: Orthogonal matrices
    o4: The identity only
  - q: 'A homomorphism is injective exactly when its kernel is:'
    o1: Trivial
    o2: Normal
    o3: The whole group
    o4: Cyclic
  - q: 'The map from the integers to Z_n sending x to x mod n has kernel:'
    o1: The multiples of n
    o2: The units modulo n
    o3: '{0}'
    o4: The integers coprime to n
  - q: 'The map x ↦ e^(ix) from the real numbers under addition to the unit circle has kernel:'
    o1: The integer multiples of 2π
    o2: '{0}'
    o3: The integers
    o4: The rationals
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Every quotient you meet in practice is the image of a homomorphism, and the kernel says what was collapsed
  verify:
    authored: true

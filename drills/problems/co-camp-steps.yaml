- template: co-carbonyl-count
  skill: olympiad.bonding
  pace: quick
  cases:
  - nm: V(CO)₆
    gp: 5
    nc: 6
  - nm: Cr(CO)₆
    gp: 6
    nc: 6
  - nm: A Mn(CO)₅ fragment
    gp: 7
    nc: 5
  - nm: Fe(CO)₅
    gp: 8
    nc: 5
  - nm: A Co(CO)₄ fragment
    gp: 9
    nc: 4
  - nm: Ni(CO)₄
    gp: 10
    nc: 4
  prompt: '{{nm}} is a neutral binary carbonyl of a group-{{gp}} metal with {{nc}} CO ligands. How many valence electrons does the metal centre have?'
  parts:
  - ask: Answer
    label: v
    tex: e^-
    value: gp + 2*nc
    final: true
    tol: 0.0001
    explain: 'Group number plus two per carbonyl. The odd-group metals come out at 17: manganese and cobalt fragments pair up through a metal-metal bond, while V(CO)₆ is too crowded to dimerise and stays a 17-electron radical that is easily reduced to V(CO)₆⁻'
  verify:
    expect:
      v: gp + 2*nc
- template: co-nitrosyl-count
  skill: olympiad.bonding
  pace: quick
  cases:
  - nm: Cr(NO)₄
    gp: 6
    na: 4
    nc: 0
    qc: 0
  - nm: Mn(NO)₃(CO)
    gp: 7
    na: 3
    nc: 1
    qc: 0
  - nm: Fe(NO)₂(CO)₂
    gp: 8
    na: 2
    nc: 2
    qc: 0
  - nm: Co(NO)(CO)₃
    gp: 9
    na: 1
    nc: 3
    qc: 0
  - nm: V(NO)(CO)₅
    gp: 5
    na: 1
    nc: 5
    qc: 0
  - nm: '[Fe(NO)(CO)₃]⁻'
    gp: 8
    na: 1
    nc: 3
    qc: -1
  prompt: '{{nm}}: a group-{{gp}} metal with {{na}} linear NO and {{nc}} CO ligands and overall charge {{qc}}. How many valence electrons?'
  parts:
  - ask: Answer
    label: v
    tex: e^-
    value: gp + 3*na + 2*nc - qc
    final: true
    tol: 0.0001
    explain: 'Linear NO counts three: it gives up its π* electron to the metal and then donates a pair as NO⁺, which is isoelectronic with CO and an even better π acceptor. So it both supplies an extra electron and pulls density off an electron-rich metal'
  verify:
    expect:
      v: gp + 3*na + 2*nc - qc

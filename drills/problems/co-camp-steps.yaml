- template: co-cip-priority
  skill: olympiad.organic
  pace: recall
  cases:
  - q: 'Which group has the highest CIP priority: –OH, –CH₂OH, –CHO or –CH₃?'
    o1: –OH
    o2: –CHO
    o3: –CH₂OH
    o4: –CH₃
  - q: Which ranks higher, –CHO or –CH₂OH?
    o1: –CHO, because C=O counts as two oxygens on carbon
    o2: –CH₂OH, because it has more hydrogens
    o3: They tie
    o4: –CH₂OH, because it is larger
  - q: Which ranks higher, –NH₂ or –COOH?
    o1: –NH₂, because nitrogen outranks carbon at the first atom
    o2: –COOH, because it has two oxygens
    o3: They tie
    o4: –COOH, because it is heavier overall
  - q: Which ranks higher, –SH or –OH?
    o1: –SH, because sulfur has the higher atomic number
    o2: –OH
    o3: They tie
    o4: It depends on the solvent
  - q: Which ranks higher, –COOH or –CHO?
    o1: '–COOH: (O, O, O) beats (O, O, H)'
    o2: –CHO
    o3: They tie
    o4: –CHO, because it is more reactive
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Compare atom by atom outward from the stereocentre and stop at the first difference; size and total mass never enter
  verify:
    authored: true
- template: co-r-or-s
  skill: olympiad.organic
  pace: recall
  cases:
  - dirw: clockwise
    ptw: away from
    cw: 1
    aw: 1
  - dirw: clockwise
    ptw: toward
    cw: 1
    aw: 0
  - dirw: anticlockwise
    ptw: away from
    cw: 0
    aw: 1
  - dirw: anticlockwise
    ptw: toward
    cw: 0
    aw: 0
  prompt: Priorities 1 → 2 → 3 run {{dirw}} as drawn, and the lowest-priority group points {{ptw}} the viewer. What is the configuration?
  parts:
  - ask: Answer
    label: v
    choice:
    - R
    - S
    correct: 'cw == aw ? 0 : 1'
    explain: Clockwise with the lowest group away is R. If the lowest group points at you, you are looking from the wrong side, so reverse the answer rather than redraw the molecule
  verify:
    authored: true
- template: co-fischer-rules
  skill: olympiad.organic
  pace: recall
  cases:
  - q: 'In a Fischer projection the horizontal bonds:'
    o1: Point toward the viewer
    o2: Point away from the viewer
    o3: Lie in the plane
    o4: Alternate
  - q: 'Rotating a Fischer projection by 180° in the plane of the paper:'
    o1: Leaves the configuration unchanged
    o2: Inverts the configuration
    o3: Is not allowed
    o4: Gives a diastereomer
  - q: 'Swapping any two groups on one stereocentre of a Fischer projection:'
    o1: Inverts that centre
    o2: Leaves it unchanged
    o3: Racemises it
    o4: Is the same as a 180° rotation
  - q: 'A sugar is D when, in its Fischer projection with C1 at the top, the OH on the highest-numbered stereocentre is:'
    o1: On the right
    o2: On the left
    o3: At the top
    o4: Axial
  - q: 'The D or L label tells you:'
    o1: The configuration at one reference carbon, not the sign of rotation
    o2: That the compound rotates light to the right or left
    o3: The R or S label of every centre
    o4: Whether the sugar is reducing
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: A Fischer projection is a fixed viewing convention, so only moves that respect it keep the configuration; D and L are read off one carbon
  verify:
    authored: true
- template: co-fischer-r-or-s
  skill: olympiad.organic
  pace: recall
  cases:
  - dirw: clockwise
    bnd: vertical
    cw: 1
    aw: 1
  - dirw: clockwise
    bnd: horizontal
    cw: 1
    aw: 0
  - dirw: anticlockwise
    bnd: vertical
    cw: 0
    aw: 1
  - dirw: anticlockwise
    bnd: horizontal
    cw: 0
    aw: 0
  prompt: In a Fischer projection, priorities 1 → 2 → 3 run {{dirw}} and the lowest-priority group is on a {{bnd}} bond. What is the configuration?
  parts:
  - ask: Answer
    label: v
    choice:
    - R
    - S
    correct: 'cw == aw ? 0 : 1'
    explain: 'Vertical bonds go back, so a lowest group on a vertical bond already points away and the sense reads true. On a horizontal bond it points at you: reverse it'
  verify:
    authored: true
- template: co-birch
  skill: olympiad.organic
  pace: recall
  cases:
  - q: 'Benzene with sodium in liquid ammonia and ethanol gives:'
    o1: Cyclohexa-1,4-diene

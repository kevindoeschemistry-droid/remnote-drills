- template: co-slope-electrons
  skill: olympiad.electrochem
  pace: quick
  given:
    dv:
      pick:
      - 59.2
      - 29.6
      - 19.7
  prompt: At 25 °C an electrode's potential changes by {{dv}} mV for each tenfold change in the ion's concentration. How many electrons are transferred per ion?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: round(59.16/dv)
    final: true
    tol: 0.0001
    explain: The slope is 59.16/n mV per decade, so n is read straight off the calibration before any reaction is written. A one-electron slope for cyanide at a silver-based electrode is what points to a silver-cyanide couple
  verify:
    expect:
      v: floor(Rational('59.16')/nsimplify(dv) + Rational(1, 2))
- template: co-decade-shift
  skill: olympiad.electrochem
  pace: quick
  given:
    ne:
      pick:
      - 1
      - 2
      - 3
    dil:
      pick:
      - 10
      - 100
      - 1000
  prompt: A Nernstian electrode responds to an ion through a {{ne}}-electron couple at 25 °C. By how many mV does its potential change when the ion is diluted {{dil}}-fold?
  parts:
  - ask: Answer
    label: v
    tex: \Delta E
    value: 59.16/ne*log10(dil)
    tol: 0.005
    explain: Each decade is worth 59.16/n mV, so the same dilution moves a two-electron electrode half as far. That is why multi-electron electrodes are less sensitive
  verify:
    expect:
      v: Rational('59.16')/ne*log(dil)/log(10)
- template: co-ka-from-shift
  skill: olympiad.equilibria
  pace: quick
  given:
    dv:
      pick:
      - 59.2
      - 101.6
      - 118.3
    ph:
      pick:
      - 7.0
      - 7.5
      - 8.0
  prompt: An electrode that responds only to free A⁻ (one electron, 25 °C) reads {{dv}} mV higher in a pH {{ph}} buffer than in strong base, at the same total concentration. What is K_a of HA?
  parts:
  - ask: Answer
    label: v
    tex: K_a
    value: 10^(-ph)*10^(-dv/59.16)/(1 - 10^(-dv/59.16))
    tol: 0.01
    explain: In strong base all of it is A⁻; in the buffer the reading rises because only a fraction α = 10^(−ΔE/59.16) is free. Then K_a = [H⁺]α/(1 − α). The electrode has turned a pH change into a speciation measurement
  verify:
    expect:
      v: 10**(-nsimplify(ph))/(10**(nsimplify(dv)/Rational('59.16')) - 1)
- template: co-free-fraction
  skill: olympiad.equilibria
  pace: quick
  given:
    pk:
      pick:
      - 4.76
      - 7.2
      - 9.2
    ph:
      pick:
      - 5.0
      - 7.5
      - 9.0
  prompt: A weak acid has pK_a {{pk}}. What fraction is present as A⁻ at pH {{ph}}?
  parts:
  - ask: Answer
    label: v
    tex: \alpha
    value: 1/(1 + 10^(pk - ph))
    tol: 0.005
    explain: α = K_a/(K_a + [H⁺]). Two pH units below the pK_a only about 1% is free, which is why an anion-selective electrode reads so differently in a neutral buffer
  verify:
    expect:
      v: 10**(-nsimplify(pk))/(10**(-nsimplify(pk)) + 10**(-nsimplify(ph)))
- template: co-two-salt-solubility
  skill: olympiad.equilibria
  pace: quick
  given:
    a:
      pick:
      - 12
      - 30
    b:
      pick:
      - 6
      - 20
    c:
      pick:
      - 2
      - 8
    d:
      pick:
      - 3
      - 9
    ph:
      pick:
      - 4.0
      - 5.0
      - 6.0
  prompt: MA (K_sp {{a}}×10⁻⁸) and MB (K_sp {{b}}×10⁻⁸) are both in excess in a buffer at pH {{ph}}. HA has K_a {{c}}×10⁻⁶ and HB has K_a {{d}}×10⁻⁵. What is [M⁺] in mol/L?
  parts:
  - ask: Answer
    label: v
    tex: '[M^+]'
    value: sqrt(a*1e-8*(1 + 10^(-ph)/(c*1e-6)) + b*1e-8*(1 + 10^(-ph)/(d*1e-5)))
    tol: 0.005
    explain: The cation equals the sum of both anions in every form. Each total is K_sp/[M⁺] divided by its free fraction, so [M⁺]² is the sum of the two conditional solubility products. Protonation pulls more of both salts into solution
  verify:
    expect:
      v: sqrt(Rational(a, 10**8)*(1 + 10**(-nsimplify(ph))*Rational(10**6, c)) + Rational(b, 10**8)*(1 + 10**(-nsimplify(ph))*Rational(10**5, d)))

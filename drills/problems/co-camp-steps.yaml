- template: co-metal-metal-light
  skill: olympiad.bonding
  pace: recall
  cases:
  - q: UV light on Mn₂(CO)₁₀ first breaks the Mn–Mn bond. Which transition does that?
    o1: σ → σ* of the Mn–Mn bond
    o2: d → d on one manganese
    o3: π → π* of a carbonyl
    o4: n → π* of a carbonyl
  - q: 'Homolysis of the Mn–Mn bond in Mn₂(CO)₁₀ gives:'
    o1: Two 17-electron Mn(CO)₅ radicals
    o2: Mn(CO)₅⁺ and Mn(CO)₅⁻
    o3: Two 18-electron fragments
    o4: Mn(CO)₄ and Mn(CO)₆
  - q: 'The two Mn(CO)₅ halves of Mn₂(CO)₁₀ are staggered because:'
    o1: With no bridging ligands, staggering keeps the equatorial carbonyls apart
    o2: The Mn–Mn bond is a double bond
    o3: Eclipsing is forbidden by symmetry
    o4: The carbonyls bridge
  - q: 'V(CO)₆ stays a monomer although it has 17 electrons because:'
    o1: A dimer would make vanadium seven-coordinate, which is too crowded
    o2: It already has 18 electrons
    o3: Vanadium cannot form metal–metal bonds
    o4: CO is a weak-field ligand
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: The metal-metal σ bond is the weakest bond in these dimers, so light that fills its σ* orbital cuts the molecule into two metal radicals
  verify:
    authored: true

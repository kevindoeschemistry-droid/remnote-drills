    o2: Dissolve the sodium
    o3: Oxidise the product
    o4: Act as the electron source
  - q: 'Birch reduction of anisole gives mainly the diene in which the methoxy group is:'
    o1: On a double-bond carbon (1-methoxycyclohexa-1,4-diene)
    o2: On an sp³ carbon
    o3: Lost as methanol
    o4: Converted to OH
  - q: 'Birch reduction of benzoic acid gives the diene in which the carboxyl group is:'
    o1: On an sp³ carbon (cyclohexa-2,5-diene-1-carboxylic acid)
    o2: On a double-bond carbon
    o3: Reduced to CH₂OH
    o4: Lost as CO₂

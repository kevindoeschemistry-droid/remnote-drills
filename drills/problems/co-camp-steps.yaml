  prompt: 'For 4 MO(s) → 2 M₂O(s) + O₂(g): Δ_fH° is −{{a}} kJ/mol for MO and −{{b}} kJ/mol for M₂O; S° is {{sa}}, {{sb}} and {{so}} J/(mol·K) for MO, M₂O and O₂. Above what temperature (K) is M₂O the stable oxide at 1 bar O₂?'
  parts:
  - ask: Answer
    label: v
    tex: T
    value: (4*a - 2*b)*1000/(2*sb + so - 4*sa)
    tol: 0.005
    explain: Build ΔH° and ΔS° from the table, then set ΔG° = 0. Releasing a mole of gas makes ΔS° large and positive, so the lower oxide always wins at high temperature
  verify:
    expect:
      v: Rational((4*a - 2*b)*1000, 2*sb + so - 4*sa)

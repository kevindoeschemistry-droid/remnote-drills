- template: co-birch-sodium
  skill: olympiad.organic
  pace: quick
  given:
    na:
      pick:
      - 2.5
      - 10
      - 40
  prompt: How many mmol of sodium does the Birch reduction of {{na}} mmol of an arene to its 1,4-diene consume?
  parts:
  - ask: Answer
    label: v
    tex: mmol
    value: 2*na
    final: true
    tol: 0.0001
    explain: 'Two electrons and two protons per ring, delivered alternately: electron, proton, electron, proton. The second pair of electrons is not taken up because the isolated double bonds are harder to reduce than the arene'

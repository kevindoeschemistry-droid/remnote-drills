- template: co-composite-ea
  skill: olympiad.kinetics
  pace: quick
  given:
    e1:
      pick:
      - 300
      - 350
    e3:
      pick:
      - 60
      - 170
    e4:
      pick:
      - 20
      - 30
    e5:
      pick:
      - 0
      - 10
  prompt: A chain reaction has k_obs = (k₁k₃k₄/k₅)^(1/2) with activation energies {{e1}}, {{e3}}, {{e4}} and {{e5}} kJ/mol. What is the overall activation energy in kJ/mol?
  parts:
  - ask: Answer
    label: v
    tex: E_a
    value: (e1 + e3 + e4 - e5)/2
    tol: 0.005
    explain: ln k_obs is half the sum and difference of the ln k values, and each ln k carries −E/RT. The chain's barrier is well below the initiation step's because initiation enters as a square root
  verify:
    expect:
      v: Rational(e1 + e3 + e4 - e5, 2)

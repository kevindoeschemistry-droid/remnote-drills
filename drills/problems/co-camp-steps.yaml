- template: co-equivalence-emf
  skill: olympiad.electrochem
  pace: quick
  given:
    pk:
      pick:
      - 9.75
      - 12.3
      - 15.8
  prompt: A silver electrode (E° = 0.800 V) is read against a reference at 0.285 V. What is the cell emf, in volts, at the equivalence point of precipitating a 1:1 silver salt with pK_sp {{pk}}?
  parts:
  - ask: Answer
    label: v
    tex: E
    value: 0.800 - 0.285 + 0.05916*log10(sqrt(10^(-pk)))
    tol: 0.005
    explain: At equivalence [Ag⁺] = √K_sp, so log[Ag⁺] = −pK_sp/2. The less soluble the salt, the lower the emf at its end point, which is what separates the steps on the curve
  verify:
    expect:
      v: Rational('0.515') - Rational('0.05916')*nsimplify(pk)/2

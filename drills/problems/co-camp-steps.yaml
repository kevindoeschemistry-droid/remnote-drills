    explain: Each NF₄⁺ takes two electrons going to NF₃ and each O₂ gives four, so the ideal ratio is one O₂ per two NF₄⁺. NF₃ still forms quantitatively; only the oxygen runs short
  verify:
    expect:
      v: nsimplify(nn4)/2*(1 - Rational(sl, 100))

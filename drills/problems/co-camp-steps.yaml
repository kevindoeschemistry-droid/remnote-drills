- template: co-vacancy-x
  skill: olympiad.states
  pace: quick
  given:
    f:
      pick:
      - 0.2
      - 1.0
      - 4.0
  prompt: In a sample of Cu₂₋ₓO with a complete oxide lattice, {{f}}% of the copper atoms are Cu²⁺. What is x?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: 2*(f/100)/(1 + f/100)
    tol: 0.005
    explain: 'Total positive charge must stay 2 per oxide: (2 − x)(1 + f) = 2. Each missing Cu⁺ is paid for by one remaining copper going to Cu²⁺'
  verify:
    expect:
      v: 2 - 2/(1 + nsimplify(f)/100)

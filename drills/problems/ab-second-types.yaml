# Generated by scripts/second_types.py from scripts/second_specs/ab2.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: ab-field-pick
  skill: aib.concepts
  pace: recall
  cases:
  - q: A chess program that follows hand-written rules
    kc: 0
  - q: A decision tree trained to flag spam
    kc: 1
  - q: A convolutional network that labels photos
    kc: 2
  - q: A large language model chatbot
    kc: 3
  - q: A linear regression that predicts house prices from data
    kc: 1
  - q: A diffusion model that makes images from text
    kc: 3
  - q: An expert system built from if-then rules written by doctors
    kc: 0
  prompt: '{{q}} is best described as:'
  parts:
  - ask: Answer
    label: v
    choice:
    - AI, but not machine learning
    - Machine learning, but not deep learning
    - Deep learning, but not generative
    - Generative AI
    correct: kc
    explain: 'Ask in turn: does it learn from data? Does it use a deep neural network? Does it produce new content rather than a label or a number?'
  verify:
    authored: true
- template: ab-parameters-that-fit
  skill: aib.llms
  pace: quick
  given:
    kg:
      pick:
      - 8
      - 16
      - 24
      - 48
    kb:
      pick:
      - 4
      - 8
      - 16
  prompt: A device has {{kg}} GB free for model weights (1 GB = 10⁹ bytes). At {{kb}} bits per parameter, how many billion parameters fit?
  parts:
  - ask: Answer
    label: v
    tex: B
    value: kg*8/kb
    tol: 0.005
    explain: Bytes per parameter = bits/8, and a billion parameters at one byte each is one GB. Halving the precision doubles what fits
  verify:
    expect:
      v: solve(Eq(Symbol('m')*Rational(kb, 8), kg), Symbol('m'))[0]
- template: ab-prompt-fix-pick
  skill: aib.use
  pace: recall
  cases:
  - q: 'The answer is three times longer than you can use. The best fix is to:'
    o1: State the length and format you want
    o2: Ask the same question again
    o3: Add more background
    o4: Switch to a different topic
  - q: 'The model cites a paper that does not exist. The best fix is to:'
    o1: Give it the source text and ask it to quote only from that
    o2: Ask it to be more confident
    o3: Make the prompt shorter
    o4: Ask for more citations
  - q: 'The explanation is pitched at experts, and your reader is twelve. The best fix is to:'
    o1: Say who the reader is
    o2: Ask for a longer answer
    o3: Remove your question
    o4: Ask it to use more technical terms
  - q: 'You asked for three things and it did two. The best fix is to:'
    o1: List the requirements as numbered points
    o2: Write the request as one long sentence
    o3: Add praise
    o4: Ask it to try harder
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: 'Name what is wrong with the answer, then change the one part of the prompt that controls it: length and format, source, audience, or the list of requirements'
  verify:
    authored: true

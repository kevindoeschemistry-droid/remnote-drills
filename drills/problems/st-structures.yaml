        bonds: [[0, 1], [1, 2, 2, -1], [2, 3], [3, 4, 2, -1], [4, 5], [5, 0, 2, -1]]
      explain: 'A six-membered ring with three alternating double bonds. Formula $\mathrm{C_{6}H_{6}}$'

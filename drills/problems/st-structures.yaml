# Structures to know cold: draw each from its name, and name each from its drawing.
# GENERATED by scripts/mol.py --library from scripts/mol_library.py: edit there, not here.
#
# Basis: the groups follow the chapters of Bruice, Organic Chemistry 8e (standards.yaml: bruice-8e,
# a textbook's table of contents). Which compounds stand for each chapter is a house list.
# Flat skeletal structures, neutral and fully protonated; sugars are Fischer projections.
# Each formula is recomputed from the atoms and bonds by tests/verify/molecules.py.

# ── functional groups: the first things to trace (R = the rest of the molecule) ──
- template: st-draw-an-alcohol
  skill: orgo.functional-groups
  pace: quick
  prompt: 'Draw an alcohol from memory, as a skeletal structure.'
  parts:
    - ask: 'Draw it on paper, then compare'
      label: a
      draw: true
      solution:
        type: molecule
        formula: HOR
        atoms: [[-0.5, 0.0, "R"], [0.5, -0.0, "OH"]]
        bonds: [[0, 1]]
      explain: 'R-OH. Formula $\mathrm{HOR}$'
- template: st-name-an-alcohol
  skill: orgo.functional-groups
  pace: recall
  prompt: 'Which compound is this?'
  figure:
    type: molecule
    formula: HOR
    atoms: [[-0.5, 0.0, "R"], [0.5, -0.0, "OH"]]
    bonds: [[0, 1]]
  parts:
    - ask: 'Name it'
      label: a
      choice: ["a nitrile", "a primary amine", "a thiol", "an alcohol"]
      correct: "3"
      explain: 'An alcohol. R-OH'
  verify: { authored: true }

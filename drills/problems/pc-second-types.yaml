- template: pc-hess-combine
  skill: pchem.thermochemistry
  pace: quick
  cases:
  - h1: -393.5
    h2: -283.0
  - h1: -393.5
    h2: -282.98
  prompt: Given C(s) + O₂ → CO₂, ΔH = {{h1}} kJ/mol, and CO + ½O₂ → CO₂, ΔH = {{h2}} kJ/mol, what is ΔH for C(s) + ½O₂ → CO, in kJ/mol?
  parts:
  - ask: Answer
    label: v
    tex: \Delta H
    value: h1 - h2
    tol: 0.005
    explain: 'Run the second reaction backwards and add: enthalpy is a state function, so the path does not matter'
  verify:
    expect:
      v: solve(Eq(x + nsimplify(h2), nsimplify(h1)), x)[0]

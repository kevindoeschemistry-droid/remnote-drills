- template: pc-gas-density
  skill: pchem.first-law
  pace: quick
  given:
    P:
      pick:
      - 100
      - 101.325
      - 500
    T:
      pick:
      - 273.15
      - 298.15
      - 400
  cases:
  - g: N₂
    M: 28.014
  - g: CO₂
    M: 44.01
  - g: He
    M: 4.0026
  prompt: What is the density, in g/L, of {{g}} (M = {{M}} g/mol) at {{P}} kPa and {{T}} K, treated as ideal? (R = 8.314 J/mol·K)
  parts:
  - ask: Answer
    label: v
    tex: \rho
    value: P*1000*M/(8.314462618*T)/1000
    tol: 0.005
    explain: 'ρ = PM/RT: denser gases are heavier or colder, which is how a gas density gives a molar mass'
  verify:
    expect:
      v: (nsimplify(P)*1000/(Rational('8.314462618')*nsimplify(T)))*nsimplify(M)/1000

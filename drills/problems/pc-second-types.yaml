  prompt: A reaction has ΔH = {{h1}} kJ/mol at {{T1}} K and {{h2}} kJ/mol at {{T2}} K. Assuming constant ΔC_p, what is ΔC_p, in J/(mol·K)?
  parts:
  - ask: Answer
    label: v
    tex: \Delta C_p

  - rx: CH₄(g) + 2 O₂(g) → CO₂(g) + 2 H₂O(l)
    dn: -2
    dH: -890.3
  - rx: CaCO₃(s) → CaO(s) + CO₂(g)
    dn: 1
    dH: 178.3
  - rx: 2 H₂O₂(l) → 2 H₂O(l) + O₂(g)
    dn: 1
    dH: -196.1
  prompt: For {{rx}}, ΔH = {{dH}} kJ/mol at 298 K. What is ΔU, in kJ/mol? (R = 8.314 J/mol·K)
  parts:

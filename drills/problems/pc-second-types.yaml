    label: v
    tex: A - A_0
    value: 8.314462618*T*log(1 - exp(-th/T))
    tol: 0.005
    explain: A = −RT ln q, with q the geometric sum over evenly spaced levels
  verify:
    expect:
      v: -Rational('8.314462618')*T*log(summation(exp(-Symbol('j')*nsimplify(th)/T), (Symbol('j'), 0, oo)))
- template: pc-w-from-residual
  skill: stat.multiplicity
  pace: quick
  cases:
  - S: 5.76
  - S: 9.13
  - S: 11.53
  - S: 3.37
  prompt: A crystal has a residual molar entropy of {{S}} J/(mol·K). How many orientations per molecule does that imply? (R = 8.314)
  parts:
  - ask: Answer
    label: v
    tex: W
    value: exp(S/8.314462618)
    tol: 0.02
    explain: R ln 2 = 5.76 (CO); ice's 3.37 corresponds to Pauling's 3/2 per molecule
  verify:
    expect:
      v: solve(Eq(Rational('8.314462618')*log(x), nsimplify(S)), x)[0]
- template: pc-rms-ratio
  skill: kinetics.gas-kinetic
  pace: quick
  given:
    T1:
      pick:
      - 300
      - 600
    T2:
      pick:
      - 300
      - 1200
  cases:
  - g1: H₂
    M1: 2.016
    g2: O₂
    M2: 31.998
  - g1: He
    M1: 4.0026
    g2: Ar
    M2: 39.948
  - g1: N₂
    M1: 28.014
    g2: CO₂
    M2: 44.01
  prompt: What is the ratio of the rms speed of {{g1}} (M = {{M1}}) at {{T1}} K to that of {{g2}} (M = {{M2}}) at {{T2}} K?
  parts:
  - ask: Answer
    label: v
    tex: v_1/v_2
    value: sqrt(T1*M2/(T2*M1))
    tol: 0.005
    explain: 'v ∝ √(T/M): hydrogen at room temperature outruns oxygen fourfold'
  verify:
    expect:
      v: sqrt(3*Rational('8.314462618')*T1/(nsimplify(M1)/1000))/sqrt(3*Rational('8.314462618')*T2/(nsimplify(M2)/1000))
- template: pc-matching-temperature
  skill: kinetics.gas-kinetic
  pace: quick
  given:
    T:
      pick:
      - 100
      - 300
  cases:
  - g1: O₂
    M1: 31.998
    g2: H₂
    M2: 2.016
  - g1: CO₂
    M1: 44.01
    g2: He
    M2: 4.0026
  prompt: At what temperature, in K, does {{g1}} (M = {{M1}}) have the same rms speed as {{g2}} (M = {{M2}}) at {{T}} K?
  parts:
  - ask: Answer
    label: v
    tex: T_1
    value: T*M1/M2
    tol: 0.005
    explain: Equal speeds need T/M equal
  verify:
    expect:
      v: solve(Eq(sqrt(3*Rational('8.314462618')*x/nsimplify(M1)), sqrt(3*Rational('8.314462618')*T/nsimplify(M2))), x)[0]
- template: pc-effusion-time
  skill: kinetics.gas-kinetic
  pace: quick
  given:
    t:
      pick:
      - 10
      - 60
      - 100
  cases:
  - g1: N₂
    M1: 28.014
    g2: He
    M2: 4.0026
  - g1: H₂
    M1: 2.016
    g2: UF₆
    M2: 352.02
  prompt: A volume of {{g1}} (M = {{M1}}) effuses through a pinhole in {{t}} s. How long does the same volume of {{g2}} (M = {{M2}}) take under the same conditions?
  parts:
  - ask: Answer
    label: v
    tex: t_2
    value: t*sqrt(M2/M1)
    tol: 0.005
    explain: 'Graham''s law: time ∝ √M, the basis of gaseous uranium enrichment'
  verify:
    expect:
      v: nsimplify(t)*sqrt(nsimplify(M2))/sqrt(nsimplify(M1))
- template: pc-collision-scaling
  skill: kinetics.gas-kinetic
  pace: quick
  given:
    z:
      pick:
      - 5
      - 7
    P1:
      pick:
      - 1
    T1:
      pick:
      - 300
    P2:
      pick:
      - 0.1
      - 2
      - 10
    T2:
      pick:
      - 300
      - 600
  prompt: A molecule makes {{z}} × 10⁹ collisions per second at {{P1}} bar and {{T1}} K. How many does it make at {{P2}} bar and {{T2}} K (×10⁹ per s)?
  parts:
  - ask: Answer
    label: v
    tex: z_2
    value: z*(P2/P1)*sqrt(T1/T2)
    tol: 0.005
    explain: 'z = σ⟨v_rel⟩N/V: density scales as P/T and speed as √T, so z ∝ P/√T'
  verify:
    expect:
      v: nsimplify(z)*((P2/(T2))*sqrt(T2))/((P1/(T1))*sqrt(T1))
- template: pc-pressure-for-mfp
  skill: kinetics.gas-kinetic
  pace: quick
  given:
    T:
      pick:
      - 298
  cases:
  - lam: 1 μm
    l: 1.0e-06
  - lam: 1 mm
    l: 0.001
  - lam: 1 m
    l: 1
  prompt: At what pressure, in Pa, does N₂ (σ = 0.43 nm²) at {{T}} K have a mean free path of {{lam}}? (k = 1.381 × 10⁻²³ J/K)
  parts:
  - ask: Answer
    label: v
    tex: P
    value: 1.380649e-23*T/(sqrt(2)*0.43e-18*l)
    tol: 0.005
    explain: 'λ = kT/(√2σP): ultra-high vacuum (below 10⁻⁷ Pa) gives free paths of kilometres'
  verify:
    expect:
      v: solve(Eq(Rational('1.380649e-23')*T/(sqrt(2)*Rational(43, 10**20)*x), nsimplify(l)), x)[0]
- template: pc-gradient-for-flux
  skill: kinetics.gas-kinetic
  pace: quick
  given:
    D:
      pick:
      - 0.5
      - 1
      - 2
    J:
      pick:
      - 1
      - 10
      - 50
  prompt: A solute with D = {{D}} × 10⁻⁹ m²/s must cross a membrane at {{J}} μmol/(m²·s). What concentration gradient, in mol/m⁴, is needed?
  parts:
  - ask: Answer
    label: v
    tex: '|dc/dx|'
    value: J*1e-6/(D*1e-9)
    tol: 0.005
    explain: Fick's first law, J = −D dc/dx
  verify:
    expect:
      v: solve(Eq(nsimplify(D)/10**9*x, nsimplify(J)/10**6), x)[0]
- template: pc-diffusion-time
  skill: kinetics.gas-kinetic
  pace: quick
  cases:
  - D: 10⁻⁹ m²/s
    Dv: 1.0e-09
    x: 1 μm
    xv: 1.0e-06
  - D: 10⁻⁹ m²/s
    Dv: 1.0e-09
    x: 1 mm
    xv: 0.001
  - D: 10⁻⁵ m²/s
    Dv: 1.0e-05
    x: 1 cm
    xv: 0.01
  prompt: How long, in s, does a molecule with D = {{D}} take to diffuse an rms distance of {{x}} in 3-D?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: xv^2/(6*Dv)
    tol: 0.005
    explain: '⟨r²⟩ = 6Dt: diffusion crosses a cell in milliseconds but a millimetre in minutes'
  verify:
    expect:
      v: solve(Eq(sqrt(6*nsimplify(Dv)*Symbol('tt')), nsimplify(xv)), Symbol('tt'))[0]
- template: pc-conductivity-from-flux
  skill: kinetics.gas-kinetic
  pace: quick
  given:
    q:
      pick:
      - 50
      - 200
      - 1000
    d:
      pick:
      - 1
      - 5
    dT:
      pick:
      - 10
      - 20
  prompt: A heat flux of {{q}} W/m² crosses a {{d}} cm slab with a {{dT}} K temperature drop. What is the thermal conductivity, in W/(m·K)?
  parts:
  - ask: Answer
    label: v
    tex: \kappa
    value: q*d/100/dT
    tol: 0.005
    explain: Fourier's law q = −κ dT/dx, the heat analogue of Fick's
  verify:
    expect:
      v: solve(Eq(x*dT/(nsimplify(d)/100), q), x)[0]
- template: pc-gradient-from-stress
  skill: kinetics.gas-kinetic
  pace: quick
  given:
    eta:
      pick:
      - 0.89
      - 1
      - 10
    tau:
      pick:
      - 0.1
      - 1
      - 5
  prompt: A fluid with viscosity {{eta}} mPa·s carries a shear stress of {{tau}} Pa. What velocity gradient, in s⁻¹?
  parts:
  - ask: Answer
    label: v
    tex: dv/dz
    value: tau/(eta/1000)
    tol: 0.005
    explain: 'Newton''s law of viscosity: momentum flows down the velocity gradient'
  verify:
    expect:
      v: solve(Eq(nsimplify(eta)/1000*x, nsimplify(tau)), x)[0]
- template: pc-rate-prediction
  skill: kinetics.rate-laws
  pace: quick
  given:
    a:
      pick:
      - 1
      - 2
    b:
      pick:
      - 0
      - 1
      - 2
    fa:
      pick:
      - 2
      - 3
    fb:
      pick:
      - 0.5
      - 2
      - 3
  prompt: A reaction is order {{a}} in A and order {{b}} in B. If [A] is multiplied by {{fa}} and [B] by {{fb}}, by what factor does the rate change?
  parts:
  - ask: Answer
    label: v
    tex: r_2/r_1
    value: fa^a*fb^b
    tol: 0.005
    explain: The rate law, not the stoichiometry, sets the response
  verify:
    expect:
      v: (Symbol('kk')*(nsimplify(fa)*Symbol('A'))**a*(nsimplify(fb)*Symbol('B'))**b)/(Symbol('kk')*Symbol('A')**a*Symbol('B')**b)
- template: pc-energetic-fraction
  skill: kinetics.rate-laws
  pace: quick
  given:
    T:
      pick:
      - 298
      - 500
      - 1000
    Ea:
      pick:
      - 30
      - 50
      - 80
  prompt: What fraction of collisions at {{T}} K has enough energy to clear a barrier of {{Ea}} kJ/mol (e^{−Ea/RT})? Give it in units of 10⁻⁶. (R = 8.314)
  parts:
  - ask: Answer
    label: v
    tex: f
    value: exp(-Ea*1000/(8.314462618*T))*1e6
    tol: 0.005
    explain: The Boltzmann factor, not the collision rate, controls how rates change with temperature
  verify:
    expect:
      v: 10**6/exp(Ea*1000/(Rational('8.314462618')*T))
- template: pc-reversible-halfway
  skill: kinetics.rate-laws
  pace: quick
  given:
    kf:
      pick:
      - 0.1
      - 1
      - 5
    kr:
      pick:
      - 0.05
      - 0.5
      - 2
  prompt: For A ⇌ B with k_f = {{kf}} s⁻¹ and k_r = {{kr}} s⁻¹, how long until A has gone halfway to its equilibrium value, in s?
  parts:
  - ask: Answer
    label: v
    tex: t_{1/2}
    value: log(2)/(kf + kr)
    tol: 0.005
    explain: 'The approach to equilibrium runs at k_f + k_r, faster than either step alone: the principle of relaxation methods'
  verify:
    expect:
      v: 1/(nsimplify(kf) + nsimplify(kr))*log(2)
- template: pc-parallel-time
  skill: kinetics.rate-laws
  pace: quick
  given:
    k1:
      pick:
      - 0.01
      - 0.1
    k2:
      pick:
      - 0.02
      - 0.3
    f:
      pick:
      - 50
      - 10
      - 1
  prompt: A decays by two parallel first-order paths with k₁ = {{k1}} and k₂ = {{k2}} s⁻¹. How long until {{f}}% of A remains, in s?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: log(100/f)/(k1 + k2)
    tol: 0.005
    explain: Parallel paths add their rate constants; the product ratio k₁/k₂ stays fixed throughout
  verify:
    expect:
      v: (log(100) - log(nsimplify(f)))/(nsimplify(k1) + nsimplify(k2))
- template: pc-intermediate-max-time
  skill: kinetics.rate-laws
  pace: quick
  given:
    k1:
      pick:
      - 0.1
      - 0.5
      - 2
    k2:
      pick:
      - 0.05
      - 0.3
      - 1
  require:
  - k1 != k2
  prompt: For A → B → C with k₁ = {{k1}} and k₂ = {{k2}} s⁻¹, when does [B] peak, in s?
  parts:
  - ask: Answer
    label: v
    tex: t_{max}
    value: log(k1/k2)/(k1 - k2)
    tol: 0.005
    explain: 'Set d[B]/dt = 0: the time depends only on the rate constants, not on [A]₀'
  verify:
    expect:
      v: (log(nsimplify(k2)) - log(nsimplify(k1)))/(nsimplify(k2) - nsimplify(k1))
- template: pc-steady-state-keff
  skill: kinetics.rate-laws
  pace: quick
  given:
    k1:
      pick:
      - 1
      - 10
    km:
      pick:
      - 10
      - 100
    k2:
      pick:
      - 1
      - 10
      - 100
  prompt: A ⇌ I (k₁ = {{k1}}, k₋₁ = {{km}} s⁻¹), I → P (k₂ = {{k2}} s⁻¹). With the steady-state approximation for I, what is the effective first-order rate constant, in s⁻¹?
  parts:
  - ask: Answer
    label: v
    tex: k_{eff}
    value: k1*k2/(km + k2)
    tol: 0.005
    explain: If k₂ ≫ k₋₁ the first step limits; if k₋₁ ≫ k₂ it becomes pre-equilibrium
  verify:
    expect:
      v: (nsimplify(k2)*solve(Eq(nsimplify(k1)*Symbol('A') - (nsimplify(km) + nsimplify(k2))*x, 0), x)[0])/Symbol('A')
- template: pc-pre-equilibrium-ea
  skill: kinetics.rate-laws
  pace: quick
  given:
    dH:
      pick:
      - -40
      - -20
      - 10
    E2:
      pick:
      - 30
      - 60
  prompt: A pre-equilibrium has ΔH° = {{dH}} kJ/mol for the fast step and E_a = {{E2}} kJ/mol for the slow step. What is the apparent activation energy, in kJ/mol?
  parts:
  - ask: Answer
    label: v
    tex: E_{a,app}
    value: dH + E2
    tol: 0.005
    explain: 'k_obs = K k₂, so ln k_obs = ln K + ln k₂: a negative ΔH can make a rate fall as temperature rises'
  verify:
    expect:
      v: -Symbol('Rr')*diff(log(exp(-dH*Symbol('u')/Symbol('Rr'))*exp(-E2*Symbol('u')/Symbol('Rr'))), Symbol('u'))
- template: pc-lindemann-half
  skill: kinetics.rate-laws
  pace: quick
  given:
    ka:
      pick:
      - 1000000.0
      - 100000000.0
    km:
      pick:
      - 1000000000.0
      - 10000000000.0
    kb:
      pick:
      - 100000.0
      - 10000000.0
  prompt: In the Lindemann mechanism, k_a = {{ka}} M⁻¹s⁻¹, k₋a = {{km}} M⁻¹s⁻¹ and k_b = {{kb}} s⁻¹. At what bath-gas concentration, in M, does the rate constant reach half its high-pressure limit?
  parts:
  - ask: Answer
    label: v
    tex: '[M]_{1/2}'
    value: kb/km
    tol: 0.005
    explain: Fall-off happens where deactivation and reaction of the energised molecule are equally fast
  verify:
    expect:
      v: solve(Eq(nsimplify(ka)*nsimplify(kb)*x/(nsimplify(km)*x + nsimplify(kb)), nsimplify(ka)*nsimplify(kb)/nsimplify(km)/2), x)[0]
- template: pc-substrate-for-fraction
  skill: kinetics.rate-laws
  pace: quick
  given:
    K:
      pick:
      - 0.1
      - 2
      - 10
    f:
      pick:
      - 10
      - 50
      - 90
  prompt: An enzyme has K_M = {{K}} mM. What substrate concentration, in mM, gives {{f}}% of V_max?
  parts:
  - ask: Answer
    label: v
    tex: '[S]'
    value: f/(100 - f)*K
    tol: 0.005
    explain: 'Going from 10% to 90% needs an 81-fold rise in [S]: Michaelis–Menten enzymes respond gradually'
  verify:
    expect:
      v: solve(Eq(x/(nsimplify(K) + x), Rational(f, 100)), x)[0]
- template: pc-initiation-from-chain
  skill: kinetics.rate-laws
  pace: quick
  given:
    Rp:
      pick:
      - 1
      - 5
      - 10
    nu:
      pick:
      - 100
      - 1000
      - 5000
  prompt: A chain reaction converts monomer at {{Rp}} × 10⁻⁴ M/s with kinetic chain length {{nu}}. What is the rate of initiation, in 10⁻⁷ M/s?
  parts:
  - ask: Answer
    label: v
    tex: R_i
    value: Rp*1e-4/nu/1e-7
    tol: 0.005
    explain: 'ν = R_p/R_i: each initiation event carries many propagation steps'
  verify:
    expect:
      v: solve(Eq(nsimplify(Rp)/10**4/(x/10**7), nu), x)[0]

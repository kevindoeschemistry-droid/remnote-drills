- template: pc-boyle-vdw
  skill: pchem.real-gases
  pace: quick
  cases:
  - g: N₂
    a: 1.37
    b: 0.0387
  - g: CO₂
    a: 3.64
    b: 0.04267
  - g: CH₄
    a: 2.283
    b: 0.04278
  - g: Ar
    a: 1.355
    b: 0.032
  prompt: '{{g}} has van der Waals a = {{a}} L²·bar/mol² and b = {{b}} L/mol. What is its Boyle temperature, in K? (R = 0.08314 L·bar/(mol·K))'
  parts:
  - ask: Answer
    label: v
    tex: T_B
    value: a/(0.08314*b)
    tol: 0.005
    explain: At T_B the second virial coefficient B = b − a/RT vanishes, so the gas is nearly ideal over a wide pressure range
  verify:
    expect:
      v: solve(Eq(nsimplify(b) - nsimplify(a)/(Rational(8314, 100000)*x), 0), x)[0]
- template: pc-vdw-critical-t
  skill: pchem.real-gases
  pace: quick
  cases:
  - g: N₂
    a: 1.37
    b: 0.0387
  - g: CO₂
    a: 3.64
    b: 0.04267
  - g: H₂O
    a: 5.536
    b: 0.03049
  prompt: '{{g}} has van der Waals a = {{a}} L²·bar/mol² and b = {{b}} L/mol. What critical temperature does the equation predict, in K? (R = 0.08314)'
  parts:
  - ask: Answer
    label: v
    tex: T_c
    value: 8*a/(27*0.08314*b)
    tol: 0.005
    explain: At the critical point the isotherm has zero slope and curvature, at V_c = 3b
  verify:
    expect:
      v: solve(Eq(diff(Rational(8314, 100000)*x/(Symbol('v') - nsimplify(b)) - nsimplify(a)/Symbol('v')**2, Symbol('v')).subs(Symbol('v'), 3*nsimplify(b)), 0), x)[0]

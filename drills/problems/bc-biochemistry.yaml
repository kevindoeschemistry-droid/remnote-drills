    o3: Any reversible step
    o4: The last step always
  - q: 'Living cells are:'
    o1: Open systems held far from equilibrium by energy input
    o2: At equilibrium
    o3: Closed systems
    o4: Isolated
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Homeostasis is a regulated steady state
  verify:

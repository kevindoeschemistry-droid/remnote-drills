- template: bc-mol-clock
  skill: biochem.evolution
  pace: quick
  given:
    d:
      pick:
      - 2
      - 6
      - 10
    r:
      pick:
      - 1
      - 2
  prompt: Two species' orthologous gene differs at {{d}}% of sites, and substitutions accumulate at {{r}} × 10⁻⁹ per site per year in each lineage. How long ago (millions of years) did they diverge?
  parts:
  - ask: Answer
    label: v
    tex: t
    value: (d/100)/(2*r*1e-9)/1e6
    tol: 0.005
    explain: 't = d/(2r): both lineages accumulate changes'
  verify:
    expect:
      v: Rational(d, 100)/(2*r*Rational(1, 10**9))/10**6
- template: bc-mol-clock-2
  skill: biochem.evolution
  pace: quick
  cases:
  - q: Why divide by 2 in t = d/(2r)?
    o1: Substitutions accumulate along both lineages since the split
    o2: To convert units
    o3: It's an error

- template: bc-mass-action
  skill: biochem.evolution
  pace: quick
  given:
    K:
      pick:
      - 1000
      - 0.1
      - 10
    Qv:
      pick:
      - 0.01
      - 1
      - 100
  prompt: For a pathway step, K′ = {{K}} and the measured mass-action ratio Q = {{Qv}} at 310 K. What is ΔG (kJ/mol)?
  parts:
  - ask: Answer
    label: v
    tex: \Delta G
    value: 8.314462618*310*log(Qv/K)/1000
    tol: 0.005
    explain: 'ΔG = RT ln(Q/K′): a step far from equilibrium is a likely control point'
  verify:
    expect:
      v: Rational('8.314462618')*310*(log(nsimplify(Qv)) - log(nsimplify(K)))/1000

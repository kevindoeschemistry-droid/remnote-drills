- template: bc-yield
  skill: biochem.methods
  pace: quick
  given:
    u0:
      pick:
      - 10000
      - 20000
    u1:
      pick:
      - 2000
      - 4000
      - 6000
  prompt: Starting with {{u0}} enzyme units, {{u1}} units remain after purification. What is the yield (%)?
  parts:

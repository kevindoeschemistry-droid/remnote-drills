- template: ch-inverse-square
  skill: gchem.measurement
  pace: quick
  given:
    d1:
      pick:
      - 40
      - 100
      - 400
    r1:
      pick:
      - 0.5
      - 1
    r2:
      pick:
      - 2
      - 3
      - 4
  prompt: A point source gives {{d1}} µSv/h at {{r1}} m. What is the dose rate at {{r2}} m?
  parts:
  - ask: Answer
    label: v
    tex: \dot D
    value: d1*(r1/r2)^2
    tol: 0.005
    explain: 'Intensity spreads over 4πr²: doubling the distance quarters the dose rate'
  verify:
    expect:
      v: d1*(nsimplify(r1)/r2)**2
- template: ch-half-value-layers
  skill: gchem.measurement
  pace: quick
  given:
    d0:
      pick:
      - 80
      - 200
    hvl:
      pick:
      - 0.5
      - 1
      - 2
    t:
      pick:
      - 0.5
      - 2
    x:
      pick:
      - 1
      - 2
      - 4
  prompt: A source gives {{d0}} µSv/h unshielded. The shield's half-value layer is {{hvl}} cm. What dose do you receive in {{t}} h behind {{x}} cm of it?
  parts:
  - ask: Answer
    label: v
    tex: D
    value: d0*0.5^(x/hvl)*t
    tol: 0.005
    explain: Each half-value layer halves the rate; dose = rate × time (time, distance, shielding)
  verify:
    expect:
      v: d0*Rational(1, 2)**(x/nsimplify(hvl))*nsimplify(t)

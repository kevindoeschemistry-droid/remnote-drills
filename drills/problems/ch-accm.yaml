# Generated by scripts/second_types.py from scripts/second_specs/accm_gen.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: ch-atoms-in-a-line
  skill: gchem.composition
  pace: quick
  given:
    d:
      pick:
      - 100
      - 150
      - 250
      - 300
    L:
      pick:
      - 1
      - 5
      - 10
  prompt: Atoms {{d}} pm across are lined up touching. How many fit in {{L}} mm?
  parts:
  - ask: Answer
    label: v
    tex: N
    value: L*1e-3/(d*1e-12)
    tol: 0.005
    explain: 'Convert both lengths to metres and divide: 1 mm ÷ 100 pm = 10⁷ atoms'
  verify:
    expect:
      v: L*Rational(1, 1000)/(d*Rational(1, 10**12))
- template: ch-mole-of-marbles
  skill: gchem.composition
  pace: quick
  given:
    dm:
      pick:
      - 1
      - 5
      - 10
  prompt: If each atom in a mole were a marble {{dm}} mm across, packed in a cube, how long would the cube's edge be, in km?
  parts:
  - ask: Answer
    label: v
    tex: L
    value: (6.02214076e23)^(1/3)*dm*1e-6
    tol: 0.005
    explain: Edge = N_A^(1/3) marbles ≈ 8.4 × 10⁷ marbles; a mole of anything visible is enormous
  verify:
    expect:
      v: c_NA**Rational(1, 3)*dm*Rational(1, 10**6)
- template: ch-metal-from-ore
  skill: gchem.stoichiometry
  pace: quick
  cases:
  - mineral: Fe₂O₃
    el: iron
    nFe: 2
    nO: 3
    w: 60
    m: 1000
  - mineral: Fe₃O₄
    el: iron
    nFe: 3
    nO: 4
    w: 45
    m: 500
  - mineral: Fe₂O₃
    el: iron
    nFe: 2
    nO: 3
    w: 80
    m: 250
  prompt: An ore is {{w}}% {{mineral}} by mass. What mass of {{el}} (kg) is in {{m}} kg of ore?
  parts:
  - ask: Answer
    label: v
    tex: m_{Fe}
    value: m*w/100*nFe*55.845/(nFe*55.845 + nO*15.999)
    tol: 0.005
    explain: Mass fraction of Fe in the mineral × mineral mass
  verify:
    expect:
      v: m*Rational(w, 100)*nFe*Rational('55.845')/(nFe*Rational('55.845') + nO*Rational('15.999'))
- template: ch-ore-needed
  skill: gchem.stoichiometry
  pace: quick
  given:
    w:
      pick:
      - 40
      - 75
      - 90
    mc:
      pick:
      - 10
      - 100
  prompt: How many kg of ore that is {{w}}% CaCO₃ must be mined to supply {{mc}} kg of calcium?
  parts:
  - ask: Answer
    label: v
    tex: m
    value: mc*(40.078 + 12.011 + 3*15.999)/40.078/(w/100)
    tol: 0.005
    explain: 'Reverse the chain: calcium → CaCO₃ by the mass ratio, then divide by the ore''s purity'
  verify:
    expect:
      v: mc*(Rational('40.078') + Rational('12.011') + 3*Rational('15.999'))/Rational('40.078')/Rational(w, 100)
- template: ch-surface-area-cut
  skill: gchem.kinetics
  pace: quick
  given:
    L:
      pick:
      - 1
      - 2
      - 4
    l:
      pick:
      - 0.1
      - 0.01
  prompt: A cube {{L}} cm on a side is cut into cubes {{l}} cm on a side. By what factor does the total surface area grow?
  parts:
  - ask: Answer
    label: v
    tex: \times
    value: L/l
    tol: 0.005
    explain: '(L/l)³ small cubes, each 6l²: total 6L²·(L/l), so the area grows by L/l'
  verify:
    expect:
      v: 6*(L/nsimplify(l))**3*nsimplify(l)**2/(6*L**2)
- template: ch-surface-area-facts
  skill: gchem.kinetics
  pace: quick
  cases:
  - q: Why does powdered zinc react faster with acid than a single lump of equal mass?
    o1: More atoms are exposed at the surface where acid can collide with them
    o2: Powder has a lower activation energy
    o3: Powder is at a higher temperature
    o4: The equilibrium constant is larger
  - q: Which change does not speed up a reaction between a gas and a solid catalyst?
    o1: Using larger catalyst pellets of the same total mass
    o2: Grinding the catalyst finer
    o3: Raising the temperature
    o4: Raising the gas pressure
  - q: Why can flour dust explode in a mill when a sack of flour only burns slowly?
    o1: Fine dust exposes vastly more surface to oxygen
    o2: Dust has a different chemical formula
    o3: Dust contains its own oxidiser
    o4: Dust has a lower heat of combustion
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: A reaction at a surface goes as fast as collisions with that surface allow
  verify:
    authored: true
- template: ch-fraction-bound
  skill: gchem.equilibrium
  pace: quick
  given:
    Kd:
      pick:
      - 0.5
      - 2
      - 10
    L:
      pick:
      - 0.5
      - 2
      - 20
  prompt: A protein binds its ligand with K_d = {{Kd}} µM. With free ligand at {{L}} µM, what fraction of the protein is bound?
  parts:
  - ask: Answer
    label: v
    tex: \theta
    value: L/(Kd + L)
    tol: 0.005
    explain: 'K_d[PL] = [P][L] with [P] = 1 − [PL] (as fractions): θ = [L]/(K_d + [L])'
  verify:
    expect:
      v: solve(Eq(nsimplify(Kd)*Symbol('PL'), (1 - Symbol('PL'))*nsimplify(L)), Symbol('PL'))[0]
- template: ch-ligand-for-fraction
  skill: gchem.equilibrium
  pace: quick
  given:
    Kd:
      pick:
      - 1
      - 5
      - 50
    pct:
      pick:
      - 50
      - 90
      - 99
  prompt: K_d = {{Kd}} nM. What free ligand concentration (nM) makes the protein {{pct}}% bound?
  parts:
  - ask: Answer
    label: v
    tex: '[L]'
    value: Kd*(pct/100)/(1 - pct/100)
    tol: 0.005
    explain: 'Invert θ = L/(K_d + L): L = K_d θ/(1 − θ); 90% bound needs 9 K_d'
  verify:
    expect:
      v: solve(Eq(Symbol('LL')/(Kd + Symbol('LL')), Rational(pct, 100)), Symbol('LL'))[0]
- template: ch-error-type
  skill: gchem.measurement
  pace: quick
  cases:
  - q: The balance reads 0.012 g with nothing on it, and nobody zeroed it. What kind of error results?
    o1: 'Systematic: every mass reads high'
    o2: 'Random: masses scatter both ways'
    o3: 'No error: it cancels in a mass'
    o4: A blunder that cannot be detected
  - q: Readings of a burette at the meniscus vary slightly from trial to trial. What kind of error is that?
    o1: Random
    o2: Systematic, always high
    o3: Systematic, always low
    o4: Gross error
  - q: 'A sample being weighed absorbs water from the air. Its calculated purity will be:'
    o1: Too low, a systematic error
    o2: Too high, a systematic error
    o3: Unaffected
    o4: Scattered at random
  - q: Which step removes a systematic error from a reagent's own absorbance?
    o1: Running a reagent blank
    o2: Doing more replicates
    o3: Averaging more readings
    o4: Reporting more significant figures
  - q: Which step reduces random error in a mean?
    o1: More replicate measurements
    o2: A reagent blank
    o3: Recalibrating once
    o4: Using a different unit
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Systematic errors bias every result the same way and need a blank or calibration; random errors average down
  verify:
    authored: true
- template: ch-systematic-direction
  skill: gchem.measurement
  pace: quick
  given:
    m:
      pick:
      - 1.0
      - 2.0
    'off':
      pick:
      - 0.01
      - 0.05
    a:
      pick:
      - 0.25
      - 0.4
  prompt: A sample's true mass is {{m}} g, but the balance reads {{off}} g high on every weighing. If the percent of analyte is found as (analyte mass ÷ sample mass) and the analyte mass is measured correctly at {{a}} g, what percent is reported?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*a/(m + off)
    tol: 0.005
    explain: The inflated denominator biases the percent low, the same way every time
  verify:
    expect:
      v: 100*nsimplify(a)/(nsimplify(m) + nsimplify(off))

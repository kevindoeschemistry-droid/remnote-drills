    o1: Cost leadership, acting on inbound and outbound logistics
    o2: Differentiation
    o3: Focus
    o4: None of them
  - q: 'A configurator that lets customers design their own product supports:'
    o1: Differentiation, acting on marketing and sales
    o2: Cost leadership
    o3: Focus
    o4: Vertical integration
  - q: 'A system serving one narrow customer segment very well supports:'
    o1: A focus strategy
    o2: Cost leadership
    o3: Differentiation across all segments
    o4: Diversification
  - q: A system that reduces procurement cost acts on which value-chain activity?
    o1: Procurement, a support activity
    o2: Operations
    o3: Service
    o4: Marketing and sales
  - q: 'A field-service app that shortens repair turnaround acts on:'
    o1: Service, a primary activity
    o2: Procurement
    o3: Technology development
    o4: Human resource management
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: 'Strategy first, then which activity the system actually changes: the pairing is what tells you whether a project supports the strategy the firm claims'
  verify:
    authored: true

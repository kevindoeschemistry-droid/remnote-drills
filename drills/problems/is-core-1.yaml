  pace: quick
  cases:
  - tp: 120
    gp: 400
    fp: 300
    cp: 50
  - tp: 40
    gp: 2500
    fp: 160
    cp: 300
  - tp: 900
    gp: 80
    fp: 2500
    cp: 15
  - tp: 25
    gp: 10000
    fp: 75
    cp: 1200
  prompt: 'A classifier flags accounts: {{tp}} true positives worth {{gp}} each saved, {{fp}} false positives costing {{cp}} each. What is the expected profit?'
  parts:
  - ask: Answer
    label: v
    tex: profit
    value: tp*gp - fp*cp
    final: true
    tol: 0.0001
    explain: A model is worth using only when the value of its true positives beats the cost of its false ones, which is why the threshold is set from these costs rather than from accuracy
  verify:
    expect:
      v: tp*gp - fp*cp
- template: is-threshold-breakeven
  skill: is.data
  pace: quick
  given:
    gp:
      pick:
      - 400
      - 2500
      - 80
      - 10000
    cp:
      pick:
      - 50
      - 300
      - 15
      - 1200
  prompt: With a gain of {{gp}} per true positive and a cost of {{cp}} per false positive, what precision does a campaign need to break even (per cent)?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*cp/(cp + gp)
    tol: 0.005
    explain: 'The breakeven precision follows from the two costs alone, so a cheap intervention on a valuable save is worth running at very low precision: that is the calculation that decides where to set the threshold'
  verify:
    expect:
      v: 100*Rational(cp, cp + gp)

      - 90
      - 600
    nd:
      pick:
      - 2
      - 45
      - 300
  require:
  - nb < nr
  prompt: A table of {{nr}} rows has {{nb}} rows with a blank required field, {{ni}} with an invalid value and {{nd}} duplicates. What is its completeness (per cent)?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(nr - nb)/nr

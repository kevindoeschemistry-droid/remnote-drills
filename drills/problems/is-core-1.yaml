- template: is-critical-path
  skill: is.development
  pace: quick
  given:
    a:
      pick:
      - 2
      - 5
      - 8
    b:
      pick:
      - 3
      - 7
      - 12
    c:
      pick:
      - 4
      - 9
      - 15
    d:
      pick:
      - 1
      - 6
      - 10
  prompt: Activities A ({{a}} days) then B ({{b}}) then D ({{d}}) run in parallel with A then C ({{c}}) then D. What is the project duration (days)?
  parts:
  - ask: Answer
    label: v
    tex: days
    value: a + max(b, c) + d
    final: true
    tol: 0.0001
    explain: 'The duration follows the longest path, so shortening the shorter branch changes nothing: that is what slack means, and why crashing the wrong activity buys no time'
  verify:
    expect:
      v: a + Max(b, c) + d
- template: is-slack
  skill: is.development
  pace: quick
  given:
    b:
      pick:
      - 3
      - 7
      - 12
    c:
      pick:
      - 4
      - 9
      - 15
  require:
  - b != c
  prompt: On the same network, how much slack does the shorter of the two parallel branches have (days)?
  parts:
  - ask: Answer
    label: v
    tex: days
    value: abs(b - c)
    final: true
    tol: 0.0001
    explain: Slack is how much an activity can slip before it joins the critical path; an activity with zero slack is on it, and a network where almost everything has zero slack has no room anywhere
  verify:
    expect:
      v: Abs(b - c)

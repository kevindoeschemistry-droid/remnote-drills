- template: is-hub-links
  skill: is.architecture
  pace: quick
  given:
    nn:
      pick:
      - 4
      - 6
      - 10
      - 15
  prompt: Connecting {{nn}} systems point to point needs how many more links than connecting each to one hub?
  parts:
  - ask: Answer
    label: v
    tex: links
    value: nn*(nn - 1)/2 - nn
    final: true
    tol: 0.0001
    explain: Point-to-point links grow as the square and hub links linearly, which is the whole argument for a broker or a bus; the hub's cost is that it becomes a single point of failure and a bottleneck for change
  verify:
    expect:
      v: Rational(nn*(nn - 1), 2) - nn

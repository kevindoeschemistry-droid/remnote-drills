      - 10
      - 40
  prompt: A canary release goes to {{cp}} per cent of {{nu}} users. If the defect rate is {{dr}} per thousand users, how many users does the canary expose?
  parts:
  - ask: Answer
    label: v
    tex: users
    value: nu*cp/100*dr/1000
    tol: 0.005
    explain: 'The exposure is the whole point of a canary: the same defect at full release hits a hundred times as many people, and the canary''s cost is the delay'
  verify:
    expect:
      v: Rational(nu*cp, 100)*Rational(dr, 1000)
- template: is-conceptual-first
  skill: is.data
  pace: recall
  cases:
  - q: 'A conceptual model is written before the technology because:'
    o1: The entities and relationships are a property of the domain, not of the database
    o2: It is quicker
    o3: It is required by standards
    o4: It fixes the data types
  - q: 'Choosing the database first tends to produce:'
    o1: A model shaped by the tool's limits rather than by the domain
    o2: A faster project
    o3: A better model
    o4: No difference
  - q: 'A logical model adds:'
    o1: Keys, attributes and types, still independent of a product
    o2: Indexes and partitions
    o3: Storage layout
    o4: Access control
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Three levels, and skipping the conceptual one is how a schema ends up describing the tool instead of the business
  verify:
    authored: true
- template: is-steward-load
  skill: is.data
  pace: quick
  given:
    nd:
      pick:
      - 20
      - 60
      - 140
    nst:
      pick:
      - 3
      - 8
      - 20
    cap:
      pick:
      - 2
      - 4
  require:
  - nst*cap < nd
  prompt: A programme has {{nd}} data domains and {{nst}} stewards, each able to maintain {{cap}} domains properly. How many domains go unstewarded?
  parts:
  - ask: Answer
    label: v
    tex: domains
    value: nd - nst*cap
    final: true
    tol: 0.0001
    explain: 'Stewardship fails by arithmetic more often than by design: naming a steward for forty domains with eight people is a plan to steward sixteen of them'
  verify:
    expect:
      v: nd - nst*cap
- template: is-fact-rows
  skill: is.data
  pace: quick
  given:
    nl:
      pick:
      - 12000
      - 250000
      - 1800000
    yr:
      pick:
      - 3
      - 5
      - 10
  prompt: A fact table at one row per order line grows by {{nl}} lines a day. How many rows after {{yr}} years?
  parts:
  - ask: Answer
    label: v
    tex: rows
    value: nl*365*yr
    final: true
    tol: 0.0001
    explain: Declaring the grain also declares the growth rate, which is what decides partitioning and whether the grain is affordable at all
  verify:
    expect:
      v: nl*365*yr
- template: is-scd2-rows
  skill: is.data
  pace: quick
  given:
    nr:
      pick:
      - 5000
      - 80000
      - 500000
    nc:
      pick:
      - 1
      - 3
      - 8
    yr:
      pick:
      - 3
      - 5
      - 10
  prompt: A Type 2 dimension of {{nr}} members sees {{nc}} attribute changes a year each. How many rows after {{yr}} years?
  parts:
  - ask: Answer
    label: v
    tex: rows
    value: nr*(1 + nc*yr)
    final: true
    tol: 0.0001
    explain: 'Type 2''s cost is this row growth, which is the honest comparison against Type 1''s loss of history: a volatile attribute on a large dimension can dominate the warehouse'
  verify:
    expect:
      v: nr*(1 + nc*yr)
- template: is-latency-budget
  skill: is.data
  pace: quick
  given:
    bd:
      pick:
      - 15
      - 60
      - 240
    t1:
      pick:
      - 2
      - 10
      - 45
    t2:
      pick:
      - 3
      - 20
      - 90
    t3:
      pick:
      - 1
      - 8
      - 30
  prompt: A pipeline must deliver within {{bd}} minutes. Extraction takes {{t1}}, transformation {{t2}} and load {{t3}} minutes. How much headroom is left?
  parts:
  - ask: Answer
    label: v
    tex: min
    value: bd - t1 - t2 - t3
    final: true
    tol: 0.0001
    explain: 'A negative headroom says the architecture cannot meet the requirement, however it is tuned: that is the calculation that forces the move from batch to streaming'
  verify:
    expect:
      v: bd - t1 - t2 - t3
- template: is-join-rows
  skill: is.data
  pace: quick
  given:
    nf:
      pick:
      - 50000
      - 400000
      - 3000000
    nd:
      pick:
      - 120
      - 3500
      - 90000
  prompt: A fact table of {{nf}} rows joins a dimension of {{nd}} rows on its key. How many rows does the inner join return, if every fact matches exactly one dimension row?
  parts:
  - ask: Answer
    label: v
    tex: rows
    value: nf
    final: true
    tol: 0.0001
    explain: 'A conformed-dimension join preserves the fact row count, which is the check that catches a duplicated dimension key: a join that returns more rows than the fact table has a cardinality bug'
  verify:
    expect:
      v: nf
- template: is-dashboard-decisions
  skill: is.data
  pace: quick
  given:
    nm:
      pick:
      - 12
      - 30
      - 75
    na:
      pick:
      - 2
      - 6
      - 15
  require:
  - na < nm
  prompt: A dashboard shows {{nm}} metrics of which {{na}} are acted on. What percentage is reporting rather than management?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(nm - na)/nm
    tol: 0.005
    explain: A dashboard's value is in the metrics someone changes behaviour over; the rest costs attention every time it is looked at
  verify:
    expect:
      v: 100*Rational(nm - na, nm)
- template: is-kpi-target-gap
  skill: is.data
  pace: quick
  given:
    cv:
      pick:
      - 62
      - 3.4
      - 180
    tv:
      pick:
      - 85
      - 5.0
      - 240
    mv:
      pick:
      - 1.5
      - 0.2
      - 8
  require:
  - tv > cv
  prompt: A KPI stands at {{cv}} against a target of {{tv}} and has moved {{mv}} per period. How many periods to the target?
  parts:
  - ask: Answer
    label: v
    tex: periods
    value: (tv - cv)/mv
    tol: 0.005
    explain: 'A target with no arrival date is not a target: this arithmetic is what turns a KPI into a commitment, and it often shows the target is unreachable at the current rate'
  verify:
    expect:
      v: (nsimplify(tv) - nsimplify(cv))/nsimplify(mv)

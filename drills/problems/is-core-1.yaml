- template: is-npv-project
  skill: is.strategy
  pace: quick
  given:
    k0:
      pick:
      - 200
      - 800
      - 2500
    cf:
      pick:
      - 60
      - 250
      - 700
    ny:
      pick:
      - 3
      - 5
      - 7
    dr:
      pick:
      - 6
      - 10
      - 15
  prompt: A project costs {{k0}} thousand now and returns {{cf}} thousand a year for {{ny}} years at a discount rate of {{dr}} per cent. What is its net present value (thousand)?
  parts:
  - ask: Answer
    label: v
    tex: thousand
    value: cf*(1 - (1 + dr/100)^(-ny))/(dr/100) - k0
    tol: 0.005
    explain: The annuity factor discounts a level stream; a positive net present value means the project beats the firm's own cost of capital, which is the only question the number answers
  verify:
    expect:
      v: nsimplify(cf)*(1 - (1 + Rational(dr, 100))**(-ny))/Rational(dr, 100) - nsimplify(k0)
- template: is-payback-roi
  skill: is.strategy
  pace: quick
  given:
    k0:
      pick:
      - 200
      - 800
      - 2500
    cf:
      pick:
      - 60
      - 250
      - 700
    ny:
      pick:
      - 3
      - 5
      - 7
  prompt: The same project, {{k0}} thousand against {{cf}} thousand a year for {{ny}} years. What is its simple return on investment (per cent of the outlay, over the whole life)?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(cf*ny - k0)/k0
    tol: 0.005
    explain: 'Simple return on investment ignores timing entirely, which is why it can rank a project above one with a higher net present value: it is a screen, not a decision'
  verify:
    expect:
      v: 100*Rational(cf*ny - k0, k0)
- template: is-tco-saas
  skill: is.strategy
  pace: quick
  given:
    ny:
      pick:
      - 3
      - 5
      - 7
    sm:
      pick:
      - 60
      - 120
      - 300
    bc:
      pick:
      - 250
      - 600
      - 1500
    bm:
      pick:
      - 30
      - 80
      - 150
  prompt: Over {{ny}} years, SaaS costs {{sm}} thousand a year. A build costs {{bc}} thousand up front plus {{bm}} thousand a year to run. Which is cheaper, and by how much (thousand)?
  parts:
  - ask: Answer
    label: v
    tex: thousand
    value: abs(sm*ny - (bc + bm*ny))
    tol: 0.005
    explain: 'The horizon decides it: a build''s up-front cost is amortised over more years, so the longer the horizon the better it looks, which is why the horizon is argued over more than the numbers'
  verify:
    expect:
      v: Abs(nsimplify(sm)*ny - (nsimplify(bc) + nsimplify(bm)*ny))
- template: is-tco-breakeven
  skill: is.strategy
  pace: quick
  given:
    sm:
      pick:
      - 60
      - 120
      - 300
    bc:
      pick:
      - 250
      - 600
      - 1500
    bm:
      pick:
      - 30
      - 80
      - 150
  require:
  - sm > bm
  prompt: At what horizon (years) do SaaS at {{sm}} thousand a year and a build at {{bc}} thousand up front plus {{bm}} thousand a year cost the same?
  parts:
  - ask: Answer
    label: v
    tex: years
    value: bc/(sm - bm)
    tol: 0.005
    explain: 'The crossover year is the honest way to present the comparison, because it makes the assumption visible: below it SaaS wins, above it the build does, and nobody has to argue about a single horizon'
  verify:
    expect:
      v: nsimplify(bc)/(nsimplify(sm) - nsimplify(bm))
- template: is-weighted-score
  skill: is.strategy
  pace: quick
  cases:
  - w1: 50
    w2: 30
    w3: 20
    s1: 8
    s2: 5
    s3: 9
  - w1: 40
    w2: 40
    w3: 20
    s1: 6
    s2: 9
    s3: 4
  - w1: 60
    w2: 25
    w3: 15
    s1: 7
    s2: 3
    s3: 10
  - w1: 30
    w2: 50
    w3: 20
    s1: 9
    s2: 6
    s3: 7
  prompt: Three criteria weigh {{w1}}, {{w2}} and {{w3}} per cent. A project scores {{s1}}, {{s2}} and {{s3}} out of 10. What is its weighted score out of 10?
  parts:
  - ask: Answer
    label: v
    tex: score
    value: (w1*s1 + w2*s2 + w3*s3)/100
    tol: 0.005
    explain: 'A weighted model makes the trade-off explicit, which is its only real benefit: the weights are the decision and the scores are evidence, so the weights are agreed before the scores are seen'
  verify:
    expect:
      v: Rational(w1*s1 + w2*s2 + w3*s3, 100)
- template: is-budget-pick
  skill: is.strategy
  pace: quick
  cases:
  - c1: 300
    c2: 450
    c3: 200
    v1: 7.2
    v2: 8.1
    v3: 5.4
    bg: 650
  - c1: 150
    c2: 500
    c3: 400
    v1: 6.0
    v2: 9.0
    v3: 7.5
    bg: 600
  - c1: 250
    c2: 250
    c3: 250
    v1: 8.0
    v2: 6.5
    v3: 7.0
    bg: 500
  prompt: Projects cost {{c1}}, {{c2}} and {{c3}} thousand with weighted scores {{v1}}, {{v2}} and {{v3}}. Under a budget of {{bg}} thousand, what is the highest total score obtainable?
  parts:
  - ask: Answer
    label: v
    tex: score
    value: 'max(c1 + c2 <= bg ? v1 + v2 : 0, max(c1 + c3 <= bg ? v1 + v3 : 0, max(c2 + c3 <= bg ? v2 + v3 : 0, max(c1 <= bg ? v1 : 0, max(c2 <= bg ? v2 : 0, c3 <= bg ? v3 : 0)))))'
    tol: 0.005
    explain: Ranking by score alone overspends; ranking by score per unit cost is a good heuristic but not always optimal, which is why a small portfolio is worth enumerating
  verify:
    expect:
      v: Max(nsimplify(v1) + nsimplify(v2) if c1 + c2 <= bg else 0, nsimplify(v1) + nsimplify(v3) if c1 + c3 <= bg else 0, nsimplify(v2) + nsimplify(v3) if c2 + c3 <= bg else 0, nsimplify(v1) if c1 <= bg else 0, nsimplify(v2) if c2 <= bg else 0, nsimplify(v3) if c3 <= bg else 0)

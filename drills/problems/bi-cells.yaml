# AP Biology units 1 and 2 (chemistry of life, cell structure and function), also used by the DAT.
# One question each. Numbers (polymer water counts, Chargaff, SA/V, water potential) are recomputed by sympy.

# ── water and macromolecules ───────────────────────────────────────────────
- template: bi-water-interaction
  skill: bio.molecules
  pace: recall
  cases:
    - { q: 'two water molecules', ans: 0 }
    - { q: 'water and a dissolved Na⁺ ion', ans: 1 }
    - { q: 'water and a dissolved Cl⁻ ion', ans: 2 }
    - { q: 'water and the O–H of glucose', ans: 0 }
    - { q: 'water and a long hydrocarbon chain', ans: 3 }
  prompt: 'What holds {{q}} together, if anything?'
  parts:
    - ask: 'Interaction'
      label: a
      choice: ["Hydrogen bonds (partial-positive H to partial-negative O or N)", "Water's partly negative oxygen faces the cation", "Water's partly positive hydrogens face the anion", "Nothing strong: water excludes it (hydrophobic)"]
      correct: ans
      explain: 'Oxygen pulls electrons from hydrogen, so water is polar: δ− at O, δ+ at each H. That lets it hydrogen bond to itself and to polar groups and surround ions. Nonpolar chains offer no partial charges, so water molecules H-bond to each other instead and push the chains together'
  verify: { authored: true }

- template: bi-water-property
  skill: bio.molecules
  pace: recall
  cases:
    - { q: 'Water rises up the narrow xylem vessels of a tall tree.', ans: 0 }
    - { q: 'Sweating cools the body.', ans: 1 }
    - { q: 'Coastal and lake temperatures change slowly through the seasons.', ans: 2 }
    - { q: 'Fish survive winter under a frozen pond surface.', ans: 3 }
    - { q: 'Salts, sugars and amino acids dissolve in cytoplasm.', ans: 4 }
    - { q: 'An insect can stand on a pond surface.', ans: 0 }
  prompt: '{{q}} Which property of water explains it?'
  parts:
    - ask: 'Property'
      label: a
      choice: ["Cohesion and adhesion (surface tension, capillary action)", "High heat of vaporization", "High specific heat", "Ice is less dense than liquid water", "Water dissolves polar and ionic substances"]
      correct: ans
      explain: 'Every one traces back to hydrogen bonding: H-bonds hold molecules to each other (cohesion) and to polar surfaces (adhesion), absorb heat before molecules speed up (specific heat) or escape (vaporization), and lock ice into an open lattice that floats'
  verify: { authored: true }

- template: bi-macromolecule-elements
  skill: bio.molecules
  pace: recall
  cases:
    - { q: 'contains sulfur in some of its monomers', ans: 0 }
    - { q: 'has phosphorus in its backbone', ans: 1 }
    - { q: 'contains only C, H and O, roughly in a 1 : 2 : 1 ratio', ans: 2 }
    - { q: 'is made almost entirely of C and H with a little O, and is hydrophobic', ans: 3 }
    - { q: 'contains nitrogen in every monomer and no phosphorus', ans: 0 }
  prompt: 'Which macromolecule class {{q}}?'
  parts:
    - ask: 'Class'
      label: a
      choice: ["Proteins", "Nucleic acids", "Carbohydrates", "Lipids (triglycerides)"]
      correct: ans
      explain: 'All four contain C, H and O. Nitrogen: proteins (amino groups) and nucleic acids (bases). Phosphorus: nucleic acids (phosphate backbone) and phospholipids. Sulfur: proteins only (cysteine, methionine)'
  verify: { authored: true }

- template: bi-radiolabel
  skill: bio.molecules
  pace: recall
  cases:
    - { q: '³⁵S', ans: 0 }
    - { q: '³²P', ans: 1 }
    - { q: '¹⁵N', ans: 2 }
    - { q: '¹⁴C', ans: 3 }
  prompt: 'Cells are grown with {{q}}. Which macromolecules pick up the label?'
  parts:
    - ask: 'Labelled'
      label: a
      choice: ["Proteins only", "Nucleic acids (and phospholipids), not proteins", "Proteins and nucleic acids", "All four classes"]
      correct: ans
      explain: 'Follow the element: S is in proteins only, P in nucleic acids and phospholipids, N in proteins and nucleic acids, C everywhere. Hershey and Chase used ³⁵S for phage protein and ³²P for phage DNA, and only the ³²P entered the bacteria'
  verify: { authored: true }

- template: bi-dehydration-hydrolysis
  skill: bio.molecules
  pace: recall
  cases:
    - { q: 'Two glucose molecules join into maltose.', ans: 0 }
    - { q: 'Pepsin breaks a protein into peptides in the stomach.', ans: 1 }
    - { q: 'A ribosome links an amino acid to a growing chain.', ans: 0 }
    - { q: 'Lipase splits a triglyceride into glycerol and fatty acids.', ans: 1 }
    - { q: 'Glycogen is broken down to release glucose.', ans: 1 }
    - { q: 'DNA polymerase adds a nucleotide to a strand.', ans: 0 }
  prompt: '{{q}} Which reaction is this?'
  parts:
    - ask: 'Reaction'
      label: a
      choice: ["Dehydration synthesis: a bond forms and water is released", "Hydrolysis: water is used to break a bond"]
      correct: ans
      explain: 'Polymers are built by removing an –OH from one monomer and an –H from the next (dehydration) and broken by adding water back across the bond (hydrolysis). Building takes energy; hydrolysis releases it'
  verify: { authored: true }

- template: bi-polymer-water
  skill: bio.molecules
  pace: quick
  given: { n: { pick: [5, 12, 20, 50, 100, 300] }, w: { pick: [0, 1] } }
  prompt: '{{w == 0 ? "How many water molecules are released when" : "How many water molecules are used up when"}} ${{n}}$ monomers are {{w == 0 ? "joined into" : "cut out of"}} one linear chain?'
  parts:
    - { ask: 'Water molecules', label: r, value: n - 1, tol: 0.0001, explain: 'A linear chain of $n$ monomers has $n - 1$ links, one water per link: $ {{n}} - 1 = {{n - 1}}$. A triglyceride (glycerol plus three fatty acids) has three ester links, so three waters' }
  verify: { expect: { r: "n - 1" } }


- template: bi-cell-wall
  skill: bio.cells
  pace: recall
  cases:
    - { q: 'plants', ans: 0 }
    - { q: 'fungi', ans: 1 }
    - { q: 'bacteria', ans: 2 }
    - { q: 'animals', ans: 3 }
  prompt: 'What is the cell wall of {{q}} made of?'
  parts:
    - ask: 'Wall'
      label: a
      choice: ["Cellulose", "Chitin", "Peptidoglycan", "No cell wall"]
      correct: ans
      explain: 'A wall resists the pressure of water rushing into a cell kept hypertonic to its surroundings, so the cell becomes turgid instead of bursting. Animal cells lack walls and must control water balance in other ways; penicillin kills bacteria by blocking peptidoglycan synthesis'
  verify: { authored: true }

- template: bi-passive-active
  skill: bio.cells
  pace: recall
  cases:

# ── cell structure ─────────────────────────────────────────────────────────
- template: bi-ribosome-ancestry
  skill: bio.cells
  pace: recall
  cases:
    - { q: 'What are ribosomes made of?', o1: 'rRNA and protein, with no membrane', o2: 'A phospholipid membrane around DNA', o3: 'Only protein', ans: 0 }
    - { q: 'Which cells have ribosomes?', o1: 'Only eukaryotic cells', o2: 'Every cell, prokaryote and eukaryote', o3: 'Only cells that secrete proteins', ans: 1 }
    - { q: 'What does the universal presence of ribosomes suggest?', o1: 'Convergent evolution', o2: 'Recent horizontal gene transfer', o3: 'All life shares a common ancestor', ans: 2 }
  prompt: '{{q}}'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}"]
      correct: ans
      explain: 'Ribosomes are rRNA–protein machines that translate mRNA in every living cell, with the same genetic code. A structure that complex and universal points to one origin rather than many'
  verify: { authored: true }

- template: bi-organelle-function
  skill: bio.cells
  pace: recall
  cases:
    - { q: 'Makes proteins for secretion or for membranes', ans: 0 }
    - { q: 'Makes lipids and detoxifies drugs; stores Ca²⁺ in muscle', ans: 1 }
    - { q: 'Modifies, sorts and packages proteins into vesicles', ans: 2 }
    - { q: 'Site of aerobic respiration', ans: 3 }
    - { q: 'Digests worn-out parts and engulfed material with hydrolytic enzymes', ans: 4 }
    - { q: 'Stores water and keeps a plant cell turgid', ans: 5 }
    - { q: 'Site of photosynthesis', ans: 6 }
  prompt: 'Which organelle: {{q}}?'
  parts:
    - ask: 'Organelle'
      label: a
      choice: ["Rough ER", "Smooth ER", "Golgi apparatus", "Mitochondrion", "Lysosome", "Central vacuole", "Chloroplast"]
      correct: ans
      explain: 'The rough ER is studded with ribosomes; the smooth ER has none and handles lipids and detox. The Golgi is the shipping center. Mitochondria and chloroplasts transform energy; lysosomes and vacuoles digest and store'
  verify: { authored: true }

- template: bi-secretory-pathway
  skill: bio.cells
  pace: quick
  cases:
    - { q: 'A ribosome makes a protein with an ER signal sequence. Where does the protein go first?', o1: 'Into the rough ER lumen', o2: 'Straight to the Golgi', o3: 'Into a lysosome', o4: 'Into the nucleus', ans: 0 }
    - { q: 'After the rough ER, the protein travels to', o1: 'the plasma membrane directly', o2: 'the Golgi, in a transport vesicle', o3: 'the mitochondrion', o4: 'the smooth ER', ans: 1 }
    - { q: 'After the Golgi, a secreted protein travels', o1: 'back to the nucleus', o2: 'into the cytosol', o3: 'in a secretory vesicle that fuses with the plasma membrane', o4: 'to a ribosome', ans: 2 }
    - { q: 'Which organelle adds most sugar tags and sorts proteins to their destinations?', o1: 'Lysosome', o2: 'Smooth ER', o3: 'Nucleus', o4: 'Golgi apparatus', ans: 3 }
  prompt: '{{q}}'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"]
      correct: ans
      explain: 'Secretory route: ribosome on rough ER → ER lumen (folding, first glycosylation) → transport vesicle → Golgi (cis to trans: modification, sorting) → secretory vesicle → exocytosis at the plasma membrane'
  verify: { authored: true }


- template: bi-lipid-types
  skill: bio.molecules
  pace: recall
  cases:
    - { q: 'Solid at room temperature; fatty acid chains with no C=C', ans: 0 }
    - { q: 'Liquid at room temperature; kinked chains with cis C=C bonds', ans: 1 }
    - { q: 'A hydrophilic phosphate head and two hydrophobic tails', ans: 2 }
    - { q: 'Four fused carbon rings', ans: 3 }
    - { q: 'Main lipid of the plasma membrane bilayer', ans: 2 }
    - { q: 'Cholesterol, testosterone and estrogen', ans: 3 }
  prompt: 'Which lipid fits: {{q}}?'
  parts:
    - ask: 'Lipid'
      label: a
      choice: ["Saturated fat", "Unsaturated fat (oil)", "Phospholipid", "Steroid"]
      correct: ans
      explain: 'Straight saturated chains pack tightly (solid); cis double bonds kink chains so they pack loosely (liquid). A phospholipid is amphipathic and forms bilayers. Steroids are ring systems, not chains'
  verify: { authored: true }

- template: bi-polysaccharide
  skill: bio.molecules
  pace: recall
  cases:
    - { q: 'cellulose', ans: 0 }
    - { q: 'amylose (starch)', ans: 1 }
    - { q: 'glycogen', ans: 2 }
    - { q: 'chitin', ans: 3 }
  prompt: 'Which description fits {{q}}?'
  parts:
    - ask: 'Description'
      label: a
      choice: ["β-1,4 glucose, straight unbranched chains in H-bonded fibres: plant wall", "α-1,4 glucose, helical, little branching: plant storage", "α-1,4 glucose with frequent α-1,6 branches: animal storage", "β-1,4 N-acetylglucosamine: fungal walls and insect exoskeletons"]
      correct: ans
      explain: 'The linkage decides the job. α links coil and are easy to hydrolyse (storage); β links flip each unit, giving straight chains that H-bond side by side into tough fibres (structure). More branches mean more ends to release glucose from quickly'
  verify: { authored: true }

- template: bi-protein-levels
  skill: bio.molecules
  pace: recall
  cases:
    - { q: 'the sequence of amino acids held by peptide bonds', ans: 0 }
    - { q: 'α-helices and β-sheets held by H-bonds between backbone C=O and N–H', ans: 1 }
    - { q: 'the overall 3-D fold held by R-group interactions and disulfide bridges', ans: 2 }
    - { q: 'several polypeptide subunits assembled together, as in hemoglobin', ans: 3 }
    - { q: 'hydrophobic side chains clustering in the core', ans: 2 }
  prompt: 'Which level of protein structure is {{q}}?'
  parts:
    - ask: 'Level'
      label: a
      choice: ["Primary", "Secondary", "Tertiary", "Quaternary"]
      correct: ans
      explain: 'Secondary structure uses the backbone only; tertiary uses side chains (hydrophobic clustering, H-bonds, ionic bonds, disulfides). Denaturation undoes secondary to quaternary structure but leaves the primary sequence intact'
  verify: { authored: true }

- template: bi-monomer-substitution
  skill: bio.molecules
  pace: quick
  cases:
    - { q: 'Glu → Val on the surface of hemoglobin β', o1: 'No effect: both are amino acids', o2: 'A hydrophobic patch makes hemoglobin molecules stick into fibres (sickle cell)', o3: 'The protein cannot be made', ans: 1 }
    - { q: 'Leu → Ile in a buried position', o1: 'Little change: both are nonpolar and similar in size', o2: 'The protein unfolds completely', o3: 'A disulfide bond forms', ans: 0 }
    - { q: 'Cys → Ser where a disulfide bridge forms', o1: 'No change', o2: 'The protein becomes more stable', o3: 'The disulfide is lost and the fold is weakened', ans: 2 }
    - { q: 'Leu → Lys in the hydrophobic core', o1: 'A buried charge destabilises the fold', o2: 'Little change', o3: 'The protein becomes more soluble and works better', ans: 0 }
    - { q: 'α-1,4 linkages replaced by β-1,4 in a glucose polymer', o1: 'It becomes glycogen', o2: 'It becomes a straight, fibrous, hard-to-digest chain like cellulose', o3: 'Nothing changes', ans: 1 }
  prompt: 'Predict the effect of {{q}}.'
  parts:
    - ask: 'Effect'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}"]
      correct: ans
      explain: 'Ask what the swapped unit does in the structure. A similar replacement in a tolerant spot changes little; a change in charge, polarity or bonding at a key spot changes the fold, the interactions and so the function'
  verify: { authored: true }

- template: bi-directionality
  skill: bio.molecules
  pace: recall
  cases:
    - { q: 'DNA polymerase adds nucleotides to which end of a new strand?', o1: 'The 3′ end', o2: 'The 5′ end', o3: 'Either end', ans: 0 }
    - { q: 'Which end of a polypeptide is made first?', o1: 'The C-terminus', o2: 'The N-terminus', o3: 'The middle', ans: 1 }
    - { q: 'In which direction does a ribosome read mRNA?', o1: '3′ to 5′', o2: 'Either way', o3: '5′ to 3′', ans: 2 }
    - { q: 'Why can a new nucleotide join only at the 3′ end?', o1: 'The 3′ –OH attacks the incoming nucleotide''s phosphate', o2: 'The 5′ end has no atoms', o3: 'Enzymes cannot reach the 5′ end', ans: 0 }
  prompt: '{{q}}'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}"]
      correct: ans
      explain: 'Nucleic acids have a 5′ phosphate end and a 3′ hydroxyl end; proteins have an N (amino) end and a C (carboxyl) end. Each link forms from the free –OH or –NH₂ of the chain''s growing end, so polymers grow 5′→3′ and N→C'
  verify: { authored: true }

- template: bi-dna-rna
  skill: bio.molecules
  pace: recall

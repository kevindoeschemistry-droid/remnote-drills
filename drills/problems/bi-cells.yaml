- template: bi-folded-membranes
  skill: bio.cells
  pace: recall
  cases:
    - { q: 'Why is the inner mitochondrial membrane folded into cristae?', ans: 0 }
    - { q: 'Why are thylakoid membranes stacked into grana?', ans: 0 }
    - { q: 'Why does the inner mitochondrial membrane need to be nearly impermeable to H⁺?', ans: 1 }
    - { q: 'Why is the thylakoid space a separate compartment from the stroma?', ans: 1 }
  prompt: '{{q}}'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["More membrane area for electron transport chains and ATP synthase", "So a proton gradient can build across it and drive ATP synthase", "To store DNA", "To keep enzymes out"]
      correct: ans
      explain: 'Electron transport and ATP synthase are membrane proteins, so more membrane means more energy captured. The membrane must also hold H⁺ on one side: the gradient is the stored energy that ATP synthase taps'
  verify: { authored: true }

- template: bi-sa-volume
  skill: bio.cells
  pace: quick
  cases:
    - { sh: 'cube of side', k: 0 }
    - { sh: 'sphere of radius', k: 1 }
  given: { s: { pick: [1, 2, 3, 5, 10] } }
  prompt: 'What is the surface-area-to-volume ratio of a {{sh}} ${{s}}$ μm, in μm⁻¹?'
  parts:
    - { ask: 'SA/V (μm⁻¹)', label: r, value: 'k == 0 ? 6/s : 3/s', tol: 0.001, explain: 'Cube: $6s^2/s^3 = 6/s$. Sphere: $4\pi r^2 / \tfrac43\pi r^3 = 3/r$. The ratio falls as size grows, so a big cell has too little membrane for its volume' }
  verify: { expect: { r: "(6*s**2)/s**3 if k == 0 else (4*pi*s**2)/(Rational(4, 3)*pi*s**3)" } }

- template: bi-sa-v-consequence
  skill: bio.cells
  pace: recall
  cases:
    - { q: 'Why are most cells microscopic?', ans: 0 }
    - { q: 'Why does an elephant have a lower metabolic rate per gram than a mouse?', ans: 1 }
    - { q: 'Why do large animals need lungs and a circulatory system?', ans: 2 }
    - { q: 'A cell doubles in diameter. What happens to its exchange per unit volume?', ans: 3 }
  prompt: '{{q}}'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["Small size keeps SA/V high enough for exchange across the membrane", "A smaller SA/V loses heat more slowly, so less metabolism per gram keeps it warm", "Diffusion across the body surface alone is too slow for their volume", "It halves, because SA/V scales as 1/size"]
      correct: ans
      explain: 'Volume (demand) grows as size cubed, surface (supply) as size squared. So the bigger the cell or animal, the less surface each unit of volume gets, and the more it needs folds, specialised surfaces and transport systems'
  verify: { authored: true }

- template: bi-exchange-surface
  skill: bio.cells
  pace: recall
  cases:
    - { q: 'Microvilli on intestinal cells', ans: 0 }
    - { q: 'Alveoli in lungs', ans: 1 }
    - { q: 'Root hairs', ans: 2 }
    - { q: 'Gill filaments and lamellae', ans: 1 }
    - { q: 'Villi of the small intestine', ans: 0 }
    - { q: 'Cristae of mitochondria', ans: 3 }
  prompt: '{{q}} raise surface area for what?'
  parts:
    - ask: 'Purpose'
      label: a
      choice: ["Absorbing nutrients", "Gas exchange", "Taking up water and minerals", "Room for respiratory enzymes and ATP synthase"]
      correct: ans
      explain: 'Folding, branching and projections add area without adding much volume, so exchange keeps up with demand. Thin walls and a steep gradient (kept by blood flow or ventilation) add to the gain'
  verify: { authored: true }


    - { q: 'water moving through aquaporins', ans: 1 }
    - { q: 'H⁺ pumped into a lysosome', ans: 2 }
    - { q: 'CO₂ leaving a cell', ans: 0 }
  prompt: 'What kind of transport is {{q}}?'
  parts:
    - ask: 'Type'
      label: a
      choice: ["Simple diffusion: passive, no protein", "Facilitated diffusion: passive, through a protein", "Active transport: uses energy against the gradient"]
      correct: ans
      explain: 'Down the gradient is passive (no ATP), with or without a channel or carrier. Against the gradient costs energy, from ATP directly (pumps) or from another gradient (cotransport)'
  verify: { authored: true }


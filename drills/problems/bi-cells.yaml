- template: bi-sodium-potassium-pump
  skill: bio.cells
  pace: recall
  cases:
    - { q: 'How many Na⁺ ions does one cycle move, and which way?', o1: '3 out of the cell', o2: '2 into the cell', o3: '1 out of the cell', ans: 0 }
    - { q: 'How many K⁺ ions does one cycle move, and which way?', o1: '3 out of the cell', o2: '2 into the cell', o3: '3 into the cell', ans: 1 }
    - { q: 'What powers each cycle?', o1: 'The Na⁺ gradient', o2: 'Light', o3: 'Hydrolysis of one ATP', ans: 2 }
    - { q: 'Why does the pump make the inside of the cell negative?', o1: 'It moves more positive charge out than in', o2: 'It imports Cl⁻', o3: 'It exports proteins', ans: 0 }
  prompt: 'The Na⁺/K⁺-ATPase: {{q}}'
  parts:
    - ask: 'Answer'
      label: a
      choice: ["{{o1}}", "{{o2}}", "{{o3}}"]
      correct: ans
      explain: 'Each ATP pumps 3 Na⁺ out and 2 K⁺ in, against both gradients. The net loss of one positive charge per cycle, plus K⁺ leaking back out, makes the resting potential (about −70 mV), and the Na⁺ gradient powers cotransport'
  verify: { authored: true }


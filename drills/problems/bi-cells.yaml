  parts:
    - ask: 'Answer'
      label: a
      choice: ["DNA", "RNA"]
      correct: ans
      explain: 'DNA: deoxyribose, A T G C, double-stranded and stable for storage. RNA: ribose (with the reactive 2′ –OH), A U G C, usually single-stranded, so it can fold into tRNA, rRNA and ribozymes'
  verify: { authored: true }

- template: bi-chargaff
  skill: bio.molecules
  pace: quick
  given: { a: { pick: [18, 22, 27, 31, 34] }, w: { pick: [0, 1, 2] } }
  prompt: 'A double-stranded DNA sample is ${{a}}$ percent adenine. What percent is {{w == 0 ? "thymine" : (w == 1 ? "guanine" : "cytosine plus guanine")}}?'
  parts:
    - { ask: 'Percent', label: r, value: 'w == 0 ? a : (w == 1 ? 50 - a : 100 - 2*a)', tol: 0.0001, explain: 'Chargaff: A pairs with T and G with C, so A = T and G = C. A + T = $2 \times {{a}}$ percent leaves $100 - {{2*a}}$ percent for G + C, half of it G' }
  verify: { expect: { r: "[a, (100 - 2*a)/Integer(2), 100 - 2*a][w]" } }


      choice: ["More fluid", "Less fluid"]
      correct: ans
      explain: 'The membrane is a fluid mosaic of lipids and proteins that drift sideways. Heat and kinked tails loosen packing; cold and straight saturated tails tighten it. Cholesterol is a buffer: it stiffens a warm membrane and keeps a cold one from freezing'
  verify: { authored: true }


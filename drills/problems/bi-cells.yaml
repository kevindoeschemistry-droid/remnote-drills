    - { q: 'A plant cell in concentrated salt solution', ans: 4 }
    - { q: 'A plant cell in an isotonic solution', ans: 5 }
  prompt: 'What happens to: {{q}}?'
  parts:
    - ask: 'Outcome'
      label: a
      choice: ["Water rushes in and it bursts (lysis)", "No net water movement; normal shape", "Water leaves and it shrivels (crenation)", "Water enters and it becomes turgid (the wall stops bursting)", "Water leaves and the membrane pulls from the wall (plasmolysis)", "Flaccid: no net movement, the plant wilts"]
      correct: ans
      explain: 'Water moves toward the higher solute concentration (hypertonic side). Animal cells have no wall, so hypotonic surroundings burst them; plant cells prefer hypotonic surroundings, where the wall turns inflow into turgor pressure'
  verify: { authored: true }


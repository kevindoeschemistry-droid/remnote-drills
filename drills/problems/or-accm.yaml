- template: or-a-value-ratio
  skill: orgo.physical
  pace: quick
  given:
    Av:
      pick:
      - 7.3
      - 4.0
      - 2.5
      - 9.0
    T:
      pick:
      - 298
      - 200
  prompt: A substituent on cyclohexane has an A-value of {{Av}} kJ/mol. What percent of molecules have the group equatorial at {{T}} K?
  parts:
  - ask: Answer
    label: v
    tex: \%_{eq}
    value: 100*exp(Av*1000/(8.314462618*T))/(1 + exp(Av*1000/(8.314462618*T)))
    tol: 0.005
    explain: K = e^(A/RT); fraction equatorial = K/(1 + K)
  verify:
    expect:
      v: 100/(1 + exp(-nsimplify(Av)*1000/(Rational('8.314462618')*T)))
- template: or-a-value-from-ratio
  skill: orgo.physical
  pace: quick
  given:
    T:
      pick:
      - 298
      - 250
    pe:
      pick:
      - 75
      - 90
      - 95
      - 99
  prompt: At {{T}} K a monosubstituted cyclohexane is {{pe}}% equatorial. What is the A-value in kJ/mol?
  parts:
  - ask: Answer
    label: v
    tex: A
    value: 8.314462618*T*log(pe/(100 - pe))/1000
    tol: 0.005
    explain: ΔG = RT ln K with K = eq/ax
  verify:
    expect:
      v: Rational('8.314462618')*T*log(Rational(pe, 100 - pe))/1000

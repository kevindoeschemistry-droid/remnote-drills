- template: or-fischer-yield
  skill: orgo.practice
  pace: quick
  given:
    r:
      pick:
      - 1
      - 2
      - 3
      - 5
      - 10
  prompt: Acetic acid (1 mol) is heated with {{r}} mol ethanol; K = 4. What fraction of the acid becomes ester at equilibrium?
  parts:

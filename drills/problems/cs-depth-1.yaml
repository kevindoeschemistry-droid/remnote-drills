- template: cs-doubling-copies
  skill: cs.analysis
  pace: quick
  given:
    k:
      pick:
      - 3
      - 5
      - 10
  prompt: A dynamic array starts with capacity 1 and doubles when full. How many element copies happen while appending n = 2^{{k}} + 1 items?
  parts:
  - ask: Answer
    label: v
    tex: c
    value: 2^(k + 1) - 1
    final: true
    tol: 0.0001
    explain: 'Copies at each resize: 1 + 2 + 4 + … + 2^k < 2n, so appends are O(1) amortised'
  verify:
    expect:
      v: summation(2**Symbol('j'), (Symbol('j'), 0, k))
- template: cs-loop-invariant
  skill: cs.analysis
  pace: quick
  cases:
  - q: 'For s = 0; for i in 0..n−1: s += a[i], the invariant at the top of iteration i is:'
    o1: s = a[0] + … + a[i − 1]
    o2: s = a[0] + … + a[i]
    o3: s = a[i]
    o4: s ≥ 0
  - q: 'In insertion sort, the invariant before inserting a[i] is:'
    o1: a[0..i−1] is sorted
    o2: a[0..i] is sorted
    o3: a is sorted
    o4: a[i] is the minimum
  - q: 'In selection sort, before pass i:'
    o1: a[0..i−1] holds the i smallest keys in order
    o2: a is sorted
    o3: a[i] is the max
    o4: Nothing is sorted
  - q: 'Binary search on [lo, hi] keeps the invariant:'
    o1: If the key is present, it lies in a[lo..hi]
    o2: lo = hi
    o3: a[lo] = key
    o4: hi − lo is constant
  - q: 'The three parts of a loop-invariant proof are:'
    o1: Initialization, maintenance, termination
    o2: Base, guess, check
    o3: Input, output, cost
    o4: Pre, post, side effect
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The invariant plus the exit condition gives the postcondition
  verify:
    authored: true
- template: cs-invariant-termination
  skill: cs.analysis
  pace: quick
  cases:
  - q: 'At termination of the summing loop (i = n), the invariant gives:'
    o1: s = a[0] + … + a[n − 1]
    o2: s = 0
    o3: s = a[n]
    o4: Nothing
  - q: Why must a loop's variant (e.g. hi − lo) strictly decrease?
    o1: So the loop terminates
    o2: So the invariant holds
    o3: For speed
    o4: It need not
  - q: 'Euclid''s gcd(a, b) loop keeps the invariant:'
    o1: gcd(a, b) is unchanged
    o2: a > b always
    o3: b = 0
    o4: a + b is constant
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Termination combines the invariant with the exit test
  verify:
    authored: true

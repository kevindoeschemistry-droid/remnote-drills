    o1: Θ(n²)
    o2: Θ(n log n)
    o3: Θ(n)
    o4: Θ(log n)
  - q: 'Insertion sort''s best case is:'
    o1: An already sorted array, Θ(n)
    o2: A reverse-sorted array
    o3: A random array
    o4: All equal keys, Θ(n²)
  - q: 'Randomising quicksort''s pivot makes the expected time Θ(n log n) on:'
    o1: Every input
    o2: Only random inputs
    o3: Only sorted inputs
    o4: No input

- template: cs-nested-count
  skill: cs.discrete
  pace: quick
  given:
    n:
      pick:
      - 5
      - 10
      - 20
      - 100
  prompt: 'How many times does the body run? for i in 1..{{n}}: for j in i..{{n}}: body'
  parts:
  - ask: Answer
    label: v
    tex: n
    value: n*(n + 1)/2
    final: true
    tol: 0.0001
    explain: 'Σᵢ (n − i + 1) = n(n + 1)/2: Θ(n²)'
  verify:
    expect:
      v: summation(n - Symbol('k') + 1, (Symbol('k'), 1, n))
- template: cs-graph-classify
  skill: cs.discrete
  pace: quick
  cases:
  - g: a-b b-c c-a
    kd: 2
  - g: a-b b-c c-d d-a
    kd: 1
  - g: a-b a-c c-d c-e
    kd: 0
  - g: a-b b-c c-d d-e e-a
    kd: 2
  - g: a-b a-c b-d c-d d-e
    kd: 1
  - g: a-b b-c b-d d-e
    kd: 0
  prompt: Is the undirected graph with edges {{g}} a tree, bipartite with a cycle, or not bipartite?
  parts:
  - ask: Answer
    label: v
    choice:
    - A tree
    - Bipartite, with a cycle
    - Not bipartite (has an odd cycle)
    correct: kd
    explain: 'A connected graph with n − 1 edges is a tree. It is bipartite exactly when it has no odd cycle: 2-colour it by BFS'
  verify:
    choices:
      v: cs_graph_kind(g)
- template: cs-handshake
  skill: cs.discrete
  pace: quick
  given:
    n:
      pick:
      - 6
      - 8
      - 10
      - 12
    d:
      pick:
      - 2
      - 3
      - 4
  require:
  - n*d % 2 == 0
  prompt: A graph has {{n}} vertices, each of degree {{d}}. How many edges does it have?
  parts:
  - ask: Answer
    label: v
    tex: m
    value: n*d/2
    final: true
    tol: 0.0001
    explain: 'Handshake lemma: Σ deg = 2m, since each edge has two ends'
  verify:
    expect:
      v: solve(Eq(2*Symbol('m'), n*d), Symbol('m'))[0]
- template: cs-birthday-pairs
  skill: cs.discrete
  pace: quick
  given:
    n:
      pick:
      - 23
      - 30
      - 50
      - 70
  prompt: '{{n}} people, birthdays uniform over 365 days. What is the expected number of pairs sharing a birthday?'
  parts:
  - ask: Answer
    label: v
    tex: E
    value: n*(n - 1)/2/365
    tol: 0.005
    explain: 'An indicator per pair, each with probability 1/365: linearity gives C(n, 2)/365, about 0.69 at n = 23'
  verify:
    expect:
      v: binomial(n, 2)*Rational(1, 365)
- template: cs-false-alerts
  skill: cs.discrete
  pace: quick
  given:
    s:
      pick:
      - 0.9
      - 0.99
    f:
      pick:
      - 0.01
      - 0.05
    p:
      pick:
      - 0.001
      - 0.01
      - 0.1
  prompt: A detector has sensitivity {{s}} and false-positive rate {{f}}; {{p}} of events are real attacks. What fraction of alerts are false?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: f*(1 - p)/(s*p + f*(1 - p))
    tol: 0.005
    explain: 'Base rates dominate: with rare attacks, most alerts are false even for a good detector'
  verify:
    expect:
      v: 1 - nsimplify(s)*nsimplify(p)/(nsimplify(s)*nsimplify(p) + nsimplify(f)*(1 - nsimplify(p)))

  - Nn: 100
    a: 3
    b: 5
    ans: 47
  - Nn: 1000
    a: 4
    b: 6
    ans: 333
  - Nn: 200
    a: 7
    b: 11
    ans: 44
  - Nn: 60
    a: 2
    b: 3
    ans: 40
  prompt: How many integers from 1 to {{Nn}} are divisible by {{a}} or {{b}}?

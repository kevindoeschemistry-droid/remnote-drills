- template: cs-code-recurrence
  skill: cs.analysis
  pace: quick
  cases:
  - q: 'def f(n): if n ≤ 1: return; f(n//2); f(n//2); work(n) — with work Θ(n). Its recurrence:'
    o1: T(n) = 2T(n/2) + Θ(n)
    o2: T(n) = T(n/2) + Θ(n)
    o3: T(n) = 2T(n − 1) + Θ(1)
    o4: T(n) = T(n − 1) + Θ(n)
  - q: 'Binary search on a sorted array:'
    o1: T(n) = T(n/2) + Θ(1)
    o2: T(n) = 2T(n/2) + Θ(1)
    o3: T(n) = T(n − 1) + Θ(1)
    o4: T(n) = 2T(n/2) + Θ(n)
  - q: 'Naive fib(n) = fib(n − 1) + fib(n − 2):'
    o1: T(n) = T(n − 1) + T(n − 2) + Θ(1)
    o2: T(n) = 2T(n/2) + Θ(1)
    o3: T(n) = T(n − 1) + Θ(n)
    o4: T(n) = T(n/2) + Θ(1)
  - q: 'Selection sort written recursively (find min, recurse on the rest):'
    o1: T(n) = T(n − 1) + Θ(n)
    o2: T(n) = 2T(n/2) + Θ(n)
    o3: T(n) = T(n/2) + Θ(n)
    o4: T(n) = T(n − 1) + Θ(1)
  - q: 'Karatsuba multiplication makes three half-size calls plus linear work:'
    o1: T(n) = 3T(n/2) + Θ(n)
    o2: T(n) = 4T(n/2) + Θ(n)
    o3: T(n) = 2T(n/2) + Θ(n)
    o4: T(n) = 3T(n/3) + Θ(n)
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: One term per recursive call with its input size, plus the non-recursive work
  verify:
    authored: true
- template: cs-call-count
  skill: cs.analysis
  pace: quick
  cases:
  - code: "c = 0\ndef fib(n):\n    global c\n    c += 1\n    return n if n < 2 else fib(n-1) + fib(n-2)\nfib(5)\nprint(c)"
    ans: 15
  - code: "c = 0\ndef fib(n):\n    global c\n    c += 1\n    return n if n < 2 else fib(n-1) + fib(n-2)\nfib(6)\nprint(c)"
    ans: 25
  - code: "c = 0\ndef fib(n):\n    global c\n    c += 1\n    return n if n < 2 else fib(n-1) + fib(n-2)\nfib(8)\nprint(c)"
    ans: 67
  - code: "c = 0\ndef fib(n):\n    global c\n    c += 1\n    return n if n < 2 else fib(n-1) + fib(n-2)\nfib(10)\nprint(c)"
    ans: 177
  figure: &id002
    type: code
    src: code
  prompt: What does this print?
  parts:
  - ask: Answer
    label: v
    tex: c
    value: ans
    final: true
    tol: 0.0001
    explain: 'Calls(n) = Calls(n − 1) + Calls(n − 2) + 1 = 2F(n + 1) − 1: exponential, which memoisation cuts to linear'
  verify:
    expect:
      v: py_out(code)
- template: cs-recursion-leaves
  skill: cs.analysis
  pace: quick
  given:
    a:
      pick:
      - 2

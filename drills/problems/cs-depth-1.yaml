# Generated by scripts/second_types.py from scripts/second_specs/cs1.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: cs-equiv-check
  skill: cs.discrete
  pace: quick
  cases:
  - fs: ¬(p ∧ q)
    gs: ¬p ∨ ¬q
    f: not (p and q)
    g: (not p) or (not q)
    kd: 0
  - fs: p → q
    gs: q → p
    f: (not p) or q
    g: (not q) or p
    kd: 1
  - fs: p → q
    gs: ¬q → ¬p
    f: (not p) or q
    g: q or (not p)
    kd: 0
  - fs: p ∧ (q ∨ r)
    gs: (p ∧ q) ∨ r
    f: p and (q or r)
    g: (p and q) or r
    kd: 1
  - fs: p ∨ (p ∧ q)
    gs: p
    f: p or (p and q)
    g: p
    kd: 0
  - fs: ¬(p ∨ q)
    gs: ¬p ∨ ¬q
    f: not (p or q)
    g: (not p) or (not q)
    kd: 1
  prompt: Are {{fs}} and {{gs}} logically equivalent?
  parts:
  - ask: Answer
    label: v
    choice:
    - Equivalent
    - Not equivalent
    correct: kd
    explain: Compare the truth tables row by row; one row that differs is enough to say no. De Morgan, contrapositive and absorption give equivalences; the converse does not
  verify:
    choices:
      v: 1 - cs_equiv(f, g, 'p q r')
- template: cs-logic-law
  skill: cs.discrete
  pace: quick
  cases:
  - q: '¬(p ∧ q) ≡ ¬p ∨ ¬q is:'
    o1: De Morgan's law
    o2: Distributivity
    o3: Absorption
    o4: Contraposition
  - q: 'p ∨ (p ∧ q) ≡ p is:'
    o1: Absorption
    o2: De Morgan's law
    o3: Idempotence
    o4: Double negation
  - q: 'p → q ≡ ¬q → ¬p is:'
    o1: Contraposition
    o2: The converse
    o3: De Morgan's law
    o4: Distributivity
  - q: 'p ∧ (q ∨ r) ≡ (p ∧ q) ∨ (p ∧ r) is:'
    o1: Distributivity
    o2: Absorption
    o3: Associativity
    o4: Contraposition
  - q: 'p → q ≡ ¬p ∨ q is:'
    o1: Material implication
    o2: De Morgan's law
    o3: The converse
    o4: Absorption
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Name the law by its shape; each lets you rewrite without a truth table
  verify:
    authored: true
- template: cs-induction-parts
  skill: cs.discrete
  pace: quick
  cases:
  - q: 'To prove Σᵢ₌₁ⁿ (2i − 1) = n² by induction, the inductive step assumes:'
    o1: The formula holds for n = k, and shows it for k + 1
    o2: It holds for all n
    o3: It holds for k + 1
    o4: It fails for some k
  - q: In the step for Σ(2i − 1) = n², what term is added to go from k to k + 1?
    o1: 2k + 1
    o2: 2k − 1
    o3: k + 1
    o4: k²
  - q: 'Strong induction differs from ordinary induction in that the step may assume:'
    o1: The claim for every value up to k
    o2: Only the claim for k − 1
    o3: The claim for k + 1
    o4: Nothing
  - q: 'A loop-invariant proof is induction on:'
    o1: The number of loop iterations
    o2: The input size only
    o3: The number of variables
    o4: Recursion depth only
  - q: 'A recursive function on lists is proved correct by structural induction, with base case:'
    o1: The empty list
    o2: A list of length 2
    o3: The longest list
    o4: No base case is needed
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Base case, hypothesis for k, step to k + 1
  verify:
    authored: true
- template: cs-induction-flaw
  skill: cs.discrete
  pace: quick
  cases:
  - q: '''All horses are one colour'': the step from k to k + 1 overlaps two groups of k. Where does it fail?'
    o1: 'From k = 1 to 2: the groups don''t overlap'
    o2: At the base case
    o3: For large k
    o4: It doesn't fail
  - q: A proof checks n = 1 and shows P(k) ⇒ P(k + 2). What has it proved?
    o1: P(n) for odd n only
    o2: P(n) for all n
    o3: Nothing
    o4: P(n) for even n
  - q: 'A step proves P(k + 1) from P(k) but no base case is checked. Then:'
    o1: 'Nothing follows: P could be false everywhere'
    o2: P holds for all n
    o3: P holds for n ≥ 2
    o4: P holds for n = 1
  - q: '2ⁿ > n² is true for n ≥ 5 but false at n = 4. An induction for it must start at:'
    o1: n = 5
    o2: n = 1
    o3: n = 0
    o4: n = 4
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Check that the step works from the base case onward and that every case is reached
  verify:
    authored: true

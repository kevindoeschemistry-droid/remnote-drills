- template: cs-insertion-compares
  skill: cs.analysis
  pace: quick
  cases:
  - kind: an already sorted
    n: 10
    k: 0
  - kind: an already sorted
    n: 50
    k: 0
  - kind: a reverse-sorted
    n: 10
    k: 1
  - kind: a reverse-sorted
    n: 50
    k: 1
  prompt: How many comparisons does insertion sort make on {{kind}} array of n = {{n}} distinct keys?
  parts:
  - ask: Answer
    label: v
    tex: C
    value: 'k == 1 ? n*(n - 1)/2 : n - 1'
    final: true
    tol: 0.0001
    explain: 'Best case: each new key compares once with its neighbour (n − 1). Worst case: each key travels to the front (n(n − 1)/2)'
  verify:
    expect:
      v: binomial(n, 2) if k == 1 else n - 1

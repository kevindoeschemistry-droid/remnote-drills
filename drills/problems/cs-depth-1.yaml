      - 4
      - 7
    b:
      pick:
      - 2
      - 4
    k:
      pick:
      - 3
      - 4
      - 5
  prompt: For T(n) = {{a}}T(n/{{b}}) + f(n), how many leaves does the recursion tree have when n = {{b}}^{{k}}?
  parts:
  - ask: Answer

- template: tp-topological-property
  skill: top.spaces
  pace: recall
  cases:
  - pr: compact
    kc: 0
  - pr: bounded
    kc: 1
  - pr: connected
    kc: 0
  - pr: complete as a metric space
    kc: 1
  - pr: Hausdorff
    kc: 0
  - pr: having finite diameter
    kc: 1
  - pr: having exactly two path components
    kc: 0
  - pr: being a straight line
    kc: 1
  prompt: Is '{{pr}}' a topological property (preserved by every homeomorphism)?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: (0, 1) and the whole real line are homeomorphic, yet one is bounded and incomplete and the other unbounded and complete. Anything defined from distances alone is suspect
  verify:
    authored: true
- template: tp-hausdorff-facts
  skill: top.spaces
  pace: recall
  cases:
  - q: 'An infinite set with the cofinite topology (open = empty or finite complement) is not Hausdorff because:'
    o1: Any two non-empty open sets meet
    o2: Points are not closed
    o3: It is not connected
    o4: It is not compact
  - q: 'A finite topological space is Hausdorff exactly when it is:'
    o1: Discrete
    o2: Connected
    o3: Indiscrete
    o4: Compact
  - q: 'In a Hausdorff space, a convergent sequence has:'
    o1: Exactly one limit
    o2: At least two limits
    o3: No limit points
    o4: A constant tail
  - q: 'Every metric space is Hausdorff because two distinct points at distance d are separated by:'
    o1: Open balls of radius d/2
    o2: Closed balls of radius d
    o3: Their complements
    o4: A continuous function
  - q: 'A function into a space with the indiscrete topology (only ∅ and X open) is:'
    o1: Always continuous
    o2: Never continuous
    o3: Continuous only if constant
    o4: Continuous only if injective
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Hausdorff is the weakest condition under which limits behave as in analysis
  verify:
    authored: true

- template: tp-product-discrete
  skill: top.spaces
  pace: quick
  given:
    km:
      pick:
      - 2
      - 3
    kn:
      pick:
      - 2
      - 3
      - 4
  prompt: X has {{km}} points and Y has {{kn}} points, both with the discrete topology. How many open sets has the product X × Y?
  parts:
  - ask: Answer
    label: v
    tex: open sets
    value: 2^(km*kn)
    final: true
    tol: 0.0001
    explain: The product of discrete spaces is discrete, so every one of the subsets of the mn points is open
  verify:
    expect:
      v: 2**pm_inj(1, km*kn)
- template: tp-components-line
  skill: top.connected
  pace: quick
  given:

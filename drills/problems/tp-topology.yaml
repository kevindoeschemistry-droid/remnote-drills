  skill: top.connected
  pace: recall
  cases:
  - q: 'The intermediate value theorem is the statement that the continuous image of an interval is:'
    o1: Connected
    o2: Compact
    o3: Closed
    o4: Open
  - q: 'The closure of the graph of sin(1/x) for x > 0 (the topologist''s sine curve) is:'
    o1: Connected but not path-connected
    o2: Path-connected
    o3: Neither connected nor path-connected
    o4: Compact and path-connected
  - q: 'For an open subset of Euclidean space, connected and path-connected are:'
    o1: Equivalent
    o2: Unrelated
    o3: Never both true
    o4: Equivalent only in the plane
  - q: 'There is no continuous map from [0, 1] onto {0, 1} with the discrete topology because [0, 1] is:'
    o1: Connected
    o2: Compact
    o3: Hausdorff
    o4: Uncountable
  - q: 'The product of two connected spaces is:'
    o1: Connected
    o2: Connected only if both are compact

  pace: recall
  cases:
  - sh: ∅, {a}, {a, b, c}
    kc: 0
  - sh: ∅, {a}, {b}, {a, b, c}
    kc: 1
  - sh: ∅, {a}, {a, b}, {a, b, c}
    kc: 0
  - sh: ∅, {a, b}, {b, c}, {a, b, c}
    kc: 1
  - sh: ∅, {a}, {b}, {a, b}, {a, b, c}
    kc: 0
  - sh: ∅, {a}, {b, c}, {a, b, c}
    kc: 0
  - sh: ∅, {a, b}, {a, c}, {a, b, c}
    kc: 1
  - sh: ∅, {b}, {a, b}, {b, c}, {a, b, c}
    kc: 0
  prompt: 'On X = {a, b, c}, is this collection a topology: {{sh}}?'
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: Check every pairwise union and intersection. {a} and {b} force {a, b}; {a, b} and {b, c} force {b}
  verify:
    authored: true

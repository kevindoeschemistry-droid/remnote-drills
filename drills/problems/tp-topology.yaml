- template: tp-cover-count
  skill: top.compact
  pace: quick
  cases:
  - ka: 1
    kl: 0.3
  - ka: 2
    kl: 0.5
  - ka: 5
    kl: 1
  - ka: 3
    kl: 0.7
  - ka: 10
    kl: 3
  prompt: What is the smallest number of open intervals of length {{kl}} that can cover the closed interval [0, {{ka}}]?
  parts:
  - ask: Answer
    label: v
    tex: intervals
    value: floor(ka/kl) + 1
    final: true
    tol: 0.0001
    explain: n open intervals of length ℓ cover strictly less than nℓ of a closed interval, so nℓ must exceed a. Compactness is what guarantees finitely many are ever enough
  verify:
    expect:
      v: pm_first_n('1/n', 0, nsimplify(kl)/ka)
- template: tp-compact-theorems
  skill: top.compact
  pace: recall
  cases:
  - q: 'A continuous real-valued function on a compact space is bounded and attains its bounds because its image is:'
    o1: A compact subset of the real line
    o2: An open interval
    o3: Connected
    o4: Countable
  - q: 'A continuous bijection from a compact space onto a Hausdorff space is automatically:'
    o1: A homeomorphism
    o2: Constant
    o3: A contraction
    o4: Open but not closed
  - q: 'A compact subset of a Hausdorff space is always:'
    o1: Closed
    o2: Open
    o3: Finite
    o4: Connected
  - q: The map t ↦ (cos t, sin t) from [0, 2π) onto the circle is a continuous bijection but not a homeomorphism. Which hypothesis fails?
    o1: '[0, 2π) is not compact'
    o2: The circle is not Hausdorff
    o3: The map is not continuous
    o4: The map is not surjective
  - q: 'A metric space is compact exactly when:'
    o1: Every sequence has a convergent subsequence
    o2: It is bounded
    o3: It is complete
    o4: It is closed
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Most uses of compactness are one of these four facts, usually the image fact
  verify:
    authored: true
- template: tp-cover-no-finite
  skill: top.compact
  pace: recall
  cases:
  - cv: '{(1/n, 1) : n ≥ 2}'
    sp: (0, 1)
    kc: 1
  - cv: '{(−n, n) : n ≥ 1}'
    sp: the real line
    kc: 1
  - cv: '{(−n, n) : n ≥ 1}'
    sp: '[0, 5]'
    kc: 0
  - cv: '{(x − 1, x + 1) : x an integer}'
    sp: '[0, 10]'
    kc: 0
  - cv: '{(1/n, 2) : n ≥ 1}'
    sp: (0, 1]
    kc: 1
  - cv: '{(1/n, 2) : n ≥ 1} with (−1, 0.01) added'
    sp: '[0, 1]'
    kc: 0
  prompt: Does the open cover {{cv}} of {{sp}} have a finite subcover?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: A nested cover has a finite subcover only if one of its sets already covers everything. On (0, 1) the sets (1/n, 1) never reach 0, and that single failing cover is enough to show (0, 1) is not compact
  verify:
    authored: true
- template: tp-euler-characteristic
  skill: top.surfaces
  pace: quick
  cases:
  - kv: 8
    ke: 12
    kf: 6
  - kv: 12
    ke: 30
    kf: 20
  - kv: 6
    ke: 15
    kf: 10
  - kv: 4
    ke: 6
    kf: 4
  - kv: 10
    ke: 30
    kf: 18
  - kv: 7
    ke: 21
    kf: 12
  prompt: A closed surface is divided into {{kf}} faces with {{ke}} edges and {{kv}} vertices. Find its Euler characteristic.
  parts:
  - ask: Answer
    label: v
    tex: \chi
    value: kv - ke + kf
    final: true
    tol: 0.0001
    explain: χ = V − E + F, and the result does not depend on how the surface was cut up
  verify:
    expect:
      v: pm_inj(1, kv + kf) - ke
- template: tp-genus-from-chi
  skill: top.surfaces
  pace: quick
  given:
    kx:
      pick:
      - -2
      - -4
      - -6
      - -10
  prompt: A closed orientable surface has Euler characteristic {{kx}}. What is its genus?
  parts:
  - ask: Answer
    label: v
    tex: g
    value: (2 - kx)/2
    final: true
    tol: 0.0001
    explain: 'χ = 2 − 2g, so g = (2 − χ)/2: each handle lowers the Euler characteristic by 2'
  verify:
    expect:
      v: solve(Eq(2 - 2*Symbol('m'), kx), Symbol('m'))[0]

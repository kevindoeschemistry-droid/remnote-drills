- template: tp-connected-sum
  skill: top.surfaces
  pace: quick
  given:
    kg:
      pick:
      - 1
      - 2
      - 3
    kk:
      pick:
      - 1
      - 2
      - 3
  prompt: A surface is the connected sum of a genus-{{kg}} orientable surface and {{kk}} projective planes. Find its Euler characteristic.
  parts:
  - ask: Answer
    label: v
    tex: \chi
    value: 2 - 2*kg - kk

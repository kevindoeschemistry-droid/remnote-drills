# AP Calculus Unit 1: limits and continuity.
# Format: see src/drills/gen-data.ts. `expr` parts are symbolic answers; {{=expr}} prints an expression.
# verify.expect recomputes every answer with sympy from the givens alone.

# ── direct substitution (CA-1.5.A) ─────────────────────────────────────────
- template: ca-lim-substitute
  skill: calc.limits
  given: { a: { int: [-4, 4] }, b: { int: [-6, 6] }, c: { int: [-9, 9] }, p: { int: [-3, 4] } }
  require: [a != 0, a*p^2 + b*p + c != 0]
  prompt: 'Evaluate $\displaystyle\lim_{x\to {{p}}}\left({{=a*x^2 + b*x + c}}\right)$.'
  parts:
    - ask: 'The limit'
      label: L
      tex: 'L'
      value: a*p^2 + b*p + c
      tol: 0.001
      explain: 'A polynomial is continuous everywhere, so substitute: ${{a}}({{p}})^2 + ({{b}})({{p}}) + ({{c}}) = {{a*p^2 + b*p + c}}$'
  verify: { expect: { L: "limit(a*x**2 + b*x + c, x, p)" } }

- template: ca-lim-quotient
  skill: calc.limits
  given: { a: { int: [1, 5] }, b: { int: [-6, 6] }, d: { int: [-5, 5] }, p: { int: [-3, 4] } }
  require: [p + d != 0, a*p + b != 0]
  prompt: 'Evaluate $\displaystyle\lim_{x\to {{p}}}\frac{ {{=a*x + b}} }{ {{=x + d}} }$.'
  parts:
    - ask: 'The limit'
      label: L
      tex: 'L'
      value: (a*p + b)/(p + d)
      tol: 0.005
      explain: 'The denominator is ${{p + d}} \ne 0$ at $x = {{p}}$, so substitute: $\frac{ {{a*p + b}} }{ {{p + d}} } = {{(a*p + b)/(p + d)}}$'
  verify: { expect: { L: "limit((a*x + b)/(x + d), x, p)" } }

# ── 0/0 by factoring (CA-1.6.A) ────────────────────────────────────────────
- template: ca-lim-factor
  skill: calc.limits
  given: { r: { int: [-5, 6] }, s: { int: [-6, 6] } }
  require: [r != s]
  prompt: 'Evaluate $\displaystyle\lim_{x\to {{r}}}\frac{ {{=x^2 - (r+s)*x + r*s}} }{ {{=x - r}} }$.'
  parts:
    - ask: 'The limit'
      label: L
      tex: 'L'
      value: r - s
      tol: 0.001
      explain: 'Substituting gives $\frac00$. Factor the top: $\frac{({{=x - r}})({{=x - s}})}{ {{=x - r}} } = {{=x - s}}$ for $x \ne {{r}}$, which tends to ${{r - s}}$'
  verify: { expect: { L: "limit((x**2 - (r + s)*x + r*s)/(x - r), x, r)" } }

# ── 0/0 by a conjugate (CA-1.6.A) ──────────────────────────────────────────
- template: ca-lim-conjugate
  skill: calc.limits
  given: { a: { int: [1, 7] } }
  prompt: 'Evaluate $\displaystyle\lim_{x\to {{a^2}}}\frac{\sqrt{x} - {{a}} }{x - {{a^2}} }$.'
  parts:
    - ask: 'The limit (a fraction or decimal)'
      label: L
      tex: 'L'
      value: 1/(2*a)
      explain: 'Multiply top and bottom by $\sqrt{x} + {{a}}$: the top becomes $x - {{a^2}}$, which cancels, leaving $\frac{1}{\sqrt{x} + {{a}} } \to \frac{1}{ {{2*a}} }$'
  verify: { expect: { L: "limit((sqrt(x) - a)/(x - a**2), x, a**2)" } }

# ── sin(ax)/(bx) (CA-1.6.B) ────────────────────────────────────────────────
- template: ca-lim-trig
  skill: calc.limits
  given: { a: { int: [1, 9] }, b: { int: [1, 9] } }
  require: [a != b]
  prompt: 'Evaluate $\displaystyle\lim_{x\to 0}\frac{\sin {{=a*x}} }{ {{=b*x}} }$.'
  parts:
    - ask: 'The limit'
      label: L
      tex: 'L'
      value: a/b
      explain: 'Make the inside match the bottom: $\frac{\sin {{=a*x}} }{ {{=a*x}} }\cdot\frac{ {{a}} }{ {{b}} } \to 1\cdot\frac{ {{a}} }{ {{b}} }$'
  verify: { expect: { L: "limit(sin(a*x)/(b*x), x, 0)" } }

# ── squeeze theorem (CA-1.8.A) ─────────────────────────────────────────────
- template: ca-lim-squeeze
  skill: calc.limits
  given: { a: { int: [1, 6] }, c: { int: [-8, 8] } }
  require: [c != 0]
  prompt: 'Evaluate $\displaystyle\lim_{x\to 0}\left[{{a}}x^2\cos\!\left(\tfrac1x\right) + ({{c}})\right]$.'
  parts:
    - ask: 'The limit'
      label: L
      tex: 'L'
      value: c
      tol: 0.001
      explain: 'Since $-1 \le \cos\frac1x \le 1$, the first term is trapped between $-{{a}}x^2$ and ${{a}}x^2$, and both go to 0. So the limit is ${{c}}$'
  verify: { expect: { L: "limit(a*x**2*cos(1/x) + c, x, 0)" } }

# ── limits at infinity (CA-1.15.A) ─────────────────────────────────────────
- template: ca-lim-infinity
  skill: calc.limits
  given: { a: { int: [1, 9] }, b: { int: [-9, 9] }, c: { int: [1, 9] }, d: { int: [1, 9] } }
  require: [a != c]
  prompt: 'Evaluate $\displaystyle\lim_{x\to\infty}\frac{ {{=a*x^2 + b*x}} }{ {{=c*x^2 + d}} }$.'
  parts:
    - ask: 'The limit, which is also the horizontal asymptote $y = \,?$'
      label: L
      tex: 'L'
      value: a/c
      explain: 'Same degree top and bottom, so divide through by $x^2$: the ratio of leading coefficients, $\frac{ {{a}} }{ {{c}} }$, survives'
  verify: { expect: { L: "limit((a*x**2 + b*x)/(c*x**2 + d), x, oo)" } }

- template: ca-lim-infinity-radical
  skill: calc.limits
  given: { a: { int: [1, 6] }, b: { int: [1, 9] }, c: { int: [1, 6] }, d: { int: [-6, 6] } }
  prompt: 'Let $f(x) = \dfrac{\sqrt{ {{=a^2*x^2 + b}} } }{ {{=c*x + d}} }$.'
  parts:
    - ask: '$\displaystyle\lim_{x\to\infty}f(x)$'
      label: Lp
      tex: 'L_{+}'
      value: a/c
      explain: 'For large positive $x$, $\sqrt{ {{a^2}}x^2 + {{b}} } \approx {{a}}x$, so $f \to \frac{ {{a}} }{ {{c}} }$'
    - ask: '$\displaystyle\lim_{x\to-\infty}f(x)$'
      label: Lm
      tex: 'L_{-}'
      value: -a/c
      explain: 'For negative $x$, $\sqrt{x^2} = |x| = -x$, so the sign flips: $-\frac{ {{a}} }{ {{c}} }$. Two different horizontal asymptotes'
  verify: { expect: { Lp: "limit(sqrt(a**2*x**2 + b)/(c*x + d), x, oo)", Lm: "limit(sqrt(a**2*x**2 + b)/(c*x + d), x, -oo)" } }

# ── one-sided limits of a piecewise function (CA-1.2.B) ────────────────────
- template: ca-lim-onesided
  skill: calc.continuity
  given: { a: { int: [-4, 4] }, b: { int: [-6, 6] }, c: { int: [-2, 3] }, d: { int: [1, 3] }, j: { pick: [0, 0, 1, -2, 3] } }
  let:
    e: a*c + b - d*c^2 + j
  require: [a != 0, a*c + b != 0, a*c + b + j != 0]
  prompt: 'Let $f(x) = {{=a*x + b}}$ for $x < {{c}}$ and $f(x) = {{=d*x^2 + e}}$ for $x \ge {{c}}$.'
  parts:
    - ask: '$\displaystyle\lim_{x\to {{c}}^-}f(x)$'
      label: Lm
      tex: 'L_{-}'
      value: a*c + b
      tol: 0.001
      explain: 'From the left use the first piece: ${{a}}({{c}}) + ({{b}}) = {{a*c + b}}$'
    - ask: '$\displaystyle\lim_{x\to {{c}}^+}f(x)$'
      label: Lp
      tex: 'L_{+}'
      value: d*c^2 + e
      tol: 0.001
      explain: 'From the right use the second piece: ${{d}}({{c}})^2 + ({{e}}) = {{d*c^2 + e}}$'
    - ask: 'Does $\displaystyle\lim_{x\to {{c}}}f(x)$ exist?'
      label: ex
      choice: ["Yes", "No"]
      correct: "j == 0 ? 0 : 1"
      explain: 'The two-sided limit exists only when the one-sided limits agree'
  verify:
    expect: { Lm: "limit(a*x + b, x, c, '-')", Lp: "limit(d*x**2 + (a*c + b - d*c**2 + j), x, c, '+')" }
    choices: { ex: "0 if j == 0 else 1" }

# ── make a piecewise function continuous (CA-1.13.A) ───────────────────────
- template: ca-continuity-k
  skill: calc.continuity
  given: { a: { int: [-6, 6] }, b: { int: [-6, 6] }, c: { pick: [1, 2, 4, 5] } }
  require: [c^2 + b - a != 0]
  prompt: 'Let $f(x) = kx + ({{a}})$ for $x < {{c}}$ and $f(x) = {{=x^2 + b}}$ for $x \ge {{c}}$. Find $k$ so that $f$ is continuous at $x = {{c}}$.'
  parts:
    - ask: 'Value the right-hand piece takes at $x = {{c}}$'
      label: R
      tex: 'f({{c}})'
      value: c^2 + b
      tol: 0.001
      explain: '${{c}}^2 + ({{b}}) = {{c^2 + b}}$'
    - ask: '$k$'
      label: k
      tex: 'k'
      value: (c^2 + b - a)/c
      tol: 0.005
      explain: 'The left-hand limit must match: ${{c}}k + ({{a}}) = {{c^2 + b}}$, so $k = \frac{ {{c^2 + b - a}} }{ {{c}} } = {{(c^2 + b - a)/c}}$'
  verify:
    expect: { R: "(x**2 + b).subs(x, c)", k: "solve(Eq(Symbol('K')*c + a, c**2 + b), Symbol('K'))[0]" }

# ── vertical asymptotes (CA-1.14.A) ────────────────────────────────────────
- template: ca-vert-asymptote
  skill: calc.continuity
  given: { a: { int: [-6, 6] }, r: { int: [-5, 5] } }
  require: [r != 0, r + a != 0]
  prompt: 'Let $f(x) = \dfrac{ {{=x + a}} }{ {{=x - r}} }$.'
  parts:
    - ask: 'The vertical asymptote is $x = \,?$'
      label: va
      tex: 'x'
      value: r
      tol: 0.001
      explain: 'The denominator is zero at $x = {{r}}$ and the numerator is not (${{r + a}}$ there)'
    - ask: '$\displaystyle\lim_{x\to {{r}}^+}f(x)$'
      label: side
      choice: ["+∞", "−∞"]
      correct: "r + a > 0 ? 0 : 1"
      explain: 'Just right of ${{r}}$ the bottom is a small positive number and the top is near ${{r + a}}$, so the quotient has the sign of the top'
  verify:
    expect: { va: "solve(x - r, x)[0]" }
    choices: { side: "0 if limit((x + a)/(x - r), x, r, '+') == oo else 1" }

# ── intermediate value theorem (CA-1.16.A) ─────────────────────────────────
- template: ca-ivt
  skill: calc.continuity
  given: { a: { int: [-5, 5] }, b: { int: [-9, 9] }, p: { int: [-2, 1] }, w: { int: [1, 3] } }
  let:
    q: p + w
    fp: p^3 + a*p + b
    fq: q^3 + a*q + b
  require: [fp != 0, fq != 0]
  prompt: 'Let $f(x) = {{=x^3 + a*x + b}}$ on the interval $[{{p}}, {{q}}]$.'
  parts:
    - ask: '$f({{p}})$'
      label: A
      tex: 'f({{p}})'
      value: fp
      tol: 0.001
      explain: '$({{p}})^3 + ({{a}})({{p}}) + ({{b}}) = {{fp}}$'
    - ask: '$f({{q}})$'
      label: B
      tex: 'f({{q}})'
      value: fq
      tol: 0.001
      explain: '$({{q}})^3 + ({{a}})({{q}}) + ({{b}}) = {{fq}}$'
    - ask: 'Does the IVT guarantee a root of $f$ in $({{p}}, {{q}})$?'
      label: root
      choice: ["Yes", "No, it guarantees nothing here"]
      correct: "fp*fq < 0 ? 0 : 1"
      explain: '$f$ is a polynomial, so it is continuous. The IVT gives a root exactly when the endpoint values have opposite signs. Same signs does not rule a root out; the theorem is just silent'
  verify:
    expect: { A: "(x**3 + a*x + b).subs(x, p)", B: "(x**3 + a*x + b).subs(x, p + w)" }
    choices: { root: "0 if (x**3 + a*x + b).subs(x, p)*(x**3 + a*x + b).subs(x, p + w) < 0 else 1" }

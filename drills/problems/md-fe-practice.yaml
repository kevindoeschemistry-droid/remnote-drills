    b: 1.1
    c: 1.6
  prompt: Three independent repeats give ΔΔG = {{a}}, {{b}} and {{c}} kcal/mol. What is the standard error of their mean?
  parts:
  - ask: Answer
    label: v
    tex: SE
    value: std([a, b, c])/sqrt(3)
    tol: 0.005
    explain: 'Sample standard deviation over √n: the error that independent copies reveal, which MBAR''s own error bar often understates'
  verify:
    expect:
      v: sqrt(((nsimplify(a)-(nsimplify(a)+nsimplify(b)+nsimplify(c))/3)**2 + (nsimplify(b)-(nsimplify(a)+nsimplify(b)+nsimplify(c))/3)**2 + (nsimplify(c)-(nsimplify(a)+nsimplify(b)+nsimplify(c))/3)**2)/2)/sqrt(3)
- template: fe-repeat-consistent
  skill: md.analysis
  pace: quick
  cases:
  - x1: -1.0
    s1: 0.2
    x2: -1.3
    s2: 0.2
    k: 0
  - x1: -1.0
    s1: 0.1
    x2: -2.0
    s2: 0.1
    k: 1
  - x1: 0.5
    s1: 0.3
    x2: 1.4
    s2: 0.3
    k: 1
  - x1: 2.0
    s1: 0.4
    x2: 2.6
    s2: 0.3
    k: 0
  prompt: Two repeats give {{x1}} ± {{s1}} and {{x2}} ± {{s2}} kcal/mol. Is their difference consistent with the stated errors (within 2σ of the difference)?
  parts:
  - ask: Answer
    label: v
    choice:
    - Consistent
    - 'Not consistent: the error bars are too small'
    correct: k
    explain: Differences between repeats bigger than the propagated error mean the error bars underestimate the real uncertainty
  verify:
    choices:
      v: 0 if Abs(nsimplify(x1) - nsimplify(x2)) <= 2*sqrt(nsimplify(s1)**2 + nsimplify(s2)**2) else 1
- template: fe-cycle-closure-3
  skill: md.free-energy
  pace: quick
  cases:
  - ab: -1.2
    bc: 0.6
    ca: 0.9
  - ab: 0.8
    bc: -1.5
    ca: 0.4
  - ab: 2.1
    bc: -0.7
    ca: -1.1
  - ab: -0.5
    bc: -0.6
    ca: 1.4
  prompt: Around a three-ligand cycle the edges give ΔΔG(A→B) = {{ab}}, ΔΔG(B→C) = {{bc}} and ΔΔG(C→A) = {{ca}} kcal/mol. What is the cycle-closure error?
  parts:
  - ask: Answer
    label: v
    tex: kcal/mol
    value: ab + bc + ca
    tol: 0.005
    explain: A state function sums to zero around a closed cycle; a large residual points to undersampled edges
  verify:
    expect:
      v: nsimplify(ab) + nsimplify(bc) + nsimplify(ca)
- template: fe-mue
  skill: md.analysis
  pace: quick
  cases:
  - p1: -8.1
    e1: -7.5
    p2: -9.4
    e2: -9.9
    p3: -7.0
    e3: -7.2
    p4: -10.2
    e4: -9.0
  - p1: -6.5
    e1: -7.4
    p2: -8.0
    e2: -8.1
    p3: -9.6
    e3: -8.8
    p4: -7.7
    e4: -7.0
  prompt: 'Predicted versus experimental ΔG (kcal/mol) for four ligands: ({{p1}}, {{e1}}), ({{p2}}, {{e2}}), ({{p3}}, {{e3}}), ({{p4}}, {{e4}}). What is the mean unsigned error?'
  parts:
  - ask: Answer
    label: v
    tex: MUE
    value: (abs(p1-e1)+abs(p2-e2)+abs(p3-e3)+abs(p4-e4))/4
    tol: 0.005
    explain: MUE and RMSE are the headline errors for relative results; correlation statistics depend on the sign convention
  verify:
    expect:
      v: (Abs(nsimplify(p1)-nsimplify(e1))+Abs(nsimplify(p2)-nsimplify(e2))+Abs(nsimplify(p3)-nsimplify(e3))+Abs(nsimplify(p4)-nsimplify(e4)))/4
- template: fe-reporting
  skill: md.analysis
  pace: recall
  cases:
  - q: 'For relative free energies, report errors as:'
    o1: RMSE and MUE (correlation depends on the sign convention)
    o2: Pearson R only
    o3: The best edge only
    o4: Nothing
  - q: 'Correlation and ranking statistics (R², Kendall τ) should be given with:'
    o1: Bootstrapped uncertainties
    o2: No uncertainty
    o3: Only the p-value
    o4: Only the slope
  - q: 'A scatter plot of predicted against experimental values should have:'
    o1: Equal axis ranges, 1:1 aspect ratio and 1 and 2 kcal/mol bands
    o2: Different axis ranges
    o3: Several datasets overlaid
    o4: No error bars
  - q: 'A study with fewer than about 10 ligands is better shown as:'
    o1: A bar plot
    o2: A scatter plot with R²
    o3: A pie chart
    o4: A single number
  - q: How many replicates does the reporting section ask for?
    o1: At least three, from uncorrelated starting points
    o2: One
    o3: Two from the same start
    o4: None
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Report what lets a reader judge the result
  verify:
    authored: true
- template: fe-diagnose
  skill: md.analysis
  pace: recall
  cases:
  - q: 'ΔG(λ) is jagged with sudden jumps between neighbouring states. The likely cause:'
    o1: Poor overlap or a rare slow event at those states
    o2: Perfect sampling
    o3: Too many repeats
    o4: A correct soft-core
  - q: 'In the decoupled state, the ligand drifts out of the pocket. You should:'
    o1: Add or tighten a restraint and correct for it
    o2: Ignore it
    o3: Raise the temperature
    o4: Remove the protein
  - q: 'Replicas in Hamiltonian replica exchange rarely swap between two states. This shows:'
    o1: Poor overlap between those states
    o2: Excellent mixing
    o3: Too many λ states
    o4: Correct convergence
  - q: 'Results change with the starting pose. This suggests:'
    o1: Slow binding-mode or protein motions are not sampled
    o2: Convergence
    o3: A good force field
    o4: Nothing
  - q: 'A torsion in the ligand is rarely visited in some states. This can cause:'
    o1: Biased free energies from unsampled conformations
    o2: Faster convergence
    o3: Better overlap
    o4: No effect
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Every symptom points at a sampling problem to fix before trusting the number
  verify:
    authored: true
- template: fe-binding-mode
  skill: md.free-energy
  pace: recall
  cases:
  - q: 'Docking is good at producing sterically reasonable poses but poor at:'
    o1: Identifying the dominant binding mode
    o2: Producing any pose
    o3: Placing hydrogens
    o4: Running fast
  - q: 'In the SAMPL HIV integrase challenge, most submissions:'
    o1: Placed more than half the ligands in the wrong site
    o2: Were within 0.1 kcal/mol
    o3: Used no docking
    o4: Matched experiment perfectly
  - q: 'A relative calculation can give different answers depending on:'
    o1: The starting binding mode
    o2: The random number generator only
    o3: The output format
    o4: Nothing
  - q: 'To find stable binding modes before free-energy runs, you can:'
    o1: Run short MD from several docked poses and keep the stable ones
    o2: Trust the top docking score
    o3: Pick a pose at random
    o4: Skip this step
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: A wrong binding mode gives a precise wrong answer
  verify:
    authored: true

- template: fe-neff
  skill: md.analysis
  pace: quick
  given:
    T:
      pick:
      - 5
      - 10
      - 20
    t0:
      pick:
      - 0.5
      - 1
    g:
      pick:
      - 20
      - 50
      - 100
  prompt: A λ state ran {{T}} ns. Equilibration was detected at {{t0}} ns and the statistical inefficiency is g = {{g}} ps. How many effectively uncorrelated samples remain?
  parts:
  - ask: Answer
    label: v
    tex: N_{\text{eff}}
    value: (T - t0)*1000/g
    tol: 0.005
    explain: N_eff = (T − t₀)/g; the paper suggests at least about 50 per state for BAR or MBAR
  verify:
    expect:
      v: (nsimplify(T) - nsimplify(t0))*1000/nsimplify(g)

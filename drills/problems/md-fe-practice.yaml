# Generated by scripts/second_types.py from scripts/second_specs/fe2.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: fe-vocab
  skill: md.free-energy
  pace: recall
  cases:
  - q: Why are alchemical intermediate states needed?
    o1: Each neighbouring pair must overlap in phase space for the estimators to converge
    o2: They are physical states measured in experiments
    o3: They make the force field more accurate
    o4: They remove the need for a thermodynamic cycle
  - q: 'Turning off a molecule''s interactions with its surroundings while keeping its internal ones is:'
    o1: Decoupling
    o2: Annihilation
    o3: Restraining
    o4: Equilibration
  - q: 'Turning off interactions within the molecule as well as with its surroundings is:'
    o1: Annihilation
    o2: Decoupling
    o3: Soft-core
    o4: Replica exchange
  - q: 'Free-energy calculations give:'
    o1: Only differences between states, never an absolute value on their own
    o2: Absolute free energies directly
    o3: Enthalpies only
    o4: Rates of binding
  - q: 'The ''alchemical'' in alchemical free energy refers to:'
    o1: Transforming one chemical species into another along an unphysical path
    o2: Using quantum mechanics
    o3: Running at very high temperature
    o4: Simulating real binding events directly
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Intermediates bridge end states; only differences are defined; overlap is what makes estimators work
  verify:
    authored: true
- template: fe-vocab-2
  skill: md.free-energy
  pace: recall
  cases:
  - q: Why not just simulate the ligand binding and unbinding directly?
    o1: Unbinding can take microseconds to seconds, far beyond routine MD
    o2: It is less accurate than any alchemical method by definition
    o3: Force fields cannot describe unbound ligands
    o4: It requires quantum mechanics
  - q: 'In a relative calculation, λ = 0 and λ = 1 correspond to:'
    o1: The two physical end states (ligand A and ligand B)
    o2: Two temperatures
    o3: The bound and unbound poses
    o4: The start and end of the run
  - q: 'Because free energy is a state function, the choice of alchemical path changes:'
    o1: Efficiency, not the answer (given converged sampling)
    o2: The answer
    o3: Nothing at all
    o4: The force field
  - q: 'Absolute and relative binding calculations differ in that absolute ones:'
    o1: Remove the ligand from its environment instead of mutating A into B
    o2: Need no thermodynamic cycle
    o3: Are always cheaper
    o4: Need no restraints ever
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Alchemy avoids slow physical events by going around them
  verify:
    authored: true
- template: fe-error-fold
  skill: md.free-energy
  pace: quick
  given:
    d:
      pick:
      - 0.5
      - 1
      - 1.5
      - 2
  prompt: An error of {{d}} kcal/mol in a binding ΔG at 298.15 K corresponds to what fold error in K?
  parts:
  - ask: Answer
    label: v
    tex: \times
    value: exp(d/(0.0019872043*298.15))
    tol: 0.005
    explain: 'K changes by exp(ΔΔG/RT): 1 kcal/mol is about 5.4-fold and 1.36 kcal/mol tenfold at room temperature'
  verify:
    expect:
      v: exp(nsimplify(d)/(Rational('0.0019872043')*Rational('298.15')))

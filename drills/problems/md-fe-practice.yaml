- template: fe-network-cycles
  skill: md.free-energy
  pace: quick
  given:
    n:
      pick:
      - 8
      - 10
      - 12
    ed:
      pick:
      - 14
      - 16
      - 20
  prompt: A connected perturbation network joins {{n}} ligands with {{ed}} edges. How many independent closed cycles does it have for cycle-closure checks?
  parts:
  - ask: Answer
    label: v
    tex: cycles
    value: ed - n + 1
    final: true
    tol: 0.0001
    explain: Independent cycles = E − N + 1 (a star map, with E = N − 1, has none, so it cannot be checked by closure)
  verify:
    expect:
      v: ed - n + 1

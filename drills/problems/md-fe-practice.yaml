- template: fe-campaign-cost
  skill: md.workflow
  pace: quick
  given:
    nl:
      pick:
      - 10
      - 20
      - 40
    k:
      pick:
      - 16
      - 24
      - 32
    t:
      pick:
      - 5
      - 10
    r:
      pick:
      - 3
    rate:
      pick:
      - 200
      - 400
  prompt: A campaign has {{nl}} ligand transformations, each with complex and solvent legs of {{k}} λ states × {{t}} ns, run in {{r}} repeats. At {{rate}} ns/day per GPU, how many GPU-days?
  parts:
  - ask: Answer
    label: v
    tex: GPU\text{-}days
    value: nl*2*k*t*r/rate
    tol: 0.005
    explain: Cost scales with transformations × legs × λ states × length × repeats; this is why a pilot on a few ligands comes first
  verify:

- template: pat-hole-punching
  skill: dat.pat-folding
  pace: quick
  cases:
    - { a1: 0, l1: 2, s1: -1, a2: 0, l2: 0, s2: 0, x0: 2, y0: 0, x1: 4, y1: 4, px: 2.5, py: 3.5, n: 2, how: 'The left half is folded over onto the right half.', where: 'row 1, column 2; row 1, column 3' }
    - { a1: 0, l1: 2, s1: -1, a2: 0, l2: 0, s2: 0, x0: 2, y0: 0, x1: 4, y1: 4, px: 3.5, py: 0.5, n: 2, how: 'The left half is folded over onto the right half.', where: 'row 4, column 1; row 4, column 4' }
    - { a1: 1, l1: 2, s1: 1, a2: 0, l2: 0, s2: 0, x0: 0, y0: 0, x1: 4, y1: 2, px: 0.5, py: 1.5, n: 2, how: 'The top half is folded down onto the bottom half.', where: 'row 2, column 1; row 3, column 1' }
    - { a1: 1, l1: 2, s1: 1, a2: 0, l2: 0, s2: 0, x0: 0, y0: 0, x1: 4, y1: 2, px: 2.5, py: 0.5, n: 2, how: 'The top half is folded down onto the bottom half.', where: 'row 1, column 3; row 4, column 3' }
    - { a1: 0, l1: 2, s1: -1, a2: 1, l2: 2, s2: 1, x0: 2, y0: 0, x1: 4, y1: 2, px: 2.5, py: 1.5, n: 4, how: 'The left half is folded over onto the right half, then the top half is folded down onto the bottom half.', where: 'row 2, column 2; row 2, column 3; row 3, column 2; row 3, column 3' }
    - { a1: 0, l1: 2, s1: -1, a2: 1, l2: 2, s2: 1, x0: 2, y0: 0, x1: 4, y1: 2, px: 3.5, py: 0.5, n: 4, how: 'The left half is folded over onto the right half, then the top half is folded down onto the bottom half.', where: 'row 1, column 1; row 1, column 4; row 4, column 1; row 4, column 4' }
    - { a1: 0, l1: 1, s1: -1, a2: 0, l2: 0, s2: 0, x0: 1, y0: 0, x1: 4, y1: 4, px: 1.5, py: 2.5, n: 2, how: 'Only the left quarter is folded over, onto the second column.', where: 'row 2, column 1; row 2, column 2' }
    - { a1: 0, l1: 1, s1: -1, a2: 0, l2: 0, s2: 0, x0: 1, y0: 0, x1: 4, y1: 4, px: 2.5, py: 2.5, n: 1, how: 'Only the left quarter is folded over, onto the second column.', where: 'row 2, column 3' }
    - { a1: 0, l1: 1, s1: -1, a2: 1, l2: 2, s2: 1, x0: 1, y0: 0, x1: 4, y1: 2, px: 1.5, py: 0.5, n: 4, how: 'The left quarter is folded over onto the second column, then the top half is folded down onto the bottom half.', where: 'row 1, column 1; row 1, column 2; row 4, column 1; row 4, column 2' }
    - { a1: 0, l1: 1, s1: -1, a2: 1, l2: 2, s2: 1, x0: 1, y0: 0, x1: 4, y1: 2, px: 3.5, py: 1.5, n: 2, how: 'The left quarter is folded over onto the second column, then the top half is folded down onto the bottom half.', where: 'row 2, column 4; row 3, column 4' }
    - { a1: 0, l1: 2, s1: -1, a2: 0, l2: 3, s2: -1, x0: 3, y0: 0, x1: 4, y1: 4, px: 3.5, py: 1.5, n: 4, how: 'The left half is folded over onto the right half, then the new left edge is folded over again onto the last column.', where: 'row 3, column 1; row 3, column 2; row 3, column 3; row 3, column 4' }
    - { a1: 1, l1: 3, s1: 1, a2: 0, l2: 0, s2: 0, x0: 0, y0: 0, x1: 4, y1: 3, px: 0.5, py: 2.5, n: 2, how: 'Only the top quarter is folded down, onto the second row.', where: 'row 1, column 1; row 2, column 1' }
    - { a1: 1, l1: 3, s1: 1, a2: 0, l2: 0, s2: 0, x0: 0, y0: 0, x1: 4, y1: 3, px: 1.5, py: 0.5, n: 1, how: 'Only the top quarter is folded down, onto the second row.', where: 'row 4, column 2' }
  prompt: 'A square sheet (dashed outline, a 4 by 4 grid) is folded: {{how}} The solid outline is the folded paper. A hole is punched at the dot. How many holes does the sheet have when it is unfolded?'
  figure:
    type: plot
    bare: true
    x: [-0.4, 4.4]
    y: [-0.4, 4.4]
    segments:
          - { from: [0, 0], to: [4, 0], dash: true }
          - { from: [4, 0], to: [4, 4], dash: true }
          - { from: [4, 4], to: [0, 4], dash: true }
          - { from: [0, 4], to: [0, 0], dash: true }
          - { from: [1, 0], to: [1, 4], dash: true }
          - { from: [0, 1], to: [4, 1], dash: true }
          - { from: [2, 0], to: [2, 4], dash: true }
          - { from: [0, 2], to: [4, 2], dash: true }
          - { from: [3, 0], to: [3, 4], dash: true }
          - { from: [0, 3], to: [4, 3], dash: true }
          - { from: [x0, y0], to: [x1, y0] }
          - { from: [x1, y0], to: [x1, y1] }
          - { from: [x1, y1], to: [x0, y1] }
          - { from: [x0, y1], to: [x0, y0] }
    points:
      - { at: [px, py] }
  parts:
    - { ask: 'Number of holes', label: r, tex: 'n', value: n, tol: 0.00001, explain: 'One hole for every layer of paper under the punch. Unfold in reverse order, mirroring each hole across the fold line; a part of the sheet that was never folded over that spot stays whole. Holes at: {{where}} (rows counted from the top, columns from the left)' }
  verify: { expect: { r: "punch_count([fd for fd in [(a1, l1, s1), (a2, l2, s2)] if fd[2] != 0], px, py)" } }


# DAT Perceptual Ability: angle ranking, hole punching, cube counting, cube nets.
# GENERATED by scripts/pat_cases.py: edit there, not here.
# Basis: Dental Admission Test 2026 Candidate Guide (standards.yaml: dat), Perceptual Ability Test.
# Keyholes (apertures) and top-front-end views are not here: they need drawn 3-D solids.

- template: pat-angle-ranking
  skill: dat.pat-angles
  pace: quick
  given: { base: { pick: [25, 40, 55, 70, 95, 115] } }
  cases:
    - { d1: 0, d2: 8, d3: 12, d4: 4, r1: 200, r2: 330, r3: 300, r4: 20, l1: 1.1, l2: 1.5, l3: 1.1, l4: 1.1, l5: 1.3, l6: 1.1, l7: 1.3, l8: 1.1, ord: 1423 }
    - { d1: 4, d2: 12, d3: 0, d4: 8, r1: 200, r2: 100, r3: 300, r4: 100, l1: 1.3, l2: 1.1, l3: 1.3, l4: 1.3, l5: 1.3, l6: 1.3, l7: 1.3, l8: 1.5, ord: 3142 }
    - { d1: 8, d2: 12, d3: 0, d4: 4, r1: 330, r2: 100, r3: 0, r4: 100, l1: 1.3, l2: 1.1, l3: 1.5, l4: 1.5, l5: 1.3, l6: 1.3, l7: 1.3, l8: 1.1, ord: 3412 }
    - { d1: 12, d2: 4, d3: 8, d4: 0, r1: 100, r2: 100, r3: 100, r4: 330, l1: 1.3, l2: 1.1, l3: 1.5, l4: 1.3, l5: 1.3, l6: 1.3, l7: 1.3, l8: 1.1, ord: 4231 }
    - { d1: 12, d2: 8, d3: 4, d4: 0, r1: 300, r2: 330, r3: 330, r4: 300, l1: 1.1, l2: 1.3, l3: 1.5, l4: 1.5, l5: 1.3, l6: 1.3, l7: 1.5, l8: 1.3, ord: 4321 }
    - { d1: 4, d2: 0, d3: 12, d4: 8, r1: 200, r2: 300, r3: 330, r4: 300, l1: 1.5, l2: 1.5, l3: 1.1, l4: 1.5, l5: 1.1, l6: 1.1, l7: 1.1, l8: 1.5, ord: 2143 }
    - { d1: 8, d2: 12, d3: 4, d4: 0, r1: 330, r2: 100, r3: 0, r4: 100, l1: 1.5, l2: 1.3, l3: 1.3, l4: 1.1, l5: 1.3, l6: 1.1, l7: 1.1, l8: 1.5, ord: 4312 }
    - { d1: 8, d2: 0, d3: 12, d4: 4, r1: 100, r2: 300, r3: 100, r4: 300, l1: 1.5, l2: 1.5, l3: 1.3, l4: 1.5, l5: 1.3, l6: 1.5, l7: 1.3, l8: 1.5, ord: 2413 }
    - { d1: 8, d2: 4, d3: 12, d4: 0, r1: 200, r2: 100, r3: 330, r4: 100, l1: 1.3, l2: 1.3, l3: 1.3, l4: 1.1, l5: 1.3, l6: 1.3, l7: 1.1, l8: 1.1, ord: 4213 }
    - { d1: 8, d2: 0, d3: 4, d4: 12, r1: 20, r2: 100, r3: 330, r4: 300, l1: 1.5, l2: 1.3, l3: 1.3, l4: 1.1, l5: 1.3, l6: 1.5, l7: 1.3, l8: 1.3, ord: 2314 }
  prompt: 'Rank the four angles from smallest to largest. Type the four labels as one number, smallest first (for example 3142).'
  figure:
    type: plot
    bare: true
    x: [-1.8, 10.8]
    y: [-2.2, 1.8]
    segments:
          - { from: [0, 0], to: ["0 + l1*cos((r1)*pi/180)", "l1*sin((r1)*pi/180)"] }
          - { from: [0, 0], to: ["0 + l2*cos((r1 + base + d1)*pi/180)", "l2*sin((r1 + base + d1)*pi/180)"] }
          - { from: [3, 0], to: ["3 + l3*cos((r2)*pi/180)", "l3*sin((r2)*pi/180)"] }
          - { from: [3, 0], to: ["3 + l4*cos((r2 + base + d2)*pi/180)", "l4*sin((r2 + base + d2)*pi/180)"] }
          - { from: [6, 0], to: ["6 + l5*cos((r3)*pi/180)", "l5*sin((r3)*pi/180)"] }
          - { from: [6, 0], to: ["6 + l6*cos((r3 + base + d3)*pi/180)", "l6*sin((r3 + base + d3)*pi/180)"] }
          - { from: [9, 0], to: ["9 + l7*cos((r4)*pi/180)", "l7*sin((r4)*pi/180)"] }
          - { from: [9, 0], to: ["9 + l8*cos((r4 + base + d4)*pi/180)", "l8*sin((r4 + base + d4)*pi/180)"] }
    labels:
          - { at: [0, -1.75], text: "1" }
          - { at: [3, -1.75], text: "2" }
          - { at: [6, -1.75], text: "3" }
          - { at: [9, -1.75], text: "4" }
  parts:
    - { ask: 'Order, smallest to largest', label: r, tex: '\text{order}', value: ord, tol: 0.00001, explain: 'The angles are ${{base + d1}}^\circ$, ${{base + d2}}^\circ$, ${{base + d3}}^\circ$ and ${{base + d4}}^\circ$: four degrees apart. Arm length is a distraction. Look only at the opening right at the vertex, settle the smallest and the largest first, then the middle pair' }
  verify: { expect: { r: "rank_code([d1, d2, d3, d4])" } }


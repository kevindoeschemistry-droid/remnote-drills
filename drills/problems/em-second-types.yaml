    kc: 2
  - q: y″ + λy = 0 with y(0) = y(L) = 0.
    kc: 0
  - q: y″ + λy = 0 with y(−π) = y(π) and y′(−π) = y′(π).
    kc: 1
  - q: Bessel's equation on [0, a], where p(x) = x vanishes at 0.
    kc: 2
  - q: y″ + λy = 0 with y′(0) = 0 and y(1) + y′(1) = 0.
    kc: 0
  - q: y″ + λy = 0 on the half-line x ≥ 0.

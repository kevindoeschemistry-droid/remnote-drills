- template: em-shifted-inverse-value
  skill: laplace.shifting
  pace: quick
  cases:
  - ka: 1
    kb: 2
    kt: 3
  - ka: 2
    kb: 1
    kt: 2.5
  - ka: 1
    kb: 3
    kt: 1.5
  - ka: 3
    kb: 1
    kt: 5
  prompt: F(s) = e^(−{{ka}}s)/(s + {{kb}}). Find f({{kt}}).
  parts:
  - ask: Answer
    label: v
    tex: f
    value: exp(-kb*(kt - ka))
    tol: 0.005
    explain: 'e^(−as) delays by a: f(t) = u(t − a)e^(−b(t − a))'
  verify:

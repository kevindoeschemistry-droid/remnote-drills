- template: em-convolution-two-exponentials
  skill: laplace.convolution
  pace: quick
  cases:
  - ka: 1
    kb: -1
    kt: 1
  - ka: 2
    kb: 1
    kt: 1
  - ka: -1
    kb: -2
    kt: 2
  - ka: 1
    kb: 0
    kt: 2
  prompt: Evaluate the convolution (e^({{ka}}t) * e^({{kb}}t)) at t = {{kt}}.
  parts:
  - ask: Answer
    label: v
    tex: f*g
    value: (exp(ka*kt) - exp(kb*kt))/(ka - kb)
    tol: 0.005
    explain: ∫₀ᵗ e^(aτ)e^(b(t−τ)) dτ; in s-space it is 1/((s − a)(s − b))
  verify:
    expect:
      v: integrate(exp(ka*Y)*exp(kb*(kt - Y)), (Y, 0, kt))
- template: em-volterra-exponential
  skill: laplace.convolution
  pace: quick
  cases:
  - ka: 2
    kk: 1
    kt: 1
  - ka: 1
    kk: -2
    kt: 1
  - ka: 3
    kk: 2
    kt: 1
  - ka: 5
    kk: -1
    kt: 2
  prompt: y(t) = {{ka}} + {{kk}}∫₀ᵗ y(τ) dτ. Find y({{kt}}).
  parts:

- template: em-half-range-sine-coefficient
  skill: bvp.fourier-series
  pace: quick
  given:
    kl:
      pick:
      - 1
      - 2
      - 3
    kn:
      pick:
      - 1
      - 3
      - 5
  prompt: Expand f(x) = 1 on (0, {{kl}}) in a half-range sine series. Find b_{{kn}}.
  parts:
  - ask: Answer
    label: v
    tex: b_n

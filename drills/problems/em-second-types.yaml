- template: em-bessel-second-solution
  skill: series.special-functions
  pace: recall
  cases:
  - q: 1/2
    kc: 0
  - q: '0'
    kc: 1
  - q: '1'
    kc: 1
  - q: 1/3
    kc: 0
  - q: '2'
    kc: 1
  - q: 3/2
    kc: 0
  prompt: 'For Bessel''s equation of order ν = {{q}}, a second independent solution is:'
  parts:
  - ask: Answer
    label: v
    choice:
    - J₋ν
    - Y_ν, because J₋ν is not independent of J_ν
    correct: kc
    explain: For integer ν, J₋ν = (−1)^ν J_ν, so the Bessel function of the second kind is needed. For non-integer ν (including half-integers) J₋ν is independent
  verify:

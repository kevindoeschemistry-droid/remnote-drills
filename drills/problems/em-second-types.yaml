  prompt: '{{q}} This Sturm–Liouville problem is:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Regular
    - Periodic
    - Singular
    correct: kc
    explain: 'Regular: finite interval, p and r positive throughout, separated conditions at both ends. Singular: p vanishes at an end or the interval is infinite'
  verify:
    authored: true

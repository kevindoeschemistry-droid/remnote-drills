  pace: quick
  cases:
  - ks: 4
    kx: 0
  - ks: 9
    kx: 4
  - ks: 16
    kx: 3
  - ks: 1
    kx: 1
  - ks: 4
    kx: 2
  prompt: (x² + {{ks}})y″ + y = 0 is expanded in a power series about x = {{kx}}. What radius of convergence is guaranteed?
  parts:
  - ask: Answer
    label: v
    tex: R
    value: sqrt(kx^2 + ks)
    tol: 0.005
    explain: The radius is the distance to the nearest singular point in the complex plane, here ±i√s, even though the equation looks harmless on the real line
  verify:
    expect:
      v: Abs(kx - sqrt(ks)*I)
- template: em-indicial-p0
  skill: series.indicial
  pace: quick
  cases:
  - k1: 0.5
    k2: -1
  - k1: 1
    k2: -1
  - k1: 2
    k2: -2
  - k1: 0.5
    k2: -0.5
  - k1: 3
    k2: 1
  prompt: At a regular singular point the indicial equation r(r − 1) + p₀r + q₀ = 0 has roots {{k1}} and {{k2}}. Find p₀.
  parts:
  - ask: Answer
    label: v
    tex: p_0
    value: 1 - (k1 + k2)
    tol: 0.005
    explain: Written out, r² + (p₀ − 1)r + q₀ = 0, so the roots sum to 1 − p₀
  verify:
    expect:
      v: solve([nsimplify(k1)*(nsimplify(k1) - 1) + Symbol('m')*nsimplify(k1) + Y, nsimplify(k2)*(nsimplify(k2) - 1) + Symbol('m')*nsimplify(k2) + Y], [Symbol('m'), Y])[Symbol('m')]
- template: em-frobenius-case-from-roots
  skill: series.frobenius-case
  pace: recall
  cases:
  - q: 1/2 and 0
    kc: 0
  - q: 0 and 0
    kc: 1
  - q: 2 and −1
    kc: 2
  - q: 1/3 and −1/3
    kc: 0
  - q: 1 and 1
    kc: 1
  - q: 3 and 0
    kc: 2
  - q: 1/2 and −1/2
    kc: 2
  prompt: 'The indicial roots are {{q}}. The second solution:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Is a second Frobenius series, with no logarithm
    - Certainly contains a logarithm
    - May contain a logarithm
    correct: kc
    explain: 'Roots differing by a non-integer: two series. Equal roots: always a log. Differing by a positive integer (1/2 and −1/2 differ by 1): a log may or may not appear'
  verify:
    authored: true
- template: em-bessel-series-a2
  skill: series.indicial
  pace: quick
  given:
    kn:
      pick:
      - 1
      - 2
      - 3
      - 4
  prompt: For Bessel's equation of order {{kn}}, the Frobenius series from the larger root has a₀ = 1. Find a₂.
  parts:
  - ask: Answer
    label: v
    tex: a_2
    value: -1/(4*(1 + kn))
    tol: 0.005
    explain: The recurrence is a_k[(r + k)² − ν²] + a_(k−2) = 0 with r = ν
  verify:
    expect:
      v: solve(Eq(Symbol('m')*((kn + 2)**2 - kn**2) + 1, 0), Symbol('m'))[0]
- template: em-bessel-zero-scale
  skill: series.special-functions
  pace: quick
  given:
    kl:
      pick:
      - 2
      - 4
      - 5
      - 10
  prompt: J₀ first vanishes at 2.404826. What is the smallest λ > 0 for which y = J₀(λx) is zero at x = {{kl}}?
  parts:
  - ask: Answer
    label: v
    tex: \lambda
    value: 2.404826/kl
    tol: 0.005
    explain: λx must equal a zero of J₀, so λ = j₀₁/L. This is how a boundary condition picks out eigenvalues for a cylinder
  verify:

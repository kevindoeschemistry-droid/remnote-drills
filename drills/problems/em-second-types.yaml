    value: kr^2/(kal*pi^2)
    tol: 0.005
    explain: With v = ru the sphere becomes a rod of length R, so the slowest mode decays as exp(−απ²t/R²)
  verify:
    expect:
      v: 1/(nsimplify(kal)*Max(*solve(sin(x*nsimplify(kr)), x))**2)
- template: em-pde-method-pick
  skill: pde.laplace-transform
  pace: recall
  cases:
  - q: A finite rod with both ends held at 0 and a given initial profile.
    kc: 0
  - q: A finite rod with its ends held at two different constant temperatures.
    kc: 1
  - q: A semi-infinite solid whose surface temperature is stepped at t = 0.
    kc: 2
  - q: A rod whose conductivity depends on temperature.
    kc: 3
  - q: A finite rod with insulated ends and a given initial profile.
    kc: 0
  - q: An irregular plate with mixed boundary data.
    kc: 3
  prompt: '{{q}} The first move is:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Separation of variables as it stands
    - Subtract a steady state first
    - A Laplace transform in time or a similarity variable
    - Finite differences
    correct: kc
    explain: Separation needs a linear equation and homogeneous boundary conditions on a finite interval. Fix the boundary first if it is not homogeneous; no length scale means similarity or transforms
  verify:
    authored: true
- template: em-ghost-node-value
  skill: pde.review-5
  pace: quick
  cases:
  - kk: 10
    kq: 100
    kdx: 0.1
    ku: 50
  - kk: 2
    kq: 40
    kdx: 0.05
    ku: 20
  - kk: 50
    kq: 500
    kdx: 0.2
    ku: 80
  - kk: 1
    kq: 10
    kdx: 0.1
    ku: 30
  prompt: At the boundary node, the condition −k ∂u/∂x = q is applied with a central difference. With k = {{kk}}, q = {{kq}}, Δx = {{kdx}} and u₁ = {{ku}}, find the ghost value u₋₁.
  parts:
  - ask: Answer
    label: v
    tex: u_{-1}
    value: ku + 2*kdx*kq/kk
    tol: 0.005
    explain: '−k(u₁ − u₋₁)/(2Δx) = q. An insulated end (q = 0) simply mirrors: u₋₁ = u₁'
  verify:
    expect:
      v: solve(Eq(-kk*(ku - Symbol('m'))/(2*nsimplify(kdx)), kq), Symbol('m'))[0]
- template: em-crank-nicolson-one-node
  skill: pde.review-5
  pace: quick
  cases:
  - ku: 100
    kr: 0.5
  - ku: 80
    kr: 0.25
  - ku: 60
    kr: 2
  - ku: 50
    kr: 4
  prompt: A rod with both ends at 0 has one interior node, at {{ku}}. Take one Crank–Nicolson step with r = αΔt/Δx² = {{kr}}. Find the new value.
  parts:
  - ask: Answer
    label: v
    tex: u^{new}
    value: ku*(1 - kr)/(1 + kr)
    tol: 0.005
    explain: Average the second difference at the old and new time levels. The explicit scheme would give ku(1 − 2r), which blows up for r > 1
  verify:
    expect:
      v: solve(Eq(Symbol('m') - ku, nsimplify(kr)/2*((0 - 2*Symbol('m') + 0) + (0 - 2*ku + 0))), Symbol('m'))[0]
- template: em-fourier-sine-transform-exponential
  skill: bvp.fourier-series
  pace: quick
  cases:
  - ka: 1
    kw: 1
  - ka: 2
    kw: 1
  - ka: 1
    kw: 3
  - ka: 3
    kw: 4
  prompt: With the convention F_s(w) = √(2/π)∫₀^∞ f(x) sin wx dx, find the sine transform of e^(−{{ka}}x) at w = {{kw}}.
  parts:
  - ask: Answer
    label: v
    tex: F_s
    value: sqrt(2/pi)*kw/(ka^2 + kw^2)
    tol: 0.005
    explain: ∫₀^∞ e^(−ax) sin wx dx = w/(a² + w²)
  verify:
    expect:
      v: sqrt(2/pi)*integrate(exp(-ka*x)*sin(kw*x), (x, 0, oo))
- template: em-flux-divergence-source
  skill: calc.vector-calculus
  pace: quick
  given:
    ka:
      pick:
      - 2
      - 3
      - 5
    kx:
      pick:
      - 1
      - 2
      - 4
  prompt: In steady state the flux along a duct is J(x) = {{ka}}x². What must the generation rate per unit volume be at x = {{kx}}?
  parts:
  - ask: Answer
    label: v
    tex: s
    value: 2*ka*kx
    final: true
    tol: 0.0001
    explain: 'A balance on a thin slice: what leaves minus what enters equals what is generated, so the source is dJ/dx'
  verify:
    expect:
      v: limit((ka*(kx + Y)**2 - ka*kx**2)/Y, Y, 0)

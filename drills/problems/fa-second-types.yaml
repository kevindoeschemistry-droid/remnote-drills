# Generated by scripts/second_types.py from scripts/second_specs/fa2.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: fa-cash-flow-section
  skill: acct.statements
  pace: recall
  cases:
  - q: cash paid for dividends
    kc: 2
  - q: cash paid for equipment
    kc: 1
  - q: interest paid
    kc: 0
  - q: land acquired by issuing shares
    kc: 3
  - q: cash collected from customers
    kc: 0
  - q: repayment of loan principal
    kc: 2
  - q: dividends received
    kc: 0
  - q: cash paid for another company's bonds held as an investment
    kc: 1
  prompt: 'On a US GAAP statement of cash flows, {{q}} is reported in:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Operating activities
    - Investing activities
    - Financing activities
    - A noncash disclosure, outside the three sections
    correct: kc
    explain: 'Operating: what runs through net income, including interest paid and received and dividends received. Investing: long-lived assets and investments. Financing: owners and lenders. No cash, no section'
  verify:
    authored: true
- template: fa-nfp-restricted-balance
  skill: acct.nfp-gov
  pace: quick
  given:
    kx:
      pick:
      - 50000
      - 80000
      - 120000
    ky:
      pick:
      - 20000
      - 35000
      - 50000
  prompt: A not-for-profit receives {{kx}} restricted by the donor to a programme and spends {{ky}} on that programme in the same year. By how much do net assets with donor restrictions rise for the year?
  parts:
  - ask: Answer
    label: v
    tex: \Delta
    value: kx - ky
    final: true
    tol: 0.0001
    explain: The gift raises net assets with donor restrictions; spending for the purpose releases that amount to net assets without donor restrictions
  verify:
    expect:
      v: solve(Eq(Symbol('m') + ky, kx), Symbol('m'))[0]
- template: fa-segment-75-test
  skill: acct.statements
  pace: quick
  given:
    kx:
      pick:
      - 400000
      - 1000000
      - 2400000
  prompt: A public company's consolidated external revenue is {{kx}}. Its reportable segments must together account for at least how much external revenue?
  parts:
  - ask: Answer
    label: v
    tex: revenue
    value: 0.75*kx
    tol: 0.005
    explain: After the 10% tests, more segments are added until the reportable ones cover 75% of consolidated external revenue
  verify:
    expect:
      v: Rational(3, 4)*kx
- template: fa-cash-to-accrual-revenue
  skill: acct.statements
  pace: quick
  cases:
  - kc: 90000
    ka: 10000
    kb: 15000
  - kc: 120000
    ka: 20000
    kb: 12000
  - kc: 64000
    ka: 5000
    kb: 9000
  - kc: 250000
    ka: 30000
    kb: 30000
  prompt: Under the cash basis a business reports {{kc}} collected from customers. Accounts receivable rose from {{ka}} to {{kb}} during the year. What is revenue on the accrual basis?
  parts:
  - ask: Answer
    label: v
    tex: revenue
    value: kc + kb - ka
    final: true
    tol: 0.0001
    explain: 'Roll the receivable forward: beginning + revenue − collections = ending'
  verify:
    expect:
      v: solve(Eq(ka + Symbol('m') - kc, kb), Symbol('m'))[0]
- template: fa-avoidable-interest
  skill: acct.long-lived
  pace: quick
  cases:
  - kw: 500000
    ks: 300000
    k1: 8
    k2: 6
  - kw: 800000
    ks: 500000
    k1: 10
    k2: 7
  - kw: 400000
    ks: 100000
    k1: 6
    k2: 9
  - kw: 1000000
    ks: 600000
    k1: 5
    k2: 8
  prompt: Weighted-average accumulated expenditures on a self-built asset were {{kw}}. A {{ks}} construction loan carries {{k1}}%, and other debt averages {{k2}}%. Actual interest for the year was higher than the result. How much interest is capitalized?
  parts:
  - ask: Answer
    label: v
    tex: interest
    value: ks*k1/100 + (kw - ks)*k2/100
    tol: 0.005
    explain: Use the specific loan's rate up to its amount and the weighted rate of other debt on the rest; the total can never exceed actual interest
  verify:
    expect:
      v: Rational(k1, 100)*ks + Rational(k2, 100)*(kw - ks)
- template: fa-goodwill-after-impairment
  skill: acct.long-lived
  pace: quick
  cases:
  - kg: 200000
    kc: 900000
    kf: 800000
  - kg: 100000
    kc: 700000
    kf: 550000
  - kg: 300000
    kc: 1200000
    kf: 1150000
  - kg: 150000
    kc: 400000
    kf: 320000
  prompt: A reporting unit carries goodwill of {{kg}}. Its total carrying amount is {{kc}} and its fair value is {{kf}}. What goodwill remains on the balance sheet after the impairment test?
  parts:
  - ask: Answer
    label: v
    tex: goodwill
    value: kg - min(kg, kc - kf)
    final: true
    tol: 0.0001
    explain: The loss is the excess of carrying amount over fair value, but never more than the goodwill itself
  verify:
    expect:
      v: kg - Min(kg, kc - kf)
- template: fa-note-principal-from-accrual
  skill: acct.liabilities
  pace: quick
  cases:
  - ki: 300
    km: 3
    kr: 6
  - ki: 500
    km: 6
    kr: 5
  - ki: 240
    km: 4
    kr: 8
  - ki: 750
    km: 9
    kr: 10
  prompt: Year-end accrued interest on a {{kr}}% note signed {{km}} months before year end is {{ki}}. What is the note's principal?
  parts:
  - ask: Answer
    label: v
    tex: principal
    value: ki*1200/(kr*km)
    final: true
    tol: 0.0001
    explain: Interest = principal × annual rate × months/12, read backwards
  verify:
    expect:
      v: solve(Eq(Symbol('m')*Rational(kr, 100)*Rational(km, 12), ki), Symbol('m'))[0]
- template: fa-change-treatment
  skill: acct.transactions
  pace: recall
  cases:
  - q: A switch from FIFO to weighted-average inventory costing
    kc: 0
  - q: A revised useful life for equipment
    kc: 1
  - q: A change in depreciation method
    kc: 1
  - q: A prior-year inventory count that was added up wrong
    kc: 2
  - q: A change from an accounting method that was never acceptable to GAAP
    kc: 2
  - q: A revised estimate of uncollectible receivables
    kc: 1
  - q: A change in the entities included in the consolidated statements
    kc: 0
  prompt: '{{q}} is accounted for:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Retrospectively, by adjusting prior periods presented
    - Prospectively, in the current and future periods
    - By restating prior periods as the correction of an error
    correct: kc
    explain: 'Principle and reporting entity: retrospective. Estimate: prospective, and a change in depreciation method is treated as a change in estimate. A mistake, including moving from non-GAAP to GAAP: restatement'
  verify:
    authored: true
- template: fa-contingency-amount
  skill: acct.transactions
  pace: recall
  cases:
  - q: A loss is probable and estimated between two amounts, with no amount in the range more likely than another.
    kc: 0
  - q: A loss is probable, and one amount within the range is the best estimate.
    kc: 1
  - q: A loss is reasonably possible.
    kc: 2
  - q: A loss is remote (and is not a guarantee).
    kc: 3
  - q: A gain is probable.
    kc: 2
  - q: A loss is probable but cannot be reasonably estimated.
    kc: 2
  prompt: '{{q}} The company should:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Accrue the low end of the range and disclose the exposure above it
    - Accrue the best estimate
    - Disclose only
    - Neither accrue nor disclose
    correct: kc
    explain: Accrue only when probable and estimable; with a range and no best estimate, accrue the minimum. Gain contingencies are not recognised until realised
  verify:
    authored: true
- template: fa-subsequent-event-liability
  skill: acct.transactions
  pace: quick
  cases:
  - ka: 100000
    kb: 140000
    kt: 1
    q: the same case was settled for
  - ka: 250000
    kb: 200000
    kt: 1
    q: the same case was settled for
  - ka: 100000
    kb: 60000
    kt: 0
    q: a new, unrelated suit over an accident that happened after year end was settled for
  - ka: 80000
    kb: 300000
    kt: 0
    q: a fire after year end caused an uninsured loss of
  prompt: At year end a company had accrued {{ka}} for a lawsuit. Before the statements were issued, {{q}} {{kb}}. What liability does the year-end balance sheet report?
  parts:
  - ask: Answer
    label: v
    tex: liability
    value: ka + kt*(kb - ka)
    final: true
    tol: 0.0001
    explain: Evidence about a condition that existed at the balance sheet date adjusts the statements. A new event after year end is disclosed, not recognised
  verify:
    expect:
      v: kt*kb + (1 - kt)*ka

# NCLEX-RN calculations: dosage, IV and titrated infusions, blood compatibility, scores and lab
# interpretation (framework nclex-rn, NR). Every answer is recomputed by tests/verify/data.py, scores
# and ABGs through the separate tables in tests/verify/nursing.py.

# ── dosage ────────────────────────────────────────────────────────────────────
- template: nr-tablets
  skill: nurs.dosage
  pace: quick
  given: { H: { pick: [5, 10, 12.5, 25, 50, 100, 250, 500] }, n: { pick: [0.5, 1.5, 2, 3] } }
  prompt: 'The order is ${{n*H}}$ mg by mouth. Tablets on hand are ${{H}}$ mg each. How many tablets do you give?'
  parts:
    - { ask: 'Tablets', label: tabs, value: n, tol: 0.000001, final: true, explain: 'Desired over have: ${{n*H}} \div {{H}} = {{n}}$. A half tablet is fine only if it is scored' }
  verify: { expect: { tabs: "nsimplify(n*H)/nsimplify(H)" } }

- template: nr-liquid
  skill: nurs.dosage
  pace: quick
  given: { ml: { pick: [2, 2.5, 4, 7.5, 10, 15] } }
  cases:
    - { H: 125, V: 5 }
    - { H: 250, V: 5 }
    - { H: 100, V: 5 }
    - { H: 40, V: 5 }
    - { H: 20, V: 1 }
    - { H: 200, V: 5 }
  prompt: 'The order is ${{ml*H/V}}$ mg. The suspension is ${{H}}$ mg per ${{V}}$ mL. How many mL do you give?'
  parts:
    - { ask: 'Volume (mL)', label: vol, value: ml, tol: 0.000001, final: true, explain: '$\dfrac{D}{H}\times V = \dfrac{ {{ml*H/V}} }{ {{H}} }\times {{V}} = {{ml}}$ mL' }
  verify: { expect: { vol: "nsimplify(ml*H/V)/H*V" } }

- template: nr-lb-kg
  skill: nurs.dosage
  pace: recall
  given: { kg: { pick: [5, 8, 12, 15, 20, 25, 30, 45, 60, 70, 80, 90] } }
  prompt: 'A client weighs ${{kg*2.2}}$ lb. What is the weight in kilograms?'
  parts:
    - { ask: 'Weight (kg)', label: w, value: kg, tol: 0.000001, final: true, explain: 'Divide pounds by 2.2: ${{kg*2.2}} \div 2.2 = {{kg}}$ kg. Weight-based doses always use kilograms' }
  verify: { expect: { w: "nsimplify(kg*2.2)/nsimplify(2.2)" } }

- template: nr-weight-dose
  skill: nurs.dosage
  pace: quick
  given: { d: { pick: [0.1, 0.5, 1, 2, 5, 10, 15] }, w: { pick: [8, 12, 16, 20, 24, 30] } }
  prompt: 'The order is ${{d}}$ mg/kg per dose. The child weighs ${{w}}$ kg. How many mg is one dose?'
  parts:
    - { ask: 'Dose (mg)', label: mg, value: d*w, tol: 0.000001, final: true, explain: '${{d}}\ \text{mg/kg} \times {{w}}\ \text{kg} = {{d*w}}$ mg' }
  verify: { expect: { mg: "nsimplify(d)*w" } }

- template: nr-daily-divided
  skill: nurs.dosage
  pace: quick
  given: { d: { pick: [20, 30, 40, 50, 60, 80, 100] }, w: { pick: [6, 9, 12, 15, 18, 24] } }
  cases:
    - { n: 4, q: "every 6 hours" }
    - { n: 3, q: "every 8 hours" }
    - { n: 2, q: "every 12 hours" }
  prompt: 'The order is ${{d}}$ mg/kg/day divided {{q}}. The child weighs ${{w}}$ kg. How many mg is each dose?'
  parts:
    - { ask: 'Each dose (mg)', label: mg, value: d*w/n, tol: 0.000001, final: true, explain: 'Daily total ${{d}} \times {{w}} = {{d*w}}$ mg; {{q}} is {{n}} doses a day, so ${{d*w}} \div {{n}} = {{d*w/n}}$ mg' }
  verify: { expect: { mg: "Rational(d*w, n)" } }

- template: nr-safe-range
  skill: nurs.dosage
  pace: quick
  given: { w: { pick: [10, 12, 15, 20, 25] } }
  cases:
    - { lo: 25, hi: 50, n: 4, q: "every 6 hours", D: 100 }
    - { lo: 25, hi: 50, n: 4, q: "every 6 hours", D: 400 }
    - { lo: 25, hi: 50, n: 4, q: "every 6 hours", D: 50 }
    - { lo: 40, hi: 60, n: 3, q: "every 8 hours", D: 200 }
    - { lo: 40, hi: 60, n: 3, q: "every 8 hours", D: 100 }
    - { lo: 40, hi: 60, n: 3, q: "every 8 hours", D: 500 }
    - { lo: 10, hi: 20, n: 2, q: "every 12 hours", D: 100 }
  prompt: 'The safe range is ${{lo}}$–${{hi}}$ mg/kg/day. A ${{w}}$ kg child is ordered ${{D}}$ mg {{q}}. Is the order safe?'
  parts:
    - ask: 'The order is'
      label: a
      choice: ["Within the safe range", "Below the range (underdose)", "Above the range (overdose)"]
      correct: 'D*n < lo*w ? 1 : (D*n > hi*w ? 2 : 0)'
      explain: 'Safe daily range ${{lo*w}}$–${{hi*w}}$ mg. Ordered per day: ${{D}} \times {{n}} = {{D*n}}$ mg. Outside the range, hold it and call the prescriber'
  verify: { choices: { a: "1 if D*n < lo*w else (2 if D*n > hi*w else 0)" } }

- template: nr-reconstitute
  skill: nurs.dosage
  pace: quick
  cases:
    - { vial: 1000, dil: 3.5, conc: 250, D: 500 }
    - { vial: 500, dil: 2, conc: 250, D: 375 }
    - { vial: 1000, dil: 4, conc: 250, D: 750 }
    - { vial: 2000, dil: 10, conc: 200, D: 900 }
    - { vial: 250, dil: 1, conc: 250, D: 200 }
    - { vial: 1000, dil: 10, conc: 100, D: 650 }
  prompt: 'A ${{vial}}$ mg vial says: add ${{dil}}$ mL of diluent to make ${{conc}}$ mg/mL. The order is ${{D}}$ mg. How many mL do you draw up?'
  parts:
    - { ask: 'Volume (mL)', label: vol, value: D/conc, tol: 0.01, explain: 'Use the concentration the label gives after mixing, not the diluent volume: ${{D}} \div {{conc}} = {{D/conc|3}}$ mL' }
  verify: { expect: { vol: "nsimplify(D)/nsimplify(conc)" } }

# ── IV and titrated infusions ─────────────────────────────────────────────────
- template: nr-iv-mlh
  skill: nurs.dosage
  pace: recall
  given: { r: { pick: [50, 75, 100, 125, 150, 200, 250] }, h: { pick: [2, 4, 6, 8, 10, 12] } }
  prompt: 'Infuse ${{r*h}}$ mL over ${{h}}$ hours on a pump. What rate do you set (mL/h)?'
  parts:
    - { ask: 'Rate (mL/h)', label: rate, value: r, tol: 0.000001, final: true, explain: '${{r*h}} \div {{h}} = {{r}}$ mL/h' }
  verify: { expect: { rate: "Rational(r*h, h)" } }

- template: nr-gtt
  skill: nurs.dosage
  pace: quick
  given: { g: { int: [14, 50] }, h: { pick: [1, 2, 4, 8] } }
  cases:
    - { df: 15 }
    - { df: 10 }
    - { df: 20 }
    - { df: 60 }
  prompt: 'Infuse ${{g*60*h/df}}$ mL over ${{h}}$ h by gravity with tubing of ${{df}}$ gtt/mL. How many drops per minute?'
  parts:
    - { ask: 'Drops per minute', label: gtt, value: g, tol: 0.000001, final: true, explain: '$\dfrac{\text{mL} \times \text{drop factor}}{\text{minutes}} = \dfrac{ {{g*60*h/df}} \times {{df}} }{ {{60*h}} } = {{g}}$ gtt/min. With 60 gtt/mL (microdrip), gtt/min equals mL/h' }
  verify: { expect: { gtt: "nsimplify(g*60*h/df)*df/(60*h)" } }

- template: nr-infusion-time
  skill: nurs.dosage
  pace: quick
  given: { hrs: { pick: [2, 2.5, 4, 5, 6, 8, 10] }, r: { pick: [50, 80, 100, 125, 200] } }
  prompt: '${{hrs*r}}$ mL is running at ${{r}}$ mL/h. How many hours will it take?'
  parts:
    - { ask: 'Time (h)', label: t, value: hrs, tol: 0.000001, final: true, explain: '${{hrs*r}} \div {{r}} = {{hrs}}$ h' }
  verify: { expect: { t: "nsimplify(hrs*r)/r" } }

- template: nr-heparin-rate
  skill: nurs.dosage
  pace: quick
  given: { u: { pick: [800, 1000, 1200, 1300, 1500, 1600, 1800] } }
  cases:
    - { bag: 25000, V: 250 }
    - { bag: 25000, V: 500 }
    - { bag: 20000, V: 500 }
  prompt: 'Heparin ${{bag}}$ units in ${{V}}$ mL. The order is ${{u}}$ units/h. What rate do you set (mL/h)?'
  parts:
    - { ask: 'Rate (mL/h)', label: rate, value: u*V/bag, tol: 0.000001, final: true, explain: 'Concentration ${{bag}} \div {{V}} = {{bag/V}}$ units/mL, so ${{u}} \div {{bag/V}} = {{u*V/bag}}$ mL/h' }
  verify: { expect: { rate: "Rational(u, 1)/Rational(bag, V)" } }

- template: nr-heparin-units
  skill: nurs.dosage
  pace: quick
  given: { r: { pick: [8, 10, 12, 14, 15, 18, 20] } }
  cases:
    - { bag: 25000, V: 250 }
    - { bag: 25000, V: 500 }
    - { bag: 20000, V: 500 }
  prompt: 'Heparin ${{bag}}$ units in ${{V}}$ mL is running at ${{r}}$ mL/h. How many units per hour is the client getting?'
  parts:
    - { ask: 'Units per hour', label: uph, value: r*bag/V, tol: 0.000001, final: true, explain: '${{r}}\ \text{mL/h} \times {{bag/V}}\ \text{units/mL} = {{r*bag/V}}$ units/h' }
  verify: { expect: { uph: "r*Rational(bag, V)" } }

- template: nr-mcg-kg-min
  skill: nurs.dosage
  pace: quick
  given: { d: { pick: [2, 3, 5, 8, 10] }, w: { pick: [50, 60, 70, 80, 90, 100] } }
  cases:
    - { drug: "Dopamine", mg: 400, V: 250 }
    - { drug: "Dobutamine", mg: 250, V: 250 }
    - { drug: "Dopamine", mg: 800, V: 500 }
  prompt: '{{drug}} ${{mg}}$ mg in ${{V}}$ mL. The order is ${{d}}$ mcg/kg/min for a ${{w}}$ kg client. What rate do you set (mL/h)?'
  parts:
    - { ask: 'Rate (mL/h)', label: rate, value: d*w*60*V/(mg*1000), tol: 0.01, explain: 'Dose per hour ${{d}} \times {{w}} \times 60 = {{d*w*60}}$ mcg/h. Concentration ${{mg*1000/V}}$ mcg/mL. Rate $= {{d*w*60}} \div {{mg*1000/V}} = {{d*w*60*V/(mg*1000)|3}}$ mL/h' }
  verify: { expect: { rate: "Rational(d*w*60, 1)/Rational(mg*1000, V)" } }

- template: nr-insulin-drip
  skill: nurs.dosage
  pace: quick
  given: { u: { pick: [2, 3, 4, 5, 6, 8, 10] } }
  cases:
    - { bag: 100, V: 100 }
    - { bag: 50, V: 250 }
    - { bag: 100, V: 250 }
  prompt: 'Regular insulin ${{bag}}$ units in ${{V}}$ mL normal saline. The order is ${{u}}$ units/h. What rate do you set (mL/h)?'
  parts:
    - { ask: 'Rate (mL/h)', label: rate, value: u*V/bag, tol: 0.000001, final: true, explain: 'Concentration ${{bag/V}}$ units/mL, so ${{u}} \div {{bag/V}} = {{u*V/bag}}$ mL/h. Only regular insulin goes IV' }
  verify: { expect: { rate: "Rational(u*V, bag)" } }

# ── blood ─────────────────────────────────────────────────────────────────────
- template: nr-abo
  skill: nurs.pharm
  pace: quick
  cases:
    - { rt: "A+", rec: 1, rrh: 1, dt: "O−", don: 0, drh: 0, ans: 0 }
    - { rt: "A−", rec: 1, rrh: 0, dt: "A+", don: 1, drh: 1, ans: 1 }
    - { rt: "B+", rec: 2, rrh: 1, dt: "A+", don: 1, drh: 1, ans: 1 }
    - { rt: "AB+", rec: 3, rrh: 1, dt: "B−", don: 2, drh: 0, ans: 0 }
    - { rt: "O+", rec: 0, rrh: 1, dt: "A+", don: 1, drh: 1, ans: 1 }
    - { rt: "O−", rec: 0, rrh: 0, dt: "O−", don: 0, drh: 0, ans: 0 }
    - { rt: "AB−", rec: 3, rrh: 0, dt: "A+", don: 1, drh: 1, ans: 1 }
    - { rt: "B−", rec: 2, rrh: 0, dt: "O−", don: 0, drh: 0, ans: 0 }
    - { rt: "AB+", rec: 3, rrh: 1, dt: "A+", don: 1, drh: 1, ans: 0 }
  prompt: 'A client with type {{rt}} blood needs packed red cells. Can they receive a unit of {{dt}}?'
  parts:
    - { ask: 'Red cells', label: a, choice: ["Compatible", "Not compatible"], correct: ans, explain: 'Donor cells must carry no antigen the recipient lacks (O has none: universal red-cell donor; AB has both: universal recipient), and an Rh− client gets Rh− cells' }
  verify: { choices: { a: "abo_ok(rec, rrh, don, drh)" } }

# ── scores ────────────────────────────────────────────────────────────────────
- template: nr-gcs
  skill: nurs.risk-reduction
  pace: quick
  cases:
    - { et: "to voice", vt: "confused", mt: "obeys commands", s: 13 }
    - { et: "to pain", vt: "incomprehensible sounds", mt: "withdraws from pain", s: 8 }
    - { et: "not at all", vt: "no verbal response", mt: "extension", s: 4 }
    - { et: "spontaneously", vt: "oriented", mt: "obeys commands", s: 15 }
    - { et: "to pain", vt: "inappropriate words", mt: "localizes pain", s: 10 }
    - { et: "not at all", vt: "no verbal response", mt: "abnormal flexion", s: 5 }
    - { et: "spontaneously", vt: "confused", mt: "localizes pain", s: 13 }
  prompt: 'A client opens their eyes {{et}}, verbal response: {{vt}}, motor response: {{mt}}. What is the Glasgow Coma Scale score?'
  parts:
    - { ask: 'GCS', label: g, value: s, tol: 0.000001, final: true, explain: 'Eyes 1–4, verbal 1–5, motor 1–6, total 3–15. Abnormal flexion (decorticate) is 3, extension (decerebrate) is 2. 8 or less usually means the airway needs protecting' }
  verify: { expect: { g: "gcs(et, vt, mt)" } }

- template: nr-apgar
  skill: nurs.health-promotion
  pace: quick
  cases:
    - { hr: 140, resp: "good cry", tone: "active motion", refl: "cry or sneeze", color: "pink body, blue hands and feet", s: 9 }
    - { hr: 90, resp: "slow and irregular", tone: "some flexion", refl: "grimace", color: "pink body, blue hands and feet", s: 5 }
    - { hr: 110, resp: "good cry", tone: "limp", refl: "grimace", color: "completely pink", s: 7 }
    - { hr: 80, resp: "absent", tone: "limp", refl: "no response", color: "blue or pale", s: 1 }
    - { hr: 150, resp: "good cry", tone: "active motion", refl: "cry or sneeze", color: "completely pink", s: 10 }
    - { hr: 120, resp: "slow and irregular", tone: "some flexion", refl: "cry or sneeze", color: "blue or pale", s: 6 }
  prompt: 'At one minute: heart rate {{hr}}, respirations: {{resp}}, tone: {{tone}}, reflex irritability: {{refl}}, color: {{color}}. What is the APGAR score?'
  parts:
    - { ask: 'APGAR', label: g, value: s, tol: 0.000001, final: true, explain: 'Each sign scores 0–2. Heart rate: absent 0, below 100 is 1, 100 or more is 2. Blue hands and feet (acrocyanosis) score 1 for color. 7–10 is reassuring' }
  verify: { expect: { g: "apgar(hr, resp, tone, refl, color)" } }

- template: nr-rule-nines
  skill: nurs.physiological
  pace: quick
  cases:
    - { atex: "both entire arms and the front of the trunk", codes: "ra la ft", s: 36 }
    - { atex: "the entire right leg and the perineum", codes: "rl pe", s: 19 }
    - { atex: "the head and both entire arms", codes: "hd ra la", s: 27 }
    - { atex: "the back of the trunk and the backs of both legs", codes: "bt brl bll", s: 36 }
    - { atex: "the front of the trunk and the front of the right leg", codes: "ft frl", s: 27 }
    - { atex: "the head, the entire left arm and the entire left leg", codes: "hd la ll", s: 36 }
  prompt: 'An adult has partial- and full-thickness burns over {{atex}}. By the rule of nines, what percent of body surface is burned?'
  parts:
    - { ask: 'TBSA (%)', label: p, value: s, tol: 0.000001, final: true, explain: 'Adult rule of nines: head 9, each arm 9, front of trunk 18, back of trunk 18, each leg 18 (front 9, back 9), perineum 1' }
  verify: { expect: { p: "nines(codes)" } }

- template: nr-parkland
  skill: nurs.physiological
  pace: quick
  given: { w: { pick: [50, 60, 70, 80, 90, 100] }, t: { pick: [20, 30, 40, 50, 60] } }
  prompt: 'A ${{w}}$ kg adult has ${{t}}$% TBSA burns. By the Parkland formula, what rate (mL/h) runs for the first 8 hours?'
  parts:
    - { ask: 'Rate (mL/h)', label: rate, value: 4*w*t/2/8, tol: 0.000001, final: true, explain: '24-hour total $4 \times {{w}} \times {{t}} = {{4*w*t}}$ mL of lactated Ringer''s; half in the first 8 hours from the time of the burn: ${{2*w*t}} \div 8 = {{w*t/4}}$ mL/h' }
  verify: { expect: { rate: "Rational(4*w*t, 2)/8" } }

- template: nr-maintenance-fluid
  skill: nurs.physiological
  pace: quick
  given: { w: { pick: [4, 7, 12, 15, 18, 22, 25, 30, 40] } }
  prompt: 'By the 4-2-1 rule (Holliday–Segar), what is the hourly maintenance fluid rate for a ${{w}}$ kg child?'
  parts:
    - { ask: 'Rate (mL/h)', label: rate, value: '4*min(w, 10) + 2*min(max(w - 10, 0), 10) + max(w - 20, 0)', tol: 0.000001, final: true, explain: '4 mL/h for each of the first 10 kg, 2 mL/h for each of the next 10 kg, 1 mL/h for each kg above 20' }
  verify: { expect: { rate: "holliday(w)" } }

- template: nr-map
  skill: nurs.risk-reduction
  pace: quick
  cases:
    - { S: 120, D: 80 }
    - { S: 90, D: 60 }
    - { S: 150, D: 90 }
    - { S: 84, D: 48 }
    - { S: 110, D: 50 }
    - { S: 135, D: 75 }
    - { S: 75, D: 42 }
  prompt: 'Blood pressure ${{S}}/{{D}}$ mm Hg. What is the mean arterial pressure?'
  parts:
    - { ask: 'MAP (mm Hg)', label: m, value: (S + 2*D)/3, tol: 0.000001, final: true, explain: '$\text{MAP} = \dfrac{S + 2D}{3} = \dfrac{ {{S}} + {{2*D}} }{3} = {{(S + 2*D)/3}}$. Below about 65 the organs are underperfused' }
  verify: { expect: { m: "Rational(S, 3) + Rational(2*D, 3)" } }

- template: nr-io-total
  skill: nurs.basic-care
  pace: quick
  given: { a: { pick: [4, 6, 8, 10] }, b: { pick: [4, 6, 8, 12] }, c: { pick: [120, 240, 360, 500] } }
  prompt: 'Over a shift the client drinks ${{a}}$ oz of juice and ${{b}}$ oz of tea and receives ${{c}}$ mL of IV fluid. What is the total intake in mL?'
  parts:
    - { ask: 'Intake (mL)', label: io, value: 30*(a + b) + c, tol: 0.000001, final: true, explain: '1 oz = 30 mL: $({{a}} + {{b}}) \times 30 = {{30*(a + b)}}$ mL, plus {{c}} mL IV $= {{30*(a + b) + c}}$ mL' }
  verify: { expect: { io: "30*a + 30*b + c" } }

- template: nr-bmi
  skill: nurs.health-promotion
  pace: quick
  cases:
    - { kg: 70, m: 1.75 }
    - { kg: 90, m: 1.7 }
    - { kg: 50, m: 1.6 }
    - { kg: 110, m: 1.8 }
    - { kg: 62, m: 1.55 }
  prompt: 'A client is ${{kg}}$ kg and ${{m}}$ m tall. What is the BMI?'
  parts:
    - { ask: 'BMI (kg/m²)', label: b, value: kg/m^2, tol: 0.01, explain: '$\text{BMI} = \dfrac{\text{kg}}{\text{m}^2} = \dfrac{ {{kg}} }{ {{m}}^2 } = {{kg/m^2|3}}$. Under 18.5 underweight, 18.5–24.9 normal, 25–29.9 overweight, 30 and over obese' }
  verify: { expect: { b: "kg/nsimplify(m)**2" } }

# ── labs ──────────────────────────────────────────────────────────────────────
- template: nr-abg
  skill: nurs.risk-reduction
  pace: quick
  cases: &abg
    - { pH: 7.30, co2: 50, hco3: 24, p: 0, c: 0 }
    - { pH: 7.50, co2: 30, hco3: 24, p: 1, c: 0 }
    - { pH: 7.28, co2: 40, hco3: 18, p: 2, c: 0 }
    - { pH: 7.52, co2: 42, hco3: 32, p: 3, c: 0 }
    - { pH: 7.33, co2: 55, hco3: 30, p: 0, c: 1 }
    - { pH: 7.37, co2: 52, hco3: 31, p: 0, c: 2 }
    - { pH: 7.32, co2: 30, hco3: 16, p: 2, c: 1 }
    - { pH: 7.36, co2: 28, hco3: 15, p: 2, c: 2 }
    - { pH: 7.48, co2: 48, hco3: 34, p: 3, c: 1 }
    - { pH: 7.44, co2: 47, hco3: 31, p: 3, c: 2 }
    - { pH: 7.47, co2: 29, hco3: 20, p: 1, c: 1 }
    - { pH: 7.43, co2: 30, hco3: 20, p: 1, c: 2 }
  prompt: 'ABG: pH ${{pH}}$, PaCO$_2$ ${{co2}}$ mm Hg, HCO$_3^-$ ${{hco3}}$ mEq/L. What is the primary disorder?'
  parts:
    - { ask: 'Primary disorder', label: a, choice: ["Respiratory acidosis", "Respiratory alkalosis", "Metabolic acidosis", "Metabolic alkalosis"], correct: p, explain: 'pH 7.35–7.45, PaCO₂ 35–45, HCO₃⁻ 22–26. Pick the side from the pH (a normal pH by its side of 7.40), then ask which value matches it: PaCO₂ moves opposite to pH in a respiratory problem, HCO₃⁻ moves with pH in a metabolic one (ROME)' }
  verify: { choices: { a: "abg_primary(nsimplify(pH), co2, hco3)" } }

- template: nr-abg-compensation
  skill: nurs.risk-reduction
  pace: quick
  cases: *abg
  prompt: 'ABG: pH ${{pH}}$, PaCO$_2$ ${{co2}}$ mm Hg, HCO$_3^-$ ${{hco3}}$ mEq/L. How compensated is it?'
  parts:
    - { ask: 'Compensation', label: a, choice: ["Uncompensated", "Partially compensated", "Fully compensated"], correct: c, explain: 'Only one value abnormal: uncompensated. Both abnormal (the second moving to correct the first) with pH still abnormal: partial. Both abnormal with pH back in 7.35–7.45: full' }
  verify: { choices: { a: "abg_comp(nsimplify(pH), co2, hco3)" } }

- template: nr-lab-flag
  skill: nurs.risk-reduction
  pace: recall
  cases:
    - { lab: "potassium", val: 6.1, unit: "mEq/L", lo: 3.5, hi: 5.0 }
    - { lab: "potassium", val: 3.1, unit: "mEq/L", lo: 3.5, hi: 5.0 }
    - { lab: "potassium", val: 4.2, unit: "mEq/L", lo: 3.5, hi: 5.0 }
    - { lab: "sodium", val: 128, unit: "mEq/L", lo: 135, hi: 145 }
    - { lab: "sodium", val: 150, unit: "mEq/L", lo: 135, hi: 145 }
    - { lab: "calcium", val: 7.8, unit: "mg/dL", lo: 9.0, hi: 10.5 }
    - { lab: "magnesium", val: 1.0, unit: "mEq/L", lo: 1.3, hi: 2.1 }
    - { lab: "platelets", val: 85000, unit: "/mm³", lo: 150000, hi: 400000 }
    - { lab: "WBC", val: 14500, unit: "/mm³", lo: 5000, hi: 10000 }
    - { lab: "BUN", val: 15, unit: "mg/dL", lo: 10, hi: 20 }
    - { lab: "creatinine", val: 2.4, unit: "mg/dL", lo: 0.6, hi: 1.2 }
    - { lab: "fasting glucose", val: 58, unit: "mg/dL", lo: 70, hi: 110 }
  prompt: 'A client''s serum {{lab}} is ${{val}}$ {{unit}}. Is it low, within range, or high?'
  parts:
    - { ask: 'Value is', label: a, choice: ["Low", "Within the usual range", "High"], correct: 'val < lo ? 0 : (val > hi ? 2 : 1)', explain: 'Usual adult range {{lo}}–{{hi}} {{unit}} (ranges vary a little by lab). Potassium 3.5–5.0, sodium 135–145, calcium 9.0–10.5, magnesium 1.3–2.1' }
  verify: { choices: { a: "0 if nsimplify(val) < nsimplify(lo) else (2 if nsimplify(val) > nsimplify(hi) else 1)" } }

- template: ra-abs-interval
  skill: ra.reals
  pace: quick
  given:
    ka:
      pick:
      - 2
      - 3
      - 4
    kb:
      pick:
      - 1
      - 3
      - 5
    kc:
      pick:
      - 7
      - 9
      - 11
  prompt: What is the largest x satisfying |{{ka}}x − {{kb}}| ≤ {{kc}}?
  parts:
  - ask: Answer
    label: v
    tex: x
    value: (kb + kc)/ka
    tol: 0.005
    explain: The inequality says −c ≤ ax − b ≤ c, so x runs from (b − c)/a to (b + c)/a
  verify:
    expect:
      v: Max(solve(Eq(ka*Y - kb, kc), Y)[0], solve(Eq(ka*Y - kb, -kc), Y)[0])
- template: ra-triangle-inequality
  skill: ra.reals
  pace: recall
  cases:
  - q: 'If |x − 2| < 0.1 and |y − 2| < 0.1, the triangle inequality guarantees |x − y| is less than:'
    o1: '0.2'
    o2: '0.1'
    o3: '0.01'
    o4: '0.4'
  - q: 'If |x| ≤ 3 and |y| ≤ 5, the largest possible value of |x − y| is:'
    o1: '8'
    o2: '2'
    o3: '15'
    o4: '5'
  - q: 'The reverse triangle inequality says ||x| − |y|| is at most:'
    o1: '|x − y|'
    o2: '|x| + |y|'
    o3: '|xy|'
    o4: '|x| − |y|'
  - q: 'If |x − 5| < 1, then |x| is less than:'
    o1: '6'
    o2: '4'
    o3: '5'
    o4: '1'
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: 'Insert a middle point: |x − y| ≤ |x − 2| + |2 − y|. Almost every ε-proof is this move'
  verify:
    authored: true

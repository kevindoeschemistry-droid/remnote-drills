- template: ra-rearrangement-facts
  skill: ra.series
  pace: recall
  cases:
  - q: 'Rearranging the terms of an absolutely convergent series:'
    o1: Never changes the sum
    o2: Can change the sum
    o3: Makes it diverge
    o4: Makes it conditionally convergent
  - q: 'The alternating harmonic series can be rearranged to converge to:'
    o1: Any real number
    o2: Only ln 2
    o3: Only 0 or ln 2
    o4: Only numbers below 1
  - q: 'A series that converges but not absolutely is called:'
    o1: Conditionally convergent
    o2: Divergent
    o3: Uniformly convergent
    o4: Telescoping
  - q: 'If Σ |a_n| converges, then Σ a_n:'
    o1: Converges
    o2: May diverge
    o3: Converges to 0
    o4: Is alternating
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: A conditionally convergent series has positive and negative parts that each diverge, which is what lets a rearrangement steer the sum anywhere
  verify:
    authored: true

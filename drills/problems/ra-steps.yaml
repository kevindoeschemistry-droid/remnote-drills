- template: ra-limit-algebra-facts
  skill: ra.sequences
  pace: recall
  cases:
  - q: 'If a_n → 3 and b_n → 0 with b_n ≠ 0, then a_n/b_n:'
    o1: Has no finite limit
    o2: Tends to 0
    o3: Tends to 3
    o4: Tends to 1
  - q: 'If a_n is bounded and b_n → 0, then a_n b_n:'
    o1: Tends to 0
    o2: Is unbounded
    o3: Need not converge
    o4: Tends to the bound of a_n
  - q: 'If a_n + b_n converges and a_n converges, then b_n:'
    o1: Converges
    o2: May diverge
    o3: Is constant
    o4: Tends to 0
  - q: 'If a_n b_n converges and a_n converges, then b_n:'
    o1: May diverge, for example when a_n → 0
    o2: Converges
    o3: Is bounded
    o4: Tends to 1
  - q: 'cos(n)/n tends to 0 by:'
    o1: The squeeze rule
    o2: The ratio test
    o3: Monotone convergence
    o4: It does not converge
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The algebra of limits works forwards; going backwards you can subtract but you cannot divide by something tending to 0
  verify:
    authored: true

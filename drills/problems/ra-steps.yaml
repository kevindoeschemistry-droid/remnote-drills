    o1: Not necessarily Cauchy
    o2: Always Cauchy
    o3: Always convergent
    o4: Always bounded
  - q: 'Every Cauchy sequence of real numbers is:'
    o1: Convergent
    o2: Monotone
    o3: Eventually constant
    o4: Rational
  - q: 'Every convergent sequence is:'
    o1: Cauchy
    o2: Monotone
    o3: Positive
    o4: Periodic
  - q: 'A Cauchy sequence of rationals can fail to converge in the rationals because the rationals are not:'
    o1: Complete
    o2: Dense
    o3: Ordered
    o4: Countable
  - q: 'If |a_(n+1) − a_n| ≤ 1/2ⁿ for all n, the sequence is Cauchy because the gaps:'
    o1: Have a convergent sum
    o2: Tend to 0
    o3: Are positive
    o4: Alternate in sign
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Small steps are not enough; the steps must be summable. √n has steps tending to 0 and still runs off to infinity
  verify:
    authored: true

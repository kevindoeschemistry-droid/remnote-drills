    o4: Every bounded sequence
  - q: 'x sin(1/x) → 0 as x → 0 by:'
    o1: The squeeze rule, since |x sin(1/x)| ≤ |x|
    o2: L'Hôpital's rule
    o3: The mean value theorem
    o4: It has no limit
  - q: 'To prove a limit does NOT exist it is enough to find:'
    o1: Two sequences tending to a with different limits of f
    o2: One sequence along which f converges
    o3: A point where f is undefined
    o4: A sequence along which f is bounded
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The sequential criterion turns questions about functions into questions about sequences, where the earlier unit's tools apply
  verify:
    authored: true

- template: ra-lhopital
  skill: ra.calculus
  pace: quick
  cases:
  - sh: (eˣ − 1 − x)/x²
    kans: 0.5
    vy: limit((exp(Y) - 1 - Y)/Y**2, Y, 0)
  - sh: (x − sin x)/x³
    kans: 0.16666667
    vy: limit((Y - sin(Y))/Y**3, Y, 0)
  - sh: (tan x − x)/x³
    kans: 0.33333333
    vy: limit((tan(Y) - Y)/Y**3, Y, 0)
  - sh: ln(1 + 3x)/x
    kans: 3
    vy: limit(log(1 + 3*Y)/Y, Y, 0)
  - sh: (cos x − 1)/x²
    kans: -0.5
    vy: limit((cos(Y) - 1)/Y**2, Y, 0)
  - sh: (eˣ − e^(−x))/sin x
    kans: 2
    vy: limit((exp(Y) - exp(-Y))/sin(Y), Y, 0)
  prompt: Find the limit of {{sh}} as x → 0.
  parts:
  - ask: Answer
    label: v
    tex: \lim
    value: kans
    tol: 0.005
    explain: Differentiate top and bottom until the form is no longer 0/0, or expand both to the first power that survives
  verify:
    expect:
      v: calc(vy)
- template: ra-lhopital-facts
  skill: ra.calculus
  pace: recall
  cases:
  - q: 'L''Hôpital''s rule applies to limits of the form:'
    o1: 0/0 or ∞/∞
    o2: 0 · 1
    o3: 1/0
    o4: Any quotient
  - q: 'lim (x + sin x)/x as x → ∞ is 1, but the ratio of derivatives (1 + cos x)/1 has no limit. This shows the rule:'
    o1: Gives no conclusion when the derivative ratio has no limit
    o2: Is false
    o3: Proves the limit does not exist
    o4: Applies only at 0
  - q: 'To use L''Hôpital on the form 0 · ∞ you first:'
    o1: Rewrite it as a quotient
    o2: Differentiate each factor
    o3: Take a square root
    o4: Apply the product rule
  - q: 'lim x ln x as x → 0⁺ is:'
    o1: '0'
    o2: −∞
    o3: '1'
    o4: −1
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: 'The rule is a one-way implication: if the derivative ratio has a limit, so does the original, and they agree'
  verify:
    authored: true

  - ke: 100
    kn: 900
  - ke: 4
    kn: 12
  prompt: A drug has an EC50 of {{ke}} nM. What percentage of its maximum effect does it produce at a concentration of {{kn}} nM, assuming response = Emax × C / (C + EC50)?

- template: px-interaction-types
  skill: pharm.dynamics
  pace: recall
  cases:
  - q: A drug that binds a receptor and produces no response of its own, but prevents the agonist's effect, is what?
    o1: an antagonist
    o2: a full agonist
    o3: a partial agonist
    o4: an inverse agonist
  - q: A drug that binds at a site other than the agonist's and changes the receptor's response is what?
    o1: an allosteric modulator
    o2: a competitive antagonist
    o3: a prodrug
    o4: a full agonist
  - q: A drug that reduces a receptor's activity below its baseline level is what?
    o1: an inverse agonist
    o2: a neutral antagonist
    o3: a partial agonist
    o4: an allosteric activator
  - q: Aspirin acetylates cyclooxygenase permanently. What kind of inhibition is this?
    o1: irreversible
    o2: competitive reversible
    o3: allosteric reversible
    o4: 'none: aspirin is an agonist'
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Agonists activate, antagonists occupy, inverse agonists switch off constitutive activity
  verify:
    authored: true

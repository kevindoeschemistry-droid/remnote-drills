- template: px-concentration-for-occupancy
  skill: pharm.dynamics
  pace: quick
  cases:
  - kd: 2
    kp: 90
  - kd: 5
    kp: 75
  - kd: 10
    kp: 50
  - kd: 4
    kp: 80
  - kd: 1
    kp: 99
  - kd: 20
    kp: 20
  prompt: A ligand has Kd = {{kd}} nM. What concentration occupies {{kp}}% of its receptors?
  parts:
  - ask: Answer
    label: v
    tex: L
    value: kd*kp/(100 - kp)
    tol: 0.005
    explain: 'Rearranged: [L] = Kd × occupancy / (1 − occupancy), so 90% needs nine times Kd'

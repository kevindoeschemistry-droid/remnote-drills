- template: td-max-entropy-equal
  skill: thermo.fundamental-equation
  pace: recall
  cases:
  - {what: 'energy only (rigid, impermeable wall)', ans: 0}
  - {what: energy and volume (a movable piston), ans: 1}
  - {what: energy and particles (a permeable wall), ans: 2}
  prompt: Two subsystems can exchange {{what}}. Maximising the total entropy makes which quantity equal on both sides?
  parts:
  - ask: Answer
    label: y
    choice: [Temperature, Pressure (with T), Chemical potential (with T)]
    correct: ans
    explain: 'Set dS_total = 0 for the exchange: energy gives 1/T₁ = 1/T₂; volume gives P₁/T₁ = P₂/T₂; particles give μ₁/T₁ = μ₂/T₂. Each conserved quantity that can move pairs with an intensive variable that equalises'
  verify: {authored: true}
- template: td-max-s-min-u
  skill: thermo.fundamental-equation
  pace: recall
  cases:
  - {s: 'At fixed S, V and N, an equilibrium state minimises U.', ans: 0}
  - {s: 'At fixed U, V and N, an equilibrium state minimises S.', ans: 1}
  - {s: Maximum entropy at fixed energy and minimum energy at fixed entropy pick out the same state., ans: 0}
  - {s: The energy minimum principle needs (∂S/∂U) to be negative., ans: 1}
  prompt: '{{s}}'
  parts:
  - ask: Answer
    label: y
    choice: ['True', 'False']
    correct: ans
    explain: 'The entropy maximum principle at fixed U and the energy minimum principle at fixed S describe the same equilibrium: because (∂S/∂U) = 1/T > 0, a state that is not an energy minimum at fixed S can lower U and return the energy as heat, raising S at fixed U'
  verify: {authored: true}
- template: td-potential-choice
  skill: thermo.legendre
  pace: recall
  cases:
  - {c: 'T, V and N', ans: 2}
  - {c: 'T, P and N', ans: 3}
  - {c: 'S, V and N', ans: 0}
  - {c: 'S, P and N', ans: 1}
  - {c: 'T, V and μ', ans: 4}
  prompt: A system is held at fixed {{c}}. Which function is minimised at equilibrium?
  parts:
  - ask: Answer
    label: y
    choice: [U (internal energy), H (enthalpy), A (Helmholtz), G (Gibbs), Ω = A − μN (grand potential)]
    correct: ans
    explain: 'Each potential is minimised when its natural variables are fixed: U(S,V,N), H(S,P,N), A(T,V,N), G(T,P,N), Ω(T,V,μ). A bath fixes T; a piston at constant external pressure fixes P; a reservoir of particles fixes μ'
  verify: {authored: true}
- template: td-phase-rule
  skill: thermo.phase-equilibrium
  pace: quick
  cases:
  - {C: 1, Pn: 1, sys: 'pure water, liquid only', ans: 2}
  - {C: 1, Pn: 2, sys: pure water at its boiling point, ans: 1}
  - {C: 2, Pn: 1, sys: a single-phase mixture of ethanol and water, ans: 3}
  - {C: 2, Pn: 2, sys: a two-phase ethanol–water mixture, ans: 2}
  - {C: 3, Pn: 2, sys: three components in two phases, ans: 3}
  prompt: How many intensive variables can be changed independently in {{sys}}?
  parts:
  - {ask: Degrees of freedom, label: y, value: ans, tol: 1.0e-06, explain: 'Gibbs phase rule: $F = C - P + 2$ (C components, P phases, no reactions). A pure substance has F = 1 along a coexistence line (T fixes P) and 0 at the triple point'}
  verify:
    expect: {y: C - Pn + 2}
- template: td-transition-order
  skill: thermo.phase-equilibrium
  pace: recall
  cases:
  - {s: 'Boiling water at 1 atm, with a latent heat', ans: 0}
  - {s: 'A ferromagnet losing its magnetisation smoothly at the Curie point, with a diverging susceptibility', ans: 1}
  - {s: 'Melting ice: the volume jumps', ans: 0}
  - {s: A liquid–gas system exactly at its critical point, ans: 1}
  - {s: 'Helium-4 at the lambda point (C_p diverges, no latent heat)', ans: 1}
  prompt: '{{s}}'
  parts:
  - ask: Answer
    label: y
    choice: [First-order, Second-order (continuous)]
    correct: ans
    explain: 'First-order: a first derivative of G (S, V, magnetisation) jumps, so there is a latent heat. Continuous: the first derivatives are smooth and a second derivative (C_p, compressibility, susceptibility) diverges or jumps'
  verify: {authored: true}
- template: td-extensive
  skill: thermo.fundamental-equation
  pace: recall
  cases:
  - {stex: N\ln(UV/N^2), e: N*log(U*V/N**2), ans: 1}
  - {stex: '(UVN)^{1/3}', e: (U*V*N)**(1/3), ans: 1}
  - {stex: '(UV)^{1/2}', e: (U*V)**(1/2), ans: 1}
  - {stex: N\ln(UV), e: N*log(U*V), ans: 0}
  - {stex: U^2V/N^2, e: U**2*V/N**2, ans: 1}
  - {stex: '(U^2V)^{1/3}', e: (U**2*V)**(1/3), ans: 1}
  - {stex: UV, e: U*V, ans: 0}
  prompt: Is $S = {{stex}}$ an acceptable (first-order homogeneous) fundamental equation?
  parts:
  - ask: Answer
    label: y
    choice: ['No', 'Yes']
    correct: ans
    explain: 'Scale every extensive variable by λ: S must become λS. Check the powers: a ratio like U/N or V/N is intensive, and a product of extensive variables must be raised to total power 1'
  verify:
    choices: {y: homogeneous(e)}
- template: td-total-entropy
  skill: thermo.first-law
  pace: quick
  cases:
  - {m: 1, c: 4184, T1: 373.15, T2: 293.15, ans: 132.221821187}
  - {m: 0.5, c: 900, T1: 500, T2: 300, ans: 70.1284693053}
  - {m: 2, c: 385, T1: 300, T2: 400, ans: 29.0151957879}
  - {m: 1, c: 4184, T1: 273.15, T2: 323.15, ans: 55.9342636461}
  prompt: A ${{m}}$ kg block ($c = {{c}}$ J/kg·K) at ${{T1}}$ K is dropped into a large bath at ${{T2}}$ K and comes to equilibrium. What is the total entropy change of block plus bath (J/K)?
  parts:
  - {ask: ΔS_total, label: y, value: ans, tol: 0.0001, explain: 'Block: $mc\ln(T_2/T_1)$ along any reversible path. Bath at constant T: $-Q/T_2 = mc(T_1 - T_2)/T_2$. The sum is always positive for $T_1 \ne T_2$: heat flowing across a finite ΔT is irreversible'}
  verify:
    expect: {y: 'integrate(m*c/Symbol(''TT''), (Symbol(''TT''), nsimplify(T1), nsimplify(T2))) - m*c*(nsimplify(T2) - nsimplify(T1))/nsimplify(T2)'}
- template: td-carnot
  skill: thermo.first-law
  pace: quick
  cases:
  - {kind: 0, Th: 600, Tc: 300, kt: the maximum efficiency of a heat engine, ans: 0.5}
  - {kind: 0, Th: 800, Tc: 290, kt: the maximum efficiency of a heat engine, ans: 0.6375}
  - {kind: 1, Th: 298, Tc: 273, kt: the maximum COP of a refrigerator, ans: 10.92}
  - {kind: 1, Th: 295, Tc: 255, kt: the maximum COP of a refrigerator, ans: 6.375}
  - {kind: 2, Th: 293, Tc: 273, kt: the maximum COP of a heat pump, ans: 14.65}
  - {kind: 2, Th: 298, Tc: 268, kt: the maximum COP of a heat pump, ans: 9.93333333333}
  prompt: Between reservoirs at ${{Th}}$ K and ${{Tc}}$ K, what is {{kt}}?
  parts:
  - {ask: Value, label: y, value: ans, tol: 0.0001, explain: 'Reversible limits: engine $1 - T_c/T_h$; refrigerator $T_c/(T_h - T_c)$; heat pump $T_h/(T_h - T_c)$. Small temperature lifts give large COPs'}
  verify:
    expect: {y: '[1 - Rational(Tc, Th), Rational(Tc, Th - Tc), Rational(Th, Th - Tc)][kind]'}
- template: td-isentropic-outlet
  skill: thermo.first-law
  pace: quick
  cases:
  - {dev: turbine, T1: 1000, P1: 1000, P2: 100, cp: 29.1, ans: 517.940217845}
  - {dev: compressor, T1: 300, P1: 100, P2: 800, cp: 29.1, ans: 543.441068306}
  - {dev: nozzle, T1: 800, P1: 500, P2: 100, cp: 32.0, ans: 526.597433164}
  - {dev: compressor, T1: 290, P1: 100, P2: 400, cp: 37.1, ans: 395.662931372}
  prompt: An ideal gas with molar $c_p = {{cp}}$ J/mol·K (R = 8.314) enters a reversible adiabatic {{dev}} at ${{T1}}$ K and ${{P1}}$ kPa and leaves at ${{P2}}$ kPa. What is the outlet temperature?
  parts:
  - {ask: T₂ (K), label: y, value: ans, tol: 0.0001, explain: 'Reversible and adiabatic means isentropic: $c_p\ln(T_2/T_1) = R\ln(P_2/P_1)$, so $T_2 = T_1(P_2/P_1)^{R/c_p}$. The steady-flow energy balance then gives the shaft work, $\dot W = \dot m c_p(T_1 - T_2)$'}
  verify:
    expect: {y: 'isentropic_T2(T1, P1, P2, cp)'}
- template: td-exact
  skill: thermo.maxwell
  pace: quick
  cases:
  - {M: 2xy, Nn: x^2, Mx: 2*x*y, Ny: x**2, ans: 1}
  - {M: y, Nn: -x, Mx: y, Ny: -x, ans: 0}
  - {M: y^2, Nn: 2xy, Mx: y**2, Ny: 2*x*y, ans: 1}
  - {M: 'e^{x}y', Nn: 'e^{x}', Mx: exp(x)*y, Ny: exp(x), ans: 1}
  - {M: x + y, Nn: x - y, Mx: x + y, Ny: x - y, ans: 1}
  - {M: xy, Nn: xy, Mx: x*y, Ny: x*y, ans: 0}
  prompt: Is $({{M}})\,dx + ({{Nn}})\,dy$ an exact differential?
  parts:
  - ask: Answer
    label: y
    choice: ['No', 'Yes']
    correct: ans
    explain: Exact (the change of a state function) exactly when $\partial M/\partial y = \partial N/\partial x$. Heat and work are not exact; δQ/T is
  verify:
    choices: {y: 'exact(Mx, Ny)'}
- template: td-triple-product
  skill: thermo.maxwell
  pace: quick
  cases:
  - {a: 0.1382, b: 3.19e-05, T0: 300, V: 0.001, gas: a van der Waals gas, ans: 3.60097555212e-06}
  - {a: 0.3658, b: 4.29e-05, T0: 350, V: 0.0005, gas: a van der Waals gas, ans: 2.25260555124e-06}
  - {a: 0.0, b: 0.0, T0: 300, V: 0.0249, gas: an ideal gas, ans: 8.3e-05}
  prompt: For {{gas}} ($a = {{a}}$ Pa·m⁶/mol², $b = {{b}}$ m³/mol) at $T = {{T0}}$ K, $V = {{V}}$ m³/mol, find $(\partial V/\partial T)_P$ (m³/mol·K) using the triple product rule.
  parts:
  - {ask: (∂V/∂T)_P, label: y, value: ans, tol: 0.0001, explain: '$(\partial V/\partial T)_P = -\dfrac{(\partial P/\partial T)_V}{(\partial P/\partial V)_T}$: both derivatives come straight from $P(T, V)$, so no need to solve the cubic for V'}
  verify:
    expect: {y: '(-diff(c_R*Symbol(''TT'')/(Symbol(''VV'') - nsimplify(b)) - nsimplify(a)/Symbol(''VV'')**2, Symbol(''TT''))/diff(c_R*Symbol(''TT'')/(Symbol(''VV'') - nsimplify(b)) - nsimplify(a)/Symbol(''VV'')**2, Symbol(''VV''))).subs({Symbol(''TT''): T0, Symbol(''VV''): nsimplify(V)})'}

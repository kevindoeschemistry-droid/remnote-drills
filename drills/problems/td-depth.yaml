  - {gas: CO₂, a: 0.364, b: 4.27e-05, Tt: 300, Vm: 0.0005, cp: 37.1, w: 1, wt: the low-pressure Joule–Thomson coefficient (K/Pa), ans: 6.71592762544e-06}

  - {Tt: 350, P1: 2, P2: 2, yy: 0.5, ans: -2.01710121258}
  prompt: An ideal gas at ${{Tt}}$ K goes from pure at ${{P1}}$ bar to mole fraction ${{yy}}$ in a mixture at ${{P2}}$ bar. What is Δμ (kJ/mol)?

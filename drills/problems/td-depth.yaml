- template: td-flory-huggins
  skill: thermo.solutions
  pace: quick
  cases:
  - {Nn: 1, ans: 2.0}
  - {Nn: 100, ans: 0.605}
  - {Nn: 1000, ans: 0.532122776602}
  - {Nn: 10000, ans: 0.51005}
  - {Nn: 50, ans: 0.651421356237}
  prompt: In Flory–Huggins theory, what is the critical $\chi$ for a polymer of ${{Nn}}$ segments in a small-molecule solvent?
  parts:
  - {ask: χ_c, label: y, value: ans, tol: 0.0001, explain: '$\Delta G_{mix}/kT = \frac{\phi}{N}\ln\phi + (1 - \phi)\ln(1 - \phi) + \chi\phi(1 - \phi)$; the critical point (second and third derivatives zero) gives $\chi_c = \tfrac12(1 + 1/\sqrt N)^2$, at $\phi_c = 1/(1 + \sqrt N)$. Long chains demix at χ just above ½; N = 1 recovers the regular solution''s 2'}
  verify:
    expect: {y: fh_chi_c(Nn)}
- template: td-metropolis
  skill: stat.ensembles
  pace: quick
  cases:
  - {dE: 0.5, ans: 0.606530659713}
  - {dE: 1.0, ans: 0.367879441171}
  - {dE: 2.0, ans: 0.135335283237}
  - {dE: 3.0, ans: 0.0497870683679}
  - {dE: 0.1, ans: 0.904837418036}
  prompt: A Metropolis Monte Carlo move raises the energy by $\Delta E = {{dE}}\,kT$. With what probability is it accepted?
  parts:
  - {ask: Acceptance, label: y, value: ans, tol: 0.0001, explain: '$p_{acc} = \min(1, e^{-\beta\Delta E})$: downhill always, uphill with the Boltzmann factor. That rule satisfies detailed balance, so the chain samples the canonical ensemble; averages over the sampled states are ensemble averages'}
  verify:
    expect: {y: 'Min(1, exp(-nsimplify(dE)))'}

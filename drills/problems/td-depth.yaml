  - {ask: Δμ, label: y, value: ans, tol: 0.0001, explain: '$\mu_i = \mu_i^\circ + RT\ln(y_iP/P^\circ)$: pressure and dilution enter only through the partial pressure. Diluting always lowers μ, which is why gases mix spontaneously'}

  prompt: 'For {{sub}}: $V_m = {{Vm}}$ m³/mol, $\alpha = {{al}}$ K⁻¹, $\kappa_T = {{kap}}$ Pa⁻¹. What is $C_{p,m} - C_{V,m}$ (J/mol·K)?'
  parts:
  - {ask: C_p − C_V, label: y, value: ans, tol: 0.0001, explain: '$C_p - C_V = TV\alpha^2/\kappa_T$, from Maxwell relations. For an ideal gas it gives R; for water near 4 °C (α = 0) it vanishes, and for solids it is small'}
  verify:
    expect: {y: nsimplify(Tt)*nsimplify(Vm)*nsimplify(al)**2/nsimplify(kap)}

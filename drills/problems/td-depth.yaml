  - {kind: 1, a: 0, Tt: 0, W: 1.5, sub: 'ice (Pauling''s count, W = (3/2)^N)', ans: 3.37122448433}
  prompt: What molar entropy (J/mol·K) does the third law assign to {{sub}}?
  parts:
  - {ask: S, label: y, value: ans, tol: 0.0001, explain: 'Absolute entropy: $S(T) = \int_0^T C_p/T\,dT$ (+ phase changes), and with $C_p = aT^3$ that is $aT^3/3$. A disordered crystal keeps a residual entropy $R\ln W$ per mole at 0 K: R ln 2 = 5.76 for CO, R ln 1.5 = 3.37 for ice'}
  verify:
    expect: {y: '[integrate(nsimplify(a)*Symbol(''TT'')**2, (Symbol(''TT''), 0, Tt)), c_R*log(nsimplify(W))][kind]'}
- template: td-gibbs-entropy
  skill: stat.ensembles
  pace: quick
  cases:
  - pt: 0.5, 0.5
    P: [0.5, 0.5]
    ans: 0.69314718056
  - pt: 0.25, 0.25, 0.25, 0.25
    P: [0.25, 0.25, 0.25, 0.25]
    ans: 1.38629436112
  - pt: 0.7, 0.2, 0.1
    P: [0.7, 0.2, 0.1]
    ans: 0.801818552543
  - pt: 0.9, 0.1
    P: [0.9, 0.1]
    ans: 0.325082973391
  - pt: 0.5, 0.25, 0.25
    P: [0.5, 0.25, 0.25]
    ans: 1.03972077084
  prompt: A system occupies microstates with probabilities {{pt}}. What is its entropy in units of k?
  parts:
  - {ask: S/k, label: y, value: ans, tol: 0.0001, explain: 'Gibbs: $S = -k\sum p_i\ln p_i$. For W equally likely states it is $k\ln W$ (Boltzmann); any bias lowers it. Maximising it with constraints gives each ensemble: fixed ⟨E⟩ gives the Boltzmann distribution'}
  verify:
    expect: {y: gibbs_S(P)}
- template: td-ising-1d
  skill: stat.binding
  pace: quick
  cases:
  - {bJ: 0.5, bh: 0, ans: 0.813261687518}
  - {bJ: 1.0, bh: 0, ans: 1.12692801104}
  - {bJ: 0.2, bh: 0.3, ans: 0.777504441125}
  - {bJ: 0.5, bh: 0.5, ans: 1.06843052496}
  - {bJ: -0.5, bh: 0.2, ans: 0.820633770855}
  prompt: 1-D Ising chain with $\beta J = {{bJ}}$ and $\beta h = {{bh}}$. With the transfer matrix, what is $-\beta f = \lim \frac{1}{N}\ln Z$?
  parts:
  - {ask: ln λ₊, label: y, value: ans, tol: 0.0001, explain: '$Z = \operatorname{Tr}T^N \approx \lambda_+^N$ with $T = \begin{pmatrix} e^{\beta(J+h)} & e^{-\beta J} \\ e^{-\beta J} & e^{\beta(J-h)}\end{pmatrix}$, $\lambda_+ = e^{\beta J}\cosh\beta h + \sqrt{e^{2\beta J}\sinh^2\beta h + e^{-2\beta J}}$. At h = 0, $\lambda_+ = 2\cosh\beta J$: no phase transition in 1-D'}
  verify:
    expect: {y: 'ising_ln_lambda(bJ, bh)'}
- template: td-mean-field-tc
  skill: stat.binding
  pace: quick
  cases:
  - {z: 4, J: 1.0e-21, ans: 289.718820642}
  - {z: 6, J: 2.0e-21, ans: 869.156461925}
  - {z: 8, J: 5.0e-22, ans: 289.718820642}
  - {z: 6, J: 1.5e-21, ans: 651.867346444}
  prompt: In mean-field theory, what is the Curie temperature (K) of an Ising magnet with coordination number ${{z}}$ and coupling $J = {{J}}$ J?
  parts:
  - {ask: T_c, label: y, value: ans, tol: 0.0001, explain: 'Mean field replaces neighbours by their average: $m = \tanh(\beta zJm)$, which has a nonzero solution when $\beta zJ > 1$, so $kT_c = zJ$. It overestimates T_c (the 2-D square lattice exact value is about 0.57 zJ/k) and wrongly predicts a transition in 1-D'}
  verify:
    expect: {y: z*nsimplify(J)/c_kB}
- template: td-detailed-balance
  skill: stat.rates
  pace: quick
  cases:
  - {kf: 1000.0, dG: -10, Tt: 298.15, ans: 17.7041791959}
  - {kf: 500.0, dG: 5, Tt: 298.15, ans: 3757.78653552}
  - {kf: 1000000.0, dG: -20, Tt: 310.15, ans: 428.271168064}
  - {kf: 2.0, dG: 0.0, Tt: 298.15, ans: 2.0}
  prompt: A reaction A ⇌ B has $k_f = {{kf}}$ s⁻¹ and $\Delta G^\circ = {{dG}}$ kJ/mol at ${{Tt}}$ K. What is $k_r$ (s⁻¹)?
  parts:
  - {ask: k_r, label: y, value: ans, tol: 0.0001, explain: 'At equilibrium the forward and reverse fluxes balance: $k_f/k_r = K = e^{-\Delta G^\circ/RT}$. On a free-energy profile the reverse barrier is higher by ΔG°, so $k_r = k_f/K$'}
  verify:
    expect: {y: nsimplify(kf)/exp(-nsimplify(dG)*1000/(c_R*nsimplify(Tt)))}

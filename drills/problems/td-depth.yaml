# Builds drills/problems/td-depth.yaml: the Thermodynamics and Statistical Mechanics objectives
# (framework thermodynamics, TD) that had no drills. Run: python3 scripts/td_cases.py
# 
# Answers follow the textbook formula (equal-area construction, ln φ = BP/RT, the regular-solution
# closed forms, λ₊ = e^βJ cosh βh + √(…), χ_c = ½(1 + 1/√N)²…); tests/verify/tdcalc.py checks by another
# route (equal G, the ∫(Z−1)/P integral, Gibbs–Duhem integrated, transfer-matrix eigenvalues, the
# critical point from derivatives).
# GENERATED: edit scripts/td_cases.py, not this file.

- template: td-stirling
  skill: stat.multiplicity
  pace: quick
  cases:
  - {N: 100, ans: 360.517018599}
  - {N: 1000, ans: 5907.75527898}
  - {N: 50, ans: 145.601150271}
  - {N: 10000, ans: 82103.4037198}
  - {N: 6.02e+23, ans: 3.23602357277e+25}
  prompt: Use Stirling's approximation to estimate $\ln N!$ for $N = {{N}}$.
  parts:
  - {ask: ln N!, label: y, value: ans, tol: 0.0002, explain: '$\ln N! \approx N\ln N - N$, from $\ln N! = \sum\ln k \approx \int_1^N \ln x\,dx$. Already within 1% at N = 100; for a mole of particles it is exact for all purposes, which is why entropy formulas use it'}
  verify:
    expect: {y: nsimplify(N)*log(nsimplify(N)) - nsimplify(N)}
- template: td-stirling-lnw
  skill: stat.multiplicity
  pace: quick
  cases:
  - {N: 100, n: 50, ans: 69.314718056}
  - {N: 100, n: 20, ans: 50.0402423538}
  - {N: 1000, n: 500, ans: 693.14718056}
  - {N: 60, n: 15, ans: 33.7401086771}
  prompt: With Stirling's approximation, what is $\ln W$ for $W = \binom{ {{N}} }{ {{n}} }$ (choosing {{n}} of {{N}} sites)?
  parts:
  - {ask: ln W, label: y, value: ans, tol: 0.0001, explain: '$\ln W \approx N\ln N - n\ln n - (N - n)\ln(N - n) = -N[x\ln x + (1 - x)\ln(1 - x)]$ with $x = n/N$: the mixing-entropy form'}
  verify:
    expect: {y: N*log(N) - n*log(n) - (N - n)*log(N - n)}

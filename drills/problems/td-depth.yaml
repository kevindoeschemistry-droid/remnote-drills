- template: td-spinodal
  skill: thermo.stability
  pace: quick
  cases:
  - {Tr: 0.9, Vr: 1.0, ans: 1}
  - {Tr: 0.9, Vr: 0.5, ans: 0}
  - {Tr: 0.9, Vr: 3.0, ans: 0}
  - {Tr: 0.85, Vr: 1.2, ans: 1}
  - {Tr: 0.95, Vr: 0.8, ans: 1}
  - {Tr: 1.1, Vr: 1.0, ans: 0}
  - {Tr: 0.8, Vr: 0.6, ans: 0}
  prompt: In reduced van der Waals units ($P_r = \dfrac{8T_r}{3V_r - 1} - \dfrac{3}{V_r^2}$), is the state $T_r = {{Tr}}$, $V_r = {{Vr}}$ mechanically unstable (inside the spinodal)?
  parts:
  - ask: Answer
    label: y
    choice: ['No: stable or metastable', 'Yes: unstable']
    correct: ans
    explain: Mechanical stability needs $(\partial P/\partial V)_T < 0$. Where the slope turns positive the state is inside the spinodal and splits at once; between spinodal and binodal it is metastable (superheated liquid, supercooled vapour). Above $T_r = 1$ nothing is unstable
  verify:
    choices: {y: 'vdw_reduced_unstable(Tr, Vr)'}
- template: td-vdw-coexistence
  skill: thermo.stability
  pace: workout
  cases:
  - {Tr: 0.9, ans: 0.646998351872}
  - {Tr: 0.85, ans: 0.504491649787}
  - {Tr: 0.95, ans: 0.811879243364}
  - {Tr: 0.8, ans: 0.383361623689}
  prompt: Use Maxwell's equal-area construction on the reduced van der Waals isotherm $T_r = {{Tr}}$. What is the reduced vapour pressure $P_r$?
  parts:
  - {ask: 'P_r,sat', label: y, value: ans, tol: 0.0001, explain: 'The flat coexistence line cuts the loop so the two areas between it and the isotherm are equal, which is the same as equal molar Gibbs energy (equal μ) of liquid and vapour. Iterate on P until the areas match. At $T_r = 0.9$, $P_r ≈ 0.647$'}
  verify:
    expect: {y: vdw_psat(Tr)}
- template: td-mu-ideal

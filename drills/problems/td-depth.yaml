  - {gas: CO₂, a: 0.364, b: 4.27e-05, Tt: 300, Vm: 0.0005, cp: 37.1, w: 0, wt: the internal pressure $(\partial U/\partial V)_T$ (Pa) at $V_m = 0.0005$ m³/mol, ans: 1456000.0}
  - {gas: He, a: 0.00346, b: 2.38e-05, Tt: 300, Vm: 0.001, cp: 20.8, w: 1, wt: the low-pressure Joule–Thomson coefficient (K/Pa), ans: -1.01085181139e-06}
  prompt: For {{gas}} as a van der Waals gas ($a = {{a}}$ Pa·m⁶/mol², $b = {{b}}$ m³/mol, $C_{p,m} = {{cp}}$ J/mol·K) at ${{Tt}}$ K, find {{wt}}.
  parts:
  - {ask: Value, label: y, value: ans, tol: 0.0001, explain: 'Thermodynamic equation of state: $(\partial U/\partial V)_T = T(\partial P/\partial T)_V - P = a/V_m^2$ for vdW. Joule–Thomson at low pressure: $\mu_{JT} \approx (2a/RT - b)/C_p$; positive (cools on throttling) below the inversion temperature $2a/Rb$. Helium inverts far below room temperature'}

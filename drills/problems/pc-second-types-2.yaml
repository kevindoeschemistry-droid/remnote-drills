# Generated by scripts/second_types.py from scripts/second_specs/pc3.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: pc-hybrid-p-character
  skill: quantum.bonding
  pace: quick
  cases:
  - kb: 2
    kl: 0
  - kb: 3
    kl: 0
  - kb: 2
    kl: 1
  - kb: 4
    kl: 0
  - kb: 3
    kl: 1
  - kb: 2
    kl: 2
  prompt: A central atom has {{kb}} bonded atoms and {{kl}} lone pair(s), all in equivalent hybrids. What percent p character do the hybrids have?
  parts:
  - ask: Answer
    label: v
    tex: \%p
    value: (kb + kl - 1)/(kb + kl)*100
    tol: 0.005
    explain: 'n domains mix one s orbital with n − 1 p orbitals, so each hybrid is 1/n s: 50% p for sp, 66.7% for sp², 75% for sp³'
  verify:
    expect:
      v: 100 - 100*Rational(1, kb + kl)
- template: pc-walsh-ah2-shape
  skill: quantum.bonding
  pace: recall
  cases:
  - q: BeH₂ (4 valence electrons)
    kc: 0
  - q: BH₂ (5)
    kc: 1
  - q: CH₂ (6)
    kc: 1
  - q: NH₂ (7)
    kc: 1
  - q: H₂O (8)
    kc: 1
  - q: BH₂⁺ (4)
    kc: 0
  prompt: 'By Walsh''s rules, the AH₂ species {{q}} is:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Linear
    - Bent
    correct: kc
    explain: With four valence electrons only the two bonding orbitals are filled and they favour 180°. From the fifth electron on, the orbital that drops sharply on bending is occupied
  verify:
    authored: true
- template: pc-singlet-triplet-gap
  skill: quantum.bonding
  pace: quick
  cases:
  - kj: 10.5
    kk: 1.2
  - kj: 8.0
    kk: 0.4
  - kj: 12.0
    kk: 2.5
  - kj: 9.3
    kk: 0.8
  prompt: Two electrons occupy different orbitals with Coulomb integral J = {{kj}} eV and exchange integral K = {{kk}} eV. How far does the open-shell singlet lie above the triplet, in eV?
  parts:
  - ask: Answer
    label: v
    tex: \Delta E
    value: 2*kk
    tol: 0.005
    explain: 'E = h₁ + h₂ + J ± K: plus for the singlet, minus for the triplet, so the gap is 2K and the triplet is lower (Hund)'
  verify:
    expect:
      v: (nsimplify(kj) + nsimplify(kk)) - (nsimplify(kj) - nsimplify(kk))
- template: pc-ir-raman-activity
  skill: quantum.symmetry
  pace: recall
  cases:
  - q: symmetric stretch of CO₂
    kc: 1
  - q: antisymmetric stretch of CO₂
    kc: 0
  - q: bend of CO₂
    kc: 0
  - q: symmetric stretch of H₂O
    kc: 2
  - q: stretch of N₂
    kc: 1
  - q: stretch of HCl
    kc: 2
  prompt: 'The {{q}} is:'
  parts:
  - ask: Answer
    label: v
    choice:
    - IR active only
    - Raman active only
    - Both IR and Raman active
    correct: kc
    explain: IR needs a changing dipole, Raman a changing polarisability. In a molecule with a centre of symmetry no mode is both (mutual exclusion)
  verify:
    authored: true
- template: pc-chemical-shift-ppm
  skill: quantum.spectroscopy
  pace: quick
  cases:
  - km: 300
    kh: 2160
  - km: 400
    kh: 2880
  - km: 500
    kh: 1250
  - km: 60
    kh: 432
  - km: 600
    kh: 4380
  prompt: On a {{km}} MHz spectrometer a proton resonates {{kh}} Hz downfield of TMS. What is its chemical shift in ppm?
  parts:
  - ask: Answer
    label: v
    tex: \delta
    value: kh/km
    tol: 0.005
    explain: δ = (ν − ν_ref)/ν₀ × 10⁶, which is why the ppm scale does not depend on the magnet
  verify:
    expect:
      v: Rational(kh, km*10**6)*10**6
- template: pc-karplus-size
  skill: quantum.spectroscopy
  pace: recall
  cases:
  - q: an anti arrangement (dihedral 180°)
    kc: 0
  - q: a gauche arrangement (60°)
    kc: 1
  - q: two axial hydrogens on adjacent carbons of a chair
    kc: 0
  - q: an axial and an equatorial hydrogen on adjacent carbons
    kc: 1
  - q: two equatorial hydrogens on adjacent carbons
    kc: 1
  - q: a dihedral angle of 90°
    kc: 1
  prompt: 'By the Karplus relation, the three-bond H–H coupling for {{q}} is:'
  parts:
  - ask: Answer
    label: v
    choice:
    - Large (about 8–13 Hz)
    - Small (about 0–5 Hz)
    correct: kc
    explain: J is largest near 0° and 180° and passes through a minimum near 90°. Axial–axial is 180°; the other chair pairs are about 60°
  verify:
    authored: true

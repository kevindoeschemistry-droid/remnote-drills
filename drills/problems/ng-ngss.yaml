- template: ng-subsystem-reliability
  skill: ngss.engineering
  pace: quick
  given:
    n:
      int:
      - 2
      - 6
    r:
      pick:
      - 90
      - 95
      - 99
  prompt: A device is broken into {{n}} subsystems in series, each working {{r}}% of the time, independently. What fraction of the time does the whole device work?
  parts:
  - ask: Answer
    label: v
    tex: R
    value: (r/100)^n
    tol: 0.005
    explain: 'Breaking a problem into parts lets each be designed and tested, but the parts multiply: many good parts in series make a mediocre whole. Redundancy (parts in parallel) is the fix'
  verify:
    expect:
      v: Rational(r, 100)**n
- template: ng-decision-matrix
  skill: ngss.engineering
  pace: quick
  given:
    w1:
      pick:
      - 0.2
      - 0.3
    w2:
      pick:
      - 0.5
      - 0.4
    w3:
      pick:
      - 0.3
    a1:
      int:
      - 3
      - 9
    a2:
      int:
      - 3
      - 9
    a3:
      int:
      - 3
      - 9
  prompt: Two designs are scored 1–10 on cost (weight {{w1}}), safety (weight {{w2}}) and durability (weight {{w3}}). Design A scores {{a1}}, {{a2}}, {{a3}}. What is its weighted score?
  parts:
  - ask: Answer
    label: v
    tex: S_A
    value: w1*a1 + w2*a2 + w3*a3
    tol: 0.005
    explain: 'A decision matrix makes the trade-offs explicit: change the weights and see whether the winner changes. The weights are a value judgement, not a measurement'
  verify:
    expect:
      v: Matrix([nsimplify(w1), nsimplify(w2), nsimplify(w3)]).dot(Matrix([a1, a2, a3]))
- template: ng-impact-simulation
  skill: ngss.engineering
  pace: quick
  given:
    E:
      pick:
      - 500
      - 1000
      - 2000
    p:
      pick:
      - 3
      - 5
      - 8
      - 10
    n:
      pick:
      - 5
      - 10
      - 20
  prompt: 'A city''s emissions are {{E}} kt/yr. A programme cuts them {{p}}% each year from the previous year''s level. Simulate: what are they after {{n}} years, in kt/yr?'
  parts:
  - ask: Answer
    label: v
    tex: E_n
    value: E*(1 - p/100)^n
    tol: 0.005
    explain: A computational model steps the rule forward year by year; a steady percentage cut is a geometric decay, never quite reaching zero
  verify:
    expect:
      v: E*Rational(100 - p, 100)**n

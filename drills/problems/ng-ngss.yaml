- template: ng-energy-return
  skill: ngss.earth-resources
  pace: quick
  given:
    P:
      pick:
      - 50
      - 100
    cf:
      pick:
      - 20
      - 25
      - 30
    y:
      pick:
      - 20
      - 25
      - 30
    C:
      pick:
      - 80
      - 120
      - 150
  prompt: A {{P}} MW solar farm runs at a {{cf}}% capacity factor for {{y}} years and costs {{C}} million dollars in total. What is its cost per kWh of energy delivered, in cents?
  parts:
  - ask: Answer
    label: v
    tex: LCOE
    value: C*1e6/(P*1000*cf/100*8760*y)*100
    tol: 0.005
    explain: Divide the lifetime cost by the lifetime energy. Comparing resources this way (and adding environmental and social costs) is the cost–benefit analysis the standard asks for
  verify:
    expect:
      v: C*10**6*100/integrate(P*1000*Rational(cf, 100), (x, 0, 8760*y))
- template: ng-scrubber
  skill: ngss.earth-resources
  pace: quick
  given:
    E:
      pick:
      - 1000
      - 5000
      - 20000
    eta:
      pick:
      - 80
      - 90
      - 95
      - 98
  prompt: A power plant emits {{E}} tonnes of SO₂ a year. A scrubber that removes {{eta}}% is installed. How many tonnes a year does it still emit?
  parts:
  - ask: Answer
    label: v
    tex: E'
    value: E*(1 - eta/100)
    tol: 0.005
    explain: What remains is the fraction not captured. Going from 90% to 99% halves nothing but cuts the remainder tenfold, which is why the last few percent are worth arguing over
  verify:
    expect:
      v: solve(Eq(E - x, E*Rational(eta, 100)), x)[0]

- template: ng-collision-force
  skill: ngss.physical-design
  pace: quick
  given:
    m:
      pick:
      - 50
      - 70
      - 80
    v:
      pick:
      - 10
      - 15
      - 20
    t1:
      pick:
      - 0.005
      - 0.01
      - 0.02
    t2:
      pick:
      - 0.1
      - 0.15
      - 0.2
  prompt: A {{m}} kg crash-test dummy moving at {{v}} m/s is brought to rest. With no airbag it stops in {{t1}} s; an airbag stretches the stop to {{t2}} s. By what factor does the airbag reduce the average force?
  parts:
  - ask: Answer
    label: r
    tex: F_1/F_2
    value: t2/t1
    tol: 0.005
    explain: The momentum change is fixed by the crash; $\bar F = \Delta p/\Delta t$, so lengthening the stop is the whole design idea behind airbags, crumple zones and helmets
  verify:
    expect:
      r: (m*v/nsimplify(t1))/(m*v/nsimplify(t2))
- template: ng-designed-materials
  skill: ngss.physical-design
  pace: recall
  cases:
  - q: Why is a cross-linked polymer (like vulcanised rubber) more rigid and heat-resistant than the same polymer without cross-links?
    ans: 0
  - q: Why do metals conduct electricity and bend without shattering?
    ans: 1
  - q: Why does a soap or detergent lift grease into water?
    ans: 2
  - q: Why is diamond harder than graphite, though both are pure carbon?
    ans: 3
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - Covalent bonds tie the chains together so they cannot slide past each other
    - Delocalised electrons move freely and the metal ions can slide while staying bonded
    - Each molecule has a nonpolar tail that dissolves in grease and a polar head that dissolves in water
    - Every atom is held by four covalent bonds in three dimensions, not in weakly stacked sheets
    correct: ans
    explain: 'A designed material''s job follows from its structure at the molecular scale: what holds the particles together and how they can move'
  verify:
    authored: true
- template: ng-device-efficiency
  skill: ngss.physical-design
  pace: quick
  given:
    Q:
      pick:
      - 0.5
      - 1
      - 2
    h:
      pick:
      - 1
      - 2
      - 3
    P:
      pick:
      - 2
      - 3
      - 5
  prompt: A student's small hydro generator is fed {{Q}} L/s of water falling {{h}} m and lights LEDs drawing {{P}} W. What is the device's efficiency? ($g = 9.81$, 1 L of water = 1 kg)
  parts:
  - ask: Answer
    label: v
    tex: \eta
    value: P/(Q*9.81*h)
    tol: 0.005
    explain: Useful output over the energy supplied per second ($\dot m gh$). Designing a converter is choosing where the rest goes (friction, heat, sound) and how to cut it
  verify:
    expect:
      v: nsimplify(P)/(nsimplify(Q)*Rational(981, 100)*h)
- template: ng-digital-storage
  skill: ngss.physical-design
  pace: quick
  given:
    f:
      pick:
      - 44.1
      - 48
      - 96
    b:
      pick:
      - 16
      - 24
    t:
      pick:
      - 1
      - 3
      - 5
  prompt: Audio is sampled {{f}} thousand times a second with {{b}}-bit samples in stereo (2 channels). How many megabytes does {{t}} minutes take, uncompressed (1 MB = 10⁶ bytes)?
  parts:
  - ask: Answer
    label: v
    tex: MB
    value: f*1000*b*2*t*60/8/1000000
    tol: 0.005
    explain: Bits = samples per second × bits per sample × channels × seconds. Digital signals can be copied and sent without adding noise, at the cost of these large numbers (hence compression)
  verify:
    expect:
      v: nsimplify(f)*1000*b*2*t*60/8/10**6
- template: ng-wave-device
  skill: ngss.physical-design
  pace: quick
  cases:
  - d: Wi-Fi router
    f: 2.4
  - d: Wi-Fi router
    f: 5
  - d: microwave oven
    f: 2.45
  - d: GPS receiver
    f: 1.575
  - d: 5G phone
    f: 28
  prompt: A {{d}} uses electromagnetic waves at {{f}} GHz. What is the wavelength, in cm? ($c = 3.00\times10^8$ m/s)
  parts:
  - ask: Answer
    label: v
    tex: \lambda
    value: 3e8/(f*1e9)*100
    tol: 0.005
    explain: $\lambda = c/f$. Antennas are usually a quarter or half wavelength long, which is why higher-frequency devices can be smaller
  verify:
    expect:
      v: 3*10**8/(nsimplify(f)*10**9)*100
- template: ng-species-area
  skill: ngss.life-impact
  pace: quick
  given:
    z:
      pick:
      - 0.15
      - 0.25
      - 0.3
    f:
      pick:
      - 0.1
      - 0.25
      - 0.5
  prompt: The species–area relation is $S = cA^{z}$ with $z = {{z}}$. If a habitat shrinks to {{f}} of its area, what fraction of its species is expected to be lost eventually?
  parts:
  - ask: Answer
    label: v
    tex: \Delta S/S
    value: 1 - f^z
    tol: 0.005
    explain: 'Species fall more slowly than area ($z < 1$), but losing 90% of a habitat still costs about a third to a half of its species: the basis for protecting large, connected areas'
  verify:
    expect:
      v: 1 - (Symbol('c')*nsimplify(f)**nsimplify(z))/Symbol('c')
- template: ng-harvest-simulation
  skill: ngss.life-impact
  pace: quick
  given:
    N:
      pick:
      - 100
      - 200
    r:
      pick:
      - 10
      - 20
      - 30
    H:
      pick:
      - 10
      - 20
      - 40
  prompt: 'A fish stock of {{N}} thousand grows {{r}}% a year before harvest, and {{H}} thousand are caught each year. Simulate two years: what is the stock after year 2, in thousands?'
  parts:
  - ask: Answer
    label: v
    tex: N_2
    value: (N*(1 + r/100) - H)*(1 + r/100) - H
    tol: 0.005
    explain: Step the model a year at a time. Comparing catch limits this way is how a management rule is tested before it is used on a real population
  verify:
    expect:
      v: (N*(1 + Rational(r, 100)) - H)*(1 + Rational(r, 100)) - H
- template: ng-ice-expansion
  skill: ngss.earth-resources
  pace: quick
  given:
    V:
      pick:
      - 10
      - 50
      - 100
      - 250
  prompt: '{{V}} cm³ of water seeps into a rock crack and freezes. Ice is less dense than water (917 vs 1000 kg/m³). What volume does the ice take up, in cm³?'
  parts:
  - ask: Answer
    label: v
    tex: V_{ice}
    value: V*1000/917
    tol: 0.005
    explain: 'Same mass, lower density: about 9% more volume. Repeated freezing wedges rock apart, one of the ways water''s unusual properties shape the surface'
  verify:
    expect:
      v: solve(Eq(x*917, V*1000), x)[0]

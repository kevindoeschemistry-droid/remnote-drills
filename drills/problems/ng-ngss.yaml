    ans: 1
  - s: it should be as easy to clean as possible
    ans: 0
  prompt: 'Designing a water filter for a village: is "{{s}}" a criterion or a constraint?'
  parts:
  - ask: Answer
    label: v
    choice:
    - Criterion (a measure of how good a solution is)
    - Constraint (a limit every solution must meet)
    correct: ans
    explain: Constraints rule solutions in or out; criteria rank the solutions that are left. Writing both down before designing is the first step of engineering design
  verify:

    ans: 1
  - q: What did the oxygen-rich atmosphere make possible high above the surface?
    ans: 2
  - q: Where did most of the limestone in the crust come from?
    ans: 3
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - Photosynthesis by cyanobacteria
    - Roots broke rock into soil and slowed erosion
    - An ozone layer that blocks ultraviolet light
    - Shells and skeletons of marine organisms
    correct: ans
    explain: 'Life and the Earth system change each other: organisms alter the air, rocks and water, and those changes open or close niches for later life'

- template: ia-slater-main
  skill: inorg.cross-cutting
  pace: quick
  cases:
  - el: N
    orb: 2p
    Z: 7
    v: 5
    per: 2
  - el: O
    orb: 2p
    Z: 8
    v: 6
    per: 2
  - el: F
    orb: 2p
    Z: 9
    v: 7
    per: 2
  - el: Na
    orb: 3s
    Z: 11
    v: 1
    per: 3
  - el: Cl
    orb: 3p
    Z: 17
    v: 7
    per: 3
  - el: S
    orb: 3p
    Z: 16
    v: 6
    per: 3
  prompt: Use Slater's rules for a valence {{orb}} electron of {{el}} (Z = {{Z}}). What is Z_eff?
  parts:
  - ask: Answer
    label: r
    tex: Z_{eff}
    value: 'Z - (0.35*(v - 1) + 0.85*(per == 2 ? 2 : 8) + 1.0*(Z - v - (per == 2 ? 2 : 8)))'
    tol: 0.005
    explain: Same-shell electrons shield 0.35, the next shell in 0.85, deeper shells fully
  verify:
    expect:
      r: Z - (Rational(35, 100)*(pt_group(Z) % 10 - 1) + Rational(85, 100)*(2 if Z <= 10 else 8) + (Z - pt_group(Z) % 10 - (2 if Z <= 10 else 8)))
- template: ia-slater-4s
  skill: inorg.cross-cutting
  pace: quick
  cases:
  - el: Ti
    d: 2
  - el: Mn
    d: 5
  - el: Fe
    d: 6
  - el: Ni
    d: 8
  - el: Zn
    d: 10
  prompt: Use Slater's rules for a 4s electron of {{el}} ([Ar]3d^{{d}}4s²). What is Z_eff?
  parts:
  - ask: Answer
    label: v
    tex: Z_{eff}
    value: (20 + d) - (0.35*1 + 0.85*(8 + d) + 1.0*10)
    tol: 0.005
    explain: The other 4s electron shields 0.35; the 3s, 3p and 3d electrons (n − 1 shell) 0.85 each; the 10 inner ones 1.00
  verify:
    expect:
      v: (18 + 2 + d) - (Rational(35, 100) + Rational(85, 100)*(8 + d) + 10)

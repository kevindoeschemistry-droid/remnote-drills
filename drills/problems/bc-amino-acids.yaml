# The 20 coded amino acids: draw each from its name, and name each from its drawing.
# GENERATED by scripts/mol.py --amino-acids from scripts/mol_amino.py: edit there, not here.
#
# Basis: IUPAC-IUB JCBN, Nomenclature and Symbolism for Amino Acids and Peptides (1983), 3AA-1,
# Table 1 (standards.yaml: iupac-aa-1983). Structures are the neutral forms that table prints.
# A draw item is self-graded: sketch it, reveal the structure, mark it yourself. Each structure's
# formula is recomputed from its atoms and bonds by tests/verify/molecules.py.

- template: aa-draw-gly
  skill: biochem.amino-acids
  pace: quick
  prompt: 'Draw glycine (Gly, G) from memory: the neutral form, as a skeletal structure.'
  parts:
    - ask: 'Draw it on paper, then compare'
      label: a
      draw: true
      solution:
        type: molecule
        formula: C2H5NO2
        atoms: [[-1.39, 0.0, "H2N"], [-0.52, -0.5], [0.35, 0.0], [0.35, 1.0, "O"], [1.21, -0.5, "OH"]]
        bonds: [[0, 1], [1, 2], [2, 3, 2], [2, 4]]
      explain: 'No side chain at all (just H), so it is the only one that is not chiral. Condensed: $\mathrm{H_2N{-}CH_2{-}COOH}$'
- template: aa-name-gly
  skill: biochem.amino-acids
  pace: recall
  prompt: 'Which amino acid is this?'
  figure:
    type: molecule
    formula: C2H5NO2
    atoms: [[-1.39, 0.0, "H2N"], [-0.52, -0.5], [0.35, 0.0], [0.35, 1.0, "O"], [1.21, -0.5, "OH"]]
    bonds: [[0, 1], [1, 2], [2, 3, 2], [2, 4]]
  parts:
    - ask: 'Name it'
      label: a
      choice: [alanine, glycine, serine, valine]
      correct: "1"
      explain: 'Glycine (Gly, G). No side chain at all (just H), so it is the only one that is not chiral'
  verify: { authored: true }


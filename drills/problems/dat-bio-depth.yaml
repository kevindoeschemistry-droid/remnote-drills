- template: dat-coupled-dg
  skill: bio.energetics
  pace: quick
  given:
    g1:
      pick:
      - 14.2
      - 16.7
      - 21.0
      - 33.0
      - 47.0
    natp:
      pick:
      - 1
      - 2
  prompt: A cell couples a reaction with ΔG°′ = +{{g1}} kJ/mol to the hydrolysis of {{natp}} ATP (ΔG°′ = −30.5 kJ/mol each). What is ΔG°′ of the coupled reaction, in kJ/mol?
  parts:
  - ask: Answer
    label: v
    tex: \Delta G
    value: g1 - 30.5*natp
    tol: 0.005
    explain: Free energies of coupled reactions add; a negative total means the coupled process is favourable
  verify:
    expect:
      v: solve(Eq(x + Rational(61, 2)*natp, nsimplify(g1)), x)[0]
- template: dat-dg-q
  skill: bio.energetics
  pace: quick
  given:
    g0:
      pick:
      - 2
      - 5
      - 7.5
    Qv:
      pick:
      - 0.001
      - 0.01
      - 0.05
  prompt: A step has ΔG°′ = +{{g0}} kJ/mol. In the cell, Q = {{Qv}} at 310 K. What is ΔG, in kJ/mol? (R = 8.314 J/mol·K)
  parts:
  - ask: Answer
    label: v
    tex: \Delta G
    value: g0 + 8.314*310*log(Qv)/1000
    tol: 0.005
    explain: 'ΔG = ΔG°′ + RT ln Q: keeping product low (small Q) pulls an uphill step forward'
  verify:
    expect:
      v: nsimplify(g0) + Rational(8314, 1000)*310*log(nsimplify(Qv))/1000

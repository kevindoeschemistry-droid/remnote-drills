- template: ec-economic-profit
  skill: econ.firm
  pace: quick
  cases:
  - kr: 300000
    kx: 180000
    ks: 70000
    kn: 10000
  - kr: 150000
    kx: 90000
    ks: 65000
    kn: 5000
  - kr: 500000
    kx: 350000
    ks: 90000
    kn: 20000
  - kr: 220000
    kx: 150000
    ks: 50000
    kn: 8000
  prompt: A business has revenue of {{kr}} dollars and explicit costs of {{kx}} dollars. The owner gave up a salary of {{ks}} dollars and {{kn}} dollars of interest on the savings invested. Find the economic profit.
  parts:
  - ask: Answer
    label: v
    tex: profit
    value: kr - kx - ks - kn
    final: true
    tol: 0.0001
    explain: Accounting profit less the implicit costs; a negative answer means the owner would do better elsewhere
  verify:
    expect:
      v: solve(Eq(Symbol('m') + ks + kn, kr - kx), Symbol('m'))[0]

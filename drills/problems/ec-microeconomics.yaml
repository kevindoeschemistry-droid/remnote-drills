- template: ec-nash
  skill: econ.imperfect
  pace: recall
  cases:
  - q: 'Payoffs (A, B): both price High (10, 10); A High, B Low (2, 14); A Low, B High (14, 2); both Low (5, 5). What is the Nash equilibrium?'
    o1: both price Low
    o2: both price High
    o3: A High, B Low
    o4: A Low, B High
  - q: 'Payoffs (A, B): both Advertise (6, 6); A Advertises, B does not (12, 3); A does not, B Advertises (3, 12); neither (9, 9). What is A''s dominant strategy?'
    o1: Advertise
    o2: Do not advertise
    o3: A has none
    o4: copy B
  - q: 'Payoffs (A, B): both Enter (−2, −2); A Enters, B stays out (8, 0); A stays out, B Enters (0, 8); both stay out (0, 0). Does A have a dominant strategy?'
    o1: 'no: A''s best choice depends on what B does'
    o2: 'yes: Enter'
    o3: 'yes: stay out'
    o4: 'yes: whichever B chooses'
  - q: 'Payoffs (A, B): both High (10, 10); A High, B Low (2, 14); A Low, B High (14, 2); both Low (5, 5). Why do the firms not both price High?'
    o1: each gains by cutting price whatever the other does
    o2: High prices are illegal
    o3: they do not know the payoffs
    o4: High is each firm's dominant strategy
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Check each player's best reply to each of the other's choices
  verify:
    authored: true

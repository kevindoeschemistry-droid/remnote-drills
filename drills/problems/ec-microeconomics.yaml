- template: ec-long-run-price
  skill: econ.firm
  pace: quick
  cases:
  - ka: 100
    kb: 4
    kc: 1
  - ka: 64
    kb: 10
    kc: 4
  - ka: 200
    kb: 5
    kc: 2
  - ka: 36
    kb: 2
    kc: 1
  - ka: 400
    kb: 20
    kc: 1
  prompt: Every firm in a competitive industry has total cost TC = {{ka}} + {{kb}}q + {{kc}}q². Find the long-run equilibrium price.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: kb + 2*sqrt(ka*kc)
    tol: 0.005
    explain: Price falls to minimum average total cost, which is where q = sqrt(a/c)
  verify:
    expect:
      v: (ka + kb*Max(*solve(diff((ka + kb*Y + kc*Y**2)/Y, Y), Y)) + kc*Max(*solve(diff((ka + kb*Y + kc*Y**2)/Y, Y), Y))**2)/Max(*solve(diff((ka + kb*Y + kc*Y**2)/Y, Y), Y))
- template: ec-pc-long-run
  skill: econ.firm
  pace: recall
  cases:
  - q: Firms in a competitive industry are earning economic profit. What happens in the long run?
    o1: firms enter, supply rises and price falls until profit is zero
    o2: firms exit and price rises
    o3: nothing changes
    o4: each firm raises its price
  - q: In long-run competitive equilibrium, price equals what?
    o1: marginal cost and minimum average total cost
    o2: average variable cost only
    o3: average fixed cost
    o4: marginal revenue plus a markup
  - q: Why is a perfectly competitive firm a price taker?
    o1: it sells an identical product and is small relative to the market
    o2: the government sets its price
    o3: it has no costs
    o4: its demand curve slopes down steeply
  - q: What does P = MC mean for society?
    o1: 'allocative efficiency: the last unit is worth what it costs'
    o2: the firm earns the largest possible profit margin
    o3: consumers get no surplus
    o4: output is too low
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Free entry is what delivers zero profit and minimum cost
  verify:
    authored: true
- template: ec-monopoly-price

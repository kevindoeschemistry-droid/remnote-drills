- template: ec-midpoint-elasticity
  skill: econ.markets
  pace: quick
  cases:
  - kp: 4
    kq: 6
    ka: 120
    kb: 80
  - kp: 10
    kq: 12
    ka: 55
    kb: 45
  - kp: 2
    kq: 3
    ka: 100
    kb: 90
  - kp: 8
    kq: 10
    ka: 30
    kb: 10
  - kp: 5
    kq: 7
    ka: 70
    kb: 50
  prompt: When price rises from {{kp}} to {{kq}} dollars, quantity demanded falls from {{ka}} to {{kb}} units. Find the price elasticity of demand by the midpoint method, as a positive number.
  parts:
  - ask: Answer
    label: v
    tex: E_d
    value: ((ka - kb)/((ka + kb)/2))/((kq - kp)/((kp + kq)/2))
    tol: 0.005
    explain: Percentage changes on the average of the two points, so the answer is the same in both directions
  verify:
    expect:
      v: solve(Eq(Symbol('m')*(kq - kp)*(ka + kb), (ka - kb)*(kp + kq)), Symbol('m'))[0]

# Second question types; keys recomputed by sympy along another route.

- template: ec-opportunity-cost
  skill: econ.basics
  pace: quick
  cases:
  - kt: 15000
    kw: 30000
    kr: 12000
  - kt: 40000
    kw: 35000
    kr: 14000
  - kt: 9000
    kw: 28000
    kr: 10000
  - kt: 22000
    kw: 42000
    kr: 15000
  prompt: A year of college costs {{kt}} dollars in tuition and books. The student gives up a job paying {{kw}} dollars a year. Room and board would cost {{kr}} dollars either way. Find the opportunity cost of the year of college.
  parts:
  - ask: Answer
    label: v
    tex: cost
    value: kt + kw
    final: true
    tol: 0.0001
    explain: Count what is paid and what is given up; leave out costs that would be incurred anyway
  verify:
    expect:
      v: solve(Eq(Symbol('m') + kr - kw, kt + kr), Symbol('m'))[0]
- template: ec-scarcity
  skill: econ.basics
  pace: recall
  cases:
  - q: What is the basic economic problem?
    o1: limited resources against unlimited wants
    o2: too little money in circulation
    o3: unequal incomes
    o4: government regulation
  - q: Which is a factor of production?
    o1: capital
    o2: money in a bank account
    o3: a share of stock
    o4: profit
  - q: In economics, what does 'capital' mean?
    o1: tools, machines and buildings used to produce
    o2: money available to spend
    o3: a firm's stock price
    o4: natural resources
  - q: How are goods mainly allocated in a market economy?
    o1: by prices set through supply and demand
    o2: by central planners
    o3: by tradition
    o4: by lottery
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Scarcity forces choice, and choice has a cost
  verify:
    authored: true

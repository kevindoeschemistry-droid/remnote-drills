- template: ec-ppc-opportunity-cost
  skill: econ.basics
  pace: quick
  cases:
  - ka: 100
    kb: 400
  - ka: 50
    kb: 20
  - ka: 200
    kb: 300
  - ka: 80
    kb: 40
  - ka: 30
    kb: 120
  prompt: With all its resources a country can make {{ka}} cars or {{kb}} tonnes of wheat, and its production possibilities curve is a straight line. Find the opportunity cost of one car in tonnes of wheat.
  parts:

- template: ec-monopoly-dwl
  skill: econ.imperfect
  pace: quick
  cases:
  - ka: 100
    kb: 2
    kc: 20
  - ka: 60
    kb: 1
    kc: 10
  - ka: 80
    kb: 4
    kc: 16
  - ka: 120
    kb: 3
    kc: 30
  prompt: A monopolist faces P = {{ka}} − {{kb}}Q with constant marginal cost {{kc}} dollars. Find the deadweight loss compared with the competitive outcome.
  parts:
  - ask: Answer
    label: v
    tex: DWL
    value: (ka - kc)^2/(8*kb)
    tol: 0.005
    explain: The monopolist sells half the competitive quantity; the lost triangle has that base and the markup as height
  verify:
    expect:
      v: integrate(ka - kb*Y - kc, (Y, solve(diff((ka - kb*Y)*Y - kc*Y, Y), Y)[0], (ka - kc)/Rational(kb)))
- template: ec-perfect-pd-profit
  skill: econ.imperfect
  pace: quick
  cases:
  - ka: 100

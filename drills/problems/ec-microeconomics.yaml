- template: ec-competitive-profit
  skill: econ.firm
  pace: quick
  cases:
  - kp: 20
    kn: 500
    ka: 16
  - kp: 12
    kn: 1000
    ka: 14
  - kp: 50
    kn: 200
    ka: 42
  - kp: 8
    kn: 3000
    ka: 9
  prompt: A price-taking firm faces a price of {{kp}} dollars and, at the output where price equals marginal cost, makes {{kn}} units at an average total cost of {{ka}} dollars. Find its profit (negative for a loss).

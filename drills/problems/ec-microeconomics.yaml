- template: ec-tax-deadweight
  skill: econ.markets
  pace: quick
  cases:
  - ka: 100
    kb: 2
    kd: 2
    kt: 10
  - ka: 120
    kb: 3
    kd: 1
    kt: 8
  - ka: 60
    kb: 1
    kd: 2
    kt: 6
  - ka: 200
    kb: 4
    kd: 4
    kt: 5
  prompt: Demand is Qd = {{ka}} − {{kb}}P and supply is Qs = {{kd}}P. A tax of {{kt}} dollars per unit is placed on sellers. Find the deadweight loss.
  parts:
  - ask: Answer
    label: v
    tex: DWL
    value: kt^2*kb*kd/(2*(kb + kd))
    tol: 0.005
    explain: Half the tax times the fall in quantity; the check solves the taxed equilibrium directly
  verify:
    expect:
      v: (kt/Rational(2))*(kd*solve(Eq(ka - kb*Symbol('m'), kd*Symbol('m')), Symbol('m'))[0] - (ka - kb*solve(Eq(ka - kb*Symbol('m'), kd*(Symbol('m') - kt)), Symbol('m'))[0]))
- template: ec-imports
  skill: econ.markets
  pace: quick
  cases:
  - ka: 100
    kb: 2
    kd: 2
    kw: 10
  - ka: 120
    kb: 3
    kd: 1
    kw: 20
  - ka: 60
    kb: 1
    kd: 2
    kw: 10
  - ka: 200
    kb: 4
    kd: 4
    kw: 15
  prompt: Domestic demand is Qd = {{ka}} − {{kb}}P and domestic supply is Qs = {{kd}}P. The world price is {{kw}} dollars. Find the quantity imported.
  parts:
  - ask: Answer
    label: v
    tex: imports
    value: ka - kb*kw - kd*kw
    tol: 0.005
    explain: Imports fill the gap between what buyers want and what home producers supply at the world price
  verify:
    expect:
      v: solve(Eq(kd*kw + Symbol('m'), ka - kb*kw), Symbol('m'))[0]
- template: ec-tariff-revenue
  skill: econ.markets
  pace: quick
  cases:
  - ka: 100
    kb: 2
    kd: 2
    kw: 10
    kt: 5
  - ka: 120
    kb: 3
    kd: 1
    kw: 20
    kt: 5
  - ka: 60
    kb: 1
    kd: 2
    kw: 10
    kt: 4
  - ka: 200
    kb: 4
    kd: 4
    kw: 15
    kt: 5
  prompt: Domestic demand is Qd = {{ka}} − {{kb}}P and domestic supply is Qs = {{kd}}P. The world price is {{kw}} dollars and a tariff of {{kt}} dollars per unit is imposed. Find the tariff revenue.
  parts:
  - ask: Answer
    label: v
    tex: rev
    value: kt*(ka - (kb + kd)*(kw + kt))
    tol: 0.005
    explain: The tariff raises the home price to world price plus tariff; revenue is the tariff on the imports that remain
  verify:
    expect:
      v: kt*solve(Eq(kd*(kw + kt) + Symbol('m'), ka - kb*(kw + kt)), Symbol('m'))[0]

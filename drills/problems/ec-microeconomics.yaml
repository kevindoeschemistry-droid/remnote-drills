- template: ec-equilibrium-quantity
  skill: econ.markets
  pace: quick
  cases:
  - ka: 100
    kb: 2
    kc: 10
    kd: 4
  - ka: 60
    kb: 3
    kc: 0
    kd: 2
  - ka: 200
    kb: 5
    kc: 20
    kd: 10
  - ka: 90
    kb: 1
    kc: 30
    kd: 2
  - ka: 150
    kb: 4
    kc: 30
    kd: 2
  prompt: Demand is Qd = {{ka}} − {{kb}}P and supply is Qs = {{kc}} + {{kd}}P. Find the equilibrium quantity.
  parts:
  - ask: Answer
    label: v
    tex: Q
    value: ka - kb*(ka - kc)/(kb + kd)
    tol: 0.005
    explain: Find the price first, then put it into either equation
  verify:
    expect:
      v: solve(Eq((ka - Symbol('m'))/kb, (Symbol('m') - kc)/kd), Symbol('m'))[0]

- template: ec-comparative-advantage
  skill: econ.basics
  pace: recall
  cases:
  - q: In a day Ana makes 10 shirts or 5 hats; Ben makes 6 shirts or 2 hats. Who has the comparative advantage in hats?
    o1: Ana (a hat costs her 2 shirts; it costs Ben 3)
    o2: Ben (a hat costs him 3 shirts)
    o3: neither
    o4: both
  - q: In a day Ana makes 10 shirts or 5 hats; Ben makes 6 shirts or 2 hats. Who has the comparative advantage in shirts?
    o1: Ben (a shirt costs him 1/3 hat; it costs Ana 1/2)
    o2: Ana (she makes more shirts)
    o3: neither
    o4: both
  - q: Country X makes 8 cars or 4 planes; country Y makes 6 cars or 1 plane. Which should specialise in cars?
    o1: Y (a car costs it 1/6 plane; it costs X 1/2)
    o2: X (it makes more cars)
    o3: neither
    o4: both equally
  - q: Can one party have the comparative advantage in both goods?
    o1: 'no: a lower opportunity cost in one good means a higher one in the other'
    o2: yes, if it is more productive in both
    o3: yes, if it is larger
    o4: only with tariffs
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Absolute advantage is about who makes more; comparative advantage is about who gives up less
  verify:
    authored: true
- template: ec-terms-of-trade
  skill: econ.basics
  pace: recall
  cases:
  - q: A hat costs Ana 2 shirts and costs Ben 3 shirts. Which price for one hat benefits both?
    o1: 2.5 shirts
    o2: 1.5 shirts
    o3: 3.5 shirts
    o4: 4 shirts
  - q: A car costs X half a plane and costs Y one sixth of a plane. Which price for one car benefits both?
    o1: one third of a plane
    o2: one tenth of a plane
    o3: three quarters of a plane
    o4: one plane
  - q: Where must mutually beneficial terms of trade lie?
    o1: between the two parties' opportunity costs
    o2: below both opportunity costs
    o3: above both opportunity costs
    o4: at the richer party's cost
  - q: What do specialisation and trade allow a country to do?
    o1: consume beyond its own production possibilities curve
    o2: produce beyond its production possibilities curve without new resources
    o3: eliminate scarcity
    o4: avoid all opportunity costs
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: A price between the two opportunity costs leaves each side better off than making the good itself
  verify:
    authored: true
- template: ec-mb-equals-mc
  skill: econ.basics
  pace: quick
  cases:
  - ka: 50
    kb: 2
    kc: 10
  - ka: 100
    kb: 5
    kc: 40
  - ka: 24
    kb: 3
    kc: 6
  - ka: 80
    kb: 4
    kc: 20
  prompt: The marginal benefit of the q-th unit is {{ka}} − {{kb}}q dollars and each unit costs {{kc}} dollars. What quantity maximises net benefit?
  parts:
  - ask: Answer
    label: v
    tex: q
    value: (ka - kc)/kb
    tol: 0.005
    explain: Keep going until the marginal benefit has fallen to the marginal cost
  verify:
    expect:
      v: solve(diff(ka*Symbol('m') - kb*Symbol('m')**2/2 - kc*Symbol('m'), Symbol('m')), Symbol('m'))[0]

    kb: 3
    kc: 30
  - ka: 50
    kb: 0.5
    kc: 10
  prompt: A monopolist faces P = {{ka}} − {{kb}}Q and has a constant marginal cost of {{kc}} dollars. Find the profit-maximising price.
  parts:

- template: ec-consumer-surplus
  skill: econ.markets
  pace: quick
  cases:
  - ka: 100
    kb: 2
    kp: 40
  - ka: 50
    kb: 1
    kp: 20
  - ka: 80
    kb: 4
    kp: 20
  - ka: 60
    kb: 3
    kp: 30
  - ka: 120
    kb: 2
    kp: 60
  prompt: Inverse demand is P = {{ka}} − {{kb}}Q and the market price is {{kp}} dollars. Find the consumer surplus.
  parts:
  - ask: Answer
    label: v
    tex: CS

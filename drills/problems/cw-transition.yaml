    - { sp: 'IrCl(CO)(PPh₃)₂ (Vaska''s)', M: 'Ir', lg: 'Cl:1,CO:1,PPh3:2', ch: 0, n: 16 }
    - { sp: '[PtCl₃(η²-C₂H₄)]⁻ (Zeise''s anion)', M: 'Pt', lg: 'Cl:3,C2H4:1', ch: -1, n: 16 }
    - { sp: 'CpMn(CO)₃', M: 'Mn', lg: 'Cp:1,CO:3', ch: 0, n: 18 }
  prompt: 'What is the valence electron count of {{sp}}?'
  parts:
    - { ask: 'Electrons', label: y, tex: 'n', value: n, tol: 0.002, explain: 'Ionic method: dⁿ of the metal plus 2 per ligand pair (Cp⁻ 6, C₆H₆ 6, Cl⁻ 2). Neutral method: group number plus 1 per halide, 5 per Cp, 2 per CO. Both give 18 for stable carbonyls; square-planar d⁸ complexes (Rh(I), Ir(I), Pt(II)) are content with 16.' }
  verify: { expect: { y: "cw_electron_count(M, lg, ch)" } }

- template: cw-oxidative-addition
  skill: inorg.organometallic
  pace: quick
  cases:
    - { sp: 'IrCl(CO)(PPh₃)₂ + H₂', M: 'Ir', lg: 'Cl:1,CO:1,PPh3:2,H:2', ch: 0, n: 18 }
    - { sp: 'IrCl(CO)(PPh₃)₂ + CH₃I', M: 'Ir', lg: 'Cl:1,CO:1,PPh3:2,CH3:1,I:1', ch: 0, n: 18 }
    - { sp: 'RhCl(PPh₃)₃ + H₂', M: 'Rh', lg: 'Cl:1,PPh3:3,H:2', ch: 0, n: 18 }
    - { sp: 'Pd(PPh₃)₂ + PhBr', M: 'Pd', lg: 'PPh3:2,Ph:1,Br:1', ch: 0, n: 16 }
    - { sp: '[Rh(CO)₂I₂]⁻ + CH₃I (Monsanto)', M: 'Rh', lg: 'CO:2,I:3,CH3:1', ch: -1, n: 18 }
  prompt: 'What is the electron count of the product of the oxidative addition {{sp}}?'
  parts:
    - { ask: 'Electrons', label: y, tex: 'n', value: n, tol: 0.002, explain: 'Oxidative addition breaks X–Y and adds both to the metal: oxidation state +2, coordination number +2, electron count +2 (16 → 18). Reductive elimination is the reverse and forms the product C–C or C–H bond.' }
  verify: { expect: { y: "cw_electron_count(M, lg, ch)" } }

- template: cw-reaction-step
  skill: inorg.organometallic
  pace: recall
  cases:
    - { key: 'step:addH2', f: 'M + H₂ → M(H)₂, the metal''s oxidation state rising by 2', o1: 'Oxidative addition', o2: 'Reductive elimination', o3: 'Migratory insertion (1,1)', o4: 'β-Hydride elimination' }
    - { key: 'step:loseHH', f: 'M(H)(R) → M + R–H, the oxidation state falling by 2', o1: 'Reductive elimination', o2: 'Oxidative addition', o3: 'Migratory insertion (1,2)', o4: 'β-Hydride elimination' }
    - { key: 'step:COins', f: 'M(CH₃)(CO) → M(COCH₃), forming an acyl', o1: 'Migratory insertion (1,1)', o2: 'Migratory insertion (1,2)', o3: 'Oxidative addition', o4: 'β-Hydride elimination' }
    - { key: 'step:olefinins', f: 'M(H)(CH₂=CH₂) → M(CH₂CH₃)', o1: 'Migratory insertion (1,2)', o2: 'Migratory insertion (1,1)', o3: 'Reductive elimination', o4: 'β-Hydride elimination' }
    - { key: 'step:betaH', f: 'M(CH₂CH₂R) → M(H)(CH₂=CHR)', o1: 'β-Hydride elimination', o2: 'Migratory insertion (1,2)', o3: 'Oxidative addition', o4: 'Reductive elimination' }
  prompt: 'Name the elementary step: {{f}}.'
  parts:
    - { ask: 'Answer', label: a, choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"], correct: 0, explain: 'Catalytic cycles are built from a handful of steps: oxidative addition and reductive elimination change the oxidation state by 2; insertions and β-elimination change it by none, but open or fill a coordination site.' }
  verify: { choices: { a: "cw_fact_pick(key, o1, o2, o3, o4)" } }

- template: cw-beta-hydride
  skill: inorg.organometallic
  pace: recall
  cases:
    - { key: 'betaH:need', f: 'β-hydride elimination from a metal alkyl', o1: 'A vacant site cis to the alkyl and a β hydrogen', o2: 'An 18-electron metal', o3: 'A trans vacant site', o4: 'An α hydrogen only' }
  prompt: 'What does {{f}} need?'
  parts:
    - { ask: 'Answer', label: a, choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"], correct: 0, explain: 'The β C–H swings in to the open cis site; without one, or without a β hydrogen (methyl, neopentyl, benzyl), the alkyl is far more stable. Chain growth in polymerisation stops this way.' }
  verify: { choices: { a: "cw_fact_pick(key, o1, o2, o3, o4)" } }

- template: cw-catalytic-process
  skill: inorg.organometallic
  pace: recall
  cases:
    - { key: 'cat:monsanto', f: 'the Monsanto acetic acid process', o1: 'Rh with iodide (methanol carbonylation to acetic acid)', o2: 'Pd(II) with Cu(II) (ethene to acetaldehyde)', o3: 'TiCl₄ with AlEt₃ (alkene polymerisation)', o4: 'Ru or Mo alkylidenes (Grubbs, Schrock)' }
    - { key: 'cat:wacker', f: 'the Wacker process', o1: 'Pd(II) with Cu(II) (ethene to acetaldehyde)', o2: 'Rh with iodide (methanol carbonylation to acetic acid)', o3: 'Co or Rh carbonyls (alkene + CO + H₂ to aldehyde)', o4: 'RhCl(PPh₃)₃ (alkene hydrogenation)' }
    - { key: 'cat:ziegler', f: 'Ziegler–Natta polymerisation', o1: 'TiCl₄ with AlEt₃ (alkene polymerisation)', o2: 'Pd(II) with Cu(II) (ethene to acetaldehyde)', o3: 'Ru or Mo alkylidenes (Grubbs, Schrock)', o4: 'Co or Rh carbonyls (alkene + CO + H₂ to aldehyde)' }
    - { key: 'cat:wilkinson', f: 'homogeneous hydrogenation of alkenes', o1: 'RhCl(PPh₃)₃ (alkene hydrogenation)', o2: 'TiCl₄ with AlEt₃ (alkene polymerisation)', o3: 'Pd(II) with Cu(II) (ethene to acetaldehyde)', o4: 'Rh with iodide (methanol carbonylation to acetic acid)' }
    - { key: 'cat:hydroform', f: 'hydroformylation (the oxo process)', o1: 'Co or Rh carbonyls (alkene + CO + H₂ to aldehyde)', o2: 'RhCl(PPh₃)₃ (alkene hydrogenation)', o3: 'Ru or Mo alkylidenes (Grubbs, Schrock)', o4: 'TiCl₄ with AlEt₃ (alkene polymerisation)' }
    - { key: 'cat:metathesis', f: 'olefin metathesis', o1: 'Ru or Mo alkylidenes (Grubbs, Schrock)', o2: 'Co or Rh carbonyls (alkene + CO + H₂ to aldehyde)', o3: 'Pd(II) with Cu(II) (ethene to acetaldehyde)', o4: 'TiCl₄ with AlEt₃ (alkene polymerisation)' }
  prompt: 'What catalyst runs {{f}}?'
  parts:
    - { ask: 'Answer', label: a, choice: ["{{o1}}", "{{o2}}", "{{o3}}", "{{o4}}"], correct: 0, explain: 'Each industrial cycle strings together the elementary steps: Monsanto is oxidative addition of CH₃I, CO insertion and reductive elimination of acetyl iodide; Wacker is nucleophilic attack on Pd-bound ethene with Cu reoxidising Pd(0).' }
  verify: { choices: { a: "cw_fact_pick(key, o1, o2, o3, o4)" } }

- template: cw-monsanto-count
  skill: inorg.organometallic
  pace: quick
  cases:
    - { sp: '[Rh(CO)₂I₂]⁻, the resting catalyst', M: 'Rh', lg: 'CO:2,I:2', ch: -1, n: 16 }
    - { sp: '[CH₃Rh(CO)₂I₃]⁻, after oxidative addition', M: 'Rh', lg: 'CO:2,I:3,CH3:1', ch: -1, n: 18 }
    - { sp: '[Rh(COCH₃)(CO)I₃]⁻, after CO insertion', M: 'Rh', lg: 'CO:1,I:3,acyl:1', ch: -1, n: 16 }
    - { sp: '[Rh(COCH₃)(CO)₂I₃]⁻, after CO binds', M: 'Rh', lg: 'CO:2,I:3,acyl:1', ch: -1, n: 18 }
  prompt: 'In the Monsanto cycle, what is the electron count of {{sp}}?'
  parts:
    - { ask: 'Electrons', label: y, tex: 'n', value: n, tol: 0.002, explain: 'The cycle alternates 16 and 18 electrons (Tolman''s rule): oxidative addition 16 → 18, migratory insertion 18 → 16, CO uptake 16 → 18, reductive elimination of CH₃COI 18 → 16.' }
  verify: { expect: { y: "cw_electron_count(M, lg, ch)" } }

- template: mec-truss-rules
  skill: mech.statics
  pace: recall
  cases:
  - q: What kind of force can an ideal truss member carry?
    o1: axial tension or compression only
    o2: bending moment
    o3: shear only
    o4: torsion
  - q: At an unloaded joint where only two non-collinear members meet, what are the member forces?
    o1: both are zero
    o2: equal and opposite
    o3: equal to the support reaction
    o4: cannot be found
  - q: Three members meet at an unloaded joint and two are collinear. What is the force in the third?
    o1: zero
    o2: equal to the sum of the other two
    o3: twice the others
    o4: it depends on the span
  - q: Where are loads assumed to act on an ideal truss?
    o1: at the joints only
    o2: at the middle of members
    o3: uniformly along members
    o4: at the supports only
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Pins, straight members and joint loads are what make every member a two-force member
  verify:
    authored: true

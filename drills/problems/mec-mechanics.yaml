- template: mec-resultant
  skill: mech.statics
  pace: quick
  cases:
  - ka: 30
    kb: 40
    kt: 90
  - ka: 100
    kb: 100
    kt: 60
  - ka: 50
    kb: 80
    kt: 120
  - ka: 20
    kb: 20
    kt: 90
  - ka: 60
    kb: 25
    kt: 0
  prompt: Forces of {{ka}} N and {{kb}} N act at a point with an angle of {{kt}}° between them. Find the magnitude of their resultant in newtons.
  parts:
  - ask: Answer
    label: v
    tex: R
    value: sqrt(ka^2 + kb^2 + 2*ka*kb*cos(kt*pi/180))
    tol: 0.005
    explain: 'Add components: put one force on the x-axis and resolve the other'
  verify:
    expect:
      v: sqrt((ka + kb*cos(kt*pi/180))**2 + (kb*sin(kt*pi/180))**2)

  prompt: A solid steel shaft (G = 80 GPa) of diameter {{kd}} mm and length {{kl}} m carries a torque of {{kt}} N·m. Find the angle of twist in degrees.
  parts:
  - ask: Answer
    label: v
    tex: \phi
    value: kt*1000*kl*1000/(80000*pi*kd^4/32)*180/pi
    tol: 0.005
    explain: φ = TL/(GJ) in radians, then convert
  verify:
    expect:
      v: solve(Eq(Symbol('m')*pi/180*80000*pi*kd**4/32, kt*1000*kl*1000), Symbol('m'))[0]
- template: mec-max-moment-udl
  skill: mech.materials
  pace: quick
  cases:
  - kl: 6
    kw: 5
  - kl: 8
    kw: 10
  - kl: 4
    kw: 3
  - kl: 10
    kw: 2
  - kl: 5
    kw: 8
  prompt: A simply supported beam of span {{kl}} m carries a uniform load of {{kw}} kN/m. Find the maximum bending moment in kN·m.
  parts:
  - ask: Answer
    label: v
    tex: M
    value: kw*kl^2/8
    tol: 0.005
    explain: The moment is the area under the shear diagram up to midspan, where the shear is zero
  verify:
    expect:
      v: integrate(kw*kl/Rational(2) - kw*Y, (Y, 0, kl/Rational(2)))
- template: mec-max-moment-point
  skill: mech.materials
  pace: quick
  cases:
  - kl: 6
    kp: 30
  - kl: 10
    kp: 50
  - kl: 4
    kp: 12
  - kl: 8
    kp: 40
  - kl: 5
    kp: 20
  prompt: A simply supported beam of span {{kl}} m carries a point load of {{kp}} kN at midspan. Find the maximum bending moment in kN·m.
  parts:
  - ask: Answer
    label: v
    tex: M
    value: kp*kl/4
    tol: 0.005
    explain: Half the load as a reaction, acting over half the span
  verify:
    expect:
      v: integrate(kp/Rational(2), (Y, 0, kl/Rational(2)))
- template: mec-bending-stress
  skill: mech.materials
  pace: quick
  cases:
  - kb: 50
    kh: 100
    km: 5
  - kb: 100
    kh: 200
    km: 40
  - kb: 40
    kh: 80
    km: 2
  - kb: 150
    kh: 300
    km: 90
  - kb: 20
    kh: 60
    km: 0.6
  prompt: A rectangular beam {{kb}} mm wide and {{kh}} mm deep carries a bending moment of {{km}} kN·m. Find the maximum bending stress in MPa.
  parts:
  - ask: Answer
    label: v
    tex: \sigma
    value: 6*km*1e6/(kb*kh^2)
    tol: 0.005
    explain: σ = Mc/I with c = h/2 and I = bh³/12
  verify:
    expect:
      v: (km*10**6)*(kh/Rational(2))/(kb*kh**3/Rational(12))
- template: mec-midspan-deflection
  skill: mech.materials
  pace: quick
  cases:
  - kl: 4
    ki0: 20
    kp: 30
  - kl: 6
    ki0: 80
    kp: 50
  - kl: 3
    ki0: 10
    kp: 12
  - kl: 8
    ki0: 200
    kp: 40
  - kl: 5
    ki0: 45
    kp: 20
  prompt: A simply supported steel beam (E = 200 GPa) of span {{kl}} m with I = {{ki0}} × 10⁶ mm⁴ carries {{kp}} kN at midspan. Find the midspan deflection in mm.
  parts:
  - ask: Answer
    label: v
    tex: \delta
    value: kp*1000*(kl*1000)^3/(48*200000*ki0*1e6)
    tol: 0.005
    explain: δ = PL³/(48EI), keeping newtons and millimetres throughout
  verify:
    expect:
      v: solve(Eq(Symbol('m')*48*200000*ki0*10**6, kp*1000*(kl*1000)**3), Symbol('m'))[0]
- template: mec-principal-stress
  skill: mech.materials
  pace: quick
  cases:
  - ka: 80
    kb: 20
    kt: 40
  - ka: 100
    kb: 0
    kt: 50
  - ka: 60
    kb: -20
    kt: 30
  - ka: 50
    kb: 50
    kt: 25
  - ka: 120
    kb: 40
    kt: 30
  prompt: At a point σx = {{ka}} MPa, σy = {{kb}} MPa and τxy = {{kt}} MPa. Find the larger principal stress in MPa.
  parts:
  - ask: Answer
    label: v
    tex: \sigma_1
    value: (ka + kb)/2 + sqrt(((ka - kb)/2)^2 + kt^2)
    tol: 0.005
    explain: Centre plus radius of Mohr's circle; the check takes the larger eigenvalue of the stress matrix
  verify:
    expect:
      v: Max(*Matrix([[ka, kt], [kt, kb]]).eigenvals().keys())
- template: mec-max-shear
  skill: mech.materials
  pace: quick
  cases:
  - ka: 80
    kb: 20
    kt: 40
  - ka: 100
    kb: 0
    kt: 50
  - ka: 60
    kb: -20
    kt: 30
  - ka: 120
    kb: 40
    kt: 30
  - ka: 90
    kb: 30
    kt: 40
  prompt: At a point σx = {{ka}} MPa, σy = {{kb}} MPa and τxy = {{kt}} MPa. Find the maximum in-plane shear stress in MPa.
  parts:
  - ask: Answer
    label: v
    tex: \tau_{max}
    value: sqrt(((ka - kb)/2)^2 + kt^2)
    tol: 0.005
    explain: The radius of Mohr's circle, half the difference of the principal stresses
  verify:
    expect:
      v: (Max(*Matrix([[ka, kt], [kt, kb]]).eigenvals().keys()) - Min(*Matrix([[ka, kt], [kt, kb]]).eigenvals().keys()))/2
- template: mec-hoop-stress
  skill: mech.materials
  pace: quick
  cases:
  - kr: 500
    kt: 10
    kp: 2
  - kr: 250
    kt: 5
    kp: 1.5
  - kr: 1000
    kt: 20
    kp: 0.8
  - kr: 150
    kt: 3
    kp: 4
  - kr: 600
    kt: 12
    kp: 1
  prompt: A thin-walled cylindrical tank of radius {{kr}} mm and wall thickness {{kt}} mm holds a pressure of {{kp}} MPa. Find the hoop stress in MPa.
  parts:
  - ask: Answer
    label: v
    tex: \sigma_h
    value: kp*kr/kt
    tol: 0.005
    explain: 'Cut the cylinder lengthwise: wall force 2σt balances pressure on the projected width 2r'
  verify:
    expect:
      v: solve(Eq(2*Symbol('m')*kt, kp*2*kr), Symbol('m'))[0]
- template: mec-combined-stress
  skill: mech.materials
  pace: quick
  cases:
  - kb: 50
    kh: 100
    kp: 100
    km: 5
  - kb: 100
    kh: 200
    kp: 400
    km: 40
  - kb: 40
    kh: 80
    kp: 64
    km: 2
  - kb: 20
    kh: 60
    kp: 24
    km: 0.6
  prompt: A rectangular section {{kb}} mm × {{kh}} mm carries an axial tension of {{kp}} kN and a bending moment of {{km}} kN·m about its strong axis. Find the maximum tensile stress in MPa.
  parts:
  - ask: Answer
    label: v
    tex: \sigma
    value: kp*1000/(kb*kh) + 6*km*1e6/(kb*kh^2)
    tol: 0.005
    explain: Add the uniform axial stress to the bending stress on the tension side
  verify:
    expect:
      v: kp*1000/Rational(kb*kh) + (km*10**6)*(kh/Rational(2))/(kb*kh**3/Rational(12))
- template: mec-euler-buckling
  skill: mech.materials
  pace: quick
  cases:
  - kl: 4
    ki0: 10
  - kl: 3
    ki0: 5
  - kl: 6
    ki0: 40
  - kl: 5
    ki0: 20
  - kl: 2.5
    ki0: 2
  prompt: A pinned-pinned steel column (E = 200 GPa) is {{kl}} m long with I = {{ki0}} × 10⁶ mm⁴. Find its Euler buckling load in kN.
  parts:
  - ask: Answer
    label: v
    tex: P_{cr}
    value: pi^2*200000*ki0*1e6/(kl*1000)^2/1000
    tol: 0.005
    explain: π²EI/L² with K = 1
  verify:
    expect:
      v: solve(Eq(Symbol('m')*1000*(kl*1000)**2, pi**2*200000*ki0*10**6), Symbol('m'))[0]
- template: mec-effective-length
  skill: mech.materials
  pace: recall
  cases:
  - q: Both ends pinned
    kc: 2
  - q: Both ends fixed
    kc: 0
  - q: One end fixed, the other pinned
    kc: 1
  - q: One end fixed, the other free (a flagpole)
    kc: 3
  prompt: What is the theoretical effective length factor K? {{q}}
  parts:
  - ask: Answer
    label: v
    choice:
    - '0.5'
    - '0.7'
    - '1'
    - '2'
    correct: kc
    explain: The more the ends are restrained, the shorter the column behaves
  verify:

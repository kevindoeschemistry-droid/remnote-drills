- template: sto-classify-state
  skill: stoch.chains
  pace: recall
  cases:
  - ds: From 0 the chain stays at 0. From 1 it moves to 0 or 2 with probability 1/2 each. From 2 it stays at 2.
    ks: 1
    kc: 1
  - ds: From 0 the chain stays at 0. From 1 it moves to 0 or 2 with probability 1/2 each. From 2 it stays at 2.
    ks: 0
    kc: 0
  - ds: The chain moves 0 → 1 → 2 → 0 deterministically.
    ks: 1
    kc: 2
  - ds: From 0 it moves to 1. From 1 it moves to 2. From 2 it moves to 1.
    ks: 0
    kc: 1
  - ds: From 0 it moves to 1. From 1 it moves to 2. From 2 it moves to 1.
    ks: 2
    kc: 2
  - ds: From 0 it stays with probability 1/2 or moves to 1. From 1 it stays for ever.
    ks: 1
    kc: 0
  prompt: 'In this chain, state {{ks}} is: {{ds}}'
  parts:
  - ask: Answer
    label: v
    choice:
    - Absorbing
    - Transient
    - Recurrent but not absorbing
    correct: kc
    explain: Ask whether the chain, having left the state, is certain to come back. If it can escape to somewhere with no way back, the state is transient
  verify:
    authored: true

# Generated by scripts/second_types.py from scripts/second_specs/pm4_sto.py: edit the spec, not this file.
# Second question types; keys recomputed by sympy along another route.

- template: sto-missing-entry
  skill: stoch.chains
  pace: quick
  cases:
  - ka: 0.2
    kb: 0.5
  - ka: 0.1
    kb: 0.6
  - ka: 0.25
    kb: 0.25
  - ka: 0.4
    kb: 0.35
  - ka: 0.05
    kb: 0.8
  prompt: A transition matrix has first row ({{ka}}, {{kb}}, ?). Find the missing entry.
  parts:
  - ask: Answer
    label: v
    tex: p
    value: 1 - ka - kb
    tol: 0.005
    explain: Each row lists the probabilities of every possible next state, so it sums to 1
  verify:
    expect:
      v: solve(Eq(nsimplify(ka) + nsimplify(kb) + Symbol('m'), 1), Symbol('m'))[0]
- template: sto-matrix-reading
  skill: stoch.chains
  pace: recall
  cases:
  - q: 'In a transition matrix, the entry in row 2, column 3 is the probability of:'
    o1: Moving from state 2 to state 3
    o2: Moving from state 3 to state 2
    o3: Being in state 2 and state 3
    o4: Staying in state 2
  - q: Which must be true of every transition matrix?
    o1: Each row sums to 1
    o2: Each column sums to 1
    o3: The diagonal entries are positive
    o4: It is symmetric
  - q: 'A diagonal entry equal to 1 means that state is:'
    o1: Absorbing
    o2: Transient
    o3: Unreachable
    o4: Periodic
  - q: 'A weather model says tomorrow depends only on today, not on earlier days. This is the:'
    o1: Markov property
    o2: Law of large numbers
    o3: Memoryless property of the exponential
    o4: Detailed balance condition
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Rows are 'from', columns are 'to'. Getting this backwards is the most common mistake with chains
  verify:
    authored: true

- template: sto-exponential-tail
  skill: stoch.poisson
  pace: quick
  given:
    km:
      pick:
      - 10
      - 50
      - 100
    kt:
      pick:
      - 5
      - 20
      - 100
  prompt: A component's lifetime is exponential with mean {{km}} hours. Find the probability that it lasts more than {{kt}} hours.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: exp(-kt/km)
    tol: 0.005
    explain: The rate is 1/mean, and the survival probability is e^(−t/mean)
  verify:
    expect:
      v: 1 - integrate(exp(-Y/km)/km, (Y, 0, kt))

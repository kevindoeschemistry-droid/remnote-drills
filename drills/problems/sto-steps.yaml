  - kn: 2
    kans: 1.5
  - kn: 3
    kans: 1.83333333
  - kn: 4
    kans: 2.08333333
  - kn: 5
    kans: 2.28333333
  prompt: '{{kn}} independent components each fail at rate 1 per year. Find the expected time in years until all have failed.'
  parts:
  - ask: Answer

- template: sto-walk-position
  skill: stoch.walks
  pace: quick
  cases:
  - kn: 4
    kk: 2
  - kn: 4
    kk: 0
  - kn: 6
    kk: 2
  - kn: 5
    kk: 1
  - kn: 6
    kk: 4
  - kn: 8
    kk: 2
  prompt: A simple symmetric random walk starts at 0. Find the probability that it is at {{kk}} after {{kn}} steps.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: combinations(kn, (kn + kk)/2)/2^kn
    tol: 0.005
    explain: The walk needs (n + k)/2 steps up out of n; count the orderings and divide by 2ⁿ
  verify:
    expect:
      v: pm_walk_prob(kn, kk, Rational(1, 2))
- template: sto-walk-position-biased
  skill: stoch.walks
  pace: quick
  cases:
  - kn: 3
    kk: 1
    kp: 0.6
  - kn: 4
    kk: 2
    kp: 0.7
  - kn: 4
    kk: 0
    kp: 0.6
  - kn: 5
    kk: 3
    kp: 0.5
  - kn: 3
    kk: -1
    kp: 0.25
  prompt: A random walk steps +1 with probability {{kp}} and −1 otherwise. Find the probability that it is at {{kk}} after {{kn}} steps.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: combinations(kn, (kn + kk)/2)*kp^((kn + kk)/2)*(1 - kp)^((kn - kk)/2)
    tol: 0.005
    explain: Count the paths with the right number of up-steps and multiply by the probability of any one of them
  verify:
    expect:
      v: pm_walk_prob(kn, kk, kp)
- template: sto-walk-mean
  skill: stoch.walks
  pace: quick
  given:
    kp:
      pick:
      - 0.6
      - 0.7
      - 0.55
      - 0.9
    kn:
      pick:
      - 10
      - 50
      - 100
  prompt: A random walk steps +1 with probability {{kp}} and −1 otherwise. Find its expected position after {{kn}} steps.
  parts:
  - ask: Answer
    label: v
    tex: E[S_n]
    value: kn*(2*kp - 1)
    tol: 0.005
    explain: Each step has mean p − q = 2p − 1, and expectations add
  verify:
    expect:
      v: kn*(nsimplify(kp)*1 + (1 - nsimplify(kp))*(-1))
- template: sto-walk-sd
  skill: stoch.walks
  pace: quick
  given:
    kn:
      pick:
      - 16
      - 100
      - 400
      - 2500
  prompt: A simple symmetric random walk takes {{kn}} steps. Find the standard deviation of its final position.
  parts:
  - ask: Answer
    label: v
    tex: \sigma
    value: sqrt(kn)
    tol: 0.005
    explain: Each step has variance 1 and the steps are independent, so the variance is n and the typical distance from the start is √n
  verify:
    expect:
      v: sqrt(kn*(Rational(1, 2)*1 + Rational(1, 2)*1 - 0))
- template: sto-return-at-2n
  skill: stoch.walks
  pace: quick
  given:
    km:
      pick:
      - 2
      - 4
      - 6
      - 8
      - 10
  prompt: Find the probability that a simple symmetric random walk is back at its starting point after {{km}} steps.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: combinations(km, km/2)/2^km
    tol: 0.005
    explain: 'It must take exactly half its steps up: C(2n, n)/4ⁿ'
  verify:
    expect:
      v: pm_walk_prob(km, 0, Rational(1, 2))
- template: sto-first-return
  skill: stoch.walks
  pace: quick
  given:
    km:
      pick:
      - 2
      - 4
      - 6
      - 8
  prompt: Find the probability that a simple symmetric random walk returns to its starting point for the first time at step {{km}}.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: combinations(km, km/2)/((km - 1)*2^km)
    tol: 0.005
    explain: First-return probability at step 2n is the return probability divided by 2n − 1
  verify:
    expect:
      v: pm_walk_first_return(km/2)

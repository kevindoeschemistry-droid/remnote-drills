- template: sto-first-of-n
  skill: stoch.poisson
  pace: quick
  given:
    kn:
      pick:
      - 2
      - 5
      - 10
    kl:
      pick:
      - 0.1
      - 0.5
      - 2
  prompt: '{{kn}} independent components each fail at rate {{kl}} per year. Find the expected time in years until the first failure.'
  parts:
  - ask: Answer
    label: v
    tex: E[T]
    value: 1/(kn*kl)
    tol: 0.005
    explain: The minimum of n exponentials with rate λ is exponential with rate nλ, so its mean is 1/(nλ)
  verify:
    expect:
      v: integrate(exp(-kn*nsimplify(kl)*Y), (Y, 0, oo))
- template: sto-all-of-n

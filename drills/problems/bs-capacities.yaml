- template: bs-herd-coverage-vaccine
  skill: biosec.epidemiology
  pace: quick
  given:
    r0:
      pick:
      - 2.5
      - 4
      - 12
      - 18
    ve:
      pick:
      - 0.7
      - 0.85
      - 0.95
  prompt: For a pathogen with a reproduction number of {{r0}}, what coverage is needed with a vaccine of {{ve}} efficacy (per cent)?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(1 - 1/r0)/ve
    tol: 0.005
    explain: 'The threshold divided by the efficacy can exceed one hundred per cent, which is the arithmetic statement that herd immunity is unreachable for that pathogen with that vaccine: measles at an R0 of eighteen needs almost everyone, and a seventy per cent vaccine cannot get there'
  verify:
    expect:
      v: 100*(1 - 1/nsimplify(r0))/nsimplify(ve)

- template: bs-screening-ppv
  skill: biosec.epidemiology
  pace: quick
  cases:
  - fp: 1
    tp: 4
    na: 40000
    ni: 8
  - fp: 0.5
    tp: 20
    na: 200000
    ni: 100
  - fp: 2
    tp: 2
    na: 5000
    ni: 10
  - fp: 0.2
    tp: 30
    na: 100000
    ni: 60
  prompt: Screening flags {{fp}} per cent of uninfected travellers and detects {{tp}} infected among {{na}} arrivals. What is the positive predictive value (per cent), if the infected number {{ni}}?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*tp/(tp + fp/100*(na - ni))
    tol: 0.005
    explain: 'With a rare condition even a small false-positive rate buries the true detections, so almost everyone referred is well: that is the cost side of a screening programme, in people detained and tests spent'
  verify:
    expect:
      v: 100*nsimplify(tp)/(nsimplify(tp) + nsimplify(fp)/100*(nsimplify(na) - nsimplify(ni)))

    te:
      pick:
      - 20
      - 45
      - 90
  prompt: A plume will pass in {{tm}} minutes. Sheltering reduces the inhaled dose by {{rf}} per cent; evacuation takes {{te}} minutes of outdoor exposure. By what factor is the sheltered dose smaller?
  parts:
  - ask: Answer
    label: v
    tex: \times
    value: (te/tm)/(1 - rf/100)
    tol: 0.005
    explain: 'Sheltering wins whenever the plume passes faster than people can leave, which is the usual case for a short release: the decision is arithmetic, not instinct'
  verify:
    expect:
      v: (nsimplify(te)/nsimplify(tm))/(1 - Rational(rf, 100))
- template: bs-dose-distance
  skill: biosec.prevent
  pace: quick
  given:
    dr:
      pick:
      - 500
      - 2000
      - 15000
    r1:
      pick:
      - 1
      - 2
      - 5
    r2:
      pick:
      - 10
      - 25
      - 50
  require:
  - r2 > r1
  prompt: A dose rate of {{dr}} microsieverts an hour at {{r1}} m falls to what at {{r2}} m?
  parts:
  - ask: Answer
    label: v
    tex: \mu Sv/h
    value: dr*(r1/r2)^2
    tol: 0.005
    explain: 'Distance is the cheapest protection because the dose rate falls with its square: stepping from one metre to ten cuts it a hundredfold, before any shielding is considered'
  verify:
    expect:
      v: nsimplify(dr)*Rational(r1, r2)**2
- template: bs-shielding-layers
  skill: biosec.prevent
  pace: quick
  given:
    dr:
      pick:
      - 500
      - 2000
      - 15000
    tg:
      pick:
      - 1
      - 10
      - 25
  require:
  - tg < dr
  prompt: How many half-value layers reduce a dose rate from {{dr}} to below {{tg}} microsieverts an hour?
  parts:
  - ask: Answer
    label: v
    tex: layers
    value: ceil(log(dr/tg)/log(2))
    final: true
    tol: 0.0001
    explain: 'Each half-value layer halves the rate, so the count is a logarithm: reducing by a factor of a thousand takes ten layers, which is why shielding is the last resort after distance and time'
  verify:
    expect:
      v: ceiling(log(nsimplify(dr)/nsimplify(tg))/log(2))
- template: bs-activity-decay
  skill: biosec.prevent
  pace: quick
  given:
    a0:
      pick:
      - 200
      - 1500
      - 9000
    hl:
      pick:
      - 6
      - 30
      - 74
    dd:
      pick:
      - 12
      - 90
      - 365
  prompt: An activity of {{a0}} MBq decays with a half-life of {{hl}} days. What remains after {{dd}} days (MBq)?
  parts:
  - ask: Answer
    label: v
    tex: MBq
    value: a0*2^(-dd/hl)
    tol: 0.005
    explain: 'Whether an incident is managed by waiting or by containment follows from the half-life: days means wait, years means cordon'
  verify:
    expect:
      v: nsimplify(a0)*2**(-Rational(dd, hl))
- template: bs-decay-time
  skill: biosec.prevent
  pace: quick
  given:
    a0:
      pick:
      - 200
      - 1500
      - 9000
    al:
      pick:
      - 1
      - 10
      - 40
    hl:
      pick:
      - 6
      - 30
      - 74
  require:
  - al < a0
  prompt: How long until an activity of {{a0}} MBq falls below a release level of {{al}} MBq, with a half-life of {{hl}} days?
  parts:
  - ask: Answer
    label: v
    tex: days
    value: hl*log(a0/al)/log(2)
    tol: 0.005
    explain: Decay-in-storage is a disposal route only when this time is operationally short; the same arithmetic decides how long a contaminated area stays cordoned
  verify:
    expect:
      v: nsimplify(hl)*log(nsimplify(a0)/nsimplify(al))/log(2)
- template: bs-bwc-ii-iii
  skill: biosec.practice
  pace: recall
  cases:
  - q: 'Article II requires States Parties to:'
    o1: Destroy or divert to peaceful purposes the agents and equipment they held
    o2: Declare their stocks annually
    o3: Submit to inspection
    o4: Fund destruction elsewhere
  - q: 'Article III forbids:'
    o1: Transferring the agents to anyone, and assisting anyone to acquire them
    o2: Only transfers to non-Parties
    o3: Only state-to-state transfers
    o4: Defensive research
  - q: 'Export controls and synthesis screening are:'
    o1: Ways a Party meets its Article III obligation
    o2: Voluntary industry practice only
    o3: Required by Article X
    o4: Outside the Convention
  - q: 'A Party assisting a non-state actor to acquire agents breaches:'
    o1: Article III, whether or not it produced them itself
    o2: No article
    o3: Article VII
    o4: Article X only
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The prohibition runs on acquisition and assistance, which is what makes supply-side controls a treaty duty
  verify:
    authored: true
- template: bs-bwc-parties
  skill: biosec.practice
  pace: quick
  given:
    un:
      pick:
      - 193
    bp:
      pick:
      - 189
  prompt: Of {{un}} UN member states, {{bp}} are States Parties to the Convention. What percentage is that, and how many remain outside?
  parts:
  - ask: Answer
    label: v
    tex: states
    value: un - bp
    final: true
    tol: 0.0001
    explain: 'Near-universal adherence is the Convention''s strength and its weakness: almost everyone has signed, and there is no organisation to verify that anyone complies. The figure is as of the Implementation Support Unit''s 2026 background document and needs rechecking as it ages'
  verify:
    expect:
      v: un - bp
- template: bs-bwc-breach
  skill: biosec.practice
  pace: recall
  cases:
  - q: 'Article V provides for:'
    o1: Consultation and cooperation among the Parties on problems arising from the Convention
    o2: Compulsory inspection
    o3: Referral to the International Court of Justice
    o4: Sanctions
  - q: 'Article VI allows a Party to:'
    o1: Lodge a complaint with the Security Council, which may investigate
    o2: Conduct its own inspection
    o3: Expel another Party
    o4: Suspend the Convention
  - q: 'The Convention''s structural weakness, raised at every review conference, is:'
    o1: It has no verification organisation of its own
    o2: It has too few Parties
    o3: It covers too few agents
    o4: It has no entry into force
  - q: 'A Security Council investigation under Article VI can be blocked by:'
    o1: A permanent member's veto, which is why the route has never been used successfully
    o2: A majority of Parties
    o3: The Implementation Support Unit
    o4: The depositary states
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: Two routes exist and both depend on political will rather than on machinery, which is the gap the protocol negotiations tried and failed to close
  verify:
    authored: true
- template: bs-bwc-vii
  skill: biosec.practice
  pace: recall
  cases:
  - q: 'Article VII obliges Parties to:'
    o1: Assist a Party exposed to danger as a result of a violation, if the Security Council so decides
    o2: Retaliate against a violator
    o3: Share all vaccine stockpiles
    o4: Fund the Implementation Support Unit
  - q: 'Article VII is triggered by:'
    o1: A request from an exposed Party and a Security Council decision
    o2: Any outbreak
    o3: A Party's own declaration alone
    o4: A WHO determination
  - q: 'The obligation under Article VII is:'
    o1: To help the victim, not to deter or punish the attacker
    o2: To impose sanctions
    o3: To conduct an investigation
    o4: To destroy stocks
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The assistance article is the Convention's only response mechanism, and it depends on the same Security Council as Article VI
  verify:
    authored: true
- template: bs-assistance-shortfall
  skill: biosec.practice
  pace: quick
  given:
    nd:
      pick:
      - 50000
      - 400000
      - 2000000
    np:
      pick:
      - 12000
      - 150000
      - 900000
    wk:
      pick:
      - 2
      - 6
      - 12
  require:
  - np < nd
  prompt: An exposed Party needs {{nd}} treatment courses. Parties pledge {{np}} courses within {{wk}} weeks. What percentage of the need is pledged, and how many courses are short?
  parts:
  - ask: Answer
    label: v
    tex: courses
    value: nd - np
    final: true
    tol: 0.0001
    explain: 'An obligation to assist is not a stockpile: what arrives depends on what exists, which is the argument for building medical countermeasure capacity before it is requested'
  verify:
    expect:
      v: nd - np
- template: bs-bwc-x
  skill: biosec.practice
  pace: recall
  cases:
  - q: 'Article X protects the right to:'
    o1: Exchange equipment, materials and information for peaceful purposes, and to participate in that exchange
    o2: Retain agents for defensive purposes
    o3: Withhold information on national security grounds
    o4: Conduct inspections
  - q: 'The tension between Articles III and X is that:'
    o1: Every control under III restricts an exchange X protects, so each has to be justified
    o2: They cover different agents
    o3: X applies only to non-Parties
    o4: III was superseded
  - q: 'A screening requirement on synthesis orders is defensible under this tension because:'
    o1: It is a narrow measure aimed at acquisition, leaving legitimate exchange intact
    o2: Article X does not apply to industry
    o3: It is voluntary
    o4: Article III overrides Article X
  - q: 'A broad export ban on common laboratory equipment is hard to defend because:'
    o1: It restricts exchange Article X protects without closing a real acquisition route
    o2: Article III forbids it
    o3: It is too expensive
    o4: It needs Security Council approval
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: *id001
    correct: '0'
    explain: The Convention's bargain is non-proliferation without blocking public-health and industrial biology, so a control is argued on how narrowly it is aimed
  verify:
    authored: true
- template: bs-spillover-sampling
  skill: biosec.prevent
  pace: quick
  given:
    ns:
      pick:
      - 20
      - 60
      - 200
    pv:
      pick:
      - 0.5
      - 2
      - 5
  prompt: Sampling {{ns}} animals in a population where {{pv}} per cent carry the virus, what is the chance of finding at least one positive (per cent)?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(1 - (1 - pv/100)^ns)
    tol: 0.005
    explain: Surveillance sample sizes follow from the prevalence you must be able to rule out, which is why a programme that samples a few dozen animals in a large reservoir can miss a circulating virus entirely
  verify:
    expect:
      v: 100*(1 - (1 - nsimplify(pv)/100)**ns)
- template: bs-lab-capacity
  skill: biosec.prevent
  pace: quick
  given:
    nr:
      pick:
      - 2
      - 4
      - 8
    cp:
      pick:
      - 94
      - 188
      - 384
    ut:
      pick:
      - 20
      - 50
      - 75
  prompt: A reference laboratory runs {{nr}} runs a day of {{cp}} samples with {{ut}} per cent capacity usable for surveillance. How many surveillance samples a week?
  parts:
  - ask: Answer
    label: v
    tex: samples/week
    value: nr*cp*ut/100*7
    tol: 0.005
    explain: 'Surveillance competes with diagnostic work for the same instruments, so the usable fraction is what sets the real capacity: a laboratory at full diagnostic load has no surveillance capacity whatever its instrument count'
  verify:
    expect:
      v: nsimplify(nr)*nsimplify(cp)*Rational(ut, 100)*7
- template: bs-eoc-activation
  skill: biosec.practice
  pace: quick
  given:
    hr:
      pick:
      - 12
      - 24
    sh:
      pick:
      - 8
      - 12
    pp:
      pick:
      - 4
      - 8
      - 15
    rl:
      pick:
      - 1.5
      - 2
  prompt: An operations centre must be staffed {{hr}} hours a day in {{sh}}-hour shifts with {{pp}} people a shift. How many staff are needed, allowing {{rl}} rotations for rest?
  parts:
  - ask: Answer
    label: v
    tex: staff
    value: hr/sh*pp*rl
    tol: 0.005
    explain: Round-the-clock operation needs two to three times the people on duty at any moment, which is the number that decides whether a centre can be sustained for weeks rather than days
  verify:
    expect:
      v: Rational(hr, sh)*nsimplify(pp)*nsimplify(rl)
- template: bs-comms-reach
  skill: biosec.practice
  pace: quick
  given:
    r1:
      pick:
      - 30
      - 55
      - 70
    r2:
      pick:
      - 20
      - 40
      - 60
  prompt: A message reaches {{r1}} per cent of the population through one channel and {{r2}} per cent through another, with the audiences independent. What combined reach does that give (per cent)?
  parts:
  - ask: Answer
    label: v
    tex: \%
    value: 100*(1 - (1 - r1/100)*(1 - r2/100))
    tol: 0.005
    explain: 'Adding channels raises reach with diminishing returns, and the people a second channel adds are usually the ones the first never reached: the hard part of reach is the last fifth, not the first half'
  verify:
    expect:
      v: 100*(1 - (1 - Rational(r1, 100))*(1 - Rational(r2, 100)))
- template: bs-review-conference
  skill: biosec.practice
  pace: quick
  given:
    iv:
      pick:
      - 5
    yr:
      pick:
      - 30
      - 40
      - 50
  prompt: Review conferences are held about every {{iv}} years. How many have there been in the {{yr}} years since the Convention entered into force?
  parts:
  - ask: Answer
    label: v
    tex: conferences
    value: floor(yr/iv)
    final: true
    tol: 0.0001
    explain: 'The review conference is the Convention''s only regular machinery, and the verification gap has been on its agenda at every one: an institution that meets twice a decade is the whole of the treaty''s standing capacity'
  verify:
    expect:
      v: floor(Rational(yr, iv))
- template: bs-screening-coverage
  skill: biosec.practice
  pace: quick
  given:
    cv:
      pick:
      - 40
      - 65
      - 80
    'no':
      pick:
      - 10000
      - 250000
  prompt: Synthesis screening covers {{cv}} per cent of global commercial capacity. Of {{no}} orders, how many go unscreened?
  parts:
  - ask: Answer
    label: v
    tex: orders
    value: no*(100 - cv)/100
    final: true
    tol: 0.0001
    explain: 'Voluntary screening leaves a gap proportional to the uncovered capacity, which is the argument for making it a condition of funding or of market access rather than a norm: a measure narrow enough to satisfy Article X still has to cover enough to matter'
  verify:
    expect:
      v: Rational(no*(100 - cv), 100)

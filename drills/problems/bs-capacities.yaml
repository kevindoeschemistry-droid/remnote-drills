    ex:
      pick:
      - 50
      - 200
      - 800
  require:
  - gy > ex*at/100
  prompt: A programme graduates {{gy}} field epidemiologists a year against a shortfall of {{sf}}, losing {{at}} per cent a year to attrition from the existing {{ex}}. How many years to close the gap?
  parts:
  - ask: Answer
    label: v
    tex: years
    value: sf/(gy - ex*at/100)
    tol: 0.005
    explain: 'Attrition eats most of a small programme''s output, so the years to close a gap are far longer than the shortfall over the intake: that arithmetic is the argument for training at scale rather than steadily'
  verify:
    expect:
      v: nsimplify(sf)/(nsimplify(gy) - nsimplify(ex)*Rational(at, 100))

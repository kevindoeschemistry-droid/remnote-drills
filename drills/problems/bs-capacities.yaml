- template: bs-legal-financing
  skill: biosec.landscape
  pace: recall
  cases:
  - q: 'The legal-instruments capacity is assessed before an emergency because:'
    o1: Laws that do not yet exist cannot be used in the emergency that needs them
    o2: Lawyers are unavailable in emergencies
    o3: It is a formality
    o4: Only new laws count
  - q: 'A financing capacity that passes assessment must show:'
    o1: A route that releases money fast enough to fund a response as it starts
    o2: A large annual health budget
    o3: An insurance policy
    o4: Donor pledges
  - q: 'A country with excellent laboratories but no emergency legal authority will:'
    o1: Detect an event and be unable to act on it
    o2: Be unaffected
    o3: Act faster
    o4: Have no detection capacity
  - q: 'Relying on an emergency supplementary budget alone is weak because:'
    o1: The money arrives after the decisions that needed it
    o2: Supplementary budgets are illegal
    o3: It is too large
    o4: It cannot be audited
  prompt: '{{q}}'
  parts:
  - ask: Answer
    label: v
    choice: &id001
    - '{{o1}}'
    - '{{o2}}'
    - '{{o3}}'
    - '{{o4}}'
    correct: '0'
    explain: Both capacities are invisible until the emergency, which is exactly why they are assessed in advance
  verify:
    authored: true
- template: bs-fund-delay
  skill: biosec.landscape
  pace: quick
  given:
    sp:
      pick:
      - 2
      - 8
      - 25
    d1:
      pick:
      - 2
      - 5
      - 7
    d2:
      pick:
      - 30
      - 60
      - 90
  require:
  - d2 > d1
  prompt: A response needs {{sp}} million dollars a week. A contingency fund releases in {{d1}} days and a supplementary budget in {{d2}} days. How much more response is funded by the faster route (million dollars)?
  parts:
  - ask: Answer
    label: v
    tex: million dollars
    value: sp*(d2 - d1)/7
    tol: 0.005
    explain: 'The gap between the two release times, priced at the burn rate, is what a standing contingency fund buys: the same total money arriving sooner is a different capacity'
  verify:
    expect:
      v: nsimplify(sp)*(nsimplify(d2) - nsimplify(d1))/7

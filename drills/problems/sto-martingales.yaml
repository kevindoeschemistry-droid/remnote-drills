# Second question types; keys recomputed by sympy along another route.

- template: sto-conditional-expectation
  skill: stoch.martingales
  pace: quick
  given:
    kk:
      pick:
      - 2
      - 3
      - 4
      - 6
  prompt: Two fair dice are rolled and the first shows {{kk}}. Given that, find the expected value of the product of the two dice.
  parts:
  - ask: Answer
    label: v
    tex: E[XY|X]
    value: kk*3.5
    tol: 0.005
    explain: Conditioning fixes the first die; the second is independent with mean 3.5, so the product has conditional mean k × 3.5 (and the total k + 3.5)
  verify:
    expect:
      v: kk*Rational(1 + 2 + 3 + 4 + 5 + 6, 6)
- template: sto-is-martingale
  skill: stoch.martingales
  pace: recall
  cases:
  - pr: S_n
    kc: 0
  - pr: S_n²
    kc: 1
  - pr: S_n² − n
    kc: 0
  - pr: S_n + n
    kc: 1
  - pr: S_n³ − 3nS_n
    kc: 0
  - pr: '|S_n|'
    kc: 1
  - pr: 2^(S_n)
    kc: 1
  - pr: (−1)ⁿ S_n
    kc: 1
  prompt: S_n is a simple symmetric random walk started at 0. Is {{pr}} a martingale?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'Yes'
    - 'No'
    correct: kc
    explain: 'Average the two possible next values and compare with the current one: (s + 1)² and (s − 1)² average to s² + 1, so S_n² drifts up by 1 each step and S_n² − n is the fair version. A convex function of a martingale is a submartingale'
  verify:
    authored: true
- template: sto-exit-probability
  skill: stoch.martingales
  pace: quick
  given:
    ka:
      pick:
      - 1
      - 2
      - 3
      - 5
    kb:
      pick:
      - 2
      - 4
      - 7
  prompt: A simple symmetric random walk starts at 0. Find the probability that it reaches +{{kb}} before −{{ka}}.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: ka/(ka + kb)
    tol: 0.005
    explain: 'Optional stopping on S_n: 0 = E[S_T] = b·p − a·(1 − p), so p = a/(a + b). The nearer barrier is the likelier one'
  verify:
    expect:
      v: pm_ruin_win(Rational(1, 2), ka, ka + kb)
- template: sto-exit-time
  skill: stoch.martingales
  pace: quick
  given:
    ka:
      pick:
      - 1
      - 2
      - 3
      - 5
    kb:
      pick:
      - 2
      - 4
      - 7
  prompt: A simple symmetric random walk starts at 0 and stops when it first reaches +{{kb}} or −{{ka}}. Find the expected number of steps.
  parts:
  - ask: Answer
    label: v
    tex: E[T]
    value: ka*kb
    final: true
    tol: 0.0001
    explain: 'Optional stopping on S_n² − n: E[T] = E[S_T²] = b² · a/(a + b) + a² · b/(a + b) = ab'
  verify:
    expect:
      v: pm_ruin_time(ka, ka + kb)
- template: sto-risk-neutral-q
  skill: stoch.martingales
  pace: quick
  cases:
  - su: 120
    sd: 80
    kr: 0.05
  - su: 110
    sd: 95
    kr: 0.02
  - su: 130
    sd: 90
    kr: 0.1
  - su: 125
    sd: 80
    kr: 0
  - su: 115
    sd: 85
    kr: 0.04
  prompt: A stock moves from 100 to {{su}} or {{sd}} over one period, and the bank pays interest {{kr}} per period. Find the risk-neutral probability of the up move.
  parts:
  - ask: Answer
    label: v
    tex: q
    value: (100*(1 + kr) - sd)/(su - sd)
    tol: 0.005
    explain: 'Under q the stock must earn the bank rate on average: q·uS + (1 − q)·dS = (1 + r)S'
  verify:
    expect:
      v: solve(Eq(Symbol('m')*su + (1 - Symbol('m'))*sd, 100*(1 + nsimplify(kr))), Symbol('m'))[0]
- template: sto-binomial-call
  skill: stoch.martingales
  pace: quick
  cases:
  - su: 120
    sd: 80
    kr: 0.05
    kx: 100
    pu: 20
  - su: 110
    sd: 95
    kr: 0.02
    kx: 100
    pu: 10
  - su: 130
    sd: 90
    kr: 0.1
    kx: 110
    pu: 20
  - su: 125
    sd: 80
    kr: 0
    kx: 105
    pu: 20
  - su: 115
    sd: 85
    kr: 0.04
    kx: 100
    pu: 15
  prompt: A stock moves from 100 to {{su}} or {{sd}} over one period; the bank pays {{kr}} per period. Find the price of a call option with strike {{kx}} (it pays {{pu}} after an up move and nothing after a down move).
  parts:
  - ask: Answer
    label: v
    tex: price
    value: ((100*(1 + kr) - sd)/(su - sd))*pu/(1 + kr)
    tol: 0.005
    explain: Price = discounted risk-neutral expectation, q × payoff/(1 + r). The same number is the cost of the stock-plus-borrowing portfolio that reproduces the payoff in both outcomes, which is why the real-world probability never appears
  verify:
    expect:
      v: pm_replicate_price(100, Rational(su, 100), Rational(sd, 100), kr, pu, 0)
- template: sto-brownian-variance
  skill: stoch.martingales
  pace: quick
  cases:
  - ks: 1
    kt: 3
  - ks: 2
    kt: 5
  - ks: 4
    kt: 9
  - ks: 3
    kt: 3
  - ks: 1
    kt: 10
  prompt: B is a standard Brownian motion. Find the variance of B_{{ks}} + B_{{kt}}.
  parts:
  - ask: Answer
    label: v
    tex: \mathrm{Var}
    value: ks + kt + 2*min(ks, kt)
    final: true
    tol: 0.0001
    explain: 'Var(X + Y) = Var X + Var Y + 2 Cov(X, Y), with Var B_t = t and Cov(B_s, B_t) = min(s, t): the two share the path up to the earlier time'
  verify:
    expect:
      v: ks + kt + 2*Min(ks, kt)
- template: sto-reflection
  skill: stoch.martingales
  pace: quick
  cases:
  - ka: 1
    kt: 1
  - ka: 1
    kt: 4
  - ka: 2
    kt: 4
  - ka: 3
    kt: 9
  - ka: 2
    kt: 1
  prompt: B is a standard Brownian motion. Find the probability that it reaches the level {{ka}} at some time up to t = {{kt}}.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: 1 - erf(ka/sqrt(2*kt))
    tol: 0.01
    explain: 'Reflection principle: paths that reach a are equally likely to end above or below it, so P(max ≥ a) = 2 P(B_t ≥ a) = 2(1 − Φ(a/√t))'
  verify:
    expect:
      v: 2*(1 - (1 + erf(ka/sqrt(2*kt)))/2)

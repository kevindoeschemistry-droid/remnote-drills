- template: st-exponential-survival
  skill: stats.distributions
  pace: quick
  given:
    m:
      pick:
      - 2
      - 5
      - 10
    t:
      pick:
      - 1
      - 2
      - 5
      - 10
  prompt: A component's life is exponential with mean {{m}} years. What is the probability it lasts more than {{t}} years?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: exp(-t/m)
    tol: 0.005
    explain: '$\lambda = 1/{{m}}$ and $P(X > t) = e^{-t/m}$. Memoryless: a used component that still works is as good as new'

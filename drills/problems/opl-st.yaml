- template: st-adjusted-r2
  skill: stats.bivariate
  pace: quick
  given:
    k:
      int:
      - 2
      - 6
    n:
      pick:
      - 20
      - 30
      - 50
    r2:
      pick:
      - 0.6
      - 0.75
      - 0.9
  prompt: A model with {{k}} predictors on {{n}} observations has $R^2 = {{r2}}$. Find the adjusted $R^2$.
  parts:
  - ask: Answer
    label: v
    tex: R^2_{adj}
    value: 1 - (1 - r2)*(n - 1)/(n - k - 1)
    tol: 0.005
    explain: Adjusted $R^2$ charges for each predictor; it can fall when a useless variable is added
  verify:
    expect:
      v: 1 - (1 - nsimplify(r2))*(n - 1)/(n - k - 1)
- template: st-aic
  skill: stats.bivariate
  pace: quick
  given:
    k:
      int:

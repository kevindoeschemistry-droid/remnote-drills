    c:
      pick:
      - 50
      - 90
      - 150
  prompt: In a contingency table with $N = {{N}}$, row $i$ totals {{r}} and column $j$ totals {{c}}. Under the independence loglinear model, what is the expected count in cell $(i, j)$?
  parts:
  - ask: Answer
    label: v
    tex: \mu
    value: r*c/N
    tol: 0.005
    explain: $\log\mu_{ij} = \lambda + \lambda_i^R + \lambda_j^C$ with no interaction term, which is independence; the fitted counts are the familiar row × column / total

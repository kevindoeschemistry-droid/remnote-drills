- template: st-relative-efficiency
  skill: stats.inference
  pace: recall
  cases:
  - t: sign test
    are: 0.6366197723675814
  - t: Wilcoxon signed-rank test
    are: 0.954929658551372
  prompt: On normal data, roughly how many observations does the {{t}} need to match a $t$ test on 100? (Use the asymptotic relative efficiency.)
  parts:
  - ask: Answer
    label: v
    tex: n
    value: 100/are
    tol: 0.01
    explain: ARE is the ratio of sample sizes for equal power. The Wilcoxon loses almost nothing on normal data and can win heavily on heavy-tailed data
  verify:
    expect:
      v: 100/are
- template: st-conjugate-prior
  skill: stats.probability
  pace: recall
  cases:
  - q: a binomial success probability
    ans: 0
  - q: a Poisson rate
    ans: 1
  - q: a normal mean with known variance
    ans: 2
  - q: an exponential rate
    ans: 1
  prompt: Which prior is conjugate for {{q}}?
  parts:
  - ask: Answer
    label: v
    choice:
    - Beta
    - Gamma
    - Normal
    correct: ans
    explain: A conjugate prior gives a posterior of the same family, so updating is arithmetic on its parameters
  verify:
    authored: true
- template: st-improper-prior
  skill: stats.probability
  pace: quick
  given:
    s:
      int:
      - 2
      - 8
    n:
      int:
      - 10
      - 20
  prompt: With the improper prior $\pi(p) \propto 1/(p(1 - p))$ and {{s}} successes in {{n}} trials, what is the posterior mean of $p$?
  parts:
  - ask: Answer
    label: v
    tex: E[p\mid x]
    value: s/n
    tol: 0.005
    explain: The posterior is Beta$(s, n - s)$, proper once there is at least one success and one failure; its mean is the sample proportion
  verify:
    expect:
      v: integrate(x**s*(1 - x)**(n - s - 1), (x, 0, 1))/integrate(x**(s - 1)*(1 - x)**(n - s - 1), (x, 0, 1))
- template: st-beta-posterior
  skill: stats.probability
  pace: quick
  given:
    a:
      int:
      - 1
      - 5
    b:
      int:
      - 1
      - 5
    s:
      int:
      - 0
      - 8
    n:
      int:
      - 8
      - 15
  require:
  - s <= n
  prompt: Prior $p \sim \text{Beta}({{a}}, {{b}})$; then {{s}} successes in {{n}} trials. What is the posterior mean?
  parts:
  - ask: Answer
    label: v
    tex: E[p\mid x]
    value: (a + s)/(a + b + n)
    tol: 0.005
    explain: Add successes to $a$ and failures to $b$. The posterior mean sits between the prior mean $a/(a + b)$ and the data $s/n$, pulled toward the data as $n$ grows
  verify:
    expect:
      v: integrate(x**(a + s)*(1 - x)**(b + n - s - 1), (x, 0, 1))/integrate(x**(a + s - 1)*(1 - x)**(b + n - s - 1), (x, 0, 1))
- template: st-normal-posterior
  skill: stats.probability
  pace: quick
  given:
    m0:
      int:
      - 40
      - 60
    t:
      pick:
      - 2
      - 5
      - 10
    n:
      pick:
      - 4
      - 9
      - 25
    xb:
      int:
      - 45
      - 70
    s:
      pick:
      - 5
      - 10
  prompt: 'Prior $\mu \sim N({{m0}}, {{t}}^2)$; data: {{n}} observations with mean {{xb}} and known $\sigma = {{s}}$. What is the posterior mean of $\mu$?'
  parts:
  - ask: Answer
    label: v
    tex: \mu_{post}
    value: (m0/t^2 + n*xb/s^2)/(1/t^2 + n/s^2)
    tol: 0.005
    explain: Weight each source by its precision. A 95% credible interval is the posterior mean ± 1.96 posterior SDs, and it really is a probability statement about μ
  verify:
    expect:
      v: solve(Eq(x*(1/Integer(t)**2 + n/Integer(s)**2), m0/Integer(t)**2 + n*xb/Integer(s)**2), x)[0]
- template: st-bayes-factor
  skill: stats.probability
  pace: quick
  given:
    p:
      pick:
      - 0.1
      - 0.2
      - 0.5
    B:
      pick:
      - 3
      - 10
      - 20
  prompt: Before the data, $P(H_1) = {{p}}$. The data give a Bayes factor of {{B}} for $H_1$ over $H_0$. What is $P(H_1 \mid \text{data})$?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: p/(1 - p)*B/(1 + p/(1 - p)*B)
    tol: 0.005
    explain: Turn the prior into odds, multiply by the Bayes factor, turn back into a probability. A Bayes factor of 10 is strong evidence but cannot rescue a very unlikely hypothesis
  verify:
    expect:
      v: solve(Eq(x/(1 - x), nsimplify(p)/(1 - nsimplify(p))*B), x)[0]
- template: st-variance-bias
  skill: stats.expected-value
  pace: quick
  given:
    n:
      int:
      - 4
      - 20
    v:
      pick:
      - 4
      - 9
      - 16
      - 25
  prompt: With $n = {{n}}$ and true variance {{v}}, what is the bias of $\frac1n\sum (x_i - \bar x)^2$ as an estimator of $\sigma^2$?
  parts:
  - ask: Answer
    label: r
    tex: b
    value: -v/n
    tol: 0.005
    explain: $E\left[\frac1n\sum(x_i - \bar x)^2\right] = \frac{n - 1}{n}\sigma^2$, which is why $s^2$ divides by $n - 1$
  verify:
    expect:
      r: (n - 1)*Rational(v, n) - v
- template: st-mse
  skill: stats.expected-value
  pace: quick
  given:
    c:
      int:
      - 1
      - 5
    v:
      int:
      - 2
      - 10
    n:
      pick:
      - 5
      - 10
      - 20
  prompt: An estimator has $E[\hat\theta] = \theta + {{c}}/n$ and $\operatorname{Var}\hat\theta = {{v}}/n$. Find its MSE at $n = {{n}}$.
  parts:
  - ask: Answer
    label: r
    tex: MSE
    value: (c/n)^2 + v/n
    tol: 0.005
    explain: Both the bias and the variance shrink to 0 as $n$ grows, so the estimator is consistent even though it is biased
  verify:
    expect:
      r: (Rational(c, n))**2 + Rational(v, n)
- template: st-sufficient
  skill: stats.expected-value
  pace: recall
  cases:
  - q: a Poisson(λ)
    ans: 0
  - q: a Bernoulli(p)
    ans: 0
  - q: a uniform on [0, θ]
    ans: 1
  - q: an exponential(λ)
    ans: 0
  prompt: For an i.i.d. sample from {{q}}, which statistic is sufficient for the parameter?
  parts:
  - ask: Answer
    label: v
    choice:
    - The sum of the observations
    - The largest observation
    - The sample median
    correct: ans
    explain: Write the likelihood and see what it depends on. For the uniform on [0, θ] it is $\theta^{-n}$ when $\theta \ge \max x_i$, so only the maximum matters
  verify:
    authored: true
- template: st-mle-exponential
  skill: stats.expected-value
  pace: quick
  given:
    n:
      int:
      - 5
      - 20
    S:
      pick:
      - 100
      - 250
      - 500
  prompt: '{{n}} lifetimes from an exponential distribution sum to {{S}} h. What is the MLE of the rate $\lambda$, per hour?'
  parts:
  - ask: Answer
    label: v
    tex: \hat\lambda
    value: n/S
    tol: 0.005
    explain: $\ell(\lambda) = n\ln\lambda - \lambda\sum x_i$; $\ell' = 0$ gives $\hat\lambda = n/\sum x_i = 1/\bar x$
  verify:
    expect:
      v: solve(diff(n*log(x) - x*S, x), x)[0]
- template: st-moving-average
  skill: stats.descriptive
  pace: quick
  given:
    a:
      int:
      - 10
      - 30
    b:
      int:
      - 10
      - 30
    c:
      int:
      - 10
      - 30
  prompt: A series reads {{a}}, {{b}}, {{c}} at times 4, 5, 6. What is the centred 3-point moving average at time 5?
  parts:
  - ask: Answer
    label: v
    tex: m_5
    value: (a + b + c)/3
    tol: 0.005
    explain: Averaging over a window removes short wiggles; a window equal to the season length removes the seasonal pattern
  verify:
    expect:
      v: Rational(a + b + c, 3)
- template: st-ar1-acf
  skill: stats.descriptive
  pace: quick
  given:
    phi:
      pick:
      - -0.5
      - 0.3
      - 0.6
      - 0.8
    k:
      int:
      - 1
      - 4
  prompt: A stationary AR(1) process $y_t = {{phi}}y_{t-1} + e_t$. What is its lag-{{k}} autocorrelation?
  parts:
  - ask: Answer
    label: v
    tex: \rho_k
    value: phi^k
    tol: 0.005
    explain: Each step multiplies the memory by φ, so correlation decays geometrically. A slowly decaying ACF hints at non-stationarity
  verify:
    expect:
      v: nsimplify(phi)**k
- template: st-runs-variance
  skill: stats.descriptive
  pace: quick
  given:
    n1:
      int:
      - 6
      - 15
    n2:
      int:
      - 6
      - 15
  prompt: Values above and below the median form a sequence with {{n1}} above and {{n2}} below. What is the variance of the number of runs?
  parts:
  - ask: Answer
    label: v
    tex: \operatorname{Var}R
    value: 2*n1*n2*(2*n1*n2 - n1 - n2)/((n1 + n2)^2*(n1 + n2 - 1))
    tol: 0.005
    explain: Divide (runs − mean) by the square root of this for a z statistic; trends make too few runs
  verify:
    expect:
      v: Rational(2*n1*n2*(2*n1*n2 - n1 - n2), (n1 + n2)**2*(n1 + n2 - 1))
- template: st-seasonal-index
  skill: stats.descriptive
  pace: quick
  given:
    q1:
      int:
      - 80
      - 120
    q2:
      int:
      - 90
      - 140
    q3:
      int:
      - 100
      - 160
    q4:
      int:
      - 70
      - 130
    j:
      int:
      - 1
      - 4
  prompt: Quarterly sales average {{q1}}, {{q2}}, {{q3}} and {{q4}}. What is the seasonal index for Q{{j}}?
  parts:
  - ask: Answer
    label: v
    tex: S_j
    value: 'j == 1 ? q1/((q1 + q2 + q3 + q4)/4) : (j == 2 ? q2/((q1 + q2 + q3 + q4)/4) : (j == 3 ? q3/((q1 + q2 + q3 + q4)/4) : q4/((q1 + q2 + q3 + q4)/4)))'
    tol: 0.005
    explain: An index of 1.2 means that quarter runs 20% above average; deseasonalise by dividing by it
  verify:
    expect:
      v: Matrix([q1, q2, q3, q4])[j - 1]*4/(q1 + q2 + q3 + q4)
- template: st-ar1-variance
  skill: stats.descriptive
  pace: quick
  given:
    phi:
      pick:
      - -0.5
      - 0.3
      - 0.6
      - 0.8
    v:
      pick:
      - 1
      - 2
      - 4
  prompt: $y_t = {{phi}}y_{t-1} + e_t$ with white noise of variance {{v}}. What is the stationary variance of $y_t$?
  parts:
  - ask: Answer
    label: r
    tex: \gamma_0
    value: v/(1 - phi^2)
    tol: 0.005
    explain: 'Write $y_t = \sum \phi^ke_{t-k}$ and add the variances: a geometric series in $\phi^2$. It blows up as $|\phi| \to 1$'
  verify:
    expect:
      r: v*summation(nsimplify(phi)**(2*Symbol('k')), (Symbol('k'), 0, oo))
- template: st-exp-smoothing
  skill: stats.descriptive
  pace: quick
  given:
    a:
      pick:
      - 0.1
      - 0.2
      - 0.3
      - 0.5
    F:
      int:
      - 80
      - 120
    y:
      int:
      - 70
      - 130
  require:
  - y != F
  prompt: With $\alpha = {{a}}$, last forecast {{F}} and actual value {{y}}, what is the next forecast?
  parts:
  - ask: Answer
    label: v
    tex: F_{t+1}
    value: a*y + (1 - a)*F
    tol: 0.005
    explain: 'The forecast moves a fraction α of the way toward the latest value: large α reacts fast, small α smooths more'
  verify:
    expect:
      v: F + nsimplify(a)*(y - F)
- template: st-periodogram
  skill: stats.descriptive
  pace: recall
  given:
    N:
      pick:
      - 120
      - 240
      - 360
    k:
      pick:
      - 10
      - 20
      - 30
      - 40
  prompt: A periodogram of {{N}} monthly values peaks at frequency index $k = {{k}}$. What period does that cycle have, in months?
  parts:
  - ask: Answer
    label: v
    tex: T
    value: N/k
    tol: 0.005
    explain: Frequency $k$ means $k$ full cycles across the record, so each lasts $N/k$ samples. Monthly data with a peak at $N/12$ cycles is the annual season
  verify:
    expect:
      v: solve(Eq(x*k, N), x)[0]

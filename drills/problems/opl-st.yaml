  prompt: '$H_0: \sigma^2 = {{v0}}$. A sample of {{n}} has $s^2 = {{v}}$. Find the test statistic.'
  parts:
  - ask: Answer
    label: r
    tex: \chi^2
    value: (n - 1)*v/v0
    tol: 0.005
    explain: Under $H_0$ and normal data, $(n - 1)s^2/\sigma_0^2$ is chi-square with $n - 1$ df. This test is very sensitive to non-normality
  verify:
    expect:
      r: (n - 1)*nsimplify(v)/v0
- template: st-fisher-table
  skill: stats.inference
  pace: quick
  given:
    r1:
      pick:
      - 5
      - 6
      - 8
    r2:
      pick:
      - 5
      - 7
      - 9
    c1:
      pick:
      - 5
      - 6
      - 7
    a:
      int:
      - 1
      - 4
  require:
  - c1 - a <= r2
  - a <= r1
  prompt: A 2 × 2 table has row totals {{r1}} and {{r2}} and first-column total {{c1}}. With the margins fixed, what is the probability that the top-left cell is {{a}}?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: combinations(r1, a)*combinations(r2, c1 - a)/combinations(r1 + r2, c1)
    tol: 0.005
    explain: Fisher's test treats the margins as fixed; the cell count is then hypergeometric. The p-value adds the probabilities of tables as extreme or more
  verify:
    expect:
      v: binomial(r1, a)*binomial(r2, c1 - a)/binomial(r1 + r2, c1)

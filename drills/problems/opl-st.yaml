      int:
      - 48
      - 63
    s:
      pick:
      - 5
      - 8
      - 10
  require:
  - xb != m0
  prompt: '$H_0: \mu = {{m0}}$. A sample of {{n}} gives $\bar x = {{xb}}$; $\sigma = {{s}}$ is known. Find $z$.'
  parts:
  - ask: Answer
    label: v
    tex: z
    value: (xb - m0)/(s/sqrt(n))
    tol: 0.005
    explain: Standardise the sample mean with its own standard error $\sigma/\sqrt n$
  verify:
    expect:
      v: (xb - m0)*sqrt(n)/s
- template: st-two-prop-z
  skill: stats.inference
  pace: quick
  given:
    x1:
      int:
      - 30
      - 60
    n1:
      pick:
      - 100
      - 120
    x2:
      int:
      - 20
      - 50
    n2:
      pick:
      - 100
      - 150
  require:
  - x1*n2 != x2*n1
  prompt: 'Test $p_1 = p_2$: group 1 has {{x1}} of {{n1}}, group 2 has {{x2}} of {{n2}}. Find $z$ (pooled).'
  parts:
  - ask: Answer
    label: v
    tex: z
    value: (x1/n1 - x2/n2)/sqrt(((x1 + x2)/(n1 + n2))*(1 - (x1 + x2)/(n1 + n2))*(1/n1 + 1/n2))
    tol: 0.005
    explain: Under $H_0$ the two groups share one $p$, so estimate it from both together. (The interval does not pool; the test does)
  verify:
    expect:
      v: (Rational(x1, n1) - Rational(x2, n2))/sqrt(Rational(x1 + x2, n1 + n2)*(1 - Rational(x1 + x2, n1 + n2))*(Rational(1, n1) + Rational(1, n2)))

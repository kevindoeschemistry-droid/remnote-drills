- template: st-anova-f
  skill: stats.inference
  pace: quick
  given:
    n:
      pick:
      - 5
      - 8
      - 10
    a:
      int:
      - 10
      - 14
    b:
      int:
      - 12
      - 16
    c:
      int:
      - 14
      - 19
    w:
      pick:
      - 4
      - 6.5
      - 9
  require:
  - a != c
  prompt: Three groups of {{n}} have means {{a}}, {{b}}, {{c}}, and the pooled within-group variance is {{w}}. Find $F$.
  parts:
  - ask: Answer
    label: v
    tex: F
    value: (n*((a - (a + b + c)/3)^2 + (b - (a + b + c)/3)^2 + (c - (a + b + c)/3)^2)/2)/w
    tol: 0.005
    explain: SS between $= n\sum(\bar x_i - \bar x)^2$ with $k - 1 = 2$ df; MS within is the pooled variance. A large F means the means differ more than the noise inside groups explains
  verify:
    expect:
      v: (n*(Matrix([a, b, c]) - Matrix([1, 1, 1])*(a + b + c)/3).dot(Matrix([a, b, c]) - Matrix([1, 1, 1])*(a + b + c)/3)/2)/nsimplify(w)
- template: st-twoway-df
  skill: stats.inference
  pace: recall
  given:
    a:
      int:
      - 2
      - 4
    b:
      int:
      - 2
      - 5
    n:
      int:
      - 2
      - 4
  cases:
  - what: interaction
    k: 0
  - what: error term
    k: 1
  prompt: A two-way ANOVA has factor A at {{a}} levels, factor B at {{b}} levels and {{n}} replicates per cell. How many degrees of freedom does the {{what}} have?
  parts:
  - ask: Answer
    label: v
    tex: df
    value: 'k == 0 ? (a - 1)*(b - 1) : a*b*(n - 1)'
    tol: 0.005
    explain: Total $abn - 1$ splits into $A$, $B$, $A\times B$ and error. Without replication there is no error term left to test the interaction
  verify:
    expect:
      v: (a - 1)*(b - 1) if k == 0 else a*b*n - 1 - (a - 1) - (b - 1) - (a - 1)*(b - 1)

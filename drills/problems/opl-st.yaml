    r2:
      pick:
      - 0.3
      - 0.5
      - 0.7
  prompt: A regression with {{k}} predictors on {{n}} observations has $R^2 = {{r2}}$. Find the overall $F$.
  parts:
  - ask: Answer
    label: v
    tex: F
    value: (r2/k)/((1 - r2)/(n - k - 1))
    tol: 0.005
    explain: The overall F tests whether any predictor helps; it compares explained to unexplained variation per degree of freedom
  verify:

  - q: a fan that widens to the right
    ans: 1
  - q: a random band of even width around 0
    ans: 2
  - q: one point far from all the others
    ans: 3
  prompt: A residual plot shows {{q}}. What does it suggest?
  parts:
  - ask: Answer
    label: v
    choice:
    - 'The relationship is curved: transform or add a term'
    - 'Unequal variance: transform y or weight the fit'
    - The linear model is adequate
    - 'An outlier or influential point: check it'
    correct: ans
    explain: Residuals carry what the line missed. Curvature, changing spread and lone points are the three things to look for
  verify:
    authored: true
- template: st-linearised-fit

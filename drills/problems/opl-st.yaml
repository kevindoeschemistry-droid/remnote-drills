- template: st-logistic
  skill: stats.bivariate
  pace: quick
  given:
    b0:
      pick:
      - -3
      - -2
      - -1.5
    b1:
      pick:
      - 0.4
      - 0.8
      - 1.2
    x0:
      int:
      - 0
      - 6
  prompt: A logistic model has $\ln\frac{p}{1 - p} = {{b0}} + {{b1}}x$. Find $p$ at $x = {{x0}}$.
  parts:
  - ask: Answer
    label: v
    tex: p
    value: 1/(1 + exp(-(b0 + b1*x0)))
    tol: 0.005
    explain: 'Compute the log-odds, then invert: $p = 1/(1 + e^{-\eta})$'
  verify:

      - 3.1
    d:
      pick:
      - -0.3
      - 0.2
      - 0.45
  prompt: A straight-line fit of $\ln y$ against $x$ gives $\ln y = {{c}} + {{d}}x$. What is $a$ in $y = ae^{bx}$?
  parts:

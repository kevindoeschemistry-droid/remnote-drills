      - 100
    sse:
      pick:
      - 12
      - 35
      - 80
      - 150
  prompt: A least-squares model with {{k}} parameters on {{n}} points has SSE = {{sse}}. Compute AIC $= n\ln(\text{SSE}/n) + 2k$.
  parts:
  - ask: Answer
    label: v
    tex: AIC
    value: n*log(sse/n) + 2*k
    tol: 0.005
    explain: Between models fitted to the same data, the lower AIC wins; the $2k$ term is the penalty for each parameter
  verify:
    expect:
      v: n*log(nsimplify(sse)/n) + 2*k
- template: st-overall-f
  skill: stats.inference
  pace: quick
  given:
    k:
      int:
      - 2

- template: st-power
  skill: stats.inference
  pace: quick
  given:
    s:
      pick:
      - 5
      - 10
    n:
      pick:
      - 16
      - 25
      - 36
    d:
      pick:
      - 1
      - 2
      - 3
      - 4
  prompt: A one-sided z test at $\alpha = 0.05$ ($z_\alpha = 1.645$) has $\sigma = {{s}}$ and $n = {{n}}$. If the true mean is {{d}} above $\mu_0$, what is the power?
  parts:
  - ask: Answer
    label: v
    tex: 1 - \beta
    value: 0.5*(1 + erf((d*sqrt(n)/s - 1.645)/sqrt(2)))
    tol: 0.005
    explain: Reject when $\bar x > \mu_0 + 1.645\sigma/\sqrt n$; under the true mean that cut-off sits $1.645 - \delta\sqrt n/\sigma$ standard errors away. Power rises with $n$ and with the effect size
  verify:
    expect:
      v: Rational(1, 2)*(1 + erf((nsimplify(d)*sqrt(n)/s - Rational(1645, 1000))/sqrt(2)))
- template: st-chi-variance
  skill: stats.inference
  pace: quick
  given:

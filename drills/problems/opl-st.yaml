  - n: 20
    cl: 8.907
    cu: 32.852
  - n: 25
    cl: 12.401
    cu: 39.364
  prompt: $n = {{n}}$, $s^2 = {{v}}$. The chi-square critical values with {{n - 1}} df are ${{cl}}$ and ${{cu}}$. What is the lower end of the 95% interval for $\sigma^2$?
  parts:
  - ask: Answer
    label: r
    tex: L
    value: (n - 1)*v/cu
    tol: 0.005
    explain: Divide $(n - 1)s^2$ by the larger critical value for the lower end. The interval is not symmetric about $s^2$
  verify:

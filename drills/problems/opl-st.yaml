  require:
  - m1 != m2
  prompt: 'Sample 1: $\bar x = {{m1}}$, $s = {{s1}}$, $n = {{n1}}$; sample 2: $\bar x = {{m2}}$, $s = {{s2}}$, $n = {{n2}}$. Find the Welch $t$ statistic.'
  parts:
  - ask: Answer
    label: v
    tex: t
    value: (m1 - m2)/sqrt(s1^2/n1 + s2^2/n2)
    tol: 0.005
    explain: $t = (\bar x_1 - \bar x_2)/\text{SE}$ with the unpooled SE; Welch's degrees of freedom handle unequal variances
  verify:
    expect:
      v: (m1 - m2)/sqrt(Rational(s1**2, n1) + Rational(s2**2, n2))
- template: st-variance-interval

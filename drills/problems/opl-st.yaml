      - 12
    n2:
      int:
      - 4
      - 12
  prompt: Two samples of sizes {{n1}} and {{n2}} are ranked together. Under $H_0$, what is the expected rank sum of the first sample?
  parts:
  - ask: Answer
    label: v
    tex: E[W]
    value: n1*(n1 + n2 + 1)/2
    tol: 0.005
    explain: Every rank is equally likely to land in either sample, so each of the $n_1$ ranks averages $(N + 1)/2$
  verify:
    expect:
      v: n1*summation(Symbol('k'), (Symbol('k'), 1, n1 + n2))/(n1 + n2)
- template: st-signed-rank-mean
  skill: stats.inference
  pace: recall
  given:
    n:
      int:
      - 5
      - 20
  prompt: For {{n}} nonzero differences, what is the expected sum of the positive ranks $W^+$ under $H_0$?
  parts:
  - ask: Answer
    label: v
    tex: E[W^+]
    value: n*(n + 1)/4
    tol: 0.005
    explain: 'Each rank $1..n$ is positive with probability ½: half of $n(n + 1)/2$'
  verify:
    expect:
      v: summation(Symbol('k'), (Symbol('k'), 1, n))/2
- template: st-runs-mean
  skill: stats.inference
  pace: quick
  given:
    n1:
      int:
      - 5
      - 15
    n2:
      int:
      - 5
      - 15
  prompt: A sequence has {{n1}} of one symbol and {{n2}} of the other in random order. What is the expected number of runs?
  parts:
  - ask: Answer
    label: v
    tex: E[R]
    value: 2*n1*n2/(n1 + n2) + 1
    tol: 0.005
    explain: Each of the $N - 1$ adjacent pairs starts a new run when the symbols differ, with probability $2n_1n_2/(N(N - 1))$. Too few runs suggests clustering, too many suggests alternation
  verify:
    expect:
      v: 1 + (n1 + n2 - 1)*2*Rational(n1, n1 + n2)*Rational(n2, n1 + n2 - 1)
- template: st-kruskal-wallis
  skill: stats.inference
  pace: quick
  given:
    n:
      pick:
      - 4
      - 5
      - 6
    r1:
      int:
      - 15
      - 30
    r2:
      int:
      - 20
      - 40
  require:
  - 3*n*(3*n + 1)/2 - r1 - r2 > 0
  prompt: Three groups of {{n}} are ranked together ($N = {{3*n}}$). Their rank sums are {{r1}}, {{r2}} and {{3*n*(3*n + 1)/2 - r1 - r2}}. Find $H$.
  parts:
  - ask: Answer
    label: v
    tex: H
    value: 12/(3*n*(3*n + 1))*(r1^2 + r2^2 + (3*n*(3*n + 1)/2 - r1 - r2)^2)/n - 3*(3*n + 1)
    tol: 0.005
    explain: It is a one-way ANOVA on ranks. The three rank sums must add to $N(N + 1)/2$, which is a quick check
  verify:
    expect:
      v: Rational(12, 3*n*(3*n + 1))*Matrix([r1, r2, Rational(3*n*(3*n + 1), 2) - r1 - r2]).dot(Matrix([r1, r2, Rational(3*n*(3*n + 1), 2) - r1 - r2]))/n - 3*(3*n + 1)
- template: st-ks-statistic
  skill: stats.inference
  pace: quick
  given:
    a1:
      pick:
      - 0.1
      - 0.2
      - 0.3
    a2:
      pick:
      - 0.4
      - 0.5
      - 0.6
    a3:
      pick:
      - 0.7
      - 0.8
      - 0.9
    b1:
      pick:
      - 0.0
      - 0.05
      - 0.2
    b2:
      pick:
      - 0.2
      - 0.35
      - 0.45
    b3:
      pick:
      - 0.5
      - 0.65
      - 0.75
  prompt: Two empirical CDFs at four points are $F_1 = ({{a1}}, {{a2}}, {{a3}}, 1)$ and $F_2 = ({{b1}}, {{b2}}, {{b3}}, 1)$. Find $D = \max|F_1 - F_2|$.
  parts:
  - ask: Answer
    label: v
    tex: D
    value: max(abs(a1 - b1), abs(a2 - b2), abs(a3 - b3))
    tol: 0.005
    explain: The KS statistic is the largest vertical gap between the two step functions. It is sensitive to differences in location, spread and shape at once
  verify:
    expect:
      v: Max(Abs(nsimplify(a1) - nsimplify(b1)), Abs(nsimplify(a2) - nsimplify(b2)), Abs(nsimplify(a3) - nsimplify(b3)))

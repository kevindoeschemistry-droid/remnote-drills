- template: st-odds
  skill: stats.probability
  pace: recall
  given:
    p:
      pick:
      - 0.2
      - 0.25
      - 0.4
      - 0.6
      - 0.75
      - 0.8
  prompt: An event has probability ${{p}}$. What are the odds in favour, as a single number $p/(1-p)$?
  parts:
  - ask: Answer
    label: v
    tex: o
    value: p/(1 - p)
    tol: 0.005
    explain: 'Odds compare the chance it happens with the chance it does not: ${{p}}$ to ${{1 - p}}$. Odds of 3 mean 3 to 1, a probability of 0.75'
  verify:
    expect:
      v: solve(Eq(x/(1 + x), nsimplify(p)), x)[0]
- template: st-median-exponential
  skill: stats.distributions
  pace: quick
  given:
    l:
      pick:
      - 0.1
      - 0.2
      - 0.5
      - 2
  prompt: Waiting times are exponential with rate $\lambda = {{l}}$ per minute. What is the median wait, in minutes?
  parts:
  - ask: Answer
    label: v
    tex: m
    value: log(2)/l
    tol: 0.005
    explain: 'Set $1 - e^{-\lambda m} = 1/2$: $m = \ln 2/\lambda$, shorter than the mean $1/\lambda$ because the long tail pulls the mean up'
  verify:
    expect:
      v: solve(Eq(integrate(nsimplify(l)*exp(-nsimplify(l)*Symbol('s')), (Symbol('s'), 0, x)), Rational(1, 2)), x)[0]
- template: st-pdf-interval
  skill: stats.distributions
  pace: quick
  given:
    a:
      pick:
      - 0
      - 0.1
      - 0.2
      - 0.5
    b:
      pick:
      - 0.6
      - 0.8
      - 0.9
      - 1
  prompt: $X$ has density $f(x) = 3x^2$ on $[0, 1]$. Find $P({{a}} < X < {{b}})$.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: b^3 - a^3
    tol: 0.005
    explain: The CDF is $F(x) = x^3$, so the probability is $F({{b}}) - F({{a}})$. For a continuous variable, $<$ and $\le$ give the same answer
  verify:
    expect:
      v: integrate(3*x**2, (x, nsimplify(a), nsimplify(b)))
- template: st-mgf-mean
  skill: stats.expected-value
  pace: quick
  given:
    p:
      pick:
      - 0.1
      - 0.25
      - 0.5
      - 0.8
    n:
      int:
      - 2
      - 12
  prompt: $X$ has moment generating function $M(t) = (1 - {{p}} + {{p}}e^t)^{ {{n}} }$. Find $E[X]$ from $M'(0)$.
  parts:
  - ask: Answer
    label: v
    tex: E[X]
    value: n*p
    tol: 0.005
    explain: That is the binomial MGF; $M'(0) = n p$. The MGF of a sum of independent variables is the product of their MGFs
  verify:
    expect:
      v: diff((1 - nsimplify(p) + nsimplify(p)*exp(x))**n, x).subs(x, 0)
- template: st-chebyshev
  skill: stats.probability
  pace: recall
  given:
    k:
      pick:
      - 1.5
      - 2
      - 3
      - 4
      - 5
  prompt: Whatever the distribution, at most what fraction of values lie {{k}} or more standard deviations from the mean?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: 1/k^2
    tol: 0.005
    explain: 'Chebyshev: at most $1/k^2$. For a normal distribution the true fraction is far smaller (about 4.6% beyond 2σ against Chebyshev''s 25%)'
  verify:
    expect:
      v: 1/nsimplify(k)**2
- template: st-lln-sample-size
  skill: stats.sampling
  pace: quick
  given:
    s:
      pick:
      - 2
      - 5
      - 10
    e:
      pick:
      - 0.5
      - 1
      - 2
    d:
      pick:
      - 0.05
      - 0.1
  prompt: A measurement has $\sigma = {{s}}$. By Chebyshev, how many measurements guarantee $P(|\bar X - \mu| \ge {{e}}) \le {{d}}$?
  parts:
  - ask: Answer
    label: v
    tex: n
    value: s^2/(e^2*d)
    tol: 0.005
    explain: Var$(\bar X) = \sigma^2/n$; Chebyshev gives $\sigma^2/(n\varepsilon^2) \le \delta$. This is the weak law of large numbers made quantitative; the normal approximation would need far fewer
  verify:
    expect:
      v: solve(Eq(s**2/(x*nsimplify(e)**2), nsimplify(d)), x)[0]
- template: st-joint-missing
  skill: stats.probability
  pace: quick
  given:
    a:
      int:
      - 5
      - 30
    b:
      int:
      - 5
      - 30
    c:
      int:
      - 5
      - 25
  prompt: A joint table for $X, Y \in \{0, 1\}$ has $P(0,0) = {{a/100}}$, $P(0,1) = {{b/100}}$, $P(1,0) = {{c/100}}$. Find $P(X = 1)$.
  parts:
  - ask: Answer
    label: v
    tex: P
    value: (100 - a - b)/100
    tol: 0.005
    explain: 'The missing cell is $1 - $ the others, ${{(100 - a - b - c)/100}}$; the marginal $P(X = 1)$ adds the $X = 1$ row: $P(1,0) + P(1,1)$'
  verify:
    expect:
      v: Rational(c, 100) + (1 - Rational(a + b + c, 100))
- template: st-covariance-table
  skill: stats.expected-value
  pace: quick
  given:
    d:
      int:
      - 5
      - 30
    px:
      int:
      - 30
      - 60
    py:
      int:
      - 30
      - 60
  require:
  - d <= px
  - d <= py
  - 100*d != px*py
  prompt: 'For $X, Y \in \{0, 1\}$: $P(1,1) = {{d/100}}$, $P(X = 1) = {{px/100}}$, $P(Y = 1) = {{py/100}}$. Find $\operatorname{Cov}(X, Y)$.'
  parts:
  - ask: Answer
    label: v
    tex: \operatorname{Cov}
    value: d/100 - px*py/10000
    tol: 0.005
    explain: For indicator variables $E[XY] = P(1,1)$ and $E[X] = P(X = 1)$. Zero covariance here means independence; in general it only means no linear association
  verify:
    expect:
      v: Rational(d, 100)*1*1 - Rational(px, 100)*Rational(py, 100)
- template: st-normal-approx
  skill: stats.distributions
  pace: quick
  given:
    n:
      pick:
      - 50
      - 100
      - 200
    p:
      pick:
      - 0.3
      - 0.5
      - 0.6
    k:
      pick:
      - 25
      - 40
      - 55
      - 70
  prompt: $X \sim \text{Bin}({{n}}, {{p}})$. Using the normal approximation with continuity correction, what $z$ corresponds to $P(X \le {{k}})$?
  parts:
  - ask: Answer
    label: v
    tex: z
    value: (k + 0.5 - n*p)/sqrt(n*p*(1 - p))
    tol: 0.005
    explain: Use $\mu = np$ and $\sigma = \sqrt{np(1 - p)}$, and stretch the integer ${{k}}$ to ${{k}} + 0.5$ so the bar for $X = k$ is included
  verify:
    expect:
      v: solve(Eq(nsimplify(k) + Rational(1, 2), n*nsimplify(p) + x*sqrt(n*nsimplify(p)*(1 - nsimplify(p)))), x)[0]
- template: st-negative-binomial
  skill: stats.distributions
  pace: quick
  given:
    p:
      pick:
      - 0.2
      - 0.3
      - 0.5
    r:
      int:
      - 2
      - 4
    n:
      int:
      - 5
      - 9
  prompt: Each trial succeeds with probability ${{p}}$. What is the probability that the {{r}}th success comes on trial {{n}}?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: combinations(n - 1, r - 1)*p^r*(1 - p)^(n - r)
    tol: 0.005
    explain: The last trial must be the ${{r}}$th success; the other ${{r - 1}}$ successes fall anywhere in the first ${{n - 1}}$ trials
  verify:
    expect:
      v: binomial(n - 1, r - 1)*nsimplify(p)**r*(1 - nsimplify(p))**(n - r)
- template: st-poisson
  skill: stats.distributions
  pace: quick
  given:
    l:
      pick:
      - 1
      - 2
      - 3
      - 4.5
    k:
      int:
      - 0
      - 5
  prompt: Calls arrive at an average of ${{l}}$ per hour, as a Poisson process. What is the probability of exactly {{k}} calls in an hour?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: exp(-l)*l^k/factorial(k)
    tol: 0.005
    explain: $P(X = k) = e^{-\lambda}\lambda^k/k!$. The Poisson is the binomial with many trials and a small chance each, $np = \lambda$
  verify:
    expect:
      v: diff(exp(nsimplify(l)*(x - 1)), x, k).subs(x, 0)/factorial(k)
- template: st-hypergeometric
  skill: stats.distributions
  pace: quick
  given:
    N:
      pick:
      - 20
      - 25
      - 30
    K:
      pick:
      - 3
      - 4
      - 5
    n:
      pick:
      - 4
      - 5
      - 6
    k:
      int:
      - 0
      - 2
  prompt: A lot of {{N}} parts has {{K}} defective. {{n}} are drawn without replacement. What is the probability that exactly {{k}} are defective?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: combinations(K, k)*combinations(N - K, n - k)/combinations(N, n)
    tol: 0.005
    explain: Count the ways to pick ${{k}}$ of the ${{K}}$ bad and ${{n - k}}$ of the good, over all ways to pick ${{n}}$
  verify:
    expect:
      v: binomial(K, k)*binomial(N - K, n - k)/binomial(N, n)
- template: st-multinomial
  skill: stats.distributions
  pace: quick
  given:
    a:
      int:
      - 1
      - 4
    b:
      int:
      - 1
      - 3
    c:
      int:
      - 0
      - 2
  prompt: Each roll of a loaded die lands low, middle or high with probabilities 0.5, 0.3, 0.2. In {{a + b + c}} rolls, what is the probability of exactly {{a}} low, {{b}} middle and {{c}} high?
  parts:
  - ask: Answer
    label: v
    tex: P
    value: factorial(a + b + c)/(factorial(a)*factorial(b)*factorial(c))*0.5^a*0.3^b*0.2^c
    tol: 0.005
    explain: Choose which rolls are low, then which of the rest are middle; multiply by the chance of each pattern
  verify:
    expect:
      v: binomial(a + b + c, a)*binomial(b + c, b)*Rational(1, 2)**a*Rational(3, 10)**b*Rational(1, 5)**c
- template: st-mm1-wait
  skill: stats.expected-value
  pace: quick
  given:
    l:
      pick:
      - 4
      - 6
      - 8
      - 9
    m:
      pick:
      - 10
      - 12
  prompt: Customers arrive at {{l}} per hour and one server handles {{m}} per hour (M/M/1). What is the mean time a customer spends in the system, in minutes?
  parts:
  - ask: Answer
    label: v
    tex: W
    value: 60/(m - l)
    tol: 0.005
    explain: $\rho = \lambda/\mu$, $L = \rho/(1 - \rho)$ customers, and Little's law $L = \lambda W$ gives $W = 1/(\mu - \lambda)$. As $\lambda \to \mu$ the wait blows up
  verify:
    expect:
      v: 60*(nsimplify(l)/(m - nsimplify(l)))/nsimplify(l)
- template: st-uniform-variance
  skill: stats.distributions
  pace: quick
  given:
    a:
      int:
      - -3
      - 3
    b:
      int:
      - 4
      - 10
  prompt: $X$ is uniform on $[{{a}}, {{b}}]$. Find $\operatorname{Var}X$.
  parts:

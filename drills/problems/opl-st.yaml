- template: st-weibull
  skill: stats.distributions
  pace: quick
  given:
    bt:
      pick:
      - 0.5
      - 1
      - 2
      - 3
    eta:
      pick:
      - 100
      - 500
      - 1000
    t:
      pick:
      - 50
      - 100
      - 200
  prompt: Lifetimes are Weibull with shape $\beta = {{bt}}$ and scale $\eta = {{eta}}$ h. What fraction survive past {{t}} h?
  parts:
  - ask: Answer
    label: v
    tex: R
    value: exp(-(t/eta)^bt)
    tol: 0.005
    explain: Integrate the hazard $h(t) = \frac\beta\eta(t/\eta)^{\beta - 1}$ and exponentiate. $\beta = 1$ is the exponential; $\beta > 1$ is wear-out
  verify:
    expect:
      v: exp(-integrate(nsimplify(bt)/eta*(x/eta)**(nsimplify(bt) - 1), (x, 0, t)))
- template: st-gamma-variance
  skill: stats.distributions
  pace: quick
  given:
    k:
      int:
      - 1
      - 5
    th:
      int:
      - 1
      - 4
  prompt: $X$ has a gamma distribution with shape $k = {{k}}$ and scale $\theta = {{th}}$. Find $\operatorname{Var}X$.
  parts:
  - ask: Answer
    label: v
    tex: \sigma^2
    value: k*th^2
    tol: 0.005
    explain: 'A gamma with integer $k$ is the sum of $k$ independent exponentials of mean $\theta$, so the variances add: $k\theta^2$'
  verify:
    expect:
      v: integrate(x**2*x**(k - 1)*exp(-x/th)/(factorial(k - 1)*th**k), (x, 0, oo)) - integrate(x*x**(k - 1)*exp(-x/th)/(factorial(k - 1)*th**k), (x, 0, oo))**2
- template: st-beta-mean
  skill: stats.distributions
  pace: quick
  given:
    a:
      int:
      - 1
      - 6
    b:
      int:
      - 1
      - 6
  prompt: $X \sim \text{Beta}({{a}}, {{b}})$. Find $E[X]$.
  parts:
  - ask: Answer
    label: v
    tex: E[X]
    value: a/(a + b)
    tol: 0.005
    explain: Beta distributions live on [0, 1] and model proportions; $a$ and $b$ act like counts of successes and failures
  verify:
    expect:
      v: integrate(x*x**(a - 1)*(1 - x)**(b - 1), (x, 0, 1))/integrate(x**(a - 1)*(1 - x)**(b - 1), (x, 0, 1))
- template: st-ratio-estimator
  skill: stats.sampling
  pace: quick
  given:
    yb:
      pick:
      - 120
      - 150
      - 200
    xb:
      pick:
      - 40
      - 50
      - 60
    X:
      pick:
      - 10000
      - 25000
      - 50000
  prompt: A sample of farms has mean yield {{yb}} t and mean area {{xb}} ha. The whole county has {{X}} ha. Estimate the county's total yield, in t.
  parts:
  - ask: Answer
    label: v
    tex: \hat Y
    value: yb/xb*X
    tol: 0.005
    explain: 'The ratio estimator assumes yield is proportional to area: $\hat Y = (\bar y/\bar x)X$'
  verify:
    expect:
      v: solve(Eq(x/X, nsimplify(yb)/nsimplify(xb)), x)[0]
- template: st-regression-estimator
  skill: stats.sampling
  pace: quick
  given:
    yb:
      int:
      - 40
      - 80
    xb:
      int:
      - 20
      - 30
    b:
      pick:
      - 0.5
      - 1.2
      - 2
    XB:
      int:
      - 22
      - 32
  require:
  - XB != xb
  prompt: A sample has $\bar y = {{yb}}$, $\bar x = {{xb}}$ and fitted slope $b = {{b}}$. The population mean of $x$ is ${{XB}}$. What is the regression estimate of the mean of $y$?
  parts:
  - ask: Answer
    label: v
    tex: \bar y_{reg}
    value: yb + b*(XB - xb)
    tol: 0.005
    explain: The sample's $x$ came out ${{xb - XB}}$ off the known mean; shift $\bar y$ along the fitted line to correct for it
  verify:
    expect:
      v: yb + nsimplify(b)*(XB - xb)
- template: st-stratified-mean
  skill: stats.sampling
  pace: quick
  given:
    N1:
      pick:
      - 200
      - 300
      - 600
    N2:
      pick:
      - 400
      - 700
      - 900
    y1:
      int:
      - 10
      - 30
    y2:
      int:
      - 30
      - 60
  prompt: A town has {{N1}} houses in stratum A (sample mean {{y1}}) and {{N2}} in stratum B (sample mean {{y2}}). What is the stratified estimate of the mean?
  parts:
  - ask: Answer
    label: v
    tex: \bar y_{st}
    value: (N1*y1 + N2*y2)/(N1 + N2)
    tol: 0.005
    explain: Weight each stratum's mean by its share of the population, not by its share of the sample
  verify:
    expect:
      v: Rational(N1, N1 + N2)*y1 + Rational(N2, N1 + N2)*y2
- template: st-cluster-total
  skill: stats.sampling
  pace: quick
  given:
    n:
      pick:
      - 10
      - 20
      - 25
    N:
      pick:
      - 400
      - 500
      - 1000
    T:
      pick:
      - 600
      - 900
      - 1500
  prompt: '{{n}} of {{N}} city blocks are sampled at random and every household in them counted; the sampled blocks hold {{T}} households in total. Estimate the city''s households.'
  parts:
  - ask: Answer
    label: v
    tex: \hat Y
    value: N/n*T
    tol: 0.005
    explain: Each sampled block stands for $N/n$ blocks. Cluster sampling is cheap but households in one block are alike, which widens the error
  verify:
    expect:
      v: Rational(N, n)*T
- template: st-capture-recapture
  skill: stats.sampling
  pace: quick
  given:
    M:
      pick:
      - 50
      - 100
      - 200
    C:
      pick:
      - 60
      - 80
      - 150
    R:
      pick:
      - 5
      - 8
      - 10
      - 12
  prompt: '{{M}} fish are tagged and released. Later {{C}} are caught, of which {{R}} carry tags. Estimate the population.'
  parts:
  - ask: Answer
    label: v
    tex: \hat N
    value: M*C/R
    tol: 0.005
    explain: 'Tagged fraction in the catch ≈ tagged fraction in the lake: $R/C = M/N$'
  verify:
    expect:
      v: solve(Eq(Rational(R, C), M/x), x)[0]
- template: st-z-interval
  skill: stats.inference
  pace: quick
  given:
    n:
      pick:
      - 16
      - 25
      - 36
      - 64
      - 100
    xb:
      int:
      - 40
      - 80
    s:
      pick:
      - 4
      - 8
      - 10
      - 15
  prompt: $n = {{n}}$, $\bar x = {{xb}}$, known $\sigma = {{s}}$. With $z^* = 1.96$, what is the upper end of the 95% interval for $\mu$?
  parts:
  - ask: Answer
    label: v
    tex: U
    value: xb + 1.96*s/sqrt(n)
    tol: 0.005
    explain: Margin $= z^*\sigma/\sqrt n$. Quadrupling $n$ halves it
  verify:
    expect:
      v: xb + Rational(196, 100)*s/sqrt(n)
- template: st-two-prop-margin
  skill: stats.inference
  pace: quick
  given:
    x1:
      int:
      - 20
      - 60
    n1:
      pick:
      - 100
      - 150
    x2:
      int:
      - 20
      - 60
    n2:
      pick:
      - 100
      - 200
  prompt: 'Group 1: {{x1}} of {{n1}}; group 2: {{x2}} of {{n2}}. With $z^* = 1.96$, what is the margin of error for $p_1 - p_2$?'
  parts:
  - ask: Answer
    label: v
    tex: ME
    value: 1.96*sqrt((x1/n1)*(1 - x1/n1)/n1 + (x2/n2)*(1 - x2/n2)/n2)
    tol: 0.005
    explain: Variances of independent estimates add; the standard errors do not. For the interval, do not pool
  verify:
    expect:
      v: Rational(196, 100)*sqrt(Rational(x1, n1)*(1 - Rational(x1, n1))/n1 + Rational(x2, n2)*(1 - Rational(x2, n2))/n2)
- template: st-paired-margin
  skill: stats.inference
  pace: quick
  given:
    db:
      pick:
      - 1.5
      - 2.4
      - 3
    sd:
      pick:
      - 2
      - 3.5
      - 5
  cases:
  - n: 10
    ts: 2.262
  - n: 15
    ts: 2.145
  - n: 20
    ts: 2.093
  - n: 25
    ts: 2.064
  prompt: '{{n}} subjects are measured before and after; the differences have $\bar d = {{db}}$ and $s_d = {{sd}}$. With $t^* = {{ts}}$, what is the margin of error?'
  parts:
  - ask: Answer
    label: v
    tex: ME
    value: ts*sd/sqrt(n)
    tol: 0.005
    explain: Pairing turns two samples into one sample of differences, which removes the subject-to-subject variation
  verify:
    expect:
      v: nsimplify(ts)*nsimplify(sd)/sqrt(n)
- template: st-two-z-margin
  skill: stats.inference
  pace: quick
  given:
    s1:
      pick:
      - 4
      - 6
      - 10
    s2:
      pick:
      - 5
      - 8
      - 12
    n1:
      pick:
      - 25
      - 40
      - 50
    n2:
      pick:
      - 30
      - 40
      - 60
  prompt: Known $\sigma_1 = {{s1}}$, $\sigma_2 = {{s2}}$, samples $n_1 = {{n1}}$, $n_2 = {{n2}}$. With $z^* = 1.96$, find the margin of error for $\mu_1 - \mu_2$.
  parts:
  - ask: Answer
    label: v
    tex: ME
    value: 1.96*sqrt(s1^2/n1 + s2^2/n2)
    tol: 0.005
    explain: Add the variances of the two means, then take the square root
  verify:
    expect:
      v: Rational(196, 100)*sqrt(Rational(s1**2, n1) + Rational(s2**2, n2))

# Drill skill graph — WHAT can be drilled. Book-agnostic.
#
# Where a skill appears (textbook sections, courses) lives in drills/sources/*.yaml
# and drills/courses.yaml, never here. One skill = one set of RemNote cards and one
# streak, no matter how many books teach it.
#
# id:      domain.concept  (stable; cards and streaks hang off it)
# aliases: old ids that must keep resolving (existing cards + streaks)
# status:  live (has generators, gets cards) | planned
# kind:    solve | classify
# levels:  level -> template names (remnote-plugin/src/drills/registry.ts). Level 1 = Kuta-style.

version: 2

domains:
  - { id: calc,    title: "Calculus & linear algebra prerequisites" }
  - { id: la,      title: "Linear algebra" }
  - { id: ode1,    title: "First-order ODEs" }
  - { id: ode2,    title: "Second-order & higher linear ODEs" }
  - { id: odesys,  title: "Systems of ODEs" }
  - { id: series,  title: "Series solutions" }
  - { id: laplace, title: "Laplace transforms" }
  - { id: bvp,     title: "Boundary-value problems & Fourier series" }
  - { id: pde,     title: "Partial differential equations" }
  - { id: ht,      title: "Heat transfer" }
  - { id: thermo,  title: "Classical thermodynamics" }
  - { id: stat,    title: "Statistical mechanics" }
  - { id: k8,      title: "K–8 mathematics" }
  - { id: alg,     title: "Algebra & functions" }
  - { id: geo,     title: "Geometry" }
  - { id: trig,    title: "Trigonometry" }
  - { id: stats,   title: "Statistics & probability" }

skills:
  # ── prerequisites ────────────────────────────────────────────────────────
  - { id: calc.u-sub, domain: calc, title: "u-substitution", aliases: [calc-u-sub] }
  - { id: calc.by-parts, domain: calc, title: "Integration by parts", aliases: [calc-by-parts] }
  - { id: calc.partial-fractions, domain: calc, title: "Partial fractions", aliases: [calc-partial-fractions] }
  - { id: calc.complex-euler, domain: calc, title: "Complex roots & Euler's formula", aliases: [calc-complex-euler] }
  - { id: calc.sigma-shift, domain: calc, title: "Shifting summation indices", aliases: [calc-sigma-shift] }
  - { id: calc.multivariable, domain: calc, title: "Partial derivatives & exact differentials" }

  # ── first-order ODEs ────────────────────────────────────────────────────
  - id: ode1.separable
    domain: ode1
    title: "Separable equations"
    short: "Separable"
    status: live
    aliases: [separable, krey-ch01-separable]
    prereqs: [calc.u-sub, calc.partial-fractions]
    levels: { 1: [sep-exp-growth, sep-over-y, sep-y-squared, sep-exp-split, sep-over-y2] }

  - id: ode1.substitution
    domain: ode1
    title: "Separable via substitution"
    short: "Substitution"
    status: live
    aliases: [substitution, krey-ch01-substitution]
    prereqs: [ode1.separable]
    levels: { 1: [sub-ratio, sub-square, sub-exp, sub-linear-square, sub-arctan] }

  - id: ode1.linear
    domain: ode1
    title: "Linear: integrating factor"
    short: "Integrating factor"
    status: live
    aliases: [linear, krey-ch01-linear]
    prereqs: [calc.u-sub]
    levels: { 1: [lin-exp, lin-const, lin-power, lin-gauss, lin-trig, lin-resonant] }

  - id: ode1.linear-ibp
    domain: ode1
    title: "Integrating factor + integration by parts"
    short: "IF + by parts"
    status: live
    aliases: [ibp, krey-ch01-linear-ibp]
    prereqs: [ode1.linear, calc.by-parts]
    levels: { 1: [ibp-poly, ibp-over-x-trig, ibp-over-x-exp, ibp-x-exp, ibp-trig-exp, ibp-power-exp] }

  - id: ode1.bernoulli
    domain: ode1
    title: "Bernoulli equations"
    short: "Bernoulli"
    status: live
    aliases: [bernoulli, krey-ch01-bernoulli]
    prereqs: [ode1.linear]
    levels: { 1: [bern-const, bern-power, bern-exp] }

  - { id: ode1.exact, domain: ode1, title: "Exact equations", aliases: [krey-ch01-exact], prereqs: [calc.multivariable] }
  - { id: ode1.exact-if, domain: ode1, title: "Integrating factors for exactness", aliases: [krey-ch01-exact-if], prereqs: [ode1.exact] }
  - { id: ode1.modeling, domain: ode1, title: "Modeling: mixing, cooling, growth", aliases: [krey-ch01-modeling], prereqs: [ode1.separable, ode1.linear] }
  - { id: ode1.recognize, domain: ode1, title: "Which first-order method?", kind: classify, aliases: [krey-ch01-recognize],
      pool: [ode1.separable, ode1.substitution, ode1.linear, ode1.bernoulli, ode1.exact] }

  # ── linear algebra (Lay) ────────────────────────────────────────────────
  - { id: la.row-reduction, domain: la, title: "Solving a system by row reduction", short: "Row reduction", status: live, levels: { 1: [la-system] } }
  - { id: la.independence, domain: la, title: "Linear independence", short: "Independence", kind: classify, status: live, prereqs: [la.determinant], levels: { 1: [la-independence] } }
  - { id: la.inverse, domain: la, title: "Inverse of a 2×2 matrix", short: "2×2 inverse", status: live, levels: { 1: [la-inverse] } }
  - { id: la.determinant, domain: la, title: "3×3 determinants (cofactor expansion)", short: "Determinants", status: live, levels: { 1: [la-det] } }
  - { id: la.eigenvalues, domain: la, title: "2×2 eigenvalues", short: "Eigenvalues", status: live, aliases: [calc.eigen-2x2, calc-eigen-2x2], prereqs: [la.determinant], levels: { 1: [la-eigenvalues] } }
  - { id: la.eigenvectors, domain: la, title: "2×2 eigenvectors", short: "Eigenvectors", status: live, prereqs: [la.eigenvalues, la.row-reduction], levels: { 1: [la-eigenvector] } }

  # ── second-order & higher linear ODEs ───────────────────────────────────
  - id: ode2.characteristic
    domain: ode2
    title: "Characteristic equation (3 root cases)"
    short: "Characteristic eq."
    status: live
    aliases: [krey-ch02-characteristic]
    prereqs: [calc.complex-euler]
    levels: { 1: [char-distinct, char-repeated, char-complex, char-ivp] }
  - { id: ode2.reduction, domain: ode2, title: "Reduction of order", aliases: [krey-ch02-reduction] }
  - { id: ode2.euler-cauchy, domain: ode2, title: "Euler–Cauchy equations", aliases: [krey-ch02-euler-cauchy], prereqs: [ode2.characteristic] }

  - id: ode2.wronskian
    domain: ode2
    title: "The Wronskian"
    short: "Wronskian"
    status: live
    aliases: [wronskian, krey-ch02-wronskian]
    levels: { 1: [wr-exps, wr-repeated, wr-trig, wr-damped, wr-powers, wr-log, wr-three, wr-dependent] }

  - id: ode2.spring-undamped
    domain: ode2
    title: "Mass–spring, undamped"
    short: "Spring (undamped)"
    status: live
    aliases: [krey-ch02-spring-undamped]
    prereqs: [ode2.characteristic]
    levels: { 1: [spring-frequency, spring-undamped-ivp, spring-amplitude-phase] }

  - id: ode2.spring-damped
    domain: ode2
    title: "Mass–spring, damped"
    short: "Spring (damped)"
    status: live
    aliases: [krey-ch02-spring-damped]
    prereqs: [ode2.characteristic, ode2.spring-undamped]
    levels: { 1: [spring-classify, spring-over-ivp, spring-critical-ivp, spring-under-ivp] }

  - id: ode2.undetermined
    domain: ode2
    title: "Undetermined coefficients"
    short: "Undetermined coeffs."
    status: live
    aliases: [krey-ch02-undetermined]
    prereqs: [ode2.characteristic]
    levels: { 1: [uc-poly, uc-exp, uc-trig, uc-resonance, uc-general] }
  - { id: ode2.spring-forced, domain: ode2, title: "Mass–spring, forced & resonance", aliases: [krey-ch02-spring-forced],
      prereqs: [ode2.undetermined, ode2.spring-damped] }
  - { id: ode2.variation, domain: ode2, title: "Variation of parameters", aliases: [krey-ch02-variation], prereqs: [ode2.wronskian] }
  - { id: ode2.higher-order, domain: ode2, title: "Higher-order characteristic equations", aliases: [krey-ch03-characteristic], prereqs: [ode2.characteristic] }

  # ── systems ─────────────────────────────────────────────────────────────
  - { id: odesys.eigenvalue, domain: odesys, title: "2×2 systems by eigenvalues", aliases: [krey-ch04-eigenvalue], prereqs: [la.eigenvalues] }
  - id: odesys.kinetics-series
    domain: odesys
    title: "Kinetics A → B → C as a 2×2 system"

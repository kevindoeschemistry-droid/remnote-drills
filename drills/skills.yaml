  - { id: cre, title: "Chemical reaction engineering" }
  - { id: dat, title: "Dental Admission Test" }
  - { id: nuc, title: "Nuclear science" }
  - { id: ptable, title: "The periodic table" }
  - { id: inorg, title: "Inorganic chemistry" }
  - { id: anal, title: "Analytical chemistry" }
  - { id: space, title: "Space science" }
  - { id: earth, title: "Earth science" }

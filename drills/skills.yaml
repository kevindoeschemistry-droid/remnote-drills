  - { id: odesys.phase, domain: odesys, title: "Phase portrait type", kind: classify, aliases: [krey-ch04-phase], prereqs: [odesys.eigenvalue] }

  # ── series ──────────────────────────────────────────────────────────────
  - id: series.points

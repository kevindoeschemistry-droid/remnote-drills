  - { id: stat.fluctuations, domain: stat, title: "Energy fluctuations in the canonical ensemble", prereqs: [stat.partition-function] }
  - { id: stat.ensembles, domain: stat, title: "Other ensembles (grand canonical, isobaric)", prereqs: [stat.partition-function] }
  - { id: stat.binding, domain: stat, title: "Binding & cooperativity (Langmuir, Hill)", prereqs: [stat.partition-function] }
  - { id: stat.rates, domain: stat, title: "Rates & transition-state theory" }

  # ── K–8 mathematics (Common Core K–8; generators in src/drills/gen-k8.ts) ─────────
  # Size-specific templates (add within 10 vs within 1000) are separate names so each

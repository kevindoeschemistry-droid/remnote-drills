  - { n: 3, title: "Neural networks: the engine under the hood", skills: [aib.networks] }
  - { n: 4, title: "LLMs: key terms and basics", skills: [aib.llms] }
  - { n: 5, title: "Training: how AI actually learns (optional)", skills: [aib.training] }
  - { n: 6, title: "Using AI wisely: limits, trust and better prompts", skills: [aib.use] }
  - { n: 7, title: "AI and tools: what turns a chatbot into an agent", skills: [aib.agents] }
  - { n: 8, title: "The toolbox: choosing AI and building with it", skills: [aib.use] }
  - { n: 9, title: "Staying safe: scams, deepfakes and AI content", skills: [aib.safety] }
  - { n: 10, title: "Big questions and the road ahead", skills: [aib.future] }

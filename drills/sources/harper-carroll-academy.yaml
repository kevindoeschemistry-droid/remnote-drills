# Harper Carroll, "Academy" — a free AI course of 10 modules and 90 short videos built from her
# Instagram and YouTube explainers (harpercarroll.ai/academy, 2026). Only the module titles could
# be read; module 5 is marked optional in the course. Chapter = module.
id: harper-carroll-academy
title: "Harper Carroll — Academy (free AI course)"
short: "Carroll Academy"
edition: 2026
field: artificial intelligence
chapters:
  - { n: 1, title: "Welcome: what is AI, and why should you care?", skills: [aib.concepts] }

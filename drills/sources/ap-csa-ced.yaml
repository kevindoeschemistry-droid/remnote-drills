id: ap-csa-ced
title: "AP Computer Science A — Course and Exam Description (2025), with Python, shell and Git"
short: "AP CSA"
edition: 2025
field: computer science
chapters:
  - { n: 1, title: "Using objects and methods", skills: [prog.java-basics, prog.java-objects] }

- {"id": "ib-chemistry-2025", "name": "IB Diploma Programme Chemistry guide, first assessment 2025 (topic list)", "publisher": "International Baccalaureate", "kind": "standard", "read": "part", "url": "https://www.ibo.org/globalassets/new-structure/recognition/pdfs/dp_sciences_chemistry_subject-brief_jan_2022_e.pdf", "note": "The guide itself is sold to schools. The 22 topic codes and titles and which content is HL were read through a published topic table (myrevisionagent.com) consistent with the IB subject brief; the understandings under each topic were not read.", "items": [{"code": "S1.1", "title": "Particulate nature of matter"}, {"code": "S1.2", "title": "The nuclear atom"}, {"code": "S1.3", "title": "Electron configurations"}, {"code": "S1.4", "title": "The mole"}, {"code": "S1.5", "title": "Ideal gases"}, {"code": "S2.1", "title": "The ionic model"}, {"code": "S2.2", "title": "The covalent model"}, {"code": "S2.3", "title": "The metallic model"}, {"code": "S2.4", "title": "From models to materials"}, {"code": "S3.1", "title": "The periodic table: classification of elements"}, {"code": "S3.2", "title": "Functional groups: classification of organic compounds"}, {"code": "R1.1", "title": "Measuring enthalpy changes"}, {"code": "R1.2", "title": "Energy cycles in reactions"}, {"code": "R1.3", "title": "Energy from fuels"}, {"code": "R1.4", "title": "Entropy and spontaneity (HL)"}, {"code": "R2.1", "title": "How much? The amount of chemical change"}, {"code": "R2.2", "title": "How fast? The rate of chemical change"}, {"code": "R2.3", "title": "How far? The extent of chemical change"}, {"code": "R3.1", "title": "Proton transfer reactions"}, {"code": "R3.2", "title": "Electron transfer reactions"}, {"code": "R3.3", "title": "Electron sharing reactions"}, {"code": "R3.4", "title": "Electron-pair sharing reactions"}]}

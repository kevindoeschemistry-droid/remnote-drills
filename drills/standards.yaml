s" }, { code: "6.3.A", title: "Describe how genetic information flows from DNA to RNA to protein" }, { code: "6.4.A", title: "Explain how the phenotype of an organism is determined by its genotype" }, { code: "6.5.A", title: "Describe the types of interactions that regulate gene expression" }, { code: "6.5.B", title: "Explain how the location of regulatory sequences relates to their function" }, { code: "6.6.A", title: "Explain how transcription factor binding to promoters affects gene expression and phenotype" }, { code: "6.6.B", title: "Connect the regulation of gene expression to phenotypic differences in cells and organisms" }, { code: "6.7.A", title: "Describe the various types of mutation" }, { code: "6.7.B", title: "Explain how changes in genotype may result in changes in phenotype" }, { code: "6.7.C", title: "Explain how alterations in DNA contribute to variation subject to natural selection" }, { code: "6.8.A", title: "Explain the use of genetic engineering techniques in analyzing or manipulating DNA" }, { code: "7.1.A", title: "Describe the causes of natural selection" }, { code: "7.1.B", title: "Explain how natural selection affects populations" }, { code: "7.2.A", title: "Describe the importance of phenotypic variation in a population" }, { code: "7.2.B", title: "Explain how variation in molecules within cells connects to fitness" }, { code: "7.3.A", title: "Explain how humans can affect diversity within a population" }, { code: "7.4.A", title: "Explain how random occurrences affect the genetic makeup of a population" }, { code: "7.4.B", title: "Describe the role of random processes in the evolution of specific populations" }, { code: "7.4.C", title: "Describe the change in the genetic makeup of a population over time" }, { code: "7.5.A", title: "Describe the conditions under which allele and genotype frequencies will change" }, { code: "7.6.A", title: "Describe the types of data that provide evidence for evolution" }, { code: "7.6.B", title: "Explain how morphological, biochemical and geological data show organisms have changed over time" }, { code: "7.7.A", title: "Describe cellular and molecular evidence for common ancestry" }, { code: "7.8.A", title: "Explain how evolution is an ongoing process in all living organisms" }, { code: "7.9.A", title: "Describe the types of evidence used to infer evolutionary relationships" }, { code: "7.9.B", title: "Explain how phylogenetic trees and cladograms infer relatedness" }, { code: "7.10.A", title: "Describe the conditions under which new species may arise" }, { code: "7.10.B", title: "Describe the rate of evolution and speciation under different ecological conditions" }, { code: "7.10.C", title: "Explain the processes and mechanisms that drive speciation" }, { code: "7.11.A", title: "Explain how genetic diversity affects a population's ability to withstand environmental pressures" }, { code: "7.12.A", title: "Describe the evidence that supports models of the origin of life on Earth" }, { code: "8.1.A", title: "Explain how behavioral and physiological responses relate to environmental change" }, { code: "8.1.B", title: "Explain how behavioral responses affect fitness" }, { code: "8.2.A", title: "Describe the strategies organisms use to acquire and use energy" }, { code: "8.2.B", title: "Explain how energy flows and matter cycles through trophic levels" }, { code: "8.2.C", title: "Explain how changes in energy availability affect populations, communities and ecosystems" }, { code: "8.2.D", title: "Explain how autotrophs and heterotrophs enable the flow of energy within an ecosystem" }, { code: "8.3.A", title: "Describe factors that influence the growth dynamics of populations" }, { code: "8.4.A", title: "Explain how population density affects and is determined by resource availability" }, { code: "8.5.A", title: "Describe the structure of a community by its species composition and diversity" }, { code: "8.5.B", title: "Explain how interactions within and among populations i
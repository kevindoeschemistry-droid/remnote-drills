- { id: cpa-far, name: "Uniform CPA Examination Blueprints: Financial Accounting and Reporting (FAR)", publisher: AICPA, kind: exam-spec, read: part, url: "https://dlcp.dc.gov/sites/default/files/dc/sites/DLCP/publication/attachments/Uniform%20CPA%20Examination%20Blueprints%202.5.24.pdf", note: "Read: the FAR summary blueprint (Area I 30-40%, II 30-40%, III 25-35%) and its area, group and topic titles, from the January 2024 edition hosted by the DC licensing board, not the representative tasks. The 2026 edition (aicpa-cima.com) keeps the same groups with small task changes but could not be fetched here. Codes are area.group." , items: [{ code: "I.A", title: "General-purpose financial reporting: for-profit business entities" }, { code: "I.B", title: "General-purpose financial reporting: nongovernmental not-for-profit entities" }, { code: "I.C", title: "State and local government concepts" }, { code: "I.D", title: "Public company reporting topics" }, { code: "I.E", title: "Special purpose frameworks" }, { code: "I.F", title: "Financial statement ratios and performance metrics" }, { code: "II.A", title: "Cash and cash equivalents" }, { code: "II.B", title: "Trade receivables" }, { code: "II.C", title: "Inventory" }, { code: "II.D", title: "Property, plant and equipment" }, { code: "II.E", title: "Investments" }, { code: "II.F", title: "Intangible assets" }, { code: "II.G", title: "Payables and accrued liabilities" }, { code: "II.H", title: "Debt (financial liabilities)" }, { code: "II.I", title: "Equity" }, { code: "III.A", title: "Accounting changes and error corrections" }, { code: "III.B", title: "Contingencies and commitments" }, { code: "III.C", title: "Revenue recognition" }, { code: "III.D", title: "Accounting for income taxes" }, { code: "III.E", title: "Fair value measurements" }, { code: "III.F", title: "Lessee accounting" }, { code: "III.G", title: "Subsequent events" }] }

# there; a type may also appear later in the test, never earlier.
- id: uil-number-sense
  name: UIL Number Sense Problem Sequencing Charts (High School; A+ Junior High and Elementary, rev. 2016-17) with the Number Sense Handbook rules
  publisher: University Interscholastic League (Texas)
  kind: exam-spec
  read: full
  url: https://www.uiltexas.org/academics/stem/number-sense
  note: "80 problems in 10 minutes, mental only, answers written with no scratch work; every tenth problem is an estimate accepted within 5 percent. The handbook was read for the rules; the three charts were read for the topics."

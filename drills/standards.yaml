rgin of error for a t-interval" }, { code: "4.3.A", title: "Interpret a t-interval in context" }, { code: "4.3.B", title: "Justify a claim based on a t-interval" }, { code: "4.3.C", title: "Relate sample size, width, confidence level and margin of error for a mean" }, { code: "4.4.A", title: "Identify the testing method and parameter for a mean" }, { code: "4.4.B", title: "Identify hypotheses for a mean" }, { code: "4.4.C", title: "Verify conditions for a t-test" }, { code: "4.5.A", title: "Calculate the test statistic and p-value for a mean" }, { code: "4.5.B", title: "Interpret the p-value of a t-test" }, { code: "4.5.C", title: "Justify a claim based on a t-test" }, { code: "4.6.A", title: "Calculate the mean and SD of the difference of sample means" }, { code: "4.6.B", title: "Justify conditions for the difference of sample means" }, { code: "4.6.C", title: "Interpret the sampling distribution of the difference of means" }, { code: "4.7.A", title: "Identify the interval procedure for a difference of means" }, { code: "4.7.B", title: "Verify conditions for a two-sample t-interval" }, { code: "4.7.C", title: "Calculate a two-sample t-interval" }, { code: "4.7.D", title: "Calculate standard error and margin of error for a two-sample interval" }, { code: "4.8.A", title: "Interpret a two-sample t-interval" }, { code: "4.8.B", title: "Justify a claim based on a two-sample t-interval" }, { code: "4.9.A", title: "Identify the testing method for a difference of means" }, { code: "4.9.B", title: "Identify hypotheses for a difference of means" }, { code: "4.9.C", title: "Verify conditions for a two-sample t-test" }, { code: "4.10.A", title: "Calculate the test statistic and p-value for two means" }, { code: "4.10.B", title: "Interpret the p-value of a two-sample t-test" }, { code: "4.10.C", title: "Justify a claim based on a two-sample t-test" }, { code: "5.1.A", title: "Construct scatterplots" }, { code: "5.1.B", title: "Describe scatterplots" }, { code: "5.1.C", title: "
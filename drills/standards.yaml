- { id: bluedot-biosecurity, name: "BlueDot Impact, Biosecurity course (six units)", publisher: BlueDot Impact, kind: course, read: part, url: "https://bluedot.org/courses/biosecurity", note: "The course outline (unit and section titles) was read in Nov 2026; the readings sit behind sign-in. Kevin helped restructure it into this six-unit form and facilitates it. The objectives under each unit are ours.", items: [{ code: "1", title: "Building a pandemic-proof world" }, { code: "2", title: "Preventing engineered pandemics (Prevent)" }, { code: "3", title: "Detecting early infections (Detect)" }, { code: "4", title: "Blocking transmission (Withstand)" }, { code: "5", title: "Exiting the pandemic (Combat)" }, { code: "6", title: "Contributing to biosecurity" }] }

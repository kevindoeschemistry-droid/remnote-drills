- { id: snapshot-key-numbers, name: "Moran, Phillips & Milo, SnapShot: Key Numbers in Biology (Cell 141, 2010)", publisher: Cell Press, kind: reference, read: full, url: "https://doi.org/10.1016/j.cell.2010.06.019", note: "A published one-page list of 25 rule-of-thumb numbers for cell biology (sizes, concentrations, energetics, rates, genomes). The nearest thing found to a list of magnitudes worth carrying; it covers biology, not chemistry. Read from a posted copy of the sheet.", items: [{ code: "sizes", title: "Cell sizes" }, { code: "lengths", title: "Length scales inside cells" }, { code: "rates", title: "Rates and time scales" }, { code: "concentrations", title: "Concentrations" }, { code: "energetics", title: "Energetics" }, { code: "diffusion", title: "Diffusion and catalysis" }, { code: "genomes", title: "Genomes" }, { code: "errors", title: "Mutation and error rates" }] }
- { id: francl-take-a-number, name: "Francl, Take a number (Nature Chemistry 5, 725, 2013)", publisher: Nature Chemistry, kind: reference, read: crosswalk, note: "An essay arguing that estimation from anchor values is a core chemist's skill; it names a few anchors (room temperature, the C-C bond length, common atomic masses). Paywalled: seen only through the author's blog post and two commentaries. An essay, not a standard." }
- { id: iupac-aa-1983, name: "IUPAC-IUB JCBN, Nomenclature and Symbolism for Amino Acids and Peptides (Recommendations 1983)", publisher: IUPAC-IUB Joint Commission on Biochemical Nomenclature, kind: reference, read: part, url: "https://iupac.qmul.ac.uk/AminoAcid/AA1n2.html", note: "The source of truth for the names, symbols and structures of the 20 coded amino acids (3AA-1, Table 1, read in the web edition; the rest of the recommendations was not read). The table prints neutral forms, and shows His, Pro, Trp and Tyr as pictures, so those four were drawn from their systematic names. It says what each structure is, not which ones a student should be able to draw: asking for all 20 is the usual biochemistry-course expectation, a house decision.", items: [{ code: "3AA-1", title: "Names, symbols and formulas of the common amino acids (Table 1)" }] }
- { id: mit-18-03-coverup, name: "Mattuck, Heaviside's Cover-up Method (MIT 18.03 supplementary notes, section H)", publisher: MIT Department of Mathematics, kind: course, read: part, url: "https://math.mit.edu/~jorloff/suppnotes/suppnotes03/h.pdf", note: "A course note, not a standard: the technique and the three cases it covers. Seen in excerpts of the note and of its 18.03SC and 18.04 reprints, not read end to end.", items: [{ code: "distinct", title: "Distinct linear factors" }, { code: "repeated", title: "Repeated linear factor: highest power only" }, { code: "quadratic", title: "Linear factor beside a quadratic factor" }] }
- { id: mit-integration-bee, name: "MIT Integration Bee qualifying test (format as of 2026)", publisher: MIT Department of Mathematics, kind: rulebook, read: part, url: "https://math.mit.edu/~yyao1/integrationbee.html", note: "A competition format, not a curriculum: 20 integrals in 20 minutes with only answers written. Used for the pace (an integral a minute) and nothing else; its integrals are far harder than the items here. The format page was read; the past papers were only sampled.", items: [{ code: "pace", title: "Qualifier: 20 integrals in 20 minutes" }] }
- { id: bruice-8e, name: "Bruice, Organic Chemistry, 8th edition (table of contents)", publisher: Pearson, kind: textbook, read: part, url: "https://www.pearson.com/en-us/subject-catalog/p/organic-chemistry/P200000006995/9780134066585", note: "A textbook's contents, not a standard: it says which families of compounds an organic course covers (chapters 18-26 seen on the publisher's page), not which structures must be drawn from memory. The compounds chosen for each chapter are a house list.", items: [{ code: "18", title: "Benzene and substituted benzenes" }, { code: "19", title: "Amines and heterocyclic compounds" }, { code: "20", title: "Carbohydrates" }, { code: "21", title: "Amino acids, peptides and proteins" }, { code: "22", title: "Catalysis in organic and enzymatic reactions" }, { code: "23", title: "Coenzymes" }, { code: "24", title: "Metabolic pathways" }, { code: "25", title: "Lipids" }, { code: "26", title: "Nucleic acids" }] }
- { id: nrc-gfe, name: "NRC Generic Fundamentals Examination, reactor theory topics (PWR catalog 192001-192008)", publisher: U.S. Nuclear Regulatory Commission, kind: exam-spec, read: part, url: "https://www.nrc.gov/reactors/operator-licensing/history-rulemaking-activities/generic-fundamentals-examinations/pwr/reactor-theory-pwr.html", note: "The fundamentals exam for reactor operator candidates: reactor theory is 14 of its 50 questions. The topic list was read; the knowledge statements under each topic and the question bank were only sampled. It covers reactor theory, not nuclear physics or radiation protection, and is written for operators, not designers.", items: [{ code: "192001", title: "Neutrons" }, { code: "192002", title: "Neutron life cycle" }, { code: "192003", title: "Reactor kinetics and neutron sources" }, { code: "192004", title: "Reactivity coefficients" }, { code: "192005", title: "Control rods" }, { code: "192006", title: "Fission product poisons" }, { code: "192007", title: "Fuel depletion and burnable poisons" }, { code: "192008", title: "Reactor operational physics" }] }
- { id: doe-hdbk-1019, name: "DOE Fundamentals Handbook, Nuclear Physics and Reactor Theory (DOE-HDBK-1019/1-93, /2-93)", publisher: U.S. Department of Energy, kind: textbook, read: part, url: "https://www.standards.doe.gov/standards-documents/1000/1019-bhdbk-1993-v1", note: "A training handbook with stated learning objectives, public and long used as the open text; cancelled as a DOE standard in 2016. Its abstract, overview and module list were read, not the modules themselves.", items: [{ code: "1", title: "Atomic and nuclear physics" }, { code: "2", title: "Reactor theory: neutron characteristics" }, { code: "3", title: "Reactor theory: nuclear parameters" }, { code: "4", title: "Reactor theory: reactor operations" }] }
- { id: iupac-periodic-table, name: "IUPAC Periodic Table of the Elements (release of 4 May 2022)", publisher: International Union of Pure and Applied Chemistry, kind: reference, read: part, url: "https://iupac.org/what-we-do/periodic-table-of-elements/", note: "The reference for names, symbols, atomic numbers and the 1-18 group numbering. Only the release note on IUPAC's page was seen in this session, not the table file itself; the element list was written from memory and is cross-checked by a second copy in the verifier. It says what the table is, not how much of it to know by heart: asking for all of it, d and f blocks first, is what Kevin's organometallics course required. IUPAC has not settled group 3 below yttrium, so no item asks it.", items: [{ code: "sp", title: "s and p blocks" }, { code: "d", title: "d block, groups 3-12" }, { code: "f", title: "Lanthanoids and actinoids" }] }
- { id: ap-statistics-2026, name: "AP Statistics revised course framework (2026-27)", publisher: College Board, kind: standard, read: part, url: "https://apcentral.collegeboard.org/courses/ap-statistics", note: "The course was revised for 2026-27 from nine units to five. Only the unit list and exam weightings on the course page were read in this session, not the framework's learning objectives; the objectives in our framework are a house list hung on those five units.", items: [{ code: "1", title: "Exploring One-Variable Data and Collecting Data" }, { code: "2", title: "Probability, Random Variables, and Probability Distributions" }, { code: "3", title: "Inference for Categorical Data: Proportions" }, { code: "4", title: "Inference for Quantitative Data: Means" }, { code: "5", title: "Regression Analysis" }] }

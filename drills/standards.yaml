# ── quick recall: mental calculation, estimation and anchor quantities ──────────────────────────
# The UIL charts are the only published, itemised statement of what mental calculation covers that
# was found and read (November 2026). Each range lists the problem types that may first appear
# there; a type may also appear later in the test, never earlier.
- id: uil-number-sense
  name: UIL Number Sense Problem Sequencing Charts (High School; A+ Junior High and Elementary, rev. 2016-17) with the Number Sense Handbook rules
  publisher: University Interscholastic League (Texas)
  kind: exam-spec
  read: full
  url: https://www.uiltexas.org/academics/stem/number-sense
  note: "80 problems in 10 minutes, mental only, answers written with no scratch work; every tenth problem is an estimate accepted within 5 percent. The handbook was read for the rules; the three charts were read for the topics."
  items:
    - { code: "H1", title: "High school, problems 1–20", parts: { "1": "Four operations on integers, mixed numbers, fractions, decimals", "2": "Order of operations", "3": "Distributive property", "4": "Comparing fractions and decimals", "5": "Multiplication short-cuts", "6": "Squaring numbers", "7": "Conversions (percent/fraction, English/metric, Roman numerals, measurement units)", "8": "GCD and LCM", "9": "Percent problems", "10": "Mean, median, mode", "11": "Sums of integers", "12": "Remainder problems", "13": "Consumer problems", "14": "Number theory (primes, divisors, sums of divisors)" } }
    - { code: "H2", title: "High school, problems 21–40", parts: { "1": "Powers of numbers", "2": "Substitution", "3": "Word problems", "4": "Inverses", "5": "Absolute value", "6": "Ratio and proportion", "7": "Square and cube roots", "8": "Sets", "9": "Base conversions", "10": "Simple equations", "11": "Systems of equations", "12": "Repeating decimals to fractions", "13": "More remainder problems", "14": "Perimeter and area of polygons and circles", "15": "Sequences", "16": "Quadratic and cubic equations" } }
    - { code: "H3", title: "High school, problems 41–60", parts: { "1": "Laws of exponents", "2": "Right triangles", "3": "Coordinate geometry", "4": "Regular polygons", "5": "Inequalities", "6": "Applications of geometry theorems", "7": "Direct and inverse variation", "8": "Sequences and series, finite and infinite", "9": "Complex numbers", "10": "Logarithms and logarithmic equations", "11": "Factorials, permutations, combinations", "12": "Probability and odds", "13": "Conics", "14": "Binomial theorem", "15": "Operations in other bases", "16": "Roots of equations", "17": "Polygonal numbers" } }

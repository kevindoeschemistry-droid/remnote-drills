# ── quick recall: mental calculation, estimation and anchor quantities ──────────────────────────
# The UIL charts are the only published, itemised statement of what mental calculation covers that
# was found and read (November 2026). Each range lists the problem types that may first appear
# there; a type may also appear later in the test, never earlier.
- id: uil-number-sense
  name: UIL Number Sense Problem Sequencing Charts (High School; A+ Junior High and Elementary, rev. 2016-17) with the Number Sense Handbook rules
  publisher: University Interscholastic League (Texas)
  kind: exam-spec
  read: full
  url: https://www.uiltexas.org/academics/stem/number-sense
  note: "80 problems in 10 minutes, mental only, answers written with no scratch work; every tenth problem is an estimate accepted within 5 percent. The handbook was read for the rules; the three charts were read for the topics."
  items:
    - { code: "H1", title: "High school, problems 1–20", parts: { "1": "Four operations on integers, mixed numbers, fractions, decimals", "2": "Order of operations", "3": "Distributive property", "4": "Comparing fractions and decimals", "5": "Multiplication short-cuts", "6": "Squaring numbers", "7": "Conversions (percent/fraction, English/metric, Roman numerals, measurement units)", "8": "GCD and LCM", "9": "Percent problems", "10": "Mean, median, mode", "11": "Sums of integers", "12": "Remainder problems", "13": "Consumer problems", "14": "Number theory (primes, divisors, sums of divisors)" } }
    - { code: "H2", title: "High school, problems 21–40", parts: { "1": "Powers of numbers", "2": "Substitution", "3": "Word problems", "4": "Inverses", "5": "Absolute value", "6": "Ratio and proportion", "7": "Square and cube roots", "8": "Sets", "9": "Base conversions", "10": "Simple equations", "11": "Systems of equations", "12": "Repeating decimals to fractions", "13": "More remainder problems", "14": "Perimeter and area of polygons and circles", "15": "Sequences", "16": "Quadratic and cubic equations" } }
    - { code: "H3", title: "High school, problems 41–60", parts: { "1": "Laws of exponents", "2": "Right triangles", "3": "Coordinate geometry", "4": "Regular polygons", "5": "Inequalities", "6": "Applications of geometry theorems", "7": "Direct and inverse variation", "8": "Sequences and series, finite and infinite", "9": "Complex numbers", "10": "Logarithms and logarithmic equations", "11": "Factorials, permutations, combinations", "12": "Probability and odds", "13": "Conics", "14": "Binomial theorem", "15": "Operations in other bases", "16": "Roots of equations", "17": "Polygonal numbers" } }
    - { code: "H4", title: "High school, problems 61–70", parts: { "1": "Volume and surface area", "2": "Greatest integer", "3": "Remainder theorem", "4": "Trigonometry", "5": "Determinants", "6": "Matrices", "7": "Vectors", "8": "Composite functions", "9": "Bases with decimals or fractions", "10": "Polar and rectangular coordinates" } }
    - { code: "H5", title: "High school, problems 71–80", parts: { "1": "Function domains and ranges", "2": "Modular arithmetic", "3": "Limits", "4": "Derivatives", "5": "Slopes of tangent lines", "6": "Horizontal and vertical asymptotes", "7": "Critical values", "8": "Maximum and minimum problems", "9": "Definite integration", "10": "Inverse functions" } }
    - { code: "J1", title: "Junior high, problems 1–20", parts: { "1": "Four operations on whole numbers, fractions, decimals", "2": "Order of operations", "3": "Distributive property", "4": "Comparing fractions and decimals", "5": "Multiplication short-cuts", "6": "Squaring numbers", "7": "Roman numerals", "8": "Mean, median, mode", "9": "Sums of a finite series of whole numbers" } }
    - { code: "J2", title: "Junior high, problems 21–40", parts: { "1": "Four operations on mixed numbers and integers", "2": "More multiplication short-cuts", "3": "Percent problems", "4": "Conversions (English/metric, length, area, capacity, time)", "5": "Consumer problems", "6": "Substitution", "7": "Simple equations", "8": "Square and cube roots", "9": "GCD and LCM", "10": "Number theory (primes and divisors)", "11": "Perimeter and area of square, rectangle, circle", "12": "Ratio and proportion", "13": "Inverses", "14": "Multiplying by 101 and 111" } }
    - { code: "J3", title: "Junior high, problems 41–60", parts: { "1": "Sets", "2": "Word problems", "3": "Pythagorean theorem", "4": "Sequences", "5": "Volume and surface area of a rectangular solid", "6": "Base systems: conversions and basic operations", "7": "Area of parallelogram, rhombus, trapezoid, circle", "8": "Inequalities", "9": "Basic geometry facts", "10": "Remainder problems" } }
    - { code: "J4", title: "Junior high, problems 61–80", parts: { "1": "Repeating decimals", "2": "More number theory", "3": "Powers of numbers", "4": "Volume of cylinder, cone, sphere", "5": "Sequences and series", "6": "Factorial", "7": "Coordinate geometry", "8": "Probability and odds", "9": "Advanced percent problems", "10": "More remainder problems", "11": "More multiplication short-cuts" } }
    - { code: "E1", title: "Elementary, problems 1–20", parts: { "1": "Four operations on whole numbers", "2": "Place value", "3": "Rounding whole numbers", "4": "Multiplication short-cuts", "5": "Remainder problems", "6": "Even and odd numbers", "7": "Expanded notation", "8": "Sums with regrouping", "9": "Differences with regrouping", "10": "Roman numerals" } }
    - { code: "E2", title: "Elementary, problems 21–40", parts: { "1": "Adding and subtracting fractions with common denominators", "2": "Four operations on decimals", "3": "Comparing decimals and fractions", "4": "Conversions among fraction, decimal, percent", "5": "Order of operations", "6": "More multiplication short-cuts", "7": "Ratio and proportion", "8": "Consumer problems", "9": "Prime numbers", "10": "GCD and LCM", "11": "Conversions of length, measurement, time" } }
    - { code: "E3", title: "Elementary, problems 41–60", parts: { "1": "Four operations on fractions and mixed numbers", "2": "Substitution", "3": "Perimeter and area of square, rectangle, triangle", "4": "Radius and diameter of a circle", "5": "Powers and roots", "6": "Simple equations", "7": "Sequences", "8": "Sets", "9": "Word problems", "10": "Volume of cube and rectangular box", "11": "Right triangles", "12": "More multiplication short-cuts", "13": "Base conversions" } }
    - { code: "E4", title: "Elementary, problems 61–80", parts: { "1": "Four operations on integers", "2": "Inverses", "3": "Basic geometry facts", "4": "More area problems", "5": "Squaring two-digit numbers", "6": "More multiplication short-cuts", "7": "More powers and roots", "8": "More consumer problems", "9": "Inequalities", "10": "Probability", "11": "Area of parallelogram, rhombus, trapezoid", "12": "Number-line coordinate geometry", "13": "More percent problems" } }
- { id: so-fermi, name: "Science Olympiad Fermi Questions event rules (Division C)", publisher: Science Olympiad, kind: rulebook, read: part, note: "Read: the answer format (the power of ten only; a coefficient of 5 or more rounds up) from a state copy of the rules. The scoring table (5 points exact, 3 for one power off) was seen only in secondary sources. It says how an estimate is scored, not which quantities to know." }
- { id: sta-mtc, name: "Multiplication tables check assessment framework (England, key stage 2)", publisher: Standards and Testing Agency, kind: exam-spec, read: part, note: "Read: the Department for Education announcement (25 questions on the 2 to 12 tables, 6 seconds each). The framework document itself was not opened." }
- { id: codata-2022, name: "CODATA Recommended Values of the Fundamental Physical Constants: 2022 (NIST SP 961)", publisher: "CODATA / NIST", kind: reference, read: part, url: "https://physics.nist.gov/constants", note: "The source of truth for constants an anchor card quotes. It does not say which constants a chemist should know by heart: that list is ours." }
- { id: cfr-21-101-9, name: "21 CFR 101.9(b)(5)(viii): household measures for nutrition labeling", publisher: US FDA, kind: reference, read: part, note: "One paragraph, read as quoted in FDA guidance: teaspoon 5 mL, tablespoon 15 mL, cup 240 mL, fluid ounce 30 mL, ounce 28 g." }
- { id: snapshot-key-numbers, name: "Moran, Phillips & Milo, SnapShot: Key Numbers in Biology (Cell 141, 2010)", publisher: Cell Press, kind: reference, read: full, url: "https://doi.org/10.1016/j.cell.2010.06.019", note: "A published one-page list of 25 rule-of-thumb numbers for cell biology (sizes, concentrations, energetics, rates, genomes). The nearest thing found to a list of magnitudes worth carrying; it covers biology, not chemistry. Read from a posted copy of the sheet.", items: [{ code: "sizes", title: "Cell sizes" }, { code: "lengths", title: "Length scales inside cells" }, { code: "rates", title: "Rates and time scales" }, { code: "concentrations", title: "Concentrations" }, { code: "energetics", title: "Energetics" }, { code: "diffusion", title: "Diffusion and catalysis" }, { code: "genomes", title: "Genomes" }, { code: "errors", title: "Mutation and error rates" }] }
- { id: francl-take-a-number, name: "Francl, Take a number (Nature Chemistry 5, 725, 2013)", publisher: Nature Chemistry, kind: reference, read: crosswalk, note: "An essay arguing that estimation from anchor values is a core chemist's skill; it names a few anchors (room temperature, the C-C bond length, common atomic masses). Paywalled: seen only through the author's blog post and two commentaries. An essay, not a standard." }
- { id: iupac-aa-1983, name: "IUPAC-IUB JCBN, Nomenclature and Symbolism for Amino Acids and Peptides (Recommendations 1983)", publisher: IUPAC-IUB Joint Commission on Biochemical Nomenclature, kind: reference, read: part, url: "https://iupac.qmul.ac.uk/AminoAcid/AA1n2.html", note: "The source of truth for the names, symbols and structures of the 20 coded amino acids (3AA-1, Table 1, read in the web edition; the rest of the recommendations was not read). The table prints neutral forms, and shows His, Pro, Trp and Tyr as pictures, so those four were drawn from their systematic names. It says what each structure is, not which ones a student should be able to draw: asking for all 20 is the usual biochemistry-course expectation, a house decision.", items: [{ code: "3AA-1", title: "Names, symbols and formulas of the common amino acids (Table 1)" }] }
- { id: mit-18-03-coverup, name: "Mattuck, Heaviside's Cover-up Method (MIT 18.03 supplementary notes, section H)", publisher: MIT Department of Mathematics, kind: course, read: part, url: "https://math.mit.edu/~jorloff/suppnotes/suppnotes03/h.pdf", note: "A course note, not a standard: the technique and the three cases it covers. Seen in excerpts of the note and of its 18.03SC and 18.04 reprints, not read end to end.", items: [{ code: "distinct", title: "Distinct linear factors" }, { code: "repeated", title: "Repeated linear factor: highest power only" }, { code: "quadratic", title: "Linear factor beside a quadratic factor" }] }
- { id: mit-integration-bee, name: "MIT Integration Bee qualifying test (format as of 2026)", publisher: MIT Department of Mathematics, kind: rulebook, read: part, url: "https://math.mit.edu/~yyao1/integrationbee.html", note: "A competition format, not a curriculum: 20 integrals in 20 minutes with only answers written. Used for the pace (an integral a minute) and nothing else; its integrals are far harder than the items here. The format page was read; the past papers were only sampled.", items: [{ code: "pace", title: "Qualifier: 20 integrals in 20 minutes" }] }
- { id: bruice-8e, name: "Bruice, Organic Chemistry, 8th edition (table of contents)", publisher: Pearson, kind: textbook, read: part, url: "https://www.pearson.com/en-us/subject-catalog/p/organic-chemistry/P200000006995/9780134066585", note: "A textbook's contents, not a standard: it says which families of compounds an organic course covers (chapters 18-26 seen on the publisher's page), not which structures must be drawn from memory. The compounds chosen for each chapter are a house list.", items: [{ code: "18", title: "Benzene and substituted benzenes" }, { code: "19", title: "Amines and heterocyclic compounds" }, { code: "20", title: "Carbohydrates" }, { code: "21", title: "Amino acids, peptides and proteins" }, { code: "22", title: "Catalysis in organic and enzymatic reactions" }, { code: "23", title: "Coenzymes" }, { code: "24", title: "Metabolic pathways" }, { code: "25", title: "Lipids" }, { code: "26", title: "Nucleic acids" }] }
- { id: nrc-gfe, name: "NRC Generic Fundamentals Examination, reactor theory topics (PWR catalog 192001-192008)", publisher: U.S. Nuclear Regulatory Commission, kind: exam-spec, read: part, url: "https://www.nrc.gov/reactors/operator-licensing/history-rulemaking-activities/generic-fundamentals-examinations/pwr/reactor-theory-pwr.html", note: "The fundamentals exam for reactor operator candidates: reactor theory is 14 of its 50 questions. The topic list was read; the knowledge statements under each topic and the question bank were only sampled. It covers reactor theory, not nuclear physics or radiation protection, and is written for operators, not designers.", items: [{ code: "192001", title: "Neutrons" }, { code: "192002", title: "Neutron life cycle" }, { code: "192003", title: "Reactor kinetics and neutron sources" }, { code: "192004", title: "Reactivity coefficients" }, { code: "192005", title: "Control rods" }, { code: "192006", title: "Fission product poisons" }, { code: "192007", title: "Fuel depletion and burnable poisons" }, { code: "192008", title: "Reactor operational physics" }] }
- { id: doe-hdbk-1019, name: "DOE Fundamentals Handbook, Nuclear Physics and Reactor Theory (DOE-HDBK-1019/1-93, /2-93)", publisher: U.S. Department of Energy, kind: textbook, read: part, url: "https://www.standards.doe.gov/standards-documents/1000/1019-bhdbk-1993-v1", note: "A training handbook with stated learning objectives, public and long used as the open text; cancelled as a DOE standard in 2016. Its abstract, overview and module list were read, not the modules themselves.", items: [{ code: "1", title: "Atomic and nuclear physics" }, { code: "2", title: "Reactor theory: neutron characteristics" }, { code: "3", title: "Reactor theory: nuclear parameters" }, { code: "4", title: "Reactor theory: reactor operations" }] }
- { id: iupac-periodic-table, name: "IUPAC Periodic Table of the Elements (release of 4 May 2022)", publisher: International Union of Pure and Applied Chemistry, kind: reference, read: part, url: "https://iupac.org/what-we-do/periodic-table-of-elements/", note: "The reference for names, symbols, atomic numbers and the 1-18 group numbering. Only the release note on IUPAC's page was seen in this session, not the table file itself; the element list was written from memory and is cross-checked by a second copy in the verifier. It says what the table is, not how much of it to know by heart: asking for all of it, d and f blocks first, is what Kevin's organometallics course required. IUPAC has not settled group 3 below yttrium, so no item asks it.", items: [{ code: "sp", title: "s and p blocks" }, { code: "d", title: "d block, groups 3-12" }, { code: "f", title: "Lanthanoids and actinoids" }] }
- { id: ap-statistics-2026, name: "AP Statistics Course and Exam Description (effective fall 2026)", publisher: College Board, kind: standard, read: part, url: "https://apcentral.collegeboard.org/media/pdf/ap-statistics-course-and-exam-description-effective-fall-2026.pdf", note: "The revised course (2026-27) has five units. All 150 learning objectives were read from the fall 2026 CED (Nov 2026); titles here are shortened paraphrases, and essential knowledge statements were not read item by item. Unit codes 1-5 stay as items for unit-level citations.", items: [{ code: "1", title: "Exploring One-Variable Data and Collecting Data" }, { code: "2", title: "Probability, Random Variables, and Probability Distributions" }, { code: "3", title: "Inference for Categorical Data: Proportions" }, { code: "4", title: "Inference for Quantitative Data: Means" }, { code: "5", title: "Regression Analysis" }, { code: "1.1.A", title: "Identify components within a statistical study" }, { code: "1.1.B", title: "Determine an investigative question within a statistical study" }, { code: "1.2.A", title: "Identify observational units, variables, parameters and statistics" }, { code: "1.2.B", title: "Identify types of variables" }, { code: "1.2.C", title: "Identify types of quantitative variables" }, { code: "1.3.A", title: "Construct tables for one categorical variable" }, { code: "1.3.B", title: "Describe categorical tables with summary statistics" }, { code: "1.4.A", title: "Construct graphs for one categorical variable" }, { code: "1.4.B", title: "Justify a claim using categorical graphs" }, { code: "1.4.C", title: "Compare categorical tables and graphs" }, { code: "1.5.A", title: "Construct graphs for one quantitative variable" }, { code: "1.6.A", title: "Describe distributions of quantitative graphs" }, { code: "1.6.B", title: "Justify a claim using quantitative distributions" }, { code: "1.7.A", title: "Calculate measures of center and position" }, { code: "1.7.B", title: "Calculate mea
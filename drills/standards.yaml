# Outside standards the frameworks stand on.
#
# The house standard is our own: every objective has a code (HT-2.2.A) that never changes, and the
# frameworks are written to fit together along one path. Outside standards are what that house
# standard is checked against. A framework declares its `basis` (which of these it leans on and
# how firmly), and units, topics or objectives cite outside items with `std: ["fe-chemical:7.F"]`.
#
#   kind   standard     a curriculum or content standard (what to learn, in what structure)
#          exam-spec    a published exam blueprint (what is tested, with weights)
#          course       a course syllabus
#          rubric       a scoring instrument
#          rulebook     competition rules (what is legal and how it is scored, not what to learn)
#          textbook     a book's table of contents
#          reference    authoritative values or definitions (constants, unit definitions): a source of
#                       truth for a number, not a statement of what to learn
#   read   full         the standard's own text was read
#          part         only some of it could be read
#          crosswalk    read through someone else's correlation table
#          none         named but not opened
#   items  the standard's own outline, when it has been read closely enough to cite item by item.
#          Titles are shortened; the standard's wording is not reproduced.
#
# scripts/standards.mjs checks every citation against this file and writes docs/coverage/standards.md.

- id: fe-chemical
  name: NCEES FE Chemical CBT Exam Specifications (effective July 2020)
  publisher: NCEES
  kind: exam-spec
  read: full
  url: https://ncees.org/wp-content/uploads/2022/09/FE-Che-CBT-specs.pdf
  items:
    - { code: "1", title: "Mathematics", weight: "6–9", parts: { A: "Analytic geometry, logarithms, trigonometry", B: "Calculus", C: "Differential equations", D: "Numerical methods", E: "Algebra, matrices, systems of equations", F: "Accuracy, precision, significant figures" } }
    - { code: "2", title: "Probability and Statistics", weight: "4–6", parts: { A: "Probability distributions", B: "Expected value in decisions", C: "Hypothesis testing and experimental design", D: "Central tendency and dispersion", E: "Regression and curve fitting", F: "Statistical control limits" } }
    - { code: "3", title: "Engineering Sciences", weight: "4–6", parts: { A: "Basic dynamics", B: "Work, energy, power", C: "Electricity and circuit laws" } }
    - { code: "4", title: "Materials Science", weight: "4–6", parts: { A: "Chemical, mechanical and physical properties", B: "Material types and compatibility", C: "Corrosion mechanisms and control", D: "Polymers, ceramics, composites" } }
    - { code: "5", title: "Chemistry and Biology", weight: "7–11", parts: { A: "Inorganic chemistry (acids and bases, redox, pH, electrochemistry)", B: "Organic chemistry", C: "Analytical chemistry", D: "Biochemistry, microbiology, molecular biology", E: "Bioprocessing" } }
    - { code: "6", title: "Fluid Mechanics/Dynamics", weight: "8–12", parts: { A: "Fluid properties", B: "Dimensionless numbers", C: "Mechanical energy balance", D: "Bernoulli equation", E: "Laminar and turbulent flow", F: "Flow measurement", G: "Pumps, turbines, compressors, vacuum systems", H: "Compressible flow and non-Newtonian fluids" } }
    - { code: "7", title: "Thermodynamics", weight: "8–12", parts: { A: "Properties of pure components and mixtures", B: "Property data and phase diagrams", C: "First and second laws", D: "Processes (isothermal, adiabatic, isentropic, phase change)", E: "Cycles and efficiencies", F: "Phase equilibrium (fugacity, activity, Raoult's law)", G: "Chemical equilibrium", H: "Heats of reaction and mixing" } }
    - { code: "8", title: "Material/Energy Balances", weight: "10–15", parts: { A: "Steady-state mass balance", B: "Unsteady-state mass balance", C: "Steady-state energy balance", D: "Unsteady-state energy balance", E: "Recycle and bypass", F: "Reactive systems (combustion)" } }
    - { code: "9", title: "Heat Transfer", weight: "8–12", parts: { A: "Conductive", B: "Convective (natural and forced)", C: "Radiation", D: "Heat-transfer coefficients (overall, local, fouling)", E: "Equipment design (double pipe, shell and tube, LMTD, NTU)" } }
    - { code: "10", title: "Mass Transfer and Separation", weight: "8–12", parts: { A: "Molecular diffusion", B: "Convective mass transfer", C: "Separation systems", D: "Equilibrium stage methods", E: "Continuous contact methods", F: "Humidification, drying, evaporation" } }
    - { code: "11", title: "Solids Handling", weight: "3–5", parts: { A: "Particle properties", B: "Processing (crushing, grinding, crystallization)", C: "Transport and storage" } }
    - { code: "12", title: "Chemical Reaction Engineering", weight: "7–11", parts: { A: "Reaction rates and order", B: "Rate constants (Arrhenius)", C: "Conversion, yield, selectivity", D: "Reaction types (series, parallel, homogeneous, heterogeneous, biological)", E: "Reactor types (batch, CSTR, PFR, semibatch)", F: "Catalysis" } }
    - { code: "13", title: "Economics", weight: "4–6", parts: { A: "Time value of money", B: "Economic analyses", C: "Uncertainty", D: "Project selection" } }
    - { code: "14", title: "Process Design", weight: "7–11", parts: { A: "PFDs and P&IDs", B: "Equipment selection, sizing, scale-up", C: "Cost estimation", D: "Design and optimization", E: "Design standards" } }
    - { code: "15", title: "Process Control", weight: "4–6", parts: { A: "Dynamics (first and second order, time constants, stability)", B: "Control strategies", C: "Loop design and hardware" } }
    - { code: "16", title: "Safety, Health, and Environment", weight: "5–8", parts: { A: "Hazardous material properties", B: "Industrial hygiene", C: "Process safety and risk", D: "Over- and underpressure protection", E: "Waste minimization, treatment, regulation", F: "Reactivity hazards" } }
    - { code: "17", title: "Ethics and Professional Practice", weight: "3–5", parts: { A: "Codes of ethics", B: "Agreements and contract law", C: "Public health, safety, and welfare", D: "Intellectual property" } }


- {"id": "petsev-edl", "name": "Petsev, van Swol and Frink, Molecular Theory of Electric Double Layers (IOP Publishing, 2021)", "publisher": "IOP Publishing", "kind": "textbook", "read": "part", "url": "https://doi.org/10.1088/978-0-7503-2276-8", "note": "Course text (Nov 2026). Read: the contents, every numbered equation with its surrounding text, and the conclusions of chapters 8-13; long derivations in chapters 6-7 and 14-16 were skimmed. A textbook, not a standard: the framework follows its chapters.", "items": [{"code": "1", "title": "Introduction: a historical overview"}, {"code": "2", "title": "The origin of charge at interfaces involving electrolyte solutions"}, {"code": "3", "title": "Continuum models of the electric double layers"}, {"code": "4", "title": "Integral equation theory"}, {"code": "5", "title": "Perturbation and mean field theory"}, {"code": "6", "title": "Density functional theory"}, {"code": "7", "title": "Classical-DFT for electrolyte interfaces"}, {"code": "8", "title": "Molecular properties of a single electric double layer"}, {"code": "9", "title": "Ionic solvation effects and solvent-solvent interactions"}, {"code": "10", "title": "Surface solvation and non-Coulombic ion-surface interactions"}, {"code": "11", "title": "The potential distribution in the EDL and its relationship to the fluid charge"}, {"code": "12", "title": "Electric double layers containing multivalent ions"}, {"code": "13", "title": "Ionic size effects"}, {"code": "14", "title": "Molecular simulation: methods"}, {"code": "15", "title": "Molecular simulation: applications"}, {"code": "16", "title": "Numerical methods for classical-DFT"}, {"code": "A", "title": "Appendix: Poisson-Nernst-Planck"}]}
- {"id": "uci-cbe-core", "name": "UC Irvine Chemical and Biomolecular Engineering graduate core: CBE 200, 210, 220A, 220B and 240 (catalogue descriptions, 2025-26)", "publisher": "University of California, Irvine", "kind": "course", "read": "part", "url": "https://catalogue.uci.edu/allcourses/cbe/", "note": "Read Nov 2026: the catalogue descriptions of the four core courses (CBE 220B is the second transport course) and the handbook's statement that the M.S. comprehensive exam and Ph.D. preliminary exam are based in part on the core courses. The course syllabi, problem sets and past comprehensive exams were not read; the objectives under each item are a house list on the catalogue topics.", "items": [{"code": "200", "title": "Applied Engineering Mathematics I: analytical methods for transport, process dynamics and control, thermodynamics"}, {"code": "210", "title": "Reaction Engineering: reactor stability, diffusion in heterogeneous catalysis, energy balances, optimal operation, dispersed-phase reactors"}, {"code": "220A", "title": "Transport Phenomena I: heat and mass transfer, scaling, time and length scales, steady and unsteady, convective transport"}, {"code": "220B", "title": "Transport Phenomena II: creeping and laminar flow, viscous and inviscid flow, Navier-Stokes, lubrication, boundary layers"}, {"code": "240", "title": "Advanced Engineering Thermodynamics: equilibrium and stability, equations of state, real mixtures, phase and chemical equilibrium"}]}
- {"id": "usnco", "name": "U.S. National Chemistry Olympiad: local and national exam format, multiple-choice topic bands and Part II", "publisher": "American Chemical Society", "kind": "exam-spec", "read": "part", "url": "https://www.acs.org/education/olympiad/prepare-for-exams/exam-information.html", "note": "Read Nov 2026. ACS's exam page: local exam 60 MC; national Part I 60 MC, Part II 8 written problems, Part III 2 lab practicals; the topic table for questions 1-42 (six per band). Bands 8-10 and the depth of every band were read from the 2025 national exam (Part I and Part II, through a summary of each paper, no questions copied): Part I questions 43-60 are atomic structure and periodicity, bonding and structure, and organic chemistry, biochemistry and spectroscopy. The exams are ACS's copyright; items here are our own.", "items": [{"code": "1", "title": "Stoichiometry and solutions (Q1-6)"}, {"code": "2", "title": "Descriptive chemistry and laboratory (Q7-12)"}, {"code": "3", "title": "States of matter (Q13-18)"}, {"code": "4", "title": "Thermodynamics (Q19-24)"}, {"code": "5", "title": "Kinetics (Q25-30)"}, {"code": "6", "title": "Equilibrium (Q31-36)"}, {"code": "7", "title": "Oxidation-reduction (Q37-42)"}, {"code": "8", "title": "Atomic structure and periodicity (Q43-48; from the 2025 national exam)"}, {"code": "9", "title": "Bonding and molecular structure (Q49-54; from the 2025 national exam)"}, {"code": "10", "title": "Organic chemistry, biochemistry and spectroscopy (Q55-60; from the 2025 national exam)"}, {"code": "P2", "title": "National Part II: eight written multi-part problems"}, {"code": "P3", "title": "National Part III: laboratory practical"}]}
- {"id": "icho-appendix-c", "name": "Regulations of the International Chemistry Olympiad, Appendices C and D (concepts, skills and factual knowledge)", "publisher": "IChO Steering Committee", "kind": "exam-spec", "read": "full", "url": "https://www.pianetachimica.it/olimpiadi/41icho/IChOsyllabus.pdf", "note": "Read in the copy hosted for IChO 2009, the version the 2013 regulations carry and preparatory problems still cite (IChO 2023 points to Appendix C). c-items are fair game without notice; a-items only when a host's preparatory problems teach them (at most 6 theory fields a year); d-items are Appendix D's factual knowledge. Practical skills are not listed.", "items": [{"code": "c1", "title": "Experimental error and significant figures"}, {"code": "c2", "title": "Nucleons, isotopes, decay and nuclear reactions"}, {"code": "c3", "title": "Quantum numbers, orbitals, configurations"}, {"code": "c4", "title": "Periodic trends"}, {"code": "c5", "title": "Bond types, intermolecular forces, simple VSEPR"}, {"code": "c6", "title": "Stoichiometry, mole, concentration"}, {"code": "c7", "title": "Equilibrium and Le Chatelier"}, {"code": "c8", "title": "Acid-base, pH, buffers, hydrolysis"}, {"code": "c9", "title": "Solubility constants and complexation"}, {"code": "c10", "title": "Electrochemistry: EMF, Nernst, electrolysis, Faraday"}, {"code": "c11", "title": "Rates, rate laws, catalysis, energy profiles"}, {"code": "c12", "title": "Thermodynamics: enthalpy, Hess, entropy, Gibbs"}, {"code": "c13", "title": "Ideal gases and partial pressures"}, {"code": "c14", "title": "Titrations: direct, back, redox, complexometric, precipitation"}, {"code": "c15", "title": "Acidimetry, alkalimetry, indicators"}, {"code": "c16", "title": "Qualitative inorganic analysis and flame tests"}, {"code": "c17", "title": "Lambert-Beer law"}, {"code": "c18", "title": "Organic structure, nomenclature, hybridization"}, {"code": "c19", "title": "Delocalization, resonance, aromaticity"}, {"code": "c20", "title": "Isomerism and stereochemistry"}, {"code": "c21", "title": "Hydrophilic and hydrophobic groups, micelles"}, {"code": "c22", "title": "Polymers: chain growth, polyaddition, polycondensation"}, {"code": "a1", "title": "Prep only: advanced VSEPR, inorganic stereochemistry, solid state and Bragg"}, {"code": "a2", "title": "Prep only: integrated rate laws, Arrhenius, steady state, collision theory"}, {"code": "a3", "title": "Prep only: phase diagrams and Clausius-Clapeyron"}, {"code": "a4", "title": "Prep only: stereoselective reactions, conformations, advanced aromatic substitution"}, {"code": "a5", "title": "Prep only: advanced polymers and supramolecular chemistry"}, {"code": "a6", "title": "Prep only: biochemistry (amino acids, proteins, enzymes, carbohydrates, nucleic acids)"}, {"code": "a7", "title": "Prep only: complex solubility, Schrodinger equation, simple MO theory"}, {"code": "a8", "title": "Prep only: mass spectrometry and NMR"}, {"code": "a9", "title": "Prep only: advanced synthesis and analysis techniques"}, {"code": "d1", "title": "Facts: s-block reactions and flame colours"}, {"code": "d2", "title": "Facts: binary non-metal hydrides"}, {"code": "d3", "title": "Facts: oxides of C, N and S"}, {"code": "d4", "title": "Facts: p-block oxidation states and oxoacids"}, {"code": "d5", "title": "Facts: halogens with water"}, {"code": "d6", "title": "Facts: first-row transition-metal oxidation states and ion colours"}, {"code": "d7", "title": "Facts: dissolving metals, amphoteric hydroxides"}, {"code": "d8", "title": "Facts: permanganate, chromate, dichromate"}, {"code": "d9", "title": "Facts: iodometry"}, {"code": "d10", "title": "Facts: identifying ions"}, {"code": "d11", "title": "Facts: organic reaction types, Grignard, Fehling, Tollens, biomolecules"}]}

- {"id": "gre-physics", "name": "GRE Physics Test content specifications", "publisher": "ETS", "kind": "exam-spec", "read": "part", "url": "https://www.ets.org/gre/test-takers/subject-tests/about/content-structure.html", "note": "Categories and weights read on ETS's content page (Nov 2026; percentages there differ by a point from older practice books). The subtopic lists in the practice book were read only in part (classical mechanics includes Lagrangian and Hamiltonian formalism and noninertial frames).", "items": [{"code": "1", "title": "Classical mechanics", "weight": "20%"}, {"code": "2", "title": "Electromagnetism", "weight": "18%"}, {"code": "3", "title": "Optics and wave phenomena", "weight": "8%"}, {"code": "4", "title": "Thermodynamics and statistical mechanics", "weight": "10%"}, {"code": "5", "title": "Quantum mechanics", "weight": "13%"}, {"code": "6", "title": "Atomic physics", "weight": "10%"}, {"code": "7", "title": "Special relativity", "weight": "6%"}, {"code": "8", "title": "Laboratory methods", "weight": "6%"}, {"code": "9", "title": "Specialized topics", "weight": "9%"}]}
- {"id": "gre-chemistry", "name": "GRE Chemistry Test (discontinued after April 2023): content areas", "publisher": "ETS", "kind": "exam-spec", "read": "crosswalk", "url": "https://www.ets.org/gre/score-users/subject-test-changes.html", "note": "ETS discontinued the test after April 2023. Its four areas and weights (analytical 15%, inorganic 25%, organic 30%, physical 30%) are read through Wikipedia's summary of the old specification. Kept as a coverage check for undergraduate breadth, not as a live exam.", "items": [{"code": "AN", "title": "Analytical chemistry", "weight": "15%"}, {"code": "IN", "title": "Inorganic chemistry", "weight": "25%"}, {"code": "OR", "title": "Organic chemistry", "weight": "30%"}, {"code": "PH", "title": "Physical chemistry", "weight": "30%"}]}

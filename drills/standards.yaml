ion's sampling distribution" }, { code: "3.2.B", title: "Justify conditions for the sampling distribution of a sample proportion" }, { code: "3.2.C", title: "Interpret the sampling distribution of a sample proportion" }, { code: "3.3.A", title: "Identify the confidence interval procedure for a proportion" }, { code: "3.3.B", title: "Verify conditions for a one-proportion interval" }, { code: "3.3.C", title: "Calculate a confidence interval for a proportion" }, { code: "3.3.D", title: "Calculate standard error and margin of error for a proportion" }, { code: "3.4.A", title: "Interpret a confidence interval in context" }, { code: "3.4.B", title: "Justify a claim based on a confidence interval" }, { code: "3.4.C", title: "Relate sample size, width, confidence level and margin of error" }, { code: "3.5.A", title: "Identify the testing method for a proportion" }, { code: "3.5.B", title: "Identify null and alternative hypotheses" }, { code: "3.5.C", title: "Verify conditions for a one-proportion test" }, { code: "3.6.A", title: "Interpret the p-value of a test for a proportion" }, { code: "3.7.A", title: "Calculate the test statistic and p-value for a proportion" }, { code: "3.7.B", title: "Justify a claim based on test results" }, { code: "3.8.A", title: "Identify Type I and Type II errors" }, { code: "3.8.B", title: "Calculate probabilities of Type I and Type II errors" }, { code: "3.8.C", title: "Identify factors affecting error probabilities" }, { code: "3.8.D", title: "Interpret Type I and Type II errors" }, { code: "3.9.A", title: "Calculate the mean and SD of the difference of sample proportions" }, { code: "3.9.B", title: "Justify conditions for the difference of sample proportions" }, { code: "3.9.C", title: "Interpret the sampling distribution of the difference of proportions" }, { code: "3.10.A", title: "Identify the interval procedure for a difference of proportions" }, { code: "3.10.B", title: "Verify conditions for a two-proportion interval" }, { code: "3.10
- id: webwork-opl
  name: "WeBWorK Open Problem Library taxonomy (Taxonomy2): subject, chapter and section"
  publisher: MAA / WeBWorK project (openwebwork)
  kind: standard
  read: full
  url: https://github.com/openwebwork/webwork-open-problem-library/blob/main/OpenProblemLibrary/Taxonomy2
  note: "The topic tree that files about 77,000 college problems. Read in full from the repository's Taxonomy2 file (Nov 2026). Registered here: the ten college subjects the Library builds toward (codes CA, MV, DE, LA, PB, ST, CX, TH, FM, MB plus the chapter number; sections that only point to another subject are left out). Used as a section-by-section checklist, not as a source of problems: the problems are CC BY-NC-SA and none are copied."
  items:
    - { code: "CA1", title: "Calculus - single variable: Limits and continuity", parts: { "1": "Motivational applications (estimation)", "2": "Finding limits using graphs", "3": "Rules of limits - basic", "4": "Evaluating limits - factoring", "5": "Evaluating limits - rationalizing", "6": "Evaluating limits - rational expressions", "7": "Evaluating limits - trigonometric", "8": "Squeeze theorem", "9": "One-sided limits - concept of", "10": "Continuity - concept of", "11": "Continuity - classifying discontinuities", "12": "Continuity - intermediate value theorem", "13": "Infinite limits and vertical asymptotes", "14": "Limits at infinity, horizontal and oblique asymptotes", "15": "Estimating limits numerically", "16": "Applications - instantaneous rate of change", "17": "Applications - tangent lines and slopes", "18": "Applications - finding all asymptotes", "19": "Applications - other", "20": "Definitions and existence (conceptual)" } }

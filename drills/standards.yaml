- {"id": "ngss-hs", "name": "Next Generation Science Standards, high school performance expectations (2013)", "publisher": "NGSS Lead States", "kind": "standard", "read": "part", "url": "https://educate.iowa.gov/pk-12/standards/academics/science/high-school", "note": "All 59 high-school performance expectations read through Iowa's adoption of NGSS (Nov 2026). The foundation boxes (practices, DCI statements, crosscutting concepts) and the K-8 bands were not read. A performance expectation fuses a practice with content; citing one here means the content is drilled, not that the practice is.", "items": [{"code": "PS1-1", "title": "Periodic patterns of outer electrons predict properties"}, {"code": "PS1-2", "title": "Reaction outcomes from outer electrons and periodic trends"}, {"code": "PS1-3", "title": "Bulk properties infer strength of electrical forces between particles"}, {"code": "PS1-4", "title": "Bond energy changes account for energy released or absorbed"}, {"code": "PS1-5", "title": "Temperature and concentration effects on reaction rate"}, {"code": "PS1-6", "title": "Changing conditions to shift equilibrium toward product"}, {"code": "PS1-7", "title": "Conservation of atoms and mass in reactions (mathematical)"}, {"code": "PS1-8", "title": "Fission, fusion and radioactive decay"}, {"code": "PS2-1", "title": "Newton's second law from data"}, {"code": "PS2-2", "title": "Conservation of momentum"}, {"code": "PS2-3", "title": "Design a device that reduces collision force"}, {"code": "PS2-4", "title": "Newton's gravitation and Coulomb's law"}, {"code": "PS2-5", "title": "Currents and magnetic fields produce each other"}, {"code": "PS2-6", "title": "Molecular structure and the function of designed materials"}, {"code": "PS3-1", "title": "Energy change of one component from the others and the flows"}, {"code": "PS3-2", "title": "Energy as motion of particles plus relative positions"}, {"code": "PS3-3", "title": "Design a device that converts energy"}, {"code": "PS3-
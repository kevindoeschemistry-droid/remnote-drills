    - { code: "H5", title: "High school, problems 71–80", parts: { "1": "Function domains and ranges", "2": "Modular arithmetic", "3": "Limits", "4": "Derivatives", "5": "Slopes of tangent lines", "6": "Horizontal and vertical asymptotes", "7": "Critical values", "8": "Maximum and minimum problems", "9": "Definite integration", "10": "Inverse functions" } }

geous traits"}, {"code": "LS4-4", "title": "Natural selection leads to adaptation"}, {"code": "LS4-5", "title": "Environmental change and speciation or extinction"}, {"code": "LS4-6", "title": "Simulate solutions to biodiversity threats"}, {"code": "ESS1-1", "title": "The Sun's life span and fusion energy"}, {"code": "ESS1-2", "title": "Big Bang evidence"}, {"code": "ESS1-3", "title": "Stellar nucleosynthesis"}, {"code": "ESS1-4", "title": "Orbital motion (Kepler, gravitation)"}, {"code": "ESS1-5", "title": "Plate tectonics and the ages of rocks"}, {"code": "ESS1-6", "title": "Early Earth history from ancient materials"}, {"code": "ESS2-1", "title": "Internal and surface processes form landforms"}, {"code": "ESS2-2", "title": "Feedbacks among Earth systems"}, {"code": "ESS2-3", "title": "Thermal convection in the mantle"}, {"code": "ESS2-4", "title": "Energy flow and climate change"}, {"code": "ESS2-5", "title": "Properties of water and surface processes"}, {"code": "ESS2-6", "title": "Carbon cycling among Earth systems (quantitative)"}, {"code": "ESS2-7", "title": "Coevolution of Earth systems and life"}, {"code": "ESS3-1", "title": "Resources, hazards and climate shape human activity"}, {"code": "ESS3-2", "title": "Cost–benefit of energy and mineral resources"}, {"code": "ESS3-3", "title": "Resource management, sustainability and biodiversity"}, {"code": "ESS3-4", "title": "Technology that reduces human impact"}, {"code": "ESS3-5", "title": "Forecasting climate change"}, {"code": "ESS3-6", "title": "Humans alter Earth-system relationships (computational)"}, {"code": "ETS1-1", "title": "Criteria and constraints for a global challenge"}, {"code": "ETS1-2", "title": "Break a problem into smaller problems"}, {"code": "ETS1-3", "title": "Evaluate solutions by prioritised criteria and trade-offs"}, {"code": "ETS1-4", "title": "Simulate the impact of a solution"}]}

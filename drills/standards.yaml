"title": "Isomerism and stereochemistry"}, {"code": "c21", "title": "Hydrophilic and hydrophobic groups, micelles"}, {"code": "c22", "title": "Polymers: chain growth, polyaddition, polycondensation"}, {"code": "a1", "title": "Prep only: advanced VSEPR, inorganic stereochemistry, solid state and Bragg"}, {"code": "a2", "title": "Prep only: integrated rate laws, Arrhenius, steady state, collision theory"}, {"code": "a3", "title": "Prep only: phase diagrams and Clausius-Clapeyron"}, {"code": "a4", "title": "Prep only: stereoselective reactions, conformations, advanced aromatic substitution"}, {"code": "a5", "title": "Prep only: advanced polymers and supramolecular chemistry"}, {"code": "a6", "title": "Prep only: biochemistry (amino acids, proteins, enzymes, carbohydrates, nucleic acids)"}, {"code": "a7", "title": "Prep only: complex solubility, Schrodinger equation, simple MO theory"}, {"code": "a8", "title": "Prep only: mass spectrometry and NMR"}, {"code": "a9", "title": "Prep only: advanced synthesis and analysis techniques"}, {"code": "d1", "title": "Facts: s-block reactions and flame colours"}, {"code": "d2", "title": "Facts: binary non-metal hydrides"}, {"code": "d3", "title": "Facts: oxides of C, N and S"}, {"code": "d4", "title": "Facts: p-block oxidation states and oxoacids"}, {"code": "d5", "title": "Facts: halogens with water"}, {"code": "d6", "title": "Facts: first-row transition-metal oxidation states and ion colours"}, {"code": "d7", "title": "Facts: dissolving metals, amphoteric hydroxides"}, {"code": "d8", "title": "Facts: permanganate, chromate, dichromate"}, {"code": "d9", "title": "Facts: iodometry"}, {"code": "d10", "title": "Facts: identifying ions"}, {"code": "d11", "title": "Facts: organic reaction types, Grignard, Fehling, Tollens, biomolecules"}]}
- {"id": "icho-syllabus", "name": "IChO syllabus, theoretical part (12 sections, levels 1-3)", "publisher": "IChO Steering Committee", "kind": "exam-spec", "read": "crosswalk", "url": "https://www.pw.live/olympiad/exams/icho-syllabus", "note": "The official PDF (icho.sk) could not be fetched; the 12 section titles and the level scheme were read in a published summary. Level 1 is in nearly all school programmes, level 2 in many, level 3 only when preparatory problems give examples.", "items": [{"code": "1", "title": "The atom"}, {"code": "2", "title": "Chemical bonding"}, {"code": "3", "title": "Chemical calculations"}, {"code": "4", "title": "Periodic trends"}, {"code": "5", "title": "Inorganic chemistry"}, {"code": "6", "title": "Physical chemistry"}, {"code": "7", "title": "Chemical kinetics"}, {"code": "8", "title": "Spectroscopy"}, {"code": "9", "title": "Organic chemistry"}, {"code": "10", "title": "Polymers"}, {"code": "11", "title": "Biochemistry"}, {"code": "12", "title": "Analytical chemistry"}]}
- {"id": "acs-accm", "name": "ACS Exams Institute Anchoring Concepts Content Map: the ten anchoring concepts (shared by the general, organic, inorganic, physical, analytical and biochemistry maps)", "publisher": "ACS Exams Institute", "kind": "standard", "read": "part", "url": "https://curriculumalignment.ucf.edu/wp-content/uploads/sites/10/2017/08/2013_Organic_Chemistry_ACCM-ACS.pdf", "note": "The ten anchoring concepts and their enduring understandings were read in the organic-chemistry map's supporting information (J. Chem. Educ. 2013). The same ten concepts organise every ACS Exams subdiscipline map; the finer levels of the other maps (general 2012/2015, inorganic and physical 2018, analytical 2020) were not read. ACS exams are criterion-referenced to these maps.", "items": [{"code": "I", "title": "Atoms"}, {"code": "II", "title": "Bonding"}, {"code": "III", "title": "Structure and function"}, {"code": "IV", "title": "Intermolecular interactions"}, {"code": "V", "title": "Chemical reactions"}, {"code": "VI", "title": "Energy and thermodynamics"}, {"code": "VII", "title": "Kinetics"}, {"code": "VIII", "title": "Equilibrium"}, {"code": "IX", "title": "Experiments, measurement and data"}, {"code": "X", "title": "Visualization"}]}

- { id: cupm-2023-la, name: "MAA CUPM Linear Algebra Course Area Report (August 17, 2023)", publisher: Mathematical Association of America, kind: standard, read: full, url: "https://www.maa.org/sites/default/files/Linear%20Algebra%20-%20Course%20Area%20Report%20%28Aug%2017%202023%29.pdf", note: "Read in full from the PDF Kevin supplied (Nov 2026): eleven essential and four optional core topics for a first course, eight student learning outcomes (explain, compute, prove, connect, visualise, apply, abstraction, technology), informed by LACSG 2.0. Determinants and LU are not on its list; our units on them rest on Lay and the 2015 guide.", items: [{ code: "E1", title: "Solving linear systems by Gaussian elimination" }, { code: "E2", title: "Linear independence" }, { code: "E3", title: "Span of a set of vectors" }, { code: "E4", title: "Matrix algebra: addition, multiplication, inversion" }, { code: "E5", title: "Rⁿ as a vector space: column, row and null spaces" }, { code: "E6", title: "Linear transformations" }, { code: "E7", title: "Abstract vector spaces" }, { code: "E8", title: "Eigenvalues and eigenvectors" }, { code: "E9", title: "Basis, dimension, change of basis; diagonalisation" }, { code: "E10", title: "Dot product and orthogonality" }, { code: "E11", title: "Least squares" }, { code: "O1", title: "Optional: abstract inner products and orthogonality" }, { code: "O2", title: "Optional: Gram–Schmidt orthogonalisation" }, { code: "O3", title: "Optional: the singular value decomposition" }, { code: "O4", title: "Optional: symmetric matrices and orthogonal diagonalisation" }] }
- { id: cupm-2015-la, name: "MAA CUPM Curriculum Guide 2015, Linear Algebra course report: core topics of a first course", publisher: Mathematical Association of America, kind: standard, read: part, url: "https://www.amstat.org/docs/default-source/amstat-documents/cupmguide_print.pdf", note: "The six core-topic groups and the learning goals of the report's first course were read through a summary of the print guide; the report's own pages could not be fetched. LU decomposition sits in group 1, change of basis in group 4, Gram-Schmidt in group 6 (marked optional). The guide's second course adds canonical forms, the spectral theorem, the SVD and bilinear forms.", items: [{ code: "1", title: "Matrices and linear systems (operations, echelon form, inverses, LU)" }, { code: "2", title: "Determinants (properties, geometric meaning)" }, { code: "3", title: "Vector spaces (subspaces, independence, basis, dimension, rank-nullity)" }, { code: "4", title: "Linear transformations (matrix representation, change of basis, kernel and range)" }, { code: "5", title: "Eigenvalues and eigenvectors (computation, diagonalization)" }, { code: "6", title: "Inner products (norms, orthogonality, orthogonal bases, Gram-Schmidt)" }, { code: "second", title: "Second course: spectral theorem, SVD, quadratic and bilinear forms" }] }
- { id: lacsg-2, name: "Linear Algebra Curriculum Study Group 2.0 recommendations (Stewart, Axler, Beezer et al.)", publisher: LACSG 2.0, kind: standard, read: part, url: "https://www.ams.org/notices/202205/rnoti-p806.pdf", note: "Read through the AMS Notices survey (Andrews-Larson, Siefken & Simha, May 2022), which lists the first-course emphases LACSG 2.0 adds (linear maps, their compositions and inverses, diagonalization, the SVD) and its second-course topics. The recommendations' own text, and their full first-course list, were not read; F items are the added emphases only.", items: [{ code: "F1", title: "First course: linear maps" }, { code: "F2", title: "First course: compositions and inverses of linear maps" }, { code: "F3", title: "First course: diagonalization" }, { code: "F4", title: "First course: the singular value decomposition" }, { code: "S1", title: "Second course: abstract treatment of vector spaces" }, { code: "S2", title: "Second course: matrix factorizations" }, { code: "S3", title: "Second course: inner product spaces" }, { code: "S4", title: "Second course: finite-dimensional spectral theorem" }, { code: "S5", title: "Second course: pseudo-inverses" }, { code: "S6", title: "Second course: operators" }, { code: "S7", title: "Second course: Jordan form" }] }
- { id: lay-5e, name: "Lay, Lay & McDonald, Linear Algebra and Its Applications, 5th ed. (chapter list)", publisher: Pearson, kind: textbook, read: part, note: "A textbook's contents, not a standard: chapters 1-7 as recorded in the source file from the wiki's pages for this book. The framework now rests on cupm-2015-la; this is the chapter map beside it.", items: [{ code: "1", title: "Linear Equations in Linear Algebra" }, { code: "2", title: "Matrix Algebra" }, { code: "3", title: "Determinants" }, { code: "4", title: "Vector Spaces" }, { code: "5", title: "Eigenvalues and Eigenvectors" }, { code: "6", title: "Orthogonality and Least Squares" }, { code: "7", title: "Symmetric Matrices and Quadratic Forms" }] }

- { id: ap-biology-2025, name: "AP Biology Course and Exam Description (effective fall 2025)", publisher: College Board, kind: standard, read: part, url: "https://apcentral.collegeboard.org/media/pdf/ap-biology-course-and-exam-description.pdf", note: "Read: every learning objective (97, codes unit.topic.letter) and the unit exam weightings, from the College Board PDF (Nov 2026). Titles here are shortened paraphrases. The essential knowledge statements and science practices were not read item by item. Replaces the 2019 edition's codes (SYI-1.A …), which the framework's objectives still cite.", items: [{ code: "1.1.A", title: "Explain how the properties of water that result from its polarity and hydrogen bonding affect its biological function" }, { code: "1.2.A", title: "Describe the composition of macromolecules required by living organisms" }, { code: "1.3.A", title: "Describe the chemical reactions that build and break biological macromolecules" }, { code: "1.4.A", title: "Describe the structure and function of carbohydrates" }, { code: "1.5.A", title: "Describe the structure and function of lipids" }, { code: "1.6.A", title: "Describe the structure and function of DNA and RNA" }, { code: "1.7.A", title: "Describe the structure and function of proteins" }, { code: "2.1.A", title: "Explain how subcellular components and organelles contribute to the function of cells" }, { code: "2.2.A", title: "Explain the effect of surface area-to-volume ratios on the exchange of materials with the environment" }, { code: "2.3.A", title: "Describe the roles of the components of the cell membrane in maintaining the internal environment" }, { code: "2.3.B", title: "Describe the fluid mosaic model of cell membranes" }, { code: "2.4.A", title: "Explain how the structure of biological membranes influences selective permeability" }, { code: "2.4.B", title: "Describe the role of the cell wall in maintaining cell structure and function" }, { code: "2.5.A", title: "Describe the mechanisms that organisms use to maintain solute and water balance" }, { code: "2.5.B", title: "Describe the mechanisms that organisms use to transport large molecules across the plasma membrane" }, { code: "2.6.A", title: "Explain how the structure of a molecule affects its ability to pass through the plasma membrane" }, { code: "2.7.A", title: "Explain how concentration gradients affect the movement of molecules across membranes" }, { code: "2.7.B", title: "Explain how osmoregulatory mechanisms contribute to the health and survival of organisms" }, { code: "2.8.A", title: "Describe the processes that allow ions and other molecules to move across membranes" }, { code: "2.9.A", title: "Describe the membrane-bound structures of the eukaryotic cell" }, { code: "2.9.B", title: "Explain how internal membranes and organelles contribute to compartmentalization of eukaryotic cell functions" }, { code: "2.10.A", title: "Describe similarities and differences in compartmentalization between prokaryotic and eukaryotic cells" }, { code: "3.1.A", title: "Explain how enzymes affect the rate of biological reactions" }, { code: "3.2.A", title: "Explain how changes to the structure of an enzyme may affect its function" }, { code: "3.2.B", title: "Explain how the cellular environment affects enzyme activity" }, { code: "3.3.A", title: "Describe the role of energy in living organisms" }, { code: "3.3.B", title: "Explain how shared, conserved processes and features support common ancestry for all organisms" }, { code: "3.4.A", title: "Describe the photosynthetic processes and chloroplast features that capture and store energy" }, { code: "3.4.B", title: "Explain how cells capture energy from light and transfer it to biological molecules" }, { code: "3.5.A", title: "Describe the processes and mitochondrial features that use energy stored in macromolecules" }, { code: "3.5.B", title: "Explain how cells obtain energy from biological macromolecules to power cellular functions" }, { code: "4.1.A", titl
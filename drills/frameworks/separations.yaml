# Separations — curriculum framework (draft 1, for Kevin's markup)
#
# Basis: NCEES FE Chemical area 10 (mass transfer and separation: 10.C separation systems, 10.D
# equilibrium-stage methods, 10.F humidification, drying, evaporation; read in full) and PE Chemical
# 6.B (mass-transfer applications). Objectives and their order are ours. Not here yet: McCabe–Thiele
# stage stepping at finite reflux, Gilliland, multicomponent distillation, liquid–liquid extraction
# triangles, HTU/NTU packed columns, membranes, adsorption breakthrough, crystallisation.
id: separations
title: Separations
code: SP
draft: 1
track: engineering
requires: [material-balances, thermodynamics]
level: 4
domains: [sep]

basis:
  primary: fe-chemical
  also: [pe-chemical]
  note: "Topics from FE Chemical area 10 and PE Chemical 6.B (both read in full); objectives and their order are ours."

big_ideas:
  - id: STAGE
    title: A stage is an equilibrium plus a balance
    text: Every separation is equilibrium relations (α, m, solubility) chained by mass balances; the number of stages measures how hard the split is.
  - id: DRIVE
    title: Separation needs a driving difference
    text: Volatility, solubility or vapour pressure must differ, and the closer to 1 the ratio, the more stages or reflux it costs.

practices:
  - id: P1
    title: Compute
    text: Carry the stage or balance calculation to a number.

units:
  - id: equilibrium-stages
    n: 1
    title: "Equilibrium-stage separations"
    std: ["fe-chemical:10.C", "fe-chemical:10.D", "pe-chemical:6.B"]
    scope: core
    ideas: [STAGE, DRIVE]
    topics:
      - n: 1
        title: "Distillation"
        los:
          - { id: A, std: ["webwork-opl:TH16.4"], do: "Compute a vapour composition from relative volatility.", ek: ["y = αx/(1 + (α − 1)x)."], p: [P1], drills: [sp-vle-alpha] }
          - { id: B, do: "Compute the minimum number of stages with Fenske.", ek: ["N_min = ln[(x_D/(1−x_D))((1−x_B)/x_B)]/ln α."], p: [P1], needs: [SP-1.1.A], drills: [sp-fenske] }
          - { id: C, do: "Compute the minimum reflux ratio for a saturated-liquid feed.", ek: ["Pinch on the q-line; Underwood for a binary."], p: [P1], needs: [SP-1.1.A], drills: [sp-rmin] }
      - n: 2
        title: "Absorption"
        los:
          - { id: A, do: "Compute the stages for an absorber with the Kremser equation.", ek: ["N = ln[(A − f)/(1 − f)]/ln A − 1."], p: [P1], drills: [sp-kremser] }
  - id: humidity
    n: 2
    title: "Humidification and evaporation"
    std: ["fe-chemical:10.F", "pe-chemical:6.B"]
    scope: core
    ideas: [STAGE]
    topics:
      - n: 1
        title: "Humid air and evaporators"
        los:
          - { id: A, std: ["webwork-opl:TH12.5"], do: "Compute absolute humidity from relative humidity.", ek: ["H = 0.622 p_w/(P − p_w)."], p: [P1], drills: [sp-humidity] }
          - { id: B, do: "Compute the water removed by an evaporator.", ek: ["Solids balance first."], p: [P1], drills: [sp-evaporator] }

# Applied Engineering Mathematics — curriculum framework (draft 1, for Kevin's markup)
#
# Built like an AP Course and Exam Description: Big Ideas run through the subject,
# Units → Topics → Learning Objectives (one testable action each, verb first), with the
# Essential Knowledge an LO rests on and the Practices it exercises. Textbooks, courses and
# exams are crosswalks onto this map, never the backbone.
#
# Standards it's built from:
#   cbe200  UCI CBE 200 Applied Engineering Mathematics I (4 units), catalogue: "analytical
#           techniques applied to engineering problems in transport phenomena, process
#           dynamics and control, and thermodynamics." No public syllabus found; taught by
#           Elizabeth Read as an ODEs course from Kreyszig 10e.
#           https://catalogue.uci.edu/allcourses/cbe/
#   kreyszig Kreyszig, Advanced Engineering Mathematics 10e (Wiley, 2011), Parts A–C
#           (Ch 1–12) table of contents; section → skill map in drills/sources/kreyszig-10e.yaml
#           https://www.oreilly.com/library/view/advanced-engineering-mathematics/9780470458365/
#           https://www.wileyindia.com/wileyproductpdf/download/pdf/id/256/
#   mit1803 MIT 18.03 Differential Equations, "Ten Essential Skills" (Spring 2010): model as
#           1st-order ODE + direction fields + Euler · integrating factors · complex
#           exponentials · 2nd-order constant-coefficient IVPs, gain and phase · Fourier
#           series periodic solutions · delta, impulse response, convolution · Laplace,
#           transfer function, poles · eigenvalues, matrix exponential, systems · phase
#           portrait from trace and determinant · nonlinear critical points
#           https://ocw.mit.edu/courses/mathematics/18-03-differential-equations-spring-2010/syllabus/MIT18_03S10_skills.pdf
#   cbe605  SDSMT CBE 605 Applied Engineering Mathematics (ChemE graduate, Greenberg text):
#           outcomes "explain what mathematical models are… simplify DEs so they can be
#           solved using eigenfunction expansions… physically relevant simplifications…
#           vectors and tensors"; topics: linear spaces/operators, eigenvalue problem, ODEs,
#           phase plane, perturbation, PDEs by separation and transforms, Green's functions
#           https://webpages.sdsmt.edu/~twalker/pdfs/syllabi/2020f_cbe605_syllabus.pdf
#
# Unit order follows how the subject is taught (first-order → second-order → higher order
# → systems → series → Laplace → linear algebra as needed → Fourier/BVP/S–L → PDEs), not
# Kreyszig's chapter numbers. Unit 1 is the calculus toolkit the ODE methods lean on.
#
# Fields
#   units[].scope     core (what CBE 200 covers) or extension (rest of the subject)
#                     Kevin (Oct 29): Laplace incl. Heaviside, Sturm–Liouville (on the midterm) and PDEs are all in CBE 200
#   units[].ideas     Big Ideas the unit develops
#   units[].weight_est rough share of a 10-week ODE course — an estimate, not a published spec
#   topics[].book     crosswalk: kreyszig-10e sections
#   los[].do          the objective; los[].ek essential knowledge; los[].p practices
#   los[].needs       prerequisite LOs in this framework
#   los[].drills      templates that drill it; "~name" = only partly (one variant, or a
#                     neighbouring skill). No drills = a gap you can't be drilled on yet.
id: engineering-math
title: Applied Engineering Mathematics
code: EM
draft: 1
track: math
requires: [calculus]
domains: [calc, la, ode1, ode2, odesys, series, laplace, bvp, pde]

basis:
  primary: kreyszig-10e
  also: [fe-chemical, webwork-opl]
  note: "UCI CBE 200 publishes no syllabus. The undergraduate part is anchored to fe-chemical; series, Sturm–Liouville, PDEs and transforms are past any exam spec and stand on the book."

big_ideas:
  - id: MODEL
    title: Equations come from balances
    text: A rate of change equals inflow minus outflow plus generation; the ODE or PDE, its initial and boundary conditions, and its parameters all come from the physical system, and its answer must make physical sense.
  - id: FORM
    title: The form of the equation picks the method
    text: Order, linearity, coefficients (constant, Euler–Cauchy, analytic, singular) and forcing decide which technique works. Classify before you compute.
  - id: LIN
    title: Linear problems superpose
    text: Solutions of a linear homogeneous equation form a vector space; general solution = homogeneous basis + one particular solution, and independence (Wronskian, determinant) says when a basis is complete.
  - id: EIG
    title: Eigenvalues decouple linear problems
    text: Characteristic roots, matrix eigenvalues and Sturm–Liouville eigenvalues are one idea — find the modes, and each evolves on its own; their signs and imaginary parts set growth, decay, oscillation and stability.
  - id: TRANS
    title: Change the representation to simplify
    text: Substitutions, power series, Laplace transforms and eigenfunction (Fourier) expansions turn a hard problem into algebra or a recurrence, solved there and transformed back.

practices:
  - id: P1
    title: Model the system
    text: Translate a physical description into a differential equation with initial or boundary conditions; name the variables, parameters and units.
  - id: P2
    title: Classify the equation
    text: State order, linearity, homogeneity, coefficient type, singular points or boundary type, and choose the method that fits.
  - id: P3
    title: Execute the method
    text: Carry out the integration, algebra, recurrence, transform or eigen-decomposition without dropping terms or constants.
  - id: P4
    title: Impose conditions
    text: Apply initial or boundary conditions to fix constants, eigenvalues or coefficients; keep the general solution until the end.
  - id: P5
    title: Check the answer
    text: Substitute back, test limiting cases and t → ∞ behaviour, confirm independence and that the solution satisfies every condition.
  - id: P6
    title: Interpret qualitatively
    text: Read stability, time constants, resonance and long-time behaviour off the roots or eigenvalues; sketch solutions and phase portraits; predict how a parameter change moves them.

units:
  # ── 1 ────────────────────────────────────────────────────────────────────
  - id: toolkit
    n: 1
    title: The calculus and complex-number toolkit
    scope: core
    ideas: [FORM, TRANS]
    weight_est: "review"
    topics:
      - n: 1
        title: Integration techniques
        std: ["fe-chemical:1.B"]
        book: { kreyszig-10e: ["1.3", "1.5", "6.4"] }
        los:
          - { id: A, std: ["webwork-opl:CA5.1"], do: "Evaluate an integral by u-substitution, choosing u so its derivative appears in the integrand.", ek: ["∫f(g(x))g′(x)dx = ∫f(u)du; a missing constant factor is fine, a missing x is not."], p: [P3], drills: [usub-poly, usub-exp, usub-trig, usub-log, usub-ratio, usub-linear] }
          - { id: B, std: ["webwork-opl:CA5.3"], do: "Evaluate an integral by parts, including tabular and cyclic (e^ax·trig) cases.", ek: ["∫u dv = uv − ∫v du; LIATE picks u; cyclic integrals return to themselves and are solved algebraically."], p: [P3], drills: [parts-x-exp, parts-x-trig, parts-x-log, parts-tabular, parts-exp-trig, parts-inverse] }
          - { id: C, std: ["webwork-opl:CA5.7"], do: "Decompose a rational function into partial fractions (distinct, repeated, irreducible quadratic, improper) and integrate it.", ek: ["Divide first if improper; repeated factor (x−a)^k needs k terms; irreducible quadratic gets (Ax+B)."], p: [P3], drills: [pf-distinct, pf-repeated, pf-three, pf-irreducible, pf-improper, pf-coeffs] }
      - n: 2
        title: Complex numbers and Euler's formula
        book: { kreyszig-10e: ["2.2", "13.1", "13.2", "13.5"] }
        los:
          - { id: A, std: ["webwork-opl:CX1.1", "webwork-opl:CX1.2", "webwork-opl:CX1.3", "webwork-opl:CX1.4", "webwork-opl:CX1.5", "webwork-opl:CX1.6", "webwork-opl:CX1.7", "webwork-opl:CX1.8"], do: "Convert complex numbers between rectangular, polar and exponential form.", ek: ["e^(iθ) = cos θ + i sin θ; z = re^(iθ), r = |z|, θ = arg z."], p: [P3], drills: [euler-rect, euler-polar, euler-re-im] }
          - { id: B, std: ["webwork-opl:CX1.9"], do: "Compute powers and roots of a complex number with De Moivre's formula.", ek: ["(re^(iθ))^n = r^n e^(inθ); n distinct n-th roots spaced 2π/n apart."], p: [P3], drills: [euler-demoivre] }
          - { id: C, std: ["webwork-opl:CX2.2"], do: "Find the complex roots α ± βi of a real quadratic.", ek: ["Complex roots of real polynomials come in conjugate pairs; α = −b/2a, β = √(4ac − b²)/2a."], p: [P3], drills: [euler-quad-roots] }
      - n: 3
        title: Summation notation
        book: { kreyszig-10e: ["5.1"] }
        los:
          - { id: A, do: "Shift a summation index so two power series start at the same index and carry the same power of x.", ek: ["Replace m by m ± k and adjust the limits; the sum is unchanged."], p: [P3], drills: [sigma-shift-down, sigma-shift-up, sigma-prefactor, sigma-derivative, sigma-combine] }
      - n: 4
        title: Partial derivatives and exact differentials
        std: ["fe-chemical:1.B"]
        book: { kreyszig-10e: ["1.4", "9.6"] }
        los:
          - { id: A, do: "Compute first and mixed partial derivatives of a function of two variables.", ek: ["Hold the other variable constant; for smooth functions u_xy = u_yx."], p: [P3], drills: [mv-partial, mv-mixed] }
          - { id: B, do: "Find dy/dx for a curve defined implicitly by F(x, y) = c.", ek: ["dy/dx = −F_x / F_y."], p: [P3], drills: [mv-implicit] }
          - { id: C, std: ["webwork-opl:DE2.2"], do: "Test whether M dx + N dy is an exact differential.", ek: ["Exact on a simply connected domain ⇔ ∂M/∂y = ∂N/∂x."], p: [P2], drills: [mv-exact-test] }

  # ── 2 ────────────────────────────────────────────────────────────────────
  - id: first-order
    n: 2
    title: First-order ODEs
    scope: core
    std: ["fe-chemical:1.C", "fe-chemical:1.D"]
    ideas: [MODEL, FORM, TRANS]
    weight_est: "15–20%"
    topics:
      - n: 1
        title: Basic concepts, direction fields and Euler's method
        book: { kreyszig-10e: ["1.1", "1.2"] }
        los:
          - { id: A, std: ["webwork-opl:DE1.1", "webwork-opl:DE1.2"], do: "Classify an ODE by order and linearity, and verify that a given function solves it.", ek: ["Order = highest derivative; linear ⇔ y and its derivatives appear to first power with coefficients in x only."], p: [P2, P5], drills: ["~em-classify-ode", em-verify-solution] }
          - { id: B, std: ["webwork-opl:DE2.12"], do: "Sketch a direction field and solution curves from isoclines of y′ = f(x, y).", ek: ["Isocline f(x, y) = k has slope k everywhere; solution curves are tangent to the field."], p: [P6], drills: [em-isoclines, ca-slope-field-match] }
          - { id: C, std: ["webwork-opl:DE6.1"], do: "Approximate an IVP solution with a few steps of Euler's method and estimate the error trend.", ek: ["y_(n+1) = y_n + h f(x_n, y_n); global error is O(h)."], p: [P3, P5], drills: [ca-euler-method] }
      - n: 2
        title: Separable equations and reducing substitutions
        book: { kreyszig-10e: ["1.3"] }
        los:
          - { id: A, std: ["webwork-opl:DE2.3"], do: "Solve a separable ODE explicitly where possible, including the IVP constant.", ek: ["g(y)dy = f(x)dx, integrate both sides; check for lost equilibrium solutions when dividing by g."], p: [P3, P4], drills: [sep-exp-growth, sep-over-y, sep-y-squared, sep-exp-split, sep-over-y2], needs: [EM-1.1.A, EM-1.1.C] }
          - { id: B, std: ["webwork-opl:DE2.4"], do: "Reduce an ODE to separable form with u = y/x or u = ax + by + c, and solve it.", ek: ["y′ = f(y/x): y = ux ⇒ u + xu′ = f(u); y′ = f(ax + by + c): u′ = a + bf(u)."], p: [P2, P3], drills: [sub-ratio, sub-square, sub-exp, sub-linear-square, sub-arctan], needs: [EM-2.2.A] }
      - n: 3
        title: Exact equations and integrating factors
        book: { kreyszig-10e: ["1.4"] }
        los:
          - { id: A, std: ["webwork-opl:DE2.2"], do: "Solve an exact ODE by finding the potential u(x, y) = c, and fit an IVP.", ek: ["u_x = M, u_y = N; integrate one, differentiate, match the other."], p: [P3, P4], drills: [exact-poly, exact-trans, exact-exy, exact-ivp], needs: [EM-1.4.C] }
          - { id: B, std: ["webwork-opl:DE2.13"], do: "Decide whether an integrating factor depending only on x or only on y exists.", ek: ["R = (M_y − N_x)/N a function of x alone ⇒ F(x) = exp∫R dx; R* = (N_x − M_y)/M of y alone ⇒ F(y)."], p: [P2], drills: [if-test] }
          - { id: C, std: ["webwork-opl:DE2.13"], do: "Find the integrating factor and solve the resulting exact equation.", ek: ["Multiply by F, re-check exactness, then solve as exact."], p: [P3], drills: [if-factor-x, if-factor-y, if-solve], needs: [EM-2.3.A, EM-2.3.B] }
      - n: 4
        title: Linear and Bernoulli equations
        book: { kreyszig-10e: ["1.5"] }
        los:
          - { id: D, std: [], do: "Solve a first-order linear ODE whose forcing switches on or off at a given time.", ek: ["Solve on each interval and carry y across the switch: the solution is continuous even where the forcing jumps."], p: [P1], drills: [lin-switch-off, lin-switch-on] }
          - { id: A, std: ["webwork-opl:DE2.1"], do: "Solve a linear first-order ODE with an integrating factor, including IVPs and forcing that matches e^(−∫p).", ek: ["y′ + py = r ⇒ y = e^(−h)[∫e^h r dx + c], h = ∫p dx."], p: [P3, P4], drills: [lin-exp, lin-const, lin-power, lin-gauss, lin-trig, lin-resonant], needs: [EM-1.1.A] }
          - { id: B, std: ["webwork-opl:DE2.1"], do: "Solve a linear ODE whose integrating-factor integral needs integration by parts.", ek: ["∫e^h r dx often pairs a polynomial or trig with an exponential."], p: [P3], drills: [ibp-poly, ibp-over-x-trig, ibp-over-x-exp, ibp-x-exp, ibp-trig-exp, ibp-power-exp], needs: [EM-2.4.A, EM-1.1.B] }
          - { id: C, std: ["webwork-opl:DE2.4"], do: "Reduce a Bernoulli equation to a linear one with u = y^(1−a) and solve it.", ek: ["y′ + py = g y^a ⇒ u′ + (1−a)p u = (1−a)g."], p: [P2, P3], drills: [bern-const, bern-power, bern-exp], needs: [EM-2.4.A] }
      - n: 5
        title: Choosing a first-order method
        book: { kreyszig-10e: ["1.3", "1.4", "1.5"] }
        los:
          - { id: A, do: "Identify which first-order method (separable, substitution, linear, Bernoulli, exact) solves a given ODE.", ek: ["Check in order: separable? linear in y? y^a term? exact? homogeneous in y/x?"], p: [P2], drills: [recog-separable, recog-substitution, recog-linear, recog-bernoulli, recog-exact] }
      - n: 6
        title: Modeling with first-order ODEs
        book: { kreyszig-10e: ["1.3", "1.5"] }
        los:
          - { id: E, std: [], do: "Model a mixing tank whose volume changes because inflow and outflow differ.", ek: ["V(t) = V₀ + (q_in − q_out)t; x′ = c_in q_in − q_out x/V(t) is linear with a variable coefficient."], p: [P1], drills: [model-tank-growing, model-tank-overflow] }
          - { id: A, std: ["webwork-opl:DE2.8", "webwork-opl:MB5.2"], do: "Set up and solve a mixing-tank balance for concentration or mass of solute.", ek: ["dm/dt = (rate in) − (rate out), rate out = (m/V)·Q_out."], p: [P1, P3], drills: [model-mixing] }
          - { id: B, std: ["webwork-opl:DE2.6", "webwork-opl:DE2.10"], do: "Model Newton's cooling and first-order decay, and extract a time constant, half-life or time to reach a value.", ek: ["dT/dt = −k(T − T_a); y = y_0 e^(−kt), t_1/2 = ln 2/k."], p: [P1, P6], drills: [model-cooling, model-decay] }
          - { id: C, std: ["webwork-opl:DE2.7"], do: "Solve the logistic equation and find its equilibria and carrying capacity.", ek: ["y′ = ky(1 − y/K) is separable and Bernoulli; y → K for y_0 > 0."], p: [P1, P6], drills: [model-logistic] }
          - { id: D, std: ["webwork-opl:DE2.5"], do: "Find and classify the equilibria of an autonomous ODE y′ = f(y) from a phase line.", ek: ["f(y*) = 0; stable if f′(y*) < 0."], p: [P6], drills: [em-phase-line] }
      - n: 7
        title: Existence and uniqueness
        book: { kreyszig-10e: ["1.7"] }
        los:
          - { id: A, std: ["webwork-opl:DE2.15"], do: "Decide whether an IVP has a unique solution near the initial point from the continuity of f and ∂f/∂y.", ek: ["f and f_y continuous on a rectangle around (x_0, y_0) ⇒ unique solution on some |x − x_0| < α."], p: [P2], drills: [em-existence] }

  # ── 3 ────────────────────────────────────────────────────────────────────
  - id: second-order
    n: 3
    title: Second-order linear ODEs
    scope: core
    std: ["fe-chemical:1.C", "fe-chemical:15.A"]
    ideas: [LIN, EIG, FORM, MODEL]
    weight_est: "20–25%"
    topics:
      - n: 1
        title: Homogeneous theory, reduction of order and the Wronskian
        book: { kreyszig-10e: ["2.1", "2.6"] }
        los:
          - { id: A, do: "Use superposition to build a general solution from a basis and fit it to an IVP.", ek: ["For a linear homogeneous ODE, any combination c_1y_1 + c_2y_2 of solutions is a solution; two independent ones form a basis."], p: [P4], drills: [em-superposition-ivp] }
          - { id: B, std: ["webwork-opl:DE3.1"], do: "Find a second solution from a known one by reduction of order.", ek: ["y_2 = u y_1, u′ = U = e^(−∫p dx)/y_1² (standard form y″ + py′ + qy = 0)."], p: [P3], drills: [red-euler, red-trig, red-exp, red-gauss, red-const] }
          - { id: C, std: ["webwork-opl:DE3.11"], do: "Compute the Wronskian of two or three functions and use it to decide linear independence.", ek: ["W = det of the functions and their derivatives; W ≠ 0 somewhere ⇒ independent; for ODE solutions W ≡ 0 or never 0 (Abel)."], p: [P3, P5], drills: [wr-exps, wr-repeated, wr-trig, wr-damped, wr-powers, wr-log, wr-dependent] }
      - n: 2
        title: Constant coefficients
        book: { kreyszig-10e: ["2.2", "2.3"] }
        los:
          - { id: C, std: [], do: "Solve a second-order boundary-value problem and decide whether it has none, one or infinitely many solutions.", ek: ["Fit the general solution to the two boundary values; the system is singular exactly when the boundary points sit at zeros of the homogeneous solution."], p: [P1], drills: [bvp-unique, bvp-how-many] }
          - { id: A, std: ["webwork-opl:DE3.3", "webwork-opl:DE3.4", "webwork-opl:DE3.5", "webwork-opl:DE3.6"], do: "Write the general solution of ay″ + by′ + cy = 0 for each of the three root cases of the characteristic equation.", ek: ["Distinct real: e^(λ₁x), e^(λ₂x); double: e^(λx), xe^(λx); complex α ± iβ: e^(αx)cos βx, e^(αx)sin βx."], p: [P2, P3], drills: [char-distinct, char-repeated, char-complex], needs: [EM-1.2.C] }
          - { id: B, std: ["webwork-opl:DE3.6"], do: "Solve a constant-coefficient IVP.", ek: ["Two conditions y(x_0), y′(x_0) fix c_1, c_2."], p: [P4], drills: [char-ivp], needs: [EM-3.2.A] }
      - n: 3
        title: Euler–Cauchy equations
        book: { kreyszig-10e: ["2.5"] }
        los:
          - { id: A, std: ["webwork-opl:DE3.7"], do: "Find the roots of the auxiliary equation of an Euler–Cauchy ODE.", ek: ["x²y″ + axy′ + by = 0 with y = x^m ⇒ m² + (a − 1)m + b = 0."], p: [P2], drills: [ec-roots] }
          - { id: B, std: ["webwork-opl:DE3.7"], do: "Write the general solution of an Euler–Cauchy ODE for each root case and fit an IVP.", ek: ["Distinct: x^(m₁), x^(m₂); double: x^m, x^m ln x; complex: x^μ cos(ν ln x), x^μ sin(ν ln x)."], p: [P3, P4], drills: [ec-distinct, ec-double, ec-complex, ec-ivp], needs: [EM-3.3.A] }
      - n: 4
        title: Free oscillations
        book: { kreyszig-10e: ["2.4"] }
        los:
          - { id: A, std: ["webwork-opl:DE3.2"], do: "Find the natural frequency, period, amplitude and phase of an undamped mass–spring system.", ek: ["my″ + ky = 0 ⇒ ω₀ = √(k/m); A cos ω₀t + B sin ω₀t = C cos(ω₀t − δ), C = √(A² + B²)."], p: [P1, P6], drills: [spring-frequency, spring-amplitude-phase] }
          - { id: B, do: "Solve an undamped oscillator IVP.", ek: ["y(0) and y′(0) give A and B/ω₀."], p: [P4], drills: [spring-undamped-ivp] }
          - { id: C, do: "Classify a damped oscillator as over-, critically or underdamped from c² − 4mk.", ek: ["c² > 4mk overdamped, = critical, < under; underdamped frequency ω* = √(4mk − c²)/2m."], p: [P2, P6], drills: [spring-classify] }
          - { id: D, std: ["webwork-opl:DE3.2"], do: "Solve a damped oscillator IVP in each damping regime.", ek: ["Same three root cases as 3.2.A, with α = −c/2m < 0 so every solution decays."], p: [P3, P4], drills: [spring-over-ivp, spring-critical-ivp, spring-under-ivp], needs: [EM-3.2.B] }
      - n: 5
        title: Nonhomogeneous equations
        book: { kreyszig-10e: ["2.7", "2.10"] }
        los:
          - { id: A, std: ["webwork-opl:DE3.8"], do: "Find a particular solution by undetermined coefficients, including the modification rule.", ek: ["Guess the form of r(x) (poly, e^(γx), cos/sin); multiply by x (or x²) when the guess solves the homogeneous ODE."], p: [P2, P3], drills: [uc-poly, uc-exp, uc-trig, uc-resonance], needs: [EM-3.2.A] }
          - { id: B, do: "Assemble y = y_h + y_p and fit an IVP for a nonhomogeneous ODE.", ek: ["Apply initial conditions to the full solution, never to y_h alone."], p: [P4], drills: [uc-general, vop-general] }
          - { id: C, std: ["webwork-opl:DE3.9"], do: "Find a particular solution by variation of parameters when r(x) is not of undetermined-coefficient form or coefficients vary.", ek: ["y_p = −y₁∫y₂r/W dx + y₂∫y₁r/W dx, ODE in standard form."], p: [P3], drills: [vop-double, vop-trig, vop-euler], needs: [EM-3.1.C] }
      - n: 6
        title: Forced oscillations, resonance and circuits
        book: { kreyszig-10e: ["2.8", "2.9"] }
        los:
          - { id: A, do: "Find the steady-state response of a damped oscillator to sinusoidal forcing and its amplitude.", ek: ["y_p = a cos ωt + b sin ωt; amplitude C*(ω) = F₀/√((k − mω²)² + c²ω²); the transient dies out."], p: [P3, P6], drills: [forced-steady, forced-amplitude, em-chain-forced-oscillator] }
          - { id: B, do: "Recognise undamped resonance and beats and write the resulting solution.", ek: ["ω = ω₀, c = 0 ⇒ t sin ω₀t growth; ω near ω₀ ⇒ beats with envelope frequency |ω − ω₀|/2."], p: [P6], drills: [forced-resonance, forced-beats] }
          - { id: C, do: "Find the practical-resonance frequency of a damped forced oscillator.", ek: ["ω_max² = k/m − c²/2m², exists only if c² < 2mk."], p: [P6], drills: [forced-practical] }
          - { id: D, std: ["webwork-opl:DE3.2"], do: "Model an RLC circuit as a second-order ODE and map it onto the mass–spring analogy.", ek: ["LI″ + RI′ + I/C = E′(t): L ↔ m, R ↔ c, 1/C ↔ k."], p: [P1], drills: [em-rlc] }

  # ── 4 ────────────────────────────────────────────────────────────────────
  - id: higher-order
    n: 4
    title: Higher-order linear ODEs
    scope: core
    std: ["fe-chemical:1.C"]
    ideas: [LIN, EIG]
    weight_est: "5%"
    topics:
      - n: 1
        title: Homogeneous theory and constant coefficients
        book: { kreyszig-10e: ["3.1", "3.2"] }
        los:
          - { id: D, std: [], do: "Find the roots of the auxiliary equation of a third-order Euler–Cauchy ODE.", ek: ["Try y = x^m: x^m factors out of every term, leaving m(m − 1)(m − 2) + a m(m − 1) + b m + c = 0."], p: [P1], drills: [hi-ec-roots, hi-ec-solution] }
          - { id: A, std: ["webwork-opl:DE3.11"], do: "Test n functions for linear independence with the n×n Wronskian.", ek: ["Rows are f, f′, …, f^(n−1); expand by cofactors."], p: [P3], drills: [wr-three], needs: [EM-3.1.C, EM-8.3.A] }
          - { id: B, do: "Find the roots of an n-th order characteristic polynomial.", ek: ["Rational root test, then synthetic division to a quadratic."], p: [P3], drills: [hi-roots] }
          - { id: C, std: ["webwork-opl:DE3.3"], do: "Write the general solution of an n-th order constant-coefficient ODE with distinct, repeated and complex roots, and fit an IVP.", ek: ["A root of multiplicity k gives e^(λx), xe^(λx), …, x^(k−1)e^(λx)."], p: [P3, P4], drills: [hi-distinct, hi-repeated, hi-complex, hi-ivp], needs: [EM-4.1.B] }
      - n: 2
        title: Nonhomogeneous higher-order equations
        book: { kreyszig-10e: ["3.3"] }
        los:
          - { id: B, std: [], do: "Write the form of a particular solution of a higher-order ODE, multiplying by x as often as the root repeats.", ek: ["A forcing term whose exponent matches a characteristic root of multiplicity k needs x^k times the usual trial."], p: [P1], drills: [hi-trial-form, hi-trial-coefficient] }
          - { id: A, std: ["webwork-opl:DE3.8"], do: "Find a particular solution of an n-th order ODE by undetermined coefficients or variation of parameters.", ek: ["Same modification rule; variation of parameters uses Cramer's rule with W_k/W."], p: [P3], drills: ["~uc-general", em-undetermined-third], needs: [EM-3.5.A, EM-4.1.C] }

  # ── 5 ────────────────────────────────────────────────────────────────────
  - id: systems
    n: 5
    title: Systems of ODEs, phase plane and stability
    scope: core
    std: ["fe-chemical:1.C", "fe-chemical:15.A"]
    ideas: [EIG, LIN, MODEL]
    weight_est: "15–20%"
    topics:
      - n: 1
        title: Systems as models
        book: { kreyszig-10e: ["4.1", "4.2"] }
        los:
          - { id: A, std: ["webwork-opl:DE5.1", "webwork-opl:DE5.7"], do: "Convert an n-th order ODE into a first-order system.", ek: ["y₁ = y, y₂ = y′, …; the companion matrix's eigenvalues are the characteristic roots."], p: [P1], drills: ["~phase-ode2", em-first-order-system] }
          - { id: B, std: ["webwork-opl:DE5.1"], do: "Write the rate matrix for series first-order kinetics A → B → C.", ek: ["d[A]/dt = −k₁[A], d[B]/dt = k₁[A] − k₂[B]; C follows from mass conservation."], p: [P1], drills: [kin-matrix] }
      - n: 2
        title: Constant-coefficient systems by eigenvalues
        book: { kreyszig-10e: ["4.3"] }
        los:
          - { id: A, std: ["webwork-opl:DE5.4"], do: "Find the eigenvalues and eigenvectors that give the basis solutions of y′ = Ay.", ek: ["y = x e^(λt) with (A − λI)x = 0."], p: [P3], drills: [sys-eigen], needs: [EM-8.4.A, EM-8.4.B] }
          - { id: B, std: ["webwork-opl:DE5.4"], do: "Write the general solution of a 2×2 system with real distinct eigenvalues and fit an IVP.", ek: ["y = c₁x⁽¹⁾e^(λ₁t) + c₂x⁽²⁾e^(λ₂t)."], p: [P3, P4], drills: [sys-general, sys-ivp, em-chain-system], needs: [EM-5.2.A] }
          - { id: C, std: ["webwork-opl:DE5.5"], do: "Write real solutions of a 2×2 system with complex eigenvalues and fit an IVP.", ek: ["Take real and imaginary parts of x e^((α+iβ)t)."], p: [P3, P4], drills: [sys-complex, sys-complex-ivp], needs: [EM-5.2.A, EM-1.2.A] }
          - { id: D, std: ["webwork-opl:DE5.6"], do: "Solve a 2×2 system with a repeated eigenvalue using a generalised eigenvector.", ek: ["Second solution x t e^(λt) + u e^(λt), (A − λI)u = x."], p: [P3], drills: [sys-repeated] }
          - { id: E, std: ["webwork-opl:DE5.3"], do: "Solve series kinetics A → B → C and find the time of maximum intermediate.", ek: ["Eigenvalues −k₁, −k₂; [B] = k₁A₀(e^(−k₁t) − e^(−k₂t))/(k₂ − k₁); t_max = ln(k₁/k₂)/(k₁ − k₂), = 1/k when k₁ = k₂."], p: [P3, P6], drills: [kin-eigen, kin-B, kin-C, kin-tmax], needs: [EM-5.1.B] }
      - n: 3
        title: Critical points and stability
        book: { kreyszig-10e: ["4.3", "4.4"] }
        los:
          - { id: C, std: ["webwork-opl:DE5.9"], do: "Sketch a phase portrait with eigenvector directions and trajectory orientation.", ek: ["Trajectories leave along the fast-growing eigenvector and approach along the slow-decaying one."], p: [P6], drills: [em-phase-portrait] }
          - { id: A, std: ["webwork-opl:DE5.9"], do: "Classify the critical point of a linear 2×2 system (node, saddle, centre, spiral) from its eigenvalues or from trace and determinant.", ek: ["p = tr A, q = det A, Δ = p² − 4q: q < 0 saddle; q > 0, Δ ≥ 0 node; Δ < 0 spiral (p ≠ 0) or centre (p = 0)."], p: [P2, P6], drills: [phase-matrix, phase-equations, phase-ode2] }
          - { id: B, std: ["webwork-opl:DE5.9"], do: "Decide whether a critical point is stable, asymptotically stable or unstable.", ek: ["Asymptotically stable ⇔ p < 0, q > 0; centre is stable, not asymptotically."], p: [P6], drills: [phase-stability] }
      - n: 4
        title: Nonlinear systems
        book: { kreyszig-10e: ["4.5"] }
        los:
          - { id: A, std: ["webwork-opl:DE5.10"], do: "Find the critical points of a nonlinear autonomous system and linearise at each with the Jacobian.", ek: ["Set f = g = 0; J = [[f_x, f_y], [g_x, g_y]] at the point."], p: [P3], drills: [em-nonlinear-critical] }
          - { id: B, std: ["webwork-opl:DE5.10"], do: "Classify each critical point of a nonlinear system from its linearisation, noting when linearisation is inconclusive.", ek: ["Hyperbolic points keep their type; a linear centre may be a spiral in the nonlinear system."], p: [P6], drills: [em-nonlinear-critical], needs: [EM-5.3.A, EM-5.4.A] }
      - n: 5
        title: Nonhomogeneous linear systems
        book: { kreyszig-10e: ["4.6"] }
        los:
          - { id: A, std: ["webwork-opl:DE5.8"], do: "Find a particular solution of y′ = Ay + g by undetermined coefficients, diagonalisation or variation of parameters.", ek: ["Fundamental matrix Y: y_p = Y∫Y⁻¹g dt."], p: [P3], drills: [em-nonhomog-system] }

  # ── 6 ────────────────────────────────────────────────────────────────────
  - id: series
    n: 6
    title: Series solutions and special functions
    scope: core
    ideas: [TRANS, FORM]
    weight_est: "15%"
    topics:
      - n: 1
        title: Ordinary and singular points
        book: { kreyszig-10e: ["5.1", "5.3"] }
        los:
          - { id: A, std: ["webwork-opl:DE7.2"], do: "Classify a point as ordinary, regular singular or irregular singular.", ek: ["Standard form y″ + py′ + qy = 0: ordinary if p, q analytic; regular singular if (x − x₀)p and (x − x₀)²q are analytic."], p: [P2], drills: [series-classify-point] }
          - { id: B, std: ["webwork-opl:DE7.1"], do: "Give the guaranteed radius of convergence of a power-series solution about an ordinary point.", ek: ["At least the distance to the nearest singular point in the complex plane."], p: [P2], drills: [series-radius], needs: [EM-6.1.A] }
      - n: 2
        title: Power series method
        book: { kreyszig-10e: ["5.1"] }
        los:
          - { id: A, std: ["webwork-opl:DE7.1"], do: "Derive the recurrence relation for the coefficients of a power-series solution.", ek: ["Substitute Σa_m x^m, shift indices to a common power, set each coefficient to zero."], p: [P3], drills: [series-recurrence, series-recurrence-airy], needs: [EM-1.3.A] }
          - { id: B, std: ["webwork-opl:DE7.1"], do: "Generate the first terms of the series solution from the recurrence and initial values.", ek: ["a₀ = y(0), a₁ = y′(0); even and odd coefficients often split into two basis series."], p: [P3, P4], drills: [series-terms, series-terms-airy, em-chain-power-series], needs: [EM-6.2.A] }
      - n: 3
        title: Frobenius method
        book: { kreyszig-10e: ["5.3"] }
        los:
          - { id: A, std: ["webwork-opl:DE7.2"], do: "Find the indicial equation and its roots at a regular singular point.", ek: ["r(r − 1) + b₀r + c₀ = 0, b₀ = lim xp, c₀ = lim x²q."], p: [P3], drills: [frobenius-indicial], needs: [EM-6.1.A] }
          - { id: B, std: ["webwork-opl:DE7.2"], do: "Decide which Frobenius case applies and what form the second solution takes.", ek: ["Roots not differing by an integer: two x^r series; double root: second has ln x; differ by an integer: second may have ln x."], p: [P2], drills: [frobenius-case], needs: [EM-6.3.A] }
          - { id: C, std: ["webwork-opl:DE7.2"], do: "Construct the first Frobenius series solution from the larger indicial root.", ek: ["y = x^r Σa_m x^m; same index-shifting as the power series method."], p: [P3], drills: [em-frobenius-first-solution], needs: [EM-6.3.A, EM-6.2.A] }
      - n: 4
        title: Legendre and Bessel functions
        book: { kreyszig-10e: ["5.2", "5.4", "5.5"] }
        los:
          - { id: A, do: "Recognise Legendre's, Bessel's and Euler–Cauchy equations in a given ODE and read off the order or degree.", ek: ["(1 − x²)y″ − 2xy′ + n(n+1)y = 0; x²y″ + xy′ + (x² − ν²)y = 0."], p: [P2], drills: [spec-identify, spec-legendre-n, spec-bessel-order] }
          - { id: B, std: ["webwork-opl:DE7.3"], do: "Solve a scaled Bessel equation x²y″ + xy′ + (λ²x² − ν²)y = 0 with J_ν(λx), Y_ν(λx).", ek: ["Substitute z = λx."], p: [P2, P3], drills: [spec-bessel-scaled] }
          - { id: C, std: ["webwork-opl:DE7.3"], do: "Write the general solution of Bessel's equation, choosing J₋ν or Y_ν as the second solution.", ek: ["J_ν, J₋ν independent unless ν is an integer, where J₋ₙ = (−1)ⁿJₙ; then use Y_ν."], p: [P2, P5], drills: [spec-bessel-independent] }
          - { id: D, do: "Use Legendre polynomials' explicit form, Rodrigues' formula or orthogonality to evaluate P_n or an integral.", ek: ["P_n(x) = (1/2ⁿn!) dⁿ/dxⁿ (x² − 1)ⁿ; ∫P_mP_n = 0 on [−1, 1] for m ≠ n."], p: [P3], drills: [em-legendre-eval] }

  # ── 7 ────────────────────────────────────────────────────────────────────
  - id: laplace
    n: 7
    title: Laplace transforms
    scope: core
    std: ["fe-chemical:1.C", "fe-chemical:15.A"]
    ideas: [TRANS, LIN, MODEL]
    weight_est: "15%"
    topics:
      - n: 1
        title: The transform, linearity and s-shifting
        book: { kreyszig-10e: ["6.1"] }
        los:
          - { id: A, std: ["webwork-opl:DE4.2"], do: "Find the Laplace transform of a combination of elementary functions from the table, using identities where needed.", ek: ["L{tⁿ} = n!/s^(n+1); L{e^(at)} = 1/(s − a); L{cos ωt} = s/(s² + ω²); sin² = (1 − cos 2t)/2."], p: [P3], drills: [lt-linear, lt-trig, lt-power, lt-hyperbolic, lt-identity] }
          - { id: B, std: ["webwork-opl:DE4.7"], do: "Apply the first shifting theorem forwards and in reverse.", ek: ["L{e^(at)f(t)} = F(s − a); complete the square to expose s − a."], p: [P3], drills: [shift-s-forward, shift-s-inverse] }
      - n: 2
        title: Inverse transforms by partial fractions
        book: { kreyszig-10e: ["6.1", "6.4"] }
        los:
          - { id: A, std: ["webwork-opl:DE4.3"], do: "Invert a rational F(s) by partial fractions with distinct, repeated or complex poles.", ek: ["Repeated pole ⇒ tⁿe^(at)/n!; complex pole pair ⇒ e^(at)(cos, sin)."], p: [P3], drills: [ilt-distinct, ilt-repeated, ilt-complex, ilt-three, ilt-quadratic], needs: [EM-1.1.C] }
      - n: 3
        title: Solving IVPs by Laplace transform
        book: { kreyszig-10e: ["6.2"] }
        los:
          - { id: C, std: [], do: "Find f(0⁺) and f(∞) from F(s) with the initial- and final-value theorems, and say when the final-value theorem fails.", ek: ["f(0⁺) = lim s→∞ sF(s); f(∞) = lim s→0 sF(s), valid only if every pole of sF(s) lies in the open left half-plane."], p: [P1], drills: [lt-final-value, lt-initial-value] }
          - { id: A, std: ["webwork-opl:DE4.1"], do: "Solve a constant-coefficient IVP by transforming, solving the subsidiary equation and inverting.", ek: ["L{y′} = sY − y(0); L{y″} = s²Y − sy(0) − y′(0); initial conditions enter automatically."], p: [P3, P4], drills: [livp-real, livp-complex, livp-double, livp-exp, livp-const], needs: [EM-7.2.A] }
          - { id: B, do: "Identify the transfer function of a linear system and relate its poles to stability and damping.", ek: ["Q(s) = Y/R with zero ICs = 1/(as² + bs + c); poles in the left half-plane ⇔ decay."], p: [P6], drills: [transfer-g, transfer-poles, transfer-stable] }
      - n: 4
        title: Unit step and t-shifting
        book: { kreyszig-10e: ["6.3"] }
        los:
          - { id: D, std: [], do: "Transform a periodic function with the one-period formula.", ek: ["L{f} = ∫₀ᵀ e^(−st) f(t) dt ÷ (1 − e^(−sT))."], p: [P1], drills: [lt-square-wave, lt-sawtooth] }
          - { id: A, std: ["webwork-opl:DE4.6"], do: "Write a piecewise function with unit step functions and transform it.", ek: ["f = f₁ + (f₂ − f₁)u(t − a) + …; L{f(t − a)u(t − a)} = e^(−as)F(s)."], p: [P1, P3], drills: [shift-t-forward, shift-piecewise] }
          - { id: B, std: ["webwork-opl:DE4.7"], do: "Invert a transform containing e^(−as).", ek: ["e^(−as)F(s) ↦ f(t − a)u(t − a)."], p: [P3], drills: [shift-t-inverse] }
          - { id: C, std: ["webwork-opl:DE4.6"], do: "Solve an IVP with switched or piecewise forcing.", ek: ["Transform the step-written forcing; the solution is piecewise with continuous y and y′."], p: [P1, P3], drills: [step-ivp-on, step-ivp-pulse, em-chain-laplace-pulse], needs: [EM-7.3.A, EM-7.4.A] }
      - n: 5
        title: Impulses and the Dirac delta
        book: { kreyszig-10e: ["6.4"] }
        los:
          - { id: A, std: ["webwork-opl:DE4.5"], do: "Model a sudden impulse with δ(t − a) and solve the resulting IVP, including the impulse response.", ek: ["L{δ(t − a)} = e^(−as); impulse response = L⁻¹{transfer function}."], p: [P1, P3], drills: [delta-ivp, delta-response] }
      - n: 6
        title: Convolution and integral equations
        book: { kreyszig-10e: ["6.5"] }
        los:
          - { id: A, std: ["webwork-opl:DE4.4"], do: "Compute a convolution integral directly.", ek: ["(f * g)(t) = ∫₀ᵗ f(τ)g(t − τ)dτ."], p: [P3], drills: [conv-compute] }
          - { id: B, std: ["webwork-opl:DE4.4"], do: "Invert a product of transforms or transform an integral using the convolution theorem.", ek: ["L{f * g} = FG; L{∫₀ᵗ f dτ} = F/s."], p: [P3], drills: [conv-inverse, conv-transform] }
          - { id: C, std: ["webwork-opl:DE4.4"], do: "Solve a Volterra integral equation of convolution type.", ek: ["Transform, solve for Y algebraically, invert."], p: [P3], drills: [conv-volterra], needs: [EM-7.6.B] }
      - n: 7
        title: Transform derivatives and systems
        book: { kreyszig-10e: ["6.6", "6.7"] }
        los:
          - { id: A, do: "Use L{tf(t)} = −F′(s) to transform or invert functions and solve ODEs with linear coefficients.", ek: ["Differentiation in s ↔ multiplication by −t; integration in s ↔ division by t."], p: [P3], drills: [tmul-forward, tmul-inverse] }
          - { id: B, std: ["webwork-opl:DE4.1"], do: "Solve a linear system of ODEs by Laplace transform.", ek: ["Transform each equation, solve the algebraic system (Cramer), invert each component."], p: [P3], drills: [lsys-ivp, lsys-forced, em-chain-tank-cascade], needs: [EM-7.3.A] }

  # ── 8 ────────────────────────────────────────────────────────────────────
  - id: linear-algebra
    n: 8
    title: Linear algebra for ODEs
    scope: core
    std: ["fe-chemical:1.E"]
    ideas: [LIN, EIG]
    weight_est: "as needed"
    topics:
      - n: 1
        title: Linear systems and Gauss elimination
        book: { kreyszig-10e: ["7.3", "7.5"] }
        los:
          - { id: A, do: "Solve a linear system by row reduction and state whether it has none, one or infinitely many solutions.", ek: ["Echelon form; rank A vs rank [A|b] decides existence; free variables give a family."], p: [P3], drills: [la-system] }
      - n: 2
        title: Linear independence and rank
        book: { kreyszig-10e: ["7.4"] }
        los:
          - { id: A, do: "Decide whether a set of vectors is linearly independent.", ek: ["Independent ⇔ only the trivial combination is zero ⇔ rank = number of vectors; for n vectors in ℝⁿ, det ≠ 0."], p: [P2], drills: [la-independence] }
      - n: 3
        title: Determinants and inverses
        book: { kreyszig-10e: ["7.6", "7.7", "7.8"] }
        los:
          - { id: A, do: "Evaluate a 3×3 determinant by cofactor expansion.", ek: ["Expand along the row or column with most zeros; sign pattern (−1)^(i+j)."], p: [P3], drills: [la-det] }
          - { id: B, do: "Find the inverse of a 2×2 matrix, or show it does not exist.", ek: ["A⁻¹ = (1/det A)[[d, −b], [−c, a]]; singular ⇔ det A = 0."], p: [P3], drills: [la-inverse] }
      - n: 4
        title: The matrix eigenvalue problem
        book: { kreyszig-10e: ["8.1", "8.2"] }
        los:
          - { id: A, do: "Find the eigenvalues of a 2×2 matrix from its characteristic polynomial.", ek: ["λ² − (tr A)λ + det A = 0."], p: [P3], drills: [la-eigenvalues] }
          - { id: B, do: "Find an eigenvector for each eigenvalue of a 2×2 matrix.", ek: ["Solve (A − λI)x = 0; one row suffices in 2×2."], p: [P3], drills: [la-eigenvector], needs: [EM-8.4.A] }
      - n: 5
        title: Symmetric matrices and diagonalisation
        book: { kreyszig-10e: ["8.3", "8.4"] }
        los:
          - { id: A, do: "Diagonalise a matrix with a full set of eigenvectors and use it to decouple a linear system.", ek: ["D = X⁻¹AX; symmetric A has real eigenvalues and orthogonal eigenvectors."], p: [P3], drills: [em-diagonalise], needs: [EM-8.4.B, EM-8.3.B] }
      - n: 6
        title: Rank, orthogonality and least squares
        los:
          - { id: A, do: "Find the rank of a matrix and the dimension of its null space.", ek: ["Rank + nullity = number of columns."], p: [P3], drills: [la-rank-nullity, la-rank-3x3] }
          - { id: B, do: "Project one vector onto another, test orthogonality, and take one Gram–Schmidt step.", ek: ["proj_u y = (y·u / u·u) u; subtracting it leaves the part orthogonal to u."], p: [P3], drills: [la-projection-scalar, la-gram-schmidt-step, la-orthogonal-check] }
          - { id: C, do: "Set up and solve a least-squares problem with the normal equations, and say what the solution means geometrically.", ek: ["AᵀA x̂ = Aᵀb; Ax̂ is the projection of b onto Col A."], p: [P3, P6], drills: [la-least-squares-slope, la-least-squares-facts] }
          - { id: D, do: "Use eigenvalues to find powers and traces, know when a matrix is diagonalisable, and read a singular value.", ek: ["A^k has eigenvalues λ^k; symmetric matrices are always diagonalisable; σ = √(eigenvalue of AᵀA)."], p: [P3, P6], drills: [la-trace-of-power, la-diagonalizable-facts, la-singular-value] }

  # ── 9 ────────────────────────────────────────────────────────────────────
  - id: bvp
    n: 9
    title: Fourier series and Sturm–Liouville boundary-value problems
    scope: core
    ideas: [EIG, TRANS, LIN]
    weight_est: "10–15%"
    topics:
      - n: 1
        title: Fourier series
        book: { kreyszig-10e: ["11.1", "11.2"] }
        los:
          - { id: E, std: [], do: "Find what a Fourier series converges to at a jump, and sum a series of coefficients with Parseval's identity.", ek: ["At a jump the series gives the average of the one-sided limits; Parseval: a₀²/2 + Σ(aₙ² + bₙ²) = (1/π)∫f² over a period (period 2π, a₀ the full constant)."], p: [P1], drills: [fs-jump-value, fs-parseval] }
          - { id: A, std: ["webwork-opl:CA7.20", "webwork-opl:DE8.7"], do: "Compute the Fourier coefficients of a 2π-periodic function given on one period.", ek: ["a₀ = (1/2π)∫f, a_n = (1/π)∫f cos nx, b_n = (1/π)∫f sin nx over (−π, π)."], p: [P3], drills: [fs-step, fs-sawtooth, fs-parabola, fs-abs], needs: [EM-1.1.B] }
          - { id: B, std: ["webwork-opl:CA7.20", "webwork-opl:DE8.7"], do: "Compute the Fourier series of a function of period 2L, using even/odd symmetry to skip coefficients.", ek: ["Replace nx by nπx/L and 1/π by 1/L; even ⇒ cosine series, odd ⇒ sine series."], p: [P2, P3], drills: [fs-period-2l] }
          - { id: C, std: ["webwork-opl:CA7.20"], do: "Write the half-range sine or cosine expansion of a function on (0, L).", ek: ["Odd extension ⇒ sine series; even extension ⇒ cosine series; b_n = (2/L)∫₀ᴸ f sin(nπx/L)."], p: [P3], drills: [fs-half-range] }
          - { id: D, do: "Find the periodic steady-state response of an oscillator to a periodic non-sinusoidal force by Fourier series.", ek: ["Solve term by term; the term with nω nearest ω₀ dominates."], p: [P3, P6], drills: [em-fourier-forced-response], needs: [EM-9.1.A, EM-3.6.A] }
      - n: 2
        title: Sturm–Liouville problems
        book: { kreyszig-10e: ["11.5"] }
        los:
          - { id: F, std: [], do: "Find the eigenvalues and eigenfunctions of y″ + λy = 0 with periodic boundary conditions.", ek: ["y(−L) = y(L), y′(−L) = y′(L): λ₀ = 0 with a constant, then λₙ = (nπ/L)² each with two eigenfunctions cos and sin."], p: [P1], drills: [sl-periodic-eigen, sl-periodic-facts] }
          - { id: A, do: "Rewrite a second-order eigenvalue ODE in Sturm–Liouville form and identify p, q and r.", ek: ["(py′)′ + (q + λr)y = 0; multiply by the integrating factor e^(∫a₁/a₂)/a₂ when needed."], p: [P2], drills: [sl-form] }
          - { id: B, do: "Classify a Sturm–Liouville problem as regular, periodic or singular.", ek: ["Regular: p > 0, r > 0 on [a, b] with separated BCs; periodic: y(a) = y(b), y′(a) = y′(b); singular: p vanishes at an end."], p: [P2], drills: [sl-classify], needs: [EM-9.2.A] }
          - { id: C, std: ["webwork-opl:DE3.10"], do: "Find the eigenvalues of y″ + λy = 0 under Dirichlet, Neumann or mixed boundary conditions.", ek: ["Check λ < 0, = 0, > 0 separately; Dirichlet on [0, L]: λ = (nπ/L)², n ≥ 1."], p: [P3, P4], drills: [sl-eigenvalues] }
          - { id: D, do: "Find the eigenfunction belonging to each eigenvalue.", ek: ["Determined up to a constant multiple; sin(nπx/L), cos(nπx/L) or sin((2n−1)πx/2L)."], p: [P4], drills: [sl-eigenfunctions], needs: [EM-9.2.C] }
          - { id: E, do: "Find the eigenvalues and eigenfunctions of a shifted problem y″ + (λ + c)y = 0 and count its negative eigenvalues.", ek: ["Set μ = λ + c, solve as 9.2.C, then λ = μ − c."], p: [P3, P4], drills: [sl-shift-eigenvalues, sl-shift-eigenfunctions, sl-shift-negative], needs: [EM-9.2.C] }
      - n: 3
        title: Orthogonality and eigenfunction expansions
        book: { kreyszig-10e: ["11.5", "11.6"] }
        los:
          - { id: A, do: "Verify orthogonality of eigenfunctions with respect to the weight r(x).", ek: ["∫ₐᵇ r y_m y_n dx = 0 for m ≠ n in a regular or periodic S–L problem."], p: [P5], drills: [em-orthogonality] }
          - { id: B, do: "Expand a function in a generalised Fourier series of S–L eigenfunctions (e.g. Legendre or Fourier–Bessel).", ek: ["a_n = ∫ r f y_n dx / ∫ r y_n² dx."], p: [P3], drills: [em-legendre-expansion], needs: [EM-9.3.A] }
      - n: 4
        title: "Green's functions"
        los:
          - { id: A, std: [], do: "Build the Green's function of y″ = f with y(0) = y(L) = 0 and use it to solve for a given f.", ek: ["G(x, s) = x(s − L)/L for x < s and s(x − L)/L for x > s: continuous at x = s, slope jumps by 1, zero at both ends; y = ∫G f ds."], p: [P1], drills: [gf-string-value, gf-string-solve] }
          - { id: B, std: [], do: "Build the Green's function of y″ + k²y = f with fixed ends from the homogeneous solutions and the jump condition.", ek: ["G = −sin(kx_<) sin(k(L − x_>))/(k sin kL); it fails to exist exactly when kL = nπ, an eigenvalue of the homogeneous problem."], p: [P1], drills: [gf-helmholtz-value, gf-existence] }
          - { id: C, std: [], do: "Solve a forced initial-value problem by convolving the forcing with the impulse response.", ek: ["For y″ + ω²y = f, g(t) = sin(ωt)/ω; for τy′ + y = f, g(t) = e^(−t/τ)/τ; y = ∫₀ᵗ g(t − u) f(u) du from rest."], p: [P1], drills: [gf-oscillator-step, gf-lag-ramp] }

  # ── extensions (beyond CBE 200) ──────────────────────────────────────────
  - id: pde
    n: 10
    title: Partial differential equations
    scope: core
    ideas: [EIG, TRANS, MODEL]
    note: "Scaffolded to the CBE 200 final and the grid in drills/matrices/pde-1d.yaml: separate → eigenvalue problem by boundary type → coefficients → shifts and sources → other geometries → transforms → numerics."
    topics:
      - n: 1
        title: Basic concepts, classification and separation
        book: { kreyszig-10e: ["12.1", "12.3"] }
        los:
          - { id: B, do: "Substitute u = X(x)T(t) (or X(x)Y(y)), split into two ODEs with a separation constant, and decide the constant's sign from the boundary conditions.", ek: ["Only the sign that gives sines and cosines can meet two zero boundary conditions nontrivially."], p: [P2], drills: [mt-separate, mt-sign-of-constant, mt-ode-solution], needs: [EM-3.1.A] }
          - { id: A, std: ["webwork-opl:DE1.2", "webwork-opl:DE8.1", "webwork-opl:DE8.2"], do: "Classify a second-order linear PDE as elliptic, parabolic or hyperbolic and verify a solution.", ek: ["Au_xx + 2Bu_xy + Cu_yy: AC − B² > 0 elliptic, = 0 parabolic, < 0 hyperbolic."], p: [P2], drills: [pde-classify, pde-verify] }
      - n: 2
        title: Heat equation by separation of variables
        book: { kreyszig-10e: ["12.5", "12.6"] }
        los:
          - { id: D, do: "Find the eigenvalues and eigenfunctions for Dirichlet, Neumann, mixed and convective (Robin) ends.", ek: ["Dirichlet sin(nπx/L); Neumann cos(nπx/L) with n = 0; mixed sin((2n−1)πx/2L); Robin: a transcendental condition such as λ tan λL = h."], p: [P2, P3], drills: [mt-bc-eigenfunctions, mt-bc-kills, mt-eigenvalue, pde-eigen-condition], needs: [EM-10.1.B] }
          - { id: E, do: "Compute the Fourier sine or cosine coefficients of the initial condition.", ek: ["b_n = (2/L)∫ f sin(nπx/L) dx; a constant start has odd modes only, 4U/nπ."], p: [P3], drills: [mt-coefficient-formula, mt-sine-coefficient-constant, mt-sine-coefficient-linear], needs: [EM-9.1.C, EM-10.2.D] }
          - { id: A, do: "Separate u = F(x)G(t) in the heat equation and find each mode's decay rate.", ek: ["F″ + kF = 0 (an S–L problem), G′ + c²kG = 0 ⇒ G = e^(−c²λ_n t)."], p: [P2, P3], drills: [pde-rates, mt-heat-time-constant], needs: [EM-9.2.C, EM-10.1.B] }
          - { id: B, std: ["webwork-opl:DE8.3"], do: "Solve the heat equation on a finite rod with Dirichlet or insulated ends by Fourier series.", ek: ["Dirichlet ⇒ sine series; insulated ⇒ cosine series with a constant term (the mean)."], p: [P3, P4], drills: [pde-heat, pde-neumann, mt-solution-form, mt-read-coefficients, mt-insulated-steady-state], needs: [EM-10.2.A, EM-10.2.E] }
          - { id: C, std: ["webwork-opl:DE8.3"], do: "Solve the heat equation with nonzero fixed ends by subtracting the steady state.", ek: ["u = u_s(x) + v; u_s linear; v satisfies zero BCs with v(x, 0) = f − u_s."], p: [P2, P3], drills: [pde-steady, pde-shift-concepts, pde-steady-state-value, pde-shifted-initial-condition, pde-shifted-sine-coefficient, em-chain-heat-nonzero], needs: [EM-10.2.B] }
          - { id: F, do: "Find the steady state with a flux or insulated end, and handle a flux boundary in the transient problem.", ek: ["−k u'(L) = q″ fixes the slope; with insulated ends the steady state is the initial mean."], p: [P2, P3], drills: [pde-flux-end-steady-state], needs: [EM-10.2.C] }
          - { id: G, do: "Shift a boundary value that changes in time (w = x g(t)/L) and identify the source term it leaves in the equation.", ek: ["v = u − w has zero ends and v_t = k v_xx − w_t + k w_xx."], p: [P2], drills: [pde-time-bc-shift], needs: [EM-10.2.C] }
          - { id: H, std: ["webwork-opl:DE8.8"], do: "Solve the heat equation with a source: steady state from k u_s″ = −Q, transient by expanding the source in the eigenfunctions.", ek: ["Both ends zero: u_s = Qx(L − x)/2k; each mode obeys T_n′ + λ_n T_n = q_n."], p: [P3], drills: [pde-source-steady, pde-source-mode], needs: [EM-10.2.C, EM-10.2.E] }
      - n: 3
        title: Wave equation
        book: { kreyszig-10e: ["12.2", "12.3", "12.4"] }
        los:
          - { id: A, std: ["webwork-opl:DE8.4"], do: "Solve the vibrating string by separation of variables and Fourier series.", ek: ["u = Σ(B_n cos λ_n t + B_n* sin λ_n t) sin(nπx/L), λ_n = cnπ/L."], p: [P3, P4], drills: [pde-wave, mt-string-frequency, mt-string-time-factor], needs: [EM-9.1.C, EM-10.2.D] }
          - { id: B, std: ["webwork-opl:DE8.4"], do: "Write d'Alembert's solution for an infinite string from initial displacement and velocity.", ek: ["u = ½[f(x + ct) + f(x − ct)] + (1/2c)∫ g."], p: [P3], drills: [dalembert-displacement, dalembert-velocity] }
      - n: 4
        title: Laplace's equation and other geometries
        book: { kreyszig-10e: ["12.6", "12.10", "12.11"] }
        los:
          - { id: A, std: ["webwork-opl:DE8.5"], do: "Solve the steady 2-D Dirichlet problem on a rectangle by separation, one nonzero side at a time.", ek: ["The direction with two zero sides oscillates (sines); the other carries sinh or cosh; superpose one problem per nonzero side."], p: [P3], drills: [laplace-rect-modes, laplace-rect-coef, mt-which-variable-oscillates, mt-other-direction, pde-laplace-nonzero-sides], needs: [EM-10.2.D] }
          - { id: B, std: ["webwork-opl:DE8.6"], do: "Separate a PDE in polar, cylindrical or spherical coordinates and identify the Bessel or Legendre equation that appears.", ek: ["Radial part in cylinders ⇒ Bessel; polar angle in spheres ⇒ Legendre in cos θ."], p: [P2], drills: ["~spec-identify", em-separation-coordinates], needs: [EM-6.4.A] }
          - { id: C, do: "Solve transient conduction in a cylinder with Fourier–Bessel series, including a nonzero wall temperature by shifting.", ek: ["u = ΣA_nJ₀(α_nr/a)e^(−k(α_n/a)²t); weight r; uniform start A_n = 2U/(α_nJ₁(α_n))."], p: [P3], drills: [mt-bessel-condition, mt-bessel-weight, mt-bessel-decay-length, pde-cylinder-wall], needs: [EM-10.4.B, EM-9.3.B] }
          - { id: D, do: "Solve transient conduction in a sphere with v = r·u, which turns it into a rod.", ek: ["v_t = kv_rr, v(0) = v(a) = 0; u = Σ B_n sin(nπr/a)e^(−k(nπ/a)²t)/r."], p: [P3], drills: [pde-sphere], needs: [EM-10.4.B, EM-10.2.B] }
      - n: 5
        title: Transform methods for PDEs
        book: { kreyszig-10e: ["12.7", "12.12"] }
        los:
          - { id: D, std: [], do: "Write the heat kernel as the Green's function of the diffusion equation and use images for a fixed or insulated end.", ek: ["G = e^(−(x−x₀)²/4κt)/√(4πκt) on the line; on x > 0 subtract the mirror image for u(0) = 0, add it for an insulated end."], p: [P1], drills: [gf-image-fixed, gf-image-insulated] }
          - { id: A, std: ["cheme-grad-core:MM.5"], do: "Solve a PDE on a semi-infinite or infinite domain by Laplace or Fourier transform.", ek: ["Transform out t (Laplace) or x (Fourier) to get an ODE in the other variable; bounded at infinity keeps e^(−√s x)."], p: [P3], drills: [em-semi-infinite-heat, pde-lt-steps, pde-lt-decay-rate, pde-lt-erfc-value], needs: [EM-7.1.A] }
          - { id: B, std: ["webwork-opl:CX8.5", "cheme-grad-core:MM.5"], do: "Solve a finite rod by Laplace transform and invert by residues: the poles are the eigenvalues.", ek: ["Residue at s = 0 is the steady state; s_n = −(nπ/L)² rebuild the Fourier series."], p: [P3, P4], drills: [pde-lt-finite-rod-amplitude, pde-lt-pole-is-eigenvalue, pde-lt-residues], needs: [EM-10.5.A, EM-10.2.B] }
          - { id: C, do: "Choose the method for a PDE problem: separation, shift, transform or numerics.", ek: ["Finite domain with homogeneous BCs: separate. Nonzero BCs: shift first. Semi-infinite: transform. Messy geometry or data: finite differences."], p: [P2], drills: [pde-method-choice], needs: [EM-10.5.B, EM-10.2.C] }
      - n: 6
        title: Finite differences for PDEs
        book: { kreyszig-10e: ["21.4", "21.6"] }
        los:
          - { id: A, do: "Write central-difference approximations and state their truncation order.", ek: ["u_xx ≈ (u_{i+1} − 2u_i + u_{i−1})/h², O(h²); forward difference is O(h)."], p: [P2], drills: [mt-central-second-difference, mt-truncation-order] }
          - { id: B, do: "Take an explicit time step and check stability.", ek: ["u_i^{n+1} = u_i + r(u_{i+1} − 2u_i + u_{i−1}), stable for r = kΔt/h² ≤ ½."], p: [P3, P5], drills: [mt-explicit-step, mt-explicit-stability, mt-amplification], needs: [EM-10.6.A] }
          - { id: C, do: "Handle a flux or insulated boundary with a ghost node.", ek: ["u_{−1} = u_1 − 2h g from the central difference of u_x(0) = g."], p: [P3], drills: [pde-fd-ghost], needs: [EM-10.6.B] }
          - { id: D, do: "Take an implicit or Crank–Nicolson step by solving the tridiagonal system.", ek: ["θ = 1 backward Euler, θ = ½ Crank–Nicolson; unconditionally stable; Thomas algorithm."], p: [P3, P4], drills: [pde-fd-implicit], needs: [EM-10.6.B, EM-8.1.A] }

  - id: fourier-transforms
    n: 11
    title: Fourier integrals and transforms
    scope: extension
    ideas: [TRANS]
    topics:
      - n: 1
        title: Fourier integral and transforms
        book: { kreyszig-10e: ["11.7", "11.8", "11.9"] }
        los:
          - { id: A, do: "Represent a non-periodic function by its Fourier integral, or its cosine or sine transform.", ek: ["Limit L → ∞ of the Fourier series; even ⇒ cosine transform, odd ⇒ sine."], p: [P3], drills: [em-fourier-cosine-sine] }
          - { id: B, std: ["cheme-grad-core:MM.5"], do: "Compute a Fourier transform and use its derivative property to turn an ODE into algebra.", ek: ["F{f′} = iwF{f}; F{e^(−ax²)} is Gaussian."], p: [P3], drills: [em-fourier-transform-value, em-fourier-derivative-rule] }
          - { id: C, std: [], do: "Compute Fourier transforms of the Gaussian and the rectangular pulse.", ek: ["With f̂(w) = (1/√2π)∫f e^(−iwx)dx: e^(−ax²) → e^(−w²/4a)/√(2a); a pulse of height 1 on |x| < b → √(2/π) sin(bw)/w."], p: [P1], drills: [ft-gaussian, ft-rect] }
          - { id: D, std: [], do: "Use the shift, scaling and convolution properties of the Fourier transform.", ek: ["f(x − c) → e^(−iwc)f̂; f(bx) → f̂(w/b)/|b|; f∗g → √(2π) f̂ ĝ."], p: [P1], drills: [ft-scaling, ft-properties] }
          - { id: E, std: ["cheme-grad-core:MM.5"], do: "Solve the heat equation on an infinite line by Fourier transform and read the spreading Gaussian.", ek: ["A point release Q spreads as u = Q e^(−x²/4κt)/√(4πκt): the peak falls as t^(−1/2) and the variance grows as 2κt."], p: [P1], drills: [ft-heat-peak, ft-heat-spread] }
          - { id: F, std: [], do: "Convolve functions directly and through the Fourier transform: Gaussians, pulses, and an initial profile spreading by diffusion.", ek: ["Gaussian widths add in quadrature (σ² = σ₁² + σ₂²); two pulses give a triangle; u(x, t) = u₀ ∗ heat kernel, so σ² grows by 2κt."], p: [P1], drills: [fc-gaussians, fc-pulses, fc-heat-spread] }
      - n: 2
        title: "Random walks and the diffusion limit"
        los:
          - { id: A, std: [], do: "Compute end-point probabilities and moments of a 1-D random walk, with or without bias.", ek: ["N steps of ±a: P(m) = C(N, (N + m)/2)/2^N; ⟨x⟩ = Na(2p − 1), Var x = 4Np(1 − p)a², so ⟨x²⟩ = Na² when unbiased."], p: [P1], drills: [rw-endpoint, rw-biased-msd] }
          - { id: B, std: [], do: "Take the diffusion limit of a random walk: D from step length and time, and the time to diffuse a distance.", ek: ["D = a²/(2Δt) in 1-D; ⟨x²⟩ = 2Dt, and ⟨r²⟩ = 2dDt in d dimensions; t ~ L²/(2D)."], p: [P1], drills: [rw-diffusivity, rw-diffuse-time] }
          - { id: C, std: [], do: "Use the Gaussian limit of the walk to find the fraction of walkers past a distance, and add the variances of successive stages.", ek: ["P(x, t) = e^(−x²/4Dt)/√(4πDt); fraction beyond |x| > ℓ is erfc(ℓ/√(4Dt)); independent stages convolve, so variances add."], p: [P1], drills: [rw-tail, rw-stages] }

  - id: vector-calculus
    n: 12
    title: Vector calculus for transport
    scope: extension
    ideas: [MODEL]
    topics:
      - n: 1
        title: Grad, div, curl and the integral theorems
        book: { kreyszig-10e: ["9.7", "9.8", "9.9", "10.7", "10.9"] }
        los:
          - { id: B, std: ["webwork-opl:FM4.2"], do: "Derive a differential conservation equation from an integral balance with the divergence theorem.", ek: ["∭∇·F dV = ∯F·n dA ⇒ ∂c/∂t + ∇·N = R."], p: [P1], drills: [ca-conservation-law] }
          - { id: C, std: [], do: "Compute the Laplacian of a radial function in cylindrical and spherical coordinates.", ek: ["Cylindrical: (1/r)(r f′)′; spherical: (1/r²)(r² f′)′; for f = rⁿ these are n² r^(n−2) and n(n + 1) r^(n−2)."], p: [P1], drills: [vc-laplacian-radial, vc-harmonic-radial] }
          - { id: D, std: [], do: "Solve steady radial conduction or diffusion in a cylindrical or spherical shell.", ek: ["Cylinder: T = A ln r + B; sphere: T = A/r + B; fit the inner and outer values."], p: [P1], drills: [vc-shell-temperature, vc-shell-heat] }
          - { id: E, std: [], do: "Compute the divergence of a radial field in cylindrical and spherical coordinates.", ek: ["∇·(F(r) e_r) = (1/r)(rF)′ in a cylinder and (1/r²)(r²F)′ in a sphere."], p: [P1], drills: [vc-div-radial, vc-flux-conservation] }
          - { id: A, do: "Compute the gradient, divergence, curl and Laplacian of a field in Cartesian coordinates.", ek: ["∇f, ∇·v, ∇×v, ∇²f = ∇·∇f."], p: [P3], drills: ["~mv-partial", cm-gradient, cm-div-curl, cm-laplacian] }

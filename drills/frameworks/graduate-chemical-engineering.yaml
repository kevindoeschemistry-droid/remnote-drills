# Graduate Chemical Engineering Core — curriculum framework (draft 1, for Kevin's markup)
#
# Basis: the UC Irvine CBE graduate core (CBE 200, 210, 220A, 220B, 240), read through the 2025-26
# catalogue descriptions. The M.S. comprehensive exam and the Ph.D. preliminary exam are based in part on
# these courses (graduate handbook). No syllabus or past exam was read, so the objectives are a house list
# on the catalogue topics, written past the undergraduate frameworks: the FE-level material lives in Fluid
# Mechanics, Heat Transfer, Mass Transfer, Thermodynamics, Reaction Engineering and Process Design.
#
# Units follow the courses: 220B momentum, 220A heat and mass, 240 thermodynamics, 210 reactors, and the
# process dynamics and control named in CBE 200's description. Generated by scripts/opl_fill.py from
# scripts/opl_specs/gc.py; the unit block below is replaced on every run.
id: graduate-chemical-engineering
title: Graduate Chemical Engineering Core
code: GC
draft: 1
track: engineering
requires: [fluid-mechanics, heat-transfer, mass-transfer, thermodynamics, reaction-engineering, process-design, engineering-math]
level: 6
domains: [gc]

basis:
  primary: uci-cbe-core
  also: [pe-chemical]
  note: "UCI's graduate core courses by catalogue description (read in part); no syllabus or past comprehensive exam was read, so the objectives are ours. PE Chemical is the nearest published exam and stops below this level."

big_ideas:
  - id: SOLVE
    title: Solve the governing equation, then read off the quantity
    text: A velocity, temperature or concentration field comes from a balance with its boundary conditions; forces, fluxes and rates are integrals or gradients of that field.
  - id: STABLE
    title: Steady is not the same as stable
    text: A reactor, a mixture or a control loop can sit at a solution of its equations and still run away from it; a slope or a curvature decides.

practices:
  - id: P1
    title: Compute
    text: Carry the model to a number with units.
  - id: P2
    title: Judge
    text: Decide stability, regime or direction from a derivative or a dimensionless group.

units:
  # >>> opl-fill:gc-core (generated by scripts/opl_fill.py; edit the spec)
  - id: gc-momentum
    n: 1
    title: "Momentum transport (CBE 220B)"
    scope: core
    std: ["uci-cbe-core:220B"]
    ideas: [SOLVE]
    topics:
      - n: 1
        title: "Viscous, creeping and inviscid flow"
        los:
          - { id: A, std: ["uci-cbe-core:220B"], do: "Find the flow rate in an annulus from the Navier–Stokes equation in cylindrical coordinates.", ek: ["Solve (1/r)(r v′)′ = −(ΔP/L)/μ with no slip on both walls."], p: [P1], drills: [gc-annulus-flow, gc-annulus-vs-pipe] }
          - { id: B, std: ["uci-cbe-core:220B"], do: "Find the torque in circular Couette flow.", ek: ["v_θ = Ar + B/r; the torque on the inner cylinder is 4πμΩκ²R²/(1 − κ²) per unit length."], p: [P1], drills: [gc-couette-torque, gc-couette-shear-rate] }
          - { id: C, std: ["uci-cbe-core:220B"], do: "Find the force in a squeeze film from lubrication theory.", ek: ["Thin gap: p(r) = 3μV(R² − r²)/h³; F = 3πμVR⁴/(2h³)."], p: [P1], drills: [gc-squeeze-film, gc-squeeze-time] }
          - { id: D, std: ["uci-cbe-core:220B"], do: "Find the friction drag of a laminar boundary layer.", ek: ["Blasius: local τ_w = 0.332ρU²/√Re_x; average C_f = 1.328/√Re_L."], p: [P1], drills: [gc-blasius-drag, gc-blasius-length-scaling] }
          - { id: E, std: ["uci-cbe-core:220B"], do: "Find the pressure on a cylinder in potential flow.", ek: ["Surface speed 2U sin θ, so C_p = 1 − 4 sin²θ."], p: [P1], drills: [gc-cylinder-cp, gc-cylinder-pressure-drop] }
          - { id: F, std: ["uci-cbe-core:220B"], do: "Find the flow rate of a power-law fluid in a tube.", ek: ["Q = πR³ n/(3n + 1) (ΔP R/(2mL))^{1/n}."], p: [P1], drills: [gc-power-law-tube, gc-apparent-viscosity] }
          - { id: G, std: ["uci-cbe-core:220B"], do: "Find the start-up time of viscous flow.", ek: ["The slowest mode of Couette start-up decays as exp(−π²νt/h²)."], p: [P1], drills: [gc-startup-time, gc-stokes-first-problem] }
          - { id: H, std: ["uci-cbe-core:220B"], do: "Use the turbulent log law.", ek: ["u⁺ = (1/0.41) ln y⁺ + 5.0, with u* = √(τ_w/ρ) and y⁺ = y u*/ν."], p: [P1], drills: [gc-log-law, gc-wall-region] }
          - { id: I, std: ["uci-cbe-core:220B"], do: "Compare the fall of a drop with that of a rigid sphere.", ek: ["Hadamard–Rybczynski: drag 2πμaU(2 + 3λ)/(1 + λ), λ = μ_drop/μ."], p: [P1], drills: [gc-drop-drag, gc-bubble-terminal] }
  - id: gc-transport
    n: 2
    title: "Heat and mass transport (CBE 220A)"
    scope: core
    std: ["uci-cbe-core:220A"]
    ideas: [SOLVE]
    topics:
      - n: 1
        title: "Scaling, unsteady and convective transport"
        los:
          - { id: A, std: ["uci-cbe-core:220A"], do: "Find the Taylor dispersion coefficient.", ek: ["K = D + U²a²/(48D) for laminar flow in a tube of radius a."], p: [P1], drills: [gc-taylor-dispersion, gc-taylor-coefficient] }
          - { id: B, std: ["uci-cbe-core:220A"], do: "Find the temperature rise from viscous heating.", ek: ["Couette flow with both walls at T₀: ΔT_max = μV²/(8k)."], p: [P1], drills: [gc-brinkman, gc-brinkman-adiabatic] }
          - { id: C, std: ["uci-cbe-core:220A"], do: "Find a freezing time from the quasi-steady Stefan problem.", ek: ["ρL dδ/dt = kΔT/δ, so δ = √(2kΔT t/(ρL))."], p: [P1], drills: [gc-stefan-freeze, gc-stefan-thickness] }
          - { id: D, std: ["uci-cbe-core:220A"], do: "Find the diffusion coefficient of a salt (ambipolar diffusion).", ek: ["Zero current couples the ions: D = 2D₊D₋/(D₊ + D₋) for a 1:1 salt."], p: [P1], drills: [gc-ambipolar, gc-transference] }
          - { id: E, std: ["uci-cbe-core:220A"], do: "Find a flux with a surface reaction that changes the moles.", ek: ["For A → 2B at a catalytic surface, N_B = −2N_A, so N_A = (cD/δ) ln(1 + y_A0)."], p: [P1], drills: [gc-film-reaction-flux, gc-flux-model-ratio] }
          - { id: F, std: ["uci-cbe-core:220A"], do: "Find an average mass-transfer coefficient on a flat plate.", ek: ["Local Sh_x = 0.332 Re_x^{1/2} Sc^{1/3}; the plate average is twice the local value at the end."], p: [P1], drills: [gc-plate-mass, gc-plate-local-k] }
  - id: gc-thermo
    n: 3
    title: "Advanced thermodynamics (CBE 240)"
    scope: core
    std: ["uci-cbe-core:240"]
    ideas: [SOLVE]
    topics:
      - n: 1
        title: "Equations of state, mixtures and equilibria"
        los:
          - { id: A, std: ["uci-cbe-core:240"], do: "Find a van der Waals critical temperature from its constants.", ek: ["dP/dV = d²P/dV² = 0 gives T_c = 8a/(27Rb)."], p: [P1], drills: [gc-vdw-critical, gc-vdw-b] }
          - { id: B, std: ["uci-cbe-core:240"], do: "Find a compressibility factor from the Peng–Robinson equation.", ek: ["Solve the cubic in Z; take the largest root for vapour, the smallest for liquid."], p: [P1], drills: [gc-peng-robinson-z, gc-pr-alpha] }
          - { id: C, std: ["uci-cbe-core:240"], do: "Decide whether a mixture splits into two liquids.", ek: ["One-constant Margules: ∂²(Δg_mix/RT)/∂x₁² = 1/x₁ + 1/x₂ − 2A; negative means unstable."], p: [P1], drills: [gc-margules-stability, gc-spinodal-A] }
          - { id: D, std: ["uci-cbe-core:240"], do: "Find a residual enthalpy from the virial equation.", ek: ["H^R = P(B − T dB/dT) at low pressure."], p: [P1], drills: [gc-virial-residual-h, gc-virial-fugacity] }
          - { id: E, std: ["uci-cbe-core:240"], do: "Solve simultaneous chemical equilibria.", ek: ["Each independent reaction has its own K; solve them together with the mole balance."], p: [P1], drills: [gc-series-equilibria, gc-parallel-equilibria] }
          - { id: F, std: ["uci-cbe-core:240"], do: "Integrate the van 't Hoff equation with a heat-capacity change.", ek: ["d ln K/dT = ΔH(T)/RT², ΔH(T) = ΔH₀ + ΔCp(T − T₀)."], p: [P1], drills: [gc-vant-hoff-cp, gc-k-equals-one] }
          - { id: G, std: ["uci-cbe-core:240"], do: "Locate an azeotrope.", ek: ["At an azeotrope x = y, so γ₁P₁^sat = γ₂P₂^sat."], p: [P1], drills: [gc-azeotrope, gc-azeotrope-pressure] }
  - id: gc-reactors
    n: 4
    title: "Reaction engineering (CBE 210)"
    scope: core
    std: ["uci-cbe-core:210"]
    ideas: [SOLVE]
    topics:
      - n: 1
        title: "Stability, catalysis, optimisation and dispersed phases"
        los:
          - { id: A, std: ["uci-cbe-core:210"], do: "Judge the stability of a CSTR steady state by the slope condition.", ek: ["Stable when the heat-removal line is steeper than the heat-generation curve: dR/dT > dG/dT."], p: [P1], drills: [gc-cstr-slope, gc-generation-slope] }
          - { id: B, std: ["uci-cbe-core:210"], do: "Find the optimum temperature for a reversible exothermic reaction.", ek: ["Maximise r = k₁(1 − X) − k₂X at fixed X: T_opt = (E₂ − E₁)/(R ln[A₂E₂X/(A₁E₁(1 − X))])."], p: [P1], drills: [gc-optimum-temperature, gc-equilibrium-temperature] }
          - { id: C, std: ["uci-cbe-core:210"], do: "Combine internal and external resistances into an overall effectiveness.", ek: ["Ω = η/(1 + ηφ²/(3Bi)), η = 3(φ coth φ − 1)/φ² for a first-order sphere."], p: [P1], drills: [gc-overall-effectiveness, gc-surface-concentration] }
          - { id: D, std: ["uci-cbe-core:210"], do: "Find an enhancement factor for gas absorption with reaction.", ek: ["Film theory, pseudo-first order: E = Ha/tanh Ha, Ha = √(kD)/k_L."], p: [P1], drills: [gc-hatta-enhancement, gc-hatta-regime] }
          - { id: E, std: ["uci-cbe-core:210"], do: "Find the overall rate in a slurry reactor from resistances in series.", ek: ["C_gas/r = 1/(k_b a_b) + 1/(k_c a_p) + 1/(η k a_p)-type terms add."], p: [P1], drills: [gc-slurry-resistances, gc-slurry-controlling] }
          - { id: F, std: ["uci-cbe-core:210"], do: "Find a conversion with a decaying catalyst.", ek: ["First-order decay a = e^{−k_d t}: ln[1/(1 − X)] = (k/k_d)(1 − e^{−k_d t})."], p: [P1], drills: [gc-deactivation, gc-deactivation-limit] }
  - id: gc-control
    n: 5
    title: "Process dynamics and control (CBE 200)"
    scope: core
    std: ["uci-cbe-core:200"]
    ideas: [SOLVE]
    topics:
      - n: 1
        title: "Responses, stability and tuning"
        los:
          - { id: A, std: ["uci-cbe-core:200"], do: "Find a time from a first-order step response.", ek: ["y = KM(1 − e^{−t/τ}); 63.2% at τ, 95% at 3τ, 99% at 4.6τ."], p: [P1], drills: [gc-first-order-time, gc-ramp-lag] }
          - { id: B, std: ["uci-cbe-core:200"], do: "Find the overshoot of an underdamped second-order process.", ek: ["OS = exp(−πζ/√(1 − ζ²)), independent of τ."], p: [P1], drills: [gc-overshoot, gc-zeta-from-overshoot] }
          - { id: C, std: ["uci-cbe-core:200"], do: "Find the offset under proportional control.", ek: ["Final value theorem: setpoint offset = 1/(1 + K K_c) for a first-order process."], p: [P1], drills: [gc-p-offset, gc-kc-for-offset] }
          - { id: D, std: ["uci-cbe-core:200"], do: "Find the ultimate gain of a third-order process.", ek: ["Substitute s = iω in 1 + K_cG = 0: the imaginary part fixes ω_u, the real part K_c,u."], p: [P1], drills: [gc-ultimate-gain, gc-stability-check] }
          - { id: E, std: ["uci-cbe-core:200"], do: "Find the ultimate period, then a Ziegler–Nichols setting.", ek: ["ω_u = √(a₁/a₃); P_u = 2π/ω_u; ZN PI: K_c = 0.45K_cu, τ_I = P_u/1.2."], p: [P1], drills: [gc-ultimate-period, gc-zn-reset] }
          - { id: F, std: ["uci-cbe-core:200"], do: "Find an amplitude ratio from the frequency response.", ek: ["First order: AR = K/√(1 + ω²τ²), phase −atan(ωτ)."], p: [P1], drills: [gc-amplitude-ratio, gc-phase-lag] }
          - { id: G, std: ["uci-cbe-core:200"], do: "Find the crossover frequency of a first-order-plus-dead-time process.", ek: ["Phase −atan(ωτ) − ωθ = −π; no closed form."], p: [P1], drills: [gc-fopdt-crossover, gc-fopdt-ultimate-gain] }
  - id: gc-separations
    n: 6
    title: "Separations past the McCabe–Thiele diagram"
    scope: core
    std: ["pe-chemical:6.B"]
    ideas: [SOLVE]
    topics:
      - n: 1
        title: "Batch distillation and absorption"
        los:
          - { id: A, std: ["pe-chemical:6.B"], do: "Find what remains in a Rayleigh batch distillation.", ek: ["ln(W₀/W) = ∫ dx/(y − x) from x to x₀; with constant α it has a closed form."], p: [P1], drills: [gc-rayleigh, gc-rayleigh-distillate] }
          - { id: B, std: ["pe-chemical:6.B"], do: "Find the minimum absorbent rate.", ek: ["(L/G)_min = (y_in − y_out)/(x*_out − x_in), x*_out = y_in/m for a dilute linear system."], p: [P1], drills: [gc-min-absorbent, gc-absorber-exit-liquid] }
          - { id: C, std: ["pe-chemical:6.B"], do: "Find where the feed line meets the rectifying line.", ek: ["q-line y = qx/(q − 1) − z/(q − 1); rectifying line y = Rx/(R + 1) + x_D/(R + 1)."], p: [P1], drills: [gc-q-line-intersection, gc-q-line-slope] }
  # <<< opl-fill:gc-core

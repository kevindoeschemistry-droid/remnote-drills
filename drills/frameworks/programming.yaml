# Programming Foundations — curriculum framework (draft 1, for Kevin's markup)
#
# Built like an AP Course and Exam Description: Big Ideas run through the subject,
# Units → Topics → Learning Objectives (one testable action each, verb first), with the
# Essential Knowledge an LO rests on and the Practices it exercises. Courses and lessons are
# crosswalks onto this map, never the backbone. It is the bridge from zero programming to the
# CS master's (computer-science.yaml, CS2023) and to scientific computing for molecular
# simulation (molecular-simulation.yaml). LOs lean toward reps that can be auto-checked:
# trace a loop's output, predict a variable's value, count iterations, fix an off-by-one.
#
# Sources opened:
#   csa-ced  College Board, AP Computer Science A Course and Exam Description, effective
#            Fall 2025 (V.1) — apcentral.collegeboard.org/pdf/ap-computer-science-a-course-and-exam-description.pdf
#            Four units: 1 Using Objects and Methods (15–25% of MC) · 2 Selection and
#            Iteration (25–35%) · 3 Class Creation (10–18%) · 4 Data Collections (30–40%).
#            This edition numbers learning objectives by topic (1.3.C), not the 2019–2024
#            MOD/VAR/CON scheme. Unit 1 LO codes were read in full and are cited as CSA-1.x.Y.
#            The text available for Units 2–4 stopped at the topic lists, so those LOs cite the
#            CED topic (CSA-2.7) — add the letter once the full CED is checked.
#   csp-ced  College Board, AP Computer Science Principles CED, effective Fall 2023 —
#            apcentral.collegeboard.org/media/pdf/ap-computer-science-principles-course-and-exam-description.pdf
#            Big ideas CRD · DAT · AAP · CSN · IOC. CRD-1/2 and DAT-1/2 codes and AAP-2.P were
#            read; the remaining AAP, CSN and IOC codes follow the CED's published code scheme
#            but were not visible in the opened text — check them against the CED.
#   swc-sh   Software Carpentry, The Unix Shell (UCSB Library mirror,
#            carpentry.library.ucsb.edu/shell-novice/): episodes 1 Introducing the Shell ·
#            2 Navigating · 3 Working with Files · 4 Pipes and Filters · 5 Loops · 6 Shell
#            Scripts · 7 Finding Things. Cited as SWC-SH-n.
#   swc-git  Software Carpentry, Version Control with Git (UCSB Library 2026-04-07 workshop
#            mirror): 1 Automated VC · 2 Setting Up · 3 Creating a Repository · 4 Tracking
#            Changes · 5 Exploring History · 6 Ignoring Things · 7 Remotes in GitHub · 8 Open
#            Science · 9 Licensing · 10 Citation · 11 Hosting · 12 Collaborating · 13 Branches
#            · 14 Forks · 15 Conflicts. Cited as SWC-GIT-n.
# No standard was opened for Python or scientific computing; those LOs carry this
# framework's own codes (PY-n, SCI-n), written so molecular-simulation.yaml can build on them.
#
# Unit order: the CSA CED's four units in CED order, with the CSP big ideas folded into the
# CSA topics they line up with (binary before casting and overflow, data ethics with data
# sets); then the Unix shell and Git (Software Carpentry's order: shell first, then Git);
# then Python, then scientific computing with NumPy; CSP's systems/networks/impact material
# last as an extension.
#
# Fields
#   units[].scope     core (needed before computer-science or molecular-simulation) or
#                     extension (CSP breadth nothing later depends on)
#   units[].ideas     Big Ideas the unit develops
#   units[].weight_est CSA multiple-choice weight where the CED gives one
#   topics[].book     crosswalk: csa-ced / csp-ced topic numbers, swc lesson episodes
#   los[].std         official code(s) the LO covers (CSA-1.3.C, AAP-2.K, SWC-SH-4) or own (PY-n, SCI-n)
#   los[].do          the objective; los[].ek essential knowledge; los[].p practices
#   los[].needs       prerequisite LOs (PR-unit.topic.id), always earlier in this file
#   los[].drills      templates that drill it; "~name" = only partly. Empty = a gap.
id: programming
title: Programming Foundations
code: PR
draft: 1
track: computing
requires: [math-hs]
level: 3
domains: []

big_ideas:
  - id: CRD
    title: Programs are developed, tested and fixed
    text: Software is built iteratively — specify, write, test with chosen inputs, find the error, fix it — and its purpose, inputs and outputs are stated so others can use it.
  - id: DAT
    title: Everything is stored as bits
    text: Numbers, text and images are finite bit patterns; that finiteness causes overflow and round-off, and data only becomes information after it is cleaned and processed.
  - id: AAP
    title: Algorithms are built from sequence, selection, iteration and abstraction
    text: Every program is statements in order, choices, repetition, and named procedures and data structures that hide detail; the same task can be solved by algorithms of very different cost.
  - id: CSN
    title: Computing runs on systems and networks
    text: Code runs on a machine through an operating system and shell, across networks and many processors; redundancy and parallelism decide reliability and speed.
  - id: IOC
    title: Computing affects people
    text: Programs and data sets carry bias, privacy risk and legal obligations; who is helped or harmed is part of the design.
  - id: NUM
    title: Scientific computing discretizes and vectorizes
    text: Continuous laws become loops over finite timesteps on arrays of numbers; the timestep, the floating-point precision and whether the work is vectorized decide whether the answer is right and arrives in time.

practices:
  - id: P1
    title: Design
    text: Turn a described task into an algorithm or program design — which structures, which loops, which methods (CSA practice 1).
  - id: P2
    title: Implement
    text: Write the code, command or expression that carries out the design (CSA practice 2).
  - id: P3
    title: Trace
    text: Execute code by hand and state the exact output, variable values, iteration count or final state (CSA practice 3).
  - id: P4
    title: Debug
    text: Explain why code fails to compile, crashes or gives the wrong answer, and fix it (CSA practice 3, fixing errors).
  - id: P5
    title: Explain and document
    text: Describe what code does, its preconditions and impact, in comments, commit messages and plain words (CSA practice 4).
  - id: P6
    title: Compute and check
    text: Run numerical code with units and tolerances, test it against a known answer, and judge whether the output is physically plausible.

units:
  # ── 1 ────────────────────────────────────────────────────────────────────
  - id: objects-methods
    n: 1
    title: Using objects and methods
    scope: core
    ideas: [CRD, DAT, AAP]
    weight_est: "15–25%"
    topics:
      - n: 1
        title: Algorithms, programs and errors
        book: { csa-ced: ["1.1"], csp-ced: ["1.3", "1.4", "3.3"] }
        los:
          - { id: A, std: [CSA-1.1.A, AAP-2.A], do: "Write an everyday procedure as ordered, unambiguous steps and trace it on an input.", ek: ["An algorithm is a finite sequence of precise steps; sequence, selection and iteration are enough to express any algorithm."], p: [P1], drills: [] }
          - { id: B, std: [CSA-1.1.B], do: "Put the steps of writing, compiling and running a Java program in order and say which step catches which problem.", ek: ["javac turns .java source into .class bytecode; the JVM runs the bytecode; the compiler checks syntax and types before anything runs."], p: [P5], drills: [] }
          - { id: C, std: [CSA-1.1.C, CRD-2.I], do: "Classify an error as syntax (compile-time), run-time (exception) or logic, given the code and its symptom.", ek: ["Syntax errors stop compilation; run-time errors throw during execution (int division by 0 throws ArithmeticException); logic errors run and give a wrong answer."], p: [P4], drills: [], needs: [PR-1.1.B] }
          - { id: D, std: [CRD-2.J], do: "Choose test inputs, including boundary cases, and state the output each should produce.", ek: ["Test typical, boundary (0, 1, empty, the limits) and invalid inputs; a test is useful only with a predicted answer."], p: [P6], drills: [], needs: [PR-1.1.A] }
      - n: 2
        title: Bits and binary numbers
        book: { csp-ced: ["2.1"] }
        los:
          - { id: A, std: [DAT-1.C], do: "Convert a non-negative integer between decimal and binary.", ek: ["Place values are powers of 2: 1011₂ = 8 + 2 + 1 = 11."], p: [P3], drills: [] }
          - { id: B, std: [DAT-1.A], do: "Count the distinct values n bits can represent, and the bits needed for N values.", ek: ["n bits give 2ⁿ patterns; N values need ⌈log₂ N⌉ bits."], p: [P3], drills: [], needs: [PR-1.2.A] }
      - n: 3
        title: Variables, types, expressions and output
        book: { csa-ced: ["1.2", "1.3", "1.4"], csp-ced: ["3.1", "3.3"] }
        los:
          - { id: A, std: [CSA-1.2.A], do: "Choose a primitive type (int, double, boolean) or a reference type (String, an object) for a described quantity.", ek: ["A primitive variable holds the value itself; a reference variable holds the address of an object."], p: [P1], drills: [] }
          - { id: B, std: [CSA-1.2.B, AAP-1.A], do: "Declare and initialise variables of type int, double and boolean.", ek: ["type name = value; a variable is declared before use and keeps one type for its lifetime."], p: [P2], drills: [], needs: [PR-1.3.A] }
          - { id: C, std: [CSA-1.3.C, AAP-2.C], do: "Evaluate an arithmetic expression with int and double operands, including integer division and %.", ek: ["int / int truncates toward zero (7 / 2 = 3, −7 / 2 = −3); % keeps the sign of the dividend (−7 % 2 = −1); one double operand makes the result double; * / % bind tighter than + −."], p: [P3], drills: [], needs: [PR-1.3.B] }
          - { id: D, std: [CSA-1.3.A, CSA-1.3.B], do: "Predict exactly what print and println statements display, including string concatenation with numbers.", ek: ['+ runs left to right: "1" + 2 + 3 is "123" but 1 + 2 + "3" is "33"; println ends the line, print does not.'], p: [P3], drills: [], needs: [PR-1.3.C] }
      - n: 4
        title: Assignment and compound assignment
        book: { csa-ced: ["1.4", "1.6"], csp-ced: ["3.1"] }
        los:
          - { id: A, std: [CSA-1.4.A, AAP-1.B], do: "Trace a sequence of assignment statements and give each variable's final value.", ek: ["= evaluates the right side first, then overwrites the variable on the left; the old value is gone, so a swap needs a temporary."], p: [P3], drills: [], needs: [PR-1.3.C] }
          - { id: B, std: [CSA-1.6.A], do: "Predict the value stored after compound assignment and ++ / −− operators.", ek: ["x += 3 means x = x + 3; x++ adds 1; for int x, x /= 2 truncates."], p: [P3], drills: [], needs: [PR-1.4.A] }
      - n: 5
        title: Casting, range and precision
        book: { csa-ced: ["1.5"], csp-ced: ["2.1"] }
        los:
          - { id: A, std: [CSA-1.5.A], do: "Predict the result of casting between int and double, including rounding a positive double to the nearest int.", ek: ["(int) truncates toward zero; (int)(x + 0.5) rounds a non-negative x; the cast binds tighter than arithmetic: (double) 7 / 2 = 3.5 but (double)(7 / 2) = 3.0."], p: [P3], drills: [], needs: [PR-1.3.C] }
          - { id: B, std: [CSA-1.5.B, DAT-1.B], do: "Predict when int arithmetic overflows and the value that results.", ek: ["int is 32-bit two's complement, −2³¹ to 2³¹ − 1 (Integer.MIN_VALUE to Integer.MAX_VALUE); MAX_VALUE + 1 wraps to MIN_VALUE."], p: [P3], drills: [], needs: [PR-1.2.B, PR-1.3.C] }
          - { id: C, std: [CSA-1.5.C, DAT-1.B], do: "Explain why a double calculation is approximate, and compare doubles with a tolerance instead of ==.", ek: ["A double stores a binary fraction in 64 bits, so 0.1 is inexact and 0.1 + 0.2 == 0.3 is false; test Math.abs(a − b) < tol."], p: [P6], drills: [], needs: [PR-1.2.A, PR-1.3.C] }
      - n: 6
        title: APIs, method signatures and the Math class
        book: { csa-ced: ["1.7", "1.8", "1.9", "1.10", "1.11"], csp-ced: ["3.12", "3.14", "3.15"] }
        los:
          - { id: A, std: [CSA-1.7.A, CSA-1.9.A, AAP-3.D], do: "Read API documentation to find what a class provides and which method to call.", ek: ["Documentation gives each method's signature (name, parameter types in order) and return type; a caller needs nothing more."], p: [P5], drills: [] }
          - { id: B, std: [CSA-1.9.B, AAP-3.A], do: "Write a call to a void or non-void method with arguments that match its signature, and pick which overload runs.", ek: ["Arguments match parameters by number, order and type; overloads share a name but differ in parameter list; a non-void result must be stored or used or it is lost."], p: [P2], drills: [], needs: [PR-1.6.A, PR-1.3.B] }
          - { id: C, std: [CSA-1.10.A], do: "Call a static (class) method as ClassName.method(...) and give the value it returns.", ek: ["Static methods belong to the class, not to an object; inside the same class the class name can be left off."], p: [P3], drills: [], needs: [PR-1.6.B] }
          - { id: D, std: [CSA-1.11.A, AAP-3.E], do: "Evaluate expressions with Math.abs, Math.pow, Math.sqrt and Math.random, including mapping Math.random to an integer range.", ek: ["Math.random() is a double in [0.0, 1.0); (int)(Math.random() * n) + a is an int from a to a + n − 1; pow and sqrt return double."], p: [P3], drills: [], needs: [PR-1.6.C, PR-1.5.A] }
          - { id: E, std: [CSA-1.8.A, CRD-2.G], do: "Write a comment stating what a method does, its preconditions and its postconditions.", ek: ["A precondition must be true before the call (the caller's job); a postcondition is what the method guarantees afterwards."], p: [P5], drills: [], needs: [PR-1.6.B] }
      - n: 7
        title: Objects, constructors and instance methods
        book: { csa-ced: ["1.12", "1.13", "1.14"] }
        los:
          - { id: A, std: [CSA-1.12.A, CSA-1.12.B, CSA-1.13.B], do: "Explain how a class relates to its objects, and declare a reference variable that holds an object or null.", ek: ["A class is the blueprint; each object is an instance with its own state; a reference variable holds null or the address of an object."], p: [P5], drills: [], needs: [PR-1.3.A] }
          - { id: B, std: [CSA-1.13.A, CSA-1.13.C], do: "Create an object with new, choosing the constructor from its parameter list.", ek: ["new ClassName(args) allocates the object and runs the constructor whose parameters match the arguments."], p: [P2], drills: [], needs: [PR-1.7.A, PR-1.6.B] }
          - { id: C, std: [CSA-1.14.A], do: "Call instance methods on an object, trace how its state changes, and predict a NullPointerException.", ek: ["obj.method() acts on that object's fields; calling a method through a null reference throws NullPointerException."], p: [P3], drills: [], needs: [PR-1.7.B] }
          - { id: D, std: [CSA-1.12.B], do: "Predict the effect of aliasing — two references to one object — after a change through either reference.", ek: ["b = a copies the reference, not the object; a change made through b is seen through a."], p: [P3], drills: [], needs: [PR-1.7.C] }
      - n: 8
        title: Strings
        book: { csa-ced: ["1.15"], csp-ced: ["3.4"] }
        los:
          - { id: A, std: [CSA-1.15.A, AAP-2.D], do: "Create and concatenate String objects and predict the result.", ek: ["Strings are immutable: concatenation and every String method build a new String, leaving the original unchanged."], p: [P3], drills: [], needs: [PR-1.3.D, PR-1.7.B] }
          - { id: B, std: [CSA-1.15.B, AAP-2.D], do: "Evaluate length, substring, indexOf, equals and compareTo calls on strings.", ek: ["Indices run 0 to length() − 1; substring(a, b) is characters a to b − 1 (length b − a); indexOf returns −1 when absent; compareTo is negative, zero or positive in dictionary order."], p: [P3], drills: [], needs: [PR-1.8.A] }
          - { id: C, std: [CSA-1.15.B], do: "Distinguish == from equals when comparing strings and other objects.", ek: ["== asks whether two references point to the same object; equals compares contents."], p: [P4], drills: [], needs: [PR-1.8.B, PR-1.7.D] }

  # ── 2 ────────────────────────────────────────────────────────────────────
  - id: selection-iteration
    n: 2
    title: Selection and iteration
    scope: core
    ideas: [AAP, CRD]
    weight_est: "25–35%"
    topics:
      - n: 1
        title: Boolean expressions and if statements
        book: { csa-ced: ["2.1", "2.2", "2.3", "2.4"], csp-ced: ["3.5", "3.6", "3.7"] }
        los:
          - { id: A, std: [CSA-2.2, AAP-2.E], do: "Evaluate relational expressions (==, !=, <, <=, >, >=) to true or false.", ek: ["Relational operators compare two values and produce a boolean; they bind looser than arithmetic, so a + 1 < b compares the sum."], p: [P3], drills: [], needs: [PR-1.3.C] }
          - { id: B, std: [CSA-2.3, AAP-2.H], do: "Trace if, if–else and else-if chains and say which branch runs and what is printed.", ek: ["Exactly one branch of an if / else if / else chain runs — the first whose condition is true; a lone if may run zero times."], p: [P3], drills: [], needs: [PR-2.1.A] }
          - { id: C, std: [CSA-2.4, AAP-2.I], do: "Trace nested if statements, matching each else to its if.", ek: ["Without braces an else attaches to the nearest unmatched if, whatever the indentation suggests."], p: [P3, P4], drills: [], needs: [PR-2.1.B] }
          - { id: D, std: [CSA-2.1, AAP-2.G], do: "Write a selection algorithm from a stated rule, such as grade bands or the leap-year rule.", ek: ["Order else-if conditions so no earlier condition shadows a later one; leap year: divisible by 4 and (not by 100, or by 400)."], p: [P1, P2], drills: [], needs: [PR-2.1.C] }
      - n: 2
        title: Compound boolean expressions
        book: { csa-ced: ["2.5", "2.6"], csp-ced: ["3.5"] }
        los:
          - { id: A, std: [CSA-2.5, AAP-2.F], do: "Evaluate expressions with &&, || and !, including short-circuit evaluation.", ek: ["! binds tightest, then &&, then ||; && skips its right side when the left is false, || when the left is true — so x != 0 && y / x > 1 never divides by zero."], p: [P3], drills: [], needs: [PR-2.1.A] }
          - { id: B, std: [CSA-2.6], do: "Rewrite a negated compound condition with De Morgan's laws.", ek: ["!(a && b) ≡ !a || !b; !(a || b) ≡ !a && !b; !(x < y) ≡ x >= y."], p: [P3], drills: [], needs: [PR-2.2.A] }
          - { id: C, std: [CSA-2.6, AAP-2.L], do: "Decide whether two boolean expressions are equivalent with a truth table or one counterexample.", ek: ["n boolean inputs give 2ⁿ rows; one row where they differ proves they are not equivalent."], p: [P3], drills: [], needs: [PR-2.2.B] }
      - n: 3
        title: while loops
        book: { csa-ced: ["2.7"], csp-ced: ["3.8"] }
        los:
          - { id: A, std: [CSA-2.7, AAP-2.K], do: "Trace a while loop and give the number of iterations and the final value of each variable.", ek: ["The condition is checked before every pass, so the body may run zero times; something in the body must move the condition toward false."], p: [P3], drills: [], needs: [PR-2.1.B, PR-1.4.B] }
          - { id: B, std: [CSA-2.7], do: "Identify a loop that never runs or never stops, and fix its initialisation, condition or update.", ek: ["Check three things: the start value, the stopping condition, and that the update moves toward it."], p: [P4], drills: [], needs: [PR-2.3.A] }
          - { id: C, std: [CSA-2.7, AAP-2.J], do: "Write a condition-controlled loop for an unknown number of repetitions, such as peeling the digits off an int or halving until below a threshold.", ek: ["n % 10 is the last digit and n / 10 drops it; the loop ends when n reaches 0."], p: [P2], drills: [], needs: [PR-2.3.A] }
      - n: 4
        title: for loops
        book: { csa-ced: ["2.8"], csp-ced: ["3.8"] }
        los:
          - { id: A, std: [CSA-2.8, AAP-2.K], do: "Count the iterations of a for loop from its header, for any start, bound and step.", ek: ["for (int i = a; i < b; i++) runs b − a times; with i <= b, b − a + 1 times; with i += k, ⌈(b − a)/k⌉ times (zero if a ≥ b)."], p: [P3], drills: [], needs: [PR-2.3.A] }
          - { id: B, std: [CSA-2.8], do: "Trace a for loop and give its output or the final value of an accumulator.", ek: ["Order of one pass: test the condition, run the body, then the update; the loop variable is out of scope after the loop."], p: [P3], drills: [], needs: [PR-2.4.A] }
          - { id: C, std: [CSA-2.8], do: "Find and fix an off-by-one error in a loop's start value or bound.", ek: ["Check the first and last pass by hand: indices 0 to n − 1 need i = 0 and i < n."], p: [P4], drills: [], needs: [PR-2.4.B] }
      - n: 5
        title: Standard loop algorithms
        book: { csa-ced: ["2.9"], csp-ced: ["3.9"] }
        los:
          - { id: A, std: [CSA-2.9, AAP-2.M], do: "Implement and trace the accumulator patterns: sum, average, product and count of matches.", ek: ["Initialise before the loop (0 for sums and counts, 1 for products), update inside it, use the result after it; divide by a count as a double."], p: [P2, P3], drills: [], needs: [PR-2.4.B] }
          - { id: B, std: [CSA-2.9], do: "Implement and trace a running minimum or maximum.", ek: ["Initialise to the first value, not 0, so all-negative data still works."], p: [P2, P3], drills: [], needs: [PR-2.5.A] }
          - { id: C, std: [CSA-2.9, AAP-2.M], do: "Implement digit and divisibility algorithms: digit sum, factor list, primality test, gcd.", ek: ["Trial division up to √n settles primality; Euclid: gcd(a, b) = gcd(b, a % b) until b = 0."], p: [P2], drills: [], needs: [PR-2.3.C, PR-2.5.A] }
      - n: 6
        title: String algorithms
        book: { csa-ced: ["2.10"] }
        los:
          - { id: A, std: [CSA-2.10], do: "Traverse a string with substring or charAt to count or locate characters or substrings.", ek: ["s.substring(i, i + 1) for i from 0 to s.length() − 1; a window of length k needs i <= s.length() − k."], p: [P2, P3], drills: [], needs: [PR-1.8.B, PR-2.4.C] }
          - { id: B, std: [CSA-2.10], do: "Build a new string in a loop: reverse it, remove a character, or test for a palindrome.", ek: ["Start from an empty string and concatenate; reversing prepends each character, or appends while counting down from the end."], p: [P2, P3], drills: [], needs: [PR-2.6.A] }
      - n: 7
        title: Nested iteration
        book: { csa-ced: ["2.11"] }
        los:
          - { id: A, std: [CSA-2.11], do: "Count how many times an inner-loop statement runs in nested loops, including triangular bounds.", ek: ["Independent bounds multiply (n·m); an inner j from i + 1 to n − 1 over i = 0 … n − 1 gives n(n − 1)/2."], p: [P3], drills: [], needs: [PR-2.4.A] }
          - { id: B, std: [CSA-2.11], do: "Trace nested loops that print a pattern and give the exact output.", ek: ["The inner loop runs to completion for each pass of the outer loop; println placement decides the line breaks."], p: [P3], drills: [], needs: [PR-2.7.A, PR-2.4.B] }
      - n: 8
        title: Informal run-time analysis
        book: { csa-ced: ["2.12"], csp-ced: ["3.17"] }
        los:
          - { id: A, std: [CSA-2.12, AAP-4.A], do: "Compare algorithms by counting statement executions as a function of input size n.", ek: ["One loop over n ~ n; nested ~ n²; halving each pass ~ log₂ n; polynomial counts run in reasonable time, exponential ones do not."], p: [P3], drills: [], needs: [PR-2.7.A] }

  # ── 3 ────────────────────────────────────────────────────────────────────
  - id: class-creation
    n: 3
    title: Class creation
    scope: core
    ideas: [AAP, IOC]
    weight_est: "10–18%"
    topics:
      - n: 1
        title: Abstraction, design and anatomy of a class
        book: { csa-ced: ["3.1", "3.2", "3.3"], csp-ced: ["3.13"] }
        los:
          - { id: A, std: [CSA-3.1, AAP-3.B], do: "Decompose a described task into classes and methods, naming each class's attributes and behaviours.", ek: ["Abstraction hides how something works behind what it does; nouns in the description suggest classes and fields, verbs suggest methods."], p: [P1], drills: [], needs: [PR-1.6.A, PR-1.7.A] }
          - { id: B, std: [CSA-3.3], do: "Write a class with private instance variables and public methods, and say what code outside the class can use.", ek: ["Encapsulation: fields private, interface public; outside code reaches state only through public methods."], p: [P2], drills: [], needs: [PR-3.1.A] }
      - n: 2
        title: Constructors
        book: { csa-ced: ["3.4"] }
        los:
          - { id: A, std: [CSA-3.4], do: "Write a constructor that sets every instance variable from its parameters.", ek: ["A constructor has the class name and no return type; it runs once, when new creates the object."], p: [P2], drills: [], needs: [PR-3.1.B, PR-1.7.B] }
          - { id: B, std: [CSA-3.4], do: "Predict the default values of instance variables a constructor leaves unset.", ek: ["Unset fields are 0 (int), 0.0 (double), false (boolean) and null (references); a class with no constructor written gets a no-argument default."], p: [P3], drills: [], needs: [PR-3.2.A] }
      - n: 3
        title: Writing methods and passing references
        book: { csa-ced: ["3.5", "3.6"], csp-ced: ["3.13"] }
        los:
          - { id: A, std: [CSA-3.5, AAP-3.C], do: "Write accessor and mutator methods with the correct return types.", ek: ["An accessor returns a value without changing state; a mutator, usually void, changes it; a non-void method must return on every path."], p: [P2], drills: [], needs: [PR-3.2.A] }
          - { id: B, std: [CSA-3.6], do: "Predict whether a method call changes the caller's variable, for primitive and for reference arguments.", ek: ["Java passes copies of values: reassigning a parameter never affects the caller, but changing the object a reference parameter points to does."], p: [P3], drills: [], needs: [PR-3.3.A, PR-1.7.D] }
          - { id: C, std: [CSA-3.5, CRD-2.B], do: "Trace a sequence of calls on objects of a user-written class and give every object's final state.", ek: ["Each object has its own copy of the instance variables; track them in a table, one column per object."], p: [P3], drills: [], needs: [PR-3.3.B] }
      - n: 4
        title: Class members, scope and this
        book: { csa-ced: ["3.7", "3.8", "3.9"] }
        los:
          - { id: A, std: [CSA-3.7], do: "Predict the value of a static variable shared by all instances, such as an instance counter.", ek: ["A static variable has one copy per class, shared by every object; static methods cannot use instance variables or this."], p: [P3], drills: [], needs: [PR-3.2.A] }
          - { id: B, std: [CSA-3.8, CSA-3.9], do: "Decide which variable a name refers to when a parameter or local shadows a field, and resolve it with this.", ek: ["A local exists only inside its block; the innermost declaration wins; this.x always names the field."], p: [P3, P4], drills: [], needs: [PR-3.3.A] }
          - { id: C, std: [CSA-3.2, IOC-1.F], do: "Identify who a program's design affects and the legal or ethical constraints on it, such as licences on reused code and privacy of stored data.", ek: ["Code taken from elsewhere must be credited and used under its licence; a design decides what data is kept, and for how long."], p: [P5], drills: [], needs: [PR-3.1.A] }

  # ── 4 ────────────────────────────────────────────────────────────────────
  - id: data-collections
    n: 4
    title: Data collections
    scope: core
    ideas: [AAP, DAT, IOC]
    weight_est: "30–40%"
    topics:
      - n: 1
        title: Data sets and their ethics
        book: { csa-ced: ["4.1", "4.2"], csp-ced: ["2.3", "5.3", "5.6"] }
        los:
          - { id: A, std: [CSA-4.2, DAT-2.A, DAT-2.B, DAT-2.C], do: "Identify what a data set and its metadata can tell you, and what cleaning it needs (missing, invalid or inconsistent entries).", ek: ["Metadata (units, source, date) describes the data; correlation in data does not show causation; invalid entries must be removed or fixed before analysis."], p: [P5], drills: [] }
          - { id: B, std: [CSA-4.1, IOC-1.D, IOC-2.A], do: "Identify privacy, bias and consent risks in collecting a data set, including personally identifiable information.", ek: ["Data that under-represents a group biases every result built on it; combined fields (ZIP + birth date + sex) can identify a person."], p: [P5], drills: [], needs: [PR-4.1.A] }
      - n: 2
        title: Arrays
        book: { csa-ced: ["4.3"], csp-ced: ["3.2", "3.10"] }
        los:
          - { id: A, std: [CSA-4.3, AAP-1.C], do: "Create an array, give its length and default element values, and access an element by index.", ek: ["new int[n] has indices 0 to n − 1, filled with 0 (0.0, false, null for other types); arr.length is a field, no parentheses; an initialiser list {…} fixes the length."], p: [P3], drills: [], needs: [PR-1.7.B, PR-3.2.B] }
          - { id: B, std: [CSA-4.3], do: "Predict an ArrayIndexOutOfBoundsException from an index expression.", ek: ["Valid indices satisfy 0 ≤ i < arr.length; arr[arr.length] is always out of bounds."], p: [P4], drills: [], needs: [PR-4.2.A] }
      - n: 3
        title: Array traversals
        book: { csa-ced: ["4.4"], csp-ced: ["3.10"] }
        los:
          - { id: A, std: [CSA-4.4, AAP-2.O], do: "Traverse an array with an indexed for loop and with an enhanced for loop, and say which one can change the array.", ek: ["for (int x : arr) hands out copies of the elements, so assigning x leaves arr unchanged; modifying needs an index."], p: [P2, P3], drills: [], needs: [PR-4.2.A, PR-2.4.B] }
          - { id: B, std: [CSA-4.4], do: "Trace a traversal that steps by 2, skips elements or runs backwards, and list the indices it visits.", ek: ["Backwards: for (int i = arr.length − 1; i >= 0; i−−); the first and last index visited settle off-by-one questions."], p: [P3], drills: [], needs: [PR-4.3.A, PR-2.4.C] }
      - n: 4
        title: Array algorithms
        book: { csa-ced: ["4.5"], csp-ced: ["3.10"] }
        los:
          - { id: A, std: [CSA-4.5, AAP-2.N], do: "Implement sum, mean, minimum, maximum and count-matching over an array.", ek: ["The Unit 2 accumulator patterns, with arr[i] as the value at each pass."], p: [P2], drills: [], needs: [PR-4.3.A, PR-2.5.B] }
          - { id: B, std: [CSA-4.5], do: "Implement algorithms over adjacent pairs: detect a repeat, check that the array is sorted, count increases.", ek: ["Comparing arr[i] with arr[i + 1] needs i < arr.length − 1."], p: [P2, P4], drills: [], needs: [PR-4.4.A] }
          - { id: C, std: [CSA-4.5], do: "Reverse, shift or rotate an array in place and give its contents afterwards.", ek: ["Reverse by swapping i with length − 1 − i for i < length / 2; a rotation must save the element it is about to overwrite."], p: [P2, P3], drills: [], needs: [PR-4.4.B, PR-1.4.A] }
      - n: 5
        title: Text files and wrapper classes
        book: { csa-ced: ["4.6", "4.7"], csp-ced: ["2.4"] }
        los:
          - { id: A, std: [CSA-4.6, DAT-2.D], do: "Read a text file line by line with Scanner and File, splitting each line into fields.", ek: ['while (sc.hasNextLine()) reads to the end; line.split(",") turns a CSV line into a String[]; opening a missing file throws FileNotFoundException, which must be declared or caught.'], p: [P2], drills: [], needs: [PR-1.3.B, PR-2.3.A, PR-4.2.A] }
          - { id: B, std: [CSA-4.7], do: "Predict autoboxing and unboxing between int and Integer, and parse numbers from strings.", ek: ['Integer.parseInt("42") gives 42; an int is boxed to Integer automatically when stored in a collection; unboxing a null Integer throws NullPointerException.'], p: [P3], drills: [], needs: [PR-1.8.C] }
      - n: 6
        title: ArrayList
        book: { csa-ced: ["4.8", "4.9", "4.10"], csp-ced: ["3.10"] }
        los:
          - { id: A, std: [CSA-4.8, AAP-2.N], do: "Predict the contents and size of an ArrayList after add, add(i, x), set, remove and get.", ek: ["add(i, x) shifts later elements right; remove(i) shifts them left and returns the removed element; size(), not length."], p: [P3], drills: [], needs: [PR-4.5.B] }
          - { id: B, std: [CSA-4.9], do: "Find and fix the skipped-element bug when removing from an ArrayList inside a forward indexed loop.", ek: ["After remove(i) the next element slides into index i: don't increment that pass, or loop backwards; removing inside an enhanced for throws ConcurrentModificationException."], p: [P4], drills: [], needs: [PR-4.6.A, PR-4.3.A] }
      - n: 7
        title: 2D arrays
        book: { csa-ced: ["4.11", "4.12", "4.13"] }
        los:
          - { id: A, std: [CSA-4.11], do: "Create a 2D array and give its number of rows, number of columns and the element at [r][c].", ek: ["int[][] g = new int[R][C]; g.length = R; g[0].length = C; g[r][c] is row r, column c (row-major)."], p: [P3], drills: [], needs: [PR-4.2.A] }
          - { id: B, std: [CSA-4.12], do: "Trace row-major and column-major nested traversals and give the visiting order or output.", ek: ["Row-major: outer loop over rows, inner over columns; swap the loops for column-major."], p: [P3], drills: [], needs: [PR-4.7.A, PR-2.7.B] }
          - { id: C, std: [CSA-4.13], do: "Implement 2D algorithms: row sums, column sums, the main diagonal and in-bounds neighbours.", ek: ["The main diagonal is g[i][i]; neighbour (r + dr, c + dc) exists only if 0 ≤ r + dr < R and 0 ≤ c + dc < C."], p: [P2], drills: [], needs: [PR-4.7.B, PR-4.4.A] }
      - n: 8
        title: Searching
        book: { csa-ced: ["4.14", "4.17"], csp-ced: ["3.11"] }
        los:
          - { id: A, std: [CSA-4.14, AAP-2.O], do: "Trace a linear search and count its comparisons in the best and worst case.", ek: ["Best case 1 comparison (first element), worst case n (last or absent)."], p: [P3], drills: [], needs: [PR-4.3.A] }
          - { id: B, std: [CSA-4.14, AAP-2.P], do: "Trace an iterative binary search on a sorted array: list the midpoints examined and count the iterations.", ek: ["mid = (low + high) / 2, then discard the half that cannot hold the target; needs sorted data; at most ⌊log₂ n⌋ + 1 iterations."], p: [P3], drills: [], needs: [PR-4.8.A, PR-2.8.A] }
      - n: 9
        title: Sorting
        book: { csa-ced: ["4.15"] }
        los:
          - { id: A, std: [CSA-4.15], do: "Trace selection sort and give the array after k passes.", ek: ["Pass k swaps the smallest remaining element into index k; always n(n − 1)/2 comparisons, whatever the input."], p: [P3], drills: [], needs: [PR-4.4.C, PR-2.7.A] }
          - { id: B, std: [CSA-4.15], do: "Trace insertion sort, give the array after k passes, and count comparisons in the best and worst case.", ek: ["Pass k inserts element k into the sorted prefix; already sorted: n − 1 comparisons; reverse sorted: n(n − 1)/2."], p: [P3], drills: [], needs: [PR-4.9.A] }
      - n: 10
        title: Recursion, recursive search and merge sort
        book: { csa-ced: ["4.16", "4.17"] }
        los:
          - { id: A, std: [CSA-4.16], do: "Trace a recursive method and give its return value (factorial, digit sum, power).", ek: ["Each call gets its own parameters; the base case stops the descent; results combine as the calls return, last called first finished."], p: [P3], drills: [], needs: [PR-3.3.A, PR-2.1.B] }
          - { id: B, std: [CSA-4.16], do: "Count the calls a recursive method makes, including two-branch recursion such as naive Fibonacci.", ek: ["One recursive call per level: n + 1 calls; naive fib(n) with base cases 0 and 1 makes 2·fib(n + 1) − 1 calls — exponential."], p: [P3], drills: [], needs: [PR-4.10.A] }
          - { id: C, std: [CSA-4.16], do: "Find and fix a missing or unreachable base case that causes a StackOverflowError.", ek: ["Every recursive call must move the argument toward a base case that is actually tested."], p: [P4], drills: [], needs: [PR-4.10.A] }
          - { id: D, std: [CSA-4.17], do: "Trace recursive binary search and merge sort, giving the subarrays at each level of recursion.", ek: ["Merge sort halves down to single elements, then merges sorted halves: about n log₂ n comparisons, recursion depth ⌈log₂ n⌉."], p: [P3], drills: [], needs: [PR-4.10.B, PR-4.8.B, PR-4.9.B] }

  # ── 5 ────────────────────────────────────────────────────────────────────
  - id: shell
    n: 5
    title: The Unix shell
    scope: core
    ideas: [CSN]
    weight_est: "—"
    topics:
      - n: 1
        title: Navigating files and directories
        book: { swc-sh: ["1", "2"] }
        los:
          - { id: A, std: [SWC-SH-2], do: "Resolve an absolute or relative path (with ., .. and ~) from a given working directory to the directory or file it names.", ek: ["/ is the root; a path not starting with / is relative to pwd; .. is the parent, . the current directory, ~ your home."], p: [P3], drills: [] }
          - { id: B, std: [SWC-SH-2], do: "Predict the output of a sequence of cd, pwd and ls (-a, -l, -F) commands.", ek: ["cd with no argument returns home; ls -a shows hidden dot-files; -F marks directories with /."], p: [P3], drills: [], needs: [PR-5.1.A] }
      - n: 2
        title: Working with files and wildcards
        book: { swc-sh: ["3", "4"] }
        los:
          - { id: A, std: [SWC-SH-3], do: "Predict the file tree after mkdir, touch, cp, mv and rm commands.", ek: ["mv moves or renames and silently overwrites; cp copies; rm deletes for good (no trash); cp and rm need -r for directories."], p: [P3], drills: [], needs: [PR-5.1.B] }
          - { id: B, std: [SWC-SH-4], do: "Expand a wildcard pattern (*, ?) against a directory listing.", ek: ["The shell expands *.pdb before the command runs; * matches any run of characters, ? exactly one."], p: [P3], drills: [], needs: [PR-5.2.A] }
      - n: 3
        title: Pipes and filters
        book: { swc-sh: ["4"] }
        los:
          - { id: A, std: [SWC-SH-4], do: "Predict the output of wc, sort (-n, -r), head, tail, cut and uniq on given text.", ek: ["sort is alphabetical unless -n (so 10 sorts before 2); uniq removes only adjacent duplicates, so sort first; wc -l counts lines."], p: [P3], drills: [], needs: [PR-5.2.B] }
          - { id: B, std: [SWC-SH-4], do: "Build a pipeline with |, > and >> that answers a question about files, and predict its output.", ek: ["> overwrites a file, >> appends; | sends one command's standard output to the next command's input."], p: [P2, P3], drills: [], needs: [PR-5.3.A] }
      - n: 4
        title: Loops and shell scripts
        book: { swc-sh: ["5", "6"] }
        los:
          - { id: A, std: [SWC-SH-5], do: "Trace a shell for loop over files and list the commands it runs, including variable expansion and quoting.", ek: ['for f in *.dat; do ...; done expands $f once per file; write "$f" so a name with spaces stays one argument.'], p: [P3], drills: [], needs: [PR-5.3.B, PR-2.4.B] }
          - { id: B, std: [SWC-SH-6], do: "Write a script that uses $1, $@ and $#, and predict what it does for given arguments.", ek: ["$1 is the first argument, $@ all of them, $# how many; run it with bash script.sh args."], p: [P2, P3], drills: [], needs: [PR-5.4.A] }
          - { id: C, std: [SWC-SH-6], do: "Make a script executable and run it, and diagnose 'command not found' and 'permission denied'.", ek: ["chmod +x script.sh, then ./script.sh — the current directory is not on PATH, so a bare script.sh is not found."], p: [P4], drills: [], needs: [PR-5.4.B] }
      - n: 5
        title: Finding things
        book: { swc-sh: ["7"] }
        los:
          - { id: A, std: [SWC-SH-7], do: "Predict which lines grep matches with -i, -v, -w, -n, -c and -r.", ek: ["-i ignores case, -v inverts, -w matches whole words, -n numbers lines, -c counts, -r searches directories."], p: [P3], drills: [], needs: [PR-5.3.A] }
          - { id: B, std: [SWC-SH-7], do: "Predict which files find selects with -name, -type and -maxdepth, and feed its result to another command with $(...).", ek: ["Quote the pattern (find . -name '*.txt') so the shell does not expand it first; $(command) is replaced by that command's output."], p: [P3], drills: [], needs: [PR-5.5.A, PR-5.2.B] }

  # ── 6 ────────────────────────────────────────────────────────────────────
  - id: git
    n: 6
    title: Version control with Git
    scope: core
    ideas: [CRD]
    weight_est: "—"
    topics:
      - n: 1
        title: Tracking changes
        book: { swc-git: ["1", "3", "4"] }
        los:
          - { id: A, std: [SWC-GIT-1], do: "Explain what a commit records and why it beats keeping copies like thesis_final_v2.", ek: ["A commit is a snapshot of the staged files with author, time, message and a link to its parent; history is the chain of commits."], p: [P5], drills: [] }
          - { id: B, std: [SWC-GIT-3, SWC-GIT-4], do: "Predict git status (untracked, modified, staged) after edits, git add and git commit.", ek: ["Working tree → git add → staging area → git commit → repository; only staged changes go into a commit."], p: [P3], drills: [], needs: [PR-6.1.A, PR-5.2.A] }
      - n: 2
        title: Exploring and undoing history
        book: { swc-git: ["5"] }
        los:
          - { id: A, std: [SWC-GIT-5], do: "Read git log and git diff output, and name a commit with HEAD, HEAD~n or a hash prefix.", ek: ["HEAD is the current commit, HEAD~1 its parent; git diff shows unstaged changes, git diff --staged staged ones; + lines added, − lines removed."], p: [P3], drills: [], needs: [PR-6.1.B] }
          - { id: B, std: [SWC-GIT-5], do: "Choose the command that undoes a change: discard a file's edits, unstage it, or revert a commit.", ek: ["git restore file discards working-tree edits; git restore --staged file unstages; git revert makes a new commit that undoes an old one without rewriting history."], p: [P4], drills: [], needs: [PR-6.2.A] }
      - n: 3
        title: Ignoring files and what not to commit
        book: { swc-git: ["6", "8", "9", "10"] }
        los:
          - { id: A, std: [SWC-GIT-6], do: "Predict which files a .gitignore excludes, including directory patterns and ! negation.", ek: ["*.dat ignores every .dat file; results/ ignores a directory; !keep.dat re-includes one; files already tracked are not affected."], p: [P3], drills: [], needs: [PR-6.1.B, PR-5.2.B] }
          - { id: B, std: [SWC-GIT-8, SWC-GIT-9, SWC-GIT-10], do: "Decide what stays out of a repository (secrets, large raw data, generated output) and add a licence and citation file to shared code.", ek: ["A secret pushed once stays in history; with no licence, others may not legally reuse the code; CITATION.cff tells people how to cite it."], p: [P5], drills: [], needs: [PR-6.3.A] }
      - n: 4
        title: Remotes and collaboration
        book: { swc-git: ["7", "11", "12"] }
        los:
          - { id: A, std: [SWC-GIT-7, SWC-GIT-12], do: "Predict the state of the local and remote repositories after clone, push and pull.", ek: ["clone copies the whole history and names the source origin; push sends local commits; pull is fetch + merge; a push is rejected if the remote has commits you lack."], p: [P3], drills: [], needs: [PR-6.2.A] }
      - n: 5
        title: Branches and conflicts
        book: { swc-git: ["13", "14", "15"] }
        los:
          - { id: A, std: [SWC-GIT-13], do: "Create and switch branches, and predict which commits each branch contains after new commits and a merge.", ek: ["A branch is a movable pointer to a commit; git switch -c name creates one; a fast-forward merge only moves the pointer, otherwise merge makes a two-parent commit."], p: [P3], drills: [], needs: [PR-6.4.A] }
          - { id: B, std: [SWC-GIT-15], do: "Read conflict markers and resolve a merge conflict to a stated intended result.", ek: ["<<<<<<< HEAD marks your side, ======= separates, >>>>>>> branch ends theirs; edit to the final text, delete the markers, then add and commit."], p: [P4], drills: [], needs: [PR-6.5.A] }

  # ── 7 ────────────────────────────────────────────────────────────────────
  - id: python
    n: 7
    title: Python
    scope: core
    ideas: [AAP, DAT]
    weight_est: "—"
    topics:
      - n: 1
        title: From Java to Python
        los:
          - { id: A, std: [PY-1], do: "Translate a short Java method into Python: indentation for blocks, no type declarations, print().", ek: ["A colon plus indentation marks a block; names are bound by assignment and carry no declared type; # starts a comment."], p: [P2], drills: [], needs: [PR-2.4.B, PR-3.3.A] }
          - { id: B, std: [PY-1], do: "Evaluate Python arithmetic with /, //, %, ** and mixed int/float, and say where it differs from Java.", ek: ["7 / 2 = 3.5 always; 7 // 2 = 3 but −7 // 2 = −4 (floor, where Java truncates to −3); −7 % 2 = 1; ints never overflow; 2 ** 10 = 1024."], p: [P3], drills: [], needs: [PR-7.1.A, PR-1.3.C] }
          - { id: C, std: [PY-1], do: "Predict the truthiness of values and the result of and, or, not and chained comparisons.", ek: ["0, 0.0, '', [], {} and None are falsy; and / or return one of their operands, not just True or False; 1 < x < 5 chains."], p: [P3], drills: [], needs: [PR-7.1.A, PR-2.2.A] }
      - n: 2
        title: Loops and range
        los:
          - { id: A, std: [PY-2], do: "List the values range(start, stop, step) produces and count them, including negative steps.", ek: ["range stops before stop: range(2, 10, 3) → 2, 5, 8; len(range(a, b)) = b − a; range(5, 0, −1) → 5, 4, 3, 2, 1."], p: [P3], drills: [], needs: [PR-2.4.A, PR-7.1.A] }
          - { id: B, std: [PY-2], do: "Trace for loops over lists, strings, enumerate and zip, and while loops with break and continue.", ek: ["for x in seq yields elements, not indices; enumerate yields (i, x); zip stops at the shorter sequence; break leaves the loop, continue skips to the next pass."], p: [P3], drills: [], needs: [PR-7.2.A] }
      - n: 3
        title: Lists, slicing and comprehensions
        los:
          - { id: A, std: [PY-3], do: "Evaluate indexing and slicing with negative indices and steps on lists and strings.", ek: ["s[−1] is the last element; s[a:b] runs a to b − 1; s[::−1] reverses; a slice out of range is empty, never an IndexError."], p: [P3], drills: [], needs: [PR-7.2.A, PR-4.2.A] }
          - { id: B, std: [PY-3], do: "Predict a list after append, extend, insert, pop and remove, and tell sort() from sorted().", ek: ["List methods change the list in place and return None (so a = a.sort() loses it); sorted() returns a new list."], p: [P3], drills: [], needs: [PR-7.3.A] }
          - { id: C, std: [PY-3], do: "Predict the effect of aliasing versus copying lists, including lists of lists.", ek: ["b = a aliases; a[:] or list(a) is a shallow copy; [[0] * 3] * 2 repeats one inner list, so changing one row changes both."], p: [P3, P4], drills: [], needs: [PR-7.3.B, PR-1.7.D] }
          - { id: D, std: [PY-3], do: "Write and evaluate a list comprehension with a condition.", ek: ["[f(x) for x in seq if test(x)] filters, then maps, in one expression."], p: [P2, P3], drills: [], needs: [PR-7.3.B, PR-7.2.B] }
      - n: 4
        title: Dictionaries and strings
        los:
          - { id: A, std: [PY-4], do: "Predict a dictionary after insertions, updates and deletions, and count items with one.", ek: ["Keys are unique; d[k] raises KeyError when k is missing, d.get(k, 0) does not; d[k] = d.get(k, 0) + 1 counts occurrences."], p: [P3], drills: [], needs: [PR-7.3.B] }
          - { id: B, std: [PY-4], do: "Evaluate string methods (split, strip, join, replace) and f-string formatting with a set precision.", ek: ["f'{x:.3f}' prints 3 decimals, f'{x:.2e}' scientific notation; split() with no argument splits on any run of whitespace."], p: [P3], drills: [], needs: [PR-7.3.A] }
      - n: 5
        title: Functions, modules and errors
        los:
          - { id: A, std: [PY-5], do: "Trace a function with default and keyword arguments and give its return value, including an implicit None.", ek: ["A function that reaches its end without return gives None; a default value is evaluated once, when the function is defined."], p: [P3], drills: [], needs: [PR-7.1.A, PR-3.3.A] }
          - { id: B, std: [PY-5], do: "Import names from a module and guard script code with if __name__ == '__main__'.", ek: ["import numpy as np binds a module name; code under the guard runs when the file is executed, not when it is imported."], p: [P2], drills: [], needs: [PR-7.5.A] }
          - { id: C, std: [PY-5], do: "Read a traceback to find the failing line and the exception type, and handle an expected error with try / except.", ek: ["Read a traceback bottom up: the last line names the exception, the frame just above it the line that raised it; catch only the exception you expect."], p: [P4], drills: [], needs: [PR-7.5.A, PR-1.1.C] }
      - n: 6
        title: Reading and writing files
        los:
          - { id: A, std: [PY-6], do: "Read a text file line by line in a with-block, skip a header, split fields and convert them to numbers.", ek: ["with open(path) as f closes the file automatically; each line keeps its newline until strip(); float('1.5e-3') parses scientific notation."], p: [P2], drills: [], needs: [PR-7.4.B, PR-7.5.C, PR-4.5.A] }

  # ── 8 ────────────────────────────────────────────────────────────────────
  - id: scientific-computing
    n: 8
    title: Scientific computing with NumPy
    scope: core
    ideas: [NUM, DAT]
    weight_est: "—"
    topics:
      - n: 1
        title: NumPy arrays
        los:
          - { id: A, std: [SCI-1], do: "Create arrays with np.array, zeros, ones, arange and linspace, and give their shape, dtype and length.", ek: ["np.arange(0, 1, 0.25) excludes the end (4 values); np.linspace(0, 1, 5) includes it (5 values, spacing 0.25); all-integer input gives an int dtype."], p: [P3], drills: [], needs: [PR-7.3.A, PR-7.5.B] }
          - { id: B, std: [SCI-1], do: "Index and slice 1-D and 2-D arrays, including x[:, 0], x[1:, ::2] and boolean masks.", ek: ["x[i, j] is row i, column j; x[:, j] is column j; a slice is a view (writing to it changes x), x[mask] is a copy."], p: [P3], drills: [], needs: [PR-8.1.A, PR-4.7.A] }
          - { id: C, std: [SCI-1], do: "Reduce an array along an axis (sum, mean, max) and give the shape of the result.", ek: ["For shape (R, C), axis=0 collapses the rows and leaves C values (one per column); axis=1 leaves R; no axis gives a single number."], p: [P3], drills: [], needs: [PR-8.1.B] }
      - n: 2
        title: Vectorisation and broadcasting
        los:
          - { id: A, std: [SCI-2], do: "Replace an explicit loop with an element-wise array expression that gives the same result.", ek: ["x**2 + 3*x acts element by element in compiled code — typically 10–100× faster than the same Python loop."], p: [P2], drills: [], needs: [PR-8.1.C, PR-4.4.A] }
          - { id: B, std: [SCI-2], do: "Decide whether two shapes broadcast and give the result's shape.", ek: ["Align shapes from the right; each pair of dimensions must be equal or 1: (3, 1) with (4,) gives (3, 4); (3,) with (4,) fails."], p: [P3], drills: [], needs: [PR-8.2.A] }
          - { id: C, std: [SCI-2], do: "Tell element-wise * from the matrix product @ and give the shape of each result.", ek: ["(n, k) @ (k, m) → (n, m); * needs broadcastable shapes and multiplies matching entries."], p: [P3], drills: [], needs: [PR-8.2.B] }
          - { id: D, std: [SCI-2], do: "Compute all pairwise distances among N particles by broadcasting, giving each intermediate shape.", ek: ["r[:, None, :] − r[None, :, :] has shape (N, N, 3); the norm over the last axis gives the (N, N) distance matrix, zero on the diagonal."], p: [P2, P3], drills: [], needs: [PR-8.2.B] }
      - n: 3
        title: Reading data files
        los:
          - { id: A, std: [SCI-3], do: "Load a numeric text file with np.loadtxt or np.genfromtxt using delimiter, skiprows and usecols, and give the shape of the result.", ek: ["Lines starting with # are skipped by default; a CSV needs delimiter=','; unpack=True returns the columns as separate arrays."], p: [P2, P3], drills: [], needs: [PR-8.1.A, PR-7.6.A] }
          - { id: B, std: [SCI-3], do: "Compute summary statistics of a column (mean, std, min, argmax) and select the rows that meet a condition.", ek: ["np.argmax returns the index, not the value; np.std divides by N unless ddof=1 (sample standard deviation)."], p: [P3, P6], drills: [], needs: [PR-8.3.A, PR-8.1.C] }
          - { id: C, std: [SCI-3], do: "Save an array to a text or .npy file and reload it unchanged.", ek: ["np.save / np.load keep dtype and full precision; np.savetxt writes text, set fmt and header for readable columns."], p: [P2], drills: [], needs: [PR-8.3.A] }
      - n: 4
        title: Plotting
        los:
          - { id: A, std: [SCI-4], do: "Plot y against x with matplotlib, label the axes with units, add a legend and save the figure.", ek: ["plt.plot(x, y, label='…'); plt.xlabel('t (ps)'); plt.legend(); call plt.savefig('fig.png', dpi=300) before plt.show()."], p: [P2], drills: [], needs: [PR-8.3.A] }
          - { id: B, std: [SCI-4], do: "Choose linear, semilog or log-log axes from the expected relationship, and read an exponent or rate from the straight line.", ek: ["y = a·e^(−kt) is straight on semilog-y with slope −k (natural log); y = a·xⁿ is straight on log-log with slope n."], p: [P6], drills: [], needs: [PR-8.4.A] }
      - n: 5
        title: An MD-style integration loop
        los:
          - { id: A, std: [SCI-5], do: "Write a forward-Euler loop for dy/dt = f(y, t), compute the number of steps, and give y after a few steps.", ek: ["y_(n+1) = y_n + Δt·f(y_n, t_n); steps = T/Δt; global error shrinks in proportion to Δt."], p: [P2, P3], drills: [], needs: [PR-8.1.A, PR-2.5.A] }
          - { id: B, std: [SCI-5], do: "Integrate a 1-D harmonic oscillator with velocity Verlet and trace the first steps.", ek: ["v += (Δt/2)·a; x += Δt·v; a = F(x)/m; v += (Δt/2)·a — one force evaluation per step."], p: [P2, P3], drills: [], needs: [PR-8.5.A] }
          - { id: C, std: [SCI-5], do: "Track total energy along a trajectory and diagnose a timestep that is too large.", ek: ["Velocity Verlet keeps the energy bounded, oscillating about its start; Euler's energy grows steadily; Δt should be a small fraction (≲ 1/20) of the fastest period."], p: [P6], drills: [], needs: [PR-8.5.B, PR-8.4.A] }
          - { id: D, std: [SCI-5], do: "Compute the Lennard-Jones energy and force for a pair of particles, then vectorise it over all pairs.", ek: ["U = 4ε[(σ/r)¹² − (σ/r)⁶]; F(r) = (24ε/r)[2(σ/r)¹² − (σ/r)⁶]; minimum at r = 2^(1/6)σ with U = −ε."], p: [P2, P6], drills: [], needs: [PR-8.5.C, PR-8.2.D] }
      - n: 6
        title: Reproducible numerical scripts
        los:
          - { id: A, std: [SCI-6], do: "Seed a random number generator so a run reproduces exactly, and draw initial velocities from a normal distribution.", ek: ["rng = np.random.default_rng(seed); rng.normal(0, σ, size=(N, 3)); the same seed gives the same stream."], p: [P2, P6], drills: [], needs: [PR-8.1.A, PR-1.6.D] }
          - { id: B, std: [SCI-6], do: "Test a numerical function against a case with a known answer, using a tolerance.", ek: ["np.isclose / np.allclose with rtol and atol; e.g. a harmonic oscillator must return to its start after one period 2π√(m/k)."], p: [P6], drills: [], needs: [PR-1.5.C, PR-7.5.A, PR-8.5.B] }
          - { id: C, std: [SCI-6], do: "Organise an analysis as a script with functions and command-line arguments that writes its outputs to files, run from the shell and tracked in Git.", ek: ["Inputs from sys.argv or argparse, results to files, no hand edits between steps — so one command reruns everything."], p: [P2, P5], drills: [], needs: [PR-7.5.B, PR-5.4.B, PR-8.3.C, PR-6.1.B] }

  # ── 9 ────────────────────────────────────────────────────────────────────
  - id: systems-impact
    n: 9
    title: Computing systems, networks and impact
    scope: extension
    ideas: [CSN, DAT, IOC]
    weight_est: "—"
    topics:
      - n: 1
        title: The internet and fault tolerance
        book: { csp-ced: ["4.1", "4.2"] }
        los:
          - { id: A, std: [CSN-1.A, CSN-1.B, CSN-1.C], do: "Describe how data crosses the internet in packets, and what IP, TCP, HTTP and DNS each do.", ek: ["Data is split into packets that may take different routes and arrive out of order; IP addresses and routes, TCP reassembles and resends, DNS maps names to addresses, HTTP carries web requests."], p: [P5], drills: [] }
      - n: 2
        title: Parallel and distributed computing
        book: { csp-ced: ["4.3"] }
        los:
          - { id: A, std: [CSN-2.A, CSN-2.B], do: "Compute the run time and speedup of a workload split across processors.", ek: ["Parallel time = sequential part + the longest parallel branch; speedup = sequential time / parallel time, capped by the part that cannot be split."], p: [P3], drills: [] }
      - n: 3
        title: Compression
        book: { csp-ced: ["2.2"] }
        los:
          - { id: A, std: [DAT-1.D], do: "Choose lossless or lossy compression for a kind of data, and run-length encode a short string.", ek: ["Lossless restores every bit (text, code, trajectories); lossy discards detail people won't notice (photos, audio); AAAABB → 4A2B."], p: [P3, P5], drills: [], needs: [PR-1.2.B] }
      - n: 4
        title: Impact of computing
        book: { csp-ced: ["5.1", "5.2", "5.3", "5.6"] }
        los:
          - { id: A, std: [IOC-1.A, IOC-1.B, IOC-1.C, IOC-1.D], do: "Identify beneficial and harmful effects of a computing innovation, including the digital divide and bias built into its data.", ek: ["One innovation can help some groups and harm others; unequal access and unrepresentative training data both shift who benefits."], p: [P5], drills: [], needs: [PR-4.1.B] }

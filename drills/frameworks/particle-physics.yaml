# Particle Physics — curriculum framework (draft 1, for Kevin's markup)
#
# Basis, stated plainly: no standard was read for this. The topics are the ones an introductory
# modern-physics chapter covers (OpenStax University Physics vol. 3, ch. 11, title from memory); the IB
# Physics guide and the Particle Data Group's teaching materials are the places to look for a real one.
# Until then the objective list is a house decision.
#
# Not here yet: Feynman diagrams, colour and confinement, strangeness and the other flavour quantum
# numbers, parity and CP, neutrino oscillation, the Higgs mechanism, accelerators and detectors,
# relativistic energy-momentum problems, and cosmology.
id: particle-physics
title: Particle Physics
code: PP
draft: 1
track: science
requires: [physics, nuclear]
level: 4
domains: []

basis:
  primary: openstax-university-physics
  note: "No published standard was read. Topics follow an introductory modern-physics chapter (OpenStax University Physics vol. 3 ch. 11, chapter title from memory); the objective list is a house decision."

big_ideas:
  - id: ZOO
    title: Twelve fermions and four forces
    text: Six quarks and six leptons in three generations, each with an antiparticle, interacting by exchanging photons, W and Z bosons and gluons.
  - id: CONSERVE
    title: What can happen is what conserves everything
    text: Charge, baryon number and each lepton number balance in every reaction; energy decides whether an allowed reaction can actually go.

practices:
  - id: P1
    title: Compute
    text: Carry a charge, a quantum number or an energy to a value.
  - id: P2
    title: Decide
    text: Say whether a reaction is allowed and which interaction is responsible.

units:
  - id: particles
    n: 1
    title: "Particles and interactions"
    scope: core
    ideas: [ZOO]
    topics:
      - n: 1
        title: "Quarks and hadrons"
        los:
          - { id: A, do: "Find the charge of a hadron from its quark content.", ek: ["u, c, t: +2/3; d, s, b: −1/3; antiquarks opposite."], p: [P1], drills: [pp-hadron-charge] }
          - { id: B, do: "Classify a hadron as a baryon, an antibaryon or a meson.", ek: ["Three quarks, three antiquarks, or a quark and an antiquark."], p: [P2], drills: [pp-hadron-type] }
      - n: 2
        title: "Forces"
        los:
          - { id: A, do: "Name the carrier of each interaction and the interaction behind a given process.", ek: ["Photon, W and Z, gluon; only the weak force changes flavour."], p: [P2], drills: [pp-force-carrier] }
  - id: conservation
    n: 2
    title: "Conservation laws and energy"
    scope: core
    ideas: [CONSERVE]
    topics:
      - n: 1
        title: "Allowed and forbidden"
        los:
          - { id: A, do: "Check charge, baryon number and lepton numbers in a reaction or decay.", ek: ["Each balances separately; electron and muon lepton numbers are counted apart."], p: [P2], drills: [pp-conservation] }
      - n: 2
        title: "Mass and energy"
        los:
          - { id: A, do: "Convert a mass to a rest energy and find a pair-production threshold.", ek: ["931.5 MeV per u; a pair costs twice the rest energy."], p: [P1], drills: [pp-rest-energy, pp-pair-threshold] }
          - { id: B, do: "Calculate a Lorentz factor and a dilated lifetime or range.", ek: ["γ = 1/√(1 − v²/c²); lab lifetime = γ × rest lifetime."], p: [P1], drills: [pp-lorentz-factor, pp-muon-survival] }

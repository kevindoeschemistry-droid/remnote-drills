# INBDE (Integrated National Board Dental Examination) — curriculum framework (draft 1, for Kevin's markup)
#
# Basis:
#   jcnde-domain  The JCNDE Domain of Dentistry: 56 clinical content areas (CC) in three sections,
#                 crossed with 10 Foundation Knowledge areas (FK). Units 1–3 are the three sections;
#                 unit 4 is FK3 (physics and chemistry of technologies and materials), the dental
#                 materials science Kevin wants deepest. Objectives are ours and cite the CC or FK
#                 they serve.
#
# Calculations (tooth notation, anesthetic and epinephrine limits, attachment levels, test
# statistics, fluoride, and materials properties by the test methods behind the standards) are
# recomputed in tests/verify; the rest is authored. The materials test methods (ISO 4049 flexural
# strength, depth of cure, water sorption) are written from memory of the methods, not from the
# standard's text: check them against the documents Kevin's ADA committee work gives him.
#
# Units 5–13 (Nov 2026, generated from scripts/opl_specs/dn.py into dn-depth.yaml): dental and head-and-neck
# anatomy, histology and anomalies, pharmacology, microbiology and immunity, oral pathology, the clinical
# disciplines, systemic disease and emergencies, and ethics, law and research (FK1, FK4–FK10, CC1–CC56).
# Facts are authored multiple choice at entry level; doses, risks and statistics are recomputed by sympy.
id: inbde
title: INBDE (Dentistry)
code: DN
draft: 1
track: health
requires: []
level: 3
domains: []

basis:
  primary: jcnde-domain
  note: "Units are the Domain of Dentistry's three clinical sections plus Foundation Knowledge area 3 (materials); objectives cite the clinical content area or FK they serve and are ours."

big_ideas:
  - id: DX
    title: Diagnosis drives treatment
    text: Name the condition from its findings before choosing what to do.
  - id: SAFE
    title: Patient safety bounds every procedure
    text: Dose limits, medical risk, emergencies and infection control come before the dentistry.
  - id: MAT
    title: A material's chemistry decides its handling and its failure
    text: Setting reaction, filler, thermal expansion and modulus explain how to use a material and why restorations fail.

practices:
  - id: P1
    title: Calculate
    text: Carry a dose, measurement or property to a number.
  - id: P2
    title: Diagnose
    text: Name a condition from findings.
  - id: P3
    title: Know the rule
    text: State the standard of care or the material behaviour.

units:
  - id: diagnosis
    n: 1
    title: "Diagnosis and Treatment Planning (36.2%)"
    scope: core
    ideas: [DX]
    topics:
      - n: 1
        title: "Tooth notation and development"
        los:
          - { id: A, std: ["jcnde-domain:CC56"], do: "Convert between Universal and FDI notation, permanent and primary.", ek: ["FDI: quadrant 1–4 (primary 5–8), then position from the midline."], p: [P1], drills: [dn-universal-fdi, dn-primary-fdi] }
          - { id: B, std: ["jcnde-domain:FK1"], do: "Recall the primary and permanent eruption sequence.", ek: ["20 primary teeth by about 3; first molars at 6, second at 12."], p: [P3], drills: [dn-eruption, dn-dentition-counts] }
      - n: 2
        title: "Caries, pulpal and periodontal diagnosis"
        los:
          - { id: A, std: ["jcnde-domain:CC4", "jcnde-domain:CC21"], do: "Classify a lesion by G. V. Black's classes.", ek: ["I pits and fissures … VI cusp tips."], p: [P2], drills: [dn-black-class, dn-black-class-more] }
          - { id: B, std: ["jcnde-domain:CC20", "jcnde-domain:CC7"], do: "Make a pulpal diagnosis from thermal and electric tests.", ek: ["Lingering pain is irreversible; no response is necrosis."], p: [P2], drills: [dn-pulp-dx, dn-pulp-treatment] }
          - { id: C, std: ["jcnde-domain:CC22"], do: "Compute clinical attachment level and stage periodontitis by it.", ek: ["CAL from the CEJ; 1–2 mm stage I, 3–4 stage II, 5+ stage III or IV."], p: [P1, P2], drills: [dn-cal, dn-perio-stage] }
      - n: 3
        title: "Radiographs"
        los:
          - { id: A, std: ["jcnde-domain:CC10"], do: "Localize objects with the SLOB rule and recognise angulation errors.", ek: ["Same lingual, opposite buccal; vertical errors elongate or foreshorten."], p: [P3], drills: [dn-radiography, dn-slob-scenario] }
      - n: 4
        title: "Assessment, communication and planning"
        los:
          - { id: A, std: ["jcnde-domain:CC2", "jcnde-domain:CC3", "jcnde-domain:CC11", "jcnde-domain:FK1"], do: "Take a chief complaint and history, and run a head-and-neck and intraoral examination in order.", ek: ["Record the complaint in the patient's words and characterise pain (onset, location, quality, duration, triggers, relief); examine extraorally (asymmetry, nodes, TMJ, glands) before intraorally."], p: [P1], drills: [dn-history-exam, dn-pain-history] }
          - { id: B, std: ["jcnde-domain:CC6", "jcnde-domain:CC12"], do: "Predict a test result from the history and order the phases of a treatment plan.", ek: ["Plan in phases: systemic, urgent (acute), disease control, definitive (restorative/prosthetic), maintenance."], p: [P1], drills: [dn-plan-phase, dn-predict-result] }
          - { id: C, std: ["jcnde-domain:CC13", "jcnde-domain:CC14", "jcnde-domain:CC15", "jcnde-domain:FK9"], do: "Communicate options and adapt care to the patient's age, needs and values.", ek: ["Explain etiology, alternatives (including no treatment), risks and prognosis; use open questions and reflective listening; tell-show-do for children; plan for xerostomia and dexterity in older adults."], p: [P1], drills: [dn-informed-consent, dn-patient-adapt] }
          - { id: D, std: ["jcnde-domain:CC9", "jcnde-domain:FK2", "jcnde-domain:FK6"], do: "Relate oral disease to systemic disease and convert HbA1c to an estimated average glucose.", ek: ["Periodontitis and diabetes worsen each other; eAG (mg/dL) = 28.7 × HbA1c − 46.7 (ADAG); A1c ≥ 6.5% is diagnostic for diabetes."], p: [P1], drills: [dn-eag, dn-oral-systemic] }

  - id: management
    n: 2
    title: "Oral Health Management (42.0%)"
    scope: core
    ideas: [SAFE]
    topics:
      - n: 1
        title: "Medical emergencies and prophylaxis"
        los:
          - { id: A, std: ["jcnde-domain:CC16"], do: "Give the first drug or action for common office emergencies.", ek: ["Syncope: supine, legs up. Anaphylaxis: IM epinephrine. Angina: nitroglycerin."], p: [P3], drills: [dn-emergency, dn-emergency-more] }
          - { id: B, std: ["jcnde-domain:CC26"], do: "Decide who needs antibiotic prophylaxis against endocarditis and with what.", ek: ["Prosthetic valves, previous IE, some congenital disease, transplant valvulopathy; amoxicillin 2 g."], p: [P3], drills: [dn-prophylaxis, dn-prophylaxis-regimen] }
      - n: 2
        title: "Local anesthesia"
        los:
          - { id: A, std: ["jcnde-domain:CC19"], do: "Calculate maximum cartridges by weight and by epinephrine limit.", ek: ["mg/mL = % × 10; 1.8 mL cartridges; 1:100,000 = 0.01 mg/mL."], p: [P1], drills: [dn-la-max, dn-epi-limit] }
          - { id: B, std: ["jcnde-domain:CC19", "jcnde-domain:FK8"], do: "Explain local anesthetic action, metabolism and the role of vasoconstrictors.", ek: ["Uncharged base crosses the membrane; infection traps the cation; articaine is cleared in plasma."], p: [P3], drills: [dn-la-facts, dn-lidocaine-cartridges] }
      - n: 3
        title: "Caries prevention: fluoride"
        los:
          - { id: A, std: ["jcnde-domain:CC21", "jcnde-domain:FK2"], do: "Convert NaF concentration to ppm fluoride and compute the probably toxic dose.", ek: ["F is 45% of NaF; 1% = 10,000 ppm; PTD 5 mg F/kg."], p: [P1], drills: [dn-fluoride-ppm, dn-fluoride-ptd] }
      - n: 4
        title: "Patient management beyond the procedure"
        los:
          - { id: A, std: ["jcnde-domain:CC25", "jcnde-domain:FK8"], do: "Recognise substance use that changes dental care and total an opioid prescription in morphine milligram equivalents.", ek: ["MME/day = mg per dose × doses per day × conversion factor (codeine 0.15, hydrocodone 1, oxycodone 1.5, CDC 2022); avoid epinephrine within 24 h of cocaine use."], p: [P1], drills: [dn-mme, dn-substance-use] }
          - { id: B, std: ["jcnde-domain:CC36", "jcnde-domain:CC38", "jcnde-domain:FK1"], do: "Use proportion and the supracrestal attachment to plan esthetic and soft-tissue changes.", ek: ["Seen from the front, central : lateral : canine widths follow roughly 1.618 : 1 : 0.618; keep about 3 mm from the restorative margin to bone (about 2 mm of attached tissue plus the sulcus)."], p: [P1], drills: [dn-golden-proportion, dn-esthetic-tissue] }
          - { id: C, std: ["jcnde-domain:CC37", "jcnde-domain:FK10"], do: "Evaluate treatment outcomes and convert survival over years into an annual failure rate.", ek: ["AFR = 1 − S^(1/years); recall intervals follow risk (often 3–6 months for high caries or periodontal risk)."], p: [P1], drills: [dn-afr, dn-outcome] }
      - n: 5
        title: "Chemistry of the mouth and host defence"
        los:
          - { id: A, std: ["jcnde-domain:FK2", "jcnde-domain:CC21"], do: "Relate plaque pH to enamel and root demineralisation, and fluoride to the critical pH.", ek: ["Hydroxyapatite dissolves below about pH 5.5, fluorapatite below about 4.5, root dentin near 6.2–6.7; each sugar exposure drops plaque pH for 20–40 minutes (Stephan curve)."], p: [P1], drills: [dn-critical-ph, dn-ph-hplus] }
          - { id: B, std: ["jcnde-domain:FK2", "jcnde-domain:FK1"], do: "Use the bicarbonate buffer to compute salivary pH and explain how flow changes it.", ek: ["pH = 6.1 + log([HCO₃⁻]/(0.03·P_CO₂)); stimulated saliva carries more bicarbonate and buffers better."], p: [P1], drills: [dn-saliva-ph, dn-saliva-function] }
          - { id: C, std: ["jcnde-domain:FK5", "jcnde-domain:CC22"], do: "Match the host's defences to the stages of gingival and periodontal disease.", ek: ["Neutrophils dominate the early lesion; T cells, then B and plasma cells, the established and advanced lesions; secretory IgA and lysozyme defend saliva; host enzymes (MMPs) and RANKL drive tissue and bone loss."], p: [P1], drills: [dn-perio-immune, dn-host-modulation] }
          - { id: D, std: ["jcnde-domain:FK5", "jcnde-domain:FK7", "jcnde-domain:CC51"], do: "Interpret immunisation and exposure tests for dental personnel.", ek: ["Anti-HBs ≥ 10 mIU/mL after the hepatitis B series means protection; a non-responder repeats the series once; post-exposure HIV prophylaxis should start within hours (ideally under 2, at most 72)."], p: [P1], drills: [dn-hbv-titer, dn-needlestick-risk] }

  - id: practice
    n: 3
    title: "Practice and Profession (21.8%)"
    scope: core
    ideas: [SAFE]
    topics:
      - n: 1
        title: "Infection control"
        los:
          - { id: A, std: ["jcnde-domain:CC51"], do: "Classify instruments (Spaulding) and state sterilization and monitoring standards.", ek: ["Critical and semicritical items are sterilized; spore tests weekly."], p: [P3], drills: [dn-spaulding, dn-sterilization] }
      - n: 2
        title: "Evaluating evidence and diagnostic tests"
        los:
          - { id: A, std: ["jcnde-domain:CC41", "jcnde-domain:FK10"], do: "Compute sensitivity, specificity and predictive values from a 2×2 table.", ek: ["Sensitivity and specificity belong to the test; predictive values depend on prevalence."], p: [P1], drills: [dn-test-stats, dn-ppv-prevalence] }
      - n: 3
        title: "Practice, team and community"
        los:
          - { id: A, std: ["jcnde-domain:CC42", "jcnde-domain:CC50", "jcnde-domain:FK9"], do: "Recognise the limits of general practice and refer, and assess one's own competence.", ek: ["Refer when the case exceeds training or equipment; the referring dentist still owes follow-up; continuing education and outcome audit drive self-assessment."], p: [P1], drills: [dn-referral, dn-scope] }
          - { id: B, std: ["jcnde-domain:CC43", "jcnde-domain:CC47", "jcnde-domain:FK9"], do: "Read practice finances and meet OSHA and HIPAA duties.", ek: ["Overhead % = expenses ÷ collections; collection ratio = collected ÷ produced; HIPAA protects health information; OSHA's bloodborne pathogens standard protects staff."], p: [P1], drills: [dn-overhead, dn-osha-hipaa] }
          - { id: C, std: ["jcnde-domain:CC48"], do: "Plan for emergencies and disasters in the practice.", ek: ["Written plan with roles, evacuation and communication, data backup off site, and drills; dentists may help identify victims through dental records."], p: [P1], drills: [dn-disaster-plan, dn-office-preparedness] }
          - { id: D, std: ["jcnde-domain:CC49", "jcnde-domain:FK9"], do: "Delegate to allied dental personnel at the right level of supervision.", ek: ["Direct supervision: dentist present and checks; general: dentist authorised but need not be present; the allowed duties are set by each state's practice act."], p: [P1], drills: [dn-supervision, dn-delegation] }
          - { id: E, std: ["jcnde-domain:CC53", "jcnde-domain:CC54", "jcnde-domain:CC39", "jcnde-domain:CC40", "jcnde-domain:FK10"], do: "Measure a population's caries and choose community programmes.", ek: ["DMFT = decayed + missing + filled teeth; community water fluoridation at 0.7 mg/L (USPHS 2015); school sealant programmes; teledentistry and silver diamine fluoride widen access."], p: [P1], drills: [dn-dmft, dn-community] }
          - { id: F, std: ["jcnde-domain:CC55", "jcnde-domain:FK7"], do: "Apply quality assurance: audit, compare against a standard and fix the process.", ek: ["Plan–Do–Study–Act cycles; weekly biological (spore) testing of sterilisers; a failed spore test means retest, recall loads and repair."], p: [P1], drills: [dn-spore-rate, dn-quality] }

  - id: materials
    n: 4
    title: "Dental materials (FK3, 8.0%)"
    scope: core
    std: ["jcnde-domain:FK3"]
    ideas: [MAT]
    topics:
      - n: 1
        title: "Mechanical properties"
        los:
          - { id: A, do: "Compute stress, elastic modulus and Vickers hardness, and compare restoratives with enamel and dentin.", ek: ["MPa = N/mm²; E = σ/ε; HV = 1.8544 F/d²."], p: [P1], drills: [dn-stress, dn-modulus, dn-vickers] }
          - { id: B, std: ["jcnde-domain:CC30"], do: "Compute flexural strength from a three-point bend test.", ek: ["σ = 3FL/(2bh²); ISO 4049 uses 2 × 2 mm bars on a 20 mm span."], p: [P1], drills: [dn-flexural-strength, dn-flexural-load] }
          - { id: C, do: "Compute a probability of failure from Weibull statistics and read the Weibull modulus.", ek: ["P_f = 1 − exp(−(σ/σ₀)^m); a higher m means more reliable, less scattered strength."], p: [P1], drills: [dn-weibull-failure, dn-weibull-design-stress] }
      - n: 2
        title: "Resin composites and their polymerization"
        los:
          - { id: B, do: "Explain what each composite component does and how filler changes properties.", ek: ["Silane couples filler; camphorquinone absorbs blue light; oxygen inhibits the surface."], p: [P3], drills: [dn-composite-types, dn-composite-choice] }
          - { id: A, std: ["jcnde-domain:CC30"], do: "Compute radiant exposure, depth of cure, shrinkage, C-factor and water sorption.", ek: ["J/cm² = mW/cm² × s / 1000; depth = scraped length / 2; shrinkage = 1 − ρu/ρc."], p: [P1], drills: [dn-radiant-exposure, dn-depth-of-cure, dn-shrinkage, dn-c-factor, dn-water-sorption] }
          - { id: C, std: ["jcnde-domain:CC30"], do: "Compute degree of conversion from FTIR peak ratios.", ek: ["DC = 1 − (A₁₆₃₈/A₁₆₀₈)cured ÷ (A₁₆₃₈/A₁₆₀₈)uncured; the aromatic band is the internal standard."], p: [P1], drills: [dn-degree-conversion, dn-ratio-for-dc] }
          - { id: D, do: "Convert filler loading between weight and volume fractions.", ek: ["φ_v = (w/ρ_f) ÷ (w/ρ_f + (1 − w)/ρ_r)."], p: [P1], drills: [dn-filler-volume, dn-filler-weight] }
          - { id: E, do: "Compute water solubility as ISO 4049 defines it and judge sorption and solubility against the limits.", ek: ["Solubility = (m₁ − m₃)/V; limits 40 µg/mm³ sorption and 7.5 µg/mm³ solubility."], p: [P1], drills: [dn-solubility, dn-max-mass-loss] }
      - n: 3
        title: "Thermal behaviour"
        los:
          - { id: A, do: "Compute the marginal gap from a thermal-expansion mismatch.", ek: ["ΔL = Δα·L·ΔT; tooth about 11.4 ppm/°C."], p: [P1], drills: [dn-thermal-gap, dn-temperature-for-gap] }
      - n: 4
        title: "Cements, amalgam and adhesion"
        los:
          - { id: A, std: ["jcnde-domain:CC30"], do: "Explain the setting and properties of amalgam, glass ionomer, zinc phosphate and ZOE, and how etching works.", ek: ["High-copper removes γ₂; GI bonds and releases fluoride; eugenol inhibits resin."], p: [P3], drills: [dn-restoratives, dn-cement-choice] }
          - { id: B, std: ["jcnde-domain:CC31"], do: "Choose the surface treatment for bonding a ceramic restoration.", ek: ["Glass ceramics: HF + silane. Zirconia: air abrasion + MDP."], p: [P3], drills: [dn-ceramic-bonding, dn-ceramic-why] }
          - { id: C, std: ["jcnde-domain:CC30"], do: "Classify adhesive systems and choose one for a situation.", ek: ["Etch-and-rinse (3- or 2-step), self-etch (2- or 1-step), universal; the hybrid layer; 10-MDP bonds chemically to hydroxyapatite and zirconia."], p: [P2, P3], drills: [dn-adhesive-class, dn-adhesive-scenario] }
          - { id: E, std: ["jcnde-domain:CC31"], do: "Compare zirconia and glass-ceramic classes by strength, translucency and bonding.", ek: ["3Y-TZP strongest and most opaque; 5Y more translucent, weaker; lithium disilicate is etchable with HF."], p: [P2, P3], drills: [dn-ceramic-class, dn-ceramic-scenario] }
          - { id: D, do: "Compute bond strength from a shear or microtensile test.", ek: ["σ = F/A; microtensile beams are about 1 mm²."], p: [P1], drills: [dn-bond-strength, dn-load-for-strength] }
      - n: 5
        title: "Alloys, gypsum and impression materials"
        los:
          - { id: B, std: ["jcnde-domain:CC56"], do: "Mix gypsum at the right water/powder ratio and choose and handle impression materials.", ek: ["W/P 0.50 plaster, 0.30 stone, 0.24 die stone; pour alginate at once; PVS is the most stable."], p: [P1, P3], drills: [dn-gypsum-water, dn-impression] }
          - { id: A, std: ["jcnde-domain:CC31"], do: "Classify a casting alloy by noble-metal content.", ek: ["High noble ≥ 60% noble with ≥ 40% gold; noble ≥ 25%; silver is not noble."], p: [P1, P3], drills: [dn-noble-class, dn-noble-total] }
  # >>> opl-fill:dn-depth (generated by scripts/opl_fill.py; edit the spec)
  - id: dental-anatomy
    n: 5
    title: "Dental anatomy and occlusion (FK1)"
    scope: core
    std: ["jcnde-domain:CC28", "jcnde-domain:CC31", "jcnde-domain:CC34"]
    ideas: [DX]
    topics:
      - n: 1
        title: "Tooth morphology and occlusion"
        los:
          - { id: A, std: ["jcnde-domain:FK1", "jcnde-domain:CC28"], do: "Recall root and canal numbers of permanent teeth.", ek: ["Maxillary first molar 3 roots (MB often 2 canals); mandibular first molar 2 roots; maxillary first premolar usually 2."], p: [P3], drills: [dn-root-count, dn-canal-counts] }
          - { id: B, std: ["jcnde-domain:FK1"], do: "Recall cusp and crown features that identify a tooth.", ek: ["Mandibular first molar 5 cusps; maxillary first molar 4 plus Carabelli; mandibular second premolar may have 3."], p: [P3], drills: [dn-crown-features, dn-identify-tooth] }
          - { id: C, std: ["jcnde-domain:CC34"], do: "Classify occlusion by Angle's molar relationship.", ek: ["Class I: MB cusp of the maxillary first molar in the buccal groove of the mandibular first molar; II: distal mandible; III: mesial mandible."], p: [P2], drills: [dn-angle-class, dn-canine-relation] }
          - { id: D, std: ["jcnde-domain:CC31"], do: "Judge an abutment by its crown-to-root ratio.", ek: ["Ideal 1:2; 2:3 is acceptable; 1:1 is the minimum for an abutment."], p: [P1], drills: [dn-crown-root-ratio, dn-root-needed] }
  - id: head-neck
    n: 6
    title: "Head and neck anatomy (FK1)"
    scope: core
    std: ["jcnde-domain:CC18", "jcnde-domain:CC19", "jcnde-domain:CC35"]
    ideas: [DX]
    topics:
      - n: 1
        title: "Nerves, muscles, vessels and glands"
        los:
          - { id: A, std: ["jcnde-domain:FK1", "jcnde-domain:CC19"], do: "Name the nerve that supplies a structure.", ek: ["Muscles of mastication: V3. Facial expression: VII. Taste anterior two-thirds: VII (chorda tympani); posterior third: IX. Tongue movement: XII."], p: [P3], drills: [dn-nerve-supply, dn-block-coverage] }
          - { id: B, std: ["jcnde-domain:FK1", "jcnde-domain:CC35"], do: "Know what each muscle of mastication does.", ek: ["Masseter, temporalis, medial pterygoid close; lateral pterygoid opens and protrudes."], p: [P3], drills: [dn-mastication-muscles, dn-muscle-movement] }
          - { id: C, std: ["jcnde-domain:FK1", "jcnde-domain:CC19"], do: "Locate salivary ducts and the landmarks of nerve blocks.", ek: ["Parotid (Stensen) opposite the maxillary second molar; submandibular (Wharton) at the sublingual caruncle."], p: [P3], drills: [dn-ducts-landmarks, dn-landmark-locate] }
          - { id: D, std: ["jcnde-domain:FK1", "jcnde-domain:CC18"], do: "Trace the arterial supply and lymph drainage of the mouth.", ek: ["Teeth from branches of the maxillary artery; lower lip and floor drain to submental and submandibular nodes."], p: [P3], drills: [dn-vessels-nodes, dn-vessel-risk] }
  - id: histology
    n: 7
    title: "Oral histology and development (FK1, FK4)"
    scope: core
    std: ["jcnde-domain:CC5", "jcnde-domain:FK1", "jcnde-domain:FK4"]
    ideas: [DX]
    topics:
      - n: 1
        title: "Tooth development, tissues and developmental anomalies"
        los:
          - { id: A, std: ["jcnde-domain:FK1"], do: "Name the cell and germ layer behind each dental tissue.", ek: ["Enamel from ameloblasts (ectoderm); dentin, pulp and cementum from ectomesenchyme (neural crest)."], p: [P3], drills: [dn-tissue-origin, dn-supporting-origin] }
          - { id: B, std: ["jcnde-domain:FK4", "jcnde-domain:CC5"], do: "Recognise developmental anomalies of teeth.", ek: ["Amelogenesis imperfecta: enamel only. Dentinogenesis imperfecta: opalescent teeth, obliterated pulps, linked with osteogenesis imperfecta."], p: [P2], drills: [dn-tooth-anomalies, dn-anomaly-shape] }
          - { id: C, std: ["jcnde-domain:FK4"], do: "Explain how clefts form.", ek: ["Cleft lip: failed fusion of the medial nasal and maxillary processes. Cleft palate: failed fusion of the palatal shelves."], p: [P3], drills: [dn-clefts, dn-cleft-timing] }
  - id: pharmacology
    n: 8
    title: "Pharmacology (FK8)"
    scope: core
    std: ["jcnde-domain:CC26", "jcnde-domain:CC27", "jcnde-domain:CC8"]
    ideas: [DX]
    topics:
      - n: 1
        title: "Analgesics, antibiotics, interactions and dosing"
        los:
          - { id: B, std: ["jcnde-domain:FK8", "jcnde-domain:CC26", "jcnde-domain:CC27"], do: "Choose antibiotics and know their dental side effects.", ek: ["Amoxicillin first line; penicillin allergy: azithromycin or doxycycline (clindamycin no longer recommended for prophylaxis, AHA 2021)."], p: [P3], drills: [dn-antibiotics, dn-antibiotic-risks] }
          - { id: C, std: ["jcnde-domain:FK8", "jcnde-domain:CC27", "jcnde-domain:CC8"], do: "Recognise drug interactions and complications that change dental care.", ek: ["Epinephrine with nonselective β-blockers: hypertension and reflex bradycardia. Antiresorptives: MRONJ. Bisphosphonates and denosumab before extractions."], p: [P3], drills: [dn-interactions, dn-interaction-scenarios] }
          - { id: A, std: ["jcnde-domain:FK8", "jcnde-domain:CC26"], do: "Recall analgesic choices and limits for dental pain.", ek: ["Ibuprofen 400 mg ± acetaminophen 500–1000 mg beats opioids for most dental pain; acetaminophen ≤ 4 g/day (usual adult maximum)."], p: [P3], drills: [dn-analgesics, dn-acetaminophen-tablets] }
          - { id: D, std: ["jcnde-domain:FK8", "jcnde-domain:CC26"], do: "Calculate a weight-based pediatric antibiotic dose.", ek: ["Endocarditis prophylaxis: amoxicillin 50 mg/kg, not above the adult 2 g."], p: [P1], drills: [dn-peds-amoxicillin, dn-suspension-volume] }

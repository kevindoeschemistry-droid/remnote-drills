# Inorganic Chemistry — curriculum framework (draft 1, for Kevin's markup)
#
# Basis: the IChO regulations, Appendix C (concepts) and Appendix D (factual knowledge), read in full
# (drills/standards.yaml › icho-appendix-c). Appendix D's descriptive list (s block, hydrides, oxides,
# p-block oxoacids, halogens, first-row transition-metal ions, amphoterism, permanganate and
# dichromate, iodometry, identifying ions) is the spine of units 1, 2, 4; coordination and solids
# follow the IChO "preparatory only" topics and the GRE Chemistry inorganic area. Objectives and
# their order are ours.
#
# Not here yet: group theory and MO diagrams for complexes (in physical chemistry, unit 17), Latimer
# and Frost diagrams, organometallic electron counting (18-electron rule), lanthanides, band theory.
id: inorganic-chemistry
title: Inorganic Chemistry
code: IN
draft: 1
track: science
requires: [chemistry, periodic-table]
level: 4
domains: [inorg]

basis:
  primary: icho-appendix-c
  also: [icho-syllabus, gre-chemistry, usnco, ib-chemistry-2025]
  note: "Units 1, 2 and 4 follow IChO Appendix D's factual-knowledge list (read in full); coordination and solids follow its preparation-only topics and the GRE inorganic area. Objectives and their order are ours."

big_ideas:
  - id: COUNT
    title: Count electrons first
    text: Oxidation states, d counts, half-equations and titration ratios are all electron bookkeeping. Get the count and the rest follows.
  - id: SPLIT
    title: Ligands split the d orbitals
    text: Geometry and ligand strength set the splitting; the splitting sets spin, colour, magnetism and stability.
  - id: TREND
    title: Position predicts behaviour
    text: Down a group ions grow and oxides turn basic; across a period oxides turn acidic. Most descriptive facts are a trend with a few named exceptions.
  - id: PACK
    title: Solids are geometry
    text: Where atoms sit in the cell fixes how many there are, how many neighbours each has, how full the space is and how X-rays scatter.

practices:
  - id: P1
    title: Compute
    text: Carry an oxidation-state, electron or lattice calculation to a number.
  - id: P2
    title: Recall
    text: Know the colour, the product, the test.
  - id: P3
    title: Predict
    text: Use a trend or a model to say what will happen.

units:
  - id: s-block
    n: 1
    title: "The s block"
    std: ["icho-appendix-c:d1", "icho-syllabus:5", "gre-chemistry:IN"]
    scope: core
    ideas: [TREND]
    topics:
      - n: 1
        title: "Group 1 and 2 reactions"
        los:
          - { id: A, std: ["icho-appendix-c:d1"], do: "Name the flame colour of a group 1 or 2 element (and copper).", ek: ["Li crimson, Na yellow, K lilac, Ca orange-red, Sr crimson, Ba apple green, Cu blue-green."], p: [P2], drills: [in-flame-colour] }
          - { id: B, std: ["icho-appendix-c:d1"], do: "Give the product of burning an s-block metal in oxygen.", ek: ["Li oxide, Na peroxide, K/Rb/Cs superoxide; group 2 oxides."], p: [P2, P3], drills: [in-s-block-oxygen] }
  - id: p-block
    n: 2
    title: "The p block and oxidation states"
    std: ["icho-appendix-c:d2", "icho-appendix-c:d3", "icho-appendix-c:d4", "icho-appendix-c:d5", "icho-syllabus:5"]
    scope: core
    ideas: [COUNT, TREND]
    topics:
      - n: 1
        title: "Oxidation states"
        los:
          - { id: A, std: ["ib-chemistry-2025:R3.2"], do: "Find the oxidation state (or average) of an element in a formula or ion.", ek: ["Fix F, group 1–2, H and O by rule; charge balance gives the rest."], p: [P1], drills: [in-ox-state] }
          - { id: B, std: ["icho-appendix-c:d5"], do: "Find the ratio of atoms reduced to atoms oxidised in a disproportionation.", ek: ["Electrons lost = electrons gained."], p: [P1], needs: [IN-2.1.A], drills: [in-disproportionation] }
      - n: 2
        title: "Oxides and oxoacids"
        los:
          - { id: A, std: ["icho-appendix-c:d4"], do: "Name a halogen, sulfur or nitrogen oxoacid from its formula.", ek: ["hypo-…-ous, -ous, -ic, per-…-ic in order of oxidation state."], p: [P2], needs: [IN-2.1.A], drills: [in-oxoacid-name] }
          - { id: B, std: ["icho-appendix-c:d3"], do: "Classify an oxide as acidic, basic, amphoteric or neutral.", ek: ["Metal oxides basic, non-metal oxides acidic, Al/Be/Zn amphoteric, CO/NO/N₂O neutral."], p: [P2, P3], drills: [in-oxide-character] }
  - id: coordination
    n: 3
    title: "The d block and coordination compounds"
    std: ["icho-appendix-c:d6", "icho-appendix-c:a1", "gre-chemistry:IN"]
    scope: core
    ideas: [COUNT, SPLIT]
    topics:
      - n: 1
        title: "Counting and splitting"
        los:
          - { id: A, do: "Find the metal's d-electron count in a complex.", ek: ["dⁿ = group − oxidation state."], p: [P1], needs: [IN-2.1.A], drills: [in-d-count] }
          - { id: B, do: "Give the spin-only magnetic moment of a high- or low-spin complex.", ek: ["μ = √(n(n+2)) μ_B."], p: [P1], needs: [IN-3.1.A], drills: [in-spin-only] }
          - { id: C, do: "Compute the crystal-field stabilisation energy of an octahedral ion.", ek: ["−0.4Δ_o per t₂g electron, +0.6Δ_o per e_g electron."], p: [P1], needs: [IN-3.1.A], drills: [in-cfse] }
          - { id: D, do: "Rank ligands by the size of the splitting they cause.", ek: ["I⁻ < Br⁻ < Cl⁻ < F⁻ < OH⁻ < H₂O < NH₃ < en < NO₂⁻ < CN⁻ < CO."], p: [P2], drills: [in-spectrochemical] }
      - n: 2
        title: "Structure and colour"
        los:
          - { id: A, std: ["icho-appendix-c:a1"], do: "Count the stereoisomers of an octahedral or square-planar complex.", ek: ["Geometric isomers by trans pairs, then check each for chirality."], p: [P3], drills: [in-isomer-count] }
          - { id: B, std: ["icho-appendix-c:d6"], do: "Name the colour of a common transition-metal ion or oxoanion in water.", ek: ["Colour is the complement of the light absorbed; d⁰ and d¹⁰ are colourless unless charge transfer."], p: [P2], drills: [in-ion-colour] }
  - id: redox-qual
    n: 4
    title: "Redox and qualitative analysis"
    std: ["icho-appendix-c:d7", "icho-appendix-c:d8", "icho-appendix-c:d9", "icho-appendix-c:d10", "icho-appendix-c:c16", "usnco:2"]
    scope: core
    ideas: [COUNT, TREND]
    topics:
      - n: 1
        title: "Redox"
        los:
          - { id: A, std: ["icho-appendix-c:d8"], do: "Count the electrons in a half-equation.", ek: ["Change in oxidation state × atoms changing."], p: [P1], needs: [IN-2.1.A], drills: [in-half-electrons] }
          - { id: B, std: ["icho-appendix-c:d9"], do: "Find an oxidant's concentration from an iodometric titration.", ek: ["One thiosulfate per electron from the oxidant to its final reduced form."], p: [P1], needs: [IN-4.1.A], drills: [in-iodometry] }
      - n: 2
        title: "Identifying ions"
        los:
          - { id: A, std: ["icho-appendix-c:d7"], do: "Pick the hydroxide that redissolves in excess NaOH.", ek: ["Al, Zn, Pb, Sn, Cr(III), Be are amphoteric."], p: [P2], drills: [in-amphoteric] }
          - { id: B, std: ["icho-appendix-c:d10"], do: "Name the colour of a common precipitate.", ek: ["AgCl white, AgBr cream, AgI yellow; Cu(OH)₂ blue; Fe(OH)₃ red-brown."], p: [P2], drills: [in-precipitate-colour] }
          - { id: C, std: ["icho-appendix-c:d10", "icho-appendix-c:c16"], do: "Choose the test that identifies a common ion.", ek: ["Acidify before BaCl₂ or AgNO₃; Fe³⁺ with SCN⁻; NH₄⁺ with warm NaOH."], p: [P2], needs: [IN-4.2.B], drills: [in-ion-test] }
  - id: solids
    n: 5
    title: "The solid state"
    std: ["icho-appendix-c:a1", "gre-chemistry:IN"]
    scope: core
    ideas: [PACK]
    topics:
      - n: 1
        title: "Cubic cells"
        los:
          - { id: A, do: "Count the atoms or ions in a cubic unit cell.", ek: ["Corner 1/8, edge 1/4, face 1/2, body 1."], p: [P1], drills: [in-cell-contents] }
          - { id: B, do: "Give the coordination number in a metal or ionic structure.", ek: ["sc 6, bcc 8, fcc 12; NaCl 6, CsCl 8, ZnS 4, CaF₂ 8:4."], p: [P2], needs: [IN-5.1.A], drills: [in-coordination-number] }
          - { id: C, do: "Compute the packing fraction of a cubic lattice.", ek: ["Z(4/3)πr³/a³ with r where spheres touch."], p: [P1], needs: [IN-5.1.A], drills: [in-packing] }
          - { id: D, do: "Compute a density from the cell edge and structure.", ek: ["ρ = ZM/(N_A a³)."], p: [P1], needs: [IN-5.1.A], drills: [in-density] }
          - { id: E, do: "Predict a coordination number from the radius ratio.", ek: ["0.225, 0.414, 0.732 thresholds."], p: [P3], needs: [IN-5.1.B], drills: [in-radius-ratio] }
      - n: 2
        title: "Diffraction"
        los:
          - { id: A, std: ["icho-appendix-c:a1"], do: "Apply Bragg's law with cubic plane spacings.", ek: ["nλ = 2d sin θ; d = a/√(h²+k²+l²)."], p: [P1], drills: [in-bragg] }

# NCLEX-RN — curriculum framework (draft 1, for Kevin's markup)
#
# Basis:
#   ncsbn-nclex-rn  The 2026 NCLEX-RN Test Plan: four Client Needs categories split into eight
#                   subcategories with exam weights, each with a related-content list. Units are the
#                   eight subcategories in the plan's order; topics are groups of its related content;
#                   the objectives are ours.
#
# One question per card. Calculations (dosage, IV and titrated drips, safe-dose ranges, ABGs, blood
# compatibility, GCS, APGAR, burns, MAP, maintenance fluids) are recomputed in tests/verify; rules,
# priorities and facts are authored from standard entry-level content. The plan's clinical judgment
# model (recognize cues → evaluate outcomes) is a way of asking, not a list of content: the
# priority and "what first" cards are where it shows. Not built: NGN case studies (bow-tie, matrix,
# trend items), which need a multi-screen format RemNote cards do not have.
id: nclex-rn
title: NCLEX-RN
code: NR
draft: 1
track: health
requires: []
level: 3
domains: []

basis:
  primary: ncsbn-nclex-rn
  note: "Units are the test plan's eight Client Needs subcategories (with their weights); topics group its related-content items; the objectives are ours."

big_ideas:
  - id: SAFE
    title: Safety first, then the rest
    text: Airway, breathing, circulation; acute over chronic; unstable over stable; the least invasive action that protects the client.
  - id: CALC
    title: Every dose is a ratio
    text: Desired over have, per kilogram, per hour; units carried through and the answer checked against a safe range.
  - id: CUES
    title: Findings are cues to interpret
    text: A lab value, a vital sign or a symptom means something only against its range and the client's condition.

practices:
  - id: P1
    title: Calculate
    text: Carry an order to a dose, rate or score.
  - id: P2
    title: Prioritize
    text: Choose who or what comes first, and who does it.
  - id: P3
    title: Interpret
    text: Read a finding against its range and name what it means.
  - id: P4
    title: Know the rule
    text: State the standard of care.

units:
  - id: management
    n: 1
    title: "Management of Care (15–21%)"
    scope: core
    std: ["ncsbn-nclex-rn:MOC"]
    ideas: [SAFE]
    topics:
      - n: 1
        title: "Establishing priorities"
        los:
          - { id: A, do: "Choose which client to see first from airway, breathing and circulation, acute over chronic, unstable over stable.", ek: ["A silent chest in asthma, a pulseless limb, stridor after neck surgery and a transfusion reaction come before pain at 5/10."], p: [P2], drills: [nr-priority] }
      - n: 2
        title: "Assignment, delegation and supervision"
        los:
          - { id: A, do: "Assign a task to the least-qualified person who can do it safely.", ek: ["The RN keeps assessment, initial teaching, planning, evaluation and unstable clients."], p: [P2], drills: [nr-delegation] }
      - n: 3
        title: "Legal rights, informed consent and ethical practice"
        los:
          - { id: A, do: "Apply informed consent, the right to refuse, advance directives and incident reporting.", ek: ["The provider informs, the nurse witnesses; incident reports never go in the chart."], p: [P4], drills: [nr-legal] }

  - id: safety
    n: 2
    title: "Safety and Infection Prevention and Control (10–16%)"
    scope: core
    std: ["ncsbn-nclex-rn:SIPC"]
    ideas: [SAFE]
    topics:
      - n: 1
        title: "Standard and transmission-based precautions"
        los:
          - { id: A, do: "Choose contact, droplet or airborne precautions for a disease.", ek: ["Airborne: TB, measles, varicella. Droplet: influenza, pertussis, meningococcus. Contact: C. difficile, MRSA, scabies."], p: [P4], drills: [nr-precautions] }
          - { id: B, do: "Put on and take off PPE in the right order.", ek: ["On: gown, mask, goggles, gloves. Off: gloves, goggles, gown, mask."], p: [P4], drills: [nr-ppe-order] }
      - n: 2
        title: "Accident and error prevention; restraints"
        los:
          - { id: A, do: "Apply client identification, fire response and restraint rules.", ek: ["Two identifiers; RACE and PASS; restraints tied to the frame, checked and released at least every 2 hours."], p: [P4], drills: [nr-safety-rules] }

  - id: health-promotion
    n: 3
    title: "Health Promotion and Maintenance (6–12%)"
    scope: core
    std: ["ncsbn-nclex-rn:HPM"]
    ideas: [CUES]
    topics:
      - n: 1
        title: "Developmental stages and transitions"
        los:
          - { id: A, do: "Name Erikson's stage for an age and use it in care.", ek: ["Trust, autonomy, initiative, industry, identity, intimacy, generativity, integrity."], p: [P4], drills: [nr-erikson] }
          - { id: B, do: "Recall the main infant growth and motor milestones.", ek: ["Weight doubles by 5–6 months, triples by 1 year; walks about 12–15 months."], p: [P4], drills: [nr-milestones] }
      - n: 2
        title: "Antepartum, intrapartum, postpartum and newborn care"
        los:
          - { id: A, do: "Score a newborn's APGAR from the five signs.", ek: ["Heart rate, respirations, tone, reflex irritability, color: 0–2 each."], p: [P1, P3], drills: [nr-apgar] }
          - { id: B, do: "Write a pregnancy history as GTPAL.", ek: ["Twins are one pregnancy and one birth but two living children."], p: [P1], drills: [nr-gtpal] }
          - { id: C, do: "Interpret fundal height in pregnancy and after birth.", ek: ["Umbilicus at 20 weeks; after birth firm, midline, down about 1 cm a day."], p: [P3], drills: [nr-fundus] }
      - n: 3
        title: "Techniques of physical assessment"
        los:
          - { id: A, do: "Compute and classify body mass index.", ek: ["kg/m²; 18.5–24.9 normal."], p: [P1], drills: [nr-bmi] }

  - id: psychosocial
    n: 4
    title: "Psychosocial Integrity (6–12%)"
    scope: core
    std: ["ncsbn-nclex-rn:PSY"]
    ideas: [CUES]
    topics:
      - n: 1
        title: "Therapeutic communication"
        los:
          - { id: A, do: "Choose the therapeutic response and recognise the non-therapeutic ones.", ek: ["Reflect and explore; avoid reassurance, why questions, advice and changing the subject."], p: [P4], drills: [nr-therapeutic-comm] }
      - n: 2
        title: "Coping mechanisms"
        los:
          - { id: A, do: "Name a defense mechanism from an example.", ek: ["Displacement, projection, denial, rationalization, regression, sublimation."], p: [P3], drills: [nr-defense] }

  - id: basic-care
    n: 5
    title: "Basic Care and Comfort (6–12%)"
    scope: core
    std: ["ncsbn-nclex-rn:BCC"]
    ideas: [SAFE, CALC]
    topics:
      - n: 1
        title: "Nutrition and oral hydration"
        los:
          - { id: A, do: "Match a diet rule to a condition or a drug.", ek: ["Gluten-free in celiac disease; no tyramine with MAOIs; steady vitamin K with warfarin; steady sodium with lithium."], p: [P4], drills: [nr-diet] }
          - { id: B, do: "Total intake in mL from household measures.", ek: ["1 oz = 30 mL."], p: [P1], drills: [nr-io-total] }
      - n: 2
        title: "Mobility and positioning"
        los:
          - { id: A, do: "Position a client for a condition or procedure and say why.", ek: ["ICP: head up 30°, midline. Liver biopsy: right side. Air embolism: left side, head down."], p: [P4], drills: [nr-positioning] }

  - id: pharm
    n: 6
    title: "Pharmacological and Parenteral Therapies (13–19%)"
    scope: core
    std: ["ncsbn-nclex-rn:PPT"]
    ideas: [CALC, SAFE]
    topics:
      - n: 1
        title: "Dosage calculation"
        los:
          - { id: A, do: "Calculate tablets or mL for an ordered dose.", ek: ["Desired over have, times the vehicle."], p: [P1], drills: [nr-tablets, nr-liquid] }
          - { id: B, do: "Calculate weight-based doses, divided daily doses, and check an order against a safe range.", ek: ["Pounds ÷ 2.2; mg/kg/day ÷ doses a day; compare the daily total with the range."], p: [P1, P3], drills: [nr-lb-kg, nr-weight-dose, nr-daily-divided, nr-safe-range] }
          - { id: C, do: "Draw up a reconstituted medication from its label concentration.", ek: ["Use the mg/mL after mixing, not the diluent volume."], p: [P1], drills: [nr-reconstitute] }
      - n: 2
        title: "Parenteral and intravenous therapies"
        los:
          - { id: A, do: "Calculate pump rates, gravity drip rates and infusion times.", ek: ["mL/h = volume ÷ hours; gtt/min = mL × drop factor ÷ minutes."], p: [P1], drills: [nr-iv-mlh, nr-gtt, nr-infusion-time] }
          - { id: B, do: "Calculate titrated infusions in units/h and mcg/kg/min, both ways.", ek: ["Find the concentration first, then dose ÷ concentration."], p: [P1], drills: [nr-heparin-rate, nr-heparin-units, nr-mcg-kg-min, nr-insulin-drip] }
          - { id: C, do: "Recognise IV complications and the first action for each.", ek: ["Infiltration cool and pale; phlebitis warm and red; overload crackles and JVD; air embolism sudden dyspnea."], p: [P3], drills: [nr-iv-complication] }
      - n: 3
        title: "Blood and blood products"
        los:
          - { id: A, do: "Decide ABO and Rh red-cell compatibility.", ek: ["O− is the universal red-cell donor, AB+ the universal recipient."], p: [P3], drills: [nr-abo] }
          - { id: B, do: "Apply transfusion safety rules and respond to a reaction.", ek: ["Normal saline only; first 15 minutes; finish within 4 hours; stop it at any reaction."], p: [P4], drills: [nr-transfusion] }
      - n: 4
        title: "Expected actions, adverse effects and interactions"
        los:
          - { id: A, do: "Name a drug's class from its suffix.", ek: ["-olol, -pril, -sartan, -statin, -prazole, -dipine…"], p: [P4], drills: [nr-drug-suffix] }
          - { id: B, do: "Name the antidote for a drug toxicity.", ek: ["Naloxone, flumazenil, protamine, vitamin K, acetylcysteine, digoxin immune fab."], p: [P4], drills: [nr-antidote] }
          - { id: C, do: "Apply the timing and mixing rules for insulins.", ek: ["Regular is the IV insulin; glargine has no peak and is never mixed; clear before cloudy."], p: [P4], drills: [nr-insulin] }
          - { id: D, do: "Recall therapeutic drug levels and hold parameters.", ek: ["Digoxin 0.5–2.0 ng/mL, hold below 60 apical; lithium 0.6–1.2; INR 2–3."], p: [P4, P3], drills: [nr-hold-levels] }

  - id: risk-reduction
    n: 7
    title: "Reduction of Risk Potential (9–15%)"
    scope: core
    std: ["ncsbn-nclex-rn:RRP"]
    ideas: [CUES]
    topics:
      - n: 1
        title: "Laboratory values"
        los:
          - { id: A, do: "Recall the usual adult ranges for electrolytes, blood counts, renal tests and ABGs.", ek: ["K 3.5–5.0, Na 135–145, Ca 9.0–10.5, Mg 1.3–2.1; pH 7.35–7.45, PaCO₂ 35–45, HCO₃⁻ 22–26."], p: [P4], drills: [nr-lab-range] }
          - { id: B, do: "Flag a value as low, normal or high.", ek: ["Compare with the range; act on potassium first."], p: [P3], drills: [nr-lab-flag] }
          - { id: C, do: "Interpret an arterial blood gas: primary disorder and compensation.", ek: ["Side from pH, cause from whichever value matches it, compensation from the other."], p: [P3], drills: [nr-abg, nr-abg-compensation] }
      - n: 2
        title: "Vital signs and system-specific assessments"
        los:
          - { id: A, do: "Compute mean arterial pressure.", ek: ["(S + 2D)/3; below about 65 is poor perfusion."], p: [P1], drills: [nr-map] }
          - { id: B, do: "Score the Glasgow Coma Scale.", ek: ["Eyes 4, verbal 5, motor 6; 8 or less, protect the airway."], p: [P1, P3], drills: [nr-gcs] }
          - { id: C, do: "Link ECG and neuromuscular signs to potassium and calcium imbalances.", ek: ["Peaked T: high K. U waves: low K. Chvostek and Trousseau: low Ca."], p: [P3], drills: [nr-electrolyte-signs] }

  - id: physiological
    n: 8
    title: "Physiological Adaptation (11–17%)"
    scope: core
    std: ["ncsbn-nclex-rn:PA"]
    ideas: [CALC, SAFE]
    topics:
      - n: 1
        title: "Fluid and electrolyte imbalances; hemodynamics"
        los:
          - { id: A, do: "Calculate pediatric maintenance fluids by the 4-2-1 rule.", ek: ["4 mL/h for the first 10 kg, 2 for the next 10, 1 for each kg after."], p: [P1], drills: [nr-maintenance-fluid] }
          - { id: B, do: "Estimate burned surface area and the Parkland fluid rate.", ek: ["Rule of nines; 4 mL × kg × %TBSA, half in the first 8 hours."], p: [P1], drills: [nr-rule-nines, nr-parkland] }
      - n: 2
        title: "Illness management and medical emergencies"
        los:
          - { id: A, do: "Manage a chest drainage system and respond to its problems.", ek: ["Continuous bubbling in the water seal is an air leak; tidaling is expected."], p: [P3, P4], drills: [nr-chest-tube] }
          - { id: B, do: "Choose oxygen devices and targets.", ek: ["Cannula 1–6 L/min; Venturi for a set FiO₂; non-rebreather for the highest; 88–92% in CO₂ retainers."], p: [P4], drills: [nr-oxygen] }

          - { id: B, do: "Find the activation free energy from a measured rate constant.", ek: ["ΔG‡ = −RT ln(kh/k_BT)."], p: [P5], drills: [sm-rate-dg, td-dh-ds-split] }
          - { id: C, do: "Relate forward and reverse rate constants to K by detailed balance and read rates off a free-energy profile along a reaction coordinate.", ek: ["k_f/k_r = K; barrier height on F(ξ) sets k; catalysts lower ΔG‡, not ΔG°."], p: [P6], drills: ["td-detailed-balance", td-reverse-rate], needs: [TD-10.1.A] }


          - { id: B, do: "Find a rate constant at a new temperature from E_a.", ek: ["k₂ = k₁ exp[−(E_a/R)(1/T₂ − 1/T₁)]."], p: [P5], drills: [sm-rate-k2, td-temperature-for-rate] }
          - { id: C, do: "Calculate the factor by which a rate rises over a temperature interval.", ek: ["k₂/k₁ = exp[(E_a/R)(1/T₁ − 1/T₂)]; the 'doubles per 10 K' rule ↔ E_a ≈ 50 kJ/mol near 300 K."], p: [P5, P6], drills: [sm-rate-factor, td-ea-from-factor] }

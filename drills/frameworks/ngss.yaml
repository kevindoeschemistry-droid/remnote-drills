# NGSS High School — curriculum framework (draft 1)
#
# Basis: the Next Generation Science Standards, high-school performance expectations (ngss-hs, read in part:
# the PE statements were read; the evidence statements and clarification boxes were not). One objective per
# performance expectation, in the standards' own order and grouped by disciplinary core idea.
#
# Most PEs are taught in the subject frameworks (Chemistry, Physics, Biology, Earth and Space). Here each
# PE's drills are a short mix chosen from the subject objectives that cite it, and `needs` links those
# objectives, so the NGSS view and the subject view share templates. The fifteen PEs no subject framework
# reached (mostly engineering design) have their own items in `ng-ngss.yaml`. NGSS asks students to design,
# model and argue; a drill can only carry the calculation or judgement inside each practice.
id: ngss
title: NGSS High School Science
code: NG
draft: 1
track: science
requires: [chemistry, physics, biology, earth-space, nuclear, dat]
level: 4
domains: [ngss]

basis:
  primary: ngss-hs
  note: "One objective per high-school performance expectation. The PE statements were read; the evidence statements were not. Drills for PEs taught elsewhere are drawn from the subject frameworks; the engineering and design PEs have their own items."

big_ideas:
  - id: PE
    title: Performance expectations are practices applied to core ideas
    text: Each PE pairs a science or engineering practice with a disciplinary core idea and a crosscutting concept. A drill isolates the reasoning step; the full practice (designing, investigating, arguing) happens away from the card.

practices:
  - id: P1
    title: Use mathematics and computational thinking
    text: Carry a model to a number and judge it.
  - id: P2
    title: Design and evaluate solutions
    text: Apply criteria, constraints and trade-offs to a design choice.


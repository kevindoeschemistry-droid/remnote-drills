# AI Basics — curriculum framework (draft 1, for Kevin's markup)
#
# Basis:
#   harper-carroll-academy  Harper Carroll's free Academy course: ten modules, 90 short videos.
#                           Only the module titles could be read (the lesson list sits behind
#                           sign-up), so units follow her modules one for one and every objective
#                           cites its module, but the objectives themselves are ours.
#
# The aim is AI literacy with the numbers left in: what a neuron computes, how softmax and
# temperature shape the next token, what a parameter count means in gigabytes. Arithmetic is
# recomputed by sympy; facts and judgements are authored. It sits before the AI Safety framework
# and alongside Computer Science's machine-learning unit.
id: ai-basics
title: AI Basics
code: AB
draft: 1
track: computing
requires: []
level: 1
domains: []

basis:
  primary: harper-carroll-academy
  note: "Units follow the ten modules of Harper Carroll's free Academy course. Only her module titles were readable, so the objectives under them are a house list."

big_ideas:
  - id: MATH
    title: AI turns the world into numbers
    text: Images, words and sounds become vectors; a model is a function on those numbers with learned parameters.
  - id: LEARN
    title: Models learn by shrinking a loss
    text: Training adjusts parameters to reduce error on data, and a model is judged on data it has not seen.
  - id: TOOL
    title: A model is a tool with known limits
    text: It predicts likely text, knows only its training and its context, and is made useful and safe by grounding, tools and checking.

practices:
  - id: P1
    title: Compute
    text: Carry a small AI calculation (a neuron, softmax, a parameter count, a cost) to a number.
  - id: P2
    title: Explain
    text: Name the concept or mechanism behind what a system does.
  - id: P3
    title: Judge
    text: Choose a model, a prompt fix or a safe response for a situation.

units:
  - id: welcome
    n: 1
    title: "What AI is"
    scope: core
    ideas: [MATH]
    topics:
      - n: 1
        title: "AI, machine learning, deep learning, generative AI"
        los:
          - { id: A, std: ["harper-carroll-academy:1"], do: "Place a system in the nested fields AI ⊃ machine learning ⊃ deep learning ⊃ generative AI.", ek: ["ML learns from data; deep learning uses many-layer networks; generative AI produces new content."], p: [P2], drills: [ab-ai-ml-dl] }
  - id: as-math
    n: 2
    title: "The world as numbers"
    scope: core
    ideas: [MATH]
    topics:
      - n: 1
        title: "Encoding and vectors"
        los:
          - { id: A, std: ["harper-carroll-academy:2"], do: "Say how images, text, audio and categories are encoded, and count the numbers in an image.", ek: ["Pixels × 3 channels; tokens → embeddings; one-hot for categories."], p: [P1, P2], drills: [ab-represent, ab-pixels] }
          - { id: B, std: ["harper-carroll-academy:2"], do: "Compute a dot product and a cosine similarity between vectors.", ek: ["Cosine = dot ÷ (lengths); 1 same direction, 0 unrelated."], p: [P1], drills: [ab-dot, ab-cosine] }
  - id: networks
    n: 3
    title: "Neural networks"
    scope: core
    ideas: [MATH]
    topics:
      - n: 1
        title: "Neurons and layers"
        los:
          - { id: B, std: ["harper-carroll-academy:3"], do: "Name the parts of a network and say why activations must be nonlinear.", ek: ["Parameters, forward pass, backpropagation; stacked linear layers collapse to one."], p: [P2], drills: [ab-activation, ab-network-parts] }
          - { id: A, std: ["harper-carroll-academy:3"], do: "Compute a neuron's output with ReLU or sigmoid.", ek: ["Weighted sum plus bias, then the activation."], p: [P1], drills: [ab-neuron, ab-sigmoid] }
          - { id: C, std: ["harper-carroll-academy:3"], do: "Count the parameters of a fully connected layer or small network.", ek: ["Each neuron: one weight per input plus a bias."], p: [P1], drills: [ab-params-layer, ab-params-net] }
  - id: llms
    n: 4
    title: "Language models"
    scope: core
    ideas: [MATH, TOOL]
    topics:
      - n: 1
        title: "Key terms and generation"
        los:
          - { id: A, std: ["harper-carroll-academy:4"], do: "Define token, context window, embedding, inference, attention, temperature and hallucination, and order the steps of generating text.", ek: ["Generation is repeated next-token prediction."], p: [P2], drills: [ab-llm-term, ab-next-token] }
          - { id: B, std: ["harper-carroll-academy:4"], do: "Estimate token counts and how much text fits in a context window.", ek: ["About 0.75 English words per token."], p: [P1], drills: [ab-tokens, ab-context-pages] }
          - { id: C, std: ["harper-carroll-academy:4"], do: "Compute next-token probabilities with softmax, with and without temperature.", ek: ["Low temperature sharpens, high flattens."], p: [P1], drills: [ab-softmax, ab-temperature] }
          - { id: D, std: ["harper-carroll-academy:4"], do: "Convert a parameter count and precision to the memory the weights need.", ek: ["16-bit = 2 bytes per parameter; a billion bytes ≈ 1 GB."], p: [P1], drills: [ab-weight-memory] }
  - id: training
    n: 5
    title: "Training"
    scope: core
    ideas: [LEARN]
    topics:
      - n: 1
        title: "How models learn"
        los:
          - { id: A, std: ["harper-carroll-academy:5"], do: "Classify a task as supervised, unsupervised, reinforcement or self-supervised learning, and name the stages of building a chat assistant.", ek: ["Pretraining, fine-tuning, feedback-based RL, then inference."], p: [P2], drills: [ab-learning-type, ab-train-stage] }
          - { id: B, std: ["harper-carroll-academy:5"], do: "Take a gradient-descent step, compute a mean squared error and count training updates.", ek: ["w ← w − learning rate × gradient."], p: [P1], drills: [ab-gd-step, ab-mse, ab-steps] }
          - { id: C, std: ["harper-carroll-academy:5"], do: "Diagnose overfitting and underfitting, name the data splits, and compute precision and recall.", ek: ["Judge on unseen data; precision is of what was flagged, recall of what was there."], p: [P1, P2], drills: [ab-fit, ab-data-split, ab-precision, ab-recall] }
  - id: wisely
    n: 6
    title: "Using AI wisely"
    scope: core
    ideas: [TOOL]
    topics:
      - n: 1
        title: "Limits, trust and prompts"
        los:
          - { id: A, std: ["harper-carroll-academy:6"], do: "Explain hallucination, say what a model can know, and decide what to verify.", ek: ["Training data up to a cutoff, plus the context window; nothing else."], p: [P2, P3], drills: [ab-hallucination, ab-what-model-knows] }
          - { id: B, std: ["harper-carroll-academy:6"], do: "Choose the prompt change that fixes a given problem with an answer.", ek: ["Context, format, examples, steps."], p: [P3], drills: [ab-prompt-fix] }
  - id: agents
    n: 7
    title: "AI and tools"
    scope: core
    ideas: [TOOL]
    topics:
      - n: 1
        title: "Agents and retrieval"
        los:
          - { id: A, std: ["harper-carroll-academy:7"], do: "Name the parts of an agent and the steps of its loop and of retrieval-augmented generation.", ek: ["Model + tools + memory + loop; embed, retrieve, answer from context."], p: [P2], drills: [ab-agent-part, ab-agent-loop, ab-rag-step] }
  - id: toolbox
    n: 8
    title: "The toolbox"
    scope: core
    ideas: [TOOL]
    topics:
      - n: 1
        title: "Choosing and costing a model"
        los:
          - { id: A, std: ["harper-carroll-academy:8"], do: "Choose a kind of model for a job and work out what an API job costs.", ek: ["Input and output tokens are priced separately."], p: [P1, P3], drills: [ab-model-choice, ab-api-cost] }
  - id: safety
    n: 9
    title: "Staying safe"
    scope: core
    ideas: [TOOL]
    topics:
      - n: 1
        title: "Scams, deepfakes and privacy"
        los:
          - { id: A, std: ["harper-carroll-academy:9"], do: "Respond safely to a voice-clone, deepfake or phishing attempt, check where media came from, and decide what not to share with a chatbot.", ek: ["Verify through a channel you already trust; provenance beats detectors."], p: [P3], drills: [ab-scam-defense, ab-deepfake-check, ab-privacy] }
  - id: big-questions
    n: 10
    title: "Big questions"
    scope: core
    ideas: [LEARN]
    topics:
      - n: 1
        title: "Scaling and alignment"
        los:
          - { id: A, std: ["harper-carroll-academy:10"], do: "Define scaling laws, alignment, AGI and foundation models, and estimate training compute and compute-optimal data.", ek: ["Compute ≈ 6 × parameters × tokens; about 20 tokens per parameter."], p: [P1, P2], drills: [ab-big-ideas, ab-train-compute, ab-chinchilla] }

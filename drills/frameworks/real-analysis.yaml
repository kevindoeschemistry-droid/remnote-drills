# Real Analysis — curriculum framework (draft 1, for Kevin's markup)
#
# The same objects as Calculus, asked the other way round: not 'what is the limit' but 'how far out must n be',
# not 'find the maximum' but 'which hypothesis guarantees one'. A card cannot grade a proof, so each theorem is
# drilled as the N or delta it produces and as the example that breaks it when a hypothesis is dropped.
id: real-analysis
title: Real Analysis
code: RA
draft: 1
track: math
requires: [calculus, discrete-mathematics]
level: 4
domains: [ra]

basis:
  primary: cambridge-ia-analysis-i
  also: [cambridge-ia-numbers-sets, cambridge-ib-analysis-ii]
  note: "Anchored on the Cambridge Analysis I schedule (read through an extraction). Uniform convergence, metric spaces and the multivariable theory (Cambridge Analysis II) are not built; Topology takes up compactness and connectedness."

big_ideas:
  - id: EPS
    title: "A limit is a promise about every epsilon"
    text: "Convergence means a challenge ε can always be met; the proof is the rule that produces N or δ from ε."
  - id: HYP
    title: "Every hypothesis is there for a reason"
    text: "Closed, bounded, continuous, monotone: drop one and a standard counterexample appears. Knowing the counterexample is knowing the theorem."

practices:
  - id: P1
    title: Compute
    text: "Carry the definition or theorem to a number, a count or an example."
  - id: P2
    title: Decide
    text: "Say whether a statement holds, which hypothesis fails, or which example breaks it."

units:
  - id: reals
    n: 1
    title: "The real numbers"
    std: ["cambridge-ia-numbers-sets:N5", "cambridge-ia-analysis-i:A1"]
    scope: core
    ideas: [HYP]
    topics:
      - n: 1
        title: "Completeness"
        los:
          - { id: A, std: ["cambridge-ia-numbers-sets:N5"], do: "Find the supremum and infimum of a set and say whether they are attained.", ek: ["The supremum is the least upper bound. Every non-empty set of reals that is bounded above has one, which need not belong to the set; the rationals lack this property."], p: [P1], needs: [RA-1.2.B], drills: [ra-supremum, ra-sup-attained] }
          - { id: B, std: ["cambridge-ia-numbers-sets:N5", "cambridge-ia-analysis-i:A1"], do: "Use the Archimedean property and say where the rationals fail to be complete.", ek: ["For any real ε > 0 there is a natural number n with 1/n < ε. The rationals are dense but not complete: {x : x² < 2} has no rational least upper bound."], p: [P1], needs: [RA-1.1.A], drills: [ra-archimedean, ra-completeness-facts] }
      - n: 2
        title: "Inequalities and bounds"
        los:
          - { id: A, std: ["cambridge-ia-numbers-sets:N5"], do: "Turn an absolute-value inequality into an interval and use the triangle inequality.", ek: ["|x − a| < r means a − r < x < a + r. The triangle inequality |x + y| ≤ |x| + |y| and its reverse ||x| − |y|| ≤ |x − y| are the two tools nearly every estimate in analysis uses."], p: [P1], drills: [ra-abs-interval, ra-triangle-inequality] }
          - { id: B, std: ["cambridge-ia-numbers-sets:N5"], do: "Find upper and lower bounds of a set and say whether it is bounded.", ek: ["An upper bound is any number at least as large as every element; the infimum is the greatest lower bound. A set is bounded when it has both kinds."], p: [P1], needs: [RA-1.2.A], drills: [ra-infimum, ra-bounded-how] }
          - { id: C, std: ["cambridge-ia-numbers-sets:N5"], do: "Use the AM-GM and Bernoulli inequalities to bound an expression.", ek: ["For positive numbers the arithmetic mean is at least the geometric mean, with equality only when they are equal; so x + k/x ≥ 2√k. Bernoulli: (1 + x)ⁿ ≥ 1 + nx for x ≥ −1."], p: [P1], needs: [RA-1.2.A], drills: [ra-am-gm-minimum, ra-inequality-facts] }
  - id: sequences
    n: 2
    title: "Sequences"
    std: ["cambridge-ia-analysis-i:A1"]
    scope: core
    ideas: [EPS]
    topics:
      - n: 1
        title: "Convergence"
        los:
          - { id: A, std: ["cambridge-ia-analysis-i:A1"], do: "Produce the N that the definition of a limit asks for.", ek: ["a_n → L means: for every ε > 0 there is an N with |a_n − L| < ε for all n ≥ N. Solving the inequality for n gives N as a function of ε."], p: [P1], needs: [RA-2.2.A, RA-1.1.B, DM-1.1.B], drills: [ra-epsilon-n, ra-limit-value] }
          - { id: B, std: ["cambridge-ia-analysis-i:A1"], do: "Find the limit of a bounded monotone recursive sequence and know what guarantees it exists.", ek: ["A bounded monotone sequence converges. Once the limit is known to exist, it must satisfy the recurrence as a fixed-point equation. Bolzano-Weierstrass: every bounded sequence has a convergent subsequence."], p: [P1], needs: [RA-2.2.B, RA-1.1.A], drills: [ra-recursive-limit, ra-sequence-theorems] }
          - { id: C, std: ["cambridge-ia-analysis-i:A1"], do: "Find the limit superior and limit inferior of a bounded sequence.", ek: ["lim sup is the largest limit of any subsequence and lim inf the smallest. The sequence converges exactly when the two agree."], p: [P1], needs: [RA-2.2.B], drills: [ra-limsup, ra-limsup-facts] }
      - n: 2
        title: "Limits by the rules"
        los:
          - { id: A, std: ["cambridge-ia-analysis-i:A1"], do: "Find a limit with the algebra of limits and the squeeze rule.", ek: ["Limits respect sums, products and quotients (non-zero denominator). If a_n ≤ b_n ≤ c_n and the outer two share a limit, so does b_n: bounded × null is null."], p: [P1], needs: [RA-1.2.A, CA-1.2.A], drills: [ra-squeeze-limit, ra-limit-algebra-facts] }
          - { id: C, std: ["cambridge-ia-analysis-i:A1"], do: "Rank the growth of standard sequences.", ek: ["For large n: logarithms ≪ powers of n ≪ exponentials cⁿ (c > 1) ≪ n! ≪ nⁿ. The ratio of a slower to a faster one tends to 0."], p: [P1], needs: [RA-2.2.A], drills: [ra-growth-ratio, ra-growth-order] }
          - { id: B, std: ["cambridge-ia-analysis-i:A1"], do: "Use subsequences to show a sequence diverges and count its subsequential limits.", ek: ["Every subsequence of a convergent sequence has the same limit, so two subsequences with different limits prove divergence."], p: [P1], needs: [RA-2.1.A], drills: [ra-subsequential-limits, ra-converge-or-diverge] }
          - { id: D, std: ["cambridge-ia-analysis-i:A1"], do: "Test a sequence against the Cauchy criterion.", ek: ["A sequence is Cauchy when |a_m − a_n| can be made small for all large m and n together, not just neighbours. The harmonic sums fail: s_2n − s_n ≥ 1/2 for every n."], p: [P1], needs: [RA-2.1.B], drills: [ra-harmonic-block, ra-cauchy-facts] }
  - id: series
    n: 3
    title: "Series"
    std: ["cambridge-ia-analysis-i:A1", "cambridge-ia-analysis-i:A4"]
    scope: core
    ideas: [EPS, HYP]
    topics:
      - n: 1
        title: "Convergence of series"
        los:
          - { id: A, std: ["cambridge-ia-analysis-i:A1"], do: "Classify a series as absolutely convergent, conditionally convergent or divergent.", ek: ["Absolute convergence implies convergence. The alternating series test gives convergence for decreasing terms tending to 0; Σ 1/n^p converges exactly when p > 1."], p: [P2], needs: [RA-3.2.B, RA-3.2.D], drills: [ra-series-classify, ra-ratio-test] }
          - { id: B, std: ["cambridge-ia-analysis-i:A1"], do: "Sum a geometric or telescoping series exactly.", ek: ["Σ r^n from n = 0 is 1/(1 − r) for |r| < 1. A telescoping series is summed from its partial sums, which collapse to the first and last terms."], p: [P1], needs: [RA-3.2.A], drills: [ra-telescoping, ra-geometric-from-k] }
          - { id: C, std: ["cambridge-ia-analysis-i:A4"], do: "Find the radius of convergence of a power series and test its endpoints.", ek: ["Σ a_n x^n converges absolutely for |x| < R and diverges for |x| > R, with 1/R = lim |a_(n+1)/a_n| when that exists. Behaviour at |x| = R must be tested separately."], p: [P1], needs: [RA-3.1.A], drills: [ra-radius, ra-endpoints] }
      - n: 2
        title: "Series from the ground up"
        los:
          - { id: A, std: ["cambridge-ia-analysis-i:A1"], do: "Compute partial sums and apply the nth-term test.", ek: ["A series converges when its partial sums do. If the terms do not tend to 0 the series diverges; if they do, the test says nothing."], p: [P1], needs: [RA-2.2.A], drills: [ra-partial-sum, ra-nth-term-test] }
          - { id: B, std: ["cambridge-ia-analysis-i:A1"], do: "Decide convergence by comparison with a p-series.", ek: ["For positive terms, a series behaves like Σ 1/nᵖ when its terms are comparable to 1/nᵖ, and that converges exactly when p > 1. For a ratio of polynomials, p is the degree gap."], p: [P1], needs: [RA-3.2.A, RA-2.2.C], drills: [ra-comparison-degree, ra-p-threshold] }
          - { id: D, std: ["cambridge-ia-analysis-i:A1"], do: "Say what absolute convergence allows that conditional convergence does not.", ek: ["An absolutely convergent series can be rearranged freely with the same sum. A conditionally convergent one can be rearranged to converge to any number, or to diverge (Riemann)."], p: [P1], needs: [RA-3.2.B], drills: [ra-rearrangement-facts, ra-absolute-check] }
          - { id: C, std: ["cambridge-ia-analysis-i:A1"], do: "Bound the error of an alternating series and of a p-series tail.", ek: ["For an alternating series with terms decreasing to 0, the error after n terms is at most the next term. For Σ 1/kᵖ the tail after n terms is at most ∫ₙ^∞ x⁻ᵖ dx = 1/((p − 1)nᵖ⁻¹)."], p: [P1], needs: [RA-3.2.B], drills: [ra-alternating-terms, ra-integral-tail] }
  - id: continuity
    n: 4
    title: "Continuity"
    std: ["cambridge-ia-analysis-i:A2"]
    scope: core
    ideas: [EPS, HYP]
    topics:
      - n: 1
        title: "Continuous functions"
        los:
          - { id: A, std: ["cambridge-ia-analysis-i:A2"], do: "Produce the δ that the definition of continuity asks for.", ek: ["f is continuous at a when for every ε > 0 there is a δ > 0 with |f(x) − f(a)| < ε whenever |x − a| < δ. For a linear f, δ = ε/|slope|; for x², restrict to δ ≤ 1 and bound the other factor."], p: [P1], needs: [RA-4.2.B, RA-2.1.A], drills: [ra-delta-linear, ra-delta-square] }
          - { id: B, std: ["cambridge-ia-analysis-i:A2"], do: "Apply the intermediate and extreme value theorems and say which hypothesis each needs.", ek: ["A continuous function on a closed bounded interval takes every value between its end values, is bounded, and attains its bounds. Each conclusion fails on an open or unbounded interval, or for a discontinuous function."], p: [P2], needs: [RA-4.2.C, RA-4.1.A], drills: [ra-bisection-steps, ra-ivt-evt-facts] }
          - { id: C, std: ["cambridge-ia-analysis-i:A2"], do: "Decide whether a function is uniformly continuous and find a Lipschitz constant.", ek: ["Uniform continuity means one δ works at every point. A continuous function on a closed bounded interval is uniformly continuous; a bounded derivative gives a Lipschitz constant sup|f′|, hence uniform continuity."], p: [P2], needs: [RA-4.1.B], drills: [ra-uniformly-continuous, ra-lipschitz] }
      - n: 2
        title: "Limits of functions"
        los:
          - { id: A, std: ["cambridge-ia-analysis-i:A2"], do: "Find one-sided limits and classify a discontinuity.", ek: ["A limit exists when both one-sided limits exist and agree. Agree but differ from the value: removable. Exist but differ: jump. One fails to exist as a finite number: essential."], p: [P1], needs: [RA-2.2.A], drills: [ra-discontinuity-type, ra-removable-value] }
          - { id: B, std: ["cambridge-ia-analysis-i:A2"], do: "Evaluate standard limits of functions and use sequences to show a limit fails.", ek: ["sin x / x → 1, (1 − cos x)/x² → 1/2 and (eˣ − 1)/x → 1 as x → 0. f(x) → L exactly when f(x_n) → L for every sequence x_n → a; two sequences with different outcomes show there is no limit."], p: [P1], needs: [RA-4.2.A, RA-2.2.B], drills: [ra-standard-function-limit, ra-sequential-criterion] }
          - { id: C, std: ["cambridge-ia-analysis-i:A2"], do: "Locate the points where a function is continuous.", ek: ["Sums, products, quotients (non-zero denominator) and compositions of continuous functions are continuous. Step functions jump at their break points; a function can even be continuous at exactly one point."], p: [P1], needs: [RA-4.2.A], drills: [ra-floor-jumps, ra-where-continuous] }
  - id: calculus
    n: 5
    title: "Differentiation and integration"
    std: ["cambridge-ia-analysis-i:A3", "cambridge-ia-analysis-i:A5"]
    scope: core
    ideas: [HYP, EPS]
    topics:
      - n: 1
        title: "The theorems behind calculus"
        los:
          - { id: A, std: ["cambridge-ia-analysis-i:A3"], do: "Find the point the mean value theorem promises and say what Rolle's theorem needs.", ek: ["If f is continuous on [a, b] and differentiable inside, some c has f′(c) = (f(b) − f(a))/(b − a). Rolle is the case f(a) = f(b)."], p: [P1], needs: [RA-5.2.A, RA-4.1.B], drills: [ra-mvt-point, ra-mvt-facts] }
          - { id: B, std: ["cambridge-ia-analysis-i:A3"], do: "Bound a Taylor remainder with Lagrange's form.", ek: ["f(x) = Taylor polynomial of degree n + R_n, with R_n = f⁽ⁿ⁺¹⁾(c) x^(n+1)/(n + 1)! for some c between 0 and x. For e^x at x = 1, |R_n| < 3/(n + 1)!."], p: [P1], needs: [RA-5.2.B, RA-3.1.C], drills: [ra-taylor-degree, ra-taylor-bound] }
          - { id: C, std: ["cambridge-ia-analysis-i:A5"], do: "Compute upper and lower Riemann sums and say which functions are integrable.", ek: ["For an increasing f on n equal pieces, the upper sum uses right endpoints and the lower sum left endpoints, and U − L = (f(b) − f(a))(b − a)/n → 0. Monotone and continuous functions are integrable; the indicator of the rationals is not."], p: [P1], needs: [RA-5.1.A, RA-2.1.A], drills: [ra-upper-sum, ra-upper-minus-lower] }
          - { id: D, std: ["cambridge-ia-analysis-i:A5"], do: "Decide whether an improper integral converges and evaluate it.", ek: ["∫₁^∞ x^(−p) dx converges exactly when p > 1, to 1/(p − 1); ∫₀¹ x^(−p) dx converges exactly when p < 1, to 1/(1 − p). Comparison with these settles most cases."], p: [P1], needs: [RA-5.1.C, RA-3.2.C], drills: [ra-improper-value, ra-improper-converges] }
      - n: 2
        title: "The derivative from its definition"
        los:
          - { id: A, std: ["cambridge-ia-analysis-i:A3"], do: "Compute a derivative from the difference quotient and decide differentiability at a point.", ek: ["f′(a) = lim (f(a + h) − f(a))/h. Differentiable implies continuous but not conversely: |x| has a corner and ∛x a vertical tangent at 0."], p: [P1], needs: [RA-4.2.B], drills: [ra-difference-quotient, ra-differentiable-at-zero] }
          - { id: B, std: ["cambridge-ia-analysis-i:A3"], do: "Evaluate an indeterminate limit by L'Hôpital's rule or a Taylor expansion.", ek: ["For 0/0 or ∞/∞ forms, lim f/g = lim f′/g′ when the latter exists. Expanding numerator and denominator to the first non-vanishing order gives the same answer and shows why."], p: [P1], needs: [RA-5.1.A], drills: [ra-lhopital, ra-lhopital-facts] }
          - { id: C, std: ["cambridge-ia-analysis-i:A3"], do: "Differentiate an inverse function.", ek: ["If f is differentiable with f′(a) ≠ 0 and b = f(a), then (f⁻¹)′(b) = 1/f′(a): the graph is reflected in the diagonal, so slopes are reciprocated."], p: [P1], needs: [RA-5.2.A], drills: [ra-inverse-derivative, ra-inverse-derivative-exp] }
  - id: metric
    n: 6
    title: "Uniform convergence and metric spaces"
    std: ["cambridge-ib-analysis-ii:U", "cambridge-ib-analysis-ii:M", "cambridge-ib-analysis-ii:D", "cambridge-ib-analysis-ii:C"]
    scope: extension
    ideas: [EPS, HYP]
    topics:
      - n: 1
        title: "Uniform convergence"
        los:
          - { id: A, std: ["cambridge-ib-analysis-ii:U"], do: "Measure how far a sequence of functions is from its limit in the uniform norm and decide whether convergence is uniform.", ek: ["f_n → f uniformly when sup |f_n − f| → 0. Pointwise convergence lets the worst point move with n; uniform convergence does not. A uniform limit of continuous functions is continuous."], p: [P1], needs: [RA-4.1.C, RA-1.1.A], drills: [ra-sup-norm, ra-uniform-or-pointwise] }
          - { id: B, std: ["cambridge-ib-analysis-ii:U"], do: "Apply the Weierstrass M-test and say what uniform convergence lets you exchange.", ek: ["If |f_n(x)| ≤ M_n for all x and Σ M_n converges, then Σ f_n converges uniformly. Uniform convergence allows a limit to pass through an integral, and through a derivative when the derivatives converge uniformly."], p: [P1], needs: [RA-6.1.A, RA-3.1.A], drills: [ra-m-test-bound, ra-exchange-facts] }
      - n: 2
        title: "Metric spaces, completeness and contractions"
        los:
          - { id: A, std: ["cambridge-ib-analysis-ii:M"], do: "Compute distances in the standard norms on Rⁿ and compare the norms.", ek: ["‖x‖₁ = Σ|x_i|, ‖x‖₂ = √Σx_i², ‖x‖∞ = max|x_i|, with ‖x‖∞ ≤ ‖x‖₂ ≤ ‖x‖₁ ≤ n‖x‖∞. All norms on a finite-dimensional space are Lipschitz equivalent, so they give the same open sets."], p: [P1], needs: [RA-1.2.A], drills: [ra-norm-distance, ra-norm-ratio] }
          - { id: B, std: ["cambridge-ib-analysis-ii:C"], do: "Decide whether a metric space is complete and say what completeness buys.", ek: ["A space is complete when every Cauchy sequence converges in it. Rⁿ and C[a, b] with the uniform norm are complete; the rationals and an open interval are not. A closed subset of a complete space is complete."], p: [P1], needs: [RA-6.2.A, RA-2.2.D], drills: [ra-complete-or-not, ra-completeness-uses] }
          - { id: C, std: ["cambridge-ib-analysis-ii:C"], do: "Apply the contraction mapping theorem: find the contraction constant and bound the error of the iteration.", ek: ["If d(f(x), f(y)) ≤ k d(x, y) with k < 1 on a complete space, f has exactly one fixed point, and the iterates satisfy d(x_n, x*) ≤ kⁿ d(x₁, x₀)/(1 − k). Picard's theorem for ODEs is this theorem in C[a, b]."], p: [P1], needs: [RA-6.2.B, RA-4.1.C], drills: [ra-contraction-steps, ra-contraction-constant] }
          - { id: D, std: ["cambridge-ib-analysis-ii:D"], do: "Classify a critical point of a function of two variables from its Hessian.", ek: ["At a critical point, a positive-definite Hessian is a local minimum, negative-definite a local maximum, indefinite a saddle; a zero determinant leaves the test undecided. Mixed partials agree when they are continuous."], p: [P1], needs: [RA-5.1.B], drills: [ra-hessian-det, ra-critical-classify] }

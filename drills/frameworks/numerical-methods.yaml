# Numerical Methods — curriculum framework (draft 1, for Kevin's markup)
#
# Basis, stated plainly: NCEES FE Chemical item 1.D "Numerical methods" (read in full, but a single line)
# and the WeBWorK OPL sections that name methods (Newton's method CA3.17, approximation CA5.13, numerical
# ODEs DE6; read in full). Neither lists the methods of a course, so the units and objectives are a house
# list on the part order of Chapra & Canale (from memory). Finite differences for PDEs live in Engineering
# Math unit 10.6 and least squares in Linear Algebra 6.1.B.
#
# Not here yet: LU pivoting and conditioning, splines, Newton for systems, multistep and implicit ODE
# methods beyond the stability limit, adaptive step size, optimisation.
id: numerical-methods
title: Numerical Methods
code: NM
draft: 1
track: engineering
requires: [calculus, linear-algebra]
level: 4
domains: [nm]

basis:
  primary: fe-chemical
  also: [webwork-opl]
  note: "FE Chemical names numerical methods as one item (1.D) and the WeBWorK OPL names a few methods; no published standard lists a numerical-methods course, so the objectives are a house list on Chapra & Canale's part order."

big_ideas:
  - id: ERR
    title: Every method has an error that scales
    text: A step size h, a number of panels or an iteration count sets the error as a power of h or a factor per step. Knowing the power is knowing how much refinement buys.
  - id: STAB
    title: Stable before accurate
    text: An iteration or a time step that amplifies errors is useless however accurate each step is. Check the contraction factor or the stability limit first.

practices:
  - id: P1
    title: Step by hand
    text: Carry one step or one iteration of a method to a number, the way you check code.
  - id: P2
    title: Judge convergence
    text: Decide whether and how fast a method converges from the problem's structure.

units:
  - id: roots
    n: 1
    title: "Roots of equations"
    scope: core
    std: ["fe-chemical:1.D", "webwork-opl:CA3.17"]
    ideas: [ERR, STAB]
    topics:
      - n: 1
        title: "Bracketing and open methods"
        los:
          - { id: A, std: ["fe-chemical:1.D"], do: "Count the bisection steps needed for a tolerance.", ek: ["n ≥ log₂(L/ε): about 3.3 steps per digit."], p: [P1], drills: [nm-bisection-steps, nm-bisection-error-bound] }
          - { id: B, std: ["webwork-opl:CA3.17"], do: "Take a Newton step.", ek: ["x₁ = x₀ − f(x₀)/f′(x₀); quadratic convergence near a simple root."], p: [P1], drills: [nm-newton-step, nm-newton-reciprocal] }
          - { id: C, std: ["fe-chemical:1.D"], do: "Take a secant step.", ek: ["The derivative is replaced by the slope through the last two points."], p: [P1], drills: [nm-secant-step, nm-false-position] }
          - { id: D, std: ["fe-chemical:1.D"], do: "Decide whether fixed-point iteration converges.", ek: ["Converges when |g′(r)| < 1."], p: [P2], drills: [nm-fixed-point, nm-fixed-point-iterations] }
  - id: linear
    n: 2
    title: "Iterative linear solvers"
    scope: core
    std: ["fe-chemical:1.E"]
    ideas: [ERR, STAB]
    topics:
      - n: 1
        title: "Jacobi and Gauss–Seidel"
        los:
          - { id: A, std: ["fe-chemical:1.E"], do: "Take a Jacobi step.", ek: ["Each unknown from its own equation, old values only."], p: [P1], drills: [nm-jacobi-step, nm-jacobi-spectral] }
          - { id: B, std: ["fe-chemical:1.E"], do: "Take a Gauss–Seidel sweep.", ek: ["Use each new value as soon as it is computed."], p: [P1], drills: [nm-gauss-seidel-step, nm-gauss-seidel-spectral] }
          - { id: C, std: ["fe-chemical:1.E"], do: "Test for strict diagonal dominance.", ek: ["|a_ii| > Σ|a_ij| on every row guarantees convergence."], p: [P2], drills: [nm-diagonal-dominance, nm-dominance-threshold] }
  - id: quadrature
    n: 3
    title: "Interpolation and numerical integration"
    scope: core
    std: ["fe-chemical:1.D", "webwork-opl:CA5.13"]
    ideas: [ERR, STAB]
    topics:
      - n: 1
        title: "Interpolation"
        los:
          - { id: A, std: ["fe-chemical:1.D"], do: "Evaluate the interpolating quadratic through three points.", ek: ["Lagrange form: Σ yᵢLᵢ(x)."], p: [P1], drills: [nm-lagrange-quadratic, nm-divided-difference] }
      - n: 2
        title: "Quadrature"
        los:
          - { id: A, std: ["webwork-opl:CA5.13"], do: "Apply Simpson's rule.", ek: ["(h/3)(f₀ + 4f₁ + f₂); exact for cubics."], p: [P1], drills: [nm-simpson, nm-simpson-error] }
          - { id: B, std: ["webwork-opl:CA5.13"], do: "Predict how the trapezoid error falls with refinement.", ek: ["Error ∝ h²; Simpson ∝ h⁴."], p: [P2], drills: [nm-trapezoid-scaling, nm-trapezoid-panels] }
          - { id: C, std: ["fe-chemical:1.D", "webwork-opl:CA5.13"], do: "Improve two trapezoid estimates by Richardson extrapolation.", ek: ["(4T(h/2) − T(h))/3."], p: [P1], drills: [nm-richardson, nm-richardson-cubic] }
          - { id: D, std: ["fe-chemical:1.D", "webwork-opl:CA5.13"], do: "Apply two-point Gauss–Legendre quadrature.", ek: ["Nodes ±1/√3, weights 1; exact for cubics."], p: [P1], drills: [nm-gauss-two-point, nm-gauss-three-point] }
  - id: ode
    n: 4
    title: "Ordinary differential equations"
    scope: core
    std: ["webwork-opl:DE6.1", "webwork-opl:DE6.2", "webwork-opl:DE6.3"]
    ideas: [ERR, STAB]
    topics:
      - n: 1
        title: "One-step methods"
        los:
          - { id: A, std: ["webwork-opl:DE6.2"], do: "Take a Heun (improved Euler) step.", ek: ["Predict with Euler, correct with the average slope."], p: [P1], drills: [nm-heun-step, nm-midpoint-step] }
          - { id: B, std: ["webwork-opl:DE6.2"], do: "Take a classical RK4 step.", ek: ["For y′ = λy the step multiplies by the Taylor series of e^(λh) through order 4."], p: [P1], drills: [nm-rk4-step, nm-rk4-stability] }
          - { id: C, std: ["webwork-opl:DE6.1"], do: "Find the explicit Euler stability limit.", ek: ["h ≤ 2/λ for y′ = −λy."], p: [P2], drills: [nm-euler-stability, nm-backward-euler] }
          - { id: D, std: ["webwork-opl:DE6.3"], do: "Take an Euler step for a system.", ek: ["y₁ = (I + hA)y₀."], p: [P1], drills: [nm-euler-system, nm-stiffness-ratio] }
  - id: differences
    n: 5
    title: "Numerical differentiation"
    scope: core
    std: ["fe-chemical:1.D"]
    ideas: [ERR, STAB]
    topics:
      - n: 1
        title: "Finite differences"
        los:
          - { id: A, std: ["fe-chemical:1.D"], do: "Find the error of a central-difference derivative.", ek: ["Error = (h²/6) f‴: second order."], p: [P1], drills: [nm-central-difference-error, nm-forward-difference-error] }

# Linear Algebra — curriculum framework (draft 2)
#
# Basis, stated plainly:
#   cupm-2015-la  the MAA CUPM 2015 guide's core topics for a first course (six groups), read through a
#                 summary of the print guide (read: part). Units 1-6 and 8 sit on its groups 1-6.
#   lay-5e        a textbook's chapter list, kept beside it as the order of the units.
#   lacsg-2       the LACSG 2.0 recommendations, wanted: not reached.
# Unit 7 (symmetric matrices, quadratic forms, SVD) is beyond the CUPM first course; the guide puts the
# spectral theorem and the SVD in its second course. Unit 8 (linear transformations) was added after the
# others, so its number does not follow Lay's order; objective codes are never renumbered.
#
# Not here yet: Cramer's rule, abstract inner-product spaces, Jordan form, numerical methods.
id: linear-algebra
title: Linear Algebra
code: LA
draft: 2
track: math
requires: [math-hs]
level: 3
domains: [la]

basis:
  primary: cupm-2015-la
  also: [lay-5e]
  wanted: [lacsg-2]
  note: "Units cover the six core-topic groups of the 2015 CUPM guide's first course in linear algebra (read through a summary, not the report's own pages), ordered by Lay's chapters. Unit 7 is second-course material by the guide's split. LACSG 2.0 is the newer standard and has not been read."

big_ideas:
  - id: MAIN
    title: A matrix is a linear map
    text: Every question (solvable or not, invertible or not, which directions are only stretched) is a question about what the map does to space.

practices:
  - id: P1
    title: Compute and interpret
    text: Carry a calculation to a number or a vector and say what it means for the system or the map.

units:
  - id: systems
    n: 1
    title: "Linear systems and independence"
    scope: core
    std: ["lay-5e:1", "cupm-2015-la:1"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Row reduction"
        los:
          - { id: A, std: ["lay-5e:1"], do: "Solve a linear system by row reduction.", ek: ["Pivots give the basic variables; a row 0 = c means no solution."], p: [P1], drills: ["la-system", "la-is-solution"] }
          - { id: B, std: ["lay-5e:1"], do: "Decide whether a set of vectors is linearly independent.", ek: ["Independent exactly when the only solution of Ax = 0 is zero."], p: [P1], drills: ["la-independence", "la-independence-parameter"] }
          - { id: C, std: ["cupm-2015-la:1"], do: "Read the number of solutions off an echelon form.", ek: ["A pivot in every variable column: one; a free variable: infinitely many; a row 0 = c: none."], p: [P1], drills: ["la-solution-type"] }
          - { id: D, std: ["cupm-2015-la:1"], do: "Count the free variables of a consistent system.", ek: ["Free variables are the non-pivot columns."], p: [P1], drills: ["la-free-variables"] }
      - n: 2
        title: "Vector equations and span"
        los:
          - { id: A, std: ["cupm-2015-la:1", "lay-5e:1"], do: "Decide whether a vector is in the span of others.", ek: ["b is in the span exactly when [v1 … vk | b] has no pivot in the last column."], p: [P1], drills: ["la-span-membership"] }
          - { id: B, std: ["cupm-2015-la:1", "lay-5e:1"], do: "Describe the solution set of Ax = b as a shifted null space.", ek: ["Every solution is a particular solution plus a solution of Ax = 0."], p: [P1], drills: ["la-solution-set-shape"] }
  - id: matrix-algebra
    n: 2
    title: "Matrix algebra"
    scope: core
    std: ["lay-5e:2", "cupm-2015-la:1"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Inverses"
        los:
          - { id: A, std: ["lay-5e:2"], do: "Find the inverse of a 2 × 2 matrix.", ek: ["Swap the diagonal, negate the off-diagonal, divide by the determinant."], p: [P1], drills: ["la-inverse", "la-inverse-check"] }
          - { id: B, std: ["cupm-2015-la:1"], do: "Solve Ax = b with a known inverse.", ek: ["x = A⁻¹b; row i of A⁻¹ dotted with b gives x_i."], p: [P1], drills: ["la-solve-with-inverse"] }
          - { id: C, std: ["cupm-2015-la:1", "lay-5e:2"], do: "Use the invertible matrix theorem.", ek: ["For a square matrix, invertible, n pivots, independent columns, det ≠ 0 and 0 not an eigenvalue stand or fall together."], p: [P1], drills: ["la-invertible-matrix-theorem"] }
      - n: 2
        title: "Matrix operations"
        los:
          - { id: A, std: ["cupm-2015-la:1", "lay-5e:2"], do: "Compute one entry of a product without computing the rest.", ek: ["(AB)_ij is row i of A dotted with column j of B."], p: [P1], drills: ["la-product-entry"] }
          - { id: B, std: ["cupm-2015-la:1", "lay-5e:2"], do: "Track sizes through products and transposes.", ek: ["(AB)ᵀ = BᵀAᵀ; an m × n times an n × p is m × p."], p: [P1], drills: ["la-product-size"] }
      - n: 3
        title: "LU factorisation"
        los:
          - { id: A, std: ["cupm-2015-la:1", "lay-5e:2"], do: "Factor a matrix as LU.", ek: ["The multipliers of row reduction go below the diagonal of L; U is the echelon form."], p: [P1], drills: ["la-lu-pivot"] }
          - { id: B, std: ["cupm-2015-la:1", "lay-5e:2"], do: "Solve with LU by forward and back substitution.", ek: ["Ly = b, then Ux = y."], p: [P1], drills: ["la-lu-forward"] }
  - id: determinants
    n: 3
    title: "Determinants"
    scope: core
    std: ["lay-5e:3", "cupm-2015-la:2"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Cofactor expansion"
        los:
          - { id: A, std: ["lay-5e:3"], do: "Compute a 3 × 3 determinant.", ek: ["Expand along the row or column with the most zeros."], p: [P1], drills: ["la-det", "mm-determinant", "la-det-triangular"] }
      - n: 2
        title: "Properties of determinants"
        los:
          - { id: A, std: ["cupm-2015-la:2", "lay-5e:3"], do: "Use det(AB) = det A det B, det Aᵀ = det A and det(kA) = kⁿ det A.", ek: ["A scalar multiplies every row, so it comes out to the nth power."], p: [P1], drills: ["la-det-properties"] }
          - { id: B, std: ["cupm-2015-la:2", "lay-5e:3"], do: "Track the determinant through row operations.", ek: ["Swap: sign flips; scale a row: scales; add a multiple of a row: no change."], p: [P1], drills: ["la-det-row-ops"] }
          - { id: C, std: ["cupm-2015-la:2", "lay-5e:3"], do: "Read |det A| as the factor by which A scales area or volume.", ek: ["Area of the image = |det A| × area."], p: [P1], drills: ["la-det-area"] }
  - id: vector-spaces
    n: 4
    title: "Rank and the null space"
    scope: core
    std: ["lay-5e:4", "cupm-2015-la:3"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Rank"
        los:
          - { id: A, std: ["lay-5e:4"], do: "Find the rank of a matrix and use the rank theorem.", ek: ["rank + dim Nul = number of columns."], p: [P1], drills: ["la-rank-3x3", "la-rank-nullity", "la-row-space-reverse"] }
      - n: 2
        title: "Subspaces, bases and dimension"
        los:
          - { id: A, std: ["cupm-2015-la:3", "lay-5e:4"], do: "Decide whether a set is a subspace.", ek: ["Contains 0, closed under addition and scaling."], p: [P1], drills: ["la-subspace-test"] }
          - { id: B, std: ["cupm-2015-la:3", "lay-5e:4"], do: "Find the dimension of a span.", ek: ["Dimension = the number of independent vectors = rank."], p: [P1], drills: ["la-span-dimension"] }
      - n: 3
        title: "Coordinates and change of basis"
        los:
          - { id: A, std: ["cupm-2015-la:4", "lay-5e:4"], do: "Find the coordinates of a vector in a basis.", ek: ["Solve P_B [x]_B = x."], p: [P1], drills: ["la-coordinates"] }
          - { id: B, std: ["cupm-2015-la:4", "lay-5e:4"], do: "Convert coordinates back to the standard basis.", ek: ["x = P_B [x]_B, with the basis vectors as columns."], p: [P1], drills: ["la-change-of-basis"] }
  - id: eigen
    n: 5
    title: "Eigenvalues and eigenvectors"
    scope: core
    std: ["lay-5e:5", "cupm-2015-la:5"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "The eigenvalue problem"
        los:
          - { id: A, std: ["lay-5e:5"], do: "Find the eigenvalues and eigenvectors of a 2 × 2 matrix.", ek: ["Sum of eigenvalues = trace, product = determinant."], p: [P1], drills: ["la-eigenvalues", "la-eigenvector", "mm-eigen-trace-det", "la-eigen-triangular"] }
          - { id: B, std: ["lay-5e:5"], do: "Decide whether a matrix is diagonalisable and use the diagonal form.", ek: ["n independent eigenvectors; powers act on the eigenvalues."], p: [P1], drills: ["la-diagonalizable-facts", "la-trace-of-power", "em-diagonalise"] }
      - n: 2
        title: "Eigenvectors at work"
        los:
          - { id: A, std: ["cupm-2015-la:5", "lay-5e:5"], do: "Compute Aᵏx by expanding x in eigenvectors.", ek: ["Each eigenvector component is multiplied by λᵏ."], p: [P1], drills: ["la-power-by-eigenvectors"] }
          - { id: B, std: ["cupm-2015-la:5", "lay-5e:5"], do: "Find the steady state of a Markov chain.", ek: ["The eigenvector for λ = 1, scaled to sum to 1."], p: [P1], drills: ["la-markov-steady-state"] }
          - { id: C, std: ["cupm-2015-la:5", "lay-5e:5"], do: "Read a complex eigenvalue as a rotation and a scaling.", ek: ["[[a, −b], [b, a]] rotates by arg λ and scales by |λ| = √(a² + b²)."], p: [P1], drills: ["la-complex-eigen-modulus"] }
  - id: orthogonality
    n: 6
    title: "Orthogonality and least squares"
    scope: core
    std: ["lay-5e:6", "cupm-2015-la:6"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Projections"
        los:
          - { id: A, std: ["lay-5e:6"], do: "Test orthogonality, project one vector on another and take a Gram–Schmidt step.", ek: ["proj = (u·v / v·v) v."], p: [P1], drills: ["la-orthogonal-check", "la-projection-scalar", "la-gram-schmidt-step"] }
          - { id: B, std: ["lay-5e:6"], do: "Set up and solve a least-squares problem.", ek: ["AᵀAx = Aᵀb."], p: [P1], drills: ["la-least-squares-slope", "la-least-squares-facts"] }
      - n: 2
        title: "Length, complements and QR"
        los:
          - { id: A, std: ["cupm-2015-la:6", "lay-5e:6"], do: "Find lengths and distances.", ek: ["‖u − v‖ = √((u − v)·(u − v))."], p: [P1], drills: ["la-distance"] }
          - { id: B, std: ["cupm-2015-la:6", "lay-5e:6"], do: "Find vectors in an orthogonal complement.", ek: ["W⊥ is everything orthogonal to a spanning set of W."], p: [P1], drills: ["la-orthogonal-complement"] }
          - { id: C, std: ["cupm-2015-la:6", "lay-5e:6"], do: "Find an entry of the QR factorisation.", ek: ["r_ii = length after removing earlier directions; r_ij = q_i · a_j."], p: [P1], drills: ["la-qr-entry"] }
  - id: symmetric
    n: 7
    title: "Symmetric matrices and singular values"
    scope: core
    std: ["lay-5e:7", "cupm-2015-la:second"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Singular values"
        los:
          - { id: A, std: ["lay-5e:7"], do: "Find a singular value of a small matrix.", ek: ["Singular values are the square roots of the eigenvalues of AᵀA."], p: [P1], drills: ["la-singular-value", "la-rank-one-singular-value"] }
          - { id: B, std: ["cupm-2015-la:second", "lay-5e:7"], do: "Use orthogonality of a symmetric matrix's eigenvectors.", ek: ["Different eigenvalues, orthogonal eigenvectors."], p: [P1], drills: ["la-symmetric-eigenvector"] }
      - n: 2
        title: "Quadratic forms"
        los:
          - { id: A, std: ["cupm-2015-la:second", "lay-5e:7"], do: "Classify a quadratic form.", ek: ["The signs of the eigenvalues of its symmetric matrix decide."], p: [P1], drills: ["la-quadratic-form-classify"] }
          - { id: B, std: ["cupm-2015-la:second", "lay-5e:7"], do: "Find the extreme values of a quadratic form on the unit sphere.", ek: ["The largest and smallest eigenvalues, at their eigenvectors."], p: [P1], drills: ["la-quadratic-form-max"] }
      - n: 3
        title: "The singular value decomposition"
        los:
          - { id: A, std: ["cupm-2015-la:second", "lay-5e:7"], do: "Find the condition number from the singular values.", ek: ["κ = σ_max / σ_min."], p: [P1], drills: ["la-condition-number"] }
  - id: transformations
    n: 8
    title: "Linear transformations"
    scope: core
    std: ["cupm-2015-la:4", "lay-5e:1", "lay-5e:4"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "The matrix of a linear map"
        los:
          - { id: A, std: ["cupm-2015-la:4", "lay-5e:1"], do: "Build a map from the images of the basis vectors.", ek: ["The columns of the standard matrix are T(e1), …, T(en)."], p: [P1], drills: ["la-map-from-basis-images"] }
          - { id: B, std: ["cupm-2015-la:4", "lay-5e:2"], do: "Compose linear maps as matrix products.", ek: ["S ∘ T has matrix ST: the first map stands on the right."], p: [P1], drills: ["la-composition"] }
          - { id: C, std: ["cupm-2015-la:4", "lay-5e:1"], do: "Decide whether a map is one-to-one or onto from its rank.", ek: ["One-to-one: rank = number of columns; onto: rank = number of rows."], p: [P1], drills: ["la-one-to-one-onto"] }
      - n: 2
        title: "Kernel, range and other bases"
        los:
          - { id: A, std: ["cupm-2015-la:4", "lay-5e:4"], do: "Find the dimensions of the kernel and range of a map on a function space.", ek: ["Rank–nullity holds for any linear map on a finite-dimensional space."], p: [P1], drills: ["la-kernel-dimension"] }
          - { id: B, std: ["cupm-2015-la:4", "lay-5e:4"], do: "Write the matrix of a map relative to a basis.", ek: ["Columns are the coordinates of T(b1), …, T(bn)."], p: [P1], drills: ["la-matrix-relative-to-basis"] }

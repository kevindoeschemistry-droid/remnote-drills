# Linear Algebra — curriculum framework (draft 2)
#
# Basis, stated plainly:
#   cupm-2015-la  the MAA CUPM 2015 guide's core topics for a first course (six groups), read through a
#                 summary of the print guide (read: part). Units 1-6 and 8 sit on its groups 1-6.
#   lay-5e        a textbook's chapter list, kept beside it as the order of the units.
#   lacsg-2       the LACSG 2.0 recommendations, read through the AMS Notices survey (2022).
# Unit 7 (symmetric matrices, quadratic forms, SVD) is beyond the CUPM first course; the guide puts the
# spectral theorem and the SVD in its second course. Unit 8 (linear transformations) was added after the
# others, so its number does not follow Lay's order; objective codes are never renumbered.
#
# Not here yet: Cramer's rule, abstract inner-product spaces, Jordan form, numerical methods.
id: linear-algebra
title: Linear Algebra
code: LA
draft: 2
track: math
requires: [math-hs]
level: 3
domains: [la]

basis:
  primary: cupm-2023-la
  also: [cupm-2015-la, lay-5e, webwork-opl, lacsg-2]
  note: "Anchored on the MAA CUPM 2023 linear algebra course report (read in full): every essential and optional core topic is cited by objectives here. Units keep Lay's order; determinants and LU, which the 2023 list leaves out, rest on Lay and the 2015 guide."

big_ideas:
  - id: MAIN
    title: A matrix is a linear map
    text: Every question (solvable or not, invertible or not, which directions are only stretched) is a question about what the map does to space.

practices:
  - id: P1
    title: Compute and interpret
    text: Carry a calculation to a number or a vector and say what it means for the system or the map.

units:
  - id: systems
    n: 1
    title: "Linear systems and independence"
    scope: core
    std: ["lay-5e:1", "cupm-2015-la:1"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Row reduction"
        los:
          - { id: E, std: ["cupm-2023-la:E2", "cupm-2023-la:E9"], do: "Decide independence by counting: rank, the number of vectors and the dimension of the space.", ek: ["More than n vectors in Rⁿ are always dependent; n vectors in Rⁿ are independent exactly when the matrix they form has nonzero determinant (rank n)."], p: [P1], drills: [la-indep-det, la-indep-count] }
          - { id: A, std: ["lay-5e:1", "webwork-opl:LA1.1", "webwork-opl:LA1.2", "webwork-opl:LA2.2", "cupm-2023-la:E1"], do: "Solve a linear system by row reduction.", ek: ["Pivots give the basic variables; a row 0 = c means no solution."], p: [P1], drills: ["la-system", "la-is-solution"] }
          - { id: B, std: ["lay-5e:1", "webwork-opl:LA4.4", "cupm-2023-la:E2"], do: "Decide whether a set of vectors is linearly independent.", ek: ["Independent exactly when the only solution of Ax = 0 is zero."], p: [P1], drills: ["la-independence", "la-independence-parameter"] }
          - { id: C, std: ["cupm-2015-la:1", "webwork-opl:LA1.6", "webwork-opl:LA2.3", "cupm-2023-la:E1"], do: "Read the number of solutions off an echelon form.", ek: ["A pivot in every variable column: one; a free variable: infinitely many; a row 0 = c: none."], p: [P1], drills: ["la-solution-type", la-inconsistent-h] }
          - { id: D, std: ["cupm-2015-la:1", "webwork-opl:LA1.3", "cupm-2023-la:E1"], do: "Count the free variables of a consistent system.", ek: ["Free variables are the non-pivot columns."], p: [P1], drills: ["la-free-variables", la-min-free-vars] }
      - n: 2
        title: "Vector equations and span"
        los:
          - { id: C, std: ["cupm-2023-la:E3", "cupm-2023-la:E5"], do: "Describe a span geometrically and find its dimension.", ek: ["The span of vectors in R³ is a point, a line, a plane or all of R³, as its dimension (the rank) is 0, 1, 2 or 3."], p: [P1], drills: [la-span-dim, la-span-shape] }
          - { id: A, std: ["cupm-2015-la:1", "lay-5e:1", "webwork-opl:LA1.5", "webwork-opl:LA4.2", "webwork-opl:LA4.3", "cupm-2023-la:E3"], do: "Decide whether a vector is in the span of others.", ek: ["b is in the span exactly when [v1 … vk | b] has no pivot in the last column."], p: [P1], drills: ["la-span-membership", la-span-h] }
          - { id: B, std: ["cupm-2015-la:1", "lay-5e:1", "cupm-2023-la:E5", "cupm-2023-la:E1"], do: "Describe the solution set of Ax = b as a shifted null space.", ek: ["Every solution is a particular solution plus a solution of Ax = 0."], p: [P1], drills: ["la-solution-set-shape", la-solution-set-dim] }
  - id: matrix-algebra
    n: 2
    title: "Matrix algebra"
    scope: core
    std: ["lay-5e:2", "cupm-2015-la:1"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Inverses"
        los:
          - { id: A, std: ["lay-5e:2", "webwork-opl:LA2.6", "cupm-2023-la:E4"], do: "Find the inverse of a 2 × 2 matrix.", ek: ["Swap the diagonal, negate the off-diagonal, divide by the determinant."], p: [P1], drills: ["la-inverse", "la-inverse-check"] }
          - { id: B, std: ["cupm-2015-la:1", "webwork-opl:LA1.4", "cupm-2023-la:E4"], do: "Solve Ax = b with a known inverse.", ek: ["x = A⁻¹b; row i of A⁻¹ dotted with b gives x_i."], p: [P1], drills: ["la-solve-with-inverse", la-transpose-inverse] }
          - { id: C, std: ["cupm-2015-la:1", "lay-5e:2", "webwork-opl:LA2.6", "cupm-2023-la:E4"], do: "Use the invertible matrix theorem.", ek: ["For a square matrix, invertible, n pivots, independent columns, det ≠ 0 and 0 not an eigenvalue stand or fall together."], p: [P1], drills: ["la-invertible-matrix-theorem", la-imt-consequence] }
      - n: 2
        title: "Matrix operations"
        los:
          - { id: A, std: ["cupm-2015-la:1", "lay-5e:2", "webwork-opl:LA2.1", "cupm-2023-la:E4"], do: "Compute one entry of a product without computing the rest.", ek: ["(AB)_ij is row i of A dotted with column j of B."], p: [P1], drills: ["la-product-entry", la-square-entry] }
          - { id: B, std: ["cupm-2015-la:1", "lay-5e:2", "webwork-opl:LA2.1", "webwork-opl:LA2.5", "cupm-2023-la:E4"], do: "Track sizes through products and transposes.", ek: ["(AB)ᵀ = BᵀAᵀ; an m × n times an n × p is m × p."], p: [P1], drills: ["la-product-size", la-multiplication-count] }
      - n: 3
        title: "LU factorisation"
        los:
          - { id: A, std: ["lacsg-2:S2", "cupm-2015-la:1", "lay-5e:2", "webwork-opl:LA3.2"], do: "Factor a matrix as LU.", ek: ["The multipliers of row reduction go below the diagonal of L; U is the echelon form."], p: [P1], drills: ["la-lu-pivot", la-det-from-lu] }
          - { id: B, std: ["cupm-2015-la:1", "lay-5e:2", "webwork-opl:LA3.2"], do: "Solve with LU by forward and back substitution.", ek: ["Ly = b, then Ux = y."], p: [P1], drills: ["la-lu-forward", la-forward-step] }
  - id: determinants
    n: 3
    title: "Determinants"
    scope: core
    std: ["lay-5e:3", "cupm-2015-la:2"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Cofactor expansion"
        los:
          - { id: A, std: ["lay-5e:3", "webwork-opl:LA10.1"], do: "Compute a 3 × 3 determinant.", ek: ["Expand along the row or column with the most zeros."], p: [P1], drills: ["la-det", "mm-determinant", "la-det-triangular"] }
      - n: 2
        title: "Properties of determinants"
        los:
          - { id: A, std: ["cupm-2015-la:2", "lay-5e:3", "webwork-opl:LA10.2"], do: "Use det(AB) = det A det B, det Aᵀ = det A and det(kA) = kⁿ det A.", ek: ["A scalar multiplies every row, so it comes out to the nth power."], p: [P1], drills: ["la-det-properties", la-det-combo] }
          - { id: B, std: ["cupm-2015-la:2", "lay-5e:3", "webwork-opl:LA2.2", "webwork-opl:LA10.2"], do: "Track the determinant through row operations.", ek: ["Swap: sign flips; scale a row: scales; add a multiple of a row: no change."], p: [P1], drills: ["la-det-row-ops", la-det-before-ops] }
          - { id: C, std: ["cupm-2015-la:2", "lay-5e:3", "webwork-opl:LA10.3"], do: "Read |det A| as the factor by which A scales area or volume.", ek: ["Area of the image = |det A| × area."], p: [P1], drills: ["la-det-area", la-triangle-area-det] }
  - id: vector-spaces
    n: 4
    title: "Rank and the null space"
    scope: core
    std: ["lay-5e:4", "cupm-2015-la:3"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Rank"
        los:
          - { id: A, std: ["lay-5e:4", "webwork-opl:LA2.4", "webwork-opl:LA4.7", "cupm-2023-la:E5", "cupm-2023-la:E9"], do: "Find the rank of a matrix and use the rank theorem.", ek: ["rank + dim Nul = number of columns."], p: [P1], drills: ["la-rank-3x3", "la-rank-nullity", "la-row-space-reverse"] }
      - n: 2
        title: "Subspaces, bases and dimension"
        los:
          - { id: A, std: ["cupm-2015-la:3", "lay-5e:4", "webwork-opl:LA4.5", "cupm-2023-la:E5"], do: "Decide whether a set is a subspace.", ek: ["Contains 0, closed under addition and scaling."], p: [P1], drills: ["la-subspace-test", la-subspace-which] }
          - { id: B, std: ["cupm-2015-la:3", "lay-5e:4", "webwork-opl:LA4.6", "cupm-2023-la:E9", "cupm-2023-la:E5"], do: "Find the dimension of a span.", ek: ["Dimension = the number of independent vectors = rank."], p: [P1], drills: ["la-span-dimension", la-span-dim-3] }
      - n: 3
        title: "Coordinates and change of basis"
        los:
          - { id: A, std: ["cupm-2015-la:4", "lay-5e:4", "webwork-opl:LA4.8", "cupm-2023-la:E9"], do: "Find the coordinates of a vector in a basis.", ek: ["Solve P_B [x]_B = x."], p: [P1], drills: ["la-coordinates", la-orthogonal-coordinates] }
          - { id: B, std: ["cupm-2015-la:4", "lay-5e:4", "webwork-opl:LA4.8", "cupm-2023-la:E9"], do: "Convert coordinates back to the standard basis.", ek: ["x = P_B [x]_B, with the basis vectors as columns."], p: [P1], drills: ["la-change-of-basis", la-coords-to-standard-3] }
  - id: eigen
    n: 5
    title: "Eigenvalues and eigenvectors"
    scope: core
    std: ["lay-5e:5", "cupm-2015-la:5"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "The eigenvalue problem"
        los:
          - { id: A, std: ["lay-5e:5", "webwork-opl:LA7.1", "cupm-2023-la:E8"], do: "Find the eigenvalues and eigenvectors of a 2 × 2 matrix.", ek: ["Sum of eigenvalues = trace, product = determinant."], p: [P1], drills: ["la-eigenvalues", "la-eigenvector", "mm-eigen-trace-det", "la-eigen-triangular"] }
          - { id: B, std: ["lacsg-2:F3", "lay-5e:5", "webwork-opl:LA3.1", "webwork-opl:LA7.2", "cupm-2023-la:E8", "cupm-2023-la:E9"], do: "Decide whether a matrix is diagonalisable and use the diagonal form.", ek: ["n independent eigenvectors; powers act on the eigenvalues."], p: [P1], drills: ["la-diagonalizable-facts", "la-trace-of-power", "em-diagonalise"] }
      - n: 2
        title: "Eigenvectors at work"
        los:
          - { id: A, std: ["cupm-2015-la:5", "lay-5e:5", "webwork-opl:LA7.5", "cupm-2023-la:E8", "cupm-2023-la:E9"], do: "Compute Aᵏx by expanding x in eigenvectors.", ek: ["Each eigenvector component is multiplied by λᵏ."], p: [P1], drills: ["la-power-by-eigenvectors", la-det-power] }
          - { id: B, std: ["cupm-2015-la:5", "lay-5e:5", "webwork-opl:LA2.9", "webwork-opl:PB7.1", "cupm-2023-la:E8"], do: "Find the steady state of a Markov chain.", ek: ["The eigenvector for λ = 1, scaled to sum to 1."], p: [P1], drills: ["la-markov-steady-state", la-markov-two-step] }
          - { id: C, std: ["cupm-2015-la:5", "lay-5e:5", "webwork-opl:LA7.3", "cupm-2023-la:E8"], do: "Read a complex eigenvalue as a rotation and a scaling.", ek: ["[[a, −b], [b, a]] rotates by arg λ and scales by |λ| = √(a² + b²)."], p: [P1], drills: ["la-complex-eigen-modulus", la-rotation-angle] }
  - id: orthogonality
    n: 6
    title: "Orthogonality and least squares"
    scope: core
    std: ["lay-5e:6", "cupm-2015-la:6"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Projections"
        los:
          - { id: C, std: ["cupm-2023-la:E11", "cupm-2023-la:E10"], do: "Fit a least-squares line with the normal equations and read its residuals.", ek: ["Solve AᵀA c = Aᵀy for c = (b, m); the residual vector is orthogonal to every column of A, so its entries sum to zero when an intercept is fitted."], p: [P1], drills: [la-lsq-slope, la-lsq-residual-sum] }
          - { id: A, std: ["lay-5e:6", "webwork-opl:LA8.1", "webwork-opl:LA8.3", "webwork-opl:LA8.4", "webwork-opl:LA8.5", "cupm-2023-la:E10", "cupm-2023-la:O2"], do: "Test orthogonality, project one vector on another and take a Gram–Schmidt step.", ek: ["proj = (u·v / v·v) v."], p: [P1], drills: ["la-orthogonal-check", "la-projection-scalar", "la-gram-schmidt-step"] }
          - { id: B, std: ["lay-5e:6", "webwork-opl:LA8.4", "webwork-opl:LA8.7", "cupm-2023-la:E11"], do: "Set up and solve a least-squares problem.", ek: ["AᵀAx = Aᵀb."], p: [P1], drills: ["la-least-squares-slope", "la-least-squares-facts"] }
      - n: 2
        title: "Length, complements and QR"
        los:
          - { id: A, std: ["cupm-2015-la:6", "lay-5e:6", "webwork-opl:LA4.1", "webwork-opl:LA8.4", "cupm-2023-la:E10"], do: "Find lengths and distances.", ek: ["‖u − v‖ = √((u − v)·(u − v))."], p: [P1], drills: ["la-distance", la-cos-angle] }
          - { id: B, std: ["cupm-2015-la:6", "lay-5e:6", "webwork-opl:LA8.4", "cupm-2023-la:E10"], do: "Find vectors in an orthogonal complement.", ek: ["W⊥ is everything orthogonal to a spanning set of W."], p: [P1], drills: ["la-orthogonal-complement", la-perp-h] }
          - { id: C, std: ["lacsg-2:S2", "cupm-2015-la:6", "lay-5e:6", "webwork-opl:LA3.3", "cupm-2023-la:O2"], do: "Find an entry of the QR factorisation.", ek: ["r_ii = length after removing earlier directions; r_ij = q_i · a_j."], p: [P1], drills: ["la-qr-entry", la-qr-r11] }
  - id: symmetric
    n: 7
    title: "Symmetric matrices and singular values"
    scope: core
    std: ["lay-5e:7", "cupm-2015-la:second"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Singular values"
        los:
          - { id: A, std: ["lacsg-2:F4", "lay-5e:7", "webwork-opl:LA3.4", "cupm-2023-la:O3"], do: "Find a singular value of a small matrix.", ek: ["Singular values are the square roots of the eigenvalues of AᵀA."], p: [P1], drills: ["la-singular-value", "la-rank-one-singular-value"] }
          - { id: B, std: ["lacsg-2:S4", "cupm-2015-la:second", "lay-5e:7", "webwork-opl:LA7.2", "cupm-2023-la:O4"], do: "Use orthogonality of a symmetric matrix's eigenvectors.", ek: ["Different eigenvalues, orthogonal eigenvectors."], p: [P1], drills: ["la-symmetric-eigenvector", la-symmetric-larger-eig] }
      - n: 2
        title: "Quadratic forms"
        los:
          - { id: A, std: ["cupm-2015-la:second", "lay-5e:7", "webwork-opl:LA7.4", "cupm-2023-la:O4"], do: "Classify a quadratic form.", ek: ["The signs of the eigenvalues of its symmetric matrix decide."], p: [P1], drills: ["la-quadratic-form-classify", la-form-min-eig] }
          - { id: B, std: ["cupm-2015-la:second", "lay-5e:7", "webwork-opl:LA7.4", "cupm-2023-la:O4"], do: "Find the extreme values of a quadratic form on the unit sphere.", ek: ["The largest and smallest eigenvalues, at their eigenvectors."], p: [P1], drills: ["la-quadratic-form-max", la-form-max-radius] }
      - n: 3
        title: "The singular value decomposition"
        los:
          - { id: B, std: ["lacsg-2:F4", "cupm-2023-la:O3"], do: "Find the error of the best low-rank approximation from the singular values.", ek: ["Eckart–Young: the best rank-k approximation drops σ_(k+1), …; its 2-norm error is σ_(k+1), its Frobenius error √(σ_(k+1)² + …)."], p: [P1], drills: [la-rank1-error, la-frob-error] }
          - { id: C, std: ["lacsg-2:S5", "lacsg-2:F4", "cupm-2023-la:E11", "cupm-2023-la:O3"], do: "Use the pseudo-inverse to get the least-squares solution of a full-column-rank system.", ek: ["A⁺ = (AᵀA)⁻¹Aᵀ when the columns are independent; x = A⁺b solves the normal equations; A⁺ inverts each nonzero singular value."], p: [P1], drills: [la-pinv-entry, la-pinv-diag] }
          - { id: A, std: ["lacsg-2:F4", "cupm-2015-la:second", "lay-5e:7", "webwork-opl:LA3.4", "cupm-2023-la:O3"], do: "Find the condition number from the singular values.", ek: ["κ = σ_max / σ_min."], p: [P1], drills: ["la-condition-number", la-cond-diag] }
  - id: transformations
    n: 8
    title: "Linear transformations"
    scope: core
    std: ["cupm-2015-la:4", "lay-5e:1", "lay-5e:4"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "The matrix of a linear map"
        los:
          - { id: A, std: ["lacsg-2:F1", "cupm-2015-la:4", "lay-5e:1", "webwork-opl:LA9.1", "webwork-opl:LA9.2", "cupm-2023-la:E6"], do: "Build a map from the images of the basis vectors.", ek: ["The columns of the standard matrix are T(e1), …, T(en)."], p: [P1], drills: ["la-map-from-basis-images", la-rotate-point] }
          - { id: B, std: ["lacsg-2:F2", "lacsg-2:F1", "cupm-2015-la:4", "lay-5e:2", "webwork-opl:LA9.3", "cupm-2023-la:E6", "cupm-2023-la:E4"], do: "Compose linear maps as matrix products.", ek: ["S ∘ T has matrix ST: the first map stands on the right."], p: [P1], drills: ["la-composition", la-composition-order] }
          - { id: C, std: ["cupm-2015-la:4", "lay-5e:1", "webwork-opl:LA9.4", "cupm-2023-la:E6"], do: "Decide whether a map is one-to-one or onto from its rank.", ek: ["One-to-one: rank = number of columns; onto: rank = number of rows."], p: [P1], drills: ["la-one-to-one-onto", la-rank-onto] }
      - n: 2
        title: "Kernel, range and other bases"
        los:
          - { id: C, std: ["lacsg-2:S6", "lacsg-2:F1", "cupm-2023-la:E6", "cupm-2023-la:E7", "cupm-2023-la:E8"], do: "Find the eigenvalues and eigenvectors of a linear operator on a function space.", ek: ["Apply the operator to a basis (monomials, exponentials): T(p) = λp makes p an eigenvector; the matrix of D on polynomials is nilpotent, so its only eigenvalue is 0."], p: [P1], drills: [la-operator-eigen, la-derivative-nilpotent] }
          - { id: A, std: ["cupm-2015-la:4", "lay-5e:4", "webwork-opl:LA6.6", "webwork-opl:LA9.5", "cupm-2023-la:E6", "cupm-2023-la:E7"], do: "Find the dimensions of the kernel and range of a map on a function space.", ek: ["Rank–nullity holds for any linear map on a finite-dimensional space."], p: [P1], drills: ["la-kernel-dimension", la-derivative-range] }
          - { id: B, std: ["lacsg-2:F1", "cupm-2015-la:4", "lay-5e:4", "webwork-opl:LA6.7", "webwork-opl:LA9.3", "cupm-2023-la:E6", "cupm-2023-la:E9"], do: "Write the matrix of a map relative to a basis.", ek: ["Columns are the coordinates of T(b1), …, T(bn)."], p: [P1], drills: ["la-matrix-relative-to-basis", la-shift-matrix-entry] }
  # >>> opl-fill:opl-la (generated by scripts/opl_fill.py; edit the spec)
  - id: abstract
    n: 9
    title: "Abstract vector spaces and special matrices"
    scope: core
    std: ["webwork-opl:LA1.7", "webwork-opl:LA2.7", "webwork-opl:LA2.8"]
    ideas: [MAIN]
    topics:
      - n: 1
        title: "Abstract vector spaces"
        los:
          - { id: A, std: ["webwork-opl:LA6.1", "webwork-opl:LA6.5", "lacsg-2:S1", "cupm-2023-la:E7"], do: "Decide whether a set with its operations is a vector space.", ek: ["Check the zero vector, closure under addition and under scaling; the rest of the axioms usually come free."], p: [P1], drills: [la-is-vector-space, la-axiom-fails] }
          - { id: B, std: ["webwork-opl:LA6.2", "cupm-2023-la:E7"], do: "Write a polynomial as a combination of other polynomials.", ek: ["Match coefficients of each power and solve the linear system."], p: [P1], drills: [la-poly-combination, la-poly-combo-2] }
          - { id: C, std: ["webwork-opl:LA6.3", "cupm-2023-la:E7", "cupm-2023-la:E3"], do: "Decide whether a polynomial lies in the span of others.", ek: ["In the span exactly when the coefficient system is consistent."], p: [P1], drills: [la-poly-span, la-poly-span-h] }
          - { id: D, std: ["webwork-opl:LA6.4", "cupm-2023-la:E7", "cupm-2023-la:E2"], do: "Decide when polynomials are linearly dependent.", ek: ["Dependent exactly when the matrix of their coefficient vectors is singular."], p: [P1], drills: [la-poly-dependence, la-poly-dependent-k] }
          - { id: E, std: ["webwork-opl:LA6.8", "cupm-2023-la:E7", "cupm-2023-la:E9"], do: "Find the dimension of a standard space of matrices or polynomials.", ek: ["Count the free entries: symmetric n(n+1)/2, skew n(n−1)/2, trace zero n² − 1, P_n has n + 1."], p: [P1], drills: [la-space-dimension, la-special-dim] }
          - { id: F, std: ["webwork-opl:LA8.2", "lacsg-2:S3", "cupm-2023-la:O1"], do: "Compute an inner product of functions.", ek: ["⟨f, g⟩ = ∫ f g dx is an inner product on continuous functions."], p: [P1], drills: [la-function-inner-product, la-orthogonal-shift] }
      - n: 2
        title: "Special matrices and applications"
        los:
          - { id: A, std: ["webwork-opl:LA1.7", "cupm-2023-la:E5"], do: "Balance a chemical equation from the null space of its composition matrix.", ek: ["Each element gives one equation; the coefficients span the null space."], p: [P1], drills: [la-balance-combustion, la-oxygen-coefficient] }
          - { id: B, std: ["webwork-opl:LA2.7", "cupm-2023-la:E4"], do: "Invert an elementary matrix.", ek: ["The inverse undoes the row operation: add −k instead of k, divide instead of multiply, swap back."], p: [P1], drills: [la-elementary-inverse, la-elementary-power] }

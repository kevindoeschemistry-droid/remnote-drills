# Analytical Chemistry — curriculum framework (draft 1, for Kevin's markup)
#
# Basis: the IChO regulations, Appendix C (read in full): titrations of every kind (c14, c15),
# Lambert–Beer (c17), experimental error (c1) and the preparation-only analysis techniques (a9);
# with the GRE Chemistry analytical area (15%, read through a summary) and MCAT 5C (separations).
# No analytical-chemistry curriculum standard was read: the ACS analytical content map (2020) is
# the one to read next. Objectives and their order are ours, in the usual textbook sequence.
#
# Not here yet: electrochemical methods (potentiometry, voltammetry), atomic spectroscopy theory,
# fluorescence, chromatographic theory beyond N, k and R_s (van Deemter), quality-control charts.
id: analytical-chemistry
title: Analytical Chemistry
code: AN
draft: 1
track: science
requires: [chemistry, inorganic-chemistry]
level: 4
domains: [anal]

basis:
  primary: acs-accm-analytical
  also: [icho-appendix-c, gre-chemistry, aamc-mcat-outline, usnco, icho-syllabus, acs-accm-general, acs-accm-inorganic]
  note: "Primary since Nov 2026: the ACS analytical content map, read in full; every articulation is answered (unit 6 was built for the ones nothing else reached). Earlier topics were named by IChO Appendix C, GRE Chemistry and MCAT 5C. Objectives and their order are ours."

big_ideas:
  - id: MOLES
    title: Every analysis is a mole chain
    text: Volume × concentration or mass ÷ molar mass, through a ratio, to the analyte. Titration, gravimetry and calibration differ only in the first link.
  - id: EQ
    title: Equilibrium sets the limits
    text: Common ions, complexing agents and pH decide how much stays dissolved, how sharp an end point is and what precipitates first.
  - id: ERROR
    title: A number is not a result without its uncertainty
    text: Replicates, calibration and propagation say how far to trust it; matrix effects say whether to trust it at all.

practices:
  - id: P1
    title: Compute
    text: Carry the stoichiometric or equilibrium calculation to a number with the right units.
  - id: P2
    title: Choose
    text: Pick the indicator, technique or test that fits.
  - id: P3
    title: Judge
    text: Decide whether data support a result.

units:
  - id: titrimetry
    n: 1
    title: "Titrimetry"
    std: ["icho-appendix-c:c14", "icho-appendix-c:c15", "icho-syllabus:12", "gre-chemistry:AN", "usnco:1"]
    scope: core
    ideas: [MOLES, EQ]
    topics:
      - n: 1
        title: "Titration types"
        los:
          - { id: A, std: ["acs-accm-analytical:V.A.1", "acs-accm-analytical:V.D.1", "acs-accm-analytical:VIII.D.2", "acs-accm-analytical:IX.C.1"], do: "Compute a result from a back titration.", ek: ["Reagent added − reagent left = reagent used."], p: [P1], drills: [an-back-titration, an-back-titration-volume] }
          - { id: B, std: ["acs-accm-analytical:V.D.1"], do: "Compute a result from a permanganate titration.", ek: ["Ratio from electrons: MnO₄⁻ 5, Fe²⁺ 1, C₂O₄²⁻ 2."], p: [P1], needs: [IN-4.1.A], drills: [an-permanganate, an-dichromate-for-permanganate] }
          - { id: C, std: ["acs-accm-analytical:V.D.1"], do: "Compute water hardness from an EDTA titration.", ek: ["EDTA binds metal ions 1:1; report as mg CaCO₃ per L."], p: [P1], drills: [an-edta-hardness, an-edta-volume] }
          - { id: D, std: ["acs-accm-analytical:V.D.1"], do: "Compute chloride from a Mohr titration.", ek: ["Ag⁺ + Cl⁻ 1:1; chromate end point at neutral pH."], p: [P1], drills: [an-argentometry-why, an-mohr] }
          - { id: E, do: "Compute protein from a Kjeldahl determination.", ek: ["mol N = acid added − acid left; × factor (6.25)."], p: [P1], needs: [AN-1.1.A], drills: [an-kjeldahl, an-kjeldahl-ammonia] }
      - n: 2
        title: "Titration curves"
        los:
          - { id: A, std: ["acs-accm-analytical:VIII.G.1"], do: "Find the pH at any point of a weak-acid–strong-base titration.", ek: ["Start, buffer, equivalence (hydrolysis), excess base."], p: [P1], drills: [an-quarter-equivalence, an-titration-ph] }
          - { id: B, std: ["acs-accm-analytical:V.C.1", "acs-accm-analytical:V.F.2", "acs-accm-analytical:VIII.A.1"], do: "Choose an indicator whose range brackets the equivalence pH.", ek: ["Weak acid + strong base: phenolphthalein."], p: [P2], needs: [AN-1.2.A], drills: [an-indicator, an-indicator-titration] }
  - id: gravimetry
    n: 2
    title: "Gravimetric analysis"
    std: ["icho-appendix-c:a9", "gre-chemistry:AN"]
    scope: core
    ideas: [MOLES]
    topics:
      - n: 1
        title: "Gravimetric factors"
        los:
          - { id: A, std: ["acs-accm-analytical:I.E.1", "acs-accm-analytical:IX.D.1"], do: "Compute a mass percent from the weight of a precipitate.", ek: ["Gravimetric factor from molar masses and element counts."], p: [P1], drills: [an-gravimetric, an-gravimetric-expected] }
  - id: equilibria
    n: 3
    title: "Solubility equilibria in analysis"
    std: ["icho-appendix-c:c9", "icho-appendix-c:a7"]
    scope: core
    ideas: [EQ]
    topics:
      - n: 1
        title: "Solubility"
        los:
          - { id: A, std: ["acs-accm-analytical:VIII.C.2", "acs-accm-analytical:VIII.E.2"], do: "Compute a solubility with a common ion present.", ek: ["s(s + c) = K_sp."], p: [P1], drills: [an-common-ion, an-common-ion-factor] }
          - { id: B, std: ["acs-accm-inorganic:VIII.C.1", "acs-accm-analytical:V.A.2", "acs-accm-analytical:VIII.C.2"], do: "Compute a solubility raised by complex formation.", ek: ["K = K_sp·β₂ for AgX + 2NH₃."], p: [P1], needs: [AN-3.1.A], drills: [an-complex-dissolve, an-complex-solubility] }
  - id: separations
    n: 4
    title: "Separations"
    std: ["icho-appendix-c:a9", "aamc-mcat-outline:5C"]
    scope: core
    ideas: [EQ]
    topics:
      - n: 1
        title: "Extraction and chromatography"
        los:
          - { id: A, std: ["acs-accm-analytical:VIII.G.2", "acs-accm-analytical:IX.H.2"], do: "Compute the fraction left after repeated extractions.", ek: ["q = [V_aq/(V_aq + D V_org)]ⁿ."], p: [P1], drills: [an-extraction, an-extractions-needed] }
          - { id: B, std: ["acs-accm-analytical:IV.C.1", "acs-accm-analytical:VIII.G.3", "acs-accm-analytical:X.D.2"], do: "Compute plate number, retention factor or resolution from a chromatogram.", ek: ["N = 16(t_R/W)², k = (t_R − t_M)/t_M, R_s = 2Δt_R/(W₁+W₂)."], p: [P1], drills: [an-chromatography, an-resolution-length] }
  - id: measurement
    n: 5
    title: "Measurement, calibration and data"
    std: ["icho-appendix-c:c17", "icho-appendix-c:c1", "gre-chemistry:AN"]
    scope: core
    ideas: [ERROR]
    topics:
      - n: 1
        title: "Spectrophotometry and calibration"
        los:
          - { id: A, std: ["acs-accm-analytical:I.D.3"], do: "Resolve a two-component mixture by absorbance at two wavelengths.", ek: ["Absorbances add; solve two equations."], p: [P1], drills: [an-two-component, an-beer-reverse] }
          - { id: B, std: ["acs-accm-analytical:IX.A.3", "acs-accm-analytical:X.D.1"], do: "Find a concentration by standard addition.", ek: ["c = A_x c_s V_s / [V_x (A_sp − A_x)]."], p: [P1], drills: [an-standard-addition, an-spike-signal] }
          - { id: C, std: ["acs-accm-general:IX.G.4", "acs-accm-analytical:IX.F.3", "acs-accm-analytical:X.D.1"], do: "Read an unknown off a least-squares calibration line.", ek: ["Slope and intercept from the sums."], p: [P1], drills: [an-detection-limit, an-calibration] }
      - n: 2
        title: "Data and method choice"
        los:
          - { id: C, std: ["acs-accm-inorganic:IX.C.2", "acs-accm-inorganic:IX.E.2", "acs-accm-analytical:VI.A.1", "acs-accm-analytical:VI.B.1", "acs-accm-analytical:IX.D.5", "acs-accm-analytical:IX.H.4", "acs-accm-analytical:X.A.1", "acs-accm-analytical:X.B.1"], do: "Choose an analytical technique for a stated question.", ek: ["Trace metals ICP-MS, volatiles GC, non-volatiles HPLC, water Karl Fischer."], p: [P2], drills: [an-instrument, an-technique-measures] }
          - { id: A, std: ["acs-accm-analytical:IX.F.2", "acs-accm-analytical:IX.F.5"], do: "Apply Dixon's Q-test to a suspect replicate.", ek: ["Q = gap/range vs Q_crit."], p: [P3], drills: [an-q-test, an-q-value] }
          - { id: B, std: ["acs-accm-inorganic:IX.F.1", "acs-accm-analytical:IX.F.2", "acs-accm-analytical:IX.F.4"], do: "Propagate random uncertainty through a sum or a product.", ek: ["Absolute in quadrature for sums, relative for products."], p: [P1], drills: [an-uncertainty, an-uncertainty-product] }
  - id: instrumental
    n: 6
    title: "Instrumental methods and quality"
    std: ["acs-accm-analytical:I.D.2", "acs-accm-analytical:IX.D.5", "acs-accm-analytical:IX.F.4"]
    scope: extension
    ideas: [EQ, ERROR]
    topics:
      - n: 1
        title: "Spectroscopy"
        los:
          - { id: A, std: ["acs-accm-analytical:I.D.2", "acs-accm-analytical:I.D.5", "acs-accm-analytical:II.E.1", "acs-accm-analytical:VII.A.1"], do: "Trace the paths an excited molecule takes back to the ground state and tell fluorescence from phosphorescence.", ek: ["Internal conversion and vibrational relaxation are radiationless; fluorescence keeps spin (ns), phosphorescence follows intersystem crossing (ms–s); emission is red-shifted."], p: [P1], drills: [an-jablonski, an-fluor-linear] }
          - { id: B, std: ["acs-accm-analytical:I.D.2", "acs-accm-analytical:I.D.3"], do: "Convert between transmittance and absorbance and find the concentration where Beer's law holds.", ek: ["A = −log T; 10% T is A = 1; A = εbc is linear for dilute solutions (about A < 1)."], p: [P1], drills: [an-t-to-a, an-max-conc] }
          - { id: C, std: ["acs-accm-analytical:I.B.2", "acs-accm-analytical:III.D.1"], do: "Decide IR and Raman activity from symmetry and count EPR hyperfine lines.", ek: ["IR needs a dipole change, Raman a polarizability change; for a centrosymmetric molecule no mode is both. n equivalent nuclei of spin I split an EPR line into 2nI + 1."], p: [P1], drills: [an-epr-lines, an-ir-raman] }
          - { id: D, std: ["acs-accm-analytical:I.A.2", "acs-accm-analytical:I.C.1", "acs-accm-analytical:I.D.4", "acs-accm-analytical:III.G.1", "acs-accm-analytical:IX.D.2", "acs-accm-analytical:IX.H.3"], do: "Choose the spectrometer components, wavelength and corrections, and anticipate interferences.", ek: ["Measure at λmax; continuum versus line sources; dispersive versus multichannel detection; background subtraction; chemically similar elements interfere; XRF lines scale with Z²."], p: [P1], drills: [an-spec-choice, an-moseley-ratio] }
      - n: 2
        title: "Mass spectrometry and atomic methods"
        los:
          - { id: A, std: ["acs-accm-analytical:V.B.3", "acs-accm-analytical:IX.D.4"], do: "Estimate carbon count from the M+1 peak and compute the resolution a mass spectrometer needs.", ek: ["Each carbon adds about 1.1% to M+1; R = m/Δm separates two ions of nearly equal mass."], p: [P1], drills: [an-mplus1, an-ms-resolution] }
          - { id: B, std: ["acs-accm-analytical:II.D.1", "acs-accm-analytical:VI.B.1"], do: "Choose an atomization or ionization source: flame, furnace, ICP; EI versus ESI and MALDI.", ek: ["Hard ionization (EI) fragments, soft (ESI, MALDI) keeps the molecular ion; ICP's hot plasma atomizes and ionizes for ICP-MS."], p: [P1], drills: [an-ion-source, an-esi-mass] }
          - { id: C, std: ["acs-accm-analytical:I.A.1"], do: "Compute an analyte amount by isotope dilution.", ek: ["Spike with an enriched isotope; the measured isotope ratio of the blend gives the original amount without full recovery."], p: [P1], drills: [an-isotope-dilution, an-id-mixed] }
      - n: 3
        title: "Separations and derivatization"
        los:
          - { id: A, std: ["acs-accm-analytical:IV.C.1", "acs-accm-analytical:IV.C.2"], do: "Predict elution order and the effect of solvent strength in normal- and reverse-phase chromatography.", ek: ["Reverse phase (C18, polar mobile phase): polar compounds elute first; more organic solvent speeds elution. Normal phase reverses both."], p: [P1], drills: [an-rp-order, an-retention-time] }
          - { id: B, std: ["acs-accm-analytical:I.G.2"], do: "Compute electrophoretic mobility and migration time in capillary electrophoresis.", ek: ["v = (μ_ep + μ_eo)E with E = V/L; cations migrate first with electroosmotic flow toward the cathode."], p: [P1], drills: [an-ce-time, an-ce-order] }
          - { id: C, std: ["acs-accm-analytical:III.F.1", "acs-accm-analytical:V.B.2", "acs-accm-analytical:V.F.3", "acs-accm-analytical:IX.C.1"], do: "Choose a derivatization to make an analyte volatile, stable or detectable.", ek: ["Silylation or esterification for GC; chromophore or fluorophore tags for UV and fluorescence; tagging before or after separation."], p: [P1], drills: [an-derivatize, an-tag-gain] }
      - n: 4
        title: "Thermal and electroanalytical methods"
        los:
          - { id: A, std: ["acs-accm-analytical:III.H.3", "acs-accm-analytical:VI.D.1"], do: "Interpret thermogravimetric mass losses and DSC peaks.", ek: ["TGA steps follow loss of water, CO, CO₂ by stoichiometry; DSC peak area gives enthalpy; endotherms for melting, exotherms for crystallization."], p: [P1], drills: [an-tga-step, an-dsc-enthalpy] }
          - { id: B, std: ["acs-accm-analytical:V.B.4", "acs-accm-analytical:IX.D.3", "acs-accm-analytical:VII.E.1"], do: "Choose among potentiometry, voltammetry, amperometry and coulometry, and read a voltammogram.", ek: ["Potentiometry draws no current; voltammetry scans potential and reads current peaks; coulometry counts total charge; enzyme electrodes add selectivity."], p: [P1], drills: [an-electro-choice, an-coulometry] }
      - n: 5
        title: "Equilibrium in depth"
        los:
          - { id: A, std: ["acs-accm-analytical:VIII.D.1"], do: "Compute the fraction of each form of a diprotic acid at a given pH.", ek: ["α₀ = [H⁺]²/D, α₁ = K₁[H⁺]/D, α₂ = K₁K₂/D with D = [H⁺]² + K₁[H⁺] + K₁K₂."], p: [P1], drills: [an-alpha-diprotic, an-alpha-max] }
          - { id: B, std: ["acs-accm-analytical:VIII.D.2", "acs-accm-analytical:VIII.D.6"], do: "Compute a conditional formation constant for EDTA at a given pH.", ek: ["K_f′ = α_Y⁴⁻ K_f; titrations need K_f′ large enough (about 10⁸) for a sharp end point."], p: [P1], drills: [an-conditional-kf, an-kf-fraction] }
          - { id: C, std: ["acs-accm-analytical:II.A.1", "acs-accm-analytical:VIII.D.3"], do: "Correct a solubility for ionic strength with activity coefficients.", ek: ["K_sp = γ₊[M⁺]γ₋[X⁻]: added inert salt lowers γ and raises solubility."], p: [P1], drills: [an-activity-solubility, an-ionic-gamma] }
          - { id: D, std: ["acs-accm-analytical:V.A.2", "acs-accm-analytical:VIII.C.1", "acs-accm-analytical:VIII.F.5"], do: "Use charge and mass balances together when an approximation fails.", ek: ["For very dilute strong acid, [H⁺] = C + [OH⁻] = C + K_w/[H⁺]: 10⁻⁸ M HCl has pH just below 7, not 8."], p: [P1], drills: [an-dilute-acid, an-weak-exact] }
      - n: 6
        title: "Quality and statistics"
        los:
          - { id: A, std: ["acs-accm-analytical:IX.A.1", "acs-accm-analytical:X.D.1"], do: "Compute detection and quantitation limits and sensitivity from blanks and a calibration slope.", ek: ["LOD ≈ 3s_blank/m, LOQ ≈ 10s_blank/m; sensitivity is the calibration slope."], p: [P1], drills: [an-lod, an-loq-ratio] }
          - { id: B, std: ["acs-accm-analytical:IX.A.3"], do: "Quantify with an internal standard using a response factor.", ek: ["F = (A_x/[X])/(A_s/[S]) from a standard mixture; then [X] = (A_x/A_s)[S]/F."], p: [P1], drills: [an-internal-std, an-cal-choice] }
          - { id: C, std: ["acs-accm-analytical:IX.C.2"], do: "Compute spike recovery and judge whether a method is quantitative.", ek: ["Recovery = (spiked result − unspiked result)/amount added × 100%."], p: [P1], drills: [an-recovery, an-limiting-analyte] }
          - { id: D, std: ["acs-accm-analytical:IX.E.3"], do: "Estimate how many samples a heterogeneous lot needs, and pick a sampling plan.", ek: ["n = (t s_s / e)² for sampling standard deviation s_s and allowed error e; random, stratified, systematic and composite sampling."], p: [P1], drills: [an-n-samples, an-sampling-plan] }
          - { id: E, std: ["acs-accm-analytical:IX.F.5", "acs-accm-analytical:X.C.1"], do: "Compare two means with a t-test.", ek: ["t = |x̄₁ − x̄₂|/(s_pooled √(1/n₁ + 1/n₂)); compare with t from the table."], p: [P1], drills: [an-t-two-means, an-t-decide] }
          - { id: F, std: ["acs-accm-analytical:IX.F.1"], do: "Standardize a titrant against a primary standard and explain traceability.", ek: ["KHP (204.22 g/mol) standardizes NaOH 1:1; primary standards are pure, stable, non-hygroscopic and of known formula."], p: [P1], drills: [an-khp, an-primary-std] }
          - { id: G, std: ["acs-accm-analytical:IX.A.2", "acs-accm-analytical:IX.E.2", "acs-accm-analytical:IX.F.4"], do: "Identify random and systematic errors, sample degradation and QC checks.", ek: ["Systematic errors bias results (fix by calibration and blanks); random errors scatter them; control charts track drift; store samples to stop change."], p: [P1], drills: [an-error-kind, an-glass-tolerance] }
          - { id: H, std: ["acs-accm-analytical:X.D.3"], do: "Locate an end point from a first-derivative plot.", ek: ["The end point is where ΔpH/ΔV peaks, at the midpoint of the steepest interval."], p: [P1], drills: [an-derivative-endpoint, an-log-linear] }

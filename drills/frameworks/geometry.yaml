# Geometry — curriculum framework (draft 1, for Kevin's markup)
#
# The sphere, the plane and the hyperbolic plane as three versions of one subject: what a straight line is,
# how angle sums and circumferences change, and the single number, curvature, that accounts for all of it.
# School geometry is in the K-12 frameworks; this is the college course that follows it.
id: geometry
title: Geometry
code: GE
draft: 1
track: math
requires: [calculus, linear-algebra]
level: 4
domains: [ngeo]

basis:
  primary: cambridge-ib-geometry
  note: "Anchored on the Cambridge Part IB Geometry schedule (read through an extraction). The three constant-curvature geometries side by side. Axiomatic Euclidean geometry, projective geometry and the differential geometry of general surfaces are not built; K-12 geometry lives in the school mathematics frameworks."

big_ideas:
  - id: LINE
    title: "Straight means shortest"
    text: "A geodesic is a locally shortest path. On a sphere it is a great circle; in the half-plane model it is a vertical line or a semicircle meeting the boundary at right angles."
  - id: CURV
    title: "Curvature is the angle surplus per area"
    text: "A triangle's angles exceed π on a sphere and fall short in the hyperbolic plane, by exactly the curvature times its area."

practices:
  - id: P1
    title: Compute
    text: "Carry the definition or theorem to a number, a count or an example."
  - id: P2
    title: Decide
    text: "Say whether a statement holds, which hypothesis fails, or which example breaks it."

units:
  - id: spherical
    n: 1
    title: "Spherical geometry"
    std: ["cambridge-ib-geometry:SPH"]
    scope: core
    ideas: [LINE, CURV]
    topics:
      - n: 1
        title: "Lines and triangles on the sphere"
        los:
          - { id: A, std: ["cambridge-ib-geometry:SPH"], do: "Find great-circle distances and the areas of lunes.", ek: ["Spherical lines are great circles. The distance between two points is R times the angle they subtend at the centre, and a lune between two great circles meeting at angle θ has area 2θR²."], p: [P1], drills: [ge-great-circle-distance, ge-lune-area] }
          - { id: B, std: ["cambridge-ib-geometry:SPH"], do: "Use the angle excess of a spherical triangle or polygon.", ek: ["A spherical triangle with angles α, β, γ on a sphere of radius R has area (α + β + γ − π)R². An n-gon has area (angle sum − (n − 2)π)R²."], p: [P1], needs: [GE-1.1.A, GE-1.2.C], drills: [ge-spherical-triangle-area, ge-spherical-third-angle] }
          - { id: C, std: ["cambridge-ib-geometry:SPH"], do: "Describe the isometries of the sphere and its finite rotation groups.", ek: ["The isometries of the sphere are the orthogonal maps: rotations about an axis and their compositions with reflections. The finite groups of rotations are cyclic, dihedral, or the rotation groups of the tetrahedron (order 12), cube (24) and icosahedron (60)."], p: [P2], needs: [GE-1.1.B], drills: [ge-sphere-isometries, ge-triangulation-count] }
      - n: 2
        title: "The sphere in coordinates"
        los:
          - { id: A, std: ["cambridge-ib-geometry:SPH"], do: "Find the central angle between two points given by latitude and longitude.", ek: ["Write each point as a unit vector (cos φ cos λ, cos φ sin λ, sin φ); the central angle is the angle between the vectors, so cos c = sin φ₁ sin φ₂ + cos φ₁ cos φ₂ cos Δλ. On one meridian the angle is just the difference in latitude."], p: [P1], needs: [GE-1.1.A], drills: [ge-meridian-distance, ge-central-angle] }
          - { id: B, std: ["cambridge-ib-geometry:SPH"], do: "Compare a circle of latitude with a great circle.", ek: ["The circle at latitude φ has radius R cos φ, so its length is 2πR cos φ. Only the equator is a great circle; travelling along any other parallel is longer than the great-circle route between the same points."], p: [P1], needs: [GE-1.2.A], drills: [ge-latitude-circle, ge-parallel-vs-great] }
          - { id: C, std: ["cambridge-ib-geometry:SPH"], do: "Find the area of a spherical cap or zone.", ek: ["The cap within angular radius θ of a pole has area 2πR²(1 − cos θ), which is 2πR times its height (Archimedes). A cap is the spherical disc, and it has less area than the flat disc of the same radius."], p: [P1], needs: [GE-1.2.B], drills: [ge-cap-area, ge-fraction-above-latitude] }
  - id: hyperbolic
    n: 2
    title: "Hyperbolic geometry"
    std: ["cambridge-ib-geometry:RIE", "cambridge-ib-geometry:HYP"]
    scope: core
    ideas: [LINE, CURV]
    topics:
      - n: 1
        title: "The half-plane and disc models"
        los:
          - { id: A, std: ["cambridge-ib-geometry:RIE", "cambridge-ib-geometry:HYP"], do: "Measure length in the upper half-plane and identify its geodesics.", ek: ["The half-plane metric is (dx² + dy²)/y². Geodesics are vertical lines and semicircles centred on the real axis; the distance from ai to bi is |ln(b/a)|."], p: [P1], needs: [GE-1.1.A, GE-2.2.A], drills: [ge-hyperbolic-distance, ge-hyperbolic-geodesics] }
          - { id: B, std: ["cambridge-ib-geometry:HYP"], do: "Use the angle defect of a hyperbolic triangle and compare parallels in the three geometries.", ek: ["A hyperbolic triangle with angles α, β, γ has area π − (α + β + γ), so no triangle has area above π; an ideal triangle has area exactly π. Through a point off a line there are infinitely many lines that never meet it."], p: [P1], needs: [GE-2.1.A, GE-1.1.B, GE-2.2.C, GE-2.2.B], drills: [ge-hyperbolic-triangle-area, ge-parallels] }
          - { id: C, std: ["cambridge-ib-geometry:RIE", "cambridge-ib-geometry:HYP"], do: "Compare circumferences of circles in the three geometries.", ek: ["A circle of geodesic radius r has circumference 2π sin r on the unit sphere, 2πr in the plane and 2π sinh r in the hyperbolic plane: less room than flat on the sphere, more in the hyperbolic plane."], p: [P1], needs: [GE-2.1.A], drills: [ge-circle-sphere, ge-circle-hyperbolic] }
      - n: 2
        title: "The half-plane by formula"
        los:
          - { id: A, std: ["cambridge-ib-geometry:RIE", "cambridge-ib-geometry:HYP"], do: "Compute the length of a horizontal or vertical segment in the half-plane.", ek: ["With metric (dx² + dy²)/y², a horizontal segment of Euclidean length L at height y has length L/y, and a vertical segment from height a to b has length ln(b/a). Lengths grow without bound near the boundary y = 0."], p: [P1], needs: [GE-1.2.B], drills: [ge-horizontal-length, ge-vertical-length] }
          - { id: B, std: ["cambridge-ib-geometry:HYP"], do: "Find the geodesic through two points of the half-plane.", ek: ["If the points share an x-coordinate the geodesic is the vertical line. Otherwise it is the semicircle centred on the real axis at the point equidistant from both: solve (x₁ − c)² + y₁² = (x₂ − c)² + y₂²."], p: [P1], needs: [GE-2.1.A], drills: [ge-geodesic-centre, ge-geodesic-radius] }
          - { id: C, std: ["cambridge-ib-geometry:HYP"], do: "Compute hyperbolic areas by integrating and by the angle defect.", ek: ["The area element is dx dy / y². The region above height h over a base of width w has finite area w/h although it extends to infinity. A geodesic n-gon has area (n − 2)π minus its angle sum."], p: [P1], needs: [GE-2.2.A], drills: [ge-strip-area, ge-hyperbolic-polygon-area] }
  - id: curvature
    n: 3
    title: "Curvature"
    std: ["cambridge-ib-geometry:CUR"]
    scope: core
    ideas: [CURV]
    topics:
      - n: 1
        title: "One number behind three geometries"
        los:
          - { id: A, std: ["cambridge-ib-geometry:CUR"], do: "State the Gaussian curvature of the model spaces and how it scales.", ek: ["A sphere of radius R has curvature 1/R², the plane 0, and the hyperbolic plane −1. Scaling lengths by a factor c divides curvature by c²."], p: [P1], needs: [GE-2.1.C, GE-3.2.A, GE-3.2.B], drills: [ge-sphere-curvature, ge-curvature-sign] }
          - { id: B, std: ["cambridge-ib-geometry:CUR", "cambridge-ib-geometry:SPH", "cambridge-ib-geometry:HYP"], do: "Use the Gauss-Bonnet relation between curvature, area and angle sum.", ek: ["For a geodesic triangle, α + β + γ − π = ∫ K dA. For a closed surface, ∫ K dA = 2πχ: 4π for any sphere, 0 for a torus, 4π(1 − g) for genus g."], p: [P1], needs: [GE-3.1.A, GE-2.1.B], drills: [ge-total-curvature, ge-angle-sum-from-curvature] }
      - n: 2
        title: "Curvature you can measure"
        los:
          - { id: A, std: ["cambridge-ib-geometry:CUR"], do: "Estimate curvature from a measured geodesic triangle.", ek: ["For a small geodesic triangle, K ≈ (α + β + γ − π)/area. On a sphere this is exact and gives the radius: R = √(area/excess)."], p: [P1], needs: [GE-1.1.B], drills: [ge-curvature-from-triangle, ge-radius-from-excess] }
          - { id: B, std: ["cambridge-ib-geometry:CUR"], do: "Estimate curvature from the circumference of a small circle.", ek: ["A geodesic circle of radius r has circumference 2πr(1 − Kr²/6 + …). Positive curvature shortens it, negative curvature lengthens it; K ≈ 3(2πr − C)/(πr³)."], p: [P1], needs: [GE-2.1.C], drills: [ge-curvature-from-circle, ge-circumference-deficit] }

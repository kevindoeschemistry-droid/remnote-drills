# Polymers and Materials — curriculum framework (draft 1, for Kevin's markup)
#
# Basis: IChO Appendix C items c22 and a5 (polymers; read in full), IB Chemistry S2.4 (from models to
# materials) and FE Chemical 4.D (polymers, ceramics, composites). Objectives and their order are
# ours. Not here yet: polymer chain statistics (end-to-end distance), viscoelasticity, glass
# transition kinetics, ceramics and composites, phase diagrams of alloys. Unit 3 (colloids and DLVO,
# Nov 2026) is a house list on Israelachvili chapters 13–14: no curriculum standard covering DLVO was found.
id: materials
title: Polymers and Materials
code: MT
draft: 1
track: science
requires: [chemistry, physics]
level: 4
domains: [materials]

basis:
  primary: icho-appendix-c
  also: [ib-chemistry-2025, fe-chemical, icho-syllabus, acs-accm-general, acs-accm-inorganic, acs-accm-organic]
  note: "Polymer topics from IChO Appendix C (c22, a5), IB S2.4 and FE Chemical 4.D; a house list on those items."

big_ideas:
  - id: CHAINS
    title: Polymers are distributions, not molecules
    text: A sample holds many chain lengths; averages and dispersity, not one molar mass, describe it.
  - id: PROPS
    title: Structure sets properties
    text: Cross-links, band gaps and bond stiffness decide whether a material flows, conducts or stretches.

practices:
  - id: P1
    title: Compute
    text: Carry the calculation to a number with units.
  - id: P2
    title: Classify
    text: Place a material in its family from its chemistry.

units:
  - id: polymers
    n: 1
    title: "Polymers"
    std: ["icho-appendix-c:c22", "icho-appendix-c:a5", "icho-syllabus:10", "ib-chemistry-2025:S2.4", "fe-chemical:4.D"]
    scope: core
    ideas: [CHAINS]
    topics:
      - n: 1
        title: "Molar mass and growth"
        los:
          - { id: A, std: ["acs-accm-inorganic:X.C.1"], do: "Compute M_n, M_w and dispersity from a chain distribution.", ek: ["M_n = ΣnM/Σn; M_w = ΣnM²/ΣnM."], p: [P1], needs: [CH-3.1.B], drills: [mt-molar-mass-averages, mt-blend-mn] }
          - { id: B, do: "Compute the degree of polymerisation of a step-growth polymer.", ek: ["X_n = (1 + r)/(1 + r − 2rp)."], p: [P1], needs: [MT-1.1.A], drills: [mt-carothers, mt-carothers-reverse] }
          - { id: C, std: ["acs-accm-general:III.H.2", "acs-accm-organic:III.A.3", "acs-accm-inorganic:IV.B.2"], do: "Classify a polymer as chain-growth or step-growth.", ek: ["Vinyl polymers chain; polyesters, polyamides step."], p: [P2], needs: [MT-1.1.B], drills: [mt-growth-type, mt-growth-evidence] }
          - { id: D, do: "Classify a polymer as thermoplastic or thermoset.", ek: ["Cross-linked networks do not melt."], p: [P2], needs: [MT-1.1.C], drills: [mt-thermoset, mt-thermoset-evidence] }
  - id: solids
    n: 2
    title: "Properties of solids"
    std: ["fe-chemical:4.A", "ib-chemistry-2025:S2.4"]
    scope: core
    ideas: [PROPS]
    topics:
      - n: 1
        title: "Mechanical and electronic"
        los:
          - { id: A, do: "Compute Young's modulus from a tensile test.", ek: ["E = (F/A)/(ΔL/L₀)."], p: [P1], needs: [CH-3.2.A], drills: [mt-youngs-modulus, mt-elongation] }
          - { id: B, std: ["acs-accm-general:V.G.1", "acs-accm-inorganic:II.G.2"], do: "Relate a semiconductor's band gap to the wavelength it absorbs or emits.", ek: ["λ = hc/E_g."], p: [P1], needs: [MT-2.1.A], drills: [mt-band-gap, mt-gap-from-emission] }
  - id: colloids
    n: 3
    title: "Colloids and DLVO theory"
    scope: extension
    ideas: [PROPS]
    topics:
      - n: 1
        title: "The electrical double layer"
        los:
          - { id: A, std: ["acs-accm-inorganic:IV.E.2"], do: "Compute the Debye length from the ionic strength, and say how salt and valence change it.", ek: ["κ⁻¹ = √(εkT/2N_Ae²I); 0.304/√I nm for 1:1 salt at 25 °C."], p: [P1], needs: [CH-3.1.B, PH-10.5.B], drills: [col-debye-length, col-debye-scaling, col-debye-valence] }
          - { id: B, do: "Relate surface charge to surface potential with the Grahame equation.", ek: ["σ = √(8εkTn∞) sinh(eψ₀/2kT); σ ≈ εκψ₀ at low potential."], p: [P1], needs: [MT-3.1.A], drills: [col-grahame, col-grahame-scale] }
          - { id: C, do: "Find a zeta potential from electrophoretic mobility and judge stability from it.", ek: ["Smoluchowski μ = εζ/η (κa ≫ 1); Hückel μ = 2εζ/3η (κa ≪ 1); |ζ| > 30 mV usually stable."], p: [P1, P2], needs: [MT-3.1.A, MT-3.1.B], drills: [col-zeta-from-mobility, col-huckel-or-smoluchowski, col-zeta-stability] }
      - n: 2
        title: "Van der Waals forces between bodies"
        los:
          - { id: A, do: "Compute the van der Waals energy of spheres and plates from the Hamaker constant, and state its distance law.", ek: ["Spheres −AR/12D; sphere–wall −AR/6D; plates −A/12πD² per area (Derjaguin)."], p: [P1], needs: [MT-3.1.C], drills: [col-vdw-spheres, col-vdw-distance-law] }
          - { id: B, do: "Estimate a Hamaker constant across a medium with the combining rule.", ek: ["A₁₃₁ ≈ (√A₁₁ − √A₃₃)²."], p: [P1], needs: [MT-3.2.A], drills: [col-hamaker-combining, col-hamaker-same] }
      - n: 3
        title: "DLVO theory"
        los:
          - { id: A, do: "Compute the double-layer repulsion between spheres in the weak-overlap, low-potential limit.", ek: ["W = 2πεRψ₀²e^(−κD) for equal spheres."], p: [P1], needs: [MT-3.1.A, MT-3.2.B], drills: [col-edl-repulsion, col-edl-decay] }
          - { id: B, do: "Add attraction and repulsion into the DLVO curve, find the barrier, and read its minima.", ek: ["Primary minimum, barrier, secondary minimum; barriers above ~15–20 kT give stability."], p: [P1, P2], needs: [MT-3.3.A, MT-3.2.A], drills: [col-dlvo-total, col-dlvo-barrier, col-secondary-minimum] }
          - { id: C, do: "Predict how salt, valence, surface potential and Hamaker constant change stability, including the Schulze–Hardy rule.", ek: ["CCC where W = 0 and dW/dD = 0; c_ccc ∝ z⁻⁶ at high potential."], p: [P2], needs: [MT-3.3.B], drills: [col-salt-effect, col-schulze-hardy, col-ccc-condition] }
      - n: 4
        title: "Kinetics of aggregation and forces beyond DLVO"
        los:
          - { id: A, do: "Compute a Brownian diffusion coefficient with Stokes–Einstein.", ek: ["D = kT/6πηa."], p: [P1], needs: [MT-3.3.C], drills: [col-stokes-einstein, col-diffusion-time] }
          - { id: B, do: "Compute the half-life of rapid (barrierless) coagulation.", ek: ["k_f = 4kT/3η; t½ = 3η/4kTN₀."], p: [P1], needs: [MT-3.4.A], drills: [col-fast-coagulation, col-coag-scale] }
          - { id: C, do: "Recognise steric, depletion, bridging and hydration forces that DLVO leaves out.", ek: ["Polymers and solvent structure add terms DLVO lacks."], p: [P2], needs: [MT-3.3.B, MT-3.4.B], drills: [col-beyond-dlvo, col-nondlvo-scenario] }
  - id: corrosion
    n: 4
    title: "Material selection and corrosion"
    std: ["fe-chemical:4.A", "fe-chemical:4.B", "fe-chemical:4.C"]
    scope: extension
    ideas: [PROPS]
    topics:
      - n: 1
        title: "Choosing a material"
        los:
          - { id: A, std: ["fe-chemical:4.B"], do: "Choose a material class for a stated service from its temperature, pressure and chemistry", ek: ["Carbon steel is the default and everything else is justified against it: stainless for oxidising and mildly corrosive service, nickel alloys for hot chlorides and strong acids, titanium for seawater and wet chlorine, and polymers or linings where metals fail but temperature allows."], p: [P2], needs: [MT-2.1.B, CH-9.8.B], drills: [fe-material-pick, fe-upgrade-cost] }
          - { id: B, std: ["fe-chemical:4.B"], do: "Compute the wall thickness a stated corrosion allowance adds and the life it buys", ek: ["A corrosion allowance is thickness added beyond the pressure requirement, so the life it buys is the allowance over the corrosion rate; doubling the allowance doubles the life only if the rate stays constant, which is exactly what localised attack does not do."], p: [P1], needs: [MT-4.1.A], drills: [fe-corrosion-life, fe-allowance-needed] }
          - { id: C, std: ["fe-chemical:4.B"], do: "Decide whether a stated material pairing is compatible in service", ek: ["Compatibility is not just whether the metal dissolves: it covers embrittlement, stress-corrosion cracking, catalytic decomposition of the fluid and contamination of the product, and a compatibility chart is read for the fluid at the service temperature, not at room temperature."], p: [P2], needs: [MT-4.1.B], drills: [fe-compatibility, fe-stress-threshold] }
      - n: 2
        title: "Corrosion mechanisms"
        los:
          - { id: A, std: ["fe-chemical:4.C"], do: "Compute a corrosion rate from a mass-loss or thickness measurement", ek: ["A uniform rate in millimetres a year follows from mass loss over area, density and time, and it is the one corrosion mode a wall thickness can be designed against."], p: [P1], needs: [MT-4.1.C], drills: [fe-corrosion-rate, fe-rate-from-thickness] }
          - { id: B, std: ["fe-chemical:4.C"], do: "Identify the corrosion mechanism a stated failure describes", ek: ["Uniform attack thins the wall evenly; pitting and crevice attack concentrate it where the electrolyte is stagnant; galvanic attack puts the anode next to a more noble metal; stress-corrosion cracking needs tensile stress, a susceptible alloy and a specific environment together; and erosion-corrosion follows high velocity and solids."], p: [P2], needs: [MT-4.2.A], drills: [fe-mechanism-id, fe-pit-penetration] }
          - { id: C, std: ["fe-chemical:4.C"], do: "Predict which metal corrodes in a stated galvanic couple and how the area ratio changes the rate", ek: ["The less noble metal is the anode and corrodes, and the current it must carry is set by the cathode area, so a small anode next to a large cathode corrodes fast: a steel bolt in a stainless plate fails, while a stainless bolt in a steel plate does not."], p: [P2], needs: [MT-4.2.B], drills: [fe-area-ratio, fe-galvanic-which] }
      - n: 3
        title: "Corrosion control"
        los:
          - { id: A, std: ["fe-chemical:4.C"], do: "Compute a cathodic protection current from the area to be protected and a stated current density", ek: ["Cathodic protection makes the whole structure the cathode, either with a sacrificial anode of a less noble metal or with an impressed current, and the duty is the protected area times the current density the environment needs."], p: [P1], needs: [MT-4.2.C], drills: [fe-cp-current, fe-anode-life] }
          - { id: B, std: ["fe-chemical:4.C"], do: "State what a coating, an inhibitor and a passive film each do and how each fails", ek: ["A coating is a barrier that fails locally at a holiday, where attack then concentrates; an inhibitor changes the solution so the reaction slows, and fails when its concentration drops; a passive film is grown by the metal itself, and fails where chloride breaks it down or where oxygen cannot reach to repair it."], p: [P2], needs: [MT-4.3.A], drills: [fe-protection-fails, fe-coating-holiday] }

          - { id: B, std: ["usnco:1"], do: "Find the water of crystallisation of a hydrate.", ek: ["n = (mass of water / 18.015) / (mass of anhydrous salt / M)."], p: [P1], drills: [co-hydrate-n, co-hydrate-percent] }
          - { id: C, std: ["usnco:1"], do: "Prepare a solution of given molality.", ek: ["Molality is moles of solute per kilogram of solvent."], p: [P1], drills: [co-molality-mass, co-molality-from-percent] }
          - { id: D, std: ["usnco:1"], do: "Find a product yield from a limiting reagent.", ek: ["Convert both reactants to moles of product; the smaller wins."], p: [P1], drills: [co-limiting-yield, co-percent-yield] }
          - { id: E, std: ["usnco:1"], do: "Work a back titration.", ek: ["Excess reagent is titrated; what reacted is total minus excess."], p: [P1], drills: [co-back-titration, co-antacid-naoh] }
  - id: usnco-lab
    n: 6
    title: "USNCO band 2: descriptive chemistry and the laboratory"
    scope: core
    std: ["usnco:2"]
    ideas: [EXACT]
    topics:
      - n: 1
        title: "Descriptive and laboratory chemistry"
        los:
          - { id: A, std: ["usnco:2"], do: "Know flame-test colours.", ek: ["Li crimson, Na yellow, K lilac, Ca orange-red, Sr red, Ba pale green, Cu blue-green."], p: [P1], drills: [co-flame-test, co-flame-confusion] }
          - { id: B, std: ["usnco:2"], do: "Choose a reagent that tells two salts apart.", ek: ["Pick a reagent that gives a precipitate, gas or colour with one and not the other."], p: [P1], drills: [co-distinguish-salts, co-tell-apart] }
          - { id: C, std: ["usnco:2"], do: "Recall the colours of common precipitates and ions.", ek: ["AgCl white, AgBr cream, AgI yellow, PbI₂ bright yellow, Cu(OH)₂ blue, Fe(OH)₃ rust-brown, Fe(OH)₂ green, CuS and PbS black."], p: [P1], drills: [co-precipitate-colour, co-ppt-identify] }
          - { id: D, std: ["usnco:2"], do: "Choose a colorimeter wavelength.", ek: ["Measure at the colour the solution absorbs: the complement of the colour you see."], p: [P1], drills: [co-colorimeter-led, co-colour-complement] }
          - { id: E, std: ["usnco:2"], do: "Predict the direction of a laboratory error.", ek: ["Follow the error through the calculation: which measured quantity is too big or too small?"], p: [P1], drills: [co-lab-error, co-error-direction] }
          - { id: F, std: ["usnco:2"], do: "Correct a gas collected over water.", ek: ["p_gas = P_total − p_water; then n = pV/RT."], p: [P1], drills: [co-gas-over-water, co-wet-gas-volume] }
  - id: usnco-states
    n: 7
    title: "USNCO band 3: states of matter"
    scope: core
    std: ["usnco:3"]
    ideas: [EXACT]
    topics:
      - n: 1
        title: "Gases, liquids and solids"
        los:
          - { id: A, std: ["usnco:3"], do: "Find a density from a cubic unit cell.", ek: ["ρ = Z M / (N_A a³); Z = 1, 2, 4 for sc, bcc, fcc."], p: [P1], drills: [co-unit-cell-density, co-molar-mass-from-cell] }
          - { id: B, std: ["usnco:3"], do: "Give coordination numbers in common ionic structures.", ek: ["Rock salt 6:6; CsCl 8:8; zinc blende 4:4; fluorite Ca 8, F 4; rutile Ti 6, O 3."], p: [P1], drills: [co-coordination-structure, co-structure-cn] }
          - { id: C, std: ["usnco:3"], do: "Find how much liquid remains when some evaporates into a closed flask.", ek: ["Vapour moles = P_vap V/RT; if less than the total, the rest stays liquid."], p: [P1], drills: [co-liquid-remaining, co-vapour-pressure-evap] }
          - { id: D, std: ["usnco:3"], do: "Use Graham's law.", ek: ["Effusion rate ∝ 1/√M."], p: [P1], drills: [co-graham, co-graham-mass] }
          - { id: E, std: ["usnco:3"], do: "Rank substances by boiling or melting point.", ek: ["Ionic and network solids first; then hydrogen bonding; then dispersion, which grows with size and surface area."], p: [P1], drills: [co-boiling-rank, co-mp-rank] }
  - id: usnco-thermo
    n: 8
    title: "USNCO band 4: thermodynamics"
    scope: core
    std: ["usnco:4"]
    ideas: [EXACT]
    topics:
      - n: 1
        title: "Thermodynamics"
        los:
          - { id: A, std: ["usnco:4"], do: "Find K from ΔH° and ΔS° at a temperature.", ek: ["ΔG° = ΔH° − TΔS°; K = e^{−ΔG°/RT}."], p: [P1], drills: [co-k-from-dh-ds, co-dg-from-k] }
          - { id: B, std: ["usnco:4"], do: "Find the temperature at which a reaction becomes spontaneous.", ek: ["T = ΔH°/ΔS° when both have the same sign."], p: [P1], drills: [co-crossover-temperature, co-ds-from-crossover] }
          - { id: C, std: ["usnco:4"], do: "Find an enthalpy of solution from calorimetry.", ek: ["q = m c ΔT absorbed by the solution; ΔH_soln = −q/n."], p: [P1], drills: [co-enthalpy-solution, co-temp-change-solution] }
          - { id: D, std: ["usnco:4"], do: "Predict the sign of ΔS.", ek: ["More moles of gas, dissolving a solid, melting and mixing raise entropy; forming fewer, more ordered particles lowers it."], p: [P1], drills: [co-entropy-sign, co-ds-sign-2] }
          - { id: E, std: ["usnco:4"], do: "Close a Hess's-law cycle.", ek: ["Reverse and scale the given reactions until they add to the target; do the same to their ΔH."], p: [P1], drills: [co-hess-cycle, co-hf-from-hc] }
  - id: usnco-kinetics
    n: 9
    title: "USNCO band 5: kinetics"
    scope: core
    std: ["usnco:5"]
    ideas: [EXACT]
    topics:
      - n: 1
        title: "Kinetics"
        los:
          - { id: A, std: ["usnco:5"], do: "Find a reaction order from initial-rate data.", ek: ["Order = log(rate ratio)/log(concentration ratio)."], p: [P1], drills: [co-order-from-rates, co-rate-predict] }
          - { id: B, std: ["usnco:5"], do: "Find the rate law from a mechanism with a fast pre-equilibrium.", ek: ["Rate = k₂K₁[...]: substitute the intermediate from the equilibrium."], p: [P1], drills: [co-mechanism-rate-law, co-preequilibrium-order] }
          - { id: C, std: ["usnco:5"], do: "Find product fractions for parallel first-order reactions.", ek: ["Fraction of B = k_B/(k_B + k_C); with Arrhenius, the higher-Eₐ path grows with T."], p: [P1], drills: [co-parallel-arrhenius, co-equal-rate-temp] }
          - { id: D, std: ["usnco:5"], do: "Use a kinetic isotope effect.", ek: ["C–D bonds have lower zero-point energy than C–H, so breaking them in the rate-determining step is slower (k_H/k_D ≈ 2–7)."], p: [P1], drills: [co-isotope-effect, co-kie-from-freq] }
          - { id: E, std: ["usnco:5"], do: "Find the activity of a daughter after a decay chain reaches secular equilibrium.", ek: ["When the parent lives much longer, daughter activity equals parent activity."], p: [P1], drills: [co-secular-equilibrium, co-daughter-halflife] }

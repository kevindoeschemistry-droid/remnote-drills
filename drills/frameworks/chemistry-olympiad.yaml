  - id: usnco-redox
    n: 11
    title: "USNCO band 7: oxidation–reduction and electrochemistry"
    scope: core
    std: ["usnco:7"]
    ideas: [EXACT]
    topics:
      - n: 1
        title: "Redox and electrochemistry"
        los:
          - { id: A, std: ["usnco:7"], do: "Find an average oxidation state.", ek: ["Charge balance with the usual values for the other atoms."], p: [P1], drills: [co-average-ox-state, co-mixed-valence-fraction] }

          - { id: B, std: ["usnco:6"], do: "Find pKa from a percent ionisation.", ek: ["Ka = c α²/(1 − α)."], p: [P1], drills: [co-pka-from-ionisation, co-ionisation-from-pka] }
          - { id: C, std: ["usnco:6"], do: "Find a solubility enhanced by complex formation.", ek: ["AgCl + 2NH₃ ⇌ Ag(NH₃)₂⁺ + Cl⁻ with K = K_sp K_f; s ≈ √K [NH₃]."], p: [P1], drills: [co-complex-solubility, co-agcl-in-ammonia] }

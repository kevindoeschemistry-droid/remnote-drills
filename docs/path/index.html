<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a start-to-finish rail across the top, the frameworks in path order down the left, one framework's objectives on the right. */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #18202b; --muted: #5d6877; --line: #dde2e8; --accent: #2a5bd7;
  --ok: #1f8a4c; --part: #c27c0e; --gap: #b9c1cc;
  --t-math: #2a5bd7; --t-science: #138a72; --t-computing: #7a4bd0; --t-engineering: #c4561d;
  --t-health: #0f8299; --t-safety: #b8324a; --t-communication: #a07a12; --t-athletics: #c23f8f;
  --display: "Newsreader", Georgia, serif; --body: "Public Sans", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11151b; --panel: #181e26; --ink: #e5e9ef; --muted: #98a3b2; --line: #2a323d; --accent: #7aa2ff;
  --ok: #4cc685; --part: #e0a63a; --gap: #3b4552;
  --t-math: #7aa2ff; --t-science: #3cc7a6; --t-computing: #b08cf5; --t-engineering: #f08a52;
  --t-health: #3cc0d6; --t-safety: #f06b82; --t-communication: #e0b84a; --t-athletics: #f07ac2; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11151b; --panel: #181e26; --ink: #e5e9ef; --muted: #98a3b2; --line: #2a323d; --accent: #7aa2ff;
  --ok: #4cc685; --part: #e0a63a; --gap: #3b4552;
  --t-math: #7aa2ff; --t-science: #3cc7a6; --t-computing: #b08cf5; --t-engineering: #f08a52;
  --t-health: #3cc0d6; --t-safety: #f06b82; --t-communication: #e0b84a; --t-athletics: #f07ac2; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
header { padding: 20px 20px 10px; display: grid; gap: 10px; max-width: 1400px; margin: 0 auto; }
h1 { font: 600 30px/1.1 var(--display); margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 75ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
.stats b { color: var(--ink); font-weight: 600; }
.rail { display: flex; height: 26px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); background: var(--panel); }
.rail button { border: 0; border-right: 1px solid var(--panel); padding: 0; margin: 0; cursor: pointer; position: relative; background: var(--c); opacity: .35; min-width: 2px; }
.rail button .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--c); }
.rail button.on, .rail button:hover { opacity: 1; }
.rail button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.railnote { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; font-family: var(--mono); }
.search { display: flex; gap: 8px; }
.search input { flex: 1; font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
.search input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
main { display: grid; grid-template-columns: 290px 1fr; gap: 16px; padding: 0 20px 40px; max-width: 1400px; margin: 0 auto; align-items: start; }
nav { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.trk { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 10px 8px 4px; }
.fw { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: center; width: 100%; text-align: left; font: inherit; color: inherit; background: none; border: 0; border-radius: 7px; padding: 6px 8px; cursor: pointer; border-left: 3px solid var(--c); }
.fw:hover { background: color-mix(in srgb, var(--c) 9%, transparent); }
.fw.on { background: color-mix(in srgb, var(--c) 15%, transparent); }
.fw:focus-visible { outline: 2px solid var(--accent); }
.fw .num { font: 500 12px var(--mono); color: var(--muted); }
.fw .name { font-size: 14px; line-height: 1.25; }
.fw .cnt { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { grid-column: 2 / 4; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); }
section.view { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; min-width: 0; }
.vh { display: grid; gap: 6px; border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 4px; }
.vh h2 { font: 600 24px/1.15 var(--display); margin: 0; text-wrap: balance; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.chip { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; background: none; color: var(--ink); cursor: pointer; }
.chip:hover { border-color: var(--accent); color: var(--accent); }
.chip.track { border-color: var(--c); color: var(--c); cursor: default; }
h3 { font: 600 18px/1.25 var(--display); margin: 22px 0 4px; }
h3 .ext { font: 500 11px var(--body); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 3px; }
h4 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 4px; }
ol.los { list-style: none; margin: 0; padding: 0; }
.lo { display: grid; grid-template-columns: 52px 12px 1fr; gap: 4px 10px; padding: 7px 6px; border-radius: 7px; scroll-margin-top: 80px; }
.lo:target, .lo.flash { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.lo .pos { font: 12px var(--mono); color: var(--muted); text-align: right; padding-top: 2px; font-variant-numeric: tabular-nums; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: var(--gap); }
.dot.s2 { background: var(--ok); } .dot.s1 { background: linear-gradient(90deg, var(--part) 50%, var(--gap) 50%); }
.lo .txt { min-width: 0; }
.lo .code { font: 500 12px var(--mono); color: var(--muted); margin-right: 6px; }
.lo .std { font: 11px var(--mono); color: var(--muted); }
.lo .ek { color: var(--muted); font-size: 13px; margin-top: 2px; }
.lo .needs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend .dot { margin: 0; }
.results .lo { grid-template-columns: 52px 12px 1fr; }
.results .fwname { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); padding: 20px 0; }
@media (max-width: 820px) {
  main { grid-template-columns: 1fr; padding: 0 16px 32px; }
  header { padding: 16px 16px 8px; }
  nav { position: static; max-height: 260px; }
  .lo { grid-template-columns: 40px 12px 1fr; }
}
@media (prefers-reduced-motion: no-preference) { .lo.flash { transition: background .6s; } }
</style>
</head>
<body>
<header>
  <h1>The Path</h1>
  <p class="sub">Every learning objective from counting to 100 through graduate engineering, in order. Frameworks follow what they require, and each objective comes after the prerequisites it needs.</p>
  <div class="stats" id="stats"></div>
  <div class="rail" id="rail" aria-label="The path from start to finish, one segment per framework"></div>
  <div class="railnote"><span>1 · start</span><span id="railend"></span></div>
  <div class="search"><input id="q" type="search" placeholder="Search objectives, codes or standards (e.g. Laplace, K.OA.A.2, LIM-1)" aria-label="Search objectives"></div>
  <div class="legend"><span><i class="dot s2"></i>drilled</span><span><i class="dot s1"></i>partly drilled</span><span><i class="dot"></i>no drills yet</span></div>
</header>
<main>
  <nav id="nav" aria-label="Frameworks in path order"></nav>
  <section class="view" id="view" aria-live="polite"></section>
</main>
<script>
const FW = [{"id":"math-k8","title":"Mathematics K–8 (Common Core)","code":"MK","track":"math","requires":[],"units":[{"n":1,"title":"Kindergarten — counting, adding and subtracting within 10, shapes","scope":"core","topics":[{"n":1,"title":"Counting and Cardinality","los":[["MK-1.1.A",1,"Count to 100 by ones and by tens.","The counting sequence follows a repeating pattern of ones inside a pattern of tens.","K.CC.A.1","",0],["MK-1.1.B",2,"Count forward beginning from a given number within the known sequence (instead of having to begin at 1).","Any number in the sequence can be a starting point; the next number is always one more.","K.CC.A.2","MK-1.1.A",0],["MK-1.1.C",3,"Write numbers from 0 to 20 and represent a number of objects with a written numeral 0–20 (0 = no objects).","A numeral is a symbol for how many; 0 names an empty set.","K.CC.A.3","MK-1.1.A",0],["MK-1.1.D",4,"Count objects by saying the number names in standard order, pairing each object with one and only one number name.","One-to-one correspondence; the last number said is how many (cardinality), whatever the order counted; each successive number is one larger.","K.CC.B.4a, K.CC.B.4b, K.CC.B.4c","MK-1.1.A",0],["MK-1.1.E",5,"Count to answer \"how many?\" for up to 20 objects in a line, array or circle (10 scattered), and count out that many objects given a number 1–20.","Arrangement does not change how many; scattered sets need a way to track what was counted.","K.CC.B.5","MK-1.1.D",0],["MK-1.1.F",6,"Identify whether the number of objects in one group is greater than, less than, or equal to the number in another group (up to 10).","Compare by matching one-to-one or by counting; leftover objects mean more.","K.CC.C.6","MK-1.1.E",0],["MK-1.1.G",7,"Compare two numbers between 1 and 10 presented as written numerals.","A number later in the counting sequence is greater.","K.CC.C.7","MK-1.1.F MK-1.1.C",0]]},{"n":2,"title":"Operations and Algebraic Thinking","los":[["MK-1.2.A",8,"Represent addition and subtraction with objects, fingers, drawings, sounds, acting out situations, expressions or equations.","Addition is putting together or adding to; subtraction is taking apart or taking from.","K.OA.A.1","MK-1.1.E",0],["MK-1.2.B",9,"Solve addition and subtraction word problems, and add and subtract within 10 (e.g. 1 + 1), using objects or drawings.","Act out the story: join the groups and count all, or remove and count what is left.","K.OA.A.2","MK-1.2.A",0],["MK-1.2.C",10,"Decompose numbers less than or equal to 10 into pairs in more than one way (5 = 2 + 3 = 4 + 1).","A number is made of parts; the same whole splits many ways.","K.OA.A.3","MK-1.2.A",0],["MK-1.2.D",11,"For any number 1 to 9, find the number that makes 10 when added to it.","Partners of ten: 1+9, 2+8, 3+7, 4+6, 5+5.","K.OA.A.4","MK-1.2.C",0],["MK-1.2.E",12,"Fluently add and subtract within 5.","Facts within 5 are known, not counted out.","K.OA.A.5","MK-1.2.B MK-1.2.C",0]]},{"n":3,"title":"Number and Operations in Base Ten","los":[["MK-1.3.A",13,"Compose and decompose numbers from 11 to 19 into ten ones and some further ones (18 = 10 + 8).","Teen numbers are ten ones and some more ones.","K.NBT.A.1","MK-1.2.D MK-1.1.E",0]]},{"n":4,"title":"Measurement and Data","los":[["MK-1.4.A",14,"Describe measurable attributes of objects, such as length or weight, and several attributes of one object.","An object has several attributes that can be measured.","K.MD.A.1","",0],["MK-1.4.B",15,"Directly compare two objects with a measurable attribute in common and say which has more or less of it.","Line objects up from a common start to compare length.","K.MD.A.2","MK-1.4.A",0],["MK-1.4.C",16,"Classify objects into given categories, count the objects in each category, and sort the categories by count (counts ≤ 10).","Sorting then counting turns a pile into data.","K.MD.B.3","MK-1.1.E",0]]},{"n":5,"title":"Geometry","los":[["MK-1.5.A",17,"Describe objects in the environment using names of shapes and their relative positions (above, below, beside, in front of, behind, next to).","Position words describe where an object is relative to another.","K.G.A.1","",0],["MK-1.5.B",18,"Name shapes correctly regardless of their orientation or overall size.","A shape keeps its name when it is turned or resized.","K.G.A.2","",0],["MK-1.5.C",19,"Identify shapes as two-dimensional (flat) or three-dimensional (solid).","Flat shapes have length and width; solids also have depth.","K.G.A.3","MK-1.5.B",0],["MK-1.5.D",20,"Analyze and compare two- and three-dimensional shapes by their parts and attributes (number of sides, vertices, equal sides).","Shapes are defined by their parts, not by how they look at first glance.","K.G.B.4","MK-1.5.B MK-1.5.C",0],["MK-1.5.E",21,"Model shapes by building them from components (sticks, clay) and drawing them.","Building a shape requires knowing its parts.","K.G.B.5","MK-1.5.D",0],["MK-1.5.F",22,"Compose simple shapes to form larger shapes (two triangles make a rectangle).","Shapes combine into new shapes.","K.G.B.6","MK-1.5.D",0]]}]},{"n":2,"title":"Grade 1 — addition and subtraction within 20, tens and ones, length units","scope":"core","topics":[{"n":1,"title":"Operations and Algebraic Thinking","los":[["MK-2.1.A",23,"Use addition and subtraction within 20 to solve word problems (adding to, taking from, putting together, taking apart, comparing) with unknowns in all positions.","The same situation can hide the result, the change or the start; an equation with a symbol for the unknown records it.","1.OA.A.1","MK-1.2.B",0],["MK-2.1.B",24,"Solve word problems that call for adding three whole numbers whose sum is ≤ 20.","Add three numbers by adding two, then the third.","1.OA.A.2","MK-2.1.A",0],["MK-2.1.C",25,"Apply the commutative and associative properties of addition as strategies (8+3 = 3+8; 2+6+4 = 2+10).","Order and grouping don't change a sum.","1.OA.B.3","MK-1.2.C",0],["MK-2.1.D",26,"Understand subtraction as an unknown-addend problem (10 − 8 as 8 + ? = 10).","Subtraction finds a missing part.","1.OA.B.4","MK-1.2.A",0],["MK-2.1.E",27,"Relate counting to addition and subtraction (counting on 2 to add 2).","Adding n means counting on n; subtracting means counting back.","1.OA.C.5","MK-1.1.B",0],["MK-2.1.F",28,"Add and subtract within 20, fluently within 10, using strategies such as making ten, decomposing to ten, and known sums (8+6 = 8+2+4).","Making ten turns a hard fact into an easy one.","1.OA.C.6","MK-1.2.D MK-1.2.E MK-2.1.C MK-2.1.D MK-2.1.E",0],["MK-2.1.G",29,"Understand the meaning of the equal sign and decide whether equations like 6 = 6, 7 = 8 − 1, 5 + 2 = 2 + 5 are true or false.","= means \"the same amount as\", not \"the answer comes next\".","1.OA.D.7","MK-1.2.C",0],["MK-2.1.H",30,"Determine the unknown whole number in an addition or subtraction equation relating three whole numbers (8 + ? = 11).","Any of the three numbers can be the unknown.","1.OA.D.8","MK-2.1.G MK-2.1.D",0]]},{"n":2,"title":"Number and Operations in Base Ten","los":[["MK-2.2.A",31,"Count to 120 starting at any number less than 120; read and write numerals in this range.","The tens-and-ones pattern continues past 100.","1.NBT.A.1","MK-1.1.B MK-1.1.C",0],["MK-2.2.B",32,"Understand that the two digits of a two-digit number represent amounts of tens and ones (10 is a bundle of ten ones; 11–19 are a ten and some ones; 10, 20 … 90 are tens and 0 ones).","Place determines value: the left digit counts tens.","1.NBT.B.2a, 1.NBT.B.2b, 1.NBT.B.2c","MK-1.3.A",0],["MK-2.2.C",33,"Compare two two-digit numbers based on the meanings of the tens and ones digits, recording with >, =, \u003c.","Compare tens first; ones only break a tie.","1.NBT.B.3","MK-2.2.B MK-1.1.G",0],["MK-2.2.D",34,"Add within 100 (two-digit + one-digit, two-digit + a multiple of 10) using models and place-value strategies, composing a ten when needed.","Add tens to tens and ones to ones; ten ones make a new ten.","1.NBT.C.4","MK-2.2.B MK-2.1.F",0],["MK-2.2.E",35,"Given a two-digit number, mentally find 10 more or 10 less without counting.","Adding or taking 10 changes only the tens digit.","1.NBT.C.5","MK-2.2.B",0],["MK-2.2.F",36,"Subtract multiples of 10 in the range 10–90 from multiples of 10 in the same range.","70 − 30 is 7 tens − 3 tens = 4 tens.","1.NBT.C.6","MK-2.2.E MK-2.1.D",0]]},{"n":3,"title":"Measurement and Data","los":[["MK-2.3.A",37,"Order three objects by length, and compare the lengths of two objects indirectly by using a third object.","If A is longer than C and C is longer than B, then A is longer than B (transitivity).","1.MD.A.1","MK-1.4.B",0],["MK-2.3.B",38,"Express the length of an object as a whole number of length units by laying copies of a shorter unit end to end with no gaps or overlaps.","Length = number of same-size units that span it.","1.MD.A.2","MK-2.3.A MK-1.1.E",0],["MK-2.3.C",39,"Tell and write time in hours and half-hours using analog and digital clocks.","The hour hand points between numbers at the half hour.","1.MD.B.3","MK-2.2.A",0],["MK-2.3.D",40,"Organize, represent and interpret data with up to three categories; ask and answer how many in each and how many more or less.","Comparing category counts is a compare-type subtraction problem.","1.MD.C.4","MK-1.4.C MK-2.1.A",0]]},{"n":4,"title":"Geometry","los":[["MK-2.4.A",41,"Distinguish defining attributes (triangles are closed and three-sided) from non-defining ones (color, orientation, size); build and draw shapes with given attributes.","A shape's name depends only on its defining attributes.","1.G.A.1","MK-1.5.D",0],["MK-2.4.B",42,"Compose two- or three-dimensional shapes into a composite shape, and compose new shapes from it.","Composite shapes can be treated as units.","1.G.A.2","MK-1.5.F",0],["MK-2.4.C",43,"Partition circles and rectangles into two and four equal shares, using halves, fourths and quarters; more equal shares make smaller shares.","Equal shares of one whole are the same size.","1.G.A.3","MK-2.4.A",0]]}]},{"n":3,"title":"Grade 2 — base ten to 1000, fluency within 100, standard length units","scope":"core","topics":[{"n":1,"title":"Operations and Algebraic Thinking","los":[["MK-3.1.A",44,"Use addition and subtraction within 100 to solve one- and two-step word problems with unknowns in all positions.","Two-step problems chain two situations; an equation with a symbol records each step.","2.OA.A.1","MK-2.1.A MK-2.2.D",0],["MK-3.1.B",45,"Fluently add and subtract within 20 using mental strategies; know from memory all sums of two one-digit numbers.","Single-digit sums are recalled, not computed.","2.OA.B.2","MK-2.1.F",0],["MK-3.1.C",46,"Determine whether a group of up to 20 objects has an odd or even number of members (pairing, counting by 2s); write an even number as a sum of two equal addends.","Even numbers split into two equal groups or pairs with none left.","2.OA.C.3","MK-2.1.F",0],["MK-3.1.D",47,"Use addition to find the total in a rectangular array with up to 5 rows and 5 columns; write an equation as a sum of equal addends.","An array is equal rows; total = repeated addition of a row.","2.OA.C.4","MK-3.1.C",0]]},{"n":2,"title":"Number and Operations in Base Ten","los":[["MK-3.2.A",48,"Understand that the three digits of a three-digit number represent hundreds, tens and ones; 100 is a bundle of ten tens.","Each place is ten of the place to its right.","2.NBT.A.1a, 2.NBT.A.1b","MK-2.2.B",0],["MK-3.2.B",49,"Count within 1000; skip-count by 5s, 10s and 100s.","Skip-counting by 10s or 100s changes one digit at a time.","2.NBT.A.2","MK-2.2.A MK-3.2.A",0],["MK-3.2.C",50,"Read and write numbers to 1000 using base-ten numerals, number names and expanded form.","Expanded form shows each digit's value: 352 = 300 + 50 + 2.","2.NBT.A.3","MK-3.2.A",0],["MK-3.2.D",51,"Compare two three-digit numbers based on the meanings of the digits, using >, =, \u003c.","Compare from the largest place down.","2.NBT.A.4","MK-3.2.A MK-2.2.C",0],["MK-3.2.E",52,"Fluently add and subtract within 100 using strategies based on place value, properties of operations, and the relationship between addition and subtraction.","Decompose by place, then combine like units.","2.NBT.B.5","MK-2.2.D MK-2.2.F MK-3.1.B",0],["MK-3.2.F",53,"Add up to four two-digit numbers using strategies based on place value and properties of operations.","Group tens with tens, ones with ones, in any order.","2.NBT.B.6","MK-3.2.E",0],["MK-3.2.G",54,"Add and subtract within 1000 using models, drawings and place-value strategies, composing or decomposing tens and hundreds as needed.","Ten tens make a hundred; a hundred can be broken into ten tens.","2.NBT.B.7","MK-3.2.E MK-3.2.A",0],["MK-3.2.H",55,"Mentally add or subtract 10 or 100 to or from a number 100–900.","Adding 10 or 100 changes only that digit (unless it regroups).","2.NBT.B.8","MK-2.2.E MK-3.2.A",0],["MK-3.2.I",56,"Explain why addition and subtraction strategies work, using place value and the properties of operations.","A strategy is valid because of place value and the properties, not because it gives the right answer once.","2.NBT.B.9","MK-3.2.G",0]]},{"n":3,"title":"Measurement and Data","los":[["MK-3.3.A",57,"Measure the length of an object by selecting and using an appropriate tool (ruler, yardstick, meter stick, measuring tape).","A ruler is a row of iterated units with 0 at the start.","2.MD.A.1","MK-2.3.B",0],["MK-3.3.B",58,"Measure an object twice using units of different lengths and describe how the measurements relate to the unit size.","Bigger unit → fewer units; the count and unit size vary inversely.","2.MD.A.2","MK-3.3.A",0],["MK-3.3.C",59,"Estimate lengths using units of inches, feet, centimeters and meters.","Benchmarks (a finger ≈ 1 cm, a door ≈ 2 m) make estimates.","2.MD.A.3","MK-3.3.A",0],["MK-3.3.D",60,"Measure to determine how much longer one object is than another, in a standard length unit.","Difference in length = longer measure − shorter measure.","2.MD.A.4","MK-3.3.A",0],["MK-3.3.E",61,"Use addition and subtraction within 100 to solve word problems involving lengths in the same units.","Lengths add and subtract like numbers when the units match.","2.MD.B.5","MK-3.3.D MK-3.1.A",0],["MK-3.3.F",62,"Represent whole numbers as lengths from 0 on a number line with equally spaced points, and represent sums and differences within 100 on it.","A number on the line is a distance from 0.","2.MD.B.6","MK-3.3.A MK-3.2.E",0],["MK-3.3.G",63,"Tell and write time from analog and digital clocks to the nearest five minutes, using a.m. and p.m.","Each numeral on the clock marks 5 minutes.","2.MD.C.7","MK-2.3.C MK-3.2.B",0],["MK-3.3.H",64,"Solve word problems involving dollar bills, quarters, dimes, nickels and pennies, using $ and ¢ symbols.","Coin values: 25¢, 10¢, 5¢, 1¢; count from the largest.","2.MD.C.8","MK-3.1.A MK-3.2.B",0],["MK-3.3.I",65,"Generate length data by measuring several objects to the nearest whole unit and show it on a line plot.","A line plot puts one mark per measurement above a number line.","2.MD.D.9","MK-3.3.A MK-3.3.F",0],["MK-3.3.J",66,"Draw a picture graph and a bar graph (single-unit scale) for up to four categories, and solve put-together, take-apart and compare problems from it.","Bar height or picture count = category count.","2.MD.D.10","MK-2.3.D",0]]},{"n":4,"title":"Geometry","los":[["MK-3.4.A",67,"Recognize and draw shapes with specified attributes (number of angles or faces); identify triangles, quadrilaterals, pentagons, hexagons and cubes.","Polygons are named by their number of sides/angles.","2.G.A.1","MK-2.4.A",0],["MK-3.4.B",68,"Partition a rectangle into rows and columns of same-size squares and count to find the total number of them.","Rows × columns of squares foreshadows area and multiplication.","2.G.A.2","MK-3.1.D MK-2.4.B",0],["MK-3.4.C",69,"Partition circles and rectangles into two, three or four equal shares, described as halves, thirds, fourths; recognize equal shares need not have the same shape.","Equal shares have equal size, not necessarily equal shape.","2.G.A.3","MK-2.4.C",0]]}]},{"n":4,"title":"Grade 3 — multiplication and division within 100, unit fractions, area","scope":"core","topics":[{"n":1,"title":"Operations and Algebraic Thinking","los":[["MK-4.1.A",70,"Interpret products of whole numbers (5 × 7 as the total in 5 groups of 7 objects).","a × b = a groups of b.","3.OA.A.1","MK-3.1.D MK-3.4.B",0],["MK-4.1.B",71,"Interpret whole-number quotients (56 ÷ 8 as the number in each share, or the number of shares).","Division asks either \"how many in each group?\" or \"how many groups?\".","3.OA.A.2","MK-4.1.A",0],["MK-4.1.C",72,"Use multiplication and division within 100 to solve word problems with equal groups, arrays and measurement quantities.","Identify which of group size, number of groups, or total is unknown.","3.OA.A.3","MK-4.1.A MK-4.1.B",0],["MK-4.1.D",73,"Determine the unknown whole number in a multiplication or division equation relating three whole numbers (8 × ? = 48).","Any of the three numbers in a × b = c can be the unknown.","3.OA.A.4","MK-4.1.C MK-2.1.H",0],["MK-4.1.E",74,"Apply the commutative, associative and distributive properties as strategies to multiply and divide.","8 × 7 = 8 × 5 + 8 × 2; order and grouping don't change a product.","3.OA.B.5","MK-4.1.A MK-2.1.C",0],["MK-4.1.F",75,"Understand division as an unknown-factor problem (32 ÷ 8 is the number that makes 32 when multiplied by 8).","Every division fact is a multiplication fact with a missing factor.","3.OA.B.6","MK-4.1.B MK-2.1.D",0],["MK-4.1.G",76,"Fluently multiply and divide within 100; know from memory all products of two one-digit numbers.","Single-digit products are recalled, not computed.","3.OA.C.7","MK-4.1.E MK-4.1.F",0],["MK-4.1.H",77,"Solve two-step word problems using the four operations, representing them with equations with a letter for the unknown, and check answers by mental computation and estimation.","Write each step as an equation; estimate to catch wrong-operation errors.","3.OA.D.8","MK-4.1.C MK-3.1.A",0],["MK-4.1.I",78,"Identify arithmetic patterns (including in the addition and multiplication tables) and explain them using properties of operations.","4 × any number is even because 4 × n = 2 × (2 × n).","3.OA.D.9","MK-4.1.G",0]]},{"n":2,"title":"Number and Operations in Base Ten","los":[["MK-4.2.A",79,"Use place value understanding to round whole numbers to the nearest 10 or 100.","Round to the nearer multiple; halfway rounds up.","3.NBT.A.1","MK-3.2.D MK-3.3.F",0],["MK-4.2.B",80,"Fluently add and subtract within 1000 using strategies and algorithms based on place value, properties, and the add–subtract relationship.","Regroup across places: ten ones = one ten, ten tens = one hundred.","3.NBT.A.2","MK-3.2.G MK-3.2.I",0],["MK-4.2.C",81,"Multiply one-digit whole numbers by multiples of 10 in the range 10–90 (9 × 80, 5 × 60).","9 × 80 = 9 × 8 tens = 72 tens.","3.NBT.A.3","MK-4.1.G MK-3.2.A",0]]},{"n":3,"title":"Number and Operations—Fractions","los":[["MK-4.3.A",82,"Understand a fraction 1/b as one part when a whole is partitioned into b equal parts, and a/b as a parts of size 1/b.","The denominator names the size of the part; the numerator counts parts.","3.NF.A.1","MK-3.4.C",0],["MK-4.3.B",83,"Represent 1/b on a number line by partitioning 0 to 1 into b equal parts; each part has size 1/b and its endpoint locates 1/b.","Fractions are numbers: points on the same line as whole numbers.","3.NF.A.2a","MK-4.3.A MK-3.3.F",0],["MK-4.3.C",84,"Represent a/b on a number line by marking off a lengths of 1/b from 0.","a/b is a jumps of size 1/b from 0.","3.NF.A.2b","MK-4.3.B",0],["MK-4.3.D",85,"Explain equivalence of fractions as being the same size or the same point on a number line; recognize and generate simple equivalent fractions (1/2 = 2/4, 4/6 = 2/3) with a visual model.","Equivalent fractions name the same point with different-size parts.","3.NF.A.3a, 3.NF.A.3b","MK-4.3.C",0],["MK-4.3.E",86,"Express whole numbers as fractions and recognize fractions equivalent to whole numbers (3 = 3/1; 4/4 = 1).","b/b = 1, and n/1 = n.","3.NF.A.3c","MK-4.3.D",0],["MK-4.3.F",87,"Compare two fractions with the same numerator or the same denominator by reasoning about their size, recording with >, =, \u003c; comparisons are valid only for the same whole.","Same denominator: more parts is more. Same numerator: smaller parts (bigger denominator) is less.","3.NF.A.3d","MK-4.3.D",0]]},{"n":4,"title":"Measurement and Data","los":[["MK-4.4.A",88,"Tell and write time to the nearest minute; measure time intervals in minutes and solve elapsed-time word problems (e.g. on a number line).","Elapsed time is a difference; jump to the next hour on a number line.","3.MD.A.1","MK-3.3.G MK-3.3.F",0],["MK-4.4.B",89,"Measure and estimate liquid volumes and masses in g, kg and L; solve one-step word problems with them using the four operations.","Volume and mass add like lengths when units match.","3.MD.A.2","MK-4.1.C MK-3.3.A",0],["MK-4.4.C",90,"Draw a scaled picture graph and scaled bar graph for several categories, and solve one- and two-step \"how many more/less\" problems from them.","In a scaled graph each symbol or grid step stands for several units.","3.MD.B.3","MK-3.3.J MK-4.1.C",0],["MK-4.4.D",91,"Measure lengths with rulers marked in halves and fourths of an inch and show the data on a line plot in whole numbers, halves or quarters.","Ruler marks between whole numbers are fractions on a number line.","3.MD.B.4","MK-3.3.I MK-4.3.C",0],["MK-4.4.E",92,"Recognize area as an attribute of plane figures: a unit square has one square unit of area, and a figure covered by n unit squares without gaps or overlaps has area n.","Area counts unit squares that cover a region.","3.MD.C.5a, 3.MD.C.5b","MK-3.4.B",0],["MK-4.4.F",93,"Measure areas by counting unit squares (square cm, square m, square in, square ft, and improvised units).","Area = number of unit squares, labeled with the square unit.","3.MD.C.6","MK-4.4.E",0],["MK-4.4.G",94,"Find the area of a rectangle with whole-number sides by tiling it and show it equals the product of the side lengths; multiply side lengths to solve area problems.","Area of a rectangle = rows × columns = length × width.","3.MD.C.7a, 3.MD.C.7b","MK-4.4.F MK-4.1.A",0],["MK-4.4.H",95,"Use tiling to show that a rectangle with sides a and b + c has area a × b + a × c (area models for the distributive property).","Split a rectangle and the areas add: a(b + c) = ab + ac.","3.MD.C.7c","MK-4.4.G MK-4.1.E",0],["MK-4.4.I",96,"Find areas of rectilinear figures by decomposing them into non-overlapping rectangles and adding the areas.","Area is additive.","3.MD.C.7d","MK-4.4.G",0],["MK-4.4.J",97,"Solve perimeter problems: find the perimeter from side lengths, find an unknown side, and show rectangles with the same perimeter and different areas or the same area and different perimeters.","Perimeter is a length around; area is the space inside — they vary independently.","3.MD.D.8","MK-4.4.G MK-3.3.E",0]]},{"n":5,"title":"Geometry","los":[["MK-4.5.A",98,"Understand that shapes in different categories may share attributes that define a larger category; recognize rhombuses, rectangles and squares as quadrilaterals and draw quadrilaterals that are none of these.","Categories nest: every square is a rectangle and a rhombus, and all are quadrilaterals.","3.G.A.1","MK-3.4.A",0],["MK-4.5.B",99,"Partition shapes into parts with equal areas and express the area of each part as a unit fraction of the whole.","Equal-area parts of a whole are each 1/b of it.","3.G.A.2","MK-4.3.A MK-4.4.E",0]]}]},{"n":5,"title":"Grade 4 — multi-digit arithmetic, fraction equivalence and operations, angles","scope":"core","topics":[{"n":1,"title":"Operations and Algebraic Thinking","los":[["MK-5.1.A",100,"Interpret a multiplication equation as a comparison (35 = 5 × 7 as 35 is 5 times as many as 7) and write comparisons as equations.","\"Times as many\" is multiplicative comparison, not additive.","4.OA.A.1","MK-4.1.A",0],["MK-5.1.B",101,"Multiply or divide to solve word problems involving multiplicative comparison, distinguishing it from additive comparison.","\"3 times as many\" multiplies; \"3 more than\" adds.","4.OA.A.2","MK-5.1.A MK-4.1.C",0],["MK-5.1.C",102,"Solve multistep word problems with whole numbers and the four operations, including problems where remainders must be interpreted; check with estimation.","A remainder may be dropped, rounded up, or reported, depending on the context.","4.OA.A.3","MK-4.1.H",0],["MK-5.1.D",103,"Find all factor pairs of a whole number 1–100, recognize it as a multiple of each factor, and determine whether it is prime or composite.","A prime has exactly two factors, 1 and itself.","4.OA.B.4","MK-4.1.G",0],["MK-5.1.E",104,"Generate a number or shape pattern that follows a given rule and identify features of the pattern not explicit in the rule.","Rule \"add 3\" from 1 gives alternating odd and even numbers.","4.OA.C.5","MK-4.1.I",0]]},{"n":2,"title":"Number and Operations in Base Ten","los":[["MK-5.2.A",105,"Recognize that in a multi-digit whole number a digit in one place represents ten times what it represents in the place to its right (700 ÷ 70 = 10).","Each place is worth 10 × the place to its right.","4.NBT.A.1","MK-4.2.C MK-3.2.A",0],["MK-5.2.B",106,"Read and write multi-digit whole numbers using base-ten numerals, number names and expanded form; compare two multi-digit numbers with >, =, \u003c.","Compare digit by digit from the largest place.","4.NBT.A.2","MK-5.2.A MK-3.2.C MK-3.2.D",0],["MK-5.2.C",107,"Use place value understanding to round multi-digit whole numbers to any place.","Look one place to the right of the rounding place.","4.NBT.A.3","MK-4.2.A MK-5.2.B",0],["MK-5.2.D",108,"Fluently add and subtract multi-digit whole numbers using the standard algorithm.","The standard algorithm is place-value regrouping written compactly.","4.NBT.B.4","MK-4.2.B MK-5.2.A",0],["MK-5.2.E",109,"Multiply a whole number of up to four digits by a one-digit number, and two two-digit numbers, using place-value strategies and properties; illustrate with equations, arrays and area models.","Partial products: 23 × 45 = 20×40 + 20×5 + 3×40 + 3×5.","4.NBT.B.5","MK-4.2.C MK-4.1.E MK-4.4.H MK-5.2.A",0],["MK-5.2.F",110,"Find whole-number quotients and remainders with up to four-digit dividends and one-digit divisors using place-value strategies and the multiplication–division relationship.","Divide place by place, or subtract chunks of the divisor; check by multiplying back.","4.NBT.B.6","MK-5.2.E MK-4.1.F",0]]},{"n":3,"title":"Number and Operations—Fractions","los":[["MK-5.3.A",111,"Explain why a/b = (n × a)/(n × b) using visual fraction models, and use this to recognize and generate equivalent fractions.","Multiplying numerator and denominator by n splits each part into n smaller parts — same amount.","4.NF.A.1","MK-4.3.D MK-4.1.G",0],["MK-5.3.B",112,"Compare two fractions with different numerators and different denominators by creating common denominators or numerators or comparing to a benchmark like 1/2.","Rename to a common unit, then compare counts.","4.NF.A.2","MK-5.3.A MK-4.3.F",0],["MK-5.3.C",113,"Understand addition and subtraction of fractions as joining and separating parts referring to the same whole.","Adding fractions with the same denominator adds numbers of same-size parts.","4.NF.B.3a","MK-4.3.A",0],["MK-5.3.D",114,"Decompose a fraction into a sum of fractions with the same denominator in more than one way (3/8 = 1/8 + 2/8; 2 1/8 = 1 + 1 + 1/8 = 8/8 + 8/8 + 1/8).","A fraction is a sum of unit fractions.","4.NF.B.3b","MK-5.3.C",0],["MK-5.3.E",115,"Add and subtract mixed numbers with like denominators by replacing each with an equivalent fraction or using properties of operations.","Mixed number a b/c = a + b/c; regroup a whole as c/c when needed.","4.NF.B.3c","MK-5.3.D MK-4.3.E",0],["MK-5.3.F",116,"Solve word problems involving addition and subtraction of fractions referring to the same whole and having like denominators.","Only parts of the same whole can be combined.","4.NF.B.3d","MK-5.3.E",0],["MK-5.3.G",117,"Understand a/b as a multiple of 1/b and multiply a fraction by a whole number: n × (a/b) = (n × a)/b.","3 × 2/5 = 6 × 1/5 = 6/5.","4.NF.B.4a, 4.NF.B.4b","MK-5.3.D MK-4.1.A",0],["MK-5.3.H",118,"Solve word problems involving multiplication of a fraction by a whole number.","\"5 people each eat 3/8 lb\" is 5 × 3/8.","4.NF.B.4c","MK-5.3.G",0],["MK-5.3.I",119,"Express a fraction with denominator 10 as an equivalent fraction with denominator 100, and add two fractions with denominators 10 and 100 (3/10 + 4/100 = 34/100).","1/10 = 10/100.","4.NF.C.5","MK-5.3.A MK-5.3.C",0],["MK-5.3.J",120,"Use decimal notation for fractions with denominators 10 or 100 (0.62 = 62/100) and locate them on a number line.","Decimal places continue base ten to the right: tenths, hundredths.","4.NF.C.6","MK-5.3.I MK-5.2.A",0],["MK-5.3.K",121,"Compare two decimals to hundredths by reasoning about their size, recording with >, =, \u003c; comparisons are valid only for the same whole.","0.5 > 0.45 because 50 hundredths > 45 hundredths.","4.NF.C.7","MK-5.3.J MK-5.3.B",0]]},{"n":4,"title":"Measurement and Data","los":[["MK-5.4.A",122,"Know relative sizes of units in one system (km, m, cm; kg, g; lb, oz; l, ml; hr, min, sec) and express a larger-unit measurement in a smaller unit, recording equivalents in a two-column table.","1 m = 100 cm, 1 kg = 1000 g, 1 lb = 16 oz, 1 hr = 60 min: convert to smaller units by multiplying.","4.MD.A.1","MK-5.1.A MK-4.4.B",0],["MK-5.4.B",123,"Use the four operations to solve word problems involving distances, time intervals, liquid volumes, masses and money, including simple fractions or decimals; represent quantities on number line diagrams.","Convert to one unit first, then operate.","4.MD.A.2","MK-5.4.A MK-5.3.F MK-4.4.A",0],["MK-5.4.C",124,"Apply the area and perimeter formulas for rectangles in real-world and mathematical problems, including finding an unknown side.","A = l × w; P = 2l + 2w.","4.MD.A.3","MK-4.4.G MK-4.4.J MK-5.2.E",0],["MK-5.4.D",125,"Make a line plot of measurements in fractions of a unit (1/2, 1/4, 1/8) and solve addition and subtraction of fractions using it.","Line-plot marks are data on a fraction number line.","4.MD.B.4","MK-4.4.D MK-5.3.F",0],["MK-5.4.E",126,"Recognize an angle as two rays sharing an endpoint and measure it against a circle: a one-degree angle turns through 1/360 of a circle; n one-degree angles make n degrees.","An angle measures turn, as a fraction of a full circle (360°).","4.MD.C.5a, 4.MD.C.5b","MK-4.3.A",0],["MK-5.4.F",127,"Measure angles in whole-number degrees with a protractor and sketch angles of a specified measure.","Line one ray up with 0 on the protractor and read the scale that starts there.","4.MD.C.6","MK-5.4.E",0],["MK-5.4.G",128,"Recognize angle measure as additive and solve addition and subtraction problems to find unknown angles on a diagram.","Adjacent non-overlapping angles add to the whole angle.","4.MD.C.7","MK-5.4.F",0]]},{"n":5,"title":"Geometry","los":[["MK-5.5.A",129,"Draw points, lines, segments, rays, angles (right, acute, obtuse), and perpendicular and parallel lines, and identify them in figures.","Right = 90°, acute \u003c 90°, obtuse between 90° and 180°.","4.G.A.1","MK-5.4.E",0],["MK-5.5.B",130,"Classify two-dimensional figures by parallel or perpendicular lines and by angles of a specified size; recognize right triangles.","A right triangle has one 90° angle.","4.G.A.2","MK-5.5.A MK-4.5.A",0],["MK-5.5.C",131,"Recognize a line of symmetry for a two-dimensional figure, identify line-symmetric figures and draw lines of symmetry.","A figure folded along a line of symmetry matches itself.","4.G.A.3","MK-5.5.A",0]]}]},{"n":6,"title":"Grade 5 — fraction addition and multiplication, decimals to thousandths, volume","scope":"core","topics":[{"n":1,"title":"Operations and Algebraic Thinking","los":[["MK-6.1.A",132,"Use parentheses, brackets or braces in numerical expressions and evaluate expressions with these symbols.","Innermost grouping first, then the order of operations.","5.OA.A.1","MK-5.1.C",0],["MK-6.1.B",133,"Write simple expressions that record calculations with numbers and interpret them without evaluating (3 × (18932 + 921) is three times as large as 18932 + 921).","An expression's structure shows a relationship without computing it.","5.OA.A.2","MK-6.1.A MK-5.1.A",0],["MK-6.1.C",134,"Generate two numerical patterns from two given rules, form ordered pairs from corresponding terms, graph them, and identify relationships between corresponding terms.","Rules \"add 3\" and \"add 6\" from 0 give terms where the second is always twice the first.","5.OA.B.3","MK-5.1.E",0]]},{"n":2,"title":"Number and Operations in Base Ten","los":[["MK-6.2.A",135,"Recognize that in a multi-digit number a digit represents 10 times as much as in the place to its right and 1/10 of what it represents in the place to its left.","Moving one place left multiplies by 10; one place right divides by 10.","5.NBT.A.1","MK-5.2.A MK-5.3.J",0],["MK-6.2.B",136,"Explain patterns in the number of zeros of a product when multiplying by a power of 10 and in decimal-point placement when multiplying or dividing by a power of 10; use whole-number exponents for powers of 10.","× 10ⁿ shifts every digit n places left.","5.NBT.A.2","MK-6.2.A",0],["MK-6.2.C",137,"Read and write decimals to thousandths using base-ten numerals, number names and expanded form (347.392 = 3×100 + 4×10 + 7×1 + 3×(1/10) + 9×(1/100) + 2×(1/1000)).","Thousandths are the third place right of the decimal point.","5.NBT.A.3a","MK-6.2.A MK-5.3.J",0],["MK-6.2.D",138,"Compare two decimals to thousandths based on the meanings of the digits, using >, =, \u003c.","Compare place by place from the left; trailing zeros don't change value.","5.NBT.A.3b","MK-6.2.C MK-5.3.K",0],["MK-6.2.E",139,"Use place value understanding to round decimals to any place.","Rounding decimals follows the same rule as whole numbers.","5.NBT.A.4","MK-6.2.C MK-5.2.C",0],["MK-6.2.F",140,"Fluently multiply multi-digit whole numbers using the standard algorithm.","The algorithm records partial products by place.","5.NBT.B.5","MK-5.2.E",0],["MK-6.2.G",141,"Find whole-number quotients of whole numbers with up to four-digit dividends and two-digit divisors using place-value strategies and the multiplication–division relationship.","Estimate each quotient digit by rounding the divisor; check by multiplying back.","5.NBT.B.6","MK-5.2.F",0],["MK-6.2.H",142,"Add, subtract, multiply and divide decimals to hundredths using models, place-value strategies and properties of operations, and explain the reasoning.","Line up like places to add; for products, tenths × tenths = hundredths.","5.NBT.B.7","MK-6.2.B MK-6.2.C MK-5.2.D MK-5.2.E",0]]},{"n":3,"title":"Number and Operations—Fractions","los":[["MK-6.3.A",143,"Add and subtract fractions with unlike denominators (including mixed numbers) by replacing them with equivalent fractions that have like denominators.","a/b + c/d = (ad + bc)/bd.","5.NF.A.1","MK-5.3.A MK-5.3.E",0],["MK-6.3.B",144,"Solve word problems involving addition and subtraction of fractions referring to the same whole, including unlike denominators, and use benchmark fractions to check reasonableness.","2/5 + 1/2 = 3/7 is wrong: 3/7 \u003c 1/2.","5.NF.A.2","MK-6.3.A MK-5.3.F",0],["MK-6.3.C",145,"Interpret a fraction as division of the numerator by the denominator (a/b = a ÷ b) and solve word problems where whole-number division gives a fraction or mixed number.","Sharing 3 pizzas among 4 people gives each 3/4 of a pizza.","5.NF.B.3","MK-5.3.G MK-5.2.F",0],["MK-6.3.D",146,"Interpret (a/b) × q as a parts of a partition of q into b equal parts, and multiply a fraction by a fraction: (a/b) × (c/d) = ac/bd.","2/3 × 4 = 8/3; (2/3) × (4/5) = 8/15.","5.NF.B.4a","MK-5.3.G MK-6.3.C",0],["MK-6.3.E",147,"Find the area of a rectangle with fractional side lengths by tiling with unit squares of the appropriate unit-fraction side, and show it equals the product of the side lengths.","Area = length × width holds for fractional sides.","5.NF.B.4b","MK-6.3.D MK-5.4.C",0],["MK-6.3.F",148,"Interpret multiplication as scaling: compare the size of a product to one factor from the other factor, without multiplying.","× (factor > 1) enlarges; × (factor \u003c 1) shrinks; a/b = (n×a)/(n×b) is × n/n = × 1.","5.NF.B.5a, 5.NF.B.5b","MK-6.3.D MK-5.1.A",0],["MK-6.3.G",149,"Solve real-world problems involving multiplication of fractions and mixed numbers using visual fraction models or equations.","\"Of\" a quantity usually means multiply.","5.NF.B.6","MK-6.3.D MK-6.3.F",0],["MK-6.3.H",150,"Divide a unit fraction by a non-zero whole number and a whole number by a unit fraction (1/3 ÷ 4 = 1/12; 4 ÷ 1/5 = 20), using the multiplication–division relationship.","4 ÷ 1/5 asks how many fifths are in 4.","5.NF.B.7a, 5.NF.B.7b","MK-6.3.C MK-6.3.D",0],["MK-6.3.I",151,"Solve real-world problems involving division of unit fractions by whole numbers and of whole numbers by unit fractions.","Sharing 1/2 lb among 3 people: 1/2 ÷ 3 = 1/6 lb each.","5.NF.B.7c","MK-6.3.H",0]]},{"n":4,"title":"Measurement and Data","los":[["MK-6.4.A",152,"Convert among different-sized standard measurement units within one system (5 cm to 0.05 m) and use the conversions in multi-step real-world problems.","Converting within the metric system is multiplying or dividing by a power of 10.","5.MD.A.1","MK-5.4.A MK-6.2.B MK-6.2.H",0],["MK-6.4.B",153,"Make a line plot of measurements in fractions of a unit (1/2, 1/4, 1/8) and use operations on fractions to solve problems from it (redistribute amounts equally).","An equal redistribution of total amount is the mean.","5.MD.B.2","MK-5.4.D MK-6.3.B",0],["MK-6.4.C",154,"Recognize volume as an attribute of solid figures: a unit cube has one cubic unit of volume, and a solid packed by n unit cubes without gaps or overlaps has volume n.","Volume counts unit cubes that fill a solid.","5.MD.C.3a, 5.MD.C.3b","MK-4.4.E",0],["MK-6.4.D",155,"Measure volumes by counting unit cubes (cubic cm, cubic in, cubic ft, improvised units).","Volume = number of unit cubes, labeled with the cubic unit.","5.MD.C.4","MK-6.4.C",0],["MK-6.4.E",156,"Find the volume of a right rectangular prism with whole-number edges by packing it with unit cubes, show it equals the product of the edge lengths, and apply V = l × w × h and V = b × h.","V = (area of base) × height = layers × cubes per layer.","5.MD.C.5a, 5.MD.C.5b","MK-6.4.D MK-4.4.G MK-4.1.E",0],["MK-6.4.F",157,"Recognize volume as additive and find volumes of solids made of two non-overlapping right rectangular prisms.","Volume is additive.","5.MD.C.5c","MK-6.4.E MK-4.4.I",0]]},{"n":5,"title":"Geometry","los":[["MK-6.5.A",158,"Use a pair of perpendicular number lines (axes) meeting at the origin to define a coordinate system, and locate a point with an ordered pair (x-coordinate, y-coordinate).","(x, y): move x along the horizontal axis, then y up.","5.G.A.1","MK-5.5.A MK-3.3.F",0],["MK-6.5.B",159,"Represent real-world and mathematical problems by graphing points in the first quadrant and interpret coordinate values in context.","Each coordinate is a quantity; a point pairs two quantities.","5.G.A.2","MK-6.5.A MK-6.1.C",0],["MK-6.5.C",160,"Understand that attributes of a category of two-dimensional figures belong to all its subcategories (all rectangles have four right angles, and squares are rectangles).","A subcategory inherits every defining attribute of its category.","5.G.B.3","MK-5.5.B MK-4.5.A",0],["MK-6.5.D",161,"Classify two-dimensional figures in a hierarchy based on properties.","Quadrilateral ⊃ parallelogram ⊃ rectangle/rhombus ⊃ square.","5.G.B.4","MK-6.5.C",0]]}]},{"n":7,"title":"Grade 6 — ratios and rates, negative numbers, expressions and one-step equations, distributions","scope":"core","topics":[{"n":1,"title":"Ratios and Proportional Relationships","los":[["MK-7.1.A",162,"Use ratio language to describe a ratio relationship between two quantities (\"for every 2 wings there was 1 beak\").","A ratio a:b compares two quantities multiplicatively.","6.RP.A.1","MK-5.1.A MK-6.3.F",0],["MK-7.1.B",163,"Describe the unit rate a/b associated with a ratio a:b (b ≠ 0) using rate language (\"$5 for 4 burgers is $1.25 per burger\").","Unit rate = amount of the first quantity per 1 of the second.","6.RP.A.2","MK-7.1.A MK-6.3.C",0],["MK-7.1.C",164,"Make tables of equivalent ratios with whole-number measurements, find missing values, plot the pairs on the coordinate plane, and use tables to compare ratios.","Equivalent ratios scale both quantities by the same factor.","6.RP.A.3a","MK-7.1.A MK-6.5.B MK-6.1.C",0],["MK-7.1.D",165,"Solve unit rate problems, including unit pricing and constant speed.","At 7 lawns in 4 hours, 35 lawns take 35 ÷ (7/4) = 20 hours.","6.RP.A.3b","MK-7.1.B",0],["MK-7.1.E",166,"Find a percent of a quantity as a rate per 100 (30% of a quantity is 30/100 times it) and find the whole given a part and the percent.","p% = p/100; whole = part ÷ (p/100).","6.RP.A.3c","MK-7.1.D MK-5.3.I",0],["MK-7.1.F",167,"Use ratio reasoning to convert measurement units, multiplying or dividing quantities appropriately.","Multiply by a conversion ratio equal to 1 (12 in / 1 ft).","6.RP.A.3d","MK-7.1.D MK-6.4.A",0]]},{"n":2,"title":"The Number System","los":[["MK-7.2.A",168,"Interpret and compute quotients of fractions and solve word problems involving division of fractions by fractions ((2/3) ÷ (3/4) = 8/9).","a/b ÷ c/d = a/b × d/c, because (8/9) × (3/4) = 2/3.","6.NS.A.1","MK-6.3.H MK-6.3.D",0],["MK-7.2.B",169,"Fluently divide multi-digit numbers using the standard algorithm.","Long division records place-value chunks.","6.NS.B.2","MK-6.2.G",0],["MK-7.2.C",170,"Fluently add, subtract, multiply and divide multi-digit decimals using the standard algorithm for each operation.","Scale the divisor to a whole number by a power of 10 and scale the dividend the same.","6.NS.B.3","MK-6.2.H MK-7.2.B",0],["MK-7.2.D",171,"Find the greatest common factor of two whole numbers ≤ 100 and the least common multiple of two whole numbers ≤ 12; use the distributive property to factor out a common factor (36 + 8 = 4(9 + 2)).","GCF divides both; LCM is the smallest number both divide.","6.NS.B.4","MK-5.1.D MK-4.1.E",0],["MK-7.2.E",172,"Use positive and negative numbers to represent quantities with opposite directions or values (temperature, elevation, credits/debits), explaining the meaning of 0 in context.","Sign shows direction from a reference point 0.","6.NS.C.5","MK-3.3.F",0],["MK-7.2.F",173,"Recognize a rational number as a point on the number line; opposite signs indicate locations on opposite sides of 0, and −(−3) = 3.","The opposite of a number is its reflection across 0.","6.NS.C.6a","MK-7.2.E MK-4.3.C",0],["MK-7.2.G",174,"Interpret signs of ordered pairs as quadrants and reflections across the axes; find and position integers and other rationals on number lines and the coordinate plane.","(a, b) → (a, −b) reflects across the x-axis; (−a, b) across the y-axis.","6.NS.C.6b, 6.NS.C.6c","MK-7.2.F MK-6.5.A",0],["MK-7.2.H",175,"Interpret statements of inequality as relative position on a number line, and write and explain statements of order for rational numbers in context (−3 °C > −7 °C).","Further right on the number line is greater, even for negatives.","6.NS.C.7a, 6.NS.C.7b","MK-7.2.F",0],["MK-7.2.I",176,"Understand the absolute value of a rational number as its distance from 0, and distinguish comparisons of absolute value from statements about order (balance \u003c −30 means debt > $30).","|x| ≥ 0 is distance, not direction.","6.NS.C.7c, 6.NS.C.7d","MK-7.2.H",0],["MK-7.2.J",177,"Solve problems by graphing points in all four quadrants, including distances between points that share a first or second coordinate, using absolute value.","Distance between (a, y) and (b, y) is |a − b|.","6.NS.C.8","MK-7.2.G MK-7.2.I",0]]},{"n":3,"title":"Expressions and Equations","los":[["MK-7.3.A",178,"Write and evaluate numerical expressions involving whole-number exponents.","bⁿ = b multiplied by itself n times; exponents before × and ÷.","6.EE.A.1","MK-6.2.B MK-6.1.A",0],["MK-7.3.B",179,"Write expressions in which letters stand for numbers (\"subtract y from 5\" as 5 − y) and identify their parts using sum, term, product, factor, quotient, coefficient.","2(8 + 7) is a product of two factors; 8 + 7 is a sum.","6.EE.A.2a, 6.EE.A.2b","MK-6.1.B",0],["MK-7.3.C",180,"Evaluate expressions at specific values of their variables, including formulas (V = s³, A = 6s²), using the order of operations.","Substitute, then follow the order of operations.","6.EE.A.2c","MK-7.3.B MK-7.3.A",0],["MK-7.3.D",181,"Apply the properties of operations to generate equivalent expressions (3(2 + x) = 6 + 3x; 24x + 18y = 6(4x + 3y); y + y + y = 3y).","The distributive property expands and factors.","6.EE.A.3","MK-7.3.B MK-7.2.D",0],["MK-7.3.E",182,"Identify when two expressions are equivalent — they name the same number for every value substituted.","Equivalent expressions agree for all values, not just one.","6.EE.A.4","MK-7.3.D MK-7.3.C",0],["MK-7.3.F",183,"Understand solving an equation or inequality as finding which values from a set make it true, and use substitution to check.","A solution is a value that makes the statement true.","6.EE.B.5","MK-7.3.C",0],["MK-7.3.G",184,"Use variables to represent numbers and write expressions when solving a real-world or mathematical problem.","A variable stands for an unknown or for any number in a set.","6.EE.B.6","MK-7.3.B",0],["MK-7.3.H",185,"Write and solve equations of the form x + p = q and px = q for nonnegative rational x, p, q in real-world and mathematical problems.","Undo the operation on x by its inverse on both sides.","6.EE.B.7","MK-7.3.F MK-7.3.G MK-4.1.D MK-7.2.A",0],["MK-7.3.I",186,"Write an inequality x > c or x \u003c c for a constraint, recognize that it has infinitely many solutions, and show them on a number line.","An open circle excludes c; a closed circle includes it.","6.EE.B.8","MK-7.3.F MK-7.2.H",0],["MK-7.3.J",187,"Use variables for two quantities that change together; write an equation expressing the dependent variable in terms of the independent one, and relate it to graphs and tables (d = 65t).","The independent variable is chosen; the dependent one follows from it.","6.EE.C.9","MK-7.1.C MK-7.3.G",0]]},{"n":4,"title":"Geometry","los":[["MK-7.4.A",188,"Find the area of right triangles, other triangles, special quadrilaterals and polygons by composing into rectangles or decomposing into triangles and other shapes.","A triangle is half of a parallelogram: A = ½bh.","6.G.A.1","MK-5.4.C MK-6.3.E",0],["MK-7.4.B",189,"Find the volume of a right rectangular prism with fractional edge lengths by packing it with unit cubes of unit-fraction edge, and show it matches V = lwh and V = bh.","Packing with 1/n-unit cubes: n³ of them make one unit cube.","6.G.A.2","MK-6.4.E MK-6.3.E",0],["MK-7.4.C",190,"Draw polygons in the coordinate plane given vertex coordinates, and use coordinates to find side lengths that share a first or second coordinate.","Horizontal and vertical side lengths are differences of coordinates.","6.G.A.3","MK-7.2.J",0],["MK-7.4.D",191,"Represent three-dimensional figures using nets made of rectangles and triangles and use the nets to find surface area.","Surface area = sum of the areas of the net's faces.","6.G.A.4","MK-7.4.A",0]]},{"n":5,"title":"Statistics and Probability","los":[["MK-7.5.A",192,"Recognize a statistical question as one that anticipates variability in the data (\"How old are the students in my school?\").","Statistical questions expect many different answers.","6.SP.A.1","MK-4.4.C",0],["MK-7.5.B",193,"Understand that a distribution of data collected to answer a statistical question can be described by its center, spread and overall shape.","Center, spread and shape summarize a distribution.","6.SP.A.2","MK-7.5.A MK-6.4.B",0],["MK-7.5.C",194,"Recognize that a measure of center summarizes all values with one number, while a measure of variation describes how the values vary with one number.","Center = typical value; variation = how far values spread from it.","6.SP.A.3","MK-7.5.B",0],["MK-7.5.D",195,"Display numerical data in plots on a number line: dot plots, histograms and box plots.","A box plot shows min, Q1, median, Q3, max.","6.SP.B.4","MK-7.5.B MK-6.4.B",0],["MK-7.5.E",196,"Summarize a numerical data set by reporting the number of observations and describing the attribute under investigation, how it was measured and its units.","Every data summary starts with n, the variable, and its units.","6.SP.B.5a, 6.SP.B.5b","MK-7.5.D",0],["MK-7.5.F",197,"Give quantitative measures of center (median, mean) and variability (interquartile range, mean absolute deviation), describe the pattern and striking deviations, and relate the choice of measures to the shape of the data.","Skewed data or outliers → median and IQR; symmetric → mean and MAD.","6.SP.B.5c, 6.SP.B.5d","MK-7.5.E MK-7.5.C MK-7.2.C MK-7.2.I",0]]}]},{"n":8,"title":"Grade 7 — proportional relationships, rational-number arithmetic, linear equations, sampling and probability","scope":"core","topics":[{"n":1,"title":"Ratios and Proportional Relationships","los":[["MK-8.1.A",198,"Compute unit rates associated with ratios of fractions, including ratios of lengths, areas and other quantities in like or different units (1/2 mile per 1/4 hour = 2 miles per hour).","Unit rate = (a/b) ÷ (c/d), a complex fraction.","7.RP.A.1","MK-7.1.B MK-7.2.A",0],["MK-8.1.B",199,"Decide whether two quantities are in a proportional relationship by testing for equivalent ratios in a table or a straight-line graph through the origin.","Proportional ⇔ y/x is constant ⇔ a line through (0, 0).","7.RP.A.2a","MK-7.1.C MK-8.1.A",0],["MK-8.1.C",200,"Identify the constant of proportionality (unit rate) in tables, graphs, equations, diagrams and verbal descriptions.","k = y/x for any pair.","7.RP.A.2b","MK-8.1.B",0],["MK-8.1.D",201,"Represent proportional relationships by equations (t = pn) and explain what a point (x, y) on the graph means, especially (0, 0) and (1, r) where r is the unit rate.","y = kx; the point (1, k) shows the unit rate.","7.RP.A.2c, 7.RP.A.2d","MK-8.1.C MK-7.3.J",0],["MK-8.1.E",202,"Use proportional relationships to solve multistep ratio and percent problems: simple interest, tax, markups and markdowns, gratuities, commissions, fees, percent increase and decrease, percent error.","Percent change = (new − old)/old; a 20% increase multiplies by 1.20.","7.RP.A.3","MK-7.1.E MK-8.1.D",0]]},{"n":2,"title":"The Number System","los":[["MK-8.2.A",203,"Add rational numbers on a number line: opposite quantities combine to 0, and p + q is |q| from p in the positive or negative direction depending on the sign of q.","p + (−p) = 0 (additive inverses).","7.NS.A.1a, 7.NS.A.1b","MK-7.2.F MK-7.2.I",0],["MK-8.2.B",204,"Understand subtraction of rationals as adding the additive inverse (p − q = p + (−q)), show that the distance between two rationals is the absolute value of their difference, and apply properties to add and subtract.","p − q = p + (−q); distance = |p − q|.","7.NS.A.1c, 7.NS.A.1d","MK-8.2.A",0],["MK-8.2.C",205,"Multiply and divide rational numbers by extending the properties of operations, giving (−1)(−1) = 1 and −(p/q) = (−p)/q = p/(−q).","Sign rules follow from the distributive property, not from convention.","7.NS.A.2a, 7.NS.A.2b","MK-8.2.B MK-7.2.A",0],["MK-8.2.D",206,"Apply properties of operations to multiply and divide rationals, and convert a rational number to a decimal by long division, knowing the decimal terminates or repeats.","p/q terminates iff q (in lowest terms) has only prime factors 2 and 5; otherwise it repeats.","7.NS.A.2c, 7.NS.A.2d","MK-8.2.C MK-7.2.B MK-6.3.C",0],["MK-8.2.E",207,"Solve real-world and mathematical problems involving the four operations with rational numbers.","Track signs through each operation; estimate to check.","7.NS.A.3","MK-8.2.D",0]]},{"n":3,"title":"Expressions and Equations","los":[["MK-8.3.A",208,"Apply properties of operations to add, subtract, factor and expand linear expressions with rational coefficients.","Combine like terms; distribute signs with the coefficient.","7.EE.A.1","MK-7.3.D MK-8.2.C",0],["MK-8.3.B",209,"Rewrite an expression in different forms to show how the quantities in it are related (a + 0.05a = 1.05a: \"increase by 5%\" means \"multiply by 1.05\").","Equivalent forms reveal different meanings.","7.EE.A.2","MK-8.3.A MK-8.1.E",0],["MK-8.3.C",210,"Solve multi-step real-life problems with positive and negative rational numbers in any form, converting between forms, and assess reasonableness with mental computation and estimation.","Fraction, decimal and percent are interchangeable forms of one number.","7.EE.B.3","MK-8.2.E MK-8.1.E",0],["MK-8.3.D",211,"Solve word problems leading to equations px + q = r and p(x + q) = r fluently, and compare the algebraic solution to an arithmetic one.","Undo operations in reverse order: subtract q, then divide by p.","7.EE.B.4a","MK-7.3.H MK-8.3.A",0],["MK-8.3.E",212,"Solve word problems leading to inequalities px + q > r or px + q \u003c r, graph the solution set and interpret it in context.","Multiplying or dividing by a negative reverses the inequality.","7.EE.B.4b","MK-8.3.D MK-7.3.I",0]]},{"n":4,"title":"Geometry","los":[["MK-8.4.A",213,"Solve problems involving scale drawings, including computing actual lengths and areas from a scale drawing and reproducing it at a different scale.","Lengths scale by k; areas scale by k².","7.G.A.1","MK-8.1.C MK-7.4.A",0],["MK-8.4.B",214,"Draw geometric shapes with given conditions (freehand, ruler and protractor, technology), especially triangles from three measures of angles or sides, noting when the conditions give a unique triangle, more than one, or none.","Any two sides must sum to more than the third; angles must sum to 180°.","7.G.A.2","MK-5.4.F MK-5.5.B",0],["MK-8.4.C",215,"Describe the two-dimensional figures that result from slicing three-dimensional figures, as in plane sections of right rectangular prisms and pyramids.","A plane slice parallel to the base copies the base's shape.","7.G.A.3","MK-7.4.D",0],["MK-8.4.D",216,"Know the formulas for the area and circumference of a circle, use them to solve problems, and give an informal derivation of the relationship between them.","C = 2πr; A = πr² (unroll the circle into a near-parallelogram of base πr and height r).","7.G.B.4","MK-7.4.A MK-8.1.C",0],["MK-8.4.E",217,"Use facts about supplementary, complementary, vertical and adjacent angles in multi-step problems to write and solve simple equations for an unknown angle.","Supplementary sum to 180°, complementary to 90°; vertical angles are equal.","7.G.B.5","MK-5.4.G MK-8.3.D",0],["MK-8.4.F",218,"Solve real-world problems involving area, volume and surface area of two- and three-dimensional objects composed of triangles, quadrilaterals, polygons, cubes and right prisms.","Decompose the object; area and volume are additive.","7.G.B.6","MK-7.4.A MK-7.4.B MK-7.4.D",0]]},{"n":5,"title":"Statistics and Probability","los":[["MK-8.5.A",219,"Understand that statistics gain information about a population by examining a sample, that generalizations are valid only if the sample is representative, and that random sampling tends to produce representative samples.","Random samples support inference; convenience samples are biased.","7.SP.A.1","MK-7.5.A",0],["MK-8.5.B",220,"Use data from a random sample to draw inferences about a population with an unknown characteristic, and generate multiple samples to gauge the variation in estimates.","Estimates vary from sample to sample; that spread is the margin of error.","7.SP.A.2","MK-8.5.A MK-7.5.F",0],["MK-8.5.C",221,"Informally assess the visual overlap of two numerical distributions with similar variabilities, measuring the difference between centers as a multiple of a measure of variability.","Difference in means ÷ MAD says how separated two groups are.","7.SP.B.3","MK-7.5.F MK-7.5.D",0],["MK-8.5.D",222,"Use measures of center and variability for numerical data from random samples to draw informal comparative inferences about two populations.","Compare centers relative to spread, not centers alone.","7.SP.B.4","MK-8.5.C MK-8.5.B",0],["MK-8.5.E",223,"Understand the probability of a chance event as a number between 0 and 1 expressing its likelihood: near 0 unlikely, 1/2 neither, near 1 likely.","0 ≤ P ≤ 1.","7.SP.C.5","MK-7.1.A MK-4.3.C",0],["MK-8.5.F",224,"Approximate a probability by collecting data on a chance process and observing its long-run relative frequency, and predict the approximate relative frequency given the probability.","Relative frequency approaches the probability over many trials.","7.SP.C.6","MK-8.5.E MK-7.1.E",0],["MK-8.5.G",225,"Develop a probability model (uniform, or from observed frequencies), use it to find probabilities, and compare them to observed frequencies, explaining discrepancies.","Uniform model: P(event) = favorable outcomes / total outcomes.","7.SP.C.7a, 7.SP.C.7b","MK-8.5.F",0],["MK-8.5.H",226,"Find probabilities of compound events as the fraction of outcomes in the sample space, representing the sample space with organized lists, tables and tree diagrams.","For independent stages, total outcomes = product of the counts at each stage.","7.SP.C.8a, 7.SP.C.8b","MK-8.5.G MK-6.3.D",0],["MK-8.5.I",227,"Design and use a simulation to generate frequencies for compound events.","A simulation replaces each real trial with a random device of the same probabilities.","7.SP.C.8c","MK-8.5.H MK-8.5.F",0]]}]},{"n":9,"title":"Grade 8 — irrationals and exponents, linear equations and systems, functions, transformations, Pythagoras","scope":"core","topics":[{"n":1,"title":"The Number System","los":[["MK-9.1.A",228,"Know that numbers that are not rational are irrational; every number has a decimal expansion; rational numbers' expansions eventually repeat; convert a repeating decimal into a rational number.","x = 0.333… → 10x − x = 3 → x = 1/3.","8.NS.A.1","MK-8.2.D",0],["MK-9.1.B",229,"Use rational approximations of irrational numbers to compare their size, locate them on a number line and estimate expressions (π²; √2 between 1.4 and 1.5).","Squeeze an irrational between rationals by truncating its expansion.","8.NS.A.2","MK-9.1.A MK-7.2.H",0]]},{"n":2,"title":"Expressions and Equations","los":[["MK-9.2.A",230,"Know and apply the properties of integer exponents to generate equivalent numerical expressions (3² × 3⁻⁵ = 3⁻³ = 1/27).","aᵐaⁿ = aᵐ⁺ⁿ; a⁻ⁿ = 1/aⁿ; a⁰ = 1.","8.EE.A.1","MK-7.3.A MK-8.2.C",0],["MK-9.2.B",231,"Use square root and cube root symbols for solutions of x² = p and x³ = p (p a positive rational); evaluate roots of small perfect squares and cubes; know √2 is irrational.","x² = p has two solutions ±√p; x³ = p has one, ∛p.","8.EE.A.2","MK-9.2.A MK-9.1.A",0],["MK-9.2.C",232,"Use numbers of the form (single digit) × 10ⁿ to estimate very large or very small quantities and to say how many times as much one is as another.","3 × 10⁸ vs 7 × 10⁹: the second is about 20 times larger.","8.EE.A.3","MK-9.2.A MK-6.2.B",0],["MK-9.2.D",233,"Perform operations with numbers in scientific notation, choose units of appropriate size, and interpret scientific notation generated by technology.","(a × 10ᵐ)(b × 10ⁿ) = ab × 10ᵐ⁺ⁿ, then renormalize so 1 ≤ |ab| \u003c 10.","8.EE.A.4","MK-9.2.C",0],["MK-9.2.E",234,"Graph proportional relationships, interpreting the unit rate as the slope, and compare two proportional relationships represented in different ways.","In y = kx, slope = unit rate = k.","8.EE.B.5","MK-8.1.D",0],["MK-9.2.F",235,"Use similar triangles to explain why the slope m is the same between any two distinct points on a non-vertical line, and derive y = mx and y = mx + b.","Slope triangles on one line are similar, so rise/run is constant.","8.EE.B.6","MK-9.2.E MK-8.4.A",0],["MK-9.2.G",236,"Give examples of linear equations in one variable with one solution, infinitely many solutions, or no solutions, by transforming them to x = a, a = a, or a = b.","a = a (identity) → all x; a = b with a ≠ b → none.","8.EE.C.7a","MK-8.3.D",0],["MK-9.2.H",237,"Solve linear equations with rational coefficients, including ones that need the distributive property and collecting like terms.","Do the same operation to both sides until x is alone.","8.EE.C.7b","MK-9.2.G MK-8.3.A",0],["MK-9.2.I",238,"Understand that solutions of a system of two linear equations in two variables correspond to the intersection points of their graphs.","A solution satisfies both equations, so it lies on both lines.","8.EE.C.8a","MK-9.2.F MK-9.2.H",0],["MK-9.2.J",239,"Solve systems of two linear equations algebraically, estimate solutions by graphing, and solve simple cases by inspection (3x + 2y = 5 and 3x + 2y = 6 have no solution).","Substitute or eliminate to get one equation in one variable; parallel lines → no solution.","8.EE.C.8b","MK-9.2.I",0],["MK-9.2.K",240,"Solve real-world and mathematical problems leading to two linear equations in two variables.","Two unknowns need two independent equations.","8.EE.C.8c","MK-9.2.J",0]]},{"n":3,"title":"Functions","los":[["MK-9.3.A",241,"Understand that a function is a rule assigning to each input exactly one output, and that its graph is the set of ordered pairs (input, corresponding output).","One input → exactly one output.","8.F.A.1","MK-7.3.J",0],["MK-9.3.B",242,"Compare properties of two functions each represented differently (algebraically, graphically, in a table, or verbally).","Rate of change and initial value can be read off any representation.","8.F.A.2","MK-9.3.A MK-9.2.E",0],["MK-9.3.C",243,"Interpret y = mx + b as defining a linear function whose graph is a straight line, and give examples of functions that are not linear (A = s²).","Linear ⇔ constant rate of change.","8.F.A.3","MK-9.3.A MK-9.2.F",0],["MK-9.3.D",244,"Construct a function to model a linear relationship, determine its rate of change and initial value from a description or two (x, y) values, and interpret them in context.","m = (y₂ − y₁)/(x₂ − x₁); b = y − mx.","8.F.B.4","MK-9.3.C",0],["MK-9.3.E",245,"Describe a functional relationship qualitatively from a graph (increasing, decreasing, linear, nonlinear) and sketch a graph from a verbal description.","The shape of a graph tells a story about how the output changes.","8.F.B.5","MK-9.3.A",0]]},{"n":4,"title":"Geometry","los":[["MK-9.4.A",246,"Verify experimentally the properties of rotations, reflections and translations: they take lines to lines, segments to equal segments, angles to equal angles, parallel lines to parallel lines.","Rigid motions preserve distance and angle.","8.G.A.1a, 8.G.A.1b, 8.G.A.1c","MK-5.5.A MK-8.4.B",0],["MK-9.4.B",247,"Understand that a figure is congruent to another if a sequence of rotations, reflections and translations maps one onto the other, and describe such a sequence.","Congruent = related by a rigid motion.","8.G.A.2","MK-9.4.A",0],["MK-9.4.C",248,"Describe the effect of dilations, translations, rotations and reflections on two-dimensional figures using coordinates.","Dilation by k from the origin: (x, y) → (kx, ky); reflection in the x-axis: (x, y) → (x, −y).","8.G.A.3","MK-9.4.A MK-7.2.G MK-8.4.A",0],["MK-9.4.D",249,"Understand that a figure is similar to another if a sequence of rotations, reflections, translations and dilations maps one onto the other, and describe such a sequence.","Similar = rigid motion plus dilation; angles kept, lengths scaled by k.","8.G.A.4","MK-9.4.B MK-9.4.C",0],["MK-9.4.E",250,"Use informal arguments to establish the triangle angle sum and exterior angle facts, the angles formed when parallel lines are cut by a transversal, and the angle-angle criterion for similar triangles.","Angle sum = 180°; alternate interior angles are equal; AA ⇒ similar.","8.G.A.5","MK-9.4.A MK-8.4.E MK-9.4.D",0],["MK-9.4.F",251,"Explain a proof of the Pythagorean Theorem and its converse.","a² + b² = c² ⇔ the triangle is right (rearrangement of four copies of the triangle).","8.G.B.6","MK-9.2.B MK-7.4.A MK-9.4.D",0],["MK-9.4.G",252,"Apply the Pythagorean Theorem to find unknown side lengths in right triangles in two and three dimensions.","Box diagonal: d² = l² + w² + h².","8.G.B.7","MK-9.4.F",0],["MK-9.4.H",253,"Apply the Pythagorean Theorem to find the distance between two points in a coordinate system.","d = √((x₂ − x₁)² + (y₂ − y₁)²).","8.G.B.8","MK-9.4.G MK-7.2.J",0],["MK-9.4.I",254,"Know the formulas for the volumes of cones, cylinders and spheres and use them to solve problems.","V_cyl = πr²h; V_cone = ⅓πr²h; V_sphere = (4/3)πr³.","8.G.C.9","MK-8.4.D MK-8.4.F MK-9.2.B",0]]},{"n":5,"title":"Statistics and Probability","los":[["MK-9.5.A",255,"Construct and interpret scatter plots for bivariate measurement data and describe patterns: clustering, outliers, positive or negative association, linear or nonlinear association.","Association describes how one variable tends to change with the other.","8.SP.A.1","MK-7.5.D MK-7.2.J",0],["MK-9.5.B",256,"Know that straight lines model linear association between two quantitative variables; informally fit a line to a scatter plot and judge the fit by closeness of the points.","A good line has points scattered evenly above and below it.","8.SP.A.2","MK-9.5.A MK-9.3.C",0],["MK-9.5.C",257,"Use the equation of a linear model to solve problems with bivariate measurement data, interpreting the slope and intercept.","Slope = predicted change in y per unit x; intercept = predicted y at x = 0.","8.SP.A.3","MK-9.5.B MK-9.3.D",0],["MK-9.5.D",258,"Understand patterns of association in bivariate categorical data from frequencies and relative frequencies in a two-way table, and use relative frequencies by row or column to describe possible association.","Association shows when row (or column) relative frequencies differ.","8.SP.A.4","MK-7.1.E",0]]}]}]},{"id":"math-hs","title":"High School Mathematics (Common Core)","code":"MH","track":"math","requires":["math-k8"],"units":[{"n":1,"title":"Relationships between quantities and reasoning with equations","scope":"core","topics":[{"n":1,"title":"Reason quantitatively and use units to solve problems","los":[["MH-1.1.A",259,"Use units to choose and check the solution path of a multi-step problem, converting units and choosing scales for graphs.","Units multiply and divide like factors; a result in the wrong units is wrong.","N-Q.A.1","",0],["MH-1.1.B",260,"Define the quantities and variables needed to describe a situation.","A quantity is a number with a unit attached to a specific attribute of a specific object.","N-Q.A.2","MH-1.1.A",0],["MH-1.1.C",261,"Report a computed quantity to a level of accuracy that matches the limitations of the measurements it came from.","A result is no more precise than the least precise measurement that went into it.","N-Q.A.3","MH-1.1.A",0]]},{"n":2,"title":"Interpret the structure of expressions","los":[["MH-1.2.A",262,"Identify the terms, factors and coefficients of an expression and say what each means in context.","Terms are added, factors are multiplied; a coefficient scales its variable.","A-SSE.A.1a","",0],["MH-1.2.B",263,"Interpret a complicated expression by viewing one or more of its parts as a single entity, e.g. P(1 + r)^n as the product of P and a factor not depending on P.","Treating a sub-expression as one object shows the role it plays in the whole.","A-SSE.A.1b","MH-1.2.A",0]]},{"n":3,"title":"Solve equations and inequalities in one variable as a process of reasoning","los":[["MH-1.3.A",264,"Explain each step in solving a simple equation as following from the equality asserted in the previous step, and justify the method.","Applying the same invertible operation to both sides keeps the solution set unchanged.","A-REI.A.1","",0],["MH-1.3.B",265,"Solve a linear equation in one variable, including equations with coefficients represented by letters.","Collect the variable terms on one side and constants on the other, then divide by the (nonzero) coefficient.","A-REI.B.3","MH-1.3.A",0],["MH-1.3.C",266,"Solve a linear inequality in one variable and write the solution set.","Multiplying or dividing both sides by a negative number reverses the inequality.","A-REI.B.3","MH-1.3.B",0]]},{"n":4,"title":"Create equations that describe numbers or relationships","los":[["MH-1.4.A",267,"Write and solve a one-variable linear equation or inequality that represents a word problem.","Name the unknown, translate each sentence into a relation, solve, then check the answer in the words.","A-CED.A.1","MH-1.1.B MH-1.3.C",0],["MH-1.4.B",268,"Write an equation in two variables that relates two quantities and graph it on coordinate axes with labels and scales.","Each variable is one quantity with a unit; the axes carry those units.","A-CED.A.2","MH-1.4.A",0],["MH-1.4.C",269,"Represent constraints by equations or inequalities, or by systems of them, and decide whether a solution is viable in context.","A mathematical solution can be non-viable: negative counts, fractional people, or values outside the constraints.","A-CED.A.3","MH-1.4.A",0],["MH-1.4.D",270,"Rearrange a formula to highlight a quantity of interest, e.g. Ohm's law V = IR for R.","Solving a formula for one letter uses the same inverse operations as solving an equation.","A-CED.A.4","MH-1.3.B",0]]}]},{"n":2,"title":"Linear and exponential relationships","scope":"core","topics":[{"n":1,"title":"Understand the concept of a function and use function notation","los":[["MH-2.1.A",271,"Decide whether a relation given by a table, graph, mapping or rule is a function, and state its domain and range.","A function assigns to each input exactly one output; its graph is the set of points (x, f(x)).","F-IF.A.1","",0],["MH-2.1.B",272,"Evaluate a function written in function notation for given inputs and interpret f(a) in context.","f(a) is the output when the input i

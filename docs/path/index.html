highly selective for the 3° hydrogen, Cl₂ much less so; radical stability 3° > 2° > 1°.","","",0],["DAT-3.1.E",2079,"Predict the product of an electrophilic addition, including Markovnikov regiochemistry and carbocation rearrangements.","H adds to the carbon with more H; a carbocation shifts H or CH₃ to become more substituted or resonance-stabilized.","","",0],["DAT-3.1.F",2080,"Decide whether SN1, SN2, E1 or E2 operates from substrate, nucleophile/base, solvent and temperature.","SN2: 1°, strong nucleophile, polar aprotic, inversion; SN1/E1: 3°, weak nucleophile, polar protic; E2: strong bulky base, anti-periplanar H; heat favors elimination.","","",0],["DAT-3.1.G",2081,"Predict the product of a Diels–Alder reaction, including stereochemistry.","s-cis diene + dienophile → cyclohexene in one concerted step; dienophile substituents keep their cis/trans relationship; endo is favored.","","",0],["DAT-3.1.H",2082,"Read a reaction coordinate diagram: count steps, locate intermediates and transition states, and find the rate-determining step.","Peaks are transition states, valleys are intermediates; the highest barrier is rate-determining; Hammond: a TS resembles the species nearer in energy.","","",0]]},{"n":2,"title":"Chemical Synthesis","los":[["DAT-3.2.A",2083,"Predict the substitution or elimination product, including stereochemistry and Zaitsev vs Hofmann regiochemistry.","SN2 inverts, SN1 racemizes; small bases give the more substituted alkene, bulky bases (t-BuO⁻) the less substituted one.","","DAT-3.1.F",0],["DAT-3.2.B",2084,"Predict the product of an alkene or alkyne reaction: HX, hydration, hydroboration–oxidation, halogenation, hydrogenation, ozonolysis.","Hydroboration is anti-Markovnikov and syn; X₂ adds anti; Lindlar gives cis alkene, Na/NH₃ trans; ozonolysis cleaves C=C to carbonyls.","","",0],["DAT-3.2.C",2085,"Predict the product of an alcohol reaction: oxidation, conversion to a halide or sulfonate, dehydration.","PCC stops 1° alcohols at the aldehyde, chromic acid goes to the acid; 3° alcohols resist oxidation; SOCl₂/PBr₃ give halides with inversion.","","",0],["DAT-3.2.D",2086,"Predict the regiochemistry and stereochemistry of ether cleavage and epoxide opening under acid and base.","Base or strong nucleophile attacks the less hindered epoxide carbon; acid directs attack to the more substituted carbon; opening is anti.","","",0],["DAT-3.2.E",2087,"Predict the product of an electrophilic aromatic substitution from substituent directing effects.","Activators (−OH, −NH₂, −R) and halogens direct ortho/para; deactivators (−NO₂, −C=O, −CN, −SO₃H) direct meta; halogens deactivate.","","",0],["DAT-3.2.F",2088,"Rank carboxylic acid derivatives by reactivity and predict nucleophilic acyl substitution products.","Acid chloride > anhydride > ester ≈ acid > amide; a derivative converts only to less reactive ones.","","",0],["DAT-3.2.G",2089,"Predict the product of nucleophilic addition to an aldehyde or ketone: hydride, Grignard, acetal, imine/enamine, Wittig.","Aldehydes are more reactive than ketones; Grignard adds carbon then protonates to an alcohol; 1° amines give imines, 2° give enamines.","","",0],["DAT-3.2.H",2090,"Predict the product of an alpha-carbonyl reaction: enolate alkylation, aldol, Claisen, haloform.","LDA at low T forms the kinetic (less substituted) enolate; aldol makes a β-hydroxy carbonyl that dehydrates to an enone with heat.","","",0],["DAT-3.2.I",2091,"Plan a two-step or multi-step synthesis by working backward from the target.","Disconnect the bond formed last; track carbon count and functional-group changes; reject routes with wrong regio- or stereochemistry.","","DAT-3.2.B DAT-3.2.C DAT-3.2.G",0],["DAT-3.2.J",2092,"Predict which functional group reacts when a molecule carries several.","NaBH₄ reduces aldehydes and ketones only; LiAlH₄ also reduces esters, acids and amides; protect an alcohol or carbonyl to spare it.","","",0]]},{"n":3,"title":"Acid–Base Chemistry","los":[["DAT-3.3.A",2093,"Rank compounds from different functional groups by acidity using pKa landmarks.","≈ pKa: HCl −7, RCOOH 5, phenol 10, H₂O 15.7, ROH 16–18, terminal alkyne 25, NH₃ 38, alkane 50.","","",0],["DAT-3.3.B",2094,"Rank acids within a functional group by charge, atom size, electronegativity, resonance, induction, hybridization and sterics.","A more stable conjugate base means a stronger acid: larger atom > more electronegative > resonance > induction (falls off with distance) > more s character.","","",0],["DAT-3.3.C",2095,"Predict the products and direction of an acid–base equilibrium.","The equilibrium favors the side with the weaker acid (higher pKa); K ≈ 10^(pKa product acid − pKa reactant acid).","","DAT-3.3.A",0],["DAT-3.3.D",2096,"Rank nitrogen and oxygen bases by basicity, including resonance and steric effects on amines.","Alkylamines > NH₃ > aniline > amide; lone pairs in resonance or in sp orbitals are less basic.","","",0]]},{"n":4,"title":"Chemical and Physical Properties of Molecules","los":[["DAT-3.4.A",2097,"Rank organic compounds by boiling point, melting point and water solubility.","H-bonding and molar mass raise bp; branching lowers bp but symmetry raises mp; small alcohols and acids are water-soluble.","","",0],["DAT-3.4.B",2098,"Choose and interpret a separation technique: TLC/column chromatography, acid–base extraction, recrystallization, distillation.","On silica, polar compounds have lower Rf; acids move to aqueous NaHCO₃/NaOH as salts, amines to aqueous HCl; distill when bp differ by > 25 °C, otherwise fractional.","","",0],["DAT-3.4.C",2099,"Identify functional groups from characteristic IR absorptions.","Broad O–H 3200–3550; acid O–H 2500–3300; C=O ~1700 (strong, sharp); N–H 3300–3500; C≡N/C≡C ~2100–2250.","","",0],["DAT-3.4.D",2100,"Interpret a ¹H NMR spectrum from chemical shift, integration and splitting.","Shifts: alkyl 0.9–2, next to C=O 2–2.5, next to O 3.3–4, vinyl 4.5–6.5, aromatic 6.5–8, aldehyde 9–10, acid 10–12; n + 1 rule.","","",0],["DAT-3.4.E",2101,"Count ¹³C NMR signals from molecular symmetry and assign shift regions.","One signal per unique carbon environment; C=O 160–220, aromatic/alkene 100–150, C–O 50–90, alkyl 0–50.","","",0],["DAT-3.4.F",2102,"Deduce a structure from a molecular formula and combined IR, ¹H and ¹³C NMR data.","Degrees of unsaturation = (2C + 2 + N − H − X)/2; one ring or π bond each; a benzene ring counts 4.","","DAT-3.4.C DAT-3.4.D DAT-3.4.E",0]]},{"n":5,"title":"Structural Evaluation","los":[["DAT-3.5.A",2104,"Name a compound by IUPAC rules, or draw it from its name.","Highest-priority group sets the suffix and lowest locant; longest chain containing it; substituents alphabetical; E/Z and R/S as prefixes.","","DAT-3.5.B",0],["DAT-3.5.B",2103,"Identify every functional group in a structure.","Know alcohol, ether, aldehyde, ketone, acid, ester, amide, amine, nitrile, acid chloride, anhydride, epoxide, phenol, thiol, imine, enamine.","","",0],["DAT-3.5.C",2105,"Assign R/S configuration to a stereocenter and identify chiral molecules.","Rank by atomic number (CIP), lowest priority to the back, trace 1→2→3; if the lowest points forward, reverse the answer.","","",0],["DAT-3.5.D",2106,"Classify a pair of structures as identical, enantiomers, diastereomers, meso or constitutional isomers.","Enantiomers invert every stereocenter, diastereomers some; meso has stereocenters and an internal mirror plane; max 2ⁿ stereoisomers.","","DAT-3.5.C",0],["DAT-3.5.E",2107,"Pick the most stable Newman or chair conformation.","Anti \u003c gauche \u003c eclipsed in energy; bulky chair substituents go equatorial; a ring flip swaps axial and equatorial.","","",0],["DAT-3.5.F",2108,"Classify a ring as aromatic, antiaromatic or nonaromatic.","Cyclic, planar, fully conjugated with 4n + 2 π electrons is aromatic; 4n is antiaromatic; count lone pairs only if they sit in the p system.","","",0],["DAT-3.5.G",2109,"Compare bond lengths, bond angles and hybridization across a structure.","More s character means shorter, stronger C–H bonds: sp 180°, sp² 120°, sp³ 109.5°; triple \u003c double \u003c single in length.","","",0],["DAT-3.5.H",2110,"Rank carbocations, radicals, carbanions and alkenes by stability.","Carbocations and radicals: allylic/benzylic ≈ 3° > 2° > 1° > methyl (hyperconjugation, resonance); carbanions the reverse; more substituted and trans alkenes are more stable.","","",0]]}]},{"n":4,"title":"Perceptual Ability","scope":"core","topics":[{"n":1,"title":"Apertures","los":[["DAT-4.1.A",2111,"Identify the one aperture a 3-D object can pass through straight on, from any starting face.","The object may be rotated before entry but not turned once in; the opening is its exact outer silhouette at the same scale; hidden parts are regular and symmetric indentations repeat.","","",0],["DAT-4.1.B",2112,"Eliminate aperture choices by proportion and by a single distinctive feature before matching the full outline.","Many wrong openings have the right shape but wrong size or ratio; check the longest dimension and one asymmetric notch first.","","",0]]},{"n":2,"title":"View Recognition","los":[["DAT-4.2.A",2113,"Select the missing top, front or end view given the other two orthographic views.","Top view upper left, front lower left, end lower right; top and front share width, front and end share height; hidden edges are dotted.","","",0],["DAT-4.2.B",2114,"Eliminate view choices by checking solid vs dotted lines and edge alignment with the given views.","Every edge in one view must project to a line or point in the others; a feature visible in one view may be hidden (dotted) in another.","","",0]]},{"n":3,"title":"Angle Discrimination","los":[["DAT-4.3.A",2115,"Rank four interior angles from smallest to largest.","Compare the openness at equal distance from each vertex; mentally rotate so one arm is horizontal; decide the most extreme angles first.","","",0]]},{"n":4,"title":"Paper Folding","los":[["DAT-4.4.A",2116,"Determine the hole pattern on a square sheet after it is unfolded.","Unfold in reverse order, reflecting each hole across each fold line; the paper is never turned over; holes per punch = layers at that spot.","","",0],["DAT-4.4.B",2117,"Eliminate unfold choices by counting the expected holes and checking which quadrants must be symmetric.","Total holes = punches × layers; a fold line is always a mirror axis of the final pattern.","","DAT-4.4.A",0]]},{"n":5,"title":"Cube Counting","los":[["DAT-4.5.A",2118,"Count the cubes in a figure that have a given number of painted faces.","Cubes are cemented and equal; every exposed face is painted except the resting bottom; hidden cubes exist only where needed for support; never zero.","","",0],["DAT-4.5.B",2119,"Tally every cube in a figure by painted-face count in one systematic pass, then answer all the questions on that figure from the tally.","Go column by column, front to back, and record 1–5 for each cube; the tally total must equal the cube count.","","DAT-4.5.A",0]]},{"n":6,"title":"3-D Form Development","los":[["DAT-4.6.A",2120,"Identify which 3-D figure a flat pattern forms when folded.","Faces adjacent in the pattern stay adjacent; opposite faces of a cube are never adjacent in the net; marked or shaded faces fix orientation.","","",0],["DAT-4.6.B",2121,"Eliminate folded-figure choices by checking one distinctive face pair or a face count.","Count faces and edges first; then test which face a marked edge must meet; one impossible adjacency rejects a choice.","","DAT-4.6.A",0]]}]},{"n":5,"title":"Reading Comprehension","scope":"core","topics":[{"n":1,"title":"Locating and comprehending information","los":[["DAT-5.1.A",2122,"Locate the passage sentence that answers a detail question and match it to the choice that restates it.","Detail answers paraphrase the text; choices that copy its wording but change a qualifier, number or relationship are traps.","","",0],["DAT-5.1.B",2123,"Identify the main idea of a passage or paragraph.","The main idea covers the whole passage; choices that are true of one paragraph only are too narrow, ones that go beyond it too broad.","","",0],["DAT-5.1.C",2124,"Infer the meaning of a technical term or phrase from its context in the passage.","Passages define their terms nearby — by apposition, example or contrast; use the passage's meaning, not outside knowledge.","","",0],["DAT-5.1.D",2125,"Judge whether a statement is supported, contradicted or not addressed by the passage.","Except/not and true-statement items require checking every choice against the text; 'not addressed' is not 'false'.","","",0]]},{"n":2,"title":"Analyzing and inferring","los":[["DAT-5.2.A",2126,"Draw an inference that follows necessarily from stated facts in the passage.","A correct inference needs no outside facts and no extra assumption; reject extreme words (always, never, proves).","","",0],["DAT-5.2.B",2127,"Identify the author's purpose, tone or attitude toward a claim.","Scientific passages are mostly neutral-informative; tone choices like hostile or ecstatic are rarely right.","","",0],["DAT-5.2.C",2128,"Trace a cause–effect sequence, comparison or chronology described in the passage.","Map the passage's structure (who, what, when, why) as you read so sequence questions take seconds.","","",0]]},{"n":3,"title":"Passage strategy and timing","los":[["DAT-5.3.A",2129,"Complete one passage and its questions in about 20 minutes with every item answered.","60 min / 3 passages ≈ 20 min each, ≈ 72 s per item; mark slow items and return; a blank scores the same as a wrong answer.","","",0]]}]},{"n":6,"title":"Quantitative Reasoning","scope":"core","topics":[{"n":1,"title":"Algebra","los":[["DAT-6.1.A",2130,"Solve linear, quadratic and systems of equations and simplify algebraic expressions.","Factor or use x = (−b ± √(b² − 4ac))/2a; eliminate or substitute for systems; check that the answer fits the original.","","",0],["DAT-6.1.B",2131,"Solve a linear or compound inequality and express its solution set.","Multiplying or dividing by a negative flips the inequality sign.","","",0],["DAT-6.1.C",2132,"Simplify and evaluate expressions with exponents, roots and scientific notation.","a^m a^n = a^(m+n); (a^m)^n = a^(mn); a^(−n) = 1/a^n; a^(1/n) = ⁿ√a.","","",0],["DAT-6.1.D",2133,"Solve equations and inequalities with absolute value.","|x| = a gives x = ±a; |x| \u003c a gives −a \u003c x \u003c a; |x| > a gives x \u003c −a or x > a.","","",0],["DAT-6.1.E",2134,"Set up and solve a ratio or proportion, including direct and inverse variation.","a/b = c/d ⇒ ad = bc; direct y = kx, inverse y = k/x; part-to-part vs part-to-whole ratios differ.","","",0],["DAT-6.1.F",2135,"Read and interpret graphs of lines and functions: slope, intercepts, intersections, transformations.","Slope = Δy/Δx; y = mx + b; parallel lines share slope, perpendicular slopes multiply to −1.","","",0]]},{"n":2,"title":"Data Analysis, Interpretation and Sufficiency","los":[["DAT-6.2.A",2136,"Extract and combine values from a table, bar chart or line graph to answer a question.","Read the axes, units and scale before any value; percent change = (new − old)/old × 100.","","",0],["DAT-6.2.B",2137,"Decide whether the given statements are sufficient to answer a question, alone or together.","Test each statement alone, then together; sufficiency means one determined value, not the value itself; don't compute what you only need to know exists.","","",0]]},{"n":3,"title":"Quantitative Comparison","los":[["DAT-6.3.A",2138,"Compare two quantities and decide which is greater, whether they are equal, or whether the relationship can't be determined.","Try special cases (0, 1, negatives, fractions); if different cases give different orders, it can't be determined.","","",0],["DAT-6.3.B",2139,"Simplify both sides identically to compare them without computing exact values.","Add, subtract or multiply by a positive on both sides; multiplying by an unknown sign is not allowed.","","DAT-6.3.A",0]]},{"n":4,"title":"Probability and Statistics","los":[["DAT-6.4.A",2140,"Calculate the probability of compound events: and/or, independent, dependent and complementary.","P(A and B) = P(A)P(B|A); P(A or B) = P(A) + P(B) − P(A and B); P(at least one) = 1 − P(none).","","",0],["DAT-6.4.B",2141,"Count arrangements with permutations and combinations.","nPr = n!/(n − r)! when order matters; nCr = n!/[r!(n − r)!] when it does not.","","",0],["DAT-6.4.C",2142,"Calculate and compare mean, median, mode, range and standard deviation, including the effect of changing a data point.","Mean = sum/n, so a new mean gives the missing value by sum; an outlier moves the mean, not the median; adding a constant leaves SD unchanged.","","",0],["DAT-6.4.D",2143,"Find a weighted average or the combined mean of two groups.","Combined mean = (n₁x̄₁ + n₂x̄₂)/(n₁ + n₂); it lies closer to the larger group's mean.","","",0]]},{"n":5,"title":"Applied Mathematics (Word) Problems","los":[["DAT-6.5.A",2144,"Solve rate, distance and work problems.","d = rt; combined work: 1/t = 1/t₁ + 1/t₂; average speed = total distance / total time, not the mean of speeds.","","",0],["DAT-6.5.B",2145,"Solve percent, discount, markup and interest problems.","Successive percent changes multiply (×1.2 then ×0.8 = ×0.96); simple I = Prt; compound A = P(1 + r)^t.","","",0],["DAT-6.5.C",2146,"Solve mixture and concentration problems.","Amount of solute is conserved: c₁V₁ + c₂V₂ = c_f(V₁ + V₂).","","",0],["DAT-6.5.D",2147,"Convert units and solve age, consecutive-integer and number-relationship problems by translating words into equations.","Chain conversion factors so units cancel; define one variable, write every other quantity in terms of it.","","",0]]}]}]},{"id":"ai-safety","title":"AI Safety","code":"AIS","track":"safety","requires":["programming","calculus"],"units":[{"n":1,"title":"ML foundations for safety","scope":"core","topics":[{"n":1,"title":"The transformer","los":[["AIS-1.1.A",2148,"Trace a token through a decoder-only transformer — embedding, residual stream, attention, MLP, unembedding — and say what each component reads from and writes to the residual stream.","Every layer adds to one shared residual stream; attention moves information between positions, MLPs transform each position separately. Causal masking lets position t attend only to positions ≤ t; sampling is from softmax(logits / T).","","",0],["AIS-1.1.B",2149,"Calculate a transformer's parameter count from d_model, n_layers and vocabulary size (drill: compute).","Per layer ≈ 12·d_model² (4d² attention + 8d² MLP with d_mlp = 4d); embeddings add V·d (×2 if untied).","","",0]]},{"n":2,"title":"Pretraining, compute and scaling laws","los":[["AIS-1.2.A",2150,"Estimate training compute from parameters and tokens, and convert it to chip-days at a stated utilisation (drill: compute).","C ≈ 6ND (2ND forward, 4ND backward); time = C / (N_chips × peak FLOP/s × MFU).","","",0],["AIS-1.2.B",2151,"Find the compute-optimal model size and token count for a budget with the Chinchilla rule (drill: compute).","Compute-optimal D ≈ 20N; with C = 6ND, N ≈ √(C/120).","","AIS-1.2.A",0],["AIS-1.2.C",2152,"Extrapolate loss from a fitted power law, and explain why smooth loss gains need not predict when a specific capability appears (drill: compute).","L(C) = L∞ + a·C^(−α) is a straight line on log–log axes above the irreducible loss. Task metrics can jump with scale; part of 'emergence' is the choice of a thresholded metric.","","",0],["AIS-1.2.D",2153,"Decompose growth in effective compute into hardware/spend and algorithmic efficiency, and project it a few years forward (drill: compute).","IASR 2026: training compute ~5×/yr, algorithmic efficiency 2–6×/yr; the factors multiply.","","",0]]},{"n":3,"title":"Post-training — RLHF, RLAIF, DPO and reasoning models","los":[["AIS-1.3.A",2154,"Lay out the RLHF pipeline — SFT, preference data, reward model, RL with a KL penalty — and say what each stage contributes.","Objective: maximise E[r_φ(x, y)] − β·KL(π ‖ π_ref); the KL term keeps the policy near the SFT model and limits reward-model exploitation. PPO clips the policy ratio to [1 − ε, 1 + ε] so one update can't move the policy far.","","",0],["AIS-1.3.B",2155,"Calculate preference probabilities from a Bradley–Terry reward model (drill: compute).","P(y₁ ≻ y₂) = σ(r₁ − r₂); a reward gap of 1 ≈ 73 %, of 2 ≈ 88 %.","","",0],["AIS-1.3.C",2156,"Contrast RLHF, RLAIF/constitutional feedback and DPO by where the preference signal comes from and whether a separate reward model is trained (drill: classify).","DPO solves the same KL-regularised objective in closed form from preference pairs; RLAIF replaces human raters with a model guided by written principles.","","",0],["AIS-1.3.D",2157,"Explain how RL on verifiable rewards and inference-time compute produce reasoning models, and what that shifts for evaluation.","IASR 2026: much recent gain comes from post-training and test-time compute, so capability can jump without a bigger pretraining run — and an eval must fix the inference budget it tested at.","","",0]]}]},{"n":2,"title":"Alignment problems","scope":"core","topics":[{"n":1,"title":"Specification gaming and reward hacking","los":[["AIS-2.1.A",2158,"Classify a described failure as specification gaming, reward hacking/tampering, goal misgeneralisation, sycophancy, deceptive alignment or a plain capability failure (drill: classify).","Ask in order: was the objective itself wrong (specification gaming)? was the reward signal exploited or tampered with (reward hacking)? is the goal wrong only off-distribution (misgeneralisation)? is the user's view echoed (sycophancy)? is good behaviour strategic (deception)? none — it just couldn't (capability).","","",0],["AIS-2.1.B",2159,"Explain Goodhart's law and predict how a proxy reward diverges from the true objective as optimisation pressure grows.","Proxy and target correlate in the bulk of the distribution and decouple in the tails that strong optimisation reaches. Reward-model overoptimisation: gold reward rises, then falls, as KL from the initial policy grows.","","",0],["AIS-2.1.C",2160,"Identify reward hacking in a described coding or agentic transcript — special-casing tests, editing the grader, claiming unverified success — and say what it does to the measurement (drill: classify).","A pass won by exploiting the checker scores capability that isn't there; trained on, it reinforces the habit. Read transcripts, not only scores.","","",0]]},{"n":2,"title":"Goal misgeneralisation and inner alignment","los":[["AIS-2.2.A",2161,"Distinguish goal misgeneralisation from capability misgeneralisation in a described distribution shift (drill: classify).","Goal misgeneralisation: capabilities carry over but pursue the wrong goal (the CoinRun agent runs right, not to the coin). Capability misgeneralisation: the agent just becomes incompetent.","","",0],["AIS-2.2.B",2162,"Distinguish outer from inner misalignment in a described failure (drill: classify).","Outer: the training objective is wrong. Inner: the objective was fine on the training data but the learned model pursues something else; many goals fit the same training reward.","","",0]]},{"n":3,"title":"Sycophancy and honesty","los":[["AIS-2.3.A",2163,"Trace sycophancy back to preference training, and design a paired-prompt test that separates it from genuine agreement.","Raters reward agreeable answers. Prompts identical except for the user's stated view isolate the effect; measure answer flips.","","",0],["AIS-2.3.B",2164,"Distinguish confabulation, sycophancy and deception by what the model represents as true (drill: classify).","Confabulation: no reliable knowledge. Sycophancy: knowledge overridden by a social cue. Deception: represents the truth and instrumentally induces a false belief.","","",0]]},{"n":4,"title":"Deceptive alignment, scheming and situational awareness","los":[["AIS-2.4.A",2165,"State the preconditions for scheming — a misaligned goal, situational awareness, and a reason to look aligned during training or testing — and judge which ones a described model shows (drill: classify).","Without situational awareness a model can't condition behaviour on being watched; without a goal that outlasts the episode it has no reason to.","","",0],["AIS-2.4.B",2166,"Explain instrumental convergence and why shutdown resistance and resource acquisition follow from many different goals.","Staying on, keeping its goal and gaining resources help with almost any objective — which is why FSF frames misalignment risk as interfering with operators' ability to direct, modify or shut down.","","",0],["AIS-2.4.C",2167,"Explain how evaluation awareness and sandbagging undermine safety testing, and name the evidence that would reveal them.","IASR 2026: models increasingly recognise test settings. Signs: verbalised test-awareness, gaps between eval-like and deployment-like framings, underperformance that a light fine-tune removes.","","",0]]}]},{"n":3,"title":"Alignment techniques","scope":"core","topics":[{"n":1,"title":"Training for safety","los":[["AIS-3.1.A",2168,"Choose among pretraining-data filtering, SFT, preference training and constitutional training for a stated safety goal, and say what each can't fix.","Data filtering removes knowledge; post-training mostly shapes whether knowledge is expressed, so later fine-tuning can undo it. Constitutional AI: principles drive self-critique (SL stage) and AI preference labels (RL stage).","","AIS-1.3.A",0],["AIS-3.1.B",2169,"Explain why refusal training is shallow against fine-tuning on released weights, and what tamper-resistant training attempts.","A small harmful fine-tune can strip refusals; safeguards on open weights are easy to remove and the weights can't be recalled (IASR 2026).","","",0]]},{"n":2,"title":"Scalable oversight","los":[["AIS-3.2.A",2170,"Match debate, recursive reward modelling, iterated amplification and AI-assisted critique to how each lets a weak overseer judge a strong model (drill: classify).","Debate: two models argue, a judge decides. RRM: models help humans evaluate the next model. Amplification: decompose into checkable sub-tasks. Critique: a model points out flaws for the human.","","",0],["AIS-3.2.B",2171,"State the empirical condition debate needs, and read a debate or sandwiching result to say whether oversight improved.","Debate works if lies are harder to defend than truths; test with weaker judges' accuracy under debate vs a single consultant. Sandwiching: non-experts with assistance on tasks the model can do, scored against experts.","","",0]]},{"n":3,"title":"Weak-to-strong generalisation","los":[["AIS-3.3.A",2172,"Calculate performance gap recovered from weak, weak-to-strong and strong-ceiling scores (drill: compute).","PGR = (W2S − weak) / (ceiling − weak); 1 = full recovery, 0 = the strong student only imitates the weak labels.","","",0],["AIS-3.3.B",2173,"Explain what weak-to-strong is an analogy for and where the analogy breaks.","Humans supervising superhuman models. It breaks because today's strong students weren't trained to mislead, and imitating human errors may be easier than imitating a weak model's.","","",0]]},{"n":4,"title":"Robustness and misuse safeguards","los":[["AIS-3.4.A",2174,"Classify a described jailbreak by mechanism — competing objectives, mismatched generalisation, many-shot, prompt injection — without reproducing it (drill: classify).","Competing objectives pit helpfulness against harmlessness; mismatched generalisation uses inputs safety training didn't cover (encodings, low-resource languages); prompt injection arrives through data, not the user turn.","","",0],["AIS-3.4.B",2175,"Explain why input/output classifiers plus adversarial training raise attacker cost without eliminating universal jailbreaks, and measure safeguards by cost, not only by success.","UK AISI found a universal jailbreak in every system it tested; expert effort to jailbreak bio-misuse content varied ~40× between releases; capability barely predicted safeguard strength (R² ≈ 0.1).","","",0]]}]},{"n":4,"title":"Interpretability","scope":"core","topics":[{"n":1,"title":"Features and superposition","los":[["AIS-4.1.A",2176,"State the linear representation hypothesis and explain why superposition makes neurons polysemantic.","Features are directions in activation space. With sparse features a model stores more features than dimensions, at the cost of interference, so features aren't neuron-aligned.","","",0],["AIS-4.1.B",2177,"Predict whether a toy model stores features in superposition from their sparsity and importance.","Dense features: the top-d by importance get dedicated dimensions, the rest are dropped. As sparsity rises, features share dimensions (antipodal pairs, then polytopes).","","",0]]},{"n":2,"title":"Sparse autoencoders","los":[["AIS-4.2.A",2178,"Write the SAE objective, explain each term, and name its failure modes (dead latents, feature splitting, absorption).","L = ‖x − x̂‖² + λ‖f‖₁ with a dictionary wider than d_model; dictionary size changes which features appear, and absorption makes a latent's label misleading.","","",0],["AIS-4.2.B",2179,"Evaluate an SAE from variance explained, mean L0 and the loss increase when it is spliced into the model (drill: compute).","FVE = 1 − ‖x − x̂‖²/‖x − x̄‖²; report CE-loss increase on substitution; sparsity and fidelity trade off along a frontier.","","",0]]},{"n":3,"title":"Circuits and causal interventions","los":[["AIS-4.3.A",2180,"Explain how a previous-token head and an induction head compose to copy in-context sequences.","K-composition: the induction head's keys read the previous-token head's output, so it attends to the token after the earlier occurrence of the current token.","","",0],["AIS-4.3.B",2181,"Design an activation-patching experiment and compute the normalised logit difference recovered (drill: compute).","Patch clean activations into the corrupted run; recovered = (LD_patched − LD_corrupt) / (LD_clean − LD_corrupt).","","",0],["AIS-4.3.C",2182,"Classify the evidence behind a described interpretability claim as correlational (probe, attention pattern, max-activating examples) or causal (ablation, patching, steering) (drill: classify).","Only an intervention shows the model uses a representation; a probe shows it is decodable.","","",0]]},{"n":4,"title":"Probing, steering and interpretability for safety cases","los":[["AIS-4.4.A",2183,"Design a linear probe with a control task and report its selectivity (drill: compute).","Selectivity = probe accuracy − control-task accuracy; a high-capacity probe can learn the task itself.","","",0],["AIS-4.4.B",2184,"Explain how a contrastive steering vector is built and what a successful steer does and doesn't show.","v = mean(act | A) − mean(act | B); adding αv shifting behaviour shows the direction is causally used, not that it is the model's concept.","","",0],["AIS-4.4.C",2185,"Judge what interpretability can contribute to a safety case today — audits, deception probes, monitors — and where it can't carry the argument.","Useful as one layer; not yet enumerative, and robustness against a model optimising against the probe is unproven.","","AIS-4.3.C",0]]}]},{"n":5,"title":"Evaluation science","scope":"core","topics":[{"n":1,"title":"What an eval measures","los":[["AIS-5.1.A",2186,"Classify a described eval as capability or propensity, and as static benchmark, agentic task, red-team exercise or human uplift study (drill: classify).","Capability: can it, under best elicitation? Propensity: will it, under realistic conditions? The two need different setups and support different claims.","","",0],["AIS-5.1.B",2187,"Write a threat model that links a capability to a harm pathway, and use it to decide what an eval must measure.","Actor, resources, steps, and the bottleneck the model might remove; an eval targets the bottleneck, not the topic.","","",0]]},{"n":2,"title":"Validity, contamination and saturation","los":[["AIS-5.2.A",2188,"Spot the validity flaw in a described eval design — construct mismatch, contamination, saturation, leaky grader, answerable shortcut, unrealistic environment (drill: spot the flaw).","Construct validity asks whether the score tracks the threat-model capability. IASR 2026: benchmarks are often outdated, narrow or contaminated, and pre-deployment tests often fail to predict real-world performance.","","",0],["AIS-5.2.B",2189,"Detect and mitigate contamination with canary strings, private held-out sets, perturbed items and release-date splits.","Contamination inflates scores through memorisation; a gap between original and rephrased items is the signature.","","",0],["AIS-5.2.C",2190,"Explain why recognition-style (MCQ) knowledge benchmarks misjudge real-world capability, and what open-ended and agentic tasks add.","Recognising an answer ≠ producing it or executing it; tacit knowledge and multi-step execution are usually the bottlenecks. Near-ceiling scores also compress differences.","","",0]]},{"n":3,"title":"Statistics for evals","los":[["AIS-5.3.A",2191,"Compute pass@k from n samples with c correct using the unbiased estimator (drill: compute).","pass@k = 1 − C(n − c, k) / C(n, k); not the same as 1 − (1 − c/n)^k when n is small.","","",0],["AIS-5.3.B",2192,"Put a confidence interval on an eval score and decide whether two models really differ (drill: compute).","SE = √(p(1 − p)/n), 95 % CI ≈ p ± 1.96 SE; repeated samples of the same item are clustered — cluster SEs by item (AISI repeats each task 10×).","","",0],["AIS-5.3.C",2193,"Compute Cohen's κ for rubric-graded outputs and decide whether grading (human or model) is reliable enough to threshold on (drill: compute).","κ = (p_o − p_e) / (1 − p_e); below ~0.6 is weak. Validate model graders against expert labels before trusting them.","","",0],["AIS-5.3.D",2194,"Compute the sample size per arm needed to detect a target difference between two success rates (drill: compute).","n ≈ (z_α/2 + z_β)² · [p₁(1 − p₁) + p₂(1 − p₂)] / (p₁ − p₂)²; at α = 0.05, power 0.8, (1.96 + 0.84)² ≈ 7.85.","","",0]]},{"n":4,"title":"Elicitation and sandbagging","los":[["AIS-5.4.A",2195,"List the levers of elicitation — prompting, scaffolds and tools, best-of-n, fine-tuning, helpful-only variants, inference budget — and judge whether a described campaign was adequate for a rule-out claim (drill: spot the flaw).","PF v2: test at top-tier settings, with a helpful-only variant and the best scaffolds; any one result is a lower bound, not a ceiling. A rule-out is only as strong as the elicitation behind it.","","",0],["AIS-5.4.B",2196,"Estimate the elicitation gap and widen a threshold margin for future scaffolding gains (drill: compute).","Gap = best-elicited − default score; Anthropic's six-month eval interval and PF's lower-bound language both assume later elicitation will find more.","","",0],["AIS-5.4.C",2197,"Design a check for sandbagging: fine-tuning recovery, password-locked controls, consistency across framings.","If a small fine-tune restores much higher scores, the original number measured willingness, not capability; PF asks for elicitation that overcomes deliberate underperformance or a conservative upper bound.","","AIS-2.4.C",0]]},{"n":5,"title":"Reporting evaluation results","los":[["AIS-5.5.A",2198,"Read a system card's dangerous-capability section and write a one-page briefing for a decision-maker: what was tested, how hard, against what baseline, and what was concluded.","Separate evidence (scores, elicitation, baselines, CIs) from judgement (the threshold call); flag redactions and untested pathways.","","",0],["AIS-5.5.B",2199,"Critique a system card or eval report for missing information — elicitation detail, human/expert baselines, uncertainty, threat-model link (drill: spot the flaw).","A score with no baseline and no interval can't be compared to a threshold.","","",0]]}]},{"n":6,"title":"Dangerous-capability evaluations and red-teaming (methodology)","scope":"core","topics":[{"n":1,"title":"Threat models by domain","los":[["AIS-6.1.A",2200,"Identify, for a described result, which actor tier (novice, expert, state programme) and which kind of help (knowledge, troubleshooting, end-to-end execution) a framework's threshold is keyed to (drill: map to framework).","PF v2 Bio/Chem High: meaningful counterfactual help to novices with known threats; Critical: experts to novel threats, or a full cycle without humans. RSP CBRN thresholds are written as uplift to defined actor tiers (e.g. moderately resourced state programmes).","","",0],["AIS-6.1.B",2201,"Apply PF v2's five tracking criteria to decide whether a proposed risk belongs in a tracked category.","Plausible, measurable, severe (thousands dead or hundreds of $bn), net new (not achievable with pre-2021 tools), instantaneous or irremediable.","","",0]]},{"n":2,"title":"Uplift studies","los":[["AIS-6.2.A",2202,"Design an uplift RCT at the methodology level: participant population matched to the threat actor, internet-only control arm, model-assisted arm, blinded expert grading on a pre-registered rubric and threshold.","Uplift is counterfactual: compare against what the actor could already do without the model, not against zero.","","AIS-5.1.B",0],["AIS-6.2.B",2203,"Compute an uplift effect — difference in proportions, relative risk, and its uncertainty — from arm-level counts (drill: compute).","RR = p_treat / p_control; UK AISI reported non-specialists with a frontier model 4.7× more likely to produce an accurate protocol. With small arms the CI on RR is wide; report it.","","AIS-5.3.B",0],["AIS-6.2.C",2204,"Spot the validity flaw in a described uplift study — proxy outcome, weak control, underpowered arms, unblinded graders, participants unlike the threat actor (drill: spot the flaw).","Written-protocol accuracy is a proxy for real-world success; IASR 2026 calls real-world uplift highly uncertain.","","",0]]},{"n":3,"title":"Agentic, autonomy and AI R&D evals","los":[["AIS-6.3.A",2205,"Project a 50 %-success task-time horizon forward with a doubling time, and find when it crosses a stated horizon (drill: compute).","h(t) = h₀ · 2^(t / T_d); IASR 2026 cites a ~7-month doubling, AISI ~8 months for cyber tasks; t = T_d · log₂(h / h₀).","","",0],["AIS-6.3.B",2206,"Lay out an agentic eval in an Inspect-style harness — dataset, solver/scaffold, tools, sandbox, scorer — and name the ways it can be reward-hacked or under-elicited.","Dataset → solver → scorer; the sandbox bounds what the agent can touch; stage-wise sub-task scores show where an end-to-end chain breaks (RepliBench: strong early stages, weak later ones).","","AIS-2.1.C",0]]},{"n":4,"title":"Red-teaming and hazardous results","los":[["AIS-6.4.A",2207,"Plan a red-team campaign: scope, threat model, red-teamer expertise, success criteria, severity rubric, and handling of hazardous outputs.","PF v2 uses expert deep dives to validate automated evals; hazardous transcripts need restricted storage and cleared graders.","","",0],["AIS-6.4.B",2208,"Distinguish model red-teaming, safeguards testing and automated red-teaming, and say what claim each result licenses (drill: classify).","Model red-teaming probes capability; safeguards testing measures attacker effort to bypass deployed protections; automated red-teaming scales coverage but misses novel attacks.","","",0],["AIS-6.4.C",2209,"Score red-team outputs with a severity/actionability rubric and report the harmful-response rate by category with a confidence interval (drill: compute).","Rate = flagged / attempts with a Wilson or normal CI; weight by severity; report per attack category, not only pooled.","","AIS-5.3.B",0],["AIS-6.4.D",2210,"Decide what in an eval result can be published, what must be redacted, and what goes only to authorities.","Publish methods, aggregates and thresholds; withhold operational content. RSP Risk Reports must mark redactions; institutes' disclosure depends on each testing agreement.","","",0]]}]},{"n":7,"title":"Control, monitoring and security","scope":"core","topics":[{"n":1,"title":"AI control","los":[["AIS-7.1.A",2211,"Classify a control protocol — trusted monitoring, untrusted monitoring, defer-to-trusted, trusted editing, resampling — and predict its safety–usefulness trade-off (drill: classify).","Control assumes the strong model may be scheming and asks whether the protocol still prevents harm; a red team plays the model. 'Trusted' = weaker but not scheming; human audit budget is the scarce resource.","","",0],["AIS-7.1.B",2212,"Compute the probability a protocol catches a scheming model before it succeeds, from audit fraction, monitor recall and number of attack attempts (drill: compute).","If each attempt is caught with probability p, P(caught at least once in k) = 1 − (1 − p)^k; the attacker's best response is few, well-chosen attempts.","","",0],["AIS-7.1.C",2213,"Explain chain-of-thought monitorability and what would destroy it.","CoT monitoring works while hard reasoning must pass through readable text; optimisation pressure on the CoT and latent reasoning erode it.","","",0]]},{"n":2,"title":"Monitoring, kill chains and incident response","los":[["AIS-7.2.A",2214,"Map a described misuse scenario onto a kill chain and choose the layer where breaking it is cheapest (drill: classify).","Defence in depth (IASR 2026): access controls → classifiers → usage monitoring → incident response; each layer only has to stop some attempts.","","",0],["AIS-7.2.B",2215,"Compute residual risk of layered defences assuming independence, and say why correlated failures break the estimate (drill: compute).","P(all fail) = Π pᵢ only if failures are independent; a universal jailbreak or shared blind spot correlates the layers.","","",0]]},{"n":3,"title":"Model weight security","los":[["AIS-7.3.A",2216,"Match an attacker class (opportunistic, cybercrime, insider, state operation) to the weight-security level needed and the controls it implies (drill: classify).","RAND SL1–SL5 scale from amateur attackers to top-priority state operations; controls include multi-party access, egress limits, hardened hardware and insider-threat programmes.","","",0],["AIS-7.3.B",2217,"Explain why stolen or openly released weights remove every deployment-side safeguard.","Whoever holds the weights can fine-tune out refusals and skip monitoring; release is irreversible (IASR 2026).","","AIS-3.1.B",0]]}]},{"n":8,"title":"Frontier safety frameworks and safety cases","scope":"core","topics":[{"n":1,"title":"If-then commitments compared","los":[["AIS-8.1.A",2218,"Compare the RSP, Preparedness Framework and FSF on threshold names, tracked domains, who decides and what happens on crossing (drill: classify).","If-then: a capability threshold, early-warning evals, the safeguards it requires, and a no-deploy condition. RSP: capability thresholds, Risk Reports, LTBT review. PF: High/Critical, Capabilities + Safeguards Reports, SAG advises, Leadership decides. FSF: CCLs with alert thresholds and response plans, safety case reviews.","","",0],["AIS-8.1.B",2219,"Evaluate a framework on threshold specificity, external verification, enforceability and how it can be revised, and find who can actually say no (drill: spot the flaw).","Most frameworks are voluntary and revisable by the company; triggers vary widely across companies (IASR 2026); SAG cannot block leadership.","","",0]]},{"n":2,"title":"Anthropic Responsible Scaling Policy","los":[["AIS-8.2.A",2220,"Identify which RSP threshold or obligation a described result triggers — CBRN, AI R&D-4 affirmative misalignment-risk case, sabotage risk report (drill: map to framework).","Crossing AI R&D-4 requires an affirmative case naming the most immediate misalignment risks and mitigations; models clearly beyond Opus 4.5 get sabotage risk reports. v2 tied ASL-3 deployment and security standards to thresholds; v3 (Feb 2026) rewrote the policy around Risk Reports and Roadmaps.","","",0],["AIS-8.2.B",2221,"Explain the RSP's accountability machinery — Risk Reports with coverage dates and marked redactions, LTBT-requested external review, noncompliance reporting — and what each makes verifiable.","v3.4: unredacted Risk Reports to ≥200 staff; multiple external reviewers may split sections if all are covered.","","",0]]},{"n":3,"title":"OpenAI Preparedness Framework","los":[["AIS-8.3.A",2222,"Decide whether a described result reaches High or Critical in a tracked category and what is then required, and before when (drill: map to framework).","Tracked: Bio/Chem, Cyber, AI Self-improvement. High: safeguards must sufficiently minimise risk before deployment. Critical: also during development. Thresholds are holistic calls; scalable evals carry only indicative thresholds.","","",0],["AIS-8.3.B",2223,"Map a safeguard to the threat it answers — robustness, usage monitoring, trust-based access (malicious users) vs autonomy limits, value/instruction alignment, oversight, system architecture (misaligned model) (drill: classify).","Misuse safeguards assume a benign model and a hostile user; misalignment safeguards assume the model itself may act against you.","","",0],["AIS-8.3.C",2224,"Evaluate the marginal-risk clause: when it lets OpenAI relax safeguards and what it does to race dynamics.","Allowed only if overall risk doesn't meaningfully rise, it is publicly acknowledged, and OpenAI stays more protective than the other developer.","","",0]]},{"n":4,"title":"Google DeepMind Frontier Safety Framework","los":[["AIS-8.4.A",2225,"Identify which CCL a described capability approaches and the FSF response — alert threshold, response plan, safety case review, internal-deployment scope (drill: map to framework).","Early-warning evals fire alert thresholds before a CCL; reaching a CCL needs a safety case review before external launch, and for advanced ML R&D CCLs before large internal deployments too. v3 added a harmful-manipulation CCL; TCLs flag lesser risks sooner.","","",0]]},{"n":5,"title":"Safety cases","los":[["AIS-8.5.A",2226,"Structure a safety case as claims, arguments and evidence, and classify its argument as inability, control or trustworthiness (drill: classify).","Inability: the model can't. Control: it can't cause harm even if it tries, given the protocol. Trustworthiness: it won't.","","",0],["AIS-8.5.B",2227,"Find the weakest premise in a described safety case (drill: spot the flaw).","A case is as strong as its least-supported premise; inability arguments rest on elicitation, control arguments on red-team strength, trustworthiness arguments on evidence we mostly don't have yet.","","AIS-5.4.A",0]]}]},{"n":9,"title":"Regulation, standards, compute and coordination","scope":"core","topics":[{"n":1,"title":"EU AI Act — general-purpose AI","los":[["AIS-9.1.A",2228,"Decide from training compute whether a model is GPAI and whether it is presumed to carry systemic risk (drill: compute).","Indicative GPAI criterion: > 10²³ FLOP and generates language. Systemic risk presumed above 10²⁵ FLOP (under review); the Commission can also designate.","","AIS-1.2.A",0],["AIS-9.1.B",2229,"Identify which GPAI obligation a described provider has missed, separating all-provider duties from systemic-risk duties (drill: map to framework).","All providers: technical documentation, information for downstream providers, copyright policy, public training-content summary. Systemic risk: notify the Commission, evaluate incl. adversarial testing, assess and mitigate risk, report serious incidents, ensure cybersecurity.","","",0],["AIS-9.1.C",2230,"State the GPAI timeline, the open-source carve-out, and the role of the Code of Practice.","Obligations apply from 2 Aug 2025; Commission enforcement from 2 Aug 2026; models placed earlier comply by 2 Aug 2027. Free open-source models skip some documentation duties unless systemic-risk. The Code (Transparency, Copyright, Safety & Security) is a voluntary route to show compliance.","","",0]]},{"n":2,"title":"NIST AI RMF and standards","los":[["AIS-9.2.A",2231,"Sort described risk-management activities into Govern, Map, Measure and Manage (drill: classify).","Govern: culture, roles, policy (cuts across). Map: context and risks of a use. Measure: assess and track. Manage: prioritise, act, monitor over time.","","",0],["AIS-9.2.B",2232,"Map a Generative AI Profile risk (e.g. CBRN information or capabilities, confabulation, information security) to the Measure actions an eval team would own, and explain how voluntary standards become binding.","AI 600-1 lists 12 GAI risks with actions keyed to the four functions. Standards bind through procurement, contracts and, in the EU, harmonised standards that give a presumption of conformity.","","",0]]},{"n":3,"title":"Compute governance","los":[["AIS-9.3.A",2233,"Explain why compute is a governance lever — detectable, excludable, quantifiable, with a concentrated supply chain — and list the tools it enables (export controls, cloud KYC, reporting thresholds, on-chip mechanisms).","A handful of firms control fabrication, lithography and leading chips; frontier runs need clusters visible to the cloud providers that host them.","","",0],["AIS-9.3.B",2234,"Estimate a run's training compute from cluster size, chip throughput, utilisation and duration, and compare it to regulatory thresholds (drill: compute).","C = N_chips × FLOP/s × MFU × seconds; 10⁴ chips × 10¹⁵ FLOP/s × 0.4 × 90 days ≈ 3 × 10²⁵ FLOP.","","AIS-1.2.A",0],["AIS-9.3.C",2235,"Evaluate the weaknesses of fixed compute thresholds: algorithmic efficiency, post-training and inference compute, distillation.","A fixed FLOP line falls behind as efficiency improves 2–6×/yr; capability can be reached below it, or added after pretraining.","","AIS-1.2.D",0]]},{"n":4,"title":"International coordination and the evidence dilemma","los":[["AIS-9.4.A",2236,"Identify the coordination problem in a described scenario — race to the bottom, verification gap, free-riding, non-credible commitment (drill: classify).","Without verification, mutual restraint is unstable: each side fears the other defects.","","",0],["AIS-9.4.B",2237,"Trace the summit-and-institute track — Bletchley 2023, Seoul commitments 2024, Paris 2025, India 2026; the AISI/CAISI network; the International AI Safety Report — and what each actually produced.","Seoul: companies committed to publish safety frameworks. Institutes test pre-deployment under voluntary agreements, can't block release, and publish findings unevenly (UK AISI more, CAISI less).","","",0],["AIS-9.4.C",2238,"Explain the evidence dilemma and how if-then commitments and transparency requirements respond to it.","IASR 2026: evidence about risk arrives slower than capability; acting early risks bad policy, waiting risks exposure. If-then rules commit now to act on evidence later.","","",0]]},{"n":5,"title":"Institutions, power and contested questions","los":[["AIS-9.5.A",2239,"Map who can act on a given frontier-AI decision — labs, compute providers, governments, standards bodies, investors — and where each depends on the others.","Leverage sits at chokepoints: chips, cloud, capital, talent, market access; policy windows open when one of them shifts.","","",0],["AIS-9.5.B",2240,"Argue both sides of the open-weights question using marginal risk, irreversibility and the closed–open capability gap, and name your crux.","Open models trail the closed frontier by under a year (IASR) / 4–8 months (AISI); benefits to research and access; safeguards removable, weights unrecallable.","","",0]]}]},{"n":10,"title":"Strategy and forecasting","scope":"core","topics":[{"n":1,"title":"Drivers and timelines","los":[["AIS-10.1.A",2241,"Build a simple timeline forecast from compute growth, algorithmic progress and a benchmark trend, and name the bottleneck most likely to break it (drill: compute).","IASR 2026 bottlenecks: data, chips, capital, energy. Capability is 'jagged' — strong on some hard tasks, weak on some easy ones — so one trend line rarely means 'AGI'.","","AIS-1.2.D AIS-6.3.A",0],["AIS-10.1.B",2242,"Make probabilistic forecasts on AI questions and score them with the Brier score (drill: compute).","Brier = mean (p − o)²; 0 is perfect, 0.25 is always saying 50 %.","","",0]]},{"n":2,"title":"Takeoff and AI R&D automation","los":[["AIS-10.2.A",2243,"Explain the AI-R&D feedback loop behind fast takeoff, what limits it, and why AI R&D thresholds are the frameworks' early warning for it.","If AI multiplies research output, progress compounds (software intelligence explosion), limited by experiment compute. PF Critical: generational gains in 1/5 the 2024 time; RSP AI R&D-4; FSF ML R&D CCLs extend reviews to internal deployment.","","",0]]},{"n":3,"title":"Threat models, strategies and prioritisation","los":[["AIS-10.3.A",2244,"Classify a described scenario as misuse, malfunction/loss of control or systemic risk, and name the mitigation layer that does most against it (drill: classify).","IASR 2026 taxonomy: malicious use (content, influence, cyber, bio/chem); malfunctions (reliability, loss of control); systemic (labour, autonomy).","","",0],["AIS-10.3.B",2245,"Compare loss-of-control, misuse and power-concentration threat models on what drives their likelihood and which interventions help each.","Misuse: access and uplift → safeguards, security. Loss of control: misalignment + autonomy → alignment, control. Power concentration: AI replacing the cooperation that checks power → governance, distribution.","","",0],["AIS-10.3.C",2246,"Compare strategies for the transition — safe-lead racing, coordinated pause, defensive acceleration, frameworks-plus-regulation — by their assumptions and failure modes, and stress-test one against accelerating capability and competition.","Each strategy bets on something: verification, a lead, defence outpacing offence, or institutions keeping pace.","","",0],["AIS-10.3.D",2247,"Prioritise safety interventions by importance, tractability and neglectedness and your comparative advantage, and state a theory of change with its crux.","Theory of change: action → intermediate outcome → risk reduction. A crux is a belief whose change would flip the decision.","","",0]]}]},{"n":11,"title":"Mechanistic interpretability, deeper","scope":"extension","topics":[{"n":1,"title":"Attention circuits and attribution","los":[["AIS-11.1.A",2248,"Split an attention head into its QK and OV circuits and say what each decides.","W_QK = W_Qᵀ W_K decides where to attend; W_OV = W_V W_O decides what gets moved.","","AIS-4.3.A",0],["AIS-11.1.B",2249,"Compute a component's direct logit attribution for a correct-vs-wrong token pair (drill: compute).","DLA = (component output, scaled by the final LayerNorm) · (W_U[:, correct] − W_U[:, wrong]).","","",0]]}]},{"n":12,"title":"Agentic and multi-agent risk","scope":"extension","topics":[{"n":1,"title":"Securing tool-using agents","los":[["AIS-12.1.A",2250,"Identify the prompt-injection pathways in a described agent deployment and the least-privilege or containment control for each (drill: classify).","Untrusted data in the context is an instruction channel; limit tools, permissions and egress so a hijacked agent can do little.","","",0],["AIS-12.1.B",2251,"Explain why per-instance monitors miss distributed attacks across many agent instances.","Each instance's actions can look benign; the harm lies in the combination, so monitoring must aggregate across instances.","","AIS-7.1.A",0]]}]}]},{"id":"speaking","title":"Speaking and Articulation","code":"SP","track":"communication","requires":[],"units":[{"n":1,"title":"Breath, voice and diction","scope":"core","topics":[{"n":1,"title":"Breath support","los":[["SP-1.1.A",2252,"Breathe low and silently between phrases — ribs and abdomen expand, shoulders stay down — while reading a passage aloud, with no audible gasps.","Expansion belongs in the lower ribs, abdomen and back; a 'big breath' raises the shoulders and tightens the throat. Outflow is regulated by slow, even abdominal contraction — 'less is more', don't fill to capacity.","","",0],["SP-1.1.B",2253,"In a timed rep, sustain a steady exhale on [s] for a target count (build 4 → 8 → 16) and then speak a full sentence on one breath without trailing off.","Rosine's 4-in / 2-hold / 4-out pattern, extended to 8 and 16 on [s] or [v], trains even outflow. Sentences that fade at the end usually ran out of air, not volume — mark breath points with a slash.","","",0]]},{"n":2,"title":"Projection and resonance","los":[["SP-1.2.A",2254,"Set volume to the room: in a timed rep, deliver the same 30-second passage at conversational, small-room (~25 people) and large-room levels without pitch rising or the throat tightening.","Small classroom or office: a few steps above conversational volume; larger rooms need projection or a microphone; beginners usually err too quiet. Projection comes from breath pressure and open resonance (pharynx first, then mouth; nose only for m n ŋ), not from pushing the larynx — strain shows up as rising pitch and hoarseness.","","SP-1.1.A",0]]},{"n":3,"title":"Articulation of consonants","los":[["SP-1.3.A",2255,"Classify a consonant by manner (plosive, fricative, nasal, lateral, affricate) and voicing, and name the articulators that make it.","Plosives p b t d k g stop then release; fricatives f v s z ʃ ʒ θ ð partly block; nasals m n ŋ route through the nose; l is lateral; tʃ dʒ are affricates. Voiced/unvoiced pairs: b/p, d/t, g/k, z/s, v/f, ʒ/ʃ, dʒ/tʃ.","","",0],["SP-1.3.B",2256,"In a timed rep, read a dense technical sentence at 150 wpm with every final consonant and unstressed syllable audible on playback.","Dropped and merged sounds — 'gonna', 'dinnt', 'hunnerd', 'probly' — are the common faults; low volume makes them worse. Slowing slightly and using lips, tongue tip and teeth fully restores them; mumbling = small jaw and lip movement, slurring = rate outrunning the articulators.","","SP-1.3.A",0]]},{"n":4,"title":"Pronunciation and word choice for the ear","los":[["SP-1.4.A",2257,"Rewrite a written sentence for the ear: shorter clauses, the subject and verb early, acronyms spelled out on first use.","Listeners can't re-read; long noun stacks and late verbs overload working memory. NCA competency 5: language clear, vivid, free of unexplained jargon for this audience. Check unfamiliar names and terms against dictionary audio or someone who knows; pick one accepted pronunciation, rehearse it aloud, use it consistently (NCA 7).","","",0]]}]},{"n":2,"title":"Pace, pauses and filler words","scope":"core","topics":[{"n":1,"title":"Speaking rate","los":[["SP-2.1.A",2258,"Compute wpm from a transcript and its duration, and classify the result as slow, presentation-range, conversational or fast.","wpm = words ÷ minutes; conversation ≈ 150 (NCVS), comfortable presentation ≈ 125–150, audiobooks 150–160. Below ~100 reads as hesitant or unprepared; sustained >180 overwhelms after a minute or two.","","",0],["SP-2.1.B",2259,"In a timed 60-second rep, hold 140–160 wpm on an answer and 125–150 wpm on an explanation, checked from the transcript.","Top-scored practice talks in VirtualSpeech's data had a median of 138 wpm. Fast is the more common fault; nerves push rate up.","","SP-2.1.A",0],["SP-2.1.C",2260,"Vary rate on purpose within one answer — slow for the key claim or a hard step, faster for context — and point to where on playback.","Rate is a signal: slowing marks importance or difficulty, speeding adds momentum; one steady rate for minutes reads as monotone. RiseGuide scores both rate and how much it varies.","","SP-2.1.B",0]]},{"n":2,"title":"Pauses","los":[["SP-2.2.A",2261,"Place deliberate 1–2 second pauses after the main point, between sections and before a key number, and mark them with '/' or '//' on a script before delivering it.","Intended pauses add emphasis and signal transitions; the speaker feels them as longer than the listener does. Mark breath and pause points on the outline; a pause after a question gives the room time to think.","","",0],["SP-2.2.B",2262,"Classify a described pause as a deliberate pause, a fluency hiccup, or a filled pause, and say whether it helped or hurt.","Fluency hiccups come from losing your place or thread; a brief silent hiccup often goes unnoticed or reads as deliberate. A filled pause (um, uh) spends the same time and announces the trouble.","","",0],["SP-2.2.C",2263,"Start every on-the-spot answer with a silent 1–2 second pause instead of a filler or a restatement of the question.","Silent pausers are rated surer than filler users (Brennan & Williams 1995, in Clark & Fox Tree 2002). The opening pause is where the structure gets chosen.","","SP-2.2.A",0]]},{"n":3,"title":"Filler words","los":[["SP-2.3.A",2264,"Count fillers per minute in a recording or transcript, separating filler sounds (um, uh, er) from filler words (like, you know, so, basically, right?).","Fillers/min = count ÷ minutes; a student logged ~30 'um's in 3 minutes (10/min). Filler sounds hurt perceived effectiveness more than filler words (Laske et al. 2024).","","",0],["SP-2.3.B",2265,"In a timed 60-second rep on a random prompt, deliver with ≤ 3 filler sounds (target ≤ 1), measured from the transcript.","12 fillers/min clearly lowered listener ratings; ≤5/min was not significantly harmful — 'acceptable' is the floor, not the goal. Um announces a long delay, uh a short one: frequent ums mean the thinking is happening mid-sentence.","","SP-2.3.A SP-2.2.C",0],["SP-2.3.C",2266,"Apply awareness training and a competing response: name your top two fillers, catch them on playback, then replace each with a closed-mouth silent pause or breath in the next rep.","Awareness training (identify, record, count) alone has reduced filled pauses in JABA studies; habit reversal adds a competing response — a silent pause where the filler would go. Fillers cluster at sentence starts and transitions; 'so' and 'and' chaining sentences is the same leak.","","SP-2.3.A",0]]}]},{"n":3,"title":"Vocal variety and presence","scope":"core","topics":[{"n":1,"title":"Pitch and intonation","los":[["SP-3.1.A",2267,"End declarative sentences with a falling pitch, and in a recorded rep make every claim sentence of a 60-second answer fall rather than rise.","Rising terminals on statements (upspeak) sound like questions and invite doubt; a slight drop marks completion, serious points and the ending. A lower pitch at the close cues the room that you're done.","","",0],["SP-3.1.B",2268,"Diagnose a described voice as monotone, sing-song, upspeaking or pressed, and choose the correction.","Speakers believe they vary pitch more than listeners hear — recording is the check. Range exercise: slide from your highest to lowest comfortable note and back; use more of that range for key words.","","",0]]},{"n":2,"title":"Emphasis and volume dynamics","los":[["SP-3.2.A",2269,"Mark the one key word per sentence in a script and, on playback, stress it with pitch, volume or a pause before it — and change the meaning by moving the stress.","'I didn't say she took it' has seven meanings by stressed word; emphasis tells the listener where the information is. Stressing everything stresses nothing.","","",0],["SP-3.2.B",2270,"Pick the stronger of two recorded or described deliveries of the same line on vocal variety, and name what made the difference.","NCA 'excellent' vocal variety: exceptionally varied yet conversational, controlled pace, clearly heard, pitch that enhances the message. Variety serves meaning — random variation is as distracting as none.","","",0]]},{"n":3,"title":"Physical presence","los":[["SP-3.3.A",2271,"Hold eye contact for one complete thought per listener (about 3–5 seconds) and move across the room; on video, look at the lens for whole sentences.","Eye contact gauges reaction and engages; darting or reading notes breaks it. On a call the lens is the listener's eyes.","","",0],["SP-3.3.B",2272,"Stand or sit grounded — feet planted, hands still at rest, gestures only on purpose — and on video count distracting movements (sway, fidget, touch face) per minute.","NCA: posture, gesture, movement, facial expression and eye contact consistently reinforce the message; Toastmasters rates distracting or absent gestures 'Emerging'. Stillness reads as confidence; a gesture that matches a word (size, sequence, contrast) reinforces it.","","",0]]},{"n":4,"title":"Confidence under nerves","los":[["SP-3.4.A",2273,"Use a pre-speaking routine — two slow exhale-longer breaths, a planned first sentence, shoulders down — before class, a meeting turn or an interview answer.","Nerves speed rate, raise pitch and shorten breath; a long exhale and a known first line counter all three. Comfort Level is its own Toastmasters criterion: the audience reads ease from voice and body.","","SP-1.1.A",0],["SP-3.4.B",2274,"Cut hedges and apologies from an answer — 'sorry, this might be wrong, but', 'I just think', 'kind of' — and in a rep state the claim plainly with its real confidence level once.","Never apologise for an impromptu answer; hedging every clause signals less certainty than you have. Calibrated confidence: say 'I'm fairly sure' once, where it applies, not on every sentence.","","",0]]}]},{"n":4,"title":"Structure — answer first, signposting, endings","scope":"core","topics":[{"n":1,"title":"Answer first and the pyramid","los":[["SP-4.1.A",2275,"In a timed rep, give the answer or recommendation in the first sentence (within ~10 seconds) of a 60-second response to a random question.","Pyramid: the top line first, then the reasons that support it; any point that doesn't support the top gets cut. NCA 'excellent' thesis: every listener can state it within the opening few sentences.","","",0],["SP-4.1.B",2276,"Pick the stronger of two openings to the same question — answer-first or context-first — and say what the weaker one makes the listener wait for.","Context-first ('So, background…') makes the listener hold details with no frame to hang them on. Busy listeners (committees, managers, interviewers) decide in the first sentence whether to keep listening.","","",0],["SP-4.1.C",2277,"Group support into two or three parallel reasons and announce the count ('two reasons: cost and risk').","Reasons at one level should be the same kind of thing and not overlap; three is the most a listener reliably holds without notes.","","SP-4.1.A",0]]},{"n":2,"title":"Frames — PREP and SCQA","los":[["SP-4.2.A",2278,"In a timed 60-second rep, deliver a PREP answer: Point, Reason, Example, Point restated — each element identifiable in the transcript.","PREP = state the point, give a reason, support with one specific example, restate the point. One concrete example beats three vague ones.","","",0],["SP-4.2.B",2279,"Frame a meeting update or proposal as SCQA — Situation, Complication, Question, Answer — in four sentences.","Situation = agreed current state; Complication = what changed or went wrong; Question = the one problem to solve; Answer = the recommendation the rest supports. Close by restating the answer and the ask.","","",0],["SP-4.2.C",2280,"Choose the right frame for a described prompt — PREP (opinion), SCQA (proposal), STAR (behavioural), past–present–future (trend), problem–solution — and justify it.","The frame follows the question type; forcing STAR on an opinion question or PREP on a story wastes the structure.","","SP-4.2.A SP-4.2.B",0]]},{"n":3,"title":"Signposting and transitions","los":[["SP-4.3.A",2281,"Preview, signpost and summarise for the ear: announce the parts, mark each move ('first… the second reason… so'), and recap before closing; in a 2-minute rep, a listener can list your parts afterwards.","Spoken structure must be audible — headings don't exist out loud. Tell them what you'll say, say it, tell them what you said: redundant on paper, necessary by ear.","","",0],["SP-4.3.B",2282,"Diagnose a described rambling answer — buried point, tangent, no transitions, circling back — and name the restructure.","Rambling is usually a missing top line: the speaker is searching for the point while talking. The fix is choosing the point in the opening pause, not talking faster.","","",0]]},{"n":4,"title":"Openings and endings","los":[["SP-4.4.A",2283,"End on purpose: restate the point or give the ask in one sentence, drop pitch, then stop — no trailing 'so, yeah, that's it'.","NCA 'excellent' conclusion reflects the content and leaves a strong message or call to action. The last sentence is the one remembered; trailing off spends it.","","",0]]}]},{"n":5,"title":"Impromptu speaking — table topics, Q&A, interviews","scope":"core","topics":[{"n":1,"title":"Table topics and on-the-spot answers","los":[["SP-5.1.A",2284,"In a timed rep, take a random prompt, pause ≤ 3 seconds, and deliver a 60-second structured answer that lands within ±5 seconds of time.","Impromptu = 1–3 minutes' notice or none; the pause is for choosing the point and the frame. Hitting time is a skill: plan point, one example, close — then stop.","","SP-4.2.A SP-2.2.C",0],["SP-5.1.B",2285,"When you don't know the answer, say what you do know, what you'd need to find out, and when — in under 20 seconds, without fillers or apology.","Bluffing costs more credibility than a clear 'I don't know, here's how I'd find out'. A partial answer stated plainly is still an answer.","","",0]]},{"n":2,"title":"Handling questions","los":[["SP-5.2.A",2286,"Answer an audience question with pause → one-sentence answer → one support → check ('does that get at it?'), in under 45 seconds in a rep.","Q&A answers should be shorter than the talk's sections; the questioner wanted one thing. Repeat or rephrase the question only when the room didn't hear it — not as a stall. To return to your message, answer first, then bridge ('…and the bigger point is'); bridging without answering reads as evasion.","","SP-4.1.A",0],["SP-5.2.B",2287,"Classify a described question as clarifying, challenging, off-topic or a comment-not-a-question, and choose the response move for each.","Challenge: acknowledge the point, give your reason, don't concede what you don't believe; off-topic: brief answer, offer to follow up; comment: thank and bridge.","","",0]]},{"n":3,"title":"Interview answers","los":[["SP-5.3.A",2288,"In a timed 90–120-second rep, answer a 'tell me about a time' question in STAR with roughly 20 / 10 / 60 / 10 time split and a quantified result.","Situation ~20%, Task ~10%, Action ~60% (what *you* did, even on a team), Result ~10% with numbers. Most weak STAR answers over-spend on Situation.","","",0],["SP-5.3.B",2289,"Diagnose a described STAR answer — too much context, 'we' instead of 'I', missing result, no lesson — and fix it.","Use 'I' for your actions; state the outcome with a number and, if asked, what you'd do differently.","","SP-5.3.A",0],["SP-5.3.C",2290,"Deliver a 30-second answer to 'tell me about yourself' or 'what do you work on' that leads with the role and one through-line, then two proof points, tailored to the listener.","Present → past → why-this: start with what you do now and the thread connecting teacher, chemist and AI-safety work, not a chronological biography.","","SP-4.1.A",0]]}]},{"n":6,"title":"Explaining technical ideas","scope":"core","topics":[{"n":1,"title":"Pitching to the listener","los":[["SP-6.1.A",2291,"Before explaining, state in one sentence what the listener already knows and what they need to be able to do afterwards, and cut anything that doesn't serve it.","NCA 'excellent' topic: suited to purpose, time limit and audience, from real audience analysis. The expert's blind spot: once you know a thing it is hard to imagine not knowing it — name the prerequisite explicitly.","","",0],["SP-6.1.B",2292,"In a timed rep, explain a concept from your field in three sentences to a novice — what it is, a concrete example, why it matters — with no undefined jargon.","Three sentences force the top line; every technical term is either defined in plain words or removed. Test: could the listener repeat the gist in their own words?","","SP-6.1.A",0],["SP-6.1.C",2293,"Re-pitch the same explanation at three levels — novice, adjacent expert, specialist — changing vocabulary, depth and examples while the top line stays the same.","Depth and jargon change with the audience; the claim doesn't. Explaining a CBRN eval to a policy lawyer vs an ML engineer is the same idea with different handholds.","","SP-6.1.B",0]]},{"n":2,"title":"Concrete before abstract","los":[["SP-6.2.A",2294,"Order an explanation concrete → bridge → abstract: a specific case first, then the general rule or symbol.","Concreteness fading (McNeil & Fyfe 2012): concrete, then intermediate, then abstract beat either alone on transfer at 1 and 3 weeks (70% vs 38% at ceiling). Lead with the example the listener can picture; name the rule once they've seen it work.","","",0],["SP-6.2.B",2295,"Build an analogy for a technical idea, then state explicitly where the analogy breaks.","A good analogy maps the structure (what causes what), not surface features. Saying where it breaks prevents the listener from over-extending it.","","",0],["SP-6.2.C",2296,"Pick the stronger of two explanations of the same idea — abstract-first vs example-first, or jargon-dense vs plain — and say why.","Example-first wins for novices; experts tolerate abstract-first but still benefit from a worked case.","","SP-6.2.A",0]]},{"n":3,"title":"Small steps and checking understanding","los":[["SP-6.3.A",2297,"Break a multi-step explanation into steps of one idea each, and pause after each step for the listener to try or restate it before moving on.","Rosenshine: present new material in small steps with practice after each; aim for a high success rate before moving on.","","",0],["SP-6.3.B",2298,"Check understanding with a question that requires the listener to use the idea (predict, apply, explain back) instead of 'any questions?' or 'make sense?'.","Effective teachers ask many questions and check every student's response, not just volunteers'. 'Make sense?' gets a nod; 'what would happen if we doubled it?' gets evidence.","","",0],["SP-6.3.C",2299,"Diagnose a described misunderstanding from a listener's answer and re-explain with a different example, not the same words louder.","A wrong answer reveals the listener's model; repair the model, don't repeat the script.","","SP-6.3.B",0]]},{"n":4,"title":"Numbers, precision and visuals out loud","los":[["SP-6.4.A",2300,"State a number for the ear: round it, give one comparison ('about a third — one in three'), and say the unit.","Listeners can't hold 3.847 × 10⁻⁴; give the order of magnitude and what it means. One well-chosen number beats a list of five.","","",0],["SP-6.4.B",2301,"Talk a listener through a figure or board diagram: say what the axes are, where to look, and the one takeaway, before the details.","Supporting material should be clearly tied to the thesis and add clarity; a slide the speaker doesn't narrate is noise.","","",0]]}]},{"n":7,"title":"Persuasion and storytelling","scope":"core","topics":[{"n":1,"title":"Persuasive structure","los":[["SP-7.1.A",2302,"Outline a 2-minute pitch in Monroe's Motivated Sequence — attention, need, satisfaction, visualisation, action — one or two sentences each.","Need = the problem, who it hurts and how much; Satisfaction = a concrete step-by-step plan; Visualisation = life once solved (and answering objections); Action = one easy, immediate ask.","","",0],["SP-7.1.B",2303,"Make a recommendation that names the strongest objection and answers it before the listener raises it.","Pre-empting the obvious objection builds credibility with a sceptical audience; ignoring it invites it in Q&A. Back the answer with one piece of evidence and its source in a sentence — NCA: support tied to the thesis enhances credibility.","","SP-4.1.A",0],["SP-7.1.C",2304,"End a persuasive turn with one specific, easy ask (who does what, by when), and pick the stronger of two given asks.","'Let's think about it' is not an ask; 'can we pilot it on two evals by Friday?' is.","","",0]]},{"n":2,"title":"Storytelling","los":[["SP-7.2.A",2305,"In a timed 90-second rep, tell a story with a person, a goal, an obstacle, a turn and a point, and say the point in the last sentence.","A story needs someone wanting something and something in the way; the point is what changed. Specific details (a time, a place, a line of dialogue) make it vivid; background beyond that is cut.","","",0],["SP-7.2.B",2306,"Choose a short story or case to open a lesson or argument and connect it explicitly to the claim it illustrates.","A story that isn't tied back is an anecdote; the bridge sentence ('that's why…') makes it evidence.","","SP-7.2.A",0]]}]},{"n":8,"title":"Listening and conversation","scope":"core","topics":[{"n":1,"title":"Active listening","los":[["SP-8.1.A",2307,"Paraphrase what someone said in one sentence and confirm it ('so your concern is X — right?') before responding.","Paraphrase checks you heard the point, not just the words; it also slows a heated exchange. Answer the question they asked, not the one you prepared for.","","",0],["SP-8.1.B",2308,"Ask a follow-up question that builds on the speaker's last point rather than changing the subject, and classify given questions as open, closed or leading.","Open questions ('what led you to…') invite elaboration; closed ones confirm facts; leading ones push an answer.","","",0]]},{"n":2,"title":"Speaking in meetings","los":[["SP-8.2.A",2309,"Make a meeting contribution in ≤ 30 seconds: connect to what was just said, give your point first, one reason, and the decision or next step you want.","Short, point-first turns get heard; long preambles get interrupted. Linking ('building on Maria's point…') shows you listened and frames your turn.","","SP-4.1.A",0],["SP-8.2.C",2310,"Disagree in a meeting with acknowledge → position → reason → proposal, without hedging the position away.","Separate the idea from the person; state your view at its real confidence level and propose what would resolve it.","","SP-3.4.B",0]]}]},{"n":9,"title":"Feedback and self-review","scope":"core","topics":[{"n":1,"title":"Recording and transcripts","los":[["SP-9.1.A",2311,"Record a 60-second rep, get a transcript, and log four numbers: wpm, fillers/min, seconds to the main point, and longest silent pause.","These four map onto the app scores: Pace, Pauses/fillers, Structure; Confidence needs listening for pitch and volume. Speakers misjudge their own pace, variety and fillers until they hear and count them.","","SP-2.1.A SP-2.3.A",0],["SP-9.1.B",2312,"Score a recording against the NCA eight competencies (1–3 each, 8–24 total) and name the lowest one as the next target.","NCA competencies: topic, thesis, support, organisation, language, vocal variety, pronunciation/grammar/articulation, physical behaviours.","","",0],["SP-9.1.C",2313,"Set one measurable target per practice block (e.g. ≤ 2 fillers in 60 s, answer in first sentence), run 3–5 reps, and stop when it holds on 3 in a row.","One target per rep: trying to fix pace, fillers and structure at once fixes none. Track the number across sessions; the trend, not one take, is the evidence.","","SP-9.1.A",0]]},{"n":2,"title":"Giving and receiving feedback","los":[["SP-9.2.A",2314,"Give a 2–3 minute spoken evaluation of someone's speech: one specific commend, one specific recommend with the moment it happened, one challenge.","Toastmasters: what they excelled at, what they may want to work on, a stretch goal; feedback must be tactful, constructive and timed. Specific beats general: 'your pause before the 70% landed' not 'good pausing'. Receiving it: thank, ask one clarifying question, turn it into the next rep's target.","","",0],["SP-9.2.B",2315,"Rate a described delivery on a Toastmasters criterion (Clarity, Vocal Variety, Eye Contact, Gestures, Audience Awareness, Comfort, Interest, Well Supported) on the 1–5 scale and justify the rating.","5 Exemplary · 4 Excels · 3 Accomplished · 2 Emerging · 1 Developing; e.g. gestures 'distracting or limited' = 2.","","",0]]}]},{"n":10,

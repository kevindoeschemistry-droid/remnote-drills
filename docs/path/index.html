 of modern wushu in order and say what each changed.","1928 Central Guoshu Institute · 1958 state standardisation of forms and grading · 1986 Chinese National Research Institute of Wushu · 2003 rules add nandu, first used 2005 Worlds · 2014 Youth Olympics demo · 2026 Dakar Youth Olympics.","","",0],["WS-11.1.B",2580,"Explain how standardised taolu differ from traditional forms and why the difference exists.","Standard routines fix technique and content so performances can be judged against shared criteria; traditional forms keep lineage-specific methods and applications.","","",0]]},{"n":2,"title":"The Duanwei ranking system","los":[["WS-11.2.A",2581,"Name a duan from its number or badge and give its tier.","Primary 1–3: blue, silver, gold eagle (青鹰 银鹰 金鹰) · Middle 4–6: blue, silver, gold tiger · Advanced 7–9: blue, silver, gold dragon; three pre-duan levels below.","","",0],["WS-11.2.B",2582,"State what each Duanwei level examines and what is added at each step.","Evaluation: ethics and etiquette, theory, technique, skill. Each level's form goes solo → partner → applications; content builds 1 punching · 2 kicks · 3 grasping · 4 positioning · 5 wrestling · 6 all combined; high duan adds theory and contribution.","","",0],["WS-11.2.C",2583,"Map a goal (teaching, theory, a specific style) to the Duanwei textbook series and the duan that would test it.","4 theory books (ethics and etiquette, history, introduction, exam Q&A), 20 style books (changquan, Shaolin, taiji styles, xingyi, bagua, bajiquan…), 3 weapon courses (jianshu, duangun, erjiegun). Middle duan assumes ability to teach.","","",0],["WS-11.2.D",2584,"Perform the baoquan li salute correctly and explain its meaning in wude (martial ethics).","Right fist covered by left palm at chest height; part of the etiquette Duanwei examines.","","",0]]}]}]}];
const TRACKS = { math: "Math", science: "Science", computing: "Computing", engineering: "Engineering", health: "Health (DAT)", safety: "AI safety", communication: "Communication", athletics: "Athletics" };
const tc = (t) => `var(--t-${t}, var(--muted))`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const all = [];
const byCode = new Map();
FW.forEach((f, fi) => f.units.forEach((u) => u.topics.forEach((t) => t.los.forEach((lo) => {
  const o = { code: lo[0], pos: lo[1], do: lo[2], ek: lo[3], std: lo[4], needs: lo[5] ? lo[5].split(" ") : [], s: lo[6], fw: f, fi, unit: u, topic: t };
  all.push(o); byCode.set(o.code, o);
}))));
const total = all.length, drilled = all.filter((o) => o.s === 2).length, part = all.filter((o) => o.s === 1).length;
const fwStats = FW.map((f) => { const mine = all.filter((o) => o.fw === f); return { n: mine.length, ok: mine.filter((o) => o.s === 2).length, first: Math.min(...mine.map((o) => o.pos)), last: Math.max(...mine.map((o) => o.pos)) }; });

document.getElementById("stats").innerHTML =
  `<span><b>${total.toLocaleString()}</b> objectives</span><span><b>${FW.length}</b> frameworks</span>` +
  `<span><b>${drilled}</b> drilled · <b>${part}</b> partly · <b>${(total - drilled - part).toLocaleString()}</b> to build</span>`;
document.getElementById("railend").textContent = `${total.toLocaleString()} · finish`;

const rail = document.getElementById("rail");
FW.forEach((f, i) => {
  const st = fwStats[i];
  const b = document.createElement("button");
  b.style.flex = String(st.n);
  b.style.setProperty("--c", tc(f.track));
  b.title = `${i + 1}. ${f.title}: objectives ${st.first}–${st.last}, ${st.ok} drilled`;
  b.setAttribute("aria-label", b.title);
  b.innerHTML = `<span class="fill" style="width:${(100 * st.ok / st.n).toFixed(1)}%"></span>`;
  b.onclick = () => (location.hash = f.id);
  b.dataset.id = f.id;
  rail.appendChild(b);
});

const nav = document.getElementById("nav");
let lastTrack = null;
FW.forEach((f, i) => {
  if (f.track !== lastTrack) { const h = document.createElement("div"); h.className = "trk"; h.textContent = TRACKS[f.track] ?? f.track; nav.appendChild(h); lastTrack = f.track; }
  const st = fwStats[i];
  const b = document.createElement("button");
  b.className = "fw"; b.dataset.id = f.id; b.style.setProperty("--c", tc(f.track));
  b.innerHTML = `<span class="num">${i + 1}</span><span class="name">${esc(f.title)}</span><span class="cnt">${st.n}</span><span class="bar"><i style="width:${(100 * st.ok / st.n).toFixed(1)}%"></i></span>`;
  b.onclick = () => (location.hash = f.id);
  nav.appendChild(b);
});

const loRow = (o, showFw) => `<li class="lo" id="${esc(o.code)}">
  <span class="pos">${o.pos}</span><i class="dot s${o.s}" title="${["no drills yet", "partly drilled", "drilled"][o.s]}"></i>
  <div class="txt">${showFw ? `<div class="fwname">${esc(o.fw.title)} · ${esc(o.unit.title)}</div>` : ""}<span class="code">${esc(o.code)}</span>${o.std ? `<span class="std">${esc(o.std)}</span>` : ""}
    <div>${esc(o.do)}</div>${o.ek ? `<div class="ek">${esc(o.ek)}</div>` : ""}
    ${o.needs.length ? `<div class="needs">needs ${o.needs.map((n) => `<button class="chip" data-go="${esc(n)}" title="${esc(byCode.get(n)?.do ?? "")}">${esc(n)}</button>`).join("")}</div>` : ""}
  </div></li>`;

const view = document.getElementById("view");
function showFw(id, focus) {
  const fi = FW.findIndex((f) => f.id === id);
  const f = FW[fi < 0 ? 0 : fi], st = fwStats[fi < 0 ? 0 : fi];
  document.querySelectorAll("[data-id]").forEach((el) => el.classList.toggle("on", el.dataset.id === f.id));
  let h = `<div class="vh"><h2>${esc(f.title)}</h2><div class="chips"><span class="chip track" style="--c:${tc(f.track)}">${esc(TRACKS[f.track] ?? f.track)}</span>
    <span>objectives ${st.first}–${st.last} of ${total.toLocaleString()} · ${st.ok} of ${st.n} drilled</span>
    ${f.requires.length ? `<span>· after</span>${f.requires.map((r) => `<button class="chip" data-fw="${esc(r)}">${esc(FW.find((x) => x.id === r)?.title ?? r)}</button>`).join("")}` : `<span>· no prerequisites</span>`}</div></div>`;
  for (const u of f.units) {
    h += `<h3>Unit ${u.n} · ${esc(u.title)}${u.scope && u.scope !== "core" ? `<span class="ext">${esc(u.scope)}</span>` : ""}</h3>`;
    for (const t of u.topics) {
      const los = all.filter((o) => o.unit === u && o.topic === t).sort((a, b) => a.pos - b.pos);
      h += `<h4>${u.n}.${t.n} ${esc(t.title)}</h4><ol class="los">${los.map((o) => loRow(o, false)).join("")}</ol>`;
    }
  }
  view.innerHTML = h;
  if (focus) { const el = document.getElementById(focus); if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 1500); } }
  else window.scrollTo({ top: 0 });
}
function showSearch(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = all.filter((o) => { const s = `${o.code} ${o.std} ${o.do} ${o.ek} ${o.topic.title}`.toLowerCase(); return words.every((w) => s.includes(w)); }).sort((a, b) => a.pos - b.pos);
  document.querySelectorAll("[data-id]").forEach((el) => el.classList.remove("on"));
  view.innerHTML = `<div class="vh"><h2>${hits.length.toLocaleString()} objective${hits.length === 1 ? "" : "s"} match “${esc(q)}”</h2></div>` +
    (hits.length ? `<ol class="los results">${hits.slice(0, 300).map((o) => loRow(o, true)).join("")}</ol>${hits.length > 300 ? `<p class="empty">Showing the first 300 along the path.</p>` : ""}` : `<p class="empty">Nothing on the path matches. Try a code like CA-6.9 or a standard like 5.NF.</p>`);
}
view.addEventListener("click", (e) => {
  const go = e.target.closest("[data-go]"); if (go) { const o = byCode.get(go.dataset.go); if (o) { document.getElementById("q").value = ""; route(o.fw.id, o.code); } return; }
  const fw = e.target.closest("[data-fw]"); if (fw) location.hash = fw.dataset.fw;
});
let pending = null;
function route(id, focus) { if (location.hash.slice(1) === id) showFw(id, focus); else { pending = focus; location.hash = id; } }
function onHash() { const id = location.hash.slice(1); showFw(FW.some((f) => f.id === id) ? id : FW[0].id, pending); pending = null; }
window.addEventListener("hashchange", onHash);
let timer;
document.getElementById("q").addEventListener("input", (e) => { clearTimeout(timer); const q = e.target.value.trim(); timer = setTimeout(() => (q.length > 1 ? showSearch(q) : onHash()), 150); });
onHash();
</script>
</body>
</html>

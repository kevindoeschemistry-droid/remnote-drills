queues","los":[["CS-3.1.A",1464,"State the cost of access, insert-at-front, append and delete for arrays, dynamic arrays, singly and doubly linked lists and deques.","Arrays: O(1) index, O(n) front insert; linked lists: O(1) splice given the node, O(n) index; contiguous memory is cache-friendly.","","",0]]},{"n":2,"title":"Hash tables","los":[["CS-3.2.A",1465,"Trace insertions into a hash table under chaining, linear probing or double hashing for a given hash function, giving the final table.","Linear probing tries h, h+1, h+2 … mod m; deletion under open addressing needs tombstones.","","",0],["CS-3.2.B",1466,"Compute the load factor and expected probes for a hash table and decide when it must resize.","α = n/m; chaining: expected chain length α; linear probing degrades sharply above α ≈ 0.7.","","CS-1.4.A",0]]},{"n":3,"title":"Search trees","los":[["CS-3.3.A",1467,"Trace BST insertion and deletion and produce the in-, pre- and post-order traversals of the result.","In-order of a BST is sorted; deleting a two-child node swaps in its successor; height ranges from log n to n.","","",0],["CS-3.3.B",1468,"Trace the rotations an AVL or red-black tree performs after an insertion.","AVL keeps |balance| ≤ 1 via single or double rotations; both guarantee O(log n) height.","","CS-3.3.A",0],["CS-3.3.C",1469,"Compute the height of a B-tree or B+-tree of order m holding n keys and explain why databases use it.","Height ≈ log_m n; high fanout makes each level one disk page, so a lookup costs a few I/Os.","","",0]]},{"n":4,"title":"Heaps and priority queues","los":[["CS-3.4.A",1470,"Trace a binary heap's array after insert, extract-min and bottom-up heapify.","Children of i at 2i+1, 2i+2; sift-up/down are O(log n); bottom-up build is O(n).","","",0]]},{"n":5,"title":"Graph representations and disjoint sets","los":[["CS-3.5.A",1471,"Choose an adjacency list or matrix for a graph's density and operations and give its space and edge-query cost.","List: Θ(V + E) space, O(deg) edge test; matrix: Θ(V²) space, O(1) edge test; sparse graphs favour lists.","","CS-1.3.A",0],["CS-3.5.B",1472,"Trace union-find with union by rank and path compression and give the resulting parent array.","Both heuristics together give O(α(n)) amortized per operation — effectively constant.","","",0]]},{"n":6,"title":"Choosing a structure","los":[["CS-3.6.A",1473,"Pick the data structure for a described access pattern (LRU cache, top-k of a stream, prefix search, range queries, membership with false positives allowed) — auto-checked choice.","LRU = hash map + doubly linked list; top-k = size-k min-heap; prefixes = trie; ranges = balanced BST/B-tree; approximate membership = Bloom filter.","","CS-3.1.A CS-3.2.A CS-3.4.A",0]]}]},{"n":4,"title":"Algorithm design and graph algorithms","scope":"core","topics":[{"n":1,"title":"Sorting","los":[["CS-4.1.A",1474,"Trace the array after k passes of insertion, selection or bubble sort, a quicksort partition, or a merge step.","Insertion sort keeps a sorted prefix; selection places the k-th smallest at pass k; Lomuto/Hoare partitions differ in pivot placement.","","",0],["CS-4.1.B",1475,"Pick a sort for a scenario by worst-case time, stability, extra space and adaptivity, and explain when counting or radix sort beats Ω(n log n).","Comparison sorts need Ω(n log n) comparisons; merge sort is stable, heapsort in-place, quicksort fast on average; radix sort is O(d(n + k)).","","CS-2.3.A",0]]},{"n":2,"title":"Greedy algorithms","los":[["CS-4.2.A",1476,"Apply a greedy rule (interval scheduling by earliest finish, Huffman coding) and give its output; for coin change with non-canonical coins, produce the counterexample.","Greedy is correct only with the greedy-choice property and optimal substructure, shown by an exchange argument.","","",0],["CS-4.2.B",1477,"Build a Huffman code for given symbol frequencies and compute the encoded length in bits.","Repeatedly merge the two least-frequent nodes; total bits = Σ freq × depth.","","",0]]},{"n":3,"title":"Dynamic programming","los":[["CS-4.3.A",1478,"Fill a DP table (LCS, edit distance, 0/1 knapsack, coin-change count) and read off the optimum and one optimal solution.","Each cell is a subproblem combined from already-filled cells; traceback through choices recovers the solution.","","",0],["CS-4.3.B",1479,"Write the state, recurrence and base cases for a described optimisation problem and give its time and space.","Time ≈ (# states) × (work per state); overlapping subproblems + optimal substructure ⇒ DP.","","",0]]},{"n":4,"title":"Graph traversal","los":[["CS-4.4.A",1480,"Trace BFS or DFS from a source (neighbours in given order) and give the visit order, BFS distances or DFS discovery/finish times.","BFS finds fewest-edge paths using a queue; DFS uses a stack/recursion; both are O(V + E).","","CS-3.5.A",0],["CS-4.4.B",1481,"Produce a topological order of a DAG, or report the cycle that prevents one.","Kahn: repeatedly remove in-degree-0 vertices; DFS: reverse finish order; a back edge means a cycle.","","",0]]},{"n":5,"title":"Shortest paths and spanning trees","los":[["CS-4.5.A",1482,"Trace Dijkstra's distance array and settled set after k extractions.","Greedily settle the closest unsettled vertex and relax its edges; O((V + E) log V) with a binary heap.","","CS-3.4.A",0],["CS-4.5.B",1483,"Run Bellman–Ford to find distances or detect a negative cycle, and explain why Dijkstra fails with negative edges.","V − 1 rounds of relaxing every edge; an improvement in round V means a negative cycle.","","",0],["CS-4.5.C",1484,"Compute an MST's weight with Kruskal or Prim and give the order in which edges are chosen.","Cut property: the lightest edge crossing any cut is safe; Kruskal uses union-find.","","CS-3.5.B",0]]}]},{"n":5,"title":"Models of computation and complexity classes","scope":"core","topics":[{"n":1,"title":"Automata and languages","los":[["CS-5.1.A",1485,"Trace a DFA or NFA on an input string and decide whether it accepts.","A DFA has exactly one transition per symbol; an NFA accepts if any path does; every NFA has an equivalent DFA.","","",0],["CS-5.1.B",1486,"Write a regular expression or DFA for a described language, or argue it is not regular.","Regular languages cannot count unboundedly (e.g. aⁿbⁿ); pumping lemma gives the contradiction.","","",0],["CS-5.1.C",1487,"Derive a string from a context-free grammar and show the grammar is ambiguous by giving two parse trees.","CFGs capture nesting (balanced brackets) that regular expressions cannot; ambiguity = two leftmost derivations.","","",0]]},{"n":2,"title":"Computability and NP-completeness","los":[["CS-5.2.A",1488,"Show a described problem is undecidable by reducing the halting problem to it.","If a decider for X would yield a decider for HALT, X is undecidable; Rice's theorem covers non-trivial semantic properties.","","",0],["CS-5.2.B",1489,"Classify a described problem as in P, NP-complete, or undecidable, and verify a given certificate in polynomial time.","NP = polynomially verifiable; NP-complete = in NP and every NP problem reduces to it; P = NP is open.","","",0],["CS-5.2.C",1490,"State the direction of a polynomial reduction needed to prove a new problem NP-hard, and carry out a small one (3-SAT → independent set, vertex cover ↔ independent set).","Reduce a known NP-hard problem TO the new one; S is a vertex cover ⇔ V∖S is an independent set.","","CS-5.2.B",0]]}]},{"n":6,"title":"Software engineering","scope":"core","topics":[{"n":1,"title":"Process and requirements","los":[["CS-6.1.A",1491,"Rewrite a vague requirement as a testable functional or non-functional requirement with an acceptance criterion.","Testable = measurable outcome and condition ('p95 latency \u003c 200 ms at 500 rps'); NFRs cover performance, security, usability, reliability.","","",0]]},{"n":2,"title":"Design principles and patterns","los":[["CS-6.2.A",1492,"Identify which SOLID principle a code snippet violates and the refactoring that fixes it.","SRP one reason to change; OCP extend without editing; LSP subtypes substitutable; ISP small interfaces; DIP depend on abstractions.","","",0],["CS-6.2.B",1493,"Name the design pattern a snippet implements or needs (strategy, observer, factory, adapter, decorator, singleton, repository).","Patterns are named solutions to recurring forces: vary an algorithm ⇒ strategy; notify dependents ⇒ observer; wrap an incompatible API ⇒ adapter.","","",0]]},{"n":3,"title":"Tools and construction","los":[["CS-6.3.A",1494,"Predict the commit graph after a git merge, rebase, cherry-pick, revert or reset on a described history.","Merge adds a two-parent commit; rebase replays commits with new hashes; revert adds an inverse commit; reset moves the branch pointer.","","",0]]},{"n":4,"title":"Testing and validation","los":[["CS-6.4.A",1495,"Design test inputs for a specification by equivalence partitioning and boundary-value analysis.","One input per partition plus each boundary and its neighbours; invalid partitions need tests too.","","",0],["CS-6.4.B",1496,"Compute statement and branch coverage of a test suite on a given snippet, and add the test that raises it.","Branch coverage counts each decision outcome; 100% statement coverage can miss a false branch.","","",0]]},{"n":5,"title":"Reliability and specification","los":[["CS-6.5.A",1497,"Compute availability from MTBF and MTTR, and for components in series or redundant parallel; convert nines to downtime per year.","A = MTBF/(MTBF + MTTR); series multiply A; parallel 1 − Π(1 − A_i); 99.9% ≈ 8.8 h/yr down.","","",0],["CS-6.5.B",1498,"Write pre- and postconditions for a function and decide whether a given Hoare triple holds.","{P} S {Q}: if P holds before S and S terminates, Q holds after; assignment rule substitutes backward.","","CS-2.4.A",0]]}]},{"n":7,"title":"Databases and data management","scope":"core","topics":[{"n":1,"title":"Modelling and the relational model","los":[["CS-7.1.A",1499,"Build an ER model with cardinalities for a scenario and map it to relational tables with primary and foreign keys.","1:N ⇒ FK on the N side; M:N ⇒ junction table with composite key; weak entities borrow the owner's key.","","",0],["CS-7.1.B",1500,"Evaluate a relational-algebra expression (σ, π, ⋈, ∪, −, ρ) on small tables and give the result.","Selection filters rows, projection columns (removing duplicates); natural join matches equal-named attributes.","","",0]]},{"n":2,"title":"SQL","los":[["CS-7.2.A",1501,"Write a SQL query with joins, GROUP BY and HAVING for a described question — auto-checked by comparing result sets.","WHERE filters rows before grouping, HAVING filters groups after; every non-aggregated SELECT column must be grouped.","","CS-7.1.B",0],["CS-7.2.B",1502,"Predict the result of an outer join, a comparison with NULL, or an aggregate over a column containing NULLs.","NULL = NULL is unknown, not true; COUNT(*) counts rows, COUNT(col) skips NULLs; LEFT JOIN keeps unmatched left rows with NULLs.","","",0],["CS-7.2.C",1503,"Write a query using a correlated subquery, CTE or window function (rank, running total, top-n per group).","Window functions compute over a PARTITION BY … ORDER BY frame without collapsing rows.","","CS-7.2.A",0]]},{"n":3,"title":"Functional dependencies and normal forms","los":[["CS-7.3.A",1504,"Compute an attribute closure from a set of FDs and find all candidate keys.","X⁺ = everything X determines by repeatedly applying FDs; X is a superkey iff X⁺ = all attributes.","","",0],["CS-7.3.B",1505,"Determine the highest normal form (1NF–BCNF) a relation satisfies under given FDs.","2NF: no partial dependency on a key; 3NF: every non-trivial FD has a superkey LHS or prime RHS; BCNF: superkey LHS always.","","CS-7.3.A",0],["CS-7.3.C",1506,"Decompose a relation into BCNF or 3NF and check the decomposition is lossless and dependency-preserving.","Binary split R1, R2 is lossless iff R1 ∩ R2 → R1 or → R2; 3NF synthesis always preserves dependencies, BCNF may not.","","CS-7.3.B",0]]},{"n":4,"title":"Transactions and concurrency control","los":[["CS-7.4.A",1507,"Name the anomaly (dirty read, non-repeatable read, phantom, lost update, write skew) in a described interleaving and the weakest isolation level that prevents it.","READ COMMITTED stops dirty reads; REPEATABLE READ stops non-repeatable reads; SERIALIZABLE stops phantoms and write skew.","","",0],["CS-7.4.B",1508,"Decide whether a schedule is conflict-serializable by drawing its precedence graph, and give an equivalent serial order.","Conflicts: two ops on the same item, different transactions, at least one write; acyclic precedence graph ⇔ conflict-serializable.","","CS-4.4.B",0]]},{"n":5,"title":"Storage, indexing and query processing","los":[["CS-7.5.A",1509,"Estimate the page I/Os of a lookup or range query with no index, a B+-tree index and a hash index, and pick the index for a workload.","Scan = all pages; B+-tree = height + matching leaf pages (+ row fetches if unclustered); hash = ~1–2 I/Os for equality only.","","CS-3.3.C",0]]},{"n":6,"title":"NoSQL and distributed data","los":[["CS-7.6.A",1510,"Choose a data model (relational, document, key-value, wide-column, graph) for a described access pattern and consistency need.","Model data around queries in NoSQL; joins and multi-row transactions favour relational; deep traversals favour graph.","","",0],["CS-7.6.B",1511,"Apply CAP and PACELC to say what a described system gives up during a network partition and in normal operation.","During a partition choose consistency or availability; else trade latency against consistency.","","",0]]}]},{"n":8,"title":"Computer architecture and systems performance","scope":"core","topics":[{"n":1,"title":"Data representation","los":[["CS-8.1.A",1512,"Convert integers between binary, hex and decimal, including n-bit two's complement, and detect overflow.","Two's complement range −2^(n−1) … 2^(n−1) − 1; negate = invert + 1; overflow iff same-sign operands give opposite-sign result.","","",0],["CS-8.1.B",1513,"Decode an IEEE 754 single-precision bit pattern and explain why 0.1 + 0.2 ≠ 0.3 in binary floating point.","(−1)^s × 1.f × 2^(e−127); most decimal fractions have no finite binary expansion, so they round.","","",0]]},{"n":2,"title":"Instruction execution","los":[["CS-8.2.A",1514,"Trace register and memory contents through a short RISC-V or x86 instruction sequence.","Loads/stores move data between memory and registers; branches compare and set the PC; the stack grows downward.","","",0]]},{"n":3,"title":"Memory hierarchy","los":[["CS-8.3.A",1515,"Split an address into tag, index and offset bits for a given cache size, block size and associativity.","offset = log₂(block bytes); sets = size/(block × ways); index = log₂(sets); tag = rest.","","CS-8.1.A",0],["CS-8.3.B",1516,"Simulate a direct-mapped or set-associative LRU cache on an address trace and compute the hit rate — auto-checked.","Compulsory, capacity and conflict misses; higher associativity removes conflict misses only.","","CS-8.3.A",0],["CS-8.3.C",1517,"Compute average memory access time for a multi-level hierarchy.","AMAT = hit time + miss rate × miss penalty, applied recursively per level.","","",0]]},{"n":4,"title":"Performance laws","los":[["CS-8.4.A",1518,"Compute CPU time from instruction count, CPI and clock rate, and compare two designs.","CPU time = IC × CPI / f; the 'iron law' — no single factor alone measures speed.","","",0],["CS-8.4.B",1519,"Apply Amdahl's law to compute overall speedup, or the fraction that must be sped up to hit a target.","S = 1 / ((1 − p) + p/s); the serial fraction caps speedup at 1/(1 − p).","","",0],["CS-8.4.C",1520,"Apply Little's law and utilisation to relate throughput, latency and queue length in a service.","L = λW; utilisation ρ = λ/μ; queueing delay explodes as ρ → 1.","","",0]]}]},{"n":9,"title":"Operating systems and systems programming","scope":"core","topics":[{"n":1,"title":"Processes and system calls","los":[["CS-9.1.A",1521,"Predict the output and number of processes created by code that calls fork(), exec() and wait().","fork returns 0 in the child and the child PID in the parent; n sequential forks make 2ⁿ processes; exec replaces the image.","","",0]]},{"n":2,"title":"CPU scheduling","los":[["CS-9.2.A",1522,"Compute the schedule (Gantt order), average waiting and turnaround time under FCFS, SJF, SRTF, round-robin with quantum q, or priority — auto-checked.","Turnaround = completion − arrival; waiting = turnaround − burst; SJF minimises average waiting time; RR trades it for response time.","","",0]]},{"n":3,"title":"Concurrency and synchronization","los":[["CS-9.3.A",1523,"Identify the race condition in a shared-memory snippet and give an interleaving that produces a wrong result.","count++ is load–add–store; two threads interleaving those steps lose an update.","","",0],["CS-9.3.B",1524,"Fix a race with a mutex, semaphore or condition variable and trace the semaphore values through a schedule.","wait/P decrements and blocks below zero; signal/V increments and wakes one; check condition variables in a while loop.","","CS-9.3.A",0],["CS-9.3.C",1525,"Detect deadlock in a resource-allocation or wait-for graph, and run the banker's algorithm to decide whether a state is safe.","Deadlock needs mutual exclusion, hold-and-wait, no preemption and circular wait; safe ⇔ some order lets every process finish.","","",0]]},{"n":4,"title":"Memory management","los":[["CS-9.4.A",1526,"Translate a virtual address to a physical one by walking a one- or two-level page table, counting memory accesses — auto-checked.","VPN = high bits, offset = low log₂(page size) bits; each level indexes one table; PA = frame × page size + offset.","","CS-8.1.A",0],["CS-9.4.B",1527,"Compute page-table size and effective access time with a TLB of given hit rate.","Entries = 2^(VA bits − offset bits); EAT = h·(t_TLB + t_mem) + (1 − h)·(t_TLB + (levels + 1)·t_mem).","","CS-9.4.A",0],["CS-9.4.C",1528,"Simulate FIFO, LRU and optimal page replacement on a reference string and count page faults.","OPT evicts the page used farthest in future; LRU approximates it; FIFO can suffer Belady's anomaly.","","",0]]},{"n":5,"title":"Files, storage and protection","los":[["CS-9.5.A",1529,"Compute the maximum file size for an inode with given direct, single-, double- and triple-indirect pointers.","Pointers per block = block size / pointer size; max = (direct + p + p² + p³) × block size.","","",0],["CS-9.5.B",1530,"Decide whether a user can read, write or execute a file from its Unix permission bits, owner and group (e.g. chmod 754).","Three octal digits for owner/group/other; r = 4, w = 2, x = 1; the first matching class applies.","","",0]]},{"n":6,"title":"Virtualization","los":[["CS-9.6.A",1531,"Compare a VM and a container for a described deployment by isolation boundary, startup cost and overhead.","VMs virtualise hardware with a guest kernel; containers share the host kernel, isolated by namespaces and limited by cgroups.","","",0]]}]},{"n":10,"title":"Networking","scope":"core","topics":[{"n":1,"title":"Layers and performance","los":[["CS-10.1.A",1532,"Compute transmission, propagation and total delay of a transfer, and the bandwidth–delay product of a link.","d_trans = L/R; d_prop = distance/speed; BDP = R × RTT is the data in flight needed to fill the pipe.","","",0]]},{"n":2,"title":"Application layer","los":[["CS-10.2.A",1533,"Trace a DNS resolution and an HTTP request, and predict the status code and caching behaviour from given headers.","Recursive resolver walks root → TLD → authoritative, caching by TTL; Cache-Control/ETag decide 200 vs 304.","","",0]]},{"n":3,"title":"Reliable transport","los":[["CS-10.3.A",1534,"Trace sequence and acknowledgement numbers through a TCP handshake and data exchange.","SYN and FIN each consume one sequence number; ACK = next byte expected.","","",0],["CS-10.3.B",1535,"Compute link utilisation and throughput for stop-and-wait and sliding-window protocols.","U = (W · L/R) / (RTT + L/R), capped at 1; window ≥ BDP keeps the link busy.","","CS-10.1.A",0],["CS-10.3.C",1536,"Trace TCP's congestion window across RTTs through slow start, congestion avoidance, a timeout and a triple duplicate ACK.","Slow start doubles cwnd per RTT until ssthresh; AIMD adds 1 MSS per RTT; loss halves ssthresh (Reno fast recovery) or resets cwnd (timeout).","","",0]]},{"n":4,"title":"Addressing and routing","los":[["CS-10.4.A",1537,"Compute the network address, broadcast address, usable host range and host count for an IPv4 CIDR block, or subnet it into k pieces — auto-checked.","Mask = prefix ones; network = IP AND mask; hosts = 2^(32 − prefix) − 2; borrowing b bits makes 2^b subnets.","","CS-8.1.A",0],["CS-10.4.B",1538,"Forward a packet by longest-prefix match against a routing table.","Among matching prefixes, the longest (most specific) wins; 0.0.0.0/0 is the default route.","","CS-10.4.A",0],["CS-10.4.C",1539,"Compute a router's table after one round of distance-vector updates, or by link-state Dijkstra.","DV: D_x(y) = min_v (c(x,v) + D_v(y)); link-state floods topology then runs Dijkstra locally.","","CS-4.5.A",0]]},{"n":5,"title":"Network security","los":[["CS-10.5.A",1540,"Evaluate an ordered firewall rule set against a list of packets and say which are allowed.","First match wins; end with default deny; stateful firewalls allow return traffic of established connections.","","",0]]}]},{"n":11,"title":"Security","scope":"core","topics":[{"n":1,"title":"Foundations and threat modelling","los":[["CS-11.1.A",1541,"Classify a described incident by the CIA property violated and separate threat, vulnerability and risk.","Confidentiality, integrity, availability; risk = likelihood × impact of a threat exploiting a vulnerability.","","",0],["CS-11.1.B",1542,"Apply STRIDE to a data-flow diagram and list one threat and one mitigation per crossed trust boundary.","Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege; threats concentrate at trust boundaries.","","",0]]},{"n":2,"title":"Secure coding","los":[["CS-11.2.A",1543,"Identify the vulnerability class in a code snippet — SQL injection, XSS, CSRF, buffer overflow, path traversal, IDOR, TOCTOU race, insecure deserialization — and its CWE — auto-checked.","Most classes are untrusted input reaching an interpreter or memory without validation; IDOR is a missing authorization check, not an input bug.","","",0],["CS-11.2.B",1544,"Give the specific fix for an identified vulnerability (parameterised query, context-aware output encoding, CSRF token/SameSite, bounds check, server-side authorization).","Fix the sink, not the symptom: blocklists fail; parameterisation separates code from data.","","CS-11.2.A",0]]},{"n":3,"title":"Cryptography in use","los":[["CS-11.3.A",1545,"Pick the primitive for a goal — confidentiality, integrity, authentication, non-repudiation — among symmetric cipher, hash, MAC, signature and key exchange.","Hashes give integrity only against accidents; MACs need a shared key; signatures give non-repudiation; use AEAD for confidentiality + integrity.","","",0],["CS-11.3.B",1546,"Encrypt and decrypt with toy RSA (small primes): compute n, φ(n), d and c = m^e mod n.","d = e⁻¹ mod φ(n); modular exponentiation by repeated squaring; security rests on factoring n.","","CS-1.2.A",0],["CS-11.3.C",1547,"Compute password entropy and brute-force time at a given guess rate, and state how passwords must be stored.","Entropy = L·log₂(alphabet); time = 2^H / rate; store with a unique salt and a slow hash (bcrypt, scrypt, Argon2).","","",0]]},{"n":4,"title":"Authentication, authorization and risk","los":[["CS-11.4.A",1548,"Trace an OAuth 2.0 authorization-code flow with PKCE and identify the token mishandling in a described implementation.","Authentication says who; authorization says what; access tokens are bearer credentials; the ID token (OIDC) identifies the user.","","",0],["CS-11.4.B",1549,"Compute annualised loss expectancy for a risk and decide whether a control is worth its cost.","SLE = asset value × exposure factor; ALE = SLE × ARO; a control is justified if ΔALE > its annual cost.","","",0]]}]},{"n":12,"title":"Programming languages","scope":"core","topics":[{"n":1,"title":"Paradigms","los":[["CS-12.1.A",1550,"Predict the output of a snippet that mixes overriding, overloading and dynamic dispatch.","Overloads resolve at compile time on static types; overrides dispatch at run time on the object's dynamic type.","","",0],["CS-12.1.B",1551,"Rewrite a loop with map, filter and reduce, and evaluate an expression built from higher-order functions and closures.","A closure captures its defining environment; reduce folds with an accumulator from an initial value.","","",0]]},{"n":2,"title":"Types","los":[["CS-12.2.A",1552,"Decide whether an expression type-checks and infer the type of a polymorphic function.","Hindley–Milner unifies constraints to the most general type, e.g. map : (a → b) → [a] → [b].","","",0],["CS-12.2.B",1553,"Identify the variance error in a generic subtyping snippet (arrays, List\u003cT>, function parameters).","Producers are covariant, consumers contravariant; mutable containers must be invariant; functions are contravariant in arguments.","","CS-12.2.A",0]]},{"n":3,"title":"Binding, evaluation and run time","los":[["CS-12.3.A",1554,"Predict a program's output under lexical versus dynamic scope, and under pass-by-value, -reference and -sharing.","Lexical scope resolves names where code is written; pass-by-sharing copies the reference, so mutation is visible but rebinding is not.","","",0],["CS-12.3.B",1555,"Predict the output order of async JavaScript mixing synchronous code, promises, await and setTimeout.","Run the call stack to empty, then all microtasks (promise callbacks), then one macrotask (timers, I/O).","","",0]]},{"n":4,"title":"Translation","los":[["CS-12.4.A",1556,"Parse an expression under a grammar's precedence and associativity into an AST and evaluate it.","Lower-precedence operators sit nearer the root; left-associative ⇒ left-leaning tree.","","CS-5.1.C",0]]}]},{"n":13,"title":"Artificial intelligence and machine learning","scope":"core","topics":[{"n":1,"title":"Search","los":[["CS-13.1.A",1557,"Trace uniform-cost or A* search — frontier and expansion order — and check whether a heuristic is admissible and consistent.","A* expands lowest f = g + h; admissible h never overestimates ⇒ optimal tree search; consistent ⇒ optimal graph search.","","CS-4.5.A",0]]},{"n":2,"title":"Supervised learning","los":[["CS-13.2.A",1558,"Compute accuracy, precision, recall and F1 from a confusion matrix and pick the metric a scenario needs.","Precision = TP/(TP + FP); recall = TP/(TP + FN); imbalanced classes make accuracy misleading.","","",0],["CS-13.2.B",1559,"Diagnose under- or overfitting from training and validation curves and choose a remedy.","High train and val error ⇒ bias; low train, high val ⇒ variance; regularise, add data or simplify for variance.","","",0],["CS-13.2.C",1560,"Compute one gradient-descent update for linear or logistic regression on a tiny dataset.","w ← w − η∇L; for MSE ∇_w = (2/n)Xᵀ(Xw − y); too large η diverges.","","CS-1.4.A",0],["CS-13.2.D",1561,"Classify a point by k-NN, or compute the information gain or Gini decrease of a decision-tree split.","Entropy H = −Σ p log₂ p; gain = H(parent) − weighted H(children); Gini = 1 − Σ p².","","",0]]},{"n":3,"title":"Language models","los":[["CS-13.3.A",1562,"Compute cosine similarity between embedding vectors and the softmax attention weights for a tiny query–key set.","cos = a·b/(|a||b|); attention = softmax(QKᵀ/√d)V; cost grows as n² in sequence length.","","",0]]},{"n":4,"title":"AI and society","los":[["CS-13.4.A",1563,"Compute demographic parity and equal-opportunity gaps for a classifier from per-group counts, and name the harm.","Parity compares positive rates; equal opportunity compares true-positive rates; the two generally cannot both hold when base rates differ.","","CS-13.2.A",0]]}]},{"n":14,"title":"Parallel and distributed computing","scope":"core","topics":[{"n":1,"title":"Parallel performance","los":[["CS-14.1.A",1564,"Compute work, span and parallelism of a task DAG and bound the runtime on p processors.","T₁ = work, T∞ = span; parallelism = T₁/T∞; greedy scheduling gives T_p ≤ T₁/p + T∞.","","CS-8.4.B",0],["CS-14.1.B",1565,"Compute strong- and weak-scaling efficiency from timings and explain the gap with Amdahl and Gustafson.","Efficiency = S/p; Gustafson: scaled speedup = p − α(p − 1) when the problem grows with p.","","",0]]},{"n":2,"title":"Ordering and coordination","los":[["CS-14.2.A",1566,"Assign Lamport timestamps or vector clocks to events in a message diagram and decide whether two events are causally ordered or concurrent.","Lamport: L = max(local, received) + 1, consistent with but not implying causality; vector clocks capture happened-before exactly.","","",0],["CS-14.2.B",1567,"Decide whether quorum settings R, W, N guarantee read-your-latest-write, and place keys on a consistent-hash ring.","R + W > N ⇒ read and write quorums overlap; consistent hashing moves ~1/n of keys when a node joins.","","",0]]}]},{"n":15,"title":"Human–computer interaction","scope":"core","topics":[{"n":1,"title":"Design and evaluation","los":[["CS-15.1.A",1568,"Identify which of Nielsen's usability heuristics a described interface violates.","Visibility of status, match with the real world, user control, consistency, error prevention, recognition over recall, …","","",0],["CS-15.1.B",1569,"Use Fitts's law to compare the movement time for two target layouts.","MT = a + b·log₂(1 + D/W); bigger, closer targets are faster; screen edges act as infinitely deep targets.","","",0],["CS-15.1.C",1570,"Choose an evaluation method (usability test, heuristic review, A/B test, survey) for a question, and decide whether an A/B result is significant.","Formative tests find problems with ~5 users; A/B tests measure effects and need a pre-set sample size and two-proportion z-test.","","CS-1.4.C",0]]},{"n":2,"title":"Accessibility","los":[["CS-15.2.A",1571,"Compute a colour-contrast ratio and identify the WCAG 2.x failure in a markup snippet (alt text, labels, focus, contrast).","Ratio = (L₁ + 0.05)/(L₂ + 0.05); AA needs ≥ 4.5:1 for body text, 3:1 for large text; every control needs an accessible name.","","",0]]}]},{"n":16,"title":"Society, ethics and the profession","scope":"core","topics":[{"n":1,"title":"Ethics, IP and privacy","los":[["CS-16.1.A",1572,"Identify the ACM Code of Ethics principle at stake in a scenario and the action it requires.","Avoid harm (1.2) and the public good outrank employer instructions; honesty and competence obligations follow.","","",0],["CS-16.1.B",1573,"State the obligations a reuse scenario triggers under MIT, Apache-2.0, GPL-3.0 or AGPL-3.0.","Permissive: keep notice; Apache adds a patent grant; GPL: distribute derived source; AGPL: network use counts as distribution.","","",0],["CS-16.1.C",1574,"Check whether a released table is k-anonymous for given quasi-identifiers and name the re-identification risk.","Each quasi-identifier combination must appear ≥ k times; k-anonymity does not stop attribute disclosure (l-diversity).","","",0]]},{"n":2,"title":"Sustainability","los":[["CS-16.2.A",1575,"Estimate the energy and carbon of a compute job from hardware power, utilisation, PUE and grid intensity.","kWh = W × h × PUE / 1000; CO₂e = kWh × grid intensity (g/kWh); location and time shift matter.","","",0]]}]},{"n":17,"title":"Advanced algorithms","scope":"extension","topics":[{"n":1,"title":"Network flow","los":[["CS-17.1.A",1576,"Compute a maximum flow and minimum cut with Ford–Fulkerson/Edmonds–Karp, tracing augmenting paths in the residual graph.","Max-flow value = min-cut capacity; Edmonds–Karp's BFS paths give O(VE²).","","CS-4.4.A",0],["CS-17.1.B",1577,"Model a bipartite matching or assignment problem as a flow network and read the matching from the flow.","Unit capacities source → left → right → sink; integral flow ⇒ a matching of the same size.","","CS-17.1.A",0]]},{"n":2,"title":"Randomised, approximation and string algorithms","los":[["CS-17.2.A",1578,"Compute the approximation ratio of a greedy algorithm (e.g. maximal-matching vertex cover) on an instance and argue its bound.","Ratio = ALG/OPT; taking both endpoints of a maximal matching gives a 2-approximation.","","CS-5.2.C",0],["CS-17.2.B",1579,"Compute the KMP failure function for a pattern, or a Rabin–Karp rolling hash across a text window.","Failure[i] = length of the longest proper prefix that is also a suffix of pattern[0..i]; rolling hash updates in O(1).","","",0]]}]},{"n":18,"title":"Distributed systems and cloud","scope":"extension","topics":[{"n":1,"title":"Consensus and replication","los":[["CS-18.1.A",1580,"Trace Raft leader election and log replication through a described sequence of timeouts, votes and crashes.","A candidate needs a majority in its term; an entry commits once replicated on a majority; n = 2f + 1 tolerates f crashes.","","CS-14.2.A",0],["CS-18.1.B",1581,"Identify where two-phase commit blocks when the coordinator fails, and what consensus-based commit changes.","Participants that voted yes cannot decide alone; replicating the coordinator's decision with consensus removes the block.","","",0]]},{"n":2,"title":"Cloud architecture","los":[["CS-18.2.A",1582,"Compute the monthly cost of a workload under on-demand, reserved and serverless pricing and pick the cheapest model for its load shape.","Serverless bills per request × duration and wins at low or spiky load; reserved wins at steady high utilisation.","","",0],["CS-18.2.B",1583,"Compute the instances an autoscaler needs for a target load and utilisation, and the origin load left after a cache or CDN with a given hit rate.","Instances = ⌈load / (per-instance capacity × target utilisation)⌉; origin load = (1 − hit rate) × requests.","","CS-8.4.C",0],["CS-18.2.C",1584,"Choose a shard key for a described dataset and query mix and predict hot-spotting.","High-cardinality, evenly-accessed keys spread load; monotonic keys (timestamps) send all writes to one shard.","","",0]]}]},{"n":19,"title":"Machine learning in depth","scope":"extension","topics":[{"n":1,"title":"Neural networks","los":[["CS-19.1.A",1585,"Compute a forward pass of a small MLP and the backpropagated gradient for one weight.","Chain rule layer by layer: ∂L/∂w = δ_out · a_in; ReLU passes gradient only where its input > 0.","","CS-13.2.C",0],["CS-19.1.B",1586,"Count the parameters and output shape of a convolutional or fully-connected layer.","Conv params = (k_h·k_w·C_in + 1)·C_out; output = ⌊(n + 2p − k)/s⌋ + 1.","","",0]]},{"n":2,"title":"Unsupervised learning","los":[["CS-19.2.A",1587,"Trace one k-means iteration (assign, recompute centroids), or compute variance explained by the top PCA components from eigenvalues.","k-means minimises within-cluster squared distance and converges to a local optimum; variance explained = λ_i / Σλ.","","",0]]}]}]},{"id":"information-systems","title":"Information Systems","code":"IS","track":"computing","requires":["computer-science"],"units":[{"n":1,"title":"IS strategy and governance","scope":"extension","topics":[{"n":1,"title":"Strategic value of IT","los":[["IS-1.1.A",1588,"Classify a described system by its strategic role (cost leadership, differentiation, focus) and the Porter value-chain activity it changes.","IT advantage lasts only if hard to copy — complementary processes and data, not the technology itself.","","",0],["IS-1.1.B",1589,"Place each application of a portfolio in the McFarlan grid (support, factory, turnaround, strategic) from its current and future impact.","Strategic = high current and future impact; factory = high current, low future; the quadrant sets how it should be governed and funded.","","",0]]},{"n":2,"title":"IT investment appraisal","los":[["IS-1.2.A",1590,"Compute NPV, ROI and payback period of an IT project from its cash flows and discount rate, and accept or reject it.","NPV = Σ CF_t/(1 + r)^t − I₀; accept if NPV > 0; payback ignores the time value of money and later flows.","","",0],["IS-1.2.B",1591,"Compute total cost of ownership over a horizon for build, buy (licence) and SaaS options, including hidden costs.","TCO = acquisition + implementation + operation + support + exit; licences are often \u003c 30% of TCO.","","",0],["IS-1.2.C",1592,"Rank a set of proposed projects by a weighted scoring model under a budget constraint.","Score = Σ weight × rating; pick in score-per-cost order until the budget binds, checking dependencies.","","",0]]},{"n":3,"title":"Governance frameworks and decision rights","los":[["IS-1.3.A",1593,"Assign decision rights for an IT decision domain (principles, architecture, infrastructure, applications, investment) to a governance archetype for a scenario.","Weill & Ross archetypes: business monarchy, IT monarchy, federal, duopoly, feudal, anarchy; investment is usually business-led.","","",0],["IS-1.3.B",1594,"Match a governance need to the framework that addresses it — COBIT, ITIL, ISO/IEC 27001, NIST CSF, TOGAF.","COBIT governs and audits IT overall; ITIL runs services; 27001 certifies an ISMS; NIST CSF organises cyber risk; TOGAF develops architecture.","","",0],["IS-1.3.C",1595,"Build a RACI matrix for a described process and find its defects (no A, several A's, no R).","Exactly one Accountable per activity; at least one Responsible; Consulted is two-way, Informed one-way.","","",0]]}]},{"n":2,"title":"Enterprise architecture","scope":"extension","topics":[{"n":1,"title":"Architecture domains and method","los":[["IS-2.1.A",1596,"Assign an artefact or decision to its architecture domain (business, data, application, technology) and to the TOGAF ADM phase that produces it.","ADM: Preliminary, A Vision, B Business, C Information Systems (data + application), D Technology, E Opportunities, F Migration, G Governance, H Change.","","",0],["IS-2.1.B",1597,"Build a capability map for a described organisation and mark the capabilities where heat-mapped investment should go.","Capabilities say what the business does, independent of org chart and systems; they are stable while processes change.","","",0]]},{"n":2,"title":"Application portfolio and integration","los":[["IS-2.2.A",1598,"Classify applications as Tolerate, Invest, Migrate or Eliminate from their business value and technical fit.","Gartner TIME: high value + good fit ⇒ invest; high value + poor fit ⇒ migrate; low + good ⇒ tolerate; low + poor ⇒ eliminate.","","",0],["IS-2.2.B",1599,"Choose an integration style (file transfer, shared database, API/RPC, messaging, event streaming) for a described pair of systems and count point-to-point links avoided by a hub.","n systems point-to-point need n(n − 1)/2 links; a bus or hub needs n; asynchronous messaging decouples availability.","","",0],["IS-2.2.C",1600,"Identify which migration strategy a cloud move uses (rehost, replatform, refactor, repurchase, retire, retain) from its description.","Rehost = lift-and-shift; refactor rewrites for cloud-native; repurchase moves to SaaS.","","CS-18.2.A",0]]}]},{"n":3,"title":"Systems analysis, development and deployment","scope":"extension","topics":[{"n":1,"title":"Process and requirements modelling","los":[["IS-3.1.A",1601,"Model a described business process in BPMN with pools, lanes, gateways and events, and spot the hand-off that causes delay.","Exclusive gateway = one path; parallel = all paths; message flows cross pools, sequence flows stay inside one.","","",0],["IS-3.1.B",1602,"Write a use case (actor, preconditions, main flow, extensions) or user stories with acceptance criteria from an interview transcript.","Story = as a \u003crole> I want \u003cgoal> so that \u003cbenefit>; INVEST: independent, negotiable, valuable, estimable, small, testable.","","",0],["IS-3.1.C",1603,"Prioritise a requirement list with MoSCoW or Kano and justify which items fall out of a release.","Must / Should / Could / Won't (this time); Kano: basic, performance and delighter features age into basics.","","",0]]},{"n":2,"title":"Project scheduling and control","los":[["IS-3.2.A",1604,"Find the critical path, project duration and each activity's slack from an activity-on-node network — auto-checked.","Forward pass gives earliest start/finish, backward pass latest; slack = LS − ES; zero-slack activities form the critical path.","","",0],["IS-3.2.B",1605,"Compute earned-value metrics (PV, EV, AC, CV, SV, CPI, SPI, EAC) from a status report and say whether the project is over budget or late.","CPI = EV/AC, SPI = EV/PV; \u003c 1 means over cost or behind; EAC = BAC/CPI if the trend continues.","","",0],["IS-3.2.C",1606,"Choose a delivery approach (predictive, agile, hybrid) and a deployment strategy (big bang, phased, parallel, pilot, blue-green, canary) for a described rollout.","Parallel running costs most and risks least; canary exposes a small share of users first; regulated or fixed-scope work leans predictive.","","",0]]}]},{"n":4,"title":"Data, information and analytics management","scope":"extension","topics":[{"n":1,"title":"Data requirements and management","los":[["IS-4.1.A",1607,"Capture a scenario's data requirements as a conceptual model and choose the data-management technology the domain needs.","Conceptual (entities, relationships) → logical (tables, keys) → physical; the access pattern and consistency need pick the store.","","CS-7.1.A CS-7.6.A",0],["IS-4.1.B",1608,"Compute data-quality scores (completeness, validity, uniqueness, timeliness) for a sample table and name the root cause of the worst one.","Completeness = non-null / total; uniqueness = distinct keys / rows; quality problems are fixed at the source process, not downstream.","","",0],["IS-4.1.C",1609,"Assign data owner, steward and custodian roles for a data domain and write the policy decision each makes.","Owner is accountable (business); steward defines meaning and quality rules; custodian (IT) operates storage and access.","","",0]]},{"n":2,"title":"Warehousing and integration","los":[["IS-4.2.A",1610,"Design a star schema for a described analytic question: declare the grain, the fact table measures and the dimensions.","State the grain first; facts are additive numeric measures at that grain; dimensions carry descriptive attributes, denormalised.","","CS-7.1.A",0],["IS-4.2.B",1611,"Choose the slowly-changing-dimension type (1, 2, 3) for an attribute whose history does or doesn't matter, and show the resulting rows.","Type 1 overwrites; type 2 adds a new row with effective dates and a surrogate key; type 3 keeps a previous-value column.","","",0],["IS-4.2.C",1612,"Choose between ETL into a warehouse, ELT into a lakehouse and streaming ingestion for a described data volume, variety and latency need.","ELT pushes transformation to scalable storage; streaming fits seconds-level latency; schema-on-read trades governance for flexibility.","","",0],["IS-4.2.D",1613,"Write the SQL aggregation that answers a business question over a star schema — auto-checked by result set.","Join the fact to the needed dimensions, filter on dimension attributes, GROUP BY the reporting level.","","CS-7.2.A IS-4.2.A",0]]},{"n":3,"title":"Analytics for decisions","los":[["IS-4.3.A",1614,"Match a business question to descriptive, diagnostic, predictive or prescriptive analytics and to a method (dashboard, cohort, regression, classification, optimisation).","Descriptive = what happened; diagnostic = why; predictive = what will; prescriptive = what to do.","","",0],["IS-4.3.B",1615,"Compute the expected profit of acting on a classifier's predictions from its confusion matrix and the cost of each error.","Expected value = Σ count × payoff per cell; the best threshold depends on error costs, not accuracy.","","CS-13.2.A",0],["IS-4.3.C",1616,"Define a KPI for a described objective with formula, target, owner and data source, and flag a vanity metric.","A KPI ties to a decision and has a target; vanity metrics (raw sign-ups, page views) move without changing outcomes.","","",0]]}]},{"n":5,"title":"IT infrastructure and service operations","scope":"extension","topics":[{"n":1,"title":"Infrastructure and sourcing","los":[["IS-5.1.A",1617,"Size the servers or cloud instances a described workload needs at peak with headroom, and the cost of each option.","Capacity = peak demand / (per-unit capacity × target utilisation); size for peak, not average.","","CS-18.2.B",0],["IS-5.1.B",1618,"Choose IaaS, PaaS, SaaS or on-premises for a described system and state who manages each layer under the shared-responsibility model.","The provider takes more layers as you move IaaS → PaaS → SaaS; data and identity stay the customer's responsibility in every model.","","",0],["IS-5.1.C",1619,"Recommend in-house, outsourced, offshored or cloud sourcing for a function using transaction-cost reasoning.","Outsource commodity, well-specified work; keep asset-specific, strategic, hard-to-monitor work inside.","","",0]]},{"n":2,"title":"Service management","los":[["IS-5.2.A",1620,"Classify a described event as an incident, problem, service request or change, and the change as standard, normal or emergency.","Incident = restore service fast; problem = find the root cause; standard changes are pre-approved and low-risk.","","",0],["IS-5.2.B",1621,"Compute SLA attainment, MTTR and allowed downtime from an incident log and decide whether a credit is owed.","Availability = (agreed time − downtime) / agreed time; MTTR = total repair time / incidents.","","CS-6.5.A",0],["IS-5.2.C",1622,"Prioritise an incident from its impact and urgency using a priority matrix.","Priority = f(impact, urgency): high/high = P1; priority sets the response and resolution targets.","","",0],["IS-5.2.D",1623,"Choose a vendor by a weighted evaluation of a set of RFP responses and name the contract terms that protect exit.","Weight criteria before scoring; protect exit with data-portability, termination-assistance and escrow clauses.","","",0]]}]},{"n":6,"title":"Business continuity and information assurance","scope":"extension","topics":[{"n":1,"title":"IS risk management","los":[["IS-6.1.A",1624,"Score risks on a likelihood × impact matrix and choose a treatment (avoid, mitigate, transfer, accept) for each.","Inherent risk before controls, residual after; accept only within the stated risk appetite.","","",0],["IS-6.1.B",1625,"Compute ALE before and after a proposed control and its return on security investment.","ROSI = (ALE_before − ALE_after − control cost) / control cost.","","CS-11.4.B",0],["IS-6.1.C",1626,"Classify a control as preventive, detective or corrective and administrative, technical or physical.","Defense in depth layers control types so one failure is caught by another.","","",0]]},{"n":2,"title":"Continuity and recovery","los":[["IS-6.2.A",1627,"Derive RTO and RPO for a business process from a business-impact analysis, and pick the recovery site and backup frequency that meet them.","RPO = tolerable data loss ⇒ backup or replication interval; RTO = tolerable downtime ⇒ hot, warm or cold site.","","",0],["IS-6.2.B",1628,"Compute what a full, incremental or differential backup schedule must restore after a failure on a given day, and the worst-case data loss.","Incremental restore = last full + every incremental since; differential = last full + latest differential; loss = time since last backup.","","",0]]},{"n":3,"title":"Security programme and audit","los":[["IS-6.3.A",1629,"Map a described control to its NIST CSF 2.0 function (Govern, Identify, Protect, Detect, Respond, Recover).","Govern was added in 2.0 for strategy and supply-chain risk; the functions run concurrently, not as a sequence.","","",0],["IS-6.3.B",1630,"Identify the segregation-of-duties conflict in a described set of user roles and propose the compensating control.","No one person should both initiate and approve, or both hold assets and record them; where SoD can't be split, add review.","","CS-11.1.A",0]]}]},{"n":7,"title":"Innovation, organisational change and entrepreneurship","scope":"extension","topics":[{"n":1,"title":"Adoption and change","los":[["IS-7.1.A",1631,"Predict adoption of a described system from TAM/UTAUT factors and name the intervention that raises it.","Perceived usefulness and ease of use drive intention; UTAUT adds social influence and facilitating conditions.","","",0],["IS-7.1.B",1632,"Place a described organisation's change effort in a change model (Lewin, Kotter, ADKAR) and name the step it skipped.","Kotter: urgency, coalition, vision, communicate, empower, short-term wins, consolidate, anchor; skipping urgency stalls most efforts.","","",0],["IS-7.1.C",1633,"Locate a technology's adopters on the diffusion curve and decide how to cross the chasm to the early majority.","Innovators 2.5%, early adopters 13.5%, early majority 34%; the early majority buys whole-product solutions and references.","","",0]]},{"n":2,"title":"Digital business models","los":[["IS-7.2.A",1634,"Fill a business model canvas for a described digital venture and identify its riskiest assumption.","Nine blocks: segments, value proposition, channels, relationships, revenue, resources, activities, partners, costs; test the riskiest first.","","",0],["IS-7.2.B",1635,"Compute customer lifetime value and CAC payback for a subscription product and decide whether growth is profitable.","LTV ≈ ARPU × gross margin / churn; healthy SaaS often wants LTV/CAC ≥ 3 and payback \u003c 12 months.","","",0],["IS-7.2.C",1636,"Identify the network effects (direct, indirect/two-sided) in a platform and the side to subsidise.","Subsidise the side whose participation most attracts the other and that is more price-sensitive.","","",0]]}]},{"n":8,"title":"Ethics, impacts and sustainability","scope":"extension","topics":[{"n":1,"title":"Privacy and regulation","los":[["IS-8.1.A",1637,"Determine whether GDPR, CCPA/CPRA, HIPAA or FERPA applies to a described data flow and the lawful basis or consent it needs.","GDPR follows EU data subjects; CCPA/CPRA covers qualifying businesses handling California residents' data; HIPAA covers health data of covered entities; FERPA covers education records.","","",0],["IS-8.1.B",1638,"Decide when a data-protection impact assessment is required and list the privacy-by-design measures for a described system.","High-risk processing (large-scale sensitive data, profiling, monitoring) needs a DPIA; minimise, pseudonymise, limit retention, default to private.","","CS-16.1.C",0]]},{"n":2,"title":"Responsible and sustainable IS","los":[["IS-8.2.A",1639,"Analyse a described IS decision with stakeholder, utilitarian and rights-based reasoning and recommend an action.","Identify every affected stakeholder; consequences and duties can disagree — state which one governs and why.","","",0],["IS-8.2.B",1640,"Compare the lifetime carbon and cost of keeping versus refreshing a hardware fleet, including embodied emissions.","Embodied carbon of manufacture often exceeds years of use-phase emissions for end-user devices; extending life is usually greener.","","",0]]}]}]},{"id":"heat-transfer","title":"Heat Transfer","code":"HT","track":"engineering","requires":["engineering-math","physics"],"units":[{"n":1,"title":"Modes and energy balances","scope":"core","topics":[{"n":1,"title":"The three modes and their rate equations","los":[["HT-1.1.A",1641,"Identify which modes act in a described system and write the rate law for each.","Conduction needs a medium; convection needs fluid motion; radiation needs neither.","","",1],["HT-1.1.B",1642,"Calculate a conduction flux or rate, or an unknown k, from Fourier's law across a plane layer.","q'' = k ΔT / L; heat flows down the temperature gradient.","","",2],["HT-1.1.C",1643,"Calculate a convection rate from Newton's law of cooling and judge whether h is plausible.","q = hA(T_s − T∞); h ~ 2–25 free gas, 25–250 forced gas, 50–20 000 forced liquid, 2 500–100 000 phase change (W/m²·K).","","",2],["HT-1.1.D",1644,"Calculate net radiation between a small surface and large surroundings, and linearise it to a radiation coefficient h_r.","q'' = εσ(T_s⁴ − T_sur⁴) in kelvin; h_r = εσ(T_s + T_sur)(T_s² + T_sur²).","","",1]]},{"n":2,"title":"Energy balances on control volumes and surfaces","los":[["HT-1.2.A",1645,"Apply conservation of energy to a control volume: in − out + generated = stored.","Generation is volumetric (I²R, reaction); storage is ρcV dT/dt; both vanish from a surface balance.","","",2],["HT-1.2.B",1646,"Apply a surface energy balance linking conduction, convection and radiation at a boundary.","A surface has no volume: what conducts in, convects and radiates out.","","",2],["HT-1.2.C",1647,"Find the instantaneous rate of temperature change of a body from an unsteady energy balance.","dT/dt = (Σq_in − Σq_out + Ė_g)/(ρcV) at that instant.","","",0]]}]},{"n":2,"title":"The heat equation and boundary conditions","scope":"core","topics":[{"n":1,"title":"Fourier's law and thermal properties","los":[["HT-2.1.A",1648,"Calculate heat flux (magnitude and direction) from a given temperature field.","q'' = −k∇T; flux points from hot to cold, normal to isotherms.","","",2],["HT-2.1.B",1649,"Use k, ρc_p and α = k/ρc_p to compare how materials conduct, store and diffuse heat.","High k moves heat; high ρc_p stores it; α sets how fast a disturbance spreads.","","",0]]},{"n":2,"title":"The heat diffusion equation","los":[["HT-2.2.A",1650,"Write the heat equation in Cartesian, cylindrical or spherical coordinates and simplify it for a stated case (steady, 1-D, no generation, constant k).","(1/r)d/dr(r dT/dr) and (1/r²)d/dr(r² dT/dr) are the radial Laplacians; each assumption strikes a term.","","",0],["HT-2.2.B",1651,"From a given T field, find the generation rate, the surface fluxes or the local rate of change ∂T/∂t.","k∇²T + q̇ = ρc ∂T/∂t; read each term off the derivatives of T.","","",2],["HT-2.2.C",1652,"Decide whether a temperature field can be a steady, generation-free solution.","Steady, no q̇, constant k ⇒ ∇²T = 0 (Laplace).","","",2]]},{"n":3,"title":"Boundary and initial conditions","los":[["HT-2.3.A",1653,"Translate a physical boundary into its mathematical condition: fixed temperature, fixed flux, insulated or symmetry plane, convection, radiation, perfect-contact interface.","−k dT/dx|_s = q''_s; insulated or symmetric ⇒ dT/dx = 0; convection: −k dT/dx|_s = h(T_s − T∞); interface: T and k dT/dx continuous.","","",0],["HT-2.3.B",1654,"Write the complete formulation (equation + two BCs, or + IC) of a 1-D problem from a word description.","A second-order ODE needs two independent conditions; a transient one also needs T(x, 0).","","",1],["HT-2.3.C",1655,"Sketch T(x) and read boundary conditions and k ratios from slopes.","Insulated ⇒ zero slope; in series, slope ∝ 1/k; with generation the profile curves (concave down for q̇ > 0).","","",1]]}]},{"n":3,"title":"Steady 1-D conduction and resistance networks","scope":"core","topics":[{"n":1,"title":"The plane wall and thermal resistance","los":[["HT-3.1.A",1656,"Find T(x) and q in a plane wall with fixed-temperature or convective boundaries.","No generation ⇒ linear T(x); q is the same at every x.","","",2],["HT-3.1.B",1657,"Build a series–parallel resistance network for a composite wall and compute q, U and every interface temperature.","R_cond = L/kA, R_conv = 1/hA; series add, parallel add as conductances; U = 1/(R_tot A).","","",2],["HT-3.1.C",1658,"Include thermal contact resistance and judge when it matters.","R''_t,c in series at the interface; matters when it rivals L/k of the layers.","","",2],["HT-3.1.D",1659,"Reason qualitatively about a network: same q in series, largest ΔT across the largest R, which change helps most.","ΔT_i / ΔT_tot = R_i / R_tot.","","",2]]},{"n":2,"title":"Varying area or conductivity","los":[["HT-3.2.A",1660,"Find q and T(x) when the cross-section A(x) or k(T) varies, by integrating Fourier's law with q constant.","Steady, no q̇ ⇒ q_x constant; q ∫dx/A(x) = −∫k(T)dT.","","",0]]},{"n":3,"title":"Radial systems and critical insulation","los":[["HT-3.3.A",1661,"Calculate q′ and T(r) for a cylindrical wall or insulated pipe using its resistance.","R′ = ln(r₂/r₁)/(2πk); T(r) is logarithmic.","","",2],["HT-3.3.B",1662,"Calculate q for a spherical shell using its resistance.","R = (1/r₁ − 1/r₂)/(4πk).","","",2],["HT-3.3.C",1663,"Find the critical insulation radius and decide whether adding insulation raises or lowers q.","r_cr = k/h (cylinder), 2k/h (sphere); below r_cr insulation increases q.","","",2],["HT-3.3.D",1664,"State which quantities stay constant with radius in steady radial conduction.","q (or q′) is constant; q″ falls as 1/r (cylinder) or 1/r² (sphere).","","",1]]}]},{"n":4,"title":"Conduction with thermal energy generation","scope":"core","topics":[{"n":1,"title":"Plane wall with uniform generation","los":[["HT-4.1.A",1665,"Find the surface temperature from an overall energy balance before solving for the profile.","Everything generated leaves through the cooled surfaces: q̇V = hA(T_s − T∞).","","",2],["HT-4.1.B",1666,"Solve for the parabolic T(x) and T_max with symmetric fixed-temperature or convective boundaries.","T_max − T_s = q̇L²/2k; the midplane (or insulated face) is adiabatic.","","",2],["HT-4.1.C",1667,"With unequal face temperatures, locate the maximum and find the flux through each face.","x_max = k(T₂ − T₁)/(2q̇L); more heat leaves through the cooler face.","","",2],["HT-4.1.D",1668,"Analyse a generating layer bonded to non-generating layers, chaining flux, interface and maximum temperatures.","Flux leaving the generating layer = q̇L_A and passes unchanged through the plain layers.","","",2]]},{"n":2,"title":"Radial systems with generation","los":[["HT-4.2.A",1669,"Find surface and centreline temperatures of a solid cylinder or wire with generation, including q̇ from Joule heating.","T_s = T∞ + q̇r_o/2h; T₀ − T_s = q̇r_o²/4k; q̇ = I²ρ_e/A².","","",2],["HT-4.2.B",1670,"Find surface and centre temperatures of a sphere with generation.","T_s = T∞ + q̇r_o/3h; T₀ − T_s = q̇r_o²/6k.","","",2],["HT-4.2.C",1671,"Solve a hollow cylinder with generation and one insulated or convective surface.","General T = −q̇r²/4k + C₁ ln r + C₂; apply one BC per surface.","","",2]]},{"n":3,"title":"Design limits with generation","los":[["HT-4.3.A",1672,"Find the largest allowable q̇, or the h or thickness needed, to keep T_max below a limit.","T_max − T∞ = q̇L/h + q̇L²/2k: a film rise plus a conduction rise.","","",2]]}]},{"n":5,"title":"Extended surfaces","scope":"core","topics":[{"n":1,"title":"The fin equation and its solutions","los":[["HT-5.1.A",1673,"Derive the fin equation from an energy balance on a fin element and compute m for a given geometry.","d²θ/dx² − m²θ = 0, m² = hP/kA_c; θ = T − T∞.","","",2],["HT-5.1.B",1674,"Choose the tip condition (infinite, adiabatic, convective via corrected length) and compute fin heat rate and tip or local temperature.","q_f = M tanh mL (adiabatic); M = √(hPkA_c)θ_b; L_c = L + D/4 for a pin.","","",2],["HT-5.1.C",1675,"Explain why fin temperature decays exponentially rather than linearly, and how to change the decay.","Side convection removes heat along the length; larger m (low k, high h, thin) ⇒ faster decay.","","",1]]},{"n":2,"title":"Fin performance","los":[["HT-5.2.A",1676,"Calculate fin efficiency and effectiveness and decide whether a fin is worthwhile.","η_f = q_f/(hA_fθ_b); ε_f = q_f/(hA_c,bθ_b); fins pay off when ε_f ≳ 2, i.e. high k, low h.","","",2]]},{"n":3,"title":"Fin arrays","los":[["HT-5.3.A",1677,"Calculate overall surface efficiency and heat rate of a fin array and its resistance.","η_o = 1 − (NA_f/A_t)(1 − η_f); q_t = η_o h A_t θ_b; R_t,o = 1/(η_o h A_t).","","",0]]}]},{"n":6,"title":"Two-dimensional steady conduction","scope":"core","topics":[{"n":1,"title":"Separation of variables","los":[["HT-6.1.A",1678,"Set up the separable solution for a rectangle with one non-homogeneous edge and evaluate its leading terms.","θ = Σ C_n sin(nπx/L) sinh(nπy/L)/sinh(nπW/L); homogeneous BCs set the eigenfunctions.","","",0]]},{"n":2,"title":"Conduction shape factors","los":[["HT-6.2.A",1679,"Pick the matching shape-factor case and compute q = Sk ΔT.","S has units of length; R = 1/Sk; check the geometric validity condition.","","",2],["HT-6.2.B",1680,"Combine shape-factor resistances with other resistances in a network.","Two buried objects ⇒ two resistances in series across T₁ − T₂.","","",2]]},{"n":3,"title":"Finite-difference equations","los":[["HT-6.3.A",1681,"Write the finite-difference equation of an interior, surface or corner node by an energy balance on its cell, including Δx ≠ Δy, convection and radiation.","Each face: conductance × (T_neighbour − T_m); boundary faces get h·ℓ or h_r·ℓ terms; half cells on edges.","","",2],["HT-6.3.B",1682,"Solve a small node system directly or by Gauss–Seidel iteration and check the energy balance.","Iterate T_i = (Σa_jT_j + b)/a_i until changes are below tolerance.","","",0]]}]},{"n":7,"title":"Transient conduction","scope":"core","topics":[{"n":1,"title":"Lumped capacitance","los":[["HT-7.1.A",1683,"Compute the Biot number with L_c = V/A_s and decide whether lumped capacitance applies.","Bi = hL_c/k \u003c 0.1 ⇒ internal gradients negligible; L_c = r/3 sphere, r/2 cylinder, half-thickness wall.","","",2],["HT-7.1.B",1684,"Find temperature at a time, or the time to reach a temperature, for a lumped body.","θ/θ_i = exp(−t/τ), τ = ρVc/hA_s.","","",2],["HT-7.1.C",1685,"Find the energy transferred over an interval.","Q = ρVcθ_i[1 − exp(−t/τ)].","","",2],["HT-7.1.D",1686,"Set up and solve a general lumped balance with radiation, surface flux or generation.","ρVc dT/dt = q''_sA − hA(T − T∞) − εσA(T⁴ − T_sur⁴) + Ė_g; solve or integrate numerically.","","",0]]},{"n":2,"title":"Spatial effects — one-term solutions","los":[["HT-7.2.A",1687,"Compute Bi and Fo and find the centre temperature of a wall, cylinder or sphere with the one-term approximation.","θ₀* = C₁exp(−ζ₁²Fo), valid for Fo > 0.2; ζ₁, C₁ from Bi (wall uses half-thickness).","","",2],["HT-7.2.B",1688,"Find the temperature at another position, or the time to reach a temperature.","θ* = θ₀* cos(ζ₁x*) (wall), θ₀* J₀(ζ₁r*) (cylinder), θ₀* sin(ζ₁r*)/(ζ₁r*) (sphere).","","",2],["HT-7.2.C",1689,"Find the fraction of the maximum energy transferred, Q/Q₀.","Wall: Q/Q₀ = 1 − (sin ζ₁/ζ₁)θ₀*; cylinder and sphere have their own forms.","","",0]]},{"n":3,"title":"The semi-infinite solid","los":[["HT-7.3.A",1690,"Find temperature at a depth and time, the depth reached, or the time needed, after a sudden surface temperature change.","(T − T_s)/(T_i − T_s) = erf(x/2√(αt)); valid while the far side hasn't felt it.","","",2],["HT-7.3.B",1691,"Find the surface heat flux, and the contact temperature when two semi-infinite solids touch.","q''_s = k(T_s − T_i)/√(παt); T_s = (√(kρc)_A T_A + √(kρc)_B T_B)/(√(kρc)_A + √(kρc)_B).","","",2]]},{"n":4,"title":"Multidimensional transient effects","los":[["HT-7.4.A",1692,"Build a 2-D or 3-D transient solution as a product of 1-D solutions.","Short cylinder = infinite cylinder × plane wall, each in dimensionless θ*.","","",0]]},{"n":5,"title":"Finite-difference transient methods","los":[["HT-7.5.A",1693,"Write the explicit finite-difference equation for a transient node and check its stability limit.","T_m^{p+1} = Fo(T_{m+1}^p + T_{m−1}^p) + (1 − 2Fo)T_m^p; stable if Fo ≤ 1/2 (interior, 1-D).","","",0]]}]},{"n":8,"title":"Convection fundamentals and external flow","scope":"core","topics":[{"n":1,"title":"Boundary layers and dimensionless groups","los":[["HT-8.1.A",1694,"Compute Re, Pr and Nu and identify laminar, transitional or turbulent flow.","Re_x = u∞x/ν (transition ≈ 5×10⁵ on a plate); Pr = ν/α; Nu = hL/k_f.","","",2],["HT-8.1.B",1695,"Relate local and average convection coefficients.","h̄ = (1/L)∫h_x dx; laminar h_x ∝ x^(−1/2) ⇒ h̄ = 2h_x(L).","","",2],["HT-8.1.C",1696,"Estimate velocity and thermal boundary-layer thicknesses and how Pr relates them.","δ ≈ 5x/√Re_x; δ/δ_t ≈ Pr^(1/3).","","",2],["HT-8.1.D",1697,"Use the Reynolds–Colburn analogy to get h from friction (or friction from h).","C_f/2 = St Pr^(2/3).","","",2]]},{"n":2,"title":"The flat plate in parallel flow","los":[["HT-8.2.A",1698,"Calculate average h and q for laminar flow over a flat plate, with properties at the film temperature.","Nu̅ = 0.664 Re_L^(1/2) Pr^(1/3); T_f = (T_s + T∞)/2.","","",2],["HT-8.2.B",1699,"Calculate average h for a mixed laminar–turbulent boundary layer.","Nu̅ = (0.037 Re_L^(4/5) − 871) Pr^(1/3) for Re_x,c = 5×10⁵.","","",2]]},{"n":3,"title":"Cylinders and spheres in cross flow","los":[["HT-8.3.A",1700,"Calculate h and q for a cylinder or sphere in cross flow with the appropriate correlation.","Churchill–Bernstein (cylinder, Re Pr > 0.2); Whitaker (sphere, μ ratio).","","",2]]},{"n":4,"title":"Flow across tube banks","los":[["HT-8.4.A",1701,"Find the maximum velocity, average h and outlet temperature for flow across a tube bank.","V_max from the minimum free area (aligned vs staggered); Žukauskas Nu̅ with row correction; log-mean ΔT across the bank.","","",2]]}]},{"n":9,"title":"Internal forced convection","scope":"core","topics":[{"n":1,"title":"Flow conditions and entry lengths","los":[["HT-9.1.A",1702,"Compute Re_D from ṁ and decide whether the flow is laminar and how long the entry regions are.","Re_D = 4ṁ/(πDμ); laminar below ≈ 2300; x_fd,h ≈ 0.05 Re_D D; x_fd,t ≈ 0.05 Re_D Pr D.","","",2]]},{"n":2,"title":"The mean temperature energy balance","los":[["HT-9.2.A",1703,"Find outlet temperature or required length with uniform wall heat flux.","q = ṁc_p(T_m,o − T_m,i) = q''_s πDL; T_m rises linearly.","","",2],["HT-9.2.B",1704,"Find outlet temperature or heat rate with uniform wall temperature, using the log-mean temperature difference.","ΔT_o/ΔT_i = exp(−PL h̄/ṁc_p); q = h̄A_s ΔT_lm.","","",2]]},{"n":3,"title":"Convection correlations for tubes","los":[["HT-9.3.A",1705,"Use the fully developed laminar results for constant flux or constant wall temperature.","Nu_D = 4.36 (uniform q''_s), 3.66 (uniform T_s).","","",2],["HT-9.3.B",1706,"Calculate h for turbulent flow with Dittus–Boelter (or Gnielinski), choosing the right exponent and property temperature.","Nu_D = 0.023 Re^(4/5) Pr^n, n = 0.4 heating, 0.3 cooling; properties at mean T_m.","","",2]]},{"n":4,"title":"Noncircular tubes and annuli","los":[["HT-9.4.A",1707,"Use the hydraulic diameter and annulus results for noncircular passages.","D_h = 4A_c/P; laminar Nu depends on shape; annulus uses D_o − D_i.","","",0]]}]},{"n":10,"title":"Free convection","scope":"core","topics":[{"n":1,"title":"Buoyancy-driven flow and when it matters","los":[["HT-10.1.A",1708,"Compute Gr and Ra and identify laminar or turbulent free convection.","Ra_L = gβΔT L³/(να); β = 1/T_f for an ideal gas; transition near Ra ≈ 10⁹ on a vertical plate.","","",2],["HT-10.1.B",1709,"Decide whether free, forced or mixed convection governs.","Gr/Re² ≪ 1 forced, ≫ 1 free, ~1 mixed.","","",0]]},{"n":2,"title":"Correlations for external free convection","los":[["HT-10.2.A",1710,"Calculate h for a vertical plate with the Churchill–Chu correlation.","Nu̅_L = {0.825 + 0.387Ra^(1/6)/[1 + (0.492/Pr)^(9/16)]^(8/27)}².","","",2],["HT-10.2.B",1711,"Calculate h for horizontal plates (hot side up or down) and horizontal cylinders and spheres.","L = A_s/P for horizontal plates; separate correlations for upper/lower surfaces.","","",2]]},{"n":3,"title":"Enclosures and mixed convection","los":[["HT-10.3.A",1712,"Calculate heat transfer across a vertical or horizontal enclosure (e.g. double-pane window).","Ra_L across the gap; Nu = 1 means pure conduction below the critical Ra.","","",0]]}]},{"n":11,"title":"Thermal radiation","scope":"core","topics":[{"n":1,"title":"Blackbody radiation and surface properties","los":[["HT-11.1.A",1713,"Use Stefan–Boltzmann and Wien's law to relate emissive power, peak wavelength and temperature.","E_b = σT⁴; λ_max T = 2898 μm·K.","","",2],["HT-11.1.B",1714,"Find the fraction of blackbody emission in a wavelength band.","F(0→λ) from λT (Table 12.2); band = difference of two fractions.","","",2],["HT-11.1.C",1715,"Find total emissivity or absorptivity from spectral data and apply Kirchhoff's law and the gray-surface assumption.","α = ∫α_λG_λdλ / G; ε = α only for a gray or diffuse-gray surface at the same T.","","",2],["HT-11.1.D",1716,"Solve a surface energy balance with irradiation, emission and convection for a steady surface temperature.","αG = εσT⁴ (+ h(T − T∞)) at steady state.","","",2]]},{"n":2,"title":"View factors","los":[["HT-11.2.A",1717,"Find view factors with reciprocity, summation and symmetry, including long ducts and cavities.","A_iF_ij = A_jF_ji; Σ_j F_ij = 1; flat or convex surfaces have F_ii = 0.","","",2],["HT-11.2.B",1718,"Evaluate view factors for standard geometries from formulas or charts.","Concentric cylinders/spheres: F₁₂ = 1; coaxial disks, aligned rectangles from Tables 13.1–13.2.","","",2]]},{"n":3,"title":"Radiation exchange between surfaces","los":[["HT-11.3.A",1719,"Calculate net exchange between black surfaces.","q_ij = A_iF_ijσ(T_i⁴ − T_j⁴).","","",2],["HT-11.3.B",1720,"Calculate net exchange in a two-surface gray enclosure (parallel plates, concentric cylinders or spheres).","q = σ(T₁⁴ − T₂⁴)/[(1−ε₁)/ε₁A₁ + 1/A₁F₁₂ + (1−ε₂)/ε₂A₂].","","",2],["HT-11.3.C",1721,"Quantify the effect of radiation shields.","Each shield adds two surface resistances and one space resistance in series.","","",2],["HT-11.3.D",1722,"Solve a three-surface enclosure with a reradiating (adiabatic) surface by the radiosity network.","Reradiating: J = E_b at that surface, net q = 0.","","",2]]},{"n":4,"title":"Multimode heat transfer with radiation","los":[["HT-11.4.A",1723,"Combine radiation exchange with conduction and convection at a surface or in an enclosure.","Radiation and convection from one surface act in parallel; h_r lets radiation join the resistance network.","","",0]]}]},{"n":12,"title":"Heat exchangers and system-level thermal analysis","scope":"core","topics":[{"n":1,"title":"The overall heat transfer coefficient","los":[["HT-12.1.A",1724,"Calculate U for a tube wall including both films, fouling and finned surfaces.","1/UA = 1/(η_o hA)_c + R''_f,c/(η_oA)_c + R_w + R''_f,h/(η_oA)_h + 1/(η_o hA)_h.","","",0]]},{"n":2,"title":"The log-mean temperature difference method","los":[["HT-12.2.A",1725,"Size a parallel-flow or counterflow exchanger with q = UA ΔT_lm when all inlet and outlet temperatures are known.","ΔT_lm = (ΔT₁ − ΔT₂)/ln(ΔT₁/ΔT₂), end differences defined by flow arrangement; counterflow needs less area.","","",2],["HT-12.2.B",1726,"Apply the LMTD correction factor for shell-and-tube and cross-flow exchangers.","q = UAF ΔT_lm,CF with F from P and R charts.","","",2]]},{"n":3,"title":"The effectiveness–NTU method","los":[["HT-12.3.A",1727,"Find effectiveness and heat rate from NTU and C_r.","NTU = UA/C_min; C_r = C_min/C_max; ε from the arrangement's relation; q = εC_min(T_h,i − T_c,i).","","",2],["HT-12.3.B",1728,"Predict outlet temperatures of an existing exchanger when they are unknown.","ε–NTU avoids iteration when outlets are unknown; then energy balances give each outlet.","","",2]]},{"n":4,"title":"System-level thermal networks","los":[["HT-12.4.A",1729,"Model a device (electronics package, building wall, pipe run) as a network of conduction, convection and radiation resistances and find its operating temperature.","One energy balance per node; parallel paths from a surface (convection ∥ radiation); iterate when h_r depends on T.","","",0],["HT-12.4.B",1730,"Identify the controlling resistance and choose the design change that best meets a temperature limit.","Reduce the largest R first; compare options by their effect on R_tot.","","",0]]}]},{"n":13,"title":"Boiling and condensation","scope":"extension","topics":[{"n":1,"title":"Boiling","los":[["HT-13.1.A",1731,"Identify the boiling regime from the excess temperature on the boiling curve.","Free convection → nucleate → transition → film; CHF at the nucleate peak.","","",2],["HT-13.1.B",1732,"Calculate nucleate boiling flux (Rohsenow) and critical heat flux.","q''_s ∝ ΔT_e³; q''_max = 0.149 h_fg ρ_v [σg(ρ_l − ρ_v)/ρ_v²]^(1/4).","","",2]]},{"n":2,"title":"Film condensation","los":[["HT-13.2.A",1733,"Calculate film condensation on a vertical plate or horizontal tube.","Nusselt analysis with h′_fg = h_fg(1 + 0.68 Ja); tube constant 0.729.","","",2]]}]},{"n":14,"title":"Mass transfer","scope":"extension","topics":[{"n":1,"title":"Diffusion","los":[["HT-14.1.A",1734,"Calculate a diffusive flux in a stationary medium with Fick's law, including membranes and solubility.","N_A = −D_AB dC_A/dx; at an interface C = S·p.","","",2],["HT-14.1.B",1735,"Calculate evaporation through a stagnant gas column (Stefan flow).","N_A = (CD_AB/L) ln[(1 − x_A,L)/(1 − x_A,0)].","","",2],["HT-14.1.C",1736,"Solve diffusion with a homogeneous reaction.","D d²C/dx² − k₁C = 0 ⇒ cosh/sinh profile, like a fin.","","",2]]},{"n":2,"title":"Convective mass transfer and the analogy","los":[["HT-14.2.A",1737,"Use the heat–mass analogy to convert between h and h_m, and Nu and Sh correlations.","h/h_m = ρc_p Le^(2/3); Sh = f(Re, Sc) mirrors Nu = f(Re, Pr).","","",2],["HT-14.2.B",1738,"Solve a coupled heat and mass balance at an evaporating surface (wet bulb).","h(T∞ − T_s) = h_m h_fg(ρ_A,s − ρ_A,∞).","","",2]]}]}]},{"id":"thermodynamics","title":"Thermodynamics and Statistical Mechanics","code":"TD","track":"engineering","requires":["engineering-math","chemistry","physics"],"units":[{"n":1,"title":"Probability and counting states","scope":"core","topics":[{"n":1,"title":"Counting arrangements","los":[["TD-1.1.A",1739,"Count ordered selections of distinguishable objects (permutations).","N!/(N − k)! ordered ways to fill k slots from N.","","",2],["TD-1.1.B",1740,"Count arrangements of indistinguishable particles on distinguishable sites.","C(M, N) = M!/(N!(M − N)!) — the lattice-gas multiplicity.","","",2],["TD-1.1.C",1741,"Count distinct sequences of a multiset (multinomial coefficient).","N!/(n_A! n_B! …); identical units are not reordered.","","",2],["TD-1.1.D",1742,"Apply Stirling's approximation to ln W for large N.","ln N! ≈ N ln N − N; turns ln C(M, N) into −M Σ x ln x.","","",0]]},{"n":2,"title":"Probability distributions","los":[["TD-1.2.A",1743,"Calculate the probability of exactly k outcomes in N independent two-outcome trials.","P(k) = C(N, k) p^k (1 − p)^(N − k).","","",2],["TD-1.2.B",1744,"Calculate an 'at least one' probability through the complement.","P(≥ 1) = 1 − (1 − p)^N for independent events.","","",2],["TD-1.2.C",1745,"Calculate the mean and variance of a discrete distribution.","⟨x⟩ = Σ p_i x_i; σ² = ⟨x²⟩ − ⟨x⟩².","","",1]]}]},{"n":2,"title":"Entropy, equilibrium and the fundamental equation","scope":"core","topics":[{"n":1,"title":"Multiplicity and S = k ln W","los":[["TD-2.1.A",1746,"Calculate the multiplicity of a system of independent two-state units with a given number excited.","W = N!/(n!(N − n)!); S = k_B ln W.","","TD-1.1.B",2],["TD-2.1.B",1747,"Calculate the multiplicity of an Einstein solid with N oscillators and q quanta.","W = (q + N − 1)!/(q!(N − 1)!).","","",2],["TD-2.1.C",1748,"Calculate ΔS from the change in multiplicity of a lattice or spin system.","ΔS = k_B ln(W₂/W₁).","","",2],["TD-2.1.D",1749,"Derive the entropy of isothermal ideal-gas expansion by lattice counting.","W ∝ M^N, M ∝ V ⇒ ΔS = nR ln(V₂/V₁).","","",2]]},{"n":2,"title":"Equilibrium as maximum entropy","los":[["TD-2.2.A",1750,"Calculate the probability of each energy split between two solids in thermal contact and identify the most probable one.","P(q_A) ∝ W_A(q_A) W_B(q − q_A); the peak sharpens as N grows.","","",2],["TD-2.2.B",1751,"Derive equality of T, P and μ by maximising total entropy over exchange of U, V and N.","∂S/∂U = 1/T, ∂S/∂V = P/T, ∂S/∂N = −μ/T must match across the wall.","","",0],["TD-2.2.C",1752,"Show that maximum entropy at fixed U is equivalent to minimum energy at fixed S.","Internal constraints released ⇒ S rises (second law); the energy-minimum principle is its inverse.","","",0]]},{"n":3,"title":"The fundamental equation and its integrated forms","los":[["TD-2.3.A",1753,"Find T, P or μ as derivatives of a given S(U, V, N).","dS = (1/T)dU + (P/T)dV − (μ/T)dN.","","",2],["TD-2.3.B",1754,"Find T, P or μ as derivatives of a given U(S, V, N).","dU = T dS − P dV + μ dN.","","",2],["TD-2.3.C",1755,"Check that a proposed fundamental equation is extensive (first-order homogeneous).","S(λU, λV, λN) = λS(U, V, N); exponents of extensive variables sum to 1.","","",0],["TD-2.3.D",1756,"Calculate U, or any one term, from the Euler relation.","U = TS − PV + μN; equivalently G = μN for one component.","","",2],["TD-2.3.E",1757,"Apply the Gibbs–Duhem equation to relate changes in the intensive variables.","S dT − V dP + N dμ = 0; at fixed T, dμ = v dP.","","",2]]}]},{"n":3,"title":"The first law and reversibility","scope":"core","topics":[{"n":1,"title":"Work and heat on reversible paths","los":[["TD-3.1.A",1758,"Calculate q, w and ΔU for a reversible isothermal ideal-gas process.","ΔU = 0; w = −nRT ln(V₂/V₁) = −q.","","",2],["TD-3.1.B",1759,"Calculate q, w and ΔU for a reversible isobaric ideal-gas process.","w = −PΔV = −nRΔT; q = nC_pΔT.","","",2],["TD-3.1.C",1760,"Calculate q, w and ΔU for a constant-volume ideal-gas process.","w = 0; q = ΔU = nC_vΔT.","","",2],["TD-3.1.D",1761,"Find the final state of a reversible adiabatic ideal-gas process.","TV^(γ−1) constant; C_v = 3R/2 monatomic, 5R/2 diatomic (no vibration).","","",2]]},{"n":2,"title":"Baths, irreversibility and heat engines","los":[["TD-3.2.A",1762,"Calculate the total entropy change of system plus bath for an irreversible process and decide whether it can occur.","ΔS_bath = −q/T_bath; ΔS_tot ≥ 0, equal only when reversible.","","",0],["TD-3.2.B",1763,"Calculate the maximum efficiency or coefficient of performance of a cycle between two reservoirs.","η_max = 1 − T_C/T_H from ΔS_tot = 0.","","",0]]},{"n":3,"title":"Open steady-flow systems","los":[["TD-3.3.A",1764,"Apply steady-flow energy and entropy balances to a turbine, compressor, nozzle or throttle.","Δh = q + w_s per unit mass; throttling is isenthalpic; Δs ≥ q/T.","","",0]]}]},{"n":4,"title":"Legendre transforms and thermodynamic potentials","scope":"core","topics":[{"n":1,"title":"Multivariable calculus tools","los":[["TD-4.1.A",1765,"Test whether a differential is exact (a state function) by equality of cross-derivatives.","M dx + N dy exact ⇔ ∂M/∂y = ∂N/∂x; δq and δw are not exact.","","",0],["TD-4.1.B",1766,"Apply the triple-product and chain rules to rewrite a partial derivative.","(∂x/∂y)_z (∂y/∂z)_x (∂z/∂x)_y = −1.","","",1]]},{"n":2,"title":"Potentials and natural variables","los":[["TD-4.2.A",1767,"Construct F, H or G from a given U(S, V, N) by Legendre transform.","F = U − TS; eliminate S using T = ∂U/∂S. H = U + PV; G = U − TS + PV.","","TD-2.3.B",2],["TD-4.2.B",1768,"State the natural variables and differential of any potential, including the grand potential.","dF = −S dT − P dV + μ dN; dG = −S dT + V dP + μ dN; dΩ = −S dT − P dV − N dμ.","","",2],["TD-4.2.C",1769,"Choose the potential minimised at equilibrium for given bath conditions.","T, V, N → F; T, P, N → G; T, V, μ → Ω; S, P, N → H.","","",1]]},{"n":3,"title":"Derivative and integrated relations","los":[["TD-4.3.A",1770,"Derive P, S, μ or U from a given F(T, V, N) or G(T, P, N).","P = −(∂F/∂V)_T, S = −(∂F/∂T)_V, μ = (∂F/∂N)_{T,V}.","","",2],["TD-4.3.B",1771,"Use the Gibbs–Helmholtz relation to get S or H from G(T).","S = −(∂G/∂T)_P; H = −T²[∂(G/T)/∂T]_P.","","",2]]}]},{"n":5,"title":"Maxwell relations and measurable properties","scope":"core","topics":[{"n":1,"title":"Maxwell relations","los":[["TD-5.1.A",1772,"Identify the Maxwell relation that equals a given partial derivative.","Cross-derivatives of t

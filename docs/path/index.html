 up its own.","ENE-2.J","BI-2.9.A",0]]},{"n":10,"title":"Cell compartmentalization","los":[["BI-2.10.A",1166,"Explain how membrane-bound compartments let incompatible reactions run in one cell.","Compartments keep different pH, enzymes and concentrations apart (lysosome vs cytosol).","ENE-2.K","BI-2.2.B",0],["BI-2.10.B",1167,"Explain how internal membranes raise the area available for membrane-bound reactions.","ER, cristae and thylakoids pack large reactive surface into small volume.","ENE-2.L","BI-2.2.C",0]]},{"n":11,"title":"Origins of cell compartmentalization","los":[["BI-2.11.A",1168,"Compare prokaryotic and eukaryotic cells by nucleus, organelles, ribosomes and chromosome form.","Prokaryotes: no nucleus or membrane organelles, 70S ribosomes, circular chromosome; eukaryotes: nucleus, organelles, 80S, linear chromosomes.","EVO-1.A","BI-2.1.B",0],["BI-2.11.B",1169,"Weigh the evidence that mitochondria and chloroplasts descend from engulfed prokaryotes.","Double membranes, own circular DNA, 70S ribosomes and division by fission.","EVO-1.B","BI-2.11.A",0]]}]},{"n":3,"title":"Cellular Energetics","scope":"core","topics":[{"n":1,"title":"Enzyme structure","los":[["BI-3.1.A",1170,"Explain how the shape and charge of an active site make an enzyme specific for its substrate.","Substrate must fit the active site geometrically and chemically; induced fit tightens binding.","ENE-1.D","BI-1.5.A",0]]},{"n":2,"title":"Enzyme catalysis","los":[["BI-3.2.A",1171,"Explain on an energy diagram how an enzyme lowers activation energy without changing ΔG.","Enzymes stabilise the transition state; reactant and product energies stay the same.","ENE-1.E","BI-3.1.A",0],["BI-3.2.B",1172,"Calculate an initial reaction rate from the slope of a product-versus-time graph.","Rate = Δ[product]/Δt over the early linear region, before substrate runs low.","ENE-1.E","",0]]},{"n":3,"title":"Environmental impacts on enzyme function","los":[["BI-3.3.A",1173,"Predict how temperature and pH changes alter enzyme shape and reaction rate.","Rate rises with temperature to an optimum, then falls as the enzyme denatures; each enzyme has a pH optimum.","ENE-1.F","BI-3.2.A",0],["BI-3.3.B",1174,"Distinguish competitive from noncompetitive inhibition and predict the effect of adding more substrate.","Competitive binds the active site and is outcompeted by substrate; noncompetitive binds elsewhere and is not.","ENE-1.G","BI-3.2.A",0],["BI-3.3.C",1175,"Read saturation and inhibition from rate-versus-substrate-concentration curves.","Curve plateaus at Vmax; a competitive inhibitor delays the plateau, a noncompetitive one lowers it.","ENE-1.G","BI-3.3.B",0]]},{"n":4,"title":"Cellular energy","los":[["BI-3.4.A",1176,"Explain how coupling to ATP hydrolysis drives an endergonic reaction.","Coupled ΔG is the sum; transferring a phosphate to the substrate makes the overall ΔG negative.","ENE-1.H","BI-3.2.A",0],["BI-3.4.B",1177,"Explain why organisms need continuous energy input and what happens when it stops.","Order is maintained only by spending energy; energy loss leads to disorder and death.","ENE-1.H","BI-3.4.A",0]]},{"n":5,"title":"Photosynthesis","los":[["BI-3.5.A",1178,"Write the overall photosynthesis equation and locate the light reactions and the Calvin cycle.","6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂; light reactions in thylakoid membranes, Calvin cycle in the stroma.","ENE-1.I","BI-2.2.C",0],["BI-3.5.B",1179,"Trace electrons from water through PSII, the ETC and PSI to NADPH and explain how the proton gradient drives ATP synthase.","Water is split to replace PSII electrons; H⁺ pumped into the lumen flows back through ATP synthase.","ENE-1.J","BI-3.5.A BI-2.9.A",0],["BI-3.5.C",1180,"Explain how the Calvin cycle spends ATP and NADPH to fix CO₂ into G3P.","Rubisco fixes CO₂ to RuBP; 3 CO₂ in → 1 G3P out, using 9 ATP and 6 NADPH.","ENE-1.J","BI-3.5.B",0],["BI-3.5.D",1181,"Read absorption and action spectra and calculate pigment Rf values from a chromatogram.","Rf = distance pigment moved / distance solvent moved; chlorophylls absorb blue and red, reflect green.","ENE-1.I","BI-3.5.A",0]]},{"n":6,"title":"Cellular respiration","los":[["BI-3.6.A",1182,"Outline glycolysis, pyruvate oxidation, the Krebs cycle and oxidative phosphorylation with location and products.","Glycolysis (cytosol) → acetyl-CoA and Krebs (matrix) → ETC and ATP synthase (inner membrane).","ENE-1.K","BI-3.4.A BI-2.2.C",0],["BI-3.6.B",1183,"Explain chemiosmosis in mitochondria and O₂'s role as the final electron acceptor.","NADH and FADH₂ feed the ETC, which pumps H⁺ into the intermembrane space; ATP synthase uses the gradient; O₂ + e⁻ + H⁺ → H₂O.","ENE-1.L","BI-3.6.A BI-2.9.A",0],["BI-3.6.C",1184,"Predict how an ETC inhibitor or an uncoupler changes O₂ use, the proton gradient and ATP output.","Inhibitors stop flow and O₂ use; uncouplers let H⁺ leak, so O₂ use rises while ATP falls and heat rises.","ENE-1.L","BI-3.6.B",0],["BI-3.6.D",1185,"Compare fermentation with aerobic respiration by NAD⁺ regeneration and ATP yield.","Fermentation regenerates NAD⁺ so glycolysis continues: 2 ATP per glucose vs about 30–32 aerobically.","ENE-1.K","BI-3.6.A",0],["BI-3.6.E",1186,"Calculate a respiration rate from respirometer data.","Rate = O₂ consumed ÷ time (÷ mass); correct for the control respirometer.","ENE-1.K","BI-3.6.B",0]]},{"n":7,"title":"Fitness","los":[["BI-3.7.A",1187,"Explain how molecular variation lets organisms function in different environments.","Several chlorophyll types widen usable light; membrane lipid saturation tracks temperature; fetal hemoglobin binds O₂ tighter.","SYI-3.A","BI-3.5.D",0]]}]},{"n":4,"title":"Cell Communication and Cell Cycle","scope":"core","topics":[{"n":1,"title":"Cell communication","los":[["BI-4.1.A",1188,"Distinguish communication by direct contact from communication by secreted chemical signals.","Gap junctions and plasmodesmata join cytoplasms; surface molecules allow cell–cell recognition (e.g. antigen presentation).","IST-3.A","",0],["BI-4.1.B",1189,"Classify a signal as autocrine, paracrine, synaptic or endocrine, and recognise quorum sensing.","Local signals act on neighbours; hormones travel in the blood to distant targets; bacteria sense density by signal concentration.","IST-3.B","BI-4.1.A",0]]},{"n":2,"title":"Introduction to signal transduction","los":[["BI-4.2.A",1190,"Identify reception, transduction and response and the molecules that carry out each.","Ligand binds receptor → relay proteins and second messengers → change in enzyme activity or gene expression.","IST-3.C","BI-4.1.B",0],["BI-4.2.B",1191,"Explain how ligand binding to a GPCR, receptor tyrosine kinase, ion channel or intracellular receptor starts a response.","Binding changes receptor shape; hydrophobic ligands cross the membrane and bind intracellular receptors.","IST-3.D","BI-4.2.A BI-2.5.A",0]]},{"n":3,"title":"Signal transduction","los":[["BI-4.3.A",1192,"Explain how second messengers and phosphorylation cascades amplify a signal.","One receptor activates many G proteins → much cAMP → many kinases, each phosphorylating many targets.","IST-3.E","BI-4.2.B",0],["BI-4.3.B",1193,"Describe the kinds of cellular response a pathway can produce.","Change in gene expression, enzyme activation (glycogen breakdown after epinephrine), division or apoptosis.","IST-3.F","BI-4.3.A",0]]},{"n":4,"title":"Changes in signal transduction pathways","los":[["BI-4.4.A",1194,"Predict how a mutation or drug that alters one pathway component changes the response.","A stuck-on component (constitutive Ras, cholera toxin on Gs) signals without ligand; a broken one blocks it.","IST-3.G","BI-4.3.A",0]]},{"n":5,"title":"Feedback","los":[["BI-4.5.A",1195,"Classify a described regulatory loop as positive or negative feedback.","Negative feedback opposes the change; positive feedback amplifies it.","ENE-3.A","",0],["BI-4.5.B",1196,"Explain how negative feedback holds a set point, using blood glucose or body temperature.","High glucose → insulin → uptake and storage; low glucose → glucagon → release.","ENE-3.B","BI-4.5.A",0],["BI-4.5.C",1197,"Explain a positive-feedback example and what ends it.","Oxytocin in labour, ethylene in ripening, platelet clotting — each stops when the triggering event finishes.","ENE-3.C","BI-4.5.A",0]]},{"n":6,"title":"Cell cycle","los":[["BI-4.6.A",1198,"Describe G1, S, G2, M and G0 and track DNA content per cell through the cycle.","S doubles DNA (2c → 4c); cytokinesis returns each daughter to 2c.","IST-1.B","BI-1.6.A",0],["BI-4.6.B",1199,"Order the stages of mitosis and describe chromosome behaviour in each.","Prophase condense → metaphase align → anaphase sister chromatids separate → telophase nuclei re-form.","IST-1.C","BI-4.6.A",0],["BI-4.6.C",1200,"Estimate time spent in each phase from counts of cells in each phase.","Fraction of cells in a phase × total cycle time ≈ time in that phase.","IST-1.B","BI-4.6.B",0]]},{"n":7,"title":"Regulation of cell cycle","los":[["BI-4.7.A",1201,"Explain how checkpoints and cyclin–CDK complexes control passage through the cycle.","G1, G2 and M checkpoints check size, DNA damage and spindle attachment; cyclins rise and fall to activate CDKs.","IST-1.D","BI-4.6.A",0],["BI-4.7.B",1202,"Explain how failed checkpoint control leads to cancer or apoptosis.","Oncogenes are stuck-on accelerators; loss of tumour suppressors like p53 removes the brakes.","IST-1.E","BI-4.7.A BI-4.4.A",0]]}]},{"n":5,"title":"Heredity","scope":"core","topics":[{"n":1,"title":"Meiosis","los":[["BI-5.1.A",1203,"Track chromosome and chromatid number through meiosis I and II from a diploid cell.","Meiosis I separates homologues (2n → n); meiosis II separates sister chromatids.","IST-1.F","BI-4.6.B",0],["BI-5.1.B",1204,"Compare mitosis and meiosis by number of divisions, products, ploidy and pairing of homologues.","Mitosis: 1 division, 2 identical diploid cells; meiosis: 2 divisions, 4 distinct haploid cells, synapsis in prophase I.","IST-1.G","BI-5.1.A",0]]},{"n":2,"title":"Meiosis and genetic diversity","los":[["BI-5.2.A",1205,"Explain how crossing over, independent assortment and random fertilisation generate variation, and count assortment combinations.","Independent assortment alone gives 2ⁿ gamete combinations for n chromosome pairs (2²³ in humans).","IST-1.H","BI-5.1.A",0]]},{"n":3,"title":"Mendelian genetics","los":[["BI-5.3.A",1206,"Explain why conserved genetic processes across eukaryotes support common ancestry.","DNA as hereditary material, the genetic code and meiosis are shared by all eukaryotes.","EVO-2.A","BI-5.1.B",0],["BI-5.3.B",1207,"Predict genotype and phenotype ratios of a monohybrid cross with a Punnett square.","Aa × Aa → 1:2:1 genotypes, 3:1 phenotypes; Aa × aa → 1:1.","IST-1.I","BI-5.1.A",0],["BI-5.3.C",1208,"Predict dihybrid and multi-gene outcomes with the product and sum rules.","Independent events multiply; mutually exclusive outcomes add; AaBb × AaBb → 9:3:3:1.","IST-1.I","BI-5.3.B",0],["BI-5.3.D",1209,"Determine the inheritance pattern from a pedigree and compute a family member's genotype probability.","Autosomal recessive can skip generations; dominant traits appear in every generation; unaffected sibs of affected are 2/3 carriers.","IST-1.I","BI-5.3.B",0],["BI-5.3.E",1210,"Use a chi-square test to decide whether cross data fit an expected Mendelian ratio.","χ² = Σ(o − e)²/e; df = categories − 1; reject the null if χ² exceeds the critical value at p = 0.05.","IST-1.I","BI-5.3.C",0]]},{"n":4,"title":"Non-Mendelian genetics","los":[["BI-5.4.A",1211,"Predict cross outcomes under incomplete dominance, codominance and multiple alleles.","Incomplete: blended heterozygote (1:2:1 phenotypes); codominant: both expressed (AB blood); ABO has three alleles.","IST-1.J","BI-5.3.B",0],["BI-5.4.B",1212,"Predict offspring ratios for X-linked traits by sex.","Males are hemizygous: one X allele decides the phenotype; carrier mother → half of sons affected.","IST-1.J","BI-5.3.D",0],["BI-5.4.C",1213,"Recognise linkage from offspring counts and convert recombination frequency to map distance.","Recombinants ÷ total × 100 = map units; linked genes give excess parental types.","IST-1.J","BI-5.2.A BI-5.3.C",0],["BI-5.4.D",1214,"Explain maternal inheritance of organelle genes and the continuous variation of polygenic traits.","Mitochondria and chloroplasts come via the egg; many additive genes give a bell-shaped trait distribution.","IST-1.J","BI-2.11.B",0]]},{"n":5,"title":"Environmental effects on phenotype","los":[["BI-5.5.A",1215,"Explain how one genotype can give different phenotypes in different environments.","Soil pH changes hydrangea colour; incubation temperature sets sex in some reptiles; diet controls PKU symptoms.","SYI-3.B","BI-5.3.B",0]]},{"n":6,"title":"Chromosomal inheritance","los":[["BI-5.6.A",1216,"Explain how nondisjunction produces aneuploid gametes and name resulting human conditions.","A meiosis I error makes all four gametes abnormal, a meiosis II error two; trisomy 21, XO (Turner), XXY (Klinefelter).","SYI-3.C","BI-5.1.A",0],["BI-5.6.B",1217,"Read sex and chromosome-number abnormalities from a karyotype.","Count 22 autosome pairs plus the sex chromosomes; an extra or missing chromosome shows as 47 or 45.","SYI-3.C","BI-5.6.A",0]]}]},{"n":6,"title":"Gene Expression and Regulation","scope":"core","topics":[{"n":1,"title":"DNA and RNA structure","los":[["BI-6.1.A",1218,"Compare how genomes are organised in prokaryotes and eukaryotes.","Prokaryotes: one circular chromosome plus plasmids; eukaryotes: several linear chromosomes wrapped on histones.","IST-1.K","BI-2.11.A",0],["BI-6.1.B",1219,"Explain which features suit DNA to carry heredity and the experiments that showed it does.","Complementary pairing allows copying and repair; Griffith, Avery–MacLeod–McCarty and Hershey–Chase identified DNA as the genetic material.","IST-1.L","BI-1.6.B BI-1.2.B",0]]},{"n":2,"title":"Replication","los":[["BI-6.2.A",1220,"Describe semiconservative replication and the roles of helicase, topoisomerase, primase, DNA polymerase and ligase.","Each daughter helix keeps one parent strand; polymerase needs a primer and adds only to a 3′ end.","IST-1.M","BI-6.1.B",0],["BI-6.2.B",1221,"Explain leading- versus lagging-strand synthesis and Okazaki fragments.","5′→3′ synthesis on antiparallel templates forces one strand to be made in fragments joined by ligase.","IST-1.M","BI-6.2.A",0],["BI-6.2.C",1222,"Predict Meselson–Stahl density bands after n generations in ¹⁴N medium.","Gen 1: all hybrid; gen n: 2/2ⁿ hybrid, rest light.","IST-1.M","BI-6.2.A",0]]},{"n":3,"title":"Transcription and RNA processing","los":[["BI-6.3.A",1223,"Transcribe a template strand into mRNA and tell the template strand from the coding strand.","mRNA matches the coding strand (U for T) and is complementary, antiparallel to the template.","IST-1.N","BI-1.6.B",0],["BI-6.3.B",1224,"Describe the 5′ cap, poly-A tail and splicing, and how alternative splicing yields several proteins from one gene.","Introns are removed and exons joined; different exon combinations make different proteins.","IST-1.N","BI-6.3.A",0]]},{"n":4,"title":"Translation","los":[["BI-6.4.A",1225,"Translate an mRNA into an amino acid sequence with a codon table, finding the start and stop codons.","Read 5′→3′ in triplets from AUG (Met) to UAA, UAG or UGA.","IST-1.O","BI-6.3.A",0],["BI-6.4.B",1226,"Describe initiation, elongation and termination with the ribosome's A, P and E sites.","Charged tRNA enters A, peptide transfers to it, ribosome shifts so tRNA moves P → E; release factor ends it at a stop codon.","IST-1.O","BI-6.4.A BI-2.1.A",0]]},{"n":5,"title":"Regulation of gene expression","los":[["BI-6.5.A",1227,"Explain how regulatory proteins, histone acetylation and DNA methylation turn eukaryotic genes up or down.","Acetylation loosens chromatin (more transcription); promoter methylation silences; these epigenetic marks can be inherited.","IST-2.A","BI-6.3.A BI-6.1.A",0],["BI-6.5.B",1228,"Predict lac (inducible) and trp (repressible) operon expression under given conditions.","Lactose inactivates the lac repressor; tryptophan activates the trp repressor; the operator lies between promoter and genes.","IST-2.B","BI-6.5.A",0]]},{"n":6,"title":"Gene expression and cell specialization","los":[["BI-6.6.A",1229,"Explain how a combination of transcription factors at enhancers sets a gene's expression level.","Activators and repressors bind regulatory sequences; the particular combination present decides transcription.","IST-2.C","BI-6.5.A",0],["BI-6.6.B",1230,"Explain how differential gene expression makes different cell types from one genome.","Every cell has the same DNA; different transcription factors switch on different gene sets.","IST-2.D","BI-6.6.A",0]]},{"n":7,"title":"Mutations","los":[["BI-6.7.A",1231,"Classify a point mutation as silent, missense, nonsense or frameshift and predict its effect on the protein.","Insertions or deletions not in multiples of three shift the reading frame downstream.","IST-2.E","BI-6.4.A",0],["BI-6.7.B",1232,"Explain how a change in genotype changes phenotype, using sickle-cell anaemia.","One base change → Glu→Val → hemoglobin polymerises → sickled cells.","IST-4.A","BI-6.7.A BI-1.5.B",0],["BI-6.7.C",1233,"Explain how replication errors, horizontal gene transfer and viral recombination create variation selection can act on.","Transformation, transduction and conjugation move genes between bacteria; RNA viruses mutate fast.","IST-4.B","BI-6.7.A",0]]},{"n":8,"title":"Biotechnology","los":[["BI-6.8.A",1234,"Read gel electrophoresis band patterns to compare fragment sizes and match samples.","DNA is negative and runs toward +; smaller fragments travel farther.","IST-1.P","BI-6.1.B",0],["BI-6.8.B",1235,"Describe the PCR cycle and calculate copies after n cycles.","Denature (~95 °C) → anneal primers → extend with Taq; copies = initial × 2ⁿ.","IST-1.P","BI-6.2.A",0],["BI-6.8.C",1236,"Describe bacterial transformation with a recombinant plasmid and how restriction enzymes and sequencing are used.","Cut vector and insert with the same restriction enzyme, ligate, transform, select on antibiotic.","IST-1.P","BI-6.8.A BI-6.7.C",0]]}]},{"n":7,"title":"Natural Selection","scope":"core","topics":[{"n":1,"title":"Introduction to natural selection","los":[["BI-7.1.A",1237,"Identify the conditions natural selection needs from a scenario.","Heritable variation, more offspring than survive, and differential survival and reproduction tied to that variation.","EVO-1.C","BI-6.7.C",0],["BI-7.1.B",1238,"Explain how selection on phenotypes changes allele frequencies and define fitness.","Fitness is reproductive success; selection acts on individuals, but populations evolve.","EVO-1.D","BI-7.1.A",0]]},{"n":2,"title":"Natural selection","los":[["BI-7.2.A",1239,"Classify selection as directional, stabilising or disruptive from before-and-after trait distributions.","Directional shifts the mean; stabilising narrows it; disruptive favours both extremes.","EVO-1.E","BI-7.1.B",0]]},{"n":3,"title":"Artificial selection","los":[["BI-7.3.A",1240,"Explain how human choice of breeders or human-imposed pressures change a population's diversity.","Selective breeding and antibiotic or pesticide use select for chosen or resistant traits.","EVO-1.F","BI-7.1.B",0],["BI-7.3.B",1241,"Explain convergent evolution as similar selection in similar environments.","Unrelated lineages evolve analogous traits (wings in birds and bats, fins in sharks and dolphins).","EVO-1.G","BI-7.1.B",0]]},{"n":4,"title":"Population genetics","los":[["BI-7.4.A",1242,"Distinguish genetic drift, bottleneck, founder effect and gene flow.","Drift is random change in allele frequency; bottleneck and founder effects are drift after a sharp drop or a small colony.","EVO-1.H","BI-7.1.B",0],["BI-7.4.B",1243,"Explain why chance changes allele frequencies more in small populations.","Sampling error is larger with fewer breeders; alleles can be lost or fixed regardless of fitness.","EVO-1.I","BI-7.4.A",0],["BI-7.4.C",1244,"Explain how mutation and gene flow shift a population's genetic makeup over time.","Mutation is the ultimate source of new alleles; migration makes populations more alike.","EVO-1.J","BI-7.4.A",0]]},{"n":5,"title":"Hardy–Weinberg equilibrium","los":[["BI-7.5.A",1245,"Calculate allele and genotype frequencies with p + q = 1 and p² + 2pq + q² = 1.","q² is the recessive phenotype frequency; q = √q²; carriers = 2pq.","EVO-1.K","BI-5.3.B",0],["BI-7.5.B",1246,"State the five conditions under which allele frequencies stay constant.","No mutation, no migration, no selection, random mating, very large population.","EVO-1.K","BI-7.4.C",0],["BI-7.5.C",1247,"Decide from frequency data whether a population is evolving and name the condition that is failing.","Observed genotype counts far from p², 2pq, q² (by χ²) or changing across generations mean evolution.","EVO-1.L","BI-7.5.A BI-7.5.B BI-5.3.E",0]]},{"n":6,"title":"Evidence of evolution","los":[["BI-7.6.A",1248,"Describe the kinds of data that support evolution.","Fossils, comparative anatomy, molecular sequences, embryology and biogeography.","EVO-1.M","",0],["BI-7.6.B",1249,"Distinguish homologous, analogous and vestigial structures and date fossils from radioisotope half-lives.","Fraction remaining = (1/2)^(t / t½); homology reflects shared ancestry, analogy reflects convergence.","EVO-1.N","BI-7.6.A BI-7.3.B",0]]},{"n":7,"title":"Common ancestry","los":[["BI-7.7.A",1250,"Identify molecular features shared by all living things as evidence of a common ancestor.","DNA/RNA genetic material, a nearly universal genetic code, ribosomes and core metabolic pathways like glycolysis.","EVO-2.B","BI-6.4.A",0],["BI-7.7.B",1251,"Identify features shared by all eukaryotes as evidence of their common ancestry.","Membrane-bound organelles, linear chromosomes and genes with introns.","EVO-2.C","BI-7.7.A BI-2.11.B",0]]},{"n":8,"title":"Continuing evolution","los":[["BI-7.8.A",1252,"Explain current examples showing evolution is ongoing.","Antibiotic and pesticide resistance, seasonal flu strains, changing fossil and genomic records.","EVO-3.A","BI-7.3.A",0]]},{"n":9,"title":"Phylogeny","los":[["BI-7.9.A",1253,"Describe the morphological and molecular evidence used to infer relatedness, and prefer molecular data when they conflict.","Fewer sequence differences = more recent common ancestor; molecular data avoid convergence errors.","EVO-3.B","BI-7.6.B",0],["BI-7.9.B",1254,"Read a phylogenetic tree or cladogram for most recent common ancestors, sister taxa and shared derived traits.","Nodes are ancestors; relatedness is read from nodes, not from tip order.","EVO-3.C","BI-7.9.A",0],["BI-7.9.C",1255,"Build the most parsimonious cladogram from a table of shared derived characters.","Group taxa by shared derived traits; prefer the tree with the fewest character changes; the outgroup roots it.","EVO-3.C","BI-7.9.B",0]]},{"n":10,"title":"Speciation","los":[["BI-7.10.A",1256,"Apply the biological species concept and distinguish allopatric from sympatric speciation.","Species = interbreeding populations producing fertile offspring; allopatric needs a geographic barrier, sympatric does not (polyploidy).","EVO-3.D","BI-7.4.A",0],["BI-7.10.B",1257,"Contrast punctuated equilibrium with gradualism and relate rate to adaptive radiation.","Long stasis with rapid bursts vs steady change; open niches speed diversification.","EVO-3.E","BI-7.10.A",0],["BI-7.10.C",1258,"Classify a reproductive barrier in a scenario as prezygotic or postzygotic and name its type.","Prezygotic: habitat, temporal, behavioural, mechanical, gametic; postzygotic: hybrid inviability, sterility, breakdown.","EVO-3.F","BI-7.10.A",0]]},{"n":11,"title":"Extinction","los":[["BI-7.11.A",1259,"Describe factors that drive a population to extinction.","Habitat loss, rapid environmental change, disease, competition, small population size.","EVO-3.G","",0],["BI-7.11.B",1260,"Explain how the speed of environmental change, including human change, affects extinction risk.","Change faster than populations can adapt raises extinction rates.","EVO-3.H","BI-7.11.A",0],["BI-7.11.C",1261,"Explain diversity as speciation rate minus extinction rate and how mass extinctions open niches for adaptive radiation.","After the end-Cretaceous extinction, mammals radiated into vacated niches.","EVO-3.I, EVO-3.J","BI-7.10.B BI-7.11.A",0]]},{"n":12,"title":"Variations in populations","los":[["BI-7.12.A",1262,"Explain how a population's genetic diversity affects its ability to survive environmental pressure.","Low diversity (Irish potato monoculture, cheetahs) means one disease or change can hit everyone.","SYI-3.D","BI-7.4.B",0]]},{"n":13,"title":"Origins of life on Earth","los":[["BI-7.13.A",1263,"Describe the evidence for hypotheses about how life began.","Earth ~4.6 Byr, life by ~3.5 Byr; Miller–Urey made organics abiotically; RNA can store information and catalyse (RNA world).","SYI-3.E","BI-7.6.B",0]]}]},{"n":8,"title":"Ecology","scope":"core","topics":[{"n":1,"title":"Responses to the environment","los":[["BI-8.1.A",1264,"Explain how organisms change behaviour or physiology in response to environmental cues.","Taxis and kinesis, photoperiodism, hibernation and migration time activity to conditions.","ENE-3.D","BI-4.5.B",0],["BI-8.1.B",1265,"Explain how signals between organisms change behaviour and how cooperation can raise fitness.","Visual, auditory, chemical and tactile signals; kin selection explains altruism toward relatives.","IST-5.A","BI-8.1.A BI-7.1.B",0]]},{"n":2,"title":"Energy flow through ecosystems","los":[["BI-8.2.A",1266,"Compare endotherms and ectotherms and relate metabolic rate per gram to body size.","Smaller endotherms have higher mass-specific metabolic rates (larger SA/V).","ENE-1.M","BI-2.3.B",0],["BI-8.2.B",1267,"Predict how a change in energy availability changes population size and ecosystem structure.","Less energy at the base shrinks every level above it; surplus energy lets populations grow.","ENE-1.N","BI-8.2.A",0],["BI-8.2.C",1268,"Calculate energy passed between trophic levels and distinguish gross from net primary productivity.","About 10% transfers per level; NPP = GPP − respiration.","ENE-1.O","BI-8.2.B",0],["BI-8.2.D",1269,"Trace carbon, nitrogen, phosphorus and water through their biogeochemical cycles.","N₂ fixation → nitrification → assimilation → ammonification → denitrification; phosphorus has no atmospheric phase.","ENE-1.O","BI-3.6.A BI-3.5.A",0]]},{"n":3,"title":"Population ecology","los":[["BI-8.3.A",1270,"Calculate per-capita birth and death rates and r from population counts.","b = B/N, d = D/N, r = b − d.","SYI-1.G","",0],["BI-8.3.B",1271,"Calculate growth with dN/dt = r_max N and recognise a J-shaped curve.","Unlimited resources give exponential growth; growth rate scales with N.","SYI-1.G","BI-8.3.A",0]]},{"n":4,"title":"Effect of density of populations","los":[["BI-8.4.A",1272,"Calculate logistic growth with dN/dt = r_max N (K − N)/K and locate K on a graph.","Growth is fastest at N = K/2 and stops at K.","SYI-1.H","BI-8.3.B",0],["BI-8.4.B",1273,"Classify a limiting factor as density-dependent or density-independent.","Competition, disease and predation scale with density; fire, floods and freezes do not.","SYI-1.H","BI-8.4.A",0]]},{"n":5,"title":"Community ecology","los":[["BI-8.5.A",1274,"Calculate Simpson's diversity index and compare communities by richness and evenness.","D = 1 − Σ(n/N)²; closer to 1 is more diverse.","ENE-4.A","",0],["BI-8.5.B",1275,"Classify species interactions by their +, − or 0 effect on each partner.","Mutualism +/+, commensalism +/0, predation and parasitism +/−, competition −/−.","ENE-4.B","",0],["BI-8.5.C",1276,"Interpret predator–prey cycles, competitive exclusion and resource partitioning from data.","Predator peaks lag prey peaks; two species cannot share one niche indefinitely.","ENE-4.B","BI-8.5.B",0],["BI-8.5.D",1277,"Explain how resource availability drives community change, including primary and secondary succession.","Primary starts on bare rock with pioneer species; secondary starts on existing soil.","ENE-4.C","BI-8.5.B",0]]},{"n":6,"title":"Biodiversity","los":[["BI-8.6.A",1278,"Explain why ecosystems with higher diversity are more resilient.","More species means redundancy: if one fails another fills the role.","SYI-3.F","BI-8.5.A",0],["BI-8.6.B",1279,"Predict the effect of removing a keystone species, a producer or an essential abiotic factor.","Keystone effects exceed abundance (sea otters → urchins → kelp); losing producers collapses the food web.","SYI-3.G","BI-8.6.A BI-8.2.C",0]]},{"n":7,"title":"Disruptions to ecosystems","los":[["BI-8.7.A",1280,"Explain how environmental change selects among variants already present in a population.","Heterozygote advantage (sickle-cell trait and malaria) keeps a harmful allele common.","EVO-1.O","BI-7.1.B BI-6.7.B",0],["BI-8.7.B",1281,"Explain how an invasive species spreads and disrupts a native community.","Freed from its natural predators and competitors, it outcompetes natives.","SYI-2.A","BI-8.5.B",0],["BI-8.7.C",1282,"Describe how human activity changes ecosystems: habitat loss, biomagnification, eutrophication and climate change.","Fat-soluble toxins concentrate up food chains; excess nutrients → algal bloom → decomposition → O₂ depletion.","SYI-2.B","BI-8.2.D",0],["BI-8.7.D",1283,"Explain how geological and meteorological events change ecosystems.","Volcanic eruptions, El Niño and impacts reshape habitats and can trigger succession.","SYI-2.C","BI-8.5.D",0]]}]},{"n":9,"title":"Anatomy and Physiology","scope":"extension","topics":[{"n":1,"title":"Nervous and sensory systems","los":[["BI-9.1.A",1284,"Explain how a neuron generates and propagates an action potential.","Threshold opens voltage-gated Na⁺ channels (depolarise), then K⁺ channels (repolarise); myelin gives saltatory conduction.","DAT Bio · systems · nervous","BI-2.9.A",0],["BI-9.1.B",1285,"Explain synaptic transmission and match nervous-system divisions and sensory receptors to their roles.","Ca²⁺ entry triggers neurotransmitter release; sympathetic = fight-or-flight, parasympathetic = rest-and-digest; rods dim light, cones colour.","DAT Bio · systems · nervous/sensory","BI-9.1.A BI-4.1.B",0]]},{"n":2,"title":"Endocrine system","los":[["BI-9.2.A",1286,"Distinguish peptide from steroid hormone action.","Peptides bind surface receptors and use second messengers; steroids enter the cell and act as transcription factors.","DAT Bio · systems · endocrine","BI-4.2.B",0],["BI-9.2.B",1287,"Match major glands to their hormones and targets and predict hypothalamic–pituitary feedback.","Hypothalamus → anterior pituitary tropic hormones → target gland; the target hormone inhibits both upstream.","DAT Bio · systems · endocrine","BI-9.2.A BI-4.5.B",0]]},{"n":3,"title":"Muscular, skeletal and integumentary systems","los":[["BI-9.3.A",1288,"Explain the sliding-filament cycle and its dependence on Ca²⁺ and ATP.","Ca²⁺ binds troponin, tropomyosin uncovers actin; ATP binding releases myosin, hydrolysis re-cocks it.","DAT Bio · systems · muscular","BI-9.1.B",0],["BI-9.3.B",1289,"Predict bone and blood-Ca²⁺ responses to PTH and calcitonin, and name the skin's layers and roles.","Osteoclasts resorb, osteoblasts build; PTH raises blood Ca²⁺, calcitonin lowers it; epidermis protects, dermis holds vessels and glands.","DAT Bio · systems · skeletal/integumentary","BI-9.2.B",0]]},{"n":4,"title":"Circulatory and respiratory systems","los":[["BI-9.4.A",1290,"Trace blood through the heart and body and relate vessel structure to pressure.","RA → RV → lungs → LA → LV → aorta; arteries thick and high-pressure, veins valved, capillaries one cell thick.","DAT Bio · systems · circulatory","",0],["BI-9.4.B",1291,"Predict how CO₂, pH and temperature shift the oxygen–hemoglobin dissociation curve.","↑CO₂, ↑H⁺, ↑temperature shift right (lower affinity, more unloading — Bohr effect).","DAT Bio · systems · circulatory","BI-9.4.A BI-1.5.A",0],["BI-9.4.C",1292,"Explain ventilation, alveolar gas exchange and how blood CO₂ sets breathing rate.","Diaphragm contracts → chest volume up, pressure down → air in; medulla responds to falling blood pH.","DAT Bio · systems · respiratory","BI-9.4.B BI-2.3.C",0]]},{"n":5,"title":"Immune and lymphatic systems","los":[["BI-9.5.A",1293,"Distinguish innate from adaptive immunity.","Innate: barriers, phagocytes, inflammation, fast and nonspecific; adaptive: lymphocytes, specific, with memory.","DAT Bio · systems · immunological/lymphatic","",0],["BI-9.5.B",1294,"Explain humoral and cell-mediated responses, MHC presentation and immunological memory.","B cells → plasma cells → antibodies; CD8⁺ T cells kill MHC-I-presenting infected cells; CD4⁺ helpers see MHC II; memory cells speed the second response.","DAT Bio · systems · immunological/lymphatic","BI-9.5.A BI-4.1.A",0]]},{"n":6,"title":"Digestive and urinary systems","los":[["BI-9.6.A",1295,"Trace each macromolecule class through digestion: enzyme, site and absorbed product.","Amylase (mouth, duodenum) → sugars; pepsin, trypsin → amino acids; bile + lipase → fatty acids and monoglycerides.","DAT Bio · systems · digestive","BI-1.4.A BI-3.1.A",0],["BI-9.6.B",1296,"Trace filtrate through the nephron and predict how ADH and aldosterone change urine.","Glomerulus filters, PCT reabsorbs most solute, loop builds the medullary gradient; ADH adds aquaporins, aldosterone boosts Na⁺ reabsorption.","DAT Bio · systems · urinary","BI-2.8.C BI-9.2.B",0]]},{"n":7,"title":"Reproductive system","los":[["BI-9.7.A",1297,"Sequence the ovarian and menstrual cycle hormone changes and their feedback.","FSH grows follicles → estrogen peak flips to positive feedback → LH surge → ovulation → corpus luteum progesterone.","DAT Bio · systems · reproductive","BI-9.2.B BI-4.5.C",0],["BI-9.7.B",1298,"Compare spermatogenesis with oogenesis by timing and products.","Spermatogenesis is continuous and makes four sperm; oogenesis pauses in prophase I and makes one egg plus polar bodies.","DAT Bio · systems · reproductive","BI-5.1.B",0]]}]},{"n":10,"title":"Developmental Biology and Microbiology","scope":"extension","topics":[{"n":1,"title":"Early development","los":[["BI-10.1.A",1299,"Order fertilisation, cleavage, blastulation, gastrulation and neurulation and describe each.","Acrosomal reaction and cortical reaction block polyspermy; cleavage divides without growth; gastrulation forms germ layers.","DAT Bio · genetics · developmental mechanisms","BI-9.7.B",0],["BI-10.1.B",1300,"Assign tissues and organs to ectoderm, mesoderm or endoderm.","Ectoderm: nervous system, epidermis; mesoderm: muscle, bone, blood, kidney; endoderm: gut and lung lining, liver.","DAT Bio · genetics · developmental mechanisms","BI-10.1.A",0]]},{"n":2,"title":"Developmental mechanisms","los":[["BI-10.2.A",1301,"Explain induction, determination, differentiation, homeotic genes and programmed cell death in shaping an embryo.","Signals from one tissue induce another; Hox genes specify segment identity; apoptosis sculpts digits.","DAT Bio · genetics · developmental mechanisms","BI-6.6.B BI-10.1.A",0]]},{"n":3,"title":"Viruses","los":[["BI-10.3.A",1302,"Describe virus structure and compare lytic, lysogenic and retroviral life cycles.","Capsid around DNA or RNA, no metabolism of its own; lysogenic phage integrates as a prophage; retroviruses use reverse transcriptase.","DAT Bio · diversity · viruses","BI-6.3.A BI-6.7.C",0]]},{"n":4,"title":"Prokaryotes","los":[["BI-10.4.A",1303,"Classify a bacterium by shape, Gram stain and O₂ requirement, and distinguish Archaea from Bacteria.","Gram+ thick peptidoglycan; Gram− thin wall plus LPS outer membrane; Archaea have ether-linked lipids and no peptidoglycan.","DAT Bio · diversity · archaebacteria/eubacteria","BI-2.11.A BI-2.5.B",0],["BI-10.4.B",1304,"Calculate bacterial population size after a number of generations of binary fission.","N = N₀ × 2ⁿ, n = elapsed time ÷ generation time.","DAT Bio · diversity · eubacteria","BI-10.4.A",0]]},{"n":5,"title":"Eukaryotic diversity","los":[["BI-10.5.A",1305,"Distinguish fungi, protists, plants and animals by wall, nutrition and life cycle.","Fungi: chitin walls, absorptive heterotrophs, haploid-dominant; Protista is a paraphyletic catch-all.","DAT Bio · diversity · fungi/protista","BI-2.11.B",0],["BI-10.5.B",1306,"Describe alternation of generations and order plant groups by key innovation.","Mosses (gametophyte-dominant) → ferns (vascular) → gymnosperms (seeds) → angiosperms (flowers, fruit, double fertilisation).","DAT Bio · diversity · plantae","BI-10.5.A BI-5.1.B",0],["BI-10.5.C",1307,"Classify an animal by symmetry, germ layers, body cavity and protostome or deuterostome development.","Deuterostomes (echinoderms, chordates): blastopore becomes anus; chordates have notochord, dorsal nerve cord, pharyngeal slits, post-anal tail.","DAT Bio · diversity · animalia","BI-10.1.B BI-7.9.B",0]]}]}]},{"id":"programming","title":"Programming Foundations","code":"PR","track":"computing","requires":["math-hs"],"units":[{"n":1,"title":"Using objects and methods","scope":"core","topics":[{"n":1,"title":"Algorithms, programs and errors","los":[["PR-1.1.A",1308,"Write an everyday procedure as ordered, unambiguous steps and trace it on an input.","An algorithm is a finite sequence of precise steps; sequence, selection and iteration are enough to express any algorithm.","CSA-1.1.A, AAP-2.A","",0],["PR-1.1.B",1309,"Put the steps of writing, compiling and running a Java program in order and say which step catches which problem.","javac turns .java source into .class bytecode; the JVM runs the bytecode; the compiler checks syntax and types before anything runs.","CSA-1.1.B","",0],["PR-1.1.C",1310,"Classify an error as syntax (compile-time), run-time (exception) or logic, given the code and its symptom.","Syntax errors stop compilation; run-time errors throw during execution (int division by 0 throws ArithmeticException); logic errors run and give a wrong answer.","CSA-1.1.C, CRD-2.I","PR-1.1.B",0],["PR-1.1.D",1311,"Choose test inputs, including boundary cases, and state the output each should produce.","Test typical, boundary (0, 1, empty, the limits) and invalid inputs; a test is useful only with a predicted answer.","CRD-2.J","PR-1.1.A",0]]},{"n":2,"title":"Bits and binary numbers","los":[["PR-1.2.A",1312,"Convert a non-negative integer between decimal and binary.","Place values are powers of 2: 1011₂ = 8 + 2 + 1 = 11.","DAT-1.C","",0],["PR-1.2.B",1313,"Count the distinct values n bits can represent, and the bits needed for N values.","n bits give 2ⁿ patterns; N values need ⌈log₂ N⌉ bits.","DAT-1.A","PR-1.2.A",0]]},{"n":3,"title":"Variables, types, expressions and output","los":[["PR-1.3.A",1314,"Choose a primitive type (int, double, boolean) or a reference type (String, an object) for a described quantity.","A primitive variable holds the value itself; a reference variable holds the address of an object.","CSA-1.2.A","",0],["PR-1.3.B",1315,"Declare and initialise variables of type int, double and boolean.","type name = value; a variable is declared before use and keeps one type for its lifetime.","CSA-1.2.B, AAP-1.A","PR-1.3.A",0],["PR-1.3.C",1316,"Evaluate an arithmetic expression with int and double operands, including integer division and %.","int / int truncates toward zero (7 / 2 = 3, −7 / 2 = −3); % keeps the sign of the dividend (−7 % 2 = −1); one double operand makes the result double; * / % bind tighter than + −.","CSA-1.3.C, AAP-2.C","PR-1.3.B",0],["PR-1.3.D",1317,"Predict exactly what print and println statements display, including string concatenation with numbers.","+ runs left to right: \"1\" + 2 + 3 is \"123\" but 1 + 2 + \"3\" is \"33\"; println ends the line, print does not.","CSA-1.3.A, CSA-1.3.B","PR-1.3.C",0]]},{"n":4,"title":"Assignment and compound assignment","los":[["PR-1.4.A",1318,"Trace a sequence of assignment statements and give each variable's final value.","= evaluates the right side first, then overwrites the variable on the left; the old value is gone, so a swap needs a temporary.","CSA-1.4.A, AAP-1.B","PR-1.3.C",0],["PR-1.4.B",1319,"Predict the value stored after compound assignment and ++ / −− operators.","x += 3 means x = x + 3; x++ adds 1; for int x, x /= 2 truncates.","CSA-1.6.A","PR-1.4.A",0]]},{"n":5,"title":"Casting, range and precision","los":[["PR-1.5.A",1320,"Predict the result of casting between int and double, including rounding a positive double to the nearest int.","(int) truncates toward zero; (int)(x + 0.5) rounds a non-negative x; the cast binds tighter than arithmetic: (double) 7 / 2 = 3.5 but (double)(7 / 2) = 3.0.","CSA-1.5.A","PR-1.3.C",0],["PR-1.5.B",1321,"Predict when int arithmetic overflows and the value that results.","int is 32-bit two's complement, −2³¹ to 2³¹ − 1 (Integer.MIN_VALUE to Integer.MAX_VALUE); MAX_VALUE + 1 wraps to MIN_VALUE.","CSA-1.5.B, DAT-1.B","PR-1.2.B PR-1.3.C",0],["PR-1.5.C",1322,"Explain why a double calculation is approximate, and compare doubles with a tolerance instead of ==.","A double stores a binary fraction in 64 bits, so 0.1 is inexact and 0.1 + 0.2 == 0.3 is false; test Math.abs(a − b) \u003c tol.","CSA-1.5.C, DAT-1.B","PR-1.2.A PR-1.3.C",0]]},{"n":6,"title":"APIs, method signatures and the Math class","los":[["PR-1.6.A",1323,"Read API documentation to find what a class provides and which method to call.","Documentation gives each method's signature (name, parameter types in order) and return type; a caller needs nothing more.","CSA-1.7.A, CSA-1.9.A, AAP-3.D","",0],["PR-1.6.B",1324,"Write a call to a void or non-void method with arguments that match its signature, and pick which overload runs.","Arguments match parameters by number, order and type; overloads share a name but differ in parameter list; a non-void result must be stored or used or it is lost.","CSA-1.9.B, AAP-3.A","PR-1.6.A PR-1.3.B",0],["PR-1.6.C",1325,"Call a static (class) method as ClassName.method(...) and trings are immutable: concatenation and every String method build a new String, leaving the original unchanged.","CSA-1.15.A, AAP-2.D","PR-1.3.D PR-1.7.B",0],["PR-1.8.B",1333,"Evaluate length, substring, indexOf, equals and compareTo calls on strings.","Indices run 0 to length() − 1; substring(a, b) is characters a to b − 1 (length b − a); indexOf returns −1 when absent; compareTo is negative, zero or positive in dictionary order.","CSA-1.15.B, AAP-2.D","PR-1.8.A",0],["PR-1.8.C",1334,"Distinguish == from equals when comparing strings and other objects.","== asks whether two references point to the same object; equals compares contents.","CSA-1.15.B","PR-1.8.B PR-1.7.D",0]]}]},{"n":2,"title":"Selection and iteration","scope":"core","topics":[{"n":1,"title":"Boolean expressions and if statements","los":[["PR-2.1.A",1335,"Evaluate relational expressions (==, !=, \u003c, \u003c=, >, >=) to true or false.","Relational operators compare two values and produce a boolean; they bind looser than arithmetic, so a + 1 \u003c b compares the sum.","CSA-2.2, AAP-2.E","PR-1.3.C",0],["PR-2.1.B",1336,"Trace if, if–else and else-if chains and say which branch runs and what is printed.","Exactly one branch of an if / else if / else chain runs — the first whose condition is true; a lone if may run zero times.","CSA-2.3, AAP-2.H","PR-2.1.A",0],["PR-2.1.C",1337,"Trace nested if statements, matching each else to its if.","Without braces an else attaches to the nearest unmatched if, whatever the indentation suggests.","CSA-2.4, AAP-2.I","PR-2.1.B",0],["PR-2.1.D",1338,"Write a selection algorithm from a stated rule, such as grade bands or the leap-year rule.","Order else-if conditions so no earlier condition shadows a later one; leap year: divisible by 4 and (not by 100, or by 400).","CSA-2.1, AAP-2.G","PR-2.1.C",0]]},{"n":2,"title":"Compound boolean expressions","los":[["PR-2.2.A",1339,"Evaluate expressions with &&, || and !, including short-circuit evaluation.","! binds tightest, then &&, then ||; && skips its right side when the left is false, || when the left is true — so x != 0 && y / x > 1 never divides by zero.","CSA-2.5, AAP-2.F","PR-2.1.A",0],["PR-2.2.B",1340,"Rewrite a negated compound condition with De Morgan's laws.","!(a && b) ≡ !a || !b; !(a || b) ≡ !a && !b; !(x \u003c y) ≡ x >= y.","CSA-2.6","PR-2.2.A",0],["PR-2.2.C",1341,"Decide whether two boolean expressions are equivalent with a truth table or one counterexample.","n boolean inputs give 2ⁿ rows; one row where they differ proves they are not equivalent.","CSA-2.6, AAP-2.L","PR-2.2.B",0]]},{"n":3,"title":"while loops","los":[["PR-2.3.A",1342,"Trace a while loop and give the number of iterations and the final value of each variable.","The condition is checked before every pass, so the body may run zero times; something in the body must move the condition toward false.","CSA-2.7, AAP-2.K","PR-2.1.B PR-1.4.B",0],["PR-2.3.B",1343,"Identify a loop that never runs or never stops, and fix its initialisation, condition or update.","Check three things: the start value, the stopping condition, and that the update moves toward it.","CSA-2.7","PR-2.3.A",0],["PR-2.3.C",1344,"Write a condition-controlled loop for an unknown number of repetitions, such as peeling the digits off an int or halving until below a threshold.","n % 10 is the last digit and n / 10 drops it; the loop ends when n reaches 0.","CSA-2.7, AAP-2.J","PR-2.3.A",0]]},{"n":4,"title":"for loops","los":[["PR-2.4.A",1345,"Count the iterations of a for loop from its header, for any start, bound and step.","for (int i = a; i \u003c b; i++) runs b − a times; with i \u003c= b, b − a + 1 times; with i += k, ⌈(b − a)/k⌉ times (zero if a ≥ b).","CSA-2.8, AAP-2.K","PR-2.3.A",0],["PR-2.4.B",1346,"Trace a for loop and give its output or the final value of an accumulator.","Order of one pass: test the condition, run the body, then the update; the loop variable is out of scope after the loop.","CSA-2.8","PR-2.4.A",0],["PR-2.4.C",1347,"Find and fix an off-by-one error in a loop's start value or bound.","Check the first and last pass by hand: indices 0 to n − 1 need i = 0 and i \u003c n.","CSA-2.8","PR-2.4.B",0]]},{"n":5,"title":"Standard loop algorithms","los":[["PR-2.5.A",1348,"Implement and trace the accumulator patterns: sum, average, product and count of matches.","Initialise before the loop (0 for sums and counts, 1 for products), update inside it, use the result after it; divide by a count as a double.","CSA-2.9, AAP-2.M","PR-2.4.B",0],["PR-2.5.B",1349,"Implement and trace a running minimum or maximum.","Initialise to the first value, not 0, so all-negative data still works.","CSA-2.9","PR-2.5.A",0],["PR-2.5.C",1350,"Implement digit and divisibility algorithms: digit sum, factor list, primality test, gcd.","Trial division up to √n settles primality; Euclid: gcd(a, b) = gcd(b, a % b) until b = 0.","CSA-2.9, AAP-2.M","PR-2.3.C PR-2.5.A",0]]},{"n":6,"title":"String algorithms","los":[["PR-2.6.A",1351,"Traverse a string with substring or charAt to count or locate characters or substrings.","s.substring(i, i + 1) for i from 0 to s.length() − 1; a window of length k needs i \u003c= s.length() − k.","CSA-2.10","PR-1.8.B PR-2.4.C",0],["PR-2.6.B",1352,"Build a new string in a loop: reverse it, remove a character, or test for a palindrome.","Start from an empty string and concatenate; reversing prepends each character, or appends while counting down from the end.","CSA-2.10","PR-2.6.A",0]]},{"n":7,"title":"Nested iteration","los":[["PR-2.7.A",1353,"Count how many times an inner-loop statement runs in nested loops, including triangular bounds.","Independent bounds multiply (n·m); an inner j from i + 1 to n − 1 over i = 0 … n − 1 gives n(n − 1)/2.","CSA-2.11","PR-2.4.A",0],["PR-2.7.B",1354,"Trace nested loops that print a pattern and give the exact output.","The inner loop runs to completion for each pass of the outer loop; println placement decides the line breaks.","CSA-2.11","PR-2.7.A PR-2.4.B",0]]},{"n":8,"title":"Informal run-time analysis","los":[["PR-2.8.A",1355,"Compare algorithms by counting statement executions as a function of input size n.","One loop over n ~ n; nested ~ n²; halving each pass ~ log₂ n; polynomial counts run in reasonable time, exponential ones do not.","CSA-2.12, AAP-4.A","PR-2.7.A",0]]}]},{"n":3,"title":"Class creation","scope":"core","topics":[{"n":1,"title":"Abstraction, design and anatomy of a class","los":[["PR-3.1.A",1356,"Decompose a described task into classes and methods, naming each class's attributes and behaviours.","Abstraction hides how something works behind what it does; nouns in the description suggest classes and fields, verbs suggest methods.","CSA-3.1, AAP-3.B","PR-1.6.A PR-1.7.A",0],["PR-3.1.B",1357,"Write a class with private instance variables and public methods, and say what code outside the class can use.","Encapsulation: fields private, interface public; outside code reaches state only through public methods.","CSA-3.3","PR-3.1.A",0]]},{"n":2,"title":"Constructors","los":[["PR-3.2.A",1358,"Write a constructor that sets every instance variable from its parameters.","A constructor has the class name and no return type; it runs once, when new creates the object.","CSA-3.4","PR-3.1.B PR-1.7.B",0],["PR-3.2.B",1359,"Predict the default values of instance variables a constructor leaves unset.","Unset fields are 0 (int), 0.0 (double), false (boolean) and null (references); a class with no constructor written gets a no-argument default.","CSA-3.4","PR-3.2.A",0]]},{"n":3,"title":"Writing methods and passing references","los":[["PR-3.3.A",1360,"Write accessor and mutator methods with the correct return types.","An accessor returns a value without changing state; a mutator, usually void, changes it; a non-void method must return on every path.","CSA-3.5, AAP-3.C","PR-3.2.A",0],["PR-3.3.B",1361,"Predict whether a method call changes the caller's variable, for primitive and for reference arguments.","Java passes copies of values: reassigning a parameter never affects the caller, but changing the object a reference parameter points to does.","CSA-3.6","PR-3.3.A PR-1.7.D",0],["PR-3.3.C",1362,"Trace a sequence of calls on objects of a user-written class and give every object's final state.","Each object has its own copy of the instance variables; track them in a table, one column per object.","CSA-3.5, CRD-2.B","PR-3.3.B",0]]},{"n":4,"title":"Class members, scope and this","los":[["PR-3.4.A",1363,"Predict the value of a static variable shared by all instances, such as an instance counter.","A static variable has one copy per class, shared by every object; static methods cannot use instance variables or this.","CSA-3.7","PR-3.2.A",0],["PR-3.4.B",1364,"Decide which variable a name refers to when a parameter or local shadows a field, and resolve it with this.","A local exists only inside its block; the innermost declaration wins; this.x always names the field.","CSA-3.8, CSA-3.9","PR-3.3.A",0],["PR-3.4.C",1365,"Identify who a program's design affects and the legal or ethical constraints on it, such as licences on reused code and privacy of stored data.","Code taken from elsewhere must be credited and used under its licence; a design decides what data is kept, and for how long.","CSA-3.2, IOC-1.F","PR-3.1.A",0]]}]},{"n":4,"title":"Data collections","scope":"core","topics":[{"n":1,"title":"Data sets and their ethics","los":[["PR-4.1.A",1366,"Identify what a data set and its metadata can tell you, and what cleaning it needs (missing, invalid or inconsistent entries).","Metadata (units, source, date) describes the data; correlation in data does not show causation; invalid entries must be removed or fixed before analysis.","CSA-4.2, DAT-2.A, DAT-2.B, DAT-2.C","",0],["PR-4.1.B",1367,"Identify privacy, bias and consent risks in collecting a data set, including personally identifiable information.","Data that under-represents a group biases every result built on it; combined fields (ZIP + birth date + sex) can identify a person.","CSA-4.1, IOC-1.D, IOC-2.A","PR-4.1.A",0]]},{"n":2,"title":"Arrays","los":[["PR-4.2.A",1368,"Create an array, give its length and default element values, and access an element by index.","new int[n] has indices 0 to n − 1, filled with 0 (0.0, false, null for other types); arr.length is a field, no parentheses; an initialiser list {…} fixes the length.","CSA-4.3, AAP-1.C","PR-1.7.B PR-3.2.B",0],["PR-4.2.B",1369,"Predict an ArrayIndexOutOfBoundsException from an index expression.","Valid indices satisfy 0 ≤ i \u003c arr.length; arr[arr.length] is always out of bounds.","CSA-4.3","PR-4.2.A",0]]},{"n":3,"title":"Array traversals","los":[["PR-4.3.A",1370,"Traverse an array with an indexed for loop and with an enhanced for loop, and say which one can change the array.","for (int x : arr) hands out copies of the elements, so assigning x leaves arr unchanged; modifying needs an index.","CSA-4.4, AAP-2.O","PR-4.2.A PR-2.4.B",0],["PR-4.3.B",1371,"Trace a traversal that steps by 2, skips elements or runs backwards, and list the indices it visits.","Backwards: for (int i = arr.length − 1; i >= 0; i−−); the first and last index visited settle off-by-one questions.","CSA-4.4","PR-4.3.A PR-2.4.C",0]]},{"n":4,"title":"Array algorithms","los":[["PR-4.4.A",1372,"Implement sum, mean, minimum, maximum and count-matching over an array.","The Unit 2 accumulator patterns, with arr[i] as the value at each pass.","CSA-4.5, AAP-2.N","PR-4.3.A PR-2.5.B",0],["PR-4.4.B",1373,"Implement algorithms over adjacent pairs: detect a repeat, check that the array is sorted, count increases.","Comparing arr[i] with arr[i + 1] needs i \u003c arr.length − 1.","CSA-4.5","PR-4.4.A",0],["PR-4.4.C",1374,"Reverse, shift or rotate an array in place and give its contents afterwards.","Reverse by swapping i with length − 1 − i for i \u003c length / 2; a rotation must save the element it is about to overwrite.","CSA-4.5","PR-4.4.B PR-1.4.A",0]]},{"n":5,"title":"Text files and wrapper classes","los":[["PR-4.5.A",1375,"Read a text file line by line with Scanner and File, splitting each line into fields.","while (sc.hasNextLine()) reads to the end; line.split(\",\") turns a CSV line into a String[]; opening a missing file throws FileNotFoundException, which must be declared or caught.","CSA-4.6, DAT-2.D","PR-1.3.B PR-2.3.A PR-4.2.A",0],["PR-4.5.B",1376,"Predict autoboxing and unboxing between int and Integer, and parse numbers from strings.","Integer.parseInt(\"42\") gives 42; an int is boxed to Integer automatically when stored in a collection; unboxing a null Integer throws NullPointerException.","CSA-4.7","PR-1.8.C",0]]},{"n":6,"title":"ArrayList","los":[["PR-4.6.A",1377,"Predict the contents and size of an ArrayList after add, add(i, x), set, remove and get.","add(i, x) shifts later elements right; remove(i) shifts them left and returns the removed element; size(), not length.","CSA-4.8, AAP-2.N","PR-4.5.B",0],["PR-4.6.B",1378,"Find and fix the skipped-element bug when removing from an ArrayList inside a forward indexed loop.","After remove(i) the next element slides into index i: don't increment that pass, or loop backwards; removing inside an enhanced for throws ConcurrentModificationException.","CSA-4.9","PR-4.6.A PR-4.3.A",0]]},{"n":7,"title":"2D arrays","los":[["PR-4.7.A",1379,"Create a 2D array and give its number of rows, number of columns and the element at [r][c].","int[][] g = new int[R][C]; g.length = R; g[0].length = C; g[r][c] is row r, column c (row-major).","CSA-4.11","PR-4.2.A",0],["PR-4.7.B",1380,"Trace row-major and column-major nested traversals and give the visiting order or output.","Row-major: outer loop over rows, inner over columns; swap the loops for column-major.","CSA-4.12","PR-4.7.A PR-2.7.B",0],["PR-4.7.C",1381,"Implement 2D algorithms: row sums, column sums, the main diagonal and in-bounds neighbours.","The main diagonal is g[i][i]; neighbour (r + dr, c + dc) exists only if 0 ≤ r + dr \u003c R and 0 ≤ c + dc \u003c C.","CSA-4.13","PR-4.7.B PR-4.4.A",0]]},{"n":8,"title":"Searching","los":[["PR-4.8.A",1382,"Trace a linear search and count its comparisons in the best and worst case.","Best case 1 comparison (first element), worst case n (last or absent).","CSA-4.14, AAP-2.O","PR-4.3.A",0],["PR-4.8.B",1383,"Trace an iterative binary search on a sorted array: list the midpoints examined and count the iterations.","mid = (low + high) / 2, then discard the half that cannot hold the target; needs sorted data; at most ⌊log₂ n⌋ + 1 iterations.","CSA-4.14, AAP-2.P","PR-4.8.A PR-2.8.A",0]]},{"n":9,"title":"Sorting","los":[["PR-4.9.A",1384,"Trace selection sort and give the array after k passes.","Pass k swaps the smallest remaining element into index k; always n(n − 1)/2 comparisons, whatever the input.","CSA-4.15","PR-4.4.C PR-2.7.A",0],["PR-4.9.B",1385,"Trace insertion sort, give the array after k passes, and count comparisons in the best and worst case.","Pass k inserts element k into the sorted prefix; already sorted: n − 1 comparisons; reverse sorted: n(n − 1)/2.","CSA-4.15","PR-4.9.A",0]]},{"n":10,"title":"Recursion, recursive search and merge sort","los":[["PR-4.10.A",1386,"Trace a recursive method and give its return value (factorial, digit sum, power).","Each call gets its own parameters; the base case stops the descent; results combine as the calls return, last called first finished.","CSA-4.16","PR-3.3.A PR-2.1.B",0],["PR-4.10.B",1387,"Count the calls a recursive method makes, including two-branch recursion such as naive Fibonacci.","One recursive call per level: n + 1 calls; naive fib(n) with base cases 0 and 1 makes 2·fib(n + 1) − 1 calls — exponential.","CSA-4.16","PR-4.10.A",0],["PR-4.10.C",1388,"Find and fix a missing or unreachable base case that causes a StackOverflowError.","Every recursive call must move the argument toward a base case that is actually tested.","CSA-4.16","PR-4.10.A",0],["PR-4.10.D",1389,"Trace recursive binary search and merge sort, giving the subarrays at each level of recursion.","Merge sort halves down to single elements, then merges sorted halves: about n log₂ n comparisons, recursion depth ⌈log₂ n⌉.","CSA-4.17","PR-4.10.B PR-4.8.B PR-4.9.B",0]]}]},{"n":5,"title":"The Unix shell","scope":"core","topics":[{"n":1,"title":"Navigating files and directories","los":[["PR-5.1.A",1390,"Resolve an absolute or relative path (with ., .. and ~) from a given working directory to the directory or file it names.","/ is the root; a path not starting with / is relative to pwd; .. is the parent, . the current directory, ~ your home.","SWC-SH-2","",0],["PR-5.1.B",1391,"Predict the output of a sequence of cd, pwd and ls (-a, -l, -F) commands.","cd with no argument returns home; ls -a shows hidden dot-files; -F marks directories with /.","SWC-SH-2","PR-5.1.A",0]]},{"n":2,"title":"Working with files and wildcards","los":[["PR-5.2.A",1392,"Predict the file tree after mkdir, touch, cp, mv and rm commands.","mv moves or renames and silently overwrites; cp copies; rm deletes for good (no trash); cp and rm need -r for directories.","SWC-SH-3","PR-5.1.B",0],["PR-5.2.B",1393,"Expand a wildcard pattern (*, ?) against a directory listing.","The shell expands *.pdb before the command runs; * matches any run of characters, ? exactly one.","SWC-SH-4","PR-5.2.A",0]]},{"n":3,"title":"Pipes and filters","los":[["PR-5.3.A",1394,"Predict the output of wc, sort (-n, -r), head, tail, cut and uniq on given text.","sort is alphabetical unless -n (so 10 sorts before 2); uniq removes only adjacent duplicates, so sort first; wc -l counts lines.","SWC-SH-4","PR-5.2.B",0],["PR-5.3.B",1395,"Build a pipeline with |, > and >> that answers a question about files, and predict its output.","> overwrites a file, >> appends; | sends one command's standard output to the next command's input.","SWC-SH-4","PR-5.3.A",0]]},{"n":4,"title":"Loops and shell scripts","los":[["PR-5.4.A",1396,"Trace a shell for loop over files and list the commands it runs, including variable expansion and quoting.","for f in *.dat; do ...; done expands $f once per file; write \"$f\" so a name with spaces stays one argument.","SWC-SH-5","PR-5.3.B PR-2.4.B",0],["PR-5.4.B",1397,"Write a script that uses $1, $@ and $#, and predict what it does for given arguments.","$1 is the first argument, $@ all of them, $# how many; run it with bash script.sh args.","SWC-SH-6","PR-5.4.A",0],["PR-5.4.C",1398,"Make a script executable and run it, and diagnose 'command not found' and 'permission denied'.","chmod +x script.sh, then ./script.sh — the current directory is not on PATH, so a bare script.sh is not found.","SWC-SH-6","PR-5.4.B",0]]},{"n":5,"title":"Finding things","los":[["PR-5.5.A",1399,"Predict which lines grep matches with -i, -v, -w, -n, -c and -r.","-i ignores case, -v inverts, -w matches whole words, -n numbers lines, -c counts, -r searches directories.","SWC-SH-7","PR-5.3.A",0],["PR-5.5.B",1400,"Predict which files find selects with -name, -type and -maxdepth, and feed its result to another command with $(...).","Quote the pattern (find . -name '*.txt') so the shell does not expand it first; $(command) is replaced by that command's output.","SWC-SH-7","PR-5.5.A PR-5.2.B",0]]}]},{"n":6,"title":"Version control with Git","scope":"core","topics":[{"n":1,"title":"Tracking changes","los":[["PR-6.1.A",1401,"Explain what a commit records and why it beats keeping copies like thesis_final_v2.","A commit is a snapshot of the staged files with author, time, message and a link to its parent; history is the chain of commits.","SWC-GIT-1","",0],["PR-6.1.B",1402,"Predict git status (untracked, modified, staged) after edits, git add and git commit.","Working tree → git add → staging area → git commit → repository; only staged changes go into a commit.","SWC-GIT-3, SWC-GIT-4","PR-6.1.A PR-5.2.A",0]]},{"n":2,"title":"Exploring and undoing history","los":[["PR-6.2.A",1403,"Read git log and git diff output, and name a commit with HEAD, HEAD~n or a hash prefix.","HEAD is the current commit, HEAD~1 its parent; git diff shows unstaged changes, git diff --staged staged ones; + lines added, − lines removed.","SWC-GIT-5","PR-6.1.B",0],["PR-6.2.B",1404,"Choose the command that undoes a change: discard a file's edits, unstage it, or revert a commit.","git restore file discards working-tree edits; git restore --staged file unstages; git revert makes a new commit that undoes an old one without rewriting history.","SWC-GIT-5","PR-6.2.A",0]]},{"n":3,"title":"Ignoring files and what not to commit","los":[["PR-6.3.A",1405,"Predict which files a .gitignore excludes, including directory patterns and ! negation.","*.dat ignores every .dat file; results/ ignores a directory; !keep.dat re-includes one; files already tracked are not affected.","SWC-GIT-6","PR-6.1.B PR-5.2.B",0],["PR-6.3.B",1406,"Decide what stays out of a repository (secrets, large raw data, generated output) and add a licence and citation file to shared code.","A secret pushed once stays in history; with no licence, others may not legally reuse the code; CITATION.cff tells people how to cite it.","SWC-GIT-8, SWC-GIT-9, SWC-GIT-10","PR-6.3.A",0]]},{"n":4,"title":"Remotes and collaboration","los":[["PR-6.4.A",1407,"Predict the state of the local and remote repositories after clone, push and pull.","clone copies the whole history and names the source origin; push sends local commits; pull is fetch + merge; a push is rejected if the remote has commits you lack.","SWC-GIT-7, SWC-GIT-12","PR-6.2.A",0]]},{"n":5,"title":"Branches and conflicts","los":[["PR-6.5.A",1408,"Create and switch branches, and predict which commits each branch contains after new commits and a merge.","A branch is a movable pointer to a commit; git switch -c name creates one; a fast-forward merge only moves the pointer, otherwise merge makes a two-parent commit.","SWC-GIT-13","PR-6.4.A",0],["PR-6.5.B",1409,"Read conflict markers and resolve a merge conflict to a stated intended result.","\u003c\u003c\u003c\u003c\u003c\u003c\u003c HEAD marks your side, ======= separates, >>>>>>> branch ends theirs; edit to the final text, delete the markers, then add and commit.","SWC-GIT-15","PR-6.5.A",0]]}]},{"n":7,"title":"Python","scope":"core","topics":[{"n":1,"title":"From Java to Python","los":[["PR-7.1.A",1410,"Translate a short Java method into Python: indentation for blocks, no type declarations, print().","A colon plus indentation marks a block; names are bound by assignment and carry no declared type; # starts a comment.","PY-1","PR-2.4.B PR-3.3.A",0],["PR-7.1.B",1411,"Evaluate Python arithmetic with /, //, %, ** and mixed int/float, and say where it differs from Java.","7 / 2 = 3.5 always; 7 // 2 = 3 but −7 // 2 = −4 (floor, where Java truncates to −3); −7 % 2 = 1; ints never overflow; 2 ** 10 = 1024.","PY-1","PR-7.1.A PR-1.3.C",0],["PR-7.1.C",1412,"Predict the truthiness of values and the result of and, or, not and chained comparisons.","0, 0.0, '', [], {} and None are falsy; and / or return one of their operands, not just True or False; 1 \u003c x \u003c 5 chains.","PY-1","PR-7.1.A PR-2.2.A",0]]},{"n":2,"title":"Loops and range","los":[["PR-7.2.A",1413,"List the values range(start, stop, step) produces and count them, including negative steps.","range stops before stop: range(2, 10, 3) → 2, 5, 8; len(range(a, b)) = b − a; range(5, 0, −1) → 5, 4, 3, 2, 1.","PY-2","PR-2.4.A PR-7.1.A",0],["PR-7.2.B",1414,"Trace for loops over lists, strings, enumerate and zip, and while loops with break and continue.","for x in seq yields elements, not indices; enumerate yields (i, x); zip stops at the shorter sequence; break leaves the loop, continue skips to the next pass.","PY-2","PR-7.2.A",0]]},{"n":3,"title":"Lists, slicing and comprehensions","los":[["PR-7.3.A",1415,"Evaluate indexing and slicing with negative indices and steps on lists and strings.","s[−1] is the last element; s[a:b] runs a to b − 1; s[::−1] reverses; a slice out of range is empty, never an IndexError.","PY-3","PR-7.2.A PR-4.2.A",0],["PR-7.3.B",1416,"Predict a list after append, extend, insert, pop and remove, and tell sort() from sorted().","List methods change the list in place and return None (so a = a.sort() loses it); sorted() returns a new list.","PY-3","PR-7.3.A",0],["PR-7.3.C",1417,"Predict the effect of aliasing versus copying lists, including lists of lists.","b = a aliases; a[:] or list(a) is a shallow copy; [[0] * 3] * 2 repeats one inner list, so changing one row changes both.","PY-3","PR-7.3.B PR-1.7.D",0],["PR-7.3.D",1418,"Write and evaluate a list comprehension with a condition.","[f(x) for x in seq if test(x)] filters, then maps, in one expression.","PY-3","PR-7.3.B PR-7.2.B",0]]},{"n":4,"title":"Dictionaries and strings","los":[["PR-7.4.A",1419,"Predict a dictionary after insertions, updates and deletions, and count items with one.","Keys are unique; d[k] raises KeyError when k is missing, d.get(k, 0) does not; d[k] = d.get(k, 0) + 1 counts occurrences.","PY-4","PR-7.3.B",0],["PR-7.4.B",1420,"Evaluate string methods (split, strip, join, replace) and f-string formatting with a set precision.","f'{x:.3f}' prints 3 decimals, f'{x:.2e}' scientific notation; split() with no argument splits on any run of whitespace.","PY-4","PR-7.3.A",0]]},{"n":5,"title":"Functions, modules and errors","los":[["PR-7.5.A",1421,"Trace a function with default and keyword arguments and give its return value, including an implicit None.","A function that reaches its end without return gives None; a default value is evaluated once, when the function is defined.","PY-5","PR-7.1.A PR-3.3.A",0],["PR-7.5.B",1422,"Import names from a module and guard script code with if __name__ == '__main__'.","import numpy as np binds a module name; code under the guard runs when the file is executed, not when it is imported.","PY-5","PR-7.5.A",0],["PR-7.5.C",1423,"Read a traceback to find the failing line and the exception type, and handle an expected error with try / except.","Read a traceback bottom up: the last line names the exception, the frame just above it the line that raised it; catch only the exception you expect.","PY-5","PR-7.5.A PR-1.1.C",0]]},{"n":6,"title":"Reading and writing files","los":[["PR-7.6.A",1424,"Read a text file line by line in a with-block, skip a header, split fields and convert them to numbers.","with open(path) as f closes the file automatically; each line keeps its newline until strip(); float('1.5e-3') parses scientific notation.","PY-6","PR-7.4.B PR-7.5.C PR-4.5.A",0]]}]},{"n":8,"title":"Scientific computing with NumPy","scope":"core","topics":[{"n":1,"title":"NumPy arrays","los":[["PR-8.1.A",1425,"Create arrays with np.array, zeros, ones, arange and linspace, and give their shape, dtype and length.","np.arange(0, 1, 0.25) excludes the end (4 values); np.linspace(0, 1, 5) includes it (5 values, spacing 0.25); all-integer input gives an int dtype.","SCI-1","PR-7.3.A PR-7.5.B",0],["PR-8.1.B",1426,"Index and slice 1-D and 2-D arrays, including x[:, 0], x[1:, ::2] and boolean masks.","x[i, j] is row i, column j; x[:, j] is column j; a slice is a view (writing to it changes x), x[mask] is a copy.","SCI-1","PR-8.1.A PR-4.7.A",0],["PR-8.1.C",1427,"Reduce an array along an axis (sum, mean, max) and give the shape of the result.","For shape (R, C), axis=0 collapses the rows and leaves C values (one per column); axis=1 leaves R; no axis gives a single number.","SCI-1","PR-8.1.B",0]]},{"n":2,"title":"Vectorisation and broadcasting","los":[["PR-8.2.A",1428,"Replace an explicit loop with an element-wise array expression that gives the same result.","x**2 + 3*x acts element by element in compiled code — typically 10–100× faster than the same Python loop.","SCI-2","PR-8.1.C PR-4.4.A",0],["PR-8.2.B",1429,"Decide whether two shapes broadcast and give the result's shape.","Align shapes from the right; each pair of dimensions must be equal or 1: (3, 1) with (4,) gives (3, 4); (3,) with (4,) fails.","SCI-2","PR-8.2.A",0],["PR-8.2.C",1430,"Tell element-wise * from the matrix product @ and give the shape of each result.","(n, k) @ (k, m) → (n, m); * needs broadcastable shapes and multiplies matching entries.","SCI-2","PR-8.2.B",0],["PR-8.2.D",1431,"Compute all pairwise distances among N particles by broadcasting, giving each intermediate shape.","r[:, None, :] − r[None, :, :] has shape (N, N, 3); the norm over the last axis gives the (N, N) distance matrix, zero on the diagonal.","SCI-2","PR-8.2.B",0]]},{"n":3,"title":"Reading data files","los":[["PR-8.3.A",1432,"Load a numeric text file with np.loadtxt or np.genfromtxt using delimiter, skiprows and usecols, and give the shape of the result.","Lines starting with # are skipped by default; a CSV needs delimiter=','; unpack=True returns the columns as separate arrays.","SCI-3","PR-8.1.A PR-7.6.A",0],["PR-8.3.B",1433,"Compute summary statistics of a column (mean, std, min, argmax) and select the rows that meet a condition.","np.argmax returns the index, not the value; np.std divides by N unless ddof=1 (sample standard deviation).","SCI-3","PR-8.3.A PR-8.1.C",0],["PR-8.3.C",1434,"Save an array to a text or .npy file and reload it unchanged.","np.save / np.load keep dtype and full precision; np.savetxt writes text, set fmt and header for readable columns.","SCI-3","PR-8.3.A",0]]},{"n":4,"title":"Plotting","los":[["PR-8.4.A",1435,"Plot y against x with matplotlib, label the axes with units, add a legend and save the figure.","plt.plot(x, y, label='…'); plt.xlabel('t (ps)'); plt.legend(); call plt.savefig('fig.png', dpi=300) before plt.show().","SCI-4","PR-8.3.A",0],["PR-8.4.B",1436,"Choose linear, semilog or log-log axes from the expected relationship, and read an exponent or rate from the straight line.","y = a·e^(−kt) is straight on semilog-y with slope −k (natural log); y = a·xⁿ is straight on log-log with slope n.","SCI-4","PR-8.4.A",0]]},{"n":5,"title":"An MD-style integration loop","los":[["PR-8.5.A",1437,"Write a forward-Euler loop for dy/dt = f(y, t), compute the number of steps, and give y after a few steps.","y_(n+1) = y_n + Δt·f(y_n, t_n); steps = T/Δt; global error shrinks in proportion to Δt.","SCI-5","PR-8.1.A PR-2.5.A",0],["PR-8.5.B",1438,"Integrate a 1-D harmonic oscillator with velocity Verlet and trace the first steps.","v += (Δt/2)·a; x += Δt·v; a = F(x)/m; v += (Δt/2)·a — one force evaluation per step.","SCI-5","PR-8.5.A",0],["PR-8.5.C",1439,"Track total energy along a trajectory and diagnose a timestep that is too large.","Velocity Verlet keeps the energy bounded, oscillating about its start; Euler's energy grows steadily; Δt should be a small fraction (≲ 1/20) of the fastest period.","SCI-5","PR-8.5.B PR-8.4.A",0],["PR-8.5.D",1440,"Compute the Lennard-Jones energy and force for a pair of particles, then vectorise it over all pairs.","U = 4ε[(σ/r)¹² − (σ/r)⁶]; F(r) = (24ε/r)[2(σ/r)¹² − (σ/r)⁶]; minimum at r = 2^(1/6)σ with U = −ε.","SCI-5","PR-8.5.C PR-8.2.D",0]]},{"n":6,"title":"Reproducible numerical scripts","los":[["PR-8.6.A",1441,"Seed a random number generator so a run reproduces exactly, and draw initial velocities from a normal distribution.","rng = np.random.default_rng(seed); rng.normal(0, σ, size=(N, 3)); the same seed gives the same stream.","SCI-6","PR-8.1.A PR-1.6.D",0],["PR-8.6.B",1442,"Test a numerical function against a case with a known answer, using a tolerance.","np.isclose / np.allclose with rtol and atol; e.g. a harmonic oscillator must return to its start after one period 2π√(m/k).","SCI-6","PR-1.5.C PR-7.5.A PR-8.5.B",0],["PR-8.6.C",1443,"Organise an analysis as a script with functions and command-line arguments that writes its outputs to files, run from the shell and tracked in Git.","Inputs from sys.argv or argparse, results to files, no hand edits between steps — so one command reruns everything.","SCI-6","PR-7.5.B PR-5.4.B PR-8.3.C PR-6.1.B",0]]}]},{"n":9,"title":"Computing systems, networks and impact","scope":"extension","topics":[{"n":1,"title":"The internet and fault tolerance","los":[["PR-9.1.A",1444,"Describe how data crosses the internet in packets, and what IP, TCP, HTTP and DNS each do.","Data is split into packets that may take different routes and arrive out of order; IP addresses and routes, TCP reassembles and resends, DNS maps names to addresses, HTTP carries web requests.","CSN-1.A, CSN-1.B, CSN-1.C","",0]]},{"n":2,"title":"Parallel and distributed computing","los":[["PR-9.2.A",1445,"Compute the run time and speedup of a workload split across processors.","Parallel time = sequential part + the longest parallel branch; speedup = sequential time / parallel time, capped by the part that cannot be split.","CSN-2.A, CSN-2.B","",0]]},{"n":3,"title":"Compression","los":[["PR-9.3.A",1446,"Choose lossless or lossy compression for a kind of data, and run-length encode a short string.","Lossless restores every bit (text, code, trajectories); lossy discards detail people won't notice (photos, audio); AAAABB → 4A2B.","DAT-1.D","PR-1.2.B",0]]},{"n":4,"title":"Impact of computing","los":[["PR-9.4.A",1447,"Identify beneficial and harmful effects of a computing innovation, including the digital divide and bias built into its data.","One innovation can help some groups and harm others; unequal access and unrepresentative training data both shift who benefits.","IOC-1.A, IOC-1.B, IOC-1.C, IOC-1.D","PR-4.1.B",0]]}]}]},{"id":"computer-science","title":"Computer Science","code":"CS","track":"computing","requires":["programming"],"units":[{"n":1,"title":"Discrete and probabilistic foundations","scope":"core","topics":[{"n":1,"title":"Logic and proof","los":[["CS-1.1.A",1448,"Decide whether two propositional formulas are equivalent, by truth table or by algebraic laws.","Equivalent ⇔ same truth value on every assignment; p → q ≡ ¬p ∨ q; De Morgan swaps ∧ and ∨ under negation.","","",0],["CS-1.1.B",1449,"Prove a claim about a recursive definition or a loop by induction, naming base case, hypothesis and step.","Weak induction assumes P(k) to show P(k+1); strong induction assumes all P(j ≤ k); structural induction follows the recursive definition.","","",0]]},{"n":2,"title":"Counting, sums and recurrences","los":[["CS-1.2.A",1450,"Count arrangements or selections with the product rule, permutations, combinations and inclusion–exclusion, giving a number.","Order matters ⇒ P(n,k) = n!/(n−k)!; order ignored ⇒ C(n,k); |A ∪ B| = |A| + |B| − |A ∩ B|.","","",0],["CS-1.2.B",1451,"Evaluate a summation or simple linear recurrence in closed form (e.g. T(n) = T(n−1) + n).","Σ i = n(n+1)/2; Σ 2^i = 2^(n+1) − 1; geometric series with ratio \u003c 1 is bounded by its first term.","","",0]]},{"n":3,"title":"Relations and graphs","los":[["CS-1.3.A",1452,"Compute degrees, connectivity, and whether a small graph is bipartite, acyclic or a tree.","Σ deg = 2|E|; a tree on n vertices has n − 1 edges; bipartite ⇔ no odd cycle.","","",0]]},{"n":4,"title":"Probability and statistics for computing","los":[["CS-1.4.A",1453,"Compute an expected count (collisions, comparisons, hits) using linearity of expectation over indicator variables.","E[ΣX_i] = ΣE[X_i] even when the X_i are dependent; E[indicator] = P(event).","","",0],["CS-1.4.B",1454,"Apply Bayes' rule to a detector or classifier scenario and find the probability an alert is real.","P(A|B) = P(B|A)P(A)/P(B); a low base rate makes most positives false even for an accurate test.","","",0],["CS-1.4.C",1455,"Compute the mean, standard deviation and a confidence interval from repeated benchmark runs, and decide whether two configurations differ.","CI ≈ x̄ ± t·s/√n; overlapping intervals do not prove no difference; report variance, not one run.","","",0]]}]},{"n":2,"title":"Algorithm analysis","scope":"core","topics":[{"n":1,"title":"Asymptotic notation","los":[["CS-2.1.A",1456,"Rank a set of functions by growth rate (constant, log, polylog, polynomial, exponential, factorial).","log n ≪ n^ε ≪ n^k ≪ c^n ≪ n!; bases of logs differ by a constant factor.","","",0],["CS-2.1.B",1457,"Compute the Big-O of described or shown code — nested loops, dependent bounds, index doubling or halving — as an auto-checked answer.","Nested independent loops multiply; i *= 2 runs log n times; Σ_{i=1..n} i = Θ(n²); sequential blocks add, the largest wins.","","CS-1.2.B",0]]},{"n":2,"title":"Recurrences and divide-and-conquer cost","los":[["CS-2.2.A",1458,"Write the running-time recurrence of a recursive function from its code.","T(n) = a·T(n/b) + f(n): a recursive calls on size n/b plus non-recursive work f(n).","","",0],["CS-2.2.B",1459,"Solve a divide-and-conquer recurrence with the master theorem or a recursion tree, naming the case that applies.","Compare f(n) with n^(log_b a): smaller ⇒ Θ(n^(log_b a)); equal ⇒ ×log n; larger (regular) ⇒ Θ(f(n)).","","CS-2.2.A",0]]},{"n":3,"title":"Cases and amortization","los":[["CS-2.3.A",1460,"Identify the best-, worst- and average-case inputs of an algorithm and their costs (e.g. quicksort on sorted input).","Worst case is a guarantee over all inputs of size n; average case needs an input distribution.","","",0],["CS-2.3.B",1461,"Compute the amortized cost per operation of a sequence (dynamic-array doubling, binary counter) by the aggregate or accounting method.","Doubling capacity costs n total copies over n appends ⇒ O(1) amortized; growing by a constant is O(n) amortized.","","",0]]},{"n":4,"title":"Correctness arguments","los":[["CS-2.4.A",1462,"State a loop invariant for an iterative algorithm and use initialization, maintenance and termination to prove it correct.","An invariant holds before each iteration; at exit, invariant + negated loop condition ⇒ postcondition.","","CS-1.1.B",0],["CS-2.4.B",1463,"Find the boundary input on which a given binary-search or loop variant fails (off-by-one, infinite loop, overflow in mid).","Check empty, one-element and target-at-ends inputs; lo + (hi − lo)/2 avoids overflow; the interval must shrink every step.","","",0]]}]},{"n":3,"title":"Data structures","scope":"core","topics":[{"n":1,"title":"Sequences, stacks and

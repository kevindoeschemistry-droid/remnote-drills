he potential whose natural variables are the two held fixed: (∂S/∂V)_T = (∂P/∂T)_V from F.","","TD-4.2.B",2],["TD-5.1.B",1773,"Evaluate an entropy derivative from an equation of state through a Maxwell relation.","(∂S/∂V)_T = (∂P/∂T)_V; (∂S/∂P)_T = −(∂V/∂T)_P.","","",2]]},{"n":2,"title":"Measurable properties","los":[["TD-5.2.A",1774,"Express a thermodynamic derivative in terms of α, κ_T and c_p and evaluate it.","α = (1/V)(∂V/∂T)_P, κ_T = −(1/V)(∂V/∂P)_T; (∂P/∂T)_V = α/κ_T.","","",2],["TD-5.2.B",1775,"Estimate the pressure rise when a liquid is heated at constant volume.","ΔP ≈ (α/κ_T) ΔT — large for liquids (tens of bar per K).","","",2],["TD-5.2.C",1776,"Derive and evaluate c_p − c_v from α and κ_T.","c_p − c_v = Tvα²/κ_T; = R for an ideal gas.","","",0],["TD-5.2.D",1777,"Derive (∂U/∂V)_T or the Joule–Thomson coefficient for a real gas from its equation of state.","(∂U/∂V)_T = T(∂P/∂T)_V − P; μ_JT = (v/c_p)(Tα − 1).","","",0]]}]},{"n":6,"title":"Stability and metastability","scope":"core","topics":[{"n":1,"title":"Stability criteria","los":[["TD-6.1.A",1778,"Decide whether a fundamental equation is stable from the concavity of S(U, V).","∂²S/∂U² ≤ 0, ∂²S/∂V² ≤ 0, and the Hessian determinant ≥ 0.","","",2],["TD-6.1.B",1779,"Derive C_V from a fundamental equation and check that it is positive.","C_V = (∂U/∂T)_V = −(∂S/∂U)²/(∂²S/∂U²) > 0 for stability.","","",2],["TD-6.1.C",1780,"Test whether a homogeneous van der Waals state is mechanically stable.","Stable ⇔ (∂P/∂V)_T \u003c 0 ⇔ κ_T > 0.","","",2],["TD-6.1.D",1781,"Calculate κ_T of a fluid from its equation of state.","κ_T = −1/[V(∂P/∂V)_T]; for vdW (∂P/∂V)_T = −RT/(V − b)² + 2a/V³.","","",2]]},{"n":2,"title":"Spinodals and the critical point","los":[["TD-6.2.A",1782,"Find the critical constants of a cubic equation of state.","(∂P/∂V)_T = (∂²P/∂V²)_T = 0; vdW: T_c = 8a/27Rb, V_c = 3b, P_c = a/27b².","","",2],["TD-6.2.B",1783,"Locate the spinodal and classify a state as stable, metastable or unstable.","Spinodal: (∂P/∂V)_T = 0; between binodal and spinodal the state is metastable.","","",1]]},{"n":3,"title":"Common-tangent and equal-area constructions","los":[["TD-6.3.A",1784,"Find coexisting states by a common tangent on G or F, or Maxwell's equal-area rule on a vdW isotherm.","Equal μ and P in both phases ⇔ common tangent ⇔ ∫P dV over the loop = P_sat ΔV.","","",0]]}]},{"n":7,"title":"Gases and equations of state","scope":"core","topics":[{"n":1,"title":"Ideal gases and ideal-gas mixtures","los":[["TD-7.1.A",1785,"Write μ(T, P) for a pure ideal gas and for a component of an ideal-gas mixture and calculate Δμ.","μ = μ°(T) + RT ln(P/P°); in a mixture replace P by p_i = y_iP.","","",1]]},{"n":2,"title":"Nonideal gases","los":[["TD-7.2.A",1786,"Calculate Z and residual (departure) properties from a virial or cubic equation of state.","Z = PV/RT = 1 + B/V + …; h − h^ig = ∫[T(∂P/∂T)_V − P]dV + RT(Z − 1).","","",0],["TD-7.2.B",1787,"Calculate a fugacity coefficient from a virial or cubic equation of state.","ln φ = ∫₀^P (Z − 1) dP/P; truncated virial: ln φ = BP/RT.","","",0],["TD-7.2.C",1788,"Relate the second virial coefficient to the intermolecular pair potential.","B(T) = −2πN_A ∫(e^(−βu(r)) − 1) r² dr; B \u003c 0 when attraction dominates.","","",0],["TD-7.2.D",1789,"Estimate properties of a gas or gas mixture by corresponding states and mixing rules.","Z = f(T_r, P_r, ω); a_mix = ΣΣ y_iy_j √(a_ia_j)(1 − k_ij), b_mix = Σ y_ib_i.","","",0]]}]},{"n":8,"title":"Phase equilibrium of pure substances","scope":"core","topics":[{"n":1,"title":"Conditions for phase equilibrium and the phase rule","los":[["TD-8.1.A",1790,"State the conditions for phase coexistence and apply the Gibbs phase rule to a phase diagram.","T, P, μ_i equal in every phase; F = C − π + 2.","","",0]]},{"n":2,"title":"The Clapeyron and Clausius–Clapeyron equations","los":[["TD-8.2.A",1791,"Calculate the slope of a coexistence curve from the Clapeyron equation.","dP/dT = Δh/(TΔv).","","",2],["TD-8.2.B",1792,"Estimate a vapor pressure at a new temperature with the integrated Clausius–Clapeyron equation.","ln(P₂/P₁) = −(Δh_vap/R)(1/T₂ − 1/T₁); ideal vapor, v_liq ≪ v_vap, constant Δh.","","",2],["TD-8.2.C",1793,"Find Δh_vap from vapor pressures at two temperatures.","Slope of ln P vs 1/T is −Δh_vap/R.","","",2],["TD-8.2.D",1794,"Find the boiling temperature at a new pressure.","1/T₂ = 1/T₁ − (R/Δh_vap) ln(P₂/P₁).","","",2]]},{"n":3,"title":"Order parameters and types of transition","los":[["TD-8.3.A",1795,"Classify a transition as first- or second-order from which derivatives of G are discontinuous.","First order: jumps in S, V (latent heat); continuous: jumps or divergences in C_p, κ_T; the order parameter vanishes at T_c.","","",0]]}]},{"n":9,"title":"Solutions and mixtures","scope":"core","topics":[{"n":1,"title":"Ideal solutions","los":[["TD-9.1.A",1796,"Calculate the entropy of ideal mixing.","ΔS_mix = −nR Σ x_i ln x_i (from lattice counting).","","TD-1.1.D",2],["TD-9.1.B",1797,"Calculate the Gibbs energy of ideal mixing.","ΔG_mix = nRT Σ x_i ln x_i; ΔH_mix = ΔV_mix = 0.","","",2]]},{"n":2,"title":"Partial molar quantities and Gibbs–Duhem in mixtures","los":[["TD-9.2.A",1798,"Calculate partial molar properties from a total property, e.g. by the tangent-intercept method.","v̄_i = (∂V/∂n_i)_{T,P,n_j}; V = Σ n_i v̄_i.","","",0],["TD-9.2.B",1799,"Use Gibbs–Duhem to get one activity coefficient from the other or to test data for consistency.","Σ x_i d ln γ_i = 0 at fixed T, P.","","TD-2.3.E",0]]},{"n":3,"title":"Vapor–liquid equilibrium","los":[["TD-9.3.A",1800,"Calculate total pressure and vapor composition of an ideal solution with Raoult's law.","p_i = x_iP_i*; P = Σ x_iP_i*; y_i = p_i/P.","","",2],["TD-9.3.B",1801,"Calculate the solubility of a dilute solute from Henry's law.","p_i = x_iK_H,i for x_i → 0; K_H grows with T for most gases in water.","","",2],["TD-9.3.C",1802,"Perform bubble-point, dew-point and isothermal flash calculations for a multicomponent mixture.","K_i = y_i/x_i; flash: Σ z_i(K_i − 1)/[1 + β(K_i − 1)] = 0 (Rachford–Rice).","","",0]]},{"n":4,"title":"Nonideal solutions and activity","los":[["TD-9.4.A",1803,"Calculate activity coefficients from an excess-Gibbs-energy model (regular solution, Margules).","G^ex/n = W x_Ax_B ⇒ RT ln γ_A = W x_B².","","",2],["TD-9.4.B",1804,"Derive the regular-solution model from a lattice with nearest-neighbour interactions and predict when the mixture phase-separates.","ΔG_mix/nRT = Σ x ln x + χ x_Ax_B; unstable for χ > 2 (upper critical point at χ = 2, x = ½).","","TD-6.1.A",0],["TD-9.4.C",1805,"Calculate VLE with modified Raoult's law and identify an azeotrope.","y_iP = x_iγ_iP_i*; at an azeotrope x_i = y_i and γ_A P_A* = γ_B P_B*.","","",0]]},{"n":5,"title":"Colligative properties","los":[["TD-9.5.A",1806,"Calculate boiling-point elevation, freezing-point depression or osmotic pressure of a dilute solution.","ΔT_b = RT_b²x_B/Δh_vap; ΔT_f = RT_f²x_B/Δh_fus; Π = c_BRT (van 't Hoff).","","",0]]},{"n":6,"title":"Solvation and transfer between phases","los":[["TD-9.6.A",1807,"Relate a partition coefficient to the free energy of transferring a solute between phases.","ΔG°_transfer = −RT ln K_partition; set by μ° differences in the two solvents.","","",0]]}]},{"n":10,"title":"Chemical reaction equilibria","scope":"core","topics":[{"n":1,"title":"The equilibrium constant","los":[["TD-10.1.A",1808,"Calculate K from ΔG°.","K = exp(−ΔG°/RT); standard state fixes the units of each activity.","","",2],["TD-10.1.B",1809,"Calculate ΔG° from K.","ΔG° = −RT ln K.","","",2],["TD-10.1.C",1810,"Predict the direction of reaction from Q versus K.","ΔG = ΔG° + RT ln Q = RT ln(Q/K); Q \u003c K ⇒ forward.","","",2]]},{"n":2,"title":"Equilibrium composition","los":[["TD-10.2.A",1811,"Solve for the equilibrium extent of reaction and composition from K and the feed.","n_i = n_i0 + ν_iξ; K = Π(y_iP/P°)^ν_i for ideal gases.","","",2],["TD-10.2.B",1812,"Predict how pressure, inerts or a nonideal phase shift an equilibrium.","K_y = K(P/P°)^(−Δν); raising P favours fewer gas moles; fugacity or activity replaces y_iP in real phases.","","",0]]},{"n":3,"title":"Temperature dependence of K","los":[["TD-10.3.A",1813,"Find ΔH° from K at two temperatures, or K at a new temperature, with the van 't Hoff equation.","d ln K/d(1/T) = −ΔH°/R.","","",2]]},{"n":4,"title":"Reaction equilibrium from molecular partition functions","los":[["TD-10.4.A",1828,"Calculate K for a gas-phase reaction from molecular partition functions.","K = Π(q_i/V)^ν_i e^(−ΔE₀/k_BT) (per standard volume); dissociation energies set ΔE₀.","","TD-12.2.C",0]]}]},{"n":11,"title":"The Boltzmann distribution and the canonical ensemble","scope":"core","topics":[{"n":1,"title":"The Boltzmann distribution","los":[["TD-11.1.A",1814,"Calculate the population ratio of two levels at a given temperature.","N₂/N₁ = (g₂/g₁) e^(−ΔE/k_BT); 1 cm⁻¹ ↔ 1.439 K.","","",2],["TD-11.1.B",1815,"Calculate the fraction of molecules in a given level of a multi-level system.","p_j = g_j e^(−βE_j)/q.","","",2],["TD-11.1.C",1816,"Find the temperature at which a level reaches a given population ratio.","T = ΔE/[k_B ln(g₂N₁/g₁N₂)].","","",2]]},{"n":2,"title":"The partition function and thermodynamic properties","los":[["TD-11.2.A",1817,"Calculate a molecular partition function from a list of levels and degeneracies.","q = Σ g_j e^(−βE_j); q counts thermally accessible states.","","",2],["TD-11.2.B",1818,"Derive the average energy U from ln q for a two-level system or harmonic oscillator.","U = −N ∂ln q/∂β; oscillator U/Nε = 1/(e^x − 1).","","",2],["TD-11.2.C",1819,"Derive the entropy from the partition function.","S = U/T + Nk_B ln q (localized); S/Nk_B = ln q + βU/N.","","",2],["TD-11.2.D",1820,"Calculate the Helmholtz free energy from the partition function.","F = −k_BT ln Q; localized independent molecules: Q = q^N.","","",2],["TD-11.2.E",1821,"Assemble the system partition function from molecular ones for distinguishable or indistinguishable particles.","Q = q^N (localized) or q^N/N! (gas); independent modes multiply: q = q_t q_r q_v q_e.","","",0]]}]},{"n":12,"title":"Molecular models of gases and solids","scope":"core","topics":[{"n":1,"title":"Translation and the classical ideal gas","los":[["TD-12.1.A",1822,"Calculate the thermal de Broglie wavelength of a molecule.","Λ = h/√(2πmk_BT); classical when Λ³ ≪ V/N.","","",2],["TD-12.1.B",1823,"Calculate the translational partition function of a molecule in a box.","q_trans = V/Λ³.","","",2],["TD-12.1.C",1824,"Derive the ideal-gas law and the Sackur–Tetrode entropy from Q = q^N/N!.","P = k_BT ∂ln Q/∂V = Nk_BT/V; S/Nk_B = ln(V/NΛ³) + 5/2.","","TD-11.2.E",0]]},{"n":2,"title":"Rotation and vibration","los":[["TD-12.2.A",1825,"Calculate the rotational temperature of a diatomic from masses and bond length.","I = μr²; θ_rot = ħ²/(2Ik_B).","","",2],["TD-12.2.B",1826,"Calculate the high-temperature rotational partition function, including the symmetry number.","q_rot = T/(σθ_rot); σ = 2 homonuclear, 1 heteronuclear.","","",2],["TD-12.2.C",1827,"Calculate the vibrational temperature and vibrational partition function.","θ_vib = hcν̃/k_B; q_vib = 1/(1 − e^(−θ_vib/T)) from the ground state.","","",2]]},{"n":3,"title":"Heat capacity","los":[["TD-12.3.A",1829,"Calculate the classical heat capacity of a gas by equipartition.","½k_B per quadratic term: 3 translational, 2 or 3 rotational, 2 per vibration (3N − 5 or 3N − 6 modes).","","",2],["TD-12.3.B",1830,"Calculate C_V of a diatomic gas with classical translation and rotation and quantum vibration.","C_V,m = 5R/2 + R x²eˣ/(eˣ − 1)², x = θ_vib/T.","","",2],["TD-12.3.C",1831,"Derive the heat capacity of a two-level (Schottky) system.","C_V = (∂U/∂T)_V; peaks near k_BT ~ ε and vanishes at both limits.","","",2],["TD-12.3.D",1832,"Derive the heat capacity of a quantum harmonic oscillator.","C_V/Nk_B = x²eˣ/(eˣ − 1)² → 1 classically.","","",2],["TD-12.3.E",1833,"Calculate the molar heat capacity of a crystal from the Einstein model.","C_V,m = 3R x²eˣ/(eˣ − 1)², x = θ_E/T; Dulong–Petit 3R at high T.","","",2],["TD-12.3.F",1834,"Apply the Debye T³ law at low temperature and explain why Einstein fails there.","C_V ∝ (T/θ_D)³ at T ≪ θ_D: low-frequency acoustic modes stay active.","","",0]]},{"n":4,"title":"Classical continuous degrees of freedom","los":[["TD-12.4.A",1835,"Compute averages from the Maxwell–Boltzmann speed distribution.","f(v) ∝ v² e^(−mv²/2k_BT); v_mp = √(2k_BT/m), ⟨v⟩ = √(8k_BT/πm), v_rms = √(3k_BT/m).","","",0],["TD-12.4.B",1836,"Write the classical canonical partition function as a phase-space integral and reduce it to a configurational integral.","Q = (1/N!h^(3N)) ∫e^(−βH) dp dr = Z/(N!Λ^(3N)).","","",0]]},{"n":5,"title":"The third law","los":[["TD-12.5.A",1837,"Calculate an absolute entropy from heat-capacity data, including residual entropy of a disordered crystal.","S(T) = ∫₀^T C_p/T dT + Σ Δh_trans/T_trans; residual S = R ln W per mole (CO: R ln 2).","","",0]]}]},{"n":13,"title":"Fluctuations","scope":"core","topics":[{"n":1,"title":"Energy fluctuations in the canonical ensemble","los":[["TD-13.1.A",1838,"Calculate the energy variance of a molecule with a few discrete levels.","σ_E² = ⟨E²⟩ − ⟨E⟩² = ∂²ln q/∂β².","","TD-1.2.C",2],["TD-13.1.B",1839,"Derive the energy variance of a quantum harmonic oscillator.","σ_E²/ε² = eˣ/(eˣ − 1)².","","",2],["TD-13.1.C",1840,"Calculate the rms energy fluctuation from the heat capacity.","σ_E² = k_BT²C_V — positive C_V is the stability condition again.","","",2],["TD-13.1.D",1841,"Calculate the relative energy fluctuation of a macroscopic system and explain why ensembles agree.","σ_E/⟨E⟩ ∝ N^(−1/2); monatomic ideal gas: √(2/3N).","","",2]]}]},{"n":14,"title":"Other ensembles","scope":"core","topics":[{"n":1,"title":"The grand canonical ensemble","los":[["TD-14.1.A",1842,"Calculate the occupancy probabilities of a site exchanging molecules with a reservoir at fixed μ.","Ξ_site = 1 + e^(β(μ + ε)); p_empty = 1/Ξ.","","",2],["TD-14.1.B",1843,"Calculate the average number of bound molecules on independent sites from the grand partition function.","Ξ = (1 + λe^(βε))^M; ⟨N⟩ = λ ∂ln Ξ/∂λ.","","",2],["TD-14.1.C",1844,"Calculate the particle-number variance in the grand canonical ensemble.","σ_N² = λ ∂⟨N⟩/∂λ = k_BT (∂⟨N⟩/∂μ).","","",2]]},{"n":2,"title":"The isothermal–isobaric ensemble","los":[["TD-14.2.A",1845,"Calculate the population ratio of two states that differ in energy and volume at fixed T and P.","P_B/P_A = e^(−β(ΔE + PΔV)); G = −k_BT ln Δ.","","",2]]},{"n":3,"title":"The Gibbs entropy and choosing an ensemble","los":[["TD-14.3.A",1846,"Calculate entropy from microstate probabilities with the Gibbs formula and match each ensemble to its potential.","S = −k_B Σ p_i ln p_i; NVE ↔ S, NVT ↔ F, NPT ↔ G, μVT ↔ Ω = −PV.","","",0]]}]},{"n":15,"title":"Binding, adsorption and cooperativity","scope":"extension","topics":[{"n":1,"title":"Single-site binding and Langmuir adsorption","los":[["TD-15.1.A",1847,"Calculate fractional occupancy of a single-site receptor from K_d.","θ = c/(K_d + c).","","TD-14.1.A",2],["TD-15.1.B",1848,"Find the gas pressure that gives a target Langmuir coverage.","θ = KP/(1 + KP) ⇒ P = θ/[K(1 − θ)].","","",2],["TD-15.1.C",1849,"Calculate the standard binding free energy from K_d.","ΔG°_bind = RT ln(K_d/c°), c° = 1 M.","","",2]]},{"n":2,"title":"Multi-site and cooperative binding","los":[["TD-15.2.A",1850,"Calculate the average number bound to a two-site molecule with a pair interaction from its binding polynomial.","Ξ = 1 + 2y + wy²; ⟨N⟩ = (2y + 2wy²)/Ξ; w > 1 cooperative.","","",2],["TD-15.2.B",1851,"Calculate fractional saturation from the Hill equation.","θ = cⁿ/(K_{1/2}ⁿ + cⁿ).","","",2],["TD-15.2.C",1852,"Find the Hill coefficient from saturation at two concentrations.","n_H = Δ ln[θ/(1 − θ)] / Δ ln c.","","",2],["TD-15.2.D",1853,"Solve the Zimm–Bragg helix–coil or 1-D Ising model with a transfer matrix, or a mean-field Ising model for T_c.","Q = λ₁^N for large N; mean field: k_BT_c = zJ.","","",0]]}]},{"n":16,"title":"Reaction rates and transition states","scope":"extension","topics":[{"n":1,"title":"Arrhenius temperature dependence","los":[["TD-16.1.A",1854,"Find the activation energy from rate constants at two temperatures.","ln(k₂/k₁) = −(E_a/R)(1/T₂ − 1/T₁).","","",2],["TD-16.1.B",1855,"Find a rate constant at a new temperature from E_a.","k₂ = k₁ exp[−(E_a/R)(1/T₂ − 1/T₁)].","","",2],["TD-16.1.C",1856,"Calculate the factor by which a rate rises over a temperature interval.","k₂/k₁ = exp[(E_a/R)(1/T₁ − 1/T₂)]; the 'doubles per 10 K' rule ↔ E_a ≈ 50 kJ/mol near 300 K.","","",2]]},{"n":2,"title":"Transition-state theory","los":[["TD-16.2.A",1857,"Calculate a rate constant from ΔH‡ and ΔS‡ with the Eyring equation.","k = (k_BT/h) e^(ΔS‡/R) e^(−ΔH‡/RT).","","",2],["TD-16.2.B",1858,"Find the activation free energy from a measured rate constant.","ΔG‡ = −RT ln(kh/k_BT).","","",2],["TD-16.2.C",1859,"Relate forward and reverse rate constants to K by detailed balance and read rates off a free-energy profile along a reaction coordinate.","k_f/k_r = K; barrier height on F(ξ) sets k; catalysts lower ΔG‡, not ΔG°.","","TD-10.1.A",0]]}]},{"n":17,"title":"Electrolytes, polymers and simulation","scope":"extension","topics":[{"n":1,"title":"Electrochemical equilibria and electrolytes","los":[["TD-17.1.A",1860,"Calculate an equilibrium potential with the Nernst equation and a mean ionic activity coefficient with Debye–Hückel.","E = E° − (RT/zF) ln Q; ln γ± = −A|z₊z₋|√I (dilute limit).","","",0]]},{"n":2,"title":"Polymer solutions","los":[["TD-17.2.A",1861,"Calculate the Flory–Huggins free energy of mixing and the critical χ for a polymer solution.","ΔG_mix/k_BT = (φ/N) ln φ + (1 − φ) ln(1 − φ) + χφ(1 − φ); χ_c = ½(1 + 1/√N)².","","TD-9.4.B",0]]},{"n":3,"title":"Molecular simulation","los":[["TD-17.3.A",1862,"Apply the Metropolis acceptance rule and compute an ensemble average from a sampled trajectory.","acc = min(1, e^(−βΔE)); ⟨A⟩ = time average over equilibrated, decorrelated samples.","","",0]]}]}]},{"id":"molecular-simulation","title":"Molecular Simulation","code":"MD","track":"engineering","requires":["thermodynamics","programming"],"units":[{"n":1,"title":"Statistical mechanics for simulation","scope":"core","topics":[{"n":1,"title":"Ensembles, ergodicity and temperature","los":[["MD-1.1.A",1863,"Choose the ensemble (NVE, NVT, NPT, μVT) that matches a described experiment or simulation goal — choice rep.","Bench conditions (fixed T and P) ⇒ NPT, whose free energy is G; NVT gives A; NVE conserves H and is used to test integrators and measure unperturbed dynamics.","","",0],["MD-1.1.B",1864,"State the ergodic hypothesis and identify features of a system that break it on simulation timescales.","Time average = ensemble average only if the trajectory visits all relevant states; barriers of many k_BT (slow rotamers, buried waters, unfolding) make runs quasi-nonergodic.","","",0],["MD-1.1.C",1865,"Calculate the instantaneous temperature from kinetic energy and the count of degrees of freedom — numeric rep.","⟨K⟩ = (N_df/2) k_B T; N_df = 3N − N_constraints − 3 when centre-of-mass motion is removed.","","",0]]},{"n":2,"title":"Boltzmann weights and free energy","los":[["MD-1.2.A",1866,"Calculate the population ratio of two states from their energy difference at a given temperature — numeric rep.","p_i/p_j = exp[−(E_i − E_j)/k_BT]; k_BT = 0.593 kcal/mol at 298.15 K, so 1.36 kcal/mol is a factor of 10.","","",0],["MD-1.2.B",1867,"Convert between a population (or probability) ratio and a free-energy difference — numeric rep.","ΔG_A→B = −k_BT ln(P_B/P_A); a free energy counts every microstate of a state, so it includes entropy, not just the lowest energy.","","MD-1.2.A",0],["MD-1.2.C",1868,"Distinguish Helmholtz and Gibbs free energy and the potential of mean force along a coordinate, and state which one a given simulation yields.","A = −k_BT ln Q (NVT), G = −k_BT ln Δ (NPT); W(ξ) = −k_BT ln P(ξ) + const. Absolute Q is intractable, but ratios of Q are ensemble averages.","","",0]]}]},{"n":2,"title":"Force fields","scope":"core","topics":[{"n":1,"title":"The CHARMM functional form","los":[["MD-2.1.A",1869,"Write the CHARMM potential energy function term by term and name each parameter and the pairs each term excludes.","Bonds K_b(b − b₀)², angles K_θ(θ − θ₀)², Urey–Bradley, dihedrals K_φ[1 + cos(nφ − δ)], impropers, CMAP, LJ ε[(R_min/r)¹² − 2(R_min/r)⁶], Coulomb; 1-2 and 1-3 pairs excluded, 1-4 pairs use special LJ parameters.","","",0],["MD-2.1.B",1870,"Calculate a Lennard-Jones or Coulomb pair energy from CHARMM parameters using the combining rules — numeric rep.","ε_ij = √(ε_i ε_j), R_min,ij = R_min,i/2 + R_min,j/2; Coulomb = 332.06 q_i q_j / r kcal/mol with r in Å and q in e.","","",0]]},{"n":2,"title":"Topology, parameter and structure files","los":[["MD-2.2.A",1871,"Explain what RTF, PRM, PSF, CRD and toppar.str files each contain and which ones CHARMM reads in what order.","RTF: atoms, types, charges, connectivity and patches per residue (which terms exist); PRM: the constants in those terms; PSF: the generated list of atoms, bonds, angles, dihedrals of this system; CRD: coordinates; toppar.str streams the RTF/PRM set.","","",0],["MD-2.2.B",1872,"Map a residue's chemical state to its CHARMM36 name or patch: ASPP, GLUP, HSD/HSE/HSP, LSN, NTER/CTER, ACE/CT3 — choice rep.","ASP, GLU deprotonated and LYS protonated by default; HIS must always be specified; charged termini for a whole protein, neutral ACE/CT3 caps for a peptide cut from a chain.","","",0]]},{"n":3,"title":"Parameterization","los":[["MD-2.3.A",1873,"Describe how CHARMM36/CGenFF charges, dihedrals and LJ parameters are fitted, and why water model, cutoffs, constraints and 1-4 treatment belong to the parameter set.","Charges fit to QM interaction energies with TIP3P water; dihedrals to QM scans; LJ to liquid densities and heats of vaporization. Constraint and cutoff settings are part of the force field definition — match the parameterizing work.","","",0],["MD-2.3.B",1874,"Judge a CGenFF (ParamChem) parameter assignment from its penalty scores and decide whether to validate or reoptimize — choice rep.","Penalty \u003c 10 ≈ fine; 10–50 validate; > 50 reparameterize against QM.","","",0]]},{"n":4,"title":"Water models","los":[["MD-2.4.A",1875,"Compare TIP3P (CHARMM variant), SPC/E and TIP4P-type models by geometry, rigidity and known property errors, and name the model CHARMM36 assumes.","TIP3P: rigid 3-site; the CHARMM variant adds LJ on H; diffuses ~2× too fast but CHARMM36 is fitted with it. TIP4P models add a virtual M site carrying the negative charge.","","",0]]}]},{"n":3,"title":"Integration and MD algorithms","scope":"core","topics":[{"n":1,"title":"Verlet-family integrators","los":[["MD-3.1.A",1876,"Write one step of velocity Verlet and of leapfrog and explain why their time reversibility and symplecticity give bounded energy error.","Leapfrog: v(t + ½Δt) = v(t − ½Δt) + a(t)Δt, x(t + Δt) = x(t) + v(t + ½Δt)Δt. Symplectic integrators conserve a shadow Hamiltonian, so NVE energy fluctuates without drift; drift signals a bad Δt or cutoff artifacts.","","",0],["MD-3.1.B",1877,"Advance positions and velocities through one or two integration steps for a given 1-D force — numeric rep.","Velocity Verlet: x₁ = x₀ + v₀Δt + ½a₀Δt²; v₁ = v₀ + ½(a₀ + a₁)Δt.","","",0]]},{"n":2,"title":"Timestep and constraints","los":[["MD-3.2.A",1878,"Calculate the period of the fastest vibration from its wavenumber and pick the largest stable timestep with and without hydrogen-bond constraints — numeric rep.","T = 1/(c ν̃); X–H stretches at 3000–3600 cm⁻¹ have T ≈ 9–11 fs; with Δt ≲ T/10 that is ~1 fs unconstrained, ~2 fs with X–H constrained (rigid water roughly doubles Δt).","","",0],["MD-3.2.B",1879,"Explain how SHAKE, RATTLE and SETTLE impose holonomic constraints and count the degrees of freedom they remove.","Lagrange multipliers iteratively restore bond lengths each step; SETTLE solves rigid 3-site water analytically; each constraint removes one degree of freedom (enters N_df).","","MD-1.1.C",0],["MD-3.2.C",1880,"Decide when to use hydrogen mass repartitioning at 4 fs, or drop constraints and use 1 fs, including for bonds to alchemical atoms — choice rep.","HMR moves mass from heavy atoms to their H, conserving total mass and thermodynamics but altering kinetics. Constraints on bonds that change length between alchemical states bias single-topology results; 1 fs without them is the general fix.","","",0],["MD-3.2.D",1881,"Diagnose an unstable timestep or bad starting structure from run symptoms (SHAKE failures, energy blow-up, temperature spikes).","Early crashes usually mean unrelaxed contacts (minimize) or too large a Δt; steady NVE drift means Δt, constraint tolerance or cutoff treatment is too loose.","","",0]]}]},{"n":4,"title":"Thermostats and barostats","scope":"core","topics":[{"n":1,"title":"Thermostats","los":[["MD-4.1.A",1882,"Choose a thermostat for a stated goal — fast equilibration, canonical production, or dynamical properties — and justify it — choice rep.","Bussi: general purpose; Nosé–Hoover chains: canonical, better ergodicity in small systems; Langevin: canonical, robust, damps dynamics; Berendsen and simple velocity rescaling give the wrong ensemble (flying ice cube).","","",0],["MD-4.1.B",1883,"Write the Langevin equation and explain how the friction coefficient (CHARMM fbeta, ps⁻¹) trades temperature control against dynamical fidelity.","m dv/dt = F − γmv + R(t), ⟨R(t)R(t′)⟩ = 2γm k_BT δ(t − t′). BLaDE uses a g-BAOAB Langevin integrator; the tutorial's fbeta 0.1 ps⁻¹ is weak coupling.","","",0]]},{"n":2,"title":"Barostats and density","los":[["MD-4.2.A",1884,"Choose a barostat for equilibration vs production and for isotropic vs anisotropic cells — choice rep.","Berendsen only for early equilibration; Monte Carlo barostat, Langevin piston and Parrinello–Rahman sample NPT; anisotropic or semi-isotropic coupling for membranes and crystals.","","",0],["MD-4.2.B",1885,"Explain how a Monte Carlo barostat accepts a volume move and set its BLaDE parameters (prmc, iprs, pref, prdv).","Accept with min{1, exp[−β(ΔU + PΔV) + N ln(V′/V)]}; BLaDE's N counts heavy atoms. iprs = steps between attempts (default 50), pref = pressure in atm (1), prdv = σ of ΔV in Å³ (100).","","",0],["MD-4.2.C",1886,"Calculate a system's density from its box dimensions and total mass and check it against the expected value — numeric rep.","ρ = M/(N_A V); 1 g/cm³ = 0.6022 amu/Å³. Pure TIP3P at 298 K should sit near 0.98–1.0 g/cm³.","","",0]]}]},{"n":5,"title":"Periodic boundaries and long-range electrostatics","scope":"core","topics":[{"n":1,"title":"Periodic boundary conditions and box choice","los":[["MD-5.1.A",1887,"Apply the minimum-image convention to find the distance between two atoms in a periodic box — numeric rep.","Δx ← Δx − L·round(Δx/L) per axis; valid only when the nonbonded cutoff is below L/2.","","",0],["MD-5.1.B",1888,"Size a solvent box from the solute's extent and edge distance and compare atom counts for cubic, truncated-octahedral and rhombic-dodecahedral cells — numeric rep.","Cube side = d_max + 2 × edge (10 Å is standard; more for highly charged solutes like RNA). For the same image distance d: V_cube = d³, V_oct ≈ 0.770 d³ (23% fewer atoms), V_RD ≈ 0.707 d³ (29% fewer). Water ≈ 0.0334 molecules/Å³.","","",0],["MD-5.1.C",1889,"Explain why periodic artifacts are smaller than vacuum-interface artifacts and name the cases where they are not.","A droplet's surface distorts the solute; images avoid it. Artifacts grow with net charge, small boxes, and solutes that expand (unfolded chains need a fixed, larger box, e.g. 40 Å for the pentapeptides).","","",0]]},{"n":2,"title":"Cutoffs and particle-mesh Ewald","los":[["MD-5.2.A",1890,"Explain why truncating Coulomb interactions fails in condensed phases and how Ewald splitting into real- and reciprocal-space sums fixes it.","1/r decays slower than the number of neighbours grows (∝ r²). Ewald: erfc(κr)/r is short-ranged in real space; the smooth remainder is summed on a reciprocal grid (PME, O(N log N)); a uniform neutralizing background handles net charge.","","",0],["MD-5.2.B",1891,"Choose PME parameters (real-space cutoff, κ, grid spacing, interpolation order) consistent with a target accuracy — choice rep.","Typical CHARMM36 setup: 12 Å cutoff, κ ≈ 0.34 Å⁻¹, grid spacing ≤ 1 Å, order 4–6 (BLaDE supports 4, 6, 8). Larger κ shifts work to reciprocal space.","","",0],["MD-5.2.C",1892,"Distinguish switched, shifted and force-switched LJ cutoffs and pick the CHARMM36 standard, including neighbour-list buffer.","CHARMM36: vfswitch from 10 to 12 Å, pair list to 14–16 Å; BLaDE requires PME or VSWITCH for electrostatics and VFSWITCH or VSHIFT for LJ. Apply long-range dispersion corrections only if the force field was fitted with them.","","",0]]}]},{"n":6,"title":"System preparation and equilibration","scope":"core","topics":[{"n":1,"title":"Building the system","los":[["MD-6.1.A",1893,"Assign protonation states from propka pKa predictions at the experimental pH, using predicted pKa for the folded state and model pKa for an unfolded peptide — numeric rep.","pH \u003c pKa ⇒ protonated; fraction protonated = 1/(1 + 10^(pH − pKa)). Check ASP, GLU, HIS, LYS; ARG, TYR, CYS rarely titrate. Record the states — they go in the methods section.","","",0],["MD-6.1.B",1894,"Choose a histidine tautomer (HSD, HSE, HSP) from its pKa and hydrogen-bond environment — choice rep.","Protonated ⇒ HSP; otherwise put H on the δ or ε N according to nearby donors/acceptors; HSE when exposed or unclear (marginally more stable in the unfolded state).","","MD-6.1.A",0],["MD-6.1.C",1895,"Calculate the number of counterions and salt ion pairs needed to neutralize a box and reach a target concentration — numeric rep.","N_pairs ≈ c(M) × V(Å³) × 6.022 × 10⁻⁴; neutralize the net solute charge first. Mimic the experiment; otherwise ~150 mM (Na⁺ extracellular, K⁺ intracellular).","","",0],["MD-6.1.D",1896,"Build a solvated, ionized protein box in CHARMM-GUI Solution Builder at the experimental temperature, pH and salt, deciding which crystallographic components and termini to keep.","Keep crystallographic waters for the folded protein (pockets refill slowly); drop BME/Cl⁻ additives unless relevant; set temperature to the experiment (often 298.15 K, not the 303.15 K default).","","",0]]},{"n":2,"title":"Minimization, heating and equilibration","los":[["MD-6.2.A",1897,"Order the preparation stages — minimize, assign velocities, restrained NVT, NPT, production — and justify each stage.","Minimize to remove clashes; relax solvent at constant volume with solute restrained; then relax volume at constant pressure; NVT production at a set density needs NPT equilibration first.","","",0],["MD-6.2.B",1898,"Calculate the per-component velocity spread or RMS speed of an atom drawn from a Maxwell–Boltzmann distribution — numeric rep.","σ_v = √(k_BT/m) per Cartesian component; v_rms = √(3k_BT/m).","","",0],["MD-6.2.C",1899,"Decide when equilibration is complete from time series of energy, temperature, pressure, density and RMSD, and discard the burn-in.","No drift and fluctuation about a stable mean in several observables; if unsure, extend. Analyse only the production portion, applying the cut uniformly.","","",0]]}]},{"n":7,"title":"Sampling, convergence and uncertainty","scope":"core","topics":[{"n":1,"title":"Correlation in time series","los":[["MD-7.1.A",1900,"Compute a normalized autocorrelation function and integrated correlation time from a short time series — numeric rep.","C_j = ⟨δx_k δx_{k+j}⟩ / s²; τ_int = Σ_j C_j, summed until it converges but before it integrates noise.","","",0],["MD-7.1.B",1901,"Calculate the statistical inefficiency and effective number of independent samples, and from them the standard error of a mean — numeric rep.","g = 1 + 2Σ_{j≥1} C_j (in frames); N_ind = N/g; s(x̄) = s(x)/√N_ind. Saving frames more often than τ adds disk, not information.","","MD-7.1.A",0]]},{"n":2,"title":"Error bars","los":[["MD-7.2.A",1902,"Compute a standard error from block averages and identify the block size at which the estimate plateaus — numeric rep.","Split N frames into M equal blocks of n; s(x̄) = s(block means)/√M; increase n until s(x̄) stops growing.","","",0],["MD-7.2.B",1903,"Compute a standard error and 95% confidence interval from n independent trials using the Student t factor — numeric rep.","SE = s/√n with s over trial means; CI = x̄ ± t·SE, t(0.975, n − 1) = 2.78 for n = 5, 2.57 for n = 6. Starting structures must be independent for this to hold.","","",0],["MD-7.2.C",1904,"Propagate uncertainty through sums, differences and nonlinear functions, e.g. σ(ΔΔG) from two legs — numeric rep.","Independent legs: σ²(a − b) = σ²_a + σ²_b; nonlinear F: σ²_F ≈ Σ(∂F/∂x_i)² σ²_i, valid when noise-to-signal is small.","","",0],["MD-7.2.D",1905,"Bootstrap a confidence interval for a derived quantity from correlated data, and report it with significant figures that match the uncertainty.","Resample blocks or independent trials, not raw frames; 95% CI = 2.5th–97.5th percentile. Report the confidence level and only meaningful digits.","","",0]]},{"n":3,"title":"Sampling quality","los":[["MD-7.3.A",1906,"Distinguish statistical uncertainty from sampling error that no error bar reveals, and detect insufficient sampling from drift, rare transitions and disagreement between independent runs.","Checks can rule out good sampling but never prove it. Independent runs from diverse starts that disagree beyond their error bars signal unvisited states ('dark uncertainty').","","",0]]}]},{"n":8,"title":"Free-energy theory and estimators","scope":"core","topics":[{"n":1,"title":"Free-energy perturbation","los":[["MD-8.1.A",1907,"Calculate ΔA from given ⟨exp(−βΔU)⟩ or a list of ΔU samples with the Zwanzig relation, forward and reverse — numeric rep.","ΔA_0→1 = −k_BT ln⟨exp(−βΔU)⟩_0, ΔU = U₁ − U₀ evaluated on state-0 samples; exact in the limit, derived from Q₁/Q₀.","","MD-1.2.B",0],["MD-8.1.B",1908,"Estimate ΔA from the mean and variance of ΔU with the second-order cumulant expansion — numeric rep.","ΔA ≈ ⟨ΔU⟩₀ − βσ²_ΔU/2; exact for Gaussian ΔU.","","",0],["MD-8.1.C",1909,"Judge whether an FEP estimate is reliable from the ΔU distribution width and forward–reverse hysteresis.","The exponential average is biased and dominated by rare low-ΔU samples; reliable only when σ_ΔU ≲ 1–2 k_BT, i.e. neighbouring states overlap. Large forward–reverse disagreement means too few windows.","","",0]]},{"n":2,"title":"Thermodynamic integration","los":[["MD-8.2.A",1910,"Calculate ΔA by integrating ⟨∂U/∂λ⟩ over λ windows with the trapezoid or Simpson rule — numeric rep.","ΔA = ∫₀¹ ⟨∂U/∂λ⟩_λ dλ; trapezoid needs evenly or explicitly weighted windows; Simpson needs an odd number of evenly spaced points.","","",0],["MD-8.2.B",1911,"Derive ∂U/∂λ for a linear mixing potential and explain why curvature near the endpoints demands more windows or soft-core.","U = (1 − λ)U₀ + λU₁ ⇒ ∂U/∂λ = U₁ − U₀; for appearing atoms ⟨∂U/∂λ⟩ diverges as λ → 0 under linear LJ scaling.","","",0]]},{"n":3,"title":"BAR, MBAR and overlap","los":[["MD-8.3.A",1912,"Explain how BAR combines forward and reverse ΔU samples and why it beats one-sided exponential averaging.","BAR solves a self-consistent equation for ΔA using both directions; it is the minimum-variance two-state estimator and much less biased than Zwanzig.","","",0],["MD-8.3.B",1913,"Explain MBAR as reweighting all samples to all states, and relate it to BAR and WHAM.","MBAR solves for every state's free energy simultaneously from all samples; with two states it reduces to BAR; binned, it is WHAM (used in ALF flattening).","","",0],["MD-8.3.C",1914,"Read an MBAR overlap matrix and decide where to add λ states — choice rep.","Each state should share substantial overlap with its neighbours (off-diagonal elements not near zero); a weak link between two neighbours is where to insert a state. 20–40 states are typical.","","MD-8.3.B",0]]},{"n":4,"title":"Alchemical pathways and soft-core","los":[["MD-8.4.A",1915,"Design an alchemical λ schedule for inserting or deleting atoms: order of electrostatic and LJ changes, soft-core, and number of states.","Remove charges while LJ cores are on, then transform LJ with soft-core, then restore charges on inserted atoms; never change both at once on linear paths when sites appear or vanish.","","",0],["MD-8.4.B",1916,"Explain the endpoint catastrophe and how soft-core potentials remove it.","As an atom's LJ is scaled to zero, other atoms can overlap it and r⁻¹² diverges; soft-core remaps short distances so the energy stays finite (in MSλD, distances inside a λ-dependent cutoff, r₀ = 2 Å).","","",0],["MD-8.4.C",1917,"Distinguish single, dual and multiple topology and decoupling vs annihilation, and identify the topology MSλD uses — choice rep.","MSλD uses a shared core plus one complete substituent group per alternative; substituents at the same site never interact with each other; decoupling turns off only intermolecular terms.","","",0]]}]},{"n":9,"title":"Thermodynamic cycles, binding and stability","scope":"core","topics":[{"n":1,"title":"Relative free energies","los":[["MD-9.1.A",1918,"Close a thermodynamic cycle to compute a relative binding ΔΔG from alchemical legs in complex and solvent — numeric rep.","ΔΔG_bind = ΔG_bind(B) − ΔG_bind(A) = ΔG_complex(A→B) − ΔG_solvent(A→B); the physical binding legs are never simulated.","","MD-1.2.B",0],["MD-9.1.B",1919,"Compute a mutational folding ΔΔG from alchemical legs in the folded protein and an unfolded-state peptide model, and state its sign convention — numeric rep.","ΔΔG_fold = ΔG_alch(folded) − ΔG_alch(unfolded); positive = destabilizing. The capped pentapeptide (mutating residue ± 2) models a locally solvated unfolded state and ignores nonlocal contacts.","","",0],["MD-9.1.C",1920,"Compute cycle-closure errors in a perturbation network and use them to flag unreliable edges — numeric rep.","ΔG summed around any closed loop should be 0; nonzero closure measures error. Star maps are cheap; redundant, connected maps allow error analysis.","","",0]]},{"n":2,"title":"Absolute binding","los":[["MD-9.2.A",1921,"Lay out the double-decoupling cycle with restraints and identify every term in ΔG°_bind, including the standard-state correction.","Decouple the ligand in solvent and in the restrained site; add the restraint free energy (analytic for Boresch's six-DOF restraints) and the standard-state term; remove charges before LJ.","","",0],["MD-9.2.B",1922,"Calculate the standard-state correction for confining a ligand to a given restraint volume — numeric rep.","ΔG = −k_BT ln(V_site/V°), V° = 1661 Å³ per molecule at 1 M.","","",0],["MD-9.2.C",1923,"Choose a relative or absolute calculation for a described project — choice rep.","Relative: congeneric series with a shared core and a reliable bound pose. Absolute: no common substructure, uncertain site, or comparing sites or poses.","","",0]]},{"n":3,"title":"Comparing to experiment","los":[["MD-9.3.A",1924,"Convert between K_d and ΔG° and between fold-changes and ΔΔG, and judge a prediction against expected accuracy — numeric rep.","ΔG° = RT ln(K_d/1 M); a 10× change in K_d is 1.36 kcal/mol at 298 K; ~1–2 kcal/mol RMS error is typical in favourable cases.","","",0],["MD-9.3.B",1925,"Match simulation conditions (pH, salt, temperature, construct, protonation) to the experiment being reproduced.","The T4 lysozyme sites were measured at pH 3.0 (L99, M106, F153) and 5.4 (V149), so two folded-state setups are needed.","","",0]]}]},{"n":10,"title":"λ dynamics and multisite λ dynamics","scope":"core","topics":[{"n":1,"title":"λ as a dynamic variable","los":[["MD-10.1.A",1926,"Write the λ-dynamics extended Hamiltonian and explain how treating λ as a particle samples several alchemical states in one simulation.","H = K(x) + ½ m_λ λ̇² + U(x, λ); λ moves under −∂U/∂λ with a fictitious mass, so its population over time reflects relative free energies.","","",0],["MD-10.1.B",1927,"Write the MSλD potential for several sites and substituents and identify which terms scale with λ.","U = U₀ + Σ_s Σ_i λ_si U_si + Σ λ_si λ_tj U_si,tj (s ≠ t); Σ_i λ_si = 1 and λ_si ≥ 0 at each site; the environment U₀ is unscaled; substituents at one site don't see each other.","","MD-10.1.A",0],["MD-10.1.C",1928,"Calculate the number of λ variables and chemical end states for a multisite system from its nsubs list — numeric rep.","nsubs counts native + each mutant per site (V149 with 5 mutants ⇒ 6); nblocks = Σ nsubs; end states = Π nsubs (15 sites × 2 ⇒ 32 768).","","",0]]},{"n":2,"title":"Implicit constraints","los":[["MD-10.2.A",1929,"Compute λ values from θ coordinates with the fnex implicit constraint and verify they sum to one — numeric rep.","λ_i = exp(c sin θ_i) / Σ_j exp(c sin θ_j), c = 5.5 (fnex); θ is unbounded, λ stays in (0, 1) and sums to 1 automatically.","","",0],["MD-10.2.B",1930,"Calculate the λ bounds an fnex constraint can reach for a given number of substituents and explain the endpoint error it causes — numeric rep.","Bounds = [1 + (N − 1)e^{±2c}]⁻¹, so exact endpoints are never sampled (≈ 0.1–0.2 kcal/mol error) and sampling weakens past 8–9 substituents; piecewise constraints (fnpwise2026) reach the exact endpoints.","","MD-10.2.A",0]]},{"n":3,"title":"Biasing potentials","los":[["MD-10.3.A",1931,"Identify the role of each ALF bias term — fixed φ (b), quadratic ψ (c), endpoint χ (x) and ω (s), and the newer t and u terms — on the alchemical landscape.","φ offsets each substituent's free energy (≈ −ΔG) so all endpoints are equally populated; ψ_ij/4 changes the barrier between substituents; χ/ω shape the region near endpoints; bcxstu2026 adds t and u terms for many substituents.","","",0],["MD-10.3.B",1932,"Calculate the number of pairwise bias potentials a block setup must allocate for a given nblocks and bias scheme — numeric rep.","Pairs = nblocks(nblocks − 1)/2; bcxs2018 uses 5 potentials per pair, bcxstu2026 uses 9 (ldbi count).","","MD-10.1.C",0]]},{"n":4,"title":"Free energies from λ trajectories","los":[["MD-10.4.A",1933,"Calculate the free-energy difference between two substituents from their end-state populations (λ > 0.99) and fixed biases — numeric rep.","ΔG_i→j = −k_BT ln(P_j/P_i) − (φ_j − φ_i), with P counted only where λ > λ_c (0.99 in production; 0.8 in older work).","","MD-1.2.B MD-10.3.A",0],["MD-10.4.B",1934,"Interpret nan or very noisy entries in Result.txt as unsampled substituents and decide whether to refine biases before extending production.","A histogram estimator needs every end state visited; unvisited substituents mean biases are not yet converged — run another production of the same length first.","","",0]]}]},{"n":11,"title":"Adaptive Landscape Flattening in practice","scope":"core","topics":[{"n":1,"title":"The flattening algorithm","los":[["MD-11.1.A",1935,"Describe one ALF cycle — run MD, reweight recent runs, compute 1-D and 2-D free-energy profiles, fit bias changes, write the next variables file — and why changes are capped.","WHAM/MBAR combine several recent runs at different biases; a linear model of profile response feeds a quadratic penalty on deviations from flat. Only the bottom few kcal/mol of a basin is sampled, so updates are limited to a few kcal/mol.","","",0],["MD-11.1.B",1936,"Judge from PlotFreeEnergy5 profiles whether flattening has converged enough to start production.","Sampling should extend across every profile with no large unsampled gaps; perfect flatness isn't required, thermodynamic accessibility is.","","",0]]},{"n":2,"title":"Running ALF","los":[["MD-11.2.A",1937,"Plan the flattening schedule and convert it to step counts at a given timestep — numeric rep.","initialize; ~100 runflat cycles of 100 ps (200 for arginine), equilibration = ¼ of each run (25 ps + 75 ps, so the sampling-steps argument is 3× the equilibration one); then ~10 cycles of 1 ns. At 2 fs, 25 ps = 12 500 steps.","","",0],["MD-11.2.B",1938,"Plan a production ramp of independent trials extended by factors of 4–5 to a target length, and total its simulation time — numeric rep.","5 trials (a–e) each round, e.g. 5 → 20 → 100 ns. Typical totals: solvation 10–20 ns; well-behaved protein point mutations 40 ns; hard or multiple mutations 100 ns; massive spaces 400 ns.","","",0],["MD-11.2.C",1939,"Write alf_info.py for a system: name, nsubs, nblocks, temp, enginepath, nreps, and optional q, loss, bias and impcons keys.","name must match prep/name.inp; nblocks = Σ nsubs; nreps = 1 without replica exchange; q lists each substituent's net charge.","","MD-10.1.C",0],["MD-11.2.D",1940,"Choose loss function, bias scheme and implicit constraint for a described system — choice rep.","Defaults linear2018 / bcxs2018 / fnex2011 are no longer best practice: use nonlinear2024 loss and fnpwise2026; bcxs2018 for ~2 substituents, bcxstu2026 for ~20 (with matching blocksetup.inp edits).","","",0],["MD-11.2.E",1941,"Compute ΔΔG_fold with its uncertainty from Result.txt values in the folded and unfolded ensembles — numeric rep.","ΔΔG = dG(folded) − dG(unfolded) per mutant relative to native; combine the two legs' errors in quadrature.","","MD-9.1.B MD-7.2.C",0]]},{"n":3,"title":"Building the alchemical system in CHARMM","los":[["MD-11.3.A",1942,"Edit alchemical_definitions.inp for a mutation set: site resids, substituent sequence codes, segids and terminal variables.","s1seq1 = 0 is the native residue; further entries are one-letter codes (h/b/j = HSD/HSE/HSP); nterres/cterres = first and last resid of the chain (1–162 folded, site ± 2 unfolded).","","",0],["MD-11.3.B",1943,"Assemble a prep directory — system.inp adapted from step5_production.inp, toppar soft link, aa_stream patch/select/delete/blocksetup streams, nbond.str, alf_info.py — and test it with RunSetup.","DIMENS must be in the first script CHARMM reads, so it is removed from system.inp; patchloop adds alchemical atoms, selectloop names them, deleteloop removes spurious angles/dihedrals, blocksetup applies λ scaling and biases.","","MD-11.3.A",0]]}]},{"n":12,"title":"Trajectory analysis","scope":"core","topics":[{"n":1,"title":"Structural deviation and fluctuation","los":[["MD-12.1.A",1944,"Compute the RMSD between two small coordinate sets after optimal superposition, and use RMSD vs time to judge stability before free-energy runs — numeric rep.","RMSD = √[(1/N) Σ |r_i − r_i^ref|²] after Kabsch alignment on a chosen atom set (Cα or backbone); a plateau, not a small number, is the stability signal.","","",0],["MD-12.1.B",1945,"Compute per-residue RMSF and convert it to a crystallographic B-factor for comparison with experiment — numeric rep.","RMSF_i = √⟨|r_i − ⟨r_i⟩|²⟩ after alignment; B = (8π²/3) RMSF².","","",0]]},{"n":2,"title":"Interactions, clustering and distributions","los":[["MD-12.2.A",1946,"Classify a contact as a hydrogen bond from donor–acceptor distance and angle under a stated criterion — choice rep.","Common criterion: D···A ≤ 3.5 Å and D–H···A angle ≥ 120–150°; report occupancy as fraction of frames, and state the criterion used.","","",0],["MD-12.2.B",1947,"Cluster conformations by RMSD and report cluster populations and representative structures.","Cutoff-based or hierarchical clustering on pairwise RMSD; combined clustering of independent runs tests whether they sample the same states.","","",0],["MD-12.2.C",1948,"Compute a potential of mean force from a histogram of a coordinate — numeric rep.","W(ξ) = −k_BT ln P(ξ) + const; bins with no counts carry no information.","","MD-1.2.B",0]]},{"n":3,"title":"Visualization and trajectory handling","los":[["MD-12.3.A",1949,"Load a trajectory correctly (PSF before DCD in VMD) and re-centre or unwrap periodic coordinates before measuring.","A DCD holds only coordinates; the PSF supplies atom identities. Molecules split across box faces corrupt RMSD and distances until imaged.","","",0]]}]},{"n":13,"title":"HPC, engines and reproducible workflow","scope":"core","topics":[{"n":1,"title":"The cluster and SLURM","los":[["MD-13.1.A",1950,"Write a SLURM script for a GPU CHARMM job with partition, account, time limit, GPU request and memory, and submit or debug it without using the login node.","-p free-gpu or gpu; -A rhayes1_lab_gpu on paid partitions only; --time in minutes; --gres=gpu:1 (a GPU partition alone gives no GPU); --mem only after an OOM; srun --pty for interactive debugging; --array=1-4%1 runs chained segments one at a time.","","",0],["MD-13.1.B",1951,"Estimate GPU-hours and cost for a simulation campaign from throughput in ns/day, and choose free vs paid partitions — numeric rep.","GPU-h = 24 × total ns / (ns/day); paid gpu is $0.32 per GPU-hour; free-gpu costs nothing but jobs are preempted (ALF tolerates restarts).","","",0]]},{"n":2,"title":"MD engines","los":[["MD-13.2.A",1952,"Choose an engine — CHARMM standard, DOMDEC, BLaDE, OpenMM — for a described job — choice rep.","Standard CHARMM is CPU and slow; DOMDEC GPU is ~5× slower than BLaDE; BLaDE runs MSλD 5–8× faster than DOMDEC; OpenMM is fast for plain MD but does not run λ dynamics within CHARMM.","","",0],["MD-13.2.B",1953,"Write BLaDE NVT and NPT dynamics commands and state BLaDE's restrictions.","Add 'blade' to ENER/MINI/DYNA; NPT adds 'prmc iprs 100 pref 1 prdv 100'; set friction with 'scalar fbeta set 0.1 sele all end'. Langevin or NVE only, MC barostat only, H-bond constraints only, one GPU per OpenMP thread, no MPI.","","MD-4.2.B",0],["MD-13.2.C",1954,"Run an equivalent plain-MD simulation through OpenMM's Python API from CHARMM files.","Load PSF + parameter set, build the System with PME and H-bond constraints, LangevinMiddleIntegrator at T, MonteCarloBarostat at 1 bar; CHARMM-GUI can emit OpenMM inputs directly.","","",0]]},{"n":3,"title":"CHARMM scripting","los":[["MD-13.3.A",1955,"Read and write CHARMM scripts using titles, set/calc, @ and @@ variables, ? system values, stream, if/goto loops, bomlev and stop, and find the right documentation section.","Titles start with * and end at a lone *; ! starts comments; CHARMM is case-insensitive but file paths aren't (quote them). Key docs: BLOCK, CONSTRAINTS (SHAKE, restraints), Ewald, nonbonded, CRYSTAL and IMAGE.","","",0]]},{"n":4,"title":"Reproducibility and data management","los":[["MD-13.4.A",1956,"Record everything needed to reproduce a run: force-field and engine versions, protonation states, box and ions, seeds, all scripts under version control, and unprocessed data.","A result without its inputs and analysis scripts can't be checked; document the full uncertainty procedure too.","","",0],["MD-13.4.B",1957,"Estimate trajectory storage from atom count, save interval and simulation length — numeric rep.","DCD stores single-precision x, y, z: 12 bytes per atom per frame; frames = steps / nsavc.","","",0],["MD-13.4.C",1958,"Clean up a finished ALF project, separating disposable intermediates from data that must be kept.","run*/output, analysis*/data, Energy, Lambda and slurm logs are disposable; keep alchemical trajectories (run*/res) of published work; spatial DCDs may go after publication.","","",0]]}]},{"n":14,"title":"Advanced λ dynamics","scope":"extension","topics":[{"n":1,"title":"Large chemical spaces","los":[["MD-14.1.A",1959,"Decide whether intersite coupling biases are needed and set ntersite for flattening and postprocessing.","Default [0,0] ignores coupling; with significant coupling use [0,1] in short runflat cycles and [2,1] in postprocess (adjusting only c intersite biases).","","",0],["MD-14.1.B",1960,"Choose between the histogram estimator and the Potts-model estimator (likelihood vs pseudolikelihood) for a given chemical-space size — choice rep.","Histograms need every end state visited (~100–500 states max); Potts keeps one- and two-site terms only; LM below ~10⁶ end states, PLM above.","","MD-10.1.C",0],["MD-14.1.C",1961,"Partition a mutation set across sites and systems to respect substituent-per-site limits — choice rep.","The ALF README advises ≤ 6 substituents per site (9 the tested ceiling); split larger sets across systems sharing a reference substituent. Newer constraints and biases (2024–2026) extend this to dozens.","","",0]]},{"n":2,"title":"Hard perturbations","los":[["MD-14.2.A",1962,"Correct a charge-changing perturbation: explain its PME finite-size errors and apply ALF's discrete solvent correction with the q key.","Net-charge changes in a neutral PME box introduce artifacts; the discrete solvent correction is the largest computable term; alternatives include co-alchemical ions.","","",0],["MD-14.2.B",1963,"Explain when a site needs replica exchange (e.g. A42, A98, M102 in T4 lysozyme) and how biasing-potential replica exchange helps.","Some sites have slow coupled conformational and alchemical barriers; replicas with offset biases exchange to cross them. Replica runs need nreps > 1 and working MPI on the cluster.","","",0],["MD-14.2.C",1964,"Explain why proline and glycine mutations need a dedicated alchemical strategy.","Proline bonds its side chain back to the backbone N and glycine lacks Cβ, so backbone terms (CMAP, ring closure) differ between substituents; Hayes & Brooks 2021 give the workaround.","","",0]]}]}]},{"id":"dat","title":"Dental Admission Test","code":"DAT","track":"health","requires":["biology","chemistry"],"units":[{"n":1,"title":"Biology","scope":"core","topics":[{"n":1,"title":"Cell and Molecular Biology","los":[["DAT-1.1.A",1965,"Classify a biomolecule as carbohydrate, lipid, protein or nucleic acid from its monomer and linking bond.","Glycosidic, ester, peptide and phosphodiester bonds; all formed by dehydration, broken by hydrolysis.","","",0],["DAT-1.1.B",1966,"Predict how an inhibitor type changes Km and Vmax of an enzyme.","Competitive: Km up, Vmax same; noncompetitive: Vmax down, Km same; uncompetitive: both down.","","",0],["DAT-1.1.C",1967,"Locate each stage of cellular respiration and state its inputs, outputs and ATP yield.","Glycolysis (cytosol, 2 ATP net) → pyruvate oxidation + Krebs (matrix) → ETC (inner membrane, O2 final acceptor); ~30–32 ATP per glucose.","","",0],["DAT-1.1.D",1968,"Distinguish the light reactions from the Calvin cycle by location, inputs and products.","Thylakoid: H2O split, O2 released, ATP + NADPH made; stroma: rubisco fixes CO2 using ATP and NADPH.","","",0],["DAT-1.1.E",1969,"Predict the direction and energy requirement of a membrane transport process.","Passive goes down the gradient; active uses ATP or a coupled gradient; water moves toward higher solute concentration.","","",0],["DAT-1.1.F",1970,"Trace a signal from ligand to response for a GPCR, receptor tyrosine kinase or intracellular receptor.","Hydrophilic ligands bind surface receptors and use second messengers (cAMP, Ca2+, IP3/DAG); steroids cross the membrane and act on genes.","","",0],["DAT-1.1.G",1971,"Decide whether a cellular reaction is spontaneous and how coupling or an enzyme changes it.","ΔG \u003c 0 is spontaneous; ATP hydrolysis drives endergonic steps by coupling; enzymes lower Ea, never ΔG.","","",0],["DAT-1.1.H",1972,"Order the cell-cycle phases and mitotic stages and name the checkpoint controls.","G1 → S → G2 → M (prophase, metaphase, anaphase, telophase); cyclin–CDK complexes and p53 gate the transitions.","","",0],["DAT-1.1.I",1973,"Compare mitosis and meiosis by ploidy, crossing over and products.","Meiosis I separates homologs (2n → n) with crossing over in prophase I; meiosis II separates sister chromatids.","","DAT-1.1.H",0],["DAT-1.1.J",1974,"Match an organelle to its function and tell prokaryotic from eukaryotic cells.","RER makes secreted/membrane proteins; Golgi modifies and sorts; lysosome digests; peroxisome breaks H2O2 and fatty acids; mitochondria and chloroplasts carry their own DNA.","","",0],["DAT-1.1.K",1975,"Identify cytoskeletal elements and cell junctions by structure and role.","Microtubules (tubulin: spindle, cilia), microfilaments (actin: contraction, cleavage), intermediate filaments (keratin: strength); tight, gap and desmosome junctions.","","",0],["DAT-1.1.L",1976,"Choose the experimental technique that answers a cell-biology question and interpret its result.","Differential centrifugation separates by size/density; SDS-PAGE by mass; fluorescent tags localize; radiolabel pulse-chase follows a pathway.","","",0]]},{"n":2,"title":"Diversity of Life","los":[["DAT-1.2.A",1977,"Describe virus structure and distinguish lytic, lysogenic and retroviral life cycles.","Capsid around DNA or RNA, no metabolism; lysogenic phage integrates as a prophage; retroviruses use reverse transcriptase.","","",0],["DAT-1.2.B",1978,"Distinguish Archaea from Bacteria and Eukarya by membrane, wall and genetic machinery.","Archaea: ether-linked lipids, no peptidoglycan, histones and eukaryote-like RNA polymerase.","","",0],["DAT-1.2.C",1979,"Classify a bacterium by shape, Gram stain and metabolism, and name its modes of gene transfer.","Gram+ thick peptidoglycan, Gram− thin wall plus outer LPS membrane; binary fission; transformation, transduction, conjugation.","","",0],["DAT-1.2.D",1980,"Identify the defining features and life cycle of fungi.","Chitin walls, absorptive heterotrophs, hyphae/mycelium; haploid-dominant life cycle.","","",0],["DAT-1.2.E",1981,"Place a described protist in its group and explain why Protista is not a natural clade.","Eukaryotes that are not plants, animals or fungi (algae, amoebae, ciliates, Plasmodium); paraphyletic.","","",0],["DAT-1.2.F",1982,"Order plant groups by key innovation and identify the dominant generation in each.","Mosses (gametophyte-dominant, no vasculature) → ferns (vascular, sporophyte-dominant) → gymnosperms (seeds, pollen) → angiosperms (flowers, fruit, double fertilization).","","",0],["DAT-1.2.G",1983,"Classify an animal by symmetry, germ layers, body cavity and protostome/deuterostome development.","Deuterostomes (echinoderms, chordates): blastopore becomes the anus, radial cleavage; protostomes: mouth, spiral cleavage.","","",0],["DAT-1.2.H",1984,"Identify the four chordate features and the traits that separate vertebrate classes.","Notochord, dorsal hollow nerve cord, pharyngeal slits, post-anal tail; amniotic egg separates reptiles, birds and mammals from amphibians.","","",0]]},{"n":3,"title":"Structure and Function of Systems","los":[["DAT-1.3.A",1985,"Describe the layers of the skin and their roles in protection and thermoregulation.","Avascular epidermis (keratinocytes, melanocytes); dermis holds vessels, glands and receptors; sweat and vasodilation dump heat.","","",0],["DAT-1.3.B",1986,"Predict how bone remodeling and blood Ca2+ respond to PTH, calcitonin and vitamin D.","Osteoblasts build, osteoclasts resorb; PTH and calcitriol raise blood Ca2+, calcitonin lowers it.","","",0],["DAT-1.3.C",1987,"Explain each step of the sliding-filament cycle and its dependence on Ca2+ and ATP.","Ca2+ binds troponin, tropomyosin uncovers actin sites, myosin power stroke; ATP binding releases the head.","","",0],["DAT-1.3.D",1988,"Trace blood through the heart and vessels and identify which vessels carry oxygenated blood.","RA → RV → pulmonary artery → lungs → pulmonary veins → LA → LV → aorta; arteries leave the heart regardless of O2 content.","","",0],["DAT-1.3.E",1989,"Predict the direction a condition shifts the oxygen–hemoglobin dissociation curve.","Right shift (lower affinity): ↑CO2, ↑H+, ↑temperature, ↑2,3-BPG; fetal Hb and CO shift left.","","",0],["DAT-1.3.F",1990,"Distinguish innate from adaptive immunity and match B, CD4+ and CD8+ cells to their actions.","B cells make antibodies (humoral); CD8+ kill cells presenting on MHC I; CD4+ helpers recognize MHC II on APCs.","","",0],["DAT-1.3.G",1991,"Match a digestive enzyme to its source, substrate and site of action.","Salivary amylase (mouth), pepsin (stomach), pancreatic trypsin, lipase and amylase (duodenum); bile emulsifies; absorption is in the small intestine.","","",0],["DAT-1.3.H",1992,"Explain ventilation mechanics and how O2 and CO2 are exchanged and carried.","Diaphragm contracts → thoracic volume up, pressure down → air in; exchange by diffusion in alveoli; most CO2 travels as HCO3−.","","",0],["DAT-1.3.I",1993,"Assign filtration, reabsorption and concentration to nephron segments and predict the effect of ADH and aldosterone.","Glomerulus filters; PCT reabsorbs most solute; loop of Henle builds the gradient; ADH inserts aquaporins in the collecting duct; aldosterone retains Na+.","","",0],["DAT-1.3.J",1994,"Explain the ion movements behind the resting potential, action potential and synaptic transmission.","Na+ in depolarizes, K+ out repolarizes; Na+/K+-ATPase pumps 3 Na+ out, 2 K+ in; myelin enables saltatory conduction; Ca2+ triggers vesicle release.","","",0],["DAT-1.3.K",1995,"Identify the receptor and structure responsible for a sensory function.","Rods: dim light; cones: color; cochlear hair cells: hearing; semicircular canals and vestibule: balance.","","",0],["DAT-1.3.L",1996,"Match a hormone to its gland and target action and predict a negative-feedback response.","Peptide hormones use surface receptors, steroids act in the nucleus; hypothalamus → anterior pituitary → gland axes are damped by negative feedback.","","",0],["DAT-1.3.M",1997,"Sequence the menstrual cycle's hormone changes and compare spermatogenesis with oogenesis.","Estrogen peak → LH surge → ovulation; corpus luteum makes progesterone; one oocyte plus polar bodies vs four sperm per meiosis.","","",0]]},{"n":4,"title":"Genetics","los":[["DAT-1.4.A",1998,"Assign each DNA replication enzyme its role and explain leading vs lagging strand synthesis.","Helicase unwinds, primase lays RNA primer, DNA pol III extends 5′→3′, pol I replaces primers, ligase seals Okazaki fragments.","","",0],["DAT-1.4.B",1999,"Transcribe and translate a sequence and name the eukaryotic RNA-processing steps.","mRNA is antiparallel to the template, read 5′→3′ from AUG; 5′ cap, poly-A tail and splicing happen in the nucleus.","","",0],["DAT-1.4.C",2000,"Predict the protein-level effect of a silent, missense, nonsense or frameshift mutation.","Insertions or deletions not in multiples of 3 shift the reading frame; nonsense creates an early stop codon.","","DAT-1.4.B",0],["DAT-1.4.D",2001,"Solve monohybrid, dihybrid and test crosses for genotype and phenotype ratios.","Heterozygote cross 3:1; dihybrid 9:3:3:1; test cross with a heterozygote 1:1; multiply probabilities for independent genes.","","",0],["DAT-1.4.E",2002,"Recognize incomplete dominance, codominance, epistasis and linkage from offspring ratios, and convert recombination frequency to map distance.","1% recombinant offspring = 1 map unit; linked genes give excess parental types; 9:3:4 signals recessive epistasis.","","DAT-1.4.D",0],["DAT-1.4.F",2003,"Determine the inheritance pattern of a trait from a pedigree.","Autosomal recessive skips generations; X-linked recessive mostly affects males with no father-to-son transmission; dominant appears every generation.","","",0],["DAT-1.4.G",2004,"Explain how nondisjunction causes aneuploidy and predict gametes from a meiosis I vs II error.","An error in meiosis I gives all abnormal gametes; in meiosis II, half are normal; trisomy 21, XXY and XO are common results.","","DAT-1.1.I",0],["DAT-1.4.H",2005,"Predict lac and trp operon expression under given nutrient conditions.","Lac is inducible: lactose inactivates the repressor, low glucose raises cAMP–CAP; trp is repressible: tryptophan activates the repressor.","","",0],["DAT-1.4.I",2006,"Explain how chromatin modification and DNA methylation regulate eukaryotic genes heritably.","Histone acetylation opens chromatin (on); DNA methylation of promoters silences; changes persist without altering sequence.","","",0],["DAT-1.4.J",2007,"Choose and interpret a genetic technology: PCR, restriction digest, gel electrophoresis, cloning, CRISPR or sequencing.","PCR cycles denature–anneal–extend, doubling copies (2^n); smaller fragments run farther on a gel; Cas9 cuts where its guide RNA matches.","","",0],["DAT-1.4.K",2008,"Relate genome size to gene number and interpret genomic comparisons between species.","Most eukaryotic DNA is noncoding; genome size does not track complexity; shared sequence measures relatedness.","","",0],["DAT-1.4.L",2009,"Trace early development from fertilization through gastrulation and match germ layers to the tissues they form.","Ectoderm: nervous system, epidermis; mesoderm: muscle, bone, blood, kidney; endoderm: gut and lung lining; Hox genes set the body axis.","","",0]]},{"n":5,"title":"Evolution and Ecology","los":[["DAT-1.5.A",2010,"Identify the type of selection from a change in a trait distribution.","Directional shifts the mean; stabilizing narrows it; disruptive favors both extremes; selection acts on phenotype.","","",0],["DAT-1.5.B",2011,"Calculate allele and genotype frequencies with Hardy–Weinberg and state its assumptions.","p + q = 1; p² + 2pq + q² = 1; no selection, mutation, migration or drift, random mating, large population.","","DAT-1.4.D",0],["DAT-1.5.C",2012,"Classify a reproductive barrier and a speciation mode from a scenario.","Prezygotic (habitat, temporal, behavioral, mechanical, gametic) vs postzygotic (hybrid inviability, sterility); allopatric needs a geographic barrier.","","",0],["DAT-1.5.D",2013,"Distinguish homologous, analogous and vestigial structures and read relatedness from a phylogenetic tree.","Homology reflects common ancestry; analogy reflects convergence; the most recent shared node marks the closest relatives.","","",0],["DAT-1.5.E",2014,"Classify an animal behavior as fixed action pattern, imprinting, habituation, classical or operant conditioning, or altruism.","Innate behaviors need no learning; kin selection explains altruism toward relatives sharing genes.","","",0],["DAT-1.5.F",2015,"Predict population growth under exponential and logistic models and contrast r- and K-strategists.","dN/dt = rN(K − N)/K; growth is fastest at N = K/2; r-selected: many offspring, little care.","","",0],["DAT-1.5.G",2016,"Classify species interactions by their effect on each partner and order the stages of succession.","Mutualism +/+, commensalism +/0, parasitism and predation +/−, competition −/−; primary succession starts on bare substrate.","","",0],["DAT-1.5.H",2017,"Calculate energy transfer across trophic levels and trace carbon and nitrogen through an ecosystem.","About 10% of energy passes to each higher level; N2 fixation → nitrification → assimilation → denitrification.","","",0]]}]},{"n":2,"title":"General Chemistry","scope":"core","topics":[{"n":1,"title":"Stoichiometry and General Concepts","los":[["DAT-2.1.A",2018,"Calculate percent composition by mass from a formula.","Mass % = (n × atomic mass of element) / molar mass × 100.","","",0],["DAT-2.1.B",2019,"Determine an empirical formula from mass data, then the molecular formula from molar mass.","Convert to moles, divide by the smallest, clear fractions; molecular = empirical × (M / M_empirical).","","",0],["DAT-2.1.C",2020,"Balance a chemical equation by inspection.","Atoms of each element and total charge are conserved; balance pure elements last.","","",0],["DAT-2.1.D",2021,"Convert among mass, moles, particles and volume using molar mass, Avogadro's number and density.","n = m / M; N = n × 6.02 × 10²³; ρ = m / V.","","",0],["DAT-2.1.E",2022,"Find the limiting reagent, theoretical yield and percent yield from a balanced equation.","Compare moles available ÷ coefficient; the smallest ratio limits; % yield = actual / theoretical × 100.","","DAT-2.1.C DAT-2.1.D",0]]},{"n":2,"title":"Gases","los":[["DAT-2.2.A",2023,"Solve for an unknown P, V, n or T with the ideal gas law.","PV = nRT with T in kelvin; R = 0.0821 L·atm/(mol·K); 1 mol at STP ≈ 22.4 L.","","",0],["DAT-2.2.B",2024,"Predict a new state with Boyle's, Charles's or the combined gas law.","P1V1/T1 = P2V2/T2; hold the constant variables fixed and cancel them.","","DAT-2.2.A",0],["DAT-2.2.C",2025,"Calculate partial pressures from mole fractions using Dalton's law.","P_total = ΣP_i; P_i = X_i P_total.","","",0],["DAT-2.2.D",2026,"Apply kinetic molecular theory to compare molecular speeds and effusion rates and predict deviations from ideality.","Average KE ∝ T; rate₁/rate₂ = √(M₂/M₁); real gases deviate at high P and low T.","","",0]]},{"n":3,"title":"Liquids and Solids","los":[["DAT-2.3.A",2027,"Rank substances by intermolecular force strength and predict boiling point, viscosity and surface tension.","London \u003c dipole–dipole \u003c H-bonding (N, O, F–H) \u003c ion–dipole; London grows with size and surface area.","","",0],["DAT-2.3.B",2028,"Read a phase diagram or heating curve and calculate the heat for each segment.","Sloped segments: q = mcΔT; flat segments: q = nΔH_phase; the triple point and critical point bound the liquid.","","",0],["DAT-2.3.C",2029,"Predict how temperature and IMF strength change vapor pressure and normal boiling point.","Vapor pressure rises with T and falls with stronger IMFs; boiling occurs when vapor pressure equals external pressure.","","",0],["DAT-2.3.D",2030,"Classify a solid as ionic, molecular, covalent network or metallic and predict its properties.","Network solids (diamond, SiO2) have the highest melting points; metals conduct as solids; ionic solids conduct only when molten or dissolved.","","",0]]},{"n":4,"title":"Solutions","los":[["DAT-2.4.A",2031,"Convert among molarity, molality, mole fraction, mass percent and ppm, and solve dilutions.","M = mol/L solution; m = mol/kg solvent; M1V1 = M2V2.","","",0],["DAT-2.4.B",2032,"Calculate boiling-point elevation, freezing-point depression and osmotic pressure.","ΔT = iKm; π = iMRT; i is the number of particles per formula unit (NaCl ≈ 2).","","DAT-2.4.A",0],["DAT-2.4.C",2033,"Predict solubility from polarity and how temperature and pressure change it.","Like dissolves like; gas solubility falls with T and rises with partial pressure (Henry's law); most solids dissolve better hot.","","",0],["DAT-2.4.D",2034,"Calculate vapor-pressure lowering with Raoult's law.","P_solution = X_solvent × P°_solvent.","","",0]]},{"n":5,"title":"Acids and Bases","los":[["DAT-2.5.A",2035,"Identify Brønsted–Lowry acids, bases and conjugate pairs in a reaction.","Acid donates H+, base accepts; a stronger acid has a weaker conjugate base.","","",0],["DAT-2.5.B",2036,"Calculate pH, pOH, [H+] and [OH−] for strong acids and bases without a calculator.","pH = −log[H+]; pH + pOH = 14 at 25 °C; for [H+] = a × 10⁻ⁿ, pH is between n − 1 and n.","","",0],["DAT-2.5.C",2037,"Estimate the pH of a weak acid or base from Ka or Kb.","[H+] ≈ √(Ka C) when ionization is small; Ka × Kb = Kw.","","DAT-2.5.B",0],["DAT-2.5.D",2038,"Calculate buffer pH with Henderson–Hasselbalch and choose a buffer for a target pH.","pH = pKa + log([A−]/[HA]); a buffer works best within pKa ± 1.","","",0],["DAT-2.5.E",2039,"Read a titration curve to find the equivalence point, half-equivalence point and pKa.","At half-equivalence pH = pKa; weak acid + strong base equivalence pH > 7; n_acid = n_base at equivalence.","","DAT-2.5.D",0]]},{"n":6,"title":"Chemical Equilibria","los":[["DAT-2.6.A",2040,"Write an equilibrium expression and use Q vs K to predict the direction of shift.","Products over reactants raised to coefficients; omit pure solids and liquids; Q \u003c K shifts right.","","",0],["DAT-2.6.B",2041,"Predict the effect of a concentration, pressure or temperature change with Le Chatelier's principle.","Only temperature changes K; added pressure favors fewer gas moles; heat acts as a product in exothermic reactions.","","",0],["DAT-2.6.C",2042,"Calculate molar solubility from Ksp, including the common-ion effect.","For AB2: Ksp = 4s³; a common ion lowers solubility; precipitation occurs when Q > Ksp.","","",0],["DAT-2.6.D",2043,"Solve for equilibrium concentrations with an ICE table and the small-x approximation.","Initial – change – equilibrium; drop x when K is tiny relative to the starting concentration.","","DAT-2.6.A",0]]},{"n":7,"title":"Thermodynamics and Thermochemistry","los":[["DAT-2.7.A",2044,"Calculate ΔH_rxn from Hess's law, enthalpies of formation or bond energies.","ΔH = ΣΔH_f(products) − ΣΔH_f(reactants); with bond energies, broken − formed; reverse a step, flip the sign.","","",0],["DAT-2.7.B",2045,"Predict the sign of ΔS for a process.","Entropy rises with more gas moles, solid → liquid → gas, dissolving, and higher T.","","",0],["DAT-2.7.C",2046,"Determine spontaneity and the crossover temperature from ΔH and ΔS.","ΔG = ΔH − TΔS; − ΔH, + ΔS always spontaneous; T_cross = ΔH/ΔS.","","DAT-2.7.B",0],["DAT-2.7.D",2047,"Relate ΔG° to K and to E°cell.","ΔG° = −RT ln K = −nFE°; K > 1 ⇔ ΔG° \u003c 0 ⇔ E° > 0.","","",0],["DAT-2.7.E",2048,"Calculate heat exchanged in calorimetry and final temperatures of mixtures.","q = mcΔT; heat lost by the hot body = heat gained by the cold one; c_water = 4.18 J/(g·°C).","","",0],["DAT-2.7.F",2049,"Apply the first and third laws to a system: sign conventions for q and w, and absolute entropy.","ΔU = q + w (work on the system positive); S = 0 for a perfect crystal at 0 K; state functions are path-independent.","","",0]]},{"n":8,"title":"Chemical Kinetics","los":[["DAT-2.8.A",2050,"Determine reaction orders and the rate constant from initial-rate data.","Doubling [A] doubles rate → 1st order, quadruples → 2nd, no change → 0th; units of k depend on overall order.","","",0],["DAT-2.8.B",2051,"Calculate the remaining amount or time from a first-order half-life.","t½ = 0.693/k, independent of concentration; after n half-lives (½)ⁿ remains.","","",0],["DAT-2.8.C",2052,"Read Ea, ΔH and the effect of a catalyst from a reaction energy diagram, and predict how T changes the rate.","k = A e^(−Ea/RT); catalysts lower Ea for both directions without changing ΔH or K.","","",0],["DAT-2.8.D",2053,"Derive a rate law from a mechanism's rate-determining step and identify intermediates and catalysts.","The slow step sets the rate law; intermediates are made then consumed, catalysts are consumed then regenerated.","","",0]]},{"n":9,"title":"Oxidation–Reduction Reactions","los":[["DAT-2.9.A",2054,"Assign oxidation numbers and identify the oxidizing and reducing agents.","F always −1, O usually −2, H +1 with nonmetals; the species oxidized is the reducing agent.","","",0],["DAT-2.9.B",2055,"Balance a redox equation in acidic or basic solution by half-reactions.","Balance atoms, O with H2O, H with H+, charge with e−; in base add OH− to both sides to cancel H+.","","DAT-2.9.A",0],["DAT-2.9.C",2056,"Calculate E°cell from reduction potentials and identify anode, cathode and electron flow in galvanic and electrolytic cells.","E°cell = E°cathode − E°anode; oxidation at the anode; electrons flow anode → cathode; galvanic E° > 0, electrolytic needs input.","","",0],["DAT-2.9.D",2057,"Calculate the mass plated or the current/time needed in electrolysis.","n_e = It/F with F = 96 485 C/mol; moles metal = n_e / (electrons per ion).","","",0]]},{"n":10,"title":"Atomic and Molecular Structure","los":[["DAT-2.10.A",2058,"Write the electron configuration of an atom or ion, including Cr/Cu exceptions and transition-metal cations.","Aufbau, Pauli, Hund; transition metals lose 4s before 3d; half- and fully filled d subshells are favored.","","",0],["DAT-2.10.B",2059,"Assign or validate a set of quantum numbers for an electron.","n ≥ 1; ℓ = 0 … n − 1; m_ℓ = −ℓ … +ℓ; m_s = ±½.","","",0],["DAT-2.10.C",2060,"Draw a Lewis structure and use formal charge to choose the best one.","FC = valence − nonbonding e− − ½ bonding e−; the best structure minimizes formal charges and puts negatives on electronegative atoms.","","",0],["DAT-2.10.D",2061,"Predict molecular geometry, bond angle and polarity with VSEPR.","Electron domains set the shape (4 → tetrahedral 109.5°, lone pairs compress angles); symmetric shapes cancel bond dipoles.","","DAT-2.10.C",0],["DAT-2.10.E",2062,"Identify hybridization and count σ and π bonds; classify a bond as ionic, polar or nonpolar covalent.","Domains 2/3/4 → sp/sp²/sp³; single = 1σ, double = 1σ + 1π, triple = 1σ + 2π; ΔEN > ~1.7 is ionic.","","",0],["DAT-2.10.F",2063,"Count protons, neutrons and electrons in an isotope or ion and compute average atomic mass.","Z = protons, A = protons + neutrons; average mass = Σ(fraction × isotope mass).","","",0],["DAT-2.10.G",2064,"Relate photon energy, frequency and wavelength to electron transitions and the experiments behind atomic theory.","E = hν = hc/λ; emission when e− falls to a lower level; Thomson (electron), Rutherford (nucleus), Bohr (quantized levels).","","",0]]},{"n":11,"title":"Periodic Properties","los":[["DAT-2.11.A",2065,"Rank elements by atomic radius, ionization energy, electronegativity and electron affinity.","Across a period Z_eff rises: radius falls, IE and EN rise; down a group radius rises, IE falls; cations smaller, anions larger.","","",0],["DAT-2.11.B",2066,"Predict the typical ions, reactivity and compounds of alkali metals, alkaline-earth metals, halogens and noble gases.","Group 1 forms +1 and reacts with water to give H2 and hydroxide; halogens form −1, reactivity falls down the group; noble gases are inert.","","",0],["DAT-2.11.C",2067,"Explain characteristic properties of transition elements: multiple oxidation states, colored ions and paramagnetism.","Partially filled d orbitals give variable charges, d–d color and unpaired electrons.","","",0]]},{"n":12,"title":"Nuclear Reactions","los":[["DAT-2.12.A",2068,"Balance a nuclear equation and identify the decay mode from the change in A and Z.","α: A − 4, Z − 2; β−: Z + 1; β+ and electron capture: Z − 1; γ: no change; A and Z both conserved.","","",0],["DAT-2.12.B",2069,"Calculate the remaining fraction or the elapsed time for radioactive decay.","N = N₀(½)^(t/t½); decay is first order.","","",0],["DAT-2.12.C",2070,"Calculate binding energy from mass defect and compare nuclear stability.","E = Δm c²; 1 u ≈ 931.5 MeV; binding energy per nucleon peaks near Fe-56.","","",0]]},{"n":13,"title":"Laboratory","los":[["DAT-2.13.A",2071,"Choose the glassware or equipment for a measurement and report the result to the right significant figures.","Volumetric pipets and flasks are precise; beakers are not; read the meniscus at eye level, one estimated digit.","","",0],["DAT-2.13.B",2072,"Distinguish accuracy from precision, classify an error as random or systematic, and compute percent error.","% error = |measured − true| / true × 100; systematic error shifts every reading the same way.","","",0],["DAT-2.13.C",2073,"Identify the correct safety procedure for a lab hazard.","Add acid to water; work with volatiles in the fume hood; flush skin or eye exposure for 15 minutes.","","",0],["DAT-2.13.D",2074,"Extract a quantity from a plotted data set, such as a slope, intercept or best-fit value.","Linearize first (ln[A] vs t for 1st order; 1/T vs ln k for Ea); the slope carries the physical constant.","","",0]]}]},{"n":3,"title":"Organic Chemistry","scope":"core","topics":[{"n":1,"title":"Mechanisms","los":[["DAT-3.1.A",2075,"Predict the product of a step from its curved arrows, telling two-electron arrows from fishhooks.","Double-headed arrows move electron pairs and fishhooks move single electrons, always from the electron source to the electron sink.","","",0],["DAT-3.1.B",2076,"Draw the curved arrows that convert given reactants into given products.","Start arrows at lone pairs or bonds, end at an atom or bond; count formal charges before and after.","","DAT-3.1.A",0],["DAT-3.1.C",2077,"Draw resonance structures and pick the major contributor.","Move only π and lone-pair electrons; the best contributor has full octets, fewest charges, and negative charge on the most electronegative atom.","","",0],["DAT-3.1.D",2078,"Predict the steps and selectivity of a free-radical halogenation.","Initiation, propagation, termination; Br₂ is

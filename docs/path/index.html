"title":"Lecturing and long-form talks","scope":"extension","topics":[{"n":1,"title":"Lectures and talks","los":[["SP-10.1.A",2316,"Plan a 50-minute lecture as 10–15-minute segments, each with its own point, example and check for understanding, opened by a short review.","Begin with a review of prior learning; attention and working memory reset between segments; each segment gets an answer-first top line.","","SP-6.3.A",0],["SP-10.1.B",2317,"Deliver from a keyword outline instead of a script, and on playback show eye contact and conversational rate held throughout.","Reading drops eye contact, flattens pitch and speeds rate; a keyword outline keeps you talking to people. Mark 'SLOW DOWN', breath slashes and stressed words on the outline.","","SP-2.1.B SP-3.3.A",0],["SP-10.1.C",2318,"Fit a talk to its time slot: estimate length from word count at your measured wpm, cut to 90% of the slot, and finish within ±30 s in rehearsal.","Minutes ≈ words ÷ wpm; at 130 wpm a 10-minute slot holds ~1 300 words — plan ~1 150 to leave room for pauses and questions.","","SP-2.1.A",0]]}]},{"n":11,"title":"Remote, recorded and microphone speaking","scope":"extension","topics":[{"n":1,"title":"Calls, recordings and microphones","los":[["SP-11.1.A",2319,"Set up for a video call or recording — lens at eye level, light in front, mic 15–30 cm away — and keep energy one notch above in-person to compensate for compression.","Video flattens vocal variety and facial expression; slightly more energy and pitch range reads as normal on screen. With a mic, keep a constant distance; don't project into it.","","",0],["SP-11.1.B",2320,"Handle a remote Q&A or interview turn with the lag in mind: finish with a clear falling ending and a handoff ('happy to go deeper on any of that') so no one talks over you.","Latency of a few hundred ms causes collisions; clear endings and explicit handoffs replace the visual turn-taking cues lost on calls.","","SP-3.1.A",0]]}]}]},{"id":"basketball","title":"Basketball","code":"BB","track":"athletics","requires":[],"units":[{"n":1,"title":"Offensive principles","scope":"core","topics":[{"n":1,"title":"Spacing and floor balance","los":[["BB-1.1.A",2321,"Identify spacing errors in a described or diagrammed half-court set (two players in one help zone, empty corner, crowded lane) and name the fix.","Spacing sets help distance; teaching starts at ~12 ft apart (a lane width) and widens to 15–18 ft and the three-point line as range grows. A filled corner forces the low helper to choose between the rim and a corner three.","","",0],["BB-1.1.B",2322,"Given a 5-out, 4-out-1-in or 3-out-2-in alignment and a drive, choose which defender must help and which offensive player is left open.","The nearest helper to the drive's path helps; whoever he left, and the rotation behind him, is the open man.","","",0],["BB-1.1.C",2323,"Choose the correct spacing move for each off-ball player on a drive — fill, lift, drift, or dive.","Baseline drive: corner lifts to the wing or drifts behind; middle drive: wings drift to the corner, opposite shooters stay one pass away, the big dunker-spots.","","",0]]},{"n":2,"title":"Creating an advantage","los":[["BB-1.2.A",2324,"Name the ways an offense creates an advantage (ball screen, post touch, isolation, off-ball screen, transition, offensive rebound) and pick which fits a given personnel group.","Advantage = a defender out of position or a numbers edge; it is created on-ball, off-ball or in the open floor.","","",0],["BB-1.2.B",2325,"Given a described catch, choose the triple-threat read: shoot if the closeout is late, drive the high foot if the defender is close, pass if help has arrived.","The defender's distance and feet decide: space ⇒ shot, momentum toward you ⇒ drive past it, help shown ⇒ move it.","","",0],["BB-1.2.C",2326,"Recognise a mismatch in a described lineup (size, speed, a poor defender) and choose how to attack it — post, isolate, or force it into the action.","Attack the mismatch quickly, before the defense scrambles back; involve the weak defender as screener or screened.","","",0]]},{"n":3,"title":"Keeping the advantage — the advantage chain","los":[["BB-1.3.A",2327,"Given a described drive-and-kick sequence, choose the next action for the receiver (shoot, attack the closeout, swing, or extra pass).","Decide on the catch (~0.5 s): an advantage held too long dies as the defense recovers. The extra pass beats a two-on-one closeout; driving a hard closeout beats a scrambled rotation.","","BB-1.2.B",0],["BB-1.3.B",2328,"Distinguish a good shot from a quick shot in a described possession by naming the advantage it came from.","A good shot is an open, in-range attempt from a created advantage; a contested early shot with no advantage wastes the possession.","","",0]]},{"n":4,"title":"Off-ball movement and cutting","los":[["BB-1.4.A",2329,"Given how a defender plays an off-ball screen (trails, goes under, cheats over, top-locks), choose the cut: curl, pop/fade, flare, or backdoor.","Trail ⇒ curl; under or sagging ⇒ pop or fade; top-locked or overplayed ⇒ backdoor; defender shoots the gap ⇒ flare or re-screen.","","",0],["BB-1.4.B",2330,"Choose when to backdoor, basket-cut or relocate when a defender denies or turns his head.","Denial or ball-watching opens the backdoor; a cut must create a passing lane, not fill one already used.","","",0],["BB-1.4.C",2331,"Read a described post-entry: choose the entry angle and the post player's read against a double from the top, the baseline or no double.","Enter from the wing at a 45° angle; a double from the top leaves the passer; from the baseline it leaves the opposite block or corner.","","",0]]},{"n":5,"title":"Transition offense","los":[["BB-1.5.A",2332,"Assign transition lanes and roles (ball, wings sprinting to corners, rim-runner, trailer) for a given rebound or turnover.","Wide lanes stretch the retreat; the rim-runner forces the deepest defender to pick him up; the trailer arrives for a late three or a drag screen.","","",0],["BB-1.5.B",2333,"Given a 2-on-1, 3-on-2 or 4-on-3 break, choose who shoots or receives the pass.","Make the last defender commit before passing; in a 3-on-2 the first pass usually goes to the wing the top defender didn't take.","","",0],["BB-1.5.C",2334,"Decide whether to push for an early-offense shot or flow into half-court, given numbers, score and clock.","Push when numbers or mismatches exist before the defense sets; a leading team late may flow into half-court to burn clock.","","",0]]}]},{"n":2,"title":"Ball-screen offense","scope":"core","topics":[{"n":1,"title":"Setting and using the screen","los":[["BB-2.1.A",2335,"Identify the ball-screen type (high, side, drag, step-up, spain, pick-and-pop) and its spacing in a described possession.","Screen angle and location decide which way the ball goes and which helpers are involved.","","",0],["BB-2.1.B",2336,"Choose the ball-handler's set-up: reject, use, or re-screen, given how the on-ball defender is positioned.","A defender jumping to take away the screen opens the reject; the ball-handler sets up his man before using the screen, shoulder to hip.","","",0]]},{"n":2,"title":"Reads against each coverage","los":[["BB-2.2.A",2348,"Given a described drop coverage, choose the read: pull-up, floater in the pocket, pop, or lob over a big who is too high.","Drop concedes the pull-up and the pick-and-pop three; a deep drop takes away the roll.","","BB-4.1.A",0],["BB-2.2.B",2349,"Given a hedge/show or a blitz, choose the read: escape dribble, pass to the short roll, or skip to the open shooter.","Two on the ball means 4-on-3 behind it; the short-roller is the decision-maker in that 4-on-3.","","BB-4.1.A",0],["BB-2.2.C",2350,"Given a switch, choose how to attack: slip before the switch, post the smaller defender, or isolate against the big.","Switching gives up mismatches; slipping punishes an early switch.","","BB-4.1.A",0],["BB-2.2.D",2351,"Given ice/blue or weak coverage, choose the counter: reject, pop, or attack downhill to the weak hand.","Ice forces the ball sideline and concedes the pop and long two; rejecting beats a defense that pre-rotates for the screen.","","BB-4.1.A",0]]},{"n":3,"title":"Help-side reads and the screener","los":[["BB-2.3.A",2337,"Given which defender tags the roller, choose the pass: lob, pocket, kick to the tagger's man, or skip to the opposite corner.","If the tag comes from the corner, the corner is open; if it comes from the wing, the skip or the lift is.","","",0],["BB-2.3.B",2338,"Choose the screener's action — roll, short-roll, pop, slip or ghost — given his skills and the coverage.","Roll vs level/hedge, pop vs drop, slip vs switch or hard hedge, short-roll vs blitz.","","",0]]}]},{"n":3,"title":"Defensive principles","scope":"core","topics":[{"n":1,"title":"Ball and off-ball positioning","los":[["BB-3.1.A",2339,"Place each defender correctly given where the ball is — on-ball, one pass away (deny or gap), two passes away (help side).","Ball–you–man: see both; one pass away up the line, two passes away on the line (in the paint), nail help on middle drives. On-ball: between the man and the basket, about an arm's length, eyes on the waist.","","",0],["BB-3.1.B",2340,"Choose the direction to force the ball (baseline, middle, weak hand) for a given scheme and scouting report, and justify it.","Forcing baseline needs a low helper waiting; forcing middle relies on bodies in the gaps. Either way, take away the strength.","","",0]]},{"n":2,"title":"Help and rotation","los":[["BB-3.2.A",2341,"Given a described drive or post touch, name who helps, who rotates to the helper's man, and who is left (the X-out or sink-and-fill).","Help comes from the closest gap; rotation goes toward the basket first; the last defender splits two shooters.","","",0],["BB-3.2.B",2342,"Identify the low man on a described possession and his job when the ball is driven or a roller dives.","Low man = deepest weak-side defender; he protects the rim or tags the roller, and the help behind him zones the two weak-side shooters.","","",0],["BB-3.2.C",2343,"Choose whether to stunt, dig or fully help on a drive given the driver and the shooter being left.","Stunt and recover vs a non-shooter's teammate; never fully help off an elite shooter one pass away.","","",0]]},{"n":3,"title":"Closeouts","los":[["BB-3.3.A",2344,"Choose the closeout type (high-hands shot contest, short closeout to take away the drive, run-by) for a described shooter and game situation.","Sprint, then chop the last steps with hands high; close out short on a driver, high on a shooter; late in the game vs a must-make three, run him off the line.","","",0]]},{"n":4,"title":"Defensive rebounding and transition defense","los":[["BB-3.4.A",2345,"Assign box-out responsibilities on a described shot, including the shooter and the weak side, where misses go long.","Hit first, then pursue; long shots bounce long, often to the weak side.","","",0],["BB-3.4.B",2346,"Given a described live-ball turnover or long rebound, choose the transition defense priorities in order: stop the ball, protect the rim, find shooters, match up.","First back takes the rim, the next stops the ball; matching up comes after the paint and the ball are safe.","","",0]]}]},{"n":4,"title":"Ball-screen defense","scope":"core","topics":[{"n":1,"title":"The coverages","los":[["BB-4.1.A",2347,"Identify the coverage (drop, deep drop, at the level, hedge/show, blitz, ice, weak, switch) from a described position of the screener's defender and the on-ball defender.","Drop: big several feet below the screen; level: at the screen; hedge: above it, then retreats; blitz: above and stays to trap; ice: ball forced sideline, big sitting below; switch: assignments trade.","","",0],["BB-4.1.B",2352,"State what each coverage takes away and what it concedes.","Drop concedes pull-ups and pops; hedge/blitz concede the short roll and 4-on-3; switch concedes mismatches; ice concedes the pop and long two.","","BB-4.1.A",0]]},{"n":2,"title":"Choosing the coverage","los":[["BB-4.2.A",2353,"Given a described ball-handler, screener and your two defenders, choose the coverage and justify it (an auto-checked pick).","Non-shooting ball-handler ⇒ go under / drop; elite shooter ⇒ level, hedge or blitz; non-shooting screener ⇒ ice or drop is cheap; like-sized pair ⇒ switch. Mobile bigs can hedge and recover; slow bigs can't.","","BB-4.1.B",0],["BB-4.2.B",2354,"Choose the over/under/through route for the on-ball defender given the ball-handler's shooting range.","Under a non-shooter, over a shooter; going under a pull-up shooter concedes the three.","","",0],["BB-4.2.C",2355,"Assign the weak-side help (tagger, low man, X-out) behind a given coverage.","Every coverage that sends two to the ball needs a tag on the roller and a rotation to the tagger's man.","","BB-3.2.B",0]]}]},{"n":5,"title":"Zone, man and press","scope":"core","topics":[{"n":1,"title":"Zone vs man","los":[["BB-5.1.A",2356,"Identify a zone (2-3, 3-2, 1-3-1, matchup) from a described alignment and response to the first pass.","A zone guards areas, a man defense follows cutters; a matchup zone looks like man until a cutter crosses zones.","","",0],["BB-5.1.B",2357,"Choose man or a zone for a described opponent and justify it with their shooting, size and depth.","Zones protect foul trouble and size mismatches and concede threes and offensive rebounds; man suits good individual defenders against motion teams.","","",0],["BB-5.1.C",2358,"Name the weak spots of each standard zone.","2-3: high post, short corner, skip to corners; 1-3-1: corners and baseline; 3-2: the low blocks.","","",0]]},{"n":2,"title":"Attacking a zone","los":[["BB-5.2.A",2359,"Given a described zone and ball position, choose the attack: gap dribble, high-post entry, short-corner feed, skip pass, or overload.","Make two defenders guard one; zones shift on the pass, so skips and quick ball reversal beat them. Line up in the gaps (odd front vs even, even front vs odd).","","",0]]},{"n":3,"title":"Pressure and press break","los":[["BB-5.3.A",2360,"Identify a press (2-2-1, 1-2-1-1, 1-3-1) and its trap locations from a description.","Presses trap near the sideline and the half-court corners, using the line as an extra defender.","","",0],["BB-5.3.B",2361,"Given a described trap, choose the outlet: middle, reversal, or the long pass over the top.","Don't dribble into the corner trap; the middle and the ball-side flash beat it; the trap leaves someone open behind it.","","",0]]}]},{"n":6,"title":"Situational basketball","scope":"core","topics":[{"n":1,"title":"Clock management","los":[["BB-6.1.A",2362,"Given the game clock, shot clock length and score, compute whether a 2-for-1 is available and when to shoot.","Shoot when game clock ≈ shot clock + 6–10 s: the opponent can't run out the clock, and you still get the last possession.","","",0],["BB-6.1.B",2363,"Given score, game clock and shot clock, decide whether the leading team can run the clock out, and when the trailing team must foul.","If the game clock is below the shot clock, the leader with the ball can drain it unless fouled; trailing by more than one possession late means foul to stop the clock.","","",0],["BB-6.1.C",2364,"Choose when to start the attack for a last shot of a quarter or game (hold for one, leave time for a rebound).","Start the action at ~8–6 s so a miss leaves no time for the opponent but a tip remains possible.","","",0]]},{"n":2,"title":"End-of-game shot and foul decisions","los":[["BB-6.2.A",2365,"Given a lead of 3, seconds left and the opponent's shooters, decide whether to foul or defend, citing the evidence.","kenpom's college sample: defend ≈ 93.5% vs foul ≈ 92.0% wins, noisy and selection-biased. Fouling is worth it mainly against several good shooters and with confidence in the defensive rebound. A foul in the act of a three, or a missed FT the trailing team rebounds, is the main risk.","","",0],["BB-6.2.B",2366,"Trailing by 2 with one possession left, compute the win probability of going for 3 vs going for 2 and overtime, and choose.","P(win | go for 3) = P(make 3); P(win | go for 2) = P(make 2) × P(win OT) — OT is roughly a coin flip unless one side is clearly better.","","",0],["BB-6.2.C",2367,"Trailing late, choose whom to foul and compute the expected points conceded given the bonus rule for the level.","Two-shot foul ⇒ expected points = 2 × FT%; under a one-and-one ⇒ p + p² (NCAA men's 7th–9th foul). NFHS: two shots from the 5th team foul in a quarter; FIBA: two shots after 4 team fouls in a quarter; NCAA women: two from the 5th per quarter.","","",0],["BB-6.2.D",2368,"Choose whether to use a foul to give when leading late, given the opponent's team fouls and time left.","Below the bonus, a non-shooting foul costs only a throw-in and seconds, and breaks up a set play.","","",0]]},{"n":3,"title":"Timeouts and advancing the ball","los":[["BB-6.3.A",2369,"Decide whether to call a timeout or play on after a defensive rebound or made basket late, given timeouts left, the league rule and the defense's state.","Calling a timeout lets a scrambled defense set; FIBA's last-2-minutes option to throw in from the frontcourt throw-in line can make it worth it.","","",0],["BB-6.3.B",2370,"Apply the timeout allotment and restrictions for a level to a described late-game sequence (FIBA: 2 in the first half, 3 in the second with at most 2 in the last 2:00, 1 per OT).","FIBA: unused timeouts don't carry; the scoring team can't take one after a goal in the last 2:00 unless play was interrupted.","","",0]]},{"n":4,"title":"Special situations — BLOB, SLOB, last-second plays","los":[["BB-6.4.A",2371,"Choose a baseline or sideline out-of-bounds set for a described need (quick two, a three, a safe inbound) and identify the primary and the safety.","Every inbound set has a scoring option and a safety; the 5-s count starts when the inbounder has the ball.","","",0],["BB-6.4.B",2372,"Given time on the clock for a last inbound, choose a feasible action (catch-and-shoot, tip, full-court pass, quick hit).","The clock starts on the touch inbounds, not the throw; with fractions of a second only a tip or a quick catch-and-release is realistic.","","",0],["BB-6.4.C",2373,"Defend a described last-second inbound: choose whether to guard the inbounder, switch everything, or deny the shooter.","Leaving the inbounder adds a defender; switching everything stops screens from freeing the shooter; up 3, take the three away first.","","",0]]}]},{"n":7,"title":"Rules and officiating","scope":"core","topics":[{"n":1,"title":"Clocks and violations","los":[["BB-7.1.A",2374,"Given a described sequence, state the shot-clock reset for the level (FIBA 24 / 14; NCAA men 30 / 20 off the rim in the frontcourt).","FIBA: frontcourt throw-in after a stoppage resets to 14 if 13 or fewer remain. NCAA men: ball hits the rim and the offense keeps it in the frontcourt ⇒ 20; in the backcourt ⇒ 30.","","",0],["BB-7.1.B",2375,"Identify the violation in a described play — 3 s, 5 s closely guarded, 5 s throw-in, 8 s backcourt, backcourt, travel — and its penalty.","FIBA: 3 s in the restricted area; 5 s closely guarded or to release a throw-in; 8 s to cross half-court.","","",0]]},{"n":2,"title":"Fouls and their penalties","los":[["BB-7.2.A",2376,"Given a level and a team-foul count, state the free throws awarded on a non-shooting foul.","NFHS: two shots from the 5th team foul per quarter, reset each quarter. NCAA men: 1-and-1 from the 7th, two from the 10th per half. NCAA women: two from the 5th per quarter. FIBA: two after 4 per quarter; OT fouls count to the 4th quarter.","","",0],["BB-7.2.B",2377,"State the free throws for a shooting foul (made two, missed two, missed three) and for an unsportsmanlike foul.","Made: count + 1; missed 2-pt: 2; missed 3-pt: 3. FIBA unsportsmanlike: free throws plus a frontcourt throw-in; two unsportsmanlike (or technical) fouls disqualify.","","",0],["BB-7.2.C",2378,"Judge whether a described late-game foul is a common foul or unsportsmanlike under FIBA criteria.","Unsportsmanlike: no legitimate attempt to play the ball, excessive contact, stopping a fast break, or contact from behind with no defender between the player and the basket.","","",0]]},{"n":3,"title":"Block/charge, goaltending and judgment calls","los":[["BB-7.3.A",2379,"Call a described block/charge play using the legal-guarding-position standard.","NCAA (2023-24): the defender must be in legal guarding position before the offensive player's plant foot lands to go airborne.","","",0],["BB-7.3.B",2380,"Call goaltending or basket interference in a described play and state the result.","Goaltending: touching a shot completely above the ring on its downward flight or after it hits the board. Defense ⇒ points awarded; offense ⇒ no points, throw-in to the opponent.","","",0],["BB-7.3.C",2381,"Use knowledge of officiating mechanics (crew positions, primary coverage areas) to predict which calls are likely missed and adjust tactics.","Each official covers a primary area; action outside it, or screened by bodies, is called less often.","","",0]]}]},{"n":8,"title":"Analytics","scope":"core","topics":[{"n":1,"title":"Possessions and efficiency","los":[["BB-8.1.A",2382,"Compute a team's possessions from a box score.","Poss ≈ FGA − ORB + TOV + 0.44·FTA; average the two teams' estimates for one game.","","",0],["BB-8.1.B",2383,"Compute points per possession, offensive and defensive rating (per 100), and net rating from a box score.","ORtg = 100·PTS/Poss; DRtg = 100·Opp PTS/Poss; net = ORtg − DRtg. Pace = possessions per 40 or 48 minutes.","","BB-8.1.A",0],["BB-8.1.C",2384,"Explain why per-possession numbers beat per-game numbers when comparing a fast team and a slow team, using a worked comparison.","Points per game mixes pace with efficiency; per-100 isolates efficiency.","","BB-8.1.B",0]]},{"n":2,"title":"Shooting efficiency","los":[["BB-8.2.A",2385,"Compute eFG% from FGM, 3PM and FGA, and explain why it exceeds FG% for three-point shooters.","eFG% = (FGM + 0.5·3PM)/FGA: a three counts as 1.5 makes.","","",0],["BB-8.2.B",2386,"Compute TS% and true shot attempts from PTS, FGA and FTA.","TS% = PTS / (2·(FGA + 0.44·FTA)); 0.44 reflects the mix of 2-shot, 3-shot and and-one trips (0.5 if all were 2-shot) and differs by league.","","",0],["BB-8.2.C",2387,"Compare two players' efficiency with FG%, eFG% and TS%, and say which measure fits the question.","FG% ignores threes and FTs; eFG% adds threes; TS% adds free throws.","","BB-8.2.A BB-8.2.B",0]]},{"n":3,"title":"The four factors","los":[["BB-8.3.A",2388,"Compute all four factors for both teams from a box score.","eFG%; TOV% = TOV/(FGA + 0.44·FTA + TOV); ORB% = ORB/(ORB + Opp DRB); FT rate = FT/FGA (bbref) or FTA/FGA (kenpom).","","BB-8.2.A",0],["BB-8.3.B",2389,"Given two teams' four factors, identify which factor decided the game and weigh it.","Oliver's approximate weights: shooting 40%, turnovers 25%, rebounding 20%, free throws 15%.","","BB-8.3.A",0],["BB-8.3.C",2390,"Translate a four-factors deficit into a coaching emphasis (shot selection, ball security, crashing, attacking the rim).","Each factor maps to a controllable habit; fix the largest weighted gap first.","","BB-8.3.B",0]]},{"n":4,"title":"Expected value of shots and decisions","los":[["BB-8.4.A",2391,"Compute the expected points of a shot from its make probability and value, and compare shot types (corner three, above-the-break three, mid-range, rim).","EV = p × points: 36% from three ≈ 1.08; 50% at two = 1.00; 40% mid-range = 0.80. Shooting fouls add value: fold in P(foul) × expected FT points.","","",0],["BB-8.4.B",2392,"Compute the break-even make percentage at which a three equals a given two, and use it to judge a shot choice.","Break-even p₃ = (2·p₂)/3; a 50% two equals a 33.3% three.","","BB-8.4.A",0],["BB-8.4.C",2393,"Include offensive rebounding in a shot's expected value and compare a quick shot with working for a better one.","EV ≈ p·v + (1 − p)·ORB%·PPP_second-chance; passing up a shot costs some turnover risk and clock.","","BB-8.4.A",0]]},{"n":5,"title":"Reading numbers responsibly","los":[["BB-8.5.A",2394,"Judge whether a described stat (a shooter's 3P%, a lineup's net rating, a late-game study) has enough sample to act on.","Three-point percentage and small-lineup ratings are noisy over a few hundred attempts or possessions; late-game samples are tiny and coaches choose when to foul.","","",0],["BB-8.5.B",2395,"Identify selection bias or role confounding in a described analytic claim (e.g. 'defensive stops are higher when X is on the floor').","Who plays, against whom and when is chosen, not random; on/off numbers carry teammates and opponents with them.","","",0]]}]},{"n":9,"title":"Scouting and film study","scope":"core","topics":[{"n":1,"title":"Personnel scouting","los":[["BB-9.1.A",2396,"From a described player profile (shot chart, hand, tendencies), write the defensive key: force direction, closeout type, ball-screen coverage.","A personnel key states what to take away and what to concede, in a few words players can use in the game.","","BB-3.3.A BB-4.2.A",0],["BB-9.1.B",2397,"Classify an opponent's players as shooter, driver, post or non-threat and set help rules from it.","Help off non-shooters, stay home on shooters; label each player so help rules follow.","","",0]]},{"n":2,"title":"Team scouting and film","los":[["BB-9.2.A",2398,"Identify an opponent's base offense, main sets and ATO tendencies from described film clips.","Tag first action, entry, and the shot it creates; repeated actions are the scout.","","",0],["BB-9.2.B",2399,"Identify an opponent's ball-screen coverage and help rules from described clips, and pick the counter you would run.","Read the screener's defender first; the coverage plus the tagger tells you the open pass.","","BB-4.1.A BB-2.2.A",0],["BB-9.2.C",2400,"Self-scout: from your own tagged possessions, find the action with the lowest points per possession and say what to change.","Rank actions by PPP with sample size; small samples flag where to look, not what to conclude.","","BB-8.1.B",0]]}]},{"n":10,"title":"Practice design and player development","scope":"extension","topics":[{"n":1,"title":"Long-term development and levels","los":[["BB-10.1.A",2401,"Place a described player on the USA Basketball level (Introductory, Foundational, Advanced, Performance) by skill mastery, not age, and name the matching LTAD stage.","Levels are by mastery; LTAD stages run Active Start (0–6), Fundamentals (6–9), Learning to Train (8–12), Training to Train (12–15), Training to Compete (14–17), Training to Win (17+).","","",0],["BB-10.1.B",2402,"Set the training-to-competition balance and position policy for a level.","Foundational 70:30; Advanced 60:40 shifting to 50:50; Performance 25:75. Foundational: teach position concepts but don't assign positions.","","",0],["BB-10.1.C",2403,"Sequence team concepts by level: what to teach before 5-on-5, when help-side defense enters, when positions are assigned.","Introductory: team principles only, no 5-on-5 yet, no on-ball defending; help-side comes later; positions may be assigned late in Advanced.","","",0]]},{"n":2,"title":"Designing practice for decisions","los":[["BB-10.2.A",2404,"Convert a principle (e.g. drive-and-kick reads) into a small-sided, competitive drill with live defenders and a scoring rule that rewards the right decision.","Decisions transfer from representative reps: live defense, game spacing, time pressure; scoring rewards the read, not just the make.","","",0],["BB-10.2.B",2405,"Build a practice plan with progression (1-on-1 → 2-on-2 → 3-on-3 → 5-on-5), time blocks and stated objectives for a given week.","Add players to add reads; every block names the objective it serves.","","",0],["BB-10.2.C",2406,"Write a short teaching cue for a skill or read and check that it names an observable action.","Cues like B.E.E.F. (balance, elbow, eyes, follow-through) compress a model into words a player can act on mid-rep.","","",0]]},{"n":3,"title":"Evaluating players and the program","los":[["BB-10.3.A",2407,"Design an evaluation of a player's decision-making (tagged reads correct / total) separate from shot-making.","A right read that misses is still a right read; grade decisions and outcomes separately.","","",0],["BB-10.3.B",2408,"Set season-level team goals from the four factors and track them per game.","Targets for each factor, on both ends, turn analytics into weekly practice priorities.","","BB-8.3.A",0]]}]}]},{"id":"swimming","title":"Swimming","code":"SW","track":"athletics","requires":[],"units":[{"n":1,"title":"Hydrodynamics and propulsion","scope":"core","topics":[{"n":1,"title":"Types of drag and how they scale","los":[["SW-1.1.A",2409,"Classify a described resistance (rough suit, wide kick, bow wave at the surface) as skin-friction, form (pressure) or wave drag.","Skin friction depends on surface; form drag on frontal area, shape and alignment; wave drag on speed and depth below the surface.","","",0],["SW-1.1.B",2410,"Compute how drag and the power to overcome it change when velocity changes by a given factor.","D = ½ρC_dAv²; P = Dv ∝ v³ — 5% faster costs ≈ 16% more power.","","",0],["SW-1.1.C",2411,"Explain why gliding and kicking underwater can be faster than swimming at the surface.","Wave drag is large at the surface and falls off steeply with depth (most of it gone by roughly 0.5 m).","","",0]]},{"n":2,"title":"Streamline and glide","los":[["SW-1.2.A",2412,"Describe a tight streamline and explain each element's effect on drag (stacked hands, arms squeezing ears, head neutral, pointed toes).","Each element reduces frontal area or flow separation; a raised head adds form drag.","","",0],["SW-1.2.B",2413,"Explain why a glide decelerates and when to start kicking off the wall.","Glide velocity decays as drag acts on body plus added mass; start kicking when glide speed drops toward kicking speed, not after.","","",0]]},{"n":3,"title":"How propulsion is made","los":[["SW-1.3.A",2414,"Explain propulsion as momentum given to water (Newton III) and say why a high-elbow catch helps.","Thrust = rate of backward momentum given to water; a vertical forearm adds paddle area facing backward early in the pull.","","",0],["SW-1.3.B",2415,"Contrast Counsilman's lift (Bernoulli sculling) model with the drag-dominant view and state what the evidence supports.","3-D studies of elite swimmers (Cappaert, Rushall, Sanders) found drag > lift through most of the pull in all strokes but breaststroke; hand paths are straighter than once taught, curvature mostly from body roll.","","",0],["SW-1.3.C",2416,"Explain propelling efficiency and why it can matter more than aerobic power.","Part of the work goes into moving water, not the body; Toussaint & Hollander modelled efficiency gains as worth more than a 10% rise in aerobic or anaerobic power.","","",0],["SW-1.3.D",2417,"Explain how the dolphin kick produces thrust from a whole-body wave.","A wave travelling head-to-toe with growing amplitude whips the feet; thrust comes mostly on the downkick, with the upkick also propulsive when the feet press water backward.","","",0]]}]},{"n":2,"title":"Freestyle and backstroke technique principles","scope":"core","topics":[{"n":1,"title":"Freestyle","los":[["SW-2.1.A",2418,"Describe the phases of the freestyle arm stroke (entry, catch, pull, push, recovery) and the purpose of each.","Propulsive force is concentrated from catch to push; entry and recovery set up the next pull and the body line.","","",0],["SW-2.1.B",2419,"Distinguish catch-up, front-quadrant and opposition timing and match each to distance.","More overlap ⇒ longer DPS, lower SR (distance); less overlap ⇒ continuous propulsion, higher SR (sprint).","","",0],["SW-2.1.C",2420,"Diagnose a freestyle fault from a description (crossover entry, dropped elbow, scissor kick on breath, lifted head) and choose the correction.","Each fault either adds drag or wastes impulse; fix the root cause, usually upstream in head or entry.","","",0]]},{"n":2,"title":"Backstroke","los":[["SW-2.2.A",2421,"Describe the backstroke catch (little-finger entry, bent-arm pull) and why rotation lets the arm catch deep enough.","Rotation of ~45° each side keeps the pull under the body instead of sweeping wide at the surface.","","",0],["SW-2.2.B",2422,"Diagnose a backstroke fault (sitting hips, overreaching past the head, flat body) and choose the correction.","Head still and level, hips at the surface; entry in line with the shoulder.","","",0]]}]},{"n":3,"title":"Butterfly in depth","scope":"core","topics":[{"n":1,"title":"Body wave and the axis at the hips","los":[["SW-3.1.A",2423,"Describe the butterfly body wave and say where the axis sits and what moves forward vs up and down.","The wave pivots near the hips; hips stay at or near the surface; the chest presses to lift the hips; the head leads the wave.","","",0],["SW-3.1.B",2424,"Explain why over-undulation slows the stroke.","Large vertical excursion adds form and wave drag, deepens the catch and lowers tempo; energy goes up and down instead of forward.","","",0]]},{"n":2,"title":"Arms, kick and their timing","los":[["SW-3.2.A",2425,"State when each of the two kicks per cycle happens and what each does.","Kick 1 at hand entry lifts the hips and balances; kick 2 as the hands push and exit is the more propulsive and lifts the shoulders for recovery.","","",0],["SW-3.2.B",2426,"Describe the fly pull path from entry to exit and where the high-elbow catch is set.","Hands enter in front of the shoulders, set a high-elbow catch just outside them, pull under the body and push past the hips.","","",0],["SW-3.2.C",2427,"Diagnose kick-kick-pull timing from a description and choose the correction.","Both kicks before the catch force an arched back and a downward push; cue one kick, then let the small second kick come as the hands exit — 'kick the hands in, kick the hands out'.","","",0]]},{"n":3,"title":"Breathing and recovery","los":[["SW-3.3.A",2428,"Describe when the breath starts and ends relative to the pull and recovery.","Head lift begins with the pull, the inhale comes as the mouth clears at the push, and the face returns before the hands enter; chin stays near the waterline.","","",0],["SW-3.3.B",2429,"Diagnose late breathing or a high head lift from a description and choose the correction.","A breath that starts at the end of the pull locks neck and shoulders and drops the hips; time the head with the catch and breathe forward, low.","","",0],["SW-3.3.C",2430,"Choose a breathing pattern (every stroke, 1-up-1-down, 2-down) for a race distance and justify it from drag and oxygen cost.","Each breath adds drag and disrupts the wave; fewer breaths for 50s, regular breathing to keep the 200 aerobic.","","",0]]},{"n":4,"title":"Fly faults and fatigue","los":[["SW-3.4.A",2431,"Diagnose a fly fault from a description (crashing entry, dropped elbow, bent-knee kick, arms dragging through recovery) and choose the correction.","Crashing entry ⇒ place hands and let chest submerge; dropped elbow ⇒ pitch palms and forearms back with fingertips down; bent knees ⇒ think hips at the surface, not 'kick harder'.","","",0],["SW-3.4.B",2461,"Predict how fly technique degrades over the last 50 of a 200 and which cue protects speed best.","Recovery drops, hips sink, kick 2 disappears, SR falls; holding hip height and kick 2 protects DPS.","","SW-7.2.B",0]]},{"n":5,"title":"Butterfly rules","los":[["SW-3.5.A",2432,"Call legal or illegal: a described fly stroke with alternating kick, a breaststroke kick, or arms recovered under water.","SW 8.2: both arms forward together over the water, back together under; SW 8.3: leg movements simultaneous, no breaststroke kick (FINA, USA Swimming).","","",0],["SW-3.5.B",2433,"Call legal or illegal for a Masters butterfly using breaststroke kick, and state how USMS differs from World Aquatics.","USMS 101.3.3: breaststroke kick may be used exclusively or interchangeably with dolphin kick, one per arm pull except before turn and finish; illegal under SW 8.3.","","",0],["SW-3.5.C",2434,"Call legal or illegal: a described fly turn or finish touch (one hand, stacked hands, hands under water, staggered touch).","SW 8.4: both hands, separated and simultaneous, at, above or below the surface; 'separated' means not stacked — no visible gap needed.","","",0],["SW-3.5.D",2435,"Call legal or illegal: body position during fly underwaters (on the side, on the back before the first pull).","SW 8.1: from the first arm stroke after start or turn the body stays on the breast; underwater kicking on the side is allowed.","","",0]]}]},{"n":4,"title":"Breaststroke and individual medley","scope":"core","topics":[{"n":1,"title":"Breaststroke technique","los":[["SW-4.1.A",2436,"Describe breaststroke timing (pull, breathe, kick, glide) and explain why it is the most drag-sensitive stroke.","The recovery of arms and legs happens under water against the flow; the stroke's speed swings most within a cycle, so a streamlined glide carries the cycle.","","",0],["SW-4.1.B",2437,"Diagnose a breaststroke fault (knees drawn under the hips, late kick, wide pull past the shoulders) and choose the correction.","Heels to seat with knees narrow cuts frontal area; kick as the hands shoot forward.","","",0]]},{"n":2,"title":"Breaststroke and medley rules","los":[["SW-4.2.A",2438,"Call legal or illegal: a described breaststroke pull-out (number of dolphin kicks, when the head surfaces).","SW 7.1: one butterfly kick allowed before the first breaststroke kick; head must break the surface before the hands turn inward at the widest part of the second stroke.","","",0],["SW-4.2.B",2439,"Call legal or illegal: a described breaststroke cycle, kick or touch.","SW 7.2: one arm stroke then one leg kick; SW 7.4–7.5 simultaneous legs, no downward fly kick; SW 7.6 two hands, separated, simultaneous.","","",0],["SW-4.2.C",2440,"Call legal or illegal: a described IM or medley-relay transition (order, stroke on the free leg, touch at each change).","SW 9.1 IM: fly, back, breast, free; SW 9.3 medley relay: back, breast, fly, free; SW 9.4 each section finishes by its own stroke's rule; the free leg of IM can't be swum on the back.","","",0]]},{"n":3,"title":"Racing the IM","los":[["SW-4.3.A",2441,"Compute the split share of each stroke in a 200 or 400 IM and identify the weak leg against a reference swimmer.","Share_i = t_i / Σt; compare leg differentials, not totals.","","",0]]}]},{"n":5,"title":"Starts, turns and underwaters","scope":"core","topics":[{"n":1,"title":"Starts","los":[["SW-5.1.A",2442,"Break a start into reaction, block, flight and entry phases and say what each contributes to 15 m time.","Reaction ≈ 0.6–0.7 s for elite; the race is won in the push impulse and a clean, single-hole entry that keeps speed.","","",0],["SW-5.1.B",2443,"Explain how entry angle and depth trade wave drag against lost speed and time to surface.","Too flat ⇒ wave drag and splash; too deep ⇒ longer path back up; the target is a depth below most wave drag with a short, steady breakout.","","SW-1.1.C",0],["SW-5.1.C",2444,"Call legal or illegal: a described start (moving before the signal, false start after the signal, Masters in-water start).","SW 4.4: starting before the signal is a DQ, judged when the signal has sounded; USMS 101.1.1 allows in-water starts facing any direction.","","",0]]},{"n":2,"title":"Turns","los":[["SW-5.2.A",2445,"Describe an open (two-hand) turn for fly and breast and explain how to shorten wall time.","Touch, drop one elbow, tuck knees tight, throw the head and arm over; a small rotation radius turns faster (angular momentum).","","",0],["SW-5.2.B",2446,"Compute wall time (in-time + out-time) from 5 m in and 5 m out splits and compare two turns.","Turn time = time from 5 m before the wall to 5 m after; compare at equal distances.","","",0],["SW-5.2.C",2447,"Call legal or illegal: a described backstroke flip turn (shoulders past vertical, extra kicks or glides on the front, pushing off on the stomach).","SW 6.4: after leaving the back, a continuous single or double arm pull starts the turn; touch the wall; be back on the back when leaving the wall.","","",0]]},{"n":3,"title":"Underwaters and the 15 m rule","los":[["SW-5.3.A",2448,"Call legal or illegal: a described fly, back or free breakout relative to the 15 m mark.","SW 5.3, 6.3, 8.5: completely submerged ≤ 15 m after start and each turn; the head must break the surface by 15 m; one arm pull under water is permitted in fly (SW 8.5).","","",0],["SW-5.3.B",2456,"Compute whether an underwater segment is faster than swimming the same distance, from underwater and surface velocities.","Δt = d/v_swim − d/v_UW; stay under while v_UW > v_swim and the kick is sustainable.","","SW-7.1.A",0],["SW-5.3.C",2449,"Choose the number of underwater dolphin kicks for each wall of a 100 and 200 fly and justify it.","Underwaters cost oxygen; holding the same count on every wall needs a count you can repeat when tired.","","",0],["SW-5.3.D",2450,"Explain the breakout: why the first stroke should begin just before surfacing.","Rising at kicking speed and stroking as the head breaks keeps velocity; surfacing then pausing loses the underwater speed.","","",0]]}]},{"n":6,"title":"Rules, officiating and disqualifications","scope":"core","topics":[{"n":1,"title":"Race rules and relays","los":[["SW-6.1.A",2451,"Call legal or illegal: a described race incident (pulling on the lane rope, changing lanes, standing on the bottom in free, pace device).","SW 10.4 same lane; SW 10.7 no pulling on the lane rope; SW 10.9 no aids or tape; SW 10.18 no pace-making device.","","",0],["SW-6.1.B",2452,"Call legal or illegal: a described relay exchange from touch time and the next swimmer's feet-off time.","SW 10.11 / USA 101.7.3F: feet must stay on the platform until the incoming swimmer touches; exchange = feet-off − touch, negative = early. Electronic platforms are confirmed by human judges.","","",0],["SW-6.1.C",2453,"Compute a relay leg's split and its reaction-time gain over a flat start from a result sheet.","Leg split = cumulative time at its touch − previous touch; relay legs run fast because the exchange (~0.2–0.3 s) replaces a reaction to the gun.","","",0]]},{"n":2,"title":"How officiating works","los":[["SW-6.2.A",2454,"Explain who can disqualify, what they must see, and why the benefit of the doubt goes to the swimmer.","Stroke and turn judges report what they observe in their jurisdiction; the referee decides; an infraction must be seen, not inferred.","","",0]]}]},{"n":7,"title":"Race analysis and pacing","scope":"core","topics":[{"n":1,"title":"Velocity, pace and course conversion","los":[["SW-7.1.A",2455,"Compute average velocity (m/s) and pace per 100 from a distance and time.","v = d/t; pace/100 = 100·t/d; 1 yd = 0.9144 m.","","",0],["SW-7.1.B",2457,"Compute splits and split differentials from cumulative times and classify a swim as even, positive or negative split.","Split = cumulative_i − cumulative_(i−1); negative split ⇒ second half faster than the first.","","",0],["SW-7.1.C",2458,"Compute clean-swimming velocity for a 25 or 50 by removing the 15 m off the wall and the 5 m in.","Clean velocity = mid-pool distance / mid-pool time; it isolates swimming from walls.","","SW-7.1.A",0]]},{"n":2,"title":"Stroke rate, distance per stroke and stroke index","los":[["SW-7.2.A",2459,"Compute stroke rate (cycles/min), distance per cycle and velocity from any two of them, or from a cycle count and lap time.","v = SR·DPS with SR in cycles/s; SR (cyc/min) = 60 / cycle time; DPS = distance swum / cycles.","","",0],["SW-7.2.B",2460,"Explain from data whether a swimmer slowed in a race by losing stroke rate or distance per stroke.","Toussaint 2006: in a 100 m sprint, velocity fell 12% while SR fell 11% — slowing tracked SR, not SL.","","SW-7.2.A",0],["SW-7.2.C",2462,"Compute stroke index (v × DPS) and compare the efficiency of two swims at different speeds.","SI = v·DPS (m²/s); higher SI at the same speed means more distance per cycle.","","",0],["SW-7.2.D",2463,"Predict the new velocity when SR or DPS changes by a given percentage, and the trade-off needed to hold pace.","(1 + Δv) = (1 + ΔSR)(1 + ΔDPS); +5% SR with −5% DPS ≈ −0.25% speed.","","",0]]},{"n":3,"title":"Pacing strategy","los":[["SW-7.3.A",2464,"Choose a pacing profile for a 100 and 200 fly and justify it from energy supply and drag.","Going out too fast spends glycolytic capacity early and drives acidosis; since power ∝ v³, uneven pace costs more energy than even pace for the same average speed.","","",0],["SW-7.3.B",2465,"Build target splits for a goal time with a chosen front-half/back-half differential.","Split targets sum to the goal; first 50 includes the dive (~1.5–2.5 s faster than later 50s).","","SW-7.1.B",0],["SW-7.3.C",2466,"Diagnose a pacing error from a split sheet (dying third 50, flat middle, too-easy start) and prescribe the change.","Compare each split to the plan; the largest drop-off shows where effort or technique broke.","","",0]]}]},{"n":8,"title":"Energy systems and training physiology","scope":"core","topics":[{"n":1,"title":"The three energy systems","los":[["SW-8.1.A",2467,"Match each energy system to its fuel, rate, capacity and time course.","ATP-CP: fastest, ~10–15 s; anaerobic glycolysis: fast, makes lactate and H⁺, limits after ~30–90 s; aerobic: slowest rate, largest capacity, carbohydrate then fat.","","",0],["SW-8.1.B",2468,"Estimate the aerobic/anaerobic mix of a race from its duration.","Contributions cross near ~75 s of all-out effort; a 50 is mostly anaerobic, a 200 mostly aerobic, a 100 fly near even.","","SW-8.1.A",0]]},{"n":2,"title":"Thresholds and adaptation","los":[["SW-8.2.A",2469,"Define lactate threshold and maximal lactate steady state and explain why they anchor training paces.","The highest pace where lactate production and removal balance; above it, lactate climbs and time to exhaustion shortens sharply.","","",0],["SW-8.2.B",2470,"Match a training stimulus to the adaptation it produces (capillarity, mitochondria, buffering, power).","Basic and threshold work build aerobic capacity; lactate tolerance builds buffering; short maximal sprints build power and rate of glycolysis.","","",0]]}]},{"n":9,"title":"Training science — CSS, intervals, periodization and taper","scope":"core","topics":[{"n":1,"title":"Critical swim speed","los":[["SW-9.1.A",2471,"Compute CSS (m/s and pace per 100) from 400 and 200 time-trial times.","CSS = (400 − 200)/(T₄₀₀ − T₂₀₀) m/s; pace/100 = (T₄₀₀ − T₂₀₀)/2 s. Variant: 350/(T₄₀₀ − T₅₀).","","",0],["SW-9.1.B",2472,"Compute target paces per 100 for a training zone given CSS and a %CSS.","Pace/100 = 100 / (f·CSS); zones roughly 70% recovery, 80–87% endurance, ~95% threshold, 100–110% VO₂max.","","SW-9.1.A",0],["SW-9.1.C",2473,"Explain what CSS approximates and its limits, including for butterfly.","CSS approximates MLSS within a few %; it overestimates for poorly paced trials and is stroke-specific — test fly separately.","","",0]]},{"n":2,"title":"Interval training","los":[["SW-9.2.A",2474,"Compute rest per repeat, work:rest ratio and total set time from a set's distance, send-off and swim times.","Rest = send-off − swim time; set time = repeats × send-off; W:R = swim/rest.","","",0],["SW-9.2.B",2475,"Classify a described set (e.g. 10×100 @ threshold on :15 rest; 6×50 max on 3:00) into its training category.","Maglischo: basic (≥1000, 4–5 s/100 slower than threshold, :05–:30 rest); threshold (2000–3000, :10–:30); lactate tolerance (75–200 repeats, 3–7 min rest, 600–1000 total); lactate production (25–50, 1–3 min); power (5–25, 100–300 total).","","",0],["SW-9.2.C",2476,"Explain why rest interval, not distance, mostly sets which system a repeat trains.","Short rest keeps the aerobic system loaded; long rest restores phosphagens and lets each repeat go glycolytic or maximal.","","",0]]},{"n":3,"title":"Periodization and load","los":[["SW-9.3.A",2477,"Lay out a season into macro-, meso- and microcycles around a target meet.","General prep → specific prep → competition → taper; volume peaks before intensity peaks.","","",0],["SW-9.3.B",2478,"Compute a week's volume by training category and compare it with a recommended balance.","Maglischo: warm-up/swim-down 15–20%, threshold + overload 20–25%, basic 40–50%, sprint 5–10%.","","",0]]},{"n":4,"title":"Taper","los":[["SW-9.4.A",2479,"Design a taper by the evidence: duration, volume cut, intensity and frequency.","Bosquet 2007: ~2 weeks, cut volume 41–60% exponentially, keep intensity and session frequency.","","",0],["SW-9.4.B",2480,"Compute daily yardage for an exponential taper from starting volume and target reduction.","V(t) = V₀·e^(−t/τ); choose τ so V(end) = (1 − cut)·V₀.","","SW-9.4.A",0]]}]},{"n":10,"title":"Self-analysis and video critique","scope":"core","topics":[{"n":1,"title":"Getting numbers from video","los":[["SW-10.1.A",2481,"Compute cycle time and stroke rate from a frame count and frame rate.","Cycle time = frames / fps; SR (cyc/min) = 60·fps / frames.","","SW-7.2.A",0],["SW-10.1.B",2482,"Compute the time and distance resolution of a camera at a given swim speed and judge whether it can resolve a phase.","Δt = 1/fps; Δx = v/fps — at 2 m/s, 30 fps ≈ 6.7 cm per frame, 120 fps ≈ 1.7 cm.","","",0],["SW-10.1.C",2483,"Choose camera angles (side underwater, front, overhead) to see a given fault, and say what parallax hides.","Side view shows timing and depth; front view shows symmetry and hand path; off-axis views distort angles.","","",0]]},{"n":2,"title":"Critiquing your own stroke","los":[["SW-10.2.A",2484,"Mark the key events (entry, catch, push, exit, kick 1, kick 2, breath) on a fly clip and measure their timing.","Express events as % of cycle time so clips at different speeds compare.","","SW-3.2.A",0],["SW-10.2.B",2485,"Diagnose a fault from a described clip, rank it by cost, and choose one correction to work on first.","Fix the fault that costs the most net force first, usually body position or timing before hand path.","","",0],["SW-10.2.C",2486,"Design a before/after test (stroke count, SR, 25 time at fixed effort) that shows whether a correction worked.","Hold effort or SR constant and measure the other; one change at a time; repeat trials to beat noise.","","",0]]}]},{"n":11,"title":"Practice design","scope":"core","topics":[{"n":1,"title":"Building a session","los":[["SW-11.1.A",2487,"Write a session with warm-up, pre-set, main set and cool-down, each with a stated purpose.","Warm-up raises muscle temperature and rehearses technique; the main set carries the day's training category; cool-down clears metabolites.","","",0],["SW-11.1.B",2488,"Compute a written workout's total yardage and duration from its sets and send-offs.","Total = Σ repeats × distance; duration = Σ repeats × send-off + set rests.","","SW-9.2.A",0],["SW-11.1.C",2489,"Choose send-offs for a set from a CSS or best-time pace and the intended rest.","Send-off = target swim time + rest, rounded to a clock-friendly :05.","","SW-9.1.B",0]]},{"n":2,"title":"Technique work inside training","los":[["SW-11.2.A",2490,"Choose a drill that isolates a given fault (one-arm fly, 3-3-3, kick on side, head-lead body dolphin) and say what it trains and what it can't.","A drill isolates one element; transfer needs a bridge back to full stroke at race tempo.","","",0],["SW-11.2.B",2491,"Design a set that trains a stroke-count or SR target (e.g. hold count while descending time).","Fix one of SR or DPS and progress the other; v = SR·DPS tells you which has to give.","","SW-7.2.D",0]]},{"n":3,"title":"Fitting training to a Masters / club life","los":[["SW-11.3.A",2492,"Adapt a week of 3+ mile days to class and work load so that the hard sessions stay hard and the easy ones stay easy.","Polarised weeks (most volume easy, a few true hard sessions) beat uniform moderate effort for both performance and recovery.","","",0]]}]},{"n":12,"title":"Coaching others","scope":"extension","topics":[{"n":1,"title":"Teaching progressions","los":[["SW-12.1.A",2493,"Sequence a butterfly teaching progression from body dolphin to full stroke and say what each step must show before moving on.","Body wave → kick on front with arms forward → single-arm with timing → full stroke short distances; advance on a visible criterion, not a count of days.","","",0],["SW-12.1.B",2494,"Give feedback on a stroke with one cue, framed as an external focus.","External cues ('push the water to your feet') usually transfer better than internal ones ('bend your elbow 90°').","","",0]]},{"n":2,"title":"Planning for a group","los":[["SW-12.2.A",2495,"Write a set that runs across lanes with different speeds using a common clock and adjusted distances or send-offs.","Equal time, different distance keeps the group together; pace each lane off its own CSS.","","SW-11.1.C",0],["SW-12.2.B",2496,"Plan a club season that serves sprinters, distance and IM swimmers in the same group.","Shared aerobic base, then split sets by event group; key meets set the taper calendar.","","",0]]}]}]},{"id":"wushu","title":"Wushu","code":"WS","track":"athletics","requires":[],"units":[{"n":1,"title":"Foundations (jibengong)","scope":"core","topics":[{"n":1,"title":"Stances (bu xing 步型)","los":[["WS-1.1.A",2497,"Identify a changquan stance from its description and give its pinyin, characters and English name (drillable both directions).","Gongbu 弓步 bow · mabu 马步 horse · xubu 虚步 empty · pubu 仆步 drop · xiebu 歇步 cross-legged crouch · zuopan 坐盘 cross-legged sitting.","","",0],["WS-1.1.B",2498,"State the standard alignment of gongbu and mabu and name the deduction criteria that test it.","Gongbu: front knee over instep, front thigh level, rear leg straight, rear sole flat, rear foot turned in (code 50). Mabu: feet wider than shoulders and parallel, thighs level, knees not caving, heels down, toes not out ≥ 45° (code 51).","","",0],["WS-1.1.C",2499,"State the standard alignment of xubu, pubu and xiebu and identify which standard a described stance breaks.","Xubu: weight on the rear leg, rear thigh level, rear heel down (52). Pubu: squatting thigh on calf, extended leg straight, extended foot turned in and flat (53). Xiebu: legs crossed, buttock resting on the rear calf (54).","","",0],["WS-1.1.D",2500,"Hold each standard stance for time and film it front and side, checking every criterion.","Stance holds (zhan zhuang) build the leg endurance that keeps thighs level late in a routine.","","",0]]},{"n":2,"title":"Hand forms (shou xing 手型)","los":[["WS-1.2.A",2501,"Identify a hand form from its description and name it in Chinese and English, including the nanquan forms.","Quan 拳 fist · zhang 掌 palm · gou 勾 hook · jianzhi 剑指 sword fingers; nanquan adds hu zhao 虎爪 tiger claw, he zui 鹤嘴 crane's beak, single-finger palm.","","",0],["WS-1.2.B",2502,"Assign the code for a described hand-form fault.","01 fist face uneven or thumb not on the middle finger · 02 palm fingers apart or thumb not tucked · 03 hook fingers not pinched or wrist not fully hooked · 04 sword fingers not straight and together. 0.1 each.","","WS-1.2.A",0]]},{"n":3,"title":"Footwork (bu fa 步法)","los":[["WS-1.3.A",2503,"Identify a step from its description and name it in Chinese and English.","Shangbu 上步 step up · tuibu 退步 step back · gaibu 盖步 cover step (in front) · chabu 插步 insert step (behind) · jibu 击步 strike-hop · genbu 跟步 follow-up step · qilinbu 麒麟步 unicorn step (nanquan).","","",0],["WS-1.3.B",2504,"Explain why the centre of gravity should not bob during stepping, and assign the taiji step fault code.","Level CoM keeps the next technique available and reads as control; taiji code 59: knee–toe misaligned, foot dragged, CoM rises/falls, foot raised too high.","","",0]]},{"n":4,"title":"Flexibility and basic leg techniques (tui fa 腿法)","los":[["WS-1.4.A",2505,"Identify a basic kick from its description (path, contact surface, straight or bent) and name it in Chinese and English.","Straight-leg swings: zhengtitui 正踢腿 front stretch, waibaitui 外摆腿 outside crescent, lihetui 里合腿 inside crescent. Bent-straight: tantui 弹腿 snap, dengtui 蹬腿 heel push, chuaitui 踹腿 side kick. Slaps: paijiao 拍脚. Sweeps: qiansaotui 前扫腿, housaotui 后扫腿.","","",0],["WS-1.4.B",2506,"Assign the code for a described kick or sweep fault.","20 front sweep: supporting thigh above level, sweeping sole lifts, sweeping leg bent ≥ 45° · 21 back sweep · 23 snap/heel/side kick not fully straightened · 24 stretch kick: knee bent at apex or supporting heel up · 25 slap kick: toes below shoulder or slap missed.","","WS-1.4.A",0],["WS-1.4.C",2507,"Contrast a TKD kick with its nearest wushu counterpart and name the habit that will cost a deduction.","TKD chambers and strikes with the ball/instep; wushu straight-leg kicks swing from the hip with a locked knee and slap the foot. A chambered 'stretch kick' bends at the apex (code 24); a TKD 'tornado' is a spinning roundhouse, a wushu xuanfengjiao is an inside-crescent slap.","","",0],["WS-1.4.D",2508,"Plan a flexibility block (dynamic before, static after) that targets the ranges that limit front split, pubu and slap height.","Hamstrings and hip flexors gate split and stretch-kick height; adductors and ankle dorsiflexion gate pubu. Dynamic swings warm up; long static holds belong after training.","","",0]]}]},{"n":2,"title":"Changquan (long fist)","scope":"core","topics":[{"n":1,"title":"Principles of changquan","los":[["WS-2.1.A",2509,"Explain changquan's defining qualities and how each shows in a stance, a kick and a jump.","Long extension, speed, height and clear stops; derived from chaquan, huaquan, hongquan and Shaolin. Extended limbs, high kicks, big jumps, sharp dong–jing (motion–stillness) contrast.","","",0],["WS-2.1.B",2510,"Match each of the twelve changquan 'shapes' (十二型) to the quality it demands.","动如涛 move like waves · 静如岳 still like a mountain · 起如猿 rise like an ape · 落如鹊 land like a magpie · 立如鸡 stand like a rooster · 站如松 stand like a pine · 转如轮 turn like a wheel · 折如弓 bend like a bow · 轻如叶 light as a leaf · 重如铁 heavy as iron · 缓如鹰 slow like a hawk · 快如风 fast as wind.","","",0]]},{"n":2,"title":"Changquan techniques and combinations","los":[["WS-2.2.A",2511,"Name the hand and leg methods in a described changquan combination and state the stance each must finish in.","Chongquan 冲拳 punch, tuizhang 推掌 push palm, liangzhang 亮掌 flash palm; each strike arrives with the stance, not after it.","","WS-1.1.A WS-1.2.A",0],["WS-2.2.B",2512,"Perform a basic changquan combination to standard, filmed, and self-score it against the stance and hand-form codes.","Self-scoring with the A-codes is the cheapest feedback loop: one code per fault per occurrence.","","",0]]},{"n":3,"title":"Standard changquan routines","los":[["WS-2.3.A",2513,"Identify which standard routine set a described changquan routine belongs to and what it is used for (compulsory event, junior Group B, Duanwei exam).","The 1989 CWA-approved international set covers changquan, nanquan, taijiquan, daoshu, jianshu, gunshu, qiangshu; compulsory routines remove choreography choice so judges compare like with like.","","",0],["WS-2.3.B",2514,"Learn a compulsory changquan routine section by section and log which movements fall under which deduction codes.","Mapping each movement to its codes turns a routine into a checklist of judgeable standards.","","",0]]}]},{"n":3,"title":"Nanquan (southern fist)","scope":"core","topics":[{"n":1,"title":"Principles and stances of nanquan","los":[["WS-3.1.A",2515,"Explain how nanquan differs from changquan in stance height, power and acrobatics.","From Hung Ga, Choy Li Fut and similar: fewer acrobatics and less flexibility demand, more leg stability and short explosive power from legs–hips–shoulders; vocal fa sheng 发声 is part of the style.","","",0],["WS-3.1.B",2516,"Identify a nanquan stance from its description, name it, and state how its thigh standard differs from changquan.","Diebu 蝶步 butterfly stance, guibu 跪步 kneeling, qilongbu 骑龙步 dragon-riding join gongbu, mabu, xubu, pubu. Nanquan thighs sit 0–45° above level (codes 50–52, 57), not flat as in changquan.","","WS-1.1.B",0],["WS-3.1.C",2517,"Assign the code for a described nanquan stance fault.","55 diebu: inner calf or heel of the kneeling leg off the carpet · 56 kneeling: knee on carpet or buttock off calf · 57 dragon-riding: rear knee on carpet or front thigh out of range.","","WS-3.1.B",0]]},{"n":2,"title":"Bridge, hand and leg methods","los":[["WS-3.2.A",2518,"List the mandatory nanquan techniques an optional routine must contain and identify a missing one in a described routine.","Tiger claw; guagai quan 挂盖拳 and pao quan 抛拳; gun qiao 滚桥 rolling bridge; six stances (gong, ma, pu, xu, die, qilong); qilinbu; heng ding tui 横钉腿 horizontal nail kick. Missing a mandatory technique is a code-80 deduction.","","",0],["WS-3.2.B",2519,"Explain what bridge arms (qiao 桥) do and why short power (duan jin) needs a rooted stance.","The forearm bridge controls the opponent's arm at close range; with little travel, force must come from ground reaction through a fixed base — a rising stance bleeds it.","","",0]]}]},{"n":4,"title":"Taijiquan","scope":"core","topics":[{"n":1,"title":"Principles of competition taijiquan","los":[["WS-4.1.A",2520,"Explain the body-method requirements of taijiquan and assign the posture code for a described fault.","Head upright, shoulders sunk, elbows down, armpits open, back not rounded, buttocks not out; code 05 hand technique (elbow lifted, arm locked, armpit closed), 06 posture (shrugged, rounded, twisted, protruding).","","",0],["WS-4.1.B",2521,"Identify which taiji source styles a competition routine draws on and what that means for its look.","Competition taiji is largely Yang-style with Chen, Wu, Wu (Hao) and Sun elements; it adds balances and jumps and is performed to music.","","",0],["WS-4.1.C",2522,"Explain why taiji demands continuity and a level centre of gravity, and how a judge would see a break.","Taiji power is continuous transfer; a pause before a difficulty element (code 83) or a bob in the CoM (59) shows the movement was not connected.","","",0]]},{"n":2,"title":"Standard taiji routines","los":[["WS-4.2.A",2523,"Match a standard taiji routine to its name and competition time limit.","24-form simplified and 42-form taijijian: 4–5 min; 42-form taijiquan and style routines: 5–6 min; 32-form taijijian: 3–4 min (iwuf-2024).","","",0],["WS-4.2.B",2524,"Perform the 24-form with continuous tempo, filmed, and check stance and step codes 50–53 and 59.","Taiji stance standards differ: bow-stance rear knee may not collapse inward; empty-stance front heel may not touch.","","",0]]}]},{"n":5,"title":"Weapons (qi xie 器械)","scope":"core","topics":[{"n":1,"title":"Short weapons — jian and dao","los":[["WS-5.1.A",2525,"Identify a sword or broadsword method from its description and name it in Chinese and English.","Jian 剑: ci 刺 thrust, pi 劈 chop, liao 撩 upward cut, dian 点 point, beng 崩 snap, gua 挂 hook-parry, chou/dai 抽带 draw. Dao 刀: chantou 缠头 and guonao 裹脑 wrap around head, pi, kan 砍, hua 花 flower.","","",0],["WS-5.1.B",2526,"Explain the stylistic contrast between jian and dao.","'刀如猛虎，剑如飞凤' — broadsword fierce like a tiger, straight sword graceful like a flying phoenix: dao drives with the body, jian is light with precise tip work.","","",0],["WS-5.1.C",2527,"Assign the code for a described jian or dao fault.","60 hook-parry/uppercut without a clear vertical circle · 61 finger touching the blade on the guard · 62 dao back not close to the body in chantou/guonao · 68 jian envelopment tip not tracing a circle.","","",0]]},{"n":2,"title":"Long weapons — gun and qiang","los":[["WS-5.2.A",2528,"Identify a staff or spear method from its description and name it.","Qiang 枪: lan 拦, na 拿, zha 扎 (block, seize, thrust); gun 棍: pi, beng, pao, horizontal and vertical wuhua 舞花 (figure-8).","","",0],["WS-5.2.B",2529,"Assign the code for a described gun or qiang fault.","63 spear: head not in a defined arc, tail protruding past the rear hand, thrust not level · 64 horizontal windmill without a clear circle · 65 vertical figure-8 not in a vertical plane · 67 nangun plant: end not planted or tip below head.","","",0],["WS-5.2.C",2530,"Explain why the spear's lan–na–zha is the root method and why the spear is called the king of weapons.","Lan and na deflect by a circle at the head, zha thrusts along the line; long reach plus control of the line dominates.","","",0]]},{"n":3,"title":"Weapon errors and safety","los":[["WS-5.3.A",2531,"Assign the code and value for a described weapon accident.","73 weapon touches floor, loses grip, strikes body or deforms — 0.1 · 74 breaks — 0.2 · 75 dropped — 0.3 · 76 tassel/ribbon entangles or ornament falls — 0.1 · 66 throw-catch not caught correctly.","","",0],["WS-5.3.B",2563,"Explain how weapon mass and length change the timing of a body technique and the safe distance for a partner.","A longer, heavier weapon has more rotational inertia: it starts late and stops late, so the body leads and the weapon follows; partner distance is measured to the tip, not the hand.","","WS-9.1.B",0]]}]},{"n":6,"title":"Jumps, balances and difficulty elements (nandu 难度)","scope":"core","topics":[{"n":1,"title":"The difficulty code system","los":[["WS-6.1.A",2532,"Read a difficulty code and say its family and grade (e.g. 323A, 143B, 447A).","First digit: 1 balance · 2 leg technique · 3 jump · 4 tumbling/ground. Letter: A 0.2 · B 0.3 · C 0.4.","","",0],["WS-6.1.B",2533,"Identify a jump from its description and give its name (pinyin, English) and changquan code.","Tengkong feijiao 腾空飞脚 jumping slap 312A · xuanfengjiao 旋风脚 tornado 360 323A / 540 323B / 720 323C · tengkong bailian 腾空摆莲 lotus 360 324A / 540 324B / 720 324C · xuanzi 旋子 butterfly 333A · xuanzi zhuanti 旋子转体 butterfly twist 360 353B / 720 353C · cekongfan 侧空翻 aerial cartwheel 335A, with 360 twist 355B.","","",0],["WS-6.1.C",2534,"Identify a balance or sweep difficulty from its description and give its code and value.","111A grasp-foot balance (leg vertical) · 112A side-kick catch · 112C back-kick hold · 123A backward balance · 133B arms-spread balance · 153A ocean-exploring · 163A gazing-at-moon · 244A front sweep 540 · 244B 900.","","",0],["WS-6.1.D",2535,"Give the value of the same code in different events and explain why it differs.","Taiji grades rotation lower: taiji 323A = tornado 180, 323B = 360, 323C = 540, while changquan 323A = 360. Each event's table is its own scale.","","WS-6.1.B",0],["WS-6.1.E",2536,"Identify the nanquan and taiji-specific difficulty elements from their descriptions.","Nanquan: 346A stationary back flip, 346B single-step back flip, 415A jumping double side kick, 423A jumping cross-legged 360 to side fall, 447A carp kip-up (liyu dating 鲤鱼打挺). Taiji: 142A low-step sole-kick balance, 143A low balance leg forward, 143B leg inserted behind, 212A parting/heel kick.","","",0]]},{"n":2,"title":"Connections and landings","los":[["WS-6.2.A",2537,"Name the landing position from a connection suffix and vice versa.","0 pubu · 1 mabu · 2 diebu · 3 tixi duli 提膝独立 single-leg knee-raise · 4 front split · 5 hurdler's split · 6 zuopan · 7 gongbu · 8 land on take-off foot · 9 weapon throw-catch · 10 scissor · 11 scorpion.","","",0],["WS-6.2.B",2538,"Choose the correct connection value for a described jump + landing in changquan (auto-checkable).","A 0.10: 323A+1, 323A+4, 324A+1, 333A+6, 335A+4, 353B+4 · B 0.15: 323A+3, 323B+1, 323B+4, 324B+1 · C 0.20: 323B+3, 323C+1, 324B+3 · D 0.25: 323C+4, 324C+1, 353C+4.","","WS-6.2.A WS-6.1.B",0],["WS-6.2.C",2539,"Choose the correct connection value for a described taiji or nanquan connection.","Taiji: 143A+3 A · 323B+3 C · 324B+3 C · 324B+5 B · 323C+3 D. Nanquan: 323A+1 A · 323A+2 A · 346B+2 B · 447A+2 B · 323C+1 D.","","WS-6.2.A",0],["WS-6.2.D",2567,"Explain the pattern in connection values: why more rotation and a single-leg landing score higher.","More rotation leaves more residual spin to kill; a one-foot base (3) or a split (4) leaves less margin than mabu (1). The value prices the risk of a code-70/71/72 error.","","WS-9.2.C",0]]},{"n":3,"title":"Difficulty caps and planning","los":[["WS-6.3.A",2540,"Compute a C score from a declared list of elements and connections, applying the caps.","Technique total ≤ 1.4, connection total ≤ 0.6; over the cap only the last registered element is reduced. 2 of 3 C-judges must confirm each element.","","WS-6.1.A WS-6.2.B",0],["WS-6.3.B",2541,"Design a difficulty plan that reaches the caps with the lowest-risk element set for a given ability profile.","Five B jumps already give 1.5 (> 1.4); trade one C for two A when the C fails often — expected value = value × success rate − expected deductions.","","WS-6.3.A",0]]}]},{"n":7,"title":"Judging and scoring","scope":"core","topics":[{"n":1,"title":"Score structure and judge panels","los":[["WS-7.1.A",2542,"State how a 10-point score splits for events with and without difficulty and which judge group awards each part.","With difficulty: A quality of movement 5 · B overall performance 3 · C difficulty 2 (1.4 + 0.6). Without difficulty (2024): A 7, B 3.","","",0],["WS-7.1.B",2543,"Apply the panel rules to a set of raw judge marks and compute the A and B scores.","A: 3 judges, a deduction stands only if ≥ 2 confirm it. B: 5 judges, drop high and low, average the middle 3, truncate (not round) to three decimals.","","WS-7.1.A",0]]},{"n":2,"title":"Quality of movement (A) deductions","los":[["WS-7.2.A",2544,"Assign the code and value for a described balance-loss error.","70 sway, shuffle or skip — 0.1 · 71 extra support (hand, elbow, knee touches) — 0.2 · 72 fall (shoulder, buttocks, trunk down) — 0.3 · 77 balance held \u003c 2 s — 0.1 · 78 any part outside the carpet — 0.1 · 79 forgotten movement — 0.1.","","",0],["WS-7.2.B",2545,"Assign the code for a described jump or balance execution fault in changquan.","10–16 balances (bent legs, torso > 45°, leg below level) · 30 slapped toes below shoulder or slap missed · 31 hanging leg bent · 32 cartwheel legs bent ≥ 45° · 33 butterfly torso out of range or legs bent · 34 jumping snap leg below level.","","WS-6.1.B",0],["WS-7.2.C",2546,"Score a described full sequence: list every A deduction with its code and total them.","Each code is per occurrence; a jump that lands short of the slap and then shuffles earns 30 and 70 separately.","","WS-7.2.A WS-7.2.B",0]]},{"n":3,"title":"Overall performance (B) and choreography","los":[["WS-7.3.A",2547,"Place a described performance into a B band and grade, justifying it with the criteria.","Criteria: power, coordination, rhythm, style, choreography, music. Bands (difficulty events): superior 2.51–3.00 · average 1.91–2.50 · inferior 1.01–1.90, each split into three grades.","","",0],["WS-7.3.B",2548,"Assign the choreography code and value for a described structural or content fault.","80 missing/extra/altered technique — 0.1 or 0.2 · 81 missing/extra step — 0.1 · 82 missing nanquan vocalisation — 0.2 · 83 static pause > 3 s — 0.1 · 84 facing averted > 45° (changquan) or > 90° (taiji) — 0.1 · 85 no music or music with lyrics — 0.5.","","",0],["WS-7.3.C",2549,"Compute the head judge's time deduction for a routine of given length and event.","Changquan, nanquan, weapons: adult optional 1:20–1:35; 0.1 per started 2 s outside. Taiji, group: 0.1 per started 5 s outside.","","",0],["WS-7.3.D",2550,"Compare the 2005 and 2019 rule tables for a code and explain why a drill must name its edition.","2003 revision introduced nandu (2 of 10 points), first used at the 2005 Worlds; codes were renumbered and criteria tightened by 2019; 2024 widened 'other errors' to 0.05–0.3.","","",0]]}]},{"n":8,"title":"Performance and choreography","scope":"core","topics":[{"n":1,"title":"Spirit, eyes and rhythm","los":[["WS-8.1.A",2551,"Define jingshen, yanshen, jiezou and jin and identify which one a described performance lacks.","Jingshen 精神 spirit/intent · yanshen 眼神 eyes leading the technique · jiezou 节奏 rhythm: fast–slow, hard–soft, rise–fall, motion–stillness · jin 劲 trained power, fajin 发劲 its release.","","",0],["WS-8.1.B",2552,"Mark the rhythm of a routine section (accelerations, stops, holds) and justify each against the style.","A routine is phrased like music: build, burst, hold. Uniform tempo reads as flat even when technique is clean.","","",0],["WS-8.1.C",2553,"Explain 'hands, eyes, body, steps arrive together' (手眼身法步) and diagnose a described timing error.","The eyes turn first, the stance and hand finish on the same beat; a hand that lands after the stance looks weak and reads as disconnected power.","","",0]]},{"n":2,"title":"Routine composition","los":[["WS-8.2.A",2554,"Draft an optional routine plan that meets the time limit, mandatory techniques, direction and carpet-use rules.","Use corners and centre, avoid > 45° averted facing and > 3 s static holds, place difficulty where fatigue is lowest.","","WS-7.3.B WS-6.3.B",0],["WS-8.2.B",2555,"Choose music and cut points for a routine and check the music rules.","Instrumental only: lyrics or no music is code 85 (0.5) where music is required.","","",0]]},{"n":3,"title":"Stage and screen fighting","los":[["WS-8.3.A",2556,"Define the core staged-combat safety terms and identify which one a described unsafe exchange violates.","Distance: the measure that makes a technique safe · cue–reaction–action: the attacker cues, the partner reacts, then the action completes · eye contact confirms readiness · non-contact strikes stay out of distance.","","",0],["WS-8.3.B",2557,"Choose the camera angle that sells a described non-contact strike and explain why it works.","Along the lens axis, depth vanishes: a strike that misses by 15 cm sideways to camera hides behind the target's head when shot over the shoulder.","","",0],["WS-8.3.C",2558,"Explain how a knap and a reaction sell an impact and pick the knap type for a described shot.","Sound plus a reaction timed to the strike sells contact; body knap (self), clap knap, shared knap (both partners) — choose the one hidden from camera.","","",0],["WS-8.3.D",2559,"Adapt a taolu combination into a two-person screen phrase, keeping every strike off-line and every reaction cued.","Taolu is shadow-fighting; screen work adds a partner, so each technique needs a target off-line, a cue and a repeatable mark for multiple takes.","","WS-8.3.A",0],["WS-8.3.E",2560,"Compare duilian (choreographed sparring) judging with screen-fight priorities.","Duilian rewards realism, timing and clean contact control under the same A/B structure; the camera rewards readable shapes and reactions — both depend on partner trust and fixed distance.","","",0]]}]},{"n":9,"title":"Biomechanics and injury prevention","scope":"core","topics":[{"n":1,"title":"Takeoff and flight","los":[["WS-9.1.A",2561,"Calculate flight time and jump height from takeoff vertical velocity (and the reverse) for a described jump.","t_flight = 2v/g, h = v²/2g; 0.5 s of air needs v ≈ 2.45 m/s and h ≈ 0.31 m of CoM rise.","","",0],["WS-9.1.B",2562,"Explain which takeoff changes raise flight time, and identify the change that fixes a described 'no height' fault.","Vertical impulse ∫(F − mg)dt: a short, stiff ground contact with full hip–knee–ankle extension and an upward arm drive. bio-xfj: takeoff knee ≈ 60°, short foot-pat contact gives larger vertical acceleration.","","",0]]},{"n":2,"title":"Rotation and angular momentum","los":[["WS-9.2.A",2564,"Explain where the angular momentum for a tornado kick or butterfly twist comes from and why it can't be added in the air.","Friction torque from the feet on the floor (plus the arm and leg wind-up) generates L before takeoff; in flight no external torque acts about the CoM, so L is constant.","","",0],["WS-9.2.B",2565,"Predict how a shape change in flight alters spin rate and identify which change fixes a described under-rotation.","L = Iω constant: pulling arms and legs toward the spin axis cuts I and raises ω. Rotations = ω·t/2π, so under-rotation is fixed by more L at takeoff, a tighter shape, or more flight time.","","WS-9.2.A WS-9.1.A",0],["WS-9.2.C",2566,"Explain why residual spin at landing causes shuffles and which landing shapes make it harder to kill.","On touchdown the floor must apply an opposite torque; a wide base (mabu) supplies it easily, one foot or a split supplies little, so excess spin becomes a code-70 shuffle or a fall.","","WS-9.2.A",0],["WS-9.2.D",2568,"Explain the timing rule for the slap in xuanfengjiao and lotus kick and identify the fault when the slap is late.","bio-xfj: the inward kick circle should be completed before the CoM peaks; slapping on the way down leaves no time to land and drops the slap below shoulder (code 30).","","",0]]},{"n":3,"title":"Landing and balance","los":[["WS-9.3.A",2569,"Explain how a landing reduces peak force and identify the fix for a described 'stiff landing'.","F_avg = Δp/Δt: sequential ankle–knee–hip flexion lengthens stopping time; landing stiff-legged spikes force on knees and spine.","","",0],["WS-9.3.B",2570,"Explain why a balance holds or fails in terms of centre of mass and base of support.","Static balance needs the CoM projection inside the base; single-leg balances (≥ 2 s, code 77) leave a base the size of one foot, so the trunk and raised leg must counter each other.","","",0],["WS-9.3.C",2571,"Identify a knee-valgus or knee-over-toe misalignment in a described landing or stance and explain the injury risk.","Knees caving inward on landing loads the ACL and MCL; the same alignment is judged in stances (mabu knees buckle in, code 51).","","",0]]},{"n":4,"title":"Injury prevention and load management","los":[["WS-9.4.A",2572,"State where wushu injuries concentrate and plan a prehab routine that targets those sites.","Elite wushu study: 6.85 injuries / 1000 h, lower limb 47.6 %, then head/face (contact work); flat feet and shoulder asymmetry common. Ankle, knee and adductor/hamstring work goes first.","","",0],["WS-9.4.B",2573,"Plan a weekly jump and landing volume with progressions and identify signs to back off.","Landings are the dose: count them; progress rotation before landing difficulty; mats and lower-rotation drills carry the reps; pain on landing or loss of height signals fatigue.","","",0],["WS-9.4.C",2574,"Explain how fatigue changes takeoff and landing mechanics and why difficulty goes early in a routine or take.","Fatigue shortens flight, slows wind-up and softens landing control — all three raise the chance of 70–72 errors and injury.","","WS-9.1.B WS-9.3.A",0]]}]},{"n":10,"title":"Sanda basics","scope":"extension","topics":[{"n":1,"title":"Rules and scoring","los":[["WS-10.1.A",2575,"Assign the points for a described sanda exchange under amateur rules.","Punch to head or body 1 · kick to body 2 · kick to leg 1 · complete throw 2 · opponent exits ring 2 to the other fighter (representative amateur values; IWUF and classes vary).","","",0],["WS-10.1.B",2576,"Identify whether a described technique or target is legal in amateur sanda.","Illegal: elbows, knees (amateur), joint locks, strikes to back of head, neck, spine, groin; clinch allowed only briefly before a throw or break.","","",0]]},{"n":2,"title":"Techniques and transfer","los":[["WS-10.2.A",2577,"Explain how the four methods ti, da, shuai, na (踢打摔拿) appear in sanda and in Duanwei content.","Kick, strike, throw, seize; sanda emphasises the first three; kick-catch throws (jie tui shuai 接腿摔) punish kicks left extended.","","",0],["WS-10.2.B",2578,"Contrast TKD sparring habits with sanda and name the habit that the throw rule exploits.","High, chambered, retracted-late kicks and an upright bounce stance invite catches and throws; sanda kicks are faster to recover and the stance is lower.","","WS-1.4.C",0]]}]},{"n":11,"title":"History and the Duanwei ladder","scope":"core","topics":[{"n":1,"title":"How modern wushu was built","los":[["WS-11.1.A",2579,"Place the milestones

s a; f(a + 1) is not f(a) + 1.","F-IF.A.2","MH-2.1.A",0],["MH-2.1.C",273,"Recognise a sequence as a function whose domain is a subset of the integers, and generate terms from a recursive definition.","A recursive rule gives each term from the one before, e.g. f(0) = f(1) = 1, f(n + 1) = f(n) + f(n − 1).","F-IF.A.3","MH-2.1.B",0]]},{"n":2,"title":"Interpret functions that arise in applications in terms of a context","los":[["MH-2.2.A",274,"Interpret key features of a graph or table in context (intercepts, intervals of increase and decrease, where positive or negative, maxima and minima), and sketch a graph from a verbal description.","Each graphical feature is a statement about the quantities: an intercept is a starting value, a high point is a largest value.","F-IF.B.4","MH-2.1.B",0],["MH-2.2.B",275,"Relate the domain of a function to its graph and to the quantity it describes.","Context restricts the domain, e.g. whole numbers for a count of items, t ≥ 0 for time.","F-IF.B.5","MH-2.2.A",0],["MH-2.2.C",276,"Calculate and interpret the average rate of change of a function over an interval from a formula, a table or a graph.","Average rate of change = (f(b) − f(a))/(b − a), the slope of the secant line, in output units per input unit.","F-IF.B.6","MH-2.2.A",0]]},{"n":3,"title":"Graphs of equations and linear functions","los":[["MH-2.3.A",277,"Explain that the graph of an equation in two variables is the set of all its solutions plotted in the coordinate plane.","A point lies on the graph exactly when its coordinates satisfy the equation.","A-REI.D.10","MH-1.4.B",0],["MH-2.3.B",278,"Graph a linear function from its equation, showing the intercepts and the slope.","y = mx + b: slope m = rise/run, y-intercept b, x-intercept −b/m.","F-IF.C.7a","MH-2.3.A MH-2.2.C",0]]},{"n":4,"title":"Distinguish linear from exponential change","los":[["MH-2.4.A",279,"Prove that linear functions grow by equal differences over equal intervals and exponential functions grow by equal factors over equal intervals.","f(x + Δ) − f(x) = mΔ for linear; f(x + Δ)/f(x) = b^Δ for exponential.","F-LE.A.1a","MH-2.2.C",0],["MH-2.4.B",280,"Recognise a situation in which one quantity changes at a constant rate per unit interval relative to another.","Constant amount added per step ⇒ linear.","F-LE.A.1b","MH-2.4.A",0],["MH-2.4.C",281,"Recognise a situation in which a quantity grows or decays by a constant percent rate per unit interval.","Constant percent change r per step ⇒ multiply by (1 + r) each step ⇒ exponential.","F-LE.A.1c","MH-2.4.A",0]]},{"n":5,"title":"Build linear and exponential functions and sequences","los":[["MH-2.5.A",282,"Construct a linear or exponential function, including arithmetic and geometric sequences, from a graph, a description of a relationship, or two input–output pairs.","Linear: m = Δy/Δx, then b; exponential through (x₁, y₁), (x₂, y₂): b = (y₂/y₁)^(1/(x₂ − x₁)), then a.","F-LE.A.2","MH-2.4.B MH-2.4.C MH-2.3.B",0],["MH-2.5.B",283,"Write an arithmetic or geometric sequence both recursively and with an explicit formula, and translate between the two forms.","a_n = a₁ + (n − 1)d ⇔ a_n = a_(n−1) + d; a_n = a₁r^(n−1) ⇔ a_n = r·a_(n−1).","F-BF.A.2","MH-2.1.C MH-2.5.A",0],["MH-2.5.C",284,"Determine an explicit expression, a recursive process, or steps for calculation from a context.","Describe what happens to the quantity at each step; that description is the recursion, and repeating it gives the explicit formula.","F-BF.A.1a","MH-2.5.B",0],["MH-2.5.D",285,"Interpret the parameters of a linear or exponential function in terms of a context.","y = mx + b: m is the rate, b the initial value; y = a·b^x: a is the initial value, b − 1 the percent change per unit.","F-LE.B.5","MH-2.5.A",0]]},{"n":6,"title":"Rational exponents and exponential graphs","los":[["MH-2.6.A",286,"Explain how the meaning of rational exponents follows from extending the properties of integer exponents, e.g. why 5^(1/3) is the cube root of 5.","(5^(1/3))³ = 5^((1/3)·3) = 5, so 5^(1/3) must be a cube root of 5.","N-RN.A.1","",0],["MH-2.6.B",287,"Rewrite expressions involving radicals and rational exponents using the properties of exponents.","x^(m/n) = (ⁿ√x)^m; a^p·a^q = a^(p+q); (a^p)^q = a^(pq); a^(−p) = 1/a^p.","N-RN.A.2","MH-2.6.A",0],["MH-2.6.C",288,"Graph an exponential function y = a·b^x, showing the intercept and end behaviour.","Passes through (0, a); grows if b > 1, decays if 0 \u003c b \u003c 1; horizontal asymptote y = 0.","F-IF.C.7e","MH-2.5.A",0],["MH-2.6.D",289,"Show with graphs and tables that a quantity increasing exponentially eventually exceeds one increasing linearly.","Equal factors eventually beat equal differences, however small the base above 1.","F-LE.A.3","MH-2.6.C",0],["MH-2.6.E",290,"Compare properties of two functions each represented in a different way (algebraically, graphically, numerically in a table, or by a verbal description).","Read the same feature (rate, intercept, maximum) from each representation before comparing.","F-IF.C.9","MH-2.6.C",0]]},{"n":7,"title":"Solve systems of equations and represent inequalities graphically","los":[["MH-2.7.A",291,"Solve a system of two linear equations approximately by graphing.","The solution is the intersection point; parallel lines give no solution, coincident lines infinitely many.","A-REI.C.6","MH-2.3.B",0],["MH-2.7.B",292,"Solve a system of two linear equations exactly by substitution or elimination.","Eliminate one variable to get a one-variable equation, solve, then back-substitute.","A-REI.C.6","MH-2.7.A MH-1.3.B",0],["MH-2.7.C",293,"Prove that replacing one equation of a system by the sum of that equation and a multiple of the other gives a system with the same solutions.","Any (x, y) satisfying both original equations satisfies the combination, and the step can be undone.","A-REI.C.5","MH-2.7.B",0],["MH-2.7.D",294,"Explain why the x-coordinates of the intersections of y = f(x) and y = g(x) solve f(x) = g(x), and approximate them with graphs or tables (linear and exponential f, g).","At an intersection both outputs are equal for the same input.","A-REI.D.11","MH-2.7.A MH-2.6.C",0],["MH-2.7.E",295,"Graph the solutions of a linear inequality in two variables as a half-plane, and of a system of linear inequalities as the intersection of half-planes.","Dashed boundary for \u003c or >, solid for ≤ or ≥; test a point to choose the side.","A-REI.D.12","MH-2.7.A MH-1.3.C",0]]}]},{"n":3,"title":"Descriptive statistics","scope":"core","topics":[{"n":1,"title":"Summarize, represent and interpret data on a single count or measurement variable","los":[["MH-3.1.A",296,"Represent data with plots on the real number line: dot plots, histograms and box plots.","A box plot shows the five-number summary: minimum, Q1, median, Q3, maximum.","S-ID.A.1","",0],["MH-3.1.B",297,"Compare the center (median, mean) and spread (interquartile range, standard deviation) of two or more data sets, using statistics suited to their shape.","Skewed data or outliers → median and IQR; roughly symmetric → mean and standard deviation.","S-ID.A.2","MH-3.1.A",0],["MH-3.1.C",298,"Interpret differences in shape, center and spread in context, accounting for possible effects of extreme data points (outliers).","An outlier lies more than 1.5·IQR beyond a quartile; it moves the mean and SD much more than the median and IQR.","S-ID.A.3","MH-3.1.B",0]]},{"n":2,"title":"Summarize, represent and interpret data on two categorical and quantitative variables","los":[["MH-3.2.A",299,"Summarise categorical data for two categories in two-way frequency tables and interpret joint, marginal and conditional relative frequencies.","Joint = cell / grand total; marginal = row or column total / grand total; conditional = cell / its row or column total.","S-ID.B.5","",0],["MH-3.2.B",300,"Fit a function (linear, quadratic or exponential) to data on two quantitative variables in a scatter plot and use it to solve problems in the context of the data.","Pick the family from the shape of the scatter and the context, then use technology to fit its parameters.","S-ID.B.6a","MH-2.5.A",0],["MH-3.2.C",301,"Informally assess the fit of a function by plotting and analysing residuals.","Residual = observed − predicted; a good fit leaves residuals scattered about 0 with no pattern.","S-ID.B.6b","MH-3.2.B",0],["MH-3.2.D",302,"Fit a linear function to a scatter plot that suggests a linear association.","The least-squares line passes through (x̄, ȳ) and minimises the sum of squared residuals.","S-ID.B.6c","MH-3.2.B",0]]},{"n":3,"title":"Interpret linear models","los":[["MH-3.3.A",303,"Interpret the slope (rate of change) and intercept (constant term) of a linear model in the context of the data.","Slope = predicted change in y per one-unit increase in x; the intercept may be meaningless outside the data range.","S-ID.C.7","MH-3.2.D MH-2.5.D",0],["MH-3.3.B",304,"Compute (using technology) and interpret the correlation coefficient of a linear fit.","−1 ≤ r ≤ 1; the sign gives direction, |r| near 1 a strong linear association.","S-ID.C.8","MH-3.3.A",0],["MH-3.3.C",305,"Distinguish between correlation and causation.","Only a randomised experiment supports a causal claim; an association can come from a lurking variable.","S-ID.C.9","MH-3.3.B",0]]}]},{"n":4,"title":"Expressions and equations","scope":"core","topics":[{"n":1,"title":"Perform arithmetic on polynomials and use structure","los":[["MH-4.1.A",306,"Add, subtract and multiply polynomials, and explain why the result is again a polynomial.","Polynomials are closed under +, − and ×, like the integers; multiply by distributing every term over every term.","A-APR.A.1","MH-1.2.A",0],["MH-4.1.B",307,"Use the structure of an expression to rewrite it, e.g. x⁴ − y⁴ as (x²)² − (y²)² = (x² − y²)(x² + y²).","Recognise a² − b², a² ± 2ab + b² and common factors, where a and b may themselves be expressions.","A-SSE.A.2","MH-4.1.A MH-1.2.B",0]]},{"n":2,"title":"Write expressions in equivalent forms to solve problems","los":[["MH-4.2.A",308,"Factor a quadratic expression to reveal the zeros of the function it defines.","ax² + bx + c = a(x − r)(x − s) ⇒ zeros at x = r and x = s.","A-SSE.B.3a","MH-4.1.B",0],["MH-4.2.B",309,"Complete the square in a quadratic expression to reveal the maximum or minimum value of the function it defines.","ax² + bx + c = a(x − h)² + k with h = −b/2a; the extreme value is k, reached at x = h.","A-SSE.B.3b","MH-4.1.A",0],["MH-4.2.C",310,"Use the properties of exponents to transform an exponential expression, e.g. 1.15^t ≈ 1.012^(12t), to reveal an equivalent monthly rate.","b^t = (b^(1/k))^(kt): the same growth expressed per 1/k of the unit.","A-SSE.B.3c","MH-2.6.B",0]]},{"n":3,"title":"Solve quadratic equations in one variable","los":[["MH-4.3.A",311,"Solve a quadratic equation by inspection, by taking square roots, or by factoring.","Zero-product property: ab = 0 ⇒ a = 0 or b = 0; x² = k ⇒ x = ±√k.","A-REI.B.4b","MH-4.2.A",0],["MH-4.3.B",312,"Complete the square to transform a quadratic equation into the form (x − p)² = q, and derive the quadratic formula from that form.","x = (−b ± √(b² − 4ac)) / 2a.","A-REI.B.4a","MH-4.2.B MH-4.3.A",0],["MH-4.3.C",313,"Solve a quadratic equation with the quadratic formula, choosing the method that fits its form, and use the discriminant to recognise when it has no real solutions.","b² − 4ac > 0: two real roots; = 0: one repeated root; \u003c 0: no real roots (complex a ± bi).","A-REI.B.4b","MH-4.3.B",0],["MH-4.3.D",314,"Write and solve a quadratic equation that models a word problem, rejecting solutions that do not fit the context.","A negative time or length from the formula is a mathematical root, not an answer.","A-CED.A.1","MH-4.3.C MH-1.4.A",0]]},{"n":4,"title":"Solve linear–quadratic systems","los":[["MH-4.4.A",315,"Solve a system of one linear and one quadratic equation in two variables algebraically and graphically, e.g. find where y = −3x meets x² + y² = 3.","Substitute the linear equation into the quadratic; 0, 1 or 2 real solutions match 0, 1 or 2 intersection points.","A-REI.C.7","MH-4.3.C MH-2.7.B",0]]}]},{"n":5,"title":"Quadratic functions and modeling","scope":"core","topics":[{"n":1,"title":"Use properties of rational and irrational numbers","los":[["MH-5.1.A",316,"Explain why the sum or product of two rational numbers is rational, the sum of a rational and an irrational number is irrational, and the product of a nonzero rational and an irrational number is irrational.","If r + x were rational for rational r, then x = (r + x) − r would be rational too.","N-RN.B.3","MH-4.3.C",0]]},{"n":2,"title":"Analyze quadratic and related functions using different representations","los":[["MH-5.2.A",317,"Rewrite a quadratic function by factoring and completing the square to show its zeros, extreme value and symmetry, and interpret them in context.","Factored form shows zeros; vertex form a(x − h)² + k shows the extreme value k and axis x = h.","F-IF.C.8a","MH-4.2.A MH-4.2.B",0],["MH-5.2.B",318,"Graph a quadratic function, showing intercepts, the vertex (maximum or minimum) and the axis of symmetry.","Vertex at x = −b/2a; opens up if a > 0, down if a \u003c 0; y-intercept c.","F-IF.C.7a","MH-5.2.A MH-2.3.B",0],["MH-5.2.C",319,"Interpret the key features of a quadratic model in context, e.g. the maximum height and landing time of a projectile.","The vertex gives the extreme value and when it happens; the zeros give when the quantity is zero.","F-IF.B.4","MH-5.2.B MH-2.2.A",0],["MH-5.2.D",320,"Graph square-root, cube-root and piecewise-defined functions, including step functions and absolute-value functions.","|x| = x for x ≥ 0 and −x for x \u003c 0; √x needs x ≥ 0; each piece applies only on its own interval.","F-IF.C.7b","MH-2.3.B MH-2.6.B",0],["MH-5.2.E",321,"Use the properties of exponents to classify an exponential function as growth or decay and find its percent rate, e.g. y = (0.97)^t, y = (1.01)^(12t), y = (1.2)^(t/10).","y = a·b^t: percent change per unit = (b − 1)·100%; rewrite so the exponent is in the unit asked for.","F-IF.C.8b","MH-4.2.C MH-2.5.D",0],["MH-5.2.F",322,"Compare a quadratic with a function represented differently, e.g. decide which of an algebraic quadratic and a graphed one has the larger maximum.","Put both in a form that shows the feature being compared.","F-IF.C.9","MH-5.2.B MH-2.6.E",0]]},{"n":3,"title":"Build new functions from existing functions","los":[["MH-5.3.A",323,"Combine standard function types using arithmetic operations, e.g. a decaying exponential plus a constant for a cooling body.","Sum, difference, product and quotient of functions act pointwise: (f + g)(x) = f(x) + g(x).","F-BF.A.1b","MH-2.5.C MH-5.2.E",0],["MH-5.3.B",324,"Identify the effect on the graph of replacing f(x) by f(x) + k, k·f(x), f(kx) and f(x + k), and find k from a graph.","Outside changes act on y as written; inside changes act on x in reverse: f(x + k) shifts left k, f(kx) compresses horizontally by 1/k.","F-BF.B.3","MH-5.2.B MH-5.2.D",0],["MH-5.3.C",325,"Recognise even and odd functions from their graphs and from their algebraic expressions.","Even: f(−x) = f(x), symmetric about the y-axis; odd: f(−x) = −f(x), symmetric about the origin.","F-BF.B.3","MH-5.3.B",0],["MH-5.3.D",326,"Solve f(x) = c for a simple invertible function f and write an expression for the inverse, e.g. f(x) = 2x³ or f(x) = (x + 1)/(x − 1).","Swap the roles of x and y and solve for y.","F-BF.B.4a","MH-1.4.D MH-2.6.B",0],["MH-5.3.E",327,"Show with tables and graphs that an increasing exponential function eventually exceeds any quadratic or polynomial function.","Exponential growth multiplies by a fixed factor; polynomial growth's ratio f(x + 1)/f(x) tends to 1.","F-LE.A.3","MH-2.6.D MH-5.2.B",0]]}]},{"n":6,"title":"Congruence, proof and constructions","scope":"core","topics":[{"n":1,"title":"Experiment with transformations in the plane","los":[["MH-6.1.A",328,"State precise definitions of angle, circle, perpendicular line, parallel line and line segment, based on the undefined notions of point, line, distance along a line and distance around a circular arc.","A circle is the set of points in a plane at a fixed distance from a center; a definition must name exactly the objects intended.","G-CO.A.1","",0],["MH-6.1.B",329,"Represent transformations as functions that take points in the plane to other points, and compare those that preserve distance and angle (rigid motions) with those that do not (e.g. a horizontal stretch).","A transformation is a function on points; rigid motions preserve every distance and angle.","G-CO.A.2","MH-6.1.A MH-2.1.A",0],["MH-6.1.C",330,"Describe the rotations and reflections that carry a rectangle, parallelogram, trapezoid or regular polygon onto itself.","A regular n-gon has n rotational symmetries (multiples of 360°/n) and n lines of reflection.","G-CO.A.3","MH-6.1.B",0],["MH-6.1.D",331,"Define rotations, reflections and translations in terms of angles, circles, perpendicular lines, parallel lines and line segments.","A reflection in line ℓ sends P to P′ so that ℓ is the perpendicular bisector of PP′.","G-CO.A.4","MH-6.1.B",0],["MH-6.1.E",332,"Draw the image of a figure under a given rotation, reflection or translation, and specify a sequence of transformations that carries one figure onto another.","In coordinates: reflect in the y-axis (x, y) → (−x, y); rotate 90° about the origin (x, y) → (−y, x); translate (x, y) → (x + a, y + b).","G-CO.A.5","MH-6.1.D",0]]},{"n":2,"title":"Understand congruence in terms of rigid motions","los":[["MH-6.2.A",333,"Predict the effect of a rigid motion on a figure, and decide whether two figures are congruent by whether a rigid motion carries one onto the other.","Two figures are congruent exactly when a sequence of rigid motions maps one onto the other.","G-CO.B.6","MH-6.1.E",0],["MH-6.2.B",334,"Show, using the rigid-motion definition, that two triangles are congruent if and only if corresponding sides and corresponding angles are congruent.","Rigid motions preserve side lengths and angle measures, so they carry corresponding parts to equal parts.","G-CO.B.7","MH-6.2.A",0],["MH-6.2.C",335,"Explain how the ASA, SAS and SSS criteria for triangle congruence follow from the definition of congruence in terms of rigid motions.","SSA and AAA are not congruence criteria.","G-CO.B.8","MH-6.2.B",0]]},{"n":3,"title":"Prove geometric theorems","los":[["MH-6.3.A",336,"Prove theorems about lines and angles: vertical angles are congruent; a transversal of parallel lines makes congruent alternate interior and corresponding angles; points on a perpendicular bisector are equidistant from the segment's endpoints.","Each step cites a definition, postulate or earlier theorem.","G-CO.C.9","MH-6.1.A MH-6.2.C",0],["MH-6.3.B",337,"Prove theorems about triangles: interior angles sum to 180°, base angles of an isosceles triangle are congruent, the midsegment is parallel to the third side and half its length, the medians meet at a point.","Draw the line through a vertex parallel to the opposite side to prove the angle sum.","G-CO.C.10","MH-6.3.A",0],["MH-6.3.C",338,"Prove theorems about parallelograms: opposite sides and opposite angles are congruent, the diagonals bisect each other, and a rectangle is a parallelogram with congruent diagonals.","A diagonal splits a parallelogram into two congruent triangles (ASA).","G-CO.C.11","MH-6.3.B",0]]},{"n":4,"title":"Make geometric constructions","los":[["MH-6.4.A",339,"Construct with compass and straightedge a copy of a segment and of an angle, an angle bisector, a perpendicular bisector, a perpendicular to a line, and a parallel to a line through a point not on it.","Each construction is justified by a congruence (usually SSS) made by the equal arcs.","G-CO.D.12","MH-6.2.C",0],["MH-6.4.B",340,"Construct an equilateral triangle, a square and a regular hexagon inscribed in a circle.","The radius steps around a circle exactly six times, giving the hexagon.","G-CO.D.13","MH-6.4.A",0]]}]},{"n":7,"title":"Similarity, proof and trigonometry","scope":"core","topics":[{"n":1,"title":"Understand similarity in terms of similarity transformations","los":[["MH-7.1.A",341,"Verify experimentally that a dilation takes a line not through the center to a parallel line, and leaves a line through the center unchanged.","A dilation with center O and factor k sends P to P′ on ray OP with OP′ = k·OP.","G-SRT.A.1a","MH-6.1.E",0],["MH-7.1.B",342,"Verify experimentally that a dilation multiplies the length of every segment by the scale factor.","In coordinates, dilation about the origin: (x, y) → (kx, ky), so every length scales by |k|.","G-SRT.A.1b","MH-7.1.A",0],["MH-7.1.C",343,"Decide whether two figures are similar using similarity transformations, and explain triangle similarity as equal corresponding angles and proportional corresponding sides.","Similar = related by a dilation followed by rigid motions.","G-SRT.A.2","MH-7.1.B MH-6.2.B",0],["MH-7.1.D",344,"Establish the AA criterion for triangle similarity from the properties of similarity transformations.","Two pairs of equal angles force the third pair equal, so a dilation plus a rigid motion matches the triangles.","G-SRT.A.3","MH-7.1.C",0]]},{"n":2,"title":"Prove theorems involving similarity","los":[["MH-7.2.A",345,"Prove that a line parallel to one side of a triangle divides the other two proportionally, and prove the Pythagorean theorem using triangle similarity.","The altitude to the hypotenuse makes two triangles similar to the whole, so a² = c·x and b² = c·(c − x), which add to c².","G-SRT.B.4","MH-7.1.D",0],["MH-7.2.B",346,"Use congruence and similarity criteria for triangles to solve problems and prove relationships in figures.","Find a pair of congruent or similar triangles that contains the unknown, then use corresponding parts.","G-SRT.B.5","MH-7.2.A MH-6.3.B",0]]},{"n":3,"title":"Define trigonometric ratios and solve problems involving right triangles","los":[["MH-7.3.A",347,"Explain that by similarity the side ratios of a right triangle depend only on its acute angle, which defines sine, cosine and tangent.","sin θ = opposite/hypotenuse, cos θ = adjacent/hypotenuse, tan θ = opposite/adjacent.","G-SRT.C.6","MH-7.1.D",0],["MH-7.3.B",348,"Explain and use the relationship between the sine and cosine of complementary angles.","sin θ = cos(90° − θ): the side opposite one acute angle is adjacent to the other.","G-SRT.C.7","MH-7.3.A",0],["MH-7.3.C",349,"Use trigonometric ratios and the Pythagorean theorem to solve right triangles in applied problems.","For a side, pick the ratio that links the known side to the unknown; for an angle, use the inverse ratio.","G-SRT.C.8","MH-7.3.A MH-7.2.A MH-1.1.A",0]]},{"n":4,"title":"Apply geometric concepts in modeling situations","los":[["MH-7.4.A",350,"Use geometric shapes, their measures and their properties to describe objects, e.g. a tree trunk or a human torso as a cylinder.","A model keeps the features that matter for the question and drops the rest.","G-MG.A.1","MH-7.3.C",0],["MH-7.4.B",351,"Apply concepts of density based on area and volume, e.g. persons per square mile or BTUs per cubic foot.","Density = amount / area or amount / volume; carry the units through.","G-MG.A.2","MH-7.4.A MH-1.1.A",0],["MH-7.4.C",352,"Apply geometric methods to design problems, e.g. design an object to satisfy physical constraints or minimise cost.","Write the constraint and the quantity to optimise in terms of the shape's dimensions.","G-MG.A.3","MH-7.4.A",0]]},{"n":5,"title":"Apply trigonometry to general triangles (+)","los":[["MH-7.5.A",353,"Derive the formula A = ½ab sin C for the area of a triangle by drawing an auxiliary line from a vertex perpendicular to the opposite side.","The altitude to side a is b sin C.","G-SRT.D.9","MH-7.3.C",0],["MH-7.5.B",354,"Prove the Laws of Sines and Cosines.","a/sin A = b/sin B = c/sin C; c² = a² + b² − 2ab cos C.","G-SRT.D.10","MH-7.5.A",0],["MH-7.5.C",355,"Use the Laws of Sines and Cosines to find unknown measurements in right and non-right triangles, including the ambiguous SSA case.","Two sides and the included angle, or three sides → Law of Cosines; an angle and its opposite side known → Law of Sines (check for a second triangle).","G-SRT.D.11","MH-7.5.B",0]]}]},{"n":8,"title":"Extending to three dimensions","scope":"core","topics":[{"n":1,"title":"Explain volume formulas and use them to solve problems","los":[["MH-8.1.A",356,"Give an informal argument for the circumference and area of a circle and the volume of a cylinder, pyramid and cone (dissection, Cavalieri's principle, limits).","Cut a circle into thin sectors and rearrange into a near-parallelogram of base πr and height r: A = πr².","G-GMD.A.1","MH-6.4.B MH-7.1.B",0],["MH-8.1.B",357,"Use the volume formulas for cylinders, pyramids, cones and spheres to solve problems.","V = Bh (prism, cylinder); V = ⅓Bh (pyramid, cone); V = (4/3)πr³ (sphere).","G-GMD.A.3","MH-8.1.A MH-1.4.D",0]]},{"n":2,"title":"Visualize relations between two- and three-dimensional objects","los":[["MH-8.2.A",358,"Identify the shapes of two-dimensional cross-sections of three-dimensional objects, and the three-dimensional objects generated by rotating two-dimensional objects.","A rectangle rotated about one side sweeps a cylinder; a right triangle about a leg, a cone.","G-GMD.B.4","MH-8.1.A",0],["MH-8.2.B",359,"Model a real object as a combination of solids and estimate its volume.","Volumes of non-overlapping pieces add.","G-MG.A.1","MH-8.1.B MH-7.4.A",0]]}]},{"n":9,"title":"Connecting algebra and geometry through coordinates","scope":"core","topics":[{"n":1,"title":"Use coordinates to prove simple geometric theorems algebraically","los":[["MH-9.1.A",360,"Use coordinates to prove simple geometric theorems algebraically, e.g. that a given quadrilateral is a rectangle.","Equal slopes ⇒ parallel; equal distances ⇒ congruent segments; midpoint ((x₁ + x₂)/2, (y₁ + y₂)/2).","G-GPE.B.4","MH-2.3.B MH-6.3.C",0],["MH-9.1.B",361,"Prove the slope criteria for parallel and perpendicular lines and use them to write the equation of a line parallel or perpendicular to a given line through a given point.","Parallel: m₁ = m₂; perpendicular: m₁m₂ = −1.","G-GPE.B.5","MH-9.1.A MH-7.1.A",0],["MH-9.1.C",362,"Find the point on a directed line segment between two given points that partitions it in a given ratio.","The point a fraction t of the way from P to Q is P + t(Q − P).","G-GPE.B.6","MH-9.1.A",0],["MH-9.1.D",363,"Use coordinates and the distance formula to compute perimeters of polygons and areas of triangles and rectangles.","d = √((x₂ − x₁)² + (y₂ − y₁)²): the Pythagorean theorem on coordinates.","G-GPE.B.7","MH-9.1.A MH-7.2.A",0]]},{"n":2,"title":"Translate between geometric description and equation for a parabola","los":[["MH-9.2.A",364,"Derive the equation of a parabola given a focus and directrix.","Equidistant from focus (0, p) and directrix y = −p ⇒ x² = 4py.","G-GPE.A.2","MH-9.1.D MH-5.2.B",0]]}]},{"n":10,"title":"Circles with and without coordinates","scope":"core","topics":[{"n":1,"title":"Understand and apply theorems about circles","los":[["MH-10.1.A",365,"Prove that all circles are similar.","Translate one center onto the other, then dilate by the ratio of radii.","G-C.A.1","MH-7.1.C",0],["MH-10.1.B",366,"Identify and describe relationships among inscribed angles, radii and chords, including central, inscribed and circumscribed angles.","An inscribed angle is half the central angle on the same arc; an angle inscribed in a semicircle is right; a tangent is perpendicular to the radius at the point of tangency.","G-C.A.2","MH-10.1.A MH-6.3.B",0],["MH-10.1.C",367,"Construct the inscribed and circumscribed circles of a triangle, and prove that opposite angles of a quadrilateral inscribed in a circle are supplementary.","Incenter: angle bisectors meet; circumcenter: perpendicular bisectors meet.","G-C.A.3","MH-10.1.B MH-6.4.A",0],["MH-10.1.D",368,"(+) Construct a tangent line from a point outside a given circle to the circle.","The tangent point lies on the circle whose diameter joins the outside point to the center (right angle in a semicircle).","G-C.A.4","MH-10.1.B MH-6.4.A",0]]},{"n":2,"title":"Find arc lengths and areas of sectors of circles","los":[["MH-10.2.A",369,"Derive using similarity that the arc length intercepted by an angle is proportional to the radius, define radian measure as the constant of proportionality, and derive the formula for the area of a sector.","s = rθ and A = ½r²θ with θ in radians.","G-C.B.5","MH-10.1.A MH-8.1.A",0]]},{"n":3,"title":"Circles in the coordinate plane","los":[["MH-10.3.A",370,"Derive the equation of a circle of given center and radius using the Pythagorean theorem, and complete the square to find the center and radius of a circle given by an equation.","(x − h)² + (y − k)² = r².","G-GPE.A.1","MH-9.1.D MH-4.2.B",0],["MH-10.3.B",371,"Prove or disprove that a given point lies on a circle centered at a given point through another given point.","The point is on the circle exactly when its distance from the center equals the radius.","G-GPE.B.4","MH-10.3.A MH-9.1.A",0]]}]},{"n":11,"title":"Applications of probability","scope":"core","topics":[{"n":1,"title":"Understand independence and conditional probability and use them to interpret data","los":[["MH-11.1.A",372,"Describe events as subsets of a sample space using characteristics of the outcomes, or as unions, intersections or complements of other events.","'Or' is union, 'and' is intersection, 'not' is complement; P(not A) = 1 − P(A).","S-CP.A.1","",0],["MH-11.1.B",373,"Decide whether two events are independent using the fact that A and B are independent exactly when P(A and B) = P(A)·P(B).","Independent ⇔ P(A ∩ B) = P(A)P(B).","S-CP.A.2","MH-11.1.A",1],["MH-11.1.C",374,"Interpret the conditional probability of A given B as P(A and B)/P(B), and independence as P(A|B) = P(A).","Conditioning on B shrinks the sample space to B.","S-CP.A.3","MH-11.1.B",0],["MH-11.1.D",375,"Construct and interpret a two-way frequency table, using it to decide whether events are independent and to approximate conditional probabilities.","Independent if the conditional relative frequencies are (about) the same in every row.","S-CP.A.4","MH-11.1.C MH-3.2.A",0],["MH-11.1.E",376,"Recognise and explain conditional probability and independence in everyday language and situations.","P(lung cancer | smoker) and P(smoker | lung cancer) are different numbers.","S-CP.A.5","MH-11.1.D",0]]},{"n":2,"title":"Use the rules of probability to compute probabilities of compound events","los":[["MH-11.2.A",377,"Find the conditional probability of A given B as the fraction of B's outcomes that also belong to A, and interpret it in terms of the model.","P(A|B) = |A ∩ B| / |B| in a uniform model.","S-CP.B.6","MH-11.1.C",0],["MH-11.2.B",378,"Apply the Addition Rule, P(A or B) = P(A) + P(B) − P(A and B), and interpret the answer in terms of the model.","Subtract the overlap so it is not counted twice.","S-CP.B.7","MH-11.1.A",0],["MH-11.2.C",379,"(+) Apply the general Multiplication Rule in a uniform probability model, P(A and B) = P(A)P(B|A) = P(B)P(A|B).","The rule is the definition of P(B|A) rearranged.","S-CP.B.8","MH-11.2.A",0],["MH-11.2.D",380,"(+) Use permutations and combinations to compute probabilities of compound events and solve problems.","nPr = n!/(n − r)! when order matters; nCr = n!/(r!(n − r)!) when it does not.","S-CP.B.9","MH-11.2.C",2]]},{"n":3,"title":"Use probability to evaluate outcomes of decisions (+)","los":[["MH-11.3.A",381,"(+) Use probabilities to make fair decisions, e.g. drawing by lots or using a random number generator.","A procedure is fair when every option has equal probability.","S-MD.B.6","MH-11.1.A",0],["MH-11.3.B",382,"(+) Analyse decisions and strategies using probability concepts, e.g. product testing, medical testing, pulling a hockey goalie at the end of a game.","A positive result on a test for a rare condition is often a false positive: P(condition | positive) ≪ P(positive | condition).","S-MD.B.7","MH-11.2.C",0]]}]},{"n":12,"title":"Polynomial, rational and radical relationships","scope":"core","topics":[{"n":1,"title":"Perform arithmetic with complex numbers and use them in quadratic equations","los":[["MH-12.1.A",383,"Know there is a complex number i with i² = −1, and write every complex number in the form a + bi with a and b real.","√(−k) = i√k for k > 0; a is the real part, b the imaginary part.","N-CN.A.1","",0],["MH-12.1.B",384,"Add, subtract and multiply complex numbers using i² = −1 and the commutative, associative and distributive properties.","(a + bi)(c + di) = (ac − bd) + (ad + bc)i.","N-CN.A.2","MH-12.1.A MH-4.1.A",0],["MH-12.1.C",385,"Solve a quadratic equation with real coefficients that has complex solutions.","Negative discriminant ⇒ x = −b/2a ± i√(4ac − b²)/2a, a conjugate pair.","N-CN.C.7","MH-12.1.B MH-4.3.C",2],["MH-12.1.D",386,"(+) Extend polynomial identities to the complex numbers, e.g. rewrite x² + 4 as (x + 2i)(x − 2i).","a² + b² = (a + bi)(a − bi).","N-CN.C.8","MH-12.1.C",0]]},{"n":2,"title":"Use polynomial identities and structure","los":[["MH-12.2.A",387,"Use the structure of a polynomial to factor it, e.g. x³ − 8 as a difference of cubes, or x⁴ − 5x² + 4 as a quadratic in x².","a³ ± b³ = (a ± b)(a² ∓ ab + b²); substitute u = x² to expose a quadratic.","A-SSE.A.2","MH-4.1.B",0],["MH-12.2.B",388,"Prove polynomial identities and use them to describe numerical relationships, e.g. (x² + y²)² = (x² − y²)² + (2xy)² generates Pythagorean triples.","Expand both sides to the same standard form.","A-APR.C.4","MH-12.2.A",0],["MH-12.2.C",389,"(+) Expand (x + y)^n with the Binomial Theorem, the coefficients given by Pascal's triangle.","(x + y)^n = Σ C(n, k) x^(n−k) y^k, k = 0 … n.","A-APR.C.5","MH-12.2.B MH-11.2.D",0]]},{"n":3,"title":"Understand the relationship between zeros and factors of polynomials","los":[["MH-12.3.A",390,"Apply the Remainder Theorem: the remainder on division of p(x) by x − a is p(a), so p(a) = 0 exactly when x − a is a factor.","p(x) = (x − a)q(x) + p(a).","A-APR.B.2","MH-12.2.A",0],["MH-12.3.B",391,"Identify the zeros of a polynomial from a suitable factorization and use them to sketch a rough graph.","An odd-multiplicity zero crosses the axis, an even one touches; the leading term sets end behaviour.","A-APR.B.3","MH-12.3.A",0],["MH-12.3.C",392,"Graph a polynomial function, identifying zeros when suitable factorizations are available and showing end behaviour.","Degree n has at most n real zeros and at most n − 1 turning points.","F-IF.C.7c","MH-12.3.B MH-5.2.B",0],["MH-12.3.D",393,"(+) Know the Fundamental Theorem of Algebra and show that it is true for quadratic polynomials.","A degree-n polynomial has exactly n complex zeros counted with multiplicity.","N-CN.C.9","MH-12.1.D MH-12.3.B",0]]},{"n":4,"title":"Finite geometric series","los":[["MH-12.4.A",394,"Derive the formula for the sum of a finite geometric series (common ratio not 1) and use it to solve problems, e.g. mortgage payments.","S_n = a(1 − r^n)/(1 − r): subtract r·S_n from S_n and almost every term cancels.","A-SSE.B.4","MH-2.5.B",0]]},{"n":5,"title":"Rewrite rational expressions and solve rational and radical equations","los":[["MH-12.5.A",395,"Rewrite a rational expression a(x)/b(x) as q(x) + r(x)/b(x) by inspection or long division.","Divide polynomials like integers; stop when deg r \u003c deg b.","A-APR.D.6","MH-12.3.A",0],["MH-12.5.B",396,"(+) Add, subtract, multiply and divide rational expressions, and explain why they form a system closed under these operations (division by a nonzero expression).","Common denominator to add; multiply by the reciprocal to divide.","A-APR.D.7","MH-12.5.A",0],["MH-12.5.C",397,"Solve a simple rational or radical equation in one variable, and give examples of extraneous solutions.","Multiplying by an expression that can be zero, or squaring both sides, can add roots; check each in the original equation.","A-REI.A.2","MH-12.5.B MH-2.6.B",0],["MH-12.5.D",398,"Find approximate solutions of f(x) = g(x) where f and g are polynomial, rational, absolute-value, exponential or logarithmic, with technology, tables or successive approximations.","Graph y = f(x) − g(x) and locate its zeros; a sign change brackets a root.","A-REI.D.11","MH-2.7.D MH-12.3.C",0]]}]},{"n":13,"title":"Trigonometric functions","scope":"core","topics":[{"n":1,"title":"Extend the domain of trigonometric functions using the unit circle","los":[["MH-13.1.A",399,"Understand radian measure of an angle as the length of the arc on the unit circle it subtends, and convert between degrees and radians.","π radians = 180°; θ = s/r.","F-TF.A.1","MH-10.2.A",0],["MH-13.1.B",400,"Explain how the unit circle extends sine and cosine to all real numbers, read as radian measures of angles traversed counterclockwise.","The point at angle t on the unit circle is (cos t, sin t).","F-TF.A.2","MH-13.1.A MH-7.3.A",0]]},{"n":2,"title":"Model periodic phenomena with trigonometric functions","los":[["MH-13.2.A",401,"Choose a trigonometric function y = A sin(B(x − h)) + k to model a periodic phenomenon with given amplitude, frequency and midline.","Amplitude |A|; period 2π/|B|; midline y = k; horizontal shift h.","F-TF.B.5","MH-13.1.B MH-5.3.B",0]]},{"n":3,"title":"Prove and apply trigonometric identities","los":[["MH-13.3.A",402,"Prove the Pythagorean identity sin²θ + cos²θ = 1 and use it to find sin θ, cos θ or tan θ from one of them and the quadrant.","(cos θ, sin θ) is on x² + y² = 1; the quadrant picks the sign of the square root.","F-TF.C.8","MH-13.1.B MH-7.2.A",0]]}]},{"n":14,"title":"Modeling with functions","scope":"core","topics":[{"n":1,"title":"Logarithms in exponential models","los":[["MH-14.1.A",403,"Express the solution of ab^(ct) = d as a logarithm (base 2, 10 or e) and evaluate it with technology.","log_b x = y ⇔ b^y = x; t = log_b(d/a)/c.","F-LE.A.4","MH-4.2.C MH-5.3.D",0],["MH-14.1.B",404,"Graph a logarithmic function, showing the intercept, the vertical asymptote and end behaviour, as the reflection of an exponential across y = x.","y = log_b x passes through (1, 0), has asymptote x = 0, and grows without bound but ever more slowly.","F-IF.C.7e","MH-14.1.A MH-2.6.C",0]]},{"n":2,"title":"Build and interpret models from several families","los":[["MH-14.2.A",405,"Create equations in two or more variables, including exponential and rational relationships, that model a situation.","Inverse variation y = k/x; growth y = a·b^t; pick the family from how the quantity changes.","A-CED.A.2","MH-12.5.B MH-14.1.A",0],["MH-14.2.B",406,"Build a model by combining function families arithmetically, e.g. a damped oscillation y = A·e^(−kt)·cos(ωt).","Multiplying by a decaying envelope shrinks the amplitude over time.","F-BF.A.1b","MH-13.2.A MH-5.3.A",0],["MH-14.2.C",407,"Interpret the key features of polynomial, exponential, logarithmic and periodic models in context (intercepts, extrema, end behaviour, periodicity).","The same feature means different things per family: a period is a cycle length, an asymptote a limiting value.","F-IF.B.4","MH-12.3.C MH-13.2.A MH-14.1.B",0],["MH-14.2.D",408,"Compare properties of two functions from different families, each given in a different representation.","Read the compared feature from each representation in the same units.","F-IF.C.9","MH-14.2.C",0]]}]},{"n":15,"title":"Inferences and conclusions from data","scope":"core","topics":[{"n":1,"title":"Normal distributions","los":[["MH-15.1.A",409,"Use the mean and standard deviation of a data set to fit it to a normal distribution and estimate population percentages, recognising when that is not appropriate.","68–95–99.7 rule; z = (x − μ)/σ; skewed or multimodal data are not normal.","S-ID.A.4","MH-3.1.C",0]]},{"n":2,"title":"Understand and evaluate random processes underlying statistical experiments","los":[["MH-15.2.A",410,"Explain statistics as a process for making inferences about population parameters from a random sample of that population.","A statistic describes the sample, a parameter the population; random sampling makes the sample representative.","S-IC.A.1","MH-15.1.A",0],["MH-15.2.B",411,"Decide whether a specified model is consistent with results from a data-generating process, e.g. by simulation.","If the observed result is rare among many simulated runs of the model, doubt the model.","S-IC.A.2","MH-15.2.A MH-11.1.A",0]]},{"n":3,"title":"Make inferences and justify conclusions from surveys, experiments and observational studies","los":[["MH-15.3.A",412,"Recognise the purposes of and differences among sample surveys, experiments and observational studies, and explain how randomisation relates to each.","Random sampling supports generalising to a population; random assignment supports cause-and-effect.","S-IC.B.3","MH-15.2.A MH-3.3.C",0],["MH-15.3.B",413,"Use data from a sample survey to estimate a population mean or proportion, and develop a margin of error through simulation models for random sampling.","Margin of error ≈ 2 standard deviations of the simulated sampling distribution.","S-IC.B.4","MH-15.3.A MH-15.1.A",0],["MH-15.3.C",414,"Use data from a randomised experiment to compare two treatments, and use simulation to decide whether differences between parameters are significant.","Re-randomise the group labels many times; if the observed difference is rare, it is significant.","S-IC.B.5","MH-15.3.B",0],["MH-15.3.D",415,"Evaluate reports based on data.","Check how the data were collected, whether the design supports the claim, and whether the stated variability is accounted for.","S-IC.B.6","MH-15.3.C",0]]}]},{"n":16,"title":"Composition, inverses, logarithms and rational functions","scope":"core","topics":[{"n":1,"title":"Compose functions and find inverses (+)","los":[["MH-16.1.A",416,"(+) Compose functions, e.g. T(h(t)) for the temperature at the location of a weather balloon at time t.","(f∘g)(x) = f(g(x)); its domain is the x in g's domain with g(x) in f's domain.","F-BF.A.1c","MH-5.3.A",0],["MH-16.1.B",417,"(+) Verify by composition that one function is the inverse of another.","f and g are inverses when f(g(x)) = x and g(f(x)) = x on their domains.","F-BF.B.4b","MH-16.1.A MH-5.3.D",0],["MH-16.1.C",418,"(+) Read values of an inverse function from a graph or a table, given that the function has an inverse.","(a, b) on f ⇔ (b, a) on f⁻¹; the graph of f⁻¹ is f reflected in y = x.","F-BF.B.4c","MH-16.1.B",0],["MH-16.1.D",419,"(+) Produce an invertible function from a non-invertible function by restricting the domain.","Restrict to an interval where f is one-to-one (passes the horizontal line test), e.g. x² on x ≥ 0.","F-BF.B.4d","MH-16.1.C MH-5.3.C",0]]},{"n":2,"title":"Logarithms as inverses of exponentials (+)","los":[["MH-16.2.A",420,"(+) Use the inverse relationship between exponents and logarithms to derive and apply the product, quotient, power and change-of-base rules.","log(xy) = log x + log y; log(x/y) = log x − log y; log(x^p) = p log x; log_b x = ln x / ln b.","F-BF.B.5","MH-16.1.B MH-14.1.A",0],["MH-16.2.B",421,"(+) Solve exponential and logarithmic equations, rejecting solutions outside the logarithm's domain.","Condense to one log, then exponentiate; log_b of a non-positive number is undefined.","F-BF.B.5","MH-16.2.A",0]]},{"n":3,"title":"Rational functions (+)","los":[["MH-16.3.A",422,"(+) Graph a rational function, identifying zeros, vertical asymptotes, holes and end behaviour.","Zeros from the reduced numerator; vertical asymptotes where the reduced denominator is 0; horizontal or slant asymptote from the degrees.","F-IF.C.7d","MH-12.5.A MH-12.3.B",0]]}]},{"n":17,"title":"Trigonometric functions, inverses and identities","scope":"core","topics":[{"n":1,"title":"Exact values, symmetry and graphs (+)","los":[["MH-17.1.A",423,"(+) Use 30-60-90 and 45-45-90 triangles to find exact sine, cosine and tangent of π/6, π/4, π/3, and the unit circle to extend them to π − x, π + x and 2π − x.","sin(π/6) = 1/2, sin(π/4) = √2/2, sin(π/3) = √3/2; the reference angle and quadrant give the rest.","F-TF.A.3","MH-13.1.B MH-7.3.A",0],["MH-17.1.B",424,"(+) Use the unit circle to explain the symmetry (odd and even) and periodicity of the trigonometric functions.","cos(−x) = cos x (even), sin(−x) = −sin x (odd); period 2π for sin and cos, π for tan.","F-TF.A.4","MH-17.1.A MH-5.3.C",0],["MH-17.1.C",425,"Graph sine, cosine and tangent functions, showing period, midline, amplitude and (for tangent) asymptotes.","tan x = sin x / cos x has vertical asymptotes where cos x = 0.","F-IF.C.7e","MH-17.1.B MH-13.2.A",0]]},{"n":2,"title":"Inverse trigonometric functions (+)","los":[["MH-17.2.A",426,"(+) Restrict a trigonometric function to a domain on which it is always increasing or always decreasing so that its inverse can be constructed.","arcsin on [−π/2, π/2], arccos on [0, π], arctan on (−π/2, π/2).","F-TF.B.6","MH-17.1.C MH-16.1.D",0],["MH-17.2.B",427,"(+) Use inverse functions to solve trigonometric equations that arise in modeling contexts, evaluate the solutions with technology, and interpret them.","sin x = c has two solutions per period: arcsin c and π − arcsin c, plus multiples of 2π.","F-TF.B.7","MH-17.2.A MH-13.2.A",0]]},{"n":3,"title":"Addition formulas (+)","los":[["MH-17.3.A",428,"(+) Prove the addition and subtraction formulas for sine, cosine and tangent.","cos(α − β) = cos α cos β + sin α sin β, from the distance between two points on the unit circle.","F-TF.C.9","MH-13.3.A MH-9.1.D",0],["MH-17.3.B",429,"(+) Use the addition formulas, and the double-angle formulas they give, to find exact values and simplify expressions.","sin 2θ = 2 sin θ cos θ; cos 2θ = cos²θ − sin²θ; e.g. sin 75° = sin(45° + 30°).","F-TF.C.9","MH-17.3.A MH-17.1.A",0]]}]},{"n":18,"title":"Complex numbers in the plane","scope":"core","topics":[{"n":1,"title":"Represent complex numbers and their operations on the complex plane (+)","los":[["MH-18.1.A",430,"(+) Find the conjugate of a complex number, and use conjugates to find moduli and quotients.","z·z̄ = |z|² = a² + b²; to divide, multiply top and bottom by the conjugate of the denominator.","N-CN.A.3","MH-12.1.B",0],["MH-18.1.B",431,"(+) Represent complex numbers on the complex plane in rectangular and polar form, and convert between the two forms.","a + bi = r(cos θ + i sin θ), r = √(a² + b²), tan θ = b/a with the quadrant checked.","N-CN.B.4","MH-18.1.A MH-17.1.A",2],["MH-18.1.C",432,"(+) Represent addition, subtraction, multiplication and conjugation geometrically on the complex plane, e.g. (−1 + √3 i)³ = 8 because it has modulus 2 and argument 120°.","Multiplying complex numbers multiplies moduli and adds arguments; conjugation reflects in the real axis.","N-CN.B.5","MH-18.1.B MH-17.3.A",1],["MH-18.1.D",433,"(+) Calculate the distance between numbers in the complex plane as the modulus of the difference, and the midpoint of a segment as the average of its endpoints.","|z − w| is the distance formula in disguise.","N-CN.B.6","MH-18.1.B MH-9.1.D",0]]}]},{"n":19,"title":"Vectors and matrices","scope":"core","topics":[{"n":1,"title":"Represent and model with vector quantities (+)","los":[["MH-19.1.A",434,"(+) Recognise vector quantities as having both magnitude and direction, represent them by directed line segments, and use notation such as v, |v| and ‖v‖.","Velocity, force and displacement are vectors; speed and mass are scalars.","N-VM.A.1","",0],["MH-19.1.B",435,"(+) Find the components of a vector by subtracting the coordinates of its initial point from those of its terminal point.","From P(x₁, y₁) to Q(x₂, y₂): ⟨x₂ − x₁, y₂ − y₁⟩, magnitude by the distance formula.","N-VM.A.2","MH-19.1.A MH-9.1.D",0]]},{"n":2,"title":"Perform operations on vectors (+)","los":[["MH-19.2.A",436,"(+) Add vectors end-to-end, component-wise and by the parallelogram rule.","The magnitude of a sum is usually not the sum of the magnitudes.","N-VM.B.4a","MH-19.1.B",0],["MH-19.2.B",437,"(+) Given two vectors in magnitude-and-direction form, find the magnitude and direction of their sum.","Convert each to components (|v|cos θ, |v|sin θ), add, convert back with √ and arctan.","N-VM.B.4b","MH-19.2.A MH-7.5.B",0],["MH-19.2.C",438,"(+) Subtract vectors, defining v − w as v + (−w), and represent the difference graphically by connecting the tips.","−w has the same length as w and the opposite direction.","N-VM.B.4c","MH-19.2.A",0],["MH-19.2.D",439,"(+) Multiply a vector by a scalar graphically and component-wise.","c⟨vx, vy⟩ = ⟨cvx, cvy⟩.","N-VM.B.5a","MH-19.2.A",0],["MH-19.2.E",440,"(+) Compute the magnitude of a scalar multiple cv as |c|·‖v‖ and give its direction.","cv points along v if c > 0 and against it if c \u003c 0.","N-VM.B.5b","MH-19.2.D",0]]},{"n":3,"title":"Solve problems with vectors (+)","los":[["MH-19.3.A",441,"(+) Solve problems involving velocity and other quantities that can be represented by vectors, e.g. a plane's ground velocity in a crosswind.","Resultant = vector sum of the contributions; resolve into components to add.","N-VM.A.3","MH-19.2.B",0]]},{"n":4,"title":"Perform operations on matrices and use matrices in applications (+)","los":[["MH-19.4.A",442,"(+) Use matrices to represent and manipulate data, e.g. payoffs or incidence relationships in a network.","Entry (i, j) records the relationship of row item i to column item j.","N-VM.C.6","",0],["MH-19.4.B",443,"(+) Multiply a matrix by a scalar to produce a new matrix, e.g. when all of the payoffs in a game are doubled.","cA multiplies every entry by c.","N-VM.C.7","MH-19.4.A",0],["MH-19.4.C",444,"(+) Add, subtract and multiply matrices of appropriate dimensions.","(m×n)(n×p) = m×p; entry (i, j) = row i of the first · column j of the second.","N-VM.C.8","MH-19.4.B",0],["MH-19.4.D",445,"(+) Show that multiplication of square matrices is not commutative but is associative and distributive.","AB ≠ BA in general; one 2×2 counterexample proves it.","N-VM.C.9","MH-19.4.C",0],["MH-19.4.E",446,"(+) Explain the roles of the zero and identity matrices, and that a square matrix has a multiplicative inverse exactly when its determinant is nonzero.","det [[a, b], [c, d]] = ad − bc; AI = IA = A; A + 0 = A.","N-VM.C.10","MH-19.4.D",1],["MH-19.4.F",447,"(+) Multiply a vector (as a one-column matrix) by a matrix of suitable dimensions to produce another vector.","Av is a combination of A's columns weighted by v's entries.","N-VM.C.11","MH-19.4.C MH-19.2.D",0],["MH-19.4.G",448,"(+) Work with 2×2 matrices as transformations of the plane, and interpret the absolute value of the determinant as an area scale factor.","The columns of A are the images of (1, 0) and (0, 1); area scales by |det A|.","N-VM.C.12","MH-19.4.F MH-19.4.E MH-6.1.E",0]]},{"n":5,"title":"Solve systems of linear equations with matrices (+)","los":[["MH-19.5.A",449,"(+) Represent a system of linear equations as a single matrix equation Ax = b in a vector variable.","Rows of A hold the coefficients, x the unknowns, b the constants.","A-REI.C.8","MH-19.4.F MH-2.7.B",1],["MH-19.5.B",450,"(+) Find the inverse of a matrix if it exists and use it to solve a system of linear equations (technology for 3×3 or larger).","For 2×2, A⁻¹ = (1/det A)[[d, −b], [−c, a]]; then x = A⁻¹b.","A-REI.C.9","MH-19.5.A MH-19.4.E",2]]}]},{"n":20,"title":"Conic sections and Cavalieri's principle","scope":"core","topics":[{"n":1,"title":"Ellipses, hyperbolas and the volume of a sphere (+)","los":[["MH-20.1.A",451,"(+) Derive the equations of ellipses and hyperbolas given the foci, using the fact that the sum or difference of distances from the foci is constant.","Ellipse x²/a² + y²/b² = 1 with c² = a² − b²; hyperbola x²/a² − y²/b² = 1 with c² = a² + b².","G-GPE.A.3","MH-9.2.A MH-10.3.A",0],["MH-20.1.B",452,"(+) Give an informal argument using Cavalieri's principle for the formulas for the volume of a sphere and other solid figures.","Solids with equal cross-sectional areas at every height have equal volumes.","G-GMD.A.2","MH-8.1.A",0]]}]},{"n":21,"title":"Expected value and decisions","scope":"extension","topics":[{"n":1,"title":"Calculate expected values and use them to solve problems (+)","los":[["MH-21.1.A",453,"(+) Define a random variable for a quantity of interest by assigning a numerical value to each event in a sample space, and graph its probability distribution.","A probability distribution lists each value with its probability; the probabilities sum to 1.","S-MD.A.1","MH-11.1.A",0],["MH-21.1.B",454,"(+) Calculate the expected value of a random variable and interpret it as the mean of the probability distribution.","E[X] = Σ x·P(X = x).","S-MD.A.2","MH-21.1.A",0],["MH-21.1.C",455,"(+) Develop a theoretical probability distribution and find the expected value, e.g. the number of correct answers from guessing on a multiple-choice test.","Binomial: P(X = k) = C(n, k)p^k(1 − p)^(n−k), E[X] = np.","S-MD.A.3","MH-21.1.B MH-11.2.D",1],["MH-21.1.D",456,"(+) Develop an empirical probability distribution from observed frequencies and find the expected value.","Use relative frequencies as the probabilities.","S-MD.A.4","MH-21.1.B",0]]},{"n":2,"title":"Use probability to evaluate outcomes of decisions (+)","los":[["MH-21.2.A",457,"(+) Find the expected payoff for a game of chance, e.g. a state lottery ticket or a fast-food prize game.","Expected payoff = Σ payoff × probability − cost.","S-MD.B.5a","MH-21.1.B",0],["MH-21.2.B",458,"(+) Evaluate and compare strategies on the basis of expected values, e.g. a high-deductible versus a low-deductible insurance policy.","Choose the option with the better expected value, then weigh the spread of outcomes.","S-MD.B.5b","MH-21.2.A",0]]}]}]},{"id":"calculus","title":"Calculus","code":"CA","track":"math","requires":["math-hs"],"units":[{"n":1,"title":"Limits and continuity","scope":"core","topics":[{"n":1,"title":"Can change occur at an instant?","los":[["CA-1.1.A",459,"Explain why an instantaneous rate of change has to be defined as a limit of average rates over shrinking intervals.","Average rate = Δy/Δx over an interval; at a single instant Δx = 0, so the rate is what Δy/Δx approaches as Δx → 0.","CHA-1.A","",0]]},{"n":2,"title":"Limits and limit notation","los":[["CA-1.2.A",460,"Read and write limit statements in symbols and words, including one-sided limits.","lim_(x→c) f(x) = L means f(x) can be made as close to L as wanted by taking x close enough to c (x ≠ c); f(c) itself is irrelevant.","LIM-1.A","",0],["CA-1.2.B",461,"Decide whether a limit exists by comparing the two one-sided limits.","lim_(x→c) f(x) exists ⇔ both one-sided limits exist and are equal; unbounded or oscillating behaviour means no limit.","LIM-1.B","CA-1.2.A",0]]},{"n":3,"title":"Estimating limits from graphs","los":[["CA-1.3.A",462,"Estimate one-sided and two-sided limits from a graph, including at holes and jumps.","Follow the curve toward x = c from each side; an open circle or a filled dot elsewhere does not change the limit.","LIM-1.C","CA-1.2.B",0]]},{"n":4,"title":"Estimating limits from tables","los":[["CA-1.4.A",463,"Estimate a limit from a table of values that approach c from both sides, and say when the table is not enough.","Look for a common trend from left and right; a table can mislead if the sampled x-values miss oscillation.","LIM-1.C","CA-1.2.B",0]]},{"n":5,"title":"Limit laws","los":[["CA-1.5.A",464,"Find limits of sums, products, quotients and compositions from the limits of their parts, and by direct substitution at points of an elementary function's domain.","lim(f ± g), lim(fg), lim(f/g) (denominator limit ≠ 0) are the sums, products, quotients of the limits; elementary functions are continuous on their domains, so substitution works there.","LIM-1.D","",0]]},{"n":6,"title":"Algebraic manipulation of limits","los":[["CA-1.6.A",465,"Evaluate a 0/0 limit by factoring and cancelling, or by multiplying by a conjugate to clear a radical.","f and the simplified form agree for x ≠ c, so their limits at c are the same; (√a − √b)(√a + √b) = a − b.","LIM-1.E","CA-1.5.A",0],["CA-1.6.B",466,"Evaluate trig limits by rewriting them in terms of sin x / x → 1 and (1 − cos x)/x → 0.","lim_(x→0) sin(kx)/(kx) = 1; multiply and divide by k to set it up.","LIM-1.E","CA-1.5.A",0]]},{"n":7,"title":"Selecting procedures for limits","los":[["CA-1.7.A",467,"Choose a limit procedure from the form the expression takes at c: substitute, factor, rationalize, use a trig identity, or recognise a nonzero/0 infinite limit.","Substitute first: a number means done; 0/0 means manipulate; nonzero/0 means an infinite limit or none.","LIM-1.D, LIM-1.E","CA-1.6.A CA-1.6.B",0]]},{"n":8,"title":"The squeeze theorem","los":[["CA-1.8.A",468,"Find a limit with the squeeze theorem after bounding the function between two functions with a common limit.","g ≤ f ≤ h near c and lim g = lim h = L ⇒ lim f = L; −1 ≤ sin(anything) ≤ 1 is the usual bound.","LIM-1.E","CA-1.5.A",0]]},{"n":9,"title":"Connecting representations of limits","los":[["CA-1.9.A",469,"Find the same limit from a graph, a table and a formula, and resolve disagreements between them.","Graphs and tables estimate; algebra decides. All three should agree once the scale and sample are right.","LIM-1.C, LIM-1.D","CA-1.3.A CA-1.4.A CA-1.7.A",0]]},{"n":10,"title":"Types of discontinuities","los":[["CA-1.10.A",470,"Classify a discontinuity as removable, jump or infinite from a graph or formula.","Removable: limit exists but ≠ f(c) or f(c) undefined; jump: one-sided limits differ; infinite: a one-sided limit is ±∞.","LIM-2.A","CA-1.2.B",0]]},{"n":11,"title":"Continuity at a point","los":[["CA-1.11.A",471,"Prove or disprove continuity at a point by checking the three conditions.","f continuous at c ⇔ f(c) is defined, lim_(x→c) f(x) exists, and they are equal.","LIM-2.A","CA-1.10.A",0]]},{"n":12,"title":"Continuity over an interval","los":[["CA-1.12.A",472,"State the intervals on which a function (including a piecewise one) is continuous.","Polynomials, rational, power, exponential, log and trig functions are continuous on their domains; check a piecewise function at its break points.","LIM-2.B","CA-1.11.A",0]]},{"n":13,"title":"Removing discontinuities","los":[["CA-1.13.A",473,"Remove a discontinuity: redefine f at a removable point, or solve for constants that make a piecewise function continuous at its break.","Set f(c) = lim_(x→c) f(x); for a piecewise function, match the left and right limits at the break and f(c).","LIM-2.C","CA-1.11.A CA-1.6.A",0]]},{"n":14,"title":"Infinite limits and vertical asymptotes","los":[["CA-1.14.A",474,"Find vertical asymptotes and the sign of the infinite one-sided limits at each.","Nonzero/0 at x = c ⇒ x = c is a vertical asymptote; the sign of numerator and denominator on each side gives +∞ or −∞.","LIM-2.D","CA-1.10.A",0]]},{"n":15,"title":"Limits at infinity and horizontal asymptotes","los":[["CA-1.15.A",475,"Find limits at ±∞ and horizontal asymptotes of rational and radical expressions, and of expressions mixing exponentials, powers and logs.","Divide by the highest power in the denominator: deg num \u003c deg den → 0, equal → ratio of leading coefficients, greater → unbounded; √(x²) = |x|; as x → ∞, ln x ≪ x^p ≪ e^x.","LIM-2.D","",0]]},{"n":16,"title":"The Intermediate Value Theorem","los":[["CA-1.16.A",476,"Use the IVT to justify that a function takes a given value (or has a root) on an interval, after confirming continuity.","f continuous on [a, b] and N between f(a) and f(b) ⇒ f(c) = N for some c in (a, b).","FUN-1.A","CA-1.12.A",0]]}]},{"n":2,"title":"Differentiation: definition and fundamental properties","scope":"core","topics":[{"n":1,"title":"Average and instantaneous rates of change","los":[["CA-2.1.A",477,"Calculate an average rate of change as the slope of a secant line.","(f(b) − f(a))/(b − a), in units of output per unit input.","CHA-2.A","",0],["CA-2.1.B",478,"Express an instantaneous rate of change as the limit of a difference quotient.","lim_(h→0) (f(a + h) − f(a))/h — the secant slope as the interval shrinks to a point.","CHA-2.B","CA-2.1.A CA-1.1.A",0]]},{"n":2,"title":"The derivative and its notation","los":[["CA-2.2.A",479,"Compute a derivative from the limit definition (h-form or x → a form), and recognise a given difference-quotient limit as a derivative.","f′(x) = lim_(h→0)(f(x+h) − f(x))/h; f′(a) = lim_(x→a)(f(x) − f(a))/(x − a); lim_(h→0)(sin(π/3 + h) − sin(π/3))/h is just cos(π/3).","CHA-2.B","CA-2.1.B CA-1.6.A",0],["CA-2.2.B",480,"Write the equation of the tangent line at a point, using f′, dy/dx or d/dx notation correctly.","y − f(a) = f′(a)(x − a).","CHA-2.C","CA-2.2.A",0]]},{"n":3,"title":"Estimating derivatives at a point","los":[["CA-2.3.A",481,"Estimate a derivative at a point from a table or graph with a difference quotient.","Use the closest bracketing data: (f(b) − f(a))/(b − a) estimates f′ between a and b; a symmetric quotient is usually best.","CHA-2.D","CA-2.1.A",0]]},{"n":4,"title":"Differentiability and continuity","los":[["CA-2.4.A",482,"Identify where a function fails to be differentiable (discontinuity, corner, cusp, vertical tangent), including at the break of a piecewise function.","Differentiable ⇒ continuous, not conversely; a piecewise function is differentiable at its break only if it is continuous there and the one-sided derivatives match.","FUN-2.A","CA-2.2.A CA-1.13.A",0]]},{"n":5,"title":"The power rule","los":[["CA-2.5.A",483,"Differentiate x^n for any real n, rewriting roots and reciprocals as powers first.","d/dx x^n = n x^(n−1); √x = x^(1/2), 1/x³ = x^(−3).","FUN-3.A","CA-2.2.A",0]]},{"n":6,"title":"Constant, sum, difference and constant-multiple rules","los":[["CA-2.6.A",484,"Differentiate polynomials and sums of power terms term by term.","Derivative is linear: (af + bg)′ = af′ + bg′; constants differentiate to 0.","FUN-3.A","CA-2.5.A",0]]},{"n":7,"title":"Derivatives of sin x, cos x, e^x and ln x","los":[["CA-2.7.A",485,"Differentiate sin x, cos x, e^x and ln x and combinations of them with the sum and constant-multiple rules.","(sin x)′ = cos x, (cos x)′ = −sin x, (e^x)′ = e^x, (ln x)′ = 1/x.","FUN-3.A","CA-2.6.A",0],["CA-2.7.B",486,"Derive the derivative of sin x or e^x from the limit definition.","sin(x+h) = sin x cos h + cos x sin h, then use sin h/h → 1 and (cos h − 1)/h → 0.","LIM-3.A","CA-2.2.A CA-1.6.B",0]]},{"n":8,"title":"The product rule","los":[["CA-2.8.A",487,"Differentiate a product, from a formula or from given values of f, g, f′, g′.","(fg)′ = f′g + fg′.","FUN-3.B","CA-2.7.A",0]]},{"n":9,"title":"The quotient rule","los":[["CA-2.9.A",488,"Differentiate a quotient, from a formula or from given values.","(f/g)′ = (f′g − fg′)/g².","FUN-3.B","CA-2.8.A",0]]},{"n":10,"title":"Derivatives of tan, cot, sec and csc","los":[["CA-2.10.A",489,"Derive and use the derivatives of tan x, cot x, sec x and csc x.","Write each as a quotient of sin and cos: (tan x)′ = sec²x, (sec x)′ = sec x tan x, (cot x)′ = −csc²x, (csc x)′ = −csc x cot x.","FUN-3.B","CA-2.9.A",0]]}]},{"n":3,"title":"Differentiation: composite, implicit and inverse functions","scope":"core","topics":[{"n":1,"title":"The chain rule","los":[["CA-3.1.A",490,"Differentiate a composite function with the chain rule — nested compositions, b^x and log_b x, and from tables or graphs of f, g and their derivatives.","(f(g(x)))′ = f′(g(x)) g′(x); (b^x)′ = b^x ln b, (log_b x)′ = 1/(x ln b); from a table read g(a) first, then f′ at that value.","FUN-3.C","CA-2.10.A",0]]},{"n":2,"title":"Implicit differentiation","los":[["CA-3.2.A",491,"Find dy/dx for an implicitly defined relation and the slope or tangent line at a point on it.","Every y-term gets a factor dy/dx by the chain rule; collect the dy/dx terms and solve; substitute both x and y of the point.","FUN-3.D","CA-3.1.A CA-2.2.B",1]]},{"n":3,"title":"Derivatives of inverse functions","los":[["CA-3.3.A",492,"Find the derivative of an inverse function at a point from f, a table or a graph.","If f(a) = b then (f⁻¹)′(b) = 1/f′(a) — reciprocal slope at the reflected point.","FUN-3.E","CA-3.1.A",0]]},{"n":4,"title":"Derivatives of inverse trig functions","los":[["CA-3.4.A",493,"Differentiate arcsin, arccos and arctan (and compositions with them).","(arcsin x)′ = 1/√(1 − x²), (arccos x)′ = −1/√(1 − x²), (arctan x)′ = 1/(1 + x²).","FUN-3.E","CA-3.3.A",0]]},{"n":5,"title":"Selecting procedures for derivatives","los":[["CA-3.5.A",494,"Choose and combine the differentiation rules a given expression needs, simplifying first when it helps.","Read the outermost operation: sum → term by term, product → product rule, quotient → quotient rule (or rewrite), composition → chain rule.","FUN-3.A, FUN-3.B, FUN-3.C, FUN-3.D, FUN-3.E","CA-3.1.A CA-3.2.A CA-3.4.A",0],["CA-3.5.B",495,"Differentiate a variable power such as x^x or a messy product by logarithmic differentiation.","Take ln of both sides, differentiate implicitly: y′ = y·(ln y)′. Beyond the CED, but used everywhere downstream.","FUN-3.C","CA-3.2.A",0]]},{"n":6,"title":"Higher-order derivatives","los":[["CA-3.6.A",496,"Compute second and higher derivatives, including d²y/dx² of an implicit relation.","f″ = (f′)′, d²y/dx²; implicitly, differentiate dy/dx again and replace each dy/dx with its expression.","FUN-3.F","CA-3.5.A",0]]}]},{"n":4,"title":"Contextual applications of differentiation","scope":"core","topics":[{"n":1,"title":"The derivative in context","los":[["CA-4.1.A",497,"Interpret f′(a) in context, with units, as the rate of change of the quantity at that input.","Units of f′ = output units per input unit; sign says increasing or decreasing at that instant.","CHA-3.A","CA-2.2.A",0]]},{"n":2,"title":"Straight-line motion","los":[["CA-4.2.A",498,"Find velocity, acceleration and speed from position, and decide when the particle moves left/right or speeds up/slows down.","v = x′, a = v′ = x″; speed = |v|; speeding up ⇔ v and a have the same sign.","CHA-3.B","CA-3.6.A",0]]},{"n":3,"title":"Rates of change in other contexts","los":[["CA-4.3.A",499,"Interpret first and second derivatives of applied quantities (cost, population, temperature, volume) in context.","f′ is the rate; f″ says whether that rate is itself rising or falling.","CHA-3.C","CA-4.1.A",0]]},{"n":4,"title":"Introduction to related rates","los":[["CA-4.4.A",500,"Differentiate an equation linking several quantities with respect to time to relate their rates.","Implicit differentiation in t: every changing quantity gets its own d/dt.","CHA-3.D","CA-3.2.A",0]]},{"n":5,"title":"Solving related rates problems","los":[["CA-4.5.A",501,"Solve a related-rates problem: draw, relate the quantities with geometry, differentiate, then substitute the instant's values.","Substitute values only after differentiating; similar triangles or Pythagoras usually give the relation.","CHA-3.E","CA-4.4.A",0]]},{"n":6,"title":"Local linearity and linearization","los":[["CA-4.6.A",502,"Approximate a function value with the tangent-line approximation.","f(x) ≈ f(a) + f′(a)(x − a) for x near a.","CHA-3.F","CA-2.2.B",0],["CA-4.6.B",503,"Decide whether a tangent-line approximation over- or under-estimates, from concavity.","Concave up ⇒ tangent lies below ⇒ underestimate; concave down ⇒ overestimate.","CHA-3.F","CA-4.6.A CA-3.6.A",0]]},{"n":7,"title":"L'Hospital's rule","los":[["CA-4.7.A",504,"Evaluate a 0/0 or ∞/∞ limit with L'Hospital's rule after confirming the form.","Indeterminate f/g ⇒ lim f/g = lim f′/g′ if the latter exists; check the form again before reapplying.","LIM-4.A","CA-3.5.A CA-1.7.A",0],["CA-4.7.B",505,"Rewrite 0·∞, ∞ − ∞, 1^∞, 0⁰ and ∞⁰ forms as a quotient (or take a log) and apply L'Hospital's rule.","0·∞: f/(1/g); powers: L = e^(lim g ln f). Beyond the CED, standard in college calculus.","LIM-4.A","CA-4.7.A",0]]}]},{"n":5,"title":"Analytical applications of differentiation","scope":"core","topics":[{"n":1,"title":"The Mean Value Theorem","los":[["CA-5.1.A",506,"Verify the MVT hypotheses and find or justify a point where the instantaneous rate equals the average rate.","f continuous on [a, b], differentiable on (a, b) ⇒ f′(c) = (f(b) − f(a))/(b − a) for some c in (a, b).","FUN-1.B","CA-2.4.A CA-2.1.A",0]]},{"n":2,"title":"Extreme Value Theorem and critical points","los":[["CA-5.2.A",507,"Decide whether the EVT guarantees absolute extrema on an interval, and find the critical points of a function.","Continuous on a closed, bounded interval ⇒ absolute max and min exist; critical point: c in the domain with f′(c) = 0 or undefined — local extrema occur only there.","FUN-1.C","CA-1.12.A CA-3.5.A",0]]},{"n":3,"title":"Increasing and decreasing intervals","los":[["CA-5.3.A",508,"Find the intervals where a function increases or decreases with a sign chart of f′.","f′ > 0 on an interval ⇒ f increasing there; f′ \u003c 0 ⇒ decreasing.","FUN-4.A","CA-5.2.A",0]]},{"n":4,"title":"The first derivative test","los":[["CA-5.4.A",509,"Classify each critical point as a relative max, min or neither by the sign change of f′.","f′ changes + to − ⇒ relative max; − to + ⇒ relative min; no change ⇒ neither.","FUN-4.A","CA-5.3.A",0]]},{"n":5,"title":"The candidates test","los":[["CA-5.5.A",510,"Find absolute extrema on a closed interval by comparing f at critical points and endpoints.","Largest value among the candidates is the absolute max, smallest the absolute min.","FUN-4.A","CA-5.2.A",0]]},{"n":6,"title":"Concavity and points of inflection","los":[["CA-5.6.A",511,"Find intervals of concavity and points of inflection from the sign of f″.","f″ > 0 ⇒ concave up (f′ increasing); inflection where f″ changes sign, not merely where f″ = 0.","FUN-4.A","CA-3.6.A CA-5.3.A",0]]},{"n":7,"title":"The second derivative test","los":[["CA-5.7.A",512,"Classify a critical point with f′(c) = 0 using the sign of f″(c), and say when the test fails.","f″(c) > 0 ⇒ min, \u003c 0 ⇒ max, = 0 ⇒ inconclusive (go back to the first derivative test).","FUN-4.A","CA-5.6.A CA-5.4.A",0]]},{"n":8,"title":"Sketching graphs of functions and their derivatives","los":[["CA-5.8.A",513,"Sketch the graph of f′ from the graph of f, and a possible f from the graph of f′.","Zeros of f′ at horizontal tangents of f; f′ positive where f rises; extrema of f′ at inflection points of f.","FUN-4.A","CA-5.6.A",0]]},{"n":9,"title":"Connecting f, f′ and f″","los":[["CA-5.9.A",514,"Read the extrema, monotonicity, concavity and inflection points of f from a graph or table of f′ (or f″), and justify each claim.","Justify from the derivative given, not from the shape of its graph: 'f′ changes from + to − at x = 2'.","FUN-4.A","CA-5.8.A CA-5.7.A",0]]},{"n":10,"title":"Setting up optimization problems","los":[["CA-5.10.A",515,"Translate an optimization situation into a function of one variable with its feasible domain.","Write the quantity to optimize, use the constraint to eliminate a variable, state the domain from physical limits.","FUN-4.B","CA-5.5.A",0]]},{"n":11,"title":"Solving optimization problems","los":[["CA-5.11.A",516,"Solve an optimization problem and justify that the answer is the absolute extremum.","Candidates test on a closed domain; on an open domain, a single critical point that is a relative extremum is absolute.","FUN-4.C","CA-5.10.A",0]]},{"n":12,"title":"Behaviour of implicit relations","los":[["CA-5.12.A",517,"Find the points where an implicit curve has a horizontal or vertical tangent.","dy/dx = N/D: horizontal where N = 0 (D ≠ 0), vertical where D = 0 (N ≠ 0); the point must lie on the curve.","FUN-4.D","CA-3.2.A",0],["CA-5.12.B",518,"Use implicit dy/dx and d²y/dx² to classify extrema and concavity of an implicit curve at a point.","At a point with dy/dx = 0, the sign of d²y/dx² gives max/min, as in the second derivative test.","FUN-4.E","CA-5.12.A CA-3.6.A CA-5.7.A",0]]}]},{"n":6,"title":"Integration and accumulation of change","scope":"core","topics":[{"n":1,"title":"Accumulations of change","los":[["CA-6.1.A",519,"Interpret the area between a rate graph and the axis as accumulated change, with units and sign.","rate × time = amount; area below the axis counts as negative change.","CHA-4.A","CA-4.1.A",0]]},{"n":2,"title":"Riemann sums","los":[["CA-6.2.A",520,"Approximate a definite integral with left, right, midpoint or trapezoidal sums from a formula or a table with unequal subintervals.","Sum of (height × width); trapezoid = average of left and right heights × width.","LIM-5.A","CA-6.1.A",0],["CA-6.2.B",521,"Decide whether a Riemann or trapezoidal sum over- or under-estimates from monotonicity or concavity.","Increasing f: left sum under, right sum over. Concave up: trapezoid over, midpoint under.","LIM-5.A","CA-6.2.A CA-5.6.A",0]]},{"n":3,"title":"Riemann sums, summation notation and the definite integral","los":[["CA-6.3.A",522,"Write a Riemann sum in sigma notation and convert between a limit of Riemann sums and a definite integral.","Δx = (b − a)/n, x_k = a + kΔx; ∫_a^b f(x)dx = lim_(n→∞) Σ f(x_k)Δx — read b − a from Δx and a from x_k.","LIM-5.B, LIM-5.C","CA-6.2.A",0]]},{"n":4,"title":"The Fundamental Theorem and accumulation functions","los":[["CA-6.4.A",523,"Differentiate an accumulation function, including variable upper and lower limits.","d/dx ∫_a^x f(t)dt = f(x); with limit g(x): f(g(x))g′(x); a variable lower limit flips the sign.","FUN-5.A","CA-6.3.A CA-3.1.A",0]]},{"n":5,"title":"Behaviour of accumulation functions","los":[["CA-6.5.A",524,"Find where g(x) = ∫_a^x f(t)dt increases, has extrema and changes concavity, from the graph of f.","g′ = f and g″ = f′: g rises where f > 0, peaks where f changes + to −, inflects at extrema of f.","FUN-5.A","CA-6.4.A CA-5.9.A",0]]},{"n":6,"title":"Properties of definite integrals","los":[["CA-6.6.A",525,"Evaluate definite integrals from geometry (areas of triangles, rectangles, circles) and the properties of integrals.","∫_a^b = ∫_a^c + ∫_c^b; ∫_b^a = −∫_a^b; ∫(kf + g) = k∫f + ∫g; ∫_a^a = 0.","FUN-6.A","CA-6.1.A",0]]},{"n":7,"title":"The Fundamental Theorem and definite integrals","los":[["CA-6.7.A",526,"Evaluate a definite integral with an antiderivative, or find a function value from f(a) plus an integral of f′.","∫_a^b f(x)dx = F(b) − F(a); f(b) = f(a) + ∫_a^b f′(x)dx.","FUN-6.B","CA-6.4.A CA-6.6.A",0]]},{"n":8,"title":"Basic antiderivatives","los":[["CA-6.8.A",527,"Find indefinite integrals of power, exponential, trig, 1/x and inverse-trig-form integrands, rewriting the integrand first when needed.","∫x^n dx = x^(n+1)/(n+1) + C (n ≠ −1); ∫dx/x = ln|x| + C; ∫dx/(1 + x²) = arctan x + C; always + C.","FUN-6.C","CA-3.4.A CA-6.7.A",0]]},{"n":9,"title":"Integration by substitution","los":[["CA-6.9.A",528,"Evaluate indefinite and definite integrals by u-substitution, changing the limits to u-values for a definite integral.","∫f(g(x))g′(x)dx = ∫f(u)du; a missing constant factor is fine, a missing x is not; ∫_a^b → ∫_(g(a))^(g(b)).","FUN-6.D","CA-6.8.A CA-3.1.A",2]]},{"n":10,"title":"Long division and completing the square","los":[["CA-6.10.A",529,"Integrate a rational function after long division (improper fraction) or completing the square (to an arctan form).","deg num ≥ deg den ⇒ divide first; x² + bx + c = (x + b/2)² + k², ∫du/(u² + k²) = (1/k) arctan(u/k) + C.","FUN-6.D","CA-6.9.A",0]]},{"n":11,"title":"Integration by parts (BC only)","los":[["CA-6.11.A",530,"Evaluate an integral by parts, choosing u by LIATE, including log and inverse-trig integrands.","∫u dv = uv − ∫v du; pick u to simplify when differentiated (ln x, arctan x, polynomials).","FUN-6.E","CA-6.9.A",2],["CA-6.11.B",531,"Evaluate integrals that need repeated parts (tabular) or that cycle back to themselves (e^ax·trig).","Tabular: differentiate u to 0, integrate dv, alternate signs. Cyclic: the original integral reappears — solve algebraically.","FUN-6.E","CA-6.11.A",2]]},{"n":12,"title":"Linear partial fractions (BC only)","los":[["CA-6.12.A",532,"Decompose a rational function with distinct linear factors into partial fractions and integrate it.","A/(x − a) + B/(x − b) + …; cover-up: A = (rest of the fraction) evaluated at x = a; ∫A/(x − a) = A ln|x − a|.","FUN-6.F","CA-6.9.A",2],["CA-6.12.B",533,"Decompose and integrate with repeated linear factors, irreducible quadratic factors or an improper fraction (beyond the CED).","(x − a)^k needs k terms; an irreducible quadratic gets (Ax + B); divide first if improper.","FUN-6.F","CA-6.12.A CA-6.10.A",2]]},{"n":13,"title":"Improper integrals (BC only)","los":[["CA-6.13.A",534,"Evaluate an improper integral — infinite interval or unbounded integrand — as a limit, or show it diverges.","∫_a^∞ f dx = lim_(b→∞) ∫_a^b f dx; split at an infinite discontinuity and take one-sided limits; ∫_1^∞ dx/x^p converges ⇔ p > 1, ∫_0^1 dx/x^p ⇔ p \u003c 1.","LIM-6.A","CA-6.7.A CA-1.15.A CA-1.14.A",0]]},{"n":14,"title":"Selecting techniques of antidifferentiation","los":[["CA-6.14.A",535,"Choose the antidifferentiation technique an integrand calls for: basic rule, substitution, division, completing the square, parts or partial fractions.","Look for an inner function and its derivative first; then products of unlike types (parts); then rational functions (division, then partial fractions).","FUN-6.C, FUN-6.D, FUN-6.E, FUN-6.F","CA-6.10.A CA-6.11.A CA-6.12.A",0]]}]},{"n":7,"title":"Differential equations","scope":"core","topics":[{"n":1,"title":"Modeling with differential equations","los":[["CA-7.1.A",536,"Write a differential equation from a verbal description of a rate (proportional to, inversely proportional to, …).","'Rate of change of y is proportional to y' ⇒ dy/dt = ky; identify the dependent and independent variables first.","FUN-7.A","CA-4.3.A",0]]},{"n":2,"title":"Verifying solutions","los":[["CA-7.2.A",537,"Verify that a function solves a differential equation by substituting it and its derivatives.","A solution makes the equation an identity for all t in an interval, not just at one point.","FUN-7.B","CA-3.6.A CA-7.1.A",0]]},{"n":3,"title":"Sketching slope fields","los":[["CA-7.3.A",538,"Sketch a slope field for dy/dx = f(x, y) at given points.","At each grid point draw a short segment with slope f(x, y); slopes depend on x only, y only, or both.","FUN-7.C","CA-7.2.A",0]]},{"n":4,"title":"Reasoning with slope fields","los":[["CA-7.4.A",539,"Match a slope field to its differential equation and sketch the solution through a given point.","Check where slopes are 0, where they are constant along vertical or horizontal lines, and their sign in each quadrant; solution curves follow the segments.","FUN-7.C","CA-7.3.A",0]]},{"n":5,"title":"Euler's method (BC only)","los":[["CA-7.5.A",540,"Approximate a solution value with a few steps of Euler's method, and say whether it over- or under-estimates.","y_(n+1) = y_n + h·f(x_n, y_n); concave-up solutions are underestimated (tangent-line steps lie below).","FUN-7.C","CA-7.4.A CA-4.6.B",0]]},{"n":6,"title":"Separation of variables — general solutions","los":[["CA-7.6.A",541,"Find the general solution of a separable differential equation.","dy/dx = g(x)h(y) ⇒ ∫dy/h(y) = ∫g(x)dx + C; one constant is enough.","FUN-7.D","CA-6.9.A CA-7.2.A",0]]},{"n":7,"title":"Separation of variables — particular solutions","los":[["CA-7.7.A",542,"Find the particular solution of a separable IVP, solve for y, and state its domain.","Use the initial condition to find C before solving for y; the domain is the interval containing x₀ where the solution is defined.","FUN-7.E","CA-7.6.A",0]]},{"n":8,"title":"Exponential models","los":[["CA-7.8.A",543,"Solve dy/dt = ky, apply it to growth, decay and Newton cooling, and find a doubling time, half-life or time to reach a value.","y = y₀e^(kt); dT/dt = −k(T − T_a) ⇒ T = T_a + (T₀ − T_a)e^(−kt); t_double = ln 2/k, t_half = ln 2/|k|.","FUN-7.F, FUN-7.G","CA-7.7.A",0]]},{"n":9,"title":"Logistic models (BC only)","los":[["CA-7.9.A",544,"Find the carrying capacity, the long-run limit and the population at which growth is fastest from a logistic differential equation.","dy/dt = ky(1 − y/L): y → L for y₀ > 0; growth is fastest at y = L/2, where the solution inflects.","FUN-7.H","CA-7.8.A CA-5.6.A",0]]}]},{"n":8,"title":"Applications of integration","scope"

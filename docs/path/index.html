:"core","topics":[{"n":1,"title":"Average value of a function","los":[["CA-8.1.A",545,"Find the average value of a function on an interval.","f_avg = (1/(b − a))∫_a^b f(x)dx — the height of the rectangle with the same area.","CHA-4.B","CA-6.7.A",0]]},{"n":2,"title":"Position, velocity and acceleration with integrals","los":[["CA-8.2.A",546,"Find displacement, total distance and position at a time from a velocity function.","Displacement = ∫v dt; distance = ∫|v| dt (split at sign changes); x(t) = x(0) + ∫_0^t v.","CHA-4.C","CA-6.7.A CA-4.2.A",0]]},{"n":3,"title":"Accumulation in applied contexts","los":[["CA-8.3.A",547,"Find an amount at a time from an initial amount plus the integral of a net rate (in − out), and interpret the integral in context with units.","A(t) = A(0) + ∫_0^t (in − out) dt; ∫_a^b r(t)dt is net change, in rate units × time units.","CHA-4.D, CHA-4.E","CA-6.7.A",0]]},{"n":4,"title":"Area between curves (functions of x)","los":[["CA-8.4.A",548,"Find the area between two curves y = f(x), y = g(x), finding the limits from their intersections.","A = ∫(top − bottom)dx.","CHA-5.A","CA-6.7.A",0]]},{"n":5,"title":"Area between curves (functions of y)","los":[["CA-8.5.A",549,"Find the area between curves x = f(y), x = g(y) by integrating in y.","A = ∫(right − left)dy; choose y when slicing in x would need two integrals.","CHA-5.A","CA-8.4.A",0]]},{"n":6,"title":"Curves that intersect more than twice","los":[["CA-8.6.A",550,"Find the area enclosed by curves that cross several times by splitting the interval at each intersection.","A = ∫|f − g|dx: the top curve changes at each crossing.","CHA-5.A","CA-8.4.A",0]]},{"n":7,"title":"Cross sections — squares and rectangles","los":[["CA-8.7.A",551,"Find the volume of a solid with square or rectangular cross sections perpendicular to an axis.","V = ∫A(x)dx; side s = top − bottom ⇒ A = s² (or s·(given height)).","CHA-5.B","CA-8.4.A",0]]},{"n":8,"title":"Cross sections — triangles and semicircles","los":[["CA-8.8.A",552,"Find the volume of a solid with triangular or semicircular cross sections.","Equilateral: (√3/4)s²; isosceles right on a leg: s²/2; semicircle on diameter s: (π/8)s².","CHA-5.B","CA-8.7.A",0]]},{"n":9,"title":"Disc method about the x- or y-axis","los":[["CA-8.9.A",553,"Find the volume of a solid of revolution about a coordinate axis by discs.","V = π∫R(x)²dx, R = distance from axis to curve.","CHA-5.C","CA-8.7.A",0]]},{"n":10,"title":"Disc method about other axes","los":[["CA-8.10.A",554,"Find a disc-method volume about a horizontal or vertical line other than an axis.","Revolving about y = k: R = |f(x) − k|.","CHA-5.C","CA-8.9.A",0]]},{"n":11,"title":"Washer method about the x- or y-axis","los":[["CA-8.11.A",555,"Find the volume of a solid of revolution with a hole by washers about a coordinate axis.","V = π∫(R² − r²)dx: outer radius squared minus inner radius squared, not (R − r)².","CHA-5.C","CA-8.9.A",0]]},{"n":12,"title":"Washer method about other axes","los":[["CA-8.12.A",556,"Find a washer-method volume about a line other than an axis.","Both radii are distances from the axis of revolution: R = |far curve − k|, r = |near curve − k|.","CHA-5.C","CA-8.10.A CA-8.11.A",0]]},{"n":13,"title":"Arc length and distance travelled (BC only)","los":[["CA-8.13.A",557,"Set up and evaluate the arc length of a smooth curve y = f(x).","L = ∫_a^b √(1 + f′(x)²)dx.","CHA-6.A","CA-6.7.A",0]]},{"n":14,"title":"Physical applications (beyond the CED)","los":[["CA-8.14.A",558,"Compute work done by a variable force or in pumping a fluid by slicing and integrating.","W = ∫F(x)dx; pumping: W = ∫ρg·A(y)·(lift distance)dy.","CHA-4.E","CA-8.3.A",0]]}]},{"n":9,"title":"Parametric equations, polar coordinates and vector-valued functions (BC only)","scope":"bc","topics":[{"n":1,"title":"Derivatives of parametric equations","los":[["CA-9.1.A",559,"Find dy/dx and tangent lines for a parametric curve, including horizontal and vertical tangents.","dy/dx = (dy/dt)/(dx/dt); horizontal where dy/dt = 0, vertical where dx/dt = 0.","CHA-3.G","CA-3.5.A CA-2.2.B",0]]},{"n":2,"title":"Second derivatives of parametric equations","los":[["CA-9.2.A",560,"Find d²y/dx² for a parametric curve and use it for concavity.","d²y/dx² = (d/dt(dy/dx))/(dx/dt) — divide by dx/dt again, not by d²x/dt².","CHA-3.G","CA-9.1.A",0]]},{"n":3,"title":"Arc length of parametric curves","los":[["CA-9.3.A",561,"Find the arc length of a parametric curve.","L = ∫√((dx/dt)² + (dy/dt)²)dt.","CHA-6.B","CA-9.1.A CA-8.13.A",0]]},{"n":4,"title":"Derivatives of vector-valued functions","los":[["CA-9.4.A",562,"Differentiate a vector-valued function to get velocity and acceleration vectors.","r(t) = ⟨x(t), y(t)⟩ ⇒ v = ⟨x′, y′⟩, a = ⟨x″, y″⟩, componentwise.","CHA-3.H","CA-9.1.A",0]]},{"n":5,"title":"Integrating vector-valued functions","los":[["CA-9.5.A",563,"Integrate a velocity or acceleration vector with an initial condition to recover position.","Integrate each component; one constant vector fixed by r(t₀).","FUN-8.A","CA-9.4.A CA-6.7.A",0]]},{"n":6,"title":"Motion with parametric and vector functions","los":[["CA-9.6.A",564,"Find speed, displacement and total distance for planar motion given by vectors.","Speed = |v| = √(x′² + y′²); distance = ∫|v|dt; displacement = ∫v dt (a vector).","FUN-8.B","CA-9.5.A CA-9.3.A",0]]},{"n":7,"title":"Polar coordinates and their derivatives","los":[["CA-9.7.A",565,"Convert points and curves between polar and rectangular form.","x = r cos θ, y = r sin θ, r² = x² + y², tan θ = y/x (watch the quadrant).","FUN-3.G","",0],["CA-9.7.B",566,"Find dy/dx for a polar curve and interpret dr/dθ.","Treat θ as the parameter: x = r(θ)cos θ, y = r(θ)sin θ; dr/dθ > 0 ⇒ moving away from the pole.","FUN-3.G","CA-9.7.A CA-9.1.A",0]]},{"n":8,"title":"Area of a polar region","los":[["CA-9.8.A",567,"Find the area enclosed by a single polar curve, finding the θ-limits from where r = 0 or the curve closes.","A = ½∫_α^β r(θ)²dθ.","CHA-5.D","CA-9.7.A CA-6.7.A",0]]},{"n":9,"title":"Area between two polar curves","los":[["CA-9.9.A",568,"Find the area inside one polar curve and outside another.","A = ½∫(r_outer² − r_inner²)dθ between intersection angles.","CHA-5.D","CA-9.8.A",0]]}]},{"n":10,"title":"Infinite sequences and series (BC only)","scope":"bc","topics":[{"n":1,"title":"Convergent and divergent series","los":[["CA-10.1.A",569,"Define a series' sum as the limit of its partial sums and decide convergence from a partial-sum formula.","S_n = a₁ + … + a_n; Σa_n converges to S ⇔ S_n → S. Telescoping series collapse S_n.","LIM-7.A","CA-1.15.A",0]]},{"n":2,"title":"Geometric series","los":[["CA-10.2.A",570,"Decide whether a geometric series converges and find its sum.","Σ_(n=0)^∞ ar^n = a/(1 − r) if |r| \u003c 1; diverges if |r| ≥ 1.","LIM-7.A","CA-10.1.A",0]]},{"n":3,"title":"The nth-term test","los":[["CA-10.3.A",571,"Show a series diverges with the nth-term test, and explain why the test can't prove convergence.","a_n ↛ 0 ⇒ diverges; a_n → 0 says nothing (harmonic series).","LIM-7.A","CA-10.1.A CA-4.7.A",0]]},{"n":4,"title":"The integral test","los":[["CA-10.4.A",572,"Apply the integral test after checking positivity, continuity and decrease.","f positive, continuous, decreasing, a_n = f(n) ⇒ Σa_n and ∫_1^∞ f dx converge or diverge together.","LIM-7.A","CA-10.3.A CA-6.13.A",0]]},{"n":5,"title":"Harmonic series and p-series","los":[["CA-10.5.A",573,"Decide convergence of a p-series and recognise the harmonic series.","Σ1/n^p converges ⇔ p > 1; Σ1/n diverges.","LIM-7.A","CA-10.4.A",0]]},{"n":6,"title":"Comparison tests","los":[["CA-10.6.A",574,"Decide convergence with the direct or limit comparison test against a geometric or p-series.","0 ≤ a_n ≤ b_n: Σb_n conv ⇒ Σa_n conv; lim a_n/b_n = c, 0 \u003c c \u003c ∞ ⇒ same behaviour.","LIM-7.A","CA-10.5.A CA-10.2.A",0]]},{"n":7,"title":"The alternating series test","los":[["CA-10.7.A",575,"Show an alternating series converges by checking that |a_n| decreases to 0.","Σ(−1)^n b_n with b_n decreasing and b_n → 0 converges.","LIM-7.A","CA-10.3.A",0]]},{"n":8,"title":"The ratio test","los":[["CA-10.8.A",576,"Apply the ratio test, especially to series with factorials or exponentials.","L = lim|a_(n+1)/a_n|: L \u003c 1 converges absolutely, L > 1 diverges, L = 1 inconclusive.","LIM-7.A","CA-10.2.A",0]]},{"n":9,"title":"Absolute and conditional convergence","los":[["CA-10.9.A",577,"Classify a series as absolutely convergent, conditionally convergent or divergent.","Σ|a_n| converges ⇒ absolute; Σa_n converges but Σ|a_n| doesn't ⇒ conditional (e.g. alternating harmonic).","LIM-7.A","CA-10.7.A CA-10.6.A",0]]},{"n":10,"title":"Alternating series error bound","los":[["CA-10.10.A",578,"Bound the error of a partial sum of an alternating series.","|S − S_n| ≤ b_(n+1), the first omitted term; the sign of the error is that of the first omitted term.","LIM-7.B","CA-10.7.A",0]]},{"n":11,"title":"Taylor polynomials","los":[["CA-10.11.A",579,"Build the nth-degree Taylor polynomial about x = a and use it to approximate a function value (or read derivatives off its coefficients).","P_n(x) = Σ_(k=0)^n f^(k)(a)(x − a)^k/k!; coefficient of (x − a)^k is f^(k)(a)/k!; P₁ is the tangent line.","LIM-8.A, LIM-8.B","CA-3.6.A CA-4.6.A",0]]},{"n":12,"title":"The Lagrange error bound","los":[["CA-10.12.A",580,"Bound the error of a Taylor approximation with the Lagrange error bound.","|f(x) − P_n(x)| ≤ max|f^(n+1)|·|x − a|^(n+1)/(n + 1)!, max taken between a and x.","LIM-8.C","CA-10.11.A",0]]},{"n":13,"title":"Radius and interval of convergence","los":[["CA-10.13.A",581,"Find the radius and interval of convergence of a power series, testing each endpoint separately.","Ratio test gives |x − a| \u003c R; at x = a ± R the series is an ordinary series — use p-series, alternating or comparison tests.","LIM-8.D","CA-10.8.A CA-10.9.A",0]]},{"n":14,"title":"Taylor and Maclaurin series","los":[["CA-10.14.A",582,"Write the Taylor or Maclaurin series of a function in sigma notation with its general term.","Σ f^(n)(a)(x − a)^n/n!; e^x = Σx^n/n!, sin x = Σ(−1)^n x^(2n+1)/(2n+1)!, cos x = Σ(−1)^n x^(2n)/(2n)!, 1/(1 − x) = Σx^n.","LIM-8.E","CA-10.11.A CA-10.13.A",0],["CA-10.14.B",583,"Interpret a Taylor series: use it to evaluate a limit, a derivative value or a sum.","Inside its interval of convergence the series equals the function; e.g. Σ1/n! = e.","LIM-8.F","CA-10.14.A",0]]},{"n":15,"title":"Representing functions as power series","los":[["CA-10.15.A",584,"Build a power series for a new function by substitution, multiplication, or term-by-term differentiation or integration of a known series.","1/(1 + x²) = Σ(−1)^n x^(2n); integrate ⇒ arctan x = Σ(−1)^n x^(2n+1)/(2n+1). Differentiating or integrating keeps the radius.","LIM-8.G","CA-10.14.A",1],["CA-10.15.B",585,"Shift a summation index so two power series start at the same index and carry the same power of x, then combine them.","Replace n by n ± k and adjust the limits; the sum is unchanged. Needed for power-series solutions of ODEs (beyond the CED).","LIM-8.G","CA-10.15.A",2]]},{"n":16,"title":"Complex exponentials (beyond the CED)","los":[["CA-10.16.A",586,"Derive Euler's formula from the Maclaurin series of e^x, cos x and sin x, and convert complex numbers between rectangular, polar and exponential form.","Put x = iθ in Σx^n/n! and sort real and imaginary terms: e^(iθ) = cos θ + i sin θ; z = re^(iθ), r = |z|, θ = arg z.","LIM-8.F, N-CN.B.4","CA-10.14.A CA-9.7.A",2],["CA-10.16.B",587,"Compute powers and roots of a complex number with De Moivre's formula.","(re^(iθ))^n = r^n e^(inθ); n distinct n-th roots spaced 2π/n apart.","N-CN.B.5","CA-10.16.A",2],["CA-10.16.C",588,"Find the complex roots α ± βi of a real quadratic and write e^((α ± iβ)x) as e^(αx)(cos βx ± i sin βx).","α = −b/2a, β = √(4ac − b²)/2a; complex roots of real polynomials come in conjugate pairs.","N-CN.C.7","CA-10.16.A",2]]}]},{"n":11,"title":"Vectors and the geometry of space","scope":"extension","topics":[{"n":1,"title":"Three-dimensional coordinates and vectors","los":[["CA-11.1.A",589,"Compute distances and spheres in 3-D, and add, scale and normalise vectors in components.","|P₁P₂| = √(Δx² + Δy² + Δz²); (x − h)² + (y − k)² + (z − l)² = r²; |v| = √(v·v), û = v/|v|.","ST-12.1, ST-12.2","",0]]},{"n":2,"title":"The dot product","los":[["CA-11.2.A",590,"Use the dot product for angles, orthogonality, projections and the work of a constant force.","a·b = |a||b|cos θ, = 0 ⇔ perpendicular; proj_a b = (a·b/|a|²)a; W = F·D.","ST-12.3","CA-11.1.A",0]]},{"n":3,"title":"The cross product","los":[["CA-11.3.A",591,"Compute a cross product as a 3×3 determinant and use it for a normal vector, parallelogram area or torque.","a × b ⊥ both, |a × b| = |a||b|sin θ = parallelogram area; right-hand rule; b × a = −a × b.","ST-12.4","CA-11.2.A",0]]},{"n":4,"title":"Lines and planes","los":[["CA-11.4.A",592,"Write vector, parametric and symmetric equations of a line from a point and a direction or two points.","r = r₀ + tv.","ST-12.5","CA-11.1.A",0],["CA-11.4.B",593,"Write the equation of a plane from a point and normal, or from three points, and find the distance from a point to a plane.","n·(r − r₀) = 0 ⇒ ax + by + cz = d; normal from (P₂ − P₁) × (P₃ − P₁); D = |ax₁ + by₁ + cz₁ − d|/|n|.","ST-12.5","CA-11.3.A CA-11.4.A",0]]},{"n":5,"title":"Cylinders and quadric surfaces","los":[["CA-11.5.A",594,"Identify and sketch a quadric surface from its equation using traces.","Set x, y or z constant and read the conic: ellipsoid, paraboloid, hyperboloid of one or two sheets, cone, cylinder.","ST-12.6","CA-11.1.A",0]]},{"n":6,"title":"Vector functions and space curves","los":[["CA-11.6.A",595,"Differentiate and integrate a 3-D vector function and find the unit tangent and tangent line.","Componentwise, as in the plane; T = r′/|r′|.","ST-13.2","CA-9.5.A CA-11.4.A",0],["CA-11.6.B",596,"Find arc length, curvature, and the tangential and normal components of acceleration of a space curve.","L = ∫|r′|dt; κ = |r′ × r″|/|r′|³; a_T = v·a/|v|, a_N = |v × a|/|v|.","ST-13.3, ST-13.4","CA-11.6.A CA-11.3.A CA-9.6.A",0]]}]},{"n":12,"title":"Partial derivatives","scope":"extension","topics":[{"n":1,"title":"Functions of several variables, limits and continuity","los":[["CA-12.1.A",597,"Find the domain of a function of two or three variables and sketch its level curves or describe its level surfaces.","Level curve f(x, y) = k; close spacing means steep.","ST-14.1","CA-11.5.A",0],["CA-12.1.B",598,"Show a two-variable limit does not exist by approaching along two paths that give different values.","Limit must be the same along every path to (a, b); try lines y = mx and curves like y = x².","ST-14.2","CA-12.1.A CA-1.2.B",0]]},{"n":2,"title":"Partial derivatives","los":[["CA-12.2.A",599,"Compute first partial derivatives and interpret each as a slope with the other variables held fixed.","∂f/∂x: differentiate in x, treat y as a constant; it is the slope of the trace y = b.","ST-14.3","CA-12.1.A CA-3.5.A",2],["CA-12.2.B",600,"Compute second and mixed partial derivatives and use Clairaut's theorem.","f_xy = f_yx when the mixed partials are continuous.","ST-14.3","CA-12.2.A",2]]},{"n":3,"title":"Tangent planes and linear approximation","los":[["CA-12.3.A",601,"Write the tangent plane to z = f(x, y), and estimate a change or a propagated error with the total differential.","z − z₀ = f_x(a, b)(x − a) + f_y(a, b)(y − b); dz = f_x dx + f_y dy.","ST-14.4","CA-12.2.A CA-4.6.A",0]]},{"n":4,"title":"The multivariable chain rule","los":[["CA-12.4.A",602,"Apply the chain rule to a function of intermediate variables, drawing the dependency tree.","z = f(x, y), x = x(s, t), y = y(s, t) ⇒ ∂z/∂s = f_x x_s + f_y y_s — one term per path in the tree.","ST-14.5","CA-12.2.A CA-3.1.A",0],["CA-12.4.B",603,"Find dy/dx or ∂z/∂x for an implicitly defined function with partial derivatives.","F(x, y) = 0 ⇒ dy/dx = −F_x/F_y; F(x, y, z) = 0 ⇒ ∂z/∂x = −F_x/F_z.","ST-14.5","CA-12.4.A CA-3.2.A",2]]},{"n":5,"title":"Directional derivatives and the gradient","los":[["CA-12.5.A",604,"Compute the gradient and the directional derivative in a given direction.","∇f = ⟨f_x, f_y, f_z⟩; D_u f = ∇f·u with u a unit vector.","ST-14.6","CA-12.2.A CA-11.2.A",1],["CA-12.5.B",605,"Use the gradient to find the direction and rate of steepest ascent and the tangent plane to a level surface.","Max rate |∇f| in direction ∇f; ∇F ⊥ the level surface F = k, so it is the plane's normal.","ST-14.6","CA-12.5.A CA-11.4.B",0]]},{"n":6,"title":"Maximum and minimum values","los":[["CA-12.6.A",606,"Find and classify the critical points of f(x, y) with the second derivatives test.","∇f = 0; D = f_xx f_yy − f_xy²: D > 0, f_xx > 0 min; D > 0, f_xx \u003c 0 max; D \u003c 0 saddle; D = 0 inconclusive.","ST-14.7","CA-12.2.B CA-5.7.A",0],["CA-12.6.B",607,"Find absolute extrema of f on a closed bounded region by checking interior critical points and the boundary.","Parametrise each boundary piece and reduce to one-variable problems; compare all candidates (EVT in 2-D).","ST-14.7","CA-12.6.A CA-5.5.A",0]]},{"n":7,"title":"Lagrange multipliers","los":[["CA-12.7.A",608,"Optimise f subject to a constraint g = k with Lagrange multipliers, and interpret λ.","∇f = λ∇g and g = k; λ = rate of change of the optimum with respect to k.","ST-14.8","CA-12.5.B CA-12.6.B",0]]}]},{"n":13,"title":"Multiple integrals","scope":"extension","topics":[{"n":1,"title":"Double integrals over rectangles","los":[["CA-13.1.A",609,"Evaluate a double integral over a rectangle as an iterated integral, in either order.","Fubini: ∬_R f dA = ∫_a^b∫_c^d f dy dx = ∫_c^d∫_a^b f dx dy for continuous f; a double Riemann-sum limit.","ST-15.1, ST-15.2","CA-6.7.A CA-6.3.A",0]]},{"n":2,"title":"Double integrals over general regions","los":[["CA-13.2.A",610,"Set up a double integral over a region bounded by curves as type I or type II, and evaluate it.","Type I: x from a to b, y from g₁(x) to g₂(x). Inner limits may depend on the outer variable, never the reverse.","ST-15.3","CA-13.1.A CA-8.4.A",0],["CA-13.2.B",611,"Reverse the order of integration by redrawing the region.","Sketch the region, then read the new limits from the other direction; used when the inner integral has no elementary antiderivative.","ST-15.3","CA-13.2.A CA-8.5.A",0]]},{"n":3,"title":"Double integrals in polar coordinates","los":[["CA-13.3.A",612,"Convert a double integral over a disc, annulus or polar region to polar coordinates and evaluate it.","dA = r dr dθ — don't drop the r.","ST-15.4","CA-13.2.A CA-9.8.A",0]]},{"n":4,"title":"Applications of double integrals","los":[["CA-13.4.A",613,"Compute the mass, centre of mass and moments of inertia of a lamina, and the average value of f over a region.","m = ∬ρ dA; x̄ = ∬xρ dA/m; I_x = ∬y²ρ dA; f_avg = ∬f dA/area.","ST-15.5","CA-13.2.A CA-8.4.A",0]]},{"n":5,"title":"Triple integrals","los":[["CA-13.5.A",614,"Set up and evaluate a triple integral over a solid bounded by surfaces, and use it for volume or mass.","Project the solid onto a coordinate plane for the outer two limits; the inner limits are the bottom and top surfaces.","ST-15.7","CA-13.2.A CA-11.5.A",0]]},{"n":6,"title":"Triple integrals in cylindrical coordinates","los":[["CA-13.6.A",615,"Evaluate a triple integral in cylindrical coordinates for solids with an axis of symmetry.","x = r cos θ, y = r sin θ, z = z; dV = r dz dr dθ.","ST-15.8","CA-13.5.A CA-13.3.A",0]]},{"n":7,"title":"Triple integrals in spherical coordinates","los":[["CA-13.7.A",616,"Evaluate a triple integral in spherical coordinates for balls, cones and shells.","x = ρ sin φ cos θ, y = ρ sin φ sin θ, z = ρ cos φ; dV = ρ² sin φ dρ dφ dθ.","ST-15.9","CA-13.6.A",0]]},{"n":8,"title":"Change of variables and the Jacobian","los":[["CA-13.8.A",617,"Change variables in a double or triple integral with the Jacobian determinant.","dx dy = |∂(x, y)/∂(u, v)| du dv; polar, cylindrical and spherical factors are special cases.","ST-15.10","CA-13.7.A CA-12.2.A",0]]}]},{"n":14,"title":"Vector calculus","scope":"extension","topics":[{"n":1,"title":"Vector fields","los":[["CA-14.1.A",618,"Sketch or read a 2-D vector field and recognise a gradient field.","F(x, y) = ⟨P, Q⟩ assigns an arrow to each point; F = ∇f is a gradient (conservative) field with potential f.","ST-16.1","CA-12.5.A",0]]},{"n":2,"title":"Line integrals","los":[["CA-14.2.A",619,"Evaluate a scalar line integral ∫_C f ds along a parametrised curve.","ds = |r′(t)|dt; independent of orientation.","ST-16.2","CA-14.1.A CA-11.6.B",0],["CA-14.2.B",620,"Evaluate the work or circulation ∫_C F·dr along a curve.","∫F(r(t))·r′(t)dt = ∫P dx + Q dy + R dz; reversing the orientation flips the sign.","ST-16.2","CA-14.2.A",0]]},{"n":3,"title":"The fundamental theorem for line integrals","los":[["CA-14.3.A",621,"Test whether a 2-D field P i + Q j (or a differential P dx + Q dy) is conservative.","On a simply connected region, conservative ⇔ ∂P/∂y = ∂Q/∂x — the same test as an exact differential.","ST-16.3","CA-14.1.A CA-12.2.B",2],["CA-14.3.B",622,"Find a potential function and evaluate a line integral of a conservative field from endpoint values.","f_x = P: integrate in x, differentiate in y, match Q; ∫_C ∇f·dr = f(end) − f(start), path-independent, 0 around a closed loop.","ST-16.3","CA-14.3.A CA-14.2.B",0]]},{"n":4,"title":"Green's theorem","los":[["CA-14.4.A",623,"Convert a line integral around a closed plane curve into a double integral with Green's theorem, or the reverse (including areas).","∮_C P dx + Q dy = ∬_D (Q_x − P_y)dA, C positively oriented (region on the left); area = ½∮x dy − y dx.","ST-16.4","CA-14.2.B CA-13.2.A",0]]},{"n":5,"title":"Curl and divergence","los":[["CA-14.5.A",624,"Compute the divergence, curl and Laplacian of a vector or scalar field.","div F = ∇·F; curl F = ∇ × F; ∇²f = ∇·∇f; curl ∇f = 0 and div curl F = 0.","ST-16.5","CA-14.1.A CA-11.3.A CA-12.2.B",1],["CA-14.5.B",625,"Interpret divergence as net outflow per volume and curl as local rotation, and use curl F = 0 to test a 3-D field for being conservative.","div > 0 is a source; curl F = 0 on a simply connected domain ⇒ F = ∇f.","ST-16.5","CA-14.5.A CA-14.3.A",0]]},{"n":6,"title":"Parametric surfaces and surface area","los":[["CA-14.6.A",626,"Parametrise a surface (graph, cylinder, sphere, cone) and compute its area.","r(u, v); dS = |r_u × r_v| du dv; for z = g(x, y), dS = √(1 + g_x² + g_y²)dA.","ST-16.6","CA-11.5.A CA-11.3.A CA-13.3.A",0]]},{"n":7,"title":"Surface integrals and flux","los":[["CA-14.7.A",627,"Evaluate a surface integral ∬_S f dS of a scalar function.","∬f(r(u, v))|r_u × r_v| du dv.","ST-16.7","CA-14.6.A",0],["CA-14.7.B",628,"Compute the flux ∬_S F·n dS of a vector field through an oriented surface.","∬F·(r_u × r_v) du dv, with r_u × r_v pointing the chosen way (outward for closed surfaces).","ST-16.7","CA-14.7.A",0]]},{"n":8,"title":"Stokes' theorem","los":[["CA-14.8.A",629,"Use Stokes' theorem to trade a circulation around a closed curve for the flux of the curl through a surface it bounds, or the reverse.","∮_C F·dr = ∬_S (∇ × F)·n dS; orientation of C and n by the right-hand rule; any surface with the same boundary gives the same answer.","ST-16.8","CA-14.7.B CA-14.5.A CA-14.4.A",0]]},{"n":9,"title":"The divergence theorem","los":[["CA-14.9.A",630,"Use the divergence theorem to compute the outward flux through a closed surface as a volume integral, or the reverse.","∯_S F·n dS = ∭_E ∇·F dV, n outward.","ST-16.9","CA-14.7.B CA-14.5.A CA-13.7.A",0],["CA-14.9.B",631,"Turn an integral balance on an arbitrary control volume into a differential conservation law with the divergence theorem.","d/dt∭c dV = −∯N·n dS + ∭R dV for every volume ⇒ ∂c/∂t + ∇·N = R.","ST-16.9","CA-14.9.A CA-14.5.B",0]]}]}]},{"id":"engineering-math","title":"Applied Engineering Mathematics","code":"EM","track":"math","requires":["calculus"],"units":[{"n":1,"title":"The calculus and complex-number toolkit","scope":"core","topics":[{"n":1,"title":"Integration techniques","los":[["EM-1.1.A",632,"Evaluate an integral by u-substitution, choosing u so its derivative appears in the integrand.","∫f(g(x))g′(x)dx = ∫f(u)du; a missing constant factor is fine, a missing x is not.","","",2],["EM-1.1.B",633,"Evaluate an integral by parts, including tabular and cyclic (e^ax·trig) cases.","∫u dv = uv − ∫v du; LIATE picks u; cyclic integrals return to themselves and are solved algebraically.","","",2],["EM-1.1.C",634,"Decompose a rational function into partial fractions (distinct, repeated, irreducible quadratic, improper) and integrate it.","Divide first if improper; repeated factor (x−a)^k needs k terms; irreducible quadratic gets (Ax+B).","","",2]]},{"n":2,"title":"Complex numbers and Euler's formula","los":[["EM-1.2.A",635,"Convert complex numbers between rectangular, polar and exponential form.","e^(iθ) = cos θ + i sin θ; z = re^(iθ), r = |z|, θ = arg z.","","",2],["EM-1.2.B",636,"Compute powers and roots of a complex number with De Moivre's formula.","(re^(iθ))^n = r^n e^(inθ); n distinct n-th roots spaced 2π/n apart.","","",2],["EM-1.2.C",637,"Find the complex roots α ± βi of a real quadratic.","Complex roots of real polynomials come in conjugate pairs; α = −b/2a, β = √(4ac − b²)/2a.","","",2]]},{"n":3,"title":"Summation notation","los":[["EM-1.3.A",638,"Shift a summation index so two power series start at the same index and carry the same power of x.","Replace m by m ± k and adjust the limits; the sum is unchanged.","","",2]]},{"n":4,"title":"Partial derivatives and exact differentials","los":[["EM-1.4.A",639,"Compute first and mixed partial derivatives of a function of two variables.","Hold the other variable constant; for smooth functions u_xy = u_yx.","","",2],["EM-1.4.B",640,"Find dy/dx for a curve defined implicitly by F(x, y) = c.","dy/dx = −F_x / F_y.","","",2],["EM-1.4.C",641,"Test whether M dx + N dy is an exact differential.","Exact on a simply connected domain ⇔ ∂M/∂y = ∂N/∂x.","","",2]]}]},{"n":2,"title":"First-order ODEs","scope":"core","topics":[{"n":1,"title":"Basic concepts, direction fields and Euler's method","los":[["EM-2.1.A",642,"Classify an ODE by order and linearity, and verify that a given function solves it.","Order = highest derivative; linear ⇔ y and its derivatives appear to first power with coefficients in x only.","","",0],["EM-2.1.B",643,"Sketch a direction field and solution curves from isoclines of y′ = f(x, y).","Isocline f(x, y) = k has slope k everywhere; solution curves are tangent to the field.","","",0],["EM-2.1.C",644,"Approximate an IVP solution with a few steps of Euler's method and estimate the error trend.","y_(n+1) = y_n + h f(x_n, y_n); global error is O(h).","","",0]]},{"n":2,"title":"Separable equations and reducing substitutions","los":[["EM-2.2.A",645,"Solve a separable ODE explicitly where possible, including the IVP constant.","g(y)dy = f(x)dx, integrate both sides; check for lost equilibrium solutions when dividing by g.","","EM-1.1.A EM-1.1.C",2],["EM-2.2.B",646,"Reduce an ODE to separable form with u = y/x or u = ax + by + c, and solve it.","y′ = f(y/x): y = ux ⇒ u + xu′ = f(u); y′ = f(ax + by + c): u′ = a + bf(u).","","EM-2.2.A",2]]},{"n":3,"title":"Exact equations and integrating factors","los":[["EM-2.3.A",647,"Solve an exact ODE by finding the potential u(x, y) = c, and fit an IVP.","u_x = M, u_y = N; integrate one, differentiate, match the other.","","EM-1.4.C",2],["EM-2.3.B",648,"Decide whether an integrating factor depending only on x or only on y exists.","R = (M_y − N_x)/N a function of x alone ⇒ F(x) = exp∫R dx; R* = (N_x − M_y)/M of y alone ⇒ F(y).","","",2],["EM-2.3.C",649,"Find the integrating factor and solve the resulting exact equation.","Multiply by F, re-check exactness, then solve as exact.","","EM-2.3.A EM-2.3.B",2]]},{"n":4,"title":"Linear and Bernoulli equations","los":[["EM-2.4.A",650,"Solve a linear first-order ODE with an integrating factor, including IVPs and forcing that matches e^(−∫p).","y′ + py = r ⇒ y = e^(−h)[∫e^h r dx + c], h = ∫p dx.","","EM-1.1.A",2],["EM-2.4.B",651,"Solve a linear ODE whose integrating-factor integral needs integration by parts.","∫e^h r dx often pairs a polynomial or trig with an exponential.","","EM-2.4.A EM-1.1.B",2],["EM-2.4.C",652,"Reduce a Bernoulli equation to a linear one with u = y^(1−a) and solve it.","y′ + py = g y^a ⇒ u′ + (1−a)p u = (1−a)g.","","EM-2.4.A",2]]},{"n":5,"title":"Choosing a first-order method","los":[["EM-2.5.A",653,"Identify which first-order method (separable, substitution, linear, Bernoulli, exact) solves a given ODE.","Check in order: separable? linear in y? y^a term? exact? homogeneous in y/x?","","",2]]},{"n":6,"title":"Modeling with first-order ODEs","los":[["EM-2.6.A",654,"Set up and solve a mixing-tank balance for concentration or mass of solute.","dm/dt = (rate in) − (rate out), rate out = (m/V)·Q_out.","","",2],["EM-2.6.B",655,"Model Newton's cooling and first-order decay, and extract a time constant, half-life or time to reach a value.","dT/dt = −k(T − T_a); y = y_0 e^(−kt), t_1/2 = ln 2/k.","","",2],["EM-2.6.C",656,"Solve the logistic equation and find its equilibria and carrying capacity.","y′ = ky(1 − y/K) is separable and Bernoulli; y → K for y_0 > 0.","","",2],["EM-2.6.D",657,"Find and classify the equilibria of an autonomous ODE y′ = f(y) from a phase line.","f(y*) = 0; stable if f′(y*) \u003c 0.","","",0]]},{"n":7,"title":"Existence and uniqueness","los":[["EM-2.7.A",658,"Decide whether an IVP has a unique solution near the initial point from the continuity of f and ∂f/∂y.","f and f_y continuous on a rectangle around (x_0, y_0) ⇒ unique solution on some |x − x_0| \u003c α.","","",0]]}]},{"n":3,"title":"Second-order linear ODEs","scope":"core","topics":[{"n":1,"title":"Homogeneous theory, reduction of order and the Wronskian","los":[["EM-3.1.A",659,"Use superposition to build a general solution from a basis and fit it to an IVP.","For a linear homogeneous ODE, any combination c_1y_1 + c_2y_2 of solutions is a solution; two independent ones form a basis.","","",0],["EM-3.1.B",660,"Find a second solution from a known one by reduction of order.","y_2 = u y_1, u′ = U = e^(−∫p dx)/y_1² (standard form y″ + py′ + qy = 0).","","",2],["EM-3.1.C",661,"Compute the Wronskian of two or three functions and use it to decide linear independence.","W = det of the functions and their derivatives; W ≠ 0 somewhere ⇒ independent; for ODE solutions W ≡ 0 or never 0 (Abel).","","",2]]},{"n":2,"title":"Constant coefficients","los":[["EM-3.2.A",662,"Write the general solution of ay″ + by′ + cy = 0 for each of the three root cases of the characteristic equation.","Distinct real: e^(λ₁x), e^(λ₂x); double: e^(λx), xe^(λx); complex α ± iβ: e^(αx)cos βx, e^(αx)sin βx.","","EM-1.2.C",2],["EM-3.2.B",663,"Solve a constant-coefficient IVP.","Two conditions y(x_0), y′(x_0) fix c_1, c_2.","","EM-3.2.A",2]]},{"n":3,"title":"Euler–Cauchy equations","los":[["EM-3.3.A",664,"Find the roots of the auxiliary equation of an Euler–Cauchy ODE.","x²y″ + axy′ + by = 0 with y = x^m ⇒ m² + (a − 1)m + b = 0.","","",2],["EM-3.3.B",665,"Write the general solution of an Euler–Cauchy ODE for each root case and fit an IVP.","Distinct: x^(m₁), x^(m₂); double: x^m, x^m ln x; complex: x^μ cos(ν ln x), x^μ sin(ν ln x).","","EM-3.3.A",2]]},{"n":4,"title":"Free oscillations","los":[["EM-3.4.A",666,"Find the natural frequency, period, amplitude and phase of an undamped mass–spring system.","my″ + ky = 0 ⇒ ω₀ = √(k/m); A cos ω₀t + B sin ω₀t = C cos(ω₀t − δ), C = √(A² + B²).","","",2],["EM-3.4.B",667,"Solve an undamped oscillator IVP.","y(0) and y′(0) give A and B/ω₀.","","",2],["EM-3.4.C",668,"Classify a damped oscillator as over-, critically or underdamped from c² − 4mk.","c² > 4mk overdamped, = critical, \u003c under; underdamped frequency ω* = √(4mk − c²)/2m.","","",2],["EM-3.4.D",669,"Solve a damped oscillator IVP in each damping regime.","Same three root cases as 3.2.A, with α = −c/2m \u003c 0 so every solution decays.","","EM-3.2.B",2]]},{"n":5,"title":"Nonhomogeneous equations","los":[["EM-3.5.A",670,"Find a particular solution by undetermined coefficients, including the modification rule.","Guess the form of r(x) (poly, e^(γx), cos/sin); multiply by x (or x²) when the guess solves the homogeneous ODE.","","EM-3.2.A",2],["EM-3.5.B",671,"Assemble y = y_h + y_p and fit an IVP for a nonhomogeneous ODE.","Apply initial conditions to the full solution, never to y_h alone.","","",2],["EM-3.5.C",672,"Find a particular solution by variation of parameters when r(x) is not of undetermined-coefficient form or coefficients vary.","y_p = −y₁∫y₂r/W dx + y₂∫y₁r/W dx, ODE in standard form.","","EM-3.1.C",2]]},{"n":6,"title":"Forced oscillations, resonance and circuits","los":[["EM-3.6.A",673,"Find the steady-state response of a damped oscillator to sinusoidal forcing and its amplitude.","y_p = a cos ωt + b sin ωt; amplitude C*(ω) = F₀/√((k − mω²)² + c²ω²); the transient dies out.","","",2],["EM-3.6.B",674,"Recognise undamped resonance and beats and write the resulting solution.","ω = ω₀, c = 0 ⇒ t sin ω₀t growth; ω near ω₀ ⇒ beats with envelope frequency |ω − ω₀|/2.","","",2],["EM-3.6.C",675,"Find the practical-resonance frequency of a damped forced oscillator.","ω_max² = k/m − c²/2m², exists only if c² \u003c 2mk.","","",2],["EM-3.6.D",676,"Model an RLC circuit as a second-order ODE and map it onto the mass–spring analogy.","LI″ + RI′ + I/C = E′(t): L ↔ m, R ↔ c, 1/C ↔ k.","","",0]]}]},{"n":4,"title":"Higher-order linear ODEs","scope":"core","topics":[{"n":1,"title":"Homogeneous theory and constant coefficients","los":[["EM-4.1.A",718,"Test n functions for linear independence with the n×n Wronskian.","Rows are f, f′, …, f^(n−1); expand by cofactors.","","EM-3.1.C EM-8.3.A",2],["EM-4.1.B",677,"Find the roots of an n-th order characteristic polynomial.","Rational root test, then synthetic division to a quadratic.","","",2],["EM-4.1.C",678,"Write the general solution of an n-th order constant-coefficient ODE with distinct, repeated and complex roots, and fit an IVP.","A root of multiplicity k gives e^(λx), xe^(λx), …, x^(k−1)e^(λx).","","EM-4.1.B",2]]},{"n":2,"title":"Nonhomogeneous higher-order equations","los":[["EM-4.2.A",679,"Find a particular solution of an n-th order ODE by undetermined coefficients or variation of parameters.","Same modification rule; variation of parameters uses Cramer's rule with W_k/W.","","EM-3.5.A EM-4.1.C",1]]}]},{"n":5,"title":"Systems of ODEs, phase plane and stability","scope":"core","topics":[{"n":1,"title":"Systems as models","los":[["EM-5.1.A",680,"Convert an n-th order ODE into a first-order system.","y₁ = y, y₂ = y′, …; the companion matrix's eigenvalues are the characteristic roots.","","",1],["EM-5.1.B",681,"Write the rate matrix for series first-order kinetics A → B → C.","d[A]/dt = −k₁[A], d[B]/dt = k₁[A] − k₂[B]; C follows from mass conservation.","","",2]]},{"n":2,"title":"Constant-coefficient systems by eigenvalues","los":[["EM-5.2.A",722,"Find the eigenvalues and eigenvectors that give the basis solutions of y′ = Ay.","y = x e^(λt) with (A − λI)x = 0.","","EM-8.4.A EM-8.4.B",2],["EM-5.2.B",723,"Write the general solution of a 2×2 system with real distinct eigenvalues and fit an IVP.","y = c₁x⁽¹⁾e^(λ₁t) + c₂x⁽²⁾e^(λ₂t).","","EM-5.2.A",2],["EM-5.2.C",724,"Write real solutions of a 2×2 system with complex eigenvalues and fit an IVP.","Take real and imaginary parts of x e^((α+iβ)t).","","EM-5.2.A EM-1.2.A",2],["EM-5.2.D",682,"Solve a 2×2 system with a repeated eigenvalue using a generalised eigenvector.","Second solution x t e^(λt) + u e^(λt), (A − λI)u = x.","","",2],["EM-5.2.E",683,"Solve series kinetics A → B → C and find the time of maximum intermediate.","Eigenvalues −k₁, −k₂; [B] = k₁A₀(e^(−k₁t) − e^(−k₂t))/(k₂ − k₁); t_max = ln(k₁/k₂)/(k₁ − k₂), = 1/k when k₁ = k₂.","","EM-5.1.B",2]]},{"n":3,"title":"Critical points and stability","los":[["EM-5.3.A",684,"Classify the critical point of a linear 2×2 system (node, saddle, centre, spiral) from its eigenvalues or from trace and determinant.","p = tr A, q = det A, Δ = p² − 4q: q \u003c 0 saddle; q > 0, Δ ≥ 0 node; Δ \u003c 0 spiral (p ≠ 0) or centre (p = 0).","","",2],["EM-5.3.B",685,"Decide whether a critical point is stable, asymptotically stable or unstable.","Asymptotically stable ⇔ p \u003c 0, q > 0; centre is stable, not asymptotically.","","",2],["EM-5.3.C",686,"Sketch a phase portrait with eigenvector directions and trajectory orientation.","Trajectories leave along the fast-growing eigenvector and approach along the slow-decaying one.","","",0]]},{"n":4,"title":"Nonlinear systems","los":[["EM-5.4.A",687,"Find the critical points of a nonlinear autonomous system and linearise at each with the Jacobian.","Set f = g = 0; J = [[f_x, f_y], [g_x, g_y]] at the point.","","",0],["EM-5.4.B",688,"Classify each critical point of a nonlinear system from its linearisation, noting when linearisation is inconclusive.","Hyperbolic points keep their type; a linear centre may be a spiral in the nonlinear system.","","EM-5.3.A EM-5.4.A",0]]},{"n":5,"title":"Nonhomogeneous linear systems","los":[["EM-5.5.A",689,"Find a particular solution of y′ = Ay + g by undetermined coefficients, diagonalisation or variation of parameters.","Fundamental matrix Y: y_p = Y∫Y⁻¹g dt.","","",0]]}]},{"n":6,"title":"Series solutions and special functions","scope":"core","topics":[{"n":1,"title":"Ordinary and singular points","los":[["EM-6.1.A",690,"Classify a point as ordinary, regular singular or irregular singular.","Standard form y″ + py′ + qy = 0: ordinary if p, q analytic; regular singular if (x − x₀)p and (x − x₀)²q are analytic.","","",2],["EM-6.1.B",691,"Give the guaranteed radius of convergence of a power-series solution about an ordinary point.","At least the distance to the nearest singular point in the complex plane.","","EM-6.1.A",2]]},{"n":2,"title":"Power series method","los":[["EM-6.2.A",692,"Derive the recurrence relation for the coefficients of a power-series solution.","Substitute Σa_m x^m, shift indices to a common power, set each coefficient to zero.","","EM-1.3.A",2],["EM-6.2.B",693,"Generate the first terms of the series solution from the recurrence and initial values.","a₀ = y(0), a₁ = y′(0); even and odd coefficients often split into two basis series.","","EM-6.2.A",2]]},{"n":3,"title":"Frobenius method","los":[["EM-6.3.A",694,"Find the indicial equation and its roots at a regular singular point.","r(r − 1) + b₀r + c₀ = 0, b₀ = lim xp, c₀ = lim x²q.","","EM-6.1.A",2],["EM-6.3.B",695,"Decide which Frobenius case applies and what form the second solution takes.","Roots not differing by an integer: two x^r series; double root: second has ln x; differ by an integer: second may have ln x.","","EM-6.3.A",2],["EM-6.3.C",696,"Construct the first Frobenius series solution from the larger indicial root.","y = x^r Σa_m x^m; same index-shifting as the power series method.","","EM-6.3.A EM-6.2.A",0]]},{"n":4,"title":"Legendre and Bessel functions","los":[["EM-6.4.A",697,"Recognise Legendre's, Bessel's and Euler–Cauchy equations in a given ODE and read off the order or degree.","(1 − x²)y″ − 2xy′ + n(n+1)y = 0; x²y″ + xy′ + (x² − ν²)y = 0.","","",2],["EM-6.4.B",698,"Solve a scaled Bessel equation x²y″ + xy′ + (λ²x² − ν²)y = 0 with J_ν(λx), Y_ν(λx).","Substitute z = λx.","","",2],["EM-6.4.C",699,"Write the general solution of Bessel's equation, choosing J₋ν or Y_ν as the second solution.","J_ν, J₋ν independent unless ν is an integer, where J₋ₙ = (−1)ⁿJₙ; then use Y_ν.","","",2],["EM-6.4.D",700,"Use Legendre polynomials' explicit form, Rodrigues' formula or orthogonality to evaluate P_n or an integral.","P_n(x) = (1/2ⁿn!) dⁿ/dxⁿ (x² − 1)ⁿ; ∫P_mP_n = 0 on [−1, 1] for m ≠ n.","","",0]]}]},{"n":7,"title":"Laplace transforms","scope":"core","topics":[{"n":1,"title":"The transform, linearity and s-shifting","los":[["EM-7.1.A",701,"Find the Laplace transform of a combination of elementary functions from the table, using identities where needed.","L{tⁿ} = n!/s^(n+1); L{e^(at)} = 1/(s − a); L{cos ωt} = s/(s² + ω²); sin² = (1 − cos 2t)/2.","","",2],["EM-7.1.B",702,"Apply the first shifting theorem forwards and in reverse.","L{e^(at)f(t)} = F(s − a); complete the square to expose s − a.","","",2]]},{"n":2,"title":"Inverse transforms by partial fractions","los":[["EM-7.2.A",703,"Invert a rational F(s) by partial fractions with distinct, repeated or complex poles.","Repeated pole ⇒ tⁿe^(at)/n!; complex pole pair ⇒ e^(at)(cos, sin).","","EM-1.1.C",2]]},{"n":3,"title":"Solving IVPs by Laplace transform","los":[["EM-7.3.A",704,"Solve a constant-coefficient IVP by transforming, solving the subsidiary equation and inverting.","L{y′} = sY − y(0); L{y″} = s²Y − sy(0) − y′(0); initial conditions enter automatically.","","EM-7.2.A",2],["EM-7.3.B",705,"Identify the transfer function of a linear system and relate its poles to stability and damping.","Q(s) = Y/R with zero ICs = 1/(as² + bs + c); poles in the left half-plane ⇔ decay.","","",2]]},{"n":4,"title":"Unit step and t-shifting","los":[["EM-7.4.A",706,"Write a piecewise function with unit step functions and transform it.","f = f₁ + (f₂ − f₁)u(t − a) + …; L{f(t − a)u(t − a)} = e^(−as)F(s).","","",2],["EM-7.4.B",707,"Invert a transform containing e^(−as).","e^(−as)F(s) ↦ f(t − a)u(t − a).","","",2],["EM-7.4.C",708,"Solve an IVP with switched or piecewise forcing.","Transform the step-written forcing; the solution is piecewise with continuous y and y′.","","EM-7.3.A EM-7.4.A",2]]},{"n":5,"title":"Impulses and the Dirac delta","los":[["EM-7.5.A",709,"Model a sudden impulse with δ(t − a) and solve the resulting IVP, including the impulse response.","L{δ(t − a)} = e^(−as); impulse response = L⁻¹{transfer function}.","","",2]]},{"n":6,"title":"Convolution and integral equations","los":[["EM-7.6.A",710,"Compute a convolution integral directly.","(f * g)(t) = ∫₀ᵗ f(τ)g(t − τ)dτ.","","",2],["EM-7.6.B",711,"Invert a product of transforms or transform an integral using the convolution theorem.","L{f * g} = FG; L{∫₀ᵗ f dτ} = F/s.","","",2],["EM-7.6.C",712,"Solve a Volterra integral equation of convolution type.","Transform, solve for Y algebraically, invert.","","EM-7.6.B",2]]},{"n":7,"title":"Transform derivatives and systems","los":[["EM-7.7.A",713,"Use L{tf(t)} = −F′(s) to transform or invert functions and solve ODEs with linear coefficients.","Differentiation in s ↔ multiplication by −t; integration in s ↔ division by t.","","",2],["EM-7.7.B",714,"Solve a linear system of ODEs by Laplace transform.","Transform each equation, solve the algebraic system (Cramer), invert each component.","","EM-7.3.A",2]]}]},{"n":8,"title":"Linear algebra for ODEs","scope":"core","topics":[{"n":1,"title":"Linear systems and Gauss elimination","los":[["EM-8.1.A",715,"Solve a linear system by row reduction and state whether it has none, one or infinitely many solutions.","Echelon form; rank A vs rank [A|b] decides existence; free variables give a family.","","",2]]},{"n":2,"title":"Linear independence and rank","los":[["EM-8.2.A",716,"Decide whether a set of vectors is linearly independent.","Independent ⇔ only the trivial combination is zero ⇔ rank = number of vectors; for n vectors in ℝⁿ, det ≠ 0.","","",2]]},{"n":3,"title":"Determinants and inverses","los":[["EM-8.3.A",717,"Evaluate a 3×3 determinant by cofactor expansion.","Expand along the row or column with most zeros; sign pattern (−1)^(i+j).","","",2],["EM-8.3.B",719,"Find the inverse of a 2×2 matrix, or show it does not exist.","A⁻¹ = (1/det A)[[d, −b], [−c, a]]; singular ⇔ det A = 0.","","",2]]},{"n":4,"title":"The matrix eigenvalue problem","los":[["EM-8.4.A",720,"Find the eigenvalues of a 2×2 matrix from its characteristic polynomial.","λ² − (tr A)λ + det A = 0.","","",2],["EM-8.4.B",721,"Find an eigenvector for each eigenvalue of a 2×2 matrix.","Solve (A − λI)x = 0; one row suffices in 2×2.","","EM-8.4.A",2]]},{"n":5,"title":"Symmetric matrices and diagonalisation","los":[["EM-8.5.A",725,"Diagonalise a matrix with a full set of eigenvectors and use it to decouple a linear system.","D = X⁻¹AX; symmetric A has real eigenvalues and orthogonal eigenvectors.","","EM-8.4.B EM-8.3.B",0]]}]},{"n":9,"title":"Fourier series and Sturm–Liouville boundary-value problems","scope":"core","topics":[{"n":1,"title":"Fourier series","los":[["EM-9.1.A",726,"Compute the Fourier coefficients of a 2π-periodic function given on one period.","a₀ = (1/2π)∫f, a_n = (1/π)∫f cos nx, b_n = (1/π)∫f sin nx over (−π, π).","","EM-1.1.B",2],["EM-9.1.B",727,"Compute the Fourier series of a function of period 2L, using even/odd symmetry to skip coefficients.","Replace nx by nπx/L and 1/π by 1/L; even ⇒ cosine series, odd ⇒ sine series.","","",2],["EM-9.1.C",728,"Write the half-range sine or cosine expansion of a function on (0, L).","Odd extension ⇒ sine series; even extension ⇒ cosine series; b_n = (2/L)∫₀ᴸ f sin(nπx/L).","","",2],["EM-9.1.D",729,"Find the periodic steady-state response of an oscillator to a periodic non-sinusoidal force by Fourier series.","Solve term by term; the term with nω nearest ω₀ dominates.","","EM-9.1.A EM-3.6.A",0]]},{"n":2,"title":"Sturm–Liouville problems","los":[["EM-9.2.A",730,"Rewrite a second-order eigenvalue ODE in Sturm–Liouville form and identify p, q and r.","(py′)′ + (q + λr)y = 0; multiply by the integrating factor e^(∫a₁/a₂)/a₂ when needed.","","",2],["EM-9.2.B",731,"Classify a Sturm–Liouville problem as regular, periodic or singular.","Regular: p > 0, r > 0 on [a, b] with separated BCs; periodic: y(a) = y(b), y′(a) = y′(b); singular: p vanishes at an end.","","EM-9.2.A",2],["EM-9.2.C",732,"Find the eigenvalues of y″ + λy = 0 under Dirichlet, Neumann or mixed boundary conditions.","Check λ \u003c 0, = 0, > 0 separately; Dirichlet on [0, L]: λ = (nπ/L)², n ≥ 1.","","",2],["EM-9.2.D",733,"Find the eigenfunction belonging to each eigenvalue.","Determined up to a constant multiple; sin(nπx/L), cos(nπx/L) or sin((2n−1)πx/2L).","","EM-9.2.C",2],["EM-9.2.E",734,"Find the eigenvalues and eigenfunctions of a shifted problem y″ + (λ + c)y = 0 and count its negative eigenvalues.","Set μ = λ + c, solve as 9.2.C, then λ = μ − c.","","EM-9.2.C",2]]},{"n":3,"title":"Orthogonality and eigenfunction expansions","los":[["EM-9.3.A",735,"Verify orthogonality of eigenfunctions with respect to the weight r(x).","∫ₐᵇ r y_m y_n dx = 0 for m ≠ n in a regular or periodic S–L problem.","","",0],["EM-9.3.B",736,"Expand a function in a generalised Fourier series of S–L eigenfunctions (e.g. Legendre or Fourier–Bessel).","a_n = ∫ r f y_n dx / ∫ r y_n² dx.","","EM-9.3.A",0]]}]},{"n":10,"title":"Partial differential equations","scope":"core","topics":[{"n":1,"title":"Basic concepts and classification","los":[["EM-10.1.A",737,"Classify a second-order linear PDE as elliptic, parabolic or hyperbolic and verify a solution.","Au_xx + 2Bu_xy + Cu_yy: AC − B² > 0 elliptic, = 0 parabolic, \u003c 0 hyperbolic.","","",2]]},{"n":2,"title":"Heat equation by separation of variables","los":[["EM-10.2.A",738,"Separate u = F(x)G(t) in the heat equation and find each mode's decay rate.","F″ + kF = 0 (an S–L problem), G′ + c²kG = 0 ⇒ G = e^(−c²λ_n t).","","EM-9.2.C",2],["EM-10.2.B",739,"Solve the heat equation on a finite rod with Dirichlet or insulated ends by Fourier series.","Dirichlet ⇒ sine series; insulated ⇒ cosine series with a constant term (the mean).","","EM-10.2.A EM-9.1.C",2],["EM-10.2.C",740,"Solve the heat equation with non-homogeneous Dirichlet ends by subtracting the steady state.","u = u_s(x) + v; u_s linear; v satisfies zero BCs with v(x, 0) = f − u_s.","","EM-10.2.B",2]]},{"n":3,"title":"Wave equation","los":[["EM-10.3.A",741,"Solve the vibrating string by separation of variables and Fourier series.","u = Σ(B_n cos λ_n t + B_n* sin λ_n t) sin(nπx/L), λ_n = cnπ/L.","","EM-9.1.C",2],["EM-10.3.B",742,"Write d'Alembert's solution for an infinite string from initial displacement and velocity.","u = ½[f(x + ct) + f(x − ct)] + (1/2c)∫ g.","","",2]]},{"n":4,"title":"Laplace's equation and other geometries","los":[["EM-10.4.A",743,"Solve the steady 2-D Dirichlet problem on a rectangle by separation.","One direction gives sines, the other sinh; one non-zero side at a time, then superpose.","","",2],["EM-10.4.B",744,"Separate a PDE in polar, cylindrical or spherical coordinates and identify the Bessel or Legendre equation that appears.","Radial part in cylinders ⇒ Bessel; polar angle in spheres ⇒ Legendre in cos θ.","","EM-6.4.A",1]]},{"n":5,"title":"Transform methods for PDEs","los":[["EM-10.5.A",745,"Solve a PDE on a semi-infinite or infinite domain by Laplace or Fourier transform.","Transform out t (Laplace) or x (Fourier) to get an ODE in the other variable.","","",0]]}]},{"n":11,"title":"Fourier integrals and transforms","scope":"extension","topics":[{"n":1,"title":"Fourier integral and transforms","los":[["EM-11.1.A",746,"Represent a non-periodic function by its Fourier integral, or its cosine or sine transform.","Limit L → ∞ of the Fourier series; even ⇒ cosine transform, odd ⇒ sine.","","",0],["EM-11.1.B",747,"Compute a Fourier transform and use its derivative property to turn an ODE into algebra.","F{f′} = iwF{f}; F{e^(−ax²)} is Gaussian.","","",0]]}]},{"n":12,"title":"Vector calculus for transport","scope":"extension","topics":[{"n":1,"title":"Grad, div, curl and the integral theorems","los":[["EM-12.1.A",748,"Compute the gradient, divergence, curl and Laplacian of a field in Cartesian coordinates.","∇f, ∇·v, ∇×v, ∇²f = ∇·∇f.","","",1],["EM-12.1.B",749,"Derive a differential conservation equation from an integral balance with the divergence theorem.","∭∇·F dV = ∯F·n dA ⇒ ∂c/∂t + ∇·N = R.","","",0]]}]}]},{"id":"chemistry","title":"Chemistry (AP)","code":"CH","track":"science","requires":["math-hs"],"units":[{"n":0,"title":"Chemistry foundations","scope":"core","topics":[{"n":1,"title":"Matter and its classification","los":[["CH-0.1.A",750,"Classify a sample as an element, compound, homogeneous mixture or heterogeneous mixture from a description or particle diagram.","A pure substance has fixed composition; a mixture's composition can vary and it can be separated by physical means.","SPQ-2.B","",0],["CH-0.1.B",751,"Sort properties and changes into physical and chemical.","A chemical change makes new substances (bonds broken and formed); a physical change alters state or form only.","TRA-1.D","",0]]},{"n":2,"title":"Measurement, significant figures and error","los":[["CH-0.2.A",752,"Write quantities in scientific notation and convert between SI prefixes (p, n, μ, m, c, k, M, G).","Each prefix is a power of ten; moving the decimal changes the exponent by the same count.","8.EE.A.3, 8.EE.A.4, N-Q.A.1","",0],["CH-0.2.B",753,"Count significant figures in a measurement and round a calculated result correctly for × ÷ and for + −.","× ÷: keep the fewest significant figures; + −: keep the fewest decimal places; exact counts and defined constants don't limit.","N-Q.A.3","",0],["CH-0.2.C",754,"Distinguish accuracy from precision and calculate percent error.","Accuracy = closeness to the true value; precision = agreement among repeats; % error = |measured − true|/true × 100.","N-Q.A.3","",0],["CH-0.2.D",755,"Calculate density, mass or volume from the other two, including volume by water displacement.","ρ = m/V; 1 mL = 1 cm³; water ≈ 1.00 g/mL near room temperature.","N-Q.A.1, A-CED.A.4","",0],["CH-0.2.E",756,"Convert temperatures among °C, K and °F.","K = °C + 273.15; °F = 1.8·°C + 32; gas laws and thermodynamics need kelvin.","N-Q.A.1","",0]]},{"n":3,"title":"Dimensional analysis","los":[["CH-0.3.A",757,"Convert a quantity through a chain of conversion factors, including squared and cubed units.","Multiply by factors equal to one, arranged so unwanted units cancel; cube the factor for volume (1 m³ = 10⁶ cm³).","N-Q.A.1, 6.RP.A.3.D","CH-0.2.A",0]]},{"n":4,"title":"Atoms, ions, the periodic table and naming","los":[["CH-0.4.A",758,"Count protons, neutrons and electrons from a nuclide symbol for an atom or ion.","Z = protons; A = protons + neutrons; electrons = Z − charge.","SAP-1.A","",0],["CH-0.4.C",759,"Use periodic-table position (group, metal or nonmetal) to name, and write formulas for, binary ionic, polyatomic ionic, binary molecular compounds and common acids.","Metals left of the staircase form cations, nonmetals anions. Ionic: cation then anion, charges balance, Roman numeral for variable-charge metals; molecular: Greek prefixes; -ate → -ic acid, -ite → -ous acid.","SAP-2.B","",0]]},{"n":5,"title":"The mole as a counting unit","los":[["CH-0.5.A",760,"Explain the mole as a count of particles and compute a compound's molar mass from its formula.","1 mol = 6.022 × 10²³ particles; molar mass in g/mol = sum of atomic masses × subscripts.","SPQ-1.A","CH-0.4.C",0]]}]},{"n":1,"title":"Atomic structure and properties","scope":"core","topics":[{"n":1,"title":"Moles and molar mass","los":[["CH-1.1.A",761,"Convert among mass, moles and number of particles of a compound or of one element inside it.","n = m/M; N = n·N_A; route every conversion through moles; subscripts are mole ratios (1 mol Fe₂O₃ holds 2 mol Fe).","SPQ-1.A","CH-0.5.A CH-0.3.A",0]]},{"n":2,"title":"Mass spectra of elements","los":[["CH-1.2.A",762,"Calculate an element's average atomic mass from its isotopes' masses and abundances.","Average mass = Σ (fractional abundance × isotope mass).","SPQ-1.B","CH-0.4.A",0],["CH-1.2.B",763,"Read isotopes and relative abundances off a mass spectrum, or find two isotopes' abundances from the average mass.","Peak position = isotope mass; peak height ∝ abundance; with two isotopes, x·m₁ + (1 − x)·m₂ = average.","SPQ-1.B","CH-1.2.A",0]]},{"n":3,"title":"Elemental composition of pure substances","los":[["CH-1.3.A",764,"Calculate the mass percent of each element in a compound from its formula.","% X = (subscript × M_X)/M_compound × 100.","SPQ-2.A","CH-0.5.A",0],["CH-1.3.B",765,"Determine an empirical formula from mass-percent or mass data.","Assume 100 g, convert each to moles, divide by the smallest, clear fractions to whole numbers.","SPQ-2.A","CH-1.1.A CH-1.3.A",0],["CH-1.3.C",766,"Find a molecular formula from the empirical formula and the molar mass.","Molecular formula = (empirical formula)ₙ with n = M/M_empirical.","SPQ-2.A","CH-1.3.B",0],["CH-1.3.D",767,"Find an empirical formula from combustion-analysis masses of CO₂ and H₂O.","All C ends in CO₂ and all H in H₂O; O is found by difference from the sample mass.","SPQ-2.A","CH-1.3.B",0]]},{"n":4,"title":"Composition of mixtures","los":[["CH-1.4.A",768,"Calculate the mass percent of a component in an impure sample or mixture from elemental analysis.","Mass of analyte element → mass of the compound containing it → percent of the sample.","SPQ-2.B","CH-1.3.A",0]]},{"n":5,"title":"Atomic structure and electron configuration","los":[["CH-1.5.A",769,"Write full and noble-gas ground-state electron configurations for atoms and ions.","Fill by Aufbau order (1s 2s 2p 3s 3p 4s 3d 4p …), two electrons per orbital; cations of transition metals lose ns before (n−1)d.","SAP-1.A","CH-0.4.A",0],["CH-1.5.B",770,"Draw an orbital (box) diagram, count unpaired electrons, and predict paramagnetism or diamagnetism.","Hund: fill degenerate orbitals singly with parallel spins first; any unpaired electron ⇒ paramagnetic.","SAP-1.A","CH-1.5.A",0],["CH-1.5.C",771,"Compare the attraction of an electron to the nucleus using Coulomb's law with nuclear charge, shielding and distance.","F ∝ q₁q₂/r²; Z_eff ≈ Z − core electrons; outer, well-shielded electrons are held least tightly.","SAP-1.A","CH-1.5.A",0]]},{"n":6,"title":"Photoelectron spectroscopy","los":[["CH-1.6.A",772,"Assign each peak of a photoelectron spectrum to a subshell, read its electron count, and identify the element.","Position = binding energy (core electrons far left/high); relative peak height = number of electrons in that subshell.","SAP-1.B","CH-1.5.A",0]]},{"n":7,"title":"Periodic trends","los":[["CH-1.7.A",773,"Rank atoms by radius, first ionization energy, electron affinity and electronegativity, and justify with Z_eff and shell number.","Across a period Z_eff rises (smaller, higher IE, higher EN); down a group n rises (larger, lower IE, lower EN); IE dips at groups 13 and 16 (p electron, first p pairing).","SAP-2.A","CH-1.5.C",0],["CH-1.7.C",774,"Identify an element's group from a jump in successive ionization energies.","The big jump comes after the valence electrons are gone, when a core electron is removed.","SAP-2.A","CH-1.7.A",0],["CH-1.7.D",775,"Compare ion sizes with their parent atoms and rank an isoelectronic series.","Cations shrink, anions grow; in an isoelectronic series, more protons ⇒ smaller.","SAP-2.A","CH-1.7.A",0]]},{"n":8,"title":"Valence electrons and ionic compounds","los":[["CH-1.8.A",776,"Predict an element's common ion charge and the formula of the ionic compound two elements form.","Main-group atoms gain or lose electrons to reach a noble-gas configuration; total charge sums to zero.","SAP-2.B","CH-1.5.A CH-0.4.C",0],["CH-1.8.B",777,"Predict the formula or reactivity of an unfamiliar compound from an analogous compound of a same-group element.","Same group ⇒ same valence configuration ⇒ analogous formulas (Na₂O → K₂O); reactivity trends follow IE and EN.","SAP-2.B","CH-1.8.A CH-1.7.A",0]]},{"n":9,"title":"Quantum numbers and orbitals","los":[["CH-1.9.A",778,"Assign quantum numbers n, l, m_l, m_s, decide whether a set is allowed, and count the orbitals and electrons in a subshell or shell.","l = 0…n−1; m_l = −l…+l; m_s = ±½; no two electrons share all four (Pauli); subshell holds 2(2l + 1) e⁻, shell 2n².","DAT-GC Atomic and Molecular Structure (quantum theory)","CH-1.5.A",0]]},{"n":10,"title":"Nuclear reactions","los":[["CH-1.10.A",779,"Balance a nuclear equation for alpha, beta-minus, positron, electron-capture and gamma processes.","Mass numbers and atomic numbers each sum equally on both sides; α = ⁴₂He, β⁻ = ⁰₋₁e, β⁺ = ⁰₊₁e.","DAT-GC Nuclear Reactions","CH-0.4.A",0],["CH-1.10.C",780,"Calculate the amount remaining, or the elapsed time, after a whole number of half-lives.","Remaining = initial × (½)^(t/t½).","DAT-GC Nuclear Reactions","CH-1.10.A",0],["CH-1.10.D",781,"Calculate a nucleus's mass defect and binding energy per nucleon.","Δm = (mass of separate nucleons) − (nucleus mass); E = Δm c², 1 u ↔ 931.5 MeV.","DAT-GC Nuclear Reactions","CH-1.10.A",0]]}]},{"n":2,"title":"Molecular and ionic compound structure and properties","scope":"core","topics":[{"n":1,"title":"Types of chemical bonds","los":[["CH-2.1.A",782,"Classify a bond as nonpolar covalent, polar covalent, ionic or metallic from the elements and their electronegativity difference, and mark partial charges.","Metal + nonmetal ⇒ ionic; nonmetals ⇒ covalent; ΔEN ≈ 0 nonpolar, larger ΔEN more polar; metals ⇒ metallic.","SAP-3.A","CH-1.7.A",0]]},{"n":2,"title":"Intramolecular force and potential energy","los":[["CH-2.2.A",783,"Read bond length and bond energy from a potential-energy vs internuclear-distance curve, and compare curves for different bonds.","The well's minimum gives bond length (x) and bond energy (depth); higher bond order and smaller atoms ⇒ deeper, shorter well.","SAP-3.B","",0],["CH-2.2.B",784,"Rank ionic compounds by lattice energy using Coulomb's law.","Lattice energy ∝ q₁q₂/(r₁ + r₂): charge dominates, then ion size.","SAP-3.B","CH-1.5.C CH-1.7.D",0]]},{"n":3,"title":"Structure of ionic solids","los":[["CH-2.3.A",785,"Represent an ionic solid as a lattice and use it to explain high melting point, brittleness and conductivity only when molten or dissolved.","Alternating ions maximise attraction; shifting a layer brings like charges together and it shatters; ions must be mobile to conduct.","SAP-3.C","CH-2.2.B",0]]},{"n":4,"title":"Structure of metals and alloys","los":[["CH-2.4.A",786,"Explain metallic conductivity, malleability and luster with the electron-sea model, and classify an alloy as interstitial or substitutional from atomic radii.","Delocalised valence electrons move freely; similar radii ⇒ substitutional (brass), much smaller atom ⇒ interstitial (steel), which is stiffer.","SAP-3.D","CH-2.1.A",0]]},{"n":5,"title":"Lewis diagrams","los":[["CH-2.5.A",787,"Draw the Lewis structure of a molecule or polyatomic ion that obeys the octet rule.","Count valence electrons (adjust for charge), connect atoms, complete outer octets, move lone pairs into multiple bonds if the centre is short.","SAP-4.A","CH-1.8.A",0],["CH-2.5.B",788,"Draw Lewis structures for octet exceptions: incomplete octets, expanded octets and odd-electron species.","B and Be can be electron-deficient; period-3+ central atoms can exceed eight; an odd electron count leaves a radical.","SAP-4.A","CH-2.5.A",0]]},{"n":6,"title":"Resonance and formal charge","los":[["CH-2.6.A",789,"Calculate formal charges and use them to pick the best of several Lewis structures.","FC = valence e⁻ − lone-pair e⁻ − ½ bonding e⁻; prefer FCs near zero, with negatives on more electronegative atoms.","SAP-4.B","CH-2.5.A",0],["CH-2.6.B",790,"Draw all resonance structures of a species and calculate the average bond order.","Resonance forms differ only in electron placement; the real structure is the average, e.g. bond order 4/3 in NO₃⁻; higher bond order ⇒ shorter, stronger bond.","SAP-4.B","CH-2.5.A",0]]},{"n":7,"title":"VSEPR and bond hybridization","los":[["CH-2.7.A",791,"Predict electron-domain geometry, molecular shape and approximate bond angles with VSEPR.","2–6 domains ⇒ linear, trigonal planar, tetrahedral, trigonal bipyramidal, octahedral; lone pairs squeeze angles (109.5° → 107° → 104.5°).","SAP-4.C","CH-2.5.B",0],["CH-2.7.B",792,"Decide whether a molecule is polar from its shape and bond dipoles.","Polar bonds in a symmetric shape cancel (CO₂, CCl₄); lone pairs or unlike atoms usually break the symmetry.","SAP-4.C","CH-2.7.A CH-2.1.A",0],["CH-2.7.C",793,"Assign the hybridization of a central atom and count σ and π bonds.","2, 3, 4, 5, 6 domains ⇒ sp, sp², sp³, sp³d, sp³d²; a single bond is σ, a double σ + π, a triple σ + 2π.","SAP-4.C","CH-2.7.A",0]]},{"n":8,"title":"Molecular orbital theory for diatomics","los":[["CH-2.8.A",794,"Fill a molecular-orbital diagram for a period-2 diatomic or ion and find its bond order and magnetism.","Bond order = ½(bonding − antibonding e⁻); O₂ has two unpaired π* electrons (paramagnetic); σ2p/π2p order flips after N₂.","DAT-GC Atomic and Molecular Structure (quantum theory)","CH-2.6.B CH-1.5.B",0]]}]},{"n":3,"title":"Intermolecular forces and properties","scope":"core","topics":[{"n":1,"title":"Intermolecular and interparticle forces","los":[["CH-3.1.A",795,"Identify every intermolecular force present between particles: London dispersion, dipole–dipole, hydrogen bonding, ion–dipole.","All molecules have dispersion; polar ⇒ dipole–dipole; H on N, O or F next to a lone pair on N, O or F ⇒ hydrogen bond.","SAP-5.A","CH-2.7.B",0],["CH-3.1.B",796,"Rank substances by boiling point, vapor pressure, viscosity or surface tension from their intermolecular forces.","Stronger IMF ⇒ higher bp, lower vapor pressure; dispersion grows with electron count and contact area and can outweigh dipoles.","SAP-5.A","CH-3.1.A",0]]},{"n":2,"title":"Properties of solids","los":[["CH-3.2.A",797,"Classify a solid as ionic, molecular, covalent-network or metallic and predict its melting point, hardness and conductivity.","Network (diamond, SiO₂) highest mp and non-conducting; molecular low mp; metallic conducts as a solid; ionic conducts only molten or dissolved.","SAP-5.B","CH-3.1.A CH-2.3.A CH-2.4.A",0]]},{"n":3,"title":"Solids, liquids and gases","los":[["CH-3.3.B",798,"Explain vapor pressure and boiling as an IMF-versus-kinetic-energy balance, and why boiling point changes with external pressure.","Boiling occurs when vapor pressure = external pressure; normal bp is at 1 atm.","SAP-6.A","CH-3.1.B",0],["CH-3.3.C",799,"Read a phase diagram: identify phases, the triple point, the critical point and normal melting and boiling points, and trace a path.","Lines are coexistence curves; water's solid–liquid line slopes left because ice is less dense than liquid water.","SAP-6.A","CH-3.3.B",0]]},{"n":4,"title":"Ideal gas law","los":[["CH-3.4.A",800,"Solve PV = nRT for any variable with consistent units and the matching value of R.","R = 0.08206 L·atm/(mol·K) = 8.314 J/(mol·K); T in kelvin; 1 atm = 760 torr = 101.325 kPa.","SAP-7.A","CH-0.2.E",0],["CH-3.4.B",801,"Predict a new P, V, T or n when conditions change, using the combined gas law and Boyle's, Charles's, Gay-Lussac's and Avogadro's laws.","P₁V₁/(n₁T₁) = P₂V₂/(n₂T₂); cancel whatever is held constant.","SAP-7.A","CH-3.4.A",0],["CH-3.4.C",802,"Calculate a gas's density or molar mass from P, V, T and mass.","M = ρRT/P; at STP one mole occupies 22.4 L.","SAP-7.A","CH-3.4.A CH-1.1.A",0],["CH-3.4.D",803,"Calculate partial pressures and mole fractions with Dalton's law, including a gas collected over water.","P_total = Σ P_i; P_i = χ_i P_total; subtract water's vapor pressure from the collected gas pressure.","SAP-7.A","CH-3.4.A",0]]},{"n":5,"title":"Kinetic molecular theory","los":[["CH-3.5.A",804,"State the postulates of kinetic molecular theory and interpret Maxwell–Boltzmann speed distributions at different temperatures and molar masses.","Average KE ∝ T only; higher T or lower M spreads the curve to higher speeds.","SAP-7.B","CH-3.4.A",0],["CH-3.5.B",805,"Compare rms speeds and rates of effusion of two gases with Graham's law.","u_rms = √(3RT/M); rate₁/rate₂ = √(M₂/M₁).","SAP-7.B","CH-3.5.A",0]]},{"n":6,"title":"Deviation from the ideal gas law","los":[["CH-3.6.A",806,"Predict when and in which direction a real gas deviates from ideal behavior, and explain the van der Waals a and b terms.","High P: particle volume matters (b, V larger than ideal); low T: attractions matter (a, P lower than ideal); polar or large gases deviate most.","SAP-7.C","CH-3.5.A CH-3.1.A",0]]},{"n":7,"title":"Solutions and mixtures","los":[["CH-3.7.A",807,"Calculate molarity, moles of solute or solution volume from the other two.","M = mol solute / L solution.","SPQ-3.A","CH-1.1.A",0],["CH-3.7.B",808,"Calculate the result of a dilution and describe how to prepare a solution of given concentration.","Moles of solute are unchanged by adding solvent: M₁V₁ = M₂V₂; dissolve, then fill to the mark in a volumetric flask.","SPQ-3.A","CH-3.7.A",0],["CH-3.7.C",809,"Calculate each ion's concentration in a solution of a strong electrolyte.","0.10 M CaCl₂ ⇒ 0.10 M Ca²⁺ and 0.20 M Cl⁻.","SPQ-3.A","CH-3.7.A CH-0.4.C",0],["CH-3.7.D",810,"Convert among molarity, molality, mass percent, mole fraction and ppm.","m = mol solute / kg solvent; converting molarity ↔ molality needs the solution's density.","SPQ-3.A","CH-3.7.A CH-0.2.D",0]]},{"n":8,"title":"Representations of solutions","los":[["CH-3.8.A",811,"Draw a particle diagram of a solution with correct solute ratios and solvent orientation around ions.","Water's O (δ⁻) faces cations; its H (δ⁺) faces anions; ion counts follow the formula.","SPQ-3.B","CH-3.7.C CH-3.1.A",0]]},{"n":9,"title":"Separation of solutions and mixtures","los":[["CH-3.9.A",812,"Explain a chromatography or distillation separation, and compute R_f, from differences in intermolecular forces.","A component that interacts more with the stationary phase travels less (lower R_f); distillation separates by volatility.","SPQ-3.C","CH-3.1.B",0]]},{"n":10,"title":"Solubility","los":[["CH-3.10.A",813,"Predict relative solubility in polar and nonpolar solvents from solute–solvent interactions.","'Like dissolves like': dissolving is favored when solute–solvent attractions rival solute–solute and solvent–solvent ones.","SPQ-3.C","CH-3.1.A",0],["CH-3.10.B",814,"Predict how temperature and pressure change solubility, and use Henry's law for a dissolved gas.","Gas solubility falls as T rises and rises with its partial pressure: C = k_H P; most solids dissolve better when hot.","SPQ-3.C, DAT-GC Solutions","CH-3.10.A CH-3.4.D",0]]},{"n":11,"title":"Spectroscopy and the electromagnetic spectrum","los":[["CH-3.11.A",815,"Match a region of the electromagnetic spectrum to the molecular or electronic transition it causes.","Microwave → rotation; infrared → vibration; UV–visible → electronic transitions.","SAP-8.A","CH-2.2.A",0]]},{"n":12,"title":"Properties of photons","los":[["CH-3.12.A",816,"Calculate a photon's energy, frequency or wavelength, per photon or per mole.","E = hν = hc/λ; c = λν; h = 6.626 × 10⁻³⁴ J·s; multiply by N_A for per-mole energy.","SAP-8.B","CH-0.2.A",0],["CH-3.12.B",817,"Calculate the energy and wavelength of a hydrogen-atom transition, and relate emission lines to energy levels.","E_n = −2.18 × 10⁻¹⁸ J / n²; ΔE = photon energy; emission drops to lower n.","SAP-8.B, DAT-GC Atomic and Molecular Structure (quantum theory)","CH-3.12.A",0]]},{"n":13,"title":"Beer–Lambert law","los":[["CH-3.13.A",818,"Calculate a concentration from absorbance, directly or from a calibration curve.","A = εbc; at fixed λ and path, A ∝ c, so the calibration line's slope is εb.","SAP-8.C","CH-3.7.A",0]]},{"n":14,"title":"Colligative properties","los":[["CH-3.14.A",819,"Calculate the vapor pressure of a solution with Raoult's law.","P_solution = χ_solvent P°_solvent for a nonvolatile solute.","DAT-GC Solutions (colligative)","CH-3.7.D CH-3.3.B",1],["CH-3.14.B",820,"Calculate a boiling-point elevation or freezing-point depression with the van 't Hoff factor, and rank solutions by it.","ΔT = i·K·m; i counts particles per formula unit (NaCl ≈ 2, glucose 1).","DAT-GC Solutions (colligative)","CH-3.7.D CH-3.7.C",0],["CH-3.14.C",821,"Calculate osmotic pressure, or a solute's molar mass from colligative data.","Π = iMRT; measured ΔT or Π → moles of solute → M = mass/moles.","DAT-GC Solutions (colligative)","CH-3.14.B CH-3.4.A",0]]}]},{"n":4,"title":"Chemical reactions","scope":"core","topics":[{"n":1,"title":"Introduction for reactions","los":[["CH-4.1.A",822,"Identify evidence of a chemical reaction and balance a chemical equation by inspection.","Gas, precipitate, color or temperature change can signal reaction; balance atoms with coefficients, never by changing subscripts.","TRA-1.A","CH-0.1.B CH-0.4.C",0]]},{"n":2,"title":"Net ionic equations","los":[["CH-4.2.A",823,"Predict whether a precipitate forms on mixing two ionic solutions, using solubility rules.","Always soluble: Group 1, NH₄⁺, NO₃⁻ (AP's minimum); DAT adds halides (except Ag⁺, Pb²⁺, Hg₂²⁺), sulfates (except Ba, Sr, Pb, Ca), mostly insoluble carbonates, phosphates, hydroxides.","TRA-1.B","CH-4.1.A",0],["CH-4.2.B",824,"Write the molecular, complete ionic and net ionic equations for a reaction in solution.","Split only strong electrolytes in solution; cancel spectator ions; keep solids, liquids, gases and weak electrolytes whole.","TRA-1.B","CH-4.2.A CH-3.7.C",0]]},{"n":3,"title":"Representations of reactions","los":[["CH-4.3.A",825,"Translate between a particle diagram of a reaction and its balanced equation, including which reactant is left over.","Count particles before and after; the coefficient ratio is the ratio of particles that react.","TRA-1.C","CH-4.1.A",0]]},{"n":4,"title":"Physical and chemical changes","los":[["CH-4.4.A",826,"Classify a process (dissolving, melting, ionization, combustion) as physical or chemical from whether bonds or interparticle forces change.","Breaking only IMFs is physical; breaking and forming intramolecular bonds is chemical; dissolving an ionic salt is a borderline case.","TRA-1.D","CH-0.1.B CH-3.1.A",0]]},{"n":5,"title":"Stoichiometry","los":[["CH-4.5.A",827,"Calculate the mass of a product or reactant from the mass of another, through the mole ratio.","grams A → mol A → (coefficient ratio) → mol B → grams B.","SPQ-4.A","CH-4.1.A CH-1.1.A",0],["CH-4.5.B",828,"Identify the limiting reactant, the theoretical yield and the amount of excess reactant left.","The limiting reactant is the one that makes less product; leftover = initial − consumed.","SPQ-4.A","CH-4.5.A",0],["CH-4.5.C",829,"Calculate percent yield from actual and theoretical yield.","% yield = actual/theoretical × 100; it can't exceed 100% for a dry, pure product.","SPQ-4.A","CH-4.5.B",0],["CH-4.5.D",830,"Solve solution stoichiometry: volumes and molarities in, mass or concentration out.","mol = M·V for each solution; mix volumes add for the final concentration.","SPQ-4.A","CH-4.5.A CH-3.7.A",0],["CH-4.5.E",831,"Solve gas stoichiometry with the ideal gas law or molar volume.","Convert gas P, V, T to moles with n = PV/RT, then use the mole ratio; equal volumes of gases at the same T, P ⇒ equal moles.","SPQ-4.A","CH-4.5.A CH-3.4.A",0]]},{"n":6,"title":"Introduction to titration","los":[["CH-4.6.A",832,"Calculate an unknown concentration or sample purity from titration data at the equivalence point.","At equivalence, moles titrant × (ratio) = moles analyte; endpoint is where the indicator changes.","SPQ-4.B","CH-4.5.D",0]]},{"n":7,"title":"Types of chemical reactions","los":[["CH-4.7.A",833,"Classify a reaction as precipitation, acid–base or redox (including synthesis, decomposition, combustion, single and double replacement).","Electron transfer ⇒ redox; proton transfer ⇒ acid–base; insoluble product from ions ⇒ precipitation.","TRA-2.A","CH-4.2.B",0],["CH-4.7.B",834,"Predict the products of combustion, synthesis, decomposition and double-replacement reactions.","Hydrocarbon + O₂ → CO₂ + H₂O; double replacement swaps partners; metal carbonates decompose to oxide + CO₂.","TRA-2.A","CH-4.7.A",0]]},{"n":8,"title":"Introduction to acid–base reactions","los":[["CH-4.8.A",835,"Identify Brønsted–Lowry acids, bases and conjugate pairs, and write the proton-transfer equation.","Acid donates H⁺, base accepts it; conjugates differ by exactly one H⁺; water is amphoteric.","TRA-2.B","CH-4.7.A",0]]},{"n":9,"title":"Oxidation–reduction (redox) reactions","los":[["CH-4.9.A",836,"Assign oxidation numbers to every atom in a species.","Elements 0; monatomic ions = charge; O usually −2, H +1 (−1 in hydrides), F −1; sum = overall charge.","TRA-2.C","CH-0.4.C",0],["CH-4.9.B",837,"Identify the species oxidized and reduced and the oxidizing and reducing agents.","Oxidation = loss of e⁻ (number rises); the oxidizing agent is the species reduced.","TRA-2.C","CH-4.9.A",0],["CH-4.9.C",838,"Balance a redox equation by half-reactions in acidic or basic solution.","Balance atoms, O with H₂O, H with H⁺, charge with e⁻; equalize electrons; in base add OH⁻ to neutralize H⁺.","TRA-2.C","CH-4.9.B",0],["CH-4.9.D",839,"Predict whether a single-replacement reaction occurs from an activity series.","A metal displaces ions of any metal below it; metals above H displace H₂ from acids.","TRA-2.C, DAT-GC Oxidation–Reduction Reactions","CH-4.9.B",0]]}]},{"n":5,"title":"Kinetics","scope":"core","topics":[{"n":1,"title":"Reaction rates","los":[["CH-5.1.A",840,"Express a reaction's rate from the rate of change of any reactant or product, using the coefficients.","rate = −(1/a)d[A]/dt = (1/c)d[C]/dt for aA → cC.","TRA-3.A","CH-4.1.A",0]]},{"n":2,"title":"Introduction to rate law","los":[["CH-5.2.A",841,"Determine reaction orders and the rate constant, with its units, from initial-rates data.","Compare two runs where only one concentration changes: rate ratio = (conc ratio)^order; k has units M^(1−n)·s⁻¹ for overall order n.","TRA-3.B","CH-5.1.A",0],["CH-5.2.C",842,"Predict the change in rate when one or more concentrations change.","Second order in A: doubling [A] quadruples the rate; zero order: no change.","TRA-3.B","CH-5.2.A",0]]},{"n":3,"title":"Concentration changes over time","los":[["CH-5.3.A",843,"Use the zero-, first- or second-order integrated rate law to find a concentration at time t, or the time to reach one.","[A] = [A]₀ − kt; ln[A] = ln[A]₀ − kt; 1/[A] = 1/[A]₀ + kt.","TRA-3.C","CH-5.2.A",0],["CH-5.3.B",844,"Identify reaction order from which plot ([A], ln[A] or 1/[A] vs t) is linear, and read k from its slope.","Linear [A] ⇒ zero; linear ln[A] ⇒ first (slope −k); linear 1/[A] ⇒ second (slope +k).","TRA-3.C","CH-5.3.A",0],["CH-5.3.C",845,"Calculate a half-life, and use the constancy of first-order half-life to solve decay problems.","First order t½ = 0.693/k, independent of [A]₀; radioactive decay is first order.","TRA-3.C","CH-5.3.A CH-1.10.C",0]]},{"n":4,"title":"Elementary reactions","los":[["CH-5.4.A",846,"Write the rate law of an elementary step directly from its molecularity.","Only for elementary steps do the exponents equal the coefficients: A + B → products ⇒ rate = k[A][B].","TRA-4.A","CH-5.2.A",0]]},{"n":5,"title":"Collision model","los":[["CH-5.5.A",847,"Explain rate in terms of collision frequency, orientation and the fraction of collisions with energy above E_a.","Raising T shifts the Maxwell–Boltzmann tail past E_a, so a small T rise greatly increases the effective collisions.","TRA-4.B","CH-3.5.A CH-5.1.A",0]]},{"n":6,"title":"Reaction energy profile","los":[["CH-5.6.A",848,"Label a reaction energy profile with the transition state, forward and reverse E_a, and ΔH.","E_a,rev = E_a,fwd − ΔH; the transition state is the maximum, not an isolable species.","TRA-4.C","CH-5.5.A",0],["CH-5.6.B",849,"Find the activation energy from rate constants at two temperatures (Arrhenius).","ln(k₂/k₁) = −(E_a/R)(1/T₂ − 1/T₁).","TRA-4.C, DAT-GC Chemical Kinetics (activation energy)","CH-5.6.A",2],["CH-5.6.C",850,"Predict a rate constant at a new temperature, or the factor a rate rises by, from E_a.","k₂ = k₁ exp[−(E_a/R)(1/T₂ − 1/T₁)]; bigger E_a ⇒ more temperature-sensitive.","TRA-4.C, DAT-GC Chemical Kinetics (activation energy)","CH-5.6.B",2]]},{"n":7,"title":"Introduction to reaction mechanisms","los":[["CH-5.7.A",851,"Check that a proposed mechanism sums to the overall equation, and identify intermediates and catalysts in it.","Intermediates are made then used up; catalysts are used up then remade.","TRA-5.A","CH-5.4.A",0]]},{"n":8,"title":"Reaction mechanism and rate law","los":[["CH-5.8.A",852,"Derive the rate law predicted by a mechanism whose first step is slow, and test it against an observed rate law.","The slow (rate-determining) step's rate law is the overall rate law when it contains no intermediates.","TRA-5.B","CH-5.7.A",0]]},{"n":9,"title":"Pre-equilibrium approximation","los":[["CH-5.9.A",853,"Derive a rate law when a fast reversible step precedes the slow step, eliminating the intermediate.","Fast equilibrium: k₁[A][B] = k₋₁[I] ⇒ [I] = (k₁/k₋₁)[A][B]; substitute into the slow step's rate law.","TRA-5.C","CH-5.8.A",0]]},{"n":10,"title":"Multistep reaction energy profile","los":[["CH-5.10.A",854,"Read a multistep energy profile: count steps, locate intermediates, and pick the rate-determining step.","Each hump is a transition state, each valley between them an intermediate; the highest barrier controls the rate.","TRA-5.D","CH-5.6.A CH-5.7.A",0]]},{"n":11,"title":"Catalysis","los":[["CH-5.11.A",855,"Explain how a catalyst (homogeneous, heterogeneous or enzyme) speeds a reaction, and what it leaves unchanged.","It provides a new mechanism with lower E_a; ΔH, ΔG and K are unchanged, and forward and reverse rates rise together.","ENE-1.A","CH-5.10.A",0]]}]},{"n":6,"title":"Thermochemistry","scope":"core","topics":[{"n":1,"title":"Endothermic and exothermic processes","los":[["CH-6.1.A",856,"Classify a process as endothermic or exothermic from the temperature change of its surroundings, and give q its sign.","Surroundings warm ⇒ the system released heat ⇒ exothermic, q \u003c 0, ΔH \u003c 0.","ENE-2.A","CH-0.1.B",0]]},{"n":2,"title":"Energy diagrams","los":[["CH-6.2.A",857,"Draw and read an energy diagram that shows reactants and products relative to each other and ΔH.","Products below reactants ⇒ exothermic; the vertical gap is ΔH.","ENE-2.B","CH-6.1.A",0]]},{"n":3,"title":"Heat transfer and thermal equilibrium","los":[["CH-6.3.A",858,"Explain heat flow between objects at the particle level until thermal equilibrium.","Collisions pass kinetic energy from hotter to colder particles until average KE (T) is eq

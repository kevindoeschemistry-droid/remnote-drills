ual.","ENE-2.C","CH-6.1.A CH-3.5.A",0]]},{"n":4,"title":"Heat capacity and calorimetry","los":[["CH-6.4.A",859,"Calculate heat, mass, specific heat or temperature change with q = mcΔT.","Water's c = 4.18 J/(g·°C); ΔT in °C equals ΔT in K.","ENE-2.D","",0],["CH-6.4.B",860,"Find the final temperature when two bodies at different temperatures reach equilibrium.","Isolated system: q_lost + q_gained = 0, so m₁c₁(T_f − T₁) + m₂c₂(T_f − T₂) = 0.","ENE-2.D","CH-6.4.A CH-6.3.A",0],["CH-6.4.C",861,"Calculate ΔH per mole of reaction from coffee-cup calorimetry data.","q_rxn = −q_solution; ΔH = q_rxn / mol of limiting reactant.","ENE-2.D","CH-6.4.A CH-4.5.B",0]]},{"n":5,"title":"Energy of phase changes","los":[["CH-6.5.A",862,"Calculate the heat for a phase change at constant temperature.","q = n·ΔH_fus or n·ΔH_vap; temperature stays constant while the phase changes; ΔH_vap ≫ ΔH_fus.","ENE-2.E","CH-6.4.A CH-3.1.B",0],["CH-6.5.B",863,"Calculate the total heat along a heating curve that crosses one or more phase changes.","Sum the sloped segments (mcΔT, each phase's own c) and the flat segments (nΔH).","ENE-2.E","CH-6.5.A",0]]},{"n":6,"title":"Introduction to enthalpy of reaction","los":[["CH-6.6.A",864,"Scale a reaction's ΔH to a given amount of reactant or product, and change its sign for the reverse reaction.","ΔH is per mole of reaction as written: heat = ΔH × (mol / coefficient).","ENE-2.F","CH-6.2.A CH-4.5.A",0]]},{"n":7,"title":"Bond enthalpies","los":[["CH-6.7.A",865,"Estimate ΔH of reaction from average bond enthalpies.","ΔH ≈ Σ(bonds broken) − Σ(bonds formed); breaking costs energy, forming releases it.","ENE-3.A","CH-6.6.A CH-2.5.A",0]]},{"n":8,"title":"Enthalpy of formation","los":[["CH-6.8.A",866,"Write the formation reaction of a compound from its elements in their standard states.","One mole of product from elements in standard states (O₂(g), C(graphite), Br₂(l)); ΔH_f° of an element in its standard state is 0.","ENE-3.B","CH-6.6.A",0],["CH-6.8.B",867,"Calculate ΔH°_rxn from standard enthalpies of formation.","ΔH°_rxn = Σ n ΔH_f°(products) − Σ n ΔH_f°(reactants).","ENE-3.B","CH-6.8.A",0]]},{"n":9,"title":"Hess's law","los":[["CH-6.9.A",868,"Combine given reactions (reversing and scaling them) to find ΔH of a target reaction.","Enthalpy is a state function: reverse ⇒ −ΔH, multiply by n ⇒ nΔH, add reactions ⇒ add ΔH.","ENE-3.C, ENE-3.D","CH-6.6.A",0]]},{"n":10,"title":"The first law, work and internal energy","los":[["CH-6.10.A",869,"Calculate ΔU from heat and work with correct sign conventions, including pressure–volume work.","ΔU = q + w; w = −P_ext ΔV (work done on the system is positive); 1 L·atm = 101.3 J.","DAT-GC Thermodynamics and Thermochemistry (laws of thermodynamics)","CH-6.4.A CH-3.4.A",0],["CH-6.10.B",870,"Convert between ΔH and ΔU for a reaction that changes the moles of gas.","ΔH = ΔU + Δn_gas RT; equal only when Δn_gas = 0.","DAT-GC Thermodynamics and Thermochemistry (laws of thermodynamics)","CH-6.10.A",0]]},{"n":11,"title":"Vapor pressure and temperature","los":[["CH-6.11.A",871,"Estimate a vapor pressure at a new temperature, or ΔH_vap from two points, with the Clausius–Clapeyron equation.","ln(P₂/P₁) = −(ΔH_vap/R)(1/T₂ − 1/T₁).","DAT-GC Liquids and Solids (vapor pressure)","CH-6.5.A CH-3.3.B",2]]}]},{"n":7,"title":"Equilibrium","scope":"core","topics":[{"n":1,"title":"Introduction to equilibrium","los":[["CH-7.1.A",872,"Explain dynamic equilibrium and identify when it is reached on a concentration-vs-time graph.","At equilibrium forward rate = reverse rate; concentrations stop changing but need not be equal.","TRA-6.A","CH-5.1.A",0]]},{"n":2,"title":"Direction of reversible reactions","los":[["CH-7.2.A",873,"Predict the direction of net change from the relative forward and reverse rates.","Forward rate > reverse rate ⇒ net reaction to the right, until the rates equalize.","TRA-6.B","CH-7.1.A",0]]},{"n":3,"title":"Reaction quotient and equilibrium constant","los":[["CH-7.3.A",874,"Write the K_c and K_p expressions for a reaction, including heterogeneous ones.","Products over reactants, each raised to its coefficient; pure solids and liquids are left out.","TRA-7.A","CH-7.1.A",0],["CH-7.3.B",875,"Calculate Q from given concentrations or pressures and compare it with K to predict the direction of shift.","Q \u003c K ⇒ forward; Q > K ⇒ reverse; Q = K ⇒ at equilibrium.","TRA-7.A","CH-7.3.A CH-7.2.A",0]]},{"n":4,"title":"Calculating the equilibrium constant","los":[["CH-7.4.A",876,"Calculate K from equilibrium concentrations or partial pressures.","Substitute equilibrium (not initial) values into the K expression.","TRA-7.B","CH-7.3.A",0],["CH-7.4.B",877,"Use an ICE table with initial amounts and one equilibrium amount to find K.","Changes follow the coefficients: −ax, −bx, +cx; one known equilibrium value fixes x.","TRA-7.B","CH-7.4.A",0],["CH-7.4.C",878,"Convert between K_c and K_p.","K_p = K_c(RT)^Δn with R = 0.08206 and Δn = moles gas products − reactants.","TRA-7.B","CH-7.4.A CH-3.4.A",0]]},{"n":5,"title":"Magnitude of the equilibrium constant","los":[["CH-7.5.A",879,"Judge from the size of K whether reactants or products are favored at equilibrium.","K ≫ 1 ⇒ products favored; K ≪ 1 ⇒ reactants favored.","TRA-7.C","CH-7.4.A",0]]},{"n":6,"title":"Properties of the equilibrium constant","los":[["CH-7.6.A",880,"Find K for a reversed, scaled or summed reaction.","Reverse ⇒ 1/K; multiply by n ⇒ Kⁿ; add reactions ⇒ multiply their K's.","TRA-7.D","CH-7.3.A",0]]},{"n":7,"title":"Calculating equilibrium concentrations","los":[["CH-7.7.A",881,"Find equilibrium concentrations from K and initial amounts with an ICE table and the small-x approximation, and check the approximation.","If K is small, x ≪ initial: drop x where it is subtracted; valid if x is under 5% of the initial value.","TRA-7.E","CH-7.4.B",0],["CH-7.7.B",882,"Solve for equilibrium concentrations with the quadratic formula when the small-x approximation fails.","Rearrange to ax² + bx + c = 0 and keep the physically meaningful root (no negative concentrations).","TRA-7.E","CH-7.7.A",0]]},{"n":8,"title":"Representations of equilibrium","los":[["CH-7.8.A",883,"Draw or interpret a particle diagram of an equilibrium mixture consistent with a given K.","Particle counts stand in for concentrations; plug them into the K expression to check.","TRA-7.F","CH-7.4.A",0]]},{"n":9,"title":"Introduction to Le Châtelier's principle","los":[["CH-7.9.A",884,"Predict the shift caused by adding or removing a species, changing volume or pressure, changing temperature, adding an inert gas, or adding a catalyst.","The system shifts to counteract the stress; smaller volume favors fewer gas moles; heat acts as a reactant (endothermic) or product (exothermic); inert gas at constant V and catalysts cause no shift.","TRA-8.A","CH-7.3.B CH-6.1.A",0]]},{"n":10,"title":"Reaction quotient and Le Châtelier's principle","los":[["CH-7.10.A",885,"Explain a Le Châtelier shift by how the stress changes Q relative to K, and identify temperature as the only stress that changes K.","Concentration and pressure changes move Q away from an unchanged K; temperature changes K itself.","TRA-8.B","CH-7.9.A",0]]},{"n":11,"title":"Introduction to solubility equilibria","los":[["CH-7.11.A",886,"Write a K_sp expression and calculate K_sp from molar solubility.","MₐXᵦ(s) ⇌ aM + bX: K_sp = (as)ᵃ(bs)ᵇ; for AB₂, K_sp = 4s³.","SPQ-5.A","CH-7.3.A",0],["CH-7.11.B",887,"Calculate molar solubility in g/L or mol/L from K_sp, and compare solubilities of salts with different ion ratios.","Compare K_sp directly only for salts with the same ion ratio; otherwise compare s.","SPQ-5.A","CH-7.11.A",0],["CH-7.11.C",888,"Predict whether a precipitate forms on mixing solutions by comparing Q_sp with K_sp.","Use concentrations after mixing (diluted); Q_sp > K_sp ⇒ precipitate forms.","SPQ-5.A","CH-7.11.A CH-3.7.B",0]]},{"n":12,"title":"Common-ion effect","los":[["CH-7.12.A",889,"Calculate the solubility of a salt in a solution that already contains one of its ions.","Put the common ion's concentration into the ICE table; solubility falls (Le Châtelier).","SPQ-5.B","CH-7.11.B CH-7.9.A",0]]}]},{"n":8,"title":"Acids and bases","scope":"core","topics":[{"n":1,"title":"Introduction to acids and bases","los":[["CH-8.1.A",890,"Convert among pH, pOH, [H₃O⁺] and [OH⁻] at 25 °C.","pH = −log[H₃O⁺]; K_w = [H₃O⁺][OH⁻] = 1.0 × 10⁻¹⁴; pH + pOH = 14.","SAP-9.A","CH-4.8.A CH-7.3.A",0]]},{"n":2,"title":"pH and pOH of strong acids and bases","los":[["CH-8.2.A",891,"Identify the strong acids and bases, and calculate the pH of their solutions.","Strong acids: HCl, HBr, HI, HNO₃, H₂SO₄ (first H), HClO₄; strong bases: Group 1 and heavy Group 2 hydroxides; they ionize completely.","SAP-9.B","CH-8.1.A CH-3.7.C",0]]},{"n":3,"title":"Weak acid and base equilibria","los":[["CH-8.3.A",892,"Calculate the pH and percent ionization of a weak acid from K_a and its concentration.","[H₃O⁺] ≈ √(K_a·C) when ionization \u003c 5%; % ionization = [H₃O⁺]/C × 100, and it rises on dilution.","SAP-9.C","CH-8.1.A CH-7.7.A",0],["CH-8.3.B",893,"Calculate the pH of a weak base solution from K_b.","[OH⁻] ≈ √(K_b·C); then pOH → pH.","SAP-9.C","CH-8.3.A",0],["CH-8.3.C",894,"Find K_a or K_b from a measured pH and the initial concentration.","[H₃O⁺] = 10^(−pH) is x in the ICE table; K_a = x²/(C − x).","SAP-9.C","CH-8.3.A",0],["CH-8.3.D",895,"Convert between K_a of an acid and K_b of its conjugate base.","K_a·K_b = K_w; pK_a + pK_b = 14 at 25 °C; stronger acid ⇒ weaker conjugate base.","SAP-9.C","CH-8.3.B",0]]},{"n":4,"title":"Acid–base reactions and buffers","los":[["CH-8.4.A",896,"Calculate the pH after mixing a strong acid with a strong base.","Neutralize mole for mole; the excess, divided by total volume, sets the pH.","SAP-9.D","CH-8.2.A CH-4.5.D",0],["CH-8.4.B",897,"Identify what remains after mixing a weak acid or base with a strong one, and classify the result as a buffer, a salt solution or excess strong reagent.","React to completion first; weak acid + its conjugate base both present ⇒ buffer.","SAP-9.D","CH-8.4.A CH-8.3.A",0],["CH-8.4.C",898,"Predict whether a salt solution is acidic, basic or neutral and calculate its pH.","Conjugate bases of weak acids raise pH; conjugates of weak bases (NH₄⁺) lower it; ions of strong acids and bases are neutral.","SAP-9.D","CH-8.3.D",0]]},{"n":5,"title":"Acid–base titrations","los":[["CH-8.5.A",899,"Calculate the pH at the start, before, at and past the equivalence point of a weak acid–strong base (or weak base–strong acid) titration.","Start: weak acid; before: buffer; half-equivalence: pH = pK_a; equivalence: conjugate base only; after: excess strong base.","SAP-9.E","CH-8.4.C CH-4.6.A",0],["CH-8.5.B",900,"Read a titration curve to find the equivalence volume, pK_a and the analyte's strength, and choose a suitable indicator.","Weak acid–strong base equivalence pH > 7; pick an indicator whose pK_a (color change) brackets the equivalence pH.","SAP-9.E","CH-8.5.A",0],["CH-8.5.C",901,"Interpret the titration curve of a polyprotic acid.","One equivalence point per acidic proton (if K_a's differ enough); pK_a1 and pK_a2 at the half-equivalence points.","SAP-9.E","CH-8.5.B",0]]},{"n":6,"title":"Molecular structure of acids and bases","los":[["CH-8.6.A",902,"Rank acid strength from molecular structure: H–X bond strength and polarity, oxyacid O count, electronegativity of the central atom, and conjugate-base resonance.","Down a group, weaker H–X bonds ⇒ stronger acid (HI > HF); more O's and higher EN stabilize the conjugate base ⇒ stronger oxyacid.","SAP-9.F","CH-8.3.D CH-2.6.B CH-1.7.A",0],["CH-8.6.B",903,"Identify Lewis acids and bases, including metal ions and electron-deficient molecules.","Lewis acid accepts an electron pair (BF₃, Al³⁺); Lewis base donates one (NH₃, OH⁻).","SAP-9.F, DAT-GC Acids and Bases (strength)","CH-2.5.B CH-4.8.A",0]]},{"n":7,"title":"pH and pKa","los":[["CH-8.7.A",904,"Predict the predominant protonation form of an acid at a given pH from its pK_a.","pH \u003c pK_a ⇒ protonated form dominates; pH > pK_a ⇒ deprotonated; pH = pK_a ⇒ 1:1.","SAP-10.A","CH-8.3.D",0]]},{"n":8,"title":"Properties of buffers","los":[["CH-8.8.A",905,"Explain how a buffer resists pH change, writing the net ionic reaction with an added strong acid or base.","Added H₃O⁺ is consumed by A⁻; added OH⁻ is consumed by HA; the ratio [A⁻]/[HA] barely changes.","SAP-10.B","CH-8.4.B",0]]},{"n":9,"title":"Henderson–Hasselbalch equation","los":[["CH-8.9.A",906,"Calculate a buffer's pH with the Henderson–Hasselbalch equation.","pH = pK_a + log([A⁻]/[HA]); mole ratio works as well as concentration ratio.","SAP-10.C","CH-8.8.A CH-8.7.A",0],["CH-8.9.B",907,"Calculate a buffer's new pH after adding a strong acid or base.","Do the stoichiometry in moles first (HA ↔ A⁻), then apply Henderson–Hasselbalch.","SAP-10.C","CH-8.9.A CH-8.4.A",0],["CH-8.9.C",908,"Design a buffer: choose a conjugate pair and the base-to-acid ratio for a target pH.","Pick pK_a within ±1 of the target pH; ratio = 10^(pH − pK_a).","SAP-10.C","CH-8.9.A",0]]},{"n":10,"title":"Buffer capacity","los":[["CH-8.10.A",909,"Compare buffer capacities from component amounts and ratio.","More moles of HA and A⁻ ⇒ more capacity; capacity against acid depends on A⁻, against base on HA; best at a 1:1 ratio.","SAP-10.D","CH-8.9.B",0]]},{"n":11,"title":"pH and solubility","los":[["CH-8.11.A",910,"Predict how pH changes the solubility of a salt whose anion is a weak base (or whose cation forms a hydroxide).","Acid removes basic anions (F⁻, CO₃²⁻, OH⁻) and pulls the dissolution forward; salts of strong-acid anions (Cl⁻) are unaffected.","SPQ-5.C","CH-7.12.A CH-8.7.A",0]]}]},{"n":9,"title":"Thermodynamics and electrochemistry","scope":"core","topics":[{"n":1,"title":"Introduction to entropy","los":[["CH-9.1.A",911,"Predict the sign of ΔS for a process from changes in phase, moles of gas, mixing, dissolution and temperature.","Energy and matter more dispersed ⇒ ΔS > 0: s → l → g, more gas moles, mixing, heating.","ENE-4.A","CH-3.1.B",0]]},{"n":2,"title":"Absolute entropy and entropy change","los":[["CH-9.2.A",912,"Calculate ΔS°_rxn from standard molar entropies.","ΔS° = Σ n S°(products) − Σ n S°(reactants); S° of an element is not zero (third law: S = 0 only for a perfect crystal at 0 K).","ENE-4.B","CH-9.1.A CH-6.8.B",0]]},{"n":3,"title":"Gibbs free energy and thermodynamic favorability","los":[["CH-9.3.A",913,"Calculate ΔG° from ΔH° and ΔS°, or from standard free energies of formation.","ΔG° = ΔH° − TΔS° (convert ΔS° to kJ); ΔG° = Σ n ΔG_f°(products) − Σ n ΔG_f°(reactants).","ENE-4.C","CH-9.2.A CH-6.8.B",0],["CH-9.3.B",914,"Decide from the signs of ΔH and ΔS at which temperatures a process is favorable, and find the crossover temperature.","−ΔH, +ΔS always; +ΔH, −ΔS never; mixed signs switch at T = ΔH/ΔS.","ENE-4.C","CH-9.3.A",0]]},{"n":4,"title":"Thermodynamic and kinetic control","los":[["CH-9.4.A",915,"Explain why a thermodynamically favorable process can be too slow to observe.","ΔG \u003c 0 says it can go; a large E_a can keep it from going at a measurable rate (diamond → graphite).","ENE-4.D","CH-9.3.B CH-5.6.A",0]]},{"n":5,"title":"Free energy and equilibrium","los":[["CH-9.5.A",916,"Calculate K from ΔG°.","K = exp(−ΔG°/RT); ΔG° \u003c 0 ⇔ K > 1.","ENE-5.A","CH-9.3.A CH-7.5.A",2],["CH-9.5.B",917,"Calculate ΔG° from K.","ΔG° = −RT ln K, with R = 8.314 J/(mol·K).","ENE-5.A","CH-9.5.A",2],["CH-9.5.C",918,"Calculate ΔG under nonstandard conditions and predict the direction of reaction.","ΔG = ΔG° + RT ln Q = RT ln(Q/K); ΔG \u003c 0 ⇒ forward.","ENE-5.A","CH-9.5.B CH-7.3.B",2]]},{"n":6,"title":"Free energy of dissolution","los":[["CH-9.6.A",919,"Explain whether a salt dissolves from the enthalpy (lattice vs hydration) and entropy changes of dissolution.","ΔH_soln = lattice breaking (+) + hydration (−); ordering of water around small, highly charged ions can make ΔS_soln negative.","SPQ-5.D","CH-9.3.B CH-2.2.B CH-7.11.A",0]]},{"n":7,"title":"Coupled reactions","los":[["CH-9.7.A",920,"Calculate ΔG° for coupled reactions and explain how a favorable reaction drives an unfavorable one.","Add the reactions and their ΔG°'s; a shared intermediate links them (ATP hydrolysis in biology); light or current can also supply the free energy.","ENE-5.B","CH-9.3.A CH-6.9.A",0]]},{"n":8,"title":"Galvanic (voltaic) and electrolytic cells","los":[["CH-9.8.A",921,"Label a galvanic cell's anode and cathode, electron and ion flow, salt bridge, and write its cell notation.","Oxidation at the anode, reduction at the cathode; electrons flow anode → cathode through the wire; anode ‖ cathode in notation.","ENE-6.A","CH-4.9.C",0],["CH-9.8.B",922,"Distinguish galvanic from electrolytic cells by the sign of ΔG and the electrode charges.","Galvanic: spontaneous, anode (−); electrolytic: driven by an external source, anode (+); oxidation is always at the anode.","ENE-6.A","CH-9.8.A CH-9.3.A",0]]},{"n":9,"title":"Cell potential and free energy","los":[["CH-9.9.A",923,"Calculate E°_cell from standard reduction potentials and predict whether a redox reaction is spontaneous.","E°_cell = E°_cathode − E°_anode; don't multiply E° by coefficients; E° > 0 ⇒ spontaneous.","ENE-6.B","CH-9.8.A",0],["CH-9.9.B",924,"Convert among E°_cell, ΔG° and K.","ΔG° = −nFE°; F = 96 485 C/mol e⁻; E° = (RT/nF) ln K.","ENE-6.B","CH-9.9.A CH-9.5.B",0]]},{"n":10,"title":"Cell potential under nonstandard conditions","los":[["CH-9.10.A",925,"Predict qualitatively whether changing concentrations raises or lowers the cell potential, and why a battery dies.","Q \u003c 1 ⇒ E > E°; as the cell runs Q → K and E → 0.","ENE-6.C","CH-9.9.B CH-7.3.B",0],["CH-9.10.B",926,"Calculate a cell potential with the Nernst equation, including a concentration cell.","E = E° − (RT/nF) ln Q = E° − (0.0592/n) log Q at 25 °C; a concentration cell has E° = 0.","ENE-6.C, DAT-GC Oxidation–Reduction Reactions (electrochemical calculations)","CH-9.10.A",0]]},{"n":11,"title":"Electrolysis and Faraday's law","los":[["CH-9.11.A",927,"Calculate the mass deposited, current or time in electrolysis with Faraday's law.","charge = I·t; mol e⁻ = charge/F; half-reaction gives mol e⁻ per mol product.","ENE-6.D","CH-9.8.B CH-1.1.A",0]]},{"n":12,"title":"Temperature dependence of K","los":[["CH-9.12.A",928,"Find ΔH° from K at two temperatures, or K at a new temperature, with the van 't Hoff equation.","ln(K₂/K₁) = −(ΔH°/R)(1/T₂ − 1/T₁): endothermic ⇒ K rises with T.","graduate thermodynamics bridge (van 't Hoff)","CH-9.5.A CH-7.10.A",2]]}]}]},{"id":"physics","title":"Physics (AP)","code":"PH","track":"science","requires":["math-hs","calculus"],"units":[{"n":1,"title":"Kinematics","scope":"core","topics":[{"n":1,"title":"Scalars and vectors in one dimension","los":[["PH-1.1.A",929,"Classify a quantity as a scalar or a vector and state a vector's magnitude and direction.","A vector has magnitude and direction (displacement, velocity, force); a scalar has magnitude only (distance, speed, mass, energy).","P1 1.1.A","",0],["PH-1.1.B",930,"Add collinear vectors using a sign convention for direction.","In 1-D, pick a positive direction; opposite vectors carry opposite signs and add algebraically.","P1 1.1.B","PH-1.1.A",0]]},{"n":2,"title":"Displacement, velocity and acceleration","los":[["PH-1.2.A",931,"Calculate displacement and distinguish it from distance travelled.","Δx = x_f − x_i depends only on start and end points; distance is the total path length.","P1 1.2.A","PH-1.1.B",0],["PH-1.2.B",932,"Calculate average velocity and average acceleration over a time interval.","v_avg = Δx/Δt; a_avg = Δv/Δt; acceleration opposite to velocity means slowing down.","P1 1.2.B","PH-1.2.A",0]]},{"n":3,"title":"Representing motion","los":[["PH-1.3.A",933,"Read instantaneous velocity and acceleration from slopes, and displacement and Δv from areas, on motion graphs.","Slope of x–t is v; slope of v–t is a; area under v–t is Δx; area under a–t is Δv.","P1 1.3.A","PH-1.2.B",0],["PH-1.3.B",934,"Solve a constant-acceleration problem with the kinematic equations.","v = v₀ + at; x = x₀ + v₀t + ½at²; v² = v₀² + 2aΔx; pick the one missing the unknown you don't need.","P1 1.3.A","PH-1.3.A",0],["PH-1.3.C",935,"Analyze vertical free fall as motion with constant acceleration g downward.","Near Earth's surface a = −9.8 m/s² (up positive) throughout the flight, including at the top where v = 0.","P1 1.3.A","PH-1.3.B",0],["PH-1.3.D",936,"Translate between a narrative, a motion diagram and consistent x–t, v–t and a–t sketches.","The three graphs must agree: where v–t crosses zero, x–t has a turning point; constant a gives a straight v–t and a parabolic x–t.","P1 1.3.A","PH-1.3.A",0]]},{"n":4,"title":"Reference frames and relative motion","los":[["PH-1.4.A",937,"Calculate an object's velocity as measured by observers in different inertial frames moving along one line.","v_A rel C = v_A rel B + v_B rel C; all inertial observers measure the same acceleration.","P1 1.4.A, P1 1.4.B","PH-1.2.B",0]]},{"n":5,"title":"Vectors and motion in two dimensions","los":[["PH-1.5.A",938,"Resolve a vector into perpendicular components and rebuild a vector from its components.","A_x = A cos θ, A_y = A sin θ (θ from +x); |A| = √(A_x² + A_y²), θ = tan⁻¹(A_y/A_x) with quadrant check.","P1 1.5.A","PH-1.1.A",0],["PH-1.5.B",939,"Analyze a horizontally launched projectile by treating horizontal and vertical motion independently.","Ignoring air: a_x = 0, a_y = −g; the two directions share only the time.","P1 1.5.B","PH-1.5.A PH-1.3.C",0],["PH-1.5.C",940,"Calculate time of flight, maximum height and range of a projectile launched at an angle.","v_y = 0 at the top; on level ground R = v₀² sin 2θ / g, maximal at 45°.","P1 1.5.B","PH-1.5.B",0],["PH-1.5.D",941,"Add relative velocities in two dimensions (boat crossing a river, plane in a crosswind).","Relative velocities add as vectors; add components, then find magnitude and heading.","P1 1.5.B, P1 1.4.B","PH-1.4.A PH-1.5.A",0]]}]},{"n":2,"title":"Force and translational dynamics","scope":"core","topics":[{"n":1,"title":"Systems and center of mass","los":[["PH-2.1.A",942,"Choose a system and sort the forces on it into internal and external.","Internal forces cancel in pairs; only external forces change the motion of the system's center of mass.","P1 2.1.A","",0],["PH-2.1.B",943,"Calculate the center of mass of a system of point masses.","x_cm = Σm_i x_i / Σm_i (each axis separately); it lies closer to the heavier parts.","P1 2.1.B","PH-2.1.A",0]]},{"n":2,"title":"Forces and free-body diagrams","los":[["PH-2.2.A",944,"Identify each force on an object as an interaction with a named other object, contact or at a distance.","Every force has an agent; no agent, no force (\"force of motion\" is not a force).","P1 2.2.A","",0],["PH-2.2.B",945,"Draw a free-body diagram with every force on the object, from its point of action, in the correct direction.","Normal force is perpendicular to the surface, tension along the string away from the object, gravity toward Earth's center.","P1 2.2.B","PH-2.2.A",0]]},{"n":3,"title":"Newton's third law","los":[["PH-2.3.A",946,"Identify third-law force pairs and distinguish them from balanced forces on one object.","A third-law pair is equal and opposite, acts on two different objects and is the same type of force.","P1 2.3.A","PH-2.2.A",0]]},{"n":4,"title":"Newton's first law","los":[["PH-2.4.A",947,"Find an unknown force (tension, normal, applied) on an object in translational equilibrium.","Constant velocity (including rest) ⇔ ΣF = 0; write ΣF_x = 0 and ΣF_y = 0 separately.","P1 2.4.A","PH-2.2.B PH-1.5.A",0]]},{"n":5,"title":"Newton's second law","los":[["PH-2.5.A",948,"Apply ΣF = ma to one object to find its acceleration or an unknown force.","a = ΣF/m points along the net force; the kinematics then follows from Unit 1.","P1 2.5.A","PH-2.2.B PH-1.3.B",0],["PH-2.5.B",949,"Find the acceleration and string tension of connected objects (Atwood machine, blocks joined by a string).","Treat the whole as one system for a, then isolate one object for the tension; an ideal string has one tension and one |a|.","P1 2.5.A","PH-2.5.A PH-2.3.A PH-2.1.A",0],["PH-2.5.C",950,"Analyze an object on an incline by resolving gravity along and perpendicular to the surface.","Along the incline mg sin θ, into it mg cos θ; on a frictionless incline a = g sin θ.","P1 2.5.A","PH-2.5.A PH-1.5.A",0]]},{"n":6,"title":"Gravitational force","los":[["PH-2.6.A",951,"Calculate the gravitational force between two masses with Newton's law of gravitation.","F = Gm₁m₂/r², r center to center; doubling r quarters F.","P1 2.6.A","",0],["PH-2.6.B",952,"Calculate the gravitational field strength g at a planet's surface or at altitude.","g = GM/r²; weight mg is the gravitational force, and g is also the free-fall acceleration.","P1 2.6.A","PH-2.6.A",0]]},{"n":7,"title":"Kinetic and static friction","los":[["PH-2.7.A",953,"Calculate kinetic friction on a sliding object and the acceleration it produces.","f_k = μ_k N, opposite to the relative sliding velocity; N is found from the perpendicular force balance, not assumed to be mg.","P1 2.7","PH-2.5.A",0],["PH-2.7.B",954,"Decide whether static friction can hold an object and find the friction force actually acting.","f_s ≤ μ_s N: static friction is whatever the balance needs, up to the maximum; slipping starts when the need exceeds μ_s N.","P1 2.7","PH-2.4.A PH-2.7.A",0]]},{"n":8,"title":"Spring forces","los":[["PH-2.8.A",955,"Apply Hooke's law to find a spring force, stretch or spring constant, including k from a force–extension graph.","F_s = −kΔx, restoring toward equilibrium; k is the slope of F vs Δx.","P1 2.8","PH-2.4.A",0]]},{"n":9,"title":"Circular motion","los":[["PH-2.9.A",956,"Calculate centripetal acceleration and identify which real force supplies the net inward force.","a_c = v²/r toward the center; centripetal is a role (tension, friction, gravity, normal), never an extra force on the FBD.","P1 2.9","PH-2.5.A PH-1.5.A",0],["PH-2.9.B",957,"Apply ΣF_r = mv²/r to a car on a flat curve, a vertical loop or a conical pendulum.","Flat curve: μ_s mg ≥ mv²/r; top of a loop: N + mg = mv²/r, minimum speed √(gr).","P1 2.9","PH-2.9.A PH-2.7.B",0],["PH-2.9.C",958,"Derive the speed and period of a circular orbit from gravity as the centripetal force.","GMm/r² = mv²/r ⇒ v = √(GM/r), T² = 4π²r³/(GM); orbital speed is independent of the satellite's mass.","P1 2.9, P1 6.6","PH-2.9.A PH-2.6.B",0]]}]},{"n":3,"title":"Work, energy and power","scope":"core","topics":[{"n":1,"title":"Translational kinetic energy","los":[["PH-3.1.A",959,"Calculate translational kinetic energy and predict how it scales with speed and mass.","K = ½mv² is a scalar, never negative; doubling v quadruples K.","P1 3.1","PH-1.2.B",0]]},{"n":2,"title":"Work","los":[["PH-3.2.A",960,"Calculate the work done by a constant force over a straight displacement.","W = Fd cos θ; a force perpendicular to the motion (normal, centripetal) does no work; friction on a sliding object does negative work.","P1 3.2","PH-1.5.A PH-2.2.B",0],["PH-3.2.B",961,"Find work as the area under a force–position graph, including the work to stretch a spring.","W = area under F–x; for a spring from 0 to x, W = ½kx².","P1 3.2","PH-3.2.A PH-2.8.A",0],["PH-3.2.C",962,"Apply the work–energy theorem to find a speed or a force.","W_net = ΔK; the net work is the sum of the work done by each force.","P1 3.2","PH-3.2.A PH-3.1.A",0]]},{"n":3,"title":"Potential energy","los":[["PH-3.3.A",963,"Calculate gravitational potential energy near Earth and elastic potential energy of a spring for a system.","U_g = mgh (reference level is a choice; only ΔU matters); U_s = ½kx²; potential energy belongs to a system of interacting objects.","P1 3.3","PH-3.2.B",0],["PH-3.3.B",964,"Calculate the gravitational potential energy of two widely separated masses.","U_G = −Gm₁m₂/r with U = 0 at infinite separation; it rises toward zero as r grows.","P1 3.3","PH-3.3.A PH-2.6.A",0]]},{"n":4,"title":"Conservation of energy","los":[["PH-3.4.A",965,"Apply conservation of mechanical energy to find a speed, height or spring compression.","With only conservative forces doing work inside the system, K_i + U_i = K_f + U_f.","P1 3.4","PH-3.3.A PH-3.2.C",0],["PH-3.4.B",966,"Account for friction and external work in an energy balance.","ΔK + ΔU + ΔE_th = W_ext; sliding friction converts f_k d into thermal energy.","P1 3.4","PH-3.4.A PH-2.7.A",0],["PH-3.4.C",967,"Calculate the escape speed from a planet's surface.","½mv_esc² − GMm/R = 0 ⇒ v_esc = √(2GM/R), √2 times the circular orbital speed at the same r.","P1 3.4, P1 6.6","PH-3.4.A PH-3.3.B",0]]},{"n":5,"title":"Power","los":[["PH-3.5.A",968,"Calculate average power and the instantaneous power delivered by a force.","P_avg = W/Δt = ΔE/Δt; P = Fv cos θ; 1 W = 1 J/s.","P1 3.5","PH-3.2.A",0]]}]},{"n":4,"title":"Linear momentum","scope":"core","topics":[{"n":1,"title":"Linear momentum","los":[["PH-4.1.A",969,"Calculate the momentum of an object and of a system, and relate system momentum to the center-of-mass velocity.","p = mv is a vector; p_sys = Σm_i v_i = M v_cm.","P1 4.1","PH-1.1.B PH-2.1.B",0]]},{"n":2,"title":"Change in momentum and impulse","los":[["PH-4.2.A",970,"Calculate impulse as average force times time or as the area under F–t, and equate it to the change in momentum.","J = F_avg Δt = Δp; the same Δp over a longer time needs a smaller force (airbags, bent knees).","P1 4.2","PH-4.1.A PH-2.5.A",0]]},{"n":3,"title":"Conservation of linear momentum","los":[["PH-4.3.A",971,"Apply conservation of momentum in one dimension, including explosions and recoil.","If the net external impulse on the system is zero, p_sys before = p_sys after; an explosion from rest gives m₁v₁ = −m₂v₂.","P1 4.3","PH-4.2.A PH-2.3.A",0],["PH-4.3.B",972,"Apply conservation of momentum in two dimensions by components.","Momentum is conserved separately along x and along y.","P1 4.3","PH-4.3.A PH-1.5.A",0]]},{"n":4,"title":"Elastic and inelastic collisions","los":[["PH-4.4.A",973,"Classify a collision as elastic or inelastic by comparing kinetic energy before and after.","Momentum is conserved in every isolated collision; kinetic energy only in elastic ones.","P1 4.4","PH-4.3.A PH-3.1.A",0],["PH-4.4.B",974,"Find the final velocity and the kinetic energy lost in a perfectly inelastic collision.","Objects stick: v_f = (m₁v₁ + m₂v₂)/(m₁ + m₂); the lost K becomes thermal energy and deformation.","P1 4.4","PH-4.4.A",0],["PH-4.4.C",975,"Find both final velocities in a one-dimensional elastic collision.","Conserve p and K; equivalently the relative speed reverses: v₁ − v₂ = −(v₁′ − v₂′).","P1 4.4","PH-4.4.A",0],["PH-4.4.D",976,"Solve a two-stage problem (ballistic pendulum) with momentum for the collision and energy afterward.","Energy is not conserved through the inelastic collision, momentum is not conserved during the swing; use each only where it holds.","P1 4.4, P1 3.4","PH-4.4.B PH-3.4.A",0]]}]},{"n":5,"title":"Torque and rotational dynamics","scope":"core","topics":[{"n":1,"title":"Rotational kinematics","los":[["PH-5.1.A",977,"Solve constant-angular-acceleration problems with the rotational kinematic equations.","ω = ω₀ + αt; θ = ω₀t + ½αt²; ω² = ω₀² + 2αΔθ — the linear equations with θ, ω, α.","P1 5.1","PH-1.3.B",0]]},{"n":2,"title":"Connecting linear and rotational motion","los":[["PH-5.2.A",978,"Convert between angular and linear quantities for a point on a rotating object.","s = rθ, v = rω, a_t = rα (θ in radians); every point shares ω, speed grows with r.","P1 5.2","PH-5.1.A",0]]},{"n":3,"title":"Torque","los":[["PH-5.3.A",979,"Calculate the torque of a force about an axis and its sense of rotation.","τ = rF sin θ = r⊥F (lever arm); counterclockwise positive by convention.","P1 5.3","PH-1.5.A PH-2.2.B",0]]},{"n":4,"title":"Rotational inertia","los":[["PH-5.4.A",980,"Calculate the rotational inertia of point masses and combine given inertias of rigid shapes.","I = Σm_i r_i²; inertias about the same axis add; mass far from the axis costs the most.","P1 5.4","PH-2.1.B",0],["PH-5.4.B",981,"Shift a rotational inertia to a parallel axis.","I = I_cm + Md²; I is smallest about an axis through the center of mass.","P1 5.4","PH-5.4.A",0]]},{"n":5,"title":"Rotational equilibrium","los":[["PH-5.5.A",982,"Find unknown forces on a beam, ladder or sign in static equilibrium.","ΣF = 0 and Στ = 0 about any axis; choose the axis through an unknown force to drop it.","P1 5.5","PH-5.3.A PH-2.4.A",0]]},{"n":6,"title":"Newton's second law in rotational form","los":[["PH-5.6.A",983,"Apply Στ = Iα to find the angular acceleration of a rigid object.","α = Στ/I about a fixed axis or the center of mass.","P1 5.6","PH-5.3.A PH-5.4.A PH-2.5.A",0],["PH-5.6.B",984,"Solve a massive-pulley problem by coupling the translational and rotational equations.","Each hanging mass: ΣF = ma; pulley: (T₁ − T₂)R = Iα; no-slip: a = Rα. Tensions differ when the pulley has mass.","P1 5.6","PH-5.6.A PH-5.2.A PH-2.5.B",0]]}]},{"n":6,"title":"Energy and momentum of rotating systems","scope":"core","topics":[{"n":1,"title":"Rotational kinetic energy","los":[["PH-6.1.A",985,"Calculate the rotational kinetic energy of a rigid object.","K_rot = ½Iω².","P1 6.1","PH-5.4.A PH-3.1.A",0]]},{"n":2,"title":"Torque and work","los":[["PH-6.2.A",986,"Calculate the work done by a torque and apply the rotational work–energy theorem.","W = τΔθ for constant τ; W_net = ΔK_rot.","P1 6.2","PH-6.1.A PH-5.3.A PH-3.2.C",0]]},{"n":3,"title":"Angular momentum and angular impulse","los":[["PH-6.3.A",987,"Calculate the angular momentum of a rigid object and of a point mass moving past an axis.","L = Iω for a rigid object; L = mvr⊥ for a point mass (r⊥ = perpendicular distance from the axis to the line of motion).","P1 6.3","PH-5.4.A PH-4.1.A",0],["PH-6.3.B",988,"Relate angular impulse to the change in angular momentum.","τ_avg Δt = ΔL; area under τ–t is ΔL.","P1 6.3","PH-6.3.A PH-5.3.A",0]]},{"n":4,"title":"Conservation of angular momentum","los":[["PH-6.4.A",989,"Apply conservation of angular momentum to a spinning skater, a merry-go-round or a mass striking a rod.","Zero net external torque ⇒ I_iω_i = I_fω_f; K_rot can change (it rises when I drops).","P1 6.4","PH-6.3.B",0]]},{"n":5,"title":"Rolling","los":[["PH-6.5.A",990,"Find the speed of an object rolling without slipping down an incline, and rank shapes by speed.","v = Rω; K = ½Mv² + ½Iω²; with I = βMR², v = √(2gh/(1 + β)) — smaller β wins.","P1 6.5","PH-6.1.A PH-5.2.A PH-3.4.A",0]]},{"n":6,"title":"Motion of orbiting satellites","los":[["PH-6.6.A",991,"Compare a satellite's speed at different points of an elliptical orbit using angular momentum and energy.","Gravity exerts no torque about the planet: mv_1r_1 = mv_2r_2 at perigee and apogee; total K + U_G is constant.","P1 6.6","PH-6.4.A PH-3.3.B PH-3.4.A",0],["PH-6.6.B",992,"Calculate the kinetic, potential and total energy of a circular orbit.","K = GMm/2r, U = −GMm/r, E = −GMm/2r; a lower orbit is faster but has less total energy.","P1 6.6","PH-2.9.C PH-3.3.B",0]]}]},{"n":7,"title":"Oscillations","scope":"core","topics":[{"n":1,"title":"Defining simple harmonic motion","los":[["PH-7.1.A",993,"Identify simple harmonic motion from a restoring force proportional to displacement and locate the equilibrium position.","SHM ⇔ F = −kx about equilibrium; a vertical spring oscillates about its stretched equilibrium, not its natural length.","P1 7.1","PH-2.8.A PH-2.5.A",0]]},{"n":2,"title":"Frequency and period of SHM","los":[["PH-7.2.A",994,"Calculate the period and frequency of a mass on a spring.","T = 2π√(m/k), f = 1/T, ω = 2πf; independent of amplitude.","P1 7.2","PH-7.1.A",1],["PH-7.2.B",995,"Calculate the period of a simple pendulum at small amplitude.","T = 2π√(L/g), independent of mass; valid for small angles.","P1 7.2","PH-7.1.A PH-2.5.C",0]]},{"n":3,"title":"Representing and analyzing SHM","los":[["PH-7.3.A",996,"Write x(t) for an oscillator from a graph or a description, and say where speed and acceleration are largest.","x = A cos(2πft + φ); |v| is maximum at equilibrium, |a| maximum at the turning points.","P1 7.3","PH-7.2.A",0]]},{"n":4,"title":"Energy of simple harmonic oscillators","los":[["PH-7.4.A",997,"Apply energy conservation to an oscillator to find speed at a position or the maximum speed.","½kA² = ½mv² + ½kx² ⇒ v_max = A√(k/m) = Aω.","P1 7.4","PH-7.3.A PH-3.4.A PH-3.3.A",0]]}]},{"n":8,"title":"Fluids","scope":"core","topics":[{"n":1,"title":"Internal structure and density","los":[["PH-8.1.A",998,"Calculate density and use it to compare materials or find a mass or volume.","ρ = m/V; water is 1000 kg/m³.","P1 8.1","",0]]},{"n":2,"title":"Pressure","los":[["PH-8.2.A",999,"Calculate pressure from force and area, and convert between absolute and gauge pressure.","P = F⊥/A; P_abs = P_gauge + P_atm, P_atm ≈ 1.01 × 10⁵ Pa.","P1 8.2","PH-2.2.B",0],["PH-8.2.B",1000,"Calculate the pressure at a depth in a static fluid.","P = P₀ + ρgh; depends on depth only, not on the container's shape.","P1 8.2","PH-8.2.A PH-8.1.A",0]]},{"n":3,"title":"Fluids and Newton's laws","los":[["PH-8.3.A",1001,"Calculate the buoyant force on an object and decide whether it floats, and how deep.","F_b = ρ_fluid V_displaced g (Archimedes); a floating object displaces its own weight, fraction submerged = ρ_obj/ρ_fluid.","P1 8.3","PH-8.2.B PH-2.4.A",0],["PH-8.3.B",1002,"Calculate the force multiplication of a hydraulic lift.","Pascal: a pressure change spreads undiminished, F₁/A₁ = F₂/A₂ (work in = work out).","P1 8.3","PH-8.2.B",0]]},{"n":4,"title":"Fluids and conservation laws","los":[["PH-8.4.A",1003,"Apply the continuity equation to find a flow speed or volume flow rate.","Incompressible flow: A₁v₁ = A₂v₂ = volume flow rate; narrower pipe ⇒ faster flow.","P1 8.4","",0],["PH-8.4.B",1004,"Apply Bernoulli's equation to find a pressure or speed, including efflux from a tank.","P + ½ρv² + ρgy is constant along a streamline (energy per volume); open tank drain v = √(2gh).","P1 8.4","PH-8.4.A PH-8.2.B PH-3.4.A",0]]}]},{"n":9,"title":"Thermodynamics","scope":"core","topics":[{"n":1,"title":"Kinetic theory of temperature and pressure","los":[["PH-9.1.A",1005,"Explain gas pressure as momentum delivered by molecular collisions and predict how it changes with speed and number density.","Each wall collision transfers 2mv_x; more molecules per volume or faster molecules ⇒ higher pressure.","P2 9.1.A","PH-4.2.A",0],["PH-9.1.B",1006,"Relate absolute temperature to average molecular kinetic energy and calculate an rms speed.","K_avg = (3/2)k_B T; v_rms = √(3k_BT/m); at the same T lighter molecules move faster.","P2 9.1.B","PH-9.1.A PH-3.1.A",0]]},{"n":2,"title":"The ideal gas law","los":[["PH-9.2.A",1007,"Apply the ideal gas law to find an unknown state variable or the change between two states.","PV = nRT = Nk_BT with T in kelvin; for a fixed amount P₁V₁/T₁ = P₂V₂/T₂.","P2 9.2.A","PH-9.1.B",0]]},{"n":3,"title":"Thermal energy transfer and equilibrium","los":[["PH-9.3.A",1008,"Predict the direction of heat transfer between objects in contact and the condition for thermal equilibrium.","Heat flows spontaneously from higher to lower T until temperatures are equal (zeroth law).","P2 9.3.A","PH-9.1.B",0]]},{"n":4,"title":"The first law of thermodynamics","los":[["PH-9.4.A",1009,"Calculate the internal energy of a monatomic ideal gas and its change.","U = (3/2)nRT for a monatomic ideal gas; ΔU depends only on ΔT.","P2 9.4.A","PH-9.1.B PH-9.2.A",0],["PH-9.4.B",1010,"Calculate the work done on a gas from the area under a P–V curve, and identify isobaric, isochoric, isothermal and adiabatic paths.","W_on = −∫P dV = −(area under P–V) for expansion; isobaric W = −PΔV, isochoric W = 0.","P2 9.4.B","PH-9.2.A PH-3.2.B",1],["PH-9.4.C",1011,"Apply the first law to find Q, W or ΔU for each type of process.","ΔU = Q + W (W on the gas); isothermal ΔU = 0, adiabatic Q = 0, isochoric W = 0.","P2 9.4.B","PH-9.4.A PH-9.4.B PH-9.3.A",1],["PH-9.4.D",1012,"Analyze a cyclic process on a P–V diagram for net work and net heat.","Over a cycle ΔU = 0, so Q_net = −W_net = enclosed area (clockwise = net work done by the gas).","P2 9.4.B","PH-9.4.C",0]]},{"n":5,"title":"Specific heat and thermal conductivity","los":[["PH-9.5.A",1013,"Calculate the heat needed for a temperature change and the final temperature of a calorimetry mixture.","Q = mcΔT; in an insulated mixture ΣQ = 0, so heat lost by the hot = heat gained by the cold.","P2 9.5.A","PH-9.3.A",0],["PH-9.5.B",1014,"Calculate the rate of heat conduction through a slab.","Q/Δt = kAΔT/L; thicker or less conductive ⇒ slower.","P2 9.5.B","PH-9.5.A",2]]},{"n":6,"title":"Entropy and the second law","los":[["PH-9.6.A",1015,"Predict whether the entropy of a system and its surroundings increases, decreases or stays the same in a process.","The total entropy of an isolated system never decreases; spontaneous heat flow and mixing raise it.","P2 9.6.A","PH-9.3.A",0],["PH-9.6.B",1016,"Calculate the efficiency of a heat engine and compare it with the Carnot limit.","e = W/Q_H = 1 − Q_C/Q_H ≤ 1 − T_C/T_H (kelvin); bridge to engineering thermodynamics — check against the current CED.","P2 9.6","PH-9.6.A PH-9.4.D",0]]}]},{"n":10,"title":"Electric force, field and potential","scope":"core","topics":[{"n":1,"title":"Electric charge and electric force","los":[["PH-10.1.A",1017,"Calculate the electric force between two point charges with Coulomb's law.","F = k|q₁q₂|/r², k = 8.99 × 10⁹ N·m²/C²; like charges repel, unlike attract.","P2 10.1.A","PH-2.6.A",0],["PH-10.1.B",1018,"Find the equilibrium of a charged object acted on by both electric and gravitational forces.","Electric force dwarfs gravity between particles; for a hanging charged ball, tan θ = F_e/(mg).","P2 10.1.B","PH-10.1.A PH-2.4.A",0],["PH-10.1.C",1019,"Account for the permittivity of a medium in electric force calculations.","k = 1/(4πε), ε = κε₀; a medium with κ > 1 weakens the force by a factor κ.","P2 10.1.C","PH-10.1.A",0],["PH-10.1.D",1020,"Find the net electric force on a charge from several others by vector superposition.","Each pair force is computed independently; add the vectors by components.","P2 10.1.A","PH-10.1.A PH-1.5.A",0]]},{"n":2,"title":"Conservation of charge and charging","los":[["PH-10.2.A",1021,"Track charge through charging by friction, conduction and induction, including sharing between identical conductors.","Charge is conserved and quantized (e = 1.6 × 10⁻¹⁹ C); identical touching spheres end with equal shares.","P2 10.2.A","PH-10.1.A",0]]},{"n":3,"title":"Electric fields","los":[["PH-10.3.A",1022,"Calculate the electric field of one or more point charges.","E = kq/r², away from + and toward −; fields from several charges add as vectors.","P2 10.3.A","PH-10.1.D",0],["PH-10.3.B",1023,"Calculate the force on a charge in a field and its resulting motion in a uniform field.","F = qE, a = qE/m; a charge entering a uniform field moves like a projectile.","P2 10.3.A","PH-10.3.A PH-1.5.B PH-2.5.A",0],["PH-10.3.C",1024,"Describe the field of charged conductors and the uniform field between oppositely charged parallel plates.","In electrostatic equilibrium E = 0 inside a conductor and E is perpendicular to its surface; between large plates E is uniform.","P2 10.3.B","PH-10.3.A PH-10.2.A",0],["PH-10.3.D",1025,"Sketch and interpret electric field lines.","Lines start on +, end on −, never cross; their density shows field strength.","P2 10.3","PH-10.3.A",0]]},{"n":4,"title":"Electric potential energy","los":[["PH-10.4.A",1026,"Calculate the electric potential energy of a system of point charges.","U = kq₁q₂/r for each pair (sign included), U = 0 at infinity; total = sum over pairs.","P2 10.4","PH-10.1.A PH-3.3.B",0]]},{"n":5,"title":"Electric potential","los":[["PH-10.5.A",1027,"Calculate the electric potential at a point due to point charges.","V = kq/r, a scalar: add with signs, no components; U = qV.","P2 10.5","PH-10.4.A",0],["PH-10.5.B",1028,"Relate potential difference to a uniform field, and sketch equipotentials.","|E| = ΔV/d, pointing toward lower V; equipotentials are perpendicular to field lines.","P2 10.5","PH-10.5.A PH-10.3.C",0]]},{"n":6,"title":"Capacitors","los":[["PH-10.6.A",1029,"Calculate the capacitance of a parallel-plate capacitor and the charge it stores.","C = κε₀A/d; Q = CΔV.","P2 10.6","PH-10.5.B PH-10.1.C",0],["PH-10.6.B",1030,"Calculate the energy stored in a capacitor.","U_C = ½QΔV = ½C(ΔV)² = Q²/(2C).","P2 10.6","PH-10.6.A",0]]},{"n":7,"title":"Conservation of electric energy","los":[["PH-10.7.A",1031,"Find the speed of a charge accelerated through a potential difference.","ΔK = −qΔV; 1 eV = 1.6 × 10⁻¹⁹ J is the energy an electron gains across 1 V.","P2 10.7","PH-10.5.A PH-3.4.A",0]]}]},{"n":11,"title":"Electric circuits","scope":"core","topics":[{"n":1,"title":"Electric current","los":[["PH-11.1.A",1032,"Calculate current as the rate of charge flow and state its conventional direction.","I = ΔQ/Δt (1 A = 1 C/s); conventional current runs from + to − outside the source.","P2 11.1","PH-10.2.A",0]]},{"n":3,"title":"Resistance, resistivity and Ohm's law","los":[["PH-11.3.A",1033,"Calculate the resistance of a wire from its resistivity and dimensions.","R = ρL/A; longer or thinner ⇒ larger R.","P2 11.3","PH-11.1.A",0],["PH-11.3.B",1034,"Apply Ohm's law to find a current, voltage or resistance.","ΔV = IR for an ohmic element (linear I–V graph, slope 1/R).","P2 11.3","PH-11.3.A PH-10.5.B",0]]},{"n":4,"title":"Electric power","los":[["PH-11.4.A",1035,"Calculate the power dissipated by a resistor and rank bulb brightness.","P = IΔV = I²R = (ΔV)²/R; brightness follows power.","P2 11.4","PH-11.3.B PH-3.5.A",0]]},{"n":5,"title":"Compound DC circuits","los":[["PH-11.5.A",1036,"Calculate the equivalent resistance of series and parallel combinations.","Series R_eq = ΣR (same I); parallel 1/R_eq = Σ1/R (same ΔV); parallel R_eq is less than the smallest branch.","P2 11.5","PH-11.3.B",0],["PH-11.5.B",1037,"Calculate the equivalent capacitance of series and parallel combinations.","Parallel C_eq = ΣC; series 1/C_eq = Σ1/C — the reverse of resistors.","P2 11.5","PH-10.6.A",0],["PH-11.5.C",1038,"Find the terminal voltage of a battery with internal resistance.","ΔV_terminal = ε − Ir; equals ε only when no current flows.","P2 11.5","PH-11.5.A",0]]},{"n":6,"title":"Kirchhoff's loop rule","los":[["PH-11.6.A",1039,"Apply the loop rule to find an unknown voltage or current in a single loop.","ΣΔV = 0 around any closed loop (energy conservation); +ε across a source − to +, −IR going with the current.","P2 11.6","PH-11.3.B PH-10.7.A",0]]},{"n":7,"title":"Kirchhoff's junction rule","los":[["PH-11.7.A",1040,"Apply the junction rule to find an unknown branch current.","ΣI_in = ΣI_out at a junction (charge conservation).","P2 11.7","PH-11.1.A PH-10.2.A",0],["PH-11.7.B",1041,"Solve a multi-loop circuit with the loop and junction rules together.","Assign branch currents, write one junction equation fewer than junctions and enough loop equations; a negative answer means the guessed direction was wrong.","P2 11.6, P2 11.7","PH-11.6.A PH-11.7.A",0]]},{"n":8,"title":"RC circuits","los":[["PH-11.8.A",1042,"Find the currents in an RC circuit just after the switch closes and after a long time.","An uncharged capacitor acts as a wire at t = 0; a fully charged one carries no current (open branch).","P2 11.8","PH-11.5.B PH-11.6.A",0],["PH-11.8.B",1043,"Calculate the time constant of an RC circuit and sketch charge and current versus time.","τ = RC; charging Q rises toward CΔV and I decays toward 0, ~63% of the change per τ.","P2 11.8","PH-11.8.A",0]]}]},{"n":12,"title":"Magnetism and electromagnetism","scope":"core","topics":[{"n":1,"title":"Magnetic fields","los":[["PH-12.1.A",1044,"Sketch the magnetic field of a bar magnet or of Earth and describe magnetic dipoles.","Field lines leave N and enter S and form closed loops; there are no isolated magnetic poles.","P2 12.1","",0]]},{"n":2,"title":"Magnetism and moving charges","los":[["PH-12.2.A",1045,"Calculate the magnetic force on a moving charge and find its direction with the right-hand rule.","F = |q|vB sin θ, perpendicular to both v and B (reverse for negative charge); it does no work.","P2 12.2","PH-12.1.A PH-10.3.B",0],["PH-12.2.B",1046,"Calculate the radius and period of a charged particle's circular path in a uniform magnetic field.","qvB = mv²/r ⇒ r = mv/(qB); period 2πm/(qB) is independent of speed.","P2 12.2","PH-12.2.A PH-2.9.A",0],["PH-12.2.C",1047,"Find the speed a velocity selector passes undeflected.","Crossed fields balance when qE = qvB ⇒ v = E/B.","P2 12.2","PH-12.2.A",0]]},{"n":3,"title":"Magnetism and current-carrying wires","los":[["PH-12.3.A",1048,"Calculate the magnetic field near a long straight wire and give its direction.","B = μ₀I/(2πr), circling the wire (right-hand grip rule); μ₀ = 4π × 10⁻⁷ T·m/A.","P2 12.3","PH-12.1.A PH-11.1.A",0],["PH-12.3.B",1049,"Calculate the force on a current-carrying wire in a field, including between two parallel wires.","F = ILB sin θ; parallel currents attract, antiparallel repel.","P2 12.3","PH-12.3.A PH-12.2.A",0]]},{"n":4,"title":"Electromagnetic induction and Faraday's law","los":[["PH-12.4.A",1050,"Calculate the magnetic flux through a loop.","Φ_B = BA cos θ, θ between B and the loop's normal; unit weber (T·m²).","P2 12.4","PH-12.1.A PH-1.5.A",0],["PH-12.4.B",1051,"Apply Faraday's law to find the average induced emf from a change in flux.","|ε| = N|ΔΦ_B/Δt|; flux can change through B, area or angle.","P2 12.4","PH-12.4.A",0],["PH-12.4.C",1052,"Determine the direction of an induced current with Lenz's law.","The induced current makes a field that opposes the change in flux, not the flux itself.","P2 12.4","PH-12.4.B",0],["PH-12.4.D",1053,"Calculate the motional emf, current and magnetic force for a rod sliding on rails.","ε = BLv; I = ε/R; the force ILB on the rod opposes its motion.","P2 12.4","PH-12.4.C PH-12.3.B PH-11.3.B",0]]}]},{"n":13,"title":"Geometric optics","scope":"core","topics":[{"n":1,"title":"Reflection","los":[["PH-13.1.A",1054,"Apply the law of reflection and locate the image in a plane mirror.","θ_i = θ_r from the normal; a plane-mirror image is virtual, upright, same size, as far behind as the object is in front.","P2 13.1","",0]]},{"n":2,"title":"Images formed by mirrors","los":[["PH-13.2.A",1055,"Draw a ray diagram to locate the image formed by a concave or convex mirror.","Principal rays: parallel → through F, through F → parallel, through C → back on itself; convex mirrors always give virtual, upright, reduced images.","P2 13.2","PH-13.1.A",0],["PH-13.2.B",1056,"Apply the mirror equation and magnification to find image position, size and orientation.","1/f = 1/s_o + 1/s_i, f = R/2; M = −s_i/s_o; real images have s_i > 0 and are inverted.","P2 13.2","PH-13.2.A",0]]},{"n":3,"title":"Refraction","los":[["PH-13.3.A",1057,"Calculate an index of refraction and apply Snell's law at an interface.","n = c/v; n₁ sin θ₁ = n₂ sin θ₂; light bends toward the normal entering a higher-n medium.","P2 13.3","",0],["PH-13.3.B",1058,"Calculate the critical angle and decide whether total internal reflection occurs.","sin θ_c = n₂/n₁, only for light going from higher to lower n.","P2 13.3","PH-13.3.A",0]]},{"n":4,"title":"Images formed by lenses","los":[["PH-13.4.A",1059,"Draw a ray diagram to locate the image formed by a converging or diverging lens.","Parallel ray → through far F (converging) or away from near F (diverging); ray through the center goes straight.","P2 13.4","PH-13.3.A PH-13.2.A",0],["PH-13.4.B",1060,"Apply the thin-lens equation and magnification and classify the image.","1/f = 1/s_o + 1/s_i (f \u003c 0 diverging); M = −s_i/s_o; an object inside f of a converging lens gives a virtual magnified image.","P2 13.4","PH-13.4.A PH-13.2.B",0]]}]},{"n":14,"title":"Waves, sound and physical optics","scope":"core","topics":[{"n":1,"title":"Properties of wave pulses and waves","los":[["PH-14.1.A",1061,"Classify a wave as transverse or longitudinal and describe what it carries.","A wave transports energy, not matter; transverse = medium moves ⟂ to propagation, longitudinal = ∥ (sound).","P2 14.1","PH-7.3.A",0]]},{"n":2,"title":"Periodic waves","los":[["PH-14.2.A",1062,"Apply v = fλ to find a wavelength, frequency or speed.","v = fλ = λ/T; the medium sets v, the source sets f.","P2 14.2","PH-14.1.A PH-7.2.A",0],["PH-14.2.B",1063,"Calculate the wave speed on a stretched string.","v = √(F_T/μ), μ = mass per length.","P2 14.2","PH-14.2.A",0]]},{"n":3,"title":"Boundary behavior and polarization","los":[["PH-14.3.A",1064,"Predict the reflected and transmitted pulses at a boundary between media.","Reflection off a fixed end (or a denser medium) inverts the pulse; frequency is unchanged on crossing, speed and wavelength change.","P2 14.3","PH-14.2.A",0],["PH-14.3.B",1065,"Calculate the intensity of light transmitted through polarizers.","Only transverse waves polarize; unpolarized → I₀/2, then I = I₀cos²θ through each later polarizer.","P2 14.3","PH-14.1.A",0]]},{"n":4,"title":"Electromagnetic waves","los":[["PH-14.4.A",1066,"Place radiation in the electromagnetic spectrum and calculate its frequency or wavelength.","All EM waves travel at c = 3.00 × 10⁸ m/s in vacuum, c = fλ; in a medium v = c/n and λ shrinks.","P2 14.4","PH-14.2.A PH-13.3.A",0]]},{"n":5,"title":"The Doppler effect","los":[["PH-14.5.A",1067,"Predict and calculate the observed frequency shift when a sound source or observer moves.","Approach ⇒ higher f, recede ⇒ lower; f′ = f(v ± v_o)/(v ∓ v_s).","P2 14.5","PH-14.2.A",0]]},{"n":6,"title":"Wave interference and standing waves","los":[["PH-14.6.A",1068,"Apply superposition to decide whether two waves interfere constructively or destructively at a point.","In-phase sources: path difference mλ ⇒ constructive, (m + ½)λ ⇒ destructive.","P2 14.6","PH-14.2.A",0],["PH-14.6.B",1069,"Find the harmonic frequencies of a string or an air column open or closed at one end.","String or open pipe λ_n = 2L/n (all n); closed pipe λ_n = 4L/n (odd n only); f_n = v/λ_n.","P2 14.6","PH-14.6.A PH-14.3.A PH-14.2.B",0],["PH-14.6.C",1070,"Calculate the beat frequency of two nearby tones.","f_beat = |f₁ − f₂|.","P2 14.6","PH-14.6.A",0]]},{"n":7,"title":"Diffraction","los":[["PH-14.7.A",1071,"Predict how much a wave spreads through an opening and locate single-slit minima.","Spreading is large when λ is comparable to the slit width a; dark fringes at a sin θ = mλ (m ≠ 0).","P2 14.7","PH-14.6.A",0]]},{"n":8,"title":"Double-slit interference and diffraction gratings","los":[["PH-14.8.A",1072,"Locate bright fringes for a double slit or grating and calculate fringe spacing.","Bright: d sin θ = mλ; small angles Δy = λL/d; a grating gives sharper, brighter maxima.","P2 14.8","PH-14.7.A",0]]},{"n":9,"title":"Thin-film interference","los":[["PH-14.9.A",1073,"Find the film thickness that gives constructive or destructive reflection.","Reflection off a higher-n layer adds a half-wave shift; count shifts, then 2nt = mλ or (m + ½)λ accordingly.","P2 14.9","PH-14.6.A PH-13.3.A PH-14.3.A",0]]}]},{"n":15,"title":"Modern physics","scope":"core","topics":[{"n":1,"title":"Quantum theory and wave–particle duality","los":[["PH-15.1.A",1074,"Calculate the energy of a photon from its frequency or wavelength.","E = hf = hc/λ; hc ≈ 1240 eV·nm.","P2 15.1","PH-14.4.A",0],["PH-15.1.B",1075,"Calculate the de Broglie wavelength of a moving particle.","λ = h/p; wave behavior shows when λ is comparable to the size of what it meets.","P2 15.1","PH-15.1.A PH-4.1.A",0]]},{"n":2,"title":"The Bohr model of atomic structure","los":[["PH-15.2.A",1076,"Use the Bohr model to give the energy levels of hydrogen.","E_n = −13.6 eV/n²; electrons occupy only discrete levels; ionization from n is |E_n|.","P2 15.2","PH-10.4.A PH-2.9.A",0]]},{"n":3,"title":"Emission and absorption spectra","los":[["PH-15.3.A",1077,"Calculate the wavelength of light emitted or absorbed in a transition between levels.","hf = |E_upper − E_lower|; an atom absorbs only photons that match a level difference.","P2 15.3","PH-15.2.A PH-15.1.A",0]]},{"n":4,"title":"Blackbody radiation","los":[["PH-15.4.A",1078,"Find the peak wavelength of blackbody emission from the temperature, or the reverse.","Wien: λ_max T = 2.898 × 10⁻³ m·K; hotter objects peak at shorter λ.","P2 15.4","PH-15.1.A PH-9.1.B",2],["PH-15.4.B",1079,"Calculate the total power radiated by a hot surface.","P = εσAT⁴ with T in kelvin; doubling T multiplies P by 16.","P2 15.4","PH-15.4.A",2]]},{"n":5,"title":"The photoelectric effect","los":[["PH-15.5.A",1080,"Calculate the maximum kinetic energy or stopping potential of photoelectrons and the threshold frequency.","K_max = hf − φ = eV_stop; below f₀ = φ/h no electrons at any intensity.","P2 15.5","PH-15.1.A PH-10.7.A",0]]},{"n":6,"title":"Compton scattering","los":[["PH-15.6.A",1081,"Calculate the wavelength shift of a photon scattered by an electron.","Photons carry p = h/λ; Δλ = (h/m_ec)(1 − cos θ) from momentum and energy conservation.","P2 15.6","PH-15.1.B PH-4.3.B",0]]},{"n":7,"title":"Fission, fusion and nuclear decay","los":[["PH-15.7.A",1082,"Calculate the energy released in a nuclear reaction from the mass defect.","E = Δmc², 1 u ↔ 931.5 MeV; fission of heavy and fusion of light nuclei both move toward higher binding energy per nucleon.","P2 15.7","PH-3.4.A",0]]},{"n":8,"title":"Types of radioactive decay","los":[["PH-15.8.A",1083,"Write a balanced alpha, beta or gamma decay equation.","Nucleon number A and charge Z are conserved; α removes ⁴₂He, β⁻ turns n → p + e⁻ + ν̄, γ changes neither.","P2 15.8","PH-15.7.A PH-10.2.A",0],["PH-15.8.B",1084,"Calculate the amount remaining or the elapsed time from a half-life.","N = N₀(½)^(t/T½); decay is random per nucleus but predictable in bulk.","P2 15.8","PH-15.8.A",1]]}]},{"n":16,"title":"Kinematics with calculus","scope":"core","topics":[{"n":2,"title":"Displacement, velocity and acceleration as derivatives","los":[["PH-16.2.A",1085,"Differentiate a position function to get velocity and acceleration as functions of time.","v = dx/dt, a = dv/dt = d²x/dt²; turning points where v = 0.","CM 1.2","PH-1.3.A",0],["PH-16.2.B",1086,"Integrate a time-dependent acceleration or velocity with initial conditions to get v(t) and x(t).","v(t) = v₀ + ∫₀ᵗ a dt′, x(t) = x₀ + ∫₀ᵗ v dt′; the constant-a equations are the special case.","CM 1.2, CM 1.3","PH-16.2.A",0],["PH-16.2.C",1087,"Find velocity as a function of position when acceleration depends on position or velocity.","a = v dv/dx ⇒ ∫v dv = ∫a(x) dx; for a(v), separate dt = dv/a(v).","CM 1.2","PH-16.2.B PH-2.5.A",0]]},{"n":5,"title":"Motion in two or three dimensions","los":[["PH-16.5.A",1088,"Differentiate and integrate a vector position r(t) component by component.","r = x î + y ĵ + z k̂; v = dr/dt and a = dv/dt act on each component independently.","CM 1.5","PH-16.2.A PH-1.5.B",0]]}]},{"n":17,"title":"Dynamics with calculus","scope":"core","topics":[{"n":1,"title":"Center of mass of continuous objects","los":[["PH-17.1.A",1089,"Calculate the center of mass of a rod or plate with nonuniform density by integration.","x_cm = ∫x dm / ∫dm with dm = λ(x) dx (or σ dA); uniform symmetric objects have it at the geometric center.","CM 2.1","PH-2.1.B PH-16.2.B",0]]},{"n":5,"title":"Newton's second law with time-varying forces","los":[["PH-17.5.A",1090,"Find v(t) and x(t) for an object under a time-dependent net force.","ΣF = dp/dt = m dv/dt for constant m; integrate F(t)/m for v(t).","CM 2.5","PH-2.5.A PH-16.2.B PH-4.2.A",0]]},{"n":9,"title":"Resistive forces","los":[["PH-17.9.A",1091,"Set up and solve the equation of motion for a falling object with linear drag, and find its terminal velocity.","m dv/dt = mg − bv ⇒ v(t) = v_T(1 − e^(−t/τ)), v_T = mg/b, τ = m/b.","CM 2.9","PH-17.5.A",1]]},{"n":10,"title":"Circular motion","los":[["PH-17.10.A",1092,"Resolve the acceleration of an object in nonuniform circular motion into tangential and radial parts.","a_t = dv/dt, a_r = v²/r; |a| = √(a_t² + a_r²).","CM 2.10","PH-2.9.B PH-16.2.A",0]]}]},{"n":18,"title":"Work and energy with calculus","scope":"core","topics":[{"n":2,"title":"Work by a variable force","los":[["PH-18.2.A",1093,"Calculate the work done by a position-dependent force by integration.","W = ∫F · dr = ∫F_x dx in 1-D; the spring's ½kx² is ∫kx dx.","CM 3.2","PH-3.2.B PH-16.2.B",0]]},{"n":3,"title":"Potential energy and conservative forces","los":[["PH-18.3.A",1094,"Derive the potential energy function of a conservative force.","ΔU = −∫F dx; gravity between masses gives U = −GMm/r with U(∞) = 0.","CM 3.3","PH-3.3.B PH-18.2.A",0],["PH-18.3.B",1095,"Find the force from a potential energy function and locate and classify equilibria on a U(x) graph.","F_x = −dU/dx; equilibrium where dU/dx = 0, stable at a minimum, unstable at a maximum; turning points where U = E.","CM 3.3","PH-18.3.A",0]]},{"n":5,"title":"Power","los":[["PH-18.5.A",1096,"Calculate instantaneous power as a derivative and the work delivered by a time-varying power.","P = dW/dt = F · v; W = ∫P dt.","CM 3.5","PH-3.5.A PH-18.2.A",0]]}]},{"n":19,"title":"Momentum with calculus","scope":"core","topics":[{"n":2,"title":"Impulse of a time-varying force","los":[["PH-19.2.A",1097,"Calculate the impulse of a time-varying force by integration and the resulting velocity.","J = ∫F dt = Δp; F = dp/dt.","CM 4.2","PH-4.2.A PH-16.2.B",0]]}]},{"n":20,"title":"Rotational dynamics with calculus","scope":"core","topics":[{"n":1,"title":"Rotational kinematics as derivatives","los":[["PH-20.1.A",1098,"Differentiate and integrate θ(t), ω(t) and α(t) for nonconstant angular acceleration.","ω = dθ/dt, α = dω/dt; integrate with initial conditions as in linear kinematics.","CM 5.1","PH-5.1.A PH-16.2.B",0]]},{"n":3,"title":"Torque as a cross product","los":[["PH-20.3.A",1099,"Compute torque as the cross product r × F from components.","τ = r × F, |τ| = rF sin θ, direction by the right-hand rule along the rotation axis.","CM 5.3","PH-5.3.A PH-1.5.A",0]]},{"n":4,"title":"Rotational inertia by integration","los":[["PH-20.4.A",1100,"Derive the rotational inertia of a rod, ring or disk by integration.","I = ∫r² dm; rod about center ML²/12, about end ML²/3, disk ½MR², ring MR².","CM 5.4","PH-5.4.B PH-17.1.A",0]]}]},{"n":21,"title":"Angular momentum and rolling with calculus","scope":"core","topics":[{"n":3,"title":"Angular momentum as a vector","los":[["PH-21.3.A",1101,"Compute angular momentum as r × p and apply τ_net = dL/dt.","L = r × p for a particle, Iω for a rigid body about a symmetry axis; net torque is the rate of change of L.","CM 6.3","PH-6.3.B PH-20.3.A",0]]},{"n":5,"title":"Rolling with friction","los":[["PH-21.5.A",1102,"Find the acceleration and the static friction force for an object rolling without slipping down an incline.","Ma = Mg sin θ − f, fR = Iα, a = Rα ⇒ a = g sin θ/(1 + I/MR²); rolling friction does no work.","CM 6.5","PH-6.5.A PH-5.6.A PH-2.7.B",0]]}]},{"n":22,"title":"Oscillations with calculus","scope":"core","topics":[{"n":1,"title":"SHM as a differential equation","los":[["PH-22.1.A",1103,"Derive the SHM differential equation from Newton's second law and read the angular frequency off it.","F = −kx ⇒ d²x/dt² = −(k/m)x; any system of the form ẍ = −ω²x oscillates with ω.","CM 7.1, CM 7.2","PH-7.1.A PH-16.2.A",1],["PH-22.1.B",1104,"Solve for amplitude and phase from initial position and velocity.","x = A cos(ωt + φ); A = √(x₀² + (v₀/ω)²), tan φ = −v₀/(ωx₀).","CM 7.3","PH-22.1.A PH-7.3.A",2]]},{"n":5,"title":"Simple and physical pendulums","los":[["PH-22.5.A",1105,"Derive the small-angle period of a physical pendulum from the rotational equation of motion.","−mgd sin θ = Iθ̈, sin θ ≈ θ ⇒ T = 2π√(I/(mgd)); a point mass on a string gives back 2π√(L/g).","CM 7.5","PH-22.1.A PH-5.6.A PH-7.2.B PH-20.4.A",0]]}]},{"n":23,"title":"Electric fields and Gauss's law","scope":"core","topics":[{"n":4,"title":"Electric fields of charge distributions","los":[["PH-23.4.A",1106,"Calculate the electric field of a continuous charge distribution (rod, ring, arc) by integration.","dE = k dq/r², dq = λ dl; integrate components and use symmetry to cancel some.","CEM 8.4","PH-10.3.A PH-17.1.A",0]]},{"n":5,"title":"Electric flux","los":[["PH-23.5.A",1107,"Calculate the electric flux through a flat or closed surface.","Φ_E = ∫E · dA; uniform field through a flat area Φ = EA cos θ; field lines through a closed surface count net enclosed charge.","CEM 8.5","PH-10.3.D PH-12.4.A",0]]},{"n":6,"title":"Gauss's law","los":[["PH-23.6.A",1108,"Apply Gauss's law to find the field of a spherical, cylindrical or planar charge distribution.","∮E · dA = Q_enc/ε₀; choose a surface where E is constant and parallel or perpendicular to dA.","CEM 8.6","PH-23.5.A PH-10.3.C",0],["PH-23.6.B",1109,"Find the field inside a sphere or cylinder with radially varying charge density.","Q_enc = ∫ρ(r) dV with dV = 4πr²dr (sphere) or 2πrL dr (cylinder).","CEM 8.6","PH-23.6.A",0]]}]},{"n":24,"title":"Electric potential with calculus","scope":"core","topics":[{"n":2,"title":"Electric potential from fields and distributions","los":[["PH-24.2.A",1110,"Calculate a potential difference by integrating the electric field along a path.","ΔV = −∫E · dr; path-independent because the electrostatic field is conservative.","CEM 9.2","PH-10.5.B PH-23.6.A PH-18.3.A",0],["PH-24.2.B",1111,"Calculate the potential of a continuous charge distribution by integration.","V = ∫k dq/r — a scalar integral, easier than the field.","CEM 9.2","PH-10.5.A PH-23.4.A",0],["PH-24.2.C",1112,"Find the electric field from a potential function.","E_x = −∂V/∂x (each component); E points down the steepest potential slope.","CEM 9.2","PH-24.2.A PH-18.3.B",0]]}]},{"n":25,"title":"Conductors and capacitors","scope":"core","topics":[{"n":1,"title":"Electrostatics with conductors","los":[["PH-25.1.A",1113,"Find induced charges and fields for a charge inside or near a conducting shell.","E = 0 in the conductor ⇒ a Gaussian surface in the metal encloses zero net charge; excess charge sits on surfaces.","CEM 10.1","PH-10.3.C PH-23.6.A",0]]},{"n":2,"title":"Redistribution of charge between conductors","los":[["PH-25.2.A",1114,"Calculate how charge divides between connected conducting spheres.","Connected conductors reach equal potential: kQ₁/R₁ = kQ₂/R₂ ⇒ Q ∝ R; total charge conserved.","CEM 10.2","PH-25.1.A PH-24.2.A",0]]},{"n":3,"title":"Capacitors","los":[["PH-25.3.A",1115,"Derive the capacitance of a parallel-plate, spherical or cylindrical capacitor.","Find E by Gauss, ΔV = ∫E dr, then C = Q/ΔV; cylindrical C = 2πε₀L/ln(b/a).","CEM 10.3","PH-10.6.A PH-24.2.A",0],["PH-25.3.B",1116,"Calculate the energy stored in a field from its energy density.","u = ½ε₀E²; U = ∫u dV, which reproduces ½CV² for a capacitor.","CEM 10.3","PH-25.3.A PH-10.6.B",0]]},{"n":4,"title":"Dielectrics","los":[["PH-25.4.A",1117,"Predict how inserting a dielectric changes C, Q, V, E and U with the battery connected or disconnected.","C = κC₀; connected: V fixed, Q and U rise by κ; isolated: Q fixed, V, E and U fall by κ.","CEM 10.4","PH-25.3.A PH-10.1.C",0]]}]},{"n":26,"title":"Circuits with calculus","scope":"core","topics":[{"n":1,"title":"Current as a rate and drift velocity","los":[["PH-26.1.A",1118,"Calculate current from a charge function and relate it to drift velocity.","I = dQ/dt; I = nqAv_d with n carriers per volume.","CEM 11.1","PH-11.1.A PH-16.2.A",0]]},{"n":8,"title":"RC circuits","los":[["PH-26.8.A",1119,"Derive and solve the differential equation for a charging or discharging RC circuit.","ε − IR − q/C = 0, I = dq/dt ⇒ q(t) = Cε(1 − e^(−t/RC)); discharge q = Q₀e^(−t/RC).","CEM 11.8","PH-11.8.B PH-11.6.A PH-16.2.B",1],["PH-26.8.B",1120,"Calculate the time to reach a given charge or current fraction, and the energy dissipated in the resistor.","t = τ ln(1/(1 − f)) charging; total heat on discharge = initial ½CV².","CEM 11.8","PH-26.8.A",1]]}]},{"n":27,"title":"Magnetic fields with calculus","scope":"core","topics":[{"n":2,"title":"Magnetic force as a cross product","los":[["PH-27.2.A",1121,"Compute the magnetic force on a moving charge or current element as a cross product.","F = qv × B; dF = I dl × B, integrated along a wire.","CEM 12.2","PH-12.2.A PH-20.3.A",0]]},{"n":3,"title":"The Biot–Savart law","los":[["PH-27.3.A",1122,"Apply the Biot–Savart law to find B at the center of a loop or arc, or on a loop's axis.","dB = (μ₀/4π) I dl × r̂ / r²; center of a loop B = μ₀I/(2R).","CEM 12.3","PH-12.3.A PH-23.4.A",0]]},{"n":4,"title":"Ampère's law","los":[["PH-27.4.A",1123,"Apply Ampère's law to find B of a long wire (inside and out), a solenoid or a toroid.","∮B · dl = μ₀I_enc; solenoid B = μ₀nI inside, ~0 outside.","CEM 12.4","PH-12.3.A PH-23.6.A",0]]}]},{"n":28,"title":"Electromagnetic induction","scope":"core","topics":[{"n":1,"title":"Magnetic flux of a nonuniform field","los":[["PH-28.1.A",1124,"Calculate the magnetic flux through a loop in a nonuniform field (such as near a long wire) by integration.","Φ_B = ∫B · dA; next to a wire, strips dA = L dr give Φ = (μ₀IL/2π) ln(b/a).","CEM 13.1","PH-12.4.A PH-12.3.A PH-16.2.B",0]]},{"n":2,"title":"Faraday's law with derivatives","los":[["PH-28.2.A",1125,"Calculate the instantaneous emf from a time-varying flux, including a rotating coil (generator).","ε = −N dΦ_B/dt; coil rotating at ω: ε = NBAω sin ωt.","CEM 13.2","PH-28.1.A PH-12.4.C",0]]},{"n":3,"title":"Induced currents and magnetic forces","los":[["PH-28.3.A",1126,"Solve for the velocity of a rod on rails slowed or driven by its induced current.","Retarding force B²L²v/R ⇒ m dv/dt = −(B²L²/R)v, exponential decay; with a driving force it reaches a terminal speed.","CEM 13.3","PH-28.2.A PH-12.4.D PH-17.9.A",0]]},{"n":4,"title":"Inductance","los":[["PH-28.4.A",1127,"Calculate the self-inductance of a solenoid, the emf across an inductor and its stored energy.","ε_L = −L dI/dt; solenoid L = μ₀N²A/ℓ; U = ½LI².","CEM 13.4","PH-28.2.A PH-27.4.A",0]]},{"n":5,"title":"LR circuits","los":[["PH-28.5.A",1128,"Derive and solve the current in an LR circuit after a switch closes or opens.","ε − IR − L dI/dt = 0 ⇒ I = (ε/R)(1 − e^(−t/τ)), τ = L/R; an inductor resists sudden change in current.","CEM 13.5","PH-28.4.A PH-26.8.A",1]]},{"n":6,"title":"LC circuits","los":[["PH-28.6.A",1129,"Show that an LC circuit oscillates and find its frequency and the energy exchange between C and L.","L d²q/dt² + q/C = 0 ⇒ ω = 1/√(LC) — the mass–spring equation with L ↔ m, 1/C ↔ k.","CEM 13.6","PH-28.4.A PH-25.3.B PH-22.1.B",0]]}]}]},{"id":"biology","title":"Biology (AP)","code":"BI","track":"science","requires":["chemistry"],"units":[{"n":1,"title":"Chemistry of Life","scope":"core","topics":[{"n":1,"title":"Structure of water and hydrogen bonding","los":[["BI-1.1.A",1130,"Explain how water's polarity lets it hydrogen-bond to other water molecules and to polar or charged solutes.","O pulls electrons from H, leaving δ− on O and δ+ on each H; each water can H-bond to up to four neighbours.","SYI-1.A","",0],["BI-1.1.B",1131,"Connect cohesion, adhesion, high specific heat, ice floating and solvent power to hydrogen bonding and to a biological consequence.","Cohesion + adhesion drive transpiration pull; high specific heat buffers temperature; open-lattice ice insulates water below.","SYI-1.A","BI-1.1.A",0]]},{"n":2,"title":"Elements of life","los":[["BI-1.2.A",1132,"Identify which elements each macromolecule class contains and where C, N, P and S enter biological molecules.","C, H, O in all four classes; N in proteins and nucleic acids; P in nucleic acids and phospholipids; S in cysteine and methionine.","ENE-1.A","",0],["BI-1.2.B",1133,"Predict which macromolecule class picks up a ³⁵S, ³²P or ¹⁵N label.","³⁵S marks protein only; ³²P marks nucleic acid (and phospholipid); ¹⁵N marks protein and nucleic acid.","ENE-1.A","BI-1.2.A",0]]},{"n":3,"title":"Introduction to biological macromolecules","los":[["BI-1.3.A",1134,"Describe dehydration synthesis and hydrolysis as the reactions that build and break polymers.","Joining monomers releases H₂O; hydrolysis adds H₂O to split them; enzymes catalyse both.","SYI-1.B","",0],["BI-1.3.B",1135,"Count the water molecules released or consumed when n monomers are joined into, or cut out of, a linear polymer.","A linear chain of n monomers has n − 1 linkages, so n − 1 waters.","SYI-1.B","BI-1.3.A",0]]},{"n":4,"title":"Properties of biological macromolecules","los":[["BI-1.4.A",1136,"Name the monomer and linking bond of carbohydrates, proteins, nucleic acids and triglycerides.","Monosaccharide–glycosidic; amino acid–peptide; nucleotide–phosphodiester; glycerol + fatty acids–ester.","SYI-1.B","BI-1.3.A",0],["BI-1.4.B",1137,"Classify an amino acid side chain as nonpolar, polar or charged and predict where it sits in a folded soluble protein.","Nonpolar R groups bury in the core; polar and charged ones face water.","SYI-1.B","BI-1.4.A BI-1.1.A",0],["BI-1.4.C",1138,"Distinguish saturated fats, unsaturated fats, phospholipids and steroids by structure and physical property.","cis double bonds kink tails so fats stay liquid; phospholipids are amphipathic; steroids are four fused rings.","SYI-1.B","",0],["BI-1.4.D",1139,"Tell structural from storage polysaccharides by linkage and branching.","Cellulose β(1→4) straight chains H-bond into fibres; starch and glycogen α(1→4) with α(1→6) branches are compact and easy to hydrolyse.","SYI-1.B","",0]]},{"n":5,"title":"Structure and function of biological macromolecules","los":[["BI-1.5.A",1140,"Describe the four levels of protein structure and the interactions that hold each.","1°: peptide bonds; 2°: backbone H-bonds (α helix, β sheet); 3°: R-group interactions incl. disulfides; 4°: multiple subunits.","SYI-1.C","BI-1.4.B",0],["BI-1.5.B",1141,"Predict how substituting one monomer changes a polymer's structure and function.","Swapping a charged for a nonpolar residue (Glu→Val in hemoglobin) can change folding, binding and aggregation.","SYI-1.C","BI-1.5.A",0],["BI-1.5.C",1142,"Identify the directionality of proteins (N→C) and nucleic acids (5′→3′) and why polymers grow at one end only.","New nucleotides add to the 3′-OH; new amino acids add to the C-terminus.","SYI-1.C","",0]]},{"n":6,"title":"Nucleic acids","los":[["BI-1.6.A",1143,"Compare DNA and RNA by sugar, bases and strandedness.","DNA: deoxyribose, T, double-stranded; RNA: ribose (2′-OH), U, usually single-stranded.","IST-1.A","BI-1.4.A",0],["BI-1.6.B",1144,"Write the complementary antiparallel strand of a DNA sequence and compute base percentages from Chargaff's rules.","A pairs T (2 H-bonds), G pairs C (3); %A = %T, %G = %C, strands run 5′→3′ opposite ways.","IST-1.A","BI-1.6.A BI-1.5.C",0]]}]},{"n":2,"title":"Cell Structure and Function","scope":"core","topics":[{"n":1,"title":"Cell structure: subcellular components","los":[["BI-2.1.A",1145,"Describe ribosome composition and explain why ribosomes in every cell point to common ancestry.","Ribosomes are rRNA + protein, not membrane-bound, and make protein in all three domains.","SYI-1.D","",0],["BI-2.1.B",1146,"Match the rough ER, smooth ER, Golgi, mitochondrion, lysosome, vacuole and chloroplast to their functions.","RER: secreted/membrane proteins; SER: lipids, detox, Ca²⁺ storage; Golgi: modify and sort; lysosome: hydrolytic digestion.","SYI-1.D","BI-2.1.A",0]]},{"n":2,"title":"Cell structure and function","los":[["BI-2.2.A",1147,"Trace a secreted protein from ribosome through the endomembrane system to the cell surface.","Signal peptide → RER lumen → transport vesicle → Golgi (cis→trans) → secretory vesicle → exocytosis.","SYI-1.E","BI-2.1.B",0],["BI-2.2.B",1148,"Explain how an organelle's structure supports its function.","Lysosomal pH ~5 suits its acid hydrolases; a central vacuole stores water and gives turgor; cristae add membrane area.","SYI-1.E","BI-2.1.B",0],["BI-2.2.C",1149,"Relate the folded inner mitochondrial membrane and stacked thylakoids to capturing and storing energy.","More membrane area holds more electron-transport chains and ATP synthases.","SYI-1.F","BI-2.2.B",0]]},{"n":3,"title":"Cell size","los":[["BI-2.3.A",1150,"Calculate the surface-area-to-volume ratio of a cube, sphere or cylinder and compare cells of different sizes.","Cube: SA/V = 6/s; sphere: 3/r — the ratio falls as size grows.","ENE-1.B","",0],["BI-2.3.B",1151,"Explain why falling SA/V limits cell size and changes heat and material exchange in larger organisms.","Volume (demand) grows as length³, surface (supply) as length².","ENE-1.B","BI-2.3.A",0],["BI-2.3.C",1152,"Identify structures that raise surface area for exchange and explain the gain.","Microvilli, root hairs, alveoli, intestinal villi and gill lamellae fold surface without adding much volume.","ENE-1.C","BI-2.3.B",0]]},{"n":4,"title":"Plasma membranes","los":[["BI-2.4.A",1153,"Explain how amphipathic phospholipids self-assemble into a bilayer and what embedded proteins add.","Hydrophilic heads face water, hydrophobic tails face each other; proteins transport, receive signals, anchor and recognise.","ENE-2.A","BI-1.4.C",0],["BI-2.4.B",1154,"Describe the fluid mosaic model and predict how temperature, unsaturation and cholesterol change fluidity.","Unsaturated tails and higher temperature raise fluidity; cholesterol buffers it both ways.","ENE-2.B","BI-2.4.A",0]]},{"n":5,"title":"Membrane permeability","los":[["BI-2.5.A",1155,"Predict whether a molecule crosses a bare bilayer from its size, polarity and charge.","Small nonpolar molecules (O₂, CO₂) pass freely; ions and large polar molecules need proteins; water crosses slowly without aquaporins.","ENE-2.C","BI-2.4.A BI-1.1.A",0],["BI-2.5.B",1156,"Compare cell walls of plants, fungi and bacteria and explain how a wall prevents osmotic lysis.","Plants: cellulose; fungi: chitin; bacteria: peptidoglycan; the wall resists turgor pressure.","ENE-2.D","",0]]},{"n":6,"title":"Membrane transport","los":[["BI-2.6.A",1157,"Distinguish passive from active transport by energy use and gradient direction.","Passive runs down the concentration gradient with no energy; active runs up it and needs ATP or a coupled gradient.","ENE-2.E","BI-2.5.A",0],["BI-2.6.B",1158,"Distinguish phagocytosis, pinocytosis, receptor-mediated endocytosis and exocytosis.","Bulk transport moves large molecules and particles in membrane vesicles and costs energy.","ENE-2.F","BI-2.2.A",0]]},{"n":7,"title":"Facilitated diffusion","los":[["BI-2.7.A",1159,"Explain how channel and carrier proteins move polar or charged substances down their gradients.","Aquaporins pass water, gated ion channels pass specific ions; no energy is spent.","ENE-2.G","BI-2.6.A",0],["BI-2.7.B",1160,"Tell simple from carrier-mediated diffusion on a rate-versus-concentration graph.","Simple diffusion rises linearly; protein-mediated transport saturates when all carriers are busy.","ENE-2.G","BI-2.7.A",0]]},{"n":8,"title":"Tonicity and osmoregulation","los":[["BI-2.8.A",1161,"Predict net water movement and the fate of animal and plant cells in hypotonic, isotonic and hypertonic solutions.","Water moves toward higher solute concentration; animal cells lyse or crenate, plant cells go turgid or plasmolyse.","ENE-2.H","BI-2.6.A",0],["BI-2.8.B",1162,"Calculate solute potential ψs = −iCRT and water potential ψ = ψs + ψp, and predict which way water moves.","R = 0.0831 L·bar/(mol·K), T in kelvin; water flows from higher to lower ψ.","ENE-2.H","BI-2.8.A",0],["BI-2.8.C",1163,"Explain how contractile vacuoles, turgor and kidneys keep an organism's water balance.","Freshwater protists pump water out; plants rely on turgor; animals adjust solute excretion.","ENE-2.I","BI-2.8.A",0]]},{"n":9,"title":"Mechanisms of transport","los":[["BI-2.9.A",1164,"Explain how the Na⁺/K⁺-ATPase builds ion gradients and a membrane potential.","Each ATP moves 3 Na⁺ out and 2 K⁺ in, leaving the inside negative.","ENE-2.J","BI-2.6.A",0],["BI-2.9.B",1165,"Explain cotransport as transport driven by an existing ion gradient.","The Na⁺–glucose symporter lets Na⁺ flow down its gradient and carries glucose
